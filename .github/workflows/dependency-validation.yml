name: Dependency validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 and Chrome validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      npm_config_yes: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run build
      - name: Install the Puppeteer Chrome version
        run: npx --no-install puppeteer browsers install chrome
      - name: Exercise generator validation and preview capture
        run: npx --yes tsx --test scripts/ci/puppeteer-smoke.mjs
