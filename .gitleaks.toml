# Repository exceptions for the secret scan. See docs/secret-scanning.md.
#
# These allow exact values, not commits. A .gitleaksignore fingerprint includes
# the commit SHA, so it stops matching when a squash merge or rebase rewrites the
# commit. A value allowed here stays allowed wherever the same text appears, and
# any other value on the same line is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Generated demo: keyboard-event expression after e.key, not a secret; reviewed in https://github.com/with-logic/model-arena/pull/51, 2026-11-14"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['^big=e\.shiftKey$']

[[allowlists]]
description = "Generated demo: browser localStorage entry name, not a credential; reviewed in https://github.com/with-logic/model-arena/pull/51, 2026-11-14"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['^ludus-romanus-ttt-v1$']

[[allowlists]]
description = "Generated demo: public character alphabet for mock keys, not a credential; reviewed in https://github.com/with-logic/model-arena/pull/51, 2026-11-14"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['^abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789$']
