function updateNav(){const nav=[['overview','overview','Overview'],['people','people','People'],['matrix','matrix','Skills matrix'],['development','growth','Development']];$('mainNav').innerHTML=nav.map(([id,ico,label])=>`<button class="nav-item ${view===id?'active':''}" data-action="navigate" data-view="${id}" ${view===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${id==='development'&&store.plans.filter(p=>p.progress<100).length?`<span class="nav-count">${store.plans.filter(p=>p.progress<100).length}</span>`:''}</button>`).join('');$('utilityNav').innerHTML=`<button class="nav-item ${view==='reports'?'active':''}" data-action="navigate" data-view="reports" ${view==='reports'?'aria-current="page"':''}>${icon('reports')}<span>Reports</span></button><button class="nav-item" data-action="settings">${icon('settings')}<span>Settings</span></button>`;$('workspaceName').textContent=store.workspace;$('breadcrumbCurrent').textContent={matrix:'Skills matrix',overview:'Overview',people:'People',development:'Development',reports:'Reports'}[view]}
function heading(){const titles={matrix:['Employee skills matrix','A clearer picture of your team’s strengths and opportunities.'],overview:['Good people. Growing together.','Your people, their strengths, and what’s possible next.'],people:['Your people','Get to know the people behind your team’s capabilities.'],development:['Room to grow','Small steps today. Stronger capabilities tomorrow.'],reports:['People insights, ready to share','Bring your team’s capabilities into the next conversation.']};let [title,desc]=titles[view];return `<div class="page-heading"><div><div class="title-line"><h1>${title}</h1></div><p class="subtitle">${desc}</p></div><div class="heading-actions">${view==='matrix'||view==='overview'?`<button class="btn export-main" data-action="export">${icon('download')}Export</button>`:''}${view==='development'?`<button class="btn btn-primary" data-action="add-plan">${icon('plus')}Create plan</button>`:view!=='reports'?`<button class="btn btn-primary" data-action="add-employee">${icon('plus')}Add employee</button>`:''}</div></div>`}
function statsHTML(){return `<section class="stats" aria-label="Team skills summary"><div class="stat-card"><div class="stat-top"><span>Total employees</span><span class="stat-icon">${icon('people',15)}</span></div><div class="stat-value-line"><span class="stat-value">${store.employees.length}</span></div><div class="stat-sub">Across ${departments().length} departments</div></div><div class="stat-card"><div class="stat-top"><span>Skills tracked</span><span class="stat-icon">${icon('matrix',14)}</span></div><div class="stat-value-line"><span class="stat-value">${store.skills.length}</span></div><div class="stat-sub">In ${categories().length} skill categories</div></div><div class="stat-card"><div class="stat-top"><span>Team skill coverage</span><span class="stat-icon">${icon('coverage',15)}</span></div><div class="stat-value-line"><span class="stat-value">${allCoverage()}<span class="unit">%</span></span><span class="stat-trend">Target ${store.target}%</span></div><div class="stat-sub">Proficient level or above</div><div class="stat-coverage-visual" aria-hidden="true"><span style="height:35%"></span><span style="height:49%"></span><span style="height:59%"></span><span style="height:78%"></span><span style="height:${Math.max(10,allCoverage())}%"></span></div></div><button class="stat-card gaps" data-action="show-gaps" aria-label="View ${gaps().length} skills with coverage gaps"><div class="stat-top"><span>Skills with gaps</span><span class="stat-icon">${icon('gap',15)}</span></div><div class="stat-value-line"><span class="stat-value">${gaps().length}</span></div><div class="stat-sub">${!store.employees.length||!store.skills.length?'Add people and skills to begin':gaps().length?'Explore growth opportunities':'Your team has strong coverage'} ${icon('arrow',12)}</div></button></section>`}
function matrixTabs(){return `<div class="view-tabs"><div class="tabs-left" role="tablist" aria-label="Skills views"><button class="tab ${matrixTab==='matrix'?'active':''}" role="tab" aria-selected="${matrixTab==='matrix'}" data-action="tab" data-tab="matrix">Matrix view <span class="tab-count">${store.employees.length}</span></button><button class="tab ${matrixTab==='coverage'?'active':''}" role="tab" aria-selected="${matrixTab==='coverage'}" data-action="tab" data-tab="coverage">Skill coverage</button></div><div class="saved-status" title="Changes are saved in this browser">${icon('checkCircle')}<span>${lastSaved||'All changes saved'}</span></div></div>`}
function selectHTML(id,defaultText,options,value){return `<div class="select-wrap"><label class="sr-only" for="${id}">${defaultText}</label><select id="${id}"><option value="">${defaultText}</option>${options.map(o=>`<option value="${e(o)}" ${value===o?'selected':''}>${e(o)}</option>`).join('')}</select>${icon('chevron',12)}</div>`}
function toolbarHTML(){const count=Number(lowCoverage)+Number(unassessed);return `<div class="matrix-toolbar"><div class="filter-controls"><div class="search-box">${icon('search')}<label class="sr-only" for="peopleSearch">Search people or roles</label><input id="peopleSearch" type="search" placeholder="Search people or roles…" value="${e(query)}" autocomplete="off"></div>${selectHTML('departmentFilter','All departments',departments(),department)}${selectHTML('categoryFilter','All skills',categories(),category)}<button class="filter-btn ${count?'is-filtered':''}" data-action="filters" aria-haspopup="dialog">${icon('sliders')}Filters${count?`<span class="filter-number">${count}</span>`:''}</button></div><button class="btn btn-quiet manage-skills" data-action="manage-skills">${icon('settings',14)}Manage skills</button></div>`}
function visibleSkills(){return store.skills.filter(s=>!category||s.category===category)}
function filteredPeople(){const skills=visibleSkills();let list=store.employees.filter(p=>(!query||`${p.name} ${p.role} ${p.department}`.toLowerCase().includes(query.toLowerCase()))&&(!department||p.department===department)&&(!lowCoverage||personCoverage(p,skills)<store.target)&&(!unassessed||skills.some(s=>rating(p,s.id)===0)));if(sortActive)list=list.slice().sort((a,b)=>sortAsc?a.name.localeCompare(b.name):b.name.localeCompare(a.name));return list}
function tableHTML(){const skills=visibleSkills(),list=filteredPeople(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(page,pages);const start=(page-1)*PAGE_SIZE,shown=list.slice(start,start+PAGE_SIZE);let groups=[];skills.forEach(s=>{const previous=groups[groups.length-1];if(previous&&previous.name===s.category)previous.count++;else groups.push({name:s.category,count:1})});const activeFilters=query||department||category||lowCoverage||unassessed;return `${activeFilters?`<div class="active-filter-bar">${icon('filter',12)}${list.length} matching ${list.length===1?'employee':'employees'}${category?` · ${e(category)}`:''}<button data-action="clear-filters">Clear filters</button></div>`:''}${shown.length&&skills.length?`<div class="matrix-scroll"><table class="matrix" aria-label="Employee skill proficiency matrix"><colgroup><col class="employee-col">${skills.map(()=>'<col class="skill-col">').join('')}<col class="coverage-col"></colgroup><thead><tr class="group-head"><th class="employee-col" scope="col">Your team</th>${groups.map(g=>`<th colspan="${g.count}" scope="colgroup">${e(g.name)}</th>`).join('')}<th scope="col">Coverage</th></tr><tr class="skill-labels"><th class="employee-col" scope="col" aria-sort="${sortActive?(sortAsc?'ascending':'descending'):'none'}"><span class="employee-label">Employee <button class="sort-button" data-action="sort" aria-label="Sort employees ${sortActive&&sortAsc?'descending':'ascending'}">${icon('updown',12)}</button></span></th>${skills.map(s=>`<th scope="col" title="${e(s.name)} · ${skillCoverage(s)}% of the team proficient">${e(s.name)}${skillCoverage(s)<60?'<span class="skill-gap-dot" title="Below 60% team coverage"></span>':''}</th>`).join('')}<th scope="col"><span style="display:inline-flex;align-items:center;gap:4px">Overall ${icon('info',11)}</span></th></tr></thead><tbody>${shown.map(p=>`<tr><td class="employee-col"><button class="employee-button" data-action="profile" data-id="${p.id}" aria-label="View ${e(p.name)}’s profile">${avatar(p)}<span><span class="employee-name" style="display:block">${e(p.name)}</span><span class="employee-role" style="display:block">${e(p.role)}</span></span></button></td>${skills.map(s=>{const v=rating(p,s.id);return `<td><button class="level level-${v}" data-action="edit-level" data-person="${p.id}" data-skill="${s.id}" title="${e(p.name)} · ${e(s.name)}: ${LEVELS[v].name}. Click to update." aria-label="${e(p.name)}, ${e(s.name)}: ${LEVELS[v].name}. Edit proficiency." aria-haspopup="dialog">${v||'–'}</button></td>`}).join('')}<td class="coverage-cell"><div class="coverage-percent">${personCoverage(p,skills)}<span>%</span></div><div class="coverage-track"><div class="coverage-fill ${personCoverage(p,skills)<store.target?'low':''}" style="width:${personCoverage(p,skills)}%"></div></div></td></tr>`).join('')}</tbody></table></div>`:emptyHTML(!store.employees.length?'Your team starts here':skills.length?'No people found':'Make room for new skills',!store.employees.length?'Add your first employee to start mapping your team’s strengths.':skills.length?'Try another name or adjust your filters to find your people.':'Add the skills that matter to your team, then start mapping their strengths.',!store.employees.length?'add-employee':skills.length?'clear-filters':'manage-skills',!store.employees.length?'Add employee':skills.length?'Clear filters':'Add skills')}<div class="matrix-footer"><span>Showing ${list.length?start+1:0}–${Math.min(start+PAGE_SIZE,list.length)} of ${list.length} employees</span><div class="page-controls"><span class="page-number">Page ${page} of ${pages}</span><button class="page-arrow" data-action="previous-page" ${page<=1?'disabled':''} aria-label="Previous page">${icon('left',12)}</button><button class="page-arrow" data-action="next-page" ${page>=pages?'disabled':''} aria-label="Next page">${icon('right',12)}</button></div></div>`}
function legendHTML(){return `<div class="legend-row"><div class="legend" aria-label="Proficiency levels"><span class="legend-title">Proficiency levels</span>${LEVELS.map((l,i)=>`<span class="legend-item"><span class="legend-swatch level-${i}">${i||'–'}</span>${l.name}</span>`).join('')}</div><div class="legend-note">${icon('info',12)}Click any level to update</div></div>`}
function emptyHTML(title,desc,action,label){return `<div class="empty-state"><span class="empty-icon">${icon('search',22)}</span><h3>${e(title)}</h3><p>${e(desc)}</p>${action?`<button class="btn btn-sm" data-action="${action}">${e(label)}</button>`:''}</div>`}
function matrixHTML(){return matrixTabs()+(matrixTab==='matrix'?`<section class="matrix-card" aria-label="Team skills matrix">${toolbarHTML()}<div id="tableArea">${tableHTML()}</div></section>${legendHTML()}<div class="bottom-note">${icon('growth',12)}Every skill is a starting point. Every person has room to grow.</div>`:insightsHTML())}
function insightsHTML(){const gapList=gaps().sort((a,b)=>skillCoverage(a)-skillCoverage(b));return `<div class="insights-grid"><section class="panel"><div class="panel-header"><div><h2>Strengths across the team</h2><p>People at proficient or expert level in each skill.</p></div><span class="stat-icon">${icon('coverage',15)}</span></div><div class="panel-body">${store.skills.length?store.skills.map(s=>`<div class="coverage-row ${skillCoverage(s)<60?'is-gap':''}"><span class="skill-name">${e(s.name)}</span><div class="bar-track" role="meter" aria-label="${e(s.name)} coverage" aria-valuenow="${skillCoverage(s)}" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill" style="width:${skillCoverage(s)}%"></div></div><span class="bar-label">${skillCoverage(s)}%</span></div>`).join(''):'<p class="subtitle">Add skills to start understanding your team’s coverage.</p>'}<p class="coverage-desc">Coverage = employees rated 3 or 4 ÷ total employees. Skills below 60% are highlighted as growth opportunities.</p></div></section><section class="panel"><div class="panel-header"><div><h2>A little focus goes a long way</h2><p>Your team’s growth opportunities.</p></div>${icon('growth',20)}</div><div class="panel-body">${gapList.length?gapList.map(s=>`<div class="gap-item"><div class="gap-item-top"><h3>${e(s.name)}</h3><span class="gap-badge">${skillCoverage(s)}% coverage</span></div><p>${store.employees.filter(p=>rating(p,s.id)<3).length} people could use support to build confidence in this skill.</p><button data-action="add-plan" data-skill="${s.id}">Create a development plan ${icon('arrow',12)}</button></div>`).join(''):`<div class="empty-state" style="padding:25px 0"><span class="empty-icon">${icon('checkCircle',23)}</span><h3>Strong skills. Shared strengths.</h3><p>Every tracked skill has at least 60% team coverage. Keep making room for growth.</p></div>`}</div></section></div>`}
function peopleHTML(){let list=store.employees.filter(p=>(!query||`${p.name} ${p.role}`.toLowerCase().includes(query.toLowerCase()))&&(!department||p.department===department));return `<div class="directory-toolbar"><div class="search-box">${icon('search')}<label class="sr-only" for="peopleSearch">Search people or roles</label><input id="peopleSearch" type="search" placeholder="Search people or roles…" value="${e(query)}"></div>${selectHTML('departmentFilter','All departments',departments(),department)}<span class="directory-count">${list.length} people, one team</span></div><div id="directoryResults">${peopleResultsHTML(list)}</div>`}
function peopleResultsHTML(list){return list.length?`<div class="people-grid">${list.map(p=>`<button class="person-card" data-action="profile" data-id="${p.id}" aria-label="View ${e(p.name)}’s profile">${avatar(p)}<span class="icon-button">${icon('arrow',16)}</span><h3>${e(p.name)}</h3><p>${e(p.role)}</p><span class="department-badge">${e(p.department)}</span><span class="person-coverage"><span>Skill coverage</span><strong>${personCoverage(p)}%</strong></span></button>`).join('')}</div>`:emptyHTML('No people found','Try another name or department to find your people.','clear-filters','Clear filters')}
function growthDrawing(size=90){return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M49 88V36M49 66C20 66 15 45 18 25c22 0 34 16 31 41ZM50 47C47 17 66 8 85 11c0 23-12 38-35 36Z" stroke="currentColor" stroke-width="1.4"/><path d="M49 66 31 42M50 47l20-20M35 88h29" stroke="currentColor" stroke-width="1.4"/><path d="M11 75h8M15 71v8M76 66h7M79.5 62.5v7" stroke="currentColor" stroke-width="1.2"/><circle cx="18" cy="10" r="2" fill="currentColor" opacity=".5"/><circle cx="88" cy="86" r="2" fill="currentColor" opacity=".5"/></svg>`}
function dueDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function developmentHTML(){return `<div class="development-banner"><div><h2>Potential looks good on your team.</h2><p>Give every growth opportunity a clear next step. Create focused development plans and celebrate the progress.</p></div>${growthDrawing()}</div>${store.plans.length?`<div class="plan-grid">${store.plans.map(p=>{const person=employeeById(p.employee);return `<article class="plan-card"><div class="plan-card-top"><span class="plan-badge ${p.progress===100?'complete':''}">${p.progress===100?'Completed':'In progress'}</span><span class="plan-meta">${e(skillById(p.skill)?.name||'General growth')}</span></div><h3>${e(p.title)}</h3><div class="plan-person">${person?avatar(person):''}<span>${e(person?.name||'Unassigned')}</span></div><div style="display:flex;justify-content:space-between"><span class="plan-meta">Due ${dueDate(p.due)}</span><span class="plan-meta">${p.progress}%</span></div><div class="plan-progress"><span style="width:${p.progress}%"></span></div><div class="plan-card-footer"><button data-action="update-plan" data-id="${p.id}">${icon('edit',12)}Update progress</button><button class="delete-plan" data-action="delete-plan" data-id="${p.id}" aria-label="Delete ${e(p.title)}">${icon('trash',13)}</button></div></article>`}).join('')}</div>`:emptyHTML('Your next chapter starts here','Create a development plan to help someone take the next step.','add-plan','Create a plan')}`}
function reportsHTML(){return `<div class="report-grid"><section class="report-card"><div class="report-icon">${icon('matrix',29)}</div><div><h2>Employee skills matrix</h2><p>A complete view of every employee and their proficiency across ${store.skills.length} skills. Ready for your spreadsheet.</p><button class="btn" data-action="export">${icon('download',14)}Download CSV</button></div></section><section class="report-card"><div class="report-icon">${icon('reports',29)}</div><div><h2>Team coverage report</h2><p>Skill-by-skill coverage, proficiency counts, and growth opportunities. A useful starting point for your next review.</p><button class="btn" data-action="export-coverage">${icon('download',14)}Download CSV</button></div></section></div><div style="margin-top:22px">${insightsHTML()}</div>`}
function render(){updateNav();$('content').innerHTML=heading()+(view==='matrix'?statsHTML()+matrixHTML():view==='overview'?`<div class="overview-intro"><div><h2>See the strengths. Support the next step.</h2><p>There’s a whole lot of potential in your ${store.employees.length}-person team.<br>Here’s where everyone stands, and where a little support could make a difference.</p></div>${growthDrawing(96)}</div>`+statsHTML()+insightsHTML():view==='people'?peopleHTML():view==='development'?developmentHTML():reportsHTML())}
function updateResults(){if(view==='matrix'&&matrixTab==='matrix'){$('tableArea').innerHTML=tableHTML()}else if(view==='people'){const list=store.employees.filter(p=>(!query||`${p.name} ${p.role}`.toLowerCase().includes(query.toLowerCase()))&&(!department||p.department===department));$('directoryResults').innerHTML=peopleResultsHTML(list);document.querySelector('.directory-count').textContent=`${list.length} people, one team`}}
function navigate(next){view=next;query='';department='';category='';lowCoverage=false;unassessed=false;page=1;closePopover();$('sidebar').classList.remove('open');$('sidebarScrim').classList.remove('open');$('mobileMenu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'})}
function closePopover(){const active=document.querySelector('.is-editing');if(active)active.classList.remove('is-editing');$('popoverRoot').innerHTML='';popoverAnchor=null}
function openPopover(html,anchor,cls='',width=242){closePopover();popoverAnchor=anchor;const root=$('popoverRoot');root.innerHTML=`<div class="popover ${cls}" style="width:${width}px" role="dialog">${html}</div>`;const pop=root.firstElementChild,rect=anchor.getBoundingClientRect();const left=Math.max(10,Math.min(rect.left+(rect.width-width)/2,window.innerWidth-width-10));pop.style.left=left+'px';const height=pop.offsetHeight;pop.style.top=(rect.bottom+8+height>window.innerHeight-12?Math.max(12,rect.top-height-8):rect.bottom+8)+'px';return pop}
function openLevel(button){const p=employeeById(button.dataset.person),s=skillById(button.dataset.skill);if(!p||!s)return;const current=rating(p,s.id);const pop=openPopover(`<h3 class="popover-title">${e(s.name)}</h3><div class="popover-sub">${e(p.name)}</div><div role="radiogroup" aria-label="Proficiency">${LEVELS.map((l,i)=>`<button class="proficiency-option" role="radio" aria-checked="${current===i}" data-action="set-level" data-person="${p.id}" data-skill="${s.id}" data-level="${i}"><span class="level level-${i}">${i||'–'}</span><span><span class="option-name" style="display:block">${l.name}</span><span class="option-description" style="display:block">${l.desc}</span></span>${i===current?icon('check',14):''}</button>`).join('')}</div><div class="popover-foot">${icon('checkCircle',11)}Changes are saved automatically</div>`,button,'level-popover',265);button.classList.add('is-editing');pop.querySelector('[aria-checked="true"]').focus()}
function showModal(html,cls=''){closePopover();lastFocused=document.activeElement;const modal=$('modal');if(modal.open)modal.close();modal.className=cls;modal.innerHTML=html;modal.showModal();setTimeout(()=>{const input=modal.querySelector('[autofocus]');if(input)input.focus()},40)}
function closeModal(){$('modal').close();if(lastFocused?.isConnected)lastFocused.focus()}
function dialogHeader(title,desc=''){return `<div class="dialog-header"><div><h2 id="dialogTitle">${e(title)}</h2>${desc?`<p>${e(desc)}</p>`:''}</div><button type="button" class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close',17)}</button></div>`}
function employeeModal(id){const p=id?employeeById(id):null;const departmentOptions=[...new Set(['Design','Engineering','Product','Marketing','People','Sales','Operations',...departments()])];showModal(`<form id="employeeForm" data-id="${p?.id||''}">${dialogHeader(p?'Edit employee':'Welcome someone new',p?'Keep your people information up to date.':'Great teams start with great people. Add your next teammate.')}<div class="dialog-body">${!p?`<div class="form-preview"><span class="avatar" id="newEmployeeInitials">${icon('people',21)}</span><p><strong>A fresh start, full of potential.</strong><br>You can assess their skills once they’re added.</p></div>`:''}<div class="field"><label for="employeeName">Full name</label><input id="employeeName" name="name" value="${e(p?.name||'')}" placeholder="e.g. Jordan Lee" maxlength="60" required autofocus autocomplete="name"></div><div class="field"><label for="employeeRole">Job title</label><input id="employeeRole" name="role" value="${e(p?.role||'')}" placeholder="e.g. Product Designer" maxlength="70" required></div><div class="field"><label for="employeeDepartment">Department</label><select id="employeeDepartment" name="department" required><option value="" disabled ${!p?'selected':''}>Select a department</option>${departmentOptions.map(d=>`<option ${p?.department===d?'selected':''}>${e(d)}</option>`).join('')}</select></div></div><div class="dialog-footer">${p?`<button type="button" class="danger-link" data-action="delete-employee" data-id="${p.id}">Remove employee</button>`:''}<button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${p?'Save changes':'Add employee'}</button></div></form>`)}
function profileModal(id){const p=employeeById(id);if(!p)return;const assessed=store.skills.filter(s=>rating(p,s.id)>0).length;showModal(`<div class="dialog-header" style="border:0;padding-bottom:5px"><span style="font-size:10px;color:#a0ac94">Employee profile</span><button class="icon-button" data-action="close-modal" aria-label="Close profile">${icon('close',17)}</button></div><div class="dialog-body"><div class="profile-header">${avatar(p,'avatar-lg')}<h2 id="dialogTitle">${e(p.name)}</h2><p>${e(p.role)}</p><span class="department-badge">${e(p.department)}</span></div><div class="profile-stats"><div class="profile-stat"><strong>${personCoverage(p)}%</strong><span>Skill coverage</span></div><div class="profile-stat"><strong>${assessed}<span style="display:inline;font-size:14px"> / ${store.skills.length}</span></strong><span>Skills assessed</span></div></div><div class="profile-skills"><h3>A snapshot of their skills</h3>${store.skills.map(s=>{const v=rating(p,s.id);return `<div class="profile-skill"><span>${e(s.name)}</span><span class="level level-${v}">${v||'–'}</span><span class="profile-skill-label">${LEVELS[v].name}</span></div>`}).join('')}</div><div class="profile-actions"><button class="btn" data-action="edit-employee" data-id="${p.id}">${icon('edit')}Edit profile</button><button class="btn btn-primary" data-action="add-plan" data-person="${p.id}">${icon('growth')}Create plan</button></div></div>`,'drawer')}
function manageSkills(){skillDraft=structuredClone(store.skills);showModal(`<form id="skillsForm">${dialogHeader('Skills that matter to your team','Build a shared language for your team’s strengths.')}<div class="dialog-body"><div style="display:flex;justify-content:space-between;font-size:9px;color:#9aa58e;margin-bottom:12px;padding-right:42px"><span>Skill name</span><span>Category</span></div><div class="skill-edit-list" id="skillEditList"></div><button type="button" class="add-skill-button" data-action="draft-add">${icon('plus',14)}Add a skill</button><p class="coverage-desc">Removing a skill also removes its proficiency ratings. Changes take effect when you save.</p></div><div class="dialog-footer"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Save skills</button></div></form>`,'skills-dialog');renderSkillDraft()}
function renderSkillDraft(){$('skillEditList').innerHTML=skillDraft.map((s,i)=>`<div class="skill-edit-row"><input aria-label="Skill ${i+1} name" value="${e(s.name)}" data-draft-name="${s.id}" placeholder="Skill name" maxlength="45" required><select aria-label="Skill ${i+1} category" data-draft-category="${s.id}">${['Core skills','Functional skills'].map(c=>`<option ${s.category===c?'selected':''}>${c}</option>`).join('')}</select><button type="button" class="icon-button" data-action="draft-remove" data-id="${s.id}" aria-label="Remove ${e(s.name)||'new skill'}">${icon('close',14)}</button></div>`).join('')}
function planModal(skillId='',personId='',planId=''){if(!store.employees.length){toast('Add an employee before creating a development plan.');return}const plan=planId?store.plans.find(p=>p.id===planId):null;showModal(`<form id="planForm" data-id="${plan?.id||''}">${dialogHeader(plan?'Every step counts':'Create a little room to grow',plan?'Update progress and keep the momentum going.':'Give a growth opportunity a clear, achievable next step.')}<div class="dialog-body"><div class="field"><label for="planTitle">Plan name</label><input id="planTitle" name="title" required maxlength="90" value="${e(plan?.title||'')}" placeholder="e.g. Build confidence with data" autofocus></div><div class="field-row"><div class="field"><label for="planEmployee">Employee</label><select id="planEmployee" name="employee">${store.employees.map(p=>`<option value="${p.id}" ${p.id===(plan?.employee||personId)?'selected':''}>${e(p.name)}</option>`).join('')}</select></div><div class="field"><label for="planSkill">Focus skill</label><select id="planSkill" name="skill"><option value="">General growth</option>${store.skills.map(s=>`<option value="${s.id}" ${s.id===(plan?.skill||skillId)?'selected':''}>${e(s.name)}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label for="planDue">Target date</label><input type="date" id="planDue" name="due" value="${plan?.due||'2026-12-18'}" required></div><div class="field"><label for="planProgress">Progress</label><select id="planProgress" name="progress">${[0,10,25,40,50,60,75,90,100].map(n=>`<option value="${n}" ${n===(plan?.progress||0)?'selected':''}>${n}%${n===100?' · Complete':''}</option>`).join('')}</select></div></div></div><div class="dialog-footer"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${plan?'Save progress':'Create plan'}</button></div></form>`)}
function helpModal(){showModal(`${dialogHeader('A shared language for growth','Make your team’s strengths visible, and their next steps clearer.')}<div class="dialog-body">${LEVELS.map((l,i)=>`<div class="help-level"><span class="level level-${i}">${i||'–'}</span><div><h4>${l.name}</h4><p>${l.desc}.</p></div></div>`).join('')}<div class="help-tip"><strong>Make it yours.</strong> Click a proficiency level in the matrix to update it. Add your team’s skills, filter by department, or explore coverage to spot growth opportunities. Your changes are saved in this browser.</div></div><div class="dialog-footer"><button class="btn btn-primary" data-action="close-modal">Got it</button></div>`)}
function settingsModal(){showModal(`<form id="settingsForm">${dialogHeader('Your workspace','A few details to make Gather feel like your team.')}<div class="dialog-body"><div class="field"><label for="settingsWorkspace">Workspace name</label><input id="settingsWorkspace" name="workspace" value="${e(store.workspace)}" maxlength="45" required autofocus></div><div class="field"><label for="settingsTarget">Team coverage target</label><select name="target" id="settingsTarget">${[50,60,70,75,80,85,90,95,100].map(n=>`<option value="${n}" ${Number(store.target)===n?'selected':''}>${n}%</option>`).join('')}</select><small>Employees below this target appear when you filter by coverage.</small></div><div class="settings-note">${icon('lock',13)} Your workspace is saved on this device. Export your matrix whenever you’d like a copy of your data.</div></div><div class="dialog-footer"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Save settings</button></div></form>`)}
function exportCSV(coverage=false){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const headers=coverage?['Skill','Category','Coverage (%)','Not assessed','Beginner','Developing','Proficient','Expert']:['Employee','Job title','Department',...store.skills.map(s=>s.name),'Coverage (%)'];const rows=coverage?store.skills.map(s=>[s.name,s.category,skillCoverage(s),...[0,1,2,3,4].map(n=>store.employees.filter(p=>rating(p,s.id)===n).length)]):store.employees.map(p=>[p.name,p.role,p.department,...store.skills.map(s=>rating(p,s.id)),personCoverage(p)]);const csv='\uFEFF'+[headers,...rows].map(row=>row.map(v=>quote(typeof v==='string'&&/^[=+\-@]/.test(v)?"'"+v:v)).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const link=document.createElement('a');link.href=url;link.download=`gather-${coverage?'skill-coverage':'employee-skills'}-${new Date().toISOString().slice(0,10)}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(coverage?'Team coverage report exported.':'Employee skills matrix exported.')}
$('content').addEventListener('input',event=>{if(event.target.id==='peopleSearch'){query=event.target.value;page=1;updateResults()}});
$('content').addEventListener('change',event=>{if(event.target.id==='departmentFilter'){department=event.target.value;page=1;updateResults()}if(event.target.id==='categoryFilter'){category=event.target.value;page=1;updateResults()}});
$('modal').addEventListener('input',event=>{if(event.target.dataset.draftName){const s=skillDraft.find(s=>s.id===event.target.dataset.draftName);if(s)s.name=event.target.value}if(event.target.id==='employeeName'&&$('newEmployeeInitials'))$('newEmployeeInitials').textContent=event.target.value.trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase()||'+'});
$('modal').addEventListener('change',event=>{if(event.target.dataset.draftCategory){const s=skillDraft.find(s=>s.id===event.target.dataset.draftCategory);if(s)s.category=event.target.value}});
$('modal').addEventListener('submit',event=>{event.preventDefault();const form=event.target;const data=new FormData(form);if(form.id==='employeeForm'){const name=data.get('name').trim(),role=data.get('role').trim();if(!name||!role){toast('Enter a name and job title.');return}const id=form.dataset.id;if(id){const p=employeeById(id);Object.assign(p,{name,role,department:data.get('department')})}else {store.employees.push({id:uid('p'),name,role,department:data.get('department'),ratings:{}});query='';department='';category='';lowCoverage=false;unassessed=false;sortActive=false;page=Math.max(1,Math.ceil(store.employees.length/PAGE_SIZE));if(view==='matrix')matrixTab='matrix'}persist();closeModal();render();toast(id?'Employee profile updated.':`${name} added to your team.`)}else if(form.id==='skillsForm'){if(skillDraft.some(s=>!s.name.trim())){toast('Give each skill a name.');return}const names=skillDraft.map(s=>s.name.trim().toLowerCase());if(new Set(names).size!==names.length){toast('Use a unique name for each skill.');return}const previous=structuredClone(store);store.skills=skillDraft.map(s=>({...s,name:s.name.trim()}));store.employees.forEach(p=>{Object.keys(p.ratings).forEach(id=>{if(!store.skills.some(s=>s.id===id))delete p.ratings[id]})});store.plans.forEach(p=>{if(!skillById(p.skill))p.skill=''});if(category&&!categories().includes(category))category='';persist();closeModal();render();toast('Your team’s skills are up to date.',()=>{store=previous;persist();render()})}else if(form.id==='planForm'){const title=data.get('title').trim();if(!title){toast('Give your development plan a name.');return}const id=form.dataset.id;const values={title,employee:data.get('employee'),skill:data.get('skill'),due:data.get('due'),progress:Number(data.get('progress'))};if(id)Object.assign(store.plans.find(p=>p.id===id),values);else store.plans.push({id:uid('l'),...values});persist();closeModal();if(view!=='development')view='development';render();toast(id?'Progress updated. Keep growing!':'A new opportunity to grow, mapped out.')}else if(form.id==='settingsForm'){const workspace=data.get('workspace').trim();if(!workspace){toast('Enter a workspace name.');return}store.workspace=workspace;store.target=Number(data.get('target'));persist();closeModal();render();toast('Workspace settings saved.')}});
$('modal').addEventListener('click',event=>{if(event.target===$('modal')){const rect=$('modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal()}});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button){if(!event.target.closest('.popover'))closePopover();return}const action=button.dataset.action;const keep=['edit-level','filters','notifications','account'];if(!keep.includes(action)&&!event.target.closest('.popover'))closePopover();switch(action){
case'navigate':navigate(button.dataset.view);break;
case'tab':matrixTab=button.dataset.tab;render();break;
case'add-employee':employeeModal();break;
case'edit-employee':employeeModal(button.dataset.id);break;
case'profile':profileModal(button.dataset.id);break;
case'close-modal':closeModal();break;
case'manage-skills':manageSkills();break;
case'export':exportCSV();break;
case'export-coverage':exportCSV(true);break;
case'help':helpModal();break;
case'settings':settingsModal();break;
case'show-gaps':view='matrix';matrixTab='coverage';render();break;
case'edit-level':openLevel(button);break;
case'set-level':{const p=employeeById(button.dataset.person),s=skillById(button.dataset.skill);if(!p||!s)break;const before=rating(p,s.id);const level=Number(button.dataset.level);p.ratings[s.id]=level;persist();closePopover();const scroll=document.querySelector('.matrix-scroll')?.scrollLeft||0;render();const scroller=document.querySelector('.matrix-scroll');if(scroller)scroller.scrollLeft=scroll;document.querySelector(`[data-action="edit-level"][data-person="${p.id}"][data-skill="${s.id}"]`)?.focus({preventScroll:true});toast(`${s.name} updated for ${p.name.split(' ')[0]}.`,()=>{p.ratings[s.id]=before;persist();render()});break}
case'clear-filters':query='';department='';category='';lowCoverage=false;unassessed=false;page=1;render();break;
case'sort':sortAsc=sortActive?!sortAsc:true;sortActive=true;page=1;updateResults();break;
case'previous-page':page=Math.max(1,page-1);updateResults();break;
case'next-page':page++;updateResults();break;
case'filters':{if(popoverAnchor===button){closePopover();break}openPopover(`<h3>Fine-tune your view</h3><label for="coverageFilter">Employee coverage</label><select id="coverageFilter"><option value="all">All coverage levels</option><option value="below" ${lowCoverage?'selected':''}>Below ${store.target}% target</option></select><label class="checkbox-row"><input type="checkbox" id="unassessedFilter" ${unassessed?'checked':''}><span>Only people with unassessed skills</span></label><div class="filter-actions"><button class="btn btn-sm btn-quiet" data-action="reset-extra-filters">Reset</button><button class="btn btn-sm btn-primary" data-action="apply-filters">Apply filters</button></div>`,button,'filter-popover',267);break}
case'apply-filters':lowCoverage=$('coverageFilter').value==='below';unassessed=$('unassessedFilter').checked;page=1;closePopover();render();break;
case'reset-extra-filters':lowCoverage=false;unassessed=false;page=1;closePopover();render();break;
case'draft-add':skillDraft.push({id:uid('s'),name:'',category:'Functional skills'});renderSkillDraft();$('skillEditList').lastElementChild.querySelector('input').focus();break;
case'draft-remove':skillDraft=skillDraft.filter(s=>s.id!==button.dataset.id);renderSkillDraft();break;
case'delete-employee':{const previous=structuredClone(store);const p=employeeById(button.dataset.id);store.employees=store.employees.filter(p=>p.id!==button.dataset.id);store.plans=store.plans.filter(plan=>plan.employee!==button.dataset.id);persist();closeModal();render();toast(`${p.name} removed from your team.`,()=>{store=previous;persist();render()});break}
case'add-plan':planModal(button.dataset.skill||'',button.dataset.person||'');break;
case'update-plan':planModal('','',button.dataset.id);break;
case'delete-plan':{const previous=structuredClone(store.plans);store.plans=store.plans.filter(p=>p.id!==button.dataset.id);persist();render();toast('Development plan removed.',()=>{store.plans=previous;persist();render()});break}
case'notifications':{if(popoverAnchor===button){closePopover();break}openPopover(`<h3 class="popover-title">A little nudge</h3><div class="popover-sub">Your team’s growth, on your radar.</div><div class="notification-item"><span class="stat-icon">${icon('growth',15)}</span><p><strong>${store.plans.filter(p=>p.progress<100).length} development plans in progress.</strong><br>Every step makes a difference.<time>Q4 review cycle</time></p></div><div class="notification-item"><span class="stat-icon">${icon('matrix',14)}</span><p><strong>${gaps().length} skills could use a little support.</strong><br>Explore your team’s coverage to find the next opportunity.</p></div><button class="popover-menu-item" data-action="navigate" data-view="development">View development plans ${icon('arrow',13)}</button>`,button,'',295);break}
case'account':{if(popoverAnchor===button){closePopover();break}openPopover(`<h3 class="popover-title">Alex Morgan</h3><div class="popover-sub">HR manager · ${e(store.workspace)}</div><button class="popover-menu-item" data-action="settings">${icon('settings')}Workspace settings</button><button class="popover-menu-item" data-action="help">${icon('help')}A guide to Gather</button><div class="popover-foot">${icon('lock',11)}Your people data stays on this device.</div>`,button,'',250);break}
case'undo':if(toastUndo){const undo=toastUndo;toastUndo=null;undo();toast('Change undone.')}break;
}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const anchor=popoverAnchor;closePopover();if(anchor?.isConnected)anchor.focus({preventScroll:true})}if((event.key==='ArrowDown'||event.key==='ArrowUp')&&event.target.closest('.proficiency-option')){event.preventDefault();const buttons=[...document.querySelectorAll('.proficiency-option')];let index=buttons.indexOf(event.target.closest('.proficiency-option'));buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus()}});
window.addEventListener('resize',closePopover);document.addEventListener('scroll',event=>{if(!event.target.closest?.('.popover'))closePopover()},true);
$('mobileMenu').innerHTML=icon('menu',20);$('mobileMenu').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('sidebarScrim').classList.toggle('open',open);$('mobileMenu').setAttribute('aria-expanded',String(open))});$('sidebarScrim').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('sidebarScrim').classList.remove('open');$('mobileMenu').setAttribute('aria-expanded','false')});
$('homeIcon').innerHTML=icon('home',13);$('helpTop').innerHTML=icon('help',18);$('notificationsButton').innerHTML=icon('bell',18)+'<span class="notification-dot"></span>';$('accountAvatar').innerHTML=avatar({name:'Alex Morgan',photo:5});$('accountChevron').innerHTML=icon('chevron',12);$('workspaceIcon').innerHTML=icon('updown',12);$('growthArrow').innerHTML=icon('arrow',12);
render();
</script>
</body>
</html>
