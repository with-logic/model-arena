<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice Drills</title>
<meta name="description" content="Timed math quizzes with difficulty settings and a score tracker. Improve speed and accuracy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2;
    --bg-glow-1: rgba(99, 102, 241, 0.10);
    --bg-glow-2: rgba(16, 185, 129, 0.08);
    --card: #ffffff;
    --ink: #16151a;
    --muted: #6d6b74;
    --faint: #a3a1ab;
    --line: #e7e5de;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.08);
    --good: #059669;
    --good-soft: rgba(5, 150, 105, 0.10);
    --bad: #e11d48;
    --bad-soft: rgba(225, 29, 72, 0.09);
    --warn: #d97706;
    --shadow: 0 1px 2px rgba(22, 21, 26, 0.05), 0 8px 24px -12px rgba(22, 21, 26, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e12;
      --bg-glow-1: rgba(129, 140, 248, 0.10);
      --bg-glow-2: rgba(16, 185, 129, 0.07);
      --card: #17171d;
      --ink: #f1f0ec;
      --muted: #9b99a4;
      --faint: #6b6974;
      --line: #292931;
      --accent: #818cf8;
      --accent-soft: rgba(129, 140, 248, 0.13);
      --good: #34d399;
      --good-soft: rgba(52, 211, 153, 0.13);
      --bad: #fb7185;
      --bad-soft: rgba(251, 113, 133, 0.13);
      --warn: #fbbf24;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -12px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(1rem, 4vw, 2.5rem);
    font-feature-settings: 'tnum' 1, 'cv02' 1;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    width: 55vmax; height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: -1;
  }
  body::before { background: var(--bg-glow-1); top: -25vmax; right: -15vmax; }
  body::after  { background: var(--bg-glow-2); bottom: -28vmax; left: -18vmax; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: inherit; }

  .app { width: min(660px, 100%); }
  .hidden { display: none !important; }

  .view { animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.99); } to { opacity: 1; transform: none; } }

  /* ---------- Start screen ---------- */
  .brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.25rem; }
  .brand-mark {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    width: 64px; height: 64px; flex: none;
  }
  .brand-mark span {
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    font-weight: 800; font-size: 1.15rem; color: var(--accent);
    box-shadow: var(--shadow);
  }
  .brand-mark span:nth-child(2) { color: var(--good); }
  .brand-mark span:nth-child(3) { color: var(--warn); }
  .brand-mark span:nth-child(4) { color: var(--bad); }
  h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); font-weight: 800; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 0.95rem; margin-top: 0.2rem; }

  .group { margin-bottom: 1.5rem; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.6rem; }
  .group-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); }
  .group-note { font-size: 0.82rem; color: var(--muted); }

  .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  @media (max-width: 480px) { .diffs { grid-template-columns: 1fr; } }
  .diff {
    text-align: left;
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 0.9rem 1rem;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    box-shadow: var(--shadow);
  }
  .diff:hover { transform: translateY(-1px); }
  .diff .d-name { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; justify-content: space-between; }
  .diff .d-time { font-size: 0.75rem; font-weight: 600; color: var(--faint); }
  .diff .d-desc { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.35; }
  .diff[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .diff[aria-pressed="true"] .d-time { color: var(--accent); }

  .chips { display: flex; gap: 0.5rem; }
  .chip {
    padding: 0.55rem 1.2rem; border-radius: 999px;
    background: var(--card); border: 2px solid var(--line);
    font-weight: 700; font-size: 0.95rem;
    transition: border-color 0.15s, background 0.15s;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .best-line {
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 0.75rem 1rem; margin-bottom: 1.5rem;
    font-size: 0.88rem; color: var(--muted);
  }
  .best-line b { color: var(--ink); font-weight: 700; }

  .btn-primary {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em;
    padding: 1.05rem; border-radius: 999px;
    box-shadow: 0 10px 24px -10px var(--accent), var(--shadow);
    transition: transform 0.12s, filter 0.15s;
  }
  .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn-primary:active { transform: translateY(0) scale(0.99); }

  .hint { text-align: center; color: var(--faint); font-size: 0.82rem; margin-top: 0.9rem; }

  /* ---------- Quiz screen ---------- */
  .qbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.7rem; }
  .ghost { color: var(--muted); font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.6rem; border-radius: 10px; }
  .ghost:hover { color: var(--ink); background: var(--accent-soft); }
  .qmeta { font-weight: 700; font-size: 0.95rem; color: var(--muted); }
  .qmeta .dot { margin: 0 0.4rem; color: var(--faint); }
  .qright { display: flex; align-items: center; gap: 0.4rem; }
  .streak {
    display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px;
    font-weight: 800; font-size: 0.95rem; color: var(--warn);
    opacity: 0; transform: scale(0.7); transition: opacity 0.2s, transform 0.2s;
    min-width: 3.2em; text-align: right;
  }
  .streak svg { flex: none; }
  .streak.on { opacity: 1; transform: scale(1); }
  .icon { font-size: 1.1rem; padding: 0.35rem 0.5rem; display: inline-flex; align-items: center; }

  .track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  #timer-bar {
    height: 100%; width: 100%; border-radius: 999px;
    background: var(--accent);
  }
  #timer-bar.warn { background: var(--warn); }
  #timer-bar.danger { background: var(--bad); animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.55; } }

  .segs { display: flex; gap: 4px; margin-top: 0.6rem; }
  .segs i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); transition: background 0.25s; }
  .segs i.active { background: var(--accent); }
  .segs i.ok { background: var(--good); }
  .segs i.bad { background: var(--bad); }

  .qstage { position: relative; text-align: center; padding: clamp(1.2rem, 5vw, 2.2rem) 0 0.5rem; }
  .question {
    font-size: clamp(3rem, 13vw, 5.25rem);
    font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;
    min-height: 1.15em;
  }

  .answer-box {
    margin: 1.4rem auto 0;
    width: min(300px, 86%);
    height: 88px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 2.5px solid var(--line);
    border-radius: 22px;
    font-size: 2.6rem; font-weight: 800;
    box-shadow: var(--shadow);
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .answer-box .placeholder { color: var(--faint); font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; }
  .answer-box #caret {
    display: inline-block; width: 3px; height: 1.1em; margin-left: 3px;
    background: var(--accent); border-radius: 2px;
    animation: blink 1s step-end infinite;
    opacity: 0;
  }
  .answer-box.typing #caret { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }
  .answer-box.ok { border-color: var(--good); background: var(--good-soft); animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
  .answer-box.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake 0.4s; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  @keyframes shake {
    20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
  }

  .feedback {
    height: 1.7rem; margin-top: 0.7rem;
    font-size: 1.05rem; font-weight: 700; color: var(--muted);
  }
  .feedback.ok { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .float-pts {
    position: absolute; left: 50%; top: 38%;
    transform: translateX(-50%);
    font-size: 1.6rem; font-weight: 900; color: var(--good);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
    25%  { opacity: 1; transform: translate(-50%, -8px) scale(1.05); }
    to   { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem;
    max-width: 340px; margin: 1.3rem auto 0;
  }
  .keypad.frozen { pointer-events: none; }
  .key {
    height: 58px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 1.45rem; font-weight: 700;
    box-shadow: var(--shadow);
    transition: transform 0.08s, background 0.12s;
    user-select: none; -webkit-user-select: none;
  }
  .key:hover { background: var(--accent-soft); }
  .key:active { transform: scale(0.94); }
  .key.util { color: var(--muted); font-size: 1.25rem; }
  .key.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .key.go:hover { filter: brightness(1.08); background: var(--accent); }

  /* ---------- Results screen ---------- */
  .results-head { text-align: center; margin-bottom: 1.6rem; }
  .newbest {
    display: inline-block; margin-bottom: 0.7rem;
    background: var(--warn); color: #fff;
    font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em;
    padding: 0.4rem 0.9rem; border-radius: 999px;
    animation: pop2 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.5) 0.3s both;
  }
  @keyframes pop2 { from { transform: scale(0); } 60% { transform: scale(1.15); } to { transform: scale(1); } }
  .verdict { font-size: clamp(1.6rem, 6vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
  .verdict-sub { color: var(--muted); margin-top: 0.25rem; font-size: 0.95rem; }
  .score-wrap { text-align: center; margin-bottom: 1.5rem; }
  .score-big { font-size: clamp(4rem, 17vw, 6rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: var(--accent); }
  .score-label { display: block; color: var(--faint); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 0.35rem; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-bottom: 1.4rem; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 0.85rem 0.6rem; text-align: center; box-shadow: var(--shadow);
  }
  .stat .v { font-size: 1.35rem; font-weight: 800; }
  .stat .k { font-size: 0.72rem; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.2rem; }

  .review { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; margin-bottom: 1.6rem; }
  .rev {
    font-size: 0.85rem; font-weight: 600;
    padding: 0.4rem 0.75rem; border-radius: 999px;
  }
  .rev.ok { background: var(--good-soft); color: var(--good); }
  .rev.bad { background: var(--bad-soft); color: var(--bad); }
  .rev b { font-weight: 800; }

  .actions { display: flex; gap: 0.7rem; }
  .actions .btn-primary { width: auto; flex: 1; font-size: 1.05rem; padding: 0.95rem 1.5rem; }
  .btn-ghost {
    background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    font-weight: 700; font-size: 1.05rem; padding: 0.95rem 1.5rem; color: var(--muted);
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="app">

  <!-- ============ START ============ -->
  <section id="view-start" class="view">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span>+</span><span>−</span><span>×</span><span>÷</span></div>
      <div>
        <h1>Math Practice Drills</h1>
        <p class="tagline">Sharpen speed and accuracy, one problem at a time.</p>
      </div>
    </div>

    <div class="group">
      <div class="group-head">
        <span class="group-label">Difficulty</span>
        <span class="group-note" id="per-note"></span>
      </div>
      <div class="diffs" id="diffs" role="radiogroup" aria-label="Difficulty">
        <button class="diff" data-diff="easy" role="radio">
          <span class="d-name">Easy <span class="d-time"></span></span>
          <span class="d-desc">Add &amp; subtract, small numbers</span>
        </button>
        <button class="diff" data-diff="medium" role="radio">
          <span class="d-name">Medium <span class="d-time"></span></span>
          <span class="d-desc">Add, subtract &amp; times tables</span>
        </button>
        <button class="diff" data-diff="hard" role="radio">
          <span class="d-name">Hard <span class="d-time"></span></span>
          <span class="d-desc">All four ops &amp; mixed expressions</span>
        </button>
      </div>
    </div>

    <div class="group">
      <div class="group-head"><span class="group-label">Problems per drill</span></div>
      <div class="chips" id="counts" role="radiogroup" aria-label="Problems per drill">
        <button class="chip" data-count="10" role="radio">10</button>
        <button class="chip" data-count="15" role="radio">15</button>
        <button class="chip" data-count="20" role="radio">20</button>
      </div>
    </div>

    <div class="best-line" id="best-line"></div>

    <button class="btn-primary" id="btn-start">Start drill</button>
    <p class="hint">Type digits with your keyboard or tap the keypad · Enter to submit</p>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="view-quiz" class="view hidden">
    <header class="qbar">
      <button id="btn-quit" class="ghost">← Quit</button>
      <div class="qmeta"><span id="q-progress">1 / 10</span><span class="dot">·</span><span id="q-time">0:00</span></div>
      <div class="qright">
        <span id="q-streak" class="streak" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c0 3-.6 6-2.2 8.2C8.6 8.6 9 6.8 9 6.8 7.2 8.6 6 10.9 6 13.4 6 17.6 9.1 21 12.6 21c3.3 0 6-2.7 6-6.4 0-4.6-3.6-8.4-6.6-12.6z"/></svg><span id="q-streak-n">0</span></span>
        <button id="btn-sound" class="ghost icon" aria-label="Toggle sound" title="Toggle sound">
          <svg id="ico-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.2 9.2 0 0 1 0 13"/></svg>
          <svg id="ico-sound-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
        </button>
      </div>
    </header>

    <div class="track" role="timer" aria-label="Time remaining"><div id="timer-bar"></div></div>
    <div class="segs" id="segs" aria-hidden="true"></div>

    <div class="qstage">
      <div id="question" class="question">…</div>
      <div id="answer-box" class="answer-box">
        <span id="answer-text"></span><span id="caret"></span>
        <span class="placeholder" id="answer-placeholder">answer</span>
      </div>
      <div id="feedback" class="feedback" aria-live="polite">&nbsp;</div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key util" data-key="del" aria-label="Delete">⌫</button>
      <button class="key" data-key="0">0</button>
      <button class="key go" data-key="enter" aria-label="Submit answer">⏎</button>
    </div>
  </section>

  <!-- ============ RESULTS ============ -->
  <section id="view-results" class="view hidden">
    <div class="results-head">
      <div id="newbest" class="newbest hidden">★ NEW PERSONAL BEST</div>
      <h2 id="verdict" class="verdict">Nice work.</h2>
      <p id="verdict-sub" class="verdict-sub"></p>
    </div>

    <div class="score-wrap">
      <span id="final-score" class="score-big">0</span>
      <span class="score-label">points</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="st-acc">—</div><div class="k">Accuracy</div></div>
      <div class="stat"><div class="v" id="st-avg">—</div><div class="k">Avg time</div></div>
      <div class="stat"><div class="v" id="st-fast">—</div><div class="k">Fastest</div></div>
      <div class="stat"><div class="v" id="st-streak">—</div><div class="k">Best streak</div></div>
    </div>

    <div class="review" id="review"></div>

    <div class="actions">
      <button id="btn-again" class="btn-primary">Run it again</button>
      <button id="btn-home" class="btn-ghost">Change settings</button>
    </div>
  </section>

</main>

<script>
(() => {
'use strict';

/* === pure logic === */
const ri = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const mk = (text, answer) => ({ text, answer });

const DIFFS = {
  easy:   { label: 'Easy',   per: 8  },
  medium: { label: 'Medium', per: 10 },
  hard:   { label: 'Hard',   per: 14 },
};

function genProblem(diff) {
  if (diff === 'easy') {
    if (Math.random() < 0.5) {
      const a = ri(2, 20), b = ri(2, 20);
      return mk(`${a} + ${b}`, a + b);
    }
    const a = ri(4, 20), b = ri(2, a - 1);
    return mk(`${a} − ${b}`, a - b);
  }
  if (diff === 'medium') {
    const op = pick(['+', '−', '×']);
    if (op === '+') { const a = ri(12, 60), b = ri(12, 60); return mk(`${a} + ${b}`, a + b); }
    if (op === '−') { const a = ri(25, 99), b = ri(5, a - 1); return mk(`${a} − ${b}`, a - b); }
    const a = ri(3, 12), b = ri(3, 12);
    return mk(`${a} × ${b}`, a * b);
  }
  const kind = pick(['mul', 'div', 'addsub', 'mixed', 'mixed']);
  if (kind === 'mul') { const a = ri(12, 25), b = ri(3, 9); return mk(`${a} × ${b}`, a * b); }
  if (kind === 'div') { const b = ri(2, 12), q = ri(3, 12); return mk(`${b * q} ÷ ${b}`, q); }
  if (kind === 'addsub') {
    const a = ri(150, 900), b = ri(60, 400);
    return Math.random() < 0.5
      ? mk(`${a} + ${b}`, a + b)
      : mk(`${a + b} − ${b}`, a);
  }
  const t = pick(['muladd', 'mulsub', 'parens', 'square']);
  if (t === 'muladd') { const a = ri(3, 12), b = ri(3, 12), c = ri(2, 30); return mk(`${a} × ${b} + ${c}`, a * b + c); }
  if (t === 'mulsub') { const a = ri(4, 12), b = ri(4, 12), c = ri(2, a * b - 2); return mk(`${a} × ${b} − ${c}`, a * b - c); }
  if (t === 'parens') { const a = ri(3, 15), b = ri(3, 15), c = ri(2, 9); return mk(`(${a} + ${b}) × ${c}`, (a + b) * c); }
  const n = ri(11, 19);
  return mk(`${n}²`, n * n);
}

function buildSet(diff, n) {
  const out = [];
  let prev = '';
  while (out.length < n) {
    const p = genProblem(diff);
    if (p.text === prev) continue;
    prev = p.text;
    out.push(p);
  }
  return out;
}
/* === end pure === */

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const fmtTime = ms => {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
const fmtSecs = ms => (ms / 1000).toFixed(1) + 's';

/* ---------- audio ---------- */
let actx = null;
let muted = store.get('mpd_mute', false);
function tone(freq, dur, type, gain, delay) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const v = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.012);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(v).connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  } catch (e) { /* no audio available */ }
}
const sfx = {
  good: () => { tone(660, 0.12, 'sine', 0.05); tone(880, 0.16, 'sine', 0.05, 0.09); },
  bad: () => { tone(190, 0.25, 'sawtooth', 0.04); tone(140, 0.3, 'sawtooth', 0.035, 0.06); },
  click: () => tone(440, 0.05, 'triangle', 0.02),
};

/* ---------- config / start screen ---------- */
const cfg = {
  diff: store.get('mpd_diff', 'medium'),
  count: store.get('mpd_count', 10),
};
if (!DIFFS[cfg.diff]) cfg.diff = 'medium';

function refreshStart() {
  document.querySelectorAll('.diff').forEach(b => {
    const on = b.dataset.diff === cfg.diff;
    b.setAttribute('aria-pressed', on);
    b.querySelector('.d-time').textContent = DIFFS[b.dataset.diff].per + 's';
  });
  document.querySelectorAll('.chip').forEach(b => {
    b.setAttribute('aria-pressed', Number(b.dataset.count) === cfg.count);
  });
  $('per-note').textContent = DIFFS[cfg.diff].per + ' seconds per problem';
  const bests = store.get('mpd_best', {});
  const plays = store.get('mpd_plays', 0);
  const best = bests[cfg.diff];
  $('best-line').innerHTML =
    `<span>Personal best · <b>${DIFFS[cfg.diff].label}</b>: <b>${best != null ? best.toLocaleString() + ' pts' : '—'}</b></span>` +
    `<span>${plays > 0 ? plays.toLocaleString() + (plays === 1 ? ' drill completed' : ' drills completed') : 'No drills yet — go!'}</span>`;
}

document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => {
  cfg.diff = b.dataset.diff;
  store.set('mpd_diff', cfg.diff);
  sfx.click();
  refreshStart();
}));
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  cfg.count = Number(b.dataset.count);
  store.set('mpd_count', cfg.count);
  sfx.click();
  refreshStart();
}));

/* ---------- views ---------- */
const views = { start: $('view-start'), quiz: $('view-quiz'), results: $('view-results') };
function show(name) {
  for (const k in views) {
    const hidden = k !== name;
    views[k].classList.toggle('hidden', hidden);
    if (!hidden) {
      views[k].classList.remove('view');
      void views[k].offsetWidth;
      views[k].classList.add('view');
    }
  }
  if (name === 'start') refreshStart();
}

/* ---------- quiz engine ---------- */
let S = null;

function startQuiz() {
  S = {
    diff: cfg.diff,
    count: cfg.count,
    problems: buildSet(cfg.diff, cfg.count),
    idx: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    results: [],
    t0: performance.now(),
    qStart: 0,
    phase: 'answering',
    input: '',
    raf: 0,
    advanceT: 0,
  };
  const segs = $('segs');
  segs.innerHTML = '';
  for (let i = 0; i < S.count; i++) segs.appendChild(document.createElement('i'));
  show('quiz');
  renderQuestion();
}

function renderQuestion() {
  const p = S.problems[S.idx];
  $('question').textContent = p.text;
  $('q-progress').textContent = `${S.idx + 1} / ${S.count}`;
  $('feedback').textContent = '\u00A0';
  $('feedback').className = 'feedback';
  const box = $('answer-box');
  box.classList.remove('ok', 'bad');
  S.input = '';
  S.phase = 'answering';
  updateAnswer();
  updateSegs();
  $('keypad').classList.remove('frozen');
  S.qStart = performance.now();
  cancelAnimationFrame(S.raf);
  S.raf = requestAnimationFrame(tick);
}

function updateSegs() {
  const segs = $('segs').children;
  for (let i = 0; i < segs.length; i++) {
    const r = S.results[i];
    segs[i].className = r ? (r.correct ? 'ok' : 'bad') : (i === S.idx ? 'active' : '');
  }
}

function tick() {
  if (!S || S.phase !== 'answering') return;
  const per = DIFFS[S.diff].per * 1000;
  const rem = Math.max(0, per - (performance.now() - S.qStart));
  const frac = rem / per;
  const bar = $('timer-bar');
  bar.style.width = (frac * 100) + '%';
  bar.className = frac < 0.25 ? 'danger' : frac < 0.5 ? 'warn' : '';
  $('q-time').textContent = fmtTime(performance.now() - S.t0);
  if (rem <= 0) { judge(null); return; }
  S.raf = requestAnimationFrame(tick);
}

function updateAnswer() {
  const box = $('answer-box');
  $('answer-text').textContent = S.input;
  $('answer-placeholder').style.display = S.input ? 'none' : '';
  box.classList.toggle('typing', !!S.input);
}

function keyPress(k) {
  if (!S || S.phase !== 'answering') return;
  if (k === 'del') S.input = S.input.slice(0, -1);
  else if (k === 'enter') { submit(); return; }
  else if (S.input.length < 6) S.input += k;
  updateAnswer();
}

function submit() {
  if (!S || S.phase !== 'answering') return;
  if (!S.input) {
    const box = $('answer-box');
    box.classList.remove('bad');
    void box.offsetWidth;
    box.classList.add('bad');
    setTimeout(() => box.classList.remove('bad'), 450);
    $('feedback').textContent = 'Type an answer first';
    $('feedback').className = 'feedback bad';
    return;
  }
  judge(parseInt(S.input, 10));
}

function judge(val) {
  if (!S || S.phase !== 'answering') return;
  S.phase = 'feedback';
  cancelAnimationFrame(S.raf);
  clearTimeout(S.advanceT);

  const p = S.problems[S.idx];
  const per = DIFFS[S.diff].per * 1000;
  const ms = Math.min(performance.now() - S.qStart, per);
  const correct = val !== null && val === p.answer;
  let gained = 0;

  if (correct) {
    S.streak++;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    const timeBonus = Math.round(50 * ((per - ms) / per));
    const streakBonus = Math.min(S.streak - 1, 9) * 10;
    gained = 100 + timeBonus + streakBonus;
    S.score += gained;
  } else {
    S.streak = 0;
  }
  S.results.push({ text: p.text, answer: p.answer, given: val, correct, ms });

  const box = $('answer-box');
  box.classList.remove('ok', 'bad');
  box.classList.remove('typing');
  void box.offsetWidth;
  box.classList.add(correct ? 'ok' : 'bad');
  $('keypad').classList.add('frozen');

  const fb = $('feedback');
  if (correct) {
    fb.textContent = pick(['Nice!', 'Got it!', 'Correct!', 'Boom!', 'Sharp!']) + ` +${gained}`;
    fb.className = 'feedback ok';
    const f = document.createElement('span');
    f.className = 'float-pts';
    f.textContent = '+' + gained;
    document.querySelector('.qstage').appendChild(f);
    f.addEventListener('animationend', () => f.remove());
    sfx.good();
  } else {
    fb.textContent = (val === null ? "Time's up" : `Not quite — ${p.answer}`);
    fb.className = 'feedback bad';
    sfx.bad();
  }

  const streakEl = $('q-streak');
  $('q-streak-n').textContent = S.streak;
  streakEl.classList.toggle('on', S.streak >= 2);
  updateSegs();

  S.advanceT = setTimeout(advance, correct ? 700 : 1600);
}

function advance() {
  if (!S || S.phase !== 'feedback') return;
  clearTimeout(S.advanceT);
  S.idx++;
  if (S.idx >= S.count) finish();
  else renderQuestion();
}

function quitToStart() {
  if (S) { cancelAnimationFrame(S.raf); clearTimeout(S.advanceT); S.phase = 'done'; }
  show('start');
}

function finish() {
  cancelAnimationFrame(S.raf);
  const total = performance.now() - S.t0;
  const n = S.results.length;
  const correctCount = S.results.filter(r => r.correct).length;
  const acc = Math.round((correctCount / n) * 100);
  const avg = S.results.reduce((s, r) => s + r.ms, 0) / n;
  const fastTimes = S.results.filter(r => r.correct).map(r => r.ms);
  const fastest = fastTimes.length ? Math.min(...fastTimes) : null;

  const bests = store.get('mpd_best', {});
  const prevBest = bests[S.diff] || 0;
  const isBest = S.score > prevBest && correctCount > 0;
  if (isBest) { bests[S.diff] = S.score; store.set('mpd_best', bests); }
  store.set('mpd_plays', store.get('mpd_plays', 0) + 1);

  $('final-score').textContent = S.score.toLocaleString();
  $('st-acc').textContent = acc + '%';
  $('st-avg').textContent = fmtSecs(avg);
  $('st-fast').textContent = fastest != null ? fmtSecs(fastest) : '—';
  $('st-streak').textContent = S.bestStreak;
  $('newbest').classList.toggle('hidden', !isBest);
  $('verdict').textContent =
    acc === 100 ? 'Flawless.' :
    acc >= 90 ? 'Blazing.' :
    acc >= 75 ? 'Sharp.' :
    acc >= 50 ? 'Solid.' : 'Keep drilling.';
  $('verdict-sub').textContent =
    `${correctCount} of ${n} correct · ${DIFFS[S.diff].label} · finished in ${fmtTime(total)}` +
    (isBest ? '' : prevBest ? ` · best ${prevBest.toLocaleString()}` : '');

  const review = $('review');
  review.innerHTML = '';
  for (const r of S.results) {
    const chip = document.createElement('span');
    chip.className = 'rev ' + (r.correct ? 'ok' : 'bad');
    chip.innerHTML = `${r.text} = <b>${r.given == null ? '—' : r.given}</b>` +
      (r.correct ? ' ✓' : ` <span aria-label="correct answer">(${r.answer})</span>`);
    review.appendChild(chip);
  }
  show('results');
}

/* ---------- wiring ---------- */
$('btn-start').addEventListener('click', () => { sfx.click(); startQuiz(); });
$('btn-again').addEventListener('click', () => { sfx.click(); startQuiz(); });
$('btn-home').addEventListener('click', () => show('start'));
$('btn-quit').addEventListener('click', quitToStart);
function renderSoundIcon() {
  $('ico-sound-on').classList.toggle('hidden', muted);
  $('ico-sound-off').classList.toggle('hidden', !muted);
}
$('btn-sound').addEventListener('click', () => {
  muted = !muted;
  store.set('mpd_mute', muted);
  renderSoundIcon();
  if (!muted) sfx.click();
});
renderSoundIcon();

document.querySelectorAll('.key').forEach(b => b.addEventListener('click', e => {
  e.currentTarget.blur();
  keyPress(b.dataset.key);
}));

window.addEventListener('keydown', e => {
  if (views.quiz.classList.contains('hidden')) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); keyPress(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); keyPress('del'); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (S && S.phase === 'feedback') advance();
    else submit();
  } else if (e.key === 'Escape') quitToStart();
});

refreshStart();
})();
</script>
</body>
</html>
