<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Holiday Card 🎄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e6394f; --pink:#ff5f7e; --green:#1f9d55; --gold:#ffd166;
  --night1:#0b1a3a; --night2:#1c3a6e; --night3:#31538f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none;}
body{
  font-family:'Baloo 2',system-ui,sans-serif;
  background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 78%,#5d7fb5 100%);
  user-select:none; -webkit-user-select:none;
  touch-action:none;
}
canvas.snow{position:fixed; inset:0; width:100%; height:100%; pointer-events:none;}
#snowBack{z-index:3;}
#snowFront{z-index:22;}
#aurora{position:fixed; top:-10vh; left:-10vw; right:-10vw; height:55vh; z-index:1; opacity:.4; filter:blur(50px); pointer-events:none;
  background:
   radial-gradient(40% 60% at 25% 40%, #3ce8b8 0%, transparent 60%),
   radial-gradient(45% 55% at 60% 30%, #6f7bff 0%, transparent 60%),
   radial-gradient(35% 50% at 85% 45%, #c86bff 0%, transparent 60%);
  animation:aurora 14s ease-in-out infinite alternate;
}
@keyframes aurora{from{transform:translateX(-4vw) scaleY(1); opacity:.32;} to{transform:translateX(4vw) scaleY(1.25); opacity:.5;}}
.star{position:fixed; color:#fff; z-index:2; pointer-events:none; animation:twinkle var(--tw,3s) ease-in-out var(--td,0s) infinite alternate;}
@keyframes twinkle{from{opacity:.15; transform:scale(.7);} to{opacity:.95; transform:scale(1.15);}}
#moon{position:fixed; top:5vh; right:7vw; width:clamp(64px,10vw,110px); aspect-ratio:1; border-radius:50%; z-index:2; pointer-events:none;
  background:radial-gradient(circle at 35% 35%, #fffbe6 0%, #ffedb0 55%, #f5d97a 100%);
  box-shadow:0 0 40px 14px rgba(255,240,180,.45), 0 0 120px 40px rgba(255,240,180,.18);
}
#moon::after{content:''; position:absolute; inset:0; border-radius:50%;
  background:
   radial-gradient(circle at 62% 30%, rgba(214,178,94,.5) 0 9%, transparent 10%),
   radial-gradient(circle at 40% 62%, rgba(214,178,94,.45) 0 7%, transparent 8%),
   radial-gradient(circle at 72% 66%, rgba(214,178,94,.4) 0 5%, transparent 6%);
}
#snowcap{position:fixed; top:0; left:0; right:0; height:24px; z-index:40; pointer-events:none;
  background:radial-gradient(circle at 20px -4px, #fff 18px, transparent 19px) repeat-x;
  background-size:40px 26px;
  filter:drop-shadow(0 2px 3px rgba(0,0,60,.25));
}
.ground{position:fixed; left:0; right:0; bottom:0; pointer-events:none;}
#groundBack{height:30vh; z-index:4; opacity:.85;}
#groundFront{height:26vh; z-index:5;}
.ground svg{width:100%; height:100%; display:block;}
#scene{position:fixed; inset:0; z-index:10;}
#scene.dropping{cursor:copy;}

.item{
  position:absolute; transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));
  cursor:grab; line-height:1;
}
.item.dragging{cursor:grabbing;}
.item .in{display:inline-block; font-size:46px; animation:bob var(--bd,3.4s) ease-in-out var(--bdl,0s) infinite alternate; filter:drop-shadow(0 4px 4px rgba(0,0,60,.35));}
.item.dragging .in{animation:none;}
@keyframes bob{from{transform:translateY(-2px) rotate(-3deg);} to{transform:translateY(3px) rotate(3deg);}}
.item.grounded::before{content:''; position:absolute; left:50%; bottom:-4px; transform:translate(-50%,0);
  width:64%; height:12px; border-radius:50%; background:radial-gradient(ellipse at center, rgba(10,20,60,.28) 0%, transparent 70%);}
.item .sticker{
  font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; letter-spacing:.5px;
  background:linear-gradient(135deg,var(--pink),var(--red)); padding:8px 16px; border-radius:999px;
  box-shadow:0 4px 0 rgba(140,10,40,.45), 0 8px 18px rgba(0,0,40,.35); border:3px solid #fff;
  white-space:nowrap;
}
.item.sel .in{filter:drop-shadow(0 0 10px #ffe9a8) drop-shadow(0 4px 4px rgba(0,0,60,.35));}
.item.sel::after{content:''; position:absolute; inset:-10px; border:3px dashed rgba(255,235,150,.95); border-radius:18px; animation:selpulse 1.2s ease-in-out infinite alternate; pointer-events:none;}
@keyframes selpulse{from{opacity:.5;} to{opacity:1;}}
.item.pop-in{animation:popIn .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{
  0%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(0);}
  70%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(calc(var(--s,1)*1.15));}
  100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));}
}
.item.wiggle{animation:wiggle .55s ease-in-out;}
@keyframes wiggle{
  0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));}
  20%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) + 12deg)) scale(calc(var(--s,1)*1.08));}
  40%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) - 11deg)) scale(calc(var(--s,1)*1.1));}
  60%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) + 8deg)) scale(var(--s,1));}
  80%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) - 5deg)) scale(var(--s,1));}
}
.confetti{position:absolute; transform:translate(-50%,-50%); font-size:20px; pointer-events:none; z-index:30;
  animation:fly .8s ease-out forwards;}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot,180deg)) scale(.3); opacity:0;}}
.trail{position:fixed; transform:translate(-50%,-50%); pointer-events:none; z-index:35; animation:trailFade .6s ease-out forwards;}
@keyframes trailFade{to{transform:translate(-50%,-140%) scale(.2); opacity:0;}}

#title{position:fixed; top:26px; left:18px; z-index:45; font-family:'Mountains of Christmas'; font-weight:700;
  font-size:clamp(24px,3.4vw,38px); color:#fff; text-shadow:0 2px 0 rgba(230,57,79,.9), 0 6px 16px rgba(0,0,40,.5);
  pointer-events:none;}
#greeting{position:fixed; top:clamp(64px,11vh,110px); left:50%; transform:translateX(-50%) rotate(-2deg); z-index:45;
  font-family:'Mountains of Christmas'; font-weight:700; font-size:clamp(34px,7vw,68px); color:#fff; cursor:pointer;
  text-shadow:0 3px 0 var(--red), 0 6px 0 rgba(120,10,40,.55), 0 14px 30px rgba(0,0,50,.55);
  white-space:nowrap; transition:transform .15s;}
#greeting:hover{transform:translateX(-50%) rotate(-2deg) scale(1.05);}
#greeting.flip{animation:flip .6s cubic-bezier(.4,1.4,.5,1);}
@keyframes flip{0%{transform:translateX(-50%) rotate(-2deg) perspective(600px) rotateX(90deg) scale(.8);} 100%{transform:translateX(-50%) rotate(-2deg) perspective(600px) rotateX(0) scale(1);}}

#toolbar{position:fixed; top:30px; right:14px; z-index:50; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; max-width:56vw;}
.tbtn{
  display:flex; flex-direction:column; align-items:center; gap:0;
  border:3px solid #fff; border-radius:18px; padding:6px 10px 4px; cursor:pointer;
  background:linear-gradient(180deg,#ffffffdd,#dcebffcc); backdrop-filter:blur(6px);
  box-shadow:0 4px 0 rgba(30,60,120,.4), 0 10px 20px rgba(0,0,40,.3);
  font-family:'Baloo 2'; font-weight:800; color:#20406e; transition:transform .12s;
  touch-action:manipulation;
}
.tbtn:hover{transform:scale(1.08) rotate(-1deg);}
.tbtn:active{transform:scale(.94);}
.tbtn .e{font-size:26px; line-height:1.1;}
.tbtn .l{font-size:11px; letter-spacing:.3px;}
.tbtn.on{background:linear-gradient(180deg,#ffe9a8,#ffd166); border-color:#fff3c4;}
.tbtn.on .e{animation:dance .5s ease-in-out infinite alternate;}
@keyframes dance{from{transform:rotate(-12deg) translateY(1px);} to{transform:rotate(12deg) translateY(-2px);}}
.tbtn.warn{background:linear-gradient(180deg,#ffb3b3,#ff7b7b); color:#6e1010;}

#tray{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:50;
  display:flex; gap:8px; padding:10px 14px 8px; overflow-x:auto; max-width:min(96vw,980px);
  background:linear-gradient(180deg,#ffffffcc,#e3edffbb); border:3px solid #fff; border-radius:24px;
  box-shadow:0 6px 0 rgba(30,60,120,.35), 0 16px 40px rgba(0,0,40,.4); backdrop-filter:blur(8px);
  touch-action:pan-x; scrollbar-width:thin;}
.chip{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:0; width:64px; padding:6px 2px 4px;
  border:none; border-radius:16px; background:#ffffffaa; cursor:grab; font-family:'Baloo 2'; font-weight:800; color:#33507c;
  box-shadow:0 3px 0 rgba(30,60,120,.25); transition:transform .12s; touch-action:none;}
.chip:hover{transform:translateY(-4px) scale(1.06); background:#fff;}
.chip:active{cursor:grabbing; transform:scale(.92);}
.chip .e{font-size:30px; line-height:1.15;}
.chip .l{font-size:10px;}
.chip .st{font-size:13px; padding:2px 8px; background:linear-gradient(135deg,var(--pink),var(--red)); color:#fff; border-radius:999px; border:2px solid #fff;}
#trayHint{position:fixed; bottom:150px; left:50%; transform:translateX(-50%); z-index:49; color:#dfeaff;
  font-size:14px; font-weight:600; text-shadow:0 2px 6px rgba(0,0,40,.8); pointer-events:none;
  animation:hintPulse 1.6s ease-in-out infinite alternate; white-space:nowrap;}
#tray::-webkit-scrollbar{height:6px;}
#tray::-webkit-scrollbar-thumb{background:#9db8e0; border-radius:999px;}
#tray::-webkit-scrollbar-track{background:transparent;}
@keyframes hintPulse{from{opacity:.55; transform:translateX(-50%) translateY(0);} to{opacity:1; transform:translateX(-50%) translateY(-4px);}}

.ghost{position:fixed; transform:translate(-50%,-50%) scale(1.15); font-size:46px; pointer-events:none; z-index:70;
  filter:drop-shadow(0 6px 8px rgba(0,0,40,.5));}
.ghost.st{font-family:'Baloo 2'; font-weight:800; font-size:20px; color:#fff; background:linear-gradient(135deg,var(--pink),var(--red)); padding:8px 16px; border-radius:999px; border:3px solid #fff;}

#menu{position:fixed; z-index:60; transform:translate(-50%,-100%); display:flex; gap:4px;
  background:#20355bee; border:2px solid #fff; border-radius:999px; padding:5px 8px;
  box-shadow:0 8px 20px rgba(0,0,40,.5);}
#menu.hidden{display:none;}
#menu button{border:none; background:#ffffff22; color:#fff; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer;
  transition:transform .1s; touch-action:manipulation;}
#menu button:hover{transform:scale(1.15); background:#ffffff44;}
#menu button:active{transform:scale(.9);}
#menu button.del:hover{background:#ff5f6f;}

#sleigh{position:fixed; top:14vh; left:0; z-index:24; font-size:clamp(34px,5vw,52px); pointer-events:none; white-space:nowrap;
  filter:drop-shadow(0 6px 10px rgba(0,0,60,.5)); letter-spacing:2px;}
#sleigh.hidden{display:none;}

#toast{position:fixed; bottom:158px; left:50%; transform:translateX(-50%) translateY(20px); z-index:65; opacity:0;
  background:#20355bee; color:#fff; border:2px solid #fff; border-radius:999px; padding:10px 14px; font-weight:800;
  display:flex; align-items:center; gap:12px; box-shadow:0 10px 26px rgba(0,0,40,.5); transition:all .25s; pointer-events:none;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
#toast button{border:2px solid #fff; background:var(--green); color:#fff; font-family:'Baloo 2'; font-weight:800;
  border-radius:999px; padding:4px 14px; cursor:pointer; font-size:14px;}

.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){
  .item .in,.star,#aurora,.tbtn.on .e,#trayHint{animation:none !important;}
}
</style>
</head>
<body>
<div id="aurora"></div>
<div id="moon"></div>
<canvas id="snowBack" class="snow"></canvas>
<svg class="ground" id="groundBack" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="#cfe0f5" d="M0,140 C260,60 460,200 760,110 C1040,30 1240,170 1440,90 L1440,320 L0,320 Z"/></svg>
<svg class="ground" id="groundFront" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="#ffffff" d="M0,190 C220,120 430,240 700,170 C980,100 1210,230 1440,150 L1440,320 L0,320 Z"/></svg>
<div id="snowcap"></div>

<div id="scene"></div>
<canvas id="snowFront" class="snow"></canvas>

<div id="title">🎄 My Holiday Card</div>
<div id="greeting" role="button" tabindex="0" aria-label="Change the greeting">🎄 Merry Christmas! ⛄</div>

<div id="toolbar">
  <button class="tbtn" id="musicBtn" aria-label="Play holiday music"><span class="e">🎵</span><span class="l">Music</span></button>
  <button class="tbtn" id="snowBtn" aria-label="Change snow amount"><span class="e">❄️</span><span class="l">Snow</span></button>
  <button class="tbtn" id="flyBtn" aria-label="Santa flyby"><span class="e">🎅</span><span class="l">Flyby</span></button>
  <button class="tbtn" id="surpriseBtn" aria-label="Surprise decorations"><span class="e">🎉</span><span class="l">Surprise</span></button>
  <button class="tbtn" id="clearBtn" aria-label="Clear the card"><span class="e">🧹</span><span class="l">Clear</span></button>
</div>

<div id="trayHint">👆 Tap items to make them giggle — drag them anywhere!</div>
<div id="tray" aria-label="Decoration stickers"></div>

<div id="menu" class="hidden">
  <button data-act="grow" aria-label="Bigger">➕</button>
  <button data-act="shrink" aria-label="Smaller">➖</button>
  <button data-act="rot" aria-label="Rotate">↻</button>
  <button data-act="del" class="del" aria-label="Delete">🗑️</button>
</div>

<div id="sleigh" class="hidden">🦌🦌🛷🎅🎁</div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>

<script>
const $=s=>document.querySelector(s);
const scene=$('#scene'), tray=$('#tray'), menu=$('#menu'), banner=$('#greeting');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

const DEFS={
  tree:{emoji:'🎄',label:'Tree'}, santa:{emoji:'🎅',label:'Santa'}, mrs:{emoji:'🤶',label:'Mrs C'},
  snowman:{emoji:'⛄',label:'Snowman'}, snowman2:{emoji:'☃️',label:'Snowy'}, deer:{emoji:'🦌',label:'Reindeer'},
  penguin:{emoji:'🐧',label:'Penguin'}, polar:{emoji:'🐻‍❄️',label:'Polar'}, gift:{emoji:'🎁',label:'Gift'},
  sock:{emoji:'🧦',label:'Stocking'}, star:{emoji:'⭐',label:'Star'}, glow:{emoji:'🌟',label:'Twinkle'},
  bell:{emoji:'🔔',label:'Bell'}, candy:{emoji:'🍬',label:'Candy'}, pop:{emoji:'🍭',label:'Lolli'},
  flake:{emoji:'❄️',label:'Flake'}, candle:{emoji:'🕯️',label:'Candle'}, pine:{emoji:'🌲',label:'Pine'},
  sled:{emoji:'🛷',label:'Sled'}, heart:{emoji:'❤️',label:'Heart'},
  hoh:{kind:'text',text:'Ho Ho Ho!',label:'Ho Ho'}, joy:{kind:'text',text:'Joy!',label:'Joy'},
  noel:{kind:'text',text:'Noel ✦',label:'Noel'}, xoxo:{kind:'text',text:'XOXO',label:'XOXO'}
};
const TRAY=['tree','santa','mrs','snowman','deer','penguin','polar','gift','sock','star','bell','candy','pop','flake','candle','sled','hoh','joy','noel','xoxo'];
const GREETINGS=['🎄 Merry Christmas! ⛄','🎉 Happy Holidays! ✨','🥳 Happy New Year! 🎆','☃️ Let It Snow! ❄️','🎅 Ho Ho Ho! 🤶','💖 Joy & Hugs! 🤗'];
const DEFAULTS=[
  ['tree',.5,.56,1.7,0],['star',.5,.42,1,0],['snowman',.75,.63,1.3,0],['gift',.44,.73,1,0],
  ['gift',.5,.75,1.25,0],['gift',.56,.73,.9,0],['pine',.13,.6,1.15,0],['pine',.21,.64,.8,0],
  ['penguin',.3,.71,1,0],['sock',.87,.66,1,0],['candy',.66,.74,.8,0],['deer',.91,.55,.9,0],
  ['hoh',.16,.42,1,-6],['flake',.82,.35,.9,0]
];

let AC=null,master=null;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.6; master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
document.addEventListener('pointerdown',()=>ac(),{once:true});

function blip(f1,f2,dur,type,vol,delay){
  const c=ac(),t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.25,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function bellNote(f,t,dur,out){
  const c=ac(),g=c.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.3,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  g.connect(out||master);
  [[f,'triangle',1],[f*2,'sine',.35],[f*3.01,'sine',.12]].forEach(([fr,ty,am])=>{
    const o=c.createOscillator(); o.type=ty; o.frequency.value=fr;
    const og=c.createGain(); og.gain.value=am; o.connect(og); og.connect(g);
    o.start(t); o.stop(t+dur+.05);
  });
}
const SFX={
  pop(){blip(320,760,.12,'sine',.3);},
  drop(){blip(500,180,.16,'triangle',.28);},
  boing(){blip(520,120,.28,'triangle',.3);},
  honk(){blip(230,170,.18,'square',.12);},
  sparkle(){for(let i=0;i<5;i++)blip(rnd(1300,2700),rnd(1800,3000),.1,'sine',.1,i*.05);},
  chime(){[523,659,784,1047].forEach((f,i)=>blip(f,f,.55,'triangle',.16,i*.07));},
  up(){blip(400,900,.14,'sine',.22);},
  down(){blip(700,300,.14,'sine',.22);},
  poof(){blip(900,120,.3,'sawtooth',.1);},
  whoosh(){blip(200,900,.4,'sawtooth',.06);},
  sleigh(){blip(500,1100,.5,'sine',.12); for(let i=0;i<12;i++)blip(rnd(1200,2600),rnd(1500,2900),.12,'sine',.07,i*.09);},
  surprise(){SFX.sparkle(); [0,.12,.24,.36].forEach((d,i)=>setTimeout(()=>SFX.pop(),d*1000));}
};

let musicOn=false,musicTimer=null,musicNodes=[];
const BEAT=.23;
const MELODY=[
  [659.25,.5],[659.25,.5],[659.25,1],[659.25,.5],[659.25,.5],[659.25,1],
  [659.25,.5],[783.99,.5],[523.25,1.5],[587.33,.5],[659.25,2],[0,.5],
  [659.25,.5],[659.25,.5],[659.25,.5],[659.25,.5],[698.46,.5],[659.25,.5],[659.25,.5],
  [587.33,.5],[587.33,.5],[523.25,.5],[587.33,1],[392,2],[0,.75],
  [523.25,.5],[523.25,.5],[523.25,.5],[523.25,.5],[523.25,.5],[587.33,.5],[523.25,1],[659.25,2],[0,1]
];
function loopMusic(){
  if(!musicOn)return;
  const c=ac(),t0=c.currentTime+.08; let t=t0;
  for(const [f,b] of MELODY){ if(f) bellNote(f,t,b*BEAT*.92); t+=b*BEAT; }
  musicTimer=setTimeout(loopMusic,(t-t0)*1000);
}
function toggleMusic(){
  musicOn=!musicOn;
  $('#musicBtn').classList.toggle('on',musicOn);
  if(musicOn){ac(); loopMusic();}
  else{clearTimeout(musicTimer);}
}

let items=new Map(),uid=0,zTop=10,sel=null,gIdx=0,snowLevel=1;

function place(it){
  it.el.style.left=(it.x*100)+'%';
  it.el.style.top=(it.y*100)+'%';
}
function grounded(it){it.el.classList.toggle('grounded',it.y>.6);}
function addItem(defId,x,y,s,r,animate){
  const def=DEFS[defId]; if(!def)return null;
  const el=document.createElement('div');
  el.className='item';
  const inner=document.createElement('span');
  if(def.kind==='text'){inner.className='sticker'; inner.textContent=def.text;}
  else{inner.className='in'; inner.textContent=def.emoji;}
  inner.style.setProperty('--bd',rnd(2.6,4.4)+'s');
  inner.style.setProperty('--bdl',rnd(0,2)+'s');
  el.appendChild(inner);
  const it={id:++uid,defId,x:clamp(x,.03,.97),y:clamp(y,.06,.86),s:s||1,r:r||0,el};
  items.set(it.id,it);
  el.style.setProperty('--s',it.s);
  el.style.setProperty('--r',it.r+'deg');
  el.style.zIndex=++zTop;
  place(it); grounded(it);
  if(animate!==false){el.classList.add('pop-in'); setTimeout(()=>el.classList.remove('pop-in'),480);}
  bindItem(it);
  scene.appendChild(el);
  return it;
}
function bindItem(it){
  const el=it.el;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation(); ac();
    const rect=scene.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY; let moved=false;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const mv=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true; select(it);}
      if(moved){
        it.x=clamp((ev.clientX-rect.left)/rect.width,.03,.97);
        it.y=clamp((ev.clientY-rect.top)/rect.height,.06,.86);
        place(it); if(sel===it)positionMenu();
      }
    };
    const up=ev=>{
      el.removeEventListener('pointermove',mv);
      el.classList.remove('dragging');
      if(moved){el.style.zIndex=++zTop; SFX.drop(); grounded(it); scheduleSave(); if(sel===it)positionMenu();}
      else tap(it);
    };
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up,{once:true});
    el.addEventListener('pointercancel',up,{once:true});
  });
}
function tap(it){
  select(it);
  it.el.style.zIndex=++zTop;
  it.el.classList.remove('wiggle'); void it.el.offsetWidth; it.el.classList.add('wiggle');
  pick([SFX.pop,SFX.boing,SFX.honk,SFX.sparkle,SFX.chime])();
  burst(it.x,it.y);
}
function select(it){
  if(sel&&sel!==it)sel.el.classList.remove('sel');
  sel=it; it.el.classList.add('sel');
  menu.classList.remove('hidden');
  positionMenu();
}
function deselect(){
  if(sel)sel.el.classList.remove('sel');
  sel=null; menu.classList.add('hidden');
}
function positionMenu(){
  if(!sel)return;
  const r=scene.getBoundingClientRect();
  const px=r.left+sel.x*r.width, py=r.top+sel.y*r.height;
  const off=Math.max(34,34*sel.s)+34;
  let top=py-off, below=false;
  if(top<140){top=py+off-8; below=true;}
  menu.style.left=clamp(px,110,innerWidth-110)+'px';
  menu.style.top=top+'px';
  menu.style.transform=below?'translate(-50%,0)':'translate(-50%,-100%)';
}
menu.addEventListener('pointerdown',e=>e.stopPropagation());
menu.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!sel)return;
  const act=b.dataset.act;
  if(act==='grow'){sel.s=clamp(sel.s*1.2,.5,2.4); SFX.up();}
  if(act==='shrink'){sel.s=clamp(sel.s/1.2,.5,2.4); SFX.down();}
  if(act==='rot'){sel.r=(sel.r+30)%360; SFX.pop();}
  if(['grow','shrink','rot'].includes(act)){
    sel.el.style.setProperty('--s',sel.s); sel.el.style.setProperty('--r',sel.r+'deg');
    positionMenu(); scheduleSave();
  }
  if(act==='del'){
    burst(sel.x,sel.y); SFX.poof();
    sel.el.remove(); items.delete(sel.id); deselect(); scheduleSave();
  }
});
function burst(x,y){
  const chars=['❄️','✨','⭐','💫','🎊','🤍'];
  for(let i=0;i<9;i++){
    const c=document.createElement('span');
    c.className='confetti'; c.textContent=pick(chars);
    c.style.left=(x*100)+'%'; c.style.top=(y*100)+'%';
    c.style.setProperty('--dx',rnd(-90,90)+'px');
    c.style.setProperty('--dy',rnd(-110,-20)+'px');
    c.style.setProperty('--rot',rnd(-260,260)+'deg');
    c.style.fontSize=rnd(14,26)+'px';
    scene.appendChild(c);
    setTimeout(()=>c.remove(),850);
  }
}
scene.addEventListener('pointerdown',()=>{deselect(); hideHint();});
document.addEventListener('contextmenu',e=>e.preventDefault());

const trayDefs=TRAY;
trayDefs.forEach(id=>{
  const def=DEFS[id];
  const b=document.createElement('button');
  b.className='chip'; b.dataset.def=id; b.setAttribute('aria-label','Add '+def.label);
  if(def.kind==='text'){b.innerHTML=`<span class="st">${def.text}</span><span class="l">${def.label}</span>`;}
  else{b.innerHTML=`<span class="e">${def.emoji}</span><span class="l">${def.label}</span>`;}
  b.addEventListener('pointerdown',e=>{
    e.preventDefault(); ac();
    const sx=e.clientX,sy=e.clientY; let moved=false;
    const g=document.createElement('div');
    g.className='ghost'+(def.kind==='text'?' st':'');
    g.textContent=def.kind==='text'?def.text:def.emoji;
    g.style.left=sx+'px'; g.style.top=sy+'px';
    document.body.appendChild(g);
    b.setPointerCapture(e.pointerId);
    const mv=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)moved=true;
      if(moved){g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';}
    };
    const up=ev=>{
      b.removeEventListener('pointermove',mv); g.remove();
      const rect=scene.getBoundingClientRect();
      let x,y;
      if(!moved||ev.clientY>innerHeight-140){x=rnd(.28,.72); y=rnd(.3,.62);}
      else{x=(ev.clientX-rect.left)/rect.width; y=(ev.clientY-rect.top)/rect.height;}
      const it=addItem(id,x,y,1,def.kind==='text'?rnd(-8,8):0);
      SFX.pop(); scheduleSave(); hideHint();
    };
    b.addEventListener('pointermove',mv);
    b.addEventListener('pointerup',up,{once:true});
    b.addEventListener('pointercancel',up,{once:true});
  });
  tray.appendChild(b);
});

banner.addEventListener('click',()=>{
  gIdx=(gIdx+1)%GREETINGS.length;
  banner.textContent=GREETINGS[gIdx];
  banner.classList.remove('flip'); void banner.offsetWidth; banner.classList.add('flip');
  SFX.chime(); scheduleSave();
});

$('#musicBtn').addEventListener('click',()=>{toggleMusic(); hideHint();});
$('#snowBtn').addEventListener('click',e=>{
  snowLevel=(snowLevel+1)%3;
  setSnow();
  const btn=e.currentTarget;
  btn.querySelector('.e').textContent=['🌨️','❄️','🌬️'][snowLevel];
  btn.querySelector('.l').textContent=['Less','Snow','Blizzard'][snowLevel];
  SFX.whoosh(); hideHint();
});
$('#flyBtn').addEventListener('click',()=>{flyby(); hideHint();});
$('#surpriseBtn').addEventListener('click',e=>{
  const ids=trayDefs.slice();
  for(let i=0;i<6;i++){
    const id=pick(ids);
    setTimeout(()=>{addItem(id,rnd(.1,.9),rnd(.2,.75),rnd(.8,1.5),DEFS[id].kind==='text'?rnd(-8,8):rnd(-10,10)); SFX.pop();},i*140);
  }
  SFX.sparkle(); scheduleSave(); hideHint();
});
let clearArmed=false,clearTimer=null;
$('#clearBtn').addEventListener('click',e=>{
  const btn=e.currentTarget;
  if(!clearArmed){
    clearArmed=true; btn.classList.add('warn');
    btn.querySelector('.l').textContent='Sure?';
    SFX.boing();
    clearTimer=setTimeout(()=>{clearArmed=false; btn.classList.remove('warn'); btn.querySelector('.l').textContent='Clear';},3000);
    return;
  }
  clearTimeout(clearTimer); clearArmed=false; btn.classList.remove('warn'); btn.querySelector('.l').textContent='Clear';
  const snap=[...items.values()].map(i=>({d:i.defId,x:i.x,y:i.y,s:i.s,r:i.r}));
  deselect();
  items.forEach(i=>{burst(i.x,i.y); i.el.remove();});
  items.clear();
  SFX.whoosh(); SFX.poof(); scheduleSave();
  showToast('Card cleared! 🧹',()=>{
    snap.forEach((s,i)=>setTimeout(()=>{addItem(s.d,s.x,s.y,s.s,s.r);},i*70));
    SFX.sparkle(); scheduleSave();
  });
});
const toast=$('#toast'); let toastTimer=null;
function showToast(msg,undo){
  $('#toastMsg').textContent=msg;
  toast.classList.add('show');
  $('#toastBtn').onclick=()=>{toast.classList.remove('show'); clearTimeout(toastTimer); undo();};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),4500);
}
function flyby(){
  const s=$('#sleigh');
  if(!s.classList.contains('hidden'))return;
  s.classList.remove('hidden');
  SFX.sleigh();
  const anim=s.animate([
    {transform:'translate(-25vw,0) scaleX(1)'},
    {transform:'translate(45vw,-7vh) scaleX(1)'},
    {transform:'translate(125vw,2vh) scaleX(1)'}
  ],{duration:6500,easing:'linear'});
  anim.onfinish=()=>s.classList.add('hidden');
}

let hintShown=true;
function hideHint(){
  if(!hintShown)return;
  hintShown=false;
  const h=$('#trayHint');
  h.style.transition='opacity .5s'; h.style.opacity='0';
  setTimeout(()=>h.remove(),600);
}

const back=$('#snowBack'),front=$('#snowFront');
const bctx=back.getContext('2d'),fctx=front.getContext('2d');
let W=0,H=0,DPR=1,flakesBack=[],flakesFront=[];
const LEVELS=[[45,14],[95,28],[170,55]];
function sizeCanvas(cv,ctx){
  cv.width=innerWidth*DPR; cv.height=innerHeight*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function newFlake(near){
  return{x:rnd(0,innerWidth),y:near?rnd(-innerHeight,0):rnd(0,innerHeight),
    r:rnd(1,3.4),sp:rnd(28,70),sway:rnd(.4,1.6),ph:rnd(0,6.28)};
}
function setSnow(){
  const [nb,nf]=LEVELS[snowLevel];
  while(flakesBack.length<nb)flakesBack.push(newFlake());
  while(flakesFront.length<nf)flakesFront.push(newFlake());
  flakesBack.length=nb; flakesFront.length=nf;
}
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  sizeCanvas(back,bctx); sizeCanvas(front,fctx);
  W=innerWidth; H=innerHeight;
  positionMenu();
}
addEventListener('resize',resize);
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const wind=Math.sin(now/3500)*(.3+snowLevel*.5)+snowLevel*.4;
  [[bctx,flakesBack,1],[fctx,flakesFront,2.2]].forEach(([ctx,arr,sz])=>{
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,'+(sz===1?.85:.55)+')';
    for(const f of arr){
      f.ph+=dt*f.sway;
      f.y+=f.sp*sz*dt*(1+snowLevel*.5);
      f.x+=(wind+Math.sin(f.ph)*30*f.sway)*dt;
      if(f.y>H+8){f.y=-8; f.x=rnd(0,W);}
      if(f.x>W+8)f.x=-8; if(f.x<-8)f.x=W+8;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*sz*.75,0,6.29); ctx.fill();
    }
  });
  requestAnimationFrame(tick);
}

let starsWrap=[];
for(let i=0;i<80;i++){
  const s=document.createElement('span');
  s.className='star';
  s.textContent=pick(['✦','✧','⋆','+']);
  s.style.left=rnd(0,100)+'vw';
  s.style.top=rnd(0,55)+'vh';
  s.style.fontSize=rnd(8,18)+'px';
  s.style.setProperty('--tw',rnd(1.6,4)+'s');
  s.style.setProperty('--td',rnd(0,3)+'s');
  document.body.appendChild(s);
}
let lastTrail=0;
addEventListener('pointermove',e=>{
  const now=performance.now();
  if(now-lastTrail<75||e.target.closest('#tray,#toolbar,#menu'))return;
  lastTrail=now;
  const t=document.createElement('span');
  t.className='trail';
  t.textContent=pick(['✨','❄','⭐']);
  t.style.left=e.clientX+'px'; t.style.top=e.clientY+'px';
  t.style.fontSize=rnd(10,18)+'px';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),620);
});

const KEY='holiday-card-kids-v1';
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(KEY,JSON.stringify({
        g:gIdx,snow:snowLevel,
        items:[...items.values()].map(i=>({d:i.defId,x:i.x,y:i.y,s:i.s,r:i.r}))
      }));
    }catch(e){}
  },400);
}
function load(){
  let data=null;
  try{data=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  if(data&&Array.isArray(data.items)&&data.items.length){
    gIdx=data.g||0; snowLevel=data.snow??1;
    banner.textContent=GREETINGS[gIdx];
    data.items.forEach((s,i)=>setTimeout(()=>addItem(s.d,s.x,s.y,s.s,s.r),i*60));
  }else{
    DEFAULTS.forEach((d,i)=>setTimeout(()=>{
      const it=addItem(d[0],d[1],d[2],d[3],d[4]);
    },i*90));
  }
  const sb=$('#snowBtn');
  sb.querySelector('.e').textContent=['🌨️','❄️','🌬️'][snowLevel];
  sb.querySelector('.l').textContent=['Less','Snow','Blizzard'][snowLevel];
}

resize(); setSnow(); requestAnimationFrame(tick);
load();
</script>
</body>
</html>
