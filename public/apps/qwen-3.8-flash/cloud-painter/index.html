<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☁️ Cloud Painter — Paint the Sky!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Fredoka',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #sky{position:fixed;inset:0;display:block;touch-action:none;cursor:none}

  .panel{
    background:rgba(255,255,255,.58);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:2px solid rgba(255,255,255,.85);
    box-shadow:0 14px 36px rgba(90,120,190,.20), inset 0 1px 0 rgba(255,255,255,.9);
    border-radius:26px;
  }

  header{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:20}
  .logo{pointer-events:auto;padding:8px 20px 10px;display:flex;align-items:center;gap:10px;border-radius:24px}
  .logo .em{font-size:30px;line-height:1;display:inline-block;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(120,150,200,.35))}
  .logo h1{font-family:'Baloo 2',cursive;font-size:clamp(18px,2.6vw,26px);font-weight:800;color:#4a6fa5;letter-spacing:.3px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
  .logo small{display:block;font-family:'Fredoka';font-size:11px;font-weight:500;color:#8aa6cc;margin-top:-6px;letter-spacing:.4px}

  .modes{pointer-events:auto;display:flex;gap:4px;padding:6px}
  .modes button{
    font-family:'Fredoka';font-size:14px;font-weight:600;color:#6d8ab4;
    border:none;background:transparent;padding:8px 14px;border-radius:18px;cursor:pointer;
    transition:all .25s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:6px;
  }
  .modes button:hover{transform:translateY(-2px)}
  .modes button.on{
    background:linear-gradient(180deg,#ffffff,#e9f4ff);
    color:#3b6cb7;box-shadow:0 4px 12px rgba(120,170,230,.35), inset 0 0 0 2px rgba(142,197,255,.55);
    transform:translateY(-1px) scale(1.04);
  }

  #toolbar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:10px 14px;z-index:20;
    width:max-content;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center;
  }
  .group{display:flex;align-items:center;gap:6px}
  .sep{width:2px;height:36px;background:rgba(140,165,205,.32);border-radius:2px;margin:0 3px}

  .tbtn{
    width:50px;height:50px;border-radius:17px;border:2px solid transparent;background:transparent;
    font-size:24px;cursor:pointer;display:grid;place-items:center;position:relative;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s, box-shadow .2s;
  }
  .tbtn:hover{transform:translateY(-5px) rotate(-5deg);background:rgba(255,255,255,.8)}
  .tbtn:active{transform:translateY(-1px) scale(.94)}
  .tbtn.on{
    background:#fff;border-color:#8ec5ff;transform:translateY(-3px) scale(1.08);
    box-shadow:0 8px 18px rgba(110,165,230,.4), inset 0 0 0 1px rgba(255,255,255,.9);
    animation:wiggle .5s ease;
  }
  .tbtn::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.8);
    background:#4a6fa5;color:#fff;font-size:12px;font-weight:500;padding:5px 10px;border-radius:10px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:all .2s;
  }
  .tbtn:hover::after{opacity:1;transform:translateX(-50%) scale(1)}

  .sw{
    width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer;
    box-shadow:0 3px 8px rgba(80,110,170,.3);transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  }
  .sw:hover{transform:scale(1.2)}
  .sw.on{transform:scale(1.28);box-shadow:0 0 0 3px #8ec5ff, 0 4px 10px rgba(80,110,170,.4)}

  .sizer{display:flex;align-items:center;gap:4px}
  .sizer span{font-size:12px;opacity:.65}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:74px;height:10px;border-radius:6px;
    background:linear-gradient(90deg,#cfe6ff,#8ec5ff);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
    background:#fff;border:3px solid #8ec5ff;box-shadow:0 3px 8px rgba(90,130,190,.4);cursor:pointer;transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #8ec5ff;
    box-shadow:0 3px 8px rgba(90,130,190,.4);cursor:pointer;
  }

  #hint{
    position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:15;
    width:max-content;
    padding:14px 26px;font-size:clamp(16px,2.4vw,21px);font-weight:600;color:#5b7fb8;
    pointer-events:none;animation:floaty 3s ease-in-out infinite;transition:opacity .9s ease, transform .9s ease;
    text-align:center;
  }
  #hint.gone{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.92)}

  #cursor{
    position:fixed;left:0;top:0;z-index:8;pointer-events:none;display:none;place-items:center;
    transform:translate(-50%,-50%);border:3px dashed rgba(255,255,255,.95);border-radius:50%;
    background:rgba(255,255,255,.14);font-size:18px;
    box-shadow:0 0 14px rgba(255,255,255,.5), inset 0 0 10px rgba(255,255,255,.25);
    transition:width .16s cubic-bezier(.34,1.56,.64,1), height .16s cubic-bezier(.34,1.56,.64,1);
  }

  #toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(24px);
    width:max-content;max-width:calc(100vw - 40px);
    padding:12px 24px;font-size:16px;font-weight:600;color:#4a6fa5;z-index:30;
    opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
  #flash.go{animation:flash .55s ease-out}

  @keyframes flash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  @keyframes floaty{0%,100%{margin-top:0}50%{margin-top:-10px}}
  @keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-6deg}55%{rotate:5deg}80%{rotate:-2deg}}

  @media (max-width:760px){
    .tbtn{width:42px;height:42px;font-size:20px;border-radius:14px}
    .sw{width:24px;height:24px}
    .sep{height:28px}
    #toolbar{gap:5px;padding:8px 10px;bottom:12px}
    .modes button{padding:6px 10px;font-size:12px}
    .logo{padding:6px 14px 8px}
    #hint{top:18%}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="cursor">☁️</div>

<header>
  <div class="logo panel">
    <span class="em">☁️</span>
    <div>
      <h1>Cloud Painter</h1>
      <small>paint the whole sky!</small>
    </div>
  </div>
  <div class="modes panel" id="modes">
    <button data-mode="day" class="on">☀️ Day</button>
    <button data-mode="sunset">🌇 Sunset</button>
    <button data-mode="night">🌙 Night</button>
  </div>
</header>

<div id="hint" class="panel">☁️ Drag anywhere to paint the sky! ✨<br>👆 pssst… try tapping the airplanes!</div>

<div id="toolbar" class="panel">
  <div class="group" id="brushes">
    <button class="tbtn on" data-brush="fluffy"  data-tip="Fluffy Cloud">☁️</button>
    <button class="tbtn"    data-brush="cotton"  data-tip="Cotton Puffs">🫧</button>
    <button class="tbtn"    data-brush="rainbow" data-tip="Rainbow">🌈</button>
    <button class="tbtn"    data-brush="spark"   data-tip="Sparkles">✨</button>
    <button class="tbtn"    data-brush="wind"    data-tip="Breeze (erase)">🍃</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="swatches"></div>
  <div class="sep"></div>
  <div class="group sizer">
    <span>☁️</span>
    <input type="range" id="size" min="0" max="2" step="1" value="1" title="Brush size">
    <span style="transform:scale(1.5)">☁️</span>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="tbtn" id="gustBtn"  data-tip="Gust of wind!">💨</button>
    <button class="tbtn" id="undoBtn"  data-tip="Undo">↩️</button>
    <button class="tbtn" id="clearBtn" data-tip="Clear the sky">🧹</button>
    <button class="tbtn" id="saveBtn"  data-tip="Save picture">📸</button>
    <button class="tbtn" id="soundBtn" data-tip="Sound on/off">🔊</button>
  </div>
</div>

<div id="toast" class="panel"></div>
<div id="flash"></div>

<script>
'use strict';
/* ============================================================
   ☁️  CLOUD PAINTER — a whimsical sky-painting toy for kids
   ============================================================ */

// ---------- canvas setup ----------
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- tiny utils ----------
const TAU = Math.PI * 2;
const rnd  = (a=1,b) => b===undefined ? Math.random()*a : a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const rgba  = (c,a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const easeOutBack = t => { const c=1.70158; t=clamp(t,0,1); return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
const easeInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function spriteCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(2,Math.ceil(w)); c.height=Math.max(2,Math.ceil(h)); return c; }
function roundRectPath(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---------- world state ----------
let t = 0, last = performance.now();
const objects = [];            // painted things: clouds, rainbows, sparkles
const bgClouds = [];           // scenery clouds (behind everything)
const planes = [];             // airplanes
const trail = [];              // contrail particles
const groups = [];             // undo stack of stroke ids
let gid = 0, objCount = 0;
const MAX_OBJ = 620;
let gust = 0;
const WIND = 9;

// ---------- sky mood (day / sunset / night) ----------
const MODES = {
  day:    { ovC:[255,255,255], ovA:0,   glC:[255,244,214], glA:.16, glR:.55, sunA:1, sunC:[255,212,105], sunR:46, celY:.15, moonA:0, starA:0   },
  sunset: { ovC:[255,125,95],  ovA:.40, glC:[255,130,60],  glA:.50, glR:.80, sunA:1, sunC:[255,140,70],  sunR:64, celY:.27, moonA:0, starA:.22 },
  night:  { ovC:[38,52,110],   ovA:.62, glC:[130,160,255], glA:.25, glR:.60, sunA:0, sunC:[255,212,105], sunR:46, celY:.14, moonA:1, starA:1   },
};
const cur = JSON.parse(JSON.stringify(MODES.day));
let modeName = 'day';
function lerpMode(dt){
  const k = 1 - Math.exp(-dt*2.4), tgt = MODES[modeName];
  for (const key in tgt){
    if (Array.isArray(tgt[key])) for (let i=0;i<3;i++) cur[key][i] = lerp(cur[key][i], tgt[key][i], k);
    else cur[key] = lerp(cur[key], tgt[key], k);
  }
}

// ---------- brushes / colors / tools ----------
const BRUSH_STEP = { fluffy:20, cotton:26, rainbow:64, spark:30 };
const SIZE_F = [0.62, 1, 1.55];
const COLORS = [
  {hex:'#ffffff', name:'snow'},   {hex:'#ffc2d4', name:'bubblegum'}, {hex:'#bfe3ff', name:'skyblue'},
  {hex:'#d9c8ff', name:'lavender'},{hex:'#ffd9b8', name:'peach'},     {hex:'#c2f2dd', name:'mint'},
  {hex:'#fff3b8', name:'butter'},
];
let brush = 'fluffy';
let color = COLORS[0].hex;
let sizeIdx = 1;
const sizeF = () => SIZE_F[sizeIdx];

// ---------- audio (gentle synthesized pops & chimes) ----------
let actx = null, muted = false;
function audioInit(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); }
function tone(f0, f1, dur, type='sine', vol=.1, delay=0){
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t0+dur);
  f.type='lowpass'; f.frequency.value = 2600;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+.05);
}
const sPop   = () => { tone(rnd(420,560), 170, .14, 'sine', .10); tone(rnd(800,950), 500, .08, 'triangle', .04); };
const sPuff  = () => tone(rnd(600,720), 300, .09, 'sine', .05);
const sSpark = () => { tone(1150, 1900, .22, 'sine', .05); tone(1720, 2400, .18, 'sine', .03, .05); };
const sRain  = () => { tone(390, 780, .3, 'sine', .06); };
const sLoop  = () => { tone(280, 950, .4, 'sine', .09); tone(560, 1500, .35, 'triangle', .04, .05); };
const sPoof  = () => tone(240, 55, .32, 'sawtooth', .05);
const sGust  = () => tone(180, 90, .8, 'sine', .07);
const sSave  = () => [523,659,784,1047].forEach((f,i)=>tone(f, f, .16, 'triangle', .07, i*.09));

// ---------- sprite builders ----------
function makeCloudSprite(puffs, hex){
  const col = hex2rgb(hex);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,maxR=0;
  for (const p of puffs){ maxR=Math.max(maxR,p.r); x0=Math.min(x0,p.x-p.r); y0=Math.min(y0,p.y-p.r); x1=Math.max(x1,p.x+p.r); y1=Math.max(y1,p.y+p.r); }
  const pad = maxR*0.75;
  const w = (x1-x0)+pad*2, h = (y1-y0)+pad*2;
  const c = spriteCanvas(w,h), g = c.getContext('2d');
  const ox = pad-x0, oy = pad-y0;
  for (const p of puffs){
    const x=p.x+ox, y=p.y+oy, r=p.r;
    const gr = g.createRadialGradient(x,y,r*0.12,x,y,r);
    gr.addColorStop(0, rgba(col,.95)); gr.addColorStop(.62, rgba(col,.82)); gr.addColorStop(1, rgba(col,0));
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-atop';
  for (const p of puffs){
    const x=p.x+ox-p.r*.3, y=p.y+oy-p.r*.42, r=p.r*.95;
    const hg = g.createRadialGradient(x,y,r*.05,x,y,r);
    hg.addColorStop(0,'rgba(255,255,255,.55)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = hg; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  return { c, w, h };
}
function makeRainbowSprite(f){
  const bands = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa'];
  const R = 40*f, th = 6.5*f, gap = th*1.02;
  const w = 2*R + th*3, h = R + th*3;
  const c = spriteCanvas(w,h), g = c.getContext('2d');
  const cx = w/2, cy = h - th*1.4;
  g.lineCap = 'round';
  bands.forEach((b,i)=>{
    g.strokeStyle = b; g.lineWidth = th;
    g.globalAlpha = .92;
    g.beginPath(); g.arc(cx, cy, R - i*gap, Math.PI, TAU); g.stroke();
  });
  g.globalAlpha = 1;
  return { c, w, h };
}

function makeSparkSprite(hex){
  const col = hex2rgb(hex);
  const R = 22, c = spriteCanvas(R*2.6, R*2.6), g = c.getContext('2d');
  const cx = c.width/2, cy = c.height/2;
  const glow = g.createRadialGradient(cx,cy,1,cx,cy,R*1.3);
  glow.addColorStop(0,'rgba(255,255,255,.9)'); glow.addColorStop(.4, rgba(col,.55)); glow.addColorStop(1, rgba(col,0));
  g.fillStyle = glow; g.beginPath(); g.arc(cx,cy,R*1.3,0,TAU); g.fill();
  g.fillStyle = '#fff';
  g.beginPath();
  for (let i=0;i<8;i++){
    const rad = i%2 ? R*.3 : R; const a = -Math.PI/2 + i*Math.PI/4;
    const x = cx+Math.cos(a)*rad, y = cy+Math.sin(a)*rad;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.closePath(); g.fill();
  g.fillStyle = rgba(col,.85); g.fill();
  return { c, w:c.width, h:c.height };
}

const SPARK_COLORS = ['#ffffff','#ffe9a8','#ffd1e8','#cfe8ff'];

function makePlaneSprite(){
  const w=130, h=70, c=spriteCanvas(w,h), g=c.getContext('2d');
  g.translate(w/2, h/2);
  g.lineJoin = 'round';
  // tail fin
  g.fillStyle = '#ff8fa3';
  g.beginPath(); g.moveTo(-46,-4); g.lineTo(-60,-26); g.lineTo(-32,-6); g.closePath(); g.fill();
  // wing (back)
  g.fillStyle = '#8fb8ff';
  g.beginPath(); g.ellipse(-6, 12, 24, 8, -.12, 0, TAU); g.fill();
  // body
  const bg = g.createLinearGradient(0,-14,0,14);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#dcebfa');
  g.fillStyle = bg; g.strokeStyle='rgba(120,145,185,.55)'; g.lineWidth=2.5;
  roundRectPath(g,-48,-11,96,23,12); g.fill(); g.stroke();
  // nose
  g.fillStyle='#ff8fa3'; g.beginPath(); g.ellipse(46,0.5,9,11.5,0,0,TAU); g.fill();
  g.strokeStyle='rgba(120,145,185,.55)'; g.stroke();
  // stripe
  g.fillStyle='rgba(255,143,163,.8)'; roundRectPath(g,-46,4,92,4.5,2.5); g.fill();
  // wing (front)
  g.fillStyle = '#a5c8ff'; g.strokeStyle='rgba(120,145,185,.5)';
  g.beginPath(); g.ellipse(-2, 4, 26, 9, -.14, 0, TAU); g.fill(); g.stroke();
  // windows
  for (const x of [-24,-8,8,24]){
    g.fillStyle='#7cc4ff'; g.beginPath(); g.arc(x,-3,4.4,0,TAU); g.fill();
    g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=2; g.stroke();
  }
  g.lineWidth=2.5;
  // propeller blur
  g.strokeStyle='rgba(150,170,200,.5)';
  g.beginPath(); g.ellipse(56,0,3,15,0,0,TAU); g.stroke();
  return { c, w, h };
}
const PLANE_SPR = makePlaneSprite();

// ---------- scenery: background clouds + star field ----------
function buildBgClouds(){
  bgClouds.length = 0;
  for (let i=0;i<6;i++){
    const f = rnd(.8,1.9), cx = rnd(-100, W+100), cy = rnd(H*.08, H*.62);
    const puffs = [];
    const n = 5 + (rnd(6)|0);
    for (let k=0;k<n;k++) puffs.push({ x:cx + rnd(-70,70)*f, y:cy + rnd(-16,16)*f, r:rnd(26,48)*f });
    const spr = makeCloudSprite(puffs, '#ffffff');
    bgClouds.push({ spr, x:cx, y:cy, baseY:cy, alpha:rnd(.28,.5), wind:rnd(.18,.4), bobP:rnd(TAU), age:1 });
  }
}
buildBgClouds();

const starsBG = [];
for (let i=0;i<150;i++) starsBG.push({ x:Math.random(), y:Math.random()*.85, r:rnd(.6,2), ph:rnd(TAU), tw:rnd(.8,2.6) });

// shooting star
const shoot = { on:false, x:0, y:0, vx:0, vy:0, life:0 };

// ---------- object helpers ----------
function pushObj(o){
  objCount++;
  o.age = 0; o.bobP = o.bobP ?? rnd(TAU); o.bobA = o.bobA ?? rnd(1.5,5); o.bobF = o.bobF ?? rnd(.5,1.2);
  objects.push(o);
  if (objects.length > MAX_OBJ){
    const idx = objects.findIndex(x => !x.dieT);
    if (idx >= 0) markDie(objects[idx]);
  }
}
let lastPoof = -1;
function markDie(o){
  if (o.dieT === undefined){
    o.dieT = t;
    if (o.kind !== 'spark' && t - lastPoof > .3){ lastPoof = t; sPoof(); }
  }
}

function makeCloudObj(puffs, hex, group, extra){
  const spr = makeCloudSprite(puffs, hex);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of puffs){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return Object.assign({
    kind:'cloud', spr, x:cx, y:cy, baseY:cy, group,
    wind: rnd(.55,1.15)*(0.7+sizeF()*.3),
    bobA: rnd(2,5.5),
  }, extra||{});
}

function buildFluffyStroke(pts, group){
  const f = sizeF();
  let chunk = [], bx0=1e9, by0=1e9, bx1=-1e9, by1=-1e9;
  const flush = () => {
    if (!chunk.length) return;
    const puffs = [];
    for (const p of chunk){
      const n = 1 + (Math.random()<.65 ? 1 : 0);
      for (let i=0;i<n;i++)
        puffs.push({ x:p.x + rnd(-30,30)*f, y:p.y + rnd(-18,18)*f, r:rnd(19,36)*f });
      puffs.push({ x:p.x, y:p.y - 10*f, r:rnd(22,34)*f });
    }
    if (puffs.length) pushObj(makeCloudObj(puffs, color, group));
    chunk = []; bx0=1e9; by0=1e9; bx1=-1e9; by1=-1e9;
  };
  for (const p of pts){
    chunk.push(p);
    bx0=Math.min(bx0,p.x); by0=Math.min(by0,p.y); bx1=Math.max(bx1,p.x); by1=Math.max(by1,p.y);
    if (bx1-bx0 > 1300 || by1-by0 > 1300) flush();
  }
  flush();
}

function stampCotton(x,y,group){
  const f = sizeF(), puffs = [];
  const n = 3 + (rnd(3)|0);
  for (let i=0;i<n;i++) puffs.push({ x:x+rnd(-20,20)*f, y:y+rnd(-13,13)*f, r:rnd(8,16)*f });
  pushObj(makeCloudObj(puffs, color, group));
  sPuff();
}
function stampRainbow(x,y,group){
  const spr = makeRainbowSprite(sizeF()*rnd(.85,1.1));
  pushObj({ kind:'rainbow', spr, x, y, baseY:y, rot:rnd(-.28,.28), group, wind:rnd(.5,.9), bobA:rnd(1.5,3.5) });
  sRain();
}
function stampSpark(x,y,group){
  const hex = SPARK_COLORS[rnd(SPARK_COLORS.length)|0];
  const spr = makeSparkSprite(hex);
  pushObj({ kind:'spark', spr, x, y, baseY:y, rot:rnd(TAU), spin:rnd(-.8,.8), sz:rnd(.4,1)*sizeF(), group, wind:rnd(.9,1.8), bobA:rnd(1,3) });
  sSpark();
}

// ---------- airplanes ----------
let nextPlane = 5;
function spawnPlane(){
  const dir = Math.random()<.5 ? 1 : -1;
  const sc = rnd(.7,1.35);
  planes.push({
    x: dir>0 ? -160 : W+160, y: rnd(H*.1, H*.55), baseY:0, dir, sc,
    speed: rnd(65,115)*sc, ph: rnd(TAU), emit: 0, loopT: null,
  });
  planes[planes.length-1].baseY = planes[planes.length-1].y;
}
function updatePlanes(dt){
  if (t > nextPlane && planes.length < 2){ spawnPlane(); nextPlane = t + rnd(9, 17); }
  for (let i=planes.length-1;i>=0;i--){
    const p = planes[i];
    p.x += p.dir * p.speed * dt;
    if (p.loopT !== null){
      p.loopT += dt/1.15;
      if (p.loopT >= 1) p.loopT = null;
    }
    // contrail
    p.emit += dt;
    while (p.emit > .07){
      p.emit -= .07;
      trail.push({ x: p.x - p.dir*62*p.sc, y: p.baseY + 3*p.sc + Math.sin(t*.9+p.ph)*3, r: rnd(3,6), born: t, life: rnd(2.2,3.4) });
      if (trail.length > 420) trail.shift();
    }
    if (p.x < -220 || p.x > W+220) planes.splice(i,1);
  }
  for (let i=trail.length-1;i>=0;i--){
    const q2 = trail[i];
    if (t - q2.born > q2.life) trail.splice(i,1);
    else q2.x += WIND*(1+gust*4)*.35*dt;
  }
}

// ---------- input ----------
let stroke = null, erasing = false, activePid = null;
const hint = document.getElementById('hint');
let hintGone = false;
function hideHint(){ if(!hintGone){ hintGone = true; hint.classList.add('gone'); } }

function evPos(e){ const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function hitPlane(p){
  for (const a of planes){
    const dx = p.x - a.x, dy = p.y - (a.baseY + Math.sin(t*.9+a.ph)*3);
    if (dx*dx + dy*dy < Math.pow(75*a.sc, 2)) return a;
  }
  return null;
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  if (activePid !== null) return;
  audioInit();
  activePid = e.pointerId;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  const p = evPos(e);
  const a = hitPlane(p);
  if (a && brush !== 'wind'){ a.loopT = 0; sLoop(); for(let i=0;i<6;i++) stampSpark(a.x+rnd(-40,40), a.baseY+rnd(-30,30), ++gid); return; }
  if (brush === 'wind'){ erasing = true; eraseAt(p); return; }
  const g = ++gid;
  stroke = { pts:[p], last:p, acc:0, group:g, c0:objCount };
  hideHint();
});

canvas.addEventListener('pointermove', e => {
  moveCursor(e);
  const p = evPos(e);
  if (erasing){ eraseAt(p); return; }
  if (!stroke || e.pointerId !== activePid) return;
  const dx = p.x-stroke.last.x, dy = p.y-stroke.last.y;
  const d = Math.hypot(dx,dy);
  if (d < 3) return;
  const step = BRUSH_STEP[brush] / Math.max(.7, sizeF()*.8);
  if (brush === 'fluffy'){
    if (d >= step){ stroke.pts.push(p); stroke.last = p; }
  } else {
    stroke.acc += d; stroke.last = p;
    while (stroke.acc >= step){
      stroke.acc -= step;
      if (brush === 'cotton') stampCotton(p.x, p.y, stroke.group);
      else if (brush === 'rainbow') stampRainbow(p.x, p.y, stroke.group);
      else if (brush === 'spark') stampSpark(p.x, p.y, stroke.group);
    }
  }
});

function endStroke(e){
  if (e.pointerId !== activePid) return;
  activePid = null;
  if (stroke){
    if (brush === 'fluffy' && stroke.pts.length){
      buildFluffyStroke(stroke.pts, stroke.group);
      sPop();
    }
    if (objCount > stroke.c0) groups.push(stroke.group);
    stroke = null;
  }
  erasing = false;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

function eraseAt(p){
  const r = 70 * sizeF();
  let hit = false;
  for (const o of objects){
    if (o.dieT) continue;
    const dx = p.x-o.x, dy = p.y-(o.baseY);
    const rad = r + (o.spr ? o.spr.w*.3 : 0);
    if (dx*dx + dy*dy < rad*rad){ markDie(o); hit = true; }
  }
  if (hit) sPuff();
}

// ---------- custom cursor ----------
const cursorEl = document.getElementById('cursor');
const BRUSH_ICON = { fluffy:'☁️', cotton:'🫧', rainbow:'🌈', spark:'✨', wind:'🍃' };
let mouseSeen = false;
function moveCursor(e){
  if (e.pointerType !== 'mouse') return;
  if (!mouseSeen){ mouseSeen = true; cursorEl.style.display = 'grid'; }
  const s = brushCursorSize();
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
}
function brushCursorSize(){
  const base = { fluffy:90, cotton:52, rainbow:96, spark:44, wind:140 }[brush];
  const px = base * (brush==='fluffy'||brush==='wind' ? sizeF() : (sizeF()*.6+.4));
  cursorEl.style.width = px+'px'; cursorEl.style.height = px+'px';
  cursorEl.style.fontSize = (px*.42)+'px';
  cursorEl.style.transform = `translate(-50%,-50%) rotate(${Math.sin(t*2)*6}deg)`;
}

// ---------- update ----------
function update(dt){
  lerpMode(dt);
  gust = Math.max(0, gust - dt/2.6);
  const wind = WIND * (1 + gust*4.5);

  for (let i=objects.length-1;i>=0;i--){
    const o = objects[i];
    o.age += dt;
    o.x += wind * (o.wind||1) * dt;
    const half = (o.spr ? o.spr.w : 40)/2 + 30;
    if (o.x - half > W) o.x = -half;
    else if (o.x + half < 0) o.x = W + half;
    if (o.kind === 'spark') o.rot += (o.spin||.4)*dt;
    if (o.dieT !== undefined && t - o.dieT > .45) objects.splice(i,1);
  }
  for (const b of bgClouds){
    b.x += wind * b.wind * dt;
    const half = b.spr.w/2 + 60;
    if (b.x - half > W) b.x = -half;
  }
  updatePlanes(dt);

  // shooting stars at night
  if (!shoot.on && cur.starA > .7 && Math.random() < dt/10){
    shoot.on = true; shoot.x = rnd(W*.2, W*.95); shoot.y = rnd(H*.05, H*.3);
    shoot.vx = -rnd(320,480); shoot.vy = rnd(140,220); shoot.life = 0;
  }
  if (shoot.on){ shoot.life += dt; shoot.x += shoot.vx*dt; shoot.y += shoot.vy*dt; if (shoot.life > 1.1) shoot.on = false; }
}

// ---------- draw ----------
function drawCelestial(){
  const cx = W*.82, cy = H*cur.celY;
  if (cur.sunA > .01){
    const r = cur.sunR, a = cur.sunA;
    ctx.save(); ctx.globalAlpha = a;
    let g = ctx.createRadialGradient(cx,cy,r*.4,cx,cy,r*3.4);
    g.addColorStop(0, rgba(cur.sunC,.55)); g.addColorStop(1, rgba(cur.sunC,0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r*3.4,0,TAU); ctx.fill();
    // rays
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*.06);
    ctx.fillStyle = rgba(cur.sunC,.5);
    for (let i=0;i<12;i++){
      ctx.rotate(TAU/12);
      roundRectPath(ctx, r*1.25, -r*.09, r*.62, r*.18, r*.09); ctx.fill();
    }
    ctx.restore();
    const disc = ctx.createRadialGradient(cx-r*.3, cy-r*.3, r*.1, cx, cy, r);
    disc.addColorStop(0,'#fffbe8'); disc.addColorStop(.55, rgba(cur.sunC,1)); disc.addColorStop(1, rgba(cur.sunC.map(v=>v*.92),1));
    ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
    ctx.restore();
  }
  if (cur.moonA > .01){
    const r = 38, a = cur.moonA;
    ctx.save(); ctx.globalAlpha = a;
    let g = ctx.createRadialGradient(cx,cy,r*.5,cx,cy,r*3);
    g.addColorStop(0,'rgba(220,230,255,.4)'); g.addColorStop(1,'rgba(220,230,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r*3,0,TAU); ctx.fill();
    const disc = ctx.createRadialGradient(cx-r*.35, cy-r*.35, r*.1, cx, cy, r);
    disc.addColorStop(0,'#ffffff'); disc.addColorStop(1,'#e6e2f7');
    ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(190,185,225,.55)';
    for (const [ox,oy,rr] of [[-12,-6,6],[8,10,8],[14,-12,4],[-4,14,3.5]]){
      ctx.beginPath(); ctx.arc(cx+ox,cy+oy,rr,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawObj(o, sparkPass){
  if (o.kind === 'spark' !== sparkPass) return;
  let s = easeOutBack(o.age/.4), a = clamp(o.age/.35, 0, 1);
  if (o.dieT !== undefined){ const dp = (t-o.dieT)/.45; s *= 1+dp*.7; a *= 1-dp; }
  if (a <= .01) return;
  const bob = Math.sin(t*.5*(o.bobF||1) + o.bobP) * (o.bobA||0);
  ctx.save();
  ctx.translate(o.x, o.baseY + bob);
  if (o.kind === 'spark'){
    const tw = .55 + .45*Math.sin(t*2.8 + o.bobP);
    ctx.rotate(o.rot);
    ctx.scale(s * o.sz * (.85+.3*tw), s * o.sz * (.85+.3*tw));
    ctx.globalAlpha = a * (.45 + .55*tw);
    ctx.globalCompositeOperation = 'lighter';
  } else {
    ctx.rotate(o.rot || 0);
    ctx.scale(s, s);
    ctx.globalAlpha = a;
  }
  ctx.drawImage(o.spr.c, -o.spr.w/2, -o.spr.h/2);
  ctx.restore();
}

function draw(){
  // sky (fixed day palette — mood comes from the overlay so it can crossfade)
  const sk = ctx.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#74bdf0'); sk.addColorStop(.55,'#a9d9f7'); sk.addColorStop(1,'#eaf7ff');
  ctx.fillStyle = sk; ctx.fillRect(0,0,W,H);

  drawCelestial();

  for (const b of bgClouds){
    ctx.save();
    ctx.globalAlpha = b.alpha * clamp(b.age,0,1);
    ctx.translate(b.x, b.baseY + Math.sin(t*.3+b.bobP)*4);
    ctx.drawImage(b.spr.c, -b.spr.w/2, -b.spr.h/2);
    ctx.restore();
    b.age = Math.min(1, b.age + 1/60);
  }

  for (const o of objects) drawObj(o, false);

  // live fluffy preview
  if (stroke && brush === 'fluffy'){
    const f = sizeF(), col = hex2rgb(color);
    ctx.save(); ctx.globalAlpha = .85;
    for (const p of stroke.pts){
      const r = 26*f;
      const g = ctx.createRadialGradient(p.x,p.y,r*.12,p.x,p.y,r);
      g.addColorStop(0,rgba(col,.9)); g.addColorStop(1,rgba(col,0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  // contrails + planes
  for (const q2 of trail){
    const p = (t-q2.born)/q2.life;
    ctx.fillStyle = `rgba(255,255,255,${(1-p)*.4})`;
    ctx.beginPath(); ctx.arc(q2.x, q2.y, q2.r*(1+p*3.6), 0, TAU); ctx.fill();
  }
  for (const a of planes){
    ctx.save();
    ctx.translate(a.x, a.baseY + Math.sin(t*.9+a.ph)*3.5);
    if (a.loopT !== null) ctx.rotate(a.dir * easeInOut(clamp(a.loopT,0,1)) * TAU);
    ctx.scale(a.dir * a.sc, a.sc);
    ctx.drawImage(PLANE_SPR.c, -PLANE_SPR.w/2, -PLANE_SPR.h/2);
    ctx.restore();
  }

  // mood overlay (tints sky + clouds together)
  if (cur.ovA > .01){
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgba(cur.ovC, cur.ovA); ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // horizon / celestial glow
  if (cur.glA > .01){
    const cx = W*.82, cy = H*cur.celY;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W,H)*cur.glR);
    g.addColorStop(0, rgba(cur.glC, cur.glA)); g.addColorStop(1, rgba(cur.glC, 0));
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H); ctx.restore();
  }

  // stars + sparkles stay bright on top
  if (cur.starA > .02){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const s of starsBG){
      const a = cur.starA * (.35 + .65*Math.abs(Math.sin(t*s.tw + s.ph)));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, TAU); ctx.fill();
    }
    if (shoot.on){
      const a = Math.sin(clamp(shoot.life/1.1,0,1)*Math.PI);
      const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx*.16, shoot.y - shoot.vy*.16);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx*.16, shoot.y - shoot.vy*.16); ctx.stroke();
    }
    ctx.restore();
  }
  for (const o of objects) drawObj(o, true);
}

// ---------- main loop ----------
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; t += dt;
  update(dt); draw(); brushCursorSize();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- UI wiring ----------
const swWrap = document.getElementById('swatches');
COLORS.forEach((c,i)=>{
  const b = document.createElement('button');
  b.className = 'sw' + (i===0?' on':'');
  b.style.background = c.hex;
  b.title = c.name;
  b.setAttribute('aria-label', 'color ' + c.name);
  b.addEventListener('click', ()=>{
    audioInit(); color = c.hex;
    swWrap.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
    b.classList.add('on'); tone(700, 900, .07, 'sine', .05);
  });
  swWrap.appendChild(b);
});

document.getElementById('brushes').addEventListener('click', e=>{
  const b = e.target.closest('[data-brush]'); if (!b) return;
  audioInit(); brush = b.dataset.brush;
  document.querySelectorAll('#brushes .tbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); cursorEl.textContent = BRUSH_ICON[brush];
  tone(500, 620, .07, 'sine', .05);
});

document.getElementById('modes').addEventListener('click', e=>{
  const b = e.target.closest('[data-mode]'); if (!b) return;
  audioInit(); modeName = b.dataset.mode;
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  tone(400, 800, .25, 'sine', .06);
});

document.getElementById('size').addEventListener('input', e=>{ sizeIdx = +e.target.value; });

document.getElementById('gustBtn').addEventListener('click', ()=>{ audioInit(); gust = 1; sGust(); toast('💨 Whoooooosh!'); });

document.getElementById('undoBtn').addEventListener('click', ()=>{
  audioInit();
  const g = groups.pop();
  if (g === undefined) return;
  for (const o of objects) if (o.group === g && !o.dieT) markDie(o);
  sPoof();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  audioInit();
  for (const o of objects) if (!o.dieT) markDie(o);
  groups.length = 0;
  sPoof(); toast('🧹 All clean! Fresh sky ahead ✨');
});

document.getElementById('saveBtn').addEventListener('click', save);
function save(){
  audioInit();
  try{
    canvas.toBlob(b=>{
      if (!b) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'cloud-painter-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
    const fl = document.getElementById('flash');
    fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    sSave(); toast('📸 Saved! Your sky is in your downloads 🎨');
  }catch(err){ toast('😅 Could not save: ' + err.message); }
}

document.getElementById('soundBtn').addEventListener('click', e=>{
  audioInit(); muted = !muted;
  e.currentTarget.textContent = muted ? '🔇' : '🔊';
  if (!muted) tone(600, 900, .1, 'sine', .06);
});

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

// keyboard shortcuts for grown-ups
addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT') return;
  const map = { '1':'fluffy','2':'cotton','3':'rainbow','4':'spark','5':'wind' };
  if (map[e.key]){ const b = document.querySelector(`[data-brush="${map[e.key]}"]`); if (b) b.click(); }
  else if (e.key === 'z' || e.key === 'Z') document.getElementById('undoBtn').click();
  else if (e.key === 's' || e.key === 'S') save();
  else if (e.key === 'w' || e.key === 'W') document.getElementById('gustBtn').click();
});

// hide cursor ring when pointer leaves the window
canvas.addEventListener('pointerleave', ()=>{ cursorEl.style.display = 'none'; mouseSeen = false; });
</script>
