<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Micro Habit Tracker</title>
<style>
  :root{
    --bg:#0b1020; --card:rgba(255,255,255,.045); --card-border:rgba(255,255,255,.09);
    --text:#eef2ff; --muted:#8b93b0; --accent:#a78bfa; --accent2:#22d3ee;
    --good:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(167,139,250,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(34,211,238,.12), transparent 55%),
      var(--bg);
    color:var(--text); min-height:100vh;
  }
  .app{max-width:640px;margin:0 auto;padding:20px 16px calc(48px + env(safe-area-inset-bottom))}
  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(124,99,245,.35);flex:none}
  .brand h1{font-size:17px;margin:0;letter-spacing:.2px;white-space:nowrap}
  .brand .date{font-size:12px;color:var(--muted);margin-top:1px}
  .head-actions{display:flex;gap:8px;flex:none}
  .btn{border:1px solid var(--card-border);background:var(--card);color:var(--text);border-radius:12px;
    padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.skip.active{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12);color:var(--warn)}
  .btn.icon{padding:9px;width:38px;height:38px;justify-content:center}
  /* hero */
  .hero{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--card-border);
    border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .ring-wrap{position:relative;width:108px;height:108px;flex:none}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-bg{stroke:rgba(255,255,255,.08)}
  .ring-fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}
  .ring-label{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
  .ring-label small{display:block;font-size:10px;font-weight:600;color:var(--muted);text-align:center;margin-top:2px}
  .hero-copy{min-width:0}
  .hero-copy .msg{font-size:16px;font-weight:700;line-height:1.35}
  .hero-copy .sub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);
    border:1px solid var(--card-border);color:#cdd3ea;white-space:nowrap}
  .chip b{color:var(--text)}
  /* chart */
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
  .chart{width:100%;display:block}
  /* habits */
  .habit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;transition:border-color .25s, background .25s}
  .habit.done{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.05)}
  .h-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;
    background:color-mix(in srgb,var(--hc) 16%, transparent);border:1px solid color-mix(in srgb,var(--hc) 35%, transparent)}
  .h-main{flex:1;min-width:0}
  .h-top{display:flex;align-items:center;gap:8px}
  .h-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h-streak{font-size:11.5px;font-weight:700;color:var(--warn);background:rgba(251,191,36,.1);
    border:1px solid rgba(251,191,36,.25);padding:2px 8px;border-radius:99px;flex:none}
  .h-streak.cold{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--card-border)}
  .h-tools{display:flex;gap:2px;margin-left:auto;flex:none}
  .h-tools button{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:8px;font-size:13px;line-height:1}
  .h-tools button:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .strip{display:flex;gap:4px;margin-top:9px;flex-wrap:nowrap}
  .cell{width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.05);flex:none;cursor:pointer;
    border:1px solid transparent;transition:transform .12s;position:relative}
  .cell:hover{transform:scale(1.18)}
  .cell.done{background:var(--hc);box-shadow:0 2px 8px color-mix(in srgb,var(--hc) 45%, transparent)}
  .cell.skip{background:repeating-linear-gradient(45deg,rgba(251,191,36,.28) 0 3px,transparent 3px 6px);border-color:rgba(251,191,36,.4)}
  .cell.future,.cell.prenatal{opacity:.25;cursor:default}
  .cell.prenatal:hover,.cell.future:hover{transform:none}
  .cell.today{border-color:#fff}
  .check{width:52px;height:52px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.04);color:transparent;font-size:22px;cursor:pointer;display:grid;place-items:center;
    transition:.22s cubic-bezier(.34,1.56,.64,1)}
  .check:hover{border-color:var(--hc);transform:scale(1.06)}
  .habit.done .check{background:var(--hc);border-color:var(--hc);color:#0b1020;box-shadow:0 6px 18px color-mix(in srgb,var(--hc) 45%, transparent)}
  .habit.skipped .check{border-style:dashed;border-color:rgba(251,191,36,.6);color:var(--warn);font-size:17px}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .check.pop{animation:pop .35s}
  .add-btn{width:100%;padding:15px;border-radius:var(--radius);border:1.5px dashed rgba(255,255,255,.18);
    background:transparent;color:var(--muted);font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s}
  .add-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent);background:rgba(167,139,250,.06)}
  .add-btn:disabled{opacity:.45;cursor:not-allowed}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,6,16,.7);backdrop-filter:blur(6px);display:none;
    align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .overlay.open{display:flex}
  @media(min-width:560px){.overlay{align-items:center;padding:20px}}
  .modal{width:100%;max-width:440px;background:#141a30;border:1px solid var(--card-border);border-radius:24px 24px 0 0;
    padding:22px;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
  @media(min-width:560px){.modal{border-radius:24px}}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.4px}
  .field input[type=text]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--card-border);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
  .field input[type=text]:focus{border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .emoji-opt{width:42px;height:42px;border-radius:12px;font-size:20px;background:rgba(255,255,255,.05);
    border:1.5px solid transparent;cursor:pointer;display:grid;place-items:center;transition:.15s}
  .emoji-opt.sel{border-color:var(--accent);background:rgba(167,139,250,.16);transform:scale(1.08)}
  .color-opt{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.15s}
  .color-opt.sel{border-color:#fff;transform:scale(1.12)}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1;justify-content:center;padding:13px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#0b1020;font-weight:800}
  .btn.danger{color:var(--bad);border-color:rgba(251,113,133,.35)}
  /* toast + confetti */
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:#1c2440;border:1px solid var(--card-border);
    color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;transition:.35s cubic-bezier(.22,1,.36,1);
    z-index:99;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  #toast.show{transform:translate(-50%,0);opacity:1}
  .confetti{position:fixed;top:-12px;font-size:16px;z-index:100;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
  @media(max-width:480px){
    .hero{flex-direction:column;text-align:center;gap:12px}
    .chips{justify-content:center}
    .cell{width:15px;height:15px}
    .brand h1{font-size:15px}
    .check{width:46px;height:46px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>Micro Habit Tracker</h1>
        <div class="date" id="dateLine"></div>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn skip" id="skipBtn" title="Mark today as a rest day — streaks stay alive">🌙 <span>Skip day</span></button>
      <button class="btn icon" id="exportBtn" title="Export JSON" aria-label="Export">⬇️</button>
      <button class="btn icon" id="importBtn" title="Import JSON" aria-label="Import">⬆️</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="hero">
    <div class="ring-wrap">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="54" cy="54" r="47" fill="none" stroke-width="9"/>
        <circle class="ring-fg" id="ringFg" cx="54" cy="54" r="47" fill="none" stroke-width="9"
          stroke-dasharray="295.3" stroke-dashoffset="295.3"/>
      </svg>
      <div class="ring-label"><span id="ringPct">0%<small>today</small></span></div>
    </div>
    <div class="hero-copy">
      <div class="msg" id="motivate"></div>
      <div class="sub">Tiny actions, repeated daily, become identity. Show up once today.</div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="card">
    <h2>Last 7 days · completion</h2>
    <div id="chart"></div>
  </section>

  <section id="habits"></section>
  <button class="add-btn" id="addBtn">＋ Add habit</button>
</div>

<!-- editor modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">New habit</h3>
    <div class="field">
      <label>NAME</label>
      <input type="text" id="nameInput" maxlength="40" placeholder="e.g. Do 10 pushups" autocomplete="off">
    </div>
    <div class="field">
      <label>ICON</label>
      <div class="opts" id="emojiOpts"></div>
    </div>
    <div class="field">
      <label>COLOR</label>
      <div class="opts" id="colorOpts"></div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteHabitBtn">Delete</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveHabitBtn">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";
const LS = "micro-habits-v1";
const EMOJIS = ["✨","💧","📚","🧘","🏃","🌱","💪","🥗","✍️","🎸","🧠","☀️","🛏️","🚭","💊","🙏"];
const COLORS = ["#22d3ee","#a78bfa","#34d399","#fb7185","#fbbf24","#60a5fa","#f472b6","#fb923c"];
const MAX_HABITS = 7;

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => fmt(new Date());
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

/* ---------- state ---------- */
function seed(){
  const t = new Date(), k = n => fmt(addDays(t,-n));
  const mk = (name,icon,color,age,done,skip) => {
    const log = {};
    done.forEach(o => log[k(o)] = "done");
    skip.forEach(o => log[k(o)] = "skip");
    return { id:uid(), name, icon, color, createdAt:k(age), log };
  };
  return {
    celebratedOn:null,
    skips:{},
    habits:[
      mk("Drink 2L water","💧","#22d3ee",13,[0,1,2,4,5,6,7,8,9,11,12],[3]),
      mk("Read 10 pages","📚","#a78bfa",13,[1,2,4,5,6,8,9,10,12],[3,7]),
      mk("Meditate","🧘","#34d399",10,[1,2,3,4,5,6,8],[7]),
      mk("Move 20 min","🏃","#fb7185",8,[2,3,5,6],[4]),
    ]
  };
}
function load(){
  try {
    const raw = localStorage.getItem(LS);
    if(!raw) return null;
    const s = JSON.parse(raw);
    return sanitize(s) ? s : null;
  } catch(e){ return null; }
}
function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }
function sanitize(s){
  if(!s || !Array.isArray(s.habits)) return false;
  s.habits = s.habits.filter(h => h && typeof h.name === "string" && h.log && typeof h.log === "object")
    .slice(0, MAX_HABITS)
    .map(h => ({
      id: h.id || uid(), name: h.name.slice(0,40),
      icon: typeof h.icon === "string" ? h.icon.slice(0,4) : "✨",
      color: /^#[0-9a-f]{6}$/i.test(h.color||"") ? h.color : COLORS[0],
      createdAt: /^\d{4}-\d{2}-\d{2}$/.test(h.createdAt||"") ? h.createdAt : todayKey(),
      log: Object.fromEntries(Object.entries(h.log).filter(([,v]) => v==="done"||v==="skip"))
    }));
  s.skips = (s.skips && typeof s.skips === "object") ? s.skips : {};
  s.celebratedOn = typeof s.celebratedOn === "string" ? s.celebratedOn : null;
  return true;
}
let state = load() || seed();
save();

/* ---------- streak math ---------- */
function currentStreak(h){
  const tk = todayKey(); let streak = 0;
  if(h.log[tk] === "done") streak++;
  const start = midnight(new Date(h.createdAt + "T00:00:00"));
  let d = addDays(new Date(), -1);
  while(midnight(d) >= start){
    const v = h.log[fmt(d)];
    if(v === "done") streak++;
    else if(v === "skip"){ /* rest keeps the chain */ }
    else break;
    d = addDays(d, -1);
  }
  return streak;
}
function bestStreak(h){
  let best = 0, cur = 0;
  const end = midnight(new Date());
  for(let d = midnight(new Date(h.createdAt + "T00:00:00")); d <= end; d = addDays(d,1)){
    const v = h.log[fmt(d)];
    if(v === "done"){ cur++; best = Math.max(best,cur); }
    else if(v === "skip"){ /* neutral */ }
    else cur = 0;
  }
  return best;
}
const doneToday = () => state.habits.filter(h => h.log[todayKey()] === "done").length;
const daySkipped = () => !!(state.skips && state.skips[todayKey()]);

/* ---------- actions ---------- */
function toggleHabit(id, dayKey){
  const h = state.habits.find(x => x.id === id); if(!h) return;
  if(dayKey < h.createdAt || dayKey > todayKey()) return;
  h.log[dayKey] = h.log[dayKey] === "done" ? undefined : "done";
  if(h.log[dayKey] === undefined) delete h.log[dayKey];
  checkCelebration();
  save(); render();
}
function skipDay(){
  const tk = todayKey();
  if(state.skips[tk]){
    delete state.skips[tk];
    state.habits.forEach(h => { if(h.log[tk] === "skip") delete h.log[tk]; });
    toast("Welcome back — today is live again ✨");
  } else {
    state.skips[tk] = true;
    state.habits.forEach(h => { if(!h.log[tk]) h.log[tk] = "skip"; });
    toast("🌙 Rest day. Your streaks are protected.");
  }
  save(); render();
}
function checkCelebration(){
  const all = state.habits.length > 0 && doneToday() === state.habits.length;
  if(all && state.celebratedOn !== todayKey()){
    state.celebratedOn = todayKey();
    confetti(); save();
  }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({ app:"micro-habit-tracker", version:1, exportedAt:new Date().toISOString(), habits:state.habits, skips:state.skips }, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `micro-habits-${todayKey()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported ✓");
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const candidate = { habits:data.habits, skips:data.skips, celebratedOn:null };
      if(!sanitize(candidate) || !candidate.habits.length) throw new Error("empty");
      if(!confirm(`Import ${candidate.habits.length} habit(s)? This replaces current data.`)) return;
      state = candidate; save(); render(); toast("Imported ✓");
    } catch(e){ toast("Import failed — invalid file"); }
  };
  r.readAsText(file);
}

/* ---------- modal ---------- */
let editing = null, pickIcon = EMOJIS[0], pickColor = COLORS[0];
function openEditor(habit){
  editing = habit || null;
  pickIcon = habit ? habit.icon : EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  pickColor = habit ? habit.color : COLORS[state.habits.length % COLORS.length];
  $("#modalTitle").textContent = habit ? "Edit habit" : "New habit";
  $("#nameInput").value = habit ? habit.name : "";
  $("#deleteHabitBtn").style.display = habit ? "" : "none";
  renderOpts();
  $("#overlay").classList.add("open");
  setTimeout(() => $("#nameInput").focus(), 60);
}
function closeEditor(){ $("#overlay").classList.remove("open"); }
function renderOpts(){
  $("#emojiOpts").innerHTML = EMOJIS.map(e =>
    `<button class="emoji-opt ${e===pickIcon?"sel":""}" data-emoji="${e}">${e}</button>`).join("");
  $("#colorOpts").innerHTML = COLORS.map(c =>
    `<button class="color-opt ${c===pickColor?"sel":""}" data-color="${c}" style="background:${c}"></button>`).join("");
}
function saveEditor(){
  const name = $("#nameInput").value.trim();
  if(!name){ $("#nameInput").focus(); return; }
  if(editing){
    Object.assign(editing, { name, icon:pickIcon, color:pickColor });
  } else {
    if(state.habits.length >= MAX_HABITS){ toast(`Max ${MAX_HABITS} habits — micro means focused 😉`); return; }
    state.habits.push({ id:uid(), name, icon:pickIcon, color:pickColor, createdAt:todayKey(), log:{} });
  }
  save(); closeEditor(); render();
}
function deleteEditing(){
  if(!editing) return;
  if(!confirm(`Delete "${editing.name}" and its history?`)) return;
  state.habits = state.habits.filter(h => h.id !== editing.id);
  save(); closeEditor(); render(); toast("Habit deleted");
}

/* ---------- render ---------- */
function render(){
  const tk = todayKey();
  $("#dateLine").textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});

  // ring + chips + motivation
  const total = state.habits.length, done = doneToday();
  const pct = total ? done/total : (daySkipped() ? 1 : 0);
  $("#ringFg").style.strokeDashoffset = String(295.3 * (1 - pct));
  $("#ringPct").innerHTML = `${Math.round(pct*100)}%<small>today</small>`;
  const msg = !total ? "Add your first micro habit — one that takes under two minutes."
    : daySkipped() && done === 0 ? "Rest is part of the rhythm. Tomorrow you roar. 🌙"
    : done === total ? "Perfect day. You showed up for all of it. 🏆"
    : done > 0 ? "Momentum is on your side — keep feeding the streaks."
    : "Day one, or day two — either way, start now.";
  $("#motivate").textContent = msg;
  const longest = state.habits.reduce((m,h) => Math.max(m, currentStreak(h)), 0);
  const bestEver = state.habits.reduce((m,h) => Math.max(m, bestStreak(h)), 0);
  let weekSum = 0, weekN = 0;
  for(let i=0;i<7;i++){
    const d = addDays(new Date(), -i), k = fmt(d);
    const active = state.habits.filter(h => h.createdAt <= k);
    if(active.length){ weekSum += active.filter(h => h.log[k]==="done").length / active.length; weekN++; }
  }
  $("#chips").innerHTML =
    `<span class="chip">🔥 <b>${longest}</b> active streak</span>` +
    `<span class="chip">🏅 <b>${bestEver}</b> best ever</span>` +
    `<span class="chip">✅ <b>${done}/${total}</b> today</span>` +
    `<span class="chip">📈 <b>${weekN ? Math.round(weekSum/weekN*100) : 0}%</b> this week</span>`;

  renderChart(); renderHabits();

  const sb = $("#skipBtn");
  sb.classList.toggle("active", daySkipped());
  sb.querySelector("span").textContent = daySkipped() ? "Un-skip" : "Skip day";
  const add = $("#addBtn");
  add.disabled = total >= MAX_HABITS;
  add.textContent = total >= MAX_HABITS ? `Limit reached — ${MAX_HABITS}/${MAX_HABITS} habits (micro means focused)` : `＋ Add habit (${total}/${MAX_HABITS})`;
}

function renderChart(){
  const W = 280, H = 96, bw = 26, gap = (W - 7*bw)/6;
  const today = midnight(new Date());
  let bars = "";
  for(let i=0;i<7;i++){
    const d = addDays(today, -6 + i), k = fmt(d);
    const active = state.habits.filter(h => h.createdAt <= k);
    const p = active.length ? active.filter(h => h.log[k]==="done").length / active.length : 0;
    const bh = Math.max(p * (H-26), p > 0 ? 6 : 3);
    const x = i*(bw+gap), y = H - 18 - bh;
    const isToday = i === 6;
    const fill = isToday ? "url(#barGrad)" : "rgba(167,139,250,.38)";
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="7" fill="${fill}"/>`;
    if(state.skips[k]) bars += `<text x="${x+bw/2}" y="${y-5}" font-size="10" text-anchor="middle">🌙</text>`;
    bars += `<text x="${x+bw/2}" y="${H-4}" font-size="9.5" text-anchor="middle" fill="${isToday?"#eef2ff":"#8b93b0"}" font-weight="${isToday?700:500}">${["S","M","T","W","T","F","S"][d.getDay()]}</text>`;
  }
  $("#chart").innerHTML =
    `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:110px">
      <defs><linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
      </linearGradient></defs>
      <line x1="0" y1="${H-18}" x2="${W}" y2="${H-18}" stroke="rgba(255,255,255,.08)"/>
      ${bars}</svg>`;
}

function renderHabits(){
  const wrap = $("#habits");
  if(!state.habits.length){
    wrap.innerHTML = `<div class="empty card">No habits yet.<br>The hardest lift is starting — pick one tiny thing. 💪</div>`;
    return;
  }
  const tk = todayKey();
  wrap.innerHTML = state.habits.map(h => {
    const st = currentStreak(h);
    const doneTodayV = h.log[tk] === "done";
    const skippedTodayV = h.log[tk] === "skip";
    let cells = "";
    for(let i=13;i>=0;i--){
      const d = addDays(new Date(), -i), k = fmt(d);
      const preatal = k < h.createdAt;
      const v = h.log[k];
      const cls = ["cell", doneTodayV || v==="done" ? "done" : "", v==="skip" ? "skip" : "",
                   preatal && v!=="done" && v!=="skip" ? "prenatal" : "", k===tk ? "today" : ""].join(" ");
      cells += `<div class="${cls}" style="--hc:${h.color}" data-id="${h.id}" data-day="${k}" title="${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}${preatal?" · not started":""}"></div>`;
    }
    return `
    <div class="habit ${doneTodayV?"done":""} ${skippedTodayV?"skipped":""}" style="--hc:${h.color}">
      <div class="h-icon">${h.icon}</div>
      <div class="h-main">
        <div class="h-top">
          <span class="h-name">${escapeHtml(h.name)}</span>
          <span class="h-streak ${st>0?"":"cold"}">🔥 ${st}</span>
          <span class="h-tools">
            <button data-edit="${h.id}" title="Edit" aria-label="Edit">✏️</button>
            <button data-del="${h.id}" title="Delete" aria-label="Delete">🗑️</button>
          </span>
        </div>
        <div class="strip">${cells}</div>
      </div>
      <button class="check ${doneTodayV?"pop":""}" data-check="${h.id}" aria-label="Toggle ${escapeHtml(h.name)}">
        ${skippedTodayV ? "🌙" : "✓"}
      </button>
    </div>`;
  }).join("");
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- toast + confetti ---------- */
let toastTimer;
function toast(t){
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}
function confetti(){
  const glyphs = ["🎉","✨","⭐","💜","🎊","⚡","💚","🩵"];
  for(let i=0;i<36;i++){
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
    s.style.animationDelay = (Math.random()*.5) + "s";
    s.style.fontSize = (12 + Math.random()*14) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
  toast("All habits done — that's who you are now. 🏆");
}

/* ---------- events ---------- */
$("#habits").addEventListener("click", e => {
  const check = e.target.closest("[data-check]");
  if(check){ toggleHabit(check.dataset.check, todayKey()); return; }
  const cell = e.target.closest(".cell");
  if(cell && !cell.classList.contains("prenatal")){ toggleHabit(cell.dataset.id, cell.dataset.day); return; }
  const edit = e.target.closest("[data-edit]");
  if(edit){ openEditor(state.habits.find(h => h.id === edit.dataset.edit)); return; }
  const del = e.target.closest("[data-del]");
  if(del){
    const h = state.habits.find(x => x.id === del.dataset.del);
    if(h && confirm(`Delete "${h.name}" and its history?`)){
      state.habits = state.habits.filter(x => x.id !== h.id);
      save(); render(); toast("Habit deleted");
    }
  }
});
$("#skipBtn").addEventListener("click", skipDay);
$("#exportBtn").addEventListener("click", exportJSON);
$("#importBtn").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => { if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; });
$("#addBtn").addEventListener("click", () => {
  if(state.habits.length >= MAX_HABITS){ toast(`Max ${MAX_HABITS} habits — micro means focused 😉`); return; }
  openEditor(null);
});
$("#overlay").addEventListener("click", e => { if(e.target === e.currentTarget) closeEditor(); });
$("#cancelBtn").addEventListener("click", closeEditor);
$("#saveHabitBtn").addEventListener("click", saveEditor);
$("#deleteHabitBtn").addEventListener("click", deleteEditing);
$("#nameInput").addEventListener("keydown", e => { if(e.key === "Enter") saveEditor(); });
$("#emojiOpts").addEventListener("click", e => { const b = e.target.closest("[data-emoji]"); if(b){ pickIcon = b.dataset.emoji; renderOpts(); } });
$("#colorOpts").addEventListener("click", e => { const b = e.target.closest("[data-color]"); if(b){ pickColor = b.dataset.color; renderOpts(); } });

render();
})();
</script>
