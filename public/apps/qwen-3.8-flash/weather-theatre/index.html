<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Theatre — A Forecast, Staged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  :root{
    --gold:#d4a94e; --gold-dim:#8a6c2f; --ink:#0b0a12; --paper:#efe6d0;
    --velvet:#7a0e1e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--paper);font-family:'Cormorant Garamond',Georgia,serif;min-height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1428 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 110%, #140f1e 0%, transparent 60%),
      var(--ink);
  }
  #root{max-width:1120px;margin:0 auto;padding:28px 20px 48px}
  .marquee{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
  .marquee .rule{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-dim))}
  .marquee .rule.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
  .bulbs{display:flex;gap:9px}
  .bulb{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(212,169,78,.55);animation:blink 2.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-family:'Cinzel',serif;font-weight:900;text-align:center;font-size:clamp(30px,5vw,52px);letter-spacing:.14em;
     background:linear-gradient(180deg,#f6e3b0 0%,var(--gold) 55%,#9a742c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 0 40px rgba(212,169,78,.15)}
  .tagline{text-align:center;font-style:italic;font-size:clamp(15px,2vw,19px);color:#b9ad93;letter-spacing:.06em;margin:6px 0 20px}
  .frame{position:relative;border-radius:14px;padding:12px;
    background:linear-gradient(160deg,#2a2138,#171225 40%,#241b33);
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(212,169,78,.35);}
  .frame::before{content:"";position:absolute;inset:5px;border:1px solid rgba(212,169,78,.28);border-radius:10px;pointer-events:none}
  .stage{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .badge{position:absolute;top:12px;left:14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;
    color:rgba(239,230,208,.75);background:rgba(10,8,18,.45);border:1px solid rgba(212,169,78,.35);padding:5px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .playbtn{position:absolute;top:10px;right:12px;display:flex;gap:6px}
  .pbtn{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--paper);cursor:pointer;
    background:rgba(10,8,18,.5);border:1px solid rgba(212,169,78,.4);border-radius:999px;padding:6px 12px;backdrop-filter:blur(4px);transition:all .2s}
  .pbtn:hover{background:rgba(212,169,78,.18)}
  .pbtn.active{color:#120d05;background:var(--gold);border-color:var(--gold)}
  .subtitle{position:absolute;left:0;right:0;bottom:0;padding:34px 8% 18px;text-align:center;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(6,4,12,.78) 55%)}
  .subtitle .line{font-family:'JetBrains Mono',monospace;font-size:clamp(12px,1.6vw,15.5px);line-height:1.65;color:#f2e8cf;
    text-shadow:0 2px 12px rgba(0,0,0,.9);min-height:2.4em}
  .caret{display:inline-block;width:.55em;height:1.05em;vertical-align:-0.15em;background:var(--gold);margin-left:2px;animation:cb .8s steps(1) infinite}
  @keyframes cb{50%{opacity:0}}
  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 26px;margin-top:22px;
    background:linear-gradient(180deg,#1c1629,#141020);border:1px solid rgba(212,169,78,.22);border-radius:12px;padding:20px 24px}
  .knob label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Cinzel',serif;font-weight:700;
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
  .knob label .val{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.05em;color:#a99d80}
  .knob .hint{font-style:italic;font-size:13.5px;color:#8f8570;margin-top:6px;letter-spacing:.02em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--fill), #3a3150 var(--fill))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6dd,var(--accent) 60%,#241a05);border:1px solid rgba(0,0,0,.5);
    box-shadow:0 0 12px var(--accent), 0 2px 6px rgba(0,0,0,.6)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3150}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:1px solid #000;box-shadow:0 0 10px var(--accent)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;flex-wrap:wrap}
  .scenes{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;padding:7px 12px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(212,169,78,.3);color:#b7ab8e;background:rgba(20,16,32,.6);transition:all .25s}
  .chip:hover{color:var(--paper);border-color:var(--gold)}
  .chip.on{color:#120d05;background:linear-gradient(180deg,#f0d795,var(--gold));border-color:var(--gold);box-shadow:0 0 16px rgba(212,169,78,.4)}
  .nav{display:flex;gap:8px;align-items:center}
  .credit{text-align:center;margin-top:26px;font-style:italic;color:#6f6653;font-size:14px;letter-spacing:.05em}
  @media (max-width:720px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const {useState, useEffect, useRef, useMemo} = React;

/* ------------------------- Mock forecast ------------------------- */
const FORECAST = [
  {timeH:6,  time:"06:00", label:"First Light Mist",  cond:"fog",   temp:4,  wind:6,  pop:20},
  {timeH:9,  time:"09:15", label:"Drifting Drizzle",  cond:"rain",  temp:8,  wind:14, pop:70},
  {timeH:12, time:"12:30", label:"High Broken Sun",   cond:"clear", temp:13, wind:9,  pop:5},
  {timeH:15, time:"15:45", label:"Hillshade Squall",  cond:"storm", temp:10, wind:34, pop:88},
  {timeH:18, time:"18:20", label:"Dusk Frostfall",    cond:"snow",  temp:-2, wind:11, pop:60},
  {timeH:22, time:"22:50", label:"Late Cloud Bank",   cond:"cloud", temp:3,  wind:17, pop:35},
];

/* ------------------------- Color math ------------------------- */
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mixC=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mix3=(a,b,c,ta,tb)=>[a[0]+(b[0]-a[0])*ta+(c[0]-a[0])*tb, a[1]+(b[1]-a[1])*ta+(c[1]-a[1])*tb, a[2]+(b[2]-a[2])*ta+(c[2]-a[2])*tb];
const rgb=(c,a)=> a===undefined ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const scaleC=(c,s)=>[clamp(c[0]*s,0,255),clamp(c[1]*s,0,255),clamp(c[2]*s,0,255)];

/* ------------------------- Palettes ------------------------- */
const BASE_DAY = {skyTop:[64,104,168], skyMid:[136,168,208], skyBot:[224,204,170], far:[120,138,168], mid:[74,92,118], near:[38,48,64], sun:[255,236,190], glow:[255,214,140], cloud:[242,238,230], precip:[190,210,235]};
const BASE_NIGHT={skyTop:[7,9,22], skyMid:[16,20,44], skyBot:[34,32,58], far:[38,44,72], mid:[24,28,48], near:[12,14,24], sun:[214,222,244], glow:[140,150,200], cloud:[52,56,84], precip:[150,170,210]};
const MOOD = {
  cozy:  {skyTop:[52,34,66],  skyMid:[150,84,58],  skyBot:[246,180,104], far:[110,74,86],  mid:[64,40,52],  near:[28,17,22],  sun:[255,208,120], glow:[255,150,60],  cloud:[250,206,150], precip:[255,224,180]},
  eerie: {skyTop:[3,8,12],    skyMid:[10,26,32],   skyBot:[30,58,58],    far:[16,34,42],   mid:[8,20,26],   near:[3,8,10],    sun:[150,220,205], glow:[70,160,150],  cloud:[30,52,58],    precip:[140,190,200]},
  heroic:{skyTop:[20,44,110], skyMid:[92,120,190], skyBot:[255,226,150], far:[150,120,140],mid:[46,38,86],  near:[16,12,34],  sun:[255,240,200], glow:[255,196,80],  cloud:[255,236,200], precip:[240,230,200]},
};
const MOOD_K = Object.keys(MOOD);

function paletteFor(w, night, dayT){
  const base = night ? BASE_NIGHT : BASE_DAY;
  const out = {};
  for (const k in base){
    let c = base[k].slice();
    for (let i=0;i<3;i++){
      const m = MOOD[MOOD_K[i]];
      c = mixC(c, m[k], w[MOOD_K[i]]*0.82);
    }
    out[k]=c;
  }
  return out;
}

/* ------------------------- Noise ------------------------- */
const fract=x=>x-Math.floor(x);
const hash=n=>fract(Math.sin(n*127.1+311.7)*43758.5453);
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);}
function fbm(x){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f);f*=2;a*=.5;}return s;}

/* ------------------------- Narration ------------------------- */
function narrate(scene, dom){
  const t=scene.timeH;
  const tod = t<12?"morning":t<17?"afternoon":t<21?"evening":"night";
  if(dom==="cozy")  return `the ${scene.cond==="clear"?"light":scene.cond} outside only makes the fire behind these windows feel earned.`;
  if(dom==="eerie") return `the forecast calls it “${scene.label.toLowerCase()}”. it never says what is standing in it.`;
  if(dom==="heroic")return `${scene.time} — ${scene.temp}°C, wind ${scene.wind} km/h, ${scene.pop}% chance the valley holds its breath. we play on.`;
  return `${scene.label} rolls across the stage as the ${tod} light holds its breath.`;
}
const MOOD_TAG={cozy:"A COSY READING",eerie:"AN EERIE READING",heroic:"A HEROIC READING",neutral:"A NEUTRAL READING"};
const DOM_NAME={cozy:"Cozy",eerie:"Eerie",heroic:"Heroic",neutral:"Balanced"};

/* =================================================================
   CANVAS ENGINE
   ================================================================= */
function makeEngine(canvas, ref){
  const ctx = canvas.getContext("2d");
  let W=0,H=0,dpr=1;
  const stars=[], clouds=[], wisps=[];
  for(let i=0;i<160;i++) stars.push({x:hash(i*3+1), y:hash(i*7+2)*.55, r:.4+hash(i*11+3)*1.3, tw:hash(i*13+5)*6.28});
  for(let i=0;i<7;i++) clouds.push({x:hash(i*17+7), y:.08+hash(i*19+9)*.3, s:1.4+hash(i*23+2)*2.6, spd:.004+hash(i*29+4)*.008, seed:i*37});
  for(let i=0;i<6;i++) wisps.push({x:hash(i*31+3), y:.35+hash(i*37+8)*.4, ph:hash(i*41+1)*6.28, r:3+hash(i*43+6)*4});
  const rain=[], snow=[], embers=[];
  let bolt=null, flash=0, tPrev=0, tNow=0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    const r = canvas.getBoundingClientRect();
    W=r.width; H=r.height;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener("resize", resize);

  const ridge=(x,seed,amp,baseY,freq)=> baseY - amp*fbm(x*freq+seed) - amp*.45*fbm(x*freq*2.7+seed*1.7);

  function drawSky(P, w){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(P.skyTop)); g.addColorStop(.55, rgb(P.skyMid)); g.addColorStop(1, rgb(P.skyBot));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  function drawStars(P, night, t){
    if(!night) return;
    for(const s of stars){
      const a = night * (0.35+0.65*Math.abs(Math.sin(t*0.8+s.tw)));
      ctx.fillStyle=`rgba(240,240,255,${a*0.9})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7); ctx.fill();
    }
  }

  function celestial(scene, P, night){
    const dayT = clamp(1-Math.abs(scene.timeH-13)/9, 0, 1);
    const cx = W*(0.18+ (clamp((scene.timeH-5)/16,0,1))*0.64);
    const cy = H*(0.5 - dayT*0.34);
    const r = night? 26 : 30;
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*7);
    g.addColorStop(0, rgb(P.glow, .85)); g.addColorStop(.25, rgb(P.glow,.22)); g.addColorStop(1, rgb(P.glow,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*7,0,7); ctx.fill();
    ctx.fillStyle=rgb(P.sun); ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    if(night){ // moon craters + crescent bite
      ctx.fillStyle="rgba(120,130,165,.5)";
      ctx.beginPath(); ctx.arc(cx-6,cy-4,4,0,7); ctx.arc(cx+7,cy+6,3,0,7); ctx.arc(cx+2,cy-9,2.2,0,7); ctx.fill();
    }
    return {cx,cy};
  }

  function drawRays(P, pos, w, t){
    if(w.heroic<0.05) return;
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.translate(pos.cx,pos.cy); ctx.rotate(t*0.05);
    for(let i=0;i<14;i++){
      const a=i/14*6.283, len=Math.max(W,H)*1.3;
      const wid=0.028+0.02*Math.sin(t*1.3+i*2.1);
      const g=ctx.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len);
      g.addColorStop(0, rgb(P.glow, .16*w.heroic)); g.addColorStop(1, rgb(P.glow,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,len,a-wid,a+wid); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawClouds(P, w, t, px){
    for(const c of clouds){
      const x=((c.x + t*c.spd + px*0.00012)%1.3-0.15)*W;
      const y=c.y*H*0.7;
      const s=c.s*22;
      const tint = mixC(P.cloud, P.precip, (P.precip[0]<200? .25:.1));
      for(let i=0;i<5;i++){
        const ox=(i-2)*s*.62, oy=Math.sin(i*2.4+c.seed)*s*.14;
        const rr=s*(0.55+0.3*Math.sin(i*1.7+c.seed));
        const g=ctx.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rr);
        g.addColorStop(0, rgb(tint,.5)); g.addColorStop(1, rgb(tint,0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x+ox,y+oy,rr,0,7); ctx.fill();
      }
    }
  }

  function drawRidge(P, seed, amp, baseY, freq, px, color, snowT){
    ctx.beginPath(); ctx.moveTo(-2,H);
    for(let x=-2;x<=W+2;x+=4) ctx.lineTo(x, ridge(x/W*6, seed, amp*H, baseY*H, freq)+px*0.02);
    ctx.lineTo(W+2,H); ctx.closePath();
    ctx.fillStyle=rgb(color); ctx.fill();
    if(snowT>0){
      ctx.save(); ctx.clip();
      ctx.strokeStyle=`rgba(235,242,250,${0.5*snowT})`; ctx.lineWidth=3;
      ctx.beginPath();
      for(let x=-2;x<=W+2;x+=4) ctx.lineTo(x, ridge(x/W*6, seed, amp*H, baseY*H, freq)+px*0.02+1.5);
      ctx.stroke(); ctx.restore();
    }
  }

  function drawTrees(P, w, px){
    if(w.eerie<0.08) return;
    ctx.strokeStyle=rgb(scaleC(P.near,.5), Math.min(1,w.eerie));
    ctx.lineCap="round";
    const xs=[0.12,0.3,0.72,0.88];
    for(let i=0;i<xs.length;i++){
      const bx=(xs[i]*W + px*0.05)%(W+80)-40;
      const by=ridge(xs[i]*6, 55, .16*H, .74*H, 2)+8;
      const th=H*0.13*(0.8+hash(i*5)*.5);
      const sway=Math.sin(tNow*0.7+i)*2.5*w.eerie;
      ctx.lineWidth=3.2;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(bx+sway,by-th*.6,bx+sway*2,by-th); ctx.stroke();
      ctx.lineWidth=1.6;
      for(let b=0;b<5;b++){
        const t0=.4+b*.13, sy=by-th*t0, sx=bx+sway*t0*2, dir=b%2?1:-1;
        ctx.beginPath(); ctx.moveTo(sx,sy);
        ctx.quadraticCurveTo(sx+dir*14,sy-8, sx+dir*(20+b*3), sy-16-b*3); ctx.stroke();
      }
    }
  }

  function house(x,gy,s,P,w,t){
    const bw=s*70, bh=s*46, roof=s*34;
    ctx.fillStyle=rgb(scaleC(P.near,.55));
    ctx.fillRect(x-bw/2, gy-bh, bw, bh);
    ctx.beginPath(); ctx.moveTo(x-bw*.62,gy-bh); ctx.lineTo(x,gy-bh-roof); ctx.lineTo(x+bw*.62,gy-bh); ctx.closePath(); ctx.fill();
    // chimney
    ctx.fillRect(x+bw*.18, gy-bh-roof*.7, s*10, roof*.75);
    // window
    const lit = w.cozy;
    if(lit>0.08){
      const fl = 0.8+0.2*Math.sin(t*9+x)+0.08*Math.sin(t*23+x*2);
      const a = Math.min(1,lit)*fl;
      const wg=ctx.createRadialGradient(x-bw*.16,gy-bh*.55,0,x-bw*.16,gy-bh*.55,s*46);
      wg.addColorStop(0,`rgba(255,190,90,${.55*a})`); wg.addColorStop(1,"rgba(255,190,90,0)");
      ctx.fillStyle=wg; ctx.fillRect(x-bw*.16-s*46,gy-bh*.55-s*46,s*92,s*92);
      ctx.fillStyle=`rgba(255,204,110,${.95*a})`;
      ctx.fillRect(x-bw*.16-s*7, gy-bh*.55-s*8, s*14, s*16);
      ctx.strokeStyle=rgb(scaleC(P.near,.4)); ctx.lineWidth=1.5;
      ctx.strokeRect(x-bw*.16-s*7, gy-bh*.55-s*8, s*14, s*16);
    }else{
      ctx.fillStyle="rgba(10,10,16,.8)";
      ctx.fillRect(x-bw*.16-s*7, gy-bh*.55-s*8, s*14, s*16);
    }
  }

  function spawnParticles(scene, w, dt){
    const area = W*H/1e6;
    const rainI = (scene.cond==="rain"?0.55: scene.cond==="storm"?1:0.12)*area*(1+w.eerie*.5);
    const snowI = (scene.cond==="snow"?0.9:0.05)*area;
    while(rain.length < rainI*420 && rain.length<460) rain.push({x:Math.random()*W*1.3-W*.15, y:Math.random()*H, l:8+Math.random()*14, v:520+Math.random()*380});
    while(snow.length < snowI*340 && snow.length<340) snow.push({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.4, v:26+Math.random()*40, ph:Math.random()*6.28});
    if(rain.length > rainI*420) rain.splice(0, Math.max(2, Math.ceil(dt*rainI*900)));
    if(snow.length > snowI*340) snow.splice(0, Math.max(2, Math.ceil(dt*snowI*700)));
    if(w.cozy>0.25 && Math.random()<w.cozy*0.35){
      const hx=[0.2,0.52,0.83];
      embers.push({x:(hx[(Math.random()*3)|0])*W+(Math.random()*10-5), y:H*0.86, v:14+Math.random()*22, r:1+Math.random()*1.6, life:1});
    }
    if(embers.length>90) embers.splice(0,3);
  }

  function drawWeather(P, scene, w, px, dt){
    const wind = scene.wind*(scene.cond==="storm"?1.6:1);
    ctx.strokeStyle=rgb(P.precip,.42); ctx.lineWidth=1.1;
    ctx.beginPath();
    for(const d of rain){
      d.y+=d.v*dt; d.x+=wind*2.2*dt;
      if(d.y>H){d.y=-20;d.x=Math.random()*W*1.3-W*.15;}
      ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-wind*.16, d.y+d.l);
    }
    ctx.stroke();
    ctx.fillStyle="rgba(240,246,255,.85)";
    for(const f of snow){
      f.y+=f.v*dt; f.x+=Math.sin(tNow*1.4+f.ph)*18*dt + wind*.4*dt;
      if(f.y>H+4){f.y=-4;f.x=Math.random()*W;}
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
    }
    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.y-=e.v*dt; e.x+=Math.sin(tNow*3+i)*8*dt; e.life-=dt*.35;
      if(e.life<=0){embers.splice(i,1);continue;}
      ctx.fillStyle=`rgba(255,${140+Math.sin(tNow*10+i)*60|0},60,${e.life*.8})`;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill();
    }
  }

  function drawFog(P, w, t, px){
    if(w.eerie<0.06) return;
    for(let i=0;i<4;i++){
      const y=H*(0.62+i*0.09);
      const x=((t*(0.012+i*0.006)+i*0.31+px*0.00005)%1.4-0.2)*W;
      const rw=W*0.45, rh=H*0.09;
      const g=ctx.createRadialGradient(x,y,0,x,y,rw);
      const c = mixC([180,200,205], P.mid, .3);
      g.addColorStop(0, rgb(c, .20*w.eerie)); g.addColorStop(1, rgb(c,0));
      ctx.save(); ctx.translate(x,y); ctx.scale(1,rh/rw); ctx.translate(-x,-y);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rw,0,7); ctx.fill(); ctx.restore();
    }
  }

  function drawWisps(P, w, t){
    if(w.eerie<0.25) return;
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(const s of wisps){
      const x=(s.x + Math.sin(t*0.23+s.ph)*0.06)*W;
      const y=(s.y + Math.sin(t*0.31+s.ph*2)*0.04)*H;
      const a=(0.35+0.3*Math.sin(t*1.7+s.ph))*w.eerie;
      const g=ctx.createRadialGradient(x,y,0,x,y,s.r*8);
      g.addColorStop(0,`rgba(140,255,215,${a})`); g.addColorStop(1,"rgba(140,255,215,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,s.r*8,0,7); ctx.fill();
      ctx.fillStyle=`rgba(210,255,235,${a})`; ctx.beginPath(); ctx.arc(x,y,s.r*.7,0,7); ctx.fill();
    }
    ctx.restore();
  }

  function drawLightning(P, scene, w, dt, t){
    if(scene.cond==="storm"||w.eerie>0.35){
      const rate = (scene.cond==="storm"? .45:.15)*w.eerie + (scene.cond==="storm"?.12:0);
      if(!bolt && Math.random()<rate*dt){
        const x0=W*(0.15+Math.random()*0.7);
        const pts=[{x:x0,y:-10}];
        let x=x0;
        for(let y=0;y<H*0.5;y+=H*0.045){ x+=(Math.random()*2-1)*36; pts.push({x,y}); }
        bolt={pts, life:.28}; flash=1;
      }
    }
    if(bolt){
      bolt.life-=dt;
      if(bolt.life<=0) bolt=null;
      else{
        ctx.save(); ctx.globalCompositeOperation="lighter";
        ctx.strokeStyle=`rgba(210,230,255,${bolt.life*3})`; ctx.lineWidth=2.4;
        ctx.shadowColor="rgba(160,200,255,.9)"; ctx.shadowBlur=18;
        ctx.beginPath(); ctx.moveTo(bolt.pts[0].x,bolt.pts[0].y);
        for(const p of bolt.pts) ctx.lineTo(p.x,p.y);
        ctx.stroke(); ctx.restore();
      }
    }
    if(flash>0.01){
      ctx.fillStyle=`rgba(190,210,255,${flash*0.16})`; ctx.fillRect(0,0,W,H);
      flash*=Math.pow(0.02,dt);
    }
  }

  function drawSpotlights(P, w, night, t){
    const strength = (night? 0.85:0.4) * (0.55 + w.heroic*0.75);
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const beams=[
      {sx:W*0.12, sy:-20, ph:0.0,   col:[255,244,214]},
      {sx:W*0.88, sy:-20, ph:2.1,   col:[255,244,214]},
      {sx:W*0.5,  sy:-20, ph:4.2,   col: P.glow},
    ];
    for(const b of beams){
      const ang = Math.PI/2 + Math.sin(t*0.45+b.ph)*0.5;
      const len = H*1.5, half = 0.075+0.02*Math.sin(t*1.1+b.ph);
      const g=ctx.createLinearGradient(b.sx,b.sy, b.sx+Math.cos(ang)*len, b.sy+Math.sin(ang)*len);
      g.addColorStop(0, rgb(b.col, .20*strength)); g.addColorStop(1, rgb(b.col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(b.sx,b.sy);
      ctx.lineTo(b.sx+Math.cos(ang-half)*len, b.sy+Math.sin(ang-half)*len);
      ctx.lineTo(b.sx+Math.cos(ang+half)*len, b.sy+Math.sin(ang+half)*len);
      ctx.closePath(); ctx.fill();
      // pool on stage floor
      const px2=b.sx+Math.cos(ang)*len*0.62, py=b.sy+Math.sin(ang)*len*0.62;
      const pg=ctx.createRadialGradient(px2,py,0,px2,py,W*0.16);
      pg.addColorStop(0, rgb(b.col,.10*strength)); pg.addColorStop(1, rgb(b.col,0));
      ctx.fillStyle=pg; ctx.save(); ctx.translate(px2,py); ctx.scale(1,.35); ctx.beginPath(); ctx.arc(0,0,W*0.16,0,7); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }

  function drawVignette(P, night){
    const g=ctx.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,H*1.05);
    g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(0,0,0,${night?0.62:0.42})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  function velvetGrad(x0,x1){
    const g=ctx.createLinearGradient(x0,0,x1,0);
    g.addColorStop(0,"#3d060f"); g.addColorStop(.5,"#b21e30"); g.addColorStop(1,"#4a0812");
    return g;
  }
  function drawDrape(side, openP){
    const full=W/2+26;
    const cw=full*(1-openP);
    if(cw<2) return;
    const x0 = side==="L" ? 0 : W-cw;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,0,cw,H+2); ctx.clip();
    const folds=Math.max(4, Math.round(cw/46));
    const fw=cw/folds;
    for(let i=0;i<folds;i++){
      const fx=x0+i*fw;
      ctx.fillStyle=velvetGrad(fx,fx+fw);
      ctx.fillRect(fx,-2,fw+1,H+4);
    }
    // sheen
    const sh=ctx.createLinearGradient(x0,0,x0+cw,H);
    sh.addColorStop(0,"rgba(255,180,180,.05)"); sh.addColorStop(.5,"rgba(255,255,255,.09)"); sh.addColorStop(1,"rgba(0,0,0,.12)");
    ctx.fillStyle=sh; ctx.fillRect(x0,0,cw,H);
    // scalloped inner hem
    ctx.fillStyle="#5c0a16";
    const hx = side==="L"? x0+cw : x0;
    for(let y=-10;y<H+20;y+=34){
      ctx.beginPath();
      ctx.arc(hx + (side==="L"? -6:6), y, 12, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawCurtain(openP){
    drawDrape("L",openP); drawDrape("R",openP);
    // valance
    const vh=H*0.16, lift=vh*1.35*openP;
    const folds=Math.max(6,Math.round(W/80)), fw=W/folds;
    for(let i=0;i<folds;i++){
      const fx=i*fw;
      const g=ctx.createLinearGradient(0,vh+lift,0,-fw*.4+lift);
      g.addColorStop(0,"#e8425a"); g.addColorStop(.4,"#8c1223"); g.addColorStop(1,"#3d060f");
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(fx,-4+lift); ctx.lineTo(fx+fw,-4+lift);
      ctx.quadraticCurveTo(fx+fw/2, vh*1.28+lift, fx, -4+lift+ (0));
      ctx.arc(fx+fw/2, lift, fw/2, 0, Math.PI);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(fx+fw/2, lift, fw/2, 0, Math.PI); ctx.fill();
    }
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(0,lift-2,W,3);
    // gold trim
    ctx.strokeStyle="rgba(212,169,78,.8)"; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=folds;i++){ const fx=i*fw; if(i<folds){ctx.moveTo(fx,lift); ctx.arc(fx+fw/2,lift,fw/2,Math.PI,0,true); ctx.moveTo(fx+fw,lift);} }
    ctx.stroke();
  }

  /* ------------------------- main loop ------------------------- */
  function frame(ts){
    const dt = clamp((ts-tPrev)/1000, 0, .05); tPrev=ts; tNow=ts/1000;
    const S = ref.current;
    // curtain state machine
    const c=S.curtain;
    if(c.open!==c.target){
      const dir=Math.sign(c.target-c.open);
      c.open += dir*(c.target>c.open? 1.15 : 0.85)*dt;
      if(dir>0 ? c.open>=c.target : c.open<=c.target) c.open=c.target;
    }
    if(c.open<=0.001 && c.target===0 && c.pending!==null){
      S.setScene(c.pending); c.pending=null; c.target=1;
    }
    const openP = ease(clamp(c.open,0,1));

    const w = {cozy:S.moods.cozy/100, eerie:S.moods.eerie/100, heroic:S.moods.heroic/100};
    const scene = FORECAST[S.sceneIndex];
    const night = S.night;
    const P = paletteFor(w, night, 0);
    const px = S.mouse.x-0.5, py=S.mouse.y-0.5;

    ctx.clearRect(0,0,W,H);
    drawSky(P,w);
    drawStars(P, night? 1: clamp((scene.timeH>=19||scene.timeH<=5)?0.5:0,0,1)*0.4, tNow);
    const pos = celestial(scene, P, night);
    drawRays(P,pos,w,tNow);
    drawClouds(P,w,tNow, px*W);
    // parallax ridges
    drawRidge(P, 11, .20, .58, 1.6, px*14, mixC(P.far,P.skyMid,.25), 0);
    drawRidge(P, 27, .24, .66, 2.2, px*30, P.far, (scene.cond==="snow"?1:.25));
    drawTrees(P,w, px*46);
    drawRidge(P, 41, .17, .78, 3.1, px*52, P.mid, (scene.cond==="snow"?1:.15));
    drawRidge(P, 77, .10, .93, 4.4, px*80, P.near, (scene.cond==="snow"?1:0));
    // cottages on near ridge
    const hs=[0.2,0.52,0.83];
    for(let i=0;i<3;i++){
      const fx=hs[i]*6;
      const gy=ridge(fx,77,.10*H,.93*H,4.4)+px*80*0.02;
      house(hs[i]*W+px*4, gy+4, H/540*(0.9+hash(i*9)*.35), P, w, tNow);
    }
    spawnParticles(scene,w,dt);
    drawWeather(P,scene,w,px,dt);
    drawFog(P,w,tNow,px*W);
    drawWisps(P,w,tNow);
    drawLightning(P,scene,w,dt,tNow);
    drawSpotlights(P,w,night,tNow);
    drawVignette(P,night);
    drawCurtain(openP);
    requestAnimationFrame(frame);
  }
  const ease=t=>t<.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  requestAnimationFrame(frame);
  return ()=>window.removeEventListener("resize",resize);
}

/* =================================================================
   REACT UI
   ================================================================= */
function Knob({k, name, color, hint, value, onChange}){
  return (
    <div className="knob">
      <label><span style={{color}}>{name}</span><span className="val">{value}%</span></label>
      <input type="range" min="0" max="100" value={value}
        style={{"--accent":color,"--fill":value+"%"}}
        onChange={e=>onChange(k, +e.target.value)}/>
      <div className="hint">{hint}</div>
    </div>
  );
}

function Typewriter({text}){
  const [n,setN]=useState(0);
  useEffect(()=>{ setN(0); const id=setInterval(()=>setN(v=>{ if(v>=text.length){clearInterval(id);return v;} return v+1; }),18); return ()=>clearInterval(id); },[text]);
  return <span>{text.slice(0,n)}<span className="caret"/></span>;
}

function App(){
  const canvasRef=useRef(null);
  const [moods,setMoods]=useState({cozy:20,eerie:15,heroic:20});
  const [night,setNight]=useState(true);
  const [sceneIndex,setSceneIndex]=useState(0);
  const [auto,setAuto]=useState(true);
  const sceneRef=useRef(sceneIndex); sceneRef.current=sceneIndex;

  const stateRef=useRef({
    moods, night, sceneIndex,
    mouse:{x:.5,y:.5},
    curtain:{open:0,target:1,pending:null},
    setScene:(i)=>setSceneIndex(i),
  });
  stateRef.current.moods=moods;
  stateRef.current.night=night;
  stateRef.current.sceneIndex=sceneIndex;
  useEffect(()=>makeEngine(canvasRef.current, stateRef),[]);

  const goScene=(i)=>{
    const c=stateRef.current.curtain;
    if(c.open>0.05 && c.target!==0){ c.target=0; c.pending=(i+FORECAST.length)%FORECAST.length; }
    else setSceneIndex((i+FORECAST.length)%FORECAST.length);
  };

  useEffect(()=>{
    if(!auto) return;
    const id=setInterval(()=>{
      const c=stateRef.current.curtain;
      if(c.target===1 && c.pending===null) goScene(sceneRef.current+1);
    },14000);
    return ()=>clearInterval(id);
  },[auto]);

  const dom = useMemo(()=>{
    const e=Object.entries(moods).filter(([k])=>MOOD_K.includes(k)).sort((a,b)=>b[1]-a[1]);
    return e[0][1]>=35 ? e[0][0] : "neutral";
  },[moods]);

  const scene=FORECAST[sceneIndex];
  const subtitle=`Scene ${sceneIndex+1} · ${scene.time} · ${scene.label} — ${narrate(scene,dom)}`;

  return (
    <div>
      <div className="marquee">
        <div className="rule"/>
        <div className="bulbs">{Array.from({length:11},(_,i)=><span key={i} className="bulb" style={{animationDelay:(i*0.18)+"s"}}/>)}</div>
        <div className="rule r"/>
      </div>
      <h1>WEATHER THEATRE</h1>
      <div className="tagline">one forecast · six moods · every night the same sky, staged differently</div>

      <div className="frame">
        <div className="stage"
          onMouseMove={e=>{const r=e.currentTarget.getBoundingClientRect();
            stateRef.current.mouse={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}}
          onMouseLeave={()=>stateRef.current.mouse={x:.5,y:.5}}>
          <canvas ref={canvasRef}/>
          <div className="badge">{DOM_NAME[dom].toUpperCase()} READING · {night?"NIGHT":"MATINÉE"} · {scene.temp}°C · WIND {scene.wind}</div>
          <div className="playbtn">
            <button className={"pbtn "+(auto?"active":"")} onClick={()=>setAuto(a=>!a)}>{auto?"⏸ AUTO":"▶ AUTO"}</button>
            <button className="pbtn" onClick={()=>{const c=stateRef.current.curtain; c.target=0; c.pending=sceneRef.current;}}>⟲ REPLAY CURTAIN</button>
          </div>
          <div className="subtitle"><div className="line"><Typewriter text={subtitle}/></div></div>
        </div>
      </div>

      <div className="controls">
        <Knob k="cozy"   name="Cosy"   color="#f0a858" hint="hearth-light in the windows, embers, amber dusk" value={moods.cozy}   onChange={(kk,v)=>setMoods(m=>({...m,[kk]:v}))}/>
        <Knob k="eerie"  name="Eerie"  color="#5fd6c0" hint="low fog, bare trees, wandering lights, storms"     value={moods.eerie}  onChange={(kk,v)=>setMoods(m=>({...m,[kk]:v}))}/>
        <Knob k="heroic" name="Heroic" color="#ffd76e" hint="god-rays, golden rim light, sweeping spotlights"    value={moods.heroic} onChange={(kk,v)=>setMoods(m=>({...m,[kk]:v}))}/>
      </div>

      <div className="foot">
        <div className="scenes">
          {FORECAST.map((s,i)=>(
            <button key={i} className={"chip "+(i===sceneIndex?"on":"")} onClick={()=>goScene(i)} title={s.label}>
              {s.time} {s.cond==="rain"?"🌧":s.cond==="snow"?"❄":s.cond==="storm"?"⛈":s.cond==="fog"?"🌫":s.cond==="clear"?"☀":"☁"}
            </button>
          ))}
        </div>
        <div className="nav">
          <button className="pbtn" onClick={()=>goScene(sceneIndex-1)}>‹ PREV</button>
          <button className={"pbtn "+(night?"":"active")} onClick={()=>setNight(false)}>MATINÉE</button>
          <button className={"pbtn "+(night?"active":"")} onClick={()=>setNight(true)}>NIGHT</button>
          <button className="pbtn" onClick={()=>goScene(sceneIndex+1)}>NEXT ›</button>
        </div>
      </div>

      <div className="credit">no data was harmed in this production · the forecast is entirely make-believe</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
