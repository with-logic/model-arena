<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Customer Journey Flow</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
    --line:#e2e8f0; --accent:#4f46e5; --accent-soft:#eef2ff; --danger:#e11d48;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);
    --shadow-lg:0 12px 32px rgba(15,23,42,.14);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 316px;
    height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer}

  /* ---------- Header ---------- */
  header{
    grid-column:1/-1;display:flex;align-items:center;gap:16px;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
  .logo{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;
    background:linear-gradient(135deg,#6366f1,#06b6d4);box-shadow:0 4px 12px rgba(99,102,241,.35);
  }
  .logo svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  .brand p{margin:1px 0 0;color:var(--ink-3);font-size:12px;white-space:nowrap}
  .toolbar{display:flex;gap:6px;align-items:center}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
    border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--ink-2);
    font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;user-select:none;
    transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
  }
  .btn:hover{background:#f8fafc;color:var(--ink);border-color:#cbd5e1}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.4;cursor:default;background:#fff;color:var(--ink-2);border-color:var(--line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3)}
  .btn.primary:hover{background:#4338ca;border-color:#4338ca;color:#fff}
  .btn.danger:hover{color:var(--danger);border-color:#fecdd3;background:#fff1f2}
  .btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Main column ---------- */
  #main{display:flex;flex-direction:column;min-width:0;min-height:0}
  #stageWrap{position:relative;flex:1;min-height:0}
  #viewport{
    position:absolute;inset:0;overflow:auto;
    background-color:var(--bg);
    background-image:radial-gradient(#cbd5e1 1.1px,transparent 1.1px);
    background-size:22px 22px;
  }
  #canvas{position:relative;touch-action:none}
  .links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:#94a3b8;stroke-width:2;transition:stroke .15s}
  .link:hover .edge{stroke:#64748b}
  .link.sel .edge{stroke:var(--accent);stroke-width:2.5}
  .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
  .ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6}
  .edge-label{
    font-size:11.5px;font-weight:550;fill:#475569;pointer-events:none;
    paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;
  }

  /* ---------- Stage cards ---------- */
  .node{
    position:absolute;width:232px;height:132px;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px 12px;
    cursor:grab;user-select:none;touch-action:none;
    transition:box-shadow .15s,border-color .15s;
  }
  .node:hover{box-shadow:var(--shadow-lg)}
  .node.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:3}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.16),var(--shadow-lg)}
  .node.drop{border-color:var(--accent);box-shadow:0 0 0 5px rgba(79,70,229,.22),var(--shadow-lg)}
  body.connecting .node{cursor:crosshair}
  .node-bar{position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px}
  .node-top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
  .node-status{color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px;letter-spacing:.04em}
  .node-title{
    margin-top:7px;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border-radius:5px;
  }
  .node-title.muted{color:var(--ink-3);font-weight:500}
  .node-title[contenteditable="true"]{cursor:text;user-select:text;background:#f8fafc;box-shadow:0 0 0 2px var(--accent-soft);padding:0 3px;margin-left:-3px;white-space:normal}
  .node-touch{
    margin-top:3px;color:var(--ink-2);font-size:12.5px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .node-touch.muted{color:var(--ink-3)}
  .node-foot{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:center;gap:9px}
  .mood{font-size:16px;line-height:1}
  .meter{flex:1;height:5px;border-radius:9px;background:#f1f5f9;position:relative;overflow:hidden}
  .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .2s,background .2s}

  .port{
    position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
    background:#fff;border:2px solid #94a3b8;z-index:2;
    transition:transform .12s,border-color .12s,background .12s;
  }
  .port.in{left:-8px;cursor:default}
  .port.out{right:-8px;cursor:crosshair}
  .node:hover .port.out,.node.selected .port.out,.node.drop .port.out{border-color:var(--accent)}
  .port.out:hover{transform:scale(1.25);background:var(--accent)}

  /* ---------- Overlays ---------- */
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
  #empty.show{display:flex}
  #empty > div{
    pointer-events:auto;text-align:center;padding:30px 34px;border-radius:18px;
    background:rgba(255,255,255,.92);box-shadow:var(--shadow-lg);max-width:360px;
  }
  #empty h2{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
  #empty p{margin:0 0 16px;color:var(--ink-2);line-height:1.5}
  #hint,#toast{
    position:absolute;left:50%;padding:8px 14px;border-radius:999px;
    background:#0f172a;color:#fff;font-size:12.5px;pointer-events:none;
    transition:opacity .2s,transform .2s;opacity:0;white-space:nowrap;z-index:6;
  }
  #hint{top:14px;transform:translate(-50%,-6px)}
  #hint.show{opacity:1;transform:translate(-50%,0)}
  #toast{bottom:16px;transform:translate(-50%,8px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  body.connecting #viewport{cursor:crosshair}

  /* ---------- Emotional arc panel ---------- */
  .curve{
    flex:none;height:184px;background:var(--panel);border-top:1px solid var(--line);
    display:flex;flex-direction:column;padding:12px 18px 8px;
  }
  .curve-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .curve h2{margin:0;font-size:13px;font-weight:650;letter-spacing:-.005em}
  .curve-head p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
  #curveWrap{flex:1;min-height:0;position:relative}
  #curve{position:absolute;inset:0;display:block;overflow:visible}
  .axis{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
  .axis-label{font-size:10.5px;fill:var(--ink-3);font-weight:500}
  .arc-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
  .arc-dot{cursor:pointer}
  .arc-dot circle{stroke:#fff;stroke-width:3}
  .arc-emoji{font-size:14px}
  .arc-name{font-size:11.5px;fill:var(--ink-2);font-weight:550}

  /* ---------- Inspector ---------- */
  #inspector{
    background:var(--panel);border-left:1px solid var(--line);overflow:auto;
    padding:18px 18px 22px;display:flex;flex-direction:column;gap:16px;min-height:0;
  }
  .insp-kicker{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .field{display:flex;flex-direction:column;gap:6px}
  .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:550;color:var(--ink-2)}
  .lbl em{font-style:normal;font-weight:550;color:var(--ink)}
  input[type=text],textarea{
    font:inherit;font-size:13.5px;width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;background:#fff;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus,textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  textarea{resize:vertical;line-height:1.45;min-height:84px}
  input[type=range]{accent-color:var(--accent);width:100%;margin:4px 0 0}
  .range-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;transition:transform .12s}
  .swatch:hover{transform:scale(1.08)}
  .swatch.on{box-shadow:0 0 0 2px var(--ink)}
  .muted{color:var(--ink-3);font-size:12.5px;margin:0;line-height:1.45}
  .conn-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;
  }
  .link-btn{background:none;border:0;color:var(--accent);font-weight:600;font-size:12.5px;padding:0}
  .insp-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .insp-foot .btn{width:100%;justify-content:center;height:34px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stats div{border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:3px}
  .stats b{font-size:20px;letter-spacing:-.02em;line-height:1}
  .stats span{font-size:11px;color:var(--ink-3)}
  .tip{background:var(--accent-soft);color:#3730a3;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55}
  .tip b{font-weight:650}
  .outline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
  .outline button{
    width:100%;display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;
    border-radius:9px;padding:7px 8px;text-align:left;font:inherit;font-size:13px;color:var(--ink);
  }
  .outline button:hover{background:#f8fafc;border-color:var(--line)}
  .outline i{width:9px;height:9px;border-radius:50%;flex:none}
  .outline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outline em{font-style:normal}
  .route{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .route-chip{border-left:3px solid var(--c);padding:4px 9px;background:#f8fafc;border-radius:7px;font-weight:550;font-size:13px}

  @media (max-width:860px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
    #inspector{border-left:0;border-top:1px solid var(--line);max-height:240px}
    .brand p{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="5.5" r="2.5"/><circle cx="19" cy="18.5" r="2.5"/><path d="M7.5 5.5H12a4 4 0 0 1 4 4v5"/></svg>
    </div>
    <div>
      <h1>Customer Journey Flow</h1>
      <p>From first awareness to purchase</p>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="add" title="Add a stage at the end of the journey">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add stage
    </button>
    <button class="btn" id="arrange" title="Lay stages out in a single row">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="5" height="8" rx="1.5"/><rect x="10" y="8" width="5" height="8" rx="1.5"/><rect x="17" y="8" width="4" height="8" rx="1.5"/></svg>Auto-arrange
    </button>
    <button class="btn" id="undo" disabled title="Undo (Ctrl/Cmd+Z)">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo
    </button>
    <span class="sep"></span>
    <label class="btn" for="importFile" title="Import a journey JSON file">
      <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0-4 4m4-4 4 4M4 17v3h16v-3"/></svg>Import
    </label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn" id="export" title="Download the journey as JSON">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Export
    </button>
    <button class="btn danger" id="reset" title="Restore the sample journey">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset
    </button>
  </div>
</header>

<div id="main">
  <div id="stageWrap">
    <div id="viewport">
      <div id="canvas">
        <svg id="linkSvg" class="links" aria-label="Connections between stages">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
            </marker>
            <marker id="arrow-sel" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#4f46e5"/>
            </marker>
            <marker id="arrow-ghost" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#4f46e5"/>
            </marker>
          </defs>
          <g id="linkLayer"></g>
          <path id="ghost" class="ghost" marker-end="url(#arrow-ghost)" style="display:none"/>
        </svg>
      </div>
    </div>

    <div id="empty">
      <div>
        <h2>Map your customer's journey</h2>
        <p>Start with the first moment a customer notices you, then add each step on the way to purchase.</p>
        <button class="btn primary" id="emptyAdd">Add first stage</button>
      </div>
    </div>

    <div id="hint">Click another stage to connect · Esc to cancel</div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <section class="curve" aria-label="Emotional arc">
    <div class="curve-head">
      <div>
        <h2>Emotional arc</h2>
        <p>Customer sentiment at each stage, in journey order</p>
      </div>
    </div>
    <div id="curveWrap"><svg id="curve" role="img" aria-label="Sentiment chart"></svg></div>
  </section>
</div>

<aside id="inspector" aria-label="Details"></aside>

<script>
(() => {
  'use strict';

  /* ---------- Constants & helpers ---------- */
  const W = 232, H = 132;
  const KEY = 'customer-journey-flow:v1';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const COLORS = ['#6366f1', '#0ea5e9', '#14b8a6', '#f59e0b', '#f43f5e', '#8b5cf6'];
  const MOODS = [
    { e: '😣', label: 'Frustrated', c: '#e11d48' },
    { e: '😕', label: 'Uneasy',     c: '#f97316' },
    { e: '😐', label: 'Neutral',    c: '#eab308' },
    { e: '🙂', label: 'Interested', c: '#84cc16' },
    { e: '😄', label: 'Delighted',  c: '#10b981' },
  ];

  const $ = (sel) => document.querySelector(sel);
  const uid = () => 's' + Math.random().toString(36).slice(2, 9);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const moodOf = (v) => MOODS[clamp(Math.round(v), -2, 2) + 2];
  const trunc = (str, n) => (str.length > n ? str.slice(0, n - 1) + '…' : str);
  const esc = (str) => String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const svgEl = (tag, attrs = {}) => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k of Object.keys(attrs)) el.setAttribute(k, attrs[k]);
    return el;
  };
  const curvePath = (x1, y1, x2, y2) => {
    const d = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M${x1} ${y1} C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}`;
  };

  /* ---------- Data ---------- */
  function sampleState() {
    const rows = [
      ['Awareness',     'Social video ad',      'Scrolling feeds; first hears about the brand from a friend or an ad.', 0,  60, 150],
      ['Interest',      'Homepage & blog',      'Reads a few articles and wonders whether this solves the problem.',    1, 330, 150],
      ['Consideration', 'Comparison guide',     'Compares alternatives, skims reviews, checks the feature list.',         0, 600, 150],
      ['Trial',         'Free trial sign-up',   'Signs up for a trial and gets a first win within minutes.',              2, 870,  70],
      ['Hesitation',    'Pricing page',         'Price feels high for a team; wants a discount or a sales call.',        -1, 870, 250],
      ['Purchase',      'Checkout',             'Completes checkout after a clear annual-plan offer.',                   2,1140, 150],
    ];
    const stages = rows.map(([name, touchpoint, detail, sentiment, x, y], i) => ({
      id: uid(), name, touchpoint, detail, sentiment, color: COLORS[i], x, y,
    }));
    const edges = [
      [0, 1, 'Clicks through'], [1, 2, 'Reads reviews'], [2, 3, 'Starts trial'],
      [2, 4, 'Views pricing'], [3, 5, 'Upgrades'], [4, 5, 'Accepts offer'],
    ];
    const links = edges.map(([a, b, label]) => ({ id: uid(), from: stages[a].id, to: stages[b].id, label }));
    return { stages, links };
  }

  function normalize(d) {
    if (!d || !Array.isArray(d.stages)) return null;
    const stages = d.stages.map((s, i) => ({
      id: String(s.id || uid()),
      name: String(s.name ?? 'Untitled stage').slice(0, 80),
      touchpoint: String(s.touchpoint ?? '').slice(0, 120),
      detail: String(s.detail ?? '').slice(0, 600),
      sentiment: clamp(Math.round(Number(s.sentiment)) || 0, -2, 2),
      color: /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : COLORS[i % COLORS.length],
      x: Math.max(0, Number(s.x) || 0),
      y: Math.max(0, Number(s.y) || 0),
    }));
    const ids = new Set(stages.map((s) => s.id));
    const links = (Array.isArray(d.links) ? d.links : [])
      .filter((l) => ids.has(l.from) && ids.has(l.to) && l.from !== l.to)
      .map((l) => ({ id: String(l.id || uid()), from: l.from, to: l.to, label: String(l.label ?? '').slice(0, 60) }));
    return { stages, links };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    } catch {
      return null;
    }
  }

  let state = load() || sampleState();
  let selected = null;          // { type: 'node' | 'link', id }
  let ptr = null;               // active pointer gesture: move a node or drag a new link
  let connectFrom = null;       // click-to-connect origin stage id
  let hoverId = null;           // stage currently highlighted as a drop target
  let pendingBefore = null;     // snapshot taken when a text/inspector edit begins
  const undoStack = [];
  const nodeEls = new Map();

  const snapshot = () => JSON.stringify(state);
  const byId = (id) => state.stages.find((s) => s.id === id) || null;
  const nameOf = (id) => (byId(id) ? byId(id).name || 'Untitled stage' : 'Untitled stage');

  /* ---------- DOM refs ---------- */
  const canvas = $('#canvas');
  const linkSvg = $('#linkSvg');
  const linkLayer = $('#linkLayer');
  const ghost = $('#ghost');
  const viewport = $('#viewport');
  const inspector = $('#inspector');

  /* ---------- Persistence & history ---------- */
  function save() {
    try { localStorage.setItem(KEY, snapshot()); } catch { /* storage full or disabled */ }
  }

  function remember(snap = snapshot()) {
    if (undoStack[undoStack.length - 1] === snap) return;
    undoStack.push(snap);
    if (undoStack.length > 100) undoStack.shift();
    updateUndo();
  }

  function beginEdit() { pendingBefore = snapshot(); }

  function endEdit() {
    if (pendingBefore === null) return;
    const before = pendingBefore;
    pendingBefore = null;
    if (before !== snapshot()) {
      remember(before);
      save();
      updateUndo();
    }
  }

  function mutate(fn) {
    endEdit();
    remember();
    fn();
    afterChange();
  }

  function afterChange() {
    save();
    renderAll();
  }

  function undo() {
    endEdit();
    const snap = undoStack.pop();
    if (!snap) return;
    state = JSON.parse(snap);
    save();
    renderAll();
    toast('Undid last change');
  }

  function updateUndo() {
    $('#undo').disabled = undoStack.length === 0;
  }

  /* ---------- Rendering ---------- */
  function renderAll() {
    if (selected) {
      const exists = selected.type === 'node'
        ? !!byId(selected.id)
        : state.links.some((l) => l.id === selected.id);
      if (!exists) selected = null;
    }
    renderNodes();
    renderLinks();
    renderInspector();
    renderCurve();
    updateCanvasSize();
    updateUndo();
    $('#empty').classList.toggle('show', state.stages.length === 0);
  }

  function renderNodes() {
    const keep = new Set();
    state.stages.forEach((s) => {
      let el = nodeEls.get(s.id);
      if (!el) {
        el = createNodeEl(s.id);
        nodeEls.set(s.id, el);
        canvas.append(el);
      }
      keep.add(s.id);
      updateNodeEl(el, s);
    });
    for (const [id, el] of [...nodeEls]) {
      if (!keep.has(id)) {
        el.remove();
        nodeEls.delete(id);
      }
    }
  }

  function createNodeEl(id) {
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = id;
    el.innerHTML = `
      <div class="node-bar"></div>
      <div class="node-top"><span class="node-step"></span><span class="node-status"></span></div>
      <div class="node-title" spellcheck="false"></div>
      <div class="node-touch"></div>
      <div class="node-foot"><span class="mood"></span><div class="meter"><i></i></div></div>
      <span class="port in" title="Incoming"></span>
      <span class="port out" title="Drag onto another stage to connect"></span>`;
    const title = el.querySelector('.node-title');
    title.addEventListener('dblclick', () => startTitleEdit(title));
    title.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        title.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        const s = byId(id);
        title.textContent = s ? s.name : '';
        title.blur();
      }
    });
    title.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text.replace(/\s+/g, ' '));
    });
    title.addEventListener('blur', () => finishTitleEdit(title, id));
    return el;
  }

  function updateNodeEl(el, s) {
    const index = state.stages.indexOf(s);
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.classList.toggle('selected', selected?.type === 'node' && selected.id === s.id);
    el.querySelector('.node-bar').style.background = s.color;
    el.querySelector('.node-step').textContent = `Step ${String(index + 1).padStart(2, '0')}`;

    const hasIn = state.links.some((l) => l.to === s.id);
    const hasOut = state.links.some((l) => l.from === s.id);
    el.querySelector('.node-status').textContent = !hasIn ? 'Start' : !hasOut ? 'Exit' : '';

    const title = el.querySelector('.node-title');
    if (title.contentEditable !== 'true') {
      title.textContent = s.name || 'Untitled stage';
      title.classList.toggle('muted', !s.name);
    }

    const touch = el.querySelector('.node-touch');
    touch.textContent = s.touchpoint || 'No touchpoint yet';
    touch.classList.toggle('muted', !s.touchpoint);

    const m = moodOf(s.sentiment);
    const mood = el.querySelector('.mood');
    mood.textContent = m.e;
    mood.title = m.label;
    const fill = el.querySelector('.meter i');
    fill.style.width = ((s.sentiment + 2) / 4) * 100 + '%';
    fill.style.background = m.c;
  }

  function renderLinks() {
    linkLayer.innerHTML = '';
    for (const l of state.links) {
      const a = byId(l.from);
      const b = byId(l.to);
      if (!a || !b) continue;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      const d = curvePath(x1, y1, x2, y2);
      const isSel = selected?.type === 'link' && selected.id === l.id;
      const group = svgEl('g', { class: 'link' + (isSel ? ' sel' : '') });
      group.append(svgEl('path', { d, class: 'edge', 'marker-end': `url(#${isSel ? 'arrow-sel' : 'arrow'})` }));
      group.append(svgEl('path', { d, class: 'hit', 'data-link': l.id }));
      if (l.label) {
        const t = svgEl('text', {
          x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 10, class: 'edge-label', 'text-anchor': 'middle',
        });
        t.textContent = l.label;
        group.append(t);
      }
      linkLayer.append(group);
    }
  }

  function updateCanvasSize() {
    let maxX = 0, maxY = 0;
    state.stages.forEach((s) => {
      maxX = Math.max(maxX, s.x + W);
      maxY = Math.max(maxY, s.y + H);
    });
    const w = Math.max(viewport.clientWidth, maxX + 200);
    const h = Math.max(viewport.clientHeight, maxY + 200);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    linkSvg.setAttribute('width', w);
    linkSvg.setAttribute('height', h);
  }

  function renderCurve() {
    const wrap = $('#curveWrap');
    const out = $('#curve');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    out.setAttribute('width', w);
    out.setAttribute('height', h);
    out.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const n = state.stages.length;
    if (!n || !w) {
      out.innerHTML = '';
      return;
    }
    const PL = 64, PR = 40, PT = 30, PB = 34;
    const xAt = (i) => (n === 1 ? w / 2 : PL + (i * (w - PL - PR)) / (n - 1));
    const yAt = (v) => PT + ((2 - v) / 4) * (h - PT - PB);
    const pts = state.stages.map((s, i) => ({ s, x: xAt(i), y: yAt(s.sentiment) }));

    let line = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < n; i++) {
      const a = pts[i - 1], b = pts[i], mx = (a.x + b.x) / 2;
      line += ` C${mx} ${a.y} ${mx} ${b.y} ${b.x} ${b.y}`;
    }
    const base = yAt(0);
    const area = `${line} L${pts[n - 1].x} ${base} L${pts[0].x} ${base} Z`;

    out.innerHTML = `
      <defs>
        <linearGradient id="arcFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
          <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line class="axis" x1="${PL - 16}" x2="${w - PR + 16}" y1="${base}" y2="${base}"/>
      <text class="axis-label" x="0" y="${yAt(2) + 4}">Delighted</text>
      <text class="axis-label" x="0" y="${yAt(-2) + 4}">Frustrated</text>
      <path d="${area}" fill="url(#arcFill)"/>
      <path class="arc-line" d="${line}"/>
      ${pts.map((p) => `
        <text class="arc-emoji" x="${p.x}" y="${p.y - 16}" text-anchor="middle">${moodOf(p.s.sentiment).e}</text>
        <g class="arc-dot" data-id="${p.s.id}"><circle cx="${p.x}" cy="${p.y}" r="7" fill="${p.s.color}"/></g>
        <text class="arc-name" x="${p.x}" y="${h - 10}" text-anchor="middle">${esc(trunc(p.s.name || 'Untitled', 16))}</text>
      `).join('')}`;
  }

  function renderInspector() {
    const s = selected?.type === 'node' ? byId(selected.id) : null;
    const l = selected?.type === 'link' ? state.links.find((x) => x.id === selected.id) : null;
    if (s) renderNodeInspector(s);
    else if (l) renderLinkInspector(l);
    else renderOverview();
  }

  function renderNodeInspector(s) {
    const index = state.stages.indexOf(s);
    const m = moodOf(s.sentiment);
    const outs = state.links.filter((l) => l.from === s.id);
    const incoming = state.links.filter((l) => l.to === s.id).length;
    inspector.innerHTML = `
      <div class="insp-kicker"><span class="dot" style="background:${s.color}"></span>Stage ${index + 1} of ${state.stages.length}</div>
      <label class="field"><span class="lbl">Name</span>
        <input type="text" id="f-name" maxlength="80" value="${esc(s.name)}"></label>
      <label class="field"><span class="lbl">Touchpoint</span>
        <input type="text" id="f-touch" maxlength="120" placeholder="e.g. Pricing page" value="${esc(s.touchpoint)}"></label>
      <label class="field"><span class="lbl">What the customer is doing or feeling</span>
        <textarea id="f-detail" rows="4" maxlength="600" placeholder="Describe the mindset, goal, or friction…">${esc(s.detail)}</textarea></label>
      <div class="field">
        <span class="lbl">Sentiment <em id="f-mood-label">${m.e} ${m.label}</em></span>
        <input type="range" id="f-mood" min="-2" max="2" step="1" value="${s.sentiment}">
        <div class="range-scale"><span>Frustrated</span><span>Neutral</span><span>Delighted</span></div>
      </div>
      <div class="field">
        <span class="lbl">Color</span>
        <div class="swatches">
          ${COLORS.map((c) => `<button class="swatch${c === s.color ? ' on' : ''}" data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}
        </div>
      </div>
      <div class="field">
        <span class="lbl">Outgoing connections</span>
        ${outs.length
          ? outs.map((l) => `
              <div class="conn-row">
                <span>→ ${esc(nameOf(l.to))}${l.label ? ` <span class="muted">· ${esc(l.label)}</span>` : ''}</span>
                <button class="link-btn" data-select-link="${l.id}">Edit</button>
              </div>`).join('')
          : `<p class="muted">None yet. Drag from this stage's right port onto another stage.</p>`}
        ${incoming ? `<p class="muted">${incoming} incoming</p>` : ''}
      </div>
      <div class="insp-foot"><button class="btn danger" data-action="delete">Delete stage</button></div>`;

    const name = $('#f-name'), touch = $('#f-touch'), detail = $('#f-detail'), mood = $('#f-mood');
    [name, touch, detail, mood].forEach((inp) => {
      inp.addEventListener('focus', beginEdit);
      inp.addEventListener('blur', endEdit);
    });
    name.addEventListener('input', () => { s.name = name.value; touchStage(s.id); });
    touch.addEventListener('input', () => { s.touchpoint = touch.value; touchStage(s.id); });
    detail.addEventListener('input', () => { s.detail = detail.value; save(); });
    mood.addEventListener('input', () => {
      s.sentiment = Number(mood.value);
      const mm = moodOf(s.sentiment);
      $('#f-mood-label').textContent = `${mm.e} ${mm.label}`;
      touchStage(s.id);
    });
  }

  function renderLinkInspector(l) {
    const a = byId(l.from), b = byId(l.to);
    inspector.innerHTML = `
      <div class="insp-kicker">Connection</div>
      <div class="route">
        <span class="route-chip" style="--c:${a.color}">${esc(a.name)}</span>
        <span class="muted">→</span>
        <span class="route-chip" style="--c:${b.color}">${esc(b.name)}</span>
      </div>
      <label class="field"><span class="lbl">Label</span>
        <input type="text" id="f-label" maxlength="60" placeholder="e.g. Starts free trial" value="${esc(l.label)}"></label>
      <p class="muted">Select a connection on the canvas and press Delete to remove it.</p>
      <div class="insp-foot"><button class="btn danger" data-action="delete">Delete connection</button></div>`;

    const label = $('#f-label');
    label.addEventListener('focus', beginEdit);
    label.addEventListener('blur', endEdit);
    label.addEventListener('input', () => { l.label = label.value; renderLinks(); save(); });
  }

  function renderOverview() {
    const n = state.stages.length;
    const avg = n ? state.stages.reduce((t, s) => t + s.sentiment, 0) / n : 0;
    inspector.innerHTML = `
      <div class="insp-kicker">Journey overview</div>
      <div class="stats">
        <div><b>${n}</b><span>Stages</span></div>
        <div><b>${state.links.length}</b><span>Links</span></div>
        <div><b>${n ? moodOf(avg).e : '—'}</b><span>${n ? 'Avg ' + avg.toFixed(1) : 'Avg'}</span></div>
      </div>
      <div class="tip">
        Drag from a stage's <b>right port</b> onto another stage to connect them.
        Double-click a name to rename it. Drag cards to rearrange.
      </div>
      <div class="field">
        <span class="lbl">Stages in order</span>
        ${n
          ? `<ol class="outline">${state.stages.map((s, i) => {
              const m = moodOf(s.sentiment);
              return `<li><button data-select-node="${s.id}"><i style="background:${s.color}"></i>
                <span>${i + 1}. ${esc(s.name || 'Untitled stage')}</span><em title="${m.label}">${m.e}</em></button></li>`;
            }).join('')}</ol>`
          : `<p class="muted">No stages yet.</p>`}
      </div>`;
  }

  /* ---------- Stage & link operations ---------- */
  function touchStage(id) {
    save();
    const s = byId(id);
    const el = nodeEls.get(id);
    if (s && el) updateNodeEl(el, s);
    renderCurve();
  }

  function startTitleEdit(title) {
    const id = title.closest('.node').dataset.id;
    if (!byId(id)) return;
    beginEdit();
    title.contentEditable = 'true';
    title.focus();
    const range = document.createRange();
    range.selectNodeContents(title);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function finishTitleEdit(title, id) {
    if (title.contentEditable !== 'true') return;
    title.contentEditable = 'false';
    const s = byId(id);
    if (!s) { endEdit(); return; }
    s.name = title.textContent.replace(/\s+/g, ' ').trim() || 'Untitled stage';
    title.textContent = s.name;
    endEdit();
    touchStage(id);
    const fieldName = $('#f-name');
    if (fieldName && document.activeElement !== fieldName) fieldName.value = s.name;
  }

  function addStage() {
    let created = null;
    mutate(() => {
      const last = state.stages[state.stages.length - 1];
      created = {
        id: uid(),
        name: 'New stage',
        touchpoint: '',
        detail: '',
        sentiment: 0,
        color: COLORS[state.stages.length % COLORS.length],
        x: last ? last.x + 270 : 80,
        y: last ? last.y : 150,
      };
      state.stages.push(created);
    });
    focusNode(created.id);
    const input = $('#f-name');
    if (input) { input.focus(); input.select(); }
  }

  function focusNode(id) {
    select({ type: 'node', id });
    nodeEls.get(id)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  function createLink(from, to) {
    if (!from || !to || from === to) return;
    if (state.links.some((l) => l.from === from && l.to === to)) {
      toast('Those stages are already connected');
      return;
    }
    mutate(() => {
      const link = { id: uid(), from, to, label: '' };
      state.links.push(link);
      selected = { type: 'link', id: link.id };
    });
  }

  function deleteSelected() {
    if (!selected) return;
    endEdit();
    const target = selected;
    mutate(() => {
      if (target.type === 'node') {
        state.stages = state.stages.filter((s) => s.id !== target.id);
        state.links = state.links.filter((l) => l.from !== target.id && l.to !== target.id);
      } else {
        state.links = state.links.filter((l) => l.id !== target.id);
      }
      selected = null;
    });
    toast(target.type === 'node' ? 'Stage deleted' : 'Connection deleted');
  }

  function select(sel) {
    endEdit();
    selected = sel;
    renderNodes();
    renderLinks();
    renderInspector();
  }

  function autoArrange() {
    if (!state.stages.length) return;
    mutate(() => {
      state.stages.forEach((s, i) => { s.x = 60 + i * 270; s.y = 150; });
    });
    viewport.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
    toast('Arranged in journey order');
  }

  function resetSample() {
    if (!confirm('Replace the current journey with the sample?')) return;
    select(null);
    mutate(() => { state = sampleState(); });
    toast('Sample journey restored');
  }

  /* ---------- Import / export ---------- */
  function exportJourney() {
    const payload = { app: 'Customer Journey Flow', version: 1, stages: state.stages, links: state.links };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'customer-journey.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Journey exported as JSON');
  }

  async function importFile(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = normalize(JSON.parse(await file.text()));
      if (!data) throw new Error('invalid');
      select(null);
      mutate(() => { state = data; });
      toast('Journey imported');
    } catch {
      toast('That file is not a valid journey');
    }
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* ---------- Connection geometry & drop targets ---------- */
  function setConnecting(id) {
    connectFrom = id;
    document.body.classList.toggle('connecting', !!id);
    $('#hint').classList.toggle('show', !!id);
    if (!id) {
      ghost.style.display = 'none';
      setHover(null);
    }
  }
  const cancelConnect = () => setConnecting(null);

  function setHover(id) {
    if (hoverId === id) return;
    if (hoverId) nodeEls.get(hoverId)?.classList.remove('drop');
    hoverId = id;
    if (id) nodeEls.get(id)?.classList.add('drop');
  }

  function toCanvas(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: cx - r.left, y: cy - r.top };
  }

  function findTargetAt(cx, cy, exclude) {
    const pad = 12;
    for (const s of state.stages) {
      if (s.id === exclude) continue;
      const r = nodeEls.get(s.id)?.getBoundingClientRect();
      if (r && cx >= r.left - pad && cx <= r.right + pad && cy >= r.top - pad && cy <= r.bottom + pad) return s;
    }
    return null;
  }

  function updateGhost(cx, cy) {
    const fromId = ptr?.type === 'link' ? ptr.from : connectFrom;
    const from = fromId ? byId(fromId) : null;
    if (!from) {
      ghost.style.display = 'none';
      return;
    }
    const p = toCanvas(cx, cy);
    ghost.setAttribute('d', curvePath(from.x + W, from.y + H / 2, p.x, p.y));
    ghost.style.display = '';
    setHover(findTargetAt(cx, cy, fromId)?.id ?? null);
  }

  /* ---------- Pointer interaction ---------- */
  function onCanvasDown(e) {
    if (e.button !== 0) return;
    const port = e.target.closest('.port.out');
    const nodeEl = e.target.closest('.node');
    const hit = e.target.closest('.hit');

    if (connectFrom) {
      const origin = connectFrom;
      const targetId = nodeEl ? nodeEl.dataset.id : null;
      cancelConnect();
      if (!targetId) return;
      if (targetId !== origin) {
        createLink(origin, targetId);
        return;
      }
    }

    if (port) {
      e.preventDefault();
      ptr = { type: 'link', from: port.closest('.node').dataset.id, sx: e.clientX, sy: e.clientY, moved: false };
      return;
    }
    if (nodeEl) {
      if (e.target.closest('[contenteditable="true"]')) return;
      const id = nodeEl.dataset.id;
      const s = byId(id);
      if (!s) return;
      select({ type: 'node', id });
      ptr = {
        type: 'move', id, sx: e.clientX, sy: e.clientY,
        ox: s.x, oy: s.y, moved: false, before: snapshot(),
      };
      return;
    }
    if (hit) {
      select({ type: 'link', id: hit.getAttribute('data-link') });
      return;
    }
    select(null);
  }

  function onPointerMove(e) {
    if (ptr) {
      const dist = Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy);

      if (ptr.type === 'move') {
        if (!ptr.moved) {
          if (dist < 4) return;
          ptr.moved = true;
          remember(ptr.before);
          nodeEls.get(ptr.id)?.classList.add('dragging');
        }
        const s = byId(ptr.id);
        if (!s) return;
        s.x = Math.max(0, Math.round(ptr.ox + e.clientX - ptr.sx));
        s.y = Math.max(0, Math.round(ptr.oy + e.clientY - ptr.sy));
        const el = nodeEls.get(s.id);
        if (el) {
          el.style.left = s.x + 'px';
          el.style.top = s.y + 'px';
        }
        updateCanvasSize();
        renderLinks();
        return;
      }

      if (!ptr.moved && dist > 4) ptr.moved = true;
      if (ptr.moved) updateGhost(e.clientX, e.clientY);
      return;
    }
    if (connectFrom) updateGhost(e.clientX, e.clientY);
  }

  function onPointerUp(e) {
    if (!ptr) return;
    const p = ptr;
    ptr = null;

    if (p.type === 'move') {
      nodeEls.get(p.id)?.classList.remove('dragging');
      if (p.moved) {
        save();
        renderCurve();
        updateUndo();
      }
      return;
    }

    ghost.style.display = 'none';
    setHover(null);
    if (p.moved) {
      const target = findTargetAt(e.clientX, e.clientY, p.from);
      if (target) createLink(p.from, target.id);
    } else {
      // A plain click on a port enters click-to-connect mode.
      setConnecting(p.from);
    }
  }

  /* ---------- Keyboard ---------- */
  function onKeyDown(e) {
    if (e.defaultPrevented) return;
    const typing = !!e.target.closest?.('input,textarea,[contenteditable="true"]');
    const mod = e.metaKey || e.ctrlKey;

    if (mod && e.key.toLowerCase() === 'z' && !typing) {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key === 'Escape') {
      if (connectFrom) cancelConnect();
      else if (selected && !typing) select(null);
      return;
    }
    if (typing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
      e.preventDefault();
      deleteSelected();
    }
  }

  /* ---------- Wiring ---------- */
  canvas.addEventListener('pointerdown', onCanvasDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', () => { renderCurve(); updateCanvasSize(); });

  $('#add').addEventListener('click', addStage);
  $('#emptyAdd').addEventListener('click', addStage);
  $('#arrange').addEventListener('click', autoArrange);
  $('#undo').addEventListener('click', undo);
  $('#export').addEventListener('click', exportJourney);
  $('#reset').addEventListener('click', resetSample);
  $('#importFile').addEventListener('change', importFile);

  inspector.addEventListener('click', (e) => {
    const t = e.target;
    const nodeBtn = t.closest('[data-select-node]');
    if (nodeBtn) { focusNode(nodeBtn.dataset.selectNode); return; }
    const linkBtn = t.closest('[data-select-link]');
    if (linkBtn) { select({ type: 'link', id: linkBtn.dataset.selectLink }); return; }
    const swatch = t.closest('[data-color]');
    if (swatch && selected?.type === 'node') {
      const id = selected.id;
      const color = swatch.dataset.color;
      mutate(() => { const s = byId(id); if (s) s.color = color; });
      return;
    }
    if (t.closest('[data-action="delete"]')) deleteSelected();
  });

  $('#curve').addEventListener('click', (e) => {
    const dot = e.target.closest('[data-id]');
    if (dot) focusNode(dot.dataset.id);
  });

  /* ---------- Boot ---------- */
  renderAll();
})();
</script>
</body>
</html>
