<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camping Gear Checklist</title>
<style>
:root{
  --pine:#1f3a2b; --pine-2:#2d5240; --moss:#5b7f4a; --sage:#a9bfa0;
  --bark:#4a3728; --sand:#efe6d2; --paper:#f7f1e3; --kraft:#e9dcc0;
  --ember:#c0703a; --lake:#3f8a8a; --red:#b5483b;
  --ink:#23301f; --muted:#6b6a5a; --line:#d8ccb1; --field:#fffdf6;
  --radius:16px;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 10px 28px -14px rgba(31,58,43,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  background:
    radial-gradient(1100px 480px at -5% -10%, rgba(127,179,200,.28), transparent 60%),
    radial-gradient(900px 560px at 110% 0%, rgba(91,127,74,.28), transparent 60%),
    linear-gradient(180deg,#eef0df 0%, var(--paper) 35%, var(--sand) 100%);
  background-attachment:fixed;
}
/* subtle paper grain */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:700; margin:0; letter-spacing:.2px}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
.hint{color:var(--muted); font-size:.82rem; margin:14px 2px 0}

/* ---------- Hero ---------- */
.hero{
  position:relative; z-index:1;
  background:linear-gradient(160deg,#16301f 0%, var(--pine) 55%, #2e5a45 100%);
  color:#f4efe1; padding:26px 24px 70px; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.12;
  background-image:repeating-radial-gradient(circle at 80% 120%, transparent 0 22px, rgba(255,255,255,.7) 23px 24px, transparent 25px 48px);
}
.hero-inner{max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative; z-index:1}
.brand{display:flex; align-items:center; gap:16px}
.logo{width:52px; height:52px; flex:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.brand h1{font-size:clamp(1.5rem,3vw,2.1rem)}
.brand p{margin:4px 0 0; color:var(--sage); font-size:.95rem; font-style:italic; font-family:Georgia,serif}
.unit-toggle{display:inline-flex; background:rgba(0,0,0,.25); border-radius:999px; padding:4px; border:1px solid rgba(255,255,255,.15)}
.unit-toggle button{background:none; border:0; color:var(--sage); padding:7px 16px; border-radius:999px; font-weight:600; font-size:.88rem}
.unit-toggle button[aria-pressed="true"]{background:var(--sand); color:var(--pine)}
.ridge{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:72px; display:block}

/* ---------- Layout ---------- */
.layout{
  position:relative; z-index:1; max-width:1280px; margin:-30px auto 0; padding:0 20px 48px;
  display:grid; grid-template-columns:290px minmax(0,1fr); gap:22px; align-items:start;
}
main{display:flex; flex-direction:column; gap:20px; min-width:0}
.card{
  background:rgba(255,252,242,.88); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px; backdrop-filter:blur(3px);
}
.card h2{font-size:1.1rem; margin-bottom:14px}
.eyebrow{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:1.4px; color:var(--moss); font-weight:700; margin-bottom:4px}

/* ---------- Buttons & fields ---------- */
.btn{
  border:1px solid transparent; border-radius:11px; padding:10px 16px; font-weight:650;
  background:var(--pine); color:#f4efe1; transition:background .2s, transform .1s, box-shadow .2s;
  white-space:nowrap;
}
.btn:hover{background:var(--pine-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.seg button:focus-visible,.unit-toggle button:focus-visible,.icon-btn:focus-visible,.trip:focus-visible{outline:3px solid var(--sky,#7fb3c8); outline-offset:2px}
.btn.ghost{background:transparent; color:var(--pine); border-color:var(--line)}
.btn.ghost:hover{background:var(--kraft)}
.btn.danger{background:transparent; color:var(--red); border-color:#e6c6bd}
.btn.danger:hover{background:#f6e2dd}
.btn.small{padding:6px 11px; font-size:.84rem; border-radius:9px}
.field{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:11px;
  background:var(--field); transition:border-color .2s, box-shadow .2s;
}
.field:focus{outline:none; border-color:var(--moss); box-shadow:0 0 0 3px rgba(91,127,74,.2)}
.icon-btn{
  width:30px; height:30px; border-radius:9px; border:1px solid transparent; background:none;
  color:var(--muted); font-size:1.25rem; line-height:1; display:grid; place-items:center;
}
.icon-btn:hover{background:#f3dfd9; color:var(--red)}

/* ---------- Sidebar ---------- */
.sidebar{position:sticky; top:20px; padding:18px}
.side-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.side-head h2{margin:0}
.trip-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow:auto}
.trip{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--field);
  border-radius:12px; padding:11px 13px; display:flex; flex-direction:column; gap:3px;
  transition:background .2s, transform .15s;
}
.trip:hover{transform:translateX(2px); background:#fbf6e8}
.trip.active{background:var(--pine); border-color:var(--pine); color:#f4efe1}
.trip-name{font-weight:650; font-family:Georgia,serif; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.trip-meta{font-size:.8rem; color:var(--muted)}
.trip.active .trip-meta{color:var(--sage)}
.empty-small{color:var(--muted); font-size:.9rem; padding:6px 2px}
.side-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px}
.side-actions .wide{grid-column:1 / -1}

/* ---------- Trip header ---------- */
.trip-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.title-input{
  width:100%; min-width:240px; border:0; background:transparent; padding:2px 0;
  font-family:Georgia,"Iowan Old Style",serif; font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--pine);
  border-bottom:2px dashed transparent;
}
.title-input:hover{border-bottom-color:var(--line)}
.title-input:focus{outline:none; border-bottom-color:var(--moss)}
.trip-actions{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Stats ---------- */
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.stat{
  background:linear-gradient(180deg,rgba(255,253,246,.95),rgba(245,238,218,.9));
  border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:4px; min-width:0;
}
.stat .k{font-size:.74rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--moss); font-weight:700}
.stat .v{font-family:Georgia,serif; font-size:1.7rem; font-weight:700; color:var(--pine); white-space:nowrap}
.stat .v small{font-size:.95rem; color:var(--muted); font-weight:400; margin-left:2px}
.stat .sub{font-size:.78rem; color:var(--muted)}
.stat .bar{margin-top:8px}

.bar{height:10px; background:var(--kraft); border-radius:99px; overflow:hidden}
.bar > span{display:block; height:100%; background:linear-gradient(90deg,var(--moss),var(--lake)); border-radius:99px; transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* ---------- Add form ---------- */
.add-form{display:grid; grid-template-columns:minmax(160px,2.2fr) minmax(120px,1.2fr) minmax(110px,1fr) minmax(110px,.9fr) 78px auto; gap:10px; align-items:end}
.num-field{display:flex; flex-direction:column; gap:5px; min-width:0}
.num-field > span{font-size:.78rem; color:var(--muted); font-weight:600}
.num-field > div{position:relative}
.num-field > div em{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-style:normal; color:var(--muted); font-size:.85rem; pointer-events:none}
.num-field > div .field{padding-right:36px}
.add-form .btn{height:42px}

/* ---------- List toolbar ---------- */
.list-toolbar{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px}
.seg{display:inline-flex; background:var(--kraft); border-radius:12px; padding:4px; gap:2px}
.seg button{border:0; background:none; padding:7px 14px; border-radius:9px; font-weight:600; color:var(--bark); font-size:.9rem}
.seg button.on{background:var(--paper); color:var(--pine); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{max-width:260px; flex:1 1 200px}

/* ---------- Category + items ---------- */
#list{display:flex; flex-direction:column; gap:18px}
.cat{--c:var(--moss); border-left:4px solid var(--c); padding-left:14px}
.cat-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap}
.cat-head .swatch{width:10px; height:10px; border-radius:3px; background:var(--c); align-self:center}
.cat-head h3{font-size:1.02rem}
.cat-count{font-size:.8rem; color:var(--muted)}
.cat-sub{margin-left:auto; font-size:.88rem; font-weight:700; color:var(--pine); font-variant-numeric:tabular-nums}
.items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
.item{
  display:grid; align-items:center; gap:8px;
  grid-template-columns:24px minmax(140px,1fr) 128px 104px 96px 52px 74px 30px;
  padding:7px 8px; border-radius:11px; border:1px solid transparent; transition:background .2s, border-color .2s;
}
.item:hover{background:rgba(255,253,246,.9); border-color:var(--line)}
.item.packed .name{text-decoration:line-through; color:var(--muted)}
.item.packed{opacity:.72}
.item .name{border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:9px; min-width:0; width:100%}
.item .name:hover{border-color:var(--line); background:var(--field)}
.item .name:focus{outline:none; border-color:var(--moss); background:var(--field)}
.item select.name, .item select{padding:6px 8px; border:1px solid var(--line); border-radius:9px; background:var(--field); font-size:.84rem; width:100%}
.item input[type=number]{padding:6px 8px; border:1px solid var(--line); border-radius:9px; background:var(--field); width:100%; font-size:.88rem; font-variant-numeric:tabular-nums}
.item input:focus, .item select:focus{outline:none; border-color:var(--moss); box-shadow:0 0 0 3px rgba(91,127,74,.18)}
.num{position:relative; display:block; min-width:0}
.num span{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:.76rem; color:var(--muted); pointer-events:none}
.num input{padding-right:30px !important}
.qty{position:relative}
.qty > span.times{position:absolute; left:6px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.8rem; pointer-events:none}
.qty input{padding-left:18px !important; padding-right:8px !important}
.line-total{font-size:.86rem; font-weight:700; color:var(--pine); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.t-gear{border-left:3px solid var(--moss) !important}
.t-worn{border-left:3px solid var(--ember) !important}
.t-consumable{border-left:3px solid var(--lake) !important}

/* checkbox */
.check{position:relative; width:22px; height:22px; cursor:pointer; display:block}
.check input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.check .box{
  position:absolute; inset:0; border:2px solid var(--moss); border-radius:7px; background:var(--field);
  transition:background .2s, transform .15s;
}
.check .box::after{
  content:""; position:absolute; left:6px; top:2px; width:6px; height:11px; opacity:0;
  border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) scale(.6); transition:opacity .15s, transform .2s;
}
.check input:checked + .box{background:var(--moss)}
.check input:checked + .box::after{opacity:1; transform:rotate(45deg) scale(1)}
.check input:focus-visible + .box{outline:3px solid var(--sky,#7fb3c8); outline-offset:2px}
.check:hover .box{transform:scale(1.06)}

/* empty */
.empty{text-align:center; padding:34px 16px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:6px}
.empty svg{color:var(--moss); opacity:.8; margin-bottom:6px}
.empty h3{color:var(--pine); font-size:1.15rem}
.empty p{margin:0; max-width:380px}

/* ---------- Breakdown ---------- */
.breakdown{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:28px}
.breakdown h2{margin-bottom:12px}
.stack{display:flex; height:26px; border-radius:99px; overflow:hidden; background:var(--kraft); box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.stack span{height:100%; transition:width .45s cubic-bezier(.2,.8,.2,1); min-width:0}
.stack span + span{border-left:2px solid rgba(255,255,255,.7)}
.legend{list-style:none; margin:16px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:8px 18px}
.legend li{display:grid; grid-template-columns:12px 1fr auto 44px; gap:8px; align-items:center; font-size:.9rem}
.legend i{width:12px; height:12px; border-radius:4px; display:block}
.legend b{font-variant-numeric:tabular-nums}
.legend em{font-style:normal; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.type-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
.type-row div{background:var(--field); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.type-row span{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700}
.type-row strong{font-family:Georgia,serif; font-size:1.15rem; color:var(--pine); font-variant-numeric:tabular-nums}
.bd-side{border-left:1px dashed var(--line); padding-left:26px; display:flex; flex-direction:column; gap:14px}
.bd-side .num-field > span{font-size:.82rem}
.ratio{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.ratio b{font-family:Georgia,serif; font-size:2.1rem; color:var(--pine); font-variant-numeric:tabular-nums}
.tone{font-size:.8rem; font-weight:700; padding:4px 10px; border-radius:999px}
.tone.good{background:#dcebd3; color:#2d5a2a}
.tone.warn{background:#f5e6c4; color:#7a5414}
.tone.bad{background:#f4d7d1; color:#8a2f22}
.gauge{position:relative; height:12px; border-radius:99px; margin-top:12px;
  background:linear-gradient(90deg,#8fb67f 0%,#8fb67f 25%,#e3c57c 25%,#e3c57c 50%,#d9866f 50%,#d9866f 100%)}
.gauge span{position:absolute; top:-5px; width:6px; height:22px; margin-left:-3px; border-radius:3px; background:var(--pine); box-shadow:0 0 0 2px var(--paper); transition:left .45s}
.gauge-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-top:6px}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,30px); opacity:0; pointer-events:none;
  background:var(--pine); color:#f4efe1; padding:11px 18px; border-radius:12px; box-shadow:0 14px 30px -10px rgba(0,0,0,.4);
  transition:opacity .25s, transform .25s; font-weight:600; z-index:50; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1040px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .breakdown{grid-template-columns:1fr}
  .bd-side{border-left:0; padding-left:0; border-top:1px dashed var(--line); padding-top:18px}
  .add-form{grid-template-columns:repeat(3,minmax(0,1fr))}
  .add-form .wide{grid-column:1 / -1}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr; margin-top:-30px}
  .sidebar{position:static}
  .trip-list{max-height:none; flex-direction:row; overflow-x:auto; padding-bottom:4px}
  .trip{min-width:200px}
  .item{
    grid-template-columns:24px minmax(0,1fr) 30px;
    grid-template-areas:"check name del" "cat cat cat" "type weight qty" "total total total";
    row-gap:8px;
  }
  .item .check{grid-area:check}
  .item .name{grid-area:name}
  .item > select:nth-of-type(1){grid-area:cat}
  .item > select:nth-of-type(2){grid-area:type}
  .item > .num{grid-area:weight}
  .item > .qty{grid-area:qty}
  .item > .line-total{grid-area:total; text-align:left}
  .item > .icon-btn{grid-area:del}
  .item{padding:10px}
}
@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr; gap:10px}
  .stat .v{font-size:1.35rem}
  .add-form{grid-template-columns:1fr 1fr}
  .add-form > .field:first-child{grid-column:1 / -1}
  .add-form .btn{grid-column:1 / -1; height:auto; padding:12px}
  .legend{grid-template-columns:1fr}
  .type-row{grid-template-columns:1fr 1fr 1fr}
  .type-row strong{font-size:1rem}
  .hero{padding-bottom:64px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5 L44 40 H4 Z" fill="#e9a16b"/>
        <path d="M24 5 L24 40 L14 40 Z" fill="#c0703a"/>
        <path d="M24 22 L30 40 H18 Z" fill="#3b2a1e" opacity=".55"/>
        <circle cx="38" cy="9" r="4.5" fill="#efe6d2" opacity=".92"/>
      </svg>
      <div>
        <h1>Camping Gear Checklist</h1>
        <p>Pack light, know your load, and be trail-ready before the trailhead.</p>
      </div>
    </div>
    <div class="unit-toggle" role="group" aria-label="Units">
      <button type="button" data-act="unit" data-unit="metric" aria-pressed="true">Metric</button>
      <button type="button" data-act="unit" data-unit="imperial" aria-pressed="false">Imperial</button>
    </div>
  </div>
  <svg class="ridge" viewBox="0 0 1440 72" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,46 L120,14 L210,38 L320,4 L440,44 L540,18 L660,52 L780,12 L900,40 L1010,8 L1130,38 L1240,16 L1340,36 L1440,20 L1440,72 L0,72 Z" style="fill:#7f9f86;opacity:.45"/>
    <path d="M0,60 L95,40 L200,56 L310,30 L430,58 L560,34 L690,62 L820,28 L950,54 L1070,30 L1190,56 L1300,36 L1440,52 L1440,72 L0,72 Z" style="fill:var(--sand)"/>
  </svg>
</header>

<div class="layout">
  <aside class="sidebar card" aria-label="Saved trips">
    <div class="side-head">
      <h2>Your trips</h2>
      <button type="button" class="btn small" data-act="new-trip">+ New</button>
    </div>
    <ul id="trip-list" class="trip-list"></ul>
    <div class="side-actions">
      <button type="button" class="btn ghost small wide" data-act="sample">Load sample trip</button>
      <button type="button" class="btn ghost small" data-act="export">Export</button>
      <button type="button" class="btn ghost small" data-act="import">Import</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <p class="hint">Trips save automatically in this browser.</p>
  </aside>

  <main>
    <section class="card trip-head">
      <div style="flex:1 1 320px; min-width:0">
        <label class="eyebrow" for="trip-title">Trip name</label>
        <input id="trip-title" class="title-input" maxlength="60" autocomplete="off">
      </div>
      <div class="trip-actions">
        <button type="button" class="btn ghost small" data-act="dup-trip">Duplicate</button>
        <button type="button" class="btn ghost small" data-act="reset">Unpack all</button>
        <button type="button" class="btn danger small" data-act="del-trip">Delete trip</button>
      </div>
    </section>

    <section id="stats" class="stats" aria-label="Summary"></section>

    <section class="card">
      <h2>Add gear</h2>
      <form id="add-form" class="add-form" autocomplete="off">
        <input name="name" class="field" placeholder="e.g. Two-person tent" maxlength="80" required aria-label="Item name">
        <select name="category" class="field" aria-label="Category"></select>
        <select name="type" class="field" aria-label="Type">
          <option value="gear">Gear</option>
          <option value="worn">Worn</option>
          <option value="consumable">Consumable</option>
        </select>
        <label class="num-field">
          <span>Weight each</span>
          <div>
            <input name="weight" type="number" min="0" step="any" class="field" placeholder="0" aria-label="Weight each">
            <em id="add-unit">g</em>
          </div>
        </label>
        <label class="num-field">
          <span>Qty</span>
          <input name="qty" type="number" min="1" step="1" value="1" class="field" aria-label="Quantity">
        </label>
        <button type="submit" class="btn">Add item</button>
      </form>
    </section>

    <section class="card">
      <div class="list-toolbar">
        <div class="seg" role="group" aria-label="Filter items">
          <button type="button" data-act="filter" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-act="filter" data-filter="todo" aria-pressed="false">To pack</button>
          <button type="button" data-act="filter" data-filter="packed" aria-pressed="false">Packed</button>
        </div>
        <input id="search" class="field search" type="search" placeholder="Search items…" aria-label="Search items">
      </div>
      <div id="list"></div>
    </section>

    <section class="card breakdown">
      <div>
        <h2>Weight breakdown</h2>
        <div id="stack" class="stack" role="img" aria-label="Weight by category"></div>
        <ul id="legend" class="legend"></ul>
        <div id="type-row" class="type-row"></div>
      </div>
      <div class="bd-side">
        <h2>Pack-to-body ratio</h2>
        <label class="num-field">
          <span id="body-label">Body weight (kg)</span>
          <div>
            <input id="body" type="number" min="0" step="0.1" class="field" placeholder="e.g. 72" aria-label="Body weight">
          </div>
        </label>
        <div id="body-result"></div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- Constants ---------- */
  const KEY = 'camping-gear-checklist-v1';
  const G_PER_OZ = 28.349523125;
  const G_PER_LB = 453.59237;
  const CATEGORIES = [
    { id: 'shelter',  name: 'Shelter',               color: '#5b7f4a' },
    { id: 'sleep',    name: 'Sleep System',          color: '#7a6aa8' },
    { id: 'cook',     name: 'Kitchen & Fuel',        color: '#c0703a' },
    { id: 'food',     name: 'Food & Water',          color: '#3f8a8a' },
    { id: 'clothing', name: 'Clothing',              color: '#b5893b' },
    { id: 'safety',   name: 'Navigation & Safety',   color: '#b5483b' },
    { id: 'hygiene',  name: 'Hygiene & First Aid',   color: '#6d9b9b' },
    { id: 'misc',     name: 'Miscellaneous',         color: '#8a7f6b' },
  ];
  const TYPES = [
    { id: 'gear',       name: 'Gear' },
    { id: 'worn',       name: 'Worn' },
    { id: 'consumable', name: 'Consumable' },
  ];
  const CAT_IDS = CATEGORIES.map(c => c.id);
  const TYPE_IDS = TYPES.map(t => t.id);
  const SAMPLE = {
    name: 'Ridge Weekend · 2 nights',
    items: [
      ['Two-person tent', 'shelter', 'gear', 1900, 1, true],
      ['Footprint', 'shelter', 'gear', 250, 1],
      ['Trekking poles', 'shelter', 'gear', 340, 1],
      ['Sleeping bag (20°F)', 'sleep', 'gear', 900, 1, true],
      ['Sleeping pad', 'sleep', 'gear', 450, 1],
      ['Camp pillow', 'sleep', 'gear', 90, 1],
      ['Canister stove', 'cook', 'gear', 85, 1, true],
      ['Fuel canister', 'cook', 'consumable', 230, 1],
      ['Titanium pot 1L', 'cook', 'gear', 150, 1],
      ['Spork', 'cook', 'gear', 12, 1],
      ['Water filter', 'food', 'gear', 110, 1],
      ['Water bottle 1L', 'food', 'gear', 50, 2],
      ['Dinners & snacks', 'food', 'consumable', 1100, 1],
      ['Hiking boots', 'clothing', 'worn', 1000, 1],
      ['Hiking pants', 'clothing', 'worn', 320, 1],
      ['Merino base layer', 'clothing', 'gear', 200, 1],
      ['Puffy jacket', 'clothing', 'gear', 280, 1],
      ['Rain shell', 'clothing', 'gear', 350, 1],
      ['Beanie', 'clothing', 'gear', 45, 1],
      ['Headlamp', 'safety', 'gear', 80, 1],
      ['Map & compass', 'safety', 'gear', 60, 1],
      ['First aid kit', 'safety', 'gear', 180, 1],
      ['Bear spray', 'safety', 'gear', 210, 1],
      ['Toothbrush & paste', 'hygiene', 'consumable', 15, 1],
      ['Sunscreen', 'hygiene', 'consumable', 90, 1],
      ['Trowel', 'hygiene', 'gear', 70, 1],
      ['Biodegradable soap', 'hygiene', 'consumable', 50, 1],
      ['Backpack 55L', 'misc', 'gear', 1400, 1],
      ['Trash bags', 'misc', 'consumable', 10, 2],
    ],
  };

  /* ---------- Helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const catName = id => (CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1]).name;

  function makeItem([name, category, type, grams, qty = 1, packed = false]) {
    return { id: uid(), name, category, type, grams, qty, packed };
  }

  function normalizeItem(it) {
    return {
      id: String(it.id || uid()),
      name: String(it.name || 'Untitled item').trim().slice(0, 80) || 'Untitled item',
      category: CAT_IDS.includes(it.category) ? it.category : 'misc',
      type: TYPE_IDS.includes(it.type) ? it.type : 'gear',
      grams: Math.max(0, Number(it.grams) || 0),
      qty: Math.max(1, Math.floor(Number(it.qty) || 1)),
      packed: Boolean(it.packed),
    };
  }

  function newList(name, items = []) {
    return { id: uid(), name, items: items.map(normalizeItem) };
  }

  function sampleList() {
    return newList(SAMPLE.name, SAMPLE.items.map(makeItem));
  }

  function nextTripName() {
    const base = 'New trip';
    const names = new Set(state.lists.map(l => l.name));
    if (!names.has(base)) return base;
    let n = 2;
    while (names.has(`${base} ${n}`)) n++;
    return `${base} ${n}`;
  }

  /* ---------- Units ---------- */
  const isMetric = () => state.unit !== 'imperial';
  const unitShort = () => (isMetric() ? 'g' : 'oz');
  const bodyUnit = () => (isMetric() ? 'kg' : 'lb');

  function fmtW(g) {
    if (isMetric()) return g >= 1000 ? `${(g / 1000).toFixed(2)} kg` : `${Math.round(g)} g`;
    const oz = g / G_PER_OZ;
    return oz >= 16 ? `${(g / G_PER_LB).toFixed(2)} lb` : `${oz.toFixed(1)} oz`;
  }
  // grams -> number shown in the per-item weight field
  const toInput = g => (isMetric() ? Math.round(g) : Math.round((g / G_PER_OZ) * 10) / 10);
  // number typed in the per-item weight field -> grams
  const fromInput = v => {
    const n = Number(v);
    if (!Number.isFinite(n) || n < 0) return 0;
    return isMetric() ? n : n * G_PER_OZ;
  };
  const bodyToInput = g => (g == null ? '' : isMetric() ? (g / 1000).toFixed(1) : (g / G_PER_LB).toFixed(1));
  const bodyFromInput = v => {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) return null;
    return isMetric() ? n * 1000 : n * G_PER_LB;
  };

  /* ---------- State ---------- */
  let state = load() || defaultState();

  function defaultState() {
    const list = sampleList();
    return { unit: 'metric', activeId: list.id, filter: 'all', search: '', bodyG: null, lists: [list] };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? sanitizeState(JSON.parse(raw)) : null;
    } catch {
      return null;
    }
  }

  function sanitizeState(d) {
    if (!d || !Array.isArray(d.lists)) return null;
    const lists = d.lists
      .filter(l => l && typeof l === 'object' && Array.isArray(l.items))
      .map(l => ({
        id: String(l.id || uid()),
        name: String(l.name || 'Untitled trip').slice(0, 60),
        items: l.items.filter(Boolean).map(normalizeItem),
      }));
    if (!lists.length) return null;
    const bodyG = Number(d.bodyG);
    return {
      unit: d.unit === 'imperial' ? 'imperial' : 'metric',
      activeId: lists.some(l => l.id === d.activeId) ? d.activeId : lists[0].id,
      filter: 'all',
      search: '',
      bodyG: Number.isFinite(bodyG) && bodyG > 0 ? bodyG : null,
      lists,
    };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage unavailable */ }
  }

  const active = () => state.lists.find(l => l.id === state.activeId) || state.lists[0];

  /* ---------- Calculations ---------- */
  function summarize(list) {
    const byCat = Object.fromEntries(CAT_IDS.map(id => [id, 0]));
    let base = 0, pack = 0, worn = 0, all = 0, packedCount = 0, packedW = 0;
    for (const it of list.items) {
      const w = it.grams * it.qty;
      all += w;
      if (it.type === 'gear') base += w;
      if (it.type === 'worn') worn += w;
      if (it.type !== 'worn') pack += w;
      if (it.packed) { packedCount += 1; packedW += w; }
      byCat[it.category] += w;
    }
    const n = list.items.length;
    return {
      n, base, pack, worn, all,
      consumable: pack - base,
      packedCount, packedW,
      packedPct: n ? Math.round((packedCount / n) * 100) : 0,
      byCat,
    };
  }

  /* ---------- Rendering ---------- */
  function render() {
    const list = active();
    const s = summarize(list);

    renderSidebar();

    const title = $('#trip-title');
    if (document.activeElement !== title && title.value !== list.name) title.value = list.name;

    $('#add-unit').textContent = unitShort();
    $('#body-label').textContent = `Body weight (${bodyUnit()})`;
    const body = $('#body');
    if (document.activeElement !== body) body.value = bodyToInput(state.bodyG);
    body.step = isMetric() ? '0.1' : '0.5';
    $('#add-form').weight.placeholder = isMetric() ? '0' : '0.0';

    $$('[data-act="unit"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === state.unit)));
    $$('[data-act="filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)));
    $$('[data-act="filter"]').forEach(b => b.classList.toggle('on', b.dataset.filter === state.filter));

    renderStats(s);
    renderList(list);
    renderBreakdown(s);
    renderBodyResult(s);
    save();
  }

  function renderSidebar() {
    $('#trip-list').innerHTML = state.lists.map(l => {
      const t = summarize(l);
      const isActive = l.id === state.activeId;
      return `<li>
        <button type="button" class="trip ${isActive ? 'active' : ''}" data-act="select" data-id="${esc(l.id)}" aria-current="${isActive}">
          <span class="trip-name">${esc(l.name)}</span>
          <span class="trip-meta">${t.n} items · ${t.packedPct}% packed · ${fmtW(t.pack)}</span>
        </button>
      </li>`;
    }).join('');
  }

  function renderStats(s) {
    $('#stats').innerHTML = `
      <div class="stat">
        <span class="k">Base weight</span>
        <span class="v">${fmtW(s.base)}</span>
        <span class="sub">Gear only, no worn or consumables</span>
      </div>
      <div class="stat">
        <span class="k">Pack weight</span>
        <span class="v">${fmtW(s.pack)}</span>
        <span class="sub">Gear + consumables</span>
      </div>
      <div class="stat">
        <span class="k">With worn</span>
        <span class="v">${fmtW(s.all)}</span>
        <span class="sub">Everything on the list</span>
      </div>
      <div class="stat">
        <span class="k">Packed</span>
        <span class="v">${s.packedCount}<small>/ ${s.n}</small></span>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.packedPct}" aria-label="Packed progress">
          <span style="width:${s.packedPct}%"></span>
        </div>
      </div>`;
  }

  function matchesFilter(it) {
    if (state.filter === 'todo') return !it.packed;
    if (state.filter === 'packed') return it.packed;
    return true;
  }

  function renderList(list) {
    const region = $('#list');
    if (!list.items.length) {
      region.innerHTML = emptyState('Your pack is empty',
        'Add your first item above, or load the sample trip from the sidebar to see how it works.');
      return;
    }
    const q = state.search.trim().toLowerCase();
    const visible = list.items.filter(it => matchesFilter(it) && (!q || it.name.toLowerCase().includes(q)));
    if (!visible.length) {
      region.innerHTML = emptyState('Nothing matches', 'Try a different filter or search term.');
      return;
    }
    region.innerHTML = CATEGORIES.map(c => {
      const items = visible.filter(it => it.category === c.id);
      if (!items.length) return '';
      const sub = items.reduce((a, it) => a + it.grams * it.qty, 0);
      const done = items.filter(i => i.packed).length;
      return `
        <section class="cat" style="--c:${c.color}">
          <header class="cat-head">
            <span class="swatch"></span>
            <h3>${esc(c.name)}</h3>
            <span class="cat-count">${done}/${items.length} packed</span>
            <span class="cat-sub">${fmtW(sub)}</span>
          </header>
          <ul class="items">${items.map(itemRow).join('')}</ul>
        </section>`;
    }).join('');
  }

  function itemRow(it) {
    const cats = CATEGORIES.map(c =>
      `<option value="${c.id}" ${c.id === it.category ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    const types = TYPES.map(t =>
      `<option value="${t.id}" ${t.id === it.type ? 'selected' : ''}>${t.name}</option>`).join('');
    return `
      <li class="item ${it.packed ? 'packed' : ''}" data-id="${esc(it.id)}">
        <label class="check" title="Mark packed">
          <input type="checkbox" data-act="toggle" ${it.packed ? 'checked' : ''} aria-label="Packed: ${esc(it.name)}">
          <span class="box"></span>
        </label>
        <input class="name" data-field="name" value="${esc(it.name)}" maxlength="80" aria-label="Item name">
        <select data-field="category" aria-label="Category">${cats}</select>
        <select class="t-${it.type}" data-field="type" aria-label="Type">${types}</select>
        <label class="num">
          <input type="number" min="0" step="${isMetric() ? 1 : 0.1}" value="${toInput(it.grams)}" data-field="weight" aria-label="Weight each in ${unitShort()}">
          <span>${unitShort()}</span>
        </label>
        <label class="num qty">
          <span class="times">×</span>
          <input type="number" min="1" step="1" value="${it.qty}" data-field="qty" aria-label="Quantity">
        </label>
        <span class="line-total">${fmtW(it.grams * it.qty)}</span>
        <button type="button" class="icon-btn" data-act="delete" title="Remove item" aria-label="Remove ${esc(it.name)}">×</button>
      </li>`;
  }

  function renderBreakdown(s) {
    const total = s.all;
    const segs = CATEGORIES.map(c => ({ c, w: s.byCat[c.id] }))
      .filter(x => x.w > 0)
      .sort((a, b) => b.w - a.w);

    $('#stack').innerHTML = total
      ? segs.map(x => `<span title="${esc(x.c.name)}: ${fmtW(x.w)}" style="width:${(x.w / total) * 100}%;background:${x.c.color}"></span>`).join('')
      : '';

    $('#legend').innerHTML = segs.length
      ? segs.map(x => `
          <li>
            <i style="background:${x.c.color}"></i>
            <span>${esc(x.c.name)}</span>
            <b>${fmtW(x.w)}</b>
            <em>${Math.round((x.w / total) * 100)}%</em>
          </li>`).join('')
      : '<li class="muted" style="grid-column:1/-1">Add items to see where your weight goes.</li>';

    $('#type-row').innerHTML = `
      <div><span>Gear</span><strong>${fmtW(s.base)}</strong></div>
      <div><span>Consumables</span><strong>${fmtW(s.consumable)}</strong></div>
      <div><span>Worn</span><strong>${fmtW(s.worn)}</strong></div>`;
  }

  function renderBodyResult(s) {
    const el = $('#body-result');
    if (!state.bodyG) {
      el.innerHTML = '<p class="muted" style="margin:0">Enter your body weight to see what share of it your pack represents.</p>';
      return;
    }
    const pct = (s.pack / state.bodyG) * 100;
    const [label, tone] =
      pct <= 10 ? ['Featherweight', 'good'] :
      pct <= 20 ? ['Ideal for multi-day', 'good'] :
      pct <= 30 ? ['Manageable', 'warn'] :
                  ['Heavy, consider trimming', 'bad'];
    const marker = (Math.min(pct, 40) / 40) * 100;
    el.innerHTML = `
      <div class="ratio"><b>${pct.toFixed(1)}%</b><span class="tone ${tone}">${label}</span></div>
      <div class="gauge" role="img" aria-label="Pack is ${pct.toFixed(1)} percent of body weight"><span style="left:${marker}%"></span></div>
      <div class="gauge-scale"><span>0%</span><span>10%</span><span>20%</span><span>30%</span><span>40%+</span></div>
      <p class="muted" style="margin:12px 0 0;font-size:.84rem">Pack weight (gear + consumables) divided by body weight. Worn clothing is excluded.</p>`;
  }

  function emptyState(title, text) {
    return `
      <div class="empty">
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <path d="M32 8 L58 52 L6 52 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M32 26 L44 52 H20 Z" fill="currentColor" opacity=".25"/>
          <path d="M6 56 H58" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <h3>${esc(title)}</h3>
        <p>${esc(text)}</p>
      </div>`;
  }

  /* ---------- Feedback ---------- */
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- Actions ---------- */
  function selectList(id) {
    state.activeId = id;
    render();
  }

  function newTrip() {
    const list = newList(nextTripName());
    state.lists.push(list);
    state.activeId = list.id;
    render();
    const t = $('#trip-title');
    t.focus();
    t.select();
  }

  function duplicateTrip() {
    const src = active();
    const copy = newList(`Copy of ${src.name}`.slice(0, 60),
      src.items.map(it => ({ ...it, id: uid(), packed: false })));
    state.lists.push(copy);
    state.activeId = copy.id;
    render();
    toast('Trip duplicated, everything is unpacked');
  }

  function deleteTrip() {
    const list = active();
    if (!window.confirm(`Delete "${list.name}"? This can't be undone.`)) return;
    state.lists = state.lists.filter(l => l.id !== list.id);
    if (!state.lists.length) state.lists.push(newList('New trip'));
    state.activeId = state.lists[0].id;
    render();
    toast('Trip deleted');
  }

  function unpackAll() {
    active().items.forEach(it => { it.packed = false; });
    render();
    toast('Everything is back in the pile');
  }

  function loadSample() {
    const list = sampleList();
    state.lists.push(list);
    state.activeId = list.id;
    state.filter = 'all';
    render();
    toast('Sample trip loaded');
  }

  function exportLists() {
    const payload = JSON.stringify({ app: 'camping-gear-checklist', version: 1, lists: state.lists }, null, 2);
    const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(active().name || 'camping-gear').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Exported as JSON');
  }

  function importFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const imported = sanitizeState({ lists: Array.isArray(data) ? data : data.lists });
        if (!imported) throw new Error('no lists');
        const fresh = imported.lists.map(l => ({ ...l, id: uid() }));
        state.lists.push(...fresh);
        state.activeId = fresh[0].id;
        state.filter = 'all';
        render();
        toast(`Imported ${fresh.length} trip${fresh.length === 1 ? '' : 's'}`);
      } catch {
        toast('That file does not look like a checklist export');
      }
    };
    reader.readAsText(file);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    switch (el.dataset.act) {
      case 'select': return selectList(el.dataset.id);
      case 'unit':
        state.unit = el.dataset.unit === 'imperial' ? 'imperial' : 'metric';
        return render();
      case 'filter':
        state.filter = el.dataset.filter;
        return render();
      case 'new-trip': return newTrip();
      case 'dup-trip': return duplicateTrip();
      case 'del-trip': return deleteTrip();
      case 'reset': return unpackAll();
      case 'sample': return loadSample();
      case 'export': return exportLists();
      case 'import': return $('#import-file').click();
      case 'delete': {
        const row = el.closest('.item');
        const list = active();
        const it = list.items.find(i => i.id === row.dataset.id);
        list.items = list.items.filter(i => i.id !== row.dataset.id);
        render();
        if (it) toast(`Removed ${it.name}`);
        return;
      }
      default: return;
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;

    if (el.id === 'trip-title') {
      active().name = el.value.trim() || 'Untitled trip';
      return render();
    }

    if (el.id === 'import-file') {
      const file = el.files && el.files[0];
      el.value = '';
      if (file) importFile(file);
      return;
    }

    if (el.id === 'body') {
      state.bodyG = bodyFromInput(el.value);
      return render();
    }

    const row = el.closest('.item');
    if (!row) return;
    const it = active().items.find(i => i.id === row.dataset.id);
    if (!it) return;

    if (el.dataset.act === 'toggle') {
      it.packed = el.checked;
    } else {
      switch (el.dataset.field) {
        case 'name': {
          const v = el.value.trim();
          if (v) it.name = v.slice(0, 80);
          break;
        }
        case 'category': it.category = CAT_IDS.includes(el.value) ? el.value : it.category; break;
        case 'type': it.type = TYPE_IDS.includes(el.value) ? el.value : it.type; break;
        case 'weight': it.grams = fromInput(el.value); break;
        case 'qty': it.qty = Math.max(1, Math.floor(Number(el.value) || 1)); break;
        default: return;
      }
    }
    render();
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'search') {
      state.search = el.value;
      renderList(active());
      return;
    }
    if (el.id === 'body') {
      state.bodyG = bodyFromInput(el.value);
      renderBodyResult(summarize(active()));
      save();
    }
  });

  $('#add-form').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.currentTarget;
    const name = f.name.value.trim();
    if (!name) {
      f.name.focus();
      toast('Give the item a name first');
      return;
    }
    active().items.push(normalizeItem({
      name,
      category: f.category.value,
      type: f.type.value,
      grams: fromInput(f.weight.value),
      qty: f.qty.value,
    }));
    f.name.value = '';
    f.weight.value = '';
    f.qty.value = '1';
    f.name.focus();
    render();
  });

  // Populate the add-form category options once
  $('#add-form').category.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  $('#search').addEventListener('search', () => renderList(active()));

  render();
})();
</script>
</body>
</html>
