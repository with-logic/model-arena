<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Learn ten essential travel phrases in English, Spanish, French or Japanese with flip cards.">
<title>Travel Phrases · Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f2e8;
    --paper-2: #efe7d6;
    --card: #fffdf8;
    --ink: #1f2535;
    --ink-soft: #5b6275;
    --accent: #d9552b;
    --teal: #1f8a7a;
    --gold: #e0a526;
    --line: rgba(31, 37, 53, .12);
    --shadow: 0 1px 2px rgba(31, 37, 53, .06), 0 14px 34px -14px rgba(31, 37, 53, .28);
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --font-display: 'Fraunces', 'Hiragino Mincho ProN', 'Noto Serif JP', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15171e;
      --paper-2: #1c1f29;
      --card: #232734;
      --ink: #f3efe6;
      --ink-soft: #a6acbc;
      --line: rgba(255, 255, 255, .1);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 40px -16px rgba(0, 0, 0, .65);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 520px at -5% -10%, rgba(217, 85, 43, .16), transparent 60%),
      radial-gradient(820px 600px at 110% 0%, rgba(31, 138, 122, .16), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(224, 165, 38, .12), transparent 60%);
  }
  button { font: inherit; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  svg { display: block; flex: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header ---------- */
  .topbar {
    max-width: 960px;
    margin: 0 auto;
    padding: 22px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(145deg, var(--accent), #b8421d);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 10px 24px -12px rgba(217, 85, 43, .8);
  }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -.01em;
  }
  .tagline { margin: 3px 0 0; color: var(--ink-soft); font-size: .85rem; }
  .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .seg {
    display: inline-flex; gap: 2px; padding: 4px;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px;
  }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    padding: 6px 11px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    transition: background .2s, color .2s;
  }
  .seg button:lang(ja) { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .2s var(--ease-out), box-shadow .2s, background .2s, opacity .2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn:active { transform: scale(.97); }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .btn.primary { background: var(--teal); color: #fff; border-color: transparent; box-shadow: 0 12px 26px -14px rgba(31, 138, 122, .9); }
  .btn.primary:hover { background: #197366; }

  /* ---------- Deck ---------- */
  main#app { max-width: 880px; margin: 0 auto; padding: 28px 24px 64px; }
  .deck-head { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 15px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-size: .9rem; font-weight: 600;
  }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(31, 138, 122, .18); }
  .progress { flex: 1; min-width: 220px; max-width: 380px; }
  .progress-row {
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 9px; font-size: .85rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress-row strong { color: var(--ink); font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--teal), #41b8a6);
    border-radius: inherit;
    transition: width .6s var(--ease-out);
  }

  .stage { position: relative; height: 350px; margin-top: 26px; }

  /* ---------- Cards ---------- */
  .card {
    position: absolute; left: 0; right: 0; top: 0; margin: 0 auto;
    width: min(560px, 92vw); height: 318px;
    perspective: 1400px;
    transition: transform .55s var(--ease-out), opacity .45s ease;
    cursor: pointer; touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
  }
  .card[data-depth="0"] { z-index: 3; transform: none; }
  .card[data-depth="1"] { z-index: 2; transform: translateY(14px) scale(.955); }
  .card[data-depth="2"] { z-index: 1; transform: translateY(26px) scale(.91); opacity: .55; }
  .card.dragging { transition: none; cursor: grabbing; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s var(--ease-out);
  }
  .card.is-flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 24px 28px;
    border-radius: 24px; border: 1px solid var(--line); box-shadow: var(--shadow);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .face.front {
    background-color: var(--card);
    background-image: radial-gradient(var(--line) 1px, transparent 1.3px);
    background-size: 22px 22px;
  }
  .face.back {
    transform: rotateY(180deg);
    background: linear-gradient(155deg, #27b09c 0%, #17756a 60%, #0f5a51 100%);
    color: #fff; border-color: transparent;
  }
  .face-top {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  }
  .pill { padding: 6px 11px; border-radius: 999px; background: rgba(217, 85, 43, .12); color: var(--accent); }
  .pill.light { background: rgba(255, 255, 255, .2); color: #fff; }
  .hint { color: var(--ink-soft); font-size: .8rem; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .phrase {
    margin: auto 0; max-width: 20em;
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.6rem, 4.6vw, 2.4rem); line-height: 1.2;
    text-wrap: balance;
  }
  .romaji { margin-top: -4px; color: var(--ink-soft); font-style: italic; font-size: 1rem; }
  .meaning {
    margin: auto 0; max-width: 20em;
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(1.5rem, 4.2vw, 2.2rem); line-height: 1.25;
    text-wrap: balance;
  }
  .phrase:lang(ja), .meaning:lang(ja), .tile-native:lang(ja), .tray-text:lang(ja) {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    font-weight: 700;
  }
  .back-note { font-size: .95rem; opacity: .85; }
  .face-foot { width: 100%; min-height: 40px; display: flex; justify-content: center; align-items: center; }
  .listen {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .listen:hover { background: var(--paper-2); }
  .listen:active { transform: scale(.96); }

  .stamp {
    position: absolute; left: 50%; top: 38%; z-index: 5;
    transform: translate(-50%, -50%) rotate(-14deg);
    opacity: 0; pointer-events: none; white-space: nowrap;
    padding: 8px 18px; border-radius: 12px;
    border: 3px solid var(--teal); color: var(--teal);
    background: rgba(255, 253, 248, .9);
    font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em;
  }

  .enter { animation: fadeIn .45s ease backwards; }
  .enter-top { animation: topIn .5s var(--ease-out) backwards; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes topIn {
    from { opacity: 0; transform: translateX(var(--from-x, 60px)) rotate(4deg) scale(.96); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.97); } }

  .confetti {
    position: absolute; top: 0; width: 9px; height: 13px; border-radius: 2px;
    pointer-events: none; z-index: 6;
  }

  .done {
    position: absolute; inset: 0; z-index: 4;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; text-align: center;
  }
  .done.show { display: flex; animation: rise .6s var(--ease-out) backwards; }
  .done-badge {
    width: 88px; height: 88px; border-radius: 50%; margin-bottom: 6px;
    background: linear-gradient(145deg, #27b09c, #17756a); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 18px 40px -16px rgba(31, 138, 122, .8);
  }
  .done h2 { margin: 0; font-family: var(--font-display); font-size: 1.8rem; }
  .done p { margin: 0 0 10px; color: var(--ink-soft); max-width: 30em; }

  /* ---------- Controls ---------- */
  .controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 18px; }
  .round {
    width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform .2s var(--ease-out), opacity .2s;
  }
  .round:hover { transform: scale(1.06); }
  .round:active { transform: scale(.94); }
  .flip-btn {
    height: 54px; padding: 0 26px; border: 0; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--ink); color: var(--paper);
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .2s var(--ease-out), opacity .2s;
  }
  .flip-btn:hover { transform: scale(1.04); }
  .flip-btn:active { transform: scale(.96); }
  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none; }
  .keys { margin: 22px 0 0; text-align: center; color: var(--ink-soft); font-size: .8rem; }

  /* ---------- Learned tray ---------- */
  .tray { margin-top: 44px; }
  .tray h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-family: var(--font-display); font-size: 1.2rem; }
  .tray ul {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
  }
  .tray li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    animation: rise .35s var(--ease-out) backwards;
  }
  .tick {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: rgba(31, 138, 122, .15); color: var(--teal);
  }
  .tray-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .undo {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 8px; padding: 6px 8px;
    background: transparent; color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .undo:hover { background: rgba(217, 85, 43, .1); }
  .tray .empty {
    margin: 0; padding: 18px; text-align: center;
    color: var(--ink-soft); font-size: .92rem;
    border: 1px dashed var(--line); border-radius: 14px;
  }

  /* ---------- Language picker ---------- */
  .picker {
    position: fixed; inset: 0; z-index: 50;
    display: none; place-items: center; padding: 20px;
    background: rgba(18, 20, 28, .5);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow-y: auto;
  }
  .picker.show { display: grid; animation: fadeIn .3s ease backwards; }
  .picker-panel {
    position: relative; width: min(720px, 100%);
    padding: 36px 32px 30px; border-radius: 28px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .5);
    animation: pop .5s var(--ease-out) backwards;
  }
  .picker-panel h2 {
    margin: 0 0 8px; padding-right: 40px;
    font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15;
  }
  .picker-panel > p { margin: 0 0 24px; color: var(--ink-soft); }
  .close {
    position: absolute; top: 14px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lang-tile {
    position: relative; display: flex; flex-direction: column; gap: 4px;
    padding: 20px 22px; border-radius: 20px; text-align: left;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    cursor: pointer;
    transition: transform .25s var(--ease-out), border-color .2s, box-shadow .25s;
  }
  .lang-tile:hover, .lang-tile:focus-visible {
    transform: translateY(-3px); border-color: var(--accent);
    box-shadow: 0 18px 30px -18px rgba(217, 85, 43, .6);
  }
  .tile-native { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
  .tile-local { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .tile-sample { margin-top: 10px; padding-right: 28px; font-size: .95rem; font-style: italic; color: var(--ink-soft); }
  .tile-sample:lang(ja) { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-style: normal; }
  .tile-go { position: absolute; top: 22px; right: 18px; color: var(--accent); }

  @media (max-width: 640px) {
    .topbar { padding: 18px 16px 0; }
    main#app { padding: 22px 16px 48px; }
    .stage { height: 330px; }
    .card { height: 300px; }
    .face { padding: 20px 22px; }
    .flip-btn { padding: 0 20px; }
    .picker-grid { grid-template-columns: 1fr; }
    .picker-panel { padding: 30px 22px 24px; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4.5 21 3c-1.5-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
    </div>
    <div>
      <h1 data-i18n="appName"></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
  </div>
  <div class="top-actions">
    <div class="seg" id="uiSwitch" role="group" aria-label="Interface language"></div>
    <button class="btn small" id="changeLangBtn" type="button"><span data-i18n="changeLang"></span></button>
  </div>
</header>

<main id="app" hidden>
  <section class="deck-head">
    <span class="chip" id="learningChip"></span>
    <div class="progress">
      <div class="progress-row">
        <strong id="progressText"></strong>
        <span id="remainingText"></span>
      </div>
      <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="10" id="progressBar"><span id="barFill"></span></div>
    </div>
  </section>

  <section class="stage" id="stage">
    <div class="done" id="done">
      <div class="done-badge" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2 data-i18n="doneTitle"></h2>
      <p data-i18n="doneSub"></p>
      <button class="btn primary" id="restartBtn" type="button"><span data-i18n="restart"></span></button>
    </div>
  </section>

  <section class="controls" aria-label="Card navigation">
    <button class="round" id="prevBtn" type="button" data-i18n-aria="prev"></button>
    <button class="flip-btn" id="flipBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg><span data-i18n="flip"></span></button>
    <button class="round" id="nextBtn" type="button" data-i18n-aria="next"></button>
  </section>

  <section class="actions">
    <button class="btn" id="shuffleBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg><span data-i18n="shuffle"></span></button>
    <button class="btn primary" id="learnBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="markLearned"></span></button>
  </section>

  <p class="keys" data-i18n="keys"></p>

  <section class="tray" aria-live="polite">
    <h2 id="trayTitle"></h2>
    <p class="empty" id="trayEmpty" data-i18n="trayEmpty"></p>
    <ul id="trayList"></ul>
  </section>
</main>

<div class="picker" id="picker" role="presentation">
  <div class="picker-panel" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <button class="close" id="pickerClose" type="button" data-i18n-aria="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <h2 id="pickerTitle" data-i18n="chooseTitle"></h2>
    <p data-i18n="chooseSub"></p>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<div class="sr-only" id="live" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- Constants & data ---------- */
  const KEY = 'travel-phrases-flashcards.v1';
  const LANGS = ['en', 'es', 'fr', 'ja'];
  const LOCALE = { en: 'en-US', es: 'es-ES', fr: 'fr-FR', ja: 'ja-JP' };
  const NATIVE = { en: 'English', es: 'Español', fr: 'Français', ja: '日本語' };
  const LANG_NAMES = {
    en: { en: 'English', es: 'Spanish', fr: 'French', ja: 'Japanese' },
    es: { en: 'Inglés', es: 'Español', fr: 'Francés', ja: 'Japonés' },
    fr: { en: 'Anglais', es: 'Espagnol', fr: 'Français', ja: 'Japonais' },
    ja: { en: '英語', es: 'スペイン語', fr: 'フランス語', ja: '日本語' },
  };

  const PHRASES = [

      noSpeech: 'このブラウザは音声読み上げに対応していません。', stampLabel: '覚えた！', shuffled: 'シャッフルしました',
    },

  const ICON_PATHS = {
    speaker: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  };
  const icon = (name, size = 16) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- State ---------- */
  const stage = document.getElementById('stage');
  const $ = s => document.querySelector(s);

  function loadState() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) { saved = {}; }
    const learned = { en: [], es: [], fr: [], ja: [] };
    for (const lang of LANGS) {
      const list = saved.learned && saved.learned[lang];
      if (Array.isArray(list)) learned[lang] = list.filter(id => byId[id]);
    }
    return {
      target: LANGS.includes(saved.target) ? saved.target : null,
      ui: LANGS.includes(saved.ui) ? saved.ui : null,
      learned,
    };
  }
  let state = loadState();

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) { /* storage unavailable */ }
  }

  function detectUI() {
    const tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (const tag of tags) {
      const code = String(tag).slice(0, 2).toLowerCase();
      if (LANGS.includes(code)) return code;
    }
    return 'en';
  }

  let ui = state.ui || detectUI();
  let queue = [];            // ids of unlearned phrases; queue[0] is the top card
  let els = new Map();       // id -> rendered card element (only the top three)
  let busy = false;
  let suppressClick = false;
  let drag = null;

  const t = (key, vars) => {
    let s = (UI[ui] && UI[ui][key]) || UI.en[key] || key;
    if (vars) for (const k in vars) s = s.split(`{${k}}`).join(vars[k]);
    return s;
  };

  // Translation shown on the back: the interface language, unless that is the language being learned.
  function backLang() {
    if (ui !== state.target) return ui;
    return state.target === 'en' ? 'es' : 'en';
  }

  function rebuildQueue() {
    const done = new Set(state.learned[state.target]);
    queue = PHRASES.filter(p => !done.has(p.id)).map(p => p.id);
  }

  /* ---------- Helpers ---------- */
  function announce(message) {
    const live = document.getElementById('live');
    live.textContent = '';
    requestAnimationFrame(() => { live.textContent = message; });
  }

  const sleep = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));

  function animateEl(el, frames, opts) {
    if (!el) return Promise.resolve();
    const anim = el.animate(frames, { ...opts, duration: reduceMotion ? 1 : opts.duration, delay: reduceMotion ? 0 : (opts.delay || 0) });
    return anim.finished.catch(() => {});
  }

  function shuffleInPlace(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(text, lang) {
    if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
      announce(t('noSpeech'));
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LOCALE[lang];
    u.rate = lang === 'ja' ? 0.85 : 0.95;
    speechSynthesis.speak(u);
  }

  /* ---------- Rendering ---------- */
  function applyUI() {
    document.documentElement.lang = ui;
    document.title = `${t('appName')} · Flashcards`;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    document.querySelectorAll('#uiSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ui === ui)));
    renderLearningChip();
    renderProgress();
    renderTray();
  }

  function buildUISwitch() {
    const wrap = document.getElementById('uiSwitch');
    const labels = { en: 'EN', es: 'ES', fr: 'FR', ja: '日本語' };
    wrap.innerHTML = '';
    for (const code of LANGS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.ui = code;
      b.lang = code;
      b.textContent = labels[code];
      b.setAttribute('aria-label', NATIVE[code]);
      b.addEventListener('click', () => setUI(code));
      wrap.append(b);
    }
  }

  function setUI(code) {
    if (code === ui) return;
    ui = code;
    state.ui = code;
    persist();
    applyUI();
    renderPicker();
    if (state.target) {
      clearStack();
      syncStack();
    }
  }

  function renderLearningChip() {
    if (!state.target) return;
    document.getElementById('learningChip').textContent = `${t('learning')} · ${NATIVE[state.target]}`;
  }

  function renderProgress() {
    if (!state.target) return;
    const total = PHRASES.length;
    const n = state.learned[state.target].length;
    document.getElementById('progressText').textContent = t('progress', { n, total });
    document.getElementById('remainingText').textContent = t('remaining', { n: total - n });
    document.getElementById('barFill').style.width = `${(n / total) * 100}%`;
    document.getElementById('progressBar').setAttribute('aria-valuenow', String(n));
  }

  function renderTray() {
    if (!state.target) return;
    const ids = state.learned[state.target];
    const list = document.getElementById('trayList');
    list.innerHTML = '';
    document.getElementById('trayTitle').textContent = `${t('trayTitle')} (${ids.length})`;
    document.getElementById('trayEmpty').hidden = ids.length > 0;
    for (const id of ids) {
      const li = document.createElement('li');
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.innerHTML = icon('check', 14);
      const text = document.createElement('span');
      text.className = 'tray-text';
      text.lang = state.target;
      text.textContent = byId[id][state.target];
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.className = 'undo';
      undo.innerHTML = `${icon('undo', 14)}<span>${t('undo')}</span>`;
      undo.addEventListener('click', () => restore(id));
      li.append(tick, text, undo);
      list.append(li);
    }
  }

  function renderControls() {
    const n = queue.length;
    document.getElementById('prevBtn').disabled = n < 2;
    document.getElementById('nextBtn').disabled = n < 2;
    document.getElementById('shuffleBtn').disabled = n < 2;
    document.getElementById('learnBtn').disabled = n < 1;
    document.getElementById('flipBtn').disabled = n < 1;
  }

  function buildCard(id) {
    const p = byId[id];
    const tgt = state.target;
    const bl = backLang();
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = id;
    el.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <div class="face-top">
            <span class="pill">${t('cat_' + p.cat)}</span>
            <span class="hint">${t('flipHint')}</span>
          </div>
          <div class="phrase" lang="${tgt}">${p[tgt]}</div>
          ${tgt === 'ja' ? `<div class="romaji">${p.romaji}</div>` : ''}
          <div class="face-foot">
            <button type="button" class="listen" aria-label="${t('listen')}">${icon('speaker', 16)}<span>${t('listen')}</span></button>
          </div>
        </div>
        <div class="face back">
          <div class="face-top"><span class="pill light">${t('meaning')} · ${NATIVE[bl]}</span></div>
          <div class="meaning" lang="${bl}">${p[bl]}</div>
          <div class="face-foot"><span class="back-note" lang="${tgt}">${p[tgt]}</span></div>
        </div>
      </div>
      <div class="stamp" aria-hidden="true">${t('stampLabel')}</div>`;
    el.querySelector('.listen').addEventListener('click', e => {
      e.stopPropagation();
      speak(p[tgt], tgt);
    });
    el.addEventListener('pointerdown', onPointerDown);
    el.addEventListener('click', onCardClick);
    return el;
  }

  function clearStack() {
    els.forEach(el => el.remove());
    els.clear();
  }

  // Makes the DOM match the first three entries of the queue, reusing existing elements so CSS transitions animate moves.
  function syncStack(dir = 1) {
    const visible = queue.slice(0, 3);
    for (const [id, el] of els) {
      if (!visible.includes(id)) { el.remove(); els.delete(id); }
    }
    visible.forEach((id, depth) => {
      let el = els.get(id);
      if (!el) {
        el = buildCard(id);
        els.set(id, el);
        if (depth === 0) {
          el.style.setProperty('--from-x', `${dir < 0 ? -60 : 60}px`);
          el.classList.add('enter-top');
        } else {
          el.classList.add('enter');
        }
        el.dataset.depth = depth;
        el.addEventListener('animationend', () => el.classList.remove('enter', 'enter-top'));
        stage.insertBefore(el, document.getElementById('done'));
      }
      el.dataset.depth = depth;
      if (depth !== 0) el.classList.remove('is-flipped');
    });
    document.getElementById('done').classList.toggle('show', state.target !== null && queue.length === 0);
    renderControls();
  }

  function renderDeck() {
    clearStack();
    renderLearningChip();
    renderProgress();
    renderTray();
    syncStack();
  }

  /* ---------- Actions ---------- */
  function flip() {
    if (busy || !queue.length) return;
    const el = els.get(queue[0]);
    if (el) el.classList.toggle('is-flipped');
  }

  async function next(fromX = 0) {
    if (busy || queue.length < 2) return;
    busy = true;
    const id = queue[0];
    const el = els.get(id);
    const from = `translateX(${fromX}px) rotate(${fromX / 22}deg)`;
    await animateEl(el, [
      { transform: from, opacity: 1 },
      { transform: 'translate(-120%, -6%) rotate(-16deg) scale(.92)', opacity: 0 },
    ], { duration: 360, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' });
    queue.push(queue.shift());
    els.delete(id);
    if (el) el.remove();
    syncStack(1);
    busy = false;
  }

  function prev() {
    if (busy || queue.length < 2) return;
    queue.unshift(queue.pop());
    syncStack(-1);
  }

  async function markLearned(fromX = 0) {
    if (busy || !queue.length) return;
    busy = true;
    const id = queue[0];
    const tgt = state.target;
    const el = els.get(id);
    const stamp = el && el.querySelector('.stamp');

    animateEl(stamp, [
      { opacity: 0, transform: 'translate(-50%, -50%) rotate(-14deg) scale(1.6)' },
      { opacity: 1, transform: 'translate(-50%, -50%) rotate(-14deg) scale(1)' },
    ], { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' });

    const from = `translateX(${fromX}px) rotate(${fromX / 22}deg)`;
    await animateEl(el, [
      { transform: from, opacity: 1 },
      { transform: 'translate(120%, -18%) rotate(22deg) scale(.92)', opacity: 0 },
    ], { duration: 420, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });

    queue.shift();
    state.learned[tgt].push(id);
    persist();
    els.delete(id);
    if (el) el.remove();
    syncStack(1);
    renderProgress();
    renderTray();
    if (!queue.length) celebrate();
    announce(t('stampLabel'));
    busy = false;
  }

  function restore(id) {
    if (busy || !state.target) return;
    state.learned[state.target] = state.learned[state.target].filter(x => x !== id);
    persist();
    queue.unshift(id);
    syncStack(1);
    renderProgress();
    renderTray();
  }

  async function shuffle() {
    if (busy || queue.length < 2) return;
    busy = true;
    const shuffleIcon = document.querySelector('#shuffleBtn svg');
    animateEl(shuffleIcon, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 500, easing: 'ease-in-out' });
    els.forEach((el, id) => {
      if (queue.indexOf(id) > 2) return;
      const i = queue.indexOf(id);
      animateEl(el, [
        { transform: 'translateX(0) rotate(0deg)' },
        { transform: `translateX(${i % 2 ? 36 : -36}px) rotate(${i % 2 ? 5 : -5}deg)`, offset: 0.4 },
        { transform: 'translateX(0) rotate(0deg)' },
      ], { duration: 420, delay: i * 70, easing: 'ease-in-out', composite: 'add' });
    });
    await sleep(230);
    shuffleInPlace(queue);
    clearStack();
    syncStack(1);
    announce(t('shuffled'));
    await sleep(220);
    busy = false;
  }

  function restart() {
    if (!state.target) return;
    state.learned[state.target] = [];
    persist();
    rebuildQueue();
    shuffleInPlace(queue);
    renderDeck();
  }

  function celebrate() {
    if (reduceMotion) return;
    const colors = ['#d9552b', '#1f8a7a', '#e0a526', '#3b6fd8', '#c44b9a'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = `${Math.random() * 100}%`;
      c.style.background = colors[i % colors.length];
      stage.append(c);
      c.animate([
        { transform: 'translate(0, -20px) rotate(0deg)', opacity: 1 },
        { transform: `translate(${(Math.random() - 0.5) * 160}px, 380px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0.2 },
      ], {
        duration: 1800 + Math.random() * 1400,
        delay: Math.random() * 250,
        easing: 'cubic-bezier(.2,.6,.5,1)',
        fill: 'forwards',
      }).finished.then(() => c.remove(), () => c.remove());
    }
  }

  /* ---------- Swipe / drag ---------- */
  function onPointerDown(e) {
    if (busy || e.button > 0 || e.target.closest('button')) return;
    const el = e.currentTarget;
    if (el.dataset.depth !== '0') return;
    drag = { el, id: e.pointerId, x0: e.clientX, dx: 0, active: false };
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    if (!drag.active && Math.abs(drag.dx) > 6) {
      drag.active = true;
      drag.el.classList.add('dragging');
    }
    if (!drag.active) return;
    drag.el.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 22}deg)`;
    const stamp = drag.el.querySelector('.stamp');
    if (stamp) stamp.style.opacity = String(Math.max(0, Math.min(1, drag.dx / 120)));
  }

  function snapBack(el) {
    el.style.transition = 'transform .4s var(--ease-out)';
    el.style.transform = '';
    const stamp = el.querySelector('.stamp');
    if (stamp) stamp.style.opacity = '';
    setTimeout(() => { el.style.transition = ''; }, 420);
  }

  function onPointerEnd(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const { el, dx, active } = drag;
    drag = null;
    if (!active) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 60);
    el.classList.remove('dragging');
    el.style.transform = '';
    if (dx > 110 && queue.length) {
      el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      markLearned(dx);
    } else if (dx < -110 && queue.length >= 2) {
      el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      next(dx);
    } else {
      snapBack(el);
    }
  }

  function onCardClick(e) {
    if (e.target.closest('button') || suppressClick) return;
    const el = e.currentTarget;
    if (el.dataset.depth === '0') flip();
  }

  /* ---------- Language picker ---------- */
  function renderPicker() {
    const grid = document.getElementById('pickerGrid');
    grid.innerHTML = '';
    for (const code of LANGS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lang-tile';
      b.dataset.lang = code;
      b.innerHTML = `
        <span class="tile-native" lang="${code}">${NATIVE[code]}</span>
        <span class="tile-local">${LANG_NAMES[ui][code]}</span>
        <span class="tile-sample" lang="${code}">${byId.p6[code]}</span>
        <span class="tile-go" aria-hidden="true">${icon('right', 18)}</span>`;
      b.addEventListener('click', () => chooseLanguage(code));
      grid.append(b);
    }
    document.getElementById('pickerClose').hidden = !state.target;
  }

  function openPicker() {
    renderPicker();
    document.getElementById('picker').classList.add('show');
    setTimeout(() => {
      const first = document.querySelector('.lang-tile[data-lang="' + (state.target || 'en') + '"]');
      if (first) first.focus();
    }, 60);
  }

  function closePicker() {
    if (!state.target) return;
    document.getElementById('picker').classList.remove('show');
  }

  function chooseLanguage(code) {
    state.target = code;
    persist();
    rebuildQueue();
    document.getElementById('app').hidden = false;
    closePicker();
    renderDeck();
  }

  /* ---------- Keyboard ---------- */
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const picker = document.getElementById('picker');
    if (picker.classList.contains('show')) {
      if (e.key === 'Escape') closePicker();
      return;
    }
    if (!state.target) return;
    const target = e.target;
    if (target instanceof Element) {
      if (target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return; // native button activation
    }
    switch (e.key) {
      case 'ArrowLeft': e.preventDefault(); prev(); break;
      case 'ArrowRight': e.preventDefault(); next(); break;
      case ' ': case 'Enter': e.preventDefault(); flip(); break;
      case 'l': case 'L': markLearned(); break;
      case 's': case 'S': shuffle(); break;
      default: break;
    }
  }

  /* ---------- Boot ---------- */
  function init() {
    buildUISwitch();
    applyUI();

    document.getElementById('changeLangBtn').addEventListener('click', openPicker);
    document.getElementById('pickerClose').addEventListener('click', closePicker);
    document.getElementById('picker').addEventListener('click', e => {
      if (e.target.id === 'picker') closePicker();
    });
    document.getElementById('flipBtn').addEventListener('click', flip);
    document.getElementById('prevBtn').addEventListener('click', () => prev());
    document.getElementById('nextBtn').addEventListener('click', () => next());
    document.getElementById('learnBtn').addEventListener('click', () => markLearned());
    document.getElementById('shuffleBtn').addEventListener('click', shuffle);
    document.getElementById('restartBtn').addEventListener('click', restart);

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerEnd);
    window.addEventListener('pointercancel', onPointerEnd);
    document.addEventListener('keydown', onKey);

    if (state.target) {
      rebuildQueue();
      document.getElementById('app').hidden = false;
      renderDeck();
    } else {
      document.getElementById('app').hidden = true;
      openPicker();
    }
  }

  init();
})();
</script>
</body>
</html>
