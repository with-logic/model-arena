<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse every episode, search across shows, subscribe to your favourites and listen in one place.">
<title>Podcast · Home</title>
<style>
:root{
  --bg:#0c0d12;--panel:#14161e;--panel2:#1b1e28;--line:#262a36;
  --text:#f1f2f6;--muted:#9097a8;--accent:#ff8a3d;--accent-2:#ffb35c;--ok:#34d399;--danger:#f87171;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
mark{background:rgba(255,138,61,.28);color:inherit;border-radius:4px;padding:0 2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;padding-bottom:96px}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:-.01em;padding:4px 8px 22px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff4d6d);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(255,108,61,.7)}
.brand-mark svg{width:17px;height:17px;fill:#fff}
.side h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:18px 10px 8px;font-weight:650}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left;color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.nav-item:hover,.nav-item.active{background:var(--panel2);color:var(--text)}
.nav-item em{margin-left:auto;font-style:normal;font-size:12px;background:var(--line);padding:1px 8px;border-radius:99px}
.shows-list{display:flex;flex-direction:column;gap:4px}
.show-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;transition:background .2s}
.show-row:hover,.show-row.active{background:var(--panel2)}
.show-select{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.show-meta{min-width:0}
.show-name{font-weight:620;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-host{font-size:12px;color:var(--muted)}
.sub-btn{font-size:12px;font-weight:650;padding:6px 12px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.sub-btn:hover{background:var(--accent);color:#1a0d05}
.sub-btn.on{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4);color:var(--ok)}
.sub-btn.on:hover{background:rgba(248,113,113,.12);border-color:var(--danger);color:var(--danger)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:12px;color:var(--muted)}

.cover{display:grid;place-items:center;border-radius:12px;color:rgba(255,255,255,.95);font-weight:800;letter-spacing:-.02em;position:relative;overflow:hidden;flex:none;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 8%,rgba(255,255,255,.3),transparent 45%),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.cover span{position:relative;z-index:1;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.cover.xs{width:52px;height:52px;font-size:15px;border-radius:10px}
.cover.sm{width:40px;height:40px;font-size:13px;border-radius:10px}
.cover.md{width:68px;height:68px;font-size:20px}
.cover.lg{width:220px;height:220px;font-size:60px;border-radius:20px}

.main{min-width:0;padding:28px clamp(16px,3vw,44px) 40px}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:28px}
.search{flex:1;position:relative;max-width:640px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--muted);pointer-events:none}
.search input{width:100%;padding:13px 56px 13px 44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);outline:none;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:#6b7184}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,138,61,.15)}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;pointer-events:none}
.sort{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);margin-left:auto}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;padding:28px;border-radius:24px;background:radial-gradient(900px 300px at 0% 0%,var(--glow,rgba(255,138,61,.25)),transparent 70%),linear-gradient(120deg,#1d1a22 0%,#151821 70%);border:1px solid var(--line);margin-bottom:36px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-2);font-weight:750}
.hero h1{font-size:clamp(24px,3vw,38px);line-height:1.12;margin:8px 0 10px;letter-spacing:-.025em}
.hero p{color:#c3c8d5;margin:0 0 20px;max-width:62ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero-meta{color:var(--muted);font-size:13px;margin-bottom:6px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:linear-gradient(135deg,var(--accent),#ff5e62);color:#1a0d05;font-weight:750;box-shadow:0 12px 28px -12px rgba(255,108,61,.8);transition:transform .15s,box-shadow .15s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 32px -12px rgba(255,108,61,.9)}
.btn-primary svg{width:18px;height:18px;fill:currentColor}
.btn-outline{padding:11px 20px;border-radius:99px;border:1px solid var(--line);font-weight:650;background:rgba(255,255,255,.03);transition:border-color .2s}
.btn-outline:hover{border-color:var(--accent)}
.btn-outline.on{border-color:rgba(52,211,153,.5);color:var(--ok)}

.list-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.list-head h2{margin:0;font-size:22px;letter-spacing:-.02em}
#count{color:var(--muted);font-size:14px}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;color:var(--muted);font-weight:650;font-size:14px;transition:color .2s,background .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tab em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.list-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.episodes{display:flex;flex-direction:column;gap:6px}
.ep{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px;border-radius:18px;border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.ep:hover{background:var(--panel);border-color:var(--line)}
.ep:focus-visible{outline-offset:-2px}
.ep.current{background:linear-gradient(90deg,rgba(255,138,61,.1),transparent 65%);border-color:rgba(255,138,61,.28)}
.ep-art{position:relative;border-radius:12px}
.ep-overlay{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;background:rgba(8,9,12,.55);opacity:0;transition:opacity .2s;color:#fff}
.ep:hover .ep-overlay,.ep.current .ep-overlay{opacity:1}
.ep-overlay svg{width:22px;height:22px;fill:currentColor;margin-left:2px}
.ep-body{min-width:0}
.ep-show{font-size:11.5px;color:var(--accent-2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.ep-title{margin:3px 0 4px;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.current .ep-title{color:var(--accent-2)}
.ep-desc{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:8px;align-items:center}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.ep-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:64px}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(52,211,153,.12);color:var(--ok);font-weight:650}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;height:4px;background:currentColor;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

.empty{text-align:center;padding:56px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:20px}
.empty h3{color:var(--text);margin:0 0 6px;font-size:18px}
.empty .btn-outline{margin-top:14px;color:var(--text);background:none}

/* ---------- player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;height:88px;display:grid;grid-template-columns:minmax(200px,1fr) minmax(280px,2fr) minmax(170px,1fr);align-items:center;gap:24px;padding:0 20px;background:rgba(14,16,22,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);z-index:10}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now-text{min-width:0}
.now-show{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.now-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.controls{display:flex;align-items:center;gap:16px}
.ctl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .15s}
.ctl:hover:not(:disabled){background:var(--panel2)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.ctl small{position:absolute;font-size:9px;font-weight:800;top:50%;left:50%;transform:translate(-50%,-50%);margin-top:1px;pointer-events:none}
.play-main{width:48px;height:48px;background:var(--text);color:#0c0d12}
.play-main:hover:not(:disabled){background:#fff;transform:scale(1.05)}
.play-main svg{width:24px;height:24px}
.scrub{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub span{min-width:40px}
.scrub span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));outline:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,138,61,.22)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.3}
.extras{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.chip{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;min-width:58px;transition:border-color .2s}
.chip:hover:not(:disabled){border-color:var(--accent)}
.vol{display:flex;align-items:center;gap:8px;width:130px;color:var(--muted)}
.vol svg{width:18px;height:18px;fill:currentColor;flex:none}

.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;transition:opacity .3s,transform .3s;pointer-events:none;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding-bottom:104px}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
  .side-foot{display:none}
  .shows-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .show-row{min-width:250px}
  .hero{grid-template-columns:1fr;padding:22px}
  .hero .cover.lg{width:100%;height:auto;aspect-ratio:1;max-width:260px}
}
@media (max-width:720px){
  .app{padding-bottom:150px}
  .player{grid-template-columns:minmax(0,1fr) auto;height:auto;padding:12px 14px;gap:10px 12px}
  .transport{grid-column:1/-1;order:3}
  .extras{display:none}
  .toast{bottom:160px}
  .topbar{flex-wrap:wrap}
  .sort{margin-left:0}
  .ep{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px}
  .ep .cover.md{width:56px;height:56px}
  .ep-side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Sidebar: shows & subscriptions ===== -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 10h2v4H3zm4-4h2v12H7zm4-3h2v18h-2zm4 4h2v10h-2zm4 2h2v6h-2z"/></svg>
      </div>
      Podcast
    </div>

    <h2>Library</h2>
    <nav aria-label="Shows">
      <button class="nav-item active" data-action="show" data-show="all" id="navAll">
        All episodes <em id="navAllCount"></em>
      </button>
    </nav>

    <h2>Shows</h2>
    <div class="shows-list" id="shows"></div>

    <div class="side-foot">
      Preview audio is synthesized in your browser, so every episode plays offline.
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">
    <div class="topbar">
      <label class="search">
        <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search episodes</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.39-1.42 1.42-5.39-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="search" type="search" placeholder="Search episodes, shows, or hosts" autocomplete="off">
        <span class="kbd" id="kbdHint">/</span>
      </label>
      <select id="sort" class="sort" aria-label="Sort episodes">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <section id="hero" class="hero" aria-live="polite"></section>

    <div class="list-head">
      <h2 id="listTitle">All episodes</h2>
      <span id="count"></span>
    </div>
    <div class="list-tools">
      <div class="tabs" id="tabs" role="tablist" aria-label="Filter episodes"></div>
    </div>

    <div id="list" class="episodes"></div>
  </main>
</div>

<!-- ===== Player ===== -->
<footer class="player" aria-label="Audio player">
  <div class="now">
    <div id="pCover"></div>
    <div class="now-text">
      <div class="now-show" id="pShow">Podcast</div>
      <div class="now-title" id="pTitle">Choose an episode to start listening</div>
    </div>
  </div>

  <div class="transport">
    <div class="controls">
      <button class="ctl" id="btnBack" aria-label="Back 15 seconds" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>15</small>
      </button>
      <button class="ctl play-main" id="btnPlay" aria-label="Play" disabled></button>
      <button class="ctl" id="btnFwd" aria-label="Forward 30 seconds" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><small>30</small>
      </button>
    </div>
    <div class="scrub">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Seek" disabled>
      <span id="tRem">-0:00</span>
    </div>
  </div>

  <div class="extras">
    <button class="chip" id="btnSpeed" aria-label="Playback speed" disabled>1×</button>
    <label class="vol">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume">
    </label>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------------- Data ---------------- */
const SHOWS = [
  { id:'signal', name:'Signal & Noise', host:'Maya Ortiz', category:'Technology', hue:[252,192],
    blurb:'Long-form conversations about the machines we build and the people who argue with them.' },
  { id:'slow-kitchen', name:'The Slow Kitchen', host:'Theo Park', category:'Food & Culture', hue:[24,348],
    blurb:'Recipes, memories, and the patience it takes to cook something worth waiting for.' },
  { id:'field-notes', name:'Field Notes', host:'Priya Raman', category:'Science', hue:[162,204],
    blurb:'Scientists explain the strange, small discoveries that quietly change how we see the world.' },
  { id:'late-shift', name:'Late Shift', host:'Jonah Briggs', category:'Stories', hue:[276,322],
    blurb:'True stories told after midnight by the people who were awake to live them.' },
];

// [showId, title, description, daysAgo, minutes]
const RAW = [
  ['signal','Why Your Model Forgets Things','Memory in neural networks is a design choice, not an accident. We trace where context goes and what it costs.',2,47],
  ['slow-kitchen','Bread Takes the Time It Takes','A starter, a rainy Tuesday, and what fermentation teaches about attention.',4,33],
  ['late-shift','The Elevator at Floor Eleven','A night security guard describes the one floor nobody else ever visited.',3,36],
  ['field-notes','Moss Remembers Every Storm','A botanist on how lichens and mosses record weather in their growth rings.',6,55],
  ['signal','The Quiet Revolution in Compilers','A compiler engineer walks us through a decade of making slow code fast without making it wrong.',9,52],
  ['slow-kitchen','Grandmother\'s Dumpling Folds','Reconstructing a recipe from memory, measuring by hand, and forgiving the imperfect batch.',11,41],
  ['late-shift','Last Train to Nowhere','A conductor remembers the route that was cut, and the regulars who kept riding it.',12,40],
  ['field-notes','The Night the Ocean Glowed','Bioluminescence, plankton blooms, and the satellite images that caught them.',14,49],
  ['signal','Open Weights, Closed Doors','Who gets to inspect the systems that now write our emails? A debate with two researchers who disagree.',16,61],
  ['late-shift','Diner, 3 a.m.','Four strangers, one counter, and the conversation that changed a career.',19,31],
  ['field-notes','Counting Birds at Dawn','Citizen science, sleepy volunteers, and a dataset that now spans three decades.',21,42],
  ['signal','Latency Is a Feeling','Designing interfaces that respond before you finish the thought.',23,38],
  ['slow-kitchen','Stock, Scraps, and Patience','The most honest pot on the stove: what to save, what to simmer, and what to throw out.',18,28],
  ['slow-kitchen','Cooking for One Well','Small portions, big ideas, and why solo dinners deserve the good plates.',27,36],
  ['signal','Benchmarks Lie Politely','Why leaderboards are useful, dangerous, and almost always misread.',31,44],
  ['field-notes','Ice Cores and Lost Summers','Reading the climate record in frozen air bubbles, one careful slice at a time.',34,58],
  ['late-shift','The Lighthouse Logbook','Keeping the record when nobody is watching: a keeper reads his grandfather\'s entries.',29,46],
  ['signal','Teaching Machines to Say "I Don\'t Know"','Calibration, humility, and why confidence is the most dangerous feature.',38,50],
  ['slow-kitchen','A Pot of Beans, Restored','Heirloom beans, a borrowed clay pot, and a slow Sunday reunion.',42,30],
  ['field-notes','Tiny Lives Under the Floorboards','Urban ecology, forgotten species, and the neighbors we never meet.',45,39],
  ['late-shift','Radio Silence','A ham operator makes contact with a ship that should not exist.',48,44],
];

const SHOW_BY_ID = Object.fromEntries(SHOWS.map(s => [s.id, s]));
const BASE_DATE = Date.UTC(2026, 10, 13);
const STEP = 0.25;        // seconds of track time per arpeggio step
const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
const SCALES = [[0,2,3,5,7,8,10], [0,2,4,5,7,9,11]];   // minor, major
const PROGS = [[0,5,3,4],[0,3,4,3],[0,4,5,3]];           // chord roots as scale degrees

const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);

const EPISODES = RAW.map(([showId, title, desc, daysAgo, minutes], i) => {
  const h = hash(showId + title);
  return {
    id: 'ep' + (i + 1),
    showId,
    title,
    desc,
    date: new Date(BASE_DATE - daysAgo * 864e5),
    duration: minutes * 60,
    root: 110 * Math.pow(2, (h % 12) / 12),
    scale: SCALES[(h >> 4) & 1],
    prog: PROGS[(h >> 7) % PROGS.length],
  };
}).sort((a, b) => b.date - a.date);

const EP_BY_ID = Object.fromEntries(EPISODES.map(e => [e.id, e]));

/* ---------------- Persistence ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('podcast.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('podcast.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

const subs = new Set(store.get('subs', ['signal']));
const progress = store.get('progress', {});
const state = {
  show: 'all',
  tab: 'all',
  query: '',
  sort: 'newest',
  volume: store.get('volume', 0.8),
  speed: store.get('speed', 1),
};

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const initials = n => n.split(/\s+/).filter(w => /[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const fmtDur = sec => {
  const s = Math.max(0, Math.round(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(r)}` : `${m}:${p(r)}`;
};
const fmtDate = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
const terms = () => state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);

function hl(text) {
  const t = terms();
  if (!t.length) return esc(text);
  const re = new RegExp('(' + t.map(escRe).join('|') + ')', 'gi');
  return text.split(re).map((p, i) => (i % 2 ? `<mark>${esc(p)}</mark>` : esc(p))).join('');
}

function coverHTML(show, size) {
  const [a, b] = show.hue;
  return `<div class="cover ${size}" style="background:linear-gradient(135deg,hsl(${a} 85% 62%),hsl(${b} 70% 36%))" aria-hidden="true"><span>${esc(initials(show.name))}</span></div>`;
}

const ICON = {
  play:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
};

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- Audio engine ----------------
   Generates a soft ambient bed per episode with the Web Audio API so the
   player works offline. Swap this engine for an <audio> element when real
   episode URLs are available; the UI only talks to `engine`. */
const engine = {
  ctx: null, out: null, ep: null, playing: false,
  offset: 0, startAt: 0, nextK: 0, timer: null, lastSave: 0,
  active: new Set(),

  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.out = this.ctx.createGain();
      this.out.gain.value = state.volume;
      this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },

  position() {
    if (!this.ep) return 0;
    if (!this.playing) return this.offset;
    const p = this.offset + (this.ctx.currentTime - this.startAt) * state.speed;
    return Math.min(this.ep.duration, Math.max(this.offset, p));
  },

  load(ep) {
    this.stopNodes();
    clearInterval(this.timer);
    this.playing = false;
    this.ep = ep;
    const saved = progress[ep.id] || 0;
    this.offset = saved > 0 && saved < ep.duration - 1 ? saved : 0;
  },

  play() {
    if (!this.ep) return;
    if (!this.ensure()) { toast('Audio playback is not supported in this browser.'); return; }
    if (this.playing) return;
    if (this.offset >= this.ep.duration - 0.5) this.offset = 0;
    this.playing = true;
    this.startAt = this.ctx.currentTime + 0.03;
    this.nextK = Math.ceil(this.offset / STEP - 1e-9);
    this.timer = setInterval(() => this.tick(), 60);
    this.tick();
    notify();
  },

  pause() {
    if (!this.playing) return;
    const p = this.position();
    this.playing = false;
    clearInterval(this.timer);
    this.stopNodes();
    this.offset = p;
    this.saveNow();
    notify();
  },

  seek(t) {
    if (!this.ep) return;
    const target = Math.min(this.ep.duration, Math.max(0, t));
    this.stopNodes();
    this.offset = target;
    this.nextK = Math.ceil(target / STEP - 1e-9);
    if (this.playing) this.startAt = this.ctx.currentTime;
    this.saveNow();
    updatePlayerUI();
  },

  stopNodes() {
    this.active.forEach(o => { try { o.stop(); } catch (e) { /* already stopped */ } });
    this.active.clear();
  },

  tick() {
    if (!this.playing) return;
    const now = this.ctx.currentTime, horizon = now + 0.25, dur = this.ep.duration;
    for (;;) {
      const t = this.nextK * STEP;
      if (t >= dur) break;
      const when = this.startAt + (t - this.offset) / state.speed;
      if (when > horizon) break;
      this.schedule(this.nextK, Math.max(when, now));
      this.nextK++;
    }
    if (this.position() >= dur) { this.finish(); return; }
    if (performance.now() - this.lastSave > 2000) this.saveNow();
    updatePlayerUI();
  },

  finish() {
    this.playing = false;
    clearInterval(this.timer);
    this.stopNodes();
    this.offset = this.ep.duration;
    this.saveNow();
    toast(`Finished “${this.ep.title}”`);
    notify();
  },

  schedule(k, when) {
    const ep = this.ep, s = state.speed, j = k % 8, d = ep.prog[Math.floor(k / 8) % ep.prog.length];
    const hz = deg => ep.root * Math.pow(2, (ep.scale[((deg % 7) + 7) % 7] + 12 * Math.floor(deg / 7)) / 12);
    if (j === 0) {
      this.tone(hz(d - 14), when, 1.8 / s, 'sine', 0.16);
      [0, 2, 4].forEach(o => this.tone(hz(d + o - 7), when, 2.2 / s, 'triangle', 0.035));
    }
    const arp = [0, 1, 2, 1, 0, 2, 1, 2][j];
    const octave = ((k >> 3) % 2) * 7;
    this.tone(hz(d + [0, 2, 4][arp] + octave), when, 0.22 / s, 'sine', 0.06);
  },

  tone(freq, when, dur, type, peak) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(peak, when + Math.min(0.06, dur * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    g.connect(this.out);
    o.start(when);
    o.stop(when + dur + 0.05);
    this.active.add(o);
    o.onended = () => { this.active.delete(o); o.disconnect(); g.disconnect(); };
  },

  saveNow() {
    if (!this.ep) return;
    const pos = this.position();
    progress[this.ep.id] = pos >= this.ep.duration - 1 ? this.ep.duration : Math.round(pos);
    store.set('progress', progress);
    this.lastSave = performance.now();
    const bar = document.querySelector(`[data-ep="${this.ep.id}"] .bar i`);
    if (bar) bar.style.width = (progress[this.ep.id] / this.ep.duration * 100).toFixed(1) + '%';
  },
};

function togglePlay(ep) {
  if (!ep) return;
  if (engine.ep && engine.ep.id === ep.id) {
    engine.playing ? engine.pause() : engine.play();
    return;
  }
  engine.pause();
  engine.load(ep);
  engine.play();
}

function setSpeed(s) {
  const p = engine.position();
  state.speed = s;
  store.set('speed', s);
  if (engine.playing) engine.seek(p);
  updatePlayerUI();
  updatePlayerInfo();
}

/* ---------------- Filtering ---------------- */
const inProgress = e => (progress[e.id] || 0) > 0 && (progress[e.id] || 0) < e.duration - 1;

function scopedEpisodes() {
  return EPISODES.filter(e => state.show === 'all' || e.showId === state.show);
}

function filteredEpisodes() {
  const t = terms();
  const list = scopedEpisodes().filter(e => {
    if (state.tab === 'subscribed' && !subs.has(e.showId)) return false;
    if (state.tab === 'progress' && !inProgress(e)) return false;
    if (!t.length) return true;
    const s = SHOW_BY_ID[e.showId];
    const hay = `${e.title} ${e.desc} ${s.name} ${s.host} ${s.category}`.toLowerCase();
    return t.every(term => hay.includes(term));
  });
  list.sort((a, b) => state.sort === 'newest' ? b.date - a.date : a.date - b.date);
  return list;
}

/* ---------------- Rendering ---------------- */
function renderSidebar() {
  $('#navAllCount').textContent = EPISODES.length;
  $('#navAll').classList.toggle('active', state.show === 'all');
  $('#shows').innerHTML = SHOWS.map(s => {
    const on = subs.has(s.id);
    return `
      <div class="show-row ${state.show === s.id ? 'active' : ''}">
        <button class="show-select" data-action="show" data-show="${s.id}" aria-pressed="${state.show === s.id}">
          ${coverHTML(s, 'sm')}
          <span class="show-meta">
            <span class="show-name" style="display:block">${esc(s.name)}</span>
            <span class="show-host" style="display:block">${esc(s.host)}</span>
          </span>
        </button>
        <button class="sub-btn ${on ? 'on' : ''}" data-action="sub" data-show="${s.id}" aria-pressed="${on}"
          aria-label="${on ? 'Unsubscribe from' : 'Subscribe to'} ${esc(s.name)}">${on ? 'Subscribed' : 'Subscribe'}</button>
      </div>`;
  }).join('');
}

function renderHero() {
  const el = $('#hero');
  const visible = !state.query.trim() && state.tab === 'all';
  el.hidden = !visible;
  if (!visible) return;

  if (state.show === 'all') {
    const latest = EPISODES[0];
    const s = SHOW_BY_ID[latest.showId];
    el.style.setProperty('--glow', 'rgba(255,138,61,.28)');
    el.innerHTML = `
      ${coverHTML(s, 'lg')}
      <div>
        <div class="eyebrow">Latest episode · ${esc(s.name)}</div>
        <h1>${esc(latest.title)}</h1>
        <p>${esc(latest.desc)}</p>
        <div class="hero-meta">${esc(s.host)} · ${fmtDate(latest.date)} · ${fmtDur(latest.duration)}</div>
        <div class="hero-actions">
          <button class="btn-primary" data-ep="${latest.id}">${ICON.play}${engine.playing && engine.ep === latest ? 'Pause' : 'Play episode'}</button>
          ${subBtn(s, 'btn-outline')}
        </div>
      </div>`;
  } else {
    const s = SHOW_BY_ID[state.show];
    const eps = scopedEpisodes();
    const latest = eps[0];
    el.style.setProperty('--glow', `hsla(${s.hue[0]},85%,60%,.3)`);
    el.innerHTML = `
      ${coverHTML(s, 'lg')}
      <div>
        <div class="eyebrow">Show · ${esc(s.category)}</div>
        <h1>${esc(s.name)}</h1>
        <p>${esc(s.blurb)}</p>
        <div class="hero-meta">Hosted by ${esc(s.host)} · ${eps.length} episodes</div>
        <div class="hero-actions">
          ${latest ? `<button class="btn-primary" data-ep="${latest.id}">${ICON.play}Play latest</button>` : ''}
          ${subBtn(s, 'btn-outline')}
        </div>
      </div>`;
  }
}

function subBtn(s, cls) {
  const on = subs.has(s.id);
  return `<button class="${cls} ${on ? 'on' : ''}" data-action="sub" data-show="${s.id}" aria-pressed="${on}">${on ? '✓ Subscribed' : '+ Subscribe'}</button>`;
}

function renderTabs() {
  const base = scopedEpisodes();
  const count = {
    all: base.length,
    subscribed: base.filter(e => subs.has(e.showId)).length,
    progress: base.filter(inProgress).length,
  };
  const labels = { all: 'All', subscribed: 'Subscribed', progress: 'In progress' };
  $('#tabs').innerHTML = Object.keys(labels).map(k => `
    <button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${labels[k]}<em>${count[k]}</em></button>`).join('');
}

function rowHTML(e) {
  const s = SHOW_BY_ID[e.showId];
  const pos = progress[e.id] || 0;
  const pct = Math.min(100, pos / e.duration * 100);
  const done = pos >= e.duration - 1;
  const current = engine.ep && engine.ep.id === e.id;
  const playing = current && engine.playing;
  return `
    <article class="ep ${current ? 'current' : ''}" data-ep="${e.id}" role="button" tabindex="0"
      aria-label="${current && playing ? 'Pause' : 'Play'} ${esc(e.title)}">
      <div class="ep-art">
        ${coverHTML(s, 'md')}
        <span class="ep-overlay">${playing
          ? `<span class="eq"><i></i><i></i><i></i></span>`
          : ICON.play}</span>
      </div>
      <div class="ep-body">
        <div class="ep-show">${esc(s.name)}</div>
        <h3 class="ep-title">${hl(e.title)}</h3>
        <p class="ep-desc">${hl(e.desc)}</p>
        <div class="ep-meta">
          <span>${fmtDate(e.date)}</span><span aria-hidden="true">·</span>
          <span>${esc(s.host)}</span>
          ${done ? '<span class="badge">Played</span>' : ''}
        </div>
        <div class="bar"><i style="width:${done ? 100 : pct.toFixed(1)}%"></i></div>
      </div>
      <div class="ep-side">
        <span>${fmtDur(e.duration)}</span>
        ${!done && pos > 0 ? `<span>${fmtDur(e.duration - pos)} left</span>` : ''}
      </div>
    </article>`;
}

function renderList() {
  const list = filteredEpisodes();
  $('#count').textContent = `${list.length} episode${list.length === 1 ? '' : 's'}`;
  $('#listTitle').textContent = state.show === 'all' ? 'All episodes' : `${SHOW_BY_ID[state.show].name}`;
  if (!list.length) {
    let msg = 'Try a different search or filter.';
    if (state.tab === 'subscribed' && !subs.size) msg = 'Subscribe to a show to see its episodes here.';
    if (state.tab === 'progress') msg = 'Start an episode and your place will be saved here.';
    $('#list').innerHTML = `
      <div class="empty">
        <h3>${state.query.trim() ? `No episodes match “${esc(state.query.trim())}”` : 'Nothing here yet'}</h3>
        <div>${msg}</div>
        <button class="btn-outline" data-action="reset">Clear search and filters</button>
      </div>`;
    return;
  }
  $('#list').innerHTML = list.map(rowHTML).join('');
}

function renderMain() {
  renderHero();
  renderTabs();
  renderList();
}

function updatePlayerInfo() {
  const ep = engine.ep, has = !!ep;
  const s = has ? SHOW_BY_ID[ep.showId] : null;
  $('#pTitle').textContent = has ? ep.title : 'Choose an episode to start listening';
  $('#pShow').textContent = has ? s.name : 'Podcast';
  $('#pCover').innerHTML = has ? coverHTML(s, 'xs')
    : '<div class="cover xs" style="background:var(--panel2);box-shadow:none"><span>♪</span></div>';
  ['#btnBack', '#btnFwd', '#btnPlay', '#seek', '#btnSpeed'].forEach(sel => { $(sel).disabled = !has; });
  $('#btnPlay').innerHTML = engine.playing ? ICON.pause : ICON.play;
  $('#btnPlay').setAttribute('aria-label', engine.playing ? 'Pause' : 'Play');
  $('#btnSpeed').textContent = state.speed + '×';
  if (has) $('#seek').max = ep.duration;
  syncMediaSession();
}

let seeking = false;
function updatePlayerUI() {
  const ep = engine.ep, pos = engine.position(), dur = ep ? ep.duration : 0;
  $('#tCur').textContent = fmtDur(pos);
  $('#tRem').textContent = '-' + fmtDur(dur - pos);
  const seek = $('#seek');
  seek.max = dur || 1;
  if (!seeking) seek.value = pos;
  seek.style.setProperty('--p', dur ? (pos / dur * 100).toFixed(2) + '%' : '0%');
}

function notify() {
  renderList();
  updatePlayerInfo();
  updatePlayerUI();
  document.title = engine.ep && engine.playing ? `${engine.ep.title} · Podcast` : 'Podcast · Home';
}

function syncMediaSession() {
  if (!('mediaSession' in navigator) || !engine.ep) return;
  const s = SHOW_BY_ID[engine.ep.showId];
  if (typeof MediaMetadata !== 'undefined') {
    navigator.mediaSession.metadata = new MediaMetadata({ title: engine.ep.title, artist: s.host, album: s.name });
  }
  navigator.mediaSession.playbackState = engine.playing ? 'playing' : 'paused';
}

/* ---------------- Actions ---------------- */
function setShow(id) {
  state.show = id;
  renderSidebar();
  renderMain();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleSub(id) {
  const s = SHOW_BY_ID[id];
  if (subs.has(id)) { subs.delete(id); toast(`Unsubscribed from ${s.name}`); }
  else { subs.add(id); toast(`Subscribed to ${s.name}`); }
  store.set('subs', [...subs]);
  renderSidebar();
  renderMain();
}

function resetFilters() {
  state.query = '';
  state.tab = 'all';
  state.show = 'all';
  $('#search').value = '';
  renderSidebar();
  renderMain();
}

/* ---------------- Events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  const sub = t.closest('[data-action="sub"]');
  if (sub) { toggleSub(sub.dataset.show); return; }
  const show = t.closest('[data-action="show"]');
  if (show) { setShow(show.dataset.show); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderMain(); return; }
  if (t.closest('[data-action="reset"]')) { resetFilters(); return; }
  const ep = t.closest('[data-ep]');
  if (ep) { togglePlay(EP_BY_ID[ep.dataset.ep]); }
});

$('#search').addEventListener('input', e => { state.query = e.target.value; renderMain(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });
$('#sort').value = state.sort;

$('#search').addEventListener('focus', () => { $('#kbdHint').hidden = true; });
$('#search').addEventListener('blur', () => { $('#kbdHint').hidden = !!state.query; });

document.addEventListener('keydown', e => {
  const tag = e.target.tagName || '';
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); $('#search').focus(); return; }
  if (e.key === 'Escape' && e.target.id === 'search') {
    e.target.value = ''; state.query = ''; e.target.blur(); renderMain(); return;
  }
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.key === ' ' && tag !== 'BUTTON' && engine.ep) {
    e.preventDefault();
    engine.playing ? engine.pause() : engine.play();
  } else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.ep) {
    togglePlay(EP_BY_ID[e.target.dataset.ep]);
  } else if (engine.ep && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    engine.seek(engine.position() + (e.key === 'ArrowRight' ? 15 : -15));
  }
});

// Player controls
$('#btnPlay').addEventListener('click', () => { engine.playing ? engine.pause() : engine.play(); });
$('#btnBack').addEventListener('click', () => engine.seek(engine.position() - 15));
$('#btnFwd').addEventListener('click', () => engine.seek(engine.position() + 30));
$('#btnSpeed').addEventListener('click', () => {
  const i = SPEEDS.indexOf(state.speed);
  setSpeed(SPEEDS[(i + 1) % SPEEDS.length]);
});

const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  seeking = true;
  $('#tCur').textContent = fmtDur(+seekEl.value);
  $('#tRem').textContent = '-' + fmtDur(engine.ep.duration - +seekEl.value);
  seekEl.style.setProperty('--p', (seekEl.value / engine.ep.duration * 100).toFixed(2) + '%');
});
seekEl.addEventListener('change', () => { seeking = false; engine.seek(+seekEl.value); });

const volEl = $('#vol');
volEl.value = state.volume;
volEl.addEventListener('input', () => {
  state.volume = +volEl.value;
  store.set('volume', state.volume);
  if (engine.out) engine.out.gain.setTargetAtTime(state.volume, engine.ctx.currentTime, 0.02);
});

// Lock-screen / headset controls
if ('mediaSession' in navigator) {
  const actions = {
    play: () => engine.play(),
    pause: () => engine.pause(),
    seekbackward: () => engine.seek(engine.position() - 15),
    seekforward: () => engine.seek(engine.position() + 30),
  };
  Object.entries(actions).forEach(([name, fn]) => {
    try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) { /* unsupported action */ }
  });
}

// Save position when the tab is hidden or closed
window.addEventListener('pagehide', () => engine.saveNow());

/* ---------------- Init ---------------- */
renderSidebar();
renderMain();
updatePlayerInfo();
updatePlayerUI();
})();
</script>
</body>
</html>
