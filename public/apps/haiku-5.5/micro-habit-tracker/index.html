<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="description" content="Micro Habit Tracker: track up to 7 daily habits with streaks, skips, and simple charts. Private, offline, and stored in your browser.">
<title>Micro Habit Tracker</title>
<style>
  :root {
    --bg: #f5f4ff;
    --surface: #ffffff;
    --surface-2: #efedfb;
    --ink: #1d1b33;
    --muted: #6b6887;
    --line: #e4e1f5;
    --accent: #6d5dfc;
    --skip: #f5b93b;
    --danger: #e5484d;
    --grad: linear-gradient(135deg, #6d5dfc 0%, #a95cff 50%, #ff7a59 100%);
    --radius: 18px;
    --shadow: 0 1px 2px rgba(29, 27, 51, .06), 0 10px 28px -12px rgba(29, 27, 51, .18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f1c;
      --surface: #1a1930;
      --surface-2: #26243f;
      --ink: #f3f1ff;
      --muted: #a4a1c6;
      --line: #322f50;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 480px at -10% -15%, rgba(109, 93, 252, .20), transparent 60%),
      radial-gradient(800px 420px at 110% 0%, rgba(255, 122, 89, .16), transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  [hidden] { display: none !important; }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    display: grid;
    gap: 18px;
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--grad);
    display: grid; place-items: center;
    color: #fff; font-size: 22px;
    box-shadow: 0 10px 22px -10px rgba(109, 93, 252, .8);
    flex: none;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; line-height: 1.1; }
  .tagline { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border-radius: 14px; padding: 8px 12px;
    box-shadow: var(--shadow); min-width: 84px;
    display: flex; flex-direction: column;
  }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { font-size: 12px; color: var(--muted); }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--grad);
    color: #fff;
    border-radius: 24px;
    padding: 22px;
    display: flex;
    gap: 22px;
    align-items: center;
    box-shadow: 0 24px 44px -24px rgba(109, 93, 252, .75);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: auto -60px -90px auto; width: 240px; height: 240px;
    border-radius: 50%; background: rgba(255, 255, 255, .12); pointer-events: none;
  }
  .ring { position: relative; width: 116px; height: 116px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255, 255, 255, .25); }
  .ring .progress { stroke: #fff; transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }
  .ring-text {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1.05;
  }
  .ring-text b { font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .ring-text span { font-size: 11px; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }
  .hero-body { min-width: 0; flex: 1; display: grid; gap: 10px; }
  .day-nav { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 14px; }
  .day-nav .label {
    background: rgba(255, 255, 255, .18); border: 0; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .day-nav .label:hover { background: rgba(255, 255, 255, .28); }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, .18); color: #fff; font-size: 18px; line-height: 1;
    display: grid; place-items: center; flex: none;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, .3); }
  .motivation { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer;
    font-weight: 650; font-size: 14px; background: var(--surface-2); color: var(--ink);
    transition: transform .12s ease, background .2s ease;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.on-hero { background: rgba(255, 255, 255, .2); color: #fff; }
  .btn.on-hero:hover:not(:disabled) { background: rgba(255, 255, 255, .32); }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 8px 18px -8px var(--accent); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }

  /* ---------- Layout columns ---------- */
  .cols { display: grid; gap: 18px; align-items: start; }
  @media (min-width: 840px) {
    .cols { grid-template-columns: 1.1fr 1fr; }
  }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 4px 2px 10px;
  }
  .section-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
  .section-head small { color: var(--muted); font-size: 12px; }

  .habit-list { display: grid; gap: 10px; }

  /* ---------- Habit cards ---------- */
  .habit {
    --c: var(--accent);
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 12px 12px 12px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    border: 1px solid transparent;
    transition: background .3s ease, border-color .3s ease;
    position: relative;
  }
  .habit::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px;
    border-radius: 0 4px 4px 0; background: var(--c);
  }
  .habit.is-done {
    background: color-mix(in srgb, var(--c) 9%, var(--surface));
    border-color: color-mix(in srgb, var(--c) 35%, transparent);
  }
  .check {
    width: 52px; height: 52px; border-radius: 17px; cursor: pointer;
    border: 2px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: var(--surface-2);
    display: grid; place-items: center; padding: 0; flex: none;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .check:hover { border-color: var(--c); }
  .check:active { transform: scale(.9); }
  .check svg {
    width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 3.2;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transform: scale(.4) rotate(-20deg);
    transition: opacity .2s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .check.done { background: var(--c); border-color: var(--c); box-shadow: 0 8px 18px -8px var(--c); }
  .check.done svg { opacity: 1; transform: none; }
  .check.skip {
    border-color: var(--skip);
    background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--skip) 28%, transparent) 0 6px, transparent 6px 12px);
  }
  .check.skip::after { content: "⏭"; font-size: 16px; }

  .habit-info { min-width: 0; display: grid; gap: 4px; }
  .habit-name {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-weight: 650; font-size: 16px; letter-spacing: -.01em;
  }
  .habit-name .emoji { flex: none; }
  .meta { display: flex; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .meta .streak-hot { color: var(--ink); font-weight: 600; }
  .dots { display: flex; gap: 5px; margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
  .dot.done { background: var(--c); box-shadow: none; }
  .dot.skip { background: var(--skip); box-shadow: none; }
  .dot.na { opacity: .3; }
  .dot.today { outline: 2px solid color-mix(in srgb, var(--c) 50%, transparent); outline-offset: 1px; }

  .habit-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.on { background: var(--skip); border-color: transparent; color: #3b2a00; }
  .icon-btn {
    border: 0; background: transparent; cursor: pointer; color: var(--muted);
    width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

  .add-card {
    border: 2px dashed var(--line); border-radius: var(--radius); background: transparent;
    color: var(--muted); font-weight: 650; padding: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .add-card:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .add-card .plus {
    width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2);
    display: grid; place-items: center; font-size: 18px; line-height: 1;
  }
  .cap-note { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }

  /* ---------- Charts ---------- */
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; display: grid; gap: 16px;
  }
  .card h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
  .card .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .weekly svg { width: 100%; height: auto; display: block; overflow: visible; }
  .weekly .bar { cursor: pointer; transition: opacity .2s ease; }
  .weekly .bar:hover { opacity: .75; }
  .weekly text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .weekly .grid-line { stroke: var(--line); stroke-width: 1; }
  .weekly .bar-bg { fill: var(--surface-2); }
  .weekly .bar-fill { fill: url(#barGrad); }
  .weekly .bar-fill.muted { fill: var(--line); }
  .weekly .selected { stroke: var(--ink); stroke-width: 1.5; }

  .heat { display: grid; gap: 8px; }
  .hm-row { display: grid; grid-template-columns: minmax(84px, 128px) minmax(0, 1fr); gap: 10px; align-items: center; }
  .hm-label { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .hm-cells { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
  .hm-head { font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hm-cell {
    aspect-ratio: 1 / 1; width: 100%; border-radius: 6px; border: 0; padding: 0; cursor: pointer;
    background: var(--surface-2); min-width: 0;
    transition: transform .12s ease;
  }
  .hm-cell:hover { transform: scale(1.12); }
  .hm-cell.done { background: var(--c); }
  .hm-cell.skip { background: repeating-linear-gradient(-45deg, var(--skip) 0 3px, color-mix(in srgb, var(--skip) 35%, transparent) 3px 6px); }
  .hm-cell.na { background: transparent; box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
  .hm-cell.na:hover { transform: none; }
  .hm-cell.is-view { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }

  .rate-list { display: grid; gap: 10px; }
  .rate-row { display: grid; grid-template-columns: minmax(80px, 128px) minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
  .rate-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .rate-fill {
    height: 100%; border-radius: inherit; background: var(--c);
    transition: width .6s cubic-bezier(.2, .8, .2, 1);
  }
  .rate-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  /* ---------- Footer ---------- */
  .footer {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    color: var(--muted); font-size: 13px; padding-top: 4px;
  }
  .footer p { width: 100%; text-align: center; margin: 4px 0 0; font-size: 12px; }

  /* ---------- Dialog ---------- */
  dialog {
    border: 0; padding: 0; border-radius: 22px; width: min(92vw, 440px);
    background: var(--surface); color: var(--ink);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5);
  }
  dialog::backdrop { background: rgba(10, 9, 20, .55); backdrop-filter: blur(3px); }
  .dlg-form { display: grid; gap: 16px; padding: 22px; }
  .dlg-form h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .field { display: grid; gap: 8px; }
  .field > label, .field > .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .field input {
    font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .err { color: var(--danger); font-size: 13px; margin: 0; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .emo {
    aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid transparent; background: var(--surface-2);
    font-size: 20px; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .emo:hover { border-color: var(--line); }
  .emo.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35);
  }
  .swatch.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .dlg-actions .spacer { flex: 1; }
  .btn.danger { background: transparent; color: var(--danger); padding-left: 0; }
  .btn.danger:hover:not(:disabled) { text-decoration: underline; }

  /* ---------- Toast & confetti ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translate(-50%, 160%); opacity: 0;
    background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
    padding: 12px 18px; border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .5);
    transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), opacity .3s ease;
    max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  #confetti i {
    position: absolute; top: -18px; width: 9px; height: 14px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--x), 105vh) rotate(720deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 520px) {
    .hero { padding: 18px; gap: 16px; }
    .ring { width: 96px; height: 96px; }
    .ring-text b { font-size: 22px; }
    .motivation { font-size: 16px; }
    .hm-row { grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
    .hm-label .truncate { font-size: 12px; }
    .hm-cells { gap: 3px; }
    .habit { padding: 10px; gap: 10px; }
    .check { width: 46px; height: 46px; border-radius: 15px; }
  }
</style>
</head>
<body>
<main id="app" class="app" aria-live="polite"></main>

<dialog id="editor" aria-labelledby="dlgTitle">
  <form id="habitForm" class="dlg-form" novalidate>
    <h2 id="dlgTitle">New habit</h2>
    <div class="field">
      <label for="habitName">Name</label>
      <input id="habitName" name="name" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Drink a glass of water" aria-describedby="nameErr">
      <p id="nameErr" class="err" hidden>Give your habit a name.</p>
    </div>
    <div class="field">
      <span class="lbl" id="emojiLbl">Icon</span>
      <div id="emojiPick" class="emoji-grid" role="group" aria-labelledby="emojiLbl"></div>
    </div>
    <div class="field">
      <span class="lbl" id="colorLbl">Color</span>
      <div id="colorPick" class="swatches" role="group" aria-labelledby="colorLbl"></div>
    </div>
    <div class="dlg-actions">
      <button type="button" id="deleteBtn" class="btn danger" hidden>Delete habit</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-cancel>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="confetti" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- Constants ---------- */
  const STORE_KEY = 'microHabitTracker.v1';
  const MAX_HABITS = 7;
  const MAX_BACK_DAYS = 60;
  const MAX_IMPORT_BYTES = 2 * 1024 * 1024;
  const DAY_MS = 86400000;
  const COLORS = ['#6d5dfc', '#20c997', '#ff7a59', '#f0476c', '#f5b93b', '#3ba7ff', '#a95cff', '#ff5fa2'];
  const EMOJIS = ['💧', '📚', '🏃', '🧘', '✍️', '🥗', '😴', '🎯', '🎸', '🧠', '🌱', '💪', '🚶', '🛏️', '📵', '🎨'];

  /* ---------- Helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayKey = () => keyOf(new Date());
  const isKey = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && keyOf(parseKey(k)) === k;
  const uid = () => Math.random().toString(36).slice(2, 10);
  const fmtDay = (k) => parseKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const pct = (v) => (v === null ? '—' : `${Math.round(v * 100)}%`);

  /* ---------- State ---------- */
  let state = loadState();
  let view = todayKey();
  let lastToday = todayKey();
  let editingId = null;
  let draft = { emoji: EMOJIS[0], color: COLORS[0] };

  function sanitize(obj) {
    if (!obj || typeof obj !== 'object' || !Array.isArray(obj.habits) || !obj.logs || typeof obj.logs !== 'object' || Array.isArray(obj.logs)) {
      throw new Error('Not a Micro Habit Tracker export');
    }
    const habits = [];
    const seen = new Set();
    for (const raw of obj.habits) {
      if (habits.length >= MAX_HABITS) break;
      if (!raw || typeof raw.name !== 'string') continue;
      const name = raw.name.trim().slice(0, 40);
      if (!name) continue;
      let id = typeof raw.id === 'string' && /^[\w-]{1,40}$/.test(raw.id) ? raw.id : uid();
      if (seen.has(id)) id = uid();
      seen.add(id);
      const emoji = typeof raw.emoji === 'string' && raw.emoji.trim() ? [...raw.emoji.trim()].slice(0, 4).join('') : '✨';
      habits.push({
        id,
        name,
        emoji,
        color: COLORS.includes(raw.color) ? raw.color : COLORS[habits.length % COLORS.length],
        createdAt: isKey(raw.createdAt) ? raw.createdAt : todayKey(),
      });
    }
    const ids = new Set(habits.map((h) => h.id));
    const logs = {};
    for (const [k, day] of Object.entries(obj.logs)) {
      if (!isKey(k) || !day || typeof day !== 'object') continue;
      for (const [id, s] of Object.entries(day)) {
        if (ids.has(id) && (s === 'done' || s === 'skip')) {
          logs[k] = logs[k] || {};
          logs[k][id] = s;
        }
      }
    }
    return { habits, logs };
  }

  function demoState() {
    const today = new Date();
    const start = keyOf(addDays(today, -13));
    const habits = [
      { name: 'Drink water', emoji: '💧', color: COLORS[5] },
      { name: 'Read 20 pages', emoji: '📚', color: COLORS[0] },
      { name: 'Morning walk', emoji: '🚶', color: COLORS[1] },
      { name: 'Stretch', emoji: '🧘', color: COLORS[2] },
    ].map((h, i) => ({ ...h, id: `demo${i}`, createdAt: start }));

    const logs = {};
    for (let back = 13; back >= 1; back--) {
      const k = keyOf(addDays(today, -back));
      habits.forEach((h, i) => {
        const v = (back * 7 + i * 5) % 11;
        let s = 'done';
        if (v === 0 || (back === 9 && i === 3)) s = null;        // missed
        else if (v === 4 || (back === 5 && i === 1)) s = 'skip'; // rest day
        if (s) {
          logs[k] = logs[k] || {};
          logs[k][h.id] = s;
        }
      });
    }
    logs[keyOf(today)] = { demo0: 'done', demo2: 'done' };
    return { habits, logs };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (_) { /* fall through to demo data */ }
    const demo = demoState();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(demo)); } catch (_) {}
    return demo;
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (_) {
      toast('Storage is unavailable, so changes will only last this session.');
    }
  }

  /* ---------- Data logic ---------- */
  const statusOf = (k, id) => (state.logs[k] && state.logs[k][id]) || null;
  const habitById = (id) => state.habits.find((h) => h.id === id);
  const activeOn = (k) => state.habits.filter((h) => h.createdAt <= k);

  function mark(k, id, s) {
    const day = state.logs[k] || (state.logs[k] = {});
    if (s) day[id] = s; else delete day[id];
    if (!Object.keys(day).length) delete state.logs[k];
    save();
  }

  // Skips never break a streak; unlogged past days do. Today is still "open" until logged.
  function currentStreak(id) {
    let cursor = new Date();
    if (!statusOf(todayKey(), id)) cursor = addDays(cursor, -1);
    let streak = 0;
    for (let i = 0; i < 3650; i++) {
      const s = statusOf(keyOf(cursor), id);
      if (s === 'done') streak++;
      else if (s !== 'skip') break;
      cursor = addDays(cursor, -1);
    }
    return streak;
  }

  function longestStreak(id) {
    const keys = Object.keys(state.logs).filter((k) => state.logs[k][id]).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const d = parseKey(k);
      if (prev && Math.round((d - prev) / DAY_MS) > 1) run = 0;
      prev = d;
      if (state.logs[k][id] === 'done') { run++; best = Math.max(best, run); }
    }
    return best;
  }

  function rate(h, days) {
    let done = 0, possible = 0;
    const t = new Date();
    for (let i = 0; i < days; i++) {
      const k = keyOf(addDays(t, -i));
      if (k < h.createdAt) break;
      const s = statusOf(k, h.id);
      if (s === 'skip' || (i === 0 && !s)) continue;
      possible++;
      if (s === 'done') done++;
    }
    return possible ? done / possible : null;
  }

  function overallRate(days) {
    let done = 0, possible = 0;
    const t = new Date();
    for (let i = 0; i < days; i++) {
      const k = keyOf(addDays(t, -i));
      for (const h of activeOn(k)) {
        const s = statusOf(k, h.id);
        if (s === 'skip' || (i === 0 && !s)) continue;
        possible++;
        if (s === 'done') done++;
      }
    }
    return possible ? done / possible : null;
  }

  function dayStats(k) {
    const act = activeOn(k);
    let done = 0, skip = 0;
    for (const h of act) {
      const s = statusOf(k, h.id);
      if (s === 'done') done++;
      else if (s === 'skip') skip++;
    }
    const possible = act.length - skip;
    return { total: act.length, done, skip, possible, ratio: possible ? done / possible : null };
  }

  /* ---------- Rendering ---------- */
  const app = $('#app');

  function render() {
    const today = todayKey();
    const isToday = view === today;
    const st = dayStats(view);
    const minKey = keyOf(addDays(new Date(), -MAX_BACK_DAYS));
    const allDone = st.total > 0 && st.done === st.total;
    const allSkipped = st.total > 0 && st.skip === st.total;

    const totalDone = Object.values(state.logs).reduce((n, d) => n + Object.values(d).filter((s) => s === 'done').length, 0);
    const topStreak = Math.max(0, ...state.habits.map((h) => currentStreak(h.id)));
    const week = overallRate(7);

    const ringFrac = st.total === 0 ? 0 : (st.possible === 0 ? 1 : st.done / st.possible);
    const C = 2 * Math.PI * 46;

    app.innerHTML = `
      <header class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true">⚡</div>
          <div>
            <h1>Micro Habit Tracker</h1>

        </div>
        <div class="stats">
          <div class="stat"><b>🔥 ${topStreak}</b><span>top streak</span></div>
          <div class="stat"><b>${totalDone}</b><span>check-ins</span></div>
          <div class="stat"><b>${pct(week)}</b><span>last 7 days</span></div>
        </div>
      </header>

      <section class="hero" aria-label="${isToday ? 'Today' : fmtDay(view)} progress">
        <div class="ring" role="img" aria-label="${st.done} of ${st.total} done">
          <svg viewBox="0 0 110 110" aria-hidden="true">
            <circle class="track" cx="55" cy="55" r="46" fill="none" stroke-width="10"></circle>
            <circle class="progress" cx="55" cy="55" r="46" fill="none" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - ringFrac)).toFixed(2)}"></circle>
          </svg>
          <div class="ring-text" aria-hidden="true"><b>${st.done}/${st.total}</b><span>done</span></div>
        </div>
        <div class="hero-body">
          <div class="day-nav">
            <button class="nav-btn" data-action="prev" aria-label="Previous day" ${view <= minKey ? 'disabled' : ''}>‹</button>
            <button class="label" data-action="today" title="${isToday ? '' : 'Back to today'}">${isToday ? 'Today' : fmtDay(view)} · ${parseKey(view).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</button>
            <button class="nav-btn" data-action="next" aria-label="Next day" ${isToday ? 'disabled' : ''}>›</button>

            <button class="btn on-hero" data-action="check-all" ${st.total === 0 || allDone ? 'disabled' : ''}>✓ Check all</button>
          </div>
        </div>

      <div class="cols">
        <section aria-labelledby="habitsHead">
          <div class="section-head">

          </div>
          <div class="habit-list">
            ${state.habits.map((h) => habitCard(h, view, isToday)).join('')}
            ${state.habits.length < MAX_HABITS
              ? `<button class="add-card" data-action="add"><span class="plus" aria-hidden="true">+</span>Add a habit</button>`
              : `<p class="cap-note">Seven is the sweet spot. Edit a habit to swap it out.</p>`}
          </div>
        </section>

        <section class="stack" style="display:grid;gap:18px" aria-label="Charts">
          ${weeklyCard()}
          ${heatmapCard()}
          ${ratesCard()}
        </section>
      </div>

      <footer class="footer">
        <button class="btn ghost" data-action="export">⬇ Export JSON</button>
        <button class="btn ghost" data-action="import">⬆ Import JSON</button>
        <button class="btn ghost" data-action="reset">↺ Reset demo data</button>
        <p>Everything stays in this browser. Export a backup any time.</p>
      </footer>
    `;
  }

  function motivation(st, isToday) {
    if (!state.habits.length) return 'Add your first tiny habit to get started.';
    if (st.total === 0) return 'Nothing was tracked on this day yet.';
    if (st.done === st.total) return 'Perfect day. You showed up for yourself. 🎉';
    const remaining = st.total - st.done - st.skip;
    if (remaining === 0) return 'All covered. Skips keep your streaks alive. 🌤️';
    if (st.done === 0 && st.skip === 0) return isToday ? 'Start small. One check is a win.' : 'Late wins still count. Log what you finished.';
    return `${st.done} of ${st.total} done · ${remaining} to go. Keep the momentum.`;
  }

  function habitCard(h, k, isToday) {
    const s = statusOf(k, h.id);
    const streak = currentStreak(h.id);
    const best = longestStreak(h.id);
    const now = new Date();
    const dots = [];
    for (let i = 6; i >= 0; i--) {
      const dk = keyOf(addDays(now, -i));
      const ds = statusOf(dk, h.id);
      const cls = [dk < h.createdAt ? 'na' : '', ds || '', i === 0 ? 'today' : ''].filter(Boolean).join(' ');
      dots.push(`<span class="dot ${cls}" title="${fmtDay(dk)}${ds ? ': ' + ds : ''}"></span>`);
    }
    const label = esc(h.name);
    return `
      <article class="habit ${s === 'done' ? 'is-done' : ''}" style="--c:${h.color}">
        <button class="check ${s || ''}" data-action="done" data-id="${h.id}" aria-pressed="${s === 'done'}"
          aria-label="${label}: ${s === 'done' ? 'mark not done' : 'mark done'}"
          title="${s === 'done' ? 'Undo' : 'Mark done'}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <div class="habit-info">
          <div class="habit-name"><span class="emoji" aria-hidden="true">${esc(h.emoji)}</span><span class="truncate">${label}</span></div>
          <div class="meta">
            <span class="${streak > 0 ? 'streak-hot' : ''}">${streak > 0 ? `🔥 ${streak}-day streak` : 'No streak yet'}</span>
            <span aria-hidden="true">·</span>
            <span>best ${best}</span>
          </div>
          <div class="dots" aria-hidden="true">${dots.join('')}</div>
        </div>
        <div class="habit-actions">
          <button class="chip ${s === 'skip' ? 'on' : ''}" data-action="skip" data-id="${h.id}" aria-pressed="${s === 'skip'}"
            title="Skip without breaking your streak">${s === 'skip' ? 'Skipped' : 'Skip'}</button>
          <button class="icon-btn" data-action="edit" data-id="${h.id}" aria-label="Edit ${label}" title="Edit">✎</button>
        </div>
      </article>`;
  }

  function weeklyCard() {
    const W = 560, H = 170, padL = 30, padB = 24, padT = 12, padR = 6;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = 14, slot = innerW / n, bw = slot * 0.62;
    const now = new Date();
    const bars = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = keyOf(addDays(now, -i));
      const idx = n - 1 - i;
      const x = padL + idx * slot + (slot - bw) / 2;
      const st = dayStats(k);
      const val = st.ratio === null ? 0 : st.ratio;
      const hgt = Math.max(val * innerH, st.ratio === null ? 0 : 2);
      const y = padT + innerH - hgt;
      const letter = parseKey(k).toLocaleDateString(undefined, { weekday: 'narrow' });
      const isSel = k === view;
      bars.push(`
        <g class="bar" data-action="view" data-key="${k}" role="button" tabindex="0" aria-label="${fmtDay(k)}: ${st.done} of ${st.possible} done">
          <title>${fmtDay(k)} · ${st.done}/${st.possible} done${st.skip ? ` · ${st.skip} skipped` : ''}</title>
          <rect x="${(padL + idx * slot).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${innerH}" fill="transparent"></rect>
          <rect class="bar-bg" x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${innerH}" rx="6"></rect>
          <rect class="bar-fill ${st.ratio === null ? 'muted' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="6"
            opacity="${isSel ? 1 : 0.85}"></rect>
          ${isSel ? `<rect class="selected" x="${(x - 1).toFixed(1)}" y="${(padT - 1).toFixed(1)}" width="${(bw + 2).toFixed(1)}" height="${(innerH + 2).toFixed(1)}" rx="7" fill="none"></rect>` : ''}
          <text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${letter}</text>
        </g>`);
    }
    const grid = [0, 50, 100].map((p) => {
      const y = padT + innerH - (p / 100) * innerH;
      return `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"></line>
              <text x="${padL - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${p}%</text>`;
    }).join('');
    const last7 = overallRate(7);
    return `
      <section class="card" aria-labelledby="weekHead">
        <div class="card-head">
          <div>
            <h3 id="weekHead">Last 14 days</h3>
            <p class="sub">Share of habits done each day · tap a bar to view it</p>
          </div>
          <span class="sub">7-day ${pct(last7)}</span>
        </div>
        <div class="weekly">
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily completion over the last 14 days">
            <defs>
              <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#a95cff"/>
                <stop offset="1" stop-color="#6d5dfc"/>
              </linearGradient>
            </defs>
            ${grid}
            ${bars.join('')}
          </svg>
        </div>
      </section>`;
  }

  function heatmapCard() {
    if (!state.habits.length) return '';
    const now = new Date();
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(keyOf(addDays(now, -i)));
    const heads = days.map((k, idx) => `<span>${idx % 2 === 0 || idx === 13 ? parseKey(k).getDate() : ''}</span>`).join('');
    const rows = state.habits.map((h) => {
      const cells = days.map((k) => {
        const s = statusOf(k, h.id);
        const na = k < h.createdAt;
        const cls = [na ? 'na' : (s || ''), k === view ? 'is-view' : ''].filter(Boolean).join(' ');
        const word = na ? 'not tracked' : (s === 'done' ? 'done' : s === 'skip' ? 'skipped' : 'missed');
        const label = `${h.name}, ${fmtDay(k)}: ${word}`;
        return na
          ? `<span class="hm-cell ${cls}" role="img" aria-label="${esc(label)}" title="${esc(label)}"></span>`
          : `<button class="hm-cell ${cls}" data-action="view" data-key="${k}" aria-label="${esc(label)}" title="${esc(label)}"></button>`;
      }).join('');
      return `
        <div class="hm-row" style="--c:${h.color}">
          <div class="hm-label"><span aria-hidden="true">${esc(h.emoji)}</span><span class="truncate">${esc(h.name)}</span></div>
          <div class="hm-cells">${cells}</div>
        </div>`;
    }).join('');
    return `
      <section class="card" aria-labelledby="heatHead" style="--c:var(--accent)">
        <div class="card-head">
          <div>
            <h3 id="heatHead">Consistency</h3>
            <p class="sub">Each square is a day. Tap one to log it.</p>
          </div>
        </div>
        <div class="heat">
          <div class="hm-row" aria-hidden="true"><span></span><div class="hm-cells hm-head">${heads}</div></div>
          ${rows}
        </div>
      </section>`;
  }

  function ratesCard() {
    if (!state.habits.length) return '';
    const rows = state.habits.map((h) => {
      const r = rate(h, 30);
      const w = r === null ? 0 : Math.round(r * 100);
      return `
        <div class="rate-row" style="--c:${h.color}">
          <span class="truncate">${esc(h.emoji)} ${esc(h.name)}</span>
          <div class="rate-track" role="img" aria-label="${esc(h.name)} ${pct(r)} over 30 days"><div class="rate-fill" style="width:${w}%"></div></div>
          <span class="rate-val">${pct(r)}</span>
        </div>`;
    }).join('');
    return `
      <section class="card" aria-labelledby="rateHead">
        <div class="card-head">
          <div>
            <h3 id="rateHead">30-day completion</h3>
            <p class="sub">Skipped days are not counted against you.</p>
          </div>
        </div>
        <div class="rate-list">${rows}</div>
      </section>`;
  }

  /* ---------- Toast & celebration ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function celebrate() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const wrap = $('#confetti');
    const colors = [...COLORS, '#ffd166'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = `${Math.random() * 100}vw`;
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--x', `${Math.round(Math.random() * 180 - 90)}px`);
      p.style.animationDelay = `${(Math.random() * 0.35).toFixed(2)}s`;
      p.style.animationDuration = `${(1.5 + Math.random() * 1).toFixed(2)}s`;
      if (i % 3 === 0) p.style.borderRadius = '50%';
      wrap.appendChild(p);
    }
    setTimeout(() => { wrap.innerHTML = ''; }, 3000);
  }

  /* ---------- Editor dialog ---------- */
  const dlg = $('#editor');
  const form = $('#habitForm');

  function renderPickers() {
    $('#emojiPick').innerHTML = EMOJIS.map((e) =>
      `<button type="button" class="emo ${e === draft.emoji ? 'sel' : ''}" data-emoji="${e}" aria-pressed="${e === draft.emoji}" aria-label="Icon ${e}">${e}</button>`
    ).join('');
    $('#colorPick').innerHTML = COLORS.map((c) =>
      `<button type="button" class="swatch ${c === draft.color ? 'sel' : ''}" data-color="${c}" style="--c:${c}" aria-pressed="${c === draft.color}" aria-label="Color ${c}"></button>`
    ).join('');
  }

  function openEditor(id) {
    const h = id ? habitById(id) : null;
    if (!h && state.habits.length >= MAX_HABITS) {
      toast('You already have 7 habits. Edit or delete one first.');
      return;
    }
    editingId = h ? h.id : null;
    form.elements.name.value = h ? h.name : '';
    $('#nameErr').hidden = true;
    draft = {
      emoji: h ? h.emoji : EMOJIS[state.habits.length % EMOJIS.length],
      color: h ? h.color : COLORS[state.habits.length % COLORS.length],
    };
    $('#dlgTitle').textContent = h ? 'Edit habit' : 'New habit';
    $('#deleteBtn').hidden = !h;
    renderPickers();
    dlg.showModal();
    setTimeout(() => form.elements.name.focus(), 30);
  }

  dlg.addEventListener('click', (e) => {
    const emo = e.target.closest('[data-emoji]');
    if (emo) { draft.emoji = emo.dataset.emoji; renderPickers(); return; }
    const sw = e.target.closest('[data-color]');
    if (sw) { draft.color = sw.dataset.color; renderPickers(); return; }
    if (e.target.closest('[data-cancel]')) { dlg.close(); return; }
    if (e.target.closest('#deleteBtn') && editingId) {
      const h = habitById(editingId);
      if (!h || !window.confirm(`Delete "${h.name}" and its history? This cannot be undone.`)) return;
      state.habits = state.habits.filter((x) => x.id !== h.id);
      for (const k of Object.keys(state.logs)) {
        delete state.logs[k][h.id];
        if (!Object.keys(state.logs[k]).length) delete state.logs[k];
      }
      save();
      dlg.close();
      render();
      toast('Habit deleted');
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = form.elements.name.value.trim().slice(0, 40);
    if (!name) {
      $('#nameErr').hidden = false;
      form.elements.name.focus();
      return;
    }
    if (editingId) {
      const h = habitById(editingId);
      if (h) Object.assign(h, { name, emoji: draft.emoji, color: draft.color });
      toast('Habit updated ✏️');
    } else {
      if (state.habits.length >= MAX_HABITS) { toast('Seven habits max. Delete one to add another.'); return; }
      state.habits.push({ id: uid(), name, emoji: draft.emoji, color: draft.color, createdAt: view });
      toast('Habit added ✨');
    }
    save();
    dlg.close();
    render();
  });

  /* ---------- Import / export ---------- */
  function exportData() {
    const payload = {
      app: 'micro-habit-tracker',
      version: 1,
      exportedAt: new Date().toISOString(),
      habits: state.habits,
      logs: state.logs,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `micro-habits-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup downloaded ⬇️');
  }

  const fileInput = $('#importFile');
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (file.size > MAX_IMPORT_BYTES) { toast('That file is too large to be a habit export.'); return; }
    try {
      const data = sanitize(JSON.parse(await file.text()));
      const days = Object.keys(data.logs).length;
      if (!window.confirm(`Import ${data.habits.length} habit(s) and ${days} day(s) of history? This replaces your current data.`)) return;
      state = data;
      view = todayKey();
      save();
      render();
      toast('Import complete ✅');
    } catch (_) {
      toast('Import failed: that file is not a Micro Habit Tracker export.');
    }
  });

  /* ---------- Event delegation ---------- */
  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const today = todayKey();
    const minKey = keyOf(addDays(new Date(), -MAX_BACK_DAYS));

    switch (el.dataset.action) {
      case 'prev': {
        const prev = keyOf(addDays(parseKey(view), -1));
        if (prev >= minKey) { view = prev; render(); }
        break;
      }
      case 'next':
        if (view < today) { view = keyOf(addDays(parseKey(view), 1)); render(); }
        break;
      case 'today':
        view = today; render();
        break;
      case 'view':
        view = el.dataset.key; render();
        break;
      case 'done': {
        const h = habitById(el.dataset.id);
        if (!h) break;
        const cur = statusOf(view, h.id);
        const wasAllDone = dayStats(view).total > 0 && dayStats(view).done === dayStats(view).total;
        mark(view, h.id, cur === 'done' ? null : 'done');
        render();
        const nowAllDone = dayStats(view).total > 0 && dayStats(view).done === dayStats(view).total;
        if (view === today && !wasAllDone && nowAllDone) celebrate();
        break;
      }
      case 'skip': {
        const h = habitById(el.dataset.id);
        if (!h) break;
        const cur = statusOf(view, h.id);
        mark(view, h.id, cur === 'skip' ? null : 'skip');
        render();
        break;
      }
      case 'check-all': {
        activeOn(view).forEach((h) => mark(view, h.id, 'done'));
        render();
        if (view === today) celebrate();
        break;
      }
      case 'skip-day': {
        const act = activeOn(view);
        const clearing = act.length > 0 && act.every((h) => statusOf(view, h.id) === 'skip');
        act.forEach((h) => {
          const cur = statusOf(view, h.id);
          if (clearing) { if (cur === 'skip') mark(view, h.id, null); }
          else if (cur !== 'done') mark(view, h.id, 'skip');
        });
        toast(clearing ? 'Skips cleared' : 'Day skipped. Your streaks are safe 🌤️');
        render();
        break;
      }
      case 'add': openEditor(null); break;
      case 'edit': openEditor(el.dataset.id); break;
      case 'export': exportData(); break;
      case 'import': fileInput.click(); break;
      case 'reset':
        if (window.confirm('Replace everything with fresh demo data? Your current habits will be lost.')) {
          state = demoState();
          view = todayKey();
          save();
          render();
          toast('Demo data restored');
        }
        break;
    }
  });

  // Keyboard support for SVG bars (they are not native buttons)
  app.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.bar[data-action]')) {
      e.preventDefault();
      view = e.target.dataset.key;
      render();
    }
  });

  // Roll the "today" view forward if the app stays open past midnight.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = todayKey();
    if (t !== lastToday) {
      if (view === lastToday) view = t;
      lastToday = t;
      render();
    }
  });

  save();
  render();
})();
</script>
</body>
</html>
