<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#110e0c" />
<meta name="description" content="Virtual Drum Kit — a studio-grade browser drum machine. Play 12 synthesized drum voices with your mouse, finger or keyboard, record a take and loop it back." />
<title>Virtual Drum Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #110e0c;
    --panel: #1d1815;
    --panel-2: #28211c;
    --line: #3b3029;
    --brass: #d9a441;
    --brass-hi: #f4cd7a;
    --cream: #f3e9d2;
    --muted: #9d8f7c;
    --red: #e4572e;
    --led: #8cf59a;
    --display: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(217, 164, 65, .16), transparent 62%),
      radial-gradient(900px 640px at 100% 110%, rgba(228, 87, 46, .09), transparent 60%),
      var(--bg);
    color: var(--cream);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  :focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 18px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: grid; place-items: center;
    font-family: var(--display);
    font-size: 1.6rem;
    letter-spacing: .04em;
    color: #2a1a08;
    background: linear-gradient(160deg, var(--brass-hi), var(--brass) 55%, #9b6b20);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 16px rgba(217,164,65,.25);
  }
  .brand h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    line-height: .95;
    letter-spacing: .06em;
  }
  .brand h1 span { color: var(--brass); }
  .brand p {
    margin-top: 4px;
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .vu {
    display: flex; gap: 4px; align-items: center;
    padding: 8px 10px;
    border-radius: 12px;
    background: #0b0908;
    border: 1px solid #2a221c;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
  }
  .vu-label {
    font-family: var(--mono); font-size: .6rem; color: var(--muted);
    letter-spacing: .14em; margin-right: 6px;
  }
  .vu i {
    display: block;
    width: 14px; height: 20px;
    border-radius: 3px;
    background: #231c17;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.7);
  }
  .vu i.on.g { background: #7ee08a; box-shadow: 0 0 8px rgba(126,224,138,.6); }
  .vu i.on.a { background: #f5c451; box-shadow: 0 0 8px rgba(245,196,81,.6); }
  .vu i.on.r { background: #ff6a3d; box-shadow: 0 0 10px rgba(255,106,61,.7); }

  /* ---------- Panels ---------- */
  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      0 22px 44px rgba(0,0,0,.45);
  }

  /* ---------- Kit selector ---------- */
  .kits {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 12px 14px; flex-wrap: wrap;
  }
  .eyebrow {
    font-family: var(--mono); font-size: .68rem; letter-spacing: .18em;
    color: var(--muted); text-transform: uppercase;
  }
  .segment {
    display: flex; flex: 1; min-width: 260px; max-width: 420px;
    padding: 4px; gap: 4px;
    background: #0c0907;
    border: 1px solid #2c241e;
    border-radius: 14px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
  }
  .segment button {
    flex: 1;
    padding: 10px 8px;
    border-radius: 10px;
    font-weight: 700;
    font-size: .88rem;
    letter-spacing: .06em;
    color: var(--muted);
    transition: background .15s, color .15s;
  }
  .segment button:hover { color: var(--cream); }
  .segment button[aria-pressed="true"] {
    color: #2a1a08;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    box-shadow: 0 2px 0 #7d5418, inset 0 1px 0 rgba(255,255,255,.5);
  }

  /* ---------- Stage / pads ---------- */
  .stage {
    padding: 16px 18px 26px;
    background-image:
      radial-gradient(600px 280px at 50% 0%, rgba(217,164,65,.08), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 11px);
    transition: box-shadow .3s ease;
  }
  body[data-mode="rec"] .stage {
    box-shadow:
      0 0 0 2px rgba(228,87,46,.75),
      0 0 46px rgba(228,87,46,.28),
      0 22px 44px rgba(0,0,0,.45);
  }

  .kit-art {
    display: block;
    width: 100%;
    max-width: 600px;
    height: auto;
    margin: 0 auto 6px;
    color: var(--brass);
    opacity: .6;
    pointer-events: none;
  }

  .pads {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(12px, 2.6vw, 22px);
    max-width: 580px;
    margin: 0 auto;
  }

  .pad {
    --c: #ccc;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    padding: 0;
    background: transparent;
    box-shadow: 0 9px 0 #050403, 0 18px 28px rgba(0,0,0,.6);
    transform: translateY(0);
    transition: transform 70ms ease, box-shadow 70ms ease;
    -webkit-touch-callout: none;
  }
  .pad .rim {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 210deg, #f2e6c6, #7d6a4a, #eadcb2, #5e4e35, #f2e6c6);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.55);
  }
  .pad .head {
    position: absolute; inset: 8%;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6%;
    background: radial-gradient(circle at 38% 30%,
      color-mix(in srgb, var(--c) 70%, #fff) 0%,
      var(--c) 45%,
      color-mix(in srgb, var(--c) 35%, #000) 100%);
    box-shadow: inset 0 -8px 16px rgba(0,0,0,.35), inset 0 6px 10px rgba(255,255,255,.28);
    transition: filter 70ms ease;
  }
  .pad .name {
    font-family: var(--display);
    font-size: clamp(1rem, 4.2vw, 1.7rem);
    letter-spacing: .06em;
    line-height: 1;
    color: rgba(25, 14, 6, .82);
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
    white-space: nowrap;
  }
  .pad .key {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(.6rem, 1.7vw, .78rem);
    line-height: 1;
    color: #f7ecd6;
    background: rgba(0,0,0,.5);
    border-radius: 6px;
    padding: 4px 6px;
  }
  @media (hover: hover) {
    .pad:hover .head { filter: brightness(1.12); }
  }
  .pad.down,
  .pad:active {
    transform: translateY(7px);
    box-shadow: 0 2px 0 #050403, 0 6px 12px rgba(0,0,0,.5);
  }
  .pad.down .head { filter: brightness(1.35) saturate(1.1); }

  .stage-foot {
    display: flex; justify-content: center; margin-top: 16px;
  }

  /* ---------- Transport ---------- */
  .transport { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .status-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: .75rem; font-weight: 700;
    letter-spacing: .14em; color: var(--led);
  }
  .status::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--led); box-shadow: 0 0 10px currentColor;
  }
  .status.rec { color: #ff7a52; }
  .status.rec::before { background: #ff5a2b; animation: blink 1s steps(2, start) infinite; }
  .status.play { color: var(--brass-hi); }
  .status.play::before { background: var(--brass-hi); }
  .status.idle { color: var(--muted); }
  .status.idle::before { background: #5b4f44; box-shadow: none; }
  .status.ready { color: var(--led); }
  .hit-note { font-family: var(--mono); font-size: .7rem; color: var(--muted); letter-spacing: .08em; }

  @keyframes blink { to { visibility: hidden; } }

  .display {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .readout {
    background: #0b0907;
    border: 1px solid #2d241e;
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.7);
    min-width: 0;
  }
  .readout .lbl {
    display: block;
    font-family: var(--mono); font-size: .6rem; letter-spacing: .16em;
    color: var(--muted); margin-bottom: 4px;
  }
  .readout .big {
    display: block;
    font-family: var(--mono); font-weight: 700;
    font-size: clamp(1.1rem, 3.6vw, 1.55rem);
    color: var(--led);
    text-shadow: 0 0 12px rgba(140,245,154,.45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .progress {
    height: 8px;
    background: #0b0907;
    border: 1px solid #2d241e;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--brass), var(--red));
    border-radius: 999px;
    transition: width 60ms linear;
  }

  .controls {
    display: grid;
    grid-template-columns: 1.3fr 1.3fr 1fr .8fr;
    gap: 10px;
  }
  .xport {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 60px;
    border-radius: 14px;
    font-family: var(--display);
    font-size: 1.5rem;
    letter-spacing: .08em;
    background: linear-gradient(180deg, #3d3129, #241d18);
    border: 1px solid #4a3e35;
    box-shadow: 0 5px 0 #0b0806, inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform 60ms ease, box-shadow 60ms ease, background .15s;
  }
  .xport:active, .xport.is-on {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #0b0806;
  }
  .xport:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .xport.rec .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffb29a, #e4572e 60%, #7a1d08);
    box-shadow: 0 0 8px rgba(228,87,46,.6);
  }
  .xport.rec.is-on { background: linear-gradient(180deg, #7a2412, #4a1408); color: #ffd9cc; }
  .xport.rec.is-on .dot { animation: blink 1s steps(2, start) infinite; }
  .xport.play { color: #2a1a08; background: linear-gradient(180deg, var(--brass-hi), var(--brass)); border-color: #b6862f; box-shadow: 0 5px 0 #6c4a14, inset 0 1px 0 rgba(255,255,255,.45); }
  .xport.play.is-on { box-shadow: 0 1px 0 #6c4a14; }
  .xport.play::before {
    content: ""; border-style: solid; border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent currentColor;
  }
  .xport.stop .sq { width: 14px; height: 14px; border-radius: 2px; background: currentColor; }
  .xport.ghost { font-size: 1.2rem; color: var(--muted); }

  .options {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px;
    padding-top: 2px;
  }
  .toggle {
    padding: 9px 14px;
    border-radius: 999px;
    font-family: var(--mono); font-weight: 700; font-size: .72rem; letter-spacing: .12em;
    color: var(--muted);
    background: #0c0907;
    border: 1px solid #2f2620;
    transition: background .15s, color .15s;
  }
  .toggle[aria-pressed="true"] {
    color: #2a1a08;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    border-color: #b6862f;
  }
  .slider {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; color: var(--muted);
    flex: 1; min-width: 180px;
  }
  .slider output {
    min-width: 2.6em; text-align: right; color: var(--cream); font-weight: 700;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 26px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--brass) var(--fill, 50%), #1a1410 var(--fill, 50%));
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7);
  }
  input[type="range"]::-moz-range-track {
    height: 6px; border-radius: 999px; background: #1a1410;
  }
  input[type="range"]::-moz-range-progress {
    height: 6px; border-radius: 999px; background: var(--brass);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6dc, var(--brass) 60%, #7d5418);
    box-shadow: 0 2px 6px rgba(0,0,0,.6);
    border: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6dc, var(--brass) 60%, #7d5418);
    box-shadow: 0 2px 6px rgba(0,0,0,.6); border: 0;
  }

  .hints {
    text-align: center;
    font-size: .78rem;
    color: var(--muted);
    line-height: 1.8;
    padding: 4px 8px 8px;
  }
  .hints kbd {
    font-family: var(--mono); font-size: .72rem; color: var(--cream);
    background: #0c0907; border: 1px solid #3a3029; border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 6px; margin: 0 2px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .app { padding: 14px 12px 20px; gap: 14px; }
    .stage { padding: 12px 12px 20px; }
    .pads { gap: 10px; }
    .display { grid-template-columns: repeat(2, 1fr); }
    .controls { grid-template-columns: 1fr 1fr; }
    .xport { min-height: 56px; font-size: 1.3rem; }
    .vu i { width: 10px; height: 16px; }
    .vu-label { display: none; }
    .slider { min-width: 100%; }
  }
  @media (max-width: 420px) {
    .vu i { width: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-mode="idle">

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">VDK</div>
      <div>
        <h1>Virtual <span>Drum</span> Kit</h1>
        <p>Studio session pad · 12 voices · record &amp; loop</p>
      </div>
    </div>
    <div class="vu" aria-hidden="true">
      <span class="vu-label">LEVEL</span>
      <div id="vu" style="display:flex;gap:4px"></div>
    </div>
  </header>

  <section class="panel kits" aria-label="Kit selection">
    <span class="eyebrow">Kit</span>
    <div class="segment" role="group" aria-label="Drum kit">
      <button type="button" data-kit="acoustic" aria-pressed="true">Acoustic</button>
      <button type="button" data-kit="808" aria-pressed="false">808</button>
      <button type="button" data-kit="electronic" aria-pressed="false">Electronic</button>
    </div>
  </section>

  <section class="panel stage" aria-label="Drum pads">
    <svg class="kit-art" viewBox="0 0 640 210" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- Kick -->
        <circle cx="340" cy="132" r="46" />
        <circle cx="340" cy="132" r="36" stroke-width="1.2" opacity=".6" />
        <circle cx="340" cy="132" r="10" />
        <!-- Snare -->
        <ellipse cx="170" cy="146" rx="42" ry="11" />
        <path d="M128 146 V166 A42 11 0 0 0 212 166 V146" />
        <path d="M140 168 L126 200 M200 168 L214 200" />
        <!-- Hi tom -->
        <ellipse cx="250" cy="66" rx="34" ry="9" />
        <path d="M216 66 V96 A34 9 0 0 0 284 96 V66" />
        <!-- Mid tom -->
        <ellipse cx="440" cy="72" rx="36" ry="9" />
        <path d="M404 72 V106 A36 9 0 0 0 476 106 V72" />
        <path d="M414 106 L398 200 M466 106 L482 200" />
        <!-- Floor tom -->
        <ellipse cx="500" cy="146" rx="40" ry="10" />
        <path d="M460 146 V176 A40 10 0 0 0 540 176 V146" />
        <path d="M476 176 L462 204 M524 176 L538 204" />
        <!-- Hi-hat -->
        <path d="M70 46 V200 M70 200 L56 206 M70 200 L84 206" />
        <ellipse cx="70" cy="50" rx="28" ry="5" />
        <ellipse cx="70" cy="58" rx="28" ry="5" />
        <!-- Crash -->
        <path d="M604 40 V200 M604 200 L590 206 M604 200 L618 206" />
        <ellipse cx="604" cy="40" rx="34" ry="8" transform="rotate(-10 604 40)" />
      </g>
    </svg>
    <div id="pads" class="pads"></div>
  </section>

  <section class="panel transport" aria-label="Transport">
    <div class="status-row">
      <span id="status" class="status idle" role="status" aria-live="polite">STANDBY</span>
      <span class="hit-note" id="hitNote">No take yet</span>
    </div>

    <div class="display">
      <div class="readout">
        <span class="lbl">TIME</span>
        <span id="time" class="big">00:00.0</span>
      </div>
      <div class="readout">
        <span class="lbl">BAR.BEAT</span>
        <span id="bar" class="big">—</span>
      </div>
      <div class="readout">
        <span class="lbl">HITS</span>
        <span id="hits" class="big">0</span>
      </div>
      <div class="readout">
        <span class="lbl">TEMPO</span>
        <span id="bpmOut" class="big">110</span>
      </div>
    </div>

    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

    <div class="controls">
      <button type="button" id="recBtn" class="xport rec" aria-pressed="false" title="Record (Space)">
        <span class="dot"></span><span>REC</span>
      </button>
      <button type="button" id="playBtn" class="xport play" aria-pressed="false" title="Play / stop take (Enter)">
        <span>PLAY</span>
      </button>
      <button type="button" id="stopBtn" class="xport stop" title="Stop everything (Esc)">
        <span class="sq"></span><span>STOP</span>
      </button>
      <button type="button" id="clearBtn" class="xport ghost" title="Erase the current take">CLEAR</button>
    </div>

    <div class="options">
      <button type="button" id="loopBtn" class="toggle" aria-pressed="false">LOOP</button>
      <button type="button" id="metBtn" class="toggle" aria-pressed="false">METRONOME</button>
      <label class="slider">TEMPO
        <input id="bpm" type="range" min="60" max="180" step="1" value="110" aria-label="Tempo in BPM" />
        <output id="bpmLabel" for="bpm">110</output>
      </label>
      <label class="slider">VOLUME
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Master volume" />
        <output id="volLabel" for="vol">80</output>
      </label>
    </div>
  </section>

  <footer class="hints">
    Pads: <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> <kbd>R</kbd> · <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> · <kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd> <kbd>V</kbd><br />
    <kbd>Space</kbd> record &nbsp;·&nbsp; <kbd>Enter</kbd> play / stop take &nbsp;·&nbsp; <kbd>Esc</kbd> stop all
  </footer>

</div>

<script>
(() => {
  'use strict';

  /* ================================================================
   *  Kits — tuning profiles applied to the synthesized voices
   * ================================================================ */
  const KITS = {
    acoustic:   { pitch: 1.00, decay: 1.00, noise: 1.00 },
    '808':      { pitch: 0.72, decay: 1.90, noise: 0.60 },
    electronic: { pitch: 1.22, decay: 0.50, noise: 1.50 }
  };

  /* Inharmonic ratios used to build cymbal / bell-like metal timbres */
  const METAL_RATIOS = [1, 1.4471, 1.6170, 1.9265, 2.5028, 2.9981];

  /* ================================================================
   *  Pads — 4 x 3 grid, cymbals & hats on top, toms/snare in the
   *  middle, kick & percussion on the bottom.
   * ================================================================ */
  const PADS = [
    { id: 'crash', name: 'Crash',   key: 'Q', color: '#f7c35a' },
    { id: 'ride',  name: 'Ride',    key: 'W', color: '#e7a84b' },
    { id: 'hhc',   name: 'Closed HH', key: 'E', color: '#cfd6dc' },
    { id: 'hho',   name: 'Open HH', key: 'R', color: '#b4c0c8' },
    { id: 'tomH',  name: 'Hi Tom',  key: 'A', color: '#3fc1b5' },
    { id: 'snare', name: 'Snare',   key: 'S', color: '#f2ede1' },
    { id: 'tomM',  name: 'Mid Tom', key: 'D', color: '#2f9fa0' },
    { id: 'tomL',  name: 'Lo Tom',  key: 'F', color: '#227f84' },
    { id: 'kick',  name: 'Kick',    key: 'Z', color: '#e4572e' },
    { id: 'rim',   name: 'Rim',     key: 'X', color: '#ff9a3c' },
    { id: 'clap',  name: 'Clap',    key: 'C', color: '#e35d8c' },
    { id: 'cow',   name: 'Cowbell', key: 'V', color: '#8ccf5e' }
  ];
  const KEY_TO_PAD = new Map(PADS.map((p, i) => [p.key.toLowerCase(), i]));

  const STORE_KEY = 'vdk-take-v1';
  const LOOKAHEAD = 0.15;   // seconds of audio scheduled ahead
  const TICK_MS = 25;       // scheduler wake-up interval
  const LEDS = 10;

  /* ================================================================
   *  App state
   * ================================================================ */
  const state = {
    mode: 'idle',          // 'idle' | 'rec' | 'play'
    events: [],            // [{ t: ms from take start, pad: index }]
    loopMs: 0,             // take length in ms
    recStart: 0,           // performance.now() at record start
    passStart: 0,          // audio-clock time of the first playback pass
    passIdx: 0,            // next pass index to schedule
    loop: false,
    met: false,
    bpm: 110,
    metNext: 0,            // audio time of next metronome click
    beatCount: 0
  };
  let kitId = 'acoustic';
  let volume = 0.8;
  let vuLevel = 0;

  /* ================================================================
   *  Audio engine (Web Audio, fully synthesized — no samples needed)
   * ================================================================ */
  let ctx = null;
  let master = null;
  let noiseBuf = null;
  const voices = new Set();  // live source nodes, so STOP can silence them

  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = volume;
      master.connect(comp);
      comp.connect(ctx.destination);

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }

  function track(node) {
    voices.add(node);
    node.onended = () => voices.delete(node);
    return node;
  }

  function stopAllVoices() {
    voices.forEach(n => { try { n.stop(); } catch (_) { /* already stopped */ } });
    voices.clear();
  }

  function envelope(gain, t, peak, dur) {
    gain.gain.setValueAtTime(peak, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function osc(t, type, f0, f1, dur, peak) {
    const o = track(ctx.createOscillator());
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    const g = ctx.createGain();
    envelope(g, t, peak, dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(t, dur, filterType, freq, q, peak) {
    const src = track(ctx.createBufferSource());
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = filterType;
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ctx.createGain();
    envelope(g, t, peak, dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t, Math.random() * 1.5);
    src.stop(t + dur + 0.02);
  }

  function metal(t, base, dur, peak) {
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 6000;
    hp.connect(master);
    METAL_RATIOS.forEach(r => {
      const o = track(ctx.createOscillator());
      o.type = 'square';
      o.frequency.value = base * r;
      const g = ctx.createGain();
      envelope(g, t, peak / METAL_RATIOS.length, dur);
      o.connect(g);
      g.connect(hp);
      o.start(t);
      o.stop(t + dur + 0.02);
    });
  }

  /* Each voice: (time, kit) => schedules sound. Velocity is fixed at full. */
  const SOUNDS = {
    kick(t, k) {
      osc(t, 'sine', 155 * k.pitch, 42 * k.pitch, 0.55 * k.decay, 1.0);
      noise(t, 0.012, 'highpass', 2500, 0.7, 0.5 * k.noise);
    },
    snare(t, k) {
      osc(t, 'triangle', 230 * k.pitch, 170 * k.pitch, 0.15 * k.decay, 0.55);
      noise(t, 0.22 * k.decay, 'bandpass', 2000, 0.6, 0.75 * k.noise);
    },
    rim(t, k) {
      osc(t, 'triangle', 1800, 1400, 0.03, 0.35);
      osc(t, 'triangle', 330 * k.pitch, 250 * k.pitch, 0.08, 0.55);
      noise(t, 0.02, 'highpass', 3500, 0.5, 0.35 * k.noise);
    },
    clap(t, k) {
      for (let i = 0; i < 3; i++) noise(t + i * 0.011, 0.03, 'bandpass', 1400, 1.2, 0.9 * k.noise);
      noise(t + 0.035, 0.28 * k.decay, 'bandpass', 1200, 0.8, 0.7 * k.noise);
    },
    hhc(t, k) {
      noise(t, 0.05 * k.decay, 'highpass', 7500, 0.8, 0.5 * k.noise);
      metal(t, 310 * k.pitch, 0.05 * k.decay, 0.12);
    },
    hho(t, k) {
      noise(t, 0.35 * k.decay, 'highpass', 6500, 0.6, 0.45 * k.noise);
      metal(t, 310 * k.pitch, 0.35 * k.decay, 0.12);
    },
    crash(t, k) {
      noise(t, 1.6 * k.decay, 'highpass', 3500, 0.4, 0.5 * k.noise);
      metal(t, 380 * k.pitch, 1.4 * k.decay, 0.25);
    },
    ride(t, k) {
      metal(t, 300 * k.pitch, 1.1 * k.decay, 0.22);
      noise(t, 0.12 * k.decay, 'bandpass', 8000, 1, 0.2 * k.noise);
    },
    tomH(t, k) { tom(t, k, 260); },
    tomM(t, k) { tom(t, k, 190); },
    tomL(t, k) { tom(t, k, 130); },
    cow(t, k) {
      osc(t, 'square', 560 * k.pitch, 560 * k.pitch, 0.3 * k.decay, 0.1);
      osc(t, 'square', 845 * k.pitch, 845 * k.pitch, 0.3 * k.decay, 0.08);
    }
  };

  function tom(t, k, freq) {
    const f = freq * k.pitch;
    osc(t, 'sine', f * 1.5, f, 0.5 * k.decay, 0.95);
    noise(t, 0.025, 'bandpass', f * 4, 1, 0.25 * k.noise);
  }

  function click(t, accent) {
    osc(t, 'triangle', accent ? 1760 : 1220, null, 0.05, accent ? 0.5 : 0.3);
  }

  /* ================================================================
   *  Playing pads
   * ================================================================ */
  let padEls = [];

  function flash(i) {
    const el = padEls[i];
    if (!el || !el.animate) return;
    el.animate(
      [{ filter: 'brightness(1.9)', transform: 'scale(.93)' },
       { filter: 'brightness(1)', transform: 'scale(1)' }],
      { duration: 220, easing: 'ease-out' }
    );
  }

  function bumpVu() {
    vuLevel = Math.min(1, vuLevel + 0.45);
  }

  function playPad(i) {
    if (!ensureAudio()) return;
    SOUNDS[PADS[i].id](ctx.currentTime + 0.005, KITS[kitId]);
    flash(i);
    bumpVu();
    if (state.mode === 'rec') {
      state.events.push({ t: performance.now() - state.recStart, pad: i });
    }
    if (navigator.vibrate) navigator.vibrate(8);
  }

  function schedulePass(start) {
    const k = KITS[kitId];
    for (const ev of state.events) {
      const when = start + ev.t / 1000;
      SOUNDS[PADS[ev.pad].id](when, k);
      const delayMs = Math.max(0, (when - ctx.currentTime) * 1000);
      setTimeout(() => flash(ev.pad), delayMs);
    }
  }

  /* ================================================================
   *  Transport: record / play / stop / clear
   * ================================================================ */
  function resetMetronome(at) {
    state.metNext = at;
    state.beatCount = 0;
  }

  function startRec() {
    if (!ensureAudio()) return;
    if (state.mode === 'play') stopPlayback();
    state.mode = 'rec';
    state.events = [];
    state.loopMs = 0;
    state.recStart = performance.now();
    if (state.met) resetMetronome(ctx.currentTime + 0.05);
  }

  function stopRec() {
    if (state.mode !== 'rec') return;
    const rawSec = (performance.now() - state.recStart) / 1000;
    state.mode = 'idle';
    if (state.events.length === 0) {
      state.loopMs = 0;
    } else {
      let lenSec;
      if (state.met) {
        // Snap the take to whole bars when the click is on.
        const barSec = 4 * 60 / state.bpm;
        lenSec = Math.max(1, Math.round(rawSec / barSec)) * barSec;
      } else {
        lenSec = Math.max(rawSec, 0.25);
      }
      state.loopMs = Math.round(lenSec * 1000);
      state.events = state.events
        .map(e => ({ t: e.t % state.loopMs, pad: e.pad }))
        .sort((a, b) => a.t - b.t);
    }
    save();
  }

  function startPlayback() {
    if (state.mode === 'rec') stopRec();
    if (!state.events.length || state.loopMs <= 0 || !ensureAudio()) return;
    stopAllVoices();
    state.mode = 'play';
    state.passStart = ctx.currentTime + 0.08;
    state.passIdx = 0;
    if (state.met) resetMetronome(state.passStart);
  }

  function stopPlayback() {
    if (state.mode !== 'play') return;
    state.mode = 'idle';
    stopAllVoices();
  }

  function stopAll() {
    if (state.mode === 'rec') stopRec();
    if (state.mode === 'play') stopPlayback();
    if (ctx) stopAllVoices();
  }

  function toggleRec() {
    if (state.mode === 'rec') stopRec(); else startRec();
  }

  function togglePlay() {
    if (state.mode === 'play') stopPlayback(); else startPlayback();
  }

  function clearTake() {
    stopAll();
    state.events = [];
    state.loopMs = 0;
    save();
  }

  /* ================================================================
   *  Scheduler: plays take passes and metronome clicks ahead of time
   * ================================================================ */
  function tick() {
    if (!ctx) return;
    const now = ctx.currentTime;

    if (state.mode === 'play') {
      const loopSec = state.loopMs / 1000;
      const elapsed = now - state.passStart;
      if (loopSec <= 0 || (!state.loop && elapsed >= loopSec)) {
        stopPlayback();
      } else {
        for (;;) {
          const start = state.passStart + state.passIdx * loopSec;
          if (start > now + LOOKAHEAD) break;
          if (!state.loop && state.passIdx > 0) break;
          schedulePass(start);
          state.passIdx++;
        }
      }
    }

    if (state.met) {
      const beat = 60 / state.bpm;
      if (state.metNext < now) state.metNext = now + 0.02;
      while (state.metNext < now + LOOKAHEAD) {
        click(state.metNext, state.beatCount % 4 === 0);
        state.metNext += beat;
        state.beatCount++;
      }
    }
  }

  /* ================================================================
   *  Persistence (last take survives a reload)
   * ================================================================ */
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        events: state.events, loopMs: state.loopMs, bpm: state.bpm
      }));
    } catch (_) { /* storage unavailable (private mode, file://) */ }
  }

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!d) return;
      const loopMs = Number(d.loopMs);
      const events = Array.isArray(d.events)
        ? d.events.filter(e => Number.isFinite(e.t) && Number.isInteger(e.pad) &&
            e.pad >= 0 && e.pad < PADS.length && e.t >= 0 && e.t < loopMs)
        : [];
      if (events.length && loopMs > 0) {
        state.events = events;
        state.loopMs = loopMs;
      }
      if (Number.isFinite(d.bpm)) state.bpm = clamp(Math.round(d.bpm), 60, 180);
    } catch (_) { /* corrupt entry: ignore */ }
  }

  /* ================================================================
   *  UI
   * ================================================================ */
  const $ = id => document.getElementById(id);
  const el = {
    pads: $('pads'),
    vu: $('vu'),
    status: $('status'),
    hitNote: $('hitNote'),
    time: $('time'),
    bar: $('bar'),
    hits: $('hits'),
    bpmOut: $('bpmOut'),
    progress: $('progressBar'),
    rec: $('recBtn'),
    play: $('playBtn'),
    stop: $('stopBtn'),
    clear: $('clearBtn'),
    loop: $('loopBtn'),
    met: $('metBtn'),
    bpm: $('bpm'),
    bpmLabel: $('bpmLabel'),
    vol: $('vol'),
    volLabel: $('volLabel')
  };
  const kitBtns = Array.from(document.querySelectorAll('[data-kit]'));
  const ledEls = [];

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function fmtTime(sec) {
    sec = Math.max(0, sec);
    const m = Math.floor(sec / 60);
    const s = (sec % 60).toFixed(1).padStart(4, '0');
    return String(m).padStart(2, '0') + ':' + s;
  }

  function barBeat(sec) {
    const beats = sec * state.bpm / 60;
    const bar = Math.floor(beats / 4) + 1;
    const beat = Math.floor(beats) % 4 + 1;
    return bar + '.' + beat;
  }

  function setPressed(btn, on) {
    btn.setAttribute('aria-pressed', String(on));
    btn.classList.toggle('is-on', on);
  }

  function buildPads() {
    padEls = PADS.map((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pad';
      b.style.setProperty('--c', p.color);
      b.setAttribute('aria-label', `${p.name}, keyboard ${p.key}`);
      b.innerHTML =
        '<span class="rim"></span>' +
        '<span class="head"><span class="name"></span><span class="key"></span></span>';
      b.querySelector('.name').textContent = p.name;
      b.querySelector('.key').textContent = p.key;

      b.addEventListener('pointerdown', e => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        e.preventDefault();
        b.classList.add('down');
        playPad(i);
      });
      const release = () => b.classList.remove('down');
      b.addEventListener('pointerup', release);
      b.addEventListener('pointerleave', release);
      b.addEventListener('pointercancel', release);
      b.addEventListener('contextmenu', e => e.preventDefault());
      el.pads.appendChild(b);
      return b;
    });
  }

  function buildVu() {
    for (let i = 0; i < LEDS; i++) {
      const led = document.createElement('i');
      el.vu.appendChild(led);
      ledEls.push(led);
    }
  }

  function renderVu() {
    vuLevel *= 0.86;
    for (let i = 0; i < LEDS; i++) {
      const on = vuLevel * LEDS > i + 0.5;
      const zone = i >= LEDS - 2 ? 'r' : i >= LEDS - 5 ? 'a' : 'g';
      ledEls[i].className = on ? `on ${zone}` : '';
    }
  }

  let lastMode = null;
  function syncModeUI() {
    const m = state.mode;
    if (m === lastMode) return;
    lastMode = m;
    document.body.dataset.mode = m;
    setPressed(el.rec, m === 'rec');
    setPressed(el.play, m === 'play');
    el.rec.querySelector('span:last-child').textContent = m === 'rec' ? 'STOP REC' : 'REC';
    el.rec.classList.toggle('is-on', m === 'rec');
    el.play.classList.toggle('is-on', m === 'play');
    el.play.querySelector('span').textContent = m === 'play' ? (state.loop ? 'LOOPING' : 'PLAYING') : 'PLAY';
    el.clear.disabled = m === 'rec' || (!state.events.length && m !== 'rec');
    el.play.disabled = m !== 'play' && (!state.events.length || state.loopMs <= 0);

    const labels = {
      rec: ['● RECORDING', 'status rec'],
      play: [state.loop ? '▶ LOOPING TAKE' : '▶ PLAYING TAKE', 'status play'],
      idle: [state.events.length ? 'TAKE READY' : 'STANDBY', state.events.length ? 'status ready' : 'status idle']
    };
    const [text, cls] = labels[m];
    el.status.textContent = text;
    el.status.className = cls;
  }

  function frame() {
    const now = ctx ? ctx.currentTime : 0;
    const loopSec = state.loopMs / 1000;
    const barSec = 4 * 60 / state.bpm;
    const m = state.mode;

    let pos = 0;
    let progress = 0;
    if (m === 'rec') {
      pos = (performance.now() - state.recStart) / 1000;
      progress = ((pos % barSec) / barSec) * 100;
    } else if (m === 'play') {
      const elapsed = Math.max(0, now - state.passStart);
      pos = state.loop ? elapsed % loopSec : Math.min(elapsed, loopSec);
      progress = loopSec > 0 ? (pos / loopSec) * 100 : 0;
    }

    syncModeUI();
    el.time.textContent = fmtTime(m === 'idle' ? loopSec : pos);
    el.bar.textContent = m === 'idle' ? '—' : barBeat(pos);
    el.hits.textContent = String(state.events.length);
    el.bpmOut.textContent = String(state.bpm);
    el.progress.style.width = progress.toFixed(2) + '%';
    el.hitNote.textContent = state.events.length
      ? `Take · ${fmtTime(loopSec)} · ${state.events.length} hit${state.events.length === 1 ? '' : 's'}`
      : 'No take yet — hit REC';
    renderVu();
    requestAnimationFrame(frame);
  }

  /* ================================================================
   *  Event wiring
   * ================================================================ */
  kitBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      kitId = btn.dataset.kit;
      kitBtns.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    });
  });

  el.rec.addEventListener('click', toggleRec);
  el.play.addEventListener('click', togglePlay);
  el.stop.addEventListener('click', stopAll);
  el.clear.addEventListener('click', clearTake);

  el.loop.addEventListener('click', () => {
    state.loop = !state.loop;
    setPressed(el.loop, state.loop);
    lastMode = null; // refresh status text
  });

  el.met.addEventListener('click', () => {
    state.met = !state.met;
    if (state.met) {
      if (!ensureAudio()) { state.met = false; return; }
      resetMetronome(ctx.currentTime + 0.05);
    }
    setPressed(el.met, state.met);
  });

  el.bpm.addEventListener('input', () => {
    state.bpm = Number(el.bpm.value);
    el.bpmLabel.textContent = String(state.bpm);
    paintSlider(el.bpm);
  });
  el.bpm.addEventListener('change', save);

  el.vol.addEventListener('input', () => {
    volume = Number(el.vol.value);
    el.volLabel.textContent = String(Math.round(volume * 100));
    paintSlider(el.vol);
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.015);
  });

  function paintSlider(input) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty('--fill', pct + '%');
  }

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (!e.repeat) toggleRec();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) togglePlay();
      return;
    }
    if (e.key === 'Escape') { stopAll(); return; }

    const idx = KEY_TO_PAD.get(e.key.toLowerCase());
    if (idx === undefined || e.repeat) return;
    e.preventDefault();
    padEls[idx].classList.add('down');
    playPad(idx);
  });

  window.addEventListener('keyup', e => {
    const idx = KEY_TO_PAD.get(e.key.toLowerCase());
    if (idx !== undefined) padEls[idx].classList.remove('down');
  });

  // Release any stuck "down" state if focus leaves the window mid-press.
  window.addEventListener('blur', () => padEls.forEach(p => p.classList.remove('down')));

  /* ================================================================
   *  Boot
   * ================================================================ */
  load();
  el.bpm.value = String(state.bpm);
  el.bpmLabel.textContent = String(state.bpm);
  el.bpm.dispatchEvent(new Event('input'));
  el.vol.dispatchEvent(new Event('input'));
  setPressed(el.loop, false);
  setPressed(el.met, false);
  buildPads();
  buildVu();
  setInterval(tick, TICK_MS);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
