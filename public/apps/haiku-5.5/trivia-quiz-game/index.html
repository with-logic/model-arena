<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="All-American Trivia: ten basic questions about the United States, shuffled every time you play.">
<meta name="theme-color" content="#07122b">
<title>All-American Trivia</title>
<style>
  :root {
    --navy: #07122b;
    --navy-2: #132a5e;
    --red: #d62839;
    --blue: #2350b8;
    --gold: #f5b942;
    --ink: #14213d;
    --muted: #5b6785;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red-bg: #fee2e2;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background: var(--navy);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(214, 40, 57, 0.35), transparent 60%),
      radial-gradient(900px 600px at 95% 0%, rgba(35, 80, 184, 0.55), transparent 60%),
      linear-gradient(180deg, #0d2155 0%, var(--navy) 100%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 1.5px);
    background-size: 44px 44px;
    opacity: 0.06;
    pointer-events: none;
  }

  .app {
    position: relative;
    max-width: 780px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 20px 28px;
  }

  /* ---------- Top bar & progress ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 0 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .brand svg { width: 20px; height: 20px; fill: var(--gold); }

  .best {
    font-size: 0.8rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
    opacity: 0;
    transition: opacity 0.3s ease;
    font-variant-numeric: tabular-nums;
  }

  .best.show { opacity: 1; }

  .progress {
    height: 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--gold), #ff8a5b 55%, var(--red));
    box-shadow: 0 0 12px rgba(245, 185, 66, 0.6);
    transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    opacity: 0.8;
    margin-top: 9px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Layout ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 0 0;
    outline: none;
  }

  .view {
    width: 100%;
    animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    background: #fff;
    color: var(--ink);
    border-radius: 26px;
    padding: 40px 34px 30px;
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, var(--blue) 0 33.33%, #dfe6f5 33.33% 66.66%, var(--red) 66.66%);
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .chip {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blue);
    background: #e8efff;
    padding: 7px 12px;
    border-radius: 999px;
  }

  .counter {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .question {
    font-size: clamp(1.55rem, 3.6vw, 2.2rem);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 18px 0 28px;
    text-wrap: balance;
  }

  .question:focus { outline: none; }

  /* ---------- Answers ---------- */
  .answers {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 580px) {
    .answers { grid-template-columns: 1fr 1fr; }
  }

  .answer {
    appearance: none;
    font: inherit;
    color: var(--ink);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 72px;
    padding: 14px 16px;
    background: #f5f7fc;
    border: 2px solid #d9e1f2;
    border-radius: 16px;
    font-size: 1.1rem;
    font-weight: 650;
    line-height: 1.3;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease,
                box-shadow 0.2s ease, opacity 0.3s ease;
  }

  .answer:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  @media (hover: hover) {
    .answer:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 10px 20px -12px rgba(35, 80, 184, 0.6);
    }
  }

  .answer:not(:disabled):active { transform: scale(0.98); }
  .answer:disabled { cursor: default; }

  .key {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--navy-2);
    color: #fff;
    font-weight: 800;
    font-size: 0.9rem;
    transition: background-color 0.2s ease;
  }

  .label { flex: 1; }

  .answer.correct {
    background: var(--green-bg);
    border-color: var(--green);
    animation: pulseOk 0.6s ease;
  }
  .answer.correct .key { background: var(--green); }

  .answer.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    animation: shakeX 0.45s ease;
  }
  .answer.wrong .key { background: var(--red); }

  .answer.dim { opacity: 0.5; }

  @keyframes pulseOk {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  @keyframes shakeX {
    0%, 100% { transform: none; }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }

  /* ---------- Verdict burst (green check / red X) ---------- */
  .verdict {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 132px;
    height: 132px;
    margin: -66px 0 0 -66px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    pointer-events: none;
    box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.35);
    animation: verdict 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    z-index: 2;
  }

  .verdict.ok { background: radial-gradient(circle at 30% 25%, #4ade80, var(--green)); }
  .verdict.bad { background: radial-gradient(circle at 30% 25%, #f87171, var(--red)); }

  .verdict svg {
    width: 64px;
    height: 64px;
    stroke: #fff;
    stroke-width: 3.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .verdict path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 0.45s 0.25s ease forwards;
  }

  @keyframes verdict {
    0% { opacity: 0; transform: scale(0.3); }
    30% { opacity: 1; transform: scale(1.12); }
    45% { transform: scale(1); }
    75% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- Feedback bar & actions ---------- */
  .feedback {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    font-size: 1rem;
    line-height: 1.4;
    animation: slideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
  }

  .feedback strong { display: block; font-size: 1.05rem; }
  .feedback b { font-weight: 800; }
  .feedback.ok { background: var(--green-bg); color: #14532d; }
  .feedback.bad { background: var(--red-bg); color: #7f1d1d; }

  .fb-icon {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .feedback.ok .fb-icon { background: var(--green); }
  .feedback.bad .fb-icon { background: var(--red); }

  .fb-icon svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .actions {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
    min-height: 56px;
  }

  .actions:empty { min-height: 0; margin-top: 0; }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 0;
    font: inherit;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-radius: 999px;
    padding: 16px 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn:active { transform: scale(0.97); }

  .btn.light {
    background: linear-gradient(180deg, #ffffff, #e9eefb);
    color: var(--navy);
    box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.6);
  }

  .btn.gold {
    background: linear-gradient(180deg, #ffd166, #f5a524);
    color: #2a1a00;
    box-shadow: 0 14px 30px -14px rgba(245, 165, 36, 0.9);
  }

  .btn.big { font-size: 1.15rem; padding: 18px 44px; }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (hover: hover) {
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  }

  .hint {
    margin-top: 18px;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.65;
  }

  kbd {
    font: inherit;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  @media (hover: none) { .hint { display: none; } }

  /* ---------- Start screen ---------- */
  .start { text-align: center; padding: 24px 0; }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .emblem {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, #1f3f8f, #0b1d4a);
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.08), 0 0 0 14px rgba(255, 255, 255, 0.04),
                0 30px 60px -20px rgba(0, 0, 0, 0.7);
    animation: float 4s ease-in-out infinite;
  }

  .emblem svg {
    width: 72px;
    height: 72px;
    fill: var(--gold);
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .hero h1 {
    margin-top: 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .hero h1 span {
    display: block;
    color: var(--gold);
    font-style: italic;
  }

  .lead {
    margin-top: 18px;
    font-size: 1.15rem;
    line-height: 1.5;
    max-width: 460px;
    opacity: 0.9;
  }

  .chips {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 26px 0 34px;
  }

  .chips li {
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }

  /* ---------- Results ---------- */
  .results-card { text-align: center; }

  .ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 6px auto 18px;
  }

  .ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-bg { fill: none; stroke: #e6ebf6; stroke-width: 10; }

  .ring-fg {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.4s cubic-bezier(0.3, 0.7, 0.2, 1);
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }

  .ring-label span {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .ring-label small {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 700;
    margin-top: 4px;
  }

  .result-title {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .result-msg {
    margin-top: 8px;
    font-size: 1.1rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .best-line {
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--blue);
  }

  .review {
    list-style: none;
    text-align: left;
    margin: 26px 0 0;
    display: grid;
    gap: 10px;
    max-height: 340px;
    overflow: auto;
    padding-right: 4px;
  }

  .rev {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 14px;
    border-radius: 14px;
    background: #f5f7fc;
    border: 1px solid #e1e7f3;
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: calc(var(--d, 0) * 60ms);
  }

  .rev .mark {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .rev.ok .mark { background: var(--green); }
  .rev.bad .mark { background: var(--red); }

  .rev .mark svg {
    width: 14px;
    height: 14px;
    stroke: #fff;
    stroke-width: 3.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .rev-q { font-weight: 700; font-size: 0.95rem; line-height: 1.35; }
  .rev-a { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
  .rev-a b { color: var(--ink); }

  .results-card .btn { margin-top: 24px; }

  /* ---------- Confetti ---------- */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  .confetti i {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 14px;
    border-radius: 2px;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: both;
  }

  @keyframes fall {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to { transform: translate3d(var(--x), 110vh, 0) rotate(720deg); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- Small screens & reduced motion ---------- */
  @media (max-width: 579px) {
    .card { padding: 34px 22px 24px; }
    .actions .btn { width: 100%; }
    .verdict { width: 110px; height: 110px; margin: -55px 0 0 -55px; }
    .verdict svg { width: 52px; height: 52px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 60.9,35 93.8,35.8 67.6,55.7 77,87.2 50,68.5 23,87.2 32.4,55.7 6.2,35.8 39.1,35"/></svg>
      All-American Trivia
    </div>
    <div class="best" id="best"></div>
  </header>

  <div class="progress-wrap">
    <div class="progress" id="progressBar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label">
      <span id="progLabel"></span>
      <span id="progScore"></span>
    </div>
  </div>

  <main id="main" tabindex="-1"></main>

  <div id="live" class="sr-only" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Question bank (basic US civics, history, geography, and culture) ----------
  // Each entry: question text, multiple-choice answers, and the correct answer.
  const QUESTIONS = [
    {
      category: 'Government',
      question: 'What is the capital of the United States?',
      answers: ['New York City', 'Washington, D.C.', 'Los Angeles', 'Chicago'],
      correct: 'Washington, D.C.',
    },
    {
      category: 'Symbols',
      question: 'How many stripes are on the U.S. flag?',
      answers: ['10', '11', '13', '15'],
      correct: '13',
    },
    {
      category: 'Symbols',
      question: 'How many stars are on the U.S. flag?',
      answers: ['45', '48', '50', '52'],
      correct: '50',
    },
    {
      category: 'Geography',
      question: 'Which is the largest U.S. state by land area?',
      answers: ['Texas', 'California', 'Montana', 'Alaska'],
      correct: 'Alaska',
    },
    {
      category: 'History',
      question: 'Who was the first President of the United States?',
      answers: ['Thomas Jefferson', 'John Adams', 'George Washington', 'Abraham Lincoln'],
      correct: 'George Washington',
    },
    {
      category: 'History',
      question: 'Which document formally declared American independence from Britain in 1776?',
      answers: ['The Bill of Rights', 'The Constitution', 'The Declaration of Independence', 'The Gettysburg Address'],
      correct: 'The Declaration of Independence',
    },
    {
      category: 'Government',
      question: 'How many branches make up the federal government?',
      answers: ['Two', 'Three', 'Four', 'Five'],
      correct: 'Three',
    },
    {
      category: 'Geography',
      question: 'Which ocean lies along the east coast of the United States?',
      answers: ['Pacific', 'Indian', 'Arctic', 'Atlantic'],
      correct: 'Atlantic',
    },
    {
      category: 'Money',
      question: 'Whose face appears on the U.S. $100 bill?',
      answers: ['Abraham Lincoln', 'Alexander Hamilton', 'Benjamin Franklin', 'Thomas Jefferson'],
      correct: 'Benjamin Franklin',
    },
    {
      category: 'Holidays',
      question: 'On what date is Independence Day celebrated?',
      answers: ['June 14', 'July 4', 'July 14', 'May 30'],
      correct: 'July 4',
    },
  ];

  const TOTAL = QUESTIONS.length;
  const LETTERS = ['A', 'B', 'C', 'D'];
  const BEST_KEY = 'all-american-trivia-best';

  const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_X = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  const ICON_ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const VERDICT_OK = '<svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const VERDICT_BAD = '<svg viewBox="0 0 24 24"><path pathLength="1" d="M7 7l10 10"/><path pathLength="1" d="M17 7L7 17" style="animation-delay:.42s"/></svg>';

  const RING_RADIUS = 54;
  const RING_C = 2 * Math.PI * RING_RADIUS;

  const $main = document.getElementById('main');
  const $best = document.getElementById('best');
  const $bar = document.getElementById('progressBar');
  const $fill = document.getElementById('progressFill');
  const $progLabel = document.getElementById('progLabel');
  const $progScore = document.getElementById('progScore');
  const $live = document.getElementById('live');

  // ---------- State ----------
  let screen = 'start';   // 'start' | 'quiz' | 'results'
  let deck = [];          // shuffled questions, answers also shuffled
  let index = 0;          // current question index
  let score = 0;
  let answered = false;
  let history = [];       // { question, chosen, correct, isCorrect }

  // ---------- Utilities ----------
  const shuffle = (items) => {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const getBest = () => {
    try {
      const n = Number(localStorage.getItem(BEST_KEY));
      return Number.isFinite(n) && n > 0 ? n : 0;
    } catch (_) {
      return 0;
    }
  };

  const setBest = (value) => {
    try { localStorage.setItem(BEST_KEY, String(value)); } catch (_) { /* storage unavailable */ }
  };

  const announce = (message) => {
    $live.textContent = '';
    setTimeout(() => { $live.textContent = message; }, 50);
  };

  const renderBest = () => {
    const best = getBest();
    $best.textContent = `Best ${best} / ${TOTAL}`;
    $best.classList.toggle('show', best > 0);
  };

  const setProgress = () => {
    const done = history.length;
    const pct = Math.round((done / TOTAL) * 100);
    $fill.style.width = `${pct}%`;
    $bar.setAttribute('aria-valuenow', String(pct));
    if (screen === 'start') {
      $progLabel.textContent = 'Ready when you are';
      $progScore.textContent = '';
    } else {
      $progLabel.textContent = done === TOTAL ? 'Quiz complete' : `${done} of ${TOTAL} answered`;
      $progScore.textContent = `Score ${score}`;
    }
  };

  const focusHeading = () => {
    const heading = $main.querySelector('h1, .question, .result-title');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  };

  // ---------- Views ----------
  const startView = () => `
    <section class="view start" aria-labelledby="title">
      <div class="hero">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 100 100"><polygon points="50,4 60.9,35 93.8,35.8 67.6,55.7 77,87.2 50,68.5 23,87.2 32.4,55.7 6.2,35.8 39.1,35"/></svg>
        </div>
        <h1 id="title">All-American<span>Trivia</span></h1>
        <p class="lead">Ten classic questions about the United States. The order and answers are shuffled every time you play.</p>
        <ul class="chips">
          <li>10 questions</li>
          <li>4 choices each</li>
          <li>About 3 minutes</li>
        </ul>
        <button class="btn light big" data-action="start">Start quiz ${ICON_ARROW}</button>
      </div>
    </section>`;

  const questionView = () => {
    const q = deck[index];
    return `
    <section class="view" aria-label="Question ${index + 1} of ${TOTAL}">
      <article class="card" id="card">
        <div class="meta">
          <span class="chip">${esc(q.category)}</span>
          <span class="counter">Question ${index + 1} of ${TOTAL}</span>
        </div>
        <h2 class="question">${esc(q.question)}</h2>
        <div class="answers" role="group" aria-label="Answer choices">
          ${q.answers.map((answer, i) => `
            <button class="answer" data-i="${i}">
              <span class="key" aria-hidden="true">${LETTERS[i]}</span>
              <span class="label">${esc(answer)}</span>
            </button>`).join('')}
        </div>
        <div class="feedback-slot"></div>
        <div class="actions"></div>
      </article>
      <p class="hint">Press <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd> to continue</p>
    </section>`;
  };

  const resultsView = () => {
    const pct = Math.round((score / TOTAL) * 100);
    const prevBest = getBest();
    const isNewBest = score > prevBest && score > 0;
    const best = Math.max(prevBest, score);
    const tiers = [
      [10, 'Perfect score!', 'Flawless. You know your country inside and out.'],
      [8, 'Outstanding!', 'You clearly know your America. Just a few details to brush up on.'],
      [6, 'Well done!', 'A solid showing. Good citizenship starts with knowing your country.'],
      [4, 'Not bad!', 'A little review and you will ace the next round.'],
      [0, 'Keep learning!', 'Every question is a chance to learn something new about the United States.'],
    ];
    const [, title, message] = tiers.find(([min]) => score >= min);

    return `
    <section class="view results" aria-label="Results">
      <div class="card results-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2350b8"/>
                <stop offset="1" stop-color="#d62839"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="60" cy="60" r="${RING_RADIUS}"/>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="${RING_RADIUS}"
              style="stroke-dasharray:${RING_C};stroke-dashoffset:${RING_C}"/>
          </svg>
          <div class="ring-label" aria-label="${score} out of ${TOTAL} correct">
            <span id="countUp">0</span>
            <small>of ${TOTAL} · ${pct}%</small>
          </div>
        </div>
        <h2 class="result-title">${title}</h2>
        <p class="result-msg">${message}</p>
        <p class="best-line">${isNewBest ? 'New personal best!' : `Personal best: ${best} / ${TOTAL}`}</p>
        <ol class="review" aria-label="Your answers">
          ${history.map((h, n) => `
            <li class="rev ${h.isCorrect ? 'ok' : 'bad'}" style="--d:${n}">
              <span class="mark" aria-hidden="true">${h.isCorrect ? ICON_CHECK : ICON_X}</span>
              <div>
                <div class="rev-q">${esc(h.question)}</div>
                <div class="rev-a">${h.isCorrect
                  ? `You answered <b>${esc(h.chosen)}</b>`
                  : `You answered <b>${esc(h.chosen)}</b> · Correct: <b>${esc(h.correct)}</b>`}</div>
              </div>
            </li>`).join('')}
        </ol>
        <button class="btn gold" data-action="restart">Play again ${ICON_ARROW}</button>
      </div>
    </section>`;
  };

  // ---------- Flow ----------
  function showStart() {
    screen = 'start';
    answered = false;
    $main.innerHTML = startView();
    renderBest();
    setProgress();
    focusHeading();
  }

  function startQuiz() {
    deck = shuffle(QUESTIONS).map((q) => ({ ...q, answers: shuffle(q.answers) }));
    index = 0;
    score = 0;
    history = [];
    showQuestion();
  }

  function showQuestion() {
    screen = 'quiz';
    answered = false;
    $main.innerHTML = questionView();
    setProgress();
    focusHeading();
  }

  function choose(i) {
    if (answered || screen !== 'quiz') return;
    answered = true;

    const q = deck[index];
    const chosen = q.answers[i];
    const isCorrect = chosen === q.correct;
    if (isCorrect) score++;
    history.push({ question: q.question, chosen, correct: q.correct, isCorrect });

    $main.querySelectorAll('.answer').forEach((btn, n) => {
      btn.disabled = true;
      if (q.answers[n] === q.correct) btn.classList.add('correct');
      else if (n === i) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });

    const card = $main.querySelector('#card');
    const verdict = document.createElement('div');
    verdict.className = `verdict ${isCorrect ? 'ok' : 'bad'}`;
    verdict.setAttribute('aria-hidden', 'true');
    verdict.innerHTML = isCorrect ? VERDICT_OK : VERDICT_BAD;
    card.appendChild(verdict);

    $main.querySelector('.feedback-slot').innerHTML = isCorrect
      ? `<div class="feedback ok" role="status">
           <span class="fb-icon">${ICON_CHECK}</span>
           <div><strong>Correct!</strong><span>Nice work.</span></div>
         </div>`
      : `<div class="feedback bad" role="status">
           <span class="fb-icon">${ICON_X}</span>
           <div><strong>Not quite.</strong><span>The correct answer is <b>${esc(q.correct)}</b>.</span></div>
         </div>`;

    const isLast = index === TOTAL - 1;
    $main.querySelector('.actions').innerHTML =
      `<button class="btn gold" data-action="next">${isLast ? 'See my results' : 'Next question'} ${ICON_ARROW}</button>`;

    setProgress();
    announce(isCorrect ? `Correct. Score ${score}.` : `Incorrect. The correct answer is ${q.correct}.`);
  }

  function next() {
    if (!answered || screen !== 'quiz') return;
    index++;
    if (index >= TOTAL) {
      showResults();
    } else {
      showQuestion();
    }
  }

  function showResults() {
    screen = 'results';
    answered = false;
    const prevBest = getBest();
    if (score > prevBest) setBest(score);

    $main.innerHTML = resultsView();
    renderBest();
    setProgress();
    focusHeading();

    // Animate the score ring and counter once the markup is in the DOM.
    const ring = document.getElementById('ringFg');
    setTimeout(() => {
      ring.style.strokeDashoffset = String(RING_C * (1 - score / TOTAL));
    }, 80);
    countUp(score, 1200);

    if (score === TOTAL) confetti();
  }

  function countUp(target, duration) {
    const el = document.getElementById('countUp');
    if (!el) return;
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = String(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function confetti() {
    const layer = document.createElement('div');
    layer.className = 'confetti';
    layer.setAttribute('aria-hidden', 'true');
    const colors = ['#d62839', '#ffffff', '#2350b8', '#f5b942', '#16a34a'];
    for (let i = 0; i < 90; i++) {
      const piece = document.createElement('i');
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty('--x', `${Math.random() * 160 - 80}px`);
      piece.style.animationDuration = `${2.6 + Math.random() * 2.2}s`;
      piece.style.animationDelay = `${Math.random() * 0.6}s`;
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 5500);
  }

  // ---------- Events ----------
  $main.addEventListener('click', (event) => {
    const target = event.target.closest('.answer, [data-action]');
    if (!target) return;
    if (target.classList.contains('answer')) {
      choose(Number(target.dataset.i));
      return;
    }
    switch (target.dataset.action) {
      case 'start':
      case 'restart':
        startQuiz();
        break;
      case 'next':
        next();
        break;
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || screen !== 'quiz') return;
    if (!answered && /^[1-4]$/.test(event.key)) {
      event.preventDefault();
      choose(Number(event.key) - 1);
    } else if (answered && (event.key === 'Enter' || event.key === 'ArrowRight')) {
      event.preventDefault();
      next();
    }
  });

  // ---------- Boot ----------
  showStart();
})();
</script>
</body>
</html>
