<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Merry Christmas! | Holiday Card for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #2a4f8a 0%, #13295a 45%, #0a1733 100%);
  }
  body {
    font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    color: #fff;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  button { font: inherit; }

  /* ---------- Sky ---------- */
  #aurora { position: fixed; left: -10%; right: -10%; top: -15%; height: 60%; filter: blur(50px); opacity: .45; pointer-events: none; }
  #aurora i { position: absolute; display: block; width: 45%; height: 100%; border-radius: 50%; mix-blend-mode: screen; animation: drift 14s ease-in-out infinite alternate; }
  #aurora i:nth-child(1) { left: 0;   background: radial-gradient(closest-side, #37f0b0, transparent); }
  #aurora i:nth-child(2) { left: 40%; background: radial-gradient(closest-side, #7b6dff, transparent); animation-duration: 18s; animation-delay: -5s; }
  #aurora i:nth-child(3) { left: 20%; background: radial-gradient(closest-side, #ff7ab6, transparent); animation-duration: 16s; animation-delay: -9s; }
  @keyframes drift { from { transform: translateX(-8%) scale(1); } to { transform: translateX(10%) scale(1.15); } }

  #stars { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; animation: twinkle 3s ease-in-out infinite; }

  .shoot {
    position: fixed; width: 160px; height: 2px; border-radius: 2px; pointer-events: none; z-index: 3;
    background: linear-gradient(90deg, transparent, #fff); box-shadow: 0 0 10px #fff;
    animation: shoot 1.4s ease-in forwards;
  }
  @keyframes shoot {
    from { transform: translate(0, 0) rotate(25deg); opacity: 0; }
    10%  { opacity: 1; }
    to   { transform: translate(700px, 400px) rotate(25deg); opacity: 0; }
  }

  #moon {
    position: fixed; top: 14vh; right: 12vw; z-index: 1;
    width: clamp(64px, 9vw, 120px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #ffeaa6 55%, #f2c46d 100%);
    box-shadow: 0 0 60px 18px rgba(255, 236, 170, .35);
    animation: float 8s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  #hills { position: fixed; left: 0; bottom: 0; width: 100%; height: clamp(120px, 24vh, 240px); z-index: 2; pointer-events: none; }

  /* ---------- Title + name tag ---------- */
  #title { position: fixed; top: clamp(12px, 3vh, 36px); left: 0; right: 0; z-index: 6; text-align: center; pointer-events: none; padding: 0 16px; }
  #greeting {
    margin: 0; font-family: 'Mountains of Christmas', 'Brush Script MT', cursive;
    font-size: clamp(54px, 11vw, 132px); line-height: 1.05; font-weight: 700;
    text-shadow: 0 5px 0 #b3123d, 0 10px 24px rgba(0, 0, 0, .45);
  }
  .ltr { display: inline-block; animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .09s); }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(-4deg); } }
  #sub { margin: 6px 0 0; font-size: clamp(18px, 2.6vw, 30px); color: #fff3d6; text-shadow: 0 2px 8px rgba(0, 0, 0, .4); font-weight: 500; }

  #tag {
    position: fixed; left: 18px; top: 18px; z-index: 9;
    display: flex; align-items: center; gap: 8px;
    background: #fff7e0; color: #7a2d12; border-radius: 14px 14px 14px 4px;
    padding: 12px 16px; box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    transform: rotate(-3deg); font-weight: 700; font-size: 18px;
  }
  #tag::before {
    content: ''; position: absolute; top: -10px; left: 50%; width: 60px; height: 20px; margin-left: -30px;
    background: rgba(255, 209, 102, .85); transform: rotate(3deg); border-radius: 3px;
  }
  #who {
    user-select: text; -webkit-user-select: text; width: 170px;
    border: none; border-bottom: 2px dashed #c94b1f; background: transparent;
    font: inherit; font-weight: 700; color: inherit; outline: none; padding: 2px 4px; border-radius: 4px;
  }
  #who::placeholder { color: rgba(122, 45, 18, .45); font-weight: 500; }
  #who:focus { background: rgba(255, 209, 102, .3); }

  /* ---------- Toolbar ---------- */
  #toolbar { position: fixed; right: 18px; top: 18px; z-index: 9; display: flex; gap: 10px; }
  .tool {
    width: 56px; height: 56px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #fff; font-size: 26px; line-height: 1; box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
    transition: transform .15s, background .15s;
  }
  .tool:hover { transform: scale(1.1) rotate(-6deg); background: rgba(255, 255, 255, .3); }
  .tool:active { transform: scale(.92); }
  .tool[aria-pressed="false"] { opacity: .6; }
  .tool:focus-visible, .chip:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }

  /* ---------- Tray ---------- */
  #tray {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9;
    width: min(96vw, 1040px); padding: 12px 10px 8px; display: flex; gap: 4px;
    overflow-x: auto; overflow-y: hidden; border-radius: 26px;
    background: rgba(10, 26, 58, .55); border: 1px solid rgba(255, 255, 255, .22);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .35); scrollbar-width: thin; transition: background .2s;
  }
  #tray.drop { background: rgba(239, 71, 111, .65); }
  .chip {
    flex: 0 0 auto; width: 62px; height: 62px; border: none; border-radius: 18px; cursor: grab;
    background: rgba(255, 255, 255, .12); font-size: 34px; line-height: 1;
    touch-action: pan-x; transition: transform .15s, background .15s;
  }
  .chip:hover { background: rgba(255, 255, 255, .3); transform: translateY(-4px) rotate(-5deg) scale(1.06); }
  .chip:active { cursor: grabbing; transform: scale(.95); }

  #hint {
    position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); z-index: 8;
    margin: 0; white-space: nowrap; font-size: 18px; font-weight: 500; color: #fff;
    background: rgba(0, 0, 0, .25); padding: 6px 16px; border-radius: 99px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, .4); transition: opacity 1.2s; pointer-events: none;
  }
  #hint.gone { opacity: 0; }

  /* ---------- Decorations ---------- */
  #decos { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .deco {
    position: absolute; transform: translate(-50%, -50%); z-index: 5;
    pointer-events: auto; cursor: grab; touch-action: none;
  }
  .deco.lifted { cursor: grabbing; z-index: 12; }
  .deco.trash .glyph { filter: drop-shadow(0 0 14px #ef476f) grayscale(.5); }
  .deco.poofing { pointer-events: none; }
  .sc { display: block; transform-origin: 50% 60%; }
  .deco.lifted .sc { transform: scale(1.12); }
  .glyph {
    display: block; line-height: 1; user-select: none;
    animation: sway 3.4s ease-in-out infinite; animation-delay: var(--d, 0s);
    filter: drop-shadow(0 8px 6px rgba(0, 0, 0, .35));
  }
  .deco.lifted .glyph { animation: wobble .4s ease-in-out infinite; }
  .deco.enter .sc { animation: pop .6s cubic-bezier(.3, 1.5, .5, 1) both; }
  .sc.hop { animation: hop .65s ease-out; }
  .sc.squish { animation: squish .38s ease-out; }
  .deco.poofing .sc { animation: poofout .36s ease-in forwards; }

  @keyframes pop {
    0% { transform: scale(0) rotate(-30deg); }
    65% { transform: scale(1.2) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @keyframes hop {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-40px) scale(1.06, .94); }
    45% { transform: translateY(0) scale(1.12, .88); }
    62% { transform: translateY(-12px) scale(1); }
    80% { transform: translateY(0); }
    100% { transform: none; }
  }
  @keyframes squish {
    0% { transform: scale(1.18, .78); }
    40% { transform: scale(.92, 1.12); }
    100% { transform: none; }
  }
  @keyframes poofout { to { transform: scale(1.7) rotate(25deg); opacity: 0; } }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }

  #fx { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; }

  /* ---------- Small screens ---------- */
  @media (max-width: 600px) {
    #title { top: 84px; }
    #tag { left: 10px; top: 10px; font-size: 15px; padding: 10px 12px; }
    #who { width: 110px; }
    .tool { width: 46px; height: 46px; font-size: 21px; }
    #toolbar { right: 10px; top: 10px; gap: 6px; }
    .chip { width: 54px; height: 54px; font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glyph, .ltr, #moon, .star, #aurora i { animation: none !important; }
  }
</style>
</head>
<body>

<div id="aurora"><i></i><i></i><i></i></div>
<div id="stars"></div>
<div id="moon" aria-hidden="true"></div>

<svg id="hills" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#2a5288" d="M0,120 C200,40 380,150 620,90 C860,30 1080,130 1440,60 L1440,260 L0,260 Z" />
  <path fill="#cfe6fb" d="M0,170 C260,110 520,200 760,150 C1000,100 1200,190 1440,140 L1440,260 L0,260 Z" />
  <path fill="#ffffff" d="M0,210 C300,180 560,235 820,210 C1060,188 1260,230 1440,205 L1440,260 L0,260 Z" />
</svg>

<div id="decos"></div>

<header id="title">
  <h1 id="greeting" aria-label="Merry Christmas!"></h1>
  <p id="sub">Sending you lots of holiday hugs! 🤗</p>
</header>

<div id="tag">
  <label for="who">To:</label>
  <input id="who" maxlength="16" placeholder="someone special" autocomplete="off" />
</div>

<div id="toolbar">
  <button class="tool" id="btnSound" aria-label="Sound effects on or off" aria-pressed="true" title="Sound effects">🔊</button>
  <button class="tool" id="btnMusic" aria-label="Play holiday music" aria-pressed="false" title="Holiday music">🎵</button>
  <button class="tool" id="btnConfetti" aria-label="Confetti party" title="Confetti party">🎉</button>
  <button class="tool" id="btnReset" aria-label="Start the card over" title="Start over">🧹</button>
</div>

<p id="hint">✨ Drag decorations onto the card! Tap one to hear it ✨</p>

<nav id="tray" aria-label="Decorations"></nav>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const decosEl = $('#decos');
  const tray = $('#tray');
  const fx = $('#fx');
  const g2 = fx.getContext('2d');
  const btnSound = $('#btnSound');
  const btnMusic = $('#btnMusic');
  const btnConfetti = $('#btnConfetti');
  const btnReset = $('#btnReset');
  const who = $('#who');
  const sub = $('#sub');
  const hint = $('#hint');
  const greet = $('#greeting');
  const starsEl = $('#stars');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);

  // ---------- Decoration catalogue: emoji, name, size, sound ----------
  const KINDS = {
    tree:      { e: '🎄', name: 'Christmas tree',  size: 170, s: 'arpeggio' },
    evergreen: { e: '🌲', name: 'Evergreen',       size: 120, s: 'arpeggio' },
    santa:     { e: '🎅', name: 'Santa',           size: 110, s: 'ho' },
    mrsclaus:  { e: '🤶', name: 'Mrs. Claus',      size: 100, s: 'ho' },
    reindeer:  { e: '🦌', name: 'Reindeer',        size: 110, s: 'jingle' },
    sled:      { e: '🛷', name: 'Sled',            size: 100, s: 'whoosh' },
    snowman:   { e: '⛄', name: 'Snowman',         size: 110, s: 'boing' },
    snowflake: { e: '❄️', name: 'Snowflake',       size: 70,  s: 'sparkle' },
    gift:      { e: '🎁', name: 'Present',         size: 80,  s: 'gift' },
    bell:      { e: '🔔', name: 'Jingle bell',     size: 76,  s: 'chime' },
    star:      { e: '⭐', name: 'Star',            size: 80,  s: 'sparkle' },
    glowstar:  { e: '🌟', name: 'Glowing star',    size: 80,  s: 'sparkle' },
    sock:      { e: '🧦', name: 'Stocking',        size: 76,  s: 'chime' },
    candle:    { e: '🕯️', name: 'Candle',          size: 70,  s: 'chime' },
    cookie:    { e: '🍪', name: 'Cookie',          size: 70,  s: 'pop' },
    milk:      { e: '🥛', name: 'Glass of milk',   size: 70,  s: 'pop' },
    candy:     { e: '🍬', name: 'Candy',           size: 64,  s: 'pop' },
    lolly:     { e: '🍭', name: 'Lollipop',        size: 70,  s: 'pop' },
    cupcake:   { e: '🧁', name: 'Cupcake',         size: 70,  s: 'pop' },
    teddy:     { e: '🧸', name: 'Teddy bear',      size: 80,  s: 'boing' },
    penguin:   { e: '🐧', name: 'Penguin',         size: 84,  s: 'squeak' },
    polarbear: { e: '🐻‍❄️', name: 'Polar bear',      size: 84,  s: 'woof' },
    puppy:     { e: '🐶', name: 'Puppy',           size: 72,  s: 'woof' },
    kitty:     { e: '🐱', name: 'Kitty',           size: 72,  s: 'mew' },
    bunny:     { e: '🐰', name: 'Bunny',           size: 72,  s: 'boing' },
    fox:       { e: '🦊', name: 'Fox',             size: 72,  s: 'squeak' },
    owl:       { e: '🦉', name: 'Owl',             size: 76,  s: 'hoot' },
    balloon:   { e: '🎈', name: 'Balloon',         size: 76,  s: 'boing' },
    bow:       { e: '🎀', name: 'Ribbon bow',      size: 68,  s: 'chime' },
    heart:     { e: '💖', name: 'Sparkly heart',   size: 66,  s: 'chime' },
    rainbow:   { e: '🌈', name: 'Rainbow',         size: 100, s: 'rainbow' },
    note:      { e: '🎶', name: 'Music notes',     size: 70,  s: 'chime' },
    party:     { e: '🥳', name: 'Party face',      size: 72,  s: 'cheer' },
    popper:    { e: '🎉', name: 'Party popper',    size: 72,  s: 'cheer' },
  };
  const TRAY_ORDER = Object.keys(KINDS);

  // [kind, x as fraction of width, y as fraction of play height]
  const DEFAULT_SCENE = [
    ['tree', .5, .6], ['star', .5, .42],
    ['santa', .13, .86], ['reindeer', .27, .9],
    ['snowman', .8, .86], ['gift', .36, .93], ['gift', .67, .93],
    ['candy', .42, .72], ['cookie', .6, .74], ['milk', .72, .66],
    ['teddy', .93, .9], ['penguin', .5, .93],
    ['bell', .1, .4], ['bell', .88, .5],
    ['snowflake', .05, .62], ['snowflake', .3, .3],
    ['balloon', .2, .22], ['rainbow', .9, .24],
  ];

  const PALETTE = ['#ffd166', '#ef476f', '#06d6a0', '#ffffff', '#8ecae6', '#f78fb3'];

  // ---------- Audio (all synthesized with Web Audio, no files) ----------
  let ac = null, master = null;
  let sfxOn = true;
  let musicOn = false, musicTimer = null;

  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = sfxOn ? 0.7 : 0;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone({ freq, slideTo = null, t = 0, dur = 0.5, type = 'sine', vol = 0.25, attack = 0.008 }) {
    const a = audio();
    if (!a) return;
    const s = a.currentTime + t;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g).connect(master);
    o.start(s);
    o.stop(s + dur + 0.05);
  }

  function noise({ t = 0, dur = 0.2, vol = 0.2, from = 1000, to = 4000, type = 'bandpass' }) {
    const a = audio();
    if (!a) return;
    const s = a.currentTime + t;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = type;
    f.Q.value = 1.5;
    f.frequency.setValueAtTime(from, s);
    f.frequency.exponentialRampToValueAtTime(to, s + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(f).connect(g).connect(master);
    src.start(s);
    src.stop(s + dur + 0.02);
  }

  const SOUNDS = {
    chime() { tone({ freq: 1318.5, dur: 1.6, vol: 0.16 }); tone({ freq: 1975.5, dur: 1.1, vol: 0.06 }); },
    gift() {
      tone({ freq: 1046.5, dur: 0.5, type: 'triangle', vol: 0.2 });
      tone({ freq: 1318.5, t: 0.12, dur: 0.6, type: 'triangle', vol: 0.2 });
      tone({ freq: 1568, t: 0.24, dur: 0.9, type: 'triangle', vol: 0.18 });
    },
    arpeggio() {
      [523.25, 659.25, 783.99, 1046.5, 783.99].forEach((f, i) =>
        tone({ freq: f, t: i * 0.11, dur: 0.6, type: 'triangle', vol: 0.22 }));
    },
    jingle() {
      for (let i = 0; i < 10; i++) {
        const t = i * 0.06;
        tone({ freq: rand(2000, 3800), t, dur: 0.14, vol: 0.07 });
        noise({ t, dur: 0.05, vol: 0.12, from: 6000, to: 9000, type: 'highpass' });
      }
    },
    ho() {
      [0, 0.42, 0.84].forEach((t, i) =>
        tone({ freq: i < 2 ? 196 : 164.8, slideTo: i < 2 ? 140 : 120, t, dur: 0.34, type: 'triangle', vol: 0.34 }));
    },
    pop() { tone({ freq: 700, slideTo: 180, dur: 0.2, vol: 0.35 }); },
    boing() {
      tone({ freq: 220, slideTo: 660, dur: 0.18, type: 'triangle', vol: 0.3 });
      tone({ freq: 660, slideTo: 250, t: 0.18, dur: 0.35, type: 'triangle', vol: 0.28 });
    },
    sparkle() {
      for (let i = 0; i < 7; i++) tone({ freq: rand(1400, 3400), t: i * 0.055, dur: 0.3, vol: 0.08 });
    },
    whoosh() {
      noise({ dur: 0.7, vol: 0.3, from: 250, to: 2500 });
      tone({ freq: 180, slideTo: 420, dur: 0.7, vol: 0.05 });
    },
    squeak() {
      tone({ freq: 1000, slideTo: 1500, dur: 0.14, vol: 0.2 });
      tone({ freq: 1500, slideTo: 1100, t: 0.14, dur: 0.1, vol: 0.15 });
    },
    woof() { [0, 0.28].forEach((t) => tone({ freq: 300, slideTo: 150, t, dur: 0.22, type: 'triangle', vol: 0.35 })); },
    mew() {
      tone({ freq: 600, slideTo: 1100, dur: 0.22, type: 'triangle', vol: 0.28 });
      tone({ freq: 1100, slideTo: 800, t: 0.22, dur: 0.2, type: 'triangle', vol: 0.22 });
    },
    hoot() { [0, 0.35].forEach((t) => tone({ freq: 520, slideTo: 430, t, dur: 0.28, vol: 0.3 })); },
    rainbow() {
      tone({ freq: 500, slideTo: 1500, dur: 0.9, type: 'triangle', vol: 0.2 });
      [1.0, 1.12, 1.24].forEach((t, i) => tone({ freq: [1046.5, 1318.5, 1568][i], t, dur: 0.5, vol: 0.12 }));
    },
    cheer() {
      [523.25, 659.25, 783.99].forEach((f, i) => tone({ freq: f, t: i * 0.06, dur: 0.9, type: 'triangle', vol: 0.18 }));
      noise({ dur: 0.5, vol: 0.18, from: 1200, to: 4000 });
    },
    plop() { tone({ freq: 330, slideTo: 140, dur: 0.16, vol: 0.3 }); },
    poof() { noise({ dur: 0.35, vol: 0.3, from: 3000, to: 300, type: 'lowpass' }); },
    tap() {
      const n = [523.25, 587.33, 659.25, 783.99, 880];
      tone({ freq: n[(Math.random() * n.length) | 0], dur: 0.8, vol: 0.15 });
    },
  };

  function sfx(name) {
    try { SOUNDS[name]?.(); } catch (err) { /* audio is best-effort */ }
  }

  // Holiday melody (Jingle Bells), as [frequency Hz, beats]. Loops while music is on.
  const BEAT = 0.36;
  const MELODY = [
    [330, 1], [330, 1], [330, 2],
    [330, 1], [330, 1], [330, 2],
    [330, 1], [392, 1], [262, 1], [294, 1],
    [330, 4],
    [349, 1], [349, 1], [349, 1], [349, 1],
    [349, 1], [330, 1], [330, 1], [330, 1],
    [330, 1], [294, 1], [294, 1], [330, 1],
    [294, 2], [392, 2],
  ];
  const PASS_MS = MELODY.reduce((sum, [, b]) => sum + b, 0) * BEAT * 1000;

  function playMelodyPass() {
    let t = 0.05;
    for (const [f, b] of MELODY) {
      const d = b * BEAT;
      tone({ freq: f, t, dur: d * 0.9, type: 'triangle', vol: 0.13 });
      tone({ freq: f / 2, t, dur: d * 0.9, vol: 0.05 });
      t += d;
    }
  }

  function toggleMusic() {
    musicOn = !musicOn;
    btnMusic.setAttribute('aria-pressed', String(musicOn));
    if (musicOn) {
      audio();
      playMelodyPass();
      musicTimer = setInterval(playMelodyPass, PASS_MS);
    } else {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  // ---------- Canvas: snowfall, sparkles, confetti ----------
  let W = 0, H = 0, DPR = 1, S = 1;
  let flakes = [];
  const particles = [];
  let windT = 0;
  let lastFrame = performance.now();

  function newFlake(anywhere) {
    const r = rand(1, 4);
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -10,
      r,
      vy: 28 + r * 16,
      ph: Math.random() * 6.2832,
      sp: rand(0.5, 1.7),
      amp: 8 + r * 8,
      a: 0.45 + r * 0.15,
    };
  }

  function burst(x, y, o = {}) {
    const {
      count = 16, colors = PALETTE, speed = 260, gravity = 180,
      life = [0.6, 1.2], confetti = false, dir = null, spread = Math.PI * 2,
    } = o;
    for (let i = 0; i < count; i++) {
      const a = dir === null ? Math.random() * spread : dir + (Math.random() - 0.5) * spread;
      const sp = speed * rand(0.35, 1);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        g: gravity,
        age: 0,
        max: rand(life[0], life[1]),
        s: confetti ? rand(4, 8) : rand(1.5, 4),
        c: colors[(Math.random() * colors.length) | 0],
        rot: Math.random() * 6.2832,
        vr: (Math.random() - 0.5) * 14,
        confetti,
      });
    }
    if (particles.length > 700) particles.splice(0, particles.length - 700);
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.max) { particles.splice(i, 1); continue; }
      p.vx *= 1 - 1.2 * dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      g2.globalAlpha = 1 - p.age / p.max;
      g2.fillStyle = p.c;
      if (p.confetti) {
        g2.save();
        g2.translate(p.x, p.y);
        g2.rotate(p.rot);
        g2.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        g2.restore();
      } else {
        g2.beginPath();
        g2.arc(p.x, p.y, p.s, 0, 6.2832);
        g2.fill();
      }
    }
    g2.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    windT += dt;
    const wind = 10 + 14 * Math.sin(windT * 0.2);
    g2.clearRect(0, 0, W, H);
    g2.fillStyle = '#ffffff';
    for (const f of flakes) {
      f.ph += f.sp * dt;
      f.y += f.vy * dt;
      f.x += (Math.sin(f.ph) * f.amp * 0.6 + wind) * dt;
      if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
      if (f.x > W + 10) f.x = -10;
      else if (f.x < -10) f.x = W + 10;
      g2.globalAlpha = f.a;
      g2.beginPath();
      g2.arc(f.x, f.y, f.r, 0, 6.2832);
      g2.fill();
    }
    g2.globalAlpha = 1;
    drawParticles(dt);
    requestAnimationFrame(frame);
  }

  // ---------- Layout ----------
  function groundY() {
    return tray.getBoundingClientRect().top - 14;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    fx.width = Math.round(W * DPR);
    fx.height = Math.round(H * DPR);
    fx.style.width = W + 'px';
    fx.style.height = H + 'px';
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = clamp(Math.min(W / 1100, H / 760), 0.5, 1);
    const count = reduceMotion ? 40 : Math.round(clamp(W * H / 6500, 80, 240));
    flakes = Array.from({ length: count }, () => newFlake(true));

    const gy = groundY();
    for (const el of decosEl.children) {
      const kind = KINDS[el.dataset.kind];
      if (kind) el.querySelector('.glyph').style.fontSize = (kind.size * S) + 'px';
      el.style.left = clamp(parseFloat(el.style.left), 24, W - 24) + 'px';
      el.style.top = clamp(parseFloat(el.style.top), 24, gy) + 'px';
    }
  }

  // ---------- Decorations ----------
  function addDeco(kind, x, y, { enter = true, delay = 0 } = {}) {
    const def = KINDS[kind];
    if (!def) return null;
    if (decosEl.children.length >= 320) decosEl.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = 'deco' + (enter ? ' enter' : '');
    el.dataset.kind = kind;
    el.setAttribute('aria-label', def.name);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = '<div class="sc"><span class="glyph"></span></div>';
    const glyph = el.querySelector('.glyph');
    glyph.textContent = def.e;
    glyph.style.fontSize = (def.size * S) + 'px';
    glyph.style.setProperty('--d', (-Math.random() * 3.4).toFixed(2) + 's');
    const sc = el.querySelector('.sc');
    if (delay) sc.style.animationDelay = delay + 's';
    decosEl.appendChild(el);
    if (enter) setTimeout(() => el.classList.remove('enter'), 900 + delay * 1000);
    hint.classList.add('gone');
    return el;
  }

  function kick(el, cls, ms) {
    const sc = el.querySelector('.sc');
    sc.classList.remove(cls);
    void sc.offsetWidth;
    sc.classList.add(cls);
    clearTimeout(sc._kickTimer);
    sc._kickTimer = setTimeout(() => sc.classList.remove(cls), ms);
  }

  function poof(el, silent = false) {
    if (el.classList.contains('poofing')) return;
    el.classList.add('poofing');
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, {
      count: 22, speed: 220, gravity: 40, life: [0.4, 0.9],
      colors: ['#ffffff', '#ffd166', '#cfefff', '#ef476f'],
    });
    if (!silent) sfx('poof');
    setTimeout(() => el.remove(), 380);
  }

  function placeRandom(kind) {
    const gy = groundY();
    const x = W * rand(0.15, 0.85);
    const y = gy * rand(0.2, 0.8);
    addDeco(kind, x, y, { enter: true });
    burst(x, y, { count: 14, speed: 200, life: [0.5, 0.9] });
    sfx(KINDS[kind].s);
  }

  function buildScene() {
    decosEl.innerHTML = '';
    const gy = groundY();
    DEFAULT_SCENE.forEach(([kind, fx_, fy_], i) => {
      addDeco(kind, fx_ * W, fy_ * gy, { enter: true, delay: i * 0.07 });
    });
  }

  // ---------- Dragging ----------
  let dragging = null;   // { el, id, ox, oy, sx, sy, moved, overTray, fresh }
  let pending = null;    // { kind, id, sx, sy } — pointer went down on a tray chip
  let lastTrail = 0;

  function inTray(e) {
    const r = tray.getBoundingClientRect();
    return e.clientY >= r.top - 24 && e.clientY <= r.bottom + 40 &&
      e.clientX >= r.left - 16 && e.clientX <= r.right + 16;
  }

  function startDrag(el, e) {
    const r = el.getBoundingClientRect();
    dragging = {
      el, id: e.pointerId,
      ox: e.clientX - (r.left + r.width / 2),
      oy: e.clientY - (r.top + r.height / 2),
      sx: e.clientX, sy: e.clientY,
      moved: false, overTray: false, fresh: false,
    };
    el.classList.add('lifted');
  }

  function onPointerDown(e) {
    audio();
    const deco = e.target.closest('.deco');
    if (deco && !deco.classList.contains('poofing')) {
      e.preventDefault();
      startDrag(deco, e);
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip) {
      pending = { kind: chip.dataset.kind, id: e.pointerId, sx: e.clientX, sy: e.clientY };
      return;
    }
    if (e.target.closest('#toolbar, #tag, #tray, input, button')) return;
    burst(e.clientX, e.clientY, { count: 20, speed: 300, gravity: 120, life: [0.5, 1] });
    sfx('tap');
  }

  function onPointerMove(e) {
    if (pending && e.pointerId === pending.id) {
      if (Math.hypot(e.clientX - pending.sx, e.clientY - pending.sy) > 8) {
        const el = addDeco(pending.kind, e.clientX, e.clientY, { enter: true });
        pending = null;
        el.classList.add('lifted');
        dragging = {
          el, id: e.pointerId, ox: 0, oy: 0,
          sx: e.clientX, sy: e.clientY,
          moved: true, overTray: false, fresh: true,
        };
      }
      return;
    }
    if (!dragging || e.pointerId !== dragging.id) return;
    const d = dragging;
    if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 6) d.moved = true;
    if (!d.moved) return;

    d.el.style.left = (e.clientX - d.ox) + 'px';
    d.el.style.top = (e.clientY - d.oy) + 'px';

    const over = inTray(e);
    if (over !== d.overTray) {
      d.overTray = over;
      d.el.classList.toggle('trash', over);
      tray.classList.toggle('drop', over);
    }
    const now = performance.now();
    if (now - lastTrail > 45) {
      lastTrail = now;
      burst(e.clientX, e.clientY, { count: 1, speed: 30, gravity: 20, life: [0.35, 0.6], colors: ['#ffffff', '#ffd166'] });
    }
  }

  function onPointerUp(e) {
    if (pending && e.pointerId === pending.id) { pending = null; return; }   // a tap; the click handler places it
    if (!dragging || e.pointerId !== dragging.id) return;
    const d = dragging;
    dragging = null;
    d.el.classList.remove('lifted', 'trash');
    tray.classList.remove('drop');
    const kind = d.el.dataset.kind;

    if (!d.moved) {                      // a tap on an item already on the card
      kick(d.el, 'hop', 650);
      sfx(KINDS[kind].s);
      return;
    }
    if (inTray(e)) { poof(d.el); return; }  // dragged back to the tray = remove

    const x = clamp(e.clientX - d.ox, 24, W - 24);
    const y = clamp(e.clientY - d.oy, 24, groundY());
    d.el.style.left = x + 'px';
    d.el.style.top = y + 'px';
    kick(d.el, 'squish', 380);
    burst(x, y, { count: 10, speed: 160, gravity: 60, life: [0.4, 0.8] });
    sfx(d.fresh ? KINDS[kind].s : 'plop');
  }

  function onPointerCancel(e) {
    if (pending && e.pointerId === pending.id) pending = null;
    if (dragging && e.pointerId === dragging.id) {
      dragging.el.classList.remove('lifted', 'trash');
      tray.classList.remove('drop');
      dragging = null;
    }
  }

  // ---------- Toolbar ----------
  btnSound.addEventListener('click', () => {
    sfxOn = !sfxOn;
    if (master) master.gain.setTargetAtTime(sfxOn ? 0.7 : 0, ac.currentTime, 0.05);
    btnSound.textContent = sfxOn ? '🔊' : '🔇';
    btnSound.setAttribute('aria-pressed', String(sfxOn));
    if (sfxOn) sfx('chime');
  });

  btnMusic.addEventListener('click', toggleMusic);

  btnConfetti.addEventListener('click', () => {
    sfx('cheer');
    burst(W * 0.02, H * 0.9, { count: 70, dir: -Math.PI / 2 + 0.6, spread: 0.9, speed: 900, gravity: 520, confetti: true, life: [2, 3.2] });
    burst(W * 0.98, H * 0.9, { count: 70, dir: -Math.PI / 2 - 0.6, spread: 0.9, speed: 900, gravity: 520, confetti: true, life: [2, 3.2] });
    burst(W / 2, H * 0.12, { count: 50, dir: Math.PI / 2, spread: Math.PI * 0.9, speed: 240, gravity: 500, confetti: true, life: [2.4, 3.6] });
  });

  btnReset.addEventListener('click', () => {
    sfx('sparkle');
    const kids = [...decosEl.children];
    kids.forEach((el, i) => setTimeout(() => poof(el, true), i * 25));
    setTimeout(buildScene, kids.length * 25 + 420);
  });

  // ---------- Name tag, greeting, sky ----------
  const MSG = 'Merry Christmas!';
  const LETTER_COLORS = ['#ffd166', '#ff6b8b', '#7bf1c4', '#ffffff', '#9ed8ff', '#ffb347'];
  greet.innerHTML = [...MSG].map((ch, i) =>
    `<span class="ltr" style="--i:${i};color:${LETTER_COLORS[i % LETTER_COLORS.length]}">${ch === ' ' ? '&nbsp;' : ch}</span>`
  ).join('');

  who.addEventListener('input', () => {
    const name = who.value.trim();
    sub.textContent = name ? `Hugs and holiday cheer for ${name}! 🤗` : 'Sending you lots of holiday hugs! 🤗';
  });

  for (let i = 0; i < 110; i++) {
    const s = document.createElement('i');
    const size = rand(0.6, 2.8);
    s.className = 'star';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 70) + '%';
    s.style.width = s.style.height = size + 'px';
    s.style.animationDelay = (-Math.random() * 4) + 's';
    s.style.animationDuration = rand(2, 5) + 's';
    starsEl.appendChild(s);
  }

  function shootingStar() {
    const s = document.createElement('div');
    s.className = 'shoot';
    s.style.top = (Math.random() * 35) + '%';
    s.style.left = (Math.random() * 50) + '%';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
  if (!reduceMotion) {
    setInterval(() => { if (Math.random() < 0.7) shootingStar(); }, 5000);
  }

  // ---------- Wiring ----------
  TRAY_ORDER.forEach((kind) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.kind = kind;
    b.textContent = KINDS[kind].e;
    b.title = KINDS[kind].name;
    b.setAttribute('aria-label', 'Add ' + KINDS[kind].name);
    tray.appendChild(b);
  });

  tray.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) placeRandom(chip.dataset.kind);
  });

  // Mouse wheel scrolls the tray sideways.
  tray.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      tray.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('dblclick', (e) => {
    const deco = e.target.closest('.deco');
    if (deco) poof(deco);
  });

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
  window.addEventListener('resize', resize);

  setTimeout(() => hint.classList.add('gone'), 12000);

  resize();
  buildScene();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
