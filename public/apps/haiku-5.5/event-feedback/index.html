<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Feedback Dashboard</title>
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --ink: #1c2230;
    --ink-2: #4a5263;
    --muted: #8a92a3;
    --line: #e4e7ee;
    --line-2: #eef0f4;
    --accent: #2f4fbf;
    --accent-ink: #2a44a6;
    --accent-soft: #eef2ff;
    --star: #e8a33d;
    --star-off: #d3d8e2;
    --pos: #15803d;
    --pos-soft: #ecfdf3;
    --neu: #92600a;
    --neu-soft: #fff8eb;
    --neg: #be123c;
    --neg-soft: #fff1f3;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-lg: 0 10px 30px -12px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .05);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 28px 40px; }

  /* ---------- Header ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #3b5bdb, #1e2d6b);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 6px 16px -6px rgba(47, 79, 191, .6);
  }
  .logo svg { width: 22px; height: 22px; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.015em; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--ink-2); font-size: 13px; font-weight: 500; box-shadow: var(--shadow);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 0 3px rgba(21, 128, 61, .15); }

  /* ---------- Stats ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px;
  }
  .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; display: flex; align-items: baseline; gap: 6px; }
  .stat-value small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .stat-foot { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
  .bar {
    display: flex; height: 6px; border-radius: 999px; overflow: hidden;
    background: var(--line-2); margin-top: 12px;
  }
  .bar span { display: block; height: 100%; }
  .bar .b-pos { background: var(--pos); }
  .bar .b-neu { background: #e0a526; }
  .bar .b-neg { background: var(--neg); }
  .stat-stars { color: var(--star); font-size: 15px; letter-spacing: 1px; margin-top: 4px; }
  .stat-stars .off { color: var(--star-off); }

  /* ---------- AI summary ---------- */
  .summary {
    position: relative;
    background: linear-gradient(180deg, #f7f8ff 0%, #ffffff 70%);
    border: 1px solid #dfe5fb; border-left: 4px solid var(--accent);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 22px 18px; margin-bottom: 18px;
    animation: fadeIn .35s ease;
  }
  .sum-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .sum-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--accent-ink); }
  .sum-title svg { width: 18px; height: 18px; }
  .tag {
    font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft);
    border: 1px solid #d6dffb; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em;
  }
  .sum-lead { margin: 2px 0 10px; font-size: 15px; color: var(--ink); font-weight: 500; }
  .sum-points { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .sum-points li { position: relative; padding-left: 18px; color: var(--ink-2); }
  .sum-points li::before {
    content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent); opacity: .7;
  }
  .sum-action {
    margin-top: 14px; padding: 10px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px;
  }
  .sum-action strong { color: var(--ink); }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent;
    background: transparent; color: var(--muted); cursor: pointer;
    display: inline-grid; place-items: center; flex: none; transition: all .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
  .icon-btn:focus-visible, .btn:focus-visible, .more:focus-visible, th button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .icon-btn svg { width: 16px; height: 16px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px;
    border-radius: 10px; border: 1px solid #d6dffb; background: var(--accent-soft);
    color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn:hover { background: #e2e8fc; }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .search {
    position: relative; flex: 1 1 380px; max-width: 560px;
  }
  .search > svg.s-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted); pointer-events: none;
  }
  .search input {
    width: 100%; height: 44px; padding: 0 84px 0 42px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    font: inherit; font-size: 14px; color: var(--ink); box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search input::placeholder { color: #a3aaba; }
  .search input:focus { outline: none; border-color: #9bb0f0; box-shadow: 0 0 0 4px rgba(47, 79, 191, .12); }
  .search .right {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 6px;
  }
  kbd {
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 4px 6px; background: var(--surface-2);
  }
  .clear {
    width: 26px; height: 26px; border-radius: 7px; border: 0; background: var(--line-2);
    color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center;
  }
  .clear:hover { background: #e0e4ec; }
  .clear svg { width: 12px; height: 12px; }
  .tool-right { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 13px; }
  .count { font-weight: 500; }
  .count b { color: var(--ink); }

  /* ---------- Table ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .table-scroll { max-height: 68vh; overflow: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1040px; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--surface-2);
    border-bottom: 1px solid var(--line); padding: 0; text-align: left;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2);
    white-space: nowrap;
  }
  thead th button {
    width: 100%; display: flex; align-items: center; gap: 6px; padding: 12px 16px;
    background: none; border: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
    cursor: pointer; text-align: left; transition: color .15s ease, background .15s ease;
  }
  thead th button:hover { color: var(--ink); background: #eff1f6; }
  thead th[data-dir="asc"] button,
  thead th[data-dir="desc"] button { color: var(--accent-ink); }
  .sort-ic { width: 14px; height: 14px; flex: none; }
  .sort-ic path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  thead th[data-dir="none"] .i-asc,
  thead th[data-dir="none"] .i-desc,
  thead th[data-dir="asc"] .i-none,
  thead th[data-dir="asc"] .i-desc,
  thead th[data-dir="desc"] .i-none,
  thead th[data-dir="desc"] .i-asc { display: none; }
  thead th[data-dir="none"] .i-none { opacity: .45; }
  thead th button:hover .i-none { opacity: .9; }

  td {
    padding: 15px 16px; border-bottom: 1px solid var(--line-2); vertical-align: top;
    font-size: 13.5px;
  }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #fafbfd; }
  tbody tr:last-child td { border-bottom: 0; }
  .c-date { white-space: nowrap; color: var(--ink-2); width: 130px; font-variant-numeric: tabular-nums; }
  .c-event { width: 210px; }
  .c-name { width: 210px; }
  .c-rating { width: 140px; white-space: nowrap; }
  .c-fb { min-width: 380px; }

  .event-chip {
    display: inline-block; padding: 3px 9px; border-radius: 7px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 12.5px; font-weight: 600; line-height: 1.35;
  }
  .person { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; color: #fff; flex: none;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }

  .stars { font-size: 14px; letter-spacing: 1px; line-height: 1; vertical-align: middle; }
  .stars .on { color: var(--star); }
  .stars .off { color: var(--star-off); }
  .num { margin-left: 6px; font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .num small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .rate-chip {
    display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; letter-spacing: .02em;
  }
  .rate-chip.pos { background: var(--pos-soft); color: var(--pos); }
  .rate-chip.neu { background: var(--neu-soft); color: var(--neu); }
  .rate-chip.neg { background: var(--neg-soft); color: var(--neg); }

  .fb { color: var(--ink-2); line-height: 1.62; max-width: 640px; }
  .fb.clamp {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .more {
    margin-top: 6px; padding: 0; background: none; border: 0; cursor: pointer;
    color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 600;
  }
  .more:hover { text-decoration: underline; }
  mark { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 2px; }

  .empty td { padding: 56px 16px; text-align: center; color: var(--muted); }
  .empty .empty-title { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
  .empty .btn { margin-top: 14px; }

  .footer { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  tbody tr { animation: rowIn .25s ease both; }
  @keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .wrap { padding: 18px 14px 28px; }
    .stats { gap: 12px; }
    .stat-value { font-size: 23px; }
    .search { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div>
        <h1>Event Feedback Dashboard</h1>
        <div class="sub">Participant feedback across all events</div>
      </div>
    </div>
    <div class="pill"><span class="dot"></span>Last 90 days &middot; <span id="rangeText"></span></div>
  </header>

  <section class="stats" aria-label="Key metrics" id="stats"></section>

  <section class="summary" id="summary" aria-labelledby="sumTitle">
    <div class="sum-head">
      <div class="sum-title" id="sumTitle">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/><path d="M19 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>
        AI summary
        <span class="tag" id="sumTag">Generated from 30 responses</span>
      </div>
      <button class="icon-btn" id="closeSummary" type="button" aria-label="Close AI summary" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="sum-lead" id="sumLead"></p>
    <ul class="sum-points" id="sumPoints"></ul>
    <div class="sum-action" id="sumAction"></div>
  </section>

  <div class="toolbar">
    <div class="search" role="search">
      <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search by keyword, event, participant or feedback…" aria-label="Search feedback" autocomplete="off" spellcheck="false">
      <div class="right">
        <button class="clear" id="clearSearch" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <kbd id="kbd">/</kbd>
      </div>
    </div>
    <div class="tool-right">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="btn" id="reopenSummary" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/></svg>
        Show AI summary
      </button>
    </div>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table id="feedbackTable">
        <caption style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Event participant feedback submissions</caption>
        <thead>
          <tr id="headRow">
            <th scope="col" data-key="date" data-dir="desc" aria-sort="descending" class="c-date"><button type="button" data-key="date">Date</button></th>
            <th scope="col" data-key="event" data-dir="none" aria-sort="none" class="c-event"><button type="button" data-key="event">Event</button></th>
            <th scope="col" data-key="name" data-dir="none" aria-sort="none" class="c-name"><button type="button" data-key="name">Participant</button></th>
            <th scope="col" data-key="rating" data-dir="none" aria-sort="none" class="c-rating"><button type="button" data-key="rating">Rating</button></th>
            <th scope="col" data-key="feedback" data-dir="none" aria-sort="none" class="c-fb"><button type="button" data-key="feedback">Feedback</button></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <span>Click any column header to sort. Use <kbd>/</kbd> to search.</span>
    <span>Sample data generated for demonstration.</span>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- Sample data generation ---------------- */

  const TODAY = { y: 2026, m: 10, d: 13 }; // 13 Nov 2026 (month index is 0-based)

  const EVENTS = [
    'Q4 Product Launch Summit',
    'DevOps Days Chicago',
    'Customer Success Workshop',
    'Leadership Offsite 2026',
    'Data & AI Forum',
    'Sales Kickoff',
    'UX Research Conference',
    'Partner Enablement Bootcamp'
  ];

  const FIRST_NAMES = ['Maya', 'Daniel', 'Priya', 'Marcus', 'Elena', 'Tomasz', 'Aisha', 'Ben', 'Sofia', 'Kenji',
    'Grace', 'Omar', 'Hannah', 'Lucas', 'Ingrid', 'Diego', 'Nadia', 'Samuel', 'Chloe', 'Ravi', 'Fatima',
    'Connor', 'Yuki', 'Mateo', 'Leah', 'Victor', 'Amara', 'Jonas'];

  const LAST_NAMES = ['Chen', 'Okafor', 'Ramirez', 'Patel', 'Novak', 'Johansson', 'Kim', 'Brooks', 'Moreau',
    'Tanaka', 'Haddad', 'Schmidt', 'Silva', 'Nguyen', 'Walsh', 'Kowalski', "O'Brien", 'Mensah', 'Larsen',
    'Fischer', 'Rossi', 'Park'];

  const RATING_POOL = [5, 5, 5, 4, 4, 4, 4, 4, 3, 3, 3, 2, 2, 1];

  const POS_OPENERS = [
    'Really well organized from start to finish.',
    'The agenda was tight and nearly every session felt relevant to my role.',
    'The speakers were knowledgeable and genuinely approachable.',
    'I walked away with several ideas I can put to use next week.',
    'The venue and day-to-day logistics were excellent.'
  ];
  const POS_DETAILS = [
    'The hands-on lab on incident response was the highlight for me.',
    'Networking breaks were well timed, and the matchmaking app made it easy to find peers.',
    'The keynote on customer retention reframed how our team thinks about onboarding.',
    'Slides and materials were shared quickly afterward, which I really appreciated.',
    'Breakout facilitators kept discussions focused and practical.'
  ];
  const NEUTRAL = [
    'Some sessions ran long and the Q&A got cut short in a few rooms.',
    'The content was solid, but a few topics were too introductory for a team at our level.',
    'Lunch was late on day two, which squeezed the afternoon schedule.',
    'Audio in the larger hall was hard to hear from the back rows.'
  ];
  const NEGATIVE = [
    'The schedule changed twice without notice, and I missed a session I had planned around.',
    'Wi-Fi dropped repeatedly during the workshop, which made the exercises frustrating.',
    'Too much of the day was lecture style, with very little room for questions.',
    'Check-in took almost forty minutes and the signage to the registration desk was unclear.'
  ];
  const SUGGESTIONS = [
    'Please consider publishing recordings for the sessions we could not attend.',
    'More time for hands-on practice would make the next edition even stronger.',
    'I would love a follow-up session focused on advanced use cases.',
    'Clearer session tracks by experience level would help people choose well.',
    'A printed venue map would have saved a lot of wandering between rooms.'
  ];
  const CLOSERS = [
    'Overall I would recommend it to colleagues.',
    'Looking forward to the next one.',
    'Thanks to the whole team for putting this together.',
    'Happy to provide more detail if it helps the planning team.'
  ];

  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const pickN = (arr, n) => shuffle(arr).slice(0, n);

  // Each rating gets a plausible mix of sentiment fragments.
  function composeFeedback(rating) {
    const sentences = [];
    if (rating === 5) {
      sentences.push(pick(POS_OPENERS), ...pickN(POS_DETAILS, 2));
      if (Math.random() < 0.4) sentences.push(pick(SUGGESTIONS));
      sentences.push(pick(CLOSERS));
    } else if (rating === 4) {
      sentences.push(pick(POS_OPENERS), pick(POS_DETAILS));
      sentences.push(Math.random() < 0.5 ? pick(NEUTRAL) : pick(SUGGESTIONS));
      sentences.push(pick(CLOSERS));
    } else if (rating === 3) {
      sentences.push(pick(POS_DETAILS), pick(NEUTRAL), pick(SUGGESTIONS));
    } else if (rating === 2) {
      sentences.push(pick(NEGATIVE), pick(NEUTRAL));
      if (Math.random() < 0.5) sentences.push(pick(SUGGESTIONS));
    } else {
      sentences.push(...pickN(NEGATIVE, 2), pick(SUGGESTIONS));
    }
    return sentences.join(' ');
  }

  const AVATAR_COLORS = ['#3b5bdb', '#4a5878', '#5b6b8c', '#2f4fbf', '#475569', '#1e3a8a', '#64748b'];

  function generateEntries(count) {
    const rows = [];
    for (let i = 0; i < count; i++) {
      const daysAgo = Math.floor(Math.random() * 90);
      const date = new Date(TODAY.y, TODAY.m, TODAY.d - daysAgo, 9 + Math.floor(Math.random() * 8), Math.floor(Math.random() * 60));
      const first = pick(FIRST_NAMES);
      const last = pick(LAST_NAMES);
      const rating = pick(RATING_POOL);
      rows.push({
        id: i + 1,
        date,
        event: pick(EVENTS),
        name: `${first} ${last}`,
        first,
        last,
        rating,
        feedback: composeFeedback(rating),
        color: AVATAR_COLORS[(first.charCodeAt(0) + last.charCodeAt(0)) % AVATAR_COLORS.length]
      });
      rows[i].haystack = [
        fmtDate(rows[i].date), rows[i].event, rows[i].name, rows[i].feedback
      ].join(' ').toLowerCase();
    }
    return rows;
  }

  /* ---------------- Helpers ---------------- */

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDate = d => `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const mean = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0;
  const pct = (part, whole) => whole ? Math.round((part / whole) * 100) : 0;
  const $ = sel => document.querySelector(sel);

  // Wrap case-insensitive keyword matches in <mark>, escaping everything else.
  function highlight(text, terms) {
    const s = String(text);
    if (!terms.length) return esc(s);
    const re = new RegExp('(' + terms.map(reEsc).join('|') + ')', 'gi');
    return s.split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join('');
  }

  const starsHTML = r => {
    const stars = [1, 2, 3, 4, 5].map(i => `<span class="${i <= r ? 'on' : 'off'}">★</span>`).join('');
    return `<span class="stars" role="img" aria-label="${r} out of 5 stars">${stars}</span>` +
      `<span class="num">${r}<small>/5</small></span>`;
  };

  const ratingClass = r => (r >= 4 ? 'pos' : r === 3 ? 'neu' : 'neg');
  const ratingLabel = r => (r >= 4 ? 'Positive' : r === 3 ? 'Neutral' : 'Needs attention');

  /* ---------------- State ---------------- */

  const DATA = generateEntries(30);
  const state = {
    query: '',
    sort: { key: 'date', dir: 'desc' },
    expanded: new Set(),
    summaryOpen: true
  };

  const comparators = {
    date: (a, b) => a.date - b.date,
    event: (a, b) => a.event.localeCompare(b.event),
    name: (a, b) => a.last.localeCompare(b.last) || a.first.localeCompare(b.first),
    rating: (a, b) => a.rating - b.rating,
    feedback: (a, b) => a.feedback.localeCompare(b.feedback)
  };

  function getTerms() {
    return state.query.trim().toLowerCase().split(/\s+/).filter(Boolean)
      .sort((a, b) => b.length - a.length);
  }

  function visibleRows() {
    const terms = getTerms();
    const rows = terms.length
      ? DATA.filter(r => terms.every(t => r.haystack.includes(t.toLowerCase())))
      : DATA.slice();
    const dir = state.sort.dir === 'asc' ? 1 : -1;
    const cmp = comparators[state.sort.key];
    rows.sort((a, b) => (cmp(a, b) * dir) || (a.id - b.id));
    return rows;
  }

  /* ---------------- Rendering ---------------- */

  function renderHeader() {
    const dates = DATA.map(r => r.date.getTime());
    const min = new Date(Math.min(...dates));
    const max = new Date(Math.max(...dates));
    $('#rangeText').textContent = `${fmtDate(min)} – ${fmtDate(max)}`;
  }

  function renderStats() {
    const n = DATA.length;
    const ratings = DATA.map(r => r.rating);
    const avg = mean(ratings);
    const pos = ratings.filter(r => r >= 4).length;
    const neu = ratings.filter(r => r === 3).length;
    const neg = ratings.filter(r => r <= 2).length;
    const events = new Set(DATA.map(r => r.event)).size;
    const filled = Math.round(avg);

    $('#stats').innerHTML = `
      <div class="stat">
        <div class="stat-label">Total responses</div>
        <div class="stat-value">${n}</div>
        <div class="stat-foot">Across ${events} events</div>
      </div>
      <div class="stat">
        <div class="stat-label">Average rating</div>
        <div class="stat-value">${avg.toFixed(2)} <small>/ 5</small></div>
        <div class="stat-stars" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<span class="${i <= filled ? '' : 'off'}">★</span>`).join('')}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Positive (4–5★)</div>
        <div class="stat-value">${pct(pos, n)}<small>%</small></div>
        <div class="stat-foot">${pos} of ${n} responses</div>
        <div class="bar" aria-hidden="true"><span class="b-pos" style="width:${pct(pos, n)}%"></span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Needs attention (1–2★)</div>
        <div class="stat-value">${pct(neg, n)}<small>%</small></div>
        <div class="stat-foot">${neg} of ${n} responses</div>
        <div class="bar" aria-hidden="true">
          <span class="b-pos" style="width:${pct(pos, n)}%"></span>
          <span class="b-neu" style="width:${pct(neu, n)}%"></span>
          <span class="b-neg" style="width:${pct(neg, n)}%"></span>
        </div>
      </div>`;
  }

  // Rule-based summary computed from the dataset (no external model call).
  const THEMES = [
    { label: 'Schedule & pacing', re: /schedule|ran long|cut short|late|timing|agenda/i,
      fix: 'tighten the agenda and hold session start times' },
    { label: 'Hands-on learning', re: /hands-on|lab|practice|exercise|facilitator/i,
      fix: 'add more practice time to workshops' },
    { label: 'Networking', re: /networking|peers|matchmaking/i,
      fix: 'keep networking blocks and the matchmaking tool' },
    { label: 'Venue & logistics', re: /venue|check-in|signage|audio|wi-fi|lunch|map|registration/i,
      fix: 'review check-in, Wi-Fi, audio and signage before the next event' },
    { label: 'Content & speakers', re: /speaker|keynote|content|topic|q&a|sessions?\b/i,
      fix: 'publish session recordings and offer advanced tracks' }
  ];

  function renderSummary() {
    const rows = DATA;
    const n = rows.length;
    const ratings = rows.map(r => r.rating);
    const avg = mean(ratings);
    const pos = ratings.filter(r => r >= 4).length;
    const neg = ratings.filter(r => r <= 2).length;

    const verdict = avg >= 4 ? 'Feedback is strongly positive'
      : avg >= 3.5 ? 'Feedback is mostly positive'
      : avg >= 3 ? 'Feedback is mixed'
      : 'Feedback is largely negative';

    const themes = THEMES.map(t => {
      const hits = rows.filter(r => t.re.test(r.feedback));
      return { ...t, hits: hits.length, avg: mean(hits.map(r => r.rating)), neg: hits.filter(r => r.rating <= 2).length };
    });
    const topTheme = themes.slice().sort((a, b) => b.hits - a.hits)[0];
    const negTheme = themes.slice().sort((a, b) => b.neg - a.neg)[0];

    const byEvent = {};
    rows.forEach(r => {
      (byEvent[r.event] = byEvent[r.event] || []).push(r.rating);
    });
    const eventAvgs = Object.entries(byEvent).map(([name, rs]) => ({ name, avg: mean(rs) }))
      .sort((a, b) => b.avg - a.avg);
    const best = eventAvgs[0];
    const worst = eventAvgs[eventAvgs.length - 1];

    $('#sumTag').textContent = `Generated from ${n} responses`;
    $('#sumLead').textContent = `${verdict}: ${pos} of ${n} participants rated the event 4 stars or higher.`;

    const points = [
      `Average rating is <strong>${avg.toFixed(2)} / 5</strong>, with ${pct(pos, n)}% of responses positive and ${pct(neg, n)}% needing attention.`,
      `<strong>${esc(topTheme.label)}</strong> comes up most often (${topTheme.hits} responses), averaging ${topTheme.avg.toFixed(1)}★.`
    ];
    if (best && worst && best.name !== worst.name) {
      points.push(`<strong>${esc(best.name)}</strong> is the best-rated event (${best.avg.toFixed(1)}★); <strong>${esc(worst.name)}</strong> has the lowest average (${worst.avg.toFixed(1)}★).`);
    }
    if (negTheme.neg > 0) {
      points.push(`Most low ratings point to <strong>${esc(negTheme.label.toLowerCase())}</strong> (${negTheme.neg} of ${neg} mention it).`);
    } else {
      points.push('No low ratings point to a recurring problem.');
    }

    $('#sumPoints').innerHTML = points.map(p => `<li>${p}</li>`).join('');
    $('#sumAction').innerHTML = negTheme.neg > 0
      ? `<strong>Suggested next step:</strong> ${esc(negTheme.fix.charAt(0).toUpperCase() + negTheme.fix.slice(1))}.`
      : `<strong>Suggested next step:</strong> Keep the current format and share what is working with other event teams.`;
  }

  function rowHTML(r, terms) {
    const isExpanded = state.expanded.has(r.id);
    const isLong = r.feedback.length > 170;
    const cls = ratingClass(r.rating);
    const initials = esc(r.first[0] + r.last[0]);
    return `
      <tr>
        <td class="c-date"><time datetime="${isoDate(r.date)}">${highlight(fmtDate(r.date), terms)}</time></td>
        <td class="c-event"><span class="event-chip">${highlight(r.event, terms)}</span></td>
        <td class="c-name">
          <div class="person">
            <span class="avatar" style="background:${r.color}" aria-hidden="true">${initials}</span>
            <span>${highlight(r.name, terms)}</span>
          </div>
        </td>
        <td class="c-rating">
          ${starsHTML(r.rating)}<br>
          <span class="rate-chip ${cls}">${ratingLabel(r.rating)}</span>
        </td>
        <td class="c-fb">
          <div class="fb${isLong && !isExpanded ? ' clamp' : ''}">${highlight(r.feedback, terms)}</div>
          ${isLong ? `<button class="more" type="button" data-id="${r.id}" aria-expanded="${isExpanded}">${isExpanded ? 'Show less' : 'Read more'}</button>` : ''}
        </td>
      </tr>`;
  }

  function emptyHTML() {
    return `
      <tr class="empty">
        <td colspan="5">
          <div class="empty-title">No feedback matches “${esc(state.query.trim())}”</div>
          <div>Try a different keyword, or check the spelling.</div>
          <button class="btn" type="button" id="emptyClear">Clear search</button>
        </td>
      </tr>`;
  }

  function renderTable() {
    const rows = visibleRows();
    const terms = getTerms();
    $('#tbody').innerHTML = rows.length ? rows.map(r => rowHTML(r, terms)).join('') : emptyHTML();

    const total = DATA.length;
    $('#count').innerHTML = rows.length === total
      ? `Showing all <b>${total}</b> responses`
      : `Showing <b>${rows.length}</b> of ${total} responses`;

    $('#clearSearch').hidden = !state.query;

    document.querySelectorAll('#headRow th').forEach(th => {
      const key = th.dataset.key;
      const active = key === state.sort.key;
      th.dataset.dir = active ? state.sort.dir : 'none';
      th.setAttribute('aria-sort', active ? (state.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
    });
  }

  function renderSummaryVisibility() {
    $('#summary').hidden = !state.summaryOpen;
    $('#reopenSummary').hidden = state.summaryOpen;
  }

  /* ---------------- Events ---------------- */

  const SORT_ICONS = `
    <svg class="sort-ic i-none" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>
    <svg class="sort-ic i-asc" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
    <svg class="sort-ic i-desc" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>`;

  function bindEvents() {
    const search = $('#search');

    // Inject sort icons into every header button.
    document.querySelectorAll('#headRow th button').forEach(btn => {
      btn.insertAdjacentHTML('beforeend', SORT_ICONS);
    });

    $('#headRow').addEventListener('click', e => {
      const btn = e.target.closest('button[data-key]');
      if (!btn) return;
      const key = btn.dataset.key;
      if (state.sort.key === key) {
        state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort = { key, dir: key === 'date' || key === 'rating' ? 'desc' : 'asc' };
      }
      renderTable();
    });

    $('#tbody').addEventListener('click', e => {
      const more = e.target.closest('.more');
      if (more) {
        const id = Number(more.dataset.id);
        if (state.expanded.has(id)) state.expanded.delete(id);
        else state.expanded.add(id);
        renderTable();
        return;
      }
      if (e.target.closest('#emptyClear')) clearSearch();
    });

    search.addEventListener('input', () => {
      state.query = search.value;
      renderTable();
    });

    search.addEventListener('keydown', e => {
      if (e.key === 'Escape' && search.value) {
        e.preventDefault();
        clearSearch();
      }
    });

    $('#clearSearch').addEventListener('click', () => {
      clearSearch();
      search.focus();
    });

    document.addEventListener('keydown', e => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        search.focus();
        search.select();
      }
    });

    $('#closeSummary').addEventListener('click', () => {
      state.summaryOpen = false;
      renderSummaryVisibility();
      $('#reopenSummary').focus();
    });

    $('#reopenSummary').addEventListener('click', () => {
      state.summaryOpen = true;
      renderSummaryVisibility();
      $('#closeSummary').focus();
    });
  }

  function clearSearch() {
    state.query = '';
    $('#search').value = '';
    renderTable();
  }

  /* ---------------- Init ---------------- */

  function init() {
    renderHeader();
    renderStats();
    renderSummary();
    renderSummaryVisibility();
    bindEvents();
    renderTable();
  }

  init();
})();
</script>
</body>
</html>
