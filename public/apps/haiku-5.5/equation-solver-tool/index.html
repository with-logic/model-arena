<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation Solver Tool</title>
<meta name="description" content="Solve polynomial equations in one unknown and see every step explained. Export results as Markdown or JSON.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #faf8f3;
    --card: #ffffff;
    --ink: #1d1c1a;
    --muted: #6b675f;
    --rule: #d9d4c7;
    --accent: #1f3a5f;
    --accent-ink: #ffffff;
    --accent-soft: #e9eef5;
    --err: #8c2f2f;
    --serif-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --serif-text: "Source Serif 4", Charter, Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17171a;
      --card: #1e1e23;
      --ink: #ebe7de;
      --muted: #9d988c;
      --rule: #3a3932;
      --accent: #a9c1e2;
      --accent-ink: #17171a;
      --accent-soft: #252b35;
      --err: #f0a3a3;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-text);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 56px 24px 96px; }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .eyebrow.spaced { margin-top: 36px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 36px;
  }
  h1 {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0;
  }
  .lede { margin: 8px 0 0; font-style: italic; color: var(--muted); }

  .input-row { display: flex; gap: 10px; }
  #eq {
    flex: 1;
    min-width: 0;
    font: 500 18px/1.4 var(--mono);
    padding: 13px 16px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--card);
    color: var(--ink);
  }
  #eq::placeholder { color: var(--muted); opacity: 0.7; }
  #eq:focus, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn {
    font: 600 15px var(--serif-text);
    min-height: 44px;
    padding: 0 22px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, filter 0.15s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .btn-sm { min-height: 36px; font-size: 14px; padding: 0 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font: 13px var(--mono);
    color: var(--muted);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .hint { font-size: 14px; color: var(--muted); margin: 14px 0 0; }

  .error {
    margin-top: 28px;
    padding: 10px 14px;
    border-left: 3px solid var(--err);
    background: var(--card);
    color: var(--err);
  }

  .result { margin-top: 44px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 14px; }
  .summary {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 24px 28px;
  }
  .meta {
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.04em;
    font-variant: small-caps;
  }
  .solutions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .solutions li { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .approx { color: var(--muted); font-size: 15px; }
  .check {
    margin: 18px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-size: 14px;
    color: var(--muted);
  }

  .steps { list-style: none; counter-reset: step; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
  .steps li {
    position: relative;
    padding: 22px 0 22px 52px;
    border-top: 1px solid var(--rule);
  }
  .steps li::before {
    counter-increment: step;
    content: counter(step);
    position: absolute;
    left: 0;
    top: 22px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--paper);
    display: grid;
    place-items: center;
    font: 500 14px var(--serif-display);
    color: var(--accent);
  }
  .step-title { font-weight: 600; font-size: 15px; margin: 0 0 8px; letter-spacing: 0.01em; }
  .math { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .math:not(.katex-ready) { font: 14px/1.6 var(--mono); white-space: pre-wrap; }
  .katex-display { margin: 0.5em 0; }
  .note { margin: 8px 0 0; font-size: 15px; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    opacity: 0;
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 14px;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .wrap { padding: 36px 18px 72px; }
    h1 { font-size: 30px; }
    .input-row { flex-direction: column; }
    .summary { padding: 20px; }
    .toolbar { justify-content: flex-start; }
  }
  @media print {
    body { background: #fff; color: #000; font-size: 12pt; }
    .wrap { padding: 0; max-width: none; }
    .no-print { display: none !important; }
    .summary { border: none; padding: 0; }
    .steps li { break-inside: avoid; }
    .math:not(.katex-ready) { white-space: pre-wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Symbolic algebra</p>
      <h1>Equation Solver</h1>
      <p class="lede">Enter an equation in one unknown. Every transformation is shown and justified.</p>
    </div>
  </header>

  <form id="solve-form" class="no-print" novalidate>
    <label for="eq" class="eyebrow">Equation</label>
    <div class="input-row">
      <input id="eq" name="eq" type="text" placeholder="e.g. x^2 - 5x + 6 = 0" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="hint">
      <button class="btn btn-primary" type="submit">Solve</button>
    </div>
    <div class="chips" id="examples" aria-label="Example equations"></div>
    <p class="hint" id="hint">Supports + − × ÷, powers (^), parentheses, implicit products such as 2x, and decimals. One unknown.</p>
  </form>

  <div id="error" class="error" role="alert" hidden></div>

  <section id="result" class="result" aria-live="polite" hidden>
    <div class="toolbar no-print">
      <button class="btn btn-sm" type="button" id="copy-md">Copy Markdown</button>
      <button class="btn btn-sm" type="button" id="dl-md">Download .md</button>
      <button class="btn btn-sm" type="button" id="dl-json">Download .json</button>
      <button class="btn btn-sm" type="button" id="print">Print / PDF</button>
    </div>
    <div class="summary">
      <p class="meta" id="meta"></p>
      <div class="math" id="standard"></div>
      <p class="eyebrow spaced">Solution</p>
      <ul class="solutions" id="solutions"></ul>
      <p class="check" id="check"></p>
    </div>
    <p class="eyebrow spaced">Derivation</p>
    <ol class="steps" id="steps"></ol>
  </section>

  <section id="recent-wrap" class="no-print" hidden>
    <p class="eyebrow spaced">Recent</p>
    <div class="chips" id="recent"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ==========================================================================
 * Exact rational arithmetic
 * ========================================================================== */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const lcm = (a, b) => (a / gcd(a, b)) * b;

class Frac {
  constructor(n, d = 1) {
    if (d === 0) throw new RangeError('Division by zero is undefined.');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g;
    this.d = d / g;
    if (!Number.isSafeInteger(this.n) || !Number.isSafeInteger(this.d)) {
      throw new RangeError('Numbers are too large for exact arithmetic.');
    }
  }
  static of(x) { return x instanceof Frac ? x : new Frac(x, 1); }
  add(o) { o = Frac.of(o); return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = Frac.of(o); return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = Frac.of(o); return new Frac(this.n * o.n, this.d * o.d); }
  div(o) { o = Frac.of(o); if (o.n === 0) throw new RangeError('Division by zero is undefined.'); return new Frac(this.n * o.d, this.d * o.n); }
  neg() { return new Frac(-this.n, this.d); }
  get abs() { return this.n < 0 ? this.neg() : this; }
  get isZero() { return this.n === 0; }
  get sign() { return Math.sign(this.n); }
  eq(o) { o = Frac.of(o); return this.n === o.n && this.d === o.d; }
  num() { return this.n / this.d; }
}
const ZERO = new Frac(0);

/* ==========================================================================
 * Polynomials: arrays of Frac, ascending powers (index i = coefficient of x^i)
 * ========================================================================== */
const P = {
  norm(p) {
    const q = p.slice();
    while (q.length > 1 && q[q.length - 1].isZero) q.pop();
    return q.length ? q : [new Frac(0)];
  },
  add(a, b) {
    const n = Math.max(a.length, b.length);
    const r = [];
    for (let i = 0; i < n; i++) r.push((a[i] || ZERO).add(b[i] || ZERO));
    return P.norm(r);
  },
  neg(a) { return a.map((c) => c.neg()); },
  sub(a, b) { return P.add(a, P.neg(b)); },
  mul(a, b) {
    const r = Array.from({ length: a.length + b.length - 1 }, () => new Frac(0));
    a.forEach((x, i) => b.forEach((y, j) => { r[i + j] = r[i + j].add(x.mul(y)); }));
    return P.norm(r);
  },
  eval(a, x) {
    let r = ZERO;
    for (let i = a.length - 1; i >= 0; i--) r = r.mul(x).add(a[i]);
    return r;
  },
};

/* ==========================================================================
 * Tokenizer and recursive-descent parser
 * ========================================================================== */
const MAX_EXP = 12;
const OPERATOR_MAP = {
  '+': '+', '-': '-', '−': '-', '*': '*', '·': '*', '×': '*',
  '/': '/', '÷': '/', '^': '^', '(': '(', ')': ')',
};

function parseDecimal(text) {
  const [whole, frac = ''] = text.split('.');
  const digits = (whole || '0') + frac;
  const value = Number(digits);
  if (!Number.isSafeInteger(value)) throw new RangeError('Numbers are too large for exact arithmetic.');
  return new Frac(value, 10 ** frac.length);
}

function tokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j++;
      const text = src.slice(i, j);
      if ((text.match(/\./g) || []).length > 1 || text === '.') {
        throw new SyntaxError(`Malformed number "${text}" at position ${i + 1}.`);
      }
      toks.push({ t: 'num', v: text, at: i });
      i = j;
      continue;
    }
    if (/[a-zA-Z]/.test(ch)) { toks.push({ t: 'var', v: ch, at: i }); i++; continue; }
    if (OPERATOR_MAP[ch]) { toks.push({ t: OPERATOR_MAP[ch], at: i }); i++; continue; }
    throw new SyntaxError(`Unexpected character "${ch}" at position ${i + 1}.`);
  }
  return toks;
}

class Parser {
  constructor(toks, ctx) { this.toks = toks; this.i = 0; this.ctx = ctx; }
  peek() { return this.toks[this.i]; }
  next() { return this.toks[this.i++]; }
  is(t) { return this.peek()?.t === t; }

  parseExpr() {
    let left = this.parseTerm();
    while (this.is('+') || this.is('-')) {
      const op = this.next().t;
      const right = this.parseTerm();
      left = op === '+' ? P.add(left, right) : P.sub(left, right);
    }
    return left;
  }

  parseTerm() {
    let left = this.parseUnary();
    for (;;) {
      const t = this.peek()?.t;
      if (t === '*') { this.next(); left = P.mul(left, this.parseUnary()); }
      else if (t === '/') { this.next(); left = this.divide(left, this.parseUnary()); }
      else if (t === 'num' || t === 'var' || t === '(') { left = P.mul(left, this.parseUnary()); }
      else break;
    }
    return left;
  }

  divide(a, b) {
    if (b.length > 1) throw new SyntaxError('Division by a non-constant expression is not supported.');
    if (b[0].isZero) throw new RangeError('Division by zero is undefined.');
    return P.norm(a.map((c) => c.div(b[0])));
  }

  parseUnary() {
    if (this.is('-')) { this.next(); return P.neg(this.parseUnary()); }
    if (this.is('+')) { this.next(); return this.parseUnary(); }
    return this.parsePower();
  }

  parsePower() {
    const base = this.parsePrimary();
    if (!this.is('^')) return base;
    this.next();
    const e = this.parseUnary();
    if (e.length > 1) throw new SyntaxError('Exponents must be numbers; variable exponents are not supported.');
    const n = e[0];
    if (n.d !== 1) throw new SyntaxError('Exponents must be whole numbers.');
    if (n.n < 0) throw new SyntaxError('Negative exponents are not supported.');
    if (n.n > MAX_EXP) throw new SyntaxError(`Exponents above ${MAX_EXP} are not supported.`);
    let r = P.norm([new Frac(1)]);
    for (let k = 0; k < n.n; k++) r = P.mul(r, base);
    return r;
  }

  parsePrimary() {
    const tk = this.peek();
    if (!tk) throw new SyntaxError('The expression ends unexpectedly.');
    if (tk.t === 'num') { this.next(); return P.norm([parseDecimal(tk.v)]); }
    if (tk.t === 'var') {
      this.next();
      this.useVar(tk.v, tk.at);
      return [new Frac(0), new Frac(1)];
    }
    if (tk.t === '(') {
      this.next();
      const inner = this.parseExpr();
      if (!this.is(')')) throw new SyntaxError('Missing closing parenthesis.');
      this.next();
      return inner;
    }
    throw new SyntaxError(`Unexpected "${tk.v ?? tk.t}" at position ${tk.at + 1}.`);
  }

  useVar(name, at) {
    if (this.ctx.name === null) this.ctx.name = name;
    else if (this.ctx.name !== name) {
      throw new SyntaxError(`Only one unknown is supported, but found "${this.ctx.name}" and "${name}" (position ${at + 1}). Functions such as sin or log are not available.`);
    }
  }
}

function parseSide(src, ctx) {
  const toks = tokenize(src);
  if (!toks.length) throw new SyntaxError('One side of the equation is empty.');
  const parser = new Parser(toks, ctx);
  const poly = parser.parseExpr();
  if (parser.i < toks.length) {
    const tk = toks[parser.i];
    throw new SyntaxError(`Unexpected "${tk.v ?? tk.t}" at position ${tk.at + 1}.`);
  }
  return P.norm(poly);
}

function parseEquation(raw) {
  const src = raw.trim();
  if (!src) throw new SyntaxError('Enter an equation to solve.');
  const parts = src.split('=');
  if (parts.length > 2) throw new SyntaxError('Use a single "=" sign.');
  const ctx = { name: null };
  const lhsSrc = parts[0].trim();
  const rhsSrc = parts.length === 2 ? parts[1].trim() : null;
  const lhs = parseSide(lhsSrc, ctx);
  const rhs = rhsSrc === null ? P.norm([new Frac(0)]) : parseSide(rhsSrc, ctx);
  return { lhsSrc, rhsSrc, lhs, rhs, variable: ctx.name ?? 'x', hasUnknown: ctx.name !== null };
}

/* ==========================================================================
 * TeX and text formatting
 * ========================================================================== */
const TEX_ESCAPES = {
  '\\': '\\textbackslash{}', '{': '\\{', '}': '\\}', '$': '\\$', '&': '\\&',
  '#': '\\#', '%': '\\%', '_': '\\_', '^': '\\textasciicircum{}', '~': '\\textasciitilde{}',
};
const escTeX = (s) => s.replace(/[\\{}$&#%_^~]/g, (c) => TEX_ESCAPES[c]);

// Positive fraction as TeX (no sign).
const fracAbsTeX = (f) => (f.d === 1 ? `${f.n}` : `\\frac{${f.n}}{${f.d}}`);
// Signed value, no parentheses (for use after "=" or "+").
const sTeX = (f) => (f.sign < 0 ? '-' : '') + fracAbsTeX(f.abs);
// Signed value wrapped in parentheses when negative (for use after "^" or in products).
const pTeX = (f) => (f.sign < 0 ? `(${sTeX(f)})` : sTeX(f));
const fmtFrac = (f) => (f.d === 1 ? `${f.n}` : `${f.n}/${f.d}`);

function fmtNum(x) {
  if (!Number.isFinite(x)) return String(x);
  const a = Math.abs(x);
  if (a !== 0 && (a < 1e-4 || a >= 1e7)) return x.toExponential(4);
  const s = parseFloat(x.toFixed(6)).toString();
  return s === '-0' ? '0' : s;
}
const complexStr = (re, im) => {
  const mag = Math.abs(im) === 1 ? '' : fmtNum(Math.abs(im));
  if (Math.abs(re) < 1e-12) return `${im < 0 ? '−' : ''}${mag}i`;
  return `${fmtNum(re)} ${im < 0 ? '−' : '+'} ${mag}i`;
};
const complexTeX = (re, im) => (Math.abs(im) < 1e-9
  ? fmtNum(re)
  : `${fmtNum(re)} ${im < 0 ? '-' : '+'} ${fmtNum(Math.abs(im))}i`);

function polyTeX(p, V) {
  let out = '';
  for (let i = p.length - 1; i >= 0; i--) {
    const c = p[i];
    if (c.isZero) continue;
    const neg = c.sign < 0;
    const mag = c.abs;
    const coef = mag.eq(1) && i > 0 ? '' : fracAbsTeX(mag);
    const vpart = i === 0 ? '' : i === 1 ? V : `${V}^{${i}}`;
    const term = coef + vpart;
    if (out === '') out = (neg ? '-' : '') + term;
    else out += (neg ? ' - ' : ' + ') + term;
  }
  return out || '0';
}

const coefTeX = (a) => (a.eq(1) ? '' : a.eq(-1) ? '-' : sTeX(a));

/* ==========================================================================
 * Solver helpers
 * ========================================================================== */
function integerize(p) {
  const L = p.reduce((acc, c) => lcm(acc, c.d), 1);
  return { poly: P.norm(p.map((c) => c.mul(L))), factor: L };
}

function squareFree(N) {
  // Returns [k, m] with N = k^2 * m and m square-free.
  let k = 1;
  let m = N;
  for (let p = 2; p * p <= m; p++) {
    while (m % (p * p) === 0) { m /= p * p; k *= p; }
  }
  return [k, m];
}

function divisors(n) {
  n = Math.abs(n);
  const small = [];
  const large = [];
  for (let i = 1; i * i <= n; i++) {
    if (n % i === 0) {
      small.push(i);
      if (i * i !== n) large.push(n / i);
    }
  }
  return small.concat(large.reverse());
}

function rationalCandidates(p) {
  const L = p.reduce((acc, c) => lcm(acc, c.d), 1);
  const ints = p.map((c) => c.mul(L).n);
  const a0 = Math.abs(ints[0]);
  const an = Math.abs(ints[ints.length - 1]);
  const seen = new Set();
  const list = [];
  for (const q of divisors(an)) {
    for (const num of divisors(a0)) {
      const f = new Frac(num, q);
      const key = `${f.n}/${f.d}`;
      if (seen.has(key)) continue;
      seen.add(key);
      list.push(f, f.neg());
    }
  }
  list.sort((x, y) => (Math.abs(x.num()) - Math.abs(y.num())) || (y.sign - x.sign));
  return { list, a0, an };
}

function synthDiv(p, r) {
  // Divide ascending polynomial p by (x - r). Returns quotient (ascending) and remainder.
  const desc = p.slice().reverse();
  const out = [desc[0]];
  for (let i = 1; i < desc.length; i++) out.push(desc[i].add(r.mul(out[i - 1])));
  const rem = out.pop();
  return { q: P.norm(out.reverse()), rem };
}

function durandKerner(c) {
  // Numerical roots (complex) of a real polynomial, ascending float coefficients.
  const n = c.length - 1;
  const a = c.map((v) => v / c[n]);
  const cadd = (x, y) => ({ re: x.re + y.re, im: x.im + y.im });
  const csub = (x, y) => ({ re: x.re - y.re, im: x.im - y.im });
  const cmul = (x, y) => ({ re: x.re * y.re - x.im * y.im, im: x.re * y.im + x.im * y.re });
  const cdiv = (x, y) => {
    const d = y.re * y.re + y.im * y.im;
    return { re: (x.re * y.re + x.im * y.im) / d, im: (x.im * y.re - x.re * y.im) / d };
  };
  const seed = { re: 0.4, im: 0.9 };
  const z = [];
  let pw = { re: 1, im: 0 };
  for (let k = 0; k < n; k++) { z.push(pw); pw = cmul(pw, seed); }
  for (let iter = 0; iter < 2000; iter++) {
    let maxStep = 0;
    for (let i = 0; i < n; i++) {
      let val = { re: 0, im: 0 };
      for (let j = n; j >= 0; j--) val = cadd(cmul(val, z[i]), { re: a[j], im: 0 });
      let den = { re: 1, im: 0 };
      for (let j = 0; j < n; j++) if (j !== i) den = cmul(den, csub(z[i], z[j]));
      let step = cdiv(val, den);
      if (!Number.isFinite(step.re) || !Number.isFinite(step.im)) step = { re: 0, im: 0 };
      z[i] = csub(z[i], step);
      maxStep = Math.max(maxStep, Math.hypot(step.re, step.im));
    }
    if (maxStep < 1e-13) break;
  }
  return z;
}

function hornerC(c, z) {
  let v = { re: 0, im: 0 };
  for (let j = c.length - 1; j >= 0; j--) {
    v = { re: v.re * z.re - v.im * z.im + c[j], im: v.re * z.im + v.im * z.re };
  }
  return v;
}

/* ==========================================================================
 * Root objects: { tex, approx, re, im, rational }
 * ========================================================================== */
function makeRational(V, value) {
  const re = value.num();
  return {
    tex: `${V} = ${sTeX(value)}`,
    re,
    im: 0,
    rational: true,
    approx: value.d === 1 ? '' : `≈ ${fmtNum(re)}`,
  };
}

function makeQuadRoot(V, p, qs, m, imag) {
  // Root = p + qs * sqrt(m), with an extra factor i when imag is true.
  if (!imag && m === 1) return makeRational(V, p.add(qs));
  const radical = m === 1 ? '' : `\\sqrt{${m}}`;
  const magTeX = qs.abs.eq(1) && (radical || imag) ? '' : fracAbsTeX(qs.abs);
  const body = magTeX + radical + (imag ? 'i' : '');
  const lead = p.isZero
    ? (qs.sign < 0 ? '-' : '') + body
    : sTeX(p) + (qs.sign < 0 ? ' - ' : ' + ') + body;
  const root = Math.sqrt(m);
  const re = imag ? p.num() : p.num() + qs.num() * root;
  const im = imag ? qs.num() * root : 0;
  return {
    tex: `${V} = ${lead}`,
    re,
    im,
    rational: false,
    approx: imag ? `≈ ${complexStr(re, im)}` : `≈ ${fmtNum(re)}`,
  };
}

function makeNumericRoot(V, z) {
  const real = Math.abs(z.im) < 1e-9;
  return {
    tex: `${V} \\approx ${complexTeX(z.re, real ? 0 : z.im)}`,
    re: z.re,
    im: real ? 0 : z.im,
    rational: false,
    approx: '',
  };
}

/* ==========================================================================
 * Solvers. Each appends explanatory steps and returns root objects.
 * ========================================================================== */
function solveLinear(poly, V, steps) {
  const b = poly[0];
  const a = poly[1];
  steps.push({
    title: 'Isolate the unknown term',
    tex: `${coefTeX(a)}${V} = ${sTeX(b.neg())}`,
    note: b.isZero
      ? 'The constant term is already zero.'
      : b.sign > 0
        ? `Subtract ${fmtFrac(b)} from both sides.`
        : `Add ${fmtFrac(b.neg())} to both sides.`,
  });
  const x = b.neg().div(a);
  if (!a.eq(1)) {
    steps.push({
      title: 'Divide both sides by the coefficient',
      tex: `${V} = ${sTeX(x)}`,
      note: `Divide both sides by ${fmtFrac(a)}.`,
    });
  }
  return [makeRational(V, x)];
}

function solveQuadratic(a0, b0, c0, V, steps) {
  const L = [a0, b0, c0].reduce((acc, c) => lcm(acc, c.d), 1);
  const a = a0.mul(L);
  const b = b0.mul(L);
  const c = c0.mul(L);

  steps.push({
    title: 'Identify the coefficients',
    tex: `a = ${sTeX(a)},\\quad b = ${sTeX(b)},\\quad c = ${sTeX(c)}`,
    note: L > 1
      ? `Coefficients were multiplied by ${L} to clear fractions; this does not change the solutions.`
      : 'Read a, b and c from the standard form ax² + bx + c = 0.',
  });

  const D = b.mul(b).sub(a.mul(c).mul(4));
  const d = D.n;
  const dNote = d > 0
    ? `Δ = ${d} > 0, so there are two distinct real solutions.`
    : d === 0
      ? 'Δ = 0, so there is one repeated real solution.'
      : `Δ = ${d} < 0, so there are two complex conjugate solutions.`;
  steps.push({
    title: 'Compute the discriminant',
    tex: `\\Delta = b^2 - 4ac = ${pTeX(b)}^2 - 4\\cdot ${pTeX(a)}\\cdot ${pTeX(c)} = ${sTeX(D)}`,
    note: dNote,
  });

  const twoA = a.mul(2);
  steps.push({
    title: 'Apply the quadratic formula',
    tex: `${V} = \\frac{-b \\pm \\sqrt{\\Delta}}{2a} = \\frac{${sTeX(b.neg())} \\pm \\sqrt{${sTeX(D)}}}{${sTeX(twoA)}}`,
    note: 'Substitute the values of a, b and Δ.',
  });

  const p = b.neg().div(twoA);
  if (d === 0) {
    steps.push({
      title: 'Simplify',
      tex: `${V} = ${sTeX(p)}`,
      note: 'With Δ = 0 the ± term vanishes, leaving a single solution.',
    });
    return [makeRational(V, p)];
  }

  const imag = d < 0;
  const [k, m] = squareFree(Math.abs(d));
  const kStr = k === 1 ? '' : String(k);
  let radicand = m === 1 ? (kStr || '1') : `${kStr}\\sqrt{${m}}`;
  if (imag) radicand = radicand === '1' ? 'i' : `${radicand}i`;
  steps.push({
    title: 'Simplify the square root',
    tex: `\\sqrt{${sTeX(D)}} = ${radicand}`,
    note: imag
      ? 'Write √Δ = i√|Δ|, using i² = −1, then factor out the largest square.'
      : m === 1
        ? 'Δ is a perfect square, so both solutions are rational.'
        : 'Factor the largest perfect square out of Δ.',
  });

  const q = new Frac(k).div(twoA);
  const roots = [1, -1].map((sg) => makeQuadRoot(V, p, q.mul(sg), m, imag));
  steps.push({
    title: roots.every((r) => r.rational) ? 'Simplify the solutions' : 'Write the two solutions',
    tex: roots.map((r) => r.tex).join(',\\quad '),
    note: roots.every((r) => r.rational) ? '' : 'The two solutions differ only in the sign before the square root.',
  });
  return roots;
}

function solvePolynomial(poly, V, steps) {
  let p = poly;
  const roots = [];

  while (p.length - 1 >= 3) {
    if (p[0].isZero) {
      let k = 0;
      while (p[k].isZero) k++;
      p = p.slice(k);
      steps.push({
        title: `Factor out ${V}`,
        tex: `\\begin{aligned}P(${V})&=${k === 1 ? V : `${V}^{${k}}`}\\,Q(${V})\\\\ Q(${V})&=${polyTeX(p, V)}\\end{aligned}`,
        note: `The constant term is zero, so ${V} = 0 is a root${k > 1 ? ` (multiplicity ${k})` : ''}.`,
      });
      roots.push(makeRational(V, ZERO));
      continue;
    }

    const { list, a0, an } = rationalCandidates(p);
    const shown = list.slice(0, 12).map(sTeX).join(',\\;') + (list.length > 12 ? ',\\;\\dots' : '');
    steps.push({
      title: 'List the candidate rational roots',
      tex: `\\left\\{${shown}\\right\\}`,
      note: `Rational Root Theorem: a rational root p/q has p dividing ${a0} (the constant term) and q dividing ${an} (the leading coefficient).`,
    });

    const r = list.find((c) => P.eval(p, c).isZero);
    if (!r) {
      steps.push({
        title: 'No rational roots remain',
        tex: `${polyTeX(p, V)} = 0`,
        note: 'The remaining roots are irrational or complex. They are approximated numerically with the Durand–Kerner method.',
      });
      const approxRoots = durandKerner(p.map((c) => c.num())).map((z) => makeNumericRoot(V, z));
      return { roots: roots.concat(approxRoots), approximate: true };
    }

    steps.push({
      title: `Test ${V} = ${sTeX(r)}`,
      tex: `P\\left(${pTeX(r)}\\right) = 0`,
      note: `Substituting gives zero, so ${V} ${r.sign < 0 ? '+' : '−'} ${fmtFrac(r.abs)} is a factor of P.`,
    });
    const { q } = synthDiv(p, r);
    steps.push({
      title: 'Divide out the factor',
      tex: `\\begin{aligned}P(${V})&=\\left(${V} ${r.sign < 0 ? '+' : '-'} ${fracAbsTeX(r.abs)}\\right)\\,Q(${V})\\\\ Q(${V})&=${polyTeX(q, V)}\\end{aligned}`,
      note: 'Synthetic division gives Q, which has degree one less than P.',
    });
    p = q;
    roots.push(makeRational(V, r));
  }

  if (p.length - 1 === 2) roots.push(...solveQuadratic(p[2], p[1], p[0], V, steps));
  else if (p.length - 1 === 1) roots.push(...solveLinear(p, V, steps));
  return { roots, approximate: false };
}

const KIND = ['Constant', 'Linear', 'Quadratic', 'Cubic', 'Quartic', 'Quintic'];

function solve(input) {
  const eq = parseEquation(input);
  const V = eq.variable;
  const steps = [];
  const lhsTeX = `\\text{${escTeX(eq.lhsSrc)}}`;

  if (eq.rhsSrc === null) {
    steps.push({
      title: 'Set the expression equal to zero',
      tex: `${lhsTeX} = 0`,
      note: 'An expression without an equals sign is solved as “expression = 0”.',
    });
  } else {
    const rhsTeX = `\\text{${escTeX(eq.rhsSrc)}}`;
    steps.push({
      title: 'Read the equation',
      tex: `${lhsTeX} = ${rhsTeX}`,
      note: `Both sides are parsed as polynomials in ${V}.`,
    });
    steps.push({
      title: 'Move every term to one side',
      tex: `${lhsTeX} - \\left(${rhsTeX}\\right) = 0`,
      note: 'Subtracting the right-hand side from both sides gives an equivalent equation equal to zero.',
    });
  }

  const diff = P.sub(eq.lhs, eq.rhs);
  steps.push({
    title: 'Expand and collect like terms',
    tex: `${polyTeX(diff, V)} = 0`,
    note: `Multiply out brackets and combine terms with the same power of ${V}.`,
  });

  const { poly, factor } = integerize(diff);
  if (factor > 1) {
    steps.push({
      title: 'Clear fractions',
      tex: `${polyTeX(poly, V)} = 0`,
      note: `Multiplying both sides by ${factor} removes every fraction without changing the solutions.`,
    });
  }

  const deg = poly.length - 1;
  const standardTeX = `${polyTeX(poly, V)} = 0`;
  const base = {
    input: input.trim(),
    variable: V,
    degree: deg,
    standardTeX,
    steps,
    approximate: false,
  };

  if (deg === 0) {
    const c = poly[0];
    steps.push({
      title: 'Interpret the result',
      tex: c.isZero ? '0 = 0' : `${sTeX(c)} = 0`,
      note: c.isZero
        ? (eq.hasUnknown ? `The sides are identical, so every value of ${V} is a solution.` : 'The statement is always true; it contains no unknown.')
        : 'A nonzero constant can never equal zero, so there is no solution.',
    });
    return {
      ...base,
      kind: c.isZero ? 'Identity' : 'Contradiction',
      status: c.isZero ? 'all' : 'none',
      statement: c.isZero ? 'Every real number' : 'No solution',
      solutions: [],
      verification: '',
    };
  }

  const kind = KIND[deg] ?? `Degree ${deg}`;
  steps.push({
    title: 'Identify the degree',
    tex: `\\deg P = ${deg}`,
    note: `The highest power of ${V} is ${deg}: this is a ${kind.toLowerCase()} equation.`
      + (deg >= 3 ? ' We look for rational roots first, then approximate any that remain.' : ''),
  });

  let roots;
  let approximate = false;
  if (deg === 1) roots = solveLinear(poly, V, steps);
  else if (deg === 2) roots = solveQuadratic(poly[2], poly[1], poly[0], V, steps);
  else ({ roots, approximate } = solvePolynomial(poly, V, steps));

  roots.sort((x, y) => (x.re - y.re) || (x.im - y.im));

  const floats = poly.map((c) => c.num());
  let maxResidual = 0;
  for (const r of roots) {
    const v = hornerC(floats, { re: r.re, im: r.im });
    maxResidual = Math.max(maxResidual, Math.hypot(v.re, v.im));
  }
  const allRational = roots.every((r) => r.rational);
  let verification = allRational
    ? `Substituting each solution back into P(${V}) gives exactly 0.`
    : `Substituting each solution back into P(${V}) leaves a residual of at most ${maxResidual.toExponential(1)}.`;
  if (approximate) verification = `These values are numerical approximations. ${verification}`;

  return {
    ...base,
    kind,
    status: 'ok',
    statement: '',
    solutions: roots,
    approximate,
    verification,
  };
}

/* ==========================================================================
 * Export
 * ========================================================================== */
function toMarkdown(r) {
  const out = [];
  out.push('# Equation Solution', '');
  out.push(`**Equation:** \`${r.input}\``);
  out.push('');
  out.push(`**Type:** ${r.kind} (degree ${r.degree}), unknown \`${r.variable}\``);
  out.push('');
  out.push('## Standard form', '', `$$${r.standardTeX}$$`, '');
  out.push('## Derivation', '');
  r.steps.forEach((s, i) => {
    out.push(`${i + 1}. **${s.title}**`, '', `   $$${s.tex}$$`, '');
    if (s.note) out.push(`   ${s.note}`, '');
  });
  out.push('## Solution', '');
  if (r.status === 'ok') {
    r.solutions.forEach((s) => out.push(`- $$${s.tex}$$${s.approx ? ` ${s.approx}` : ''}`));
  } else {
    out.push(`- ${r.statement}`);
  }
  out.push('', '## Check', '', r.verification || 'Not applicable.', '');
  out.push('---', `*Generated ${new Date().toISOString().slice(0, 10)} by Equation Solver Tool.*`, '');
  return out.join('\n');
}

function toJSON(r) {
  return {
    equation: r.input,
    unknown: r.variable,
    type: r.kind,
    degree: r.degree,
    standardForm: r.standardTeX,
    steps: r.steps.map((s) => ({ title: s.title, latex: s.tex, note: s.note || '' })),
    status: r.status,
    statement: r.statement || null,
    solutions: r.solutions.map((s) => ({
      latex: s.tex,
      real: s.im === 0 ? s.re : null,
      real_part: s.re,
      imaginary_part: s.im,
      exact: s.rational,
    })),
    approximate: r.approximate,
    verification: r.verification,
    generator: 'Equation Solver Tool',
  };
}

/* ==========================================================================
 * UI
 * ========================================================================== */
const $ = (sel) => document.querySelector(sel);
const EXAMPLES = [
  '2x + 6 = 0',
  '3(x - 2) = 2x + 1',
  'x^2 - 5x + 6 = 0',
  '2x^2 + 3x = 2',
  'x^2 + 2x + 5 = 0',
  'x^3 - 6x^2 + 11x - 6 = 0',
  'x^3 = 2',
];
const RECENT_KEY = 'equation-solver:recent';
let lastResult = null;

function renderMath(node, src, display = true) {
  node.textContent = '';
  node.classList.remove('katex-ready');
  if (window.katex) {
    try {
      window.katex.render(src, node, { displayMode: display, throwOnError: false, strict: 'ignore' });
      node.classList.add('katex-ready');
      return;
    } catch (_) { /* fall back to source text */ }
  }
  node.textContent = src;
}

function renderResult(r) {
  $('#meta').textContent = `${r.kind} equation · degree ${r.degree} · unknown ${r.variable}`;
  renderMath($('#standard'), r.standardTeX, true);

  const list = $('#solutions');
  list.textContent = '';
  if (r.status === 'ok') {
    for (const s of r.solutions) {
      const li = document.createElement('li');
      const m = document.createElement('span');
      m.className = 'math';
      renderMath(m, s.tex, false);
      li.append(m);
      if (s.approx) {
        const a = document.createElement('span');
        a.className = 'approx';
        a.textContent = s.approx;
        li.append(a);
      }
      list.append(li);
    }
  } else {
    const li = document.createElement('li');
    li.textContent = r.statement;
    list.append(li);
  }
  $('#check').textContent = r.verification || '';

  const steps = $('#steps');
  steps.textContent = '';
  for (const s of r.steps) {
    const li = document.createElement('li');
    const title = document.createElement('p');
    title.className = 'step-title';
    title.textContent = s.title;
    const math = document.createElement('div');
    math.className = 'math';
    renderMath(math, s.tex, true);
    li.append(title, math);
    if (s.note) {
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = s.note;
      li.append(note);
    }
    steps.append(li);
  }
}

function showError(message) {
  const box = $('#error');
  box.textContent = message;
  box.hidden = false;
  $('#result').hidden = true;
}

function run(input, remember = true) {
  const trimmed = input.trim();
  if (!trimmed) { showError('Enter an equation to solve.'); return; }
  try {
    lastResult = solve(trimmed);
    $('#error').hidden = true;
    renderResult(lastResult);
    $('#result').hidden = false;
    if (remember) saveRecent(trimmed);
    renderRecent();
  } catch (err) {
    lastResult = null;
    const expected = err instanceof SyntaxError || err instanceof RangeError;
    showError(expected ? err.message : 'Something went wrong while solving this equation.');
    if (!expected) console.error(err);
  }
}

function loadRecent() {
  try {
    const parsed = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    return Array.isArray(parsed) ? parsed.filter((s) => typeof s === 'string').slice(0, 6) : [];
  } catch (_) { return []; }
}

function saveRecent(text) {
  const next = [text, ...loadRecent().filter((s) => s !== text)].slice(0, 6);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(next)); } catch (_) { /* storage unavailable */ }
}

function chip(text, onPick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = text;
  b.addEventListener('click', () => onPick(text));
  return b;
}

function renderRecent() {
  const items = loadRecent();
  const wrap = $('#recent-wrap');
  const box = $('#recent');
  box.textContent = '';
  wrap.hidden = items.length === 0;
  items.forEach((s) => box.append(chip(s, (text) => pick(text))));
}

function pick(text) {
  $('#eq').value = text;
  run(text);
}

function toast(message) {
  const t = $('#toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function download(name, type, text) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'equation';
}

function init() {
  const examples = $('#examples');
  EXAMPLES.forEach((ex) => examples.append(chip(ex, pick)));
  renderRecent();

  $('#solve-form').addEventListener('submit', (e) => {
    e.preventDefault();
    run($('#eq').value);
  });

  $('#copy-md').addEventListener('click', async () => {
    if (!lastResult) return;
    const ok = await copyText(toMarkdown(lastResult));
    toast(ok ? 'Markdown copied to clipboard' : 'Copy failed; use Download instead');
  });
  $('#dl-md').addEventListener('click', () => {
    if (!lastResult) return;
    download(`${slug(lastResult.input)}.md`, 'text/markdown;charset=utf-8', toMarkdown(lastResult));
  });
  $('#dl-json').addEventListener('click', () => {
    if (!lastResult) return;
    download(`${slug(lastResult.input)}.json`, 'application/json', JSON.stringify(toJSON(lastResult), null, 2));
  });
  $('#print').addEventListener('click', () => window.print());

  const prefill = new URLSearchParams(location.search).get('eq');
  if (prefill) {
    $('#eq').value = prefill;
    run(prefill);
  } else {
    $('#eq').focus();
  }
}

window.addEventListener('load', init);
</script>
</body>
