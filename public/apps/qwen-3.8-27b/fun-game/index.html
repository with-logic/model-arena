<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fun Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 18%, #3b2a72, #171033 72%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', 'Segoe Print', 'Bradley Hand', cursive;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #stage { position: relative; }
  #game {
    display: block; width: 100%; height: 100%;
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.06);
  }
  .hidden { display: none !important; }
  #hud { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  #score {
    font-size: 42px; font-weight: bold; color: #fff; letter-spacing: 3px;
    text-shadow: 0 3px 0 rgba(0,0,0,.32), 0 0 18px rgba(0,0,0,.22);
  }
  #bestpill {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,.30); color: #FFE9A8;
    border: 3px solid rgba(255,255,255,.35); border-radius: 999px;
    padding: 6px 16px; font-size: 16px; font-weight: bold; letter-spacing: 1px;
    pointer-events: none;
  }
  #muteBtn {
    position: absolute; top: 14px; left: 14px;
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.5); background: rgba(0,0,0,.32); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .1s, background .1s;
  }
  #muteBtn:hover { transform: scale(1.08); background: rgba(0,0,0,.48); }
  #muteBtn svg { width: 24px; height: 24px; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  #menu { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(10,5,30,.28)); }
  .title { font-size: 76px; line-height: 1; margin-bottom: 8px; }
  .title span {
    display: inline-block;
    animation: letterBounce 1.4s ease-in-out infinite;
    text-shadow: 0 5px 0 rgba(0,0,0,.30), 0 0 26px rgba(0,0,0,.18);
  }
  .title .gap { width: 18px; animation: none; }
  .title span:nth-child(1) { color: #FF5D5D; animation-delay: 0s; }
  .title span:nth-child(2) { color: #FF9F1C; animation-delay: .08s; }
  .title span:nth-child(3) { color: #FFD93D; animation-delay: .16s; }
  .title span:nth-child(5) { color: #6BCB77; animation-delay: .24s; }
  .title span:nth-child(6) { color: #4D96FF; animation-delay: .32s; }
  .title span:nth-child(7) { color: #B983FF; animation-delay: .40s; }
  .title span:nth-child(8) { color: #FF7BAC; animation-delay: .48s; }
  @keyframes letterBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-16px) rotate(-4deg); }
    60% { transform: translateY(2px) rotate(2deg); }
  }
  .tag { color: #fff; font-size: 20px; margin-bottom: 26px; text-shadow: 0 2px 0 rgba(0,0,0,.38); }
  .btn {
    font-family: inherit; font-size: 28px; font-weight: bold; color: #fff;
    background: linear-gradient(180deg, #FFD93D, #FF9F1C);
    border: 4px solid #7A4A00; border-radius: 999px;
    padding: 14px 46px; cursor: pointer;
    box-shadow: 0 6px 0 #7A4A00, 0 14px 26px rgba(0,0,0,.32);
    transition: transform .08s, box-shadow .08s;
    text-shadow: 0 2px 0 rgba(0,0,0,.22);
    letter-spacing: 2px;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7A4A00, 0 6px 14px rgba(0,0,0,.3); }
  .controls {
    margin-top: 28px; color: rgba(255,255,255,.95); font-size: 15px;
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    text-shadow: 0 2px 0 rgba(0,0,0,.32);
  }
  .key {
    display: inline-block; background: rgba(255,255,255,.94); color: #3A2E5C;
    border-radius: 8px; padding: 2px 10px; font-weight: bold;
    border-bottom: 3px solid rgba(0,0,0,.28); margin: 0 4px;
  }
  .bestline { margin-top: 20px; color: #FFE9A8; font-size: 18px; font-weight: bold; text-shadow: 0 2px 0 rgba(0,0,0,.38); }
  #over { background: rgba(15,8,35,.45); }
  .card {
    background: #FFFDF4; border: 5px solid #3A2E5C; border-radius: 26px;
    padding: 26px 44px 30px; max-width: 86%;
    box-shadow: 0 12px 0 rgba(30,20,60,.4), 0 30px 60px rgba(0,0,0,.45);
    animation: cardPop .4s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes cardPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .overmsg { font-size: 34px; color: #3A2E5C; margin-bottom: 16px; }
  .scores { display: flex; gap: 38px; justify-content: center; margin-bottom: 10px; }
  .scores div { color: #8a7fb0; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
  .scores b { display: block; font-size: 40px; color: #3A2E5C; letter-spacing: 2px; }
  .badge {
    display: inline-block;
    background: linear-gradient(180deg, #FFE93D, #FFB300); color: #7A4A00;
    font-weight: bold; font-size: 16px; padding: 5px 18px; border-radius: 999px;
    border: 3px solid #B87400; margin: 4px 0 6px;
    animation: badgePulse .8s ease-in-out infinite;
  }
  @keyframes badgePulse { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.08) rotate(-2deg); } }
  .hint { margin-top: 14px; color: #a99fd0; font-size: 14px; }
  @media (max-width: 640px), (max-height: 480px) {
    .title { font-size: 50px; }
    .tag { font-size: 15px; margin-bottom: 18px; }
    #score { font-size: 32px; }
    .card { padding: 18px 24px 22px; }
    .overmsg { font-size: 24px; }
    .scores b { font-size: 30px; }
    .btn { font-size: 22px; padding: 12px 34px; }
    .controls { font-size: 13px; gap: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud" class="hidden"><div id="score">0</div></div>
  <div id="bestpill" class="hidden">BEST 0</div>
  <button id="muteBtn" aria-label="Toggle sound">
    <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="iconOff" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
  </button>
  <div id="menu" class="overlay">
    <h1 class="title"><span>F</span><span>U</span><span>N</span><span class="gap"></span><span>G</span><span>A</span><span>M</span><span>E</span></h1>
    <p class="tag">Jump the cacti. Duck the balloons. Survive the silly!</p>
    <button id="playBtn" class="btn">PLAY</button>
    <div class="controls">
      <span><span class="key">SPACE</span> / tap — jump, tap twice = double jump</span>
      <span><span class="key">DOWN</span> — duck</span>
    </div>
    <div id="menuBest" class="bestline hidden">Best score: 0</div>
  </div>
  <div id="over" class="overlay hidden">
    <div class="card">
      <div id="overMsg" class="overmsg">Ouch!</div>
      <div class="scores">
        <div>SCORE<b id="finalScore">0</b></div>
        <div>BEST<b id="finalBest">0</b></div>
      </div>
      <div id="newBest" class="badge hidden">NEW BEST!</div>
      <div><button id="retryBtn" class="btn">TRY AGAIN</button></div>
      <div class="hint">or press SPACE</div>
    </div>
  </div>
</div>
<script>
'use strict';
const W = 960, H = 540, GROUND_Y = 452;
const GRAV = 2300, JUMP_V = 830, DJUMP_V = 750;
const BASE_SPEED = 330, MAX_SPEED = 850, SPEED_RAMP = 7;
const CYCLE = 90;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const scoreEl = document.getElementById('score');
const hudEl = document.getElementById('hud');
const bestpillEl = document.getElementById('bestpill');
const menuEl = document.getElementById('menu');
const overEl = document.getElementById('over');
const playBtn = document.getElementById('playBtn');
const retryBtn = document.getElementById('retryBtn');
const muteBtn = document.getElementById('muteBtn');
const iconOn = document.getElementById('iconOn');
const iconOff = document.getElementById('iconOff');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const newBestEl = document.getElementById('newBest');
const overMsgEl = document.getElementById('overMsg');
const menuBestEl = document.getElementById('menuBest');

let viewScale = 1;
function resize() {
  const pad = 18;
  const cw = Math.max(320, window.innerWidth - pad * 2);
  const ch = Math.max(240, window.innerHeight - pad * 2);
  const scale = Math.min(cw / W, ch / H);
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  stage.style.width = cssW + 'px';
  stage.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  viewScale = canvas.width / W;
}
window.addEventListener('resize', resize);
resize();

function loadBest() {
  try { return parseInt(localStorage.getItem('fungame-best') || '0', 10) || 0; } catch (e) { return 0; }
}
function saveBest(v) { try { localStorage.setItem('fungame-best', String(v)); } catch (e) {} }
let best = loadBest();
let muted = false;
try { muted = localStorage.getItem('fungame-muted') === '1'; } catch (e) {}

const sfx = (() => {
  let ac = null, master = null;
  function ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ac) {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.5;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function tone(type, f0, f1, dur, vol, delay) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, cutoff, delay) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const flt = ac.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = cutoff;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(master);
    src.start(t0);
  }
  return {
    ensure,
    jump() { ensure(); tone('triangle', 260, 640, 0.18, 0.4); },
    doubleJump() { ensure(); tone('triangle', 420, 980, 0.2, 0.4); tone('sine', 900, 1500, 0.14, 0.16, 0.05); },
    land() { ensure(); tone('sine', 150, 70, 0.09, 0.2); },
    squish() { ensure(); tone('sine', 320, 110, 0.12, 0.25); },
    crash() { ensure(); noise(0.35, 0.6, 900, 0); tone('sine', 190, 40, 0.45, 0.55); tone('square', 220, 50, 0.3, 0.2, 0.02); },
    milestone() { ensure(); tone('square', 523, 523, 0.1, 0.2); tone('square', 659, 659, 0.1, 0.2, 0.08); tone('square', 784, 784, 0.16, 0.22, 0.16); },
    start() { ensure(); tone('triangle', 392, 392, 0.09, 0.3); tone('triangle', 523, 523, 0.09, 0.3, 0.1); tone('triangle', 659, 659, 0.16, 0.32, 0.2); },
    click() { ensure(); tone('sine', 640, 940, 0.07, 0.3); },
  };
})();

const DEATH_MSGS = [
  'Ouch! That cactus has feelings.',
  'Wow. Smooth move, champ.',
  'The ground wins this round.',
  'You are one tough little blob.',
  'Cactus: 1 — You: 0',
  'Gravity: it is a lifestyle.',
  'Almost! The cactus salutes you.',
  'That balloon was just asking nicely.',
  'Nice try! The score remembers.',
  'Bonk. Classic.',
];

let state = 'menu';
let scroll = 0, speed = BASE_SPEED, elapsed = 0, score = 0, nextMilestone = 100;
let spawnTimer = 1.4;
let shake = 0, dieTimer = 0, overAt = 0;
const obstacles = [], particles = [], popups = [];

const player = {
  x: 150, y: GROUND_Y, vy: 0, w: 46, h: 54, crouchH: 28,
  onGround: true, jumps: 0, crouch: false,
  squash: 1, blinkT: 0, nextBlink: 2.5, dead: false, rot: 0,
};

function resetGame() {
  obstacles.length = 0; particles.length = 0; popups.length = 0;
  score = 0; nextMilestone = 100; elapsed = 0; speed = BASE_SPEED;
  spawnTimer = 1.4; shake = 0; dieTimer = 0;
  player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.jumps = 0;
  player.crouch = false; player.squash = 1; player.dead = false; player.rot = 0;
}

function startGame() {
  resetGame();
  state = 'playing';
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  bestpillEl.classList.remove('hidden');
  bestpillEl.textContent = 'BEST ' + best;
  sfx.start();
  addPopup('GO!', player.x + 70, player.y - 120, '#FFFFFF');
}

function crash() {
  if (state !== 'playing') return;
  state = 'dying';
  dieTimer = 0;
  player.dead = true;
  player.vy = -620;
  player.rot = 0;
  shake = 1;
  sfx.crash();
  burstStars(player.x, player.y - 27, 10);
  burstDust(player.x, player.y, 10);
}

function showGameOver() {
  state = 'gameover';
  overAt = performance.now();
  const s = Math.floor(score);
  const isBest = s > best;
  if (isBest) { best = s; saveBest(best); }
  overMsgEl.textContent = DEATH_MSGS[(Math.random() * DEATH_MSGS.length) | 0];
  finalScoreEl.textContent = s;
  finalBestEl.textContent = best;
  newBestEl.classList.toggle('hidden', !isBest);
  bestpillEl.textContent = 'BEST ' + best;
  hudEl.classList.add('hidden');
  overEl.classList.remove('hidden');
  if (isBest) sfx.milestone();
}

function retry() {
  if (state !== 'gameover') return;
  if (performance.now() - overAt < 450) return;
  startGame();
}

function jump() {
  if (state !== 'playing') return;
  if (player.onGround) {
    player.vy = -JUMP_V;
    player.onGround = false;
    player.jumps = 1;
    player.squash = 1.28;
    sfx.jump();
    burstDust(player.x, player.y, 7);
  } else if (player.jumps < 2) {
    player.vy = -DJUMP_V;
    player.jumps = 2;
    player.squash = 1.32;
    sfx.doubleJump();
    particles.push({ type: 'ring', x: player.x, y: player.y - 20, r: 8, life: 0.35, t: 0 });
  }
}

function press() {
  sfx.ensure();
  if (state === 'menu') startGame();
  else if (state === 'playing') jump();
  else if (state === 'gameover') retry();
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    press();
  } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault();
    if (state === 'playing' && !player.crouch && player.onGround) sfx.squish();
    player.crouch = true;
  } else if (e.code === 'KeyM') {
    toggleMute();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') player.crouch = false;
});
stage.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
stage.addEventListener('contextmenu', (e) => e.preventDefault());
playBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
retryBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
muteBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
playBtn.addEventListener('click', (e) => { e.stopPropagation(); playBtn.blur(); sfx.click(); startGame(); });
retryBtn.addEventListener('click', (e) => { e.stopPropagation(); retryBtn.blur(); sfx.click(); retry(); });
muteBtn.addEventListener('click', (e) => { e.stopPropagation(); muteBtn.blur(); toggleMute(); });

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('fungame-muted', muted ? '1' : '0'); } catch (e) {}
  iconOn.classList.toggle('hidden', muted);
  iconOff.classList.toggle('hidden', !muted);
  if (!muted) { sfx.ensure(); sfx.click(); }
}
iconOn.classList.toggle('hidden', muted);
iconOff.classList.toggle('hidden', !muted);

function pickType() {
  const pool = [
    { t: 'cactusS', w: 0.30 },
    { t: 'cactusT', w: 0.22 },
    { t: 'crate', w: 0.20 },
    { t: 'balloon', w: 0.14 },
  ];
  if (speed > 420) pool.push({ t: 'cactusDuo', w: 0.12 });
  if (speed > 560) pool.push({ t: 'crateStack', w: 0.10 });
  if (speed > 480) pool.push({ t: 'balloon', w: 0.08 });
  let r = Math.random(), acc = 0;
  for (const p of pool) { acc += p.w; if (r <= acc) return p.t; }
  return 'cactusS';
}

function spawnObstacle() {
  const t = pickType();
  const o = { type: t, x: W + 80, seed: Math.random() * 10, w: 40, h: 50, y: GROUND_Y };
  if (t === 'cactusS') { o.w = 34; o.h = 54; }
  else if (t === 'cactusT') { o.w = 42; o.h = 78; }
  else if (t === 'cactusDuo') { o.w = 78; o.h = 54; }
  else if (t === 'crate') { o.w = 48; o.h = 48; }
  else if (t === 'crateStack') { o.w = 48; o.h = 94; }
  else if (t === 'balloon') { o.w = 42; o.h = 46; o.y = GROUND_Y - 38; }
  obstacles.push(o);
}

function playerHitbox() {
  const h = (player.crouch && player.onGround) ? player.crouchH : player.h;
  return { x: player.x - player.w / 2 + 7, y: player.y - h + 7, w: player.w - 14, h: h - 12 };
}

function checkCollisions() {
  const p = playerHitbox();
  for (const o of obstacles) {
    const bob = o.type === 'balloon' ? Math.sin(elapsed * 2.5 + o.seed) * 3 : 0;
    const oy = o.type === 'balloon' ? o.y + bob : o.y;
    const ox = o.x - o.w / 2 + 5, ow = o.w - 10;
    const oTop = oy - o.h + 5, oh = o.h - 10;
    if (p.x < ox + ow && p.x + p.w > ox && p.y < oTop + oh && p.y + p.h > oTop) {
      crash();
      break;
    }
  }
}

function burstDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'dust',
      x: x + (Math.random() * 24 - 12), y: y - Math.random() * 6,
      vx: -speed * 0.35 + (Math.random() * 80 - 40), vy: -(20 + Math.random() * 70),
      r: 3 + Math.random() * 5, t: 0, life: 0.35 + Math.random() * 0.3,
    });
  }
}
function burstStars(x, y, n) {
  const colors = ['#FFE93D', '#FF5D5D', '#FF9F1C', '#FFFFFF'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 260;
    particles.push({
      type: 'star', x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      r: 5 + Math.random() * 7, rot: Math.random() * 6.3, vr: (Math.random() * 2 - 1) * 8,
      color: colors[(Math.random() * colors.length) | 0], t: 0, life: 0.5 + Math.random() * 0.4,
    });
  }
}
function burstConfetti(x, y, n) {
  const colors = ['#FF5D5D', '#FFD93D', '#6BCB77', '#4D96FF', '#B983FF', '#FF9F1C'];
  for (let i = 0; i < n; i++) {
    particles.push({
      type: 'confetti', x, y,
      vx: (Math.random() * 2 - 1) * 300, vy: -(140 + Math.random() * 320),
      rot: Math.random() * 6.3, vr: (Math.random() * 2 - 1) * 10,
      w: 5 + Math.random() * 5, h: 8 + Math.random() * 6,
      color: colors[(Math.random() * colors.length) | 0], t: 0, life: 0.9 + Math.random() * 0.5,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    if (p.type === 'dust') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.r += 8 * dt; }
    else if (p.type === 'star') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.rot += p.vr * dt; }
    else if (p.type === 'confetti') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.vx *= (1 - dt * 1.2); p.rot += p.vr * dt; }

function addPopup(text, x, y, color) {

}
function updatePopups(dt) {

const MOUNT_P = W + 240;

const HILL_P = W + 160;

const BUSH_P = W + 120;
const bushes = [];
(function () {

const pebbles = [];

});
const clouds = [];

const stars = [];

function lerp(a, b, t) { return a + (b - a) * t; }
function mixColor(a, b, t) {
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
const SKY_KEYS = [
  [0.00, [70, 190, 240], [205, 240, 255]],
  [0.18, [255, 145, 100], [255, 214, 160]],
  [0.28, [26, 34, 78], [52, 64, 118]],
  [0.55, [26, 34, 78], [52, 64, 118]],
  [0.66, [255, 150, 190], [255, 224, 175]],
  [0.78, [70, 190, 240], [205, 240, 255]],
  [1.00, [70, 190, 240], [205, 240, 255]],
];
function skyAt(phase) {
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const p0 = SKY_KEYS[i][0], c0 = SKY_KEYS[i][1], b0 = SKY_KEYS[i][2];
    const p1 = SKY_KEYS[i + 1][0], c1 = SKY_KEYS[i + 1][1], b1 = SKY_KEYS[i + 1][2];
    if (phase >= p0 && phase <= p1) {
      const t = (phase - p0) / (p1 - p0 || 1);
      const top = [0, 1, 2].map(j => Math.round(lerp(c0[j], c1[j], t)));
      const bot = [0, 1, 2].map(j => Math.round(lerp(b0[j], b1[j], t)));
      return { top, bot };
    }
  }
  return { top: SKY_KEYS[0][1], bot: SKY_KEYS[0][2] };
}
function nightFactor(p) {
  if (p < 0.14) return 0;
  if (p < 0.30) return (p - 0.14) / 0.16;
  if (p < 0.58) return 1;
  if (p < 0.74) return 1 - (p - 0.58) / 0.16;
  return 0;
}

function updateClouds(dt) {
  const drift = state === 'playing' ? speed * 0.05 : 14;
  for (const c of clouds) {
    c.x -= (c.v + drift) * dt;
    if (c.x < -160) { c.x = W + 160; c.y = 40 + Math.random() * 150; }
  }
}

function stepPlayer(dt) {
  if (state === 'dying' || state === 'gameover') return;
  const g = (player.crouch && !player.onGround) ? GRAV * 1.9 : GRAV;
  if (!player.onGround) {
    player.vy += g * dt;
    player.y += player.vy * dt;
  }
  if (player.y >= GROUND_Y) {
    if (!player.onGround && player.vy > 380) {
      player.squash = 0.68;
      burstDust(player.x, GROUND_Y, 6);
      sfx.land();
    }
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  } else if (player.y < GROUND_Y) {
    player.onGround = false;
  }
}

function updateBlink(dt) {
  player.nextBlink -= dt;
  if (player.nextBlink <= 0) {
    player.blinkT = 0.13;
    player.nextBlink = 1.8 + Math.random() * 3;
  }
  if (player.blinkT > 0) player.blinkT -= dt;
}

function update(dt) {
  elapsed += dt;
  if (state === 'playing') {
    speed = Math.min(MAX_SPEED, BASE_SPEED + elapsed * SPEED_RAMP);
    scroll += speed * dt;
    score += speed * dt * 0.02;
    if (score >= nextMilestone) {
      sfx.milestone();
      addPopup(nextMilestone + '!', player.x + 80, player.y - 120, '#FFE93D');
      burstConfetti(player.x, player.y - 60, 26);
      nextMilestone += 100;
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      const minGap = 360 + speed * 0.34;
      spawnTimer = (minGap + Math.random() * 260) / speed;
    }
    for (const o of obstacles) o.x -= speed * dt;
    while (obstacles.length && obstacles[0].x < -120) obstacles.shift();
    stepPlayer(dt);
    if (state === 'playing') checkCollisions();
  } else if (state === 'menu') {
    scroll += 120 * dt;
    stepPlayer(dt);
  } else if (state === 'dying') {
    dieTimer += dt;
    player.vy += GRAV * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      if (player.vy > 250) { player.vy = -player.vy * 0.35; player.squash = 0.7; }
      else player.vy = 0;
    }
    player.rot = Math.min(player.rot + 10 * dt, Math.PI * 2);
    if (dieTimer > 0.9) showGameOver();
  }
  player.squash += (1 - player.squash) * Math.min(1, dt * 10);
  updateParticles(dt);
  updatePopups(dt);
  shake = Math.max(0, shake - dt * 2.4);
  updateBlink(dt);
  scoreEl.textContent = String(Math.floor(score));
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.45;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawSunMoon(phase, nf) {
  if (phase < 0.30) {
    const p = phase / 0.30;
    const x = W * 0.12 + p * W * 0.76;
    const y = H * 0.42 - Math.sin(p * Math.PI) * H * 0.30;
    const a = 1 - Math.max(0, (phase - 0.24) / 0.06);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'rgba(255,220,90,0.35)';
    ctx.beginPath(); ctx.arc(x, y, 46, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFD93D';
    ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill();
    ctx.restore();
  }
  if (phase > 0.32 && phase < 0.68) {
    const p = (phase - 0.32) / 0.36;
    const x = W * 0.12 + p * W * 0.76;
    const y = H * 0.42 - Math.sin(p * Math.PI) * H * 0.30;
    ctx.save();
    ctx.globalAlpha = Math.min(1, nf * 1.4);
    ctx.fillStyle = '#F7F3D8';
    ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(190,185,150,0.5)';

    ctx.beginPath(); ctx.arc(x + 7, y + 6, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3, y - 9, 2.5, 0, 7); ctx.fill();

}

function drawClouds() {

function drawMountains(nf) {
  const off = (scroll * 0.12) % MOUNT_P;
  ctx.fillStyle = mixColor([155, 183, 232], [58, 70, 130], nf);
  for (const m of mountains) {
    for (const base of [0, MOUNT_P]) {
      const x = m.x + base - off;
      if (x + m.w < -60 || x > W + 60) continue;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(x + m.w / 2, GROUND_Y - m.h);
      ctx.lineTo(x + m.w, GROUND_Y);
      ctx.closePath();
      ctx.fill();
      if (m.snow) {
        const peakX = x + m.w / 2, peakY = GROUND_Y - m.h, sw = m.w * 0.16;
        ctx.fillStyle = nf > 0.5 ? '#C9D4F2' : '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(peakX + sw, peakY + m.h * 0.22);
        ctx.lineTo(peakX + sw * 0.4, peakY + m.h * 0.16);
        ctx.lineTo(peakX, peakY + m.h * 0.24);
        ctx.lineTo(peakX - sw * 0.4, peakY + m.h * 0.16);
        ctx.lineTo(peakX - sw, peakY + m.h * 0.22);

function drawHills(nf) {

function drawGround(nf) {

function drawCactus(w, h) {

    ctx.beginPath(); ctx.moveTo(w / 2 - 2, y); ctx.lineTo(w / 2 + 4, y - 3); ctx.stroke();

function drawObstacle(o) {
  ctx.save();
  if (o.type === 'balloon') {
    const bob = Math.sin(elapsed * 2.5 + o.seed) * 3;
    ctx.translate(o.x, o.y + bob);

  } else {
    ctx.translate(o.x, o.y);
    if (o.type === 'cactusS') drawCactus(34, 54);
    else if (o.type === 'cactusT') drawCactus(42, 78);

      ctx.save(); ctx.translate(-22, 0); drawCactus(34, 52); ctx.restore();
      ctx.save(); ctx.translate(22, 0); drawCactus(30, 46); ctx.restore();
    }
    else if (o.type === 'crate') drawCrate(48, 48, 0);
    else if (o.type === 'crateStack') { drawCrate(48, 46, 0); drawCrate(46, 48, 46); }
  }
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  const crouching = p.crouch && p.onGround;
  const bodyH = crouching ? 34 : 54;
  const bodyW = crouching ? 58 : 48;
  const airH = Math.max(0, GROUND_Y - p.y);
  const shScale = Math.max(0.35, 1 - airH / 300);
  ctx.save();
  ctx.globalAlpha = 0.22 * shScale;
  ctx.fillStyle = '#1A1030';
  ctx.beginPath();
  ctx.ellipse(p.x, GROUND_Y + 8, 26 * shScale, 7 * shScale, 0, 0, 7);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.dead) ctx.rotate(p.rot);
  const sq = p.squash;
  ctx.scale(1 + (1 - sq) * 0.7, sq);
  const run = (state === 'playing' || state === 'menu') && p.onGround;
  const ph = scroll * 0.045;
  const legA = run ? Math.sin(ph) * 7 : 0;
  const legB = run ? Math.sin(ph + Math.PI) * 7 : 0;
  const bob = run ? Math.abs(Math.sin(ph)) * -3 : 0;
  ctx.translate(0, bob);

  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';

  ctx.fillStyle = '#E8622A';
  ctx.strokeStyle = '#B2451A';
  if (p.onGround || p.dead) {
    ctx.beginPath(); ctx.ellipse(-13 + legA, -3, 10, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(13 + legB, -3, 10, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(-12, -8, 10, 6, -0.4, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(12, -6, 10, 6, 0.4, 0, 7); ctx.fill(); ctx.stroke();
  }

  const armUp = !p.onGround && !p.dead;
  ctx.fillStyle = '#FF9A4D';
  ctx.strokeStyle = '#D96B25';
  const armY = -bodyH * 0.52;
  if (armUp) {
    ctx.beginPath(); ctx.ellipse(-bodyW / 2 - 2, armY - 10, 7, 11, -0.7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bodyW / 2 + 2, armY - 10, 7, 11, 0.7, 0, 7); ctx.fill(); ctx.stroke();
  } else {
    const sw = run ? Math.sin(ph + Math.PI) * 4 : 0;
    ctx.beginPath(); ctx.ellipse(-bodyW / 2 - 1, armY + sw, 7, 10, 0.3, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bodyW / 2 + 1, armY - sw, 7, 10, -0.3, 0, 7); ctx.fill(); ctx.stroke();
  }

  const grad = ctx.createLinearGradient(0, -bodyH, 0, 0);
  grad.addColorStop(0, '#FFB25E');
  grad.addColorStop(1, '#FF8C42');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#D96B25';
  ctx.beginPath();
  ctx.ellipse(0, -bodyH / 2, bodyW / 2, bodyH / 2, 0, 0, 7);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(255,236,205,0.85)';
  ctx.beginPath();
  ctx.ellipse(0, -bodyH * 0.30, bodyW * 0.30, bodyH * 0.24, 0, 0, 7);
  ctx.fill();

  ctx.strokeStyle = '#D96B25';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -bodyH + 2);
  ctx.quadraticCurveTo(2, -bodyH - 8, 8, -bodyH - 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-4, -bodyH + 2);
  ctx.quadraticCurveTo(-6, -bodyH - 6, -10, -bodyH - 7);
  ctx.stroke();

  const blink = p.blinkT > 0 || p.dead;
  const eyeY = -bodyH * 0.62;
  const lookX = p.dead ? 0 : 1.5;
  const lookY = p.dead ? 0 : (p.vy < -50 ? -1.5 : p.vy > 150 ? 1.5 : 0.3);
  if (p.dead) {
    ctx.strokeStyle = '#5A2A0E';
    ctx.lineWidth = 3;
    for (const ex of [-9, 9]) {
      ctx.beginPath();
      ctx.moveTo(ex - 4, eyeY - 4); ctx.lineTo(ex + 4, eyeY + 4);
      ctx.moveTo(ex + 4, eyeY - 4); ctx.lineTo(ex - 4, eyeY + 4);
      ctx.stroke();
    }
  } else if (blink) {
    ctx.strokeStyle = '#5A2A0E';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-13, eyeY); ctx.lineTo(-5, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, eyeY); ctx.lineTo(13, eyeY); ctx.stroke();
  } else {
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#5A2A0E';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(-9, eyeY, 7.5, 8.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(9, eyeY, 7.5, 8.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2A1608';
    ctx.beginPath(); ctx.arc(-9 + lookX, eyeY + lookY, 3.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(9 + lookX, eyeY + lookY, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(-9 + lookX - 1.2, eyeY + lookY - 1.4, 1.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(9 + lookX - 1.2, eyeY + lookY - 1.4, 1.3, 0, 7); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,120,110,0.45)';
  ctx.beginPath(); ctx.ellipse(-16, -bodyH * 0.44, 4.5, 3, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, -bodyH * 0.44, 4.5, 3, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = '#5A2A0E';
  ctx.lineWidth = 2.6;
  const my = -bodyH * 0.40;
  if (p.dead) {
    ctx.beginPath(); ctx.arc(0, my + 2, 4, 0, 7); ctx.stroke();
  } else if (!p.onGround) {
    ctx.fillStyle = '#8C3B1A';
    ctx.beginPath(); ctx.ellipse(0, my + 1, 4.5, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#FF7B6B';
    ctx.beginPath(); ctx.ellipse(0, my + 3.5, 2.6, 2.4, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, my - 2, 7, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(layer) {
  for (const p of particles) {
    const isBack = p.type === 'dust';
    if ((layer === 'back') !== isBack) continue;
    const k = p.t / p.life;
    ctx.save();
    if (p.type === 'dust') {
      ctx.globalAlpha = (1 - k) * 0.5;
      ctx.fillStyle = '#E8DCC8';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (p.type === 'star') {
      ctx.globalAlpha = 1 - k;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      starPath(p.r);
      ctx.fill();
    } else if (p.type === 'confetti') {
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else if (p.type === 'ring') {
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of popups) {
    const k = p.t / p.life;
    const scale = p.t < 0.12 ? p.t / 0.12 : 1;
    ctx.save();
    ctx.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
    ctx.translate(p.x, p.y - k * 46);
    ctx.scale(scale, scale);
    ctx.font = 'bold 40px "Comic Sans MS", "Chalkboard SE", cursive';
    ctx.textAlign = 'center';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(42,22,8,0.85)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake * 9, (Math.random() * 2 - 1) * shake * 7);
  const phase = (elapsed / CYCLE) % 1;
  const nf = nightFactor(phase);
  const sky = skyAt(phase);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgb(' + sky.top[0] + ',' + sky.top[1] + ',' + sky.top[2] + ')');
  g.addColorStop(1, 'rgb(' + sky.bot[0] + ',' + sky.bot[1] + ',' + sky.bot[2] + ')');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);
  if (nf > 0.02) {
    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    for (const s of stars) {
      ctx.globalAlpha = nf * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(elapsed * 2 + s.ph)));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }
  drawSunMoon(phase, nf);
  drawClouds();
  drawMountains(nf);
  drawHills(nf);
  drawBushes(nf);
  drawGround(nf);
  for (const o of obstacles) drawObstacle(o);
  drawParticles('back');
  drawPlayer();
  drawParticles('front');
  if (nf > 0.02) {
    ctx.fillStyle = 'rgba(16,22,64,' + (nf * 0.16).toFixed(3) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  drawPopups();
}

function refreshMenuBest() {
  if (best > 0) {
    menuBestEl.textContent = 'Best score: ' + best;
    menuBestEl.classList.remove('hidden');
  } else {
    menuBestEl.classList.add('hidden');
  }
}
refreshMenuBest();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.001;
  updateClouds(dt);
  update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
