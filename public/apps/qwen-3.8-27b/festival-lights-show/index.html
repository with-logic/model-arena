<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Lights Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #04050d;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    pointer-events: none;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: conic-gradient(from 0deg, #ff0080, #ff8800, #ffee00, #00ff88, #00ccff, #8800ff, #ff0080);
    animation: spin 7s linear infinite;
    box-shadow: 0 0 20px rgba(255, 0, 128, 0.55);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo .title {
    font-size: 17px; font-weight: 800; letter-spacing: 0.4px;
    background: linear-gradient(90deg, #ff4d9d, #ffd54d, #4dd8ff, #b04dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 77, 157, 0.25);
    white-space: nowrap;
  }
  .beat-wrap { display: flex; align-items: center; gap: 14px; }
  .beat-label {
    font-size: 11px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; opacity: 0.65; white-space: nowrap;
  }
  .beat-dots { display: flex; gap: 6px; }
  .bdot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.16);
    transition: background 0.08s, box-shadow 0.08s, transform 0.08s;
  }
  .bdot.on { background: #fff; box-shadow: 0 0 12px #fff; transform: scale(1.3); }

  /* ---------- Control panel ---------- */
  #panel {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(1120px, calc(100% - 20px));
    background: rgba(9, 11, 24, 0.58);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 14px 16px 15px;
    z-index: 10;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    user-select: none;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.8px;
    text-transform: uppercase; opacity: 0.45;
    min-width: 56px; flex: none;
  }

  #playBtn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 13.5px; color: #fff;
    background: linear-gradient(135deg, #ff0080, #8800ff);
    box-shadow: 0 6px 26px rgba(255, 0, 128, 0.45);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    flex: none;
  }
  #playBtn:hover { transform: translateY(-1px); box-shadow: 0 10px 32px rgba(255, 0, 128, 0.6); }
  #playBtn:active { transform: translateY(0); }
  #playBtn.playing {
    background: linear-gradient(135deg, #00c8ff, #00ff9d);
    box-shadow: 0 6px 26px rgba(0, 200, 255, 0.45);
  }
  #playBtn svg { flex: none; }

  .slider { display: flex; flex-direction: column; gap: 5px; min-width: 106px; flex: 1; max-width: 170px; }
  .slider .top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; opacity: 0.55;
  }
  .slider .top .val { opacity: 1; font-size: 11.5px; color: #fff; letter-spacing: 0.5px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.16);
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: none;
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
    cursor: pointer;
  }

  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: rgba(255,255,255,0.72);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
    flex: none;
  }
  .toggle:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .toggle .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.28);
    transition: all 0.15s;
  }
  .toggle.active {
    color: #fff;
    background: rgba(0, 255, 150, 0.14);
    border-color: rgba(0, 255, 150, 0.45);
  }
  .toggle.active .led { background: #00ff96; box-shadow: 0 0 10px #00ff96; }

  .chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .chip {
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: rgba(255,255,255,0.72);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
  }
  .chip:hover { background: rgba(255,255,255,0.13); color: #fff; }
  .chip.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(255,0,128,0.92), rgba(136,0,255,0.92));
    border-color: transparent;
    box-shadow: 0 4px 18px rgba(255, 0, 128, 0.4);
  }

  .swatch {
    width: 27px; height: 27px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.3);
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active {
    border-color: #fff; transform: scale(1.18);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.22), 0 0 18px rgba(255,255,255,0.45);
  }
  .color-input {
    width: 27px; height: 27px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.4);
    cursor: pointer; padding: 0; background: none;
    transition: transform 0.15s;
  }
  .color-input:hover { transform: scale(1.12); }
  .color-input::-webkit-color-swatch-wrapper { padding: 2px; }
  .color-input::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-input::-moz-color-swatch { border: none; border-radius: 50%; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; top: 74px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: rgba(9, 11, 24, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 10px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint {
    position: fixed; top: 66px; left: 24px;
    font-size: 11px; letter-spacing: 0.6px;
    opacity: 0.35; pointer-events: none; z-index: 9;
  }
  .hint kbd {
    font-family: inherit; font-size: 10px; font-weight: 700;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px; padding: 1px 5px; margin: 0 1px;
  }

  @media (max-width: 720px) {
    header { padding: 14px 16px; }
    .logo .title { font-size: 14px; }
    .hint { display: none; }
    #panel { padding: 12px; border-radius: 16px; }
    .label { min-width: 100%; margin-bottom: -4px; }
    .slider { min-width: 90px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header>
  <div class="logo">
    <div class="mark"></div>
    <div class="title">Festival Lights Show</div>
  </div>
  <div class="beat-wrap">
    <span class="beat-label" id="statusLabel">Auto &middot; 128 BPM</span>
    <div class="beat-dots" id="beatDots">
      <span class="bdot"></span><span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>
    </div>
  </div>
</header>

<div class="hint">
  <kbd>Space</kbd> music &nbsp; <kbd>1</kbd>&ndash;<kbd>9</kbd> pattern &nbsp; <kbd>M</kbd> mic &nbsp; <kbd>L</kbd> lasers &nbsp; <kbd>R</kbd> colors
</div>

<div id="panel">
  <div class="row">
    <button id="playBtn">
      <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>
      <span id="playLabel">Play Music</span>
    </button>
    <div class="slider">
      <div class="top"><span>BPM</span><span class="val" id="bpmVal">128</span></div>
      <input type="range" id="bpm" min="90" max="160" value="128" step="1">
    </div>
    <div class="slider">
      <div class="top"><span>Speed</span><span class="val" id="speedVal">1.0x</span></div>
      <input type="range" id="speed" min="0.3" max="2" value="1" step="0.1">
    </div>
    <div class="slider">
      <div class="top"><span>Intensity</span><span class="val" id="intensityVal">80%</span></div>
      <input type="range" id="intensity" min="0.2" max="1" value="0.8" step="0.05">
    </div>
    <button class="toggle" id="micBtn"><span class="led"></span>Mic Sync</button>
    <button class="toggle active" id="laserBtn"><span class="led"></span>Lasers</button>
  </div>
  <div class="row">
    <span class="label">Pattern</span>
    <div class="chips" id="patternChips">
      <button class="chip active" data-pattern="auto">Auto</button>
      <button class="chip" data-pattern="pulse">Pulse</button>
      <button class="chip" data-pattern="wave">Wave</button>
      <button class="chip" data-pattern="scan">Scan</button>
      <button class="chip" data-pattern="strobe">Strobe</button>
      <button class="chip" data-pattern="chase">Chase</button>
      <button class="chip" data-pattern="spiral">Spiral</button>
      <button class="chip" data-pattern="fan">Fan</button>
      <button class="chip" data-pattern="random">Random</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Colors</span>
    <div class="chips" id="colorChips">
      <button class="swatch active" data-color="rainbow" title="Rainbow"
        style="background: conic-gradient(#ff0040, #ffee00, #00ff88, #00ccff, #8800ff, #ff0040)"></button>
      <button class="swatch" data-color="neon" title="Neon"
        style="background: linear-gradient(135deg, #ff00ff, #00ffff)"></button>
      <button class="swatch" data-color="sunset" title="Sunset"
        style="background: linear-gradient(135deg, #ff0044, #ff8800, #ffee00)"></button>
      <button class="swatch" data-color="ocean" title="Ocean"
        style="background: linear-gradient(135deg, #00ccff, #0055ff, #00ffcc)"></button>
      <button class="swatch" data-color="fire" title="Fire"
        style="background: linear-gradient(135deg, #ff2200, #ff7700, #ffcc00)"></button>
      <button class="swatch" data-color="ice" title="Ice"
        style="background: linear-gradient(135deg, #cfeaff, #66aaff, #e8f4ff)"></button>
      <button class="swatch" data-color="candy" title="Candy"
        style="background: linear-gradient(135deg, #ff66cc, #cc66ff, #66ccff)"></button>
      <input type="color" id="customColor" class="color-input" value="#ff00cc" title="Custom color">
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  /* ================= Canvas ================= */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  /* ================= State ================= */
  const state = {
    pattern: 'auto',
    colorMode: 'rainbow',
    customHue: 300,
    speed: 1,
    intensity: 0.8,
    bpm: 128,
    lasers: true,
    mic: false,
  };

  const PALETTES = {
    neon:   [300, 180, 260, 120],
    sunset: [355, 25, 45, 330],
    ocean:  [190, 210, 230, 170],
    fire:   [5, 22, 42, 58],
    ice:    [185, 205, 225, 260],
    candy:  [330, 280, 200, 150],
  };

  const N_FIX = 11;
  const FLOOR_FRAC = 0.86;
  let fixtures = [], crowd = [], confetti = [], haze = [], lasers = [];

  function buildScene() {
    fixtures = [];
    const marginX = W * 0.07;
    for (let i = 0; i < N_FIX; i++) {
      const x = marginX + (W - 2 * marginX) * (i / (N_FIX - 1));
      fixtures.push({
        x, y: H * 0.10,
        angle: 0, targetAngle: 0,
        intensity: 0.8, hue: (i * 33) % 360,
      });
    }
    crowd = [];
    const n = Math.max(16, Math.floor(W / 34));
    for (let i = 0; i < n; i++) {
      crowd.push({
        x: (i + 0.15 + Math.random() * 0.7) / n,
        size: 9 + Math.random() * 11,
        phase: Math.random() * Math.PI * 2,
        armUp: Math.random() < 0.42,
        bob: 0.55 + Math.random() * 0.85,
      });
    }
    haze = [];
    for (let i = 0; i < 6; i++) {
      haze.push({
        x: Math.random(), y: 0.28 + Math.random() * 0.42,
        r: 110 + Math.random() * 170,
        vx: (Math.random() * 2 - 1) * 0.018,
        phase: Math.random() * Math.PI * 2,
      });
    }
    lasers = [
      { x: W * 0.10, y: H * 0.055, dir: 1 },
      { x: W * 0.90, y: H * 0.055, dir: -1 },
    ];
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }
  window.addEventListener('resize', resize);

  /* ================= Audio engine =================
     Procedural festival track: four-on-the-floor kick,
     off-beat bass, claps, hats, arpeggio lead + pad,
     over an Am - F - C - G progression. A lookahead
     scheduler also emits visual events (kick / clap /
     downbeat) so the lights lock to the music. */
  const CHORDS = [
    { root: 33, pad: [57, 60, 64], lead: [69, 72, 76, 81] }, // Am
    { root: 29, pad: [53, 57, 60], lead: [65, 69, 72, 77] }, // F
    { root: 36, pad: [55, 60, 64], lead: [67, 72, 76, 79] }, // C
    { root: 31, pad: [55, 59, 62], lead: [67, 71, 74, 79] }, // G
  ];

  const Audio = {
    ctx: null, master: null, comp: null, analyser: null, freq: null,
    delay: null, delaySend: null, noiseBuf: null,
    playing: false, startTime: 0, step: 0, nextStepTime: 0, timer: null,
    events: [],
    micStream: null, micAnalyser: null, micFreq: null,

    midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },

    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.85;
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -14;
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 256;
      this.analyser.smoothingTimeConstant = 0.72;
      this.freq = new Uint8Array(this.analyser.frequencyBinCount);
      this.master.connect(this.comp);
      this.comp.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);

      this.delay = this.ctx.createDelay(1.0);
      this.delay.delayTime.value = (60 / state.bpm) * 0.75;
      const fb = this.ctx.createGain(); fb.gain.value = 0.38;
      this.delay.connect(fb); fb.connect(this.delay);
      this.delaySend = this.ctx.createGain(); this.delaySend.gain.value = 0.5;
      this.delaySend.connect(this.delay);
      this.delay.connect(this.master);

      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    },

    setBpm(bpm) {
      state.bpm = bpm;
      if (this.delay && this.ctx) {
        this.delay.delayTime.setTargetAtTime((60 / bpm) * 0.75, this.ctx.currentTime, 0.1);
      }
    },

    async start() {
      this.init();
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      this.playing = true;
      this.startTime = this.ctx.currentTime + 0.08;
      this.step = 0;
      this.nextStepTime = this.startTime;
      this.events = [];
      this.timer = setInterval(() => this.scheduler(), 25);
    },

    stop() {
      this.playing = false;
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      this.events = [];
    },

    scheduler() {
      while (this.nextStepTime < this.ctx.currentTime + 0.15) {
        this.scheduleStep(this.step, this.nextStepTime);
        this.nextStepTime += 60 / state.bpm / 4;
        this.step = (this.step + 1) % 64;
      }
    },

    scheduleStep(step, t) {
      const bar = Math.floor(step / 16);
      const s = step % 16;
      const chord = CHORDS[bar];

      if (s % 4 === 0) {
        this.kick(t);
        this.events.push({ time: t, type: 'kick' });
        if (s === 0) this.events.push({ time: t, type: 'down' });
      }
      if (s === 4 || s === 12) {
        this.clap(t);
        this.events.push({ time: t, type: 'clap' });
      }
      if (s % 2 === 0) this.hat(t, s % 4 === 2 ? 0.85 : 0.4, false);
      if (s === 14) this.hat(t, 0.6, true);
      if (s === 0 || s === 8) this.bass(t, this.midi(chord.root), 0.5);
      if (s === 2 || s === 6 || s === 10 || s === 14) this.bass(t, this.midi(chord.root + 12), 0.32);
      if (s % 2 === 0) {
        const tones = chord.lead;
        this.lead(t, this.midi(tones[(s / 2 + bar) % tones.length]));
      }
      if (s === 0) this.pad(t, chord.pad, (60 / state.bpm) * 4);
      if (step === 0) this.crash(t);
    },

    kick(t) {
      const c = this.ctx;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
      g.gain.setValueAtTime(1.0, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.45);
    },

    hat(t, vel, open) {
      const c = this.ctx;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      const hp = c.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 7000;
      const g = c.createGain();
      const dur = open ? 0.28 : 0.05;
      g.gain.setValueAtTime(vel * 0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(hp); hp.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + dur + 0.02);
    },

    clap(t) {
      const c = this.ctx;
      for (let i = 0; i < 3; i++) {
        const src = c.createBufferSource();
        src.buffer = this.noiseBuf;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.4;
        const g = c.createGain();
        const tt = t + i * 0.012;
        g.gain.setValueAtTime(0.34, tt);
        g.gain.exponentialRampToValueAtTime(0.001, tt + 0.12);
        src.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(tt); src.stop(tt + 0.15);
      }
    },

    bass(t, freq, vel) {
      const c = this.ctx;
      const o = c.createOscillator(), o2 = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = freq;
      o2.type = 'sine'; o2.frequency.value = freq;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 8;
      lp.frequency.setValueAtTime(950, t);
      lp.frequency.exponentialRampToValueAtTime(180, t + 0.24);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      const g2 = c.createGain(); g2.gain.value = 0.55;
      o.connect(lp); o2.connect(g2); g2.connect(lp);
      lp.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.32);
      o2.start(t); o2.stop(t + 0.32);
    },

    lead(t, freq) {
      const c = this.ctx;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
      o.connect(g);
      g.connect(this.master);
      g.connect(this.delaySend);
      o.start(t); o.stop(t + 0.2);
    },

    pad(t, notes, dur) {
      const c = this.ctx;
      for (const m of notes) {
        const f = this.midi(m);
        for (const det of [-8, 8]) {
          const o = c.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
          const lp = c.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 1100;
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.045, t + 0.9);
          g.gain.setValueAtTime(0.045, t + Math.max(0.9, dur - 0.7));
          g.gain.linearRampToValueAtTime(0.0001, t + dur);
          o.connect(lp); lp.connect(g); g.connect(this.master);
          o.start(t); o.stop(t + dur + 0.05);
        }
      }
    },

    crash(t) {
      const c = this.ctx;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      const hp = c.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 5000;
      const g = c.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      src.connect(hp); hp.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + 1.15);
    },

    async enableMic() {
      this.init();
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.micStream = stream;
      const src = this.ctx.createMediaStreamSource(stream);
      this.micAnalyser = this.ctx.createAnalyser();
      this.micAnalyser.fftSize = 512;
      this.micAnalyser.smoothingTimeConstant = 0.55;
      this.micFreq = new Uint8Array(this.micAnalyser.frequencyBinCount);
      src.connect(this.micAnalyser);
    },

    disableMic() {
      if (this.micStream) {
        this.micStream.getTracks().forEach(tr => tr.stop());
        this.micStream = null;
        this.micAnalyser = null;
      }
    },
  };

  /* ================= Beat / level analysis ================= */
  let pulse = 0, flash = 0, beatTime = 0, lastBeatInt = -1, tGlobal = 0;
  let micAvg = 0, lastMicBeat = 0, micBeatCount = 0;

  function avg(arr, a, b) {
    let s = 0; let n = 0;
    for (let i = a; i < b && i < arr.length; i++) { s += arr[i]; n++; }
    return n ? s / n : 0;
  }

  function getLevels() {
    let bass, mid, high;
    if (state.mic && Audio.micAnalyser) {
      Audio.micAnalyser.getByteFrequencyData(Audio.micFreq);
      const f = Audio.micFreq;
      bass = avg(f, 1, 8) / 255;
      mid = avg(f, 8, 40) / 255;
      high = avg(f, 40, 120) / 255;
    } else if (Audio.playing && Audio.analyser) {
      Audio.analyser.getByteFrequencyData(Audio.freq);
      const f = Audio.freq;
      bass = avg(f, 0, 5) / 255;
      mid = avg(f, 5, 25) / 255;
      high = avg(f, 25, 80) / 255;
    } else {
      bass = 0.22 + pulse * 0.5;
      mid = 0.18 + pulse * 0.32;
      high = 0.14 + pulse * 0.22;
    }
    return { bass, mid, high, level: (bass + mid + high) / 3 };
  }

  function detectMicBeat() {
    if (!state.mic || !Audio.micAnalyser) return;
    Audio.micAnalyser.getByteFrequencyData(Audio.micFreq);
    let e = 0;
    for (let i = 1; i <= 6; i++) e += Audio.micFreq[i];
    e /= 6 * 255;
    micAvg = micAvg * 0.95 + e * 0.05;
    const now = performance.now();
    if (e > 0.10 && e > micAvg * 1.35 && now - lastMicBeat > 220) {
      lastMicBeat = now;
      micBeatCount++;
      pulse = 1;
      if (micBeatCount % 4 === 1) { flash = Math.max(flash, 0.7); spawnConfetti(); }
    }
  }

  /* ================= Patterns ================= */
  const PATTERNS = {
    pulse(i, N, t) {
      return { angle: Math.sin(t * 0.7 + i * 0.5) * 0.12, intensity: 0.45 + 0.55 * pulse };
    },
    wave(i, N, t) {
      return { angle: Math.sin(t * 1.3 + i * 0.55) * 0.78, intensity: 0.72 + 0.28 * pulse };
    },
    scan(i, N, t) {
      const p = (t * 0.4) % 2;
      const a = p < 1 ? p : 2 - p;
      return { angle: (a * 2 - 1) * 0.95, intensity: 0.85 };
    },
    strobe(i, N, t) {
      const on = (Math.floor(t * 14) % 3 === 0) || pulse > 0.75;
      return { angle: Math.sin(t * 0.6 + i * 0.4) * 0.3, intensity: on ? 1 : 0.06 };
    },
    chase(i, N, t, b) {
      const idx = (b * 2) % N;
      let d = Math.abs(i - idx); d = Math.min(d, N - d);
      const inten = d === 0 ? 1 : d === 1 ? 0.55 : 0.16;
      return { angle: Math.sin(t * 0.8 + i * 0.3) * 0.35, intensity: inten };
    },
    spiral(i, N, t) {
      return { angle: Math.sin(t * 1.5 + (i / N) * Math.PI * 2) * 0.85, intensity: 0.85 };
    },
    fan(i, N, t) {
      const c = i - (N - 1) / 2;
      const spread = 0.2 + 0.65 * Math.abs(Math.sin(t * 0.5));
      return { angle: (c / (N / 2)) * spread, intensity: 0.78 + 0.22 * pulse };
    },
    random(i) {
      return { angle: fixtures[i].targetAngle, intensity: 0.8 };
    },
  };
  const AUTO_SEQ = ['wave', 'scan', 'chase', 'spiral', 'pulse', 'fan', 'random', 'strobe'];

  function activePattern() {
    if (state.pattern === 'auto') {
      const len = AUTO_SEQ.length;
      return AUTO_SEQ[(((Math.floor(beatTime / 8) % len) + len) % len)];
    }
    return state.pattern;
  }

  function fixtureHue(i, t) {
    const mode = state.colorMode;
    if (mode === 'rainbow') return (t * 60 + i * 32) % 360;
    if (mode === 'custom') return (state.customHue + Math.sin(t * 0.5 + i * 0.7) * 14 + 360) % 360;
    const hues = PALETTES[mode] || PALETTES.neon;
    return hues[((i + Math.floor(t * 0.4)) % hues.length + hues.length) % hues.length];
  }

  function averageHue() {
    let x = 0, y = 0;
    for (const f of fixtures) {
      const r = f.hue * Math.PI / 180;
      x += Math.cos(r); y += Math.sin(r);
    }
    let a = Math.atan2(y, x) * 180 / Math.PI;
    if (a < 0) a += 360;
    return a;
  }

  /* ================= Confetti ================= */
  function spawnConfetti() {
    for (let i = 0; i < 42; i++) {
      confetti.push({
        x: W * (0.15 + Math.random() * 0.7),
        y: H * 0.04,
        vx: (Math.random() * 2 - 1) * 130,
        vy: -40 - Math.random() * 110,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() * 2 - 1) * 9,
        hue: Math.random() * 360,
        size: 4 + Math.random() * 5,
        life: 0,
        maxLife: 2.4 + Math.random() * 1.6,
      });
    }
    if (confetti.length > 420) confetti.splice(0, confetti.length - 420);
  }

  function updateConfetti(dt) {
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.life += dt;
      if (c.life > c.maxLife || c.y > H + 24) { confetti.splice(i, 1); continue; }
      c.vy += 230 * dt;
      c.vx *= 0.992;
      c.x += c.vx * dt + Math.sin(c.life * 8 + c.rot) * 0.7;
      c.y += c.vy * dt;
      c.rot += c.vr * dt;
      const alpha = Math.max(0, 1 - c.life / c.maxLife);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = `hsla(${c.hue}, 92%, 66%, ${alpha})`;
      ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.62);
      ctx.restore();
    }
  }

  /* ================= Drawing ================= */
  function beamQuad(x, y, ex, ey, px, py, halfW, hue, alpha, light) {
    const x1 = ex - px * halfW, y1 = ey - py * halfW;
    const x2 = ex + px * halfW, y2 = ey + py * halfW;
    const grad = ctx.createLinearGradient(x, y, ex, ey);
    grad.addColorStop(0, `hsla(${hue}, 100%, ${light}%, ${alpha})`);
    grad.addColorStop(0.3, `hsla(${hue}, 100%, ${light}%, ${alpha * 0.65})`);
    grad.addColorStop(1, `hsla(${hue}, 100%, ${light}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
  }

  function drawBeam(f) {
    const floorY = H * FLOOR_FRAC;
    const cosA = Math.max(0.25, Math.cos(f.angle));
    const len = (floorY - f.y) / cosA;
    const spread = 0.17;
    const dx = Math.sin(f.angle), dy = Math.cos(f.angle);
    const px = -dy, py = dx;
    const halfW = Math.tan(spread / 2) * len;
    const ex = f.x + dx * len, ey = f.y + dy * len;
    const a = f.intensity * state.intensity;
    if (a < 0.012) return;

    beamQuad(f.x, f.y, ex, ey, px, py, halfW, f.hue, 0.13 * a + 0.02, 62);
    beamQuad(f.x, f.y, ex, ey, px, py, halfW * 0.34, f.hue, 0.24 * a + 0.03, 80);

    const gr = 13 + f.intensity * 11;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, gr);
    g.addColorStop(0, `hsla(${f.hue}, 100%, 82%, ${0.45 * a + 0.2})`);
    g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, gr, 0, Math.PI * 2); ctx.fill();

    const spotR = halfW * 1.25;
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, spotR);
    sg.addColorStop(0, `hsla(${f.hue}, 100%, 70%, ${0.3 * a})`);
    sg.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(1, 0.28);
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, spotR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTruss() {
    const y = H * 0.10;
    const x0 = fixtures[0].x - 22, x1 = fixtures[fixtures.length - 1].x + 22;
    ctx.fillStyle = '#12142a';
    ctx.fillRect(x0, y - 9, x1 - x0, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(x0, y - 9, x1 - x0, 1.5);
    for (const f of fixtures) {
      ctx.fillStyle = '#1b1e38';
      ctx.fillRect(f.x - 5, y - 9, 10, 11);
    }
  }

  function drawHaze(hue) {
    for (const hz of haze) {
      hz.x += hz.vx * 0.016;
      if (hz.x < -0.25) hz.x = 1.25;
      if (hz.x > 1.25) hz.x = -0.25;
      const x = hz.x * W;
      const y = hz.y * H + Math.sin(tGlobal * 0.3 + hz.phase) * 22;
      const r = hz.r * (1 + pulse * 0.35);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${hue}, 70%, 60%, ${0.028 + pulse * 0.035})`);
      g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawLasers(hue) {
    const lh = (hue + 150) % 360;
    ctx.lineCap = 'round';
    for (const L of lasers) {
      for (let k = 0; k < 5; k++) {
        const ang = Math.sin(tGlobal * 1.1 + k * 0.7 + (L.dir > 0 ? 0 : Math.PI)) * 0.72 * L.dir;
        const dx = Math.sin(ang), dy = Math.cos(ang);
        const len = Math.max(W, H) * 1.25;
        const ex = L.x + dx * len, ey = L.y + dy * len;
        ctx.strokeStyle = `hsla(${lh}, 100%, 60%, 0.30)`;
        ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.strokeStyle = `hsla(${lh}, 100%, 85%, 0.65)`;
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(ex, ey); ctx.stroke();
      }
    }
  }

  function drawCrowd(hue) {
    for (const p of crowd) {
      const x = p.x * W;
      const bob = (Math.sin(tGlobal * 2.2 + p.phase) * 2.5 + pulse * 6.5) * p.bob;
      const s = p.size;
      const bodyH = s * 2.3;
      const topY = H - bodyH - bob;
      const headR = s * 0.55;
      const col = `hsla(${hue}, 45%, 5%, 0.96)`;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(x, H - bodyH * 0.42, s * 0.78, bodyH * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, topY - headR * 0.75, headR, 0, Math.PI * 2);
      ctx.fill();
      if (p.armUp) {
        ctx.strokeStyle = col;
        ctx.lineWidth = s * 0.3;
        ctx.lineCap = 'round';
        const wave = Math.sin(tGlobal * 3.2 + p.phase) * s * 0.45;
        ctx.beginPath();
        ctx.moveTo(x + s * 0.55, topY + s * 0.5);
        ctx.lineTo(x + s * 0.55 + s * 0.75 + wave * 0.3, topY - s * 1.7 - bob * 0.6);
        ctx.stroke();
      }
    }
  }

  function draw(lv, dt) {
    const hue = averageHue();
    const floorY = H * FLOOR_FRAC;

    ctx.globalCompositeOperation = 'source-over';
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#04050d');
    bg.addColorStop(0.55, '#0a0718');
    bg.addColorStop(1, '#0e0a1e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawTruss();

    ctx.globalCompositeOperation = 'lighter';

    let g = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, W * 0.55);
    g.addColorStop(0, `hsla(${hue}, 85%, 55%, ${0.04 + lv.level * 0.10})`);
    g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    g = ctx.createLinearGradient(0, floorY - 50, 0, H);
    g.addColorStop(0, 'hsla(0, 0%, 0%, 0)');
    g.addColorStop(1, `hsla(${hue}, 90%, 55%, ${0.14 + lv.bass * 0.35})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, floorY - 50, W, H - floorY + 50);

    drawHaze(hue);
    if (state.lasers) drawLasers(hue);
    for (const f of fixtures) drawBeam(f);
    updateConfetti(dt);

    ctx.globalCompositeOperation = 'source-over';
    drawCrowd(hue);

    if (flash > 0.012) {
      ctx.fillStyle = `hsla(${hue}, 60%, 92%, ${flash * 0.26})`;
      ctx.fillRect(0, 0, W, H);
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ================= Beat handling ================= */
  function onBeat(b) {
    const isDown = b % 4 === 0;
    if (!Audio.playing && !state.mic) {
      pulse = Math.max(pulse, isDown ? 0.8 : 0.45);
      if (isDown) { flash = Math.max(flash, 0.45); spawnConfetti(); }
    }
    if (activePattern() === 'random') {
      for (const f of fixtures) f.targetAngle = (Math.random() * 2 - 1) * 0.9;
    }
  }

  /* ================= Main loop ================= */
  const statusLabel = document.getElementById('statusLabel');
  const beatDots = [...document.querySelectorAll('.bdot')];
  const PATTERN_NAMES = { auto: 'Auto', pulse: 'Pulse', wave: 'Wave', scan: 'Scan', strobe: 'Strobe', chase: 'Chase', spiral: 'Spiral', fan: 'Fan', random: 'Random' };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    tGlobal += dt * state.speed;

    if (Audio.playing && Audio.ctx) {
      beatTime = (Audio.ctx.currentTime - Audio.startTime) * (state.bpm / 60);
    } else {
      beatTime += dt * (state.bpm / 60);
    }
    const beatInt = Math.floor(beatTime);
    if (beatInt !== lastBeatInt) { lastBeatInt = beatInt; onBeat(beatInt); }

    if (Audio.playing && Audio.ctx) {
      const nowA = Audio.ctx.currentTime;
      while (Audio.events.length && Audio.events[0].time <= nowA) {
        const e = Audio.events.shift();
        if (e.type === 'kick') pulse = 1;
        else if (e.type === 'down') { flash = 1; spawnConfetti(); }
        else if (e.type === 'clap') pulse = Math.max(pulse, 0.7);
      }
    }

    detectMicBeat();
    const lv = getLevels();

    pulse *= Math.exp(-dt * 5);
    flash *= Math.exp(-dt * 11);

    const ap = activePattern();
    const pf = PATTERNS[ap];
    for (let i = 0; i < fixtures.length; i++) {
      const f = fixtures[i];
      const r = pf(i, fixtures.length, tGlobal, beatInt);
      f.targetAngle = r.angle;
      f.intensity = r.intensity;
      f.angle += (f.targetAngle - f.angle) * Math.min(1, dt * 6);
      f.hue = fixtureHue(i, tGlobal);
    }

    draw(lv, dt);

    statusLabel.textContent = `${PATTERN_NAMES[state.pattern]} · ${state.bpm} BPM`;
    const inBar = ((beatInt % 4) + 4) % 4;
    for (let i = 0; i < 4; i++) beatDots[i].classList.toggle('on', i === inBar);

    requestAnimationFrame(frame);
  }

  /* ================= UI wiring ================= */
  const $ = id => document.getElementById(id);
  const playBtn = $('playBtn'), playLabel = $('playLabel'), playIcon = $('playIcon');
  const bpmSlider = $('bpm'), bpmVal = $('bpmVal');
  const speedSlider = $('speed'), speedVal = $('speedVal');
  const intensitySlider = $('intensity'), intensityVal = $('intensityVal');
  const micBtn = $('micBtn'), laserBtn = $('laserBtn');
  const patternChips = $('patternChips'), colorChips = $('colorChips');
  const customColor = $('customColor');
  const toast = $('toast');

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function setPlayIcon(playing) {
    playIcon.innerHTML = playing
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M7 5l12 7-12 7z"/>';
  }

  playBtn.addEventListener('click', async () => {
    try {
      if (Audio.playing) {
        Audio.stop();
        playBtn.classList.remove('playing');
        playLabel.textContent = 'Play Music';
        setPlayIcon(false);
        showToast('Music stopped — lights keep dancing');
      } else {
        await Audio.start();
        playBtn.classList.add('playing');
        playLabel.textContent = 'Stop Music';
        setPlayIcon(true);
        showToast('Music on — lights are synced to the beat');
      }
    } catch (err) {
      showToast('Audio could not start');
    }
  });

  bpmSlider.addEventListener('input', () => {
    const v = parseInt(bpmSlider.value, 10);
    bpmVal.textContent = v;
    Audio.setBpm(v);
  });
  speedSlider.addEventListener('input', () => {
    state.speed = parseFloat(speedSlider.value);
    speedVal.textContent = state.speed.toFixed(1) + 'x';
  });
  intensitySlider.addEventListener('input', () => {
    state.intensity = parseFloat(intensitySlider.value);
    intensityVal.textContent = Math.round(state.intensity * 100) + '%';
  });

  micBtn.addEventListener('click', async () => {
    if (state.mic) {
      state.mic = false;
      Audio.disableMic();
      micBtn.classList.remove('active');
      showToast('Mic sync off');
    } else {
      try {
        await Audio.enableMic();
        state.mic = true;
        micBtn.classList.add('active');
        showToast('Mic sync on — lights follow your audio');
      } catch (err) {
        showToast('Microphone access denied');
      }
    }
  });

  laserBtn.addEventListener('click', () => {
    state.lasers = !state.lasers;
    laserBtn.classList.toggle('active', state.lasers);
  });

  patternChips.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state.pattern = btn.dataset.pattern;
    [...patternChips.children].forEach(c => c.classList.toggle('active', c === btn));
  });

  colorChips.addEventListener('click', e => {
    const btn = e.target.closest('.swatch');
    if (!btn) return;
    state.colorMode = btn.dataset.color;
    [...colorChips.querySelectorAll('.swatch')].forEach(c => c.classList.toggle('active', c === btn));
  });

  customColor.addEventListener('input', () => {
    state.colorMode = 'custom';
    state.customHue = hexToHue(customColor.value);
    [...colorChips.querySelectorAll('.swatch')].forEach(c => c.classList.remove('active'));
  });

  function hexToHue(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0;
    const d = max - min;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return h;
  }

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    else if (e.key >= '1' && e.key <= '9') {
      const chips = [...patternChips.children];
      const idx = parseInt(e.key, 10) - 1;
      if (chips[idx]) chips[idx].click();
    }
    else if (e.key === 'm' || e.key === 'M') micBtn.click();
    else if (e.key === 'l' || e.key === 'L') laserBtn.click();
    else if (e.key === 'r' || e.key === 'R') {
      const modes = ['rainbow', 'neon', 'sunset', 'ocean', 'fire', 'ice', 'candy'];
      const next = modes[(modes.indexOf(state.colorMode) + 1) % modes.length];
      const btn = [...colorChips.querySelectorAll('.swatch')].find(c => c.dataset.color === next);
      if (btn) btn.click();
    }
  });

  /* ================= Boot ================= */
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
