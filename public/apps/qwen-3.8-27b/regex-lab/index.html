<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d131b">
<title>regex-lab — pattern playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d131b'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%234af626' text-anchor='middle'%3E.*%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('regexlab-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root, [data-theme="dark"] {
  --bg: #0a0e14;
  --bg-glow: #111b28;
  --window: #0d131b;
  --panel: #101823;
  --panel-2: #0b111a;
  --border: #1d2938;
  --border-soft: #16202d;
  --fg: #c5d1de;
  --fg-bright: #e8eef5;
  --fg-dim: #5a6b7f;
  --accent: #4af626;
  --accent-soft: rgba(74, 246, 38, .12);
  --accent-glow: rgba(74, 246, 38, .28);
  --green: #4af626;
  --red: #f7768e;
  --amber: #e0af68;
  --cyan: #56d4dd;
  --magenta: #c792ea;
  --blue: #7aa2f7;
  --orange: #ff9e64;
  --teal: #73daca;
  --g1: #56d4dd;
  --g2: #c792ea;
  --g3: #e0af68;
  --g4: #7aa2f7;
  --g5: #ff9e64;
  --g6: #4af626;
  --g7: #f7768e;
  --g8: #73daca;
  --hit-bg: rgba(74, 246, 38, .09);
  --hit-line: rgba(74, 246, 38, .8);
  --err-bg: rgba(247, 118, 142, .07);
  --err-border: rgba(247, 118, 142, .4);
  --shadow: 0 30px 90px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .45);
  --inset: inset 0 1px 0 rgba(255, 255, 255, .03);
  --scanline: rgba(255, 255, 255, .015);
}
[data-theme="light"] {
  --bg: #d8dee6;
  --bg-glow: #eef2f7;
  --window: #f6f8fb;
  --panel: #ffffff;
  --panel-2: #eef1f6;
  --border: #cfd8e3;
  --border-soft: #dfe6ee;
  --fg: #333d4a;
  --fg-bright: #161c24;
  --fg-dim: #75818f;
  --accent: #1a7f37;
  --accent-soft: rgba(26, 127, 55, .1);
  --accent-glow: rgba(26, 127, 55, .2);
  --green: #1a7f37;
  --red: #cf222e;
  --amber: #9a6700;
  --cyan: #0969da;
  --magenta: #8250df;
  --blue: #0550ae;
  --orange: #bc4c00;
  --teal: #1b7c83;
  --g1: #0b7285;
  --g2: #6741d9;
  --g3: #9a6700;
  --g4: #0550ae;
  --g5: #bc4c00;
  --g6: #1a7f37;
  --g7: #cf222e;
  --g8: #1b7c83;
  --hit-bg: rgba(26, 127, 55, .09);
  --hit-line: rgba(26, 127, 55, .65);
  --err-bg: rgba(207, 34, 46, .05);
  --err-border: rgba(207, 34, 46, .35);
  --shadow: 0 30px 70px rgba(30, 45, 70, .16), 0 4px 14px rgba(30, 45, 70, .1);
  --inset: inset 0 1px 0 rgba(255, 255, 255, .7);
  --scanline: transparent;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, "Cascadia Code", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg);
  background: radial-gradient(1200px 800px at 50% -10%, var(--bg-glow), var(--bg));
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(86, 212, 221, .28); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--window); }
::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#pattern:focus-visible, #text:focus-visible { outline: none; }

.app { min-height: 100%; display: flex; justify-content: center; padding: 20px; }
.window {
  position: relative;
  width: 100%;
  max-width: 1480px;
  height: calc(100vh - 40px);
  height: calc(100dvh - 40px);
  min-height: 560px;
  display: flex;
  flex-direction: column;
  background: var(--window);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow), var(--inset);
  overflow: hidden;
}
.window::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
  border-radius: inherit;
  z-index: 50;
}
.titlebar, .main, .statusbar { position: relative; z-index: 1; }

.titlebar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 46px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-2);
}
.dots { display: flex; gap: 8px; flex: none; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #ff5f56; }
.dot.y { background: #ffbd2e; }
.dot.g { background: #27c93f; }
.title {
  font-size: 12.5px;
  color: var(--fg-dim);
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.title .cursor { color: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.title-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }
.tbtn {
  font: inherit;
  font-size: 11.5px;
  color: var(--fg-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
  white-space: nowrap;
}
.tbtn:hover { color: var(--fg-bright); border-color: var(--fg-dim); }

.main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(340px, 5fr) 6fr;
}
.col { min-height: 0; display: flex; flex-direction: column; }
.col-input { border-right: 1px solid var(--border); }
.section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.section.grow { flex: 1; min-height: 140px; }
.section-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--fg-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::before { content: "❯"; color: var(--accent); }
.text-count { text-transform: none; letter-spacing: .05em; opacity: .75; }

.pattern-row {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  transition: border-color .15s, box-shadow .15s;
}
.pattern-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.slash { color: var(--fg-dim); font-size: 16px; flex: none; }
#pattern {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--fg-bright);
  font: inherit;
  font-size: 15px;
  caret-color: var(--accent);
}
#pattern::placeholder { color: var(--fg-dim); opacity: .6; }
.flags-display { color: var(--accent); font-size: 13px; min-width: 3ch; text-align: right; flex: none; }

.pattern-error {
  font-size: 12px;
  background: var(--err-bg);
  border: 1px solid var(--err-border);
  border-radius: 8px;
  padding: 8px 12px;
}
.err-msg { color: var(--red); }
.err-line { white-space: pre; }
.err-caret-ch { color: var(--red); font-weight: 700; }

.flags { display: flex; gap: 8px; flex-wrap: wrap; }
.flag {
  width: 36px;
  height: 34px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--fg-dim);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s, box-shadow .15s;
}
.flag:hover { color: var(--fg-bright); border-color: var(--fg-dim); }
.flag.on {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 12px var(--accent-glow);
}

.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tok-label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--fg-dim);
  margin: 2px 2px 2px 8px;
  user-select: none;
}
.tok-label:first-child { margin-left: 0; }
.tok-btn {
  font: inherit;
  font-size: 11.5px;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .12s, border-color .12s, transform .12s;
}
.tok-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
.tok-btn:active { transform: translateY(0); }

#text {
  flex: 1;
  min-height: 100px;
  resize: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font: inherit;
  font-size: 13.5px;
  line-height: 1.65;
  padding: 10px 12px;
  outline: none;
  caret-color: var(--accent);
  transition: border-color .15s, box-shadow .15s;
}
#text:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#text::placeholder { color: var(--fg-dim); opacity: .6; }

.tabs {
  flex: none;
  display: flex;
  gap: 4px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-2);
}
.tab {
  font: inherit;
  font-size: 12px;
  color: var(--fg-dim);
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 12px 12px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.badge {
  font-size: 10px;
  min-width: 18px;
  text-align: center;
  background: var(--border);
  color: var(--fg-dim);
  border-radius: 9px;
  padding: 1px 5px;
}
.tab.active .badge { background: var(--accent-soft); color: var(--accent); }
.tab-body { flex: 1; overflow: auto; min-height: 0; padding: 14px 16px; }
.tab-body[hidden] { display: none; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 10px; font-size: 11.5px; }
.legend:empty { display: none; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend-item code {
  color: var(--fg-dim);
  background: var(--panel);
  border: 1px solid var(--border-soft);
  padding: 0 5px;
  border-radius: 4px;
  font-size: 11px;
}
.hint { font-size: 11.5px; color: var(--amber); margin-bottom: 10px; line-height: 1.6; }

.highlight {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--fg);
}
.hit {
  background: var(--hit-bg);
  box-shadow: inset 0 -2px 0 var(--hit-line);
  border-radius: 3px;
}
.grp {
  border-radius: 2px;
  background: rgba(128, 140, 160, .14);
  box-shadow: inset 0 -2px 0 var(--gc, var(--fg-dim));
}
@supports (background: color-mix(in srgb, red 10%, transparent)) {
  .grp { background: color-mix(in srgb, var(--gc, transparent) 16%, transparent); }
}
.zero-hit {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  background: var(--hit-line);
  vertical-align: text-bottom;
  margin: 0 1px;
  border-radius: 1px;
}
.zero-mark {
  display: inline-block;
  width: 2px;
  height: .85em;
  margin: 0 1px;
  vertical-align: text-bottom;
  border-radius: 1px;
}
.zero { color: var(--fg-dim); }
.dim { color: var(--fg-dim); }

.table-wrap { overflow: auto; max-height: 100%; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border-soft);
  text-align: left;
  white-space: nowrap;
}
th {
  position: sticky;
  top: 0;
  background: var(--panel);
  color: var(--fg-dim);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  z-index: 1;
}
tbody tr:hover td { background: var(--accent-soft); }
tfoot td { color: var(--fg-dim); font-size: 11px; }

.explain-summary { font-size: 11px; margin-bottom: 10px; }
.explain-map {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.chip {
  font-size: 12.5px;
  padding: 2px 7px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  white-space: pre;
}
.chip sup { font-size: 9px; color: var(--fg-dim); margin-right: 4px; }
.explain-row {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 6px 2px;
  border-bottom: 1px dashed var(--border-soft);
  font-size: 12.5px;
}
.explain-row .num { color: var(--fg-dim); font-size: 10px; min-width: 18px; text-align: right; flex: none; }
.explain-row .tok { font-weight: 600; white-space: pre; flex: none; }
.explain-row .desc { color: var(--fg-dim); }
.explain-flags { margin-top: 16px; display: flex; flex-direction: column; gap: 2px; }
.flag-row { font-size: 12.5px; padding: 4px 0; }

.statusbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 14px;
  border-top: 1px solid var(--border);
  background: var(--panel-2);
  font-size: 11px;
  color: var(--fg-dim);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  flex: none;
  transition: background .2s, box-shadow .2s;
}
.status-dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
.status-dot.idle { background: var(--fg-dim); box-shadow: none; }
#status-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-right { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.toast {
  position: absolute;
  bottom: 46px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--panel);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 12px;
  padding: 7px 14px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 60;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 920px) {
  .app { padding: 0; }
  .window { height: 100vh; height: 100dvh; min-height: 0; border-radius: 0; border: 0; }
  .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 46fr) minmax(0, 54fr); }
  .col-input { border-right: 0; border-bottom: 1px solid var(--border); overflow: auto; }
  .section.grow { min-height: 120px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="title">regex-lab — ~/playground <span class="cursor">▮</span></div>
      <div class="title-actions">
        <button type="button" class="tbtn" id="btn-copy" title="Copy permalink (⌘/Ctrl+Enter)">⧉ copy link</button>
        <button type="button" class="tbtn" id="btn-clear" title="Clear pattern, flags and text (⌘/Ctrl+K)">⌫ clear</button>
        <button type="button" class="tbtn" id="btn-theme" title="Toggle light/dark theme">◐ dark</button>
      </div>
    </div>
    <div class="main">
      <section class="col col-input">
        <div class="section">
          <div class="section-label">pattern</div>
          <div class="pattern-row">
            <span class="slash">/</span>
            <input id="pattern" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="type a pattern…" aria-label="Regular expression pattern">
            <span class="slash">/</span>
            <span class="flags-display" id="flags-display" aria-hidden="true"></span>
          </div>
          <div id="pattern-error" class="pattern-error" hidden></div>
        </div>
        <div class="section">
          <div class="section-label">flags</div>
          <div class="flags" id="flags"></div>
        </div>
        <div class="section">
          <div class="section-label">insert token</div>
          <div class="tokens" id="tokens"></div>
        </div>
        <div class="section grow">
          <div class="section-label">test text <span class="text-count" id="text-count"></span></div>
          <textarea id="text" spellcheck="false" placeholder="paste text to test against…" aria-label="Test text"></textarea>
        </div>
      </section>
      <section class="col col-output">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="matches" role="tab" aria-selected="true">matches <span class="badge" id="badge-matches">0</span></button>
          <button type="button" class="tab" data-tab="table" role="tab" aria-selected="false">table <span class="badge" id="badge-table">0</span></button>
          <button type="button" class="tab" data-tab="explain" role="tab" aria-selected="false">explain</button>
        </div>
        <div class="tab-body" id="tab-matches" role="tabpanel">
          <div class="legend" id="group-legend"></div>
          <div class="hint" id="hint" hidden></div>
          <pre class="highlight" id="highlight"></pre>
        </div>
        <div class="tab-body" id="tab-table" role="tabpanel" hidden>
          <div class="table-wrap"><table id="match-table"></table></div>
        </div>
        <div class="tab-body" id="tab-explain" role="tabpanel" hidden>
          <div id="explain"></div>
        </div>
      </section>
    </div>
    <div class="statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-msg" aria-live="polite">ready</span>
      <span class="status-right" id="status-right"></span>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
'use strict';

const FLAG_ORDER = ['g', 'i', 'm', 's', 'u', 'y'];
const FLAG_INFO = {
  g: ['global', 'find all matches, not just the first'],
  i: ['ignore case', 'a matches A, b matches B, and so on'],
  m: ['multiline', '^ and $ match line starts/ends, not just string ends'],
  s: ['dotAll', '. also matches newline characters'],
  u: ['unicode', 'treat pattern as unicode code points; enables \\p{…}'],
  y: ['sticky', 'match only at lastIndex (anchored position)'],
};

const ESCAPES = {
  d: 'digit — matches 0–9',
  D: 'non-digit — anything except 0–9',
  w: 'word character — a–z, A–Z, 0–9, _',
  W: 'non-word character',
  s: 'whitespace — space, tab, newline, …',
  S: 'non-whitespace',
  b: 'word boundary — position between word and non-word',
  B: 'non-word boundary',
  n: 'newline character',
  r: 'carriage return',
  t: 'tab character',
  v: 'vertical tab',
  f: 'form feed',
  0: 'null character',
  c: 'control character — \\cX (e.g. \\cM = CR)',
};

const CLASS_ESC = { d: 'digit', D: 'non-digit', w: 'word', W: 'non-word', s: 'whitespace', S: 'non-whitespace', b: 'backspace', n: 'newline', r: 'CR', t: 'tab', f: 'FF', v: 'VT', 0: 'NUL' };

const PROPS = {
  L: 'letter', Ll: 'lowercase letter', Lu: 'uppercase letter', Lt: 'titlecase letter', Lm: 'modifier letter', Lo: 'other letter',
  N: 'number', Nd: 'decimal digit', Nl: 'letter number', No: 'other number',
  M: 'mark', Pc: 'connector punctuation', Pd: 'dash punctuation', Ps: 'open punctuation', Pe: 'close punctuation', Pi: 'initial punctuation', Pf: 'final punctuation', Po: 'other punctuation',
  P: 'punctuation', S: 'symbol', Sc: 'currency symbol', Sk: 'modifier symbol', Sm: 'math symbol', So: 'other symbol',
  Z: 'separator', Zs: 'space separator', Zl: 'line separator', Zp: 'paragraph separator',
  C: 'other', Cc: 'control', Cf: 'format', Cs: 'surrogate', Co: 'private use', Cn: 'unassigned',
  Alphabetic: 'alphabetic', White_Space: 'whitespace', Digit: 'digit', Emoji: 'emoji', ID_Continue: 'identifier character',
};

const KIND_COLOR = {
  literal: 'var(--fg)',
  escape: 'var(--cyan)',
  class: 'var(--cyan)',
  group: 'var(--magenta)',
  quant: 'var(--amber)',
  anchor: 'var(--green)',
  dot: 'var(--blue)',
  alt: 'var(--red)',
};

const groupVar = (i) => 'var(--g' + (((i - 1) % 8) + 1) + ')';

const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

const cellText = (s) => esc(s).replace(/\n/g, '␊').replace(/\r/g, '␍').replace(/\t/g, '⇥');

function describeProp(inner) {
  const neg = inner.startsWith('^');
  const name = neg ? inner.slice(1) : inner;
  const base = PROPS[name] || name;
  return 'unicode property: ' + (neg ? 'not ' : '') + base;
}

function quantDesc(q, lazy) {
  const base = { '*': 'zero or more', '+': 'one or more', '?': 'zero or one' }[q];
  return base + ' (' + (lazy ? 'lazy — matches as few as possible' : 'greedy — matches as many as possible') + ')';
}

function braceDesc(m, lazy) {
  const a = m[1], b = m[3];
  const s = m[2] === undefined ? 'exactly ' + a + ' times' : (b === undefined ? a + ' or more times' : 'between ' + a + ' and ' + b + ' times');
  return s + ' (' + (lazy ? 'lazy' : 'greedy') + ')';
}

function describeClass(body) {
  const neg = body.startsWith('^');
  let rest = neg ? body.slice(1) : body;
  if (rest.startsWith(']')) rest = rest.slice(1);
  const parts = [];
  let i = 0;
  while (i < rest.length) {
    const c = rest[i];
    if (c === '\\' && rest[i + 1] !== undefined) {
      parts.push(CLASS_ESC[rest[i + 1]] || rest[i + 1]);
      i += 2;
      continue;
    }
    if (rest[i + 1] === '-' && rest[i + 2] !== undefined && rest[i + 2] !== ']') {
      parts.push(c + '–' + rest[i + 2]);
      i += 3;
      continue;
    }
    parts.push(c === ' ' ? '␣' : c);
    i++;
  }
  const list = parts.length ? parts.join(', ') : '∅';
  return (neg ? 'matches any character NOT in { ' : 'matches any one of { ') + list + ' }';
}

function tokenizePattern(src, flags) {
  const tokens = [];
  const groups = [];
  const stack = [];
  let groupCounter = 0;
  let i = 0;
  const n = src.length;
  let quantifiable = false;
  const push = (text, kind, desc) => tokens.push({ text, kind, desc, n: tokens.length + 1 });

  while (i < n) {
    const c = src[i];
    if (c === '\\') {
      const nx = src[i + 1];
      if (nx === undefined) {
        push('\\', 'escape', 'trailing backslash — invalid');
        i++; quantifiable = false; continue;
      }
      if ((nx === 'p' || nx === 'P') && src[i + 2] === '{') {
        const close = src.indexOf('}', i + 3);
        if (close !== -1) {
          let desc = describeProp(src.slice(i + 3, close));
          if (!flags.includes('u')) desc += ' (needs u flag — without it this matches literally)';
          push(src.slice(i, close + 1), 'escape', desc);
          i = close + 1; quantifiable = true; continue;
        }
      }
      if (nx === 'k' && src[i + 2] === '<') {
        const close = src.indexOf('>', i + 3);
        if (close !== -1) {
          push(src.slice(i, close + 1), 'escape', 'backreference — repeats group "' + src.slice(i + 3, close) + '"');
          i = close + 1; quantifiable = true; continue;
        }
      }
      if (nx === 'x' && /^[0-9a-fA-F]{2}/.test(src.slice(i + 2))) {
        const hex = src.slice(i + 2, i + 4);
        push('\\x' + hex, 'escape', 'character U+00' + hex.toUpperCase());
        i += 4; quantifiable = true; continue;
      }
      if (nx === 'u' && src[i + 3] === '{') {
        const close = src.indexOf('}', i + 4);
        if (close !== -1) {
          push(src.slice(i, close + 1), 'escape', 'code point U+' + src.slice(i + 4, close));
          i = close + 1; quantifiable = true; continue;
        }
      }
      if (nx === 'u' && /^[0-9a-fA-F]{4}/.test(src.slice(i + 2))) {
        const hex = src.slice(i + 2, i + 6);
        push('\\u' + hex, 'escape', 'character U+' + hex.toUpperCase());
        i += 6; quantifiable = true; continue;
      }
      if (/[1-9]/.test(nx)) {
        push('\\' + nx, 'escape', 'backreference — repeats group ' + nx);
        i += 2; quantifiable = true; continue;
      }
      const e = ESCAPES[nx];
      if (e) {
        push('\\' + nx, 'escape', e);
        i += 2; quantifiable = true; continue;
      }
      push('\\' + nx, 'escape', 'literal ' + (nx === ' ' ? 'space' : nx));
      i += 2; quantifiable = true; continue;
    }
    if (c === '[') {
      let j = i + 1;
      if (src[j] === '^') j++;
      if (src[j] === ']') j++;
      let closed = -1;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src[j] === ']') { closed = j; break; }
        j++;
      }
      if (closed === -1) {
        push(src.slice(i), 'class', 'unterminated character class — invalid');
        i = n; quantifiable = false; continue;
      }
      push(src.slice(i, closed + 1), 'class', describeClass(src.slice(i + 1, closed)));
      i = closed + 1; quantifiable = true; continue;
    }
    if (c === '(') {
      let label = '(', desc = 'capturing group — remembers the matched text', adv = 1, name = null;
      if (src[i + 1] === '?') {
        const t = src[i + 2];
        if (t === ':') { label = '(?:'; desc = 'non-capturing group — groups without saving'; adv = 3; }
        else if (t === '=') { label = '(?='; desc = 'positive lookahead — asserts what follows, without consuming'; adv = 3; }
        else if (t === '!') { label = '(?!'; desc = 'negative lookahead — asserts what does NOT follow'; adv = 3; }
        else if (t === '<') {
          if (src[i + 3] === '=') { label = '(?<='; desc = 'positive lookbehind — asserts what precedes'; adv = 4; }
          else if (src[i + 3] === '!') { label = '(?<!'; desc = 'negative lookbehind — asserts what does NOT precede'; adv = 4; }
          else {
            const close = src.indexOf('>', i + 3);
            if (close !== -1) {
              name = src.slice(i + 3, close);
              label = src.slice(i, close + 1);
              desc = 'named capturing group "' + name + '"';
              adv = close + 1 - i;
            }
          }
        }
      }
      groupCounter++;
      stack.push({ start: i, name, num: groupCounter });
      push(label, 'group', desc);
      i += adv;
      quantifiable = false;
      continue;
    }
    if (c === ')') {
      const g = stack.pop();
      if (g) groups[g.num - 1] = { source: src.slice(g.start + 1, i), name: g.name };
      push(')', 'group', 'end of group');
      i++; quantifiable = true; continue;
    }
    if (c === '*' || c === '+' || c === '?') {
      const lazy = src[i + 1] === '?';
      push(src.slice(i, i + (lazy ? 2 : 1)), 'quant', quantDesc(c, lazy));
      i += lazy ? 2 : 1;
      quantifiable = false;
      continue;
    }
    if (c === '{') {
      const m = /^\{(\d+)(,(\d+)?)?\}/.exec(src.slice(i));
      if (m && quantifiable) {
        let j = i + m[0].length;
        let lazy = false;
        if (src[j] === '?') { lazy = true; j++; }
        push(src.slice(i, j), 'quant', braceDesc(m, lazy));
        i = j; quantifiable = false; continue;
      }
      push('{', 'literal', 'literal "{"');
      i++; quantifiable = true; continue;
    }
    if (c === '^') { push('^', 'anchor', 'start of string — or start of line with m flag'); i++; quantifiable = false; continue; }
    if (c === '$') { push('$', 'anchor', 'end of string — or end of line with m flag'); i++; quantifiable = false; continue; }
    if (c === '.') { push('.', 'dot', 'any character except newline — with s flag, matches everything'); i++; quantifiable = true; continue; }
    if (c === '|') { push('|', 'alt', 'alternation — match the left OR right side'); i++; quantifiable = false; continue; }
    push(c, 'literal', 'literal "' + c + '"');
    i++; quantifiable = true;
  }
  while (stack.length) {
    const g = stack.pop();
    if (!groups[g.num - 1]) groups[g.num - 1] = { source: src.slice(g.start + 1), name: g.name };
    push('…', 'group', 'unclosed group — missing )');
  }
  return { tokens, groups };
}

function findPatternError(src, flags) {
  const u = flags.includes('u');
  const n = src.length;
  let i = 0;
  const stack = [];
  let quantifiable = false;
  const VALID_ESC = new Set('dDwWsSbBnrtvf0xuNckpP'.split(''));
  while (i < n) {
    const c = src[i];
    if (c === '\\') {
      if (i + 1 >= n) return { pos: i, msg: 'Trailing backslash' };
      const nx = src[i + 1];
      if (u && !/[0-9]/.test(nx) && !VALID_ESC.has(nx)) return { pos: i, msg: 'Invalid escape' };
      if ((nx === 'p' || nx === 'P') && src[i + 2] === '{') {
        const close = src.indexOf('}', i + 3);
        if (close === -1) return { pos: i, msg: 'Unterminated \\p{…}' };
        i = close + 1; quantifiable = true; continue;
      }
      if (nx === 'u' && src[i + 3] === '{') {
        const close = src.indexOf('}', i + 4);
        if (close === -1) return { pos: i, msg: 'Unterminated \\u{…}' };
        i = close + 1; quantifiable = true; continue;
      }
      i += 2; quantifiable = true; continue;
    }
    if (c === '[') {
      let j = i + 1;
      if (src[j] === '^') j++;
      if (src[j] === ']') j++;
      let closed = false;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src[j] === ']') { closed = true; break; }
        j++;
      }
      if (!closed) return { pos: i, msg: 'Unterminated character class' };
      i = j + 1; quantifiable = true; continue;
    }
    if (c === '(') {
      let adv = 1;
      if (src[i + 1] === '?') {
        const t = src[i + 2];
        if (t === ':') adv = 3;
        else if (t === '=' || t === '!') adv = 3;
        else if (t === '<') {
          if (src[i + 3] === '=' || src[i + 3] === '!') adv = 4;
          else {
            const close = src.indexOf('>', i + 3);
            if (close === -1) return { pos: i, msg: 'Unterminated group name' };
            const name = src.slice(i + 3, close);
            if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)) return { pos: i + 3, msg: 'Invalid group name' };
            adv = close + 1 - i;
          }
        }
        else return { pos: i + 1, msg: 'Invalid group' };
      }
      stack.push(i);
      i += adv;
      quantifiable = false;
      continue;
    }
    if (c === ')') {
      if (!stack.length) return { pos: i, msg: 'Unmatched )' };
      stack.pop();
      i++; quantifiable = true; continue;
    }
    if (c === '{') {
      const m = /^\{(\d+)(,(\d+)?)?\}/.exec(src.slice(i));
      if (m) {
        if (quantifiable) { i += m[0].length; quantifiable = false; continue; }
        if (u) return { pos: i, msg: 'Nothing to repeat' };
        i += m[0].length; quantifiable = true; continue;
      }
      const close = src.indexOf('}', i);
      if (close === -1) return { pos: i, msg: 'Invalid repetition' };
      if (quantifiable) return { pos: i, msg: 'Invalid repetition' };
      i = close + 1; quantifiable = true; continue;
    }
    if (c === '*' || c === '+' || c === '?') {
      if (!quantifiable) return { pos: i, msg: 'Nothing to repeat' };
      i++;
      if (src[i] === '?') i++;
      quantifiable = false;
      continue;
    }
    if (c === '^' || c === '$') { i++; quantifiable = false; continue; }
    if (c === '.') { i++; quantifiable = true; continue; }
    if (c === '|') { i++; quantifiable = false; continue; }
    i++; quantifiable = true;
  }
  if (stack.length) return { pos: stack[stack.length - 1], msg: 'Unterminated group' };
  return null;
}

function collectMatches(re, text, max) {
  const out = [];
  if (!text) return out;
  if (re.global || re.sticky) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      out.push(m);
      if (out.length >= max) break;
      if (m[0].length === 0) re.lastIndex++;
    }
  } else {
    const m = re.exec(text);
    if (m) out.push(m);
  }
  return out;
}

function renderMatchGroups(m) {
  const spans = [];
  for (let i = 1; i < m.length; i++) {
    if (m[i] === undefined || !m.indices || m.indices[i] === null) continue;
    spans.push({ i, start: m.indices[i][0], end: m.indices[i][1] });
  }
  const contains = (o, s) => o.i !== s.i && o.start <= s.start && s.end <= o.end &&
    (o.start < s.start || o.end > s.end || (o.start === s.start && o.end === s.end && o.i < s.i));
  function render(a, b, ancestors) {
    let html = '';
    let pos = a;
    const cand = spans.filter((s) => s.start >= a && s.end <= b && !ancestors.has(s.i));
    const tops = cand
      .filter((s) => !cand.some((o) => contains(o, s)))
      .sort((x, y) => x.start - y.start || y.end - x.end || x.i - y.i);
    for (const g of tops) {
      html += esc(m[0].slice(pos - m.index, g.start - m.index));
      const inner = render(g.start, g.end, new Set([...ancestors, g.i]));
      const zero = g.start === g.end;
      html += '<span class="grp" style="--gc:' + groupVar(g.i) + '" title="group ' + g.i + '">' + inner + (zero ? '<span class="zero-mark" style="background:' + groupVar(g.i) + '"></span>' : '') + '</span>';
      pos = g.end;
    }
    html += esc(m[0].slice(pos - m.index, b - m.index));
    return html;
  }
  return render(m.index, m.index + m[0].length, new Set());
}

const $ = (s) => document.querySelector(s);

const patternInput = $('#pattern');
const textInput = $('#text');
const flagsDisplay = $('#flags-display');
const errorBox = $('#pattern-error');
const highlightEl = $('#highlight');
const legendEl = $('#group-legend');
const hintEl = $('#hint');
const tableEl = $('#match-table');
const explainEl = $('#explain');
const badgeMatches = $('#badge-matches');
const badgeTable = $('#badge-table');
const statusDot = $('#status-dot');
const statusMsg = $('#status-msg');
const statusRight = $('#status-right');
const textCount = $('#text-count');
const toastEl = $('#toast');
const btnCopy = $('#btn-copy');
const btnClear = $('#btn-clear');
const btnTheme = $('#btn-theme');

const MAX_MATCHES = 500;
const MAX_TEXT = 100000;
const MAX_ROWS = 200;

const EXAMPLE_TEXT = 'Contact us at support@example.com or sales@example.com for details.\nOur on-call engineer is oncall@regex-lab.dev — reply-to: no-reply@mail.example.co.uk\nThese won\'t match: @missing.com, user@, user@domain, a@@b.cc\nBCC: team+tag@sub.domain.io and ops@9to5jobs.com';

const state = { re: null, tokens: [], groups: [], visible: [], all: [], error: null, compileUs: 0, capped: false };

let updateTimer = null;
function scheduleUpdate() {
  clearTimeout(updateTimer);
  updateTimer = setTimeout(update, 90);
}

let hashTimer = null;
function scheduleHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const params = new URLSearchParams();
    params.set('p', patternInput.value);
    params.set('f', getFlags());
    params.set('t', textInput.value);
    const h = '#' + params.toString();
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (e) {}
    }
  }, 400);
}

function getFlags() {
  return FLAG_ORDER.filter((f) => document.querySelector('.flag[data-flag="' + f + '"]').classList.contains('on')).join('');
}

function setFlags(str) {
  FLAG_ORDER.forEach((f) => {
    const el = document.querySelector('.flag[data-flag="' + f + '"]');
    el.classList.toggle('on', str.includes(f));
    el.setAttribute('aria-pressed', str.includes(f) ? 'true' : 'false');
  });
}

function status(kind, msg) {
  statusDot.className = 'status-dot' + (kind === 'error' ? ' err' : kind === 'idle' ? ' idle' : '');
  statusMsg.textContent = msg;
}

function updateBadges(n) {
  badgeMatches.textContent = n;
  badgeTable.textContent = n;
}

function renderLegend() {
  legendEl.innerHTML = state.groups.map((g, i) =>
    '<span class="legend-item"><i style="background:' + groupVar(i + 1) + '"></i><b style="color:' + groupVar(i + 1) + '">' + (i + 1) + (g.name ? ':' + esc(g.name) : '') + '</b><code>' + esc(g.source) + '</code></span>'
  ).join('');
}

function renderHighlight(text, matches) {
  if (!state.re) { highlightEl.innerHTML = '<span class="dim">pattern is invalid — fix the error above</span>'; return; }
  if (!text) { highlightEl.innerHTML = '<span class="dim">type some test text to see matches</span>'; return; }
  if (!matches.length) { highlightEl.innerHTML = esc(text); return; }
  let html = '';
  let last = 0;
  for (const m of matches) {
    html += esc(text.slice(last, m.index));
    if (m[0].length === 0) {
      html += '<span class="zero-hit" title="zero-length match at ' + m.index + '"></span>';
    } else {
      html += '<span class="hit" title="match at ' + m.index + '–' + (m.index + m[0].length) + '">' + renderMatchGroups(m) + '</span>';
    }
    last = m.index + m[0].length;
  }
  html += esc(text.slice(last));
  highlightEl.innerHTML = html;
}

function renderTable(matches) {
  const nGroups = Math.max(state.groups.length, matches[0] ? matches[0].length - 1 : 0);
  const colCount = 4 + nGroups;
  if (!state.re) { tableEl.innerHTML = '<tbody><tr><td class="dim" colspan="' + colCount + '">pattern is invalid</td></tr></tbody>'; return; }
  if (!matches.length) { tableEl.innerHTML = '<tbody><tr><td class="dim" colspan="' + colCount + '">no matches — try a different pattern or flags</td></tr></tbody>'; return; }
  let head = '<thead><tr><th>#</th><th>match</th><th>start</th><th>end</th>';
  for (let i = 1; i <= nGroups; i++) {
    const g = state.groups[i - 1];
    head += '<th style="color:' + groupVar(i) + '">' + (g && g.name ? i + ':' + esc(g.name) : i) + '</th>';
  }
  head += '</tr></thead>';
  const rows = matches.slice(0, MAX_ROWS);
  let body = '<tbody>';
  rows.forEach((m, ri) => {
    body += '<tr><td class="dim">' + (ri + 1) + '</td><td>' + (m[0] === '' ? '<span class="zero" title="zero-length">∅</span>' : cellText(m[0])) + '</td><td>' + m.index + '</td><td>' + (m.index + m[0].length) + '</td>';
    for (let i = 1; i <= nGroups; i++) {
      const v = m[i];
      body += v === undefined ? '<td class="dim">—</td>' : '<td style="color:' + groupVar(i) + '">' + (v === '' ? '<span class="zero" title="zero-length">∅</span>' : cellText(v)) + '</td>';
    }
    body += '</tr>';
  });
  body += '</tbody>';
  if (matches.length > MAX_ROWS) body += '<tfoot><tr><td colspan="' + colCount + '" class="dim">showing first ' + MAX_ROWS + ' of ' + matches.length + ' matches</td></tr></tfoot>';
  tableEl.innerHTML = head + body;
}

function renderExplain(pattern, flags) {
  const tokens = state.tokens;
  if (!tokens.length) { explainEl.innerHTML = '<div class="dim">type a pattern to see its anatomy</div>'; return; }
  const nGroups = state.groups.length;
  let html = '<div class="explain-summary dim">' + tokens.length + ' tokens · ' + nGroups + ' capture group' + (nGroups === 1 ? '' : 's') + (flags ? ' · flags: ' + flags : ' · no flags') + '</div>';
  html += '<div class="explain-map">';
  for (const t of tokens) html += '<span class="chip" style="color:' + KIND_COLOR[t.kind] + '" title="' + esc(t.desc) + '"><sup>' + t.n + '</sup>' + esc(t.text) + '</span>';
  html += '</div><div class="explain-list">';
  for (const t of tokens) html += '<div class="explain-row"><span class="num">' + t.n + '</span><code class="tok" style="color:' + KIND_COLOR[t.kind] + '">' + esc(t.text) + '</code><span class="desc">' + esc(t.desc) + '</span></div>';
  html += '</div>';
  html += '<div class="explain-flags"><div class="section-label">flags</div>';
  const active = FLAG_ORDER.filter((f) => flags.includes(f));
  if (!active.length) html += '<div class="desc dim">no flags set</div>';
  else for (const f of active) html += '<div class="flag-row"><b style="color:var(--accent)">' + f + '</b><span class="dim"> — </span><span>' + esc(FLAG_INFO[f][1]) + '</span></div>';
  html += '</div>';
  explainEl.innerHTML = html;
}

function renderError() {
  const message = state.error.message;
  const pos = state.error.pos;
  const p = patternInput.value;
  const clamped = Math.min(pos, p.length);
  errorBox.innerHTML =
    '<div class="err-msg">✗ ' + esc(message) + '</div>' +
    '<div class="err-line"><span class="dim">/</span>' + esc(p) + '<span class="dim">/</span></div>' +
    '<div class="err-line"><span class="dim">/</span>' + ' '.repeat(clamped) + '<span class="err-caret-ch">^</span><span class="dim">/</span>  <span class="dim">index ' + clamped + '</span></div>';
  errorBox.hidden = false;
}

function update() {
  const pattern = patternInput.value;
  const flags = getFlags();
  const text = textInput.value;
  flagsDisplay.textContent = flags;
  textCount.textContent = text ? text.length.toLocaleString() + ' chars' : '';
  errorBox.hidden = true;

  const tok = tokenizePattern(pattern, flags);
  state.tokens = tok.tokens;
  state.groups = tok.groups;

  if (!pattern) {
    state.re = null; state.visible = []; state.all = []; state.error = null;
    highlightEl.innerHTML = '<span class="dim">type a pattern to begin</span>';
    tableEl.innerHTML = '<tbody><tr><td class="dim">type a pattern to begin</td></tr></tbody>';
    explainEl.innerHTML = '<div class="dim">type a pattern to see its anatomy</div>';
    legendEl.innerHTML = '';
    hintEl.hidden = true;
    updateBadges(0);
    status('idle', 'awaiting pattern');
    statusRight.textContent = '—';
    scheduleHash();
    return;
  }

  const t0 = performance.now();
  let re;
  try {
    re = new RegExp(pattern, flags);
  } catch (err) {
    const e = findPatternError(pattern, flags);
    state.error = { message: err.message, pos: e ? e.pos : pattern.length };
    state.re = null; state.visible = []; state.all = [];
    renderError();
    highlightEl.innerHTML = '<span class="dim">pattern is invalid — fix the error above</span>';
    tableEl.innerHTML = '<tbody><tr><td class="dim">pattern is invalid</td></tr></tbody>';
    renderExplain(pattern, flags);
    legendEl.innerHTML = '';
    hintEl.hidden = true;
    updateBadges(0);
    status('error', err.message);
    statusRight.textContent = '/' + pattern + '/' + flags;
    scheduleHash();
    return;
  }
  re = new RegExp(pattern, flags + 'd');
  state.compileUs = (performance.now() - t0) * 1000;
  state.error = null;
  state.re = re;

  const truncated = text.length > MAX_TEXT;
  const procText = truncated ? text.slice(0, MAX_TEXT) : text;
  const hasG = flags.includes('g');
  const hasY = flags.includes('y');
  const collectRe = hasY || hasG ? re : new RegExp(pattern, flags + 'gd');
  const all = collectMatches(collectRe, procText, MAX_MATCHES);
  state.all = all;
  state.capped = all.length >= MAX_MATCHES;
  state.visible = hasG || hasY ? all : all.slice(0, 1);

  renderLegend();
  renderHighlight(procText, state.visible);
  renderTable(state.visible);
  renderExplain(pattern, flags);

  const hints = [];
  if (!hasG && !hasY && all.length > 1) hints.push('tip: add the g flag to see all ' + all.length + ' matches');
  if (state.capped) hints.push('match list capped at ' + MAX_MATCHES);
  if (truncated) hints.push('showing first ' + MAX_TEXT.toLocaleString() + ' chars of test text');
  if (!state.visible.length && procText) hints.push('no matches — check the pattern and flags');
  hintEl.innerHTML = hints.map(esc).join('<br>');
  hintEl.hidden = !hints.length;

  updateBadges(state.visible.length);
  status('ok', state.visible.length + ' match' + (state.visible.length === 1 ? '' : 'es') + ' in ' + procText.length.toLocaleString() + ' chars');
  statusRight.textContent = '/' + pattern + '/' + flags + ' · ' + state.compileUs.toFixed(1) + 'µs';
  scheduleHash();
}

const TOKEN_GROUPS = [
  ['classes', [
    ['\\d', 'digit'], ['\\D', 'non-digit'], ['\\w', 'word character'], ['\\W', 'non-word'], ['\\s', 'whitespace'], ['\\S', 'non-whitespace'], ['[0-9]', 'digits'], ['[a-z]', 'lowercase'], ['[A-Z]', 'uppercase'], ['[\\s\\S]', 'any incl. newline'],
  ]],
  ['anchors', [
    ['^', 'start of line'], ['$', 'end of line'], ['\\b', 'word boundary'], ['\\B', 'non-word boundary'],
  ]],
  ['quantifiers', [
    ['*', 'zero or more'], ['+', 'one or more'], ['?', 'zero or one'], ['{2,5}', '2 to 5 times'], ['.*', 'any string (greedy)'], ['.*?', 'any string (lazy)'],
  ]],
  ['groups', [
    ['(...)', 'capturing group', 1], ['(?:...)', 'non-capturing group', 4], ['(?=...)', 'positive lookahead', 3], ['(?!...)', 'negative lookahead', 4], ['(?<=...)', 'positive lookbehind', 4], ['(?<!...)', 'negative lookbehind', 5],
  ]],
  ['misc', [
    ['.', 'any character'], ['|', 'alternation'], ['\\n', 'newline'], ['\\t', 'tab'], ['\\x41', 'hex escape (A)'], ['\\u0041', 'unicode escape (A)'], ['\\p{L}', 'unicode letter'], ['\\p{N}', 'unicode number'],
  ]],
];

function buildTokens() {
  const wrap = $('#tokens');
  for (const [label, items] of TOKEN_GROUPS) {
    const lab = document.createElement('span');
    lab.className = 'tok-label';
    lab.textContent = label;
    wrap.appendChild(lab);
    for (const item of items) {
      const t = item[0], d = item[1], caret = item[2];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tok-btn';
      b.textContent = t;
      b.title = d;
      b.addEventListener('click', () => insertToken(t, caret));
      wrap.appendChild(b);
    }
  }
}

function buildFlags() {
  const wrap = $('#flags');
  for (const f of FLAG_ORDER) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'flag';
    b.dataset.flag = f;
    b.textContent = f;
    b.title = f + ' — ' + FLAG_INFO[f][0] + ': ' + FLAG_INFO[f][1];
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      b.classList.toggle('on');
      b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false');
      scheduleUpdate();
    });
    wrap.appendChild(b);
  }
}

function insertToken(token, caretOffset) {
  const el = patternInput;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : start;
  el.value = el.value.slice(0, start) + token + el.value.slice(end);
  const pos = start + (caretOffset != null ? caretOffset : token.length);
  el.setSelectionRange(pos, pos);
  el.focus();
  scheduleUpdate();
}

function bindTabs() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((tab) => tab.addEventListener('click', () => {
    tabs.forEach((t) => {
      const active = t === tab;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.querySelectorAll('.tab-body').forEach((b) => { b.hidden = b.id !== 'tab-' + tab.dataset.tab; });
  }));
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('regexlab-theme', t); } catch (e) {}
  btnTheme.textContent = t === 'dark' ? '◐ dark' : '◑ light';
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function permalink() {
  const params = new URLSearchParams();
  params.set('p', patternInput.value);
  params.set('f', getFlags());
  params.set('t', textInput.value);
  return location.href.split('#')[0] + '#' + params.toString();
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

function copyLink() {
  const url = permalink();
  const done = () => toast('permalink copied ✓');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => { fallbackCopy(url); done(); });
  } else {
    fallbackCopy(url);
    done();
  }
}

function clearAll() {
  patternInput.value = '';
  textInput.value = '';
  setFlags('');
  patternInput.focus();
  update();
}

function loadFromHash() {
  const h = location.hash.slice(1);
  if (!h) return false;
  let params;
  try { params = new URLSearchParams(h); } catch (e) { return false; }
  if (!params.has('p') && !params.has('f') && !params.has('t')) return false;
  patternInput.value = params.get('p') || '';
  setFlags(params.get('f') || '');
  textInput.value = params.get('t') || '';
  return true;
}

buildFlags();
buildTokens();
bindTabs();
setTheme((() => { try { return localStorage.getItem('regexlab-theme'); } catch (e) { return null; } })() || 'dark');

btnTheme.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
btnCopy.addEventListener('click', copyLink);
btnClear.addEventListener('click', clearAll);
patternInput.addEventListener('input', scheduleUpdate);
textInput.addEventListener('input', scheduleUpdate);

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); copyLink(); }
  else if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); clearAll(); }
});

window.addEventListener('hashchange', () => {
  if (loadFromHash()) update();
});

if (!loadFromHash()) {
  patternInput.value = '(\\w+)@(\\w+)\\.(\\w+)';
  setFlags('g');
  textInput.value = EXAMPLE_TEXT;
}
update();
</script>
</body>
</html>
