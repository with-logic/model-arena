<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Weather Theatre</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e9c477'/%3E%3C/svg%3E"/>
<style>
:root {
  --gold: #e9c477;
  --gold-soft: #cfae6f;
  --cream: #f0e2c0;
  --line: #4a3018;
  --bg: #120a08;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  background:
    radial-gradient(1100px 560px at 50% -8%, rgba(128, 62, 30, 0.28), transparent 62%),
    radial-gradient(900px 480px at 50% 112%, rgba(96, 32, 22, 0.22), transparent 60%),
    var(--bg);
  color: var(--cream);
  font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.app {
  max-width: 1240px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 22px 8px;
}
.marquee { text-align: center; padding-top: 4px; user-select: none; }
.marquee-row { display: flex; align-items: center; justify-content: center; gap: 20px; }
.marquee h1 {
  font-family: Didot, "Bodoni MT", "Playfair Display", "Times New Roman", serif;
  font-weight: 400;
  font-size: clamp(26px, 3.6vw, 42px);
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffedbb 18%, #e9c477 48%, #a87c2f 72%, #f4d98f 96%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 14px rgba(233, 196, 119, 0.35));
  animation: titleGlow 4.5s ease-in-out infinite;
  white-space: nowrap;
}
@keyframes titleGlow {
  0%, 100% { filter: drop-shadow(0 2px 14px rgba(233,196,119,0.3)); }
  50% { filter: drop-shadow(0 2px 22px rgba(233,196,119,0.55)); }
}
.tagline {
  margin-top: 7px;
  font-size: 10px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  text-transform: uppercase;
  color: #a5854e;
}
.bulbs { display: flex; gap: 11px; }
.bulb {
  width: 8px; height: 8px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6d8, #f3c96b 55%, #8a5f1d);
  box-shadow: 0 0 9px 2px rgba(243, 201, 107, 0.55);
  animation: chase 1.6s ease-in-out infinite;
}
@keyframes chase {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.22; box-shadow: 0 0 2px 0 rgba(243,201,107,0.15); }
}
@media (prefers-reduced-motion: reduce) {
  .bulb, .marquee h1 { animation: none; }
}
.stage-wrap { flex: 1 1 auto; min-height: 300px; position: relative; }
.proscenium {
  position: absolute; inset: 0;
  border-radius: 20px;
  padding: 10px;
  background: linear-gradient(165deg, #6b4a1e, #2a1a0c 40%, #6b4a1e 78%, #3a2410);
  box-shadow: 0 24px 70px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,220,150,0.22);
}
.inner {
  position: absolute; inset: 10px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
}
.inner canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glass {
  position: absolute; inset: 0;
  pointer-events: none;
  border-radius: 12px;
  background: linear-gradient(112deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 22%, transparent 42%);
}
.board {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  background: linear-gradient(180deg, #241610, #170e09);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 20px;
  min-height: 64px;
  box-shadow: inset 0 1px 0 rgba(255,220,150,0.08), 0 10px 30px rgba(0,0,0,0.4);
}
.board-act {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  white-space: nowrap;
}
.board-text { min-height: 1.5em; }
.caret {
  display: inline-block;
  width: 0.55em; height: 1.02em;
  margin-left: 3px;
  background: var(--gold);
  vertical-align: text-bottom;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.board-temp {
  font-size: 26px;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.board-temp small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #a5854e;
}
.console {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 28px;
  align-items: center;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 90px),
    linear-gradient(180deg, #2a1a10, #1a0f09);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 24px;
  box-shadow: inset 0 1px 0 rgba(255,220,150,0.1), 0 14px 40px rgba(0,0,0,0.5);
  user-select: none;
}
.console-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.console-label {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-indent: 0.32em;
  text-transform: uppercase;
  color: #8a6d3f;
}
.faders { display: flex; gap: 30px; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.fader-value { font-size: 11px; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.fader-track {
  position: relative;
  width: 30px; height: 148px;
  border-radius: 15px;
  background: linear-gradient(180deg, #0c0705, #1c110a);
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), inset 0 -1px 0 rgba(255,220,150,0.08);
  cursor: ns-resize;
  touch-action: none;
  outline: none;
}
.fader-track:focus-visible { box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 0 0 2px rgba(233,196,119,0.55); }
.fader-fill { position: absolute; left: 6px; right: 6px; bottom: 6px; border-radius: 10px; opacity: 0.55; }
.fader-thumb {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 16px;
  border-radius: 4px;
  background: linear-gradient(180deg, #efe8d8, #a89c86 45%, #4c4436 55%, #b3a88f);
  pointer-events: none;
}
.fader-thumb::after {
  content: '';
  position: absolute;
  left: 6px; right: 6px; top: 7px; height: 2px;
  background: rgba(30,20,10,0.55);
  border-radius: 1px;
}
.fader-label {
  font-size: 10px;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  text-transform: uppercase;
  color: var(--gold-soft);
}
.programme { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.day {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 76px;
  padding: 9px 12px 8px;
  background: rgba(0,0,0,0.35);
  border: 1px solid #432c16;
  border-radius: 12px;
  color: #d8c48f;
  cursor: pointer;
  transition: border-color .25s, transform .25s, box-shadow .25s, background .25s;
  font-family: inherit;
}
.day:hover { border-color: #7a5a2a; transform: translateY(-2px); }
.day.active {
  border-color: var(--gold);
  color: #ffe9b0;
  background: linear-gradient(180deg, rgba(233,196,119,0.14), rgba(233,196,119,0.04));
  box-shadow: 0 0 22px rgba(233,196,119,0.22), inset 0 0 12px rgba(233,196,119,0.08);
}
.day-name { font-size: 10px; letter-spacing: 0.25em; text-indent: 0.25em; text-transform: uppercase; opacity: 0.8; }
.day-temp { font-size: 15px; font-variant-numeric: tabular-nums; }
.switches { display: flex; flex-direction: column; gap: 9px; align-items: stretch; min-width: 176px; }
.switch {
  display: flex;
  border: 1px solid #432c16;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(0,0,0,0.35);
}
.switch button {
  flex: 1;
  padding: 8px 12px;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-indent: 0.16em;
  text-transform: uppercase;
  color: #a5854e;
  background: transparent;
  border: 0;
  cursor: pointer;
  transition: background .25s, color .25s;
  font-family: inherit;
}
.switch button.on {
  color: #1a0f08;
  background: linear-gradient(180deg, #f4d98f, #d9a94e);
  box-shadow: 0 0 16px rgba(233,196,119,0.4);
}
.btn {
  padding: 9px 14px;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  background: rgba(0,0,0,0.3);
  border: 1px solid #5a3a1c;
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .25s, box-shadow .25s;
  font-family: inherit;
}
.btn:hover { border-color: var(--gold); box-shadow: 0 0 16px rgba(233,196,119,0.25); }
.footnote {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  text-transform: uppercase;
  color: #6b5636;
  padding: 2px 0 8px;
}
@media (max-width: 920px) {
  .console { grid-template-columns: 1fr; gap: 18px; }
  .switches { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .app { padding: 12px 12px 8px; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: 1fr auto; }
  .board-act { grid-column: 1 / -1; }
  .marquee h1 { letter-spacing: 0.18em; text-indent: 0.18em; }
  .bulbs { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const FORECAST = [
  { day: 'Mon', full: 'Monday', cond: 'sun', temp: 21 },
  { day: 'Tue', full: 'Tuesday', cond: 'rain', temp: 17 },
  { day: 'Wed', full: 'Wednesday', cond: 'storm', temp: 14 },
  { day: 'Thu', full: 'Thursday', cond: 'snow', temp: 3 },
  { day: 'Fri', full: 'Friday', cond: 'fog', temp: 9 },
];

const MOODS = {
  cosy: {
    skyTop: { day: [255, 214, 156], night: [58, 44, 78] },
    skyBot: { day: [255, 176, 122], night: [122, 74, 84] },
    cloud: { day: [244, 220, 190], night: [96, 82, 104] },
    glow: [255, 196, 120],
    haze: 0.16, slant: 0.12, fogBase: 0.30,
  },
  eerie: {
    skyTop: { day: [158, 178, 197], night: [10, 14, 34] },
    skyBot: { day: [96, 116, 138], night: [30, 44, 70] },
    cloud: { day: [92, 108, 130], night: [42, 56, 82] },
    glow: [150, 178, 255],
    haze: 0.55, slant: 0.34, fogBase: 0.65,
  },
  heroic: {
    skyTop: { day: [110, 186, 232], night: [30, 18, 62] },
    skyBot: { day: [255, 214, 138], night: [110, 44, 74] },
    cloud: { day: [226, 234, 242], night: [84, 70, 100] },
    glow: [255, 214, 96],
    haze: 0.12, slant: 0.06, fogBase: 0.18,
  },
};

const LINES = {
  sun: {
    cosy: 'sunlight pools on the boards, warm as bread just out of the oven',
    eerie: 'the sun hangs low and pale, watching from behind the glass',
    heroic: 'the sun rises like a trumpet call over the whole wide stage',
  },
  rain: {
    cosy: 'rain taps the windows, patient and kind, while the kettle sings',
    eerie: 'rain keeps its secrets against the glass, one drop at a time',
    heroic: 'rain falls in silver ranks, a drumline for the whole wide world',
  },
  storm: {
    cosy: 'the storm rumbles softly, the way a big dog snores by the fire',
    eerie: 'lightning writes its letters in the dark, and no one answers',
    heroic: 'lightning splits the sky — the house shakes, the crowd roars',
  },
  snow: {
    cosy: 'snow settles on the eaves, hush upon hush, the world tucked in',
    eerie: 'snow erases every footstep, until the street is a blank page',
    heroic: 'snow falls in slow white banners over the silent hills',
  },
  fog: {
    cosy: 'fog curls through the lanes, soft as a wool scarf on a cold morning',
    eerie: 'fog swallows the streetlamps one by one, and the street holds its breath',
    heroic: 'fog parts before the banner, a grey sea before the ship',
  },
};

const SUB_STYLE = {
  cosy: { font: 'italic 500 1.02rem Georgia, "Times New Roman", serif', color: '#f4d9a8', ls: '0.02em' },
  eerie: { font: '300 0.98rem "Courier New", ui-monospace, monospace', color: '#c4d4f2', ls: '0.13em' },
  heroic: { font: '700 1.02rem "Arial Narrow", "Helvetica Neue", Arial, sans-serif', color: '#ffd98a', ls: '0.05em', upper: true },
};

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixRgb = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const scaleRgb = (c, f) => [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)];

function makeTree() {
  const segs = [];
  (function branch(x, y, ang, len, d) {
    if (d === 0 || len < 5) return;
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    segs.push({ x1: x, y1: y, x2, y2, d });
    const n = d > 4 ? 3 : 2;
    for (let i = 0; i < n; i++) branch(x2, y2, ang + (Math.random() - 0.5) * 1.15, len * 0.72, d - 1);
  })(0, 0, -Math.PI / 2, 52, 6);
  return segs;
}

function weightsOf(m) {
  const sum = m.cosy + m.eerie + m.heroic;
  if (sum <= 0) return { cosy: 1 / 3, eerie: 1 / 3, heroic: 1 / 3 };
  return { cosy: m.cosy / sum, eerie: m.eerie / sum, heroic: m.heroic / sum };
}
function dominantOf(w) {
  return w.cosy >= w.eerie && w.cosy >= w.heroic ? 'cosy' : (w.eerie >= w.heroic ? 'eerie' : 'heroic');
}

function Stage({ sceneRef, replayTick }) {
  const canvasRef = useRef(null);
  const innerRef = useRef(null);

  useEffect(() => {
    if (replayTick > 0) sceneRef.current.replay = true;
  }, [replayTick, sceneRef]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const inner = innerRef.current;
    const ctx = canvas.getContext('2d');
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0, dpr = 1, floorY = 0, raf = 0;
    let last = performance.now(), time = 0, dt = 0;

    const P = {
      rain: [], snow: [], stars: [], splashes: [], clouds: [],
      px: 0, py: 0, tpx: 0, tpy: 0, mouseT: 0,
      todMix: 1, snowDepth: 0,
      flash: 0, bolt: null, boltLife: 0, nextBolt: 4,
      cur: { phase: 'closed', t: 0, timer: 1.1 },
      mix: { a: 'storm', b: 'storm', t: 1 },
      tree: makeTree(),
    };

    function initParticles() {
      P.stars = Array.from({ length: 130 }, () => ({ x: Math.random() * W, y: Math.random() * floorY * 0.92, r: 0.5 + Math.random() * 1.4, tw: 0.8 + Math.random() * 2.6, ph: Math.random() * 6.28 }));
      P.rain = Array.from({ length: 210 }, () => ({ x: Math.random() * W, y: Math.random() * H, len: 10 + Math.random() * 14, sp: 480 + Math.random() * 320 }));
      P.snow = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.1, sp: 24 + Math.random() * 30, ph: Math.random() * 6.28 }));
      P.clouds = Array.from({ length: 7 }, () => ({ x: Math.random() * W, y: H * (0.06 + Math.random() * 0.24), r: 44 + Math.random() * 66, sp: 5 + Math.random() * 9 }));
    }

    function resize() {
      const r = inner.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height; floorY = H * 0.82;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      initParticles();
    }
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(inner);

    const onMove = e => {
      const r = inner.getBoundingClientRect();
      P.tpx = (e.clientX - r.left) / r.width - 0.5;
      P.tpy = (e.clientY - r.top) / r.height - 0.5;
      P.mouseT = time;
    };
    inner.addEventListener('mousemove', onMove);

    const condAmount = c => (P.mix.a === c ? 1 - P.mix.t : 0) + (P.mix.b === c ? P.mix.t : 0);

    function makeBolt() {
      const pts = [];
      let x = W * (0.25 + Math.random() * 0.5), y = H * 0.16;
      const endY = floorY - 6;
      const steps = 9;
      for (let i = 0; i <= steps; i++) {
        pts.push({ x, y });
        x += (Math.random() - 0.5) * 46;
        y += (endY - H * 0.16) / steps;
      }
      return pts;
    }

    function drawRain(a, sl) {
      ctx.save();
      ctx.strokeStyle = rgba([198, 216, 248], 0.5 * a);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const d of P.rain) {
        d.y += d.sp * dt;
        d.x += d.sp * sl * dt;
        if (d.y > floorY + 6) {
          if (P.splashes.length < 70 && Math.random() < 0.5) P.splashes.push({ x: d.x, r: 1, life: 0.4 });
          d.y = -20 - Math.random() * 40;
          d.x = Math.random() * (W + 80) - 40;
        }
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.len * sl * 2.2, d.y + d.len);
      }
      ctx.stroke();
      for (let i = P.splashes.length - 1; i >= 0; i--) {
        const sp = P.splashes[i];
        sp.life -= dt;
        sp.r += dt * 46;
        if (sp.life <= 0) { P.splashes.splice(i, 1); continue; }
        ctx.strokeStyle = rgba([198, 216, 248], sp.life * 1.4 * a);
        ctx.beginPath();
        ctx.ellipse(sp.x, floorY + 4, sp.r, sp.r * 0.3, 0, 0, 6.283);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSnow(a) {
      ctx.fillStyle = rgba([240, 246, 255], 0.85 * a);
      ctx.beginPath();
      for (const f of P.snow) {
        f.y += f.sp * dt;
        f.x += Math.sin(time * 0.8 + f.ph) * 0.5 + dt * 8;
        if (f.y > floorY + 4) { f.y = -8; f.x = Math.random() * W; }
        if (f.x > W + 8) f.x = -8;
        ctx.moveTo(f.x + f.r, f.y);
        ctx.arc(f.x, f.y, f.r, 0, 6.283);
      }
      ctx.fill();
    }

    function drawFog(a) {
      for (let b = 0; b < 3; b++) {
        const y = floorY - 24 - b * 30;
        const off = (time * (b + 1) * 7) % (W / 5);
        for (let i = -1; i < 6; i++) {
          const x = i * (W / 5) + off + P.px * 24;
          const r = W * 0.16;
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(1, 0.3);
          const g = ctx.createRadialGradient(0, 0, 4, 0, 0, r);
          g.addColorStop(0, rgba([205, 214, 228], 0.14 * a));
          g.addColorStop(1, rgba([205, 214, 228], 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, 6.283);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function drawSpots(glowC, mul) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const defs = [
        { x: W * 0.22, a: -0.24 + Math.sin(time * 0.33) * (reduced ? 0 : 0.3) },
        { x: W * 0.78, a: 0.24 - Math.sin(time * 0.33 + 1.4) * (reduced ? 0 : 0.3) },
      ];
      for (const sp of defs) {
        const len = floorY + 30;
        const cx = sp.x + Math.tan(sp.a) * len;
        const half = 74 + 26 * Math.sin(time * 0.5 + sp.x * 0.01);
        const bg = ctx.createLinearGradient(sp.x, 0, cx, floorY);
        bg.addColorStop(0, rgba(glowC, 0.03 * mul));
        bg.addColorStop(1, rgba(glowC, 0.22 * mul));
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.moveTo(sp.x - 10, -12);
        ctx.lineTo(sp.x + 10, -12);
        ctx.lineTo(cx + half, floorY + 24);
        ctx.lineTo(cx - half, floorY + 24);
        ctx.closePath();
        ctx.fill();
        const pg = ctx.createRadialGradient(cx, floorY + 12, 6, cx, floorY + 12, half * 1.6);
        pg.addColorStop(0, rgba(glowC, 0.3 * mul));
        pg.addColorStop(1, rgba(glowC, 0));
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.ellipse(cx, floorY + 12, half * 1.6, 26, 0, 0, 6.283);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTree(a) {
      if (a <= 0.02) return;
      const x = W * 0.15 + P.px * 18, y = floorY + 6;
      const sc = H / 720;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(x, y);
      ctx.scale(sc, sc);
      ctx.rotate(Math.sin(time * 0.5) * 0.01);
      ctx.strokeStyle = 'rgba(10,12,16,0.95)';
      ctx.lineCap = 'round';
      for (const s of P.tree) {
        ctx.lineWidth = s.d * 0.9;
        const sw = Math.sin(time * 0.6 + s.d * 0.5) * s.d * 0.35;
        ctx.beginPath();
        ctx.moveTo(s.x1 + sw * 0.3, s.y1);
        ctx.lineTo(s.x2 + sw, s.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawLamp(a) {
      if (a <= 0.02) return;
      const x = W * 0.8 + P.px * 16, y = floorY;
      const flick = 0.82 + 0.18 * Math.sin(time * 6.3) * Math.sin(time * 2.1 + 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#1c1310';
      ctx.fillRect(x - 3, y - 118, 6, 118);
      ctx.fillRect(x - 11, y - 5, 22, 6);
      const g = ctx.createRadialGradient(x, y - 126, 2, x, y - 126, 74);
      g.addColorStop(0, rgba([255, 205, 120], 0.8 * flick));
      g.addColorStop(1, rgba([255, 205, 120], 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y - 126, 74, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffe9b8';
      ctx.beginPath(); ctx.arc(x, y - 126, 7, 0, 6.283); ctx.fill();
      const pg = ctx.createRadialGradient(x, y + 8, 4, x, y + 8, 92);
      pg.addColorStop(0, rgba([255, 190, 100], 0.22 * flick));
      pg.addColorStop(1, rgba([255, 190, 100], 0));
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.ellipse(x, y + 8, 92, 18, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    function drawFlag(a) {
      if (a <= 0.02) return;
      const x = W * 0.875 + P.px * 14, y = floorY;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#241a14';
      ctx.fillRect(x - 2.5, y - 150, 5, 150);
      ctx.beginPath(); ctx.arc(x, y - 153, 5, 0, 6.283); ctx.fill();
      const fx = x + 4, fy = y - 147, fw = 76, fh = 46, cols = 12;
      for (let i = 0; i < cols; i++) {
        const t0 = i / cols, t1 = (i + 1) / cols;
        const w0 = Math.sin(time * 4.5 - t0 * 5) * (2 + t0 * 6);
        const w1 = Math.sin(time * 4.5 - t1 * 5) * (2 + t1 * 6);
        const shade = 0.82 + 0.18 * Math.sin(t0 * 9 + time * 3);
        ctx.fillStyle = `rgb(${Math.round(178 * shade)}, ${Math.round(40 * shade)}, ${Math.round(48 * shade)})`;
        ctx.beginPath();
        ctx.moveTo(fx + t0 * fw, fy + w0);
        ctx.lineTo(fx + t1 * fw, fy + w1);
        ctx.lineTo(fx + t1 * fw, fy + fh + w1);
        ctx.lineTo(fx + t0 * fw, fy + fh + w0);
        ctx.closePath();
        ctx.fill();
      }
      const em = Math.sin(time * 4.5 - 2.5) * (2 + 0.5 * 6);
      ctx.fillStyle = 'rgba(240, 207, 138, 0.95)';
      ctx.beginPath(); ctx.arc(fx + fw * 0.5, fy + fh / 2 + em, 8, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    function drawCurtainPanel(ex, mirror) {
      const x0 = mirror ? W - ex : -30;
      const x1 = mirror ? W + 30 : ex;
      const pw = x1 - x0;
      if (pw <= 2) return;
      const n = 12, fw = pw / n;
      const light = lerp(1, 0.78, P.todMix);
      const base = scaleRgb([126, 30, 42], light);
      const lite = scaleRgb([188, 58, 74], light);
      const dark = scaleRgb([52, 10, 18], light);
      const hem = x => H - 4 + Math.sin(x * 0.045 + (mirror ? 2 : 0)) * 5;
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x1, 0);
      ctx.lineTo(x1, hem(x1));
      for (let x = x1; x >= x0; x -= 10) ctx.lineTo(x, hem(x));
      ctx.closePath();
      ctx.fillStyle = rgb(base);
      ctx.fill();
      for (let i = 0; i < n; i++) {
        const fx = x0 + i * fw;
        const gg = ctx.createLinearGradient(fx, 0, fx + fw, 0);
        gg.addColorStop(0, rgb(dark));
        gg.addColorStop(0.45, rgb(lite));
        gg.addColorStop(1, rgb(dark));
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.moveTo(fx, 0);
        ctx.lineTo(fx + fw, 0);
        ctx.lineTo(fx + fw, hem(fx + fw));
        ctx.quadraticCurveTo(fx + fw / 2, hem(fx + fw / 2) + 6, fx, hem(fx));
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = rgba([233, 196, 119], 0.55 * light);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let x = x0; x <= x1; x += 8) {
        const y = hem(x);
        if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function drawValance() {
      const h = 54;
      const light = lerp(1, 0.8, P.todMix);
      const base = scaleRgb([126, 30, 42], light);
      const lite = scaleRgb([188, 58, 74], light);
      const dark = scaleRgb([52, 10, 18], light);
      const step = 76;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W, 0);
      ctx.lineTo(W, h);
      for (let x = W; x > 0; x -= step) ctx.arc(x - step / 2, h, step / 2, 0, Math.PI, false);
      ctx.closePath();
      ctx.fillStyle = rgb(base);
      ctx.fill();
      ctx.clip();
      for (let x = 0; x < W; x += step) {
        const gg = ctx.createLinearGradient(x, 0, x + step, 0);
        gg.addColorStop(0, rgb(dark));
        gg.addColorStop(0.5, rgb(lite));
        gg.addColorStop(1, rgb(dark));
        ctx.fillStyle = gg;
        ctx.fillRect(x, 0, step, h + step);
      }
      ctx.restore();
      ctx.strokeStyle = rgba([233, 196, 119], 0.6 * light);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W, h);
      for (let x = W; x > 0; x -= step) ctx.arc(x - step / 2, h, step / 2, 0, Math.PI, false);
      ctx.stroke();
      const sh = ctx.createLinearGradient(0, h, 0, h + 60);
      sh.addColorStop(0, 'rgba(0,0,0,0.35)');
      sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, h, W, 60);
    }

    function frame(now) {
      raf = requestAnimationFrame(frame);
      dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      time += dt;
      if (W < 10) return;
      const s = sceneRef.current || {};
      const m = s.moods || { cosy: 0, eerie: 0, heroic: 0 };

      if (s.replay) {
        s.replay = false;
        if (P.cur.phase === 'open' || P.cur.phase === 'opening') P.cur.phase = 'closing';
      }

      const todTarget = s.tod === 'night' ? 1 : 0;
      P.todMix += (todTarget - P.todMix) * Math.min(1, dt * 3.2);
      if (Math.abs(todTarget - P.todMix) < 0.003) P.todMix = todTarget;

      if (!reduced) {
        if (time - P.mouseT > 4) {
          P.tpx = Math.sin(time * 0.13) * 0.22;
          P.tpy = Math.cos(time * 0.09) * 0.1;
        }
        P.px += (P.tpx - P.px) * Math.min(1, dt * 3.5);
        P.py += (P.tpy - P.py) * Math.min(1, dt * 3.5);
      }

      const w = weightsOf(m);
      const dom = dominantOf(w);
      const blendDay = k => [0, 1, 2].map(i => w.cosy * MOODS.cosy[k].day[i] + w.eerie * MOODS.eerie[k].day[i] + w.heroic * MOODS.heroic[k].day[i]);
      const blendNight = k => [0, 1, 2].map(i => w.cosy * MOODS.cosy[k].night[i] + w.eerie * MOODS.eerie[k].night[i] + w.heroic * MOODS.heroic[k].night[i]);
      const col = k => mixRgb(blendDay(k), blendNight(k), P.todMix);
      const glow = [0, 1, 2].map(i => w.cosy * MOODS.cosy.glow[i] + w.eerie * MOODS.eerie.glow[i] + w.heroic * MOODS.heroic.glow[i]);
      const slant = w.cosy * MOODS.cosy.slant + w.eerie * MOODS.eerie.slant + w.heroic * MOODS.heroic.slant;
      const fogBase = w.cosy * MOODS.cosy.fogBase + w.eerie * MOODS.eerie.fogBase + w.heroic * MOODS.heroic.fogBase;

      const cur = P.cur;
      if (cur.phase === 'closed') {
        cur.timer -= dt;
        if (cur.timer <= 0) cur.phase = 'opening';
      } else if (cur.phase === 'opening') {
        cur.t = Math.min(1, cur.t + dt / 3.0);
        if (cur.t >= 1) cur.phase = 'open';
      } else if (cur.phase === 'closing') {
        cur.t = Math.max(0, cur.t - dt / 1.1);
        if (cur.t <= 0) { cur.phase = 'closed'; cur.timer = 0.5; }
      }
      const ct = easeInOut(cur.t);

      const focus = clamp(s.focus | 0, 0, FORECAST.length - 1);
      const cond = FORECAST[focus].cond;
      if (cond !== P.mix.b) { P.mix.a = P.mix.b; P.mix.b = cond; P.mix.t = 0; }
      P.mix.t = Math.min(1, P.mix.t + dt / 1.4);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      const skyTop = col('skyTop'), skyBot = col('skyBot'), cloudC = col('cloud');
      const g0 = ctx.createLinearGradient(0, 0, 0, floorY);
      g0.addColorStop(0, rgb(skyTop));
      g0.addColorStop(1, rgb(skyBot));
      ctx.fillStyle = g0;
      ctx.fillRect(0, 0, W, H);

      const cloudCover = 0.3 * condAmount('sun') + 0.85 * condAmount('rain') + 0.95 * condAmount('storm') + 0.7 * condAmount('snow') + 0.6 * condAmount('fog');

      ctx.font = `700 ${Math.round(H * 0.15)}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba([255, 244, 214], 0.05 + 0.03 * w.heroic);
      ctx.fillText(FORECAST[focus].full.toUpperCase(), W / 2 + P.px * 10, H * 0.4);

      const starA = P.todMix * (1 - cloudCover);
      if (starA > 0.02) {
        for (const st of P.stars) {
          const a = starA * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * st.tw + st.ph)));
          ctx.fillStyle = rgba([220, 228, 255], a);
          ctx.beginPath();
          ctx.arc(st.x + P.px * 8, st.y + P.py * 5, st.r, 0, 6.283);
          ctx.fill();
        }
      }

      const cx0 = W * 0.7 + P.px * 22, cy0 = H * 0.26 + P.py * 12;
      const sunA = (1 - P.todMix) * (1 - cloudCover);
      if (sunA > 0.02) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const sg = ctx.createRadialGradient(cx0, cy0, 4, cx0, cy0, 150);
        sg.addColorStop(0, rgba(glow, 0.55 * sunA));
        sg.addColorStop(1, rgba(glow, 0));
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(cx0, cy0, 150, 0, 6.283); ctx.fill();
        for (let i = 0; i < 12; i++) {
          const a = time * 0.05 + i * Math.PI / 6;
          ctx.fillStyle = rgba(glow, 0.05 * sunA);
          ctx.beginPath();
          ctx.moveTo(cx0, cy0);
          ctx.lineTo(cx0 + Math.cos(a - 0.05) * 240, cy0 + Math.sin(a - 0.05) * 240);
          ctx.lineTo(cx0 + Math.cos(a + 0.05) * 240, cy0 + Math.sin(a + 0.05) * 240);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = rgba([255, 246, 214], Math.min(1, sunA + 0.15));
        ctx.beginPath(); ctx.arc(cx0, cy0, 30, 0, 6.283); ctx.fill();
      }
      const moonA = P.todMix * (1 - cloudCover * 0.75);
      if (moonA > 0.02) {
        const mg = ctx.createRadialGradient(cx0, cy0, 6, cx0, cy0, 110);
        mg.addColorStop(0, rgba([190, 205, 240], 0.35 * moonA));
        mg.addColorStop(1, rgba([190, 205, 240], 0));
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.arc(cx0, cy0, 110, 0, 6.283); ctx.fill();
        ctx.fillStyle = rgba([226, 232, 245], moonA);
        ctx.beginPath(); ctx.arc(cx0, cy0, 26, 0, 6.283); ctx.fill();
        ctx.fillStyle = rgba([170, 182, 205], 0.5 * moonA);
        ctx.beginPath(); ctx.arc(cx0 - 8, cy0 - 4, 5, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.arc(cx0 + 7, cy0 + 8, 3.5, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.arc(cx0 + 9, cy0 - 9, 2.5, 0, 6.283); ctx.fill();
      }

      const cloudA = 0.35 * condAmount('sun') + 0.9 * condAmount('rain') + condAmount('storm') + 0.75 * condAmount('snow') + 0.5 * condAmount('fog');
      const cloudDark = scaleRgb(cloudC, lerp(1, 0.6, condAmount('storm')));
      for (const c of P.clouds) {
        c.x += c.sp * dt;
        if (c.x - c.r * 1.6 > W) c.x = -c.r * 1.6;
        const x = c.x + P.px * 30, y = c.y + P.py * 14;
        const cg = ctx.createRadialGradient(x, y, c.r * 0.15, x, y, c.r * 1.55);
        cg.addColorStop(0, rgba(cloudDark, 0.75 * cloudA));
        cg.addColorStop(1, rgba(cloudDark, 0));
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(x, y, c.r * 1.55, 0, 6.283); ctx.fill();
      }

      const fTop = mixRgb(mixRgb([128, 82, 48], [40, 28, 36], P.todMix), glow, 0.1);
      const fBot = mixRgb([76, 46, 26], [15, 10, 14], P.todMix);
      const fg = ctx.createLinearGradient(0, floorY, 0, H);
      fg.addColorStop(0, rgb(fTop));
      fg.addColorStop(1, rgb(fBot));
      ctx.fillStyle = fg;
      ctx.fillRect(0, floorY, W, H - floorY);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      for (let x = -70 + ((P.px * 12) % 70); x < W + 70; x += 70) {
        ctx.beginPath();
        ctx.moveTo(x, floorY);
        ctx.lineTo(x - 16, H);
        ctx.stroke();
      }
      const sheen = ctx.createLinearGradient(0, floorY, 0, floorY + 46);
      sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
      sheen.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, floorY, W, 46);
      if (P.snowDepth > 0.4) {
        ctx.fillStyle = 'rgba(234,240,250,0.92)';
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(W, floorY);
        ctx.lineTo(W, floorY + P.snowDepth);
        for (let x = W; x >= 0; x -= 36) ctx.lineTo(x, floorY + P.snowDepth + Math.sin(x * 0.045) * 2);
        ctx.closePath();
        ctx.fill();
      }

      const setA = k => clamp((w[k] - 0.3) * 2.6, 0, 1);
      drawTree(setA('eerie'));
      drawLamp(setA('cosy'));
      drawFlag(setA('heroic'));

      const rainA = Math.max(condAmount('rain'), condAmount('storm') * 0.9);
      if (rainA > 0.02) drawRain(rainA, slant);
      const snowA = condAmount('snow');
      if (snowA > 0.02) drawSnow(snowA);
      if (condAmount('snow') > 0.5) P.snowDepth = Math.min(22, P.snowDepth + dt * 5);
      else P.snowDepth = Math.max(0, P.snowDepth - dt * 2.5);
      const fogA = Math.max(fogBase * 0.55, condAmount('fog') * 0.95);
      if (fogA > 0.02) drawFog(fogA);

      if (condAmount('storm') > 0.45 && ct > 0.92 && time > P.nextBolt) {
        P.flash = 1;
        P.bolt = makeBolt();
        P.boltLife = 0.3;
        P.nextBolt = time + 2.5 + Math.random() * 4.5;
        if (s.onThunder) s.onThunder();
      }

      drawSpots(glow, lerp(0.65, 1.2, P.todMix));

      P.boltLife = Math.max(0, P.boltLife - dt);
      P.flash = Math.max(0, P.flash - dt * 2.4);
      if (P.boltLife > 0 && P.bolt) {
        const a = P.boltLife / 0.3;
        ctx.save();
        ctx.strokeStyle = rgba([225, 238, 255], 0.9 * a);
        ctx.lineWidth = 2.4;
        ctx.shadowColor = 'rgba(150,190,255,0.9)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        P.bolt.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
        ctx.restore();
      }
      if (P.flash > 0.01) {
        ctx.fillStyle = rgba([235, 240, 255], P.flash * 0.45);
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = 'rgba(8,5,3,0.8)';
      for (let i = 0; i < 14; i++) {
        const x = (i / 13) * W + P.px * 20;
        const r = 15 + ((i * 37) % 12);
        const y = H + 4 + Math.sin(time * 0.7 + i * 1.7) * 1.5;
        ctx.beginPath();
        ctx.arc(x, y, r, Math.PI, Math.PI * 2);
        ctx.fill();
      }

      const edge = lerp(W / 2 + 30, 100, ct);
      const sway = (cur.t > 0.001 && cur.t < 0.999) ? Math.sin(cur.t * Math.PI * 2.5) * 14 * Math.sin(cur.t * Math.PI) : 0;
      drawCurtainPanel(edge + sway, false);
      drawCurtainPanel(edge + sway, true);
      if (ct < 0.15) {
        const a = (1 - ct / 0.15) * 0.5;
        const sg = ctx.createLinearGradient(W / 2 - 26, 0, W / 2 + 26, 0);
        sg.addColorStop(0, 'rgba(0,0,0,0)');
        sg.addColorStop(0.5, rgba([0, 0, 0], a));
        sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(W / 2 - 26, 0, 52, H);
      }
      drawValance();

      const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.45, H * 0.95);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, rgba([8, 4, 2], lerp(0.38, 0.58, P.todMix)));
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    raf = requestAnimationFrame(frame);
    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      inner.removeEventListener('mousemove', onMove);
    };
  }, [sceneRef]);

  return (
    <div className="stage-wrap">
      <div className="proscenium">
        <div className="inner" ref={innerRef}>
          <canvas ref={canvasRef} role="img" aria-label="Theatre stage performing the weather forecast" />
          <div className="glass" />
        </div>
      </div>
    </div>
  );
}

function Fader({ label, color, value, onChange }) {
  const trackRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const setFromY = useCallback(y => {
    const el = trackRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    onChange(clamp(Math.round((1 - (y - r.top) / r.height) * 100), 0, 100));
  }, [onChange]);
  const TH = 148;
  return (
    <div className="fader">
      <div className="fader-value">{value}</div>
      <div
        className="fader-track"
        ref={trackRef}
        role="slider"
        aria-label={label + ' mood'}
        aria-valuemin={0}
        aria-valuemax={100}
        aria-valuenow={value}
        tabIndex={0}
        onPointerDown={e => { e.currentTarget.setPointerCapture(e.pointerId); setDrag(true); setFromY(e.clientY); }}
        onPointerMove={e => { if (drag) setFromY(e.clientY); }}
        onPointerUp={() => setDrag(false)}
        onPointerCancel={() => setDrag(false)}
        onKeyDown={e => {
          if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); onChange(clamp(value + 5, 0, 100)); }
          else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); onChange(clamp(value - 5, 0, 100)); }
          else if (e.key === 'Home') onChange(0);
          else if (e.key === 'End') onChange(100);
        }}
      >
        <div className="fader-fill" style={{ height: (TH - 12) * value / 100 + 'px', background: `linear-gradient(to top, ${color}44, ${color})` }} />
        <div className="fader-thumb" style={{ bottom: 6 + (TH - 12 - 16) * value / 100 + 'px', boxShadow: `0 3px 8px rgba(0,0,0,.6), 0 0 ${Math.round(value * 0.18)}px ${color}` }} />
      </div>
      <div className="fader-label">{label}</div>
    </div>
  );
}

function Typewriter({ text }) {
  const [n, setN] = useState(0);
  useEffect(() => { setN(0); }, [text]);
  useEffect(() => {
    if (n >= text.length) return;
    const ch = text[n - 1] || '';
    const delay = 30 + Math.random() * 45 + (',;—:'.includes(ch) ? 140 : 0);
    const id = setTimeout(() => setN(n + 1), delay);
    return () => clearTimeout(id);
  }, [n, text]);
  return (
    <span>
      {text.slice(0, n)}
      <span className="caret" />
    </span>
  );
}

function Bulbs({ n }) {
  return (
    <div className="bulbs">
      {Array.from({ length: n }, (_, i) => (
        <span key={i} className="bulb" style={{ animationDelay: `${(i % 5) * 0.32}s` }} />
      ))}
    </div>
  );
}

function WeatherIcon({ cond }) {
  const s = { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.6, strokeLinecap: 'round' };
  if (cond === 'sun') {
    return (
      <svg {...s}>
        <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none" />
        {[0, 45, 90, 135, 180, 225, 270, 315].map(a => {
          const rad = a * Math.PI / 180;
          return <line key={a} x1={12 + Math.cos(rad) * 7} y1={12 + Math.sin(rad) * 7} x2={12 + Math.cos(rad) * 9.5} y2={12 + Math.sin(rad) * 9.5} />;
        })}
      </svg>
    );
  }
  if (cond === 'rain') {
    return (
      <svg {...s}>
        <path d="M7 14.5a3.8 3.8 0 0 1 .6-7.5 5 5 0 0 1 9.7 1.3 3.4 3.4 0 0 1-.3 6.7H8.2" fill="currentColor" stroke="none" opacity="0.9" />
        <line x1="9" y1="17.5" x2="8" y2="20.5" />
        <line x1="13" y1="17.5" x2="12" y2="20.5" />
        <line x1="17" y1="17.5" x2="16" y2="20.5" />
      </svg>
    );
  }
  if (cond === 'storm') {
    return (
      <svg {...s}>
        <path d="M7 13.5a3.8 3.8 0 0 1 .6-7.5 5 5 0 0 1 9.7 1.3 3.4 3.4 0 0 1-.3 6.7H8.2" fill="currentColor" stroke="none" opacity="0.9" />
        <path d="M12.5 14l-2.5 4h2.2L10.8 21l4-5h-2.4l1.6-2z" fill="currentColor" stroke="none" />
      </svg>
    );
  }
  if (cond === 'snow') {
    return (
      <svg {...s}>
        <path d="M7 14.5a3.8 3.8 0 0 1 .6-7.5 5 5 0 0 1 9.7 1.3 3.4 3.4 0 0 1-.3 6.7H8.2" fill="currentColor" stroke="none" opacity="0.9" />
        <circle cx="9" cy="18" r="1" fill="currentColor" stroke="none" />
        <circle cx="13.5" cy="20" r="1" fill="currentColor" stroke="none" />
        <circle cx="17" cy="17.5" r="1" fill="currentColor" stroke="none" />
      </svg>
    );
  }
  return (
    <svg {...s}>
      <line x1="5" y1="9" x2="19" y2="9" />
      <line x1="7" y1="13" x2="21" y2="13" />
      <line x1="5" y1="17" x2="19" y2="17" />
      <line x1="8" y1="21" x2="16" y2="21" opacity="0.6" />
    </svg>
  );
}

function App() {
  const [moods, setMoods] = useState({ cosy: 55, eerie: 0, heroic: 30 });
  const [tod, setTod] = useState('night');
  const [focus, setFocus] = useState(2);
  const [sound, setSound] = useState(false);
  const [auto, setAuto] = useState(false);
  const [replayTick, setReplayTick] = useState(0);
  const audioRef = useRef(null);
  const sceneRef = useRef({ moods, tod, focus, replay: false, onThunder: null });

  const ensureAudio = () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioRef.current) audioRef.current = new AC();
      if (audioRef.current.state === 'suspended') audioRef.current.resume();
      return audioRef.current;
    } catch (e) { return null; }
  };

  const thunder = useCallback(() => {
    const actx = ensureAudio();
    if (!actx) return;
    try {
      const t0 = actx.currentTime + 0.12;
      const dur = 2.6;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const env = Math.pow(1 - i / d.length, 2.3);
        d[i] = (Math.random() * 2 - 1) * env;
      }
      const src = actx.createBufferSource();
      src.buffer = buf;
      const f = actx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(180, t0);
      f.frequency.exponentialRampToValueAtTime(50, t0 + dur);
      const g = actx.createGain();
      g.gain.setValueAtTime(0.5, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start(t0);
      src.stop(t0 + dur);
    } catch (e) {}
  }, []);

  sceneRef.current.moods = moods;
  sceneRef.current.tod = tod;
  sceneRef.current.focus = focus;
  sceneRef.current.onThunder = sound ? thunder : null;

  useEffect(() => {
    if (!auto) return;
    const id = setInterval(() => setFocus(f => (f + 1) % FORECAST.length), 9000);
    return () => clearInterval(id);
  }, [auto]);

  useEffect(() => {
    const onKey = e => {
      if (e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
      if (e.key === 'c' || e.key === 'C') setReplayTick(t => t + 1);
      if (e.key === 'n' || e.key === 'N') setTod(t => (t === 'night' ? 'matinee' : 'night'));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const toggleSound = () => {
    const next = !sound;
    setSound(next);
    if (next) ensureAudio();
  };

  const f = FORECAST[focus];
  const w = weightsOf(moods);
  const dom = dominantOf(w);
  const line = LINES[f.cond][dom];
  const st = SUB_STYLE[dom];

  return (
    <div className="app">
      <header className="marquee">
        <div className="marquee-row">
          <Bulbs n={8} />
          <h1>Weather Theatre</h1>
          <Bulbs n={8} />
        </div>
        <div className="tagline">A one-room forecast · five acts · no weather was harmed</div>
      </header>

      <Stage sceneRef={sceneRef} replayTick={replayTick} />

      <div className="board">
        <div className="board-act">Act {focus + 1} of 5 · {f.full}</div>
        <div className="board-text" style={{ font: st.font, color: st.color, letterSpacing: st.ls, textTransform: st.upper ? 'uppercase' : 'none' }}>
          <Typewriter text={line} />
        </div>
        <div className="board-temp">{f.temp}°<small>{f.cond}</small></div>
      </div>

      <div className="console">
        <div className="console-col">
          <div className="console-label">Mood mixer</div>
          <div className="faders">
            <Fader label="Cosy" color="#f2b04e" value={moods.cosy} onChange={v => setMoods(m => ({ ...m, cosy: v }))} />
            <Fader label="Eerie" color="#8fa7ff" value={moods.eerie} onChange={v => setMoods(m => ({ ...m, eerie: v }))} />
            <Fader label="Heroic" color="#ff6a4d" value={moods.heroic} onChange={v => setMoods(m => ({ ...m, heroic: v }))} />
          </div>
        </div>
        <div className="console-col">
          <div className="console-label">Tonight's programme</div>
          <div className="programme">
            {FORECAST.map((d, i) => (
              <button key={d.day} className={'day' + (i === focus ? ' active' : '')} onClick={() => { setFocus(i); setAuto(false); }}>
                <span className="day-name">{d.day}</span>
                <WeatherIcon cond={d.cond} />
                <span className="day-temp">{d.temp}°</span>
              </button>
            ))}
          </div>
        </div>
        <div className="console-col">
          <div className="console-label">House</div>
          <div className="switches">
            <div className="switch">
              <button className={tod === 'matinee' ? 'on' : ''} onClick={() => setTod('matinee')}>Matinée</button>
              <button className={tod === 'night' ? 'on' : ''} onClick={() => setTod('night')}>Night</button>
            </div>
            <div className="switch">
              <button className={!sound ? 'on' : ''} onClick={toggleSound}>Sound off</button>
              <button className={sound ? 'on' : ''} onClick={toggleSound}>Sound on</button>
            </div>
            <div className="switch">
              <button className={!auto ? 'on' : ''} onClick={() => setAuto(a => !a)}>Show off</button>
              <button className={auto ? 'on' : ''} onClick={() => setAuto(a => !a)}>Show on</button>
            </div>
            <button className="btn" onClick={() => setReplayTick(t => t + 1)}>Raise the curtain</button>
          </div>
        </div>
      </div>

      <div className="footnote">The same five-day forecast, staged three ways · C — curtain · N — night</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
