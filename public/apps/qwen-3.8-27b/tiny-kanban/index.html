<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tiny Kanban — Standup Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Crect x='3' y='4' width='5' height='16' rx='1.5'/%3E%3Crect x='9.5' y='4' width='5' height='11' rx='1.5'/%3E%3Crect x='16' y='4' width='5' height='14' rx='1.5'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#f7f8fc;--bg2:#edf0f6;
  --ink:#1c2333;--muted:#667085;--faint:#98a2b3;
  --line:#e4e8f0;--accent:#4f46e5;--accent-dark:#4338ca;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 500px at 85% -5%, rgba(99,102,241,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(16,185,129,.07), transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
kbd{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--faint);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

header{
  display:flex;align-items:center;gap:16px;
  padding:13px 22px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:5;
}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{
  width:40px;height:40px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,#6366f1,#4338ca);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 16px rgba(79,70,229,.35);
}
.logo svg{width:21px;height:21px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand p{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.progress-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:320px;margin-left:12px}
.progress{flex:1;height:8px;border-radius:99px;background:#e6eaf2;overflow:hidden;box-shadow:inset 0 1px 2px rgba(16,24,40,.06)}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#10b981,#34d399);transition:width .45s cubic-bezier(.22,1,.36,1)}
.progress-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.search-wrap{position:relative;flex:none;margin-left:auto}
.search-wrap .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
#search{
  width:250px;padding:9px 58px 9px 34px;
  border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:13.5px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
  transition:width .2s ease,box-shadow .15s,border-color .15s;
}
#search::placeholder{color:var(--faint)}
#search:focus{outline:none;width:290px;border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.14)}
.search-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.clear-btn{
  position:absolute;right:32px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;border:none;background:#e8ecf3;color:#64748b;
  display:none;place-items:center;
}
.clear-btn:hover{background:#d8dee9;color:#111827}
.clear-btn svg{width:10px;height:10px}
.search-wrap.has-value .clear-btn{display:grid}
.match-chip{
  display:none;flex:none;
  font-size:12px;font-weight:700;color:var(--accent);
  background:#eef2ff;border:1px solid #c7d2fe;
  padding:5px 11px;border-radius:99px;
}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:600;
  padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  transition:background .15s,box-shadow .15s,transform .05s;
}
.btn:hover{background:#f6f8fb}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.btn-primary:hover{background:var(--accent-dark)}
.btn-danger-ghost{color:#dc2626;border-color:#fecaca;background:#fff}
.btn-danger-ghost:hover{background:#fef2f2}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:none;background:transparent;
  color:var(--faint);display:grid;place-items:center;flex:none;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:#e9edf4;color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

main{flex:1;display:flex;gap:16px;padding:18px 22px 14px;overflow-x:auto;overflow-y:hidden;min-height:0}
.column{
  flex:1 1 0;min-width:272px;max-width:430px;
  display:flex;flex-direction:column;min-height:0;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(228,232,240,.9);
  border-radius:16px;
  box-shadow:0 1px 2px rgba(16,24,40,.03);
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.column.wip-blocked{
  background:rgba(254,242,242,.7);
  border-color:#fca5a5;
  box-shadow:0 0 0 3px rgba(239,68,68,.12);
}
.col-head{display:flex;align-items:center;gap:9px;padding:14px 12px 10px 16px;flex:none}
.col-head .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.col-head h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#475467}
.wip-badge{
  margin-left:auto;flex:none;
  font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:99px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  cursor:pointer;user-select:none;
  transition:background .15s,border-color .15s,color .15s;
}
.wip-badge:hover{border-color:#c7d2fe;color:var(--accent)}
.wip-badge.full{background:#fffaeb;border-color:#fcd34d;color:#b45309}
.wip-badge.over{background:#fef2f2;border-color:#fca5a5;color:#dc2626;animation:wipPulse 1.4s ease-in-out infinite}
@keyframes wipPulse{50%{box-shadow:0 0 0 4px rgba(239,68,68,.14)}}
.wip-badge input{
  width:46px;font-size:11.5px;font-weight:700;text-align:center;
  padding:2px 3px;border:1px solid #a5b4fc;border-radius:6px;background:#fff;outline:none;
}

.quick-add{display:none;padding:0 12px 10px;flex:none}
.quick-add.open{display:block}
.qa-input{
  width:100%;font-size:14px;padding:10px 12px;
  border:1.5px solid #a5b4fc;border-radius:10px;background:#fff;
  box-shadow:0 0 0 3px rgba(99,102,241,.12);outline:none;
}
.qa-input::placeholder{color:var(--faint)}
.qa-row{display:flex;gap:8px;margin-top:8px}
.qa-row .btn{padding:7px 13px;font-size:13px}

.cards{
  flex:1;min-height:80px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  padding:2px 12px 12px;
}
.cards::-webkit-scrollbar{width:9px}
.cards::-webkit-scrollbar-thumb{background:#d0d7e3;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.empty{
  border:2px dashed #d3dae6;border-radius:12px;
  padding:26px 14px;text-align:center;
  color:var(--faint);font-size:13px;font-weight:500;
  pointer-events:none;
}
.card{
  position:relative;flex:none;
  background:#fff;
  border:1px solid #e7ebf2;
  border-left:4px solid var(--pc,#94a3b8);
  border-radius:12px;
  padding:11px 13px 12px;
  box-shadow:0 1px 2px rgba(16,24,40,.05);
  cursor:grab;user-select:none;
  transition:box-shadow .15s,transform .15s,opacity .15s;
}
.card:hover{box-shadow:0 5px 16px rgba(16,24,40,.10);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4;transform:rotate(1.5deg) scale(1.02);box-shadow:0 14px 30px rgba(16,24,40,.2);cursor:grabbing}
.card.pop{animation:cardPop .28s cubic-bezier(.22,1,.36,1)}
@keyframes cardPop{from{transform:scale(.9);opacity:.3}}
.p-low{--pc:#94a3b8}
.p-medium{--pc:#f59e0b}
.p-high{--pc:#f97316}
.p-urgent{--pc:#ef4444}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.prio{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;
}
.prio i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-low .prio{background:#f1f5f9;color:#475569}
.p-medium .prio{background:#fef3c7;color:#92400e}
.p-high .prio{background:#ffedd5;color:#9a3412}
.p-urgent .prio{background:#fee2e2;color:#b91c1c}
.del{
  width:24px;height:24px;border-radius:7px;border:none;background:transparent;
  color:#b6bfce;display:grid;place-items:center;flex:none;
  opacity:0;transition:opacity .12s,background .12s,color .12s;
}
.card:hover .del,.card:focus-within .del{opacity:1}
.del:hover{background:#fef2f2;color:#dc2626}
.del svg{width:14px;height:14px}
.title{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.01em;overflow-wrap:break-word}
.is-done .title::before{
  content:'✓';
  display:inline-grid;place-items:center;
  width:18px;height:18px;margin-right:7px;
  border-radius:50%;background:#d1fae5;color:#059669;
  font-size:11px;font-weight:800;
  vertical-align:-3px;
}
.desc{
  margin-top:5px;font-size:13px;line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:break-word;
}
.foot{display:flex;align-items:center;margin-top:11px}
.assignee{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#475467}
.assignee.none{color:#b3bccb;font-weight:500;font-style:italic}
.avatar{
  width:24px;height:24px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.03em;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.12);
}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}

footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:9px 22px;
  background:rgba(255,255,255,.7);
  border-top:1px solid var(--line);
  font-size:12px;color:var(--faint);
}
.link-btn{background:none;border:none;padding:0;color:var(--faint);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--accent)}

.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;
  background:#fff;border-radius:18px;
  box-shadow:0 24px 64px rgba(15,23,42,.28);
  transform:translateY(10px) scale(.97);transition:transform .18s cubic-bezier(.22,1,.36,1);
}
.overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
.modal-head h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.modal-body{padding:18px 22px 4px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field textarea,.field select{
  width:100%;font-size:14px;
  padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fbfcfe;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.12);background:#fff}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.prio-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prio-opt{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12.5px;font-weight:600;color:#475467;
  padding:9px 4px;border-radius:10px;
  border:1.5px solid var(--line);background:#fff;
  transition:all .12s;
}
.prio-opt i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--pc)}
.prio-opt[data-p="low"]{--pc:#94a3b8;--pbg:#f1f5f9;--pt:#475569}
.prio-opt[data-p="medium"]{--pc:#f59e0b;--pbg:#fef3c7;--pt:#92400e}
.prio-opt[data-p="high"]{--pc:#f97316;--pbg:#ffedd5;--pt:#9a3412}
.prio-opt[data-p="urgent"]{--pc:#ef4444;--pbg:#fee2e2;--pt:#b91c1c}
.prio-opt:hover{border-color:#c7d2fe}
.prio-opt.selected{border-color:var(--pc);background:var(--pbg);color:var(--pt)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{display:flex;align-items:center;gap:10px;padding:18px 22px 22px}
.modal-foot .spacer{flex:1}

#toast{
  position:fixed;left:50%;bottom:28px;z-index:60;
  transform:translate(-50%,14px);
  display:flex;align-items:center;gap:14px;
  max-width:calc(100vw - 40px);
  background:#111827;color:#f9fafb;
  font-size:13.5px;font-weight:500;
  padding:12px 16px;border-radius:12px;
  box-shadow:0 16px 40px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s cubic-bezier(.22,1,.36,1);
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{
  background:none;border:none;padding:2px 6px;border-radius:6px;
  font-size:13px;font-weight:800;color:#a5b4fc;
}
#toast button:hover{color:#c7d2fe;background:rgba(255,255,255,.08)}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}

.boot .column{animation:colRise .4s cubic-bezier(.22,1,.36,1) both}
.boot .column:nth-child(2){animation-delay:.06s}
.boot .column:nth-child(3){animation-delay:.12s}
@keyframes colRise{from{opacity:0;transform:translateY(10px)}}

@media (max-width:980px){
  .progress-wrap{display:none}
  #search{width:170px}
  #search:focus{width:200px}
  .brand p{display:none}
}
@media (max-width:640px){
  header{flex-wrap:wrap}
  .search-wrap{order:5;margin-left:0;flex:1}
  #search{width:100%}
  main{padding:14px}
  .column{min-width:240px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></svg>
    </div>
    <div>
      <h1>Tiny Kanban</h1>
      <p>Daily standup board</p>
    </div>
  </div>
  <div class="progress-wrap" aria-hidden="true">
    <div class="progress"><i id="progressBar"></i></div>
    <span class="progress-label" id="progressLabel"></span>
  </div>
  <div class="search-wrap" id="searchWrap">
    <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search cards or people" autocomplete="off" spellcheck="false" aria-label="Search cards"/>
    <button class="clear-btn" id="searchClear" aria-label="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <kbd class="search-kbd">/</kbd>
  </div>
  <span class="match-chip" id="matchCount"></span>
  <button class="btn btn-primary" id="newCardBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New card
  </button>
</header>

<main id="board">
  <section class="column" data-col="todo" aria-label="To Do column">
    <header class="col-head">
      <span class="dot" style="background:#6366f1"></span>
      <h2>To Do</h2>
      <div class="wip-badge" data-col="todo" role="button" tabindex="0" title="WIP limit — click to edit">0/5</div>
      <button class="icon-btn add-btn" aria-label="Add card to To Do" title="Add card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="quick-add" id="qa-todo">
      <input type="text" class="qa-input" placeholder="Card title, then press Enter…" maxlength="120" aria-label="New To Do card title"/>
      <div class="qa-row">
        <button class="btn btn-primary qa-add">Add card</button>
        <button class="btn qa-cancel">Cancel</button>
      </div>
    </div>
    <div class="cards" data-col="todo" role="list"></div>
  </section>

  <section class="column" data-col="doing" aria-label="Doing column">
    <header class="col-head">
      <span class="dot" style="background:#f59e0b"></span>
      <h2>Doing</h2>
      <div class="wip-badge" data-col="doing" role="button" tabindex="0" title="WIP limit — click to edit">0/3</div>
      <button class="icon-btn add-btn" aria-label="Add card to Doing" title="Add card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="quick-add" id="qa-doing">
      <input type="text" class="qa-input" placeholder="Card title, then press Enter…" maxlength="120" aria-label="New Doing card title"/>
      <div class="qa-row">
        <button class="btn btn-primary qa-add">Add card</button>
        <button class="btn qa-cancel">Cancel</button>
      </div>
    </div>
    <div class="cards" data-col="doing" role="list"></div>
  </section>

  <section class="column" data-col="done" aria-label="Done column">
    <header class="col-head">
      <span class="dot" style="background:#10b981"></span>
      <h2>Done</h2>
      <div class="wip-badge" data-col="done" role="button" tabindex="0" title="WIP limit — click to edit">0 / ∞</div>
      <button class="icon-btn add-btn" aria-label="Add card to Done" title="Add card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="quick-add" id="qa-done">
      <input type="text" class="qa-input" placeholder="Card title, then press Enter…" maxlength="120" aria-label="New Done card title"/>
      <div class="qa-row">
        <button class="btn btn-primary qa-add">Add card</button>
        <button class="btn qa-cancel">Cancel</button>
      </div>
    </div>
    <div class="cards" data-col="done" role="list"></div>
  </section>
</main>

<footer>
  <div>Drag cards between columns · Click a card to edit · <kbd>/</kbd> to search</div>
  <div>Click a counter to set its WIP limit · <button id="resetBtn" class="link-btn">Reset sample data</button></div>
</footer>

<canvas id="confetti"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Edit card</h3>
      <button class="icon-btn" id="modalClose" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" placeholder="What needs doing?" maxlength="120"/>
      </div>
      <div class="field">
        <label for="fDesc">Notes</label>
        <textarea id="fDesc" placeholder="Optional context, links, acceptance criteria…" maxlength="400"></textarea>
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="prio-picker" id="prioPicker">
          <button type="button" class="prio-opt" data-p="low"><i></i>Low</button>
          <button type="button" class="prio-opt" data-p="medium"><i></i>Medium</button>
          <button type="button" class="prio-opt" data-p="high"><i></i>High</button>
          <button type="button" class="prio-opt" data-p="urgent"><i></i>Urgent</button>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fAssignee">Assignee</label>
          <select id="fAssignee">
            <option value="">Unassigned</option>
            <option value="p1">Ava Chen</option>
            <option value="p2">Ben Ortiz</option>
            <option value="p3">Chloe Kim</option>
            <option value="p4">Dev Patel</option>
            <option value="p5">Eli Novak</option>
          </select>
        </div>
        <div class="field">
          <label for="fCol">Column</label>
          <select id="fCol">
            <option value="todo">To Do</option>
            <option value="doing">Doing</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" id="modalDelete">Delete</button>
      <span class="spacer"></span>
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save card</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const initials = name => name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const truncate = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

const COLS = [
  { id: 'todo',  name: 'To Do' },
  { id: 'doing', name: 'Doing' },
  { id: 'done',  name: 'Done'  },
];
const PRIORITIES = [
  { id: 'low',    label: 'Low' },
  { id: 'medium', label: 'Medium' },
  { id: 'high',   label: 'High' },
  { id: 'urgent', label: 'Urgent' },
];
const PEOPLE = [
  { id: 'p1', name: 'Ava Chen',  color: '#6366f1' },
  { id: 'p2', name: 'Ben Ortiz', color: '#0ea5e9' },
  { id: 'p3', name: 'Chloe Kim', color: '#10b981' },
  { id: 'p4', name: 'Dev Patel', color: '#f59e0b' },
  { id: 'p5', name: 'Eli Novak', color: '#ec4899' },
];
const LS_KEY = 'tiny-kanban-v1';

const SVG = {
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
};

function seedState(){
  const order = { todo: [], doing: [], done: [] };
  const cards = {};
  function add(title, desc, priority, assignee, col){
    const card = { id: uid(), title, desc, priority, assignee, createdAt: Date.now() };
    cards[card.id] = card;
    order[col].push(card.id);
  }
  add('Fix login redirect loop', 'Users on SSO are bounced back to /login after auth. Suspect the callback URL env var.', 'urgent', 'p1', 'todo');
  add('Write Q3 retro notes', 'Pull top themes from the survey and share before Thursday.', 'low', null, 'todo');
  add('Update onboarding email copy', '', 'medium', 'p3', 'todo');
  add('Ship drag & drop on mobile', 'Touch targets are too small on the tablets we use in standup.', 'high', 'p2', 'doing');
  add('Refactor billing webhook handler', 'Split retry logic out of the handler; add idempotency key check.', 'high', 'p4', 'doing');
  add('Upgrade CI runners to 8-core', '', 'medium', 'p5', 'done');
  add('Fix flaky checkout e2e test', 'Was waiting on a spinner that no longer renders.', 'low', 'p1', 'done');
  return { cards, order, limits: { todo: 5, doing: 3, done: 0 } };
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.cards || !s.order || !s.limits) return null;
    for(const c of ['todo','doing','done']) if(!Array.isArray(s.order[c])) return null;
    return s;
  }catch(e){ return null; }
}

let state = load() || seedState();
let query = '';
let draggedCard = null;
let dragFromCol = null;
let didDrag = false;

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

function renderText(text){
  if(!query) return esc(text);
  const lower = text.toLowerCase();
  const q = query.toLowerCase();
  let out = '', i = 0;
  for(;;){
    const idx = lower.indexOf(q, i);
    if(idx === -1){ out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out;
}

function matchesQuery(card){
  if(!query) return true;
  const p = PEOPLE.find(x => x.id === card.assignee);
  const hay = (card.title + ' ' + (card.desc || '') + ' ' + (p ? p.name : '')).toLowerCase();
  return hay.includes(query.toLowerCase());
}

function emptyEl(searching){
  const d = document.createElement('div');
  d.className = 'empty';
  d.textContent = searching ? 'No matching cards' : 'No cards yet — add one';
  return d;
}

function cardEl(card){
  const el = document.createElement('article');
  el.className = 'card p-' + card.priority + (card.col === 'done' ? ' is-done' : '');
  el.dataset.id = card.id;
  el.draggable = true;
  el.tabIndex = 0;
  el.setAttribute('role', 'listitem');
  const person = PEOPLE.find(p => p.id === card.assignee);
  const prioLabel = (PRIORITIES.find(p => p.id === card.priority) || PRIORITIES[1]).label;
  el.innerHTML =
    '<div class="card-top">' +
      '<span class="prio"><i></i>' + prioLabel + '</span>' +
      '<button class="del" aria-label="Delete card" title="Delete card">' + SVG.trash + '</button>' +
    '</div>' +
    '<h3 class="title">' + renderText(card.title) + '</h3>' +
    (card.desc ? '<p class="desc">' + renderText(card.desc) + '</p>' : '') +
    '<div class="foot">' +
      (person
        ? '<span class="assignee" title="' + esc(person.name) + '"><span class="avatar" style="background:' + person.color + '">' + initials(person.name) + '</span>' + esc(person.name.split(' ')[0]) + '</span>'
        : '<span class="assignee none">Unassigned</span>') +
    '</div>';

  el.addEventListener('dragstart', e => {
    draggedCard = el;
    dragFromCol = el.closest('.column').dataset.col;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.id);
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    $$('.column').forEach(c => c.classList.remove('wip-blocked'));
    const toCol = el.closest('.column') ? el.closest('.column').dataset.col : null;
    if(dragFromCol !== 'done' && toCol === 'done'){
      const r = el.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    }
    draggedCard = null;
    didDrag = true;
    setTimeout(() => { didDrag = false; }, 80);
    syncFromDOM();
  });
  el.addEventListener('click', e => {
    if(didDrag) return;
    if(e.target.closest('.del')) return;
    openModal(card.id);
  });
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(card.id); }
  });
  $('.del', el).addEventListener('click', e => {
    e.stopPropagation();
    deleteCard(card.id);
  });
  return el;
}

function updateWipBadge(colId){
  const badge = $('.wip-badge[data-col="' + colId + '"]');
  delete badge.dataset.editing;
  const count = state.order[colId].length;
  const limit = state.limits[colId];
  badge.classList.remove('full', 'over');
  if(limit > 0){
    badge.textContent = count + '/' + limit;
    if(count > limit) badge.classList.add('over');
    else if(count === limit) badge.classList.add('full');
  }else{
    badge.textContent = count + ' / ∞';
  }
}

function updateProgress(total){
  const done = state.order.done.filter(id => state.cards[id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#progressBar').style.width = pct + '%';
  $('#progressLabel').textContent = total ? done + '/' + total + ' done' : 'No cards';
}

function updateMatchCount(visible, total){
  const chip = $('#matchCount');
  if(query){
    chip.textContent = visible + ' of ' + total + ' cards';
    chip.style.display = 'inline-block';
  }else{
    chip.style.display = 'none';
  }
}

function renderAll(){
  const total = Object.keys(state.cards).length;
  let visible = 0;
  for(const col of COLS){
    const body = $('.cards[data-col="' + col.id + '"]');
    body.innerHTML = '';
    const ids = state.order[col.id].filter(id => state.cards[id]);
    const shown = ids.map(id => state.cards[id]).filter(matchesQuery);
    if(shown.length === 0){
      body.appendChild(emptyEl(!!query));
    }else{
      for(const card of shown) body.appendChild(cardEl(card));
    }
    visible += shown.length;
    updateWipBadge(col.id);
  }
  updateProgress(total);
  updateMatchCount(visible, total);
}

function getAfter(body, y){
  const els = $$('.card:not(.dragging)', body);
  let closest = { offset: -Infinity, el: null };
  for(const child of els){
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if(offset < 0 && offset > closest.offset) closest = { offset, el: child };
  }
  return closest.el;
}

function syncFromDOM(){
  for(const col of COLS){
    const body = $('.cards[data-col="' + col.id + '"]');
    state.order[col.id] = $$('.card', body).map(el => el.dataset.id);
    for(const id of state.order[col.id]){
      if(state.cards[id]) state.cards[id].col = col.id;
    }
  }
  save();
  renderAll();
}

for(const col of COLS){
  const section = $('.column[data-col="' + col.id + '"]');
  section.addEventListener('dragover', e => {
    if(!draggedCard) return;
    const body = $('.cards', section);
    const limit = state.limits[col.id];
    const count = state.order[col.id].length;
    const blocked = dragFromCol !== col.id && limit > 0 && count >= limit;
    section.classList.toggle('wip-blocked', blocked);
    if(blocked) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const ph = $('.empty', body);
    if(ph) ph.remove();
    const after = getAfter(body, e.clientY);
    if(after === null) body.appendChild(draggedCard);
    else body.insertBefore(draggedCard, after);
  });
  section.addEventListener('drop', e => {
    e.preventDefault();
    section.classList.remove('wip-blocked');
  });
  section.addEventListener('dragleave', e => {
    if(!section.contains(e.relatedTarget)) section.classList.remove('wip-blocked');
  });
}

function checkWipToast(colId){
  const limit = state.limits[colId];
  const count = state.order[colId].length;
  if(limit > 0 && count > limit){
    const name = COLS.find(c => c.id === colId).name;
    toast(name + ' is over its WIP limit (' + count + '/' + limit + ')', { timeout: 4200 });
  }
}

function startLimitEdit(badge){
  if(badge.dataset.editing) return;
  badge.dataset.editing = '1';
  const colId = badge.dataset.col;
  const cur = state.limits[colId];
  const input = document.createElement('input');
  input.type = 'number';
  input.min = '1';
  input.inputMode = 'numeric';
  input.value = cur > 0 ? String(cur) : '';
  input.placeholder = '∞';
  input.title = 'Max cards (blank = unlimited)';
  badge.textContent = '';
  badge.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const finish = commitIt => {
    if(done) return;
    done = true;
    if(commitIt){
      const v = parseInt(input.value, 10);
      state.limits[colId] = (Number.isFinite(v) && v >= 1) ? v : 0;
      save();
      checkWipToast(colId);
    }
    renderAll();
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter') finish(true);
    else if(e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

$$('.wip-badge').forEach(badge => {
  badge.addEventListener('click', () => startLimitEdit(badge));
  badge.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startLimitEdit(badge); }
  });
});

for(const col of COLS){
  const section = $('.column[data-col="' + col.id + '"]');
  const qa = $('#qa-' + col.id);
  const input = $('.qa-input', qa);
  $('.add-btn', section).addEventListener('click', () => {
    qa.classList.add('open');
    input.focus();
  });
  $('.qa-cancel', qa).addEventListener('click', () => {
    qa.classList.remove('open');
    input.value = '';
  });
  const submit = () => {
    const t = input.value.trim();
    if(!t){ input.focus(); return; }
    const id = uid();
    state.cards[id] = { id, title: t, desc: '', priority: 'medium', assignee: null, col: col.id, createdAt: Date.now() };
    state.order[col.id].push(id);
    save();
    renderAll();
    const el = $('.card[data-id="' + id + '"]');
    if(el) el.classList.add('pop');
    input.value = '';
    input.focus();
    checkWipToast(col.id);
  };
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') submit();
    if(e.key === 'Escape'){ qa.classList.remove('open'); input.value = ''; }
  });
  $('.qa-add', qa).addEventListener('click', submit);
}

const overlay = $('#overlay');
let editingId = null;
let modalPrio = 'medium';

function syncPrioPicker(){
  $$('.prio-opt').forEach(b => b.classList.toggle('selected', b.dataset.p === modalPrio));
}
$$('.prio-opt').forEach(b => b.addEventListener('click', () => {
  modalPrio = b.dataset.p;
  syncPrioPicker();
}));

function openModal(id, defaultCol){
  editingId = id;
  const card = id ? state.cards[id] : null;
  $('#modalTitle').textContent = card ? 'Edit card' : 'New card';
  $('#fTitle').value = card ? card.title : '';
  $('#fDesc').value = card ? (card.desc || '') : '';
  modalPrio = card ? card.priority : 'medium';
  syncPrioPicker();
  $('#fAssignee').value = card ? (card.assignee || '') : '';
  $('#fCol').value = card ? card.col : (defaultCol || 'todo');
  $('#modalDelete').style.visibility = card ? 'visible' : 'hidden';
  overlay.classList.add('open');
  setTimeout(() => { const t = $('#fTitle'); t.focus(); t.select(); }, 80);
}
function closeModal(){
  overlay.classList.remove('open');
  editingId = null;
}

function saveModal(){
  const titleEl = $('#fTitle');
  const title = titleEl.value.trim();
  if(!title){
    titleEl.classList.remove('shake');
    void titleEl.offsetWidth;
    titleEl.classList.add('shake');
    titleEl.focus();
    return;
  }
  const col = $('#fCol').value;
  const data = {
    title,
    desc: $('#fDesc').value.trim(),
    priority: modalPrio,
    assignee: $('#fAssignee').value || null,
    col,
  };
  let celebrate = false;
  if(editingId){
    const card = state.cards[editingId];
    const oldCol = card.col;
    Object.assign(card, data);
    if(oldCol !== col){
      state.order[oldCol] = state.order[oldCol].filter(x => x !== editingId);
      state.order[col].push(editingId);
    }
    celebrate = col === 'done' && oldCol !== 'done';
  }else{
    const id = uid();
    state.cards[id] = Object.assign({ id, createdAt: Date.now() }, data);
    state.order[col].push(id);
    celebrate = col === 'done';
  }
  save();
  renderAll();
  closeModal();
  checkWipToast(col);
  if(celebrate) confetti(window.innerWidth / 2, window.innerHeight * 0.35);
}

$('#modalClose').addEventListener('click', closeModal);
$('#modalCancel').addEventListener('click', closeModal);
$('#modalSave').addEventListener('click', saveModal);
$('#modalDelete').addEventListener('click', () => {
  const id = editingId;
  closeModal();
  if(id) deleteCard(id);
});
overlay.addEventListener('mousedown', e => { if(e.target === overlay) closeModal(); });
$('#fTitle').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); saveModal(); }
});
$('#newCardBtn').addEventListener('click', () => openModal(null, 'todo'));

function deleteCard(id){
  const card = state.cards[id];
  if(!card) return;
  const col = COLS.find(c => state.order[c.id].includes(id));
  const idx = state.order[col.id].indexOf(id);
  delete state.cards[id];
  state.order[col.id].splice(idx, 1);
  save();
  renderAll();
  toast('Deleted “' + truncate(card.title, 28) + '”', {
    label: 'Undo',
    fn: () => {
      state.cards[id] = card;
      state.order[col.id].splice(Math.min(idx, state.order[col.id].length), 0, id);
      save();
      renderAll();
    },
  });
}

let toastTimer = null;
function toast(msg, opts){
  opts = opts || {};
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>';
  if(opts.label){
    const b = document.createElement('button');
    b.textContent = opts.label;
    b.addEventListener('click', () => { hideToast(); if(opts.fn) opts.fn(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.timeout || 4000);
}
function hideToast(){ $('#toast').classList.remove('show'); }

const searchInput = $('#search');
searchInput.addEventListener('input', () => {
  query = searchInput.value.trim();
  $('#searchWrap').classList.toggle('has-value', searchInput.value.length > 0);
  renderAll();
});
$('#searchClear').addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  $('#searchWrap').classList.remove('has-value');
  renderAll();
  searchInput.focus();
});

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
  if(e.key === '/' && !typing && !overlay.classList.contains('open')){
    e.preventDefault();
    searchInput.focus();
  }else if(e.key === 'Escape'){
    if(overlay.classList.contains('open')) closeModal();
    else if(ae === searchInput && searchInput.value){
      searchInput.value = '';
      query = '';
      $('#searchWrap').classList.remove('has-value');
      renderAll();
    }
  }
});

$('#resetBtn').addEventListener('click', () => {
  const prev = JSON.stringify(state);
  state = seedState();
  save();
  renderAll();
  toast('Board reset to sample data', {
    label: 'Undo',
    fn: () => { state = JSON.parse(prev); save(); renderAll(); },
  });
});

const cvs = $('#confetti');
const ctx = cvs.getContext('2d');
let parts = [];
let rafId = null;
const CONFETTI_COLORS = ['#6366f1', '#f59e0b', '#10b981', '#ef4444', '#ec4899', '#0ea5e9'];

function confetti(x, y){
  cvs.width = window.innerWidth;
  cvs.height = window.innerHeight;
  for(let i = 0; i < 50; i++){
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
    const sp = 4 + Math.random() * 6;
    parts.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      g: 0.18 + Math.random() * 0.1,
      s: 4 + Math.random() * 4,
      c: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
      life: 60 + Math.random() * 30,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
    });
  }
  if(!rafId) rafId = requestAnimationFrame(confettiTick);
}
function confettiTick(){
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  parts = parts.filter(p => p.life > 0 && p.y < cvs.height + 20);
  for(const p of parts){
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life--;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
    ctx.restore();
  }
  if(parts.length) rafId = requestAnimationFrame(confettiTick);
  else{
    rafId = null;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
  }
}

document.body.classList.add('boot');
setTimeout(() => document.body.classList.remove('boot'), 900);
renderAll();
</script>
</body>
