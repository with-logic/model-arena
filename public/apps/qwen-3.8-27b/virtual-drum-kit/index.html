<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Virtual Drum Kit — a studio-style drum machine you can play with your keyboard or fingers. Record takes, loop them, and groove.">
<title>Virtual Drum Kit · VDR-88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;
  --line:#262d38;
  --amber:#ffb454;
  --red:#ff453a;
  --green:#3ddc84;
  --text:#e8ecf2;
  --muted:#8b95a5;
  --level:0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{
  min-height:100vh;
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(255,180,84,.06), transparent 60%),
    radial-gradient(900px 500px at 85% 110%, rgba(80,140,255,.05), transparent 60%);
  color:var(--text);
  font-family:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:manipulation;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 50% 30%, rgba(255,180,84,calc(var(--level)*0.16)), transparent 70%);
}
.stage{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px 16px 28px}
.rack{
  position:relative;
  background:linear-gradient(180deg,#1a1f27,#12151b 60%,#101318);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
  transition:box-shadow .25s;
}
.rack.rec{
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9), 0 0 44px -6px rgba(255,69,58,.4), inset 0 1px 0 rgba(255,255,255,.06);
}
.screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa4b0,#454e59 70%,#2b323b);box-shadow:0 1px 2px rgba(0,0,0,.6);z-index:3}
.screw::after{content:'';position:absolute;left:15%;right:15%;top:45%;height:1.5px;background:#1c2129;transform:rotate(38deg)}
.screw.tl{top:10px;left:10px}
.screw.tr{top:10px;right:10px}
.screw.bl{bottom:10px;left:10px}
.screw.br{bottom:10px;right:10px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.meters{min-width:0}
.logo{
  width:42px;height:42px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a83c 45%,#9a6b1f 78%,#6e4a14);
  border:3px solid #8f98a3;
  box-shadow:0 0 18px rgba(255,180,84,.35), inset 0 2px 4px rgba(255,255,255,.4);
}
.logo::after{
  content:'';position:absolute;inset:30%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6d0,#c9973a 60%,#8a5f1d);
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
h1{font-size:21px;font-weight:700;letter-spacing:3px;text-transform:uppercase;white-space:nowrap}
.sub{font-size:10px;font-weight:600;letter-spacing:4px;color:var(--amber);margin-top:2px}
.meters{display:flex;align-items:center;gap:10px}
#scope{width:190px;height:56px;background:#0a0d12;border:1px solid var(--line);border-radius:8px;display:block}
.vu{width:12px;height:56px;background:#0a0d12;border:1px solid var(--line);border-radius:5px;position:relative;overflow:hidden}
.vu-fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(to top,#3ddc84,#ffd23e 55%,#ff453a 85%)}
.ledstrip{display:flex;flex-direction:column-reverse;gap:4px;padding:6px 4px}
.ledstrip i{width:7px;height:7px;border-radius:50%;background:#232a35;transition:background .06s,box-shadow .06s}
.ledstrip i.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}
body:not(.powered) .ledstrip i{background:#1a2029}
.kit{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px}
.pad{
  position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;
  background:linear-gradient(180deg,#1e242e,#161b23);
  border:1px solid #2b3341;border-radius:16px;cursor:pointer;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:0 5px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .15s, box-shadow .15s;
  font-family:inherit;color:inherit;
}
.pad:hover{border-color:#3a4454}
.pad:active{transform:translateY(1px)}
.pad:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pad.on{
  border-color:var(--glow);
  box-shadow:0 0 28px -4px var(--glow), 0 5px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
}
.face{flex:none;aspect-ratio:1/1;width:100%;border-radius:50%;position:relative}
.label{flex:none;text-align:center;font-size:10px;font-weight:600;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.key{
  position:absolute;top:13px;right:13px;z-index:2;
  font-size:11px;font-weight:700;color:#10141a;
  background:linear-gradient(180deg,#eef2f7,#b6bfca);
  border-radius:6px;padding:2px 7px;box-shadow:0 2px 4px rgba(0,0,0,.5);
}
.led{
  position:absolute;top:16px;left:16px;z-index:2;width:9px;height:9px;border-radius:50%;
  background:#2a3240;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
  transition:background .07s, box-shadow .07s;
}
.pad.on .led{background:var(--glow);box-shadow:0 0 12px 2px var(--glow)}
.cymbal{--glow:#ffd23e}
.tom{--glow:#6ec1ff}
.snare{--glow:#ffffff}
.kick{--glow:#ff5147}
.perc{--glow:#c792ea}
.cymbal .face{
  background:radial-gradient(circle at 35% 30%,#ffedb0,#e9b949 45%,#a8741f 75%,#6b4a12);
  box-shadow:0 0 0 2px #5d420f, 0 6px 14px rgba(0,0,0,.5),
    inset 0 4px 10px rgba(255,255,255,.28), inset 0 -10px 18px rgba(0,0,0,.35);
}
.cymbal .face::after{
  content:'';position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6d0,#d09c33 55%,#8a5f1d);
  box-shadow:0 2px 5px rgba(0,0,0,.45);
}
.tom .face{
  background:radial-gradient(circle at 35% 30%,#b07a45,#7a4c24 55%,#4e2f15);
  box-shadow:0 0 0 4px #a9b2be, 0 0 0 5px #59626e, 0 6px 14px rgba(0,0,0,.5),
    inset 0 8px 16px rgba(255,255,255,.14), inset 0 -14px 22px rgba(0,0,0,.45);
}
.snare .face{
  background:radial-gradient(circle at 35% 30%,#ffffff,#e2e6ea 45%,#b9c0c8 80%,#99a1aa);
  box-shadow:0 0 0 4px #c3ccd6, 0 0 0 5px #6a7480, 0 6px 14px rgba(0,0,0,.5),
    inset 0 6px 12px rgba(255,255,255,.5), inset 0 -14px 22px rgba(0,0,0,.25);
}
.kick .face{
  background:radial-gradient(circle at 35% 30%,#ff6b5e,#d63c2e 55%,#8f2318);
  box-shadow:0 0 0 5px #a9b2be, 0 0 0 7px #59626e, 0 8px 18px rgba(0,0,0,.55),
    inset 0 8px 16px rgba(255,255,255,.18), inset 0 -16px 26px rgba(0,0,0,.5);
}
.kick .face::after{
  content:'';position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid rgba(255,255,255,.25);
}
.perc .face{
  border-radius:26%;
  background:radial-gradient(circle at 35% 30%,#3d4655,#262d3a 60%,#181d26);
  box-shadow:0 0 0 2px #39424f, 0 6px 14px rgba(0,0,0,.5),
    inset 0 4px 10px rgba(255,255,255,.1), inset 0 -10px 18px rgba(0,0,0,.45);
}
.perc[data-pad="clap"] .face::before,
.perc[data-pad="clap"] .face::after{
  content:'';position:absolute;top:28%;width:17%;height:44%;
  border-radius:45% 45% 50% 50%;
  background:linear-gradient(180deg,#5f6b7d,#39414f);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.25);
}
.perc[data-pad="clap"] .face::before{left:24%;transform:rotate(-14deg)}
.perc[data-pad="clap"] .face::after{right:24%;transform:rotate(14deg)}
.perc[data-pad="shaker"] .face::before{
  content:'';position:absolute;inset:24%;border-radius:50%;
  background:
    radial-gradient(circle,#7c88a0 22%,transparent 24%) 0 0/30% 30%,
    radial-gradient(circle at 35% 30%,#57627a,#2c3342 70%);
  box-shadow:inset 0 3px 6px rgba(255,255,255,.15);
}
.perc[data-pad="cowbell"] .face::before{
  content:'';position:absolute;left:50%;top:46%;width:46%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50% 50% 44% 44%;
  background:linear-gradient(180deg,#d4a94e,#8a6a24 70%,#6e531c);
  box-shadow:inset 0 -8px 12px rgba(0,0,0,.4), inset 0 4px 6px rgba(255,255,255,.3), 0 4px 8px rgba(0,0,0,.5);
}
.perc[data-pad="cowbell"] .face::after{
  content:'';position:absolute;left:50%;top:62%;width:11%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;background:#2e2510;
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}
.transport{
  display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;
  padding:16px 22px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#161b23,#12151b);
}
.tgroup{display:flex;align-items:center;gap:8px}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#2b323d,#1d232c);
  border:1px solid #3a4453;border-radius:9px;color:#cdd5e0;
  padding:10px 14px;font:600 12px 'Chakra Petch',sans-serif;letter-spacing:1.5px;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  transition:all .12s;
}
.tbtn:hover{border-color:#4a5668;color:#fff}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.tbtn.disabled{opacity:.4;pointer-events:none}
.tbtn .dot{width:10px;height:10px;border-radius:50%;background:#5a2622;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
#btnRec.recording{
  background:linear-gradient(180deg,#ff5f55,#c22a20);
  border-color:#ff8a80;color:#fff;
  animation:recpulse 1.1s ease-in-out infinite;
}
#btnRec.recording .dot{background:#fff;box-shadow:0 0 8px #fff}
@keyframes recpulse{
  0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 0 0 rgba(255,69,58,.5)}
  50%{box-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 18px 4px rgba(255,69,58,.55)}
}
#btnPlay.active{background:linear-gradient(180deg,#41e08c,#1f9e5c);border-color:#7cf0b4;color:#06281a}
.tbtn.active{
  color:var(--amber);border-color:var(--amber);
  box-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 14px rgba(255,180,84,.35), inset 0 0 10px rgba(255,180,84,.12);
}
.lcd{
  flex:1;min-width:210px;
  font-family:'Share Tech Mono',ui-monospace,monospace;
  font-size:15px;letter-spacing:1px;color:#8dffb2;
  background:#07130c;border:1px solid #1d3a29;border-radius:8px;
  padding:11px 14px;text-align:center;
  text-shadow:0 0 9px rgba(120,255,170,.55);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.75);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bpm{display:flex;align-items:center;gap:6px}
.bpm-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid #3a4453;
  background:linear-gradient(180deg,#2b323d,#1d232c);color:#cdd5e0;
  font-size:17px;line-height:1;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.5);
}
.bpm-btn:active{transform:translateY(1px)}
.bpm-val{
  font-family:'Share Tech Mono',ui-monospace,monospace;
  font-size:21px;color:var(--amber);min-width:58px;text-align:center;
  background:#0d1015;border:1px solid #2a3140;border-radius:8px;padding:3px 6px;
  text-shadow:0 0 10px rgba(255,180,84,.6);
}
.beats{display:flex;align-items:center;gap:7px;margin-left:4px}
.beats i{width:8px;height:8px;border-radius:50%;background:#2a3240;transition:all .09s}
.beats i:first-child{width:11px;height:11px}
.beats i.on{background:var(--amber);box-shadow:0 0 10px var(--amber);transform:scale(1.35)}
.vol{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:600;letter-spacing:2px;color:var(--muted);margin-left:auto}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:2px;
  background:#2a3240;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:24px;border-radius:4px;
  background:linear-gradient(180deg,#eef2f7,#9aa4b0);border:1px solid #59626e;
  box-shadow:0 2px 5px rgba(0,0,0,.55);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:15px;height:24px;border-radius:4px;
  background:linear-gradient(180deg,#eef2f7,#9aa4b0);border:1px solid #59626e;
  box-shadow:0 2px 5px rgba(0,0,0,.55);cursor:pointer;
}
.hint{margin-top:14px;text-align:center;font-size:10px;letter-spacing:2px;color:#525c6b;text-transform:uppercase}
@media (max-width:720px){
  .stage{padding:12px 10px 20px}
  header{padding:12px 14px;flex-wrap:wrap;gap:10px 14px}
  .meters{width:100%;justify-content:flex-start}
  h1{font-size:15px;letter-spacing:2px}
  .sub{font-size:8px;letter-spacing:3px}
  .logo{width:32px;height:32px;border-width:2px}
  #scope{width:110px;height:40px}
  .vu{height:40px}
  .ledstrip{display:none}
  .kit{gap:9px;padding:14px}
  .pad{padding:7px;border-radius:12px}
  .label{font-size:8px;letter-spacing:1px}
  .key{font-size:9px;padding:1px 5px;top:9px;right:9px}
  .led{width:7px;height:7px;top:11px;left:11px}
  .transport{padding:12px 14px;gap:10px}
  .lcd{order:-1;flex-basis:100%;min-width:0;font-size:13px}
  .tbtn{padding:9px 11px;font-size:11px}
  .vol{margin-left:0}
  .hint{font-size:8px}
}
@media (max-width:380px){
  h1{font-size:13px;letter-spacing:1px}
  .sub{letter-spacing:2px}
  #scope{width:90px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="rack" id="rack">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <header>
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Virtual Drum Kit</h1>
          <div class="sub">VDR-88 · STUDIO SERIES</div>
        </div>
      </div>
      <div class="meters">
        <canvas id="scope" width="380" height="112"></canvas>
        <div class="vu"><div class="vu-fill" id="vuFill"></div></div>
        <div class="ledstrip" id="ledstrip"></div>
      </div>
    </header>
    <main class="kit" id="kit" aria-label="Drum pads"></main>
    <footer class="transport">
      <div class="tgroup">
        <button type="button" class="tbtn" id="btnRec" title="Record a take"><span class="dot"></span>REC</button>
        <button type="button" class="tbtn" id="btnPlay" title="Play back your take (Space)">▶ PLAY</button>
        <button type="button" class="tbtn disabled" id="btnStop" title="Stop">■ STOP</button>
        <button type="button" class="tbtn disabled" id="btnClear" title="Clear take">CLEAR</button>
      </div>
      <div class="lcd" id="lcd">READY · TAP A PAD OR PRESS A KEY</div>
      <div class="tgroup">
        <div class="bpm">
          <button type="button" class="bpm-btn" id="bpmDown" title="Slower">−</button>
          <span class="bpm-val" id="bpmVal">120</span>
          <button type="button" class="bpm-btn" id="bpmUp" title="Faster">+</button>
        </div>
        <div class="beats" id="beats"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="tgroup">
        <button type="button" class="tbtn" id="btnLoop" title="Loop playback">LOOP</button>
        <button type="button" class="tbtn" id="btnMet" title="Metronome click">MET</button>
        <button type="button" class="tbtn" id="btnDemo" title="Play a demo groove">DEMO</button>
      </div>
      <label class="vol">VOL<input type="range" id="vol" min="0" max="100" value="85"></label>
    </footer>
  </div>
  <div class="hint">Keys&nbsp; Q W E R · A S D F · Z X C V &nbsp;—&nbsp; Space&nbsp; Play / Stop &nbsp;—&nbsp; Record a take, then hit Play</div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const kit=$('#kit'), lcd=$('#lcd'), vuFill=$('#vuFill'), scope=$('#scope'),
      btnRec=$('#btnRec'), btnPlay=$('#btnPlay'), btnStop=$('#btnStop'), btnClear=$('#btnClear'),
      btnLoop=$('#btnLoop'), btnMet=$('#btnMet'), btnDemo=$('#btnDemo'),
      bpmVal=$('#bpmVal'), vol=$('#vol'), rack=$('#rack');

const PADS=[
  {id:'crash',  name:'Crash',     key:'Q', cls:'cymbal'},
  {id:'ride',   name:'Ride',      key:'W', cls:'cymbal'},
  {id:'chh',    name:'Closed HH', key:'E', cls:'cymbal'},
  {id:'ohh',    name:'Open HH',   key:'R', cls:'cymbal'},
  {id:'lthom',  name:'Low Tom',   key:'A', cls:'tom'},
  {id:'mthom',  name:'Mid Tom',   key:'S', cls:'tom'},
  {id:'snare',  name:'Snare',     key:'D', cls:'snare'},
  {id:'hthom',  name:'High Tom',  key:'F', cls:'tom'},
  {id:'kick',   name:'Kick',      key:'Z', cls:'kick'},
  {id:'clap',   name:'Clap',      key:'X', cls:'perc'},
  {id:'shaker', name:'Shaker',    key:'C', cls:'perc'},
  {id:'cowbell',name:'Cowbell',   key:'V', cls:'perc'},
];
const padEls={}, keyMap={};
for(const p of PADS){
  const el=document.createElement('button');
  el.type='button';
  el.className='pad '+p.cls;
  el.dataset.pad=p.id;
  el.setAttribute('aria-label',p.name+' pad, key '+p.key);
  el.innerHTML='<span class="face"></span><span class="key">'+p.key+'</span><span class="led"></span><span class="label">'+p.name+'</span>';
  el.addEventListener('pointerdown',e=>{e.preventDefault();trigger(p.id);});
  el.addEventListener('click',e=>{if(e.detail===0)trigger(p.id);});
  kit.appendChild(el);
  padEls[p.id]=el;
  keyMap[p.key.toLowerCase()]=p.id;
}
const leds=[];
const strip=$('#ledstrip');
for(let i=0;i<8;i++){const l=document.createElement('i');strip.appendChild(l);leds.push(l);}
const beatDots=[...document.querySelectorAll('#beats i')];

let ctx=null, master=null, analyser=null, noiseBuf=null, td8=null, td32=null;
function initAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  master=ctx.createGain();
  master.gain.value=Math.pow(vol.value/100,1.6)*1.1;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;
  comp.attack.value=0.002;comp.release.value=0.15;
  analyser=ctx.createAnalyser();
  analyser.fftSize=2048;
  analyser.smoothingTimeConstant=0.82;
  master.connect(comp);comp.connect(analyser);analyser.connect(ctx.destination);
  const len=ctx.sampleRate*2;
  noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  td8=new Uint8Array(analyser.fftSize);
  td32=new Float32Array(analyser.fftSize);
  document.body.classList.add('powered');
}
function wake(){if(ctx&&ctx.state==='suspended')ctx.resume();}
function noiseSrc(){
  const s=ctx.createBufferSource();
  s.buffer=noiseBuf;s.loop=true;
  s.playbackRate.value=0.9+Math.random()*0.2;
  return s;
}
function env(g,t,peak,decay,attack){
  if(attack>0){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+attack);
    g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
  }else{
    g.gain.setValueAtTime(peak,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+decay);
  }
}
function hat(t,v,open){
  const dur=open?0.55:0.06;
  const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  f.type='highpass';f.frequency.value=open?7000:8000;
  env(g,t,(open?0.32:0.42)*v,dur);
  n.connect(f);f.connect(g);g.connect(master);
  n.start(t);n.stop(t+dur+0.05);
  const n2=noiseSrc(),f2=ctx.createBiquadFilter(),g2=ctx.createGain();
  f2.type='bandpass';f2.frequency.value=10500+Math.random()*1500;f2.Q.value=2.5;
  env(g2,t,0.18*v,open?0.4:0.035);
  n2.connect(f2);f2.connect(g2);g2.connect(master);
  n2.start(t);n2.stop(t+dur+0.05);
}
function tom(t,v,f0,dur){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(f0*1.7,t);
  o.frequency.exponentialRampToValueAtTime(f0,t+0.07);
  env(g,t,0.8*v,dur);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+0.05);
  const n=noiseSrc(),f=ctx.createBiquadFilter(),ng=ctx.createGain();
  f.type='lowpass';f.frequency.value=900;
  env(ng,t,0.25*v,0.04);
  n.connect(f);f.connect(ng);ng.connect(master);
  n.start(t);n.stop(t+0.08);
}
const voices={
  kick(t,v){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(165,t);
    o.frequency.exponentialRampToValueAtTime(44,t+0.1);
    env(g,t,1.0*v,0.5);
    o.connect(g);g.connect(master);
    o.start(t);o.stop(t+0.55);
    const n=noiseSrc(),f=ctx.createBiquadFilter(),ng=ctx.createGain();
    f.type='lowpass';f.frequency.value=4000;
    env(ng,t,0.4*v,0.03);
    n.connect(f);f.connect(ng);ng.connect(master);
    n.start(t);n.stop(t+0.06);
  },
  snare(t,v){
    const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type='bandpass';f.frequency.value=1750;f.Q.value=0.7;
    env(g,t,0.65*v,0.18);
    n.connect(f);f.connect(g);g.connect(master);
    n.start(t);n.stop(t+0.22);
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(210,t);
    o.frequency.exponentialRampToValueAtTime(150,t+0.07);
    env(og,t,0.4*v,0.08);
    o.connect(og);og.connect(master);
    o.start(t);o.stop(t+0.1);
  },
  chh(t,v){hat(t,v,false);},
  ohh(t,v){hat(t,v,true);},
  lthom(t,v){tom(t,v,95,0.4);},
  mthom(t,v){tom(t,v,150,0.32);},
  hthom(t,v){tom(t,v,215,0.26);},
  crash(t,v){
    const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type='highpass';f.frequency.value=4500;
    env(g,t,0.4*v,1.5);
    n.connect(f);f.connect(g);g.connect(master);
    n.start(t);n.stop(t+1.6);
    const n2=noiseSrc(),f2=ctx.createBiquadFilter(),g2=ctx.createGain();
    f2.type='bandpass';f2.frequency.value=8500;f2.Q.value=0.8;
    env(g2,t,0.22*v,1.1);
    n2.connect(f2);f2.connect(g2);g2.connect(master);
    n2.start(t);n2.stop(t+1.2);
    [1244,1661,2093,2637].forEach((fr,i)=>{
      const o=ctx.createOscillator(),og=ctx.createGain();
      o.type='sine';
      o.frequency.value=fr*(1+(Math.random()-0.5)*0.01);
      env(og,t,0.05*v,0.5+i*0.25);
      o.connect(og);og.connect(master);
      o.start(t);o.stop(t+1.2);
    });
  },
  ride(t,v){
    [880,1320,1760,2640].forEach((fr,i)=>{
      const o=ctx.createOscillator(),og=ctx.createGain();
      o.type='triangle';
      o.frequency.value=fr*(1+(Math.random()-0.5)*0.008);
      env(og,t,(0.09-i*0.012)*v,0.5+i*0.12);
      o.connect(og);og.connect(master);
      o.start(t);o.stop(t+1.0);
    });
    const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type='highpass';f.frequency.value=6000;
    env(g,t,0.28*v,0.05);
    n.connect(f);f.connect(g);g.connect(master);
    n.start(t);n.stop(t+0.08);
  },
  clap(t,v){
    [0,0.012,0.024].forEach((dt,i)=>{
      const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      f.type='bandpass';f.frequency.value=1100;f.Q.value=1.1;
      env(g,t+dt,(i<2?0.35:0.45)*v,i<2?0.025:0.28);
      n.connect(f);f.connect(g);g.connect(master);
      n.start(t+dt);n.stop(t+dt+0.3);
    });
  },
  shaker(t,v){
    const n=noiseSrc(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type='bandpass';f.frequency.value=6000;f.Q.value=1.4;
    env(g,t,0.32*v,0.12,0.015);
    n.connect(f);f.connect(g);g.connect(master);
    n.start(t);n.stop(t+0.2);
  },
  cowbell(t,v){
    [540,810].forEach(fr=>{
      const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
      o.type='square';o.frequency.value=fr;
      f.type='bandpass';f.frequency.value=fr;f.Q.value=4;
      env(g,t,0.22*v,0.35);
      o.connect(f);f.connect(g);g.connect(master);
      o.start(t);o.stop(t+0.4);
    });
  },
};
function metClick(t,accent){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';
  o.frequency.value=accent?1500:950;
  env(g,t,accent?0.22:0.14,0.045);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+0.06);
}

const T={
  mode:'idle',
  events:[],
  take:0,
  bpm:120,
  loop:false,
  met:false,
  loopLen:0,
  idx:0,
  tickIdx:0,
  nextTick:0,
  sessionStart:0,
  playStart:0,
  schedTimer:null,
  visQueue:[],
};
function startScheduler(){if(!T.schedTimer)T.schedTimer=setInterval(scheduler,25);}
function stopScheduler(){if(T.schedTimer){clearInterval(T.schedTimer);T.schedTimer=null;}}
function scheduler(){
  if(!ctx)return;
  const ahead=ctx.currentTime+0.12;
  if(T.mode==='play'){
    while(T.idx<T.events.length){
      const ev=T.events[T.idx];
      const at=T.playStart+ev.t;
      if(at>=ahead)break;
      voices[ev.id](Math.max(at,ctx.currentTime+0.001),1);
      T.visQueue.push({time:at,id:ev.id});
      T.idx++;
    }
    if(T.loopLen>0&&ctx.currentTime>T.playStart+T.loopLen+0.25){
      if(T.loop){
        T.playStart=ctx.currentTime+0.06;
        T.idx=0;T.tickIdx=0;T.nextTick=T.playStart;
      }else{
        stopPlay();
      }
    }
  }
  if(T.met&&T.mode!=='idle'){
    const beat=60/T.bpm;
    while(T.nextTick<ahead){
      if(T.nextTick>=ctx.currentTime-0.02){
        metClick(T.nextTick,T.tickIdx%4===0);
        T.visQueue.push({time:T.nextTick,id:'b'+(T.tickIdx%4)});
      }
      T.nextTick+=beat;
      T.tickIdx++;
    }
  }
}
function trigger(id,v){
  v=v||1;
  initAudio();
  wake();
  const t=ctx.currentTime+0.002;
  voices[id](t,v);
  flashPad(id);
  if(T.mode==='rec'){
    T.events.push({t:Math.max(0,t-T.sessionStart),id:id});
  }
}
function startRec(){
  initAudio();wake();
  T.mode='rec';
  T.take++;
  T.events=[];
  T.loopLen=0;
  T.sessionStart=ctx.currentTime+0.08;
  T.tickIdx=0;
  T.nextTick=T.sessionStart;
  T.visQueue=[];
  startScheduler();
  updateUI();
}
function stopRec(){
  T.mode='idle';
  if(T.events.length)T.loopLen=T.events[T.events.length-1].t+1.2;
  stopScheduler();
  T.visQueue=[];
  updateUI();
}
function startPlay(){
  if(!T.events.length){flashLcd('NO TAKE — RECORD ONE OR HIT DEMO');return;}
  initAudio();wake();
  T.mode='play';
  T.playStart=ctx.currentTime+0.08;
  T.idx=0;T.tickIdx=0;
  T.nextTick=T.playStart;
  T.visQueue=[];
  startScheduler();
  updateUI();
}
function stopPlay(){
  if(T.mode!=='play')return;
  T.mode='idle';
  stopScheduler();
  T.visQueue=[];
  updateUI();
}
function clearTake(){
  stopPlay();
  T.events=[];
  T.take=0;
  T.loopLen=0;
  updateUI();
}
function demoGroove(){
  const s=60/T.bpm/4, ev=[];
  const add=(st,pad)=>ev.push({t:st*s,id:pad});
  for(let bar=0;bar<2;bar++){
    const b=bar*16;
    [0,6,10].forEach(st=>add(b+st,'kick'));
    if(bar===1)add(b+7,'kick');
    [4,12].forEach(st=>add(b+st,'snare'));
    for(let st=0;st<16;st+=2)add(b+st,'chh');
    add(b+14,'ohh');
    if(bar===0)add(b,'crash');
    else{add(b+13,'mthom');add(b+14,'hthom');add(b+15,'hthom');}
  }
  ev.sort((a,b)=>a.t-b.t);
  T.events=ev;
  T.take++;
  T.loopLen=ev[ev.length-1].t+0.9;
  T.loop=true;
  updateUI();
  startPlay();
}
function setBpm(b){
  T.bpm=Math.min(240,Math.max(40,b));
  bpmVal.textContent=T.bpm;
}

let lastLcd='',lcdOverride=null,lcdTO=null;
function flashLcd(m){
  lcdOverride=m;
  clearTimeout(lcdTO);
  lcdTO=setTimeout(()=>{lcdOverride=null;},1400);
}
function fmt(s){
  s=Math.max(0,s);
  const m=Math.floor(s/60),r=s-m*60;
  return m+':'+(r<10?'0':'')+r.toFixed(1);
}
function updateLCD(){
  let txt;
  if(lcdOverride)txt=lcdOverride;
  else if(T.mode==='rec')txt='● REC  '+fmt(ctx.currentTime-T.sessionStart);
  else if(T.mode==='play')txt='PLAY  '+fmt(Math.min(ctx.currentTime-T.playStart,T.loopLen))+' / '+fmt(T.loopLen)+(T.loop?'  ∞':'');
  else if(T.events.length)txt='TAKE '+T.take+'  '+fmt(T.loopLen)+'  '+T.events.length+' HITS';
  else txt='READY · TAP A PAD OR PRESS A KEY';
  if(txt!==lastLcd){lcd.textContent=txt;lastLcd=txt;}
}
function updateUI(){
  btnRec.classList.toggle('recording',T.mode==='rec');
  btnPlay.classList.toggle('active',T.mode==='play');
  btnStop.classList.toggle('disabled',T.mode==='idle');
  btnClear.classList.toggle('disabled',!T.events.length&&T.mode==='idle');
  btnLoop.classList.toggle('active',T.loop);
  btnMet.classList.toggle('active',T.met);
  rack.classList.toggle('rec',T.mode==='rec');
}
function flashPad(id){
  const el=padEls[id];
  if(!el)return;
  el.classList.add('on');
  el.querySelector('.face').animate(
    [{transform:'scale(0.93)',filter:'brightness(1.5)'},{transform:'scale(1)',filter:'brightness(1)'}],
    {duration:170,easing:'cubic-bezier(.2,.8,.3,1)'}
  );
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'),150);
}
function flashBeat(b){
  const i=+b.slice(1);
  beatDots.forEach((d,j)=>d.classList.toggle('on',j===i));
  clearTimeout(beatDots[i]._t);
  beatDots[i]._t=setTimeout(()=>beatDots[i].classList.remove('on'),110);
}

const sctx=scope.getContext('2d');
function drawScope(){
  const w=scope.width,h=scope.height;
  sctx.clearRect(0,0,w,h);
  sctx.strokeStyle='rgba(255,180,84,.15)';
  sctx.lineWidth=1;
  sctx.beginPath();sctx.moveTo(0,h/2);sctx.lineTo(w,h/2);sctx.stroke();
  sctx.beginPath();
  const n=td8.length,step=w/n;
  for(let i=0;i<n;i++){
    const x=i*step,y=h/2+(td8[i]/128-1)*(h/2-8);
    if(i)sctx.lineTo(x,y);else sctx.moveTo(x,y);
  }
  sctx.strokeStyle='#ffb454';
  sctx.lineWidth=2;
  sctx.shadowColor='rgba(255,180,84,.8)';
  sctx.shadowBlur=8;
  sctx.stroke();
  sctx.shadowBlur=0;
}
let level=0;
function frame(){
  requestAnimationFrame(frame);
  if(ctx&&analyser){
    analyser.getByteTimeDomainData(td8);
    drawScope();
    analyser.getFloatTimeDomainData(td32);
    let s=0;
    const n=td32.length;
    for(let i=0;i<n;i+=8)s+=td32[i]*td32[i];
    const rms=Math.sqrt(s/(n/8));
    level=Math.max(Math.min(1,rms*5),level*0.88);
    while(T.visQueue.length&&T.visQueue[0].time<=ctx.currentTime){
      const it=T.visQueue.shift();
      if(it.id[0]==='b')flashBeat(it.id);else flashPad(it.id);
    }
    updateLCD();
  }else{
    level*=0.9;
  }
  vuFill.style.height=(level*100).toFixed(1)+'%';
  document.documentElement.style.setProperty('--level',level.toFixed(3));
  const on=Math.round(level*8);
  for(let i=0;i<leds.length;i++)leds[i].classList.toggle('on',i<on);
}
requestAnimationFrame(frame);

btnRec.addEventListener('click',()=>{
  initAudio();wake();
  if(T.mode==='rec')stopRec();
  else{stopPlay();startRec();}
});
btnPlay.addEventListener('click',()=>{
  initAudio();wake();
  if(T.mode==='play')stopPlay();
  else{if(T.mode==='rec')stopRec();startPlay();}
});
btnStop.addEventListener('click',()=>{
  if(T.mode==='rec')stopRec();else stopPlay();
});
btnClear.addEventListener('click',clearTake);
btnLoop.addEventListener('click',()=>{T.loop=!T.loop;updateUI();});
btnMet.addEventListener('click',()=>{T.met=!T.met;updateUI();});
btnDemo.addEventListener('click',()=>{initAudio();wake();stopPlay();demoGroove();});
$('#bpmUp').addEventListener('click',()=>setBpm(T.bpm+1));
$('#bpmDown').addEventListener('click',()=>setBpm(T.bpm-1));
vol.addEventListener('input',()=>{
  if(master)master.gain.value=Math.pow(vol.value/100,1.6)*1.1;
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    initAudio();wake();
    if(T.mode==='play')stopPlay();
    else{if(T.mode==='rec')stopRec();startPlay();}
    return;
  }
  if(e.repeat)return;
  const id=keyMap[e.key.toLowerCase()];
  if(id){e.preventDefault();trigger(id);}
});
window.addEventListener('pointerdown',()=>{initAudio();wake();},{passive:true});
updateUI();
</script>
