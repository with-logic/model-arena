<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>Micro Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1f;
  --card:rgba(255,255,255,.045);
  --card-border:rgba(255,255,255,.09);
  --text:#eef1fb;
  --muted:#98a2c3;
  --amber:#ffa94d;
  --violet:#9775fa;
  --grad:linear-gradient(135deg,#ff6b6b,#ffa94d 50%,#ffd43b);
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}

.glow{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.glow.a{width:560px;height:560px;top:-180px;left:-140px;background:radial-gradient(circle,rgba(151,117,250,.42),transparent 65%);animation:drift 18s ease-in-out infinite alternate}
.glow.b{width:520px;height:520px;bottom:-160px;right:-120px;background:radial-gradient(circle,rgba(255,107,107,.34),transparent 65%);animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,50px) scale(1.1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}

.app{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:22px 18px 48px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand-mark{font-size:22px}
.brand-accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;gap:8px}

.btn{border:none;cursor:pointer;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;transition:transform .15s,box-shadow .15s,background .15s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#221204;box-shadow:0 6px 18px -6px rgba(255,140,60,.55)}
.btn.primary:hover{box-shadow:0 8px 24px -6px rgba(255,140,60,.75)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--card-border)}
.btn.ghost:hover{background:rgba(255,255,255,.11)}
.btn.danger{background:#ff5252;color:#fff}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:20px}

.hero{display:flex;align-items:center;gap:24px;padding:24px;margin-bottom:26px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 220px at 18% 0%,rgba(255,140,60,.09),transparent 70%);pointer-events:none}
.ring-wrap{position:relative;width:106px;height:106px;flex:none}
.ring{width:100%;height:100%}
#ringFg{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800}
.ring-sep{color:var(--muted);font-weight:500;margin:0 3px}
.hero-text{min-width:0}
.hero-date{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:5px}
.hero-text h1{font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-.3px;margin-bottom:7px}
.quote{color:var(--muted);font-size:14.5px;font-style:italic;line-height:1.45;margin-bottom:9px}
.hero-sub{font-size:14px;font-weight:600}

.section{margin-bottom:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg.done{color:#51cf66}
.lg.skip{color:var(--amber)}
.lg.none{color:rgba(152,162,195,.6)}

.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.habit-card{padding:16px;display:flex;flex-direction:column;gap:13px;transition:transform .18s,border-color .18s}
.habit-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.17)}
.habit-top{display:flex;align-items:center;gap:12px}
.habit-icon{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--hcs);border:1px solid var(--hcb)}
.habit-info{min-width:0;flex:1}
.habit-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.streak .flame{display:inline-block}
.streak.hot{color:var(--amber);font-weight:600}
.streak.hot .flame{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.habit-actions{display:flex;gap:4px}
.icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--card-border)}
.dots{display:flex;gap:4px}
.dot{flex:1;height:12px;border-radius:4px;background:rgba(255,255,255,.09);min-width:6px}
.dot.done{background:var(--hc);box-shadow:0 0 10px -2px var(--hc)}
.dot.skip{background:transparent;border:1.5px solid rgba(255,169,77,.65)}
.habit-controls{display:flex;gap:8px}
.check-btn{flex:1;padding:11px 10px;border-radius:13px;border:1.5px solid var(--card-border);background:rgba(255,255,255,.03);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:all .18s}
.check-btn:hover{border-color:var(--hc);color:var(--hc)}
.check-btn.on{background:var(--hc);border-color:transparent;color:#131722;box-shadow:0 8px 22px -8px var(--hc);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.skip-btn{padding:11px 13px;border-radius:13px;border:1.5px solid var(--card-border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.skip-btn:hover{border-color:var(--amber);color:var(--amber)}
.skip-btn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,169,77,.12)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:14.5px}

.week-card{padding:16px}
.wrow{display:grid;grid-template-columns:40px repeat(7,1fr);gap:6px;margin-bottom:6px}
.wrow:last-child{margin-bottom:0}
.wday{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;border-radius:10px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wday b{font-size:13px;color:var(--text);font-weight:600}
.wday.today{background:rgba(255,255,255,.07);outline:1px solid rgba(255,255,255,.14)}
.wday.today b{color:var(--amber)}
.wemoji{display:flex;align-items:center;justify-content:center;font-size:17px}
.wcell{aspect-ratio:1;border-radius:10px;border:1px solid var(--card-border);background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);transition:transform .12s,background .15s;padding:0}
.wcell:hover{transform:scale(1.1);z-index:1}
.wcell.done{background:var(--hc);border-color:transparent;color:#131722}
.wcell.skip{border-color:rgba(255,169,77,.55);color:var(--amber);background:rgba(255,169,77,.08)}
.wcell.today{outline:1px dashed rgba(255,255,255,.28);outline-offset:1px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card,.stats-card{padding:18px}
.chart-card h3,.stats-card h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:14px}
#barChart svg{display:block;width:100%;height:auto}
.bar{fill:url(#barGrad);opacity:.8}
.bar.zero{fill:rgba(255,255,255,.12);opacity:1}
.bar.today{opacity:1;filter:drop-shadow(0 0 7px rgba(255,170,70,.75))}
.chart-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.stat{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stat:last-child{border-bottom:none}
.stat-num{font-size:27px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:58px}
.stat-label{font-size:13px;color:var(--muted);text-align:right;flex:1}

.foot{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:inherit}
.link:hover{color:var(--text)}

.overlay{position:fixed;inset:0;background:rgba(4,7,18,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.open{display:flex}
.modal{width:100%;max-width:430px;max-height:calc(100vh - 40px);overflow-y:auto;background:#151b32;border:1px solid var(--card-border);border-radius:22px;padding:24px;animation:rise .28s cubic-bezier(.22,1,.36,1);box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}}
.modal h2{font-size:19px;font-weight:800;margin-bottom:6px}
.field-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:16px 0 8px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{font-size:19px;padding:7px 0;border-radius:10px;border:1.5px solid transparent;background:rgba(255,255,255,.05);cursor:pointer;transition:all .12s;line-height:1}
.emoji-grid button:hover{background:rgba(255,255,255,.12)}
.emoji-grid button.sel{border-color:var(--violet);background:rgba(151,117,250,.2);transform:scale(1.06)}
.text-input{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--card-border);background:rgba(255,255,255,.05);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
.text-input:focus{border-color:var(--violet)}
.text-input::placeholder{color:rgba(152,162,195,.55)}
.color-grid{display:flex;gap:9px;flex-wrap:wrap}
.color-grid button{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .12s;padding:0}
.color-grid button:hover{transform:scale(1.12)}
.color-grid button.sel{border-color:#fff;transform:scale(1.12)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.confirm-msg{color:var(--muted);font-size:14.5px;line-height:1.55}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:#1d2542;border:1px solid var(--card-border);color:var(--text);padding:11px 20px;border-radius:13px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.22,1,.36,1);z-index:110;box-shadow:0 12px 40px -10px rgba(0,0,0,.6);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  .app{padding:16px 12px 40px}
  .hero{flex-direction:column;text-align:center;gap:14px;padding:20px}
  .two-col{grid-template-columns:1fr}
  .wrow{grid-template-columns:34px repeat(7,1fr);gap:5px}
  .stat-num{min-width:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>
<canvas id="confetti"></canvas>

<main class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🌱</span> Micro <span class="brand-accent">Habit</span> Tracker</div>
    <div class="top-actions">
      <button class="btn ghost" id="exportBtn" title="Download your data as JSON">Export</button>
      <button class="btn ghost" id="importBtn" title="Load habits from a JSON file">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="hero card">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6b6b"/>
            <stop offset="55%" stop-color="#ffa94d"/>
            <stop offset="100%" stop-color="#ffd43b"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
        <circle id="ringFg" cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="ring-label"><span id="ringDone">0</span><span class="ring-sep">/</span><span id="ringTotal">0</span></div>
    </div>
    <div class="hero-text">
      <div class="hero-date" id="heroDate"></div>
      <h1 id="greeting">Good morning</h1>
      <p class="quote" id="quote"></p>
      <p class="hero-sub" id="heroSub"></p>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Today's habits</h2>
      <button class="btn primary" id="addBtn" data-action="add">+ New habit</button>
    </div>
    <div class="habit-grid" id="habitGrid"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Last 7 days</h2>
      <div class="legend"><span class="lg done">✓ done</span><span class="lg skip">– rest day</span><span class="lg none">· missed</span></div>
    </div>
    <div class="card week-card"><div id="weekGrid"></div></div>
  </section>

  <section class="section two-col">
    <div class="card chart-card">
      <h3>14-day momentum</h3>
      <div id="barChart"></div>
      <div class="chart-foot"><span id="chartFrom"></span><span id="chartTo"></span></div>
    </div>
    <div class="card stats-card">
      <h3>Your numbers</h3>
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">check-ins, all time</div></div>
      <div class="stat"><div class="stat-num" id="statStreak">0</div><div class="stat-label" id="statStreakLabel">longest streak</div></div>
      <div class="stat"><div class="stat-num" id="statRate">0%</div><div class="stat-label">30-day completion</div></div>
    </div>
  </section>

  <footer class="foot">
    <span>Your data stays in this browser.</span>
    <button class="link" id="resetBtn">Restore sample data</button>
  </footer>
</main>

<div class="overlay" id="habitModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">New habit</h2>
    <div class="field-label">Icon</div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="field-label">Name</div>
    <input id="habitName" class="text-input" maxlength="40" placeholder="e.g. Stretch for 5 minutes" autocomplete="off">
    <div class="field-label">Color</div>
    <div class="color-grid" id="colorGrid"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Add habit</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Delete habit?</h2>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmCancel">Cancel</button>
      <button class="btn danger" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const LS_KEY='mht.v1', MAX_HABITS=7, CIRC=263.9;
const EMOJIS=['💧','📖','🏃','🧘','💪','🥗','😴','✍️','🎸','🌱','🦷','🚭','☀️','🧠','🎯','💊','🐕','🎨','📵','🙏','🚴','🧹','💰','🌙'];
const COLORS=['#ff6b6b','#ffa94d','#ffd43b','#51cf66','#22d3ee','#4dabf7','#9775fa','#f783ac'];
const QUOTES=[
  'Small steps, every day, become unstoppable.',
  'You don\u2019t find time for habits. You make them.',
  'One checkmark is a promise kept.',
  'Motivation gets you going. Discipline keeps you going.',
  'Tiny wins compound into big lives.',
  'Show up for the two-minute version.',
  'The best time to start was yesterday. The second best is now.',
  'Consistency beats intensity, every single time.',
  'Take care of the next hour and the day takes care of itself.',
  'You are one small habit away from a new version of you.',
  'Don\u2019t count the days. Make the days count.',
  'Progress, not perfection.'
];
const MILESTONES=[7,14,30,50,100];

let state={habits:[]};
let wasAllDone=false;
let editingId=null, selEmoji=EMOJIS[0], selColor=COLORS[0];
let confirmId=null, toastTimer=null;

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const lastNDays=n=>{const out=[],t=new Date();for(let i=n-1;i>=0;i--)out.push(addDays(t,-i));return out;};
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const fmtShort=d=>d.toLocaleDateString(undefined,{weekday:'short'});
const fmtMed=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtFull=d=>d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sanitizeHabit(h){
  const days={};
  if(h&&h.days&&typeof h.days==='object'){
    for(const k in h.days){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||(h.days[k]!=='done'&&h.days[k]!=='skipped'))continue;
      const d=parseKey(k);
      if(d.getFullYear()===+k.slice(0,4)&&d.getMonth()===+k.slice(5,7)-1&&d.getDate()===+k.slice(8,10))days[k]=h.days[k];
    }
  }
  return{
    id:(h&&typeof h.id==='string'&&h.id)?h.id:uid(),
    name:(h&&typeof h.name==='string'&&h.name.trim())?h.name.trim().slice(0,40):'Habit',
    emoji:(h&&typeof h.emoji==='string'&&h.emoji)?h.emoji:'🌱',
    color:(h&&COLORS.indexOf(h.color)!==-1)?h.color:COLORS[0],
    createdAt:(h&&typeof h.createdAt==='string')?h.createdAt:todayKey(),
    days
  };
}

function seed(){
  const defs=[
    {name:'Drink water',emoji:'💧',color:'#22d3ee',p:.92},
    {name:'Read 10 pages',emoji:'📖',color:'#9775fa',p:.8},
    {name:'Move 20 min',emoji:'🏃',color:'#ff6b6b',p:.72},
    {name:'Meditate',emoji:'🧘',color:'#51cf66',p:.62}
  ];
  const now=new Date();
  return defs.map((def,i)=>{
    let s=i*7919+104729;
    const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
    const days={};
    for(let d=21;d>=1;d--){
      const r=rnd();
      if(r<def.p)days[keyOf(addDays(now,-d))]='done';
      else if(r<def.p+.15)days[keyOf(addDays(now,-d))]='skipped';
    }
    days[keyOf(addDays(now,-1))]='done';
    days[keyOf(addDays(now,-2))]='done';
    days[keyOf(addDays(now,-3))]=def.p>.7?'done':'skipped';
    if(i<2)days[keyOf(now)]='done';
    return{id:uid(),name:def.name,emoji:def.emoji,color:def.color,createdAt:keyOf(addDays(now,-21)),days};
  });
}

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&Array.isArray(d.habits)){
        state={habits:d.habits.slice(0,MAX_HABITS).map(sanitizeHabit)};
        return;
      }
    }
  }catch(e){}
  state={habits:seed()};
  save();
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
}

function currentStreak(h){
  let streak=0,d=new Date(),guard=0;
  if(h.days[keyOf(d)]==='done'){streak=1;d=addDays(d,-1);}else d=addDays(d,-1);
  while(guard++<3660){
    const s=h.days[keyOf(d)];
    if(s==='done')streak++;
    else if(s!=='skipped')break;
    d=addDays(d,-1);
  }
  return streak;
}
function bestStreak(h){
  const keys=Object.keys(h.days).sort();
  let best=0,run=0,prev=null;
  for(const k of keys){
    const d=parseKey(k);
    const cont=prev&&Math.round((d-prev)/864e5)===1;
    if(h.days[k]==='done')run=cont?run+1:1;
    else if(!cont)run=0;
    if(run>best)best=run;
    prev=d;
  }
  return best;
}
const allDone=()=>state.habits.length>0&&state.habits.every(h=>h.days[todayKey()]==='done');

function render(celebrate){
  renderHero();renderHabits();renderWeek();renderChart();renderStats();
  const all=allDone();
  if(celebrate&&all&&!wasAllDone)confetti();
  wasAllDone=all;
}

function renderHero(){
  const t=new Date(),h=t.getHours();
  $('greeting').textContent=h<5?'Night owl mode 🌙':h<12?'Good morning ☀️':h<18?'Good afternoon ⚡':'Good evening 🌆';
  $('heroDate').textContent=fmtFull(t);
  const doy=Math.floor((t-new Date(t.getFullYear(),0,0))/864e5);
  $('quote').textContent='\u201C'+QUOTES[((doy%QUOTES.length)+QUOTES.length)%QUOTES.length]+'\u201D';
  const n=state.habits.length;
  const done=state.habits.filter(x=>x.days[todayKey()]==='done').length;
  $('ringDone').textContent=done;
  $('ringTotal').textContent=n;
  $('ringFg').style.strokeDashoffset=(CIRC*(1-(n?done/n:0))).toFixed(2);
  $('heroSub').textContent=n===0?'Add your first habit and get rolling. ✨':(done===n?'Perfect day — every habit checked! 🎉':done+' of '+n+' done today. '+(n-done)+' to go.');
  const addBtn=$('addBtn');
  addBtn.disabled=n>=MAX_HABITS;
  addBtn.textContent=n>=MAX_HABITS?'7 habits — max reached':'+ New habit';
}

function renderHabits(){
  const grid=$('habitGrid');
  if(!state.habits.length){
    grid.innerHTML='<div class="card empty">No habits yet. Small is mighty — add your first one. ✨</div>';
    return;
  }
  grid.innerHTML=state.habits.map(h=>{
    const tk=todayKey(),s=h.days[tk],st=currentStreak(h);
    const dots=lastNDays(14).map(d=>{
      const v=h.days[keyOf(d)];
      return '<span class="dot '+(v==='done'?'done':v==='skipped'?'skip':'')+'" style="--hc:'+h.color+'" title="'+fmtMed(d)+' · '+(v||'—')+'"></span>';
    }).join('');
    return '<article class="card habit-card" style="--hc:'+h.color+';--hcs:'+h.color+'22;--hcb:'+h.color+'55">'
      +'<div class="habit-top">'
      +'<div class="habit-icon">'+h.emoji+'</div>'
      +'<div class="habit-info">'
      +'<h3 class="habit-name">'+esc(h.name)+'</h3>'
      +'<div class="streak'+(st>=7?' hot':'')+'"><span class="flame">🔥</span>'+(st>0?st+'-day streak':'No streak yet — start today')+'</div>'
      +'</div>'
      +'<div class="habit-actions">'
      +'<button class="icon-btn" data-action="edit" data-id="'+h.id+'" aria-label="Edit '+esc(h.name)+'" title="Edit">✎</button>'
      +'<button class="icon-btn" data-action="del" data-id="'+h.id+'" aria-label="Delete '+esc(h.name)+'" title="Delete">🗑</button>'
      +'</div></div>'
      +'<div class="dots" aria-label="Last 14 days">'+dots+'</div>'
      +'<div class="habit-controls">'
      +'<button class="check-btn'+(s==='done'?' on':'')+'" data-action="check" data-id="'+h.id+'">'+(s==='done'?'Done today ✓':'Mark as done')+'</button>'
      +'<button class="skip-btn'+(s==='skipped'?' on':'')+'" data-action="skip" data-id="'+h.id+'" title="Rest days keep your streak alive">'+(s==='skipped'?'Rest day ✓':'Skip today')+'</button>'
      +'</div></article>';
  }).join('');
}

function renderWeek(){
  const wrap=$('weekGrid');
  if(!state.habits.length){wrap.innerHTML='<div class="empty">Add a habit to see your week.</div>';return;}
  const days=lastNDays(7),tk=todayKey();
  let html='<div class="wrow"><div></div>';
  days.forEach(d=>{
    const k=keyOf(d);
    html+='<div class="wday'+(k===tk?' today':'')+'"><span>'+fmtShort(d)+'</span><b>'+d.getDate()+'</b></div>';
  });
  html+='</div>';
  state.habits.forEach(h=>{
    html+='<div class="wrow" style="--hc:'+h.color+'"><div class="wemoji" title="'+esc(h.name)+'">'+h.emoji+'</div>';
    days.forEach(d=>{
      const k=keyOf(d),v=h.days[k];
      html+='<button class="wcell '+(v||'none')+(k===tk?' today':'')+'" data-action="cell" data-id="'+h.id+'" data-date="'+k+'" title="'+esc(h.name)+' · '+fmtMed(d)+' · '+(v||'missed')+' — tap to change">'+(v==='done'?'✓':v==='skipped'?'–':'')+'</button>';
    });
    html+='</div>';
  });
  wrap.innerHTML=html;
}

function renderChart(){
  const days=lastNDays(14),n=state.habits.length;
  const vals=days.map(d=>state.habits.filter(h=>h.days[keyOf(d)]==='done').length);
  const W=300,H=120,top=14,bottom=6;
  const slot=W/14,bw=Math.min(18,slot*0.62);
  let bars='';
  vals.forEach((v,i)=>{
    const maxH=H-top-bottom;
    const hgt=v===0?3:Math.max(7,(v/Math.max(n,1))*maxH);
    const x=((i+0.5)*slot-bw/2),y=H-bottom-hgt;
    const cls='bar'+(v===0?' zero':'')+(i===13?' today':'');
    bars+='<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hgt.toFixed(1)+'" rx="'+(bw/2).toFixed(1)+'"><title>'+fmtMed(days[i])+' — '+v+'/'+n+' habits done</title></rect>';
  });
  $('barChart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Habits completed per day, last 14 days">'
    +'<defs><linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ffd43b"/></linearGradient></defs>'
    +bars+'</svg>';
  $('chartFrom').textContent=fmtMed(days[0]);
  $('chartTo').textContent=fmtMed(days[13])+' (today)';
}

function renderStats(){
  let total=0;
  state.habits.forEach(h=>{for(const k in h.days)if(h.days[k]==='done')total++;});
  let best=0,bestH=null;
  state.habits.forEach(h=>{const b=bestStreak(h);if(b>best){best=b;bestH=h;}});
  const days30=lastNDays(30).map(keyOf);
  let d30=0;
  state.habits.forEach(h=>days30.forEach(k=>{if(h.days[k]==='done')d30++;}));
  const rate=state.habits.length?Math.round(d30/(30*state.habits.length)*100):0;
  $('statTotal').textContent=total;
  $('statStreak').textContent=best;
  $('statStreakLabel').textContent=bestH?('longest streak · '+bestH.emoji+' '+bestH.name):'longest streak';
  $('statRate').textContent=rate+'%';
}

function setDay(h,k,v){if(v)h.days[k]=v;else delete h.days[k];}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(!b)return;
  const act=b.dataset.action,id=b.dataset.id;
  if(act==='add'){openModal(null);return;}
  const h=state.habits.find(x=>x.id===id);
  if(!h)return;
  const tk=todayKey();
  const prevStreak=currentStreak(h);
  if(act==='check'){
    setDay(h,tk,h.days[tk]==='done'?undefined:'done');
  }else if(act==='skip'){
    setDay(h,tk,h.days[tk]==='skipped'?undefined:'skipped');
  }else if(act==='cell'){
    const k=b.dataset.date,s=h.days[k];
    setDay(h,k,s===undefined?'done':s==='done'?'skipped':undefined);
  }else if(act==='edit'){
    openModal(h);return;
  }else if(act==='del'){
    confirmId=id;
    $('confirmMsg').textContent='\u201C'+h.name+'\u201D and its full history will be removed. This can\u2019t be undone.';
    openOverlay($('confirmModal'));
    return;
  }
  const st=currentStreak(h);
  if((act==='check'||act==='cell')&&st>prevStreak&&MILESTONES.indexOf(st)!==-1){
    toast('🔥 '+st+'-day streak on '+h.name+' — you\u2019re on fire!');
  }
  save();render(true);
});

function buildPickers(){
  $('emojiGrid').innerHTML=EMOJIS.map(em=>'<button type="button" data-emoji="'+em+'">'+em+'</button>').join('');
  $('colorGrid').innerHTML=COLORS.map(c=>'<button type="button" data-color="'+c+'" style="background:'+c+'" aria-label="color '+c+'"></button>').join('');
}
function syncPicks(){
  Array.prototype.forEach.call($('emojiGrid').children,b=>b.classList.toggle('sel',b.dataset.emoji===selEmoji));
  Array.prototype.forEach.call($('colorGrid').children,b=>b.classList.toggle('sel',b.dataset.color===selColor));
}
$('emojiGrid').addEventListener('click',e=>{
  const b=e.target.closest('button[data-emoji]');
  if(!b)return;
  selEmoji=b.dataset.emoji;syncPicks();
});
$('colorGrid').addEventListener('click',e=>{
  const b=e.target.closest('button[data-color]');
  if(!b)return;
  selColor=b.dataset.color;syncPicks();
});

function openOverlay(o){o.classList.add('open');}
function closeOverlay(o){o.classList.remove('open');}
function closeModal(){closeOverlay($('habitModal'));closeOverlay($('confirmModal'));}

function openModal(habit){
  editingId=habit?habit.id:null;
  selEmoji=habit?habit.emoji:'🌱';
  selColor=habit?habit.color:COLORS[state.habits.length%COLORS.length];
  $('modalTitle').textContent=habit?'Edit habit':'New habit';
  $('modalSave').textContent=habit?'Save changes':'Add habit';
  $('habitName').value=habit?habit.name:'';
  syncPicks();
  openOverlay($('habitModal'));
  setTimeout(()=>$('habitName').focus(),60);
}

$('modalSave').addEventListener('click',()=>{
  const name=$('habitName').value.trim();
  if(!name){toast('Give your habit a name first');$('habitName').focus();return;}
  if(editingId){
    const h=state.habits.find(x=>x.id===editingId);
    if(h){h.name=name;h.emoji=selEmoji;h.color=selColor;}
    toast('Habit updated ✨');
  }else{
    if(state.habits.length>=MAX_HABITS){toast('You have 7 habits — the max. Delete one to add another.');return;}
    state.habits.push({id:uid(),name:name,emoji:selEmoji,color:selColor,createdAt:todayKey(),days:{}});
    toast('Habit added — go get it! 💪');
  }
  save();closeModal();render(true);
});
$('habitName').addEventListener('keydown',e=>{if(e.key==='Enter')$('modalSave').click();});
$('modalCancel').addEventListener('click',closeModal);
$('confirmCancel').addEventListener('click',closeModal);
$('confirmDelete').addEventListener('click',()=>{
  state.habits=state.habits.filter(x=>x.id!==confirmId);
  save();closeModal();render(true);
  toast('Habit deleted');
});
[$('habitModal'),$('confirmModal')].forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

$('exportBtn').addEventListener('click',()=>{
  const data={app:'micro-habit-tracker',version:1,exportedAt:new Date().toISOString(),habits:state.habits};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='micro-habits-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Exported JSON downloaded ⬇️');
});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const arr=Array.isArray(data)?data:(data&&Array.isArray(data.habits)?data.habits:null);
      if(!arr||!arr.length)throw new Error('no habits');
      const habits=arr.slice(0,MAX_HABITS).map(sanitizeHabit);
      state={habits:habits};
      save();render(true);
      toast('Imported '+habits.length+' habit'+(habits.length>1?'s':'')+' ✅');
    }catch(err){
      toast('Could not import — that doesn\u2019t look like a habits file');
    }
  };
  r.readAsText(f);
});
$('resetBtn').addEventListener('click',()=>{
  state={habits:seed()};
  save();render(true);
  toast('Sample data restored');
});

function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function confetti(){
  const c=$('confetti');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const parts=[];
  for(let i=0;i<130;i++){
    parts.push({
      x:c.width/2+(Math.random()-.5)*240,
      y:c.height*0.3,
      vx:(Math.random()-.5)*15,
      vy:-Math.random()*13-4,
      g:0.35,
      size:Math.random()*8+4,
      color:COLORS[i%COLORS.length],
      rot:Math.random()*Math.PI,
      vr:(Math.random()-.5)*0.3,
      life:110+Math.random()*50
    });
  }
  let frame=0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);
    let alive=false;
    for(const p of parts){
      if(p.life<=0)continue;
      alive=true;
      p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.rot+=p.vr;p.life--;
      ctx.save();
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=Math.min(1,p.life/40);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    }
    frame++;
    if(alive&&frame<420)requestAnimationFrame(tick);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}

buildPickers();
load();
render();
</script>
