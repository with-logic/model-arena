<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tea Dunkability Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0b0e13;
    --glow-1: rgba(255, 158, 64, 0.16);
    --glow-2: rgba(56, 178, 158, 0.11);
    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(255, 255, 255, 0.10);
    --glass-hover: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.2);
    --text: #ece7dd;
    --muted: #9b948a;
    --faint: #6d675e;
    --accent: #f0a94e;
    --accent-soft: rgba(240, 169, 78, 0.16);
    --accent-2: #7fd0c0;
    --safe: #8fd694;
    --safe-soft: rgba(143, 214, 148, 0.14);
    --warn: #f0b25e;
    --hot: #e8875c;
    --cold: #7fa8c9;
    --danger: #e8705c;
    --danger-soft: rgba(232, 112, 92, 0.15);
    --track: rgba(255, 255, 255, 0.13);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.35);
    --overlay: rgba(4, 6, 10, 0.62);
    --grid-line: rgba(255, 255, 255, 0.07);
    --steam: rgba(255, 255, 255, 0.55);
  }
  [data-theme="light"] {
    --bg: #f2ede3;
    --glow-1: rgba(224, 140, 50, 0.2);
    --glow-2: rgba(47, 143, 125, 0.14);
    --glass: rgba(255, 255, 255, 0.6);
    --glass-strong: rgba(255, 255, 255, 0.85);
    --glass-hover: rgba(255, 255, 255, 0.75);
    --border: rgba(70, 50, 20, 0.13);
    --border-strong: rgba(70, 50, 20, 0.24);
    --text: #2a241c;
    --muted: #756c5e;
    --faint: #a09686;
    --accent: #c07a1e;
    --accent-soft: rgba(192, 122, 30, 0.14);
    --accent-2: #2f8f7d;
    --safe: #3d9a4e;
    --safe-soft: rgba(61, 154, 78, 0.13);
    --warn: #b5761c;
    --hot: #c75b33;
    --cold: #3d7ea6;
    --danger: #c74a37;
    --danger-soft: rgba(199, 74, 55, 0.13);
    --track: rgba(40, 30, 15, 0.16);
    --shadow: 0 24px 48px rgba(90, 65, 30, 0.18);
    --shadow-sm: 0 4px 14px rgba(90, 65, 30, 0.14);
    --overlay: rgba(240, 233, 220, 0.7);
    --grid-line: rgba(60, 45, 20, 0.09);
    --steam: rgba(120, 90, 50, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .bg-glow {
    position: fixed; border-radius: 50%;
    filter: blur(110px); z-index: 0; pointer-events: none;
  }
  .glow-1 { width: 620px; height: 620px; background: var(--glow-1); top: -200px; left: -140px; animation: drift1 26s ease-in-out infinite alternate; }
  .glow-2 { width: 700px; height: 700px; background: var(--glow-2); bottom: -260px; right: -180px; animation: drift2 34s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(90px, 70px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-80px, -60px) scale(1.06); } }

  .app { position: relative; z-index: 1; max-width: 1220px; margin: 0 auto; padding: 26px 22px 44px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; flex: none;
    background: linear-gradient(135deg, var(--accent) 0%, #c96f2e 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .logo svg { width: 28px; height: 28px; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight: 600; letter-spacing: -0.01em; line-height: 1.1;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .tagline { font-size: 12.5px; color: var(--muted); margin-top: 3px; letter-spacing: 0.02em; }
  .header-actions { display: flex; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    color: var(--text); background: var(--glass);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 14px; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .btn:hover { background: var(--glass-hover); border-color: var(--border-strong); }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-primary { background: var(--accent-soft); border-color: rgba(240, 169, 78, 0.4); color: var(--accent); }
  [data-theme="light"] .btn-primary { color: var(--accent); }
  .icon-btn { padding: 9px; }

  /* ---------- grid & cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
  .card {
    grid-column: span 12;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 22px;
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: var(--shadow);
    padding: 20px;
    transition: background 0.4s, border-color 0.4s;
  }
  .card-cup { grid-column: span 12; }
  .card-controls { grid-column: span 12; }
  .card-graph { grid-column: span 12; }
  .card-verdict { grid-column: span 12; }
  @media (min-width: 980px) {
    .card-cup { grid-column: span 7; }
    .card-controls { grid-column: span 5; }
    .card-graph { grid-column: span 7; }
    .card-verdict { grid-column: span 5; }
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .card-title {
    font-family: var(--font-display); font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  .card-title svg { width: 17px; height: 17px; color: var(--accent); flex: none; }
  .card-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .chip {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--glass); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 8px var(--safe); animation: blink 1.6s ease-in-out infinite; }
  .chip.paused .dot { background: var(--faint); box-shadow: none; animation: none; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ---------- cup scene ---------- */
  .scene { position: relative; width: 100%; aspect-ratio: 320 / 262; user-select: none; }
  .scene svg.cup-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .steam path {
    fill: none; stroke: var(--steam); stroke-width: 5; stroke-linecap: round;
    opacity: 0; filter: blur(2.6px);
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: steam 3.6s ease-in-out infinite;
  }
  .steam path:nth-child(2) { animation-delay: 1.2s; }
  .steam path:nth-child(3) { animation-delay: 2.3s; }
  @keyframes steam {
    0% { opacity: 0; transform: translateY(8px) scaleX(0.9); }
    30% { opacity: var(--steam-o, 0.5); }
    100% { opacity: 0; transform: translateY(-44px) scaleX(1.35); }
  }
  .tea-ripple {
    opacity: 0; transform-box: fill-box; transform-origin: center;
  }
  .tea-ripple.rippling { animation: ripple 1s ease-out infinite; }
  @keyframes ripple {
    0% { opacity: 0.55; transform: scale(0.55); }
    100% { opacity: 0; transform: scale(1.35); }
  }

  .scene-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .biscuit-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .biscuit-swatch { width: 34px; height: 22px; border-radius: 7px; flex: none; border: 1px solid rgba(0,0,0,0.25); box-shadow: inset 0 -3px 5px rgba(0,0,0,0.18); }
  .biscuit-name { font-weight: 700; font-size: 14px; }
  .biscuit-desc { font-size: 11.5px; color: var(--muted); }
  .scene-actions { display: flex; gap: 8px; }

  /* ---------- controls ---------- */
  .control { margin-bottom: 20px; }
  .control:last-of-type { margin-bottom: 6px; }
  .control-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; gap: 8px; }
  .control-label { font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.02em; }
  .control-label svg { width: 14px; height: 14px; color: var(--sl-accent, var(--accent)); flex: none; }
  .control-value {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text); background: var(--glass-strong);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px;
  }
  .control-value small { color: var(--muted); font-weight: 500; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 26px; background: transparent; cursor: pointer; display: block;
  }
  input[type="range"]:focus { outline: none; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(to right, var(--sl-accent, var(--accent)) 0%, var(--sl-accent, var(--accent)) var(--fill, 50%), var(--track) var(--fill, 50%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 19px; height: 19px; border-radius: 50%;
    background: var(--text); border: 3.5px solid var(--sl-accent, var(--accent));
    margin-top: -6.5px; box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb { transform: scale(1.18); }
  input[type="range"]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--track); }
  input[type="range"]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--sl-accent, var(--accent)); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--text); border: 3.5px solid var(--sl-accent, var(--accent));
    box-shadow: var(--shadow-sm);
  }
  .ticks { display: flex; justify-content: space-between; margin-top: 5px; padding: 0 2px; }
  .tick {
    font-size: 10px; font-weight: 600; color: var(--faint); letter-spacing: 0.03em;
    cursor: pointer; transition: color 0.2s; text-transform: uppercase;
  }
  .tick:hover { color: var(--muted); }
  .tick.active { color: var(--sl-accent, var(--accent)); }

  /* ---------- graph ---------- */
  .graph-wrap { position: relative; }
  .graph-wrap svg { width: 100%; height: auto; display: block; }
  .graph-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); font-weight: 500; }
  .legend-swatch { width: 14px; height: 4px; border-radius: 2px; }
  .legend-box { width: 12px; height: 12px; border-radius: 3px; }
  .marker-pulse { transform-box: fill-box; transform-origin: center; animation: mpulse 1.5s ease-in-out infinite; }
  @keyframes mpulse { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.9); } }

  /* ---------- verdict ---------- */
  .verdict-body { display: flex; align-items: center; gap: 20px; }
  .gauge-wrap { position: relative; flex: none; width: 148px; height: 148px; }
  .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
  }
  .gauge-num { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .gauge-cap { font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .verdict-text { min-width: 0; flex: 1; }
  .verdict-label {
    font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 28px);
    font-weight: 700; line-height: 1.15; margin-bottom: 7px;
    transition: color 0.4s;
  }
  .verdict-blurb { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 14px; }
  .stat-rows { display: flex; flex-direction: column; gap: 8px; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .stat-row .k { color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .stat-row .k svg { width: 13px; height: 13px; opacity: 0.8; }
  .stat-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .mini-bar { width: 84px; height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; margin-left: 10px; }
  .mini-bar > div { height: 100%; border-radius: 999px; transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s; }
  .stat-val-wrap { display: flex; align-items: center; }

  /* ---------- footer ---------- */
  footer { margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .kbd-group { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); font-weight: 500; }
  kbd {
    font-family: var(--font-ui); font-size: 10.5px; font-weight: 700;
    color: var(--muted); background: var(--glass-strong);
    border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 6px; padding: 3px 7px; min-width: 22px; text-align: center;
    display: inline-block;
  }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: var(--overlay); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fadein 0.2s ease;
  }
  @keyframes fadein { from { opacity: 0; } }
  .modal {
    width: min(540px, 100%);
    background: var(--glass-strong);
    border: 1px solid var(--border-strong);
    border-radius: 22px; box-shadow: var(--shadow);
    backdrop-filter: blur(28px) saturate(1.4); -webkit-backdrop-filter: blur(28px) saturate(1.4);
    padding: 26px; animation: pop 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes pop { from { transform: scale(0.94) translateY(8px); opacity: 0; } }
  .modal h2 { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 22px; }
  @media (max-width: 520px) { .help-grid { grid-template-columns: 1fr; } }
  .help-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .help-row .keys { display: flex; gap: 4px; flex: none; }
  .modal-close { margin-top: 20px; width: 100%; justify-content: center; }

  button:focus-visible, input:focus-visible, .tick:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .glow-1, .glow-2, .steam path, .chip .dot, .marker-pulse { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;

/* ================= model ================= */

const BISCUITS = [
  { name: 'Digestive',     full: 'Classic Digestive', absorb: 0.55, fragile: 0.45, body: '#c89b62', speck: '#a97e46', shape: 'rect',  desc: 'Balanced, buttery, dependable.' },
  { name: 'Rich Tea',      full: 'Rich Tea',          absorb: 0.75, fragile: 0.60, body: '#d8ab6b', speck: '#b98a45', shape: 'rect',  desc: 'Thin, crisp, vanishes fast.' },
  { name: 'Hobnob',        full: 'Hobnob',            absorb: 0.45, fragile: 0.30, body: '#cfa468', speck: '#8a6a3c', shape: 'rect',  desc: 'Oat-studded and sturdy.' },
  { name: 'Ginger',        full: 'Ginger Biscuit',    absorb: 0.65, fragile: 0.70, body: '#d9a55e', speck: '#b07a35', shape: 'rect',  desc: 'Spiced, sugary, crumbly.' },
  { name: 'Jammie',        full: 'Jammie Dodger',     absorb: 0.50, fragile: 0.55, body: '#d3a870', speck: '#b5854a', shape: 'round', desc: 'Soft, round, gentle.' },
  { name: 'Melba',         full: 'Melba',             absorb: 0.85, fragile: 0.85, body: '#e0b878', speck: '#c1954f', shape: 'thin',  desc: 'Feather-thin. One wrong move.' },
];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const SWEET = 0.34;

function soakAt(t, temp, b) {
  const tf = (temp - 50) / 50;
  const rate = b.absorb * (0.35 + 1.35 * tf);
  return 1 - Math.exp(-rate * t);
}
function riskAt(t, temp, b, integrity) {
  const s = soakAt(t, temp, b);
  const excess = Math.max(0, s - SWEET);
  const fail = 1 - Math.exp(-excess * 7);
  return clamp(100 * fail * (0.35 + 0.65 * b.fragile) * (1.25 - 0.75 * integrity / 100), 0, 100);
}
function moistureAt(t, temp, b) {
  return clamp(soakAt(t, temp, b) / 0.55, 0, 1) * 100;
}
function scoreAt(t, temp, b, integrity) {
  const r = riskAt(t, temp, b, integrity);
  const m = moistureAt(t, temp, b);
  return clamp(100 * (0.5 * (1 - r / 100) + 0.5 * m / 100), 0, 100);
}
function verdictFor(risk, soak) {
  if (risk < 15 && soak >= 0.28) return { label: 'Perfect Dunk', tone: 'var(--safe)', blurb: 'Moist where it counts, crisp where it matters. Textbook technique.' };
  if (risk < 15) return { label: 'Barely Touched', tone: 'var(--accent-2)', blurb: 'A polite nod to the tea. No damage, no reward.' };
  if (risk < 40) return { label: 'Holds Together', tone: 'var(--warn)', blurb: 'Structurally optimistic. The edges are negotiating.' };
  if (risk < 70) return { label: 'Getting Soggy', tone: 'var(--hot)', blurb: 'The biscuit has lost most of its opinions.' };
  return { label: 'Crumble Catastrophe', tone: 'var(--danger)', blurb: 'The tea now contains biscuit confetti.' };
}
function buildCurve(temp, b, integrity) {
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i * 0.05;
    pts.push({ t, r: riskAt(t, temp, b, integrity) });
  }
  return pts;
}
function safeZoneEnd(pts) {
  let end = 0;
  for (const p of pts) { if (p.r < 25) end = p.t; else break; }
  return end;
}

const easeInQuad = p => p * p;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);

/* ================= icons ================= */

const I = {

/* ================= slider ================= */

function Slider({ label, icon, value, min, max, step, unit, display, onChange, accent, ticks, tickActive }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div className="control" style={{ '--sl-accent': accent }}>
      <div className="control-head">
        <span className="control-label">{icon}{label}</span>
        <span className="control-value">{display !== undefined ? display : <>{value}<small> {unit}</small></>}</span>
      </div>
      <input
        type="range" min={min} max={max} step={step} value={value}
        aria-label={label}
        style={{ '--fill': pct + '%' }}
        onChange={(e) => onChange(parseFloat(e.target.value))}
      />
      {ticks && (
        <div className="ticks">
          {ticks.map((t, i) => (
            <span key={t} className={'tick' + (i === tickActive ? ' active' : '')}
              onClick={() => onChange(i)}>{t}</span>
          ))}
        </div>
      )}
    </div>
  );
}

const SPECKLES = [
  [-20, -3, 1.6], [-8, 4, 1.3], [4, -4, 1.7], [15, 2, 1.4], [24, -3, 1.2],
  [-26, 3, 1.1], [0, 1, 1.2], [10, 5, 1.0], [-14, -5, 1.0], [20, 5, 1.1],
];

function BiscuitShape({ b, wetRef }) {
  const common = { stroke: 'rgba(60,35,10,0.35)', strokeWidth: 1 };
  if (b.shape === 'round') {
    return (
      <g>
        <circle r={25} fill={b.body} {...common} />
        <circle r={4.5} fill="rgba(70,40,12,0.4)" />

        <circle ref={wetRef} r={25} fill="#5d3d1c" opacity={0} />
      </g>
    );
  }
  const h = b.shape === 'thin' ? 10 : 18;
  return (
    <g>
      <rect x={-32} y={-h / 2} width={64} height={h} rx={h / 2.4} fill={b.body} {...common} />
      {SPECKLES.map(([x, y, r], i) => <circle key={i} cx={x} cy={y * (h / 18)} r={r} fill={b.speck} opacity={0.75} />)}

function CupScene({ params, playing, onCrumbs }) {
  const wrapRef = useRef(null);
  const svgRef = useRef(null);
  const biscuitRef = useRef(null);
  const wetRef = useRef(null);
  const rippleRef = useRef(null);
  const canvasRef = useRef(null);
  const pRef = useRef(params); pRef.current = params;
  const playRef = useRef(playing);
  const wasPlayingRef = useRef(playing);
  const crumbsCbRef = useRef(onCrumbs); crumbsCbRef.current = onCrumbs;
  const simRef = useRef({ phase: 'idle', t0: performance.now(), soakVis: 0 });
  const particlesRef = useRef([]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raf;

    const resize = () => {
      const rect = wrapRef.current.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, rect.width * dpr);
      canvas.height = Math.max(1, rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(wrapRef.current);

    const spawnCrumbs = (risk, b) => {
      const svg = svgRef.current;
      if (!svg) return;
      const rect = svg.getBoundingClientRect();
      const s = rect.width / 320;
      const x = 160 * s, y = 121 * s;
      const n = Math.round(5 + (risk / 100) * 36);
      const palette = [b.body, b.speck, '#8a5f30'];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 130;
        particlesRef.current.push({
          x, y,
          vx: Math.cos(a) * sp * 0.75,
          vy: -Math.abs(Math.sin(a)) * sp - 25,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 12,
          size: 1.6 + Math.random() * 3.2,
          color: palette[i % palette.length],
          life: 0, ttl: 0.9 + Math.random() * 0.9,
          chunk: false,
        });
      }
      if (risk > 68) {
        particlesRef.current.push({
          x: x + (Math.random() - 0.5) * 20 * s, y,
          vx: (Math.random() - 0.5) * 70, vy: -80,
          rot: 0, vr: (Math.random() > 0.5 ? 1 : -1) * 4,
          size: 13 * s, color: b.body, life: 0, ttl: 1.6, chunk: true,
        });
      }
      if (crumbsCbRef.current) crumbsCbRef.current(n + (risk > 68 ? 1 : 0));
    };

    let last = performance.now();
    let lastRun = last;
    const tick = (now) => {
      lastRun = now;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const st = simRef.current;
      const { temp, dunkTime, integrity, biscuitIndex } = pRef.current;
      const b = BISCUITS[biscuitIndex];
      const risk = riskAt(dunkTime, temp, b, integrity);

      if (playRef.current && !wasPlayingRef.current) st.t0 = now;
      wasPlayingRef.current = playRef.current;

      if (playRef.current) {
        const durations = { idle: 0.9, descend: 0.55, dunk: Math.max(0.15, dunkTime), lift: 0.65, hover: 0.7 };
        if ((now - st.t0) / 1000 >= durations[st.phase]) {
          if (st.phase === 'dunk') { if (risk > 35) spawnCrumbs(risk, b); st.phase = 'lift'; }
          else if (st.phase === 'lift') st.phase = 'hover';
          else if (st.phase === 'hover') st.phase = 'idle';
          else if (st.phase === 'descend') st.phase = 'dunk';
          else st.phase = 'descend';
          st.t0 = now;
        }
        const p = clamp((now - st.t0) / 1000 / durations[st.phase], 0, 1);
        const REST = { x: 252, y: 42 }, DUNKP = { x: 160, y: 121 };
        let x, y, rot = 0;
        const bob = Math.sin(now / 450) * 2.5;
        if (st.phase === 'idle') { x = REST.x; y = REST.y + bob; }
        else if (st.phase === 'descend') { const e = easeInQuad(p); x = REST.x + (DUNKP.x - REST.x) * e; y = REST.y + (DUNKP.y - REST.y) * e; rot = 14 * e; }
        else if (st.phase === 'dunk') { x = DUNKP.x; y = DUNKP.y + Math.sin(now / 170) * 1.3; }
        else if (st.phase === 'lift') { const e = easeOutCubic(p); x = DUNKP.x + (REST.x - DUNKP.x) * e; y = DUNKP.y + (REST.y - DUNKP.y) * e; rot = -14 * (1 - e); }
        else { x = REST.x; y = REST.y + bob; }
        if (biscuitRef.current) biscuitRef.current.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ') rotate(' + rot.toFixed(2) + ')');

        const targetSoak = st.phase === 'dunk' ? soakAt(p * dunkTime, temp, b)
          : (st.phase === 'lift' || st.phase === 'hover') ? soakAt(dunkTime, temp, b) : 0;
        st.soakVis += (targetSoak - st.soakVis) * Math.min(1, dt * 6);
        if (wetRef.current) wetRef.current.setAttribute('opacity', (st.soakVis * 0.55).toFixed(3));
        if (rippleRef.current) rippleRef.current.classList.toggle('rippling', st.phase === 'dunk');
      }

      // particles
      const rect = wrapRef.current.getBoundingClientRect();
      const floor = rect.height - 6;
      const parts = particlesRef.current;
      for (let i = parts.length - 1; i >= 0; i--) {
        const pt = parts[i];
        pt.life += dt;
        if (pt.life >= pt.ttl) { parts.splice(i, 1); continue; }
        pt.vy += 340 * dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.rot += pt.vr * dt;
        if (pt.y > floor) { pt.y = floor; pt.vy *= -0.32; pt.vx *= 0.72; pt.vr *= 0.6; }
      }
      ctx.clearRect(0, 0, rect.width, rect.height);
      for (const pt of parts) {
        const alpha = clamp(1 - pt.life / pt.ttl, 0, 1) * (pt.chunk ? 1 : 0.95);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot);
        ctx.fillStyle = pt.color;
        if (pt.chunk) {
          ctx.beginPath();
          ctx.moveTo(-pt.size, -pt.size * 0.5);
          ctx.lineTo(pt.size * 0.7, -pt.size * 0.7);
          ctx.lineTo(pt.size, pt.size * 0.4);
          ctx.lineTo(-pt.size * 0.4, pt.size * 0.6);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size * 0.8);
        }
        ctx.restore();
      }
    };
    const rafLoop = () => { tick(performance.now()); raf = requestAnimationFrame(rafLoop); };
    raf = requestAnimationFrame(rafLoop);
    const intId = setInterval(() => { if (performance.now() - lastRun > 50) tick(performance.now()); }, 30);
    return () => { cancelAnimationFrame(raf); clearInterval(intId); ro.disconnect(); };
  }, []);

  const b = BISCUITS[params.biscuitIndex];
  const steamO = 0.25 + 0.55 * ((params.temp - 50) / 50);

  return (
    <div className="scene" ref={wrapRef} style={{ '--steam-o': steamO }}>
      <svg className="cup-svg" viewBox="0 0 320 262" ref={svgRef} aria-label="Animated teacup with biscuit dunking" role="img">
        <defs>
          <linearGradient id="cupGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor="#f8f3ea" />
            <stop offset="1" stopColor="#cfc3b0" />
          </linearGradient>
          <linearGradient id="saucerGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor="#efe8da" />
            <stop offset="1" stopColor="#b8ab96" />
          </linearGradient>
          <radialGradient id="teaGrad" cx="0.5" cy="0.42" r="0.75">
            <stop offset="0" stopColor="#c07a35" />
            <stop offset="0.7" stopColor="#9a5a22" />
            <stop offset="1" stopColor="#7c4216" />
          </radialGradient>
        </defs>

        {/* shadow */}
        <ellipse cx="160" cy="230" rx="104" ry="15" fill="rgba(0,0,0,0.35)" style={{ filter: 'blur(7px)' }} />
        {/* saucer */}
        <ellipse cx="160" cy="212" rx="96" ry="18" fill="url(#saucerGrad)" />
        <ellipse cx="160" cy="209" rx="72" ry="12.5" fill="rgba(90,70,45,0.22)" />
        {/* handle (behind body) */}
        <path d="M221 132 C252 127 254 166 219 170" fill="none" stroke="rgba(0,0,0,0.18)" strokeWidth="12" strokeLinecap="round" />
        <path d="M221 130 C252 125 254 164 219 168" fill="none" stroke="#e6ddcc" strokeWidth="9" strokeLinecap="round" />
        {/* cup body */}
        <path d="M100 118 C102 162 120 196 160 196 C200 196 218 162 220 118 Z" fill="url(#cupGrad)" />
        <path d="M112 130 C114 160 124 182 142 190" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="5" strokeLinecap="round" style={{ filter: 'blur(2px)' }} />
        {/* back rim */}
        <ellipse cx="160" cy="118" rx="60" ry="13" fill="#efe8db" />
        {/* biscuit (behind tea so submerged part tints) */}
        <g ref={biscuitRef}>
          <BiscuitShape b={b} wetRef={wetRef} />
        </g>
        {/* tea */}
        <ellipse cx="160" cy="118" rx="54" ry="10.5" fill="url(#teaGrad)" opacity="0.88" />
        <path d="M112 115 A54 10.5 0 0 1 208 115" fill="none" stroke="rgba(255,215,150,0.35)" strokeWidth="1.6" />
        <ellipse ref={rippleRef} className="tea-ripple" cx="160" cy="118" rx="54" ry="10.5" fill="none" stroke="rgba(255,230,190,0.6)" strokeWidth="1.5" />
        {/* front rim */}
        <path d="M100 118 A60 13 0 0 0 220 118 L214 118 A54 10.5 0 0 1 106 118 Z" fill="#f4edde" />
        {/* steam */}
        <g className="steam" transform="translate(160 100)">
          <path d="M-18 0 C-24 -14 -12 -22 -18 -36 C-24 -50 -14 -58 -18 -70" />
          <path d="M0 2 C-8 -14 8 -26 0 -42 C-8 -58 8 -68 0 -80" />
          <path d="M18 0 C12 -14 24 -22 18 -36 C12 -50 22 -58 18 -70" />
        </g>
      </svg>
      <canvas ref={canvasRef} />
    </div>
  );
}

/* ================= crumble graph ================= */

function CrumbleGraph({ temp, dunkTime, integrity, biscuitIndex }) {
  const b = BISCUITS[biscuitIndex];
  const pts = useMemo(() => buildCurve(temp, b, integrity), [temp, b, integrity]);
  const W = 620, H = 244, L = 46, R = 592, T = 18, B = 198;
  const xs = t => L + (t / 3) * (R - L);
  const ys = r => B - (r / 100) * (B - T);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + xs(p.t).toFixed(1) + ',' + ys(p.r).toFixed(1)).join(' ');
  const area = line + ' L' + xs(3).toFixed(1) + ',' + B + ' L' + xs(0).toFixed(1) + ',' + B + ' Z';
  const cur = riskAt(dunkTime, temp, b, integrity);
  const zoneEnd = safeZoneEnd(pts);
  const mx = xs(dunkTime), my = ys(cur);

  return (
    <div className="graph-wrap">
      <svg viewBox={'0 0 ' + W + ' ' + H} role="img" aria-label="Crumble risk versus dunk time graph">
        <defs>
          <linearGradient id="riskGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stopColor="var(--accent)" stopOpacity="0.55" />
            <stop offset="0.55" stopColor="var(--hot)" stopOpacity="0.5" />
            <stop offset="1" stopColor="var(--danger)" stopOpacity="0.6" />
          </linearGradient>
          <linearGradient id="riskStroke" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stopColor="var(--accent)" />
            <stop offset="1" stopColor="var(--danger)" />
          </linearGradient>
        </defs>

        {zoneEnd > 0.05 && (
          <g>
            <rect x={xs(0)} y={T} width={xs(zoneEnd) - xs(0)} height={B - T} fill="var(--safe)" opacity="0.09" />
            <line x1={xs(zoneEnd)} y1={T} x2={xs(zoneEnd)} y2={B} stroke="var(--safe)" strokeWidth="1" strokeDasharray="3 4" opacity="0.5" />
            <text x={xs(zoneEnd / 2)} y={T + 13} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--safe)" opacity="0.85" letterSpacing="1">SAFE ZONE</text>
          </g>
        )}

        {[0, 25, 50, 75, 100].map(r => (
          <g key={r}>
            <line x1={L} y1={ys(r)} x2={R} y2={ys(r)} stroke="var(--grid-line)" strokeWidth="1" />
            <text x={L - 8} y={ys(r) + 3.5} textAnchor="end" fontSize="10" fill="var(--faint)">{r}</text>
          </g>
        ))}
        {[0, 1, 2, 3].map(t => (
          <g key={t}>
            <line x1={xs(t)} y1={T} x2={xs(t)} y2={B} stroke="var(--grid-line)" strokeWidth="1" />
            <text x={xs(t)} y={B + 18} textAnchor="middle" fontSize="10" fill="var(--faint)">{t}s</text>
          </g>
        ))}
        <text x={R} y={B + 34} textAnchor="end" fontSize="9.5" fill="var(--faint)" letterSpacing="0.8">DUNK TIME</text>
        <text x={L - 34} y={T - 6} fontSize="9.5" fill="var(--faint)" letterSpacing="0.8">RISK %</text>

        <path d={area} fill="url(#riskGrad)" opacity="0.5" />
        <path d={line} fill="none" stroke="url(#riskStroke)" strokeWidth="2.5" strokeLinecap="round" style={{ transition: 'd 0.3s' }} />

        <line x1={mx} y1={T} x2={mx} y2={B} stroke="var(--text)" strokeWidth="1" strokeDasharray="4 4" opacity="0.35" />
        <circle className="marker-pulse" cx={mx} cy={my} r="9" fill="var(--danger)" opacity="0.4" />
        <circle cx={mx} cy={my} r="5" fill="var(--danger)" stroke="var(--bg)" strokeWidth="2" />
        <g transform={'translate(' + mx + ' ' + (my > 52 ? my - 16 : my + 24) + ')'}>
          <rect x="-30" y="-11" width="60" height="19" rx="6" fill="var(--glass-strong)" stroke="var(--border)" />
          <text x="0" y="2.5" textAnchor="middle" fontSize="10.5" fontWeight="700" fill="var(--text)">{cur.toFixed(0)}% risk</text>
        </g>
      </svg>
      <div className="graph-legend">
        <span className="legend-item"><span className="legend-swatch" style={{ background: 'linear-gradient(90deg, var(--accent), var(--danger))' }} />Crumble risk curve</span>
        <span className="legend-item"><span className="legend-box" style={{ background: 'var(--safe-soft)', border: '1px solid var(--safe)' }} />Safe zone (risk &lt; 25%)</span>
        <span className="legend-item"><span className="legend-swatch" style={{ background: 'var(--text)', opacity: 0.5 }} />Your dunk time</span>
      </div>
    </div>
  );
}

/* ================= gauge ================= */

function Gauge({ score }) {
  const C = 2 * Math.PI * 54;
  const off = C * (1 - score / 100);
  const color = score >= 75 ? 'var(--safe)' : score >= 45 ? 'var(--warn)' : 'var(--danger)';
  return (
    <div className="gauge-wrap">
      <svg viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="54" fill="none" stroke="var(--track)" strokeWidth="10" />
        <circle
          cx="70" cy="70" r="54" fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={off}
          style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(0.22,1,0.36,1), stroke 0.4s', filter: 'drop-shadow(0 0 6px ' + (score >= 75 ? 'var(--safe)' : score >= 45 ? 'var(--warn)' : 'var(--danger)') + ')' }}
        />
      </svg>
      <div className="gauge-center">
        <span className="gauge-num" style={{ color }}>{Math.round(score)}</span>
        <span className="gauge-cap">Score</span>
      </div>
    </div>
  );
}

const DEFAULTS = { temp: 75, dunkTime: 1.0, integrity: 70, biscuitIndex: 0 };

function App() {
  const [temp, setTemp] = useState(DEFAULTS.temp);
  const [dunkTime, setDunkTime] = useState(DEFAULTS.dunkTime);
  const [integrity, setIntegrity] = useState(DEFAULTS.integrity);
  const [biscuitIndex, setBiscuitIndex] = useState(DEFAULTS.biscuitIndex);
  const [playing, setPlaying] = useState(true);
  const [theme, setTheme] = useState('dark');
  const [showHelp, setShowHelp] = useState(false);
  const [crumbCount, setCrumbCount] = useState(0);

  const b = BISCUITS[biscuitIndex];
  const soak = soakAt(dunkTime, temp, b);
  const risk = riskAt(dunkTime, temp, b, integrity);
  const moisture = moistureAt(dunkTime, temp, b);
  const score = scoreAt(dunkTime, temp, b, integrity);
  const verdict = verdictFor(risk, soak);

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);

  const reset = () => {
    setTemp(DEFAULTS.temp); setDunkTime(DEFAULTS.dunkTime);
    setIntegrity(DEFAULTS.integrity); setBiscuitIndex(DEFAULTS.biscuitIndex);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') { setShowHelp(false); return; }
      const tag = e.target ? e.target.tagName : '';
      if (tag === 'INPUT' && (e.key.startsWith('Arrow') || e.key === ' ')) return;
      const k = e.key;
      if (k === ' ') { e.preventDefault(); setPlaying(p => !p); }
      else if (k === 'ArrowLeft') { e.preventDefault(); setDunkTime(t => clamp(+(t - 0.1).toFixed(2), 0.2, 3)); }
      else if (k === 'ArrowRight') { e.preventDefault(); setDunkTime(t => clamp(+(t + 0.1).toFixed(2), 0.2, 3)); }
      else if (k === 'ArrowUp') { e.preventDefault(); setTemp(t => clamp(t + 1, 50, 100)); }
      else if (k === 'ArrowDown') { e.preventDefault(); setTemp(t => clamp(t - 1, 50, 100)); }
      else if (k === '[') setIntegrity(v => clamp(v - 5, 10, 100));
      else if (k === ']') setIntegrity(v => clamp(v + 5, 10, 100));
      else if (k >= '1' && k <= '6') setBiscuitIndex(parseInt(k, 10) - 1);
      else if (k === 't' || k === 'T') setTheme(th => th === 'dark' ? 'light' : 'dark');
      else if (k === 'r' || k === 'R') reset();
      else if (k === '?') setShowHelp(s => !s);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const params = { temp, dunkTime, integrity, biscuitIndex };

  return (
    <div className="app">
      <header>
        <div className="brand">
          <div className="logo" style={{ color: '#fff' }}><I.cup /></div>
          <div>
            <h1>Tea Dunkability <em>Simulator</em></h1>
            <div className="tagline">Scientifically dubious biscuit physics, est. teatime</div>
          </div>
        </div>
        <div className="header-actions">
          <button className="btn icon-btn" title="Toggle theme (T)" aria-label="Toggle theme" onClick={() => setTheme(th => th === 'dark' ? 'light' : 'dark')}>
            {theme === 'dark' ? <I.sun /> : <I.moon />}
          </button>
          <button className="btn icon-btn" title="Keyboard shortcuts (?)" aria-label="Help" onClick={() => setShowHelp(true)}>
            <I.help />
          </button>
        </div>
      </header>

      <div className="grid">
        {/* cup */}
        <section className="card card-cup">
          <div className="card-head">
            <div>
              <div className="card-title"><I.cup /> The Dunk</div>
              <div className="card-sub">Live simulation · {b.full}</div>
            </div>
            <span className={'chip' + (playing ? '' : ' paused')}><span className="dot"></span>{playing ? 'DUNKING' : 'PAUSED'}</span>
          </div>
          <CupScene params={params} playing={playing} onCrumbs={(n) => setCrumbCount(c => c + n)} />
          <div className="scene-foot">
            <div className="biscuit-id">
              <div className="biscuit-swatch" style={{ background: 'linear-gradient(180deg, ' + b.body + ', ' + b.speck + ')' }} />
              <div>
                <div className="biscuit-name">{b.full}</div>
                <div className="biscuit-desc">{b.desc}</div>
              </div>
            </div>
            <div className="scene-actions">
              <span className="chip">Crumbs scattered: <strong style={{ color: 'var(--text)', marginLeft: 2 }}>{crumbCount}</strong></span>
              <button className="btn btn-primary" onClick={() => setPlaying(p => !p)} title="Play / pause (Space)">
                {playing ? <I.pause /> : <I.play />}{playing ? 'Pause' : 'Dunk'}
              </button>
            </div>
          </div>
        </section>

        {/* controls */}
        <section className="card card-controls">
          <div className="card-head">
            <div>
              <div className="card-title"><I.cookie /> Controls</div>
              <div className="card-sub">Tune the ritual</div>
            </div>
            <button className="btn" onClick={reset} title="Reset (R)"><I.reset />Reset</button>
          </div>
          <Slider
            label="Biscuit Type" icon={<I.cookie />}
            value={biscuitIndex} min={0} max={5} step={1}
            display={b.name}
            accent="var(--accent)"
            onChange={(v) => setBiscuitIndex(Math.round(v))}
            ticks={BISCUITS.map(x => x.name)} tickActive={biscuitIndex}
          />
          <Slider
            label="Tea Temperature" icon={<I.thermo />}
            value={temp} min={50} max={100} step={1} unit="°C"
            accent="var(--hot)"
            onChange={setTemp}
          />
          <Slider
            label="Dunk Time" icon={<I.clock />}
            value={dunkTime} min={0.2} max={3} step={0.05} unit="s"
            display={<>{dunkTime.toFixed(2)}<small> s</small></>}
            accent="var(--cold)"
            onChange={setDunkTime}
          />
          <Slider
            label="Structural Integrity" icon={<I.shield />}
            value={integrity} min={10} max={100} step={5} unit="%"
            accent="var(--safe)"
            onChange={setIntegrity}
          />
        </section>

        {/* graph */}
        <section className="card card-graph">
          <div className="card-head">
            <div>
              <div className="card-title"><I.chart /> Crumble-O-Meter</div>
              <div className="card-sub">Crumble risk vs. dunk time for {b.name.toLowerCase()} at {temp}°C</div>
            </div>
          </div>
          <CrumbleGraph temp={temp} dunkTime={dunkTime} integrity={integrity} biscuitIndex={biscuitIndex} />
        </section>

        {/* verdict */}
        <section className="card card-verdict">
          <div className="card-head">
            <div>
              <div className="card-title"><I.gauge /> Verdict</div>
              <div className="card-sub">How did that go?</div>
            </div>
          </div>
          <div className="verdict-body">
            <Gauge score={score} />
            <div className="verdict-text">
              <div className="verdict-label" style={{ color: verdict.tone }}>{verdict.label}</div>
              <div className="verdict-blurb">{verdict.blurb}</div>
              <div className="stat-rows">
                <div className="stat-row">
                  <span className="k"><I.drop />Soak level</span>
                  <span className="stat-val-wrap"><span className="v">{moisture.toFixed(0)}%</span>
                    <span className="mini-bar"><div style={{ width: moisture + '%', background: 'var(--cold)' }} /></span></span>
                </div>
                <div className="stat-row">
                  <span className="k"><I.chart />Crumble risk</span>
                  <span className="stat-val-wrap"><span className="v" style={{ color: risk > 55 ? 'var(--danger)' : risk > 25 ? 'var(--warn)' : 'var(--safe)' }}>{risk.toFixed(0)}%</span>
                    <span className="mini-bar"><div style={{ width: risk + '%', background: risk > 55 ? 'var(--danger)' : risk > 25 ? 'var(--warn)' : 'var(--safe)' }} /></span></span>
                </div>
                <div className="stat-row">
                  <span className="k"><I.shield />Integrity</span>
                  <span className="stat-val-wrap"><span className="v">{integrity}%</span>
                    <span className="mini-bar"><div style={{ width: integrity + '%', background: 'var(--safe)' }} /></span></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <footer>
        <span className="kbd-group"><kbd>Space</kbd> dunk / pause</span>
        <span className="kbd-group"><kbd>←</kbd><kbd>→</kbd> dunk time</span>
        <span className="kbd-group"><kbd>↑</kbd><kbd>↓</kbd> tea temp</span>
        <span className="kbd-group"><kbd>[</kbd><kbd>]</kbd> integrity</span>
        <span className="kbd-group"><kbd>1</kbd>–<kbd>6</kbd> biscuit</span>
        <span className="kbd-group"><kbd>T</kbd> theme</span>
        <span className="kbd-group"><kbd>R</kbd> reset</span>
        <span className="kbd-group"><kbd>?</kbd> help</span>
      </footer>

      {showHelp && (
        <div className="overlay" onClick={(e) => { if (e.target === e.currentTarget) setShowHelp(false); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
            <h2>Keyboard Shortcuts</h2>
            <div className="sub">Run the whole simulation without touching the mouse.</div>
            <div className="help-grid">
              <div className="help-row"><span>Play / pause dunk loop</span><span className="keys"><kbd>Space</kbd></span></div>
              <div className="help-row"><span>Dunk time − / +</span><span className="keys"><kbd>←</kbd><kbd>→</kbd></span></div>
              <div className="help-row"><span>Tea temp − / +</span><span className="keys"><kbd>↓</kbd><kbd>↑</kbd></span></div>
              <div className="help-row"><span>Integrity − / +</span><span className="keys"><kbd>[</kbd><kbd>]</kbd></span></div>
              <div className="help-row"><span>Select biscuit type</span><span className="keys"><kbd>1</kbd>…<kbd>6</kbd></span></div>
              <div className="help-row"><span>Toggle dark / light</span><span className="keys"><kbd>T</kbd></span></div>
              <div className="help-row"><span>Reset to defaults</span><span className="keys"><kbd>R</kbd></span></div>
              <div className="help-row"><span>Close this dialog</span><span className="keys"><kbd>Esc</kbd></span></div>
            </div>
            <button className="btn modal-close" onClick={() => setShowHelp(false)}>Got it</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
