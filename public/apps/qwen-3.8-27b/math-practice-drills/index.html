<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Math Practice Drills — improve speed and accuracy with timed math quizzes." />
<title>Math Practice Drills</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --line-strong: #d4d4d8;
    --accent: #2563eb;
    --accent-ink: #1d4ed8;
    --accent-soft: #eff6ff;
    --good: #16a34a;
    --good-soft: #f0fdf4;
    --good-line: #bbf7d0;
    --bad: #dc2626;
    --bad-soft: #fef2f2;
    --bad-line: #fecaca;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  main { width: 100%; max-width: 640px; }

  .screen { animation: fadeUp .28s ease; }
  .screen[hidden] { display: none; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Setup ---------- */

  h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 1.1rem; margin: 6px 0 24px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
  }

  .field { margin-bottom: 22px; }
  .field-label {
    font-size: .8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 10px;
  }

  .options { display: flex; flex-wrap: wrap; gap: 10px; user-select: none; }
  .options button {
    flex: 1 1 100px;
    font: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 13px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: #fff; color: var(--ink);
    cursor: pointer;
    transition: border-color .12s, background .12s, color .12s;
  }
  .options button:hover { border-color: var(--line-strong); }
  .options button.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  .btn {
    font: inherit; font-weight: 700;
    border-radius: 14px; cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform .06s, background .15s, border-color .15s;
    user-select: none;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: #fff; font-size: 1.25rem; padding: 16px 24px; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); font-size: 1.1rem; padding: 15px 24px; }
  .btn.ghost:hover { border-color: var(--line-strong); }
  .btn.big { width: 100%; font-size: 1.35rem; padding: 18px; margin-top: 6px; }
  .btn.quiet {
    background: none; border: none; color: var(--muted);
    font-size: .95rem; font-weight: 600; padding: 8px 12px;
  }
  .btn.quiet:hover { color: var(--ink); }

  .stats {
    margin-top: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 24px;
  }
  .stats-title {
    font-size: .8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 10px;
  }
  .stats-row { display: flex; justify-content: space-between; font-size: 1.05rem; padding: 5px 0; }
  .stats-row span:first-child { font-weight: 600; }
  .stats-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats-lifetime {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: .95rem;
  }

  /* ---------- Quiz ---------- */

  .hud { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; user-select: none; }
  .hud-time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 84px; }
  .hud-mid { text-align: center; flex: 1; }
  .hud-label {
    font-size: .72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted);
  }
  .hud-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }

  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 28px; }
  .bar-fill {
    height: 100%; width: 100%;
    background: var(--accent); border-radius: 99px;
    transition: width .1s linear, background .3s;
  }
  .bar-fill.low { background: var(--bad); }

  .problem-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px 24px 36px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
    transition: background-color .15s, border-color .15s;
  }
  .problem-card.flash-good { background: var(--good-soft); border-color: var(--good-line); }
  .problem-card.flash-bad  { background: var(--bad-soft);  border-color: var(--bad-line); animation: shake .3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    50%      { transform: translateX(8px); }
    75%      { transform: translateX(-4px); }
  }

  .problem {
    font-size: clamp(3.5rem, 15vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    word-break: break-word;
  }

  .feedback { min-height: 30px; margin-top: 18px; font-size: 1.15rem; font-weight: 700; }
  .feedback.good { color: var(--good); }
  .feedback.bad  { color: var(--bad); }

  .answer {
    display: block;
    width: 100%; max-width: 340px;
    margin: 26px auto 0;
    font: inherit; font-size: 2.5rem; font-weight: 700;
    text-align: center;
    padding: 14px;
    border: 2px solid var(--line); border-radius: 16px;
    background: var(--card);
    outline: none;
    font-variant-numeric: tabular-nums;
    transition: border-color .12s, box-shadow .12s;
  }
  .answer:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, .15); }

  .hint { text-align: center; color: var(--muted); margin-top: 14px; font-size: .95rem; }
  .quit-row { text-align: center; margin-top: 10px; }

  /* ---------- Results ---------- */

  .record-wrap { text-align: center; margin-bottom: 18px; }
  .record-badge {
    display: inline-block;
    background: var(--good); color: #fff;
    font-weight: 700; font-size: 1rem;
    padding: 8px 20px; border-radius: 99px;
    animation: pop .35s ease;
  }
  @keyframes pop {
    from { transform: scale(.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .accuracy-big {
    font-size: clamp(4rem, 20vw, 6rem);
    font-weight: 800; letter-spacing: -0.03em;
    text-align: center; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .accuracy-label {
    text-align: center; color: var(--muted);
    text-transform: uppercase; letter-spacing: .12em;
    font-size: .85rem; font-weight: 700;
    margin: 8px 0 4px;
  }
  .verdict { text-align: center; font-size: 1.2rem; font-weight: 600; margin-bottom: 26px; }

  .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .res-cell {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 10px;
    text-align: center;
  }
  .res-num { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .res-label { color: var(--muted); font-size: .8rem; margin-top: 4px; font-weight: 600; }

  .res-best { text-align: center; color: var(--muted); margin-bottom: 26px; font-size: 1rem; }

  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }

  @media (max-width: 480px) {
    .card { padding: 22px 18px; }
    .hud-time { font-size: 1.6rem; min-width: 68px; }
    .hud-value { font-size: 1.25rem; }
    .problem-card { padding: 32px 16px 28px; }
  }
</style>
</head>
<body>
<main>

  <!-- ============ SETUP ============ -->
  <section id="screen-setup" class="screen">
    <h1>Math Practice Drills</h1>
    <p class="tagline">Improve speed and accuracy. Pick your drill and go.</p>

    <div class="card">
      <div class="field">
        <div class="field-label">Difficulty</div>
        <div class="options" id="opt-difficulty">
          <button type="button" data-value="easy">Easy</button>
          <button type="button" data-value="medium" class="selected">Medium</button>
          <button type="button" data-value="hard">Hard</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Focus</div>
        <div class="options" id="opt-operation">
          <button type="button" data-value="mixed" class="selected">Mixed</button>
          <button type="button" data-value="+">Addition</button>
          <button type="button" data-value="&#8722;">Subtraction</button>
          <button type="button" data-value="&#215;">Multiplication</button>
          <button type="button" data-value="&#247;">Division</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Time</div>
        <div class="options" id="opt-duration">
          <button type="button" data-value="30">30s</button>
          <button type="button" data-value="60" class="selected">1 min</button>
          <button type="button" data-value="90">90s</button>
          <button type="button" data-value="120">2 min</button>
        </div>
      </div>

      <button type="button" class="btn primary big" id="btn-start">Start drill</button>
    </div>

    <div class="stats">
      <div class="stats-title">Your record</div>
      <div class="stats-row"><span>Easy</span><span id="best-easy">&#8212;</span></div>
      <div class="stats-row"><span>Medium</span><span id="best-medium">&#8212;</span></div>
      <div class="stats-row"><span>Hard</span><span id="best-hard">&#8212;</span></div>
      <div class="stats-lifetime" id="lifetime">No drills yet &#8212; start your first one.</div>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="hud">
      <div class="hud-time" id="time-display">1:00</div>
      <div class="hud-mid">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="score-display">0</div>
      </div>
      <div class="hud-mid">
        <div class="hud-label">Streak</div>
        <div class="hud-value" id="streak-display">0</div>
      </div>
    </div>

    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>

    <div class="problem-card" id="problem-card">
      <div class="problem" id="problem-text">12 + 7</div>
      <div class="feedback" id="feedback"></div>
    </div>

    <input
      id="answer"
      class="answer"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Your answer"
    />
    <div class="hint">Type your answer and press Enter</div>
    <div class="quit-row"><button type="button" class="btn quiet" id="btn-quit">Quit drill</button></div>
  </section>

  <!-- ============ RESULTS ============ -->
  <section id="screen-results" class="screen" hidden>
    <div class="record-wrap"><span class="record-badge" id="record-badge" hidden>New record!</span></div>

    <div class="accuracy-big" id="res-accuracy">0%</div>
    <div class="accuracy-label">Accuracy</div>
    <div class="verdict" id="res-verdict"></div>

    <div class="res-grid">
      <div class="res-cell">
        <div class="res-num" id="res-score">0 / 0</div>
        <div class="res-label">Correct</div>
      </div>
      <div class="res-cell">
        <div class="res-num" id="res-speed">&#8212;</div>
        <div class="res-label">Per problem</div>
      </div>
      <div class="res-cell">
        <div class="res-num" id="res-streak">0</div>
        <div class="res-label">Best streak</div>
      </div>
    </div>

    <div class="res-best" id="res-best"></div>

    <div class="btn-row">
      <button type="button" class="btn primary" id="btn-again">Play again</button>
      <button type="button" class="btn ghost" id="btn-settings">Settings</button>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var RANGES = {
    easy:   { add: [1, 10],    sub: [1, 10],    mul: [1, 5],   div: [1, 5] },
    medium: { add: [10, 99],   sub: [10, 99],   mul: [2, 12],  div: [2, 12] },
    hard:   { add: [100, 999], sub: [100, 999], mul: [12, 19], div: [3, 19] }
  };
  var OPS = ['+', '\u2212', '\u00d7', '\u00f7'];
  var DIFFS = ['easy', 'medium', 'hard'];
  var STORAGE_KEY = 'math-drills-stats-v1';
  var FEEDBACK_MS = 400;

  var settings = { difficulty: 'medium', operation: 'mixed', duration: 60 };
  var state = {
    score: 0, attempts: 0, streak: 0, bestStreak: 0,
    current: null, endTime: 0, timerId: null, locked: false
  };

  var els = {
    screens: { setup: $('screen-setup'), quiz: $('screen-quiz'), results: $('screen-results') },
    time: $('time-display'), score: $('score-display'), streak: $('streak-display'),
    bar: $('bar-fill'), problem: $('problem-text'), card: $('problem-card'),
    feedback: $('feedback'), answer: $('answer'),
    resAccuracy: $('res-accuracy'), resVerdict: $('res-verdict'),
    resScore: $('res-score'), resSpeed: $('res-speed'), resStreak: $('res-streak'),
    resBest: $('res-best'), recordBadge: $('record-badge'), lifetime: $('lifetime')
  };

  /* ---------- Stats (score tracker) ---------- */

  function blankBest() { return { score: 0, accuracy: 0, total: 0 }; }

  function loadStats() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.lifetime && s.best) return s;
      }
    } catch (e) { /* corrupted or unavailable — start fresh */ }
    return {
      lifetime: { problems: 0, correct: 0, bestStreak: 0 },
      best: { easy: blankBest(), medium: blankBest(), hard: blankBest() }
    };
  }

  function saveStats(s) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* private mode */ }
  }

  function renderStats() {
    var s = loadStats();
    DIFFS.forEach(function (d) {
      var b = s.best[d];
      var el = $('best-' + d);
      el.textContent = b.score > 0 ? b.score + ' correct \u00b7 ' + b.accuracy + '%' : '\u2014';
    });
    var L = s.lifetime;
    els.lifetime.textContent = L.problems > 0
      ? L.problems.toLocaleString() + ' problems \u00b7 ' +
        Math.round((L.correct / L.problems) * 100) + '% lifetime accuracy \u00b7 best streak ' + L.bestStreak
      : 'No drills yet \u2014 start your first one.';
  }

  /* ---------- Problem generation ---------- */

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  function genProblem() {
    var r = RANGES[settings.difficulty];
    var op = settings.operation === 'mixed' ? pick(OPS) : settings.operation;
    var a, b, answer;
    if (op === '+') {
      a = randInt(r.add[0], r.add[1]); b = randInt(r.add[0], r.add[1]);
      answer = a + b;
    } else if (op === '\u2212') {
      a = randInt(r.sub[0], r.sub[1]); b = randInt(r.sub[0], a);
      answer = a - b;
    } else if (op === '\u00d7') {
      a = randInt(r.mul[0], r.mul[1]); b = randInt(r.mul[0], r.mul[1]);
      answer = a * b;
    } else {
      b = randInt(r.div[0], r.div[1]); answer = randInt(r.div[0], r.div[1]);
      a = b * answer;
    }
    return { text: a + ' ' + op + ' ' + b, answer: answer };
  }

  /* ---------- Flow ---------- */

  function showScreen(name) {
    Object.keys(els.screens).forEach(function (k) { els.screens[k].hidden = true; });
    var el = els.screens[name];
    el.hidden = false;
    el.classList.remove('active');
    void el.offsetWidth;
    el.classList.add('active');
  }

  function fmtTime(sec) {
    var s = Math.ceil(sec);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function updateHud() {
    els.score.textContent = state.score;
    els.streak.textContent = state.streak;
  }

  function nextProblem() {
    state.current = genProblem();
    els.problem.textContent = state.current.text;
    els.answer.value = '';
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    state.locked = false;
    els.answer.focus();
  }

  function startQuiz() {
    state.score = 0; state.attempts = 0; state.streak = 0; state.bestStreak = 0;
    state.endTime = performance.now() + settings.duration * 1000;
    updateHud();
    nextProblem();
    showScreen('quiz');
    clearInterval(state.timerId);
    state.timerId = setInterval(tick, 100);
    tick();
  }

  function tick() {
    var leftMs = state.endTime - performance.now();
    var left = Math.max(0, leftMs / 1000);
    els.time.textContent = fmtTime(left);
    els.bar.style.width = (left / settings.duration) * 100 + '%';
    els.bar.classList.toggle('low', left <= 10 && left > 0);
    if (leftMs <= 0) endQuiz();
  }

  function submit() {
    if (state.locked || !state.current) return;
    var raw = els.answer.value.trim();
    if (raw === '') return;
    var num = Number(raw);
    state.attempts++;
    state.locked = true;

    if (num === state.current.answer) {
      state.score++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      els.feedback.textContent = 'Correct';
      els.feedback.className = 'feedback good';
      els.card.classList.remove('flash-bad');
      els.card.classList.add('flash-good');
    } else {
      state.streak = 0;
      els.feedback.textContent = 'Answer: ' + state.current.answer;
      els.feedback.className = 'feedback bad';
      els.card.classList.remove('flash-good');
      els.card.classList.add('flash-bad');
    }
    updateHud();

    setTimeout(function () {
      els.card.classList.remove('flash-good', 'flash-bad');
      if (state.timerId !== null) nextProblem();
    }, FEEDBACK_MS);
  }

  function verdictFor(acc) {
    if (acc >= 90) return 'Outstanding!';
    if (acc >= 75) return 'Great work!';
    if (acc >= 50) return 'Good effort.';
    return 'Keep practicing.';
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function endQuiz() {
    clearInterval(state.timerId);
    state.timerId = null;

    var attempts = state.attempts, score = state.score;
    var acc = attempts ? Math.round((score / attempts) * 100) : 0;
    var speed = attempts ? settings.duration / attempts : 0;

    var stats = loadStats();
    var prevBest = stats.best[settings.difficulty];
    var isRecord = score > 0 && score > prevBest.score;

    stats.lifetime.problems += attempts;
    stats.lifetime.correct += score;
    if (state.bestStreak > stats.lifetime.bestStreak) stats.lifetime.bestStreak = state.bestStreak;
    if (isRecord) {
      prevBest.score = score;
      prevBest.total = attempts;
      prevBest.accuracy = acc;
    }
    saveStats(stats);

    els.resAccuracy.textContent = acc + '%';
    els.resVerdict.textContent = verdictFor(acc);
    els.resScore.textContent = score + ' / ' + attempts;
    els.resSpeed.textContent = attempts ? speed.toFixed(1) + 's' : '\u2014';
    els.resStreak.textContent = state.bestStreak;
    els.resBest.textContent = 'Best for ' + cap(settings.difficulty) + ': ' +
      prevBest.score + ' correct' + (prevBest.score ? ' \u00b7 ' + prevBest.accuracy + '%' : '') +
      ' \u00b7 ' + settings.duration + 's drill';
    els.recordBadge.hidden = !isRecord;

    renderStats();
    showScreen('results');
  }

  /* ---------- Wiring ---------- */

  function bindGroup(id, key, transform) {
    var group = $(id);
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-value]');
      if (!btn) return;
      group.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('selected', b === btn);
      });
      settings[key] = transform ? transform(btn.dataset.value) : btn.dataset.value;
    });
  }

  bindGroup('opt-difficulty', 'difficulty');
  bindGroup('opt-operation', 'operation');
  bindGroup('opt-duration', 'duration', Number);

  $('btn-start').addEventListener('click', startQuiz);
  $('btn-again').addEventListener('click', startQuiz);
  $('btn-settings').addEventListener('click', function () {
    renderStats();
    showScreen('setup');
  });
  $('btn-quit').addEventListener('click', function () {
    clearInterval(state.timerId);
    state.timerId = null;
    renderStats();
    showScreen('setup');
  });

  els.answer.addEventListener('input', function () {
    els.answer.value = els.answer.value.replace(/[^0-9]/g, '');
  });
  els.answer.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });
  els.card.addEventListener('click', function () { els.answer.focus(); });

  renderStats();
})();
</script>
</body>
</html>
