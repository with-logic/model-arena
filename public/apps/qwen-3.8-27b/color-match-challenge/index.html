<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1120" />
<title>Color Match Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --text: #f4f6ff;
  --muted: #9aa3c0;
  --glass: rgba(255, 255, 255, 0.055);
  --line: rgba(255, 255, 255, 0.1);
  --font-ui: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Archivo Black', 'Arial Black', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  color: var(--text);
  background:
    radial-gradient(1100px 700px at 15% -10%, rgba(61, 123, 255, 0.16), transparent 60%),
    radial-gradient(1000px 700px at 110% 115%, rgba(164, 94, 234, 0.16), transparent 55%),
    linear-gradient(160deg, #0e1120, #171233);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body::before, body::after {
  content: '';
  position: fixed;
  z-index: 0;
  width: 55vmax;
  height: 55vmax;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.16;
  animation: drift 16s ease-in-out infinite alternate;
  pointer-events: none;
}
body::before { background: #3d7bff; top: -18vmax; left: -14vmax; }
body::after { background: #a55eea; bottom: -20vmax; right: -14vmax; animation-delay: -8s; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(5vmax, 4vmax) scale(1.12); }
}
.hidden { display: none !important; }

.app {
  position: relative;
  z-index: 1;
  width: min(680px, 100vw);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.game { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.game.shake { animation: shake 0.3s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}

.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  padding: 16px 18px 12px;
}
.stat {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 14px;
  text-align: center;
  min-width: 88px;
}
.stat .label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--muted);
}
.stat .value {
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}
.stat.time .value { font-size: 1.7rem; }
.stat.time.danger .value { color: #ff5252; animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
.value.bump { animation: bump 0.18s ease; }
@keyframes bump { 35% { transform: scale(1.22); } }
.streak-value.hot { color: #ffd32a; text-shadow: 0 0 18px rgba(255, 211, 42, 0.55); }

.timerbar {
  height: 9px;
  margin: 0 18px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}
.fill { height: 100%; width: 100%; border-radius: 999px; transition: width 0.08s linear; }
.fill.ok { background: linear-gradient(90deg, #2ed573, #74e9a4); }
.fill.warn { background: linear-gradient(90deg, #ffd32a, #ffe370); }
.fill.danger { background: linear-gradient(90deg, #ff4757, #ff8a94); animation: barPulse 0.5s ease-in-out infinite; }
@keyframes barPulse { 50% { opacity: 0.65; } }

.stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 160px;
}
.ready {
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.35em;
  color: var(--muted);
  animation: pulse 1.6s ease-in-out infinite;
}
.word {
  font-family: var(--font-display);
  line-height: 1;
  white-space: nowrap;
}
.word.pop { animation: pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop {
  0% { transform: scale(0.55); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.float {
  position: absolute;
  top: 30%;
  font-weight: 700;
  font-size: 1.5rem;
  color: #7dffb0;
  pointer-events: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 22px rgba(46, 213, 115, 0.5);
  animation: floatUp 0.75s ease-out forwards;
}
@keyframes floatUp {
  0% { transform: translate(-50%, 0) scale(0.9); opacity: 0; }
  15% { opacity: 1; transform: translate(-50%, -12px) scale(1.15); }
  100% { transform: translate(-50%, -84px) scale(1); opacity: 0; }
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 6px 18px calc(20px + env(safe-area-inset-bottom));
}
.cbtn {
  position: relative;
  border: none;
  border-radius: 16px;
  padding: 20px 8px 18px;
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #0d1020;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 26px rgba(0, 0, 0, 0.35);
  transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.15s ease;
}
.cbtn:hover { filter: brightness(1.07); }
.cbtn.pressed {
  transform: translateY(5px) scale(0.98);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 4px 10px rgba(0, 0, 0, 0.3);
}
.cbtn .key {
  position: absolute;
  top: 7px;
  right: 9px;
  font-size: 0.62rem;
  font-weight: 700;
  background: rgba(0, 0, 0, 0.22);
  padding: 1px 6px;
  border-radius: 6px;
}
.cbtn.hit { filter: brightness(1.3); }
.cbtn.miss { filter: brightness(0.75) saturate(1.5); }
.cbtn.reveal { animation: reveal 0.45s ease; }
@keyframes reveal {
  0%, 100% { box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 12px 26px rgba(0, 0, 0, 0.35); }
  50% { box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9), 0 6px 0 rgba(0, 0, 0, 0.4); }
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 28px 24px;
  text-align: center;
  background: rgba(9, 11, 22, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  animation: fadeIn 0.35s ease;
  overflow-y: auto;
}
@keyframes fadeIn { from { opacity: 0; } }

.title {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 9vw, 4rem);
  line-height: 1.05;
  letter-spacing: 0.02em;
}
.title span { display: inline-block; animation: dropIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@keyframes dropIn { from { transform: translateY(-28px); opacity: 0; } }
.tagline { color: var(--muted); font-size: 0.95rem; letter-spacing: 0.06em; margin-top: -8px; }

.howto {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 26px;
  max-width: 430px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.demo-word { font-family: var(--font-display); font-size: 2.9rem; line-height: 1.1; }
.howto p { color: var(--muted); font-size: 0.95rem; line-height: 1.55; }
.howto b { color: #fff; font-weight: 700; }

.big-btn {
  font-family: var(--font-ui);
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #0d1020;
  background: linear-gradient(180deg, #74e9a4, #2ed573);
  border: none;
  border-radius: 16px;
  padding: 17px 54px;
  cursor: pointer;
  box-shadow: 0 6px 0 #15804a, 0 16px 34px rgba(46, 213, 115, 0.3);
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
}
.big-btn:hover { filter: brightness(1.07); }
.big-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #15804a; }

.bestline {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--muted);
}
.bestline b { color: #ffd32a; font-variant-numeric: tabular-nums; }
.hint { font-size: 0.75rem; letter-spacing: 0.12em; color: rgba(154, 163, 192, 0.6); }

.end-title {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 7vw, 2.6rem);
  color: #fff;
}
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .end-title {
    background: linear-gradient(90deg, #ff4d5d, #ffd32a, #2ed573, #3d7bff, #a55eea);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
}
.final-score {
  font-size: clamp(3.4rem, 14vw, 5rem);
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 10px 50px rgba(255, 255, 255, 0.15);
}
.badge {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 7px 18px;
  border-radius: 999px;
  color: #0d1020;
  background: linear-gradient(90deg, #ffd32a, #ff8a5c);
  box-shadow: 0 0 26px rgba(255, 211, 42, 0.45);
  animation: pulse 1.2s ease-in-out infinite;
}
.badge.flawless { background: linear-gradient(90deg, #74e9a4, #22d3ee); box-shadow: 0 0 26px rgba(34, 211, 238, 0.45); }
.stats-row { display: flex; gap: 10px; }

.countdown {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.countdown span {
  font-family: var(--font-display);
  font-size: clamp(4rem, 18vw, 7rem);
  color: #fff;
  text-shadow: 0 0 60px rgba(255, 255, 255, 0.35);
}
.countdown span.pop { animation: countPop 0.62s ease both; }
@keyframes countPop {
  0% { transform: scale(2.4); opacity: 0; }
  35% { transform: scale(1); opacity: 1; }
  85% { transform: scale(0.95); opacity: 1; }
  100% { transform: scale(0.85); opacity: 0; }
}

.mute {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 30;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--glass);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.mute:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }
.mute svg { width: 20px; height: 20px; fill: currentColor; }

.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.confetti i {
  position: absolute;
  top: -24px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(112vh) rotate(720deg); }
}

@media (max-height: 600px) {
  .cbtn { padding: 13px 8px 12px; font-size: 0.88rem; }
  .hud { padding-top: 10px; }
  .stat .value { font-size: 1.2rem; }
  .stat.time .value { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="app">
  <div class="game" id="gameScreen">
    <div class="hud">
      <div class="stat">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat time" id="timeStat">
        <div class="label">TIME</div>
        <div class="value" id="timeVal">30</div>
      </div>
      <div class="stat">
        <div class="label">STREAK</div>
        <div class="value streak-value" id="streakVal">—</div>
      </div>
    </div>
    <div class="timerbar"><div class="fill ok" id="barFill"></div></div>
    <div class="stage" id="stage">
      <div class="ready" id="ready">GET READY</div>
      <div class="word" id="word"></div>
    </div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="screen" id="startScreen">
    <div class="title" id="title"></div>
    <div class="tagline">A 30-SECOND TEST OF SPEED &amp; FOCUS</div>
    <div class="howto">
      <div class="demo-word" style="color:#ff4d5d">BLUE</div>
      <p>This word says <b>BLUE</b> — but it's printed in <b style="color:#ff4d5d">RED</b>.<br />Click the <b>ink color</b>, not the word. Build streaks for bonus points.</p>
    </div>
    <button class="big-btn" id="startBtn">START</button>
    <div class="bestline hidden" id="bestStart">BEST <b id="bestStartVal">0</b></div>
    <div class="hint">KEYS 1–6 · M TO MUTE</div>
  </div>

  <div class="screen hidden" id="endScreen">
    <div class="end-title">TIME'S UP</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="badge hidden" id="newBest">NEW BEST!</div>
    <div class="badge flawless hidden" id="flawless">FLAWLESS!</div>
    <div class="stats-row">
      <div class="stat"><div class="label">CORRECT</div><div class="value" id="statCorrect">0</div></div>
      <div class="stat"><div class="label">ACCURACY</div><div class="value" id="statAcc">0%</div></div>
      <div class="stat"><div class="label">TOP STREAK</div><div class="value" id="statStreak">×0</div></div>
    </div>
    <div class="bestline" id="endBest">BEST <b id="endBestVal">0</b></div>
    <button class="big-btn" id="againBtn">PLAY AGAIN</button>
  </div>

  <div class="countdown hidden" id="countdown"><span id="countNum">3</span></div>

  <button class="mute" id="muteBtn" aria-label="Toggle sound">
    <svg id="iconOn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <svg id="iconOff" class="hidden" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .97-.2 1.89-.54 2.74l1.52 1.52C20.63 14.81 21 13.45 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
  </button>
</div>
<script>
(() => {
'use strict';

const COLORS = [
  { name: 'RED',    ink: '#ff4d5d', top: '#ff8a94' },
  { name: 'BLUE',   ink: '#3d7bff', top: '#7aa5ff' },
  { name: 'GREEN',  ink: '#2ed573', top: '#74e9a4' },
  { name: 'YELLOW', ink: '#ffd32a', top: '#ffe370' },
  { name: 'PURPLE', ink: '#a55eea', top: '#c98bfa' },
  { name: 'CYAN',   ink: '#1fd0e8', top: '#67e8f9' },
];
const GAME_SECONDS = 30;
const BEST_KEY = 'colormatch-best-v1';

const $ = (id) => document.getElementById(id);
const gameScreen = $('gameScreen');
const startScreen = $('startScreen');
const endScreen = $('endScreen');
const scoreEl = $('scoreVal');
const timeEl = $('timeVal');
const timeStat = $('timeStat');
const streakEl = $('streakVal');
const barFill = $('barFill');
const stageEl = $('stage');
const wordEl = $('word');
const readyEl = $('ready');
const padEl = $('pad');
const startBtn = $('startBtn');
const againBtn = $('againBtn');
const muteBtn = $('muteBtn');
const iconOn = $('iconOn');
const iconOff = $('iconOff');
const countWrap = $('countdown');
const countNum = $('countNum');
const finalScoreEl = $('finalScore');
const newBestEl = $('newBest');
const flawlessEl = $('flawless');
const statCorrect = $('statCorrect');
const statAcc = $('statAcc');
const statStreak = $('statStreak');
const endBest = $('endBest');
const endBestVal = $('endBestVal');
const bestStart = $('bestStart');
const bestStartVal = $('bestStartVal');

const store = {
  get() { try { return Number(localStorage.getItem(BEST_KEY) || 0) || 0; } catch (e) { return 0; } },
  set(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} },
};

const Sfx = {
  ctx: null,
  on: true,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type, v, delay, f2) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g);
    g.connect(this.ctx.destination);
    o.start(t);
    o.stop(t + d + 0.05);
  },
  correct(streak) {
    const b = 500 + Math.min(streak, 12) * 35;
    this.tone(b, 0.07, 'sine', 0.22);
    this.tone(b * 1.5, 0.12, 'sine', 0.18, 0.055);
  },
  wrong() { this.tone(150, 0.22, 'sawtooth', 0.16, 0, 80); },
  tick() { this.tone(1000, 0.045, 'square', 0.06); },
  count() { this.tone(440, 0.09, 'sine', 0.2); },
  go() { this.tone(880, 0.25, 'sine', 0.24); this.tone(1318, 0.3, 'sine', 0.14, 0.08); },
  over() {
    this.tone(523, 0.12, 'sine', 0.2);
    this.tone(392, 0.12, 'sine', 0.2, 0.14);
    this.tone(262, 0.4, 'sine', 0.2, 0.28);
  },
};

const btnEls = {};
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'cbtn';
  b.style.background = 'linear-gradient(180deg, ' + c.top + ', ' + c.ink + ')';
  b.innerHTML = '<span class="key">' + (i + 1) + '</span>' + c.name;
  const handler = (e) => {
    e.preventDefault();
    press(b);
    answer(c.name);
  };
  if (window.PointerEvent) {
    b.addEventListener('pointerdown', handler);
  } else {
    b.addEventListener('mousedown', handler);
    b.addEventListener('touchstart', handler, { passive: false });
  }
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  padEl.appendChild(b);
  btnEls[c.name] = b;
});

const titleEl = $('title');
'COLOR MATCH'.split('').forEach((ch, i) => {
  const s = document.createElement('span');
  if (ch === ' ') {
    s.style.width = '0.35em';
  } else {
    s.textContent = ch;
    s.style.color = COLORS[i % COLORS.length].ink;
    s.style.animationDelay = (i * 0.045) + 's';
  }
  titleEl.appendChild(s);
});

let S = null;
let rafId = 0;
let endTime = 0;
let lastTickSec = -1;
let countTimers = [];

function freshState() {
  return { running: false, score: 0, streak: 0, bestStreak: 0, correct: 0, total: 0, word: null, ink: null, lastWord: null, lastInk: null };
}

function inkOf(name) {
  for (let i = 0; i < COLORS.length; i++) if (COLORS[i].name === name) return COLORS[i].ink;
  return '#fff';
}

function sizeWord(len) {
  const maxW = Math.min(stageEl.clientWidth * 0.86, 540);
  return Math.min(175, maxW / (0.82 * len));
}

function updateHud(bump) {
  scoreEl.textContent = S.score.toLocaleString();
  if (bump) {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }
  streakEl.textContent = S.streak > 0 ? '×' + S.streak : '—';
  streakEl.classList.toggle('hot', S.streak >= 3);
}

function nextWord() {
  const pick = () => COLORS[(Math.random() * COLORS.length) | 0].name;
  let w, ink, guard = 0;
  do {
    w = pick();
    ink = Math.random() < 0.3 ? w : pick();
    guard++;
  } while (guard < 25 && w === S.lastWord && ink === S.lastInk);
  S.word = w;
  S.ink = ink;
  S.lastWord = w;
  S.lastInk = ink;
  readyEl.classList.add('hidden');
  wordEl.textContent = w;
  wordEl.style.color = inkOf(ink);
  wordEl.style.textShadow = '0 6px 40px rgba(0,0,0,0.5), 0 0 70px ' + inkOf(ink) + '55';
  wordEl.style.fontSize = sizeWord(w.length) + 'px';
  wordEl.classList.remove('pop');
  void wordEl.offsetWidth;
  wordEl.classList.add('pop');
}

function floatScore(text) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = (50 + (Math.random() * 26 - 13)) + '%';
  stageEl.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function press(b) {
  b.classList.add('pressed');
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('pressed'), 130);
}

function shake() {
  gameScreen.classList.remove('shake');
  void gameScreen.offsetWidth;
  gameScreen.classList.add('shake');
}

function answer(name) {
  if (!S || !S.running) return;
  const btn = btnEls[name];
  S.total++;
  if (name === S.ink) {
    S.correct++;
    S.streak++;
    if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    const pts = 10 + Math.min(S.streak - 1, 10) * 5;
    S.score += pts;
    Sfx.correct(S.streak);
    floatScore('+' + pts);
    btn.classList.add('hit');
    setTimeout(() => btn.classList.remove('hit'), 180);
    updateHud(true);
    nextWord();
  } else {
    S.streak = 0;
    Sfx.wrong();
    shake();
    btn.classList.add('miss');
    setTimeout(() => btn.classList.remove('miss'), 320);
    const right = btnEls[S.ink];
    right.classList.remove('reveal');
    void right.offsetWidth;
    right.classList.add('reveal');
    setTimeout(() => right.classList.remove('reveal'), 500);
    updateHud(false);
  }
}

function loop() {
  if (!S || !S.running) return;
  const remain = Math.max(0, endTime - performance.now());
  const frac = remain / (GAME_SECONDS * 1000);
  barFill.style.width = (frac * 100).toFixed(2) + '%';
  const bucket = frac > 0.5 ? 'ok' : frac > 0.22 ? 'warn' : 'danger';
  if (barFill.dataset.b !== bucket) {
    barFill.dataset.b = bucket;
    barFill.className = 'fill ' + bucket;
  }
  const sec = Math.ceil(remain / 1000);
  timeEl.textContent = sec;
  timeStat.classList.toggle('danger', sec <= 5);
  if (sec !== lastTickSec) {
    lastTickSec = sec;
    if (sec <= 5 && sec > 0) Sfx.tick();
  }
  if (remain <= 0) {
    endGame();
    return;
  }
  rafId = requestAnimationFrame(loop);
}

function showCountdown(done) {
  countWrap.classList.remove('hidden');
  const seq = ['3', '2', '1', 'GO!'];
  countTimers.forEach(clearTimeout);
  countTimers = [];
  seq.forEach((txt, i) => {
    countTimers.push(setTimeout(() => {
      countNum.textContent = txt;
      countNum.classList.remove('pop');
      void countNum.offsetWidth;
      countNum.classList.add('pop');
      if (txt === 'GO!') Sfx.go();
      else Sfx.count();
    }, i * 650));
  });
  countTimers.push(setTimeout(() => {
    countWrap.classList.add('hidden');
    done();
  }, seq.length * 650));
}

function startGame() {
  Sfx.ensure();
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  S = freshState();
  updateHud(false);
  readyEl.classList.remove('hidden');
  wordEl.textContent = '';
  wordEl.classList.remove('pop');
  timeEl.textContent = GAME_SECONDS;
  timeStat.classList.remove('danger');
  barFill.dataset.b = 'ok';
  barFill.className = 'fill ok';
  barFill.style.width = '100%';
  showCountdown(() => {
    S.running = true;
    nextWord();
    endTime = performance.now() + GAME_SECONDS * 1000;
    lastTickSec = GAME_SECONDS + 1;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  });
}

function endGame() {
  if (!S) return;
  S.running = false;
  cancelAnimationFrame(rafId);
  timeEl.textContent = '0';
  barFill.style.width = '0%';
  Sfx.over();
  const prevBest = store.get();
  const isBest = S.score > prevBest;
  const shownBest = isBest ? S.score : prevBest;
  if (isBest) store.set(S.score);
  const flawless = S.total > 0 && S.correct === S.total;
  finalScoreEl.textContent = S.score.toLocaleString();
  newBestEl.classList.toggle('hidden', !isBest);
  flawlessEl.classList.toggle('hidden', !flawless);
  statCorrect.textContent = String(S.correct);
  statAcc.textContent = (S.total ? Math.round((100 * S.correct) / S.total) : 0) + '%';
  statStreak.textContent = '×' + S.bestStreak;
  endBestVal.textContent = shownBest.toLocaleString();
  endBest.classList.toggle('hidden', isBest);
  updateBestStart();
  setTimeout(() => {
    endScreen.classList.remove('hidden');
    if (isBest) confetti();
  }, 500);
}

function updateBestStart() {
  const b = store.get();
  bestStart.classList.toggle('hidden', b <= 0);
  bestStartVal.textContent = b.toLocaleString();
}

function confetti() {
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  const inks = COLORS.map((c) => c.ink);
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    const s = 6 + Math.random() * 8;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = s + 'px';
    p.style.height = (s * (0.5 + Math.random())) + 'px';
    p.style.background = inks[(Math.random() * inks.length) | 0];
    p.style.animationDelay = (Math.random() * 0.7) + 's';
    p.style.animationDuration = (1.7 + Math.random() * 1.5) + 's';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 4000);
}

function toggleMute() {
  Sfx.on = !Sfx.on;
  iconOn.classList.toggle('hidden', !Sfx.on);
  iconOff.classList.toggle('hidden', Sfx.on);
}

startBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);
muteBtn.addEventListener('click', toggleMute);

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if (k >= '1' && k <= '6') {
    const c = COLORS[Number(k) - 1];
    press(btnEls[c.name]);
    answer(c.name);
    return;
  }
  if (k === 'Enter' || k === ' ') {
    if (!startScreen.classList.contains('hidden') || !endScreen.classList.contains('hidden')) {
      e.preventDefault();
      startGame();
    }
    return;
  }
  if (k === 'm' || k === 'M') toggleMute();
});

window.addEventListener('resize', () => {
  if (S && S.word) wordEl.style.fontSize = sizeWord(S.word.length) + 'px';
});

updateBestStart();
})();
</script>
</body>
</html>
