<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#6fd3ff"/>
<title>Fruit Catcher!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍓</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
font-family:'Baloo 2',ui-rounded,'Comic Sans MS',system-ui,sans-serif;
background:#87dcff;
touch-action:none;
user-select:none;-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;
}
#game{position:fixed;inset:0;display:block}
body.playing #game{cursor:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;z-index:5;pointer-events:none}
.hud-col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hud-col.right{align-items:flex-end}
.badge{background:rgba(255,255,255,.92);border-radius:16px;padding:5px 18px 7px;box-shadow:0 4px 0 rgba(30,80,120,.18);text-align:center}
.badge .label{display:block;font-size:11px;font-weight:800;letter-spacing:2px;color:#5aa7d6;line-height:1}
#score{font-size:34px;font-weight:800;color:#ff5252;line-height:1.05;display:inline-block;min-width:2ch}
#score.pop{animation:scorepop .3s cubic-bezier(.34,1.56,.64,1)}
#best{font-size:22px;font-weight:800;color:#ffb300;display:inline-block;min-width:2ch}
@keyframes scorepop{40%{transform:scale(1.35)}}
#combo{display:none;background:linear-gradient(180deg,#ff9100,#ff6d00);color:#fff;border-radius:999px;padding:3px 16px;font-size:16px;font-weight:800;box-shadow:0 3px 0 rgba(160,70,0,.4)}
#combo.show{display:inline-block}
#combo.pop{animation:scorepop .3s}
#hearts{display:flex;gap:5px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;box-shadow:0 4px 0 rgba(30,80,120,.18)}
.heart{width:30px;height:30px;transition:transform .35s,filter .35s,opacity .35s}
.heart.lost{filter:grayscale(1);opacity:.35;transform:scale(.8) rotate(-14deg)}
.heart.losing{animation:heartbreak .55s}
@keyframes heartbreak{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.55) rotate(12deg)}60%{transform:scale(.7) rotate(-18deg)}100%{transform:scale(.8) rotate(-14deg)}}
#muteBtn{pointer-events:auto;cursor:pointer;border:none;background:rgba(255,255,255,.92);border-radius:50%;width:46px;height:46px;font-size:22px;line-height:1;box-shadow:0 4px 0 rgba(30,80,120,.18);transition:transform .15s}
#muteBtn:hover{transform:scale(1.08)}
#muteBtn:active{transform:scale(.92)}
#banner{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%);z-index:6;font-size:clamp(38px,7vw,64px);font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18),0 0 30px rgba(255,255,255,.65);opacity:0;pointer-events:none;white-space:nowrap}
#banner.show{animation:bannerIn 1.5s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}32%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
#hintbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:4;font-size:13px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap}
#hintbar.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(25,70,110,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{background:linear-gradient(180deg,#ffffff,#e9f7ff);border-radius:34px;padding:36px 52px 40px;text-align:center;box-shadow:0 24px 70px rgba(20,60,100,.35),0 0 0 6px rgba(255,255,255,.35);max-width:min(92vw,560px);animation:panelIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes panelIn{from{transform:scale(.55);opacity:0}}
.emoji-row{font-size:clamp(34px,6vw,52px);letter-spacing:8px;margin-bottom:4px}
.emoji-row span{display:inline-block;animation:floaty 2.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
h1.title{font-size:clamp(32px,7vw,56px);font-weight:800;line-height:1.1;margin:2px 0 8px}
h1.title span{display:inline-block;animation:letterBounce 1.8s ease-in-out infinite;text-shadow:0 3px 0 rgba(0,0,0,.12)}
@keyframes letterBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.tagline{font-size:clamp(15px,2.6vw,19px);font-weight:700;color:#4a7fa8;margin-bottom:22px}
.btn{font-family:inherit;font-weight:800;font-size:clamp(22px,3.4vw,29px);color:#fff;background:linear-gradient(180deg,#ff8a50,#ff5722);border:none;border-radius:999px;padding:14px 54px;cursor:pointer;box-shadow:0 7px 0 #d84315,0 14px 28px rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s;letter-spacing:1px}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 9px 0 #d84315,0 18px 32px rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #d84315}
.hint{margin-top:16px;font-size:14px;font-weight:700;color:#7fb2d4}
.kbd{display:inline-block;background:#fff;border-radius:8px;padding:1px 9px;box-shadow:0 2px 0 #c5dff0;font-weight:800;color:#4a7fa8}
#overEmoji{font-size:clamp(48px,9vw,72px);line-height:1.1}
#overTitle{font-size:clamp(28px,5.5vw,44px);font-weight:800;color:#ff5252;margin:4px 0 0}
.final-label{font-size:13px;font-weight:800;letter-spacing:3px;color:#5aa7d6;margin-top:14px}
.final-score{font-size:clamp(46px,9vw,70px);font-weight:800;color:#ff9100;line-height:1.05}
.best-line{font-size:17px;font-weight:800;color:#4a7fa8;margin-top:4px}
#newBest{display:none;background:linear-gradient(90deg,#ffd600,#ffab00);color:#7a4f00;border-radius:999px;padding:5px 20px;font-weight:800;font-size:16px;margin-top:12px;box-shadow:0 3px 0 rgba(160,110,0,.35);animation:scorepop 1s infinite}
#newBest.show{display:inline-block}
@media (max-width:520px){
.panel{padding:28px 26px 32px;border-radius:26px}
#score{font-size:28px}
#best{font-size:18px}
.heart{width:26px;height:26px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-col">
    <div class="badge"><span class="label">SCORE</span><span id="score">0</span></div>
    <div id="combo">x2</div>
  </div>
  <div class="hud-col right">
    <div id="hearts">
      <svg class="heart" viewBox="0 0 24 24" width="30" height="30"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff5252" stroke="#e53935" stroke-width="1"/></svg>
      <svg class="heart" viewBox="0 0 24 24" width="30" height="30"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff5252" stroke="#e53935" stroke-width="1"/></svg>
      <svg class="heart" viewBox="0 0 24 24" width="30" height="30"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff5252" stroke="#e53935" stroke-width="1"/></svg>
    </div>
    <div class="badge"><span class="label">BEST</span><span id="best">0</span></div>
    <button id="muteBtn" title="Mute (M)">🔊</button>
  </div>
</div>

<div id="banner"></div>
<div id="hintbar">← → or mouse to move &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <div class="emoji-row"><span style="animation-delay:0s">🍎</span><span style="animation-delay:.15s">🍓</span><span style="animation-delay:.3s">🍊</span><span style="animation-delay:.45s">🍌</span><span style="animation-delay:.6s">🍇</span><span style="animation-delay:.75s">🍉</span></div>
    <h1 class="title" aria-label="Fruit Catcher"><span style="color:#ff5252;animation-delay:0s">F</span><span style="color:#ff9100;animation-delay:.07s">R</span><span style="color:#f9a825;animation-delay:.14s">U</span><span style="color:#66bb6a;animation-delay:.21s">I</span><span style="color:#29b6f6;animation-delay:.28s">T</span>&nbsp;<span style="color:#26c6da;animation-delay:.35s">C</span><span style="color:#ab47bc;animation-delay:.42s">A</span><span style="color:#ec407a;animation-delay:.49s">T</span><span style="color:#ff7043;animation-delay:.56s">C</span><span style="color:#8d6e63;animation-delay:.63s">H</span><span style="color:#5c6bc4;animation-delay:.7s">E</span><span style="color:#26a69a;animation-delay:.77s">R</span></h1>
    <p class="tagline">Catch the falling fruit — but don't drop three!</p>
    <button class="btn" id="playBtn">PLAY!</button>
    <p class="hint">Move with <span class="kbd">←</span> <span class="kbd">→</span> or your mouse &nbsp;•&nbsp; <span class="kbd">Space</span> to start</p>
  </div>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="panel">
    <div id="overEmoji">😅</div>
    <h2 id="overTitle">Game Over!</h2>
    <div class="final-label">YOUR SCORE</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="best-line" id="finalBest">Best: 0</div>
    <div><span id="newBest">★ NEW BEST! ★</span></div>
    <div style="margin-top:22px"><button class="btn" id="againBtn">PLAY AGAIN</button></div>
    <p class="hint">or press <span class="kbd">Space</span></p>
  </div>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="panel">
    <div style="font-size:56px">⏸️</div>
    <h2 style="font-size:34px;font-weight:800;color:#4a7fa8">Paused</h2>
    <p class="hint" style="margin-bottom:20px">Take a breather!</p>
    <button class="btn" id="resumeBtn">RESUME</button>
  </div>
</div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const scoreEl = $('score'), bestEl = $('best'), comboEl = $('combo');
const startOv = $('startOverlay'), overOv = $('overOverlay'), pauseOv = $('pauseOverlay');
const bannerEl = $('banner'), finalScoreEl = $('finalScore'), finalBestEl = $('finalBest');
const newBestEl = $('newBest'), overEmojiEl = $('overEmoji'), overTitleEl = $('overTitle');
const muteBtn = $('muteBtn'), hintbar = $('hintbar');
const heartEls = Array.from(document.querySelectorAll('.heart'));

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1;
let state = 'menu', paused = false;
let score = 0, lives = 3, combo = 0, level = 1, best = 0, bestBeaten = false;
let gameTime = 0, spawnTimer = 1, menuTimer = 0.4, time = 0;
let fruits = [], particles = [], popups = [], confetti = [];
let confettiTime = 0, newBest = false;
let shakeT = 0, flash = 0;
let mode = 'pointer', pointerX = null;
let overToken = 0;
const keys = { left: false, right: false };
let fruitR = 34;

const basket = { x: 0, y: 0, w: 170, h: 88, vx: 0, tilt: 0, squash: 0, face: 'happy', faceTimer: 0, bob: 0 };

try { best = parseInt(localStorage.getItem('fc_best') || '0', 10) || 0; } catch (e) {}
let muted = false;
try { muted = localStorage.getItem('fc_muted') === '1'; } catch (e) {}

const FRUIT_DEFS = [
  { type: 'apple', color: '#ff5252', points: 10 },
  { type: 'strawberry', color: '#ff4d6d', points: 10 },
  { type: 'orange', color: '#ffa726', points: 10 },
  { type: 'banana', color: '#fbc02d', points: 15 },
  { type: 'grape', color: '#ab47bc', points: 15 },
  { type: 'melon', color: '#ff5252', points: 20 },
  { type: 'peach', color: '#ff8a65', points: 10 },
  { type: 'lemon', color: '#fdd835', points: 15 }
];
const GOLD = { type: 'gold', color: '#ffc107', points: 50 };

const clouds = [];
function initClouds() {
  clouds.length = 0;
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * W, y: rand(H * 0.05, H * 0.35), s: rand(0.6, 1.5), v: rand(6, 18) });
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const m = Math.min(W, H);
  basket.w = clamp(m * 0.24, 120, 210);
  basket.h = basket.w * 0.5;
  basket.y = H - basket.h - 24;
  fruitR = clamp(m * 0.055, 26, 46);
  basket.x = clamp(basket.x || W / 2, basket.w / 2 + 6, W - basket.w / 2 - 6);
  if (!clouds.length) initClouds();
}
window.addEventListener('resize', resize);

const sfx = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, dur, type, vol, t, slide) {
    if (!this.ctx || muted) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    const now = c.currentTime + (t || 0);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(now);
    o.stop(now + dur + 0.05);
  },
  catch(c) {
    const b = 1 + Math.min(c, 12) * 0.04;
    this.tone(480 * b, 0.09, 'sine', 0.22, 0);
    this.tone(720 * b, 0.12, 'sine', 0.18, 0.06);
  },
  gold() { [660, 880, 1108, 1318].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.2, i * 0.07)); },
  miss() { this.tone(210, 0.3, 'sawtooth', 0.15, 0, 70); },
  levelup() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.2, i * 0.08)); },
  newbest() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.22, i * 0.08)); },
  gameover() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.2, i * 0.17)); },
  click() { this.tone(640, 0.06, 'square', 0.05, 0); }
};

function setScore(v) {
  scoreEl.textContent = v;
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
}

function updateHUD() {
  bestEl.textContent = best;
  if (combo >= 2) {
    comboEl.textContent = 'x' + combo;
    comboEl.classList.add('show');
    comboEl.classList.remove('pop');
    void comboEl.offsetWidth;
    comboEl.classList.add('pop');
  } else {
    comboEl.classList.remove('show');
  }
  heartEls.forEach((h, i) => {
    const lost = i >= lives;
    if (lost && !h.classList.contains('lost')) {
      h.classList.add('losing');
      setTimeout(() => h.classList.remove('losing'), 600);
    }
    h.classList.toggle('lost', lost);
  });
}

function setFace(f, t) { basket.face = f; basket.faceTimer = t; }

function banner(text) {
  bannerEl.textContent = text;
  bannerEl.classList.remove('show');
  void bannerEl.offsetWidth;
  bannerEl.classList.add('show');
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(60, 320);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 120,
      r: rand(3, 7),
      color: Math.random() < 0.3 ? '#fff' : color,
      t: 0,
      life: rand(0.5, 0.9)
    });
  }
}

function popup(x, y, text, color, size) {
  popups.push({ x: clamp(x, 50, W - 50), y, text, color, size: size || 26, t: 0, life: 0.9 });
}

function startGame() {
  overToken++;
  sfx.ensure();
  sfx.click();
  score = 0; lives = 3; combo = 0; level = 1; gameTime = 0;
  bestBeaten = false; newBest = false;
  fruits = []; particles = []; popups = []; confetti = [];
  confettiTime = 0;
  spawnTimer = 0.7;
  basket.x = W / 2; basket.vx = 0;
  setFace('happy', 0);
  state = 'playing'; paused = false;
  document.body.classList.add('playing');
  startOv.classList.add('hidden');
  overOv.classList.add('hidden');
  pauseOv.classList.add('hidden');
  hintbar.classList.add('show');
  scoreEl.textContent = '0';
  updateHUD();
}

function endGame() {
  state = 'over';
  overToken++;
  document.body.classList.remove('playing');
  hintbar.classList.remove('show');
  newBest = score > best && score > 0;
  if (newBest) {
    best = score;
    try { localStorage.setItem('fc_best', String(best)); } catch (e) {}
    sfx.newbest();
    confettiTime = 3;
    overEmojiEl.textContent = '🎉';
    overTitleEl.textContent = 'Amazing!';
  } else {
    sfx.gameover();
    overEmojiEl.textContent = '😅';
    overTitleEl.textContent = 'Game Over!';
  }
  finalScoreEl.textContent = score;
  finalBestEl.textContent = 'Best: ' + best;
  newBestEl.classList.toggle('show', newBest);
  setFace('sad', 9999);
  updateHUD();
  const tok = overToken;
  setTimeout(() => { if (tok === overToken) overOv.classList.remove('hidden'); }, 700);
}

function togglePause() {
  if (state !== 'playing') return;
  paused = !paused;
  pauseOv.classList.toggle('hidden', !paused);
  sfx.click();
}

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('fc_muted', muted ? '1' : '0'); } catch (e) {}
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (!muted) { sfx.ensure(); sfx.click(); }
}

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; mode = 'keys'; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; mode = 'keys'; e.preventDefault(); }
  else if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'over') startGame();
    else if (paused) togglePause();
  }
  else if (k === 'p' || k === 'P' || k === 'Escape') togglePause();
  else if (k === 'm' || k === 'M') toggleMute();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
window.addEventListener('mousemove', e => { mode = 'pointer'; pointerX = e.clientX; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); mode = 'pointer'; pointerX = e.touches[0].clientX; }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); mode = 'pointer'; pointerX = e.touches[0].clientX; }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
startOv.addEventListener('click', e => { if (!e.target.closest('.btn')) startGame(); });
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', togglePause);
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing' && !paused) togglePause();
});
muteBtn.textContent = muted ? '🔇' : '🔊';

function updateBasket(dt) {
  const speed = 980;
  if (mode === 'keys') {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    basket.vx += (dir * speed - basket.vx) * Math.min(1, dt * 10);
    basket.x += basket.vx * dt;
  } else if (pointerX != null) {
    const diff = pointerX - basket.x;
    const move = diff * Math.min(1, dt * 14);
    basket.x += move;
    basket.vx = move / Math.max(dt, 0.0001);
  }
  basket.x = clamp(basket.x, basket.w / 2 + 6, W - basket.w / 2 - 6);
  basket.tilt = clamp(basket.vx / 4200, -0.16, 0.16);
}

function pickDef() {
  if (level >= 2 && Math.random() < 0.08) return GOLD;
  return FRUIT_DEFS[(Math.random() * FRUIT_DEFS.length) | 0];
}

function spawnFruit(ambient) {
  const n = ambient ? 1 : (level >= 3 && Math.random() < 0.3 ? 2 : 1);
  for (let i = 0; i < n; i++) {
    const def = pickDef();
    const r = fruitR * (0.92 + Math.random() * 0.24);
    fruits.push({
      def, r, ambient: !!ambient,
      x: rand(r + 12, W - r - 12),
      y: -r * 2,
      vy: ambient ? rand(70, 110) : (125 + level * 16) * rand(0.85, 1.2),
      vx: rand(-28, 28),
      rot: rand(0, TAU),
      vr: rand(-1.4, 1.4),
      t: 0
    });
  }
}

function catchFruit(f) {
  score += f.def.points;
  combo++;
  popup(f.x, basket.y - 46, '+' + f.def.points, f.def.color, 26);
  if (combo % 5 === 0) {
    const bonus = combo * 5;
    score += bonus;
    popup(basket.x, basket.y - 96, 'COMBO +' + bonus, '#ff6d00', 30);
  }
  burst(f.x, basket.y - 8, f.def.color, f.def.type === 'gold' ? 26 : 16);
  basket.squash = 1;
  setFace('joy', 0.5);
  if (f.def.type === 'gold') sfx.gold(); else sfx.catch(combo);
  if (best > 0 && !bestBeaten && score > best) {
    bestBeaten = true;
    banner('New Best!');
    sfx.newbest();
  }
  setScore(score);
  updateHUD();
}

function missFruit(f) {
  lives--;
  combo = 0;
  shakeT = 0.4;
  flash = 1;
  setFace('sad', 0.9);
  sfx.miss();
  burst(f.x, H - 48, '#a1887f', 10);
  updateHUD();
  if (lives <= 0) endGame();
}

function stepFruits(dt, live) {
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.t += dt;
    const g = f.ambient ? 150 : 260;
    const cap = f.ambient ? 240 : 560 + level * 20;
    f.vy = Math.min(f.vy + g * dt, cap);
    f.y += f.vy * dt;
    f.x += f.vx * dt + Math.sin(f.t * 2.4 + f.rot) * 10 * dt;
    f.rot += f.vr * dt;
    if (f.x < f.r) { f.x = f.r; f.vx = Math.abs(f.vx); }
    if (f.x > W - f.r) { f.x = W - f.r; f.vx = -Math.abs(f.vx); }
    if (live) {
      const rimY = basket.y;
      if (f.y + f.r * 0.45 >= rimY && f.y - f.r * 0.3 <= rimY + basket.h * 0.55 && Math.abs(f.x - basket.x) <= basket.w * 0.5 + f.r * 0.35) {
        catchFruit(f);
        fruits.splice(i, 1);
        continue;
      }
      if (f.y - f.r > H - 40) {
        missFruit(f);
        fruits.splice(i, 1);
        continue;
      }
    } else if (f.y - f.r > H + 40) {
      fruits.splice(i, 1);
    }
  }
}

function spawnConfetti() {
  const colors = ['#ff5252', '#ffd600', '#66bb6a', '#29b6f6', '#ab47bc', '#ff9100', '#ec407a'];
  confetti.push({
    x: rand(0, W), y: -20,
    vx: rand(-40, 40), vy: rand(80, 220),
    rot: rand(0, TAU), vr: rand(-4, 4),
    w: rand(6, 11), h: rand(9, 15),
    color: colors[(Math.random() * colors.length) | 0],
    t: 0
  });
}

function stepConfetti(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.t += dt;
    c.x += c.vx * dt + Math.sin(c.t * 5 + i) * 30 * dt;
    c.y += c.vy * dt;
    c.rot += c.vr * dt;
    if (c.y > H + 30) confetti.splice(i, 1);
  }
}

function stepParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vy += 500 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function stepPopups(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t += dt;
    if (p.t >= p.life) { popups.splice(i, 1); continue; }
    p.y -= 55 * dt;
  }
}

function update(dt) {
  time += dt;
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 160) c.x = -160;
  }
  basket.squash = Math.max(0, basket.squash - dt * 3.2);
  basket.faceTimer = Math.max(0, basket.faceTimer - dt);
  basket.bob = Math.sin(time * 2.2) * 2.5;
  shakeT = Math.max(0, shakeT - dt);
  flash = Math.max(0, flash - dt * 2.4);

  if (state === 'playing' && !paused) {
    gameTime += dt;
    const nl = 1 + Math.floor(score / 120);
    if (nl > level) {
      level = nl;
      banner('Level ' + level + '!');
      sfx.levelup();
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnFruit(false);
      spawnTimer = Math.max(0.42, 1.15 - level * 0.085) * rand(0.75, 1.25);
    }
    stepFruits(dt, true);
  } else if (state === 'menu') {
    menuTimer -= dt;
    if (menuTimer <= 0) {
      spawnFruit(true);
      menuTimer = rand(1.1, 1.9);
    }
    stepFruits(dt, false);
  } else if (state === 'over') {
    stepFruits(dt, false);
    if (confettiTime > 0) {
      confettiTime -= dt;
      for (let i = 0; i < 3; i++) spawnConfetti();
    }
    stepConfetti(dt);
  }
  stepParticles(dt);
  stepPopups(dt);
}

function drawGold(r) {
  ctx.save();

function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);
  const r = f.r;
  const pulse = f.def.type === 'gold' ? 1 + 0.08 * Math.sin(time * 6) : 1;
  ctx.scale(pulse, pulse);
  switch (f.def.type) {
    case 'apple': drawApple(r); break;
    case 'strawberry': drawStrawberry(r); break;
    case 'orange': drawOrange(r); break;
    case 'banana': drawBanana(r); break;
    case 'grape': drawGrape(r); break;
    case 'melon': drawMelon(r); break;
    case 'peach': drawPeach(r); break;
    case 'lemon': drawLemon(r); break;
    case 'gold': drawGold(r); break;
  }
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFace(w, h) {
  const face = basket.faceTimer > 0 ? basket.face : (lives === 1 ? 'worried' : 'happy');
  const ey = h * 0.52, ex = w * 0.17;
  let look = { x: 0, y: 0 };
  let nearest = null, nd = Infinity;
  for (const f of fruits) {
    if (f.y >= basket.y) continue;
    const d = (f.x - basket.x) * (f.x - basket.x) + (f.y - basket.y) * (f.y - basket.y);
    if (d < nd) { nd = d; nearest = f; }
  }
  if (nearest) {
    const dx = nearest.x - basket.x, dy = nearest.y - basket.y;
    const len = Math.hypot(dx, dy) || 1;
    look = { x: dx / len * 3, y: dy / len * 3 };
  }
  ctx.fillStyle = 'rgba(244,143,177,0.5)';
  ctx.beginPath();
  ctx.ellipse(-w * 0.28, h * 0.68, w * 0.055, h * 0.045, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w * 0.28, h * 0.68, w * 0.055, h * 0.045, 0, 0, TAU);
  ctx.fill();
  const er = Math.max(5, w * 0.045);
  if (face === 'joy') {
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(-ex, ey, er * 0.9, Math.PI, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex, ey, er * 0.9, Math.PI, TAU);
    ctx.stroke();
    ctx.fillStyle = '#4e342e';
    ctx.beginPath();
    ctx.arc(0, h * 0.62, er * 1.15, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#ff8a80';
    ctx.beginPath();
    ctx.arc(0, h * 0.66, er * 0.6, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-ex, ey, er, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex, ey, er, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.arc(-ex + look.x, ey + look.y, er * 0.5, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex + look.x, ey + look.y, er * 0.5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    if (face === 'sad') {
      ctx.beginPath();
      ctx.arc(0, h * 0.78, er * 1.1, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else if (face === 'worried') {
      ctx.beginPath();
      ctx.arc(0, h * 0.68, er * 0.55, 0, TAU);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, h * 0.58, er * 1.1, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }
}

function drawBasket() {
  const b = basket;
  ctx.save();
  ctx.translate(b.x, b.y + b.bob);
  ctx.rotate(b.tilt);
  const sx = 1 + b.squash * 0.16, sy = 1 - b.squash * 0.12;
  ctx.scale(sx, sy);
  const w = b.w, h = b.h;
  const bodyG = ctx.createLinearGradient(0, 0, 0, h);
  bodyG.addColorStop(0, '#e29a5c');
  bodyG.addColorStop(1, '#b06a35');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  ctx.lineTo(w / 2, 0);
  ctx.lineTo(w * 0.36, h);
  ctx.lineTo(-w * 0.36, h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,63,20,0.3)';
  ctx.lineWidth = 3;
  for (let i = 1; i < 5; i++) {
    const t = i / 5;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + w * t, 0);
    ctx.lineTo(-w * 0.36 + w * 0.72 * t, h);
    ctx.stroke();
  }
  for (let i = 1; i < 3; i++) {
    const y = h * i / 3;
    const halfW = w / 2 - (w / 2 - w * 0.36) * (i / 3);
    ctx.beginPath();
    ctx.moveTo(-halfW, y);
    ctx.lineTo(halfW, y);
    ctx.stroke();
  }
  const rimH = h * 0.3;
  ctx.fillStyle = '#c97b3d';
  roundRectPath(-w / 2 - 7, -rimH * 0.55, w + 14, rimH, 10);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRectPath(-w / 2 - 7, -rimH * 0.55, w + 14, rimH * 0.4, 10);
  ctx.fill();
  drawFace(w, h);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  for (const p of popups) {
    const a = 1 - p.t / p.life;
    const sc = 1 + 0.4 * Math.max(0, 1 - p.t * 6);
    ctx.globalAlpha = a;
    ctx.font = '800 ' + Math.round(p.size * sc) + 'px "Baloo 2",sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawConfetti(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  ctx.fillStyle = c.color;
  ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const m = 10 * (shakeT / 0.4);
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawSky();
  drawSun();
  drawClouds();
  drawHills();
  for (const f of fruits) drawFruit(f);
  drawBasket();
  drawParticles();
  drawPopups();
  for (const c of confetti) drawConfetti(c);
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,64,64,' + (flash * 0.22).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
basket.x = W / 2;
bestEl.textContent = best;
updateHUD();
requestAnimationFrame(frame);
})();
</script>
</body>
