<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0b1226"/>
<title>🎄 Merry Christmas Card 🎄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e63946; --red-d:#a4161a; --gold:#ffd93d; --ink:#22304a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #2b3f6b 0%, #16223f 45%, #0b1226 100%);
    color:#fff; overflow:hidden;
    user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }
  button{ font-family:inherit; }

  /* ---------- header ---------- */
  header{ padding:10px 16px 4px; text-align:center; flex:0 0 auto; }
  h1{
    font-family:'Mountains of Christmas',cursive;
    font-size:clamp(1.9rem,5.5vw,3.1rem); line-height:1; font-weight:700;
  }
  h1 span{ display:inline-block; animation:letterB 1.8s ease-in-out infinite; }
  @keyframes letterB{
    0%,100%{ transform:translateY(0) rotate(0); }
    30%{ transform:translateY(-9px) rotate(7deg); }
    60%{ transform:translateY(2px) rotate(-4deg); }
  }
  .sub{ font-size:clamp(.78rem,2vw,1rem); opacity:.85; font-weight:600; margin-top:2px; }

  /* ---------- card frame (candy stripe) ---------- */
  .card-frame{
    flex:1; min-height:0; margin:6px 12px 8px;
    padding:clamp(8px,1.4vw,14px); border-radius:30px;
    background:repeating-linear-gradient(45deg, var(--red) 0 16px, #fff 16px 32px);
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .card{
    position:relative; width:100%; height:100%; border-radius:20px; overflow:hidden;
    background:linear-gradient(#0e1b3d 0%, #1c3263 45%, #35558f 78%, #7d9fd4 100%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.35);
    transition:box-shadow .2s;
  }
  .card.dropzone{
    box-shadow:inset 0 0 0 5px rgba(255,217,61,.95), inset 0 0 90px rgba(255,217,61,.22);
  }
  .card::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:15;
    box-shadow:inset 0 0 80px rgba(0,10,40,.35); border-radius:inherit;
  }

  /* ---------- scene decor ---------- */
  .sky-decor{ position:absolute; inset:-24px; transition:transform .4s ease-out; }
  .moon{
    position:absolute; top:13%; right:10%;
    width:clamp(44px,7vw,80px); aspect-ratio:1; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 35% 35%, #fffbe8, #ffe9a8 60%, #f5d67b);
    box-shadow:0 0 40px 12px rgba(255,240,180,.35);
  }
  .moon::before{ content:''; position:absolute; left:22%; top:52%; width:18%; aspect-ratio:1; border-radius:50%; background:rgba(190,150,60,.25); }
  .moon::after{ content:''; position:absolute; left:55%; top:28%; width:13%; aspect-ratio:1; border-radius:50%; background:rgba(190,150,60,.22); }
  .moon.wiggle{ animation:moonWig .6s ease; }
  @keyframes moonWig{ 25%{ transform:rotate(-9deg) scale(1.1);} 75%{ transform:rotate(9deg) scale(1.1);} }

  #stars span{
    position:absolute; background:#fff; border-radius:50%;
    animation:twinkle var(--tw,2s) ease-in-out var(--twd,0s) infinite alternate;
  }
  @keyframes twinkle{ from{ opacity:.2; transform:scale(.7);} to{ opacity:1; transform:scale(1.25);} }

  .shoot{
    position:absolute; z-index:2; width:110px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, transparent, #fff);
    animation:shoot 1.1s ease-out forwards;
  }
  @keyframes shoot{
    from{ transform:rotate(147deg) translateX(0); opacity:1; }
    to{ transform:rotate(147deg) translateX(-170px); opacity:0; }
  }

  .sleigh{
    position:absolute; top:15%; left:-30%; z-index:2;
    font-size:clamp(1.5rem,3.4vw,2.5rem);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
    animation:fly 28s linear infinite;
  }
  .sleigh span{ display:inline-block; animation:bobS 1.1s ease-in-out infinite alternate; }
  @keyframes fly{ 0%{ left:-30%; } 100%{ left:112%; } }
  @keyframes bobS{ from{ transform:scaleX(-1) translateY(-6px);} to{ transform:scaleX(-1) translateY(6px);} }

  .hill{ position:absolute; border-radius:50%; }
  .h1{ bottom:-16%; left:-18%; width:75%; height:42%; background:#e6eeff; }
  .h2{ bottom:-18%; right:-22%; width:85%; height:46%; background:#dce8ff; }
  .h3{ bottom:-20%; left:5%; width:95%; height:48%; background:#fff; box-shadow:inset 0 26px 30px -18px rgba(150,180,240,.55); }

  /* ---------- little house ---------- */
  .house{ position:absolute; left:70%; top:40%; width:22%; height:36%; z-index:3; }
  .house .body{
    position:absolute; left:8%; right:8%; bottom:0; height:62%;
    background:linear-gradient(#a06a42,#8a5636);
    border-radius:8px 8px 4px 4px;
    box-shadow:inset 0 -10px 14px rgba(0,0,0,.18);
  }
  .house .roof{
    position:absolute; top:0; left:0; right:0; height:52%;
    background:linear-gradient(#d64550,#b23040);
    clip-path:polygon(50% 0, 100% 100%, 0 100%);
  }
  .house .roof::before{ content:''; position:absolute; left:0; right:0; bottom:0; height:14%; background:#fff; border-radius:6px; }
  .house .roof::after{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:34%; height:32%; background:#fff; clip-path:polygon(50% 0, 100% 100%, 0 100%);
  }
  .house .chimney{ position:absolute; top:-6%; right:16%; width:13%; height:34%; background:#6f4226; border-radius:4px 4px 0 0; }
  .house .chimney::before{ content:''; position:absolute; top:0; left:-15%; right:-15%; height:26%; background:#fff; border-radius:6px; }
  .house .puff{
    position:absolute; top:-16%; left:50%; width:20%; aspect-ratio:1;
    background:rgba(255,255,255,.75); border-radius:50%; filter:blur(2px); opacity:0;
    animation:puff 3.2s ease-out infinite;
  }
  .puff.p2{ animation-delay:1.1s; } .puff.p3{ animation-delay:2.2s; }
  @keyframes puff{
    0%{ transform:translate(-50%,0) scale(.4); opacity:0; }
    15%{ opacity:.8; }
    100%{ transform:translate(-25%,-70px) scale(1.6); opacity:0; }
  }
  .house .win{
    position:absolute; width:24%; aspect-ratio:1; border-radius:6px; border:3px solid #4a2c14;
    background:
      linear-gradient(#4a2c14,#4a2c14) center/100% 2px no-repeat,
      linear-gradient(#4a2c14,#4a2c14) center/2px 100% no-repeat,
      radial-gradient(circle at 50% 45%, #fff3c4, #ffcf5e);
    box-shadow:0 0 14px 4px rgba(255,205,100,.5);
    animation:flick 3.4s ease-in-out infinite;
  }
  .win.w1{ left:16%; top:66%; } .win.w2{ right:16%; top:66%; }
  @keyframes flick{
    0%,100%{ box-shadow:0 0 14px 4px rgba(255,205,100,.5); }
    50%{ box-shadow:0 0 22px 8px rgba(255,205,100,.75); }
  }
  .house .door{
    position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:30%; height:44%;
    background:linear-gradient(#7c2d12,#5f1f0b);
    border-radius:50% 50% 6px 6px / 60% 60% 6px 6px;
    border:3px solid #4a2c14; border-bottom:none;
  }
  .house .door::after{
    content:''; position:absolute; right:16%; top:52%; width:15%; aspect-ratio:1;
    background:var(--gold); border-radius:50%; box-shadow:0 0 6px rgba(255,215,80,.8);
  }

  /* ---------- ribbon / chip / toolbar / hint ---------- */
  .ribbon{
    position:absolute; top:clamp(8px,2vh,18px); left:50%; transform:translateX(-50%); z-index:8;
    background:linear-gradient(#e63946,#a4161a);
    padding:4px 20px 6px; border-radius:999px; white-space:nowrap;
    font-family:'Mountains of Christmas',cursive;
    font-size:clamp(1.1rem,3.2vw,1.7rem); letter-spacing:.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.25);
    animation:sway 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sway{ 0%,100%{ transform:translateX(-50%) rotate(-1.5deg);} 50%{ transform:translateX(-50%) rotate(1.5deg);} }

  .chip{
    position:absolute; top:10px; left:10px; z-index:8;
    background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.3);
    padding:4px 12px; border-radius:999px; font-weight:700; font-size:.85rem;
    pointer-events:none;
  }

  .toolbar{ position:absolute; top:10px; right:10px; z-index:30; display:flex; gap:8px; }
  .toolbar button{
    width:44px; height:44px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
    font-size:1.3rem; cursor:pointer; display:grid; place-items:center;
    transition:transform .15s, background .15s;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .toolbar button:hover{ transform:scale(1.12) rotate(-6deg); background:rgba(255,255,255,.32); }
  .toolbar button:active{ transform:scale(.92); }
  .toolbar button.on{ background:rgba(255,217,61,.35); border-color:var(--gold); }
  .toolbar button.pulse{ animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ transform:scale(1.1); } }

  .hint{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:12;
    background:rgba(10,20,45,.55); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.35);
    padding:6px 16px; border-radius:999px;
    font-weight:700; font-size:.92rem; white-space:nowrap;
    animation:hintBob 1.6s ease-in-out infinite;
    transition:opacity .5s; pointer-events:none;
  }
  @keyframes hintBob{ 50%{ transform:translateX(-50%) translateY(-6px); } }
  .hint.gone{ opacity:0; }

  /* ---------- placed items ---------- */
  .items{ position:absolute; inset:0; z-index:10; }
  .placed{
    position:absolute; transform:translate(-50%,-50%);
    cursor:grab; touch-action:none; z-index:10;
    filter:drop-shadow(0 8px 10px rgba(10,20,50,.35));
  }
  .placed .e{
    display:inline-block; line-height:1;
    animation:bob var(--bd,3s) ease-in-out var(--bdl,0s) infinite alternate;
  }
  @keyframes bob{ from{ transform:translateY(-5px) rotate(-4deg);} to{ transform:translateY(5px) rotate(4deg);} }
  .placed::after{
    content:''; position:absolute; left:50%; bottom:-14%; width:75%; height:14%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(10,25,60,.28), transparent 70%);
    pointer-events:none;
  }
  .placed.drop-in{ animation:dropIn .55s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes dropIn{
    0%{ transform:translate(-50%,-50%) translateY(-80px) scale(.1); opacity:0; }
    60%{ transform:translate(-50%,-50%) translateY(10px) scale(1.18); opacity:1; }
    100%{ transform:translate(-50%,-50%) translateY(0) scale(1); }
  }
  .placed.wiggle .e{ animation:wiggle .5s ease; }
  @keyframes wiggle{
    0%,100%{ transform:rotate(0) scale(1); }
    25%{ transform:rotate(-16deg) scale(1.2); }
    75%{ transform:rotate(16deg) scale(1.2); }
  }
  .placed.dragging{ cursor:grabbing; z-index:25; }
  .placed.dragging .e{ animation:none; transform:scale(1.25) rotate(-6deg); }
  .placed.poof{ animation:poof .45s ease-in forwards; pointer-events:none; }
  @keyframes poof{
    40%{ transform:translate(-50%,-50%) scale(1.25); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1.7) rotate(25deg); opacity:0; }
  }

  /* ---------- shelf ---------- */
  .shelf-wrap{ padding:4px 12px calc(10px + env(safe-area-inset-bottom)); flex:0 0 auto; }
  .shelf{
    display:flex; gap:10px; overflow-x:auto; padding:10px 12px;
    border-radius:22px; background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px);
    scrollbar-width:thin;
  }
  .shelf-item{
    flex:0 0 auto; width:56px; height:56px;
    display:grid; place-items:center; font-size:1.9rem;
    background:linear-gradient(#fff,#eef2ff);
    border-radius:16px; border:3px solid #fff;
    box-shadow:0 4px 0 rgba(0,0,0,.2), 0 6px 14px rgba(0,0,0,.25);
    cursor:grab; touch-action:none; transition:transform .15s, opacity .15s;
    position:relative;
  }
  .shelf-item:hover{ transform:translateY(-5px) rotate(-5deg) scale(1.08); }
  .shelf-item.holding{ transform:scale(.85); opacity:.45; }
  .shelf-item::after{
    content:attr(data-name);
    position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    background:#101c3a; color:#fff; font-size:.65rem; font-weight:700;
    padding:2px 8px; border-radius:8px; opacity:0; pointer-events:none;
    transition:opacity .15s; white-space:nowrap;
  }
  .shelf-item:hover::after{ opacity:1; }

  /* ---------- ghost / sparks / snow ---------- */
  .ghost{
    position:fixed; z-index:60; transform:translate(-50%,-60%) scale(1.35);
    pointer-events:none; filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));
  }
  .ghost.return{
    transition:left .25s ease, top .25s ease, transform .25s ease;
    transform:translate(-50%,-60%) scale(.8);
  }
  .spark{
    position:fixed; z-index:55; pointer-events:none;
    transform:translate(-50%,-50%);
    animation:sparkFly .8s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(200deg); opacity:0; }
  }
  #snow{ position:fixed; inset:0; z-index:40; pointer-events:none; }

  @media (max-width: 700px){
    .toolbar{ gap:6px; }
    .toolbar button{ width:38px; height:38px; font-size:1.1rem; }
    .chip{ font-size:.78rem; padding:3px 10px; }
    .ribbon{ top:60px; font-size:1.05rem; padding:3px 14px 4px; }
    .moon{ top:19%; right:8%; }
    .hint{ font-size:.8rem; }
  }
</style>
</head>
<body>

<canvas id="snow"></canvas>

<header>
  <h1 id="title">Merry Christmas!</h1>
  <p class="sub">👇 Drag your holiday friends onto the card &amp; tap them for sounds &amp; magic! ✨</p>
</header>

<main class="card-frame">
  <div class="card" id="card">
    <div class="sky-decor" id="skyDecor">
      <div id="stars"></div>
      <div class="moon" id="moon" title="Boop the moon!"></div>
      <div class="sleigh"><span>🦌🦌🦌🎅</span></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>
      <div class="hill h3"></div>
      <div class="house">
        <div class="chimney">
          <div class="puff p1"></div>
          <div class="puff p2"></div>
          <div class="puff p3"></div>
        </div>
        <div class="roof"></div>
        <div class="body">
          <div class="win w1"></div>
          <div class="win w2"></div>
          <div class="door"></div>
        </div>
      </div>
    </div>

    <div class="ribbon">❄ Merry Christmas! ❄</div>
    <div class="chip">🧸 <b id="count">0 friends</b></div>

    <div class="toolbar">
      <button id="btnSound" class="on" title="Sound on / off" aria-label="Toggle sound">🔊</button>
      <button id="btnSing" title="Sing Jingle Bells!" aria-label="Sing Jingle Bells">🎶</button>
      <button id="btnBlizzard" title="Blizzard!" aria-label="Blizzard">❄️</button>
      <button id="btnSurprise" title="Surprise me!" aria-label="Surprise">🎲</button>
      <button id="btnClear" title="Clear the card" aria-label="Clear">🧹</button>
    </div>

    <div class="items" id="items"></div>
    <div class="hint" id="hint">👆 Drag a friend from the shelf onto the card!</div>
  </div>
</main>

<footer class="shelf-wrap">
  <div class="shelf" id="shelf"></div>
</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const card = $('#card'), itemsLayer = $('#items'), shelf = $('#shelf');
const countEl = $('#count'), hint = $('#hint'), skyDecor = $('#skyDecor');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ================= item catalogue ================= */
const ITEMS = [
  {e:'🎄', n:'Christmas Tree', s:4.6, snd:'chime'},
  {e:'⭐', n:'Shiny Star',     s:1.9, snd:'bell'},
  {e:'🎅', n:'Santa',          s:3.0, snd:'jingle'},
  {e:'⛄', n:'Snowman',        s:3.2, snd:'chime'},
  {e:'🦌', n:'Reindeer',       s:2.9, snd:'boing'},
  {e:'🎁', n:'Present',        s:2.5, snd:'pop'},
  {e:'🔔', n:'Jingle Bell',    s:2.2, snd:'bell'},
  {e:'🍪', n:'Cookie',         s:2.0, snd:'munch'},
  {e:'🍬', n:'Candy',          s:2.0, snd:'pop'},
  {e:'🧦', n:'Stocking',       s:2.2, snd:'squeak'},
  {e:'🛷', n:'Sled',           s:2.6, snd:'boing'},
  {e:'🐧', n:'Penguin',        s:2.4, snd:'boing'},
  {e:'🐻', n:'Teddy Bear',     s:2.6, snd:'squeak'},
  {e:'🎀', n:'Ribbon',         s:2.0, snd:'pop'},
  {e:'❄️', n:'Snowflake',      s:2.2, snd:'chime'},
  {e:'🍭', n:'Lollipop',       s:2.0, snd:'pop'},
  {e:'🥛', n:'Milk',           s:2.0, snd:'munch'},
  {e:'🕯️', n:'Candle',         s:2.2, snd:'chime'},
];
const byEmoji = Object.fromEntries(ITEMS.map(i => [i.e, i]));

/* ================= build shelf ================= */
ITEMS.forEach(it => {
  const b = document.createElement('button');
  b.className = 'shelf-item';
  b.dataset.emoji = it.e;
  b.dataset.name = it.n;
  b.title = it.n;
  b.textContent = it.e;
  shelf.appendChild(b);
});

/* ================= title letters ================= */
(() => {
  const h1 = $('#title'), txt = h1.textContent;
  h1.textContent = '';
  const colors = ['#ff6b6b','#ffd93d','#7bf1a8','#7cc4ff','#ffffff','#ff9f68'];
  [...txt].forEach((ch,i) => {
    const sp = document.createElement('span');
    sp.textContent = ch === ' ' ? '\u00A0' : ch;
    sp.style.color = colors[i % colors.length];
    sp.style.animationDelay = (i * 0.09) + 's';
    sp.style.textShadow = '0 3px 0 rgba(0,0,0,.25)';
    h1.appendChild(sp);
  });
})();

/* ================= stars ================= */
(() => {
  const starsEl = $('#stars');
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('span');
    const sz = 1 + Math.random() * 2.4;
    s.style.cssText =
      `left:${Math.random()*100}%;top:${Math.random()*55}%;width:${sz}px;height:${sz}px;` +
      `--tw:${(1.5+Math.random()*2.5).toFixed(2)}s;--twd:${(-Math.random()*3).toFixed(2)}s;`;
    starsEl.appendChild(s);
  }
})();

/* ================= audio engine ================= */
let ctx = null, master = null, muted = false;
function ac(){
  if (!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(o){
  if (muted) return;
  const c = ac(), t = c.currentTime + (o.t || 0);
  const os = c.createOscillator(), g = c.createGain();
  os.type = o.type || 'sine';
  os.frequency.setValueAtTime(o.f, t);
  if (o.slide) os.frequency.exponentialRampToValueAtTime(Math.max(30, o.slide), t + o.d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.v || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
  os.connect(g); g.connect(master);
  os.start(t); os.stop(t + o.d + 0.06);
}
function bell(f, t = 0, v = 0.2, d = 0.9){
  tone({f, t, d, v});
  tone({f: f * 2.756, t, d: d * 0.55, v: v * 0.35});
  tone({f: f * 5.4,   t, d: d * 0.28, v: v * 0.12});
}
function noise(t = 0, d = 0.12, v = 0.2, hp = 900){
  if (muted) return;
  const c = ac();
  const len = Math.max(1, (c.sampleRate * d) | 0);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = c.createGain(); g.gain.value = v;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(c.currentTime + t);
}
const SOUNDS = {
  pop(){ tone({f:520, d:.12, type:'triangle', v:.25, slide:180}); noise(0,.06,.12,800); },
  boing(){ tone({f:300, d:.4, type:'sawtooth', v:.16, slide:70}); tone({f:150, t:.02, d:.3, type:'sine', v:.2, slide:60}); },
  bell(){ bell(1568, 0, .22); bell(2093, .09, .15); },
  chime(){ bell(1046, 0, .18); bell(1318, .12, .15); bell(1568, .24, .12); },
  munch(){ noise(0,.08,.25,400); noise(.12,.08,.2,300); },
  jingle(){ bell(1200 + Math.random()*400, 0, .15); bell(1600 + Math.random()*400, .08, .12); bell(2000, .16, .1); },
  squeak(){ tone({f:700, d:.09, type:'triangle', v:.14, slide:1300}); tone({f:1300, t:.1, d:.09, type:'triangle', v:.12, slide:700}); },
};

/* ================= sparkle bursts ================= */
const SPARKS = ['✦','✧','❄','⭐','🌟'];
function burst(x, y, n = 12){
  for (let i = 0; i < n; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = SPARKS[(Math.random() * SPARKS.length) | 0];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.fontSize = (10 + Math.random() * 16) + 'px';
    const a = Math.random() * 6.28, d = 40 + Math.random() * 90;
    s.style.setProperty('--dx', (Math.cos(a) * d) + 'px');
    s.style.setProperty('--dy', (Math.sin(a) * d - 40) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}

/* ================= placing items ================= */
let count = 0;
const updateCount = () => { countEl.textContent = count + (count === 1 ? ' friend' : ' friends'); };

function placeItem(it, xPct, yPct){
  const el = document.createElement('div');
  el.className = 'placed drop-in';
  el.dataset.emoji = it.e;
  el.style.left = clamp(xPct, 3, 97) + '%';
  el.style.top = clamp(yPct, 14, 90) + '%';
  el.style.fontSize = it.s + 'rem';
  el.style.setProperty('--bd', (2.4 + Math.random() * 2.2).toFixed(2) + 's');
  el.style.setProperty('--bdl', (-Math.random() * 3).toFixed(2) + 's');
  const sp = document.createElement('span');
  sp.className = 'e';
  sp.textContent = it.e;
  el.appendChild(sp);
  el.addEventListener('animationend', ev => {
    if (ev.animationName === 'dropIn') el.classList.remove('drop-in');
  });
  itemsLayer.appendChild(el);
  count++; updateCount();
  hint.classList.add('gone');
  return el;
}

/* default friends already on the card */
[
  ['🎄', 14, 57], ['⭐', 14, 33], ['🎅', 32, 68], ['⛄', 50, 65],
  ['🦌', 63, 58], ['🎁', 25, 80], ['🧦', 43, 82], ['🍪', 66, 81],
  ['🎁', 83, 80], ['🐧', 90, 74],
].forEach(([e, x, y]) => placeItem(byEmoji[e], x, y));

/* ================= ghost drag from shelf (mouse + touch) ================= */
function inRect(x, y, r){ return x > r.left && x < r.right && y > r.top && y < r.bottom; }
function positionGhost(g, ev){ g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; }

shelf.addEventListener('pointerdown', e => {
  const btn = e.target.closest('.shelf-item');
  if (!btn) return;
  e.preventDefault();
  ac();
  const it = byEmoji[btn.dataset.emoji];
  const g = document.createElement('div');
  g.className = 'ghost';
  g.textContent = it.e;
  g.style.fontSize = (it.s * 1.1) + 'rem';
  positionGhost(g, e);
  document.body.appendChild(g);
  btn.classList.add('holding');

  const move = ev => {
    positionGhost(g, ev);
    card.classList.toggle('dropzone', inRect(ev.clientX, ev.clientY, card.getBoundingClientRect()));
  };
  const up = ev => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    card.classList.remove('dropzone');
    btn.classList.remove('holding');
    const r = card.getBoundingClientRect();
    if (inRect(ev.clientX, ev.clientY, r)){
      const x = (ev.clientX - r.left) / r.width * 100;
      const y = (ev.clientY - r.top) / r.height * 100;
      placeItem(it, x, y);
      g.remove();
      SOUNDS.pop();
      bell(1318, .1, .12, .5);
      burst(ev.clientX, ev.clientY, 14);
    } else {
      const br = btn.getBoundingClientRect();
      g.classList.add('return');
      g.style.left = (br.left + br.width / 2) + 'px';
      g.style.top = (br.top + br.height / 2) + 'px';
      setTimeout(() => g.remove(), 260);
      tone({f:300, d:.15, type:'triangle', v:.1, slide:180});
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

/* ================= placed items: tap = sound, drag = move ================= */
itemsLayer.addEventListener('pointerdown', e => {
  const el = e.target.closest('.placed');
  if (!el) return;
  e.preventDefault();
  ac();
  const sx = e.clientX, sy = e.clientY;
  let dragging = false;

  const move = ev => {
    if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 7){
      dragging = true;
      el.classList.add('dragging');
    }
    if (dragging){
      const r = card.getBoundingClientRect();
      el.style.left = clamp((ev.clientX - r.left) / r.width * 100, 3, 97) + '%';
      el.style.top = clamp((ev.clientY - r.top) / r.height * 100, 14, 90) + '%';
    }
  };
  const up = ev => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    const it = byEmoji[el.dataset.emoji] || ITEMS[0];
    if (dragging){
      el.classList.remove('dragging');
      el.classList.add('drop-in');
      el.addEventListener('animationend', function h(){ el.classList.remove('drop-in'); el.removeEventListener('animationend', h); });
      SOUNDS.pop();
      burst(ev.clientX, ev.clientY, 8);
    } else {
      el.classList.remove('wiggle');
      void el.offsetWidth;
      el.classList.add('wiggle');
      setTimeout(() => el.classList.remove('wiggle'), 550);
      (SOUNDS[it.snd] || SOUNDS.pop)();
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 6);
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

const NOTE = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, C5:523.25, E5:659.25, G5:784.00 };
const MELODY = [
  ['E4',.75],['E4',.25],['E4',1],
  ['E4',.75],['E4',.25],['E4',1],
  ['E4',.75],['E4',.25],['E4',1],['G4',.5],['C4',.5],['D4',1],['E4',2],
  ['F4',.75],['F4',.25],['F4',.75],['F4',.25],['F4',1],['E4',.5],['E4',.5],['E4',1],['E4',.5],['E4',.5],
  ['E4',.75],['E4',.25],['E4',1],['D4',.5],['D4',.5],['E4',.5],['D4',.5],['G4',2],

let blizzardUntil = 0;

/* ================= snowfall ================= */
const snowC = $('#snow'), sc = snowC.getContext('2d');
let flakes = [], sprite, W = 0, H = 0;

function makeSprite(){
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const g = s.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  rg.addColorStop(0, 'rgba(255,255,255,.95)');
  rg.addColorStop(0.5, 'rgba(255,255,255,.55)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(32, 32, 30, 0, 7);
  g.fill();
  sprite = s;
}
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  snowC.width = W * dpr;
  snowC.height = H * dpr;
  snowC.style.width = W + 'px';
  snowC.style.height = H + 'px';
  sc.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function newFlake(top){
  const depth = Math.random();
  return {
    x: Math.random() * W,
    y: top ? -12 : Math.random() * H,
    r: 1.5 + depth * 3.5,
    sp: 0.4 + depth * 1.3,
    ph: Math.random() * 6.28,
    sw: 0.3 + depth * 0.9,
    o: 0.35 + depth * 0.6,
  };
}
function targetCount(){
  const base = Math.min(200, (W * H) / 9000);
  return performance.now() < blizzardUntil ? base * 2.6 : base;
}
function tick(){
  const target = targetCount();
  while (flakes.length < target) flakes.push(newFlake(flakes.length % 3 === 0));
  if (flakes.length > target) flakes.length = Math.max(Math.floor(target), flakes.length - 4);
  sc.clearRect(0, 0, W, H);
  const blizz = performance.now() < blizzardUntil;
  for (const f of flakes){
    f.y += f.sp * (blizz ? 2.1 : 1);
    f.x += Math.sin(f.ph + f.y * 0.008) * f.sw * 0.6 + (blizz ? 1.6 : 0);
    if (f.y > H + 14) Object.assign(f, newFlake(true));
    if (f.x > W + 14) f.x = -14;
    if (f.x < -14) f.x = W + 14;
    sc.globalAlpha = f.o;
    const d = f.r * 4;
    sc.drawImage(sprite, f.x - d / 2, f.y - d / 2, d, d);
  }
  sc.globalAlpha = 1;
  requestAnimationFrame(tick);
}
makeSprite();
resize();
window.addEventListener('resize', resize);
tick();
