<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength — Podcast Home</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%238b5cf6'/><path d='M6 10v4M10 7v10M14 9v6M18 8v8' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080d;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --text:#f4f4f8;
  --muted:#9a9aad;
  --accent1:#8b5cf6;
  --accent2:#22d3ee;
  --grad:linear-gradient(135deg,var(--accent1),var(--accent2));
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(620px 420px at 12% -5%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(720px 520px at 96% 12%, rgba(34,211,238,.13), transparent 60%),
    radial-gradient(900px 640px at 50% 115%, rgba(139,92,246,.10), transparent 60%);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent1);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
kbd{
  font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);
  background:rgba(255,255,255,.06);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:6px;padding:2px 7px;
}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}

.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:22px 16px;display:flex;flex-direction:column;gap:24px;
  border-right:1px solid var(--border);
  background:rgba(10,10,16,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px}
.brand-logo{
  width:38px;height:38px;border-radius:12px;background:var(--grad);
  display:grid;place-items:center;color:#0a0a12;flex-shrink:0;
  box-shadow:0 6px 22px rgba(139,92,246,.45);
}
.brand-logo svg{width:22px;height:22px}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand-tag{font-size:11px;color:var(--muted);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;color:var(--muted);
  font-weight:600;font-size:14.5px;transition:background .15s,color .15s;
}
.nav-item:hover{color:var(--text);background:var(--panel)}
.nav-item.active{color:var(--text);background:var(--panel2)}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--grad);color:#0a0a12;
  font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;
}
.side-title{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:0 12px;margin-bottom:10px;
}
.show-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;
  cursor:pointer;transition:background .15s;
}
.show-item:hover{background:var(--panel)}
.show-dot{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
}
.show-meta{min-width:0;flex:1}
.show-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-host{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-footer{
  margin-top:auto;font-size:12px;color:var(--muted);line-height:2;
  padding:14px 12px 4px;border-top:1px solid var(--border);
}

main{padding:10px 34px 150px;max-width:1240px;width:100%;margin:0 auto;min-width:0}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:16px 0 14px;margin-bottom:10px;
  background:linear-gradient(var(--bg) 55%, rgba(8,8,13,0));
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;display:none;place-items:center;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);flex-shrink:0;
}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.search{
  flex:1;max-width:560px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:0 14px;height:46px;transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:14.5px;height:100%}
.search input::placeholder{color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sub-pill{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;
  padding:10px 15px;border:1px solid var(--border);border-radius:999px;background:var(--panel);white-space:nowrap;
}
.sub-pill svg{width:16px;height:16px;color:var(--accent2)}
.sub-pill b{color:var(--text)}

.hero{
  display:grid;grid-template-columns:240px minmax(0,1fr);gap:30px;align-items:center;
  padding:28px;border:1px solid var(--border);border-radius:24px;margin-bottom:30px;
  background:
    linear-gradient(150deg, rgba(139,92,246,.14), rgba(34,211,238,.05) 55%, transparent 80%),
    var(--panel);
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 14px);
}
.hero-cover{position:relative;width:240px;height:240px;flex-shrink:0;z-index:0}
.hero-cover::before{
  content:'';position:absolute;inset:-25%;z-index:-1;filter:blur(24px);
  background:radial-gradient(closest-side, rgba(139,92,246,.4), transparent 72%);
}
.hero-cover .cover{width:100%;height:100%}
.hero-body{position:relative;z-index:1;min-width:0}
.hero-badge{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;background:var(--grad);color:#0a0a12;
  padding:6px 13px;border-radius:999px;
}
.hero-badge svg{width:14px;height:14px}
.hero h1{font-size:clamp(24px,3.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:16px 0 10px}
.hero-desc{color:var(--muted);font-size:15px;line-height:1.65;max-width:58ch;margin-bottom:18px}
.hero-meta{display:flex;flex-wrap:wrap;gap:9px 20px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:24px}
.hm{display:inline-flex;align-items:center;gap:8px}
.hm .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn-play{
  width:64px;height:64px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;color:#0a0a12;flex-shrink:0;
  box-shadow:0 10px 34px rgba(139,92,246,.5);
  transition:transform .15s,box-shadow .15s;
}
.btn-play:hover{transform:scale(1.07);box-shadow:0 12px 42px rgba(139,92,246,.65)}
.btn-play:active{transform:scale(.97)}
.btn-play svg{width:27px;height:27px}
.btn-sub{
  display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 24px;
  border-radius:999px;border:1px solid var(--border);background:var(--panel);
  font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s,color .15s;
}
.btn-sub:hover{background:var(--panel2);border-color:rgba(255,255,255,.22)}
.btn-sub svg{width:17px;height:17px}
.btn-sub.on{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.45);color:#67e8f9}

.list-head{display:flex;align-items:center;gap:14px;margin:4px 0 16px;flex-wrap:wrap}
.list-head h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.count{color:var(--muted);font-size:13px;font-weight:500}
.chips{display:flex;gap:8px;margin-left:auto}
.chip{
  padding:8px 15px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s;
}
.chip:hover{color:var(--text);background:var(--panel)}
.chip.active{background:var(--grad);color:#0b0b12;font-weight:700;border-color:transparent}
.head-tools{display:flex;align-items:center;gap:10px}
.shuffle-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);display:grid;place-items:center;transition:all .15s;
}
.shuffle-btn:hover{color:var(--text);background:var(--panel2)}
.shuffle-btn svg{width:17px;height:17px}
select#sort{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;outline:none;cursor:pointer;
}
select#sort option{background:#14141f;color:var(--text)}

.episodes{display:flex;flex-direction:column;gap:6px}
.ep{
  display:grid;grid-template-columns:64px minmax(0,1fr) 210px 148px 40px;
  gap:16px;align-items:center;padding:12px 14px;border-radius:16px;
  border:1px solid transparent;cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s;
}
.ep:hover{background:var(--panel);border-color:var(--border);transform:translateY(-1px)}
.ep.playing{background:rgba(139,92,246,.10);border-color:rgba(139,92,246,.38)}
.ep-cover{position:relative;width:64px;height:64px;flex-shrink:0}
.ep-play{
  position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;
  background:rgba(8,8,13,.5);opacity:0;transition:opacity .15s;
}
.ep:hover .ep-play{opacity:1}
.ep-play svg{width:26px;height:26px;color:#fff}
.ep-eq{
  position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;
  padding-bottom:17px;border-radius:14px;background:rgba(8,8,13,.55);
}
.ep.playing .ep-eq{display:flex}
.ep.playing .ep-play{display:none}
.ep-eq span{width:3px;height:22px;border-radius:2px;background:var(--accent2);transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.ep-eq span:nth-child(2){animation-delay:.25s}
.ep-eq span:nth-child(3){animation-delay:.5s}
.ep-eq span:nth-child(4){animation-delay:.12s}
.ep:not(.live) .ep-eq span{animation-play-state:paused;transform:scaleY(.3)}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.ep-info{min-width:0}
.ep-title{
  font-size:15px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tbadge{
  display:inline-flex;align-items:center;gap:4px;margin-left:10px;padding:3px 9px;
  border-radius:999px;background:rgba(251,146,60,.14);color:#fdba74;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;vertical-align:1px;
}
.tbadge svg{width:11px;height:11px}
.ep-sub{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden}
.ep-sub .ep-show{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ep-sub .sep{opacity:.5}
.ep-wave{width:100%;height:40px;display:block;cursor:pointer}
.ep-meta{text-align:right;font-variant-numeric:tabular-nums}
.ep-meta .dur{font-size:13.5px;font-weight:600}
.ep-meta .meta2{color:var(--muted);font-size:12px;margin-top:3px}
.sub-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--border);color:var(--muted);background:var(--panel);
  transition:all .15s;flex-shrink:0;
}
.sub-btn:hover{color:var(--text);border-color:rgba(255,255,255,.28);transform:scale(1.06)}
.sub-btn.on{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.5);color:#67e8f9}
.sub-btn svg{width:16px;height:16px}

.cover{
  position:relative;display:grid;place-items:center;overflow:hidden;border-radius:14px;
  color:rgba(255,255,255,.94);font-weight:800;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.cover::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, transparent 2px 12px);
}
.cover::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 95% at 18% 8%, rgba(255,255,255,.28), transparent 55%);
}
.cover span{position:relative;z-index:1;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.ep-cover .cover{width:100%;height:100%;font-size:19px}
.player-cover .cover{width:100%;height:100%;font-size:15px}
.hero-cover .cover{width:100%;height:100%;font-size:64px}

.empty{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:70px 20px;text-align:center;color:var(--muted);
}
.empty-icon{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);margin-bottom:8px;
}
.empty-icon svg{width:28px;height:28px}
.empty h3{color:var(--text);font-size:18px;font-weight:700}
.empty p{font-size:14px;max-width:38ch;line-height:1.6}
.btn-ghost{
  margin-top:12px;padding:10px 20px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel);font-weight:600;font-size:13.5px;transition:all .15s;
}
.btn-ghost:hover{background:var(--panel2);color:var(--text)}

.player{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:minmax(220px,1fr) minmax(320px,660px) minmax(170px,1fr);
  align-items:center;gap:22px;padding:14px 26px;
  background:rgba(12,12,20,.85);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-top:1px solid var(--border);
  box-shadow:0 -18px 50px rgba(0,0,0,.45);
}
.player-left{display:flex;align-items:center;gap:14px;min-width:0}
.player-cover{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;background:var(--panel2);color:var(--muted);
}
.player-cover svg{width:22px;height:22px}
.player-cover .cover{width:100%;height:100%}
.player-info{min-width:0}
.player-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-show{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;align-items:flex-end;gap:3px;height:24px;margin-left:6px}
.eq span{width:3.5px;height:100%;border-radius:2px;background:var(--grad);transform-origin:bottom;transform:scaleY(.15);transition:transform .08s linear}
.player-center{display:flex;flex-direction:column;gap:9px;min-width:0}
.transport{display:flex;align-items:center;justify-content:center;gap:18px}
.t-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:all .15s;
}
.t-btn:hover{color:var(--text);background:var(--panel2)}
.t-btn svg{width:20px;height:20px}
.t-play{
  width:52px;height:52px;border-radius:50%;background:var(--grad);color:#0a0a12;
  display:grid;place-items:center;box-shadow:0 6px 24px rgba(139,92,246,.5);
  transition:transform .15s,box-shadow .15s;
}
.t-play:hover{transform:scale(1.07);box-shadow:0 8px 30px rgba(139,92,246,.65)}
.t-play:active{transform:scale(.96)}
.t-play svg{width:23px;height:23px}
.seek-row{display:flex;align-items:center;gap:12px}
.seek-row span{
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:42px;text-align:center;
}
#seekWave{flex:1;height:38px;display:block;cursor:pointer;min-width:0}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.vol-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);transition:all .15s;flex-shrink:0;
}
.vol-btn:hover{color:var(--text);background:var(--panel2)}
.vol-btn svg{width:19px;height:19px}
#vol{width:110px;accent-color:var(--accent1);cursor:pointer;height:4px}

.toast{
  position:fixed;left:50%;bottom:112px;transform:translate(-50%,16px);
  background:rgba(20,20,32,.94);border:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;z-index:100;white-space:nowrap;
  box-shadow:0 14px 44px rgba(0,0,0,.55);
  transition:opacity .3s,transform .3s cubic-bezier(.2,.9,.3,1.3);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.backdrop{
  position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.backdrop.show{opacity:1;pointer-events:auto}

@media(max-width:1100px){
  .ep{grid-template-columns:64px minmax(0,1fr) 150px 40px}
  .ep-meta{display:none}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:288px;z-index:60;
    transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
    background:rgba(10,10,16,.98);
  }
  .sidebar.open{transform:none}
  .icon-btn{display:grid}
  .ep{grid-template-columns:56px minmax(0,1fr) 40px}
  .ep-wave{display:none}
  .ep-cover{width:56px;height:56px}
  .hero{grid-template-columns:1fr;gap:22px;padding:22px}
  .hero-cover{width:100%;height:210px}
  main{padding:8px 16px 160px}
}
@media(max-width:760px){
  .player{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px}
  .player-left{width:100%}
  .player-center{width:100%}
  .player-right{display:none}
  .eq{display:none}
  .sub-pill span.lbl{display:none}
  .search kbd{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
      </div>
      <div>
        <div class="brand-name">Wavelength</div>
        <div class="brand-tag">Your daily listening</div>
      </div>
    </div>
    <nav class="nav" aria-label="Primary">
      <button class="nav-item active" id="navHome">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </button>
      <button class="nav-item" id="navSubs">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7c0-4.97-4.03-9-9-9z"/></svg>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(sec).padStart(2,'0')}

function timeAgo(dstr){
  const d=new Date(dstr+'T00:00:00'),now=new Date();
  const days=Math.floor((now-d)/86400000);
  if(days<=0)return'Today';
  if(days===1)return'Yesterday';
  if(days<7)return days+' days ago';
  if(days<30)return Math.floor(days/7)+'w ago';

}

const waveCache=new Map();
function waveFor(id,n){
  const key=id+'-'+n;
  if(waveCache.has(key))return waveCache.get(key);
  const r=mulberry32(id*7919+101);
  const arr=[];let v=0.45;
  for(let i=0;i<n;i++){
    v+=(r()-0.5)*0.4;v=Math.min(1,Math.max(0.15,v));
    const env=0.55+0.45*Math.sin(i*0.28+id*1.7);
    const spike=r()>0.92?1.25:1;
    arr.push(Math.min(1,Math.max(0.08,v*env*spike)));
  }
  waveCache.set(key,arr);
  return arr;
}
function barRect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  else ctx.fillRect(x,y,w,h);
}
function paintWave(canvas,data,progress){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const W=Math.round(w*dpr),H=Math.round(h*dpr);
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const n=data.length,gap=Math.max(1.5,w*0.008),bw=(w-gap*(n-1))/n;
  const px=progress*w;
  const grad=ctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#8b5cf6');grad.addColorStop(1,'#22d3ee');
  for(let i=0;i<n;i++){
    const x=i*(bw+gap);
    const bh=Math.max(3,data[i]*h);
    const y=(h-bh)/2;
    ctx.fillStyle=(x+bw/2)<=px?grad:'rgba(255,255,255,.15)';
    barRect(ctx,x,y,bw,bh,Math.min(2,bw/2));
  }
}
function drawSeekWave(){
  if(!player.ep)return;
  const dpr=window.devicePixelRatio||1;
  const w=seekCanvas.clientWidth,h=seekCanvas.clientHeight;
  if(!w||!h)return;
  const W=Math.round(w*dpr),H=Math.round(h*dpr);
  if(seekCanvas.width!==W||seekCanvas.height!==H){seekCanvas.width=W;seekCanvas.height=H}
  const ctx=seekCanvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const data=waveFor(player.ep.id,72);
  const n=data.length,gap=2,bw=(w-gap*(n-1))/n;
  const px=(player.pos/player.ep.duration)*w;
  const grad=ctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#8b5cf6');grad.addColorStop(1,'#22d3ee');
  for(let i=0;i<n;i++){
    const x=i*(bw+gap);
    const bh=Math.max(3,data[i]*h);
    const y=(h-bh)/2;
    ctx.fillStyle=(x+bw/2)<=px?grad:'rgba(255,255,255,.14)';
    barRect(ctx,x,y,bw,bh,Math.min(2,bw/2));
  }
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillRect(px-0.75,0,1.5,h);
}

const AudioEngine={
  ctx:null,master:null,analyser:null,nodes:null,vol:0.8,
  ensure(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.master.gain.value=this.vol;
    this.analyser=this.ctx.createAnalyser();
    this.analyser.fftSize=256;
    this.master.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
  },
  build(ep){
    this.stopNodes();
    const ctx=this.ctx;
    const r=mulberry32((ep.id*2654435761)>>>0||1);
    const base=110*Math.pow(2,((ep.id*7)%12)/12);
    const scale=[0,3,7,10,12,15];
    const g=ctx.createGain();g.gain.value=0;
    const filter=ctx.createBiquadFilter();
    filter.type='lowpass';filter.frequency.value=500+r()*900;filter.Q.value=0.7;
    g.connect(filter);filter.connect(this.master);
    const oscs=[];
    for(let i=0;i<4;i++){
      const o=ctx.createOscillator();
      o.type=i<2?'sine':'triangle';
      const step=scale[Math.floor(r()*scale.length)];
      o.frequency.value=base*Math.pow(2,step/12)*(i%2?2:1);
      const lfo=ctx.createOscillator();lfo.frequency.value=0.05+r()*0.15;
      const lfoGain=ctx.createGain();lfoGain.gain.value=o.frequency.value*0.004;
      lfo.connect(lfoGain);lfoGain.connect(o.frequency);
      const og=ctx.createGain();og.gain.value=0.12/(i+1);
      const aLfo=ctx.createOscillator();aLfo.frequency.value=0.08+r()*0.2;
      const aLfoG=ctx.createGain();aLfoG.gain.value=og.gain.value*0.6;
      aLfo.connect(aLfoG);aLfoG.connect(og.gain);
      o.connect(og);og.connect(g);
      o.start();aLfo.start();lfo.start();
      oscs.push(o,aLfo,lfo);
    }
    const pulse=ctx.createOscillator();pulse.frequency.value=1.05;
    const pulseG=ctx.createGain();pulseG.gain.value=0.015;
    pulse.connect(pulseG);pulseG.connect(g.gain);
    pulse.start();oscs.push(pulse);
    g.gain.setTargetAtTime(0.9,ctx.currentTime,0.4);
    this.nodes={oscs,g};
  },
  stopNodes(){
    if(!this.nodes||!this.ctx)return;
    const t=this.ctx.currentTime;
    this.nodes.g.gain.setTargetAtTime(0.0001,t,0.08);
    this.nodes.oscs.forEach(o=>{try{o.stop(t+0.45)}catch(e){}});
    this.nodes=null;
  },
  setVol(v){
    this.vol=v;
    if(this.master&&this.ctx)this.master.gain.setTargetAtTime(v,this.ctx.currentTime,0.05);
  }
};

function playAudio(){

function selectEpisode(ep,startAt=0){

}
function seekTo(ep,ratio){
  ratio=Math.min(1,Math.max(0,ratio));

function nextEpisode(dir=1){
  const list=visibleEpisodes();
  const src=list.length?list:EPISODES;
  let i=src.findIndex(e=>e.id===player.ep?player.ep.id:-1);
  if(i===-1)i=0;
  selectEpisode(src[(i+dir+src.length)%src.length]);
}

function visibleEpisodes(){
  const q=state.query.trim().toLowerCase();
  const list=EPISODES.filter(e=>{
    const s=show(e.show);
    if(state.chip==='subs'&&!state.subs.has(e.show))return false;
    if(q){
      const hay=(e.title+' '+e.desc+' '+s.name+' '+s.host+' '+e.tags.join(' ')).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const sorters={
    new:(a,b)=>b.date.localeCompare(a.date),
    old:(a,b)=>a.date.localeCompare(b.date),
    long:(a,b)=>b.duration-a.duration,
    pop:(a,b)=>b.plays-a.plays
  };
  return list.sort(sorters[state.sort]);
}

function listTitle(){
  if(state.query.trim())return'Results for “'+state.query.trim()+'”';
  return state.chip==='subs'?'Subscribed':'All Episodes';
}
function rowHTML(ep){
  const s=show(ep.show);
  const on=state.subs.has(ep.show);
  return '<div class="ep" data-id="'+ep.id+'">'
    +'<div class="ep-cover">'+coverHTML(s)
      +'<div class="ep-play">'+ICONS.play+'</div>'
      +'<div class="ep-eq"></div>'
    +'</div>'
    +'<div class="ep-info">'
      +'<div class="ep-title">'+ep.title+(ep.trending?'<span class="tbadge">'+ICONS.flame+'Trending</span>':'')+'</div>'
      +'<div class="ep-sub"><span class="ep-show" style="color:'+s.c[0]+'">'+s.name+'</span><span class="sep">•</span><span>'+s.host+'</span></div>'
    +'</div>'
    +'<canvas class="ep-wave" data-wave="'+ep.id+'" aria-label="Waveform for '+ep.title+'"></canvas>'
    +'<div class="ep-meta"><div class="dur">'+fmt(ep.duration)+'</div><div class="meta2">'+timeAgo(ep.date)+' · '+fmtPlays(ep.plays)+' plays</div></div>'
    +'<button class="sub-btn'+(on?' on':'')+'" data-sub="'+ep.show+'" aria-label="'+(on?'Unsubscribe from':'Subscribe to')+s.name+'">'+(on?ICONS.check:ICONS.plus)+'</button>'
  +'</div>';
}
function renderList(){
  const list=visibleEpisodes();
  $('#listTitle').textContent=listTitle();
  $('#listCount').textContent=list.length+(list.length===1?' episode':' episodes');
  episodeList.innerHTML=list.map(rowHTML).join('');
  emptyEl.classList.toggle('hidden',list.length>0);
  if(!list.length){
    $('#emptyMsg').textContent=state.query.trim()
      ?'Nothing matches “'+state.query.trim()+'”. Try a different keyword or clear your filters.'
      :(state.chip==='subs'?'You haven’t subscribed to any shows yet. Tap the + on a show to follow it.':'No episodes found.');
  }
  rowCanvases.clear();
  list.forEach(ep=>{
    const c=episodeList.querySelector('canvas[data-wave="'+ep.id+'"]');
    if(c){
      rowCanvases.set(ep.id,c);
      paintWave(c,waveFor(ep.id,48),player.ep&&player.ep.id===ep.id?player.pos/ep.duration:0);
    }
  });
  syncUI();
}
function renderHero(){
  const ep=FEATURED,s=show(ep.show);
  const on=state.subs.has(ep.show);
  heroEl.innerHTML=
    '<div class="hero-cover">'+coverHTML(s)+'</div>'
    +'<div class="hero-body">'
      +'<div class="hero-badge">'+ICONS.flame+'Featured episode</div>'
      +'<h1>'+ep.title+'</h1>'
      +'<p class="hero-desc">'+ep.desc+'</p>'
      +'<div class="hero-meta">'
        +'<span class="hm"><span class="dot" style="background:linear-gradient(135deg,'+s.c[0]+','+s.c[1]+')"></span><b style="color:'+s.c[0]+'">'+s.name+'</b>&nbsp;· '+s.host+'</span>'
        +'<span class="hm">'+timeAgo(ep.date)+'</span>'
        +'<span class="hm">'+fmt(ep.duration)+'</span>'
        +'<span class="hm">'+fmtPlays(ep.plays)+' plays</span>'
      +'</div>'
      +'<div class="hero-actions">'
        +'<button class="btn-play" id="heroPlay" aria-label="Play featured episode">'+ICONS.play+'</button>'
        +'<button class="btn-sub'+(on?' on':'')+'" id="heroSub">'+(on?ICONS.check:ICONS.plus)+'<span>'+(on?'Subscribed':'Subscribe')+'</span></button>'
      +'</div>'
    +'</div>';
}
function renderShows(){
  showListEl.innerHTML=SHOWS.map(s=>{
    const on=state.subs.has(s.id);
    return '<div class="show-item" data-show="'+s.id+'">'
      +'<div class="show-dot" style="background:linear-gradient(135deg,'+s.c[0]+','+s.c[1]+')">'+s.initials+'</div>'
      +'<div class="show-meta"><div class="show-name">'+s.name+'</div><div class="show-host">'+s.host+'</div></div>'
      +'<button class="sub-btn'+(on?' on':'')+'" data-sub="'+s.id+'" aria-label="'+(on?'Unsubscribe from':'Subscribe to')+s.name+'">'+(on?ICONS.check:ICONS.plus)+'</button>'
    +'</div>';
  }).join('');
}
function updateSubCount(){
  subCountEl.textContent=state.subs.size;
  navSubBadge.textContent=state.subs.size;
  navSubBadge.style.display=state.subs.size?'inline-block':'none';
}
function syncUI(){
  if(player.ep){
    const s=show(player.ep.show);
    pCover.innerHTML=coverHTML(s);
    pTitle.textContent=player.ep.title;
    pShow.textContent=s.name+' · '+s.host;
    tDur.textContent=fmt(player.ep.duration);
  }else{
    pCover.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7c0-4.97-4.03-9-9-9z"/></svg>';
    pTitle.textContent='Nothing playing';
    pShow.textContent='Pick an episode to start listening';
    tDur.textContent='0:00';
  }
  playBtn.innerHTML=player.playing?ICONS.pause:ICONS.play;
  playBtn.setAttribute('aria-label',player.playing?'Pause':'Play');
  const hp=$('#heroPlay');
  if(hp){
    const isCur=player.ep&&player.ep.id===FEATURED.id;
    hp.innerHTML=isCur&&player.playing?ICONS.pause:ICONS.play;
  }
  $$('.ep').forEach(r=>{
    const id=+r.dataset.id;
    const isCur=player.ep&&player.ep.id===id;
    r.classList.toggle('playing',isCur);
    r.classList.toggle('live',isCur&&player.playing);
    const eq=r.querySelector('.ep-eq');
    if(eq)eq.innerHTML=isCur?'<span></span><span></span><span></span><span></span>':'';
  });
}
function toggleSub(id){
  const s=show(id);
  if(state.subs.has(id)){state.subs.delete(id);toast('Unsubscribed from '+s.name)}
  else{state.subs.add(id);toast('Subscribed to '+s.name)}
  try{localStorage.setItem('wl.subs',JSON.stringify([...state.subs]))}catch(e){}
  renderShows();renderHero();renderList();updateSubCount();
}
let toastTimer;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600);
}
function setChip(c){
  state.chip=c;
  $$('.chip').forEach(el=>el.classList.toggle('active',el.dataset.chip===c));
}
function setNav(name){
  $('#navHome').classList.toggle('active',name==='home');
  $('#navSubs').classList.toggle('active',name==='subs');
}
function closeSidebar(){sidebar.classList.remove('open');backdrop.classList.remove('show')}

heroEl.addEventListener('click',e=>{
  if(e.target.closest('#heroPlay')){
    if(player.ep&&player.ep.id===FEATURED.id)toggleAudio();
    else selectEpisode(FEATURED);
  }
  if(e.target.closest('#heroSub'))toggleSub(FEATURED.show);
});
episodeList.addEventListener('click',e=>{
  const sub=e.target.closest('[data-sub]');
  if(sub){e.stopPropagation();toggleSub(sub.dataset.sub);return}
  if(e.target.closest('canvas.ep-wave'))return;
  const row=e.target.closest('.ep');
  if(!row)return;
  const ep=EPISODES.find(x=>x.id===+row.dataset.id);
  if(player.ep&&player.ep.id===ep.id)toggleAudio();
  else selectEpisode(ep);
});
episodeList.addEventListener('pointerdown',e=>{
  const wv=e.target.closest('canvas.ep-wave');
  if(!wv)return;
  e.stopPropagation();
  const ep=EPISODES.find(x=>x.id===+wv.dataset.wave);
  const r=wv.getBoundingClientRect();
  seekTo(ep,(e.clientX-r.left)/r.width);
});
showListEl.addEventListener('click',e=>{
  const sub=e.target.closest('[data-sub]');
  if(sub){e.stopPropagation();toggleSub(sub.dataset.sub);return}
  const item=e.target.closest('.show-item');
  if(!item)return;
  const s=show(item.dataset.show);
  state.query=s.name;searchEl.value=s.name;
  setChip('all');renderList();closeSidebar();
  $('#listTitle').scrollIntoView({behavior:'smooth',block:'start'});
});
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(!c)return;
  setChip(c.dataset.chip);renderList();
});
searchEl.addEventListener('input',()=>{state.query=searchEl.value;renderList()});
sortEl.addEventListener('change',()=>{state.sort=sortEl.value;renderList()});
$('#shuffleBtn').addEventListener('click',()=>{
  const list=visibleEpisodes();
  const src=list.length?list:EPISODES;
  selectEpisode(src[Math.floor(Math.random()*src.length)]);
});
$('#clearBtn').addEventListener('click',()=>{
  state.query='';searchEl.value='';setChip('all');renderList();
});
$('#navHome').addEventListener('click',()=>{
  state.query='';searchEl.value='';setChip('all');setNav('home');
  renderList();closeSidebar();
  window.scrollTo({top:0,behavior:'smooth'});
});
$('#navSubs').addEventListener('click',()=>{
  setChip('subs');setNav('subs');renderList();closeSidebar();
  $('#listTitle').scrollIntoView({behavior:'smooth',block:'start'});
});
$('#menuBtn').addEventListener('click',()=>{
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show',sidebar.classList.contains('open'));
});
backdrop.addEventListener('click',closeSidebar);

playBtn.addEventListener('click',()=>{
  if(!player.ep)selectEpisode(FEATURED);
  else toggleAudio();
});
prevBtn.addEventListener('click',()=>{
  if(!player.ep){selectEpisode(FEATURED);return}
  nextEpisode(-1);
});
nextBtn.addEventListener('click',()=>nextEpisode(1));

let seeking=false;
function seekFromEvent(e){
  if(!player.ep)return;
  const r=seekCanvas.getBoundingClientRect();
  const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  player.pos=ratio*player.ep.duration;
}
seekCanvas.addEventListener('pointerdown',e=>{
  if(!player.ep)return;
  seeking=true;
  seekCanvas.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
seekCanvas.addEventListener('pointermove',e=>{if(seeking)seekFromEvent(e)});
seekCanvas.addEventListener('pointerup',()=>{seeking=false});
seekCanvas.addEventListener('pointercancel',()=>{seeking=false});

let muted=false,prevVol=80;
volEl.addEventListener('input',()=>AudioEngine.setVol(volEl.value/100));
volBtn.addEventListener('click',()=>{
  muted=!muted;
  if(muted){prevVol=volEl.value;volEl.value=0}
  else volEl.value=prevVol;
  AudioEngine.setVol(volEl.value/100);
  volBtn.innerHTML=muted?ICONS.mute:ICONS.vol;
  volBtn.setAttribute('aria-label',muted?'Unmute':'Mute');
});

document.addEventListener('keydown',e=>{
  const tag=document.activeElement?document.activeElement.tagName:'';
  const inText=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='/'&&!inText){e.preventDefault();searchEl.focus();return}
  if(document.activeElement===searchEl){
    if(e.key==='Escape'){searchEl.value='';state.query='';renderList();searchEl.blur()}
    return;
  }
  if(inText)return;
  if(e.code==='Space'){e.preventDefault();player.ep?toggleAudio():selectEpisode(FEATURED);return}
  if(player.ep){
    if(e.key==='ArrowRight'){e.preventDefault();player.pos=Math.min(player.ep.duration,player.pos+10)}
    if(e.key==='ArrowLeft'){e.preventDefault();player.pos=Math.max(0,player.pos-10)}
  }
});

let rz;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{renderList();drawSeekWave()},150);
});

function updateEQ(){
  if(AudioEngine.analyser&&player.playing){
    AudioEngine.analyser.getByteFrequencyData(freqData);
    for(let i=0;i<5;i++){
      const a=freqData[2+i*3]||0,b=freqData[3+i*3]||0,c=freqData[4+i*3]||0;
      const v=(a+b+c)/(3*255);
      eqVals[i]=Math.max(v,eqVals[i]*0.85);
    }
  }else{
    for(let i=0;i<5;i++)eqVals[i]*=0.85;
  }
  eqBars.forEach((b,i)=>{b.style.transform='scaleY('+(0.15+eqVals[i]*0.85)+')'});
}
function frame(){
  const now=performance.now();
  if(player.playing&&player.ep){
    player.pos+=(now-player.lastTick)/1000;
    player.lastTick=now;
    if(player.pos>=player.ep.duration)nextEpisode(1);
  }else{
    player.lastTick=now;
  }
  if(player.ep){
    tCur.textContent=fmt(player.pos);
    drawSeekWave();
    const rc=rowCanvases.get(player.ep.id);
    if(rc)paintWave(rc,waveFor(player.ep.id,48),player.pos/player.ep.duration);
  }
  updateEQ();
  requestAnimationFrame(frame);
}

renderShows();
renderHero();
renderList();
updateSubCount();
requestAnimationFrame(frame);
</script>
</body>
</html>
