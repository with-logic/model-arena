<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Slides</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e3a5f'/%3E%3Cstop offset='1' stop-color='%23b08a3e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='6' width='26' height='20' rx='5' fill='url(%23g)'/%3E%3Crect x='8.5' y='12' width='11' height='3' rx='1.5' fill='%23fff' opacity='0.95'/%3E%3Crect x='8.5' y='17.5' width='15' height='3' rx='1.5' fill='%23fff' opacity='0.65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

:root, [data-theme="light"]{
  --bg:#f2f0ea;
  --bg-2:#e9e6de;
  --surface:#ffffff;
  --surface-2:#faf9f5;
  --border:#e4e0d6;
  --border-2:#d5d0c4;
  --text:#161a22;
  --text-2:#565d6b;
  --text-3:#8b91a0;
  --accent:#1e3a5f;
  --accent-2:#b08a3e;
  --accent-soft:rgba(30,58,95,0.08);
  --shadow:0 1px 2px rgba(22,26,34,0.04), 0 10px 30px rgba(22,26,34,0.07);
  --shadow-lg:0 2px 6px rgba(22,26,34,0.06), 0 24px 60px rgba(22,26,34,0.16);

  --slide-bg:#ffffff;
  --slide-text:#161a22;
  --slide-text-2:#565d6b;
  --slide-text-3:#9aa0ac;
  --slide-border:#eceae2;
  --slide-accent:#1e3a5f;
  --slide-accent-2:#b08a3e;
  --slide-accent-soft:rgba(30,58,95,0.09);
  --slide-code-bg:#f5f3ee;
  --slide-table-head:#f6f4ee;
  --slide-zebra:#faf9f5;
  --slide-pos:#1a7f4e;
  --slide-neg:#c0392b;
}
[data-theme="dark"]{
  --bg:#0c0f15;
  --bg-2:#10141c;
  --surface:#151a23;
  --surface-2:#1a2029;
  --border:#242b37;
  --border-2:#2e3644;
  --text:#e8ebf1;
  --text-2:#a7aebc;
  --text-3:#6c7383;
  --accent:#8fb2ea;
  --accent-2:#d4b46a;
  --accent-soft:rgba(143,178,234,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 34px rgba(0,0,0,0.4);
  --shadow-lg:0 2px 6px rgba(0,0,0,0.4), 0 28px 70px rgba(0,0,0,0.55);

  --slide-bg:#141924;
  --slide-text:#e8ebf1;
  --slide-text-2:#a7aebc;
  --slide-text-3:#6c7383;
  --slide-border:#242b37;
  --slide-accent:#8fb2ea;
  --slide-accent-2:#d4b46a;
  --slide-accent-soft:rgba(143,178,234,0.14);
  --slide-code-bg:#1a212d;
  --slide-table-head:#1a212d;
  --slide-zebra:#171d28;
  --slide-pos:#5fd39a;
  --slide-neg:#f0776b;
}

html,body{ height:100%; }
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{ background:var(--accent-soft); }

/* ============ APP SHELL ============ */
#app{
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  animation:appIn .5s ease;
}
@keyframes appIn{ from{opacity:0} to{opacity:1} }

.topbar,.statusbar,.panel,.panel-head,.btn,.icon-btn,.tool-btn,.nav-btn,#editor,.dot{
  transition:background-color .25s ease, border-color .25s ease, color .25s ease;
}

/* ============ TOP BAR ============ */
.topbar{
  flex:0 0 auto;
  height:58px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  z-index:5;
}
.brand{ display:flex; align-items:center; gap:11px; user-select:none; }
.brand-mark{ display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.12)); }
.brand-name{ font-weight:700; font-size:15.5px; letter-spacing:-0.01em; }
.brand-name .brand-arrow{ color:var(--accent-2); font-weight:600; padding:0 1px; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  font:inherit; font-size:13px; font-weight:600;
  border-radius:10px; padding:9px 15px;
  border:1px solid var(--border);
  background:var(--surface); color:var(--text);
  cursor:pointer;
  transition:all .15s ease;
}
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn:active{ transform:translateY(1px); }
.btn.primary{
  background:var(--accent); color:#fff; border-color:var(--accent);
  box-shadow:0 1px 2px rgba(0,0,0,0.12), 0 6px 16px var(--accent-soft);
}
[data-theme="dark"] .btn.primary{ color:#0c0f15; }
.btn.primary:hover{ filter:brightness(1.07); color:#fff; }
[data-theme="dark"] .btn.primary:hover{ color:#0c0f15; }
.btn svg{ width:17px; height:17px; }

.icon-btn{
  width:40px; height:40px;
  display:grid; place-items:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface); color:var(--text-2);
  cursor:pointer;
  transition:all .15s ease;
}
.icon-btn:hover{ color:var(--accent); border-color:var(--accent); }
.icon-btn:active{ transform:translateY(1px); }
.icon-btn svg{ width:19px; height:19px; }
[data-theme="light"] .icon-sun{ display:none; }
[data-theme="dark"] .icon-moon{ display:none; }

.tool-btn{
  display:inline-flex; align-items:center; gap:6px;
  font:inherit; font-size:12px; font-weight:600;
  padding:6px 10px; border-radius:8px;
  border:1px solid transparent; background:transparent;
  color:var(--text-2); cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.tool-btn:hover{ background:var(--accent-soft); color:var(--accent); }
.tool-btn:active{ transform:translateY(1px); }
.tool-btn svg{ width:14px; height:14px; }

button:focus-visible, #editor:focus-visible, #stage:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

/* ============ WORKSPACE ============ */
.workspace{
  flex:1; min-height:0;
  display:grid;
  grid-template-columns:minmax(360px, 46%) 1fr;
  gap:14px;
  padding:14px;
}
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column;
  min-height:0; overflow:hidden;
}
.panel-head{
  flex:0 0 auto;
  height:48px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  background:var(--surface-2);
}
.panel-label{
  font-size:11px; font-weight:600;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-3);
  display:flex; align-items:center; gap:8px;
  user-select:none;
}
.panel-label .live-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--accent-2);
  box-shadow:0 0 0 3px var(--accent-soft);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.35} }
.panel-tools{ display:flex; align-items:center; gap:8px; }
.stat{
  font-size:12px; color:var(--text-3);
  font-variant-numeric:tabular-nums;
  padding:0 4px;
  user-select:none;
}
.stat.counter{
  font-weight:600; color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px; padding:4px 10px;
}

/* ============ EDITOR ============ */
.editor-wrap{ flex:1; min-height:0; position:relative; }
#editor{
  width:100%; height:100%;
  border:0; outline:none; resize:none;
  background:transparent; color:var(--text);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13.5px; line-height:1.75;
  padding:22px 24px 40px;
  caret-color:var(--accent);
  tab-size:2;
}
#editor::placeholder{ color:var(--text-3); }
#editor::-webkit-scrollbar{ width:11px; }
#editor::-webkit-scrollbar-track{ background:transparent; }
#editor::-webkit-scrollbar-thumb{ background:var(--border-2); border-radius:6px; border:3px solid var(--surface); }
#editor::-webkit-scrollbar-thumb:hover{ background:var(--text-3); }
.editor-foot{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 16px;
  border-top:1px solid var(--border);
  background:var(--surface-2);
  font-size:11.5px; color:var(--text-3);
  user-select:none;
}
.editor-foot code{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background:var(--accent-soft); color:var(--accent);
  padding:1px 6px; border-radius:5px;
}

/* ============ STAGE ============ */
#stage{
  flex:1; min-height:0;
  display:flex; flex-direction:column;
  background:radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 100%);
}
#stageCenter{
  flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative;
  padding:20px;
}
#frameWrap{ position:relative; }
#slideScaler{
  width:1280px; height:720px;
  transform-origin:top left;
}
#slideFrame{
  width:1280px; height:720px;
  border-radius:6px; overflow:hidden;
  box-shadow:var(--shadow-lg);
  background:var(--slide-bg);
}
.slide-enter{ animation:slideIn .5s cubic-bezier(0.22,1,0.36,1); }
@keyframes slideIn{
  from{ opacity:0; transform:translateX(30px); }
  to{ opacity:1; transform:translateX(0); }
}

/* ============ SLIDE ============ */
.slide{
  width:1280px; height:720px;
  background:var(--slide-bg);
  color:var(--slide-text);
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  font-family:'Inter',sans-serif;
}
.slide-accentbar{
  flex:0 0 auto; height:6px;
  background:linear-gradient(90deg, var(--slide-accent), var(--slide-accent-2));
}
.slide-inner{
  flex:1; min-height:0;
  padding:54px 84px 30px;
  display:flex; flex-direction:column;
}
.slide-title{ margin-bottom:26px; }
.slide-title h1,.slide-title h2,.slide-title h3,.slide-title h4,.slide-title h5,.slide-title h6{
  font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-weight:600; font-size:52px; line-height:1.08;
  letter-spacing:-0.02em; color:var(--slide-text);
  margin:0; position:relative; padding-bottom:20px;
}
.slide-title h1::after,.slide-title h2::after{
  content:''; position:absolute; left:0; bottom:0;
  width:72px; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--slide-accent), var(--slide-accent-2));
}
.slide-body{ flex:1; min-height:0; overflow:hidden; }

.slide-body > *:first-child{ margin-top:0; }
.slide-body p{ font-size:22px; line-height:1.55; color:var(--slide-text); margin:0 0 18px; }
.slide-body p:last-child{ margin-bottom:0; }
.slide-body h1{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; margin:26px 0 12px; letter-spacing:-0.01em; }
.slide-body h2{ font-family:'Fraunces',serif; font-size:29px; font-weight:600; margin:24px 0 11px; letter-spacing:-0.01em; }
.slide-body h3{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; margin:20px 0 10px; }
.slide-body h4,.slide-body h5,.slide-body h6{ font-size:20px; font-weight:600; margin:18px 0 8px; }
.slide-body strong{ font-weight:700; color:var(--slide-text); }
.slide-body em{ font-style:italic; }
.slide-body del{ opacity:0.6; }
.slide-body a{
  color:var(--slide-accent);
  text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;
}
.slide-body a:hover{ color:var(--slide-accent-2); }
.slide-body img{ max-width:100%; border-radius:8px; }

.slide-body ul,.slide-body ol{
  font-size:21px; line-height:1.5;
  margin:0 0 18px; padding:0; list-style:none;
}
.slide-body li{ position:relative; padding-left:34px; margin-bottom:12px; }
.slide-body ul li::before{
  content:''; position:absolute; left:4px; top:10px;
  width:9px; height:9px; border-radius:2px;
  background:linear-gradient(135deg, var(--slide-accent), var(--slide-accent-2));
  transform:rotate(45deg);
}
.slide-body ol{ counter-reset:item; }
.slide-body ol li{ counter-increment:item; }
.slide-body ol li::before{
  content:counter(item);
  position:absolute; left:0; top:1px;
  width:26px; height:26px; border-radius:50%;
  background:var(--slide-accent-soft); color:var(--slide-accent);
  font-size:13px; font-weight:700;
  display:grid; place-items:center;
  font-family:'Inter',sans-serif;
}
.slide-body .nested{ margin-top:10px; padding-left:6px; }
.slide-body .nested li{ font-size:19px; }

.slide-body blockquote{
  margin:26px 0; padding:6px 0 6px 30px;
  border-left:4px solid var(--slide-accent-2);
}
.slide-body blockquote p{
  font-family:'Fraunces',serif;
  font-size:29px; line-height:1.4; font-style:italic;
  color:var(--slide-text); margin:0;
}
.slide-body blockquote p + p{
  font-family:'Inter',sans-serif;
  font-size:18px; font-style:normal;
  color:var(--slide-text-2); margin-top:14px;
}

.slide-body code{
  font-family:'JetBrains Mono',monospace;
  font-size:0.82em;
  background:var(--slide-code-bg);
  padding:2px 7px; border-radius:6px;
  color:var(--slide-accent);
}
.slide-body pre.code{
  background:var(--slide-code-bg);
  border:1px solid var(--slide-border);
  border-radius:12px;
  padding:18px 22px; margin:0 0 18px;
  overflow:auto; position:relative;
}
.slide-body pre.code code{
  background:none; padding:0;
  font-size:16px; line-height:1.6;
  color:var(--slide-text);
}
.slide-body pre.code[data-lang]::before{
  content:attr(data-lang);
  position:absolute; top:11px; right:15px;
  font-family:'Inter',sans-serif;
  font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--slide-text-3);
}

.slide-body table{
  width:100%; border-collapse:collapse;
  font-size:19px; margin:6px 0 18px;
}
.slide-body th{
  text-align:left;
  font-weight:600; font-size:13.5px;
  text-transform:uppercase; letter-spacing:0.06em;
  color:var(--slide-text-2);
  padding:13px 16px;
  border-bottom:2px solid var(--slide-accent);
  background:var(--slide-table-head);
}
.slide-body td{
  padding:13px 16px;
  border-bottom:1px solid var(--slide-border);
  color:var(--slide-text);
}
.slide-body tbody tr:nth-child(even){ background:var(--slide-zebra); }
.slide-body tbody tr:last-child td{ border-bottom:none; }
.slide-body td.pos{ color:var(--slide-pos); font-weight:600; }
.slide-body td.neg{ color:var(--slide-neg); font-weight:600; }

.slide-body hr{ border:none; height:1px; background:var(--slide-border); margin:26px 0; }

/* cover slide */
.slide.cover .slide-inner{
  justify-content:center; align-items:center;
  text-align:center; padding:84px;
}
.slide.cover .slide-title{ margin-bottom:22px; }
.slide.cover .slide-title h1,.slide.cover .slide-title h2{
  font-size:74px; padding-bottom:0;
}
.slide.cover .slide-title h1::after,.slide.cover .slide-title h2::after{
  left:50%; transform:translateX(-50%);
}
.slide.cover .slide-body{
  display:flex; flex-direction:column; align-items:center;
}
.slide.cover .slide-body p{
  font-size:23px; color:var(--slide-text-2);
  margin:0 0 8px; line-height:1.5;
}
.slide.cover .slide-body p strong{ color:var(--slide-text); }
.slide.cover .slide-footer{ display:none; }

.slide-footer{
  flex:0 0 auto;
  height:56px; padding:0 84px;
  display:flex; align-items:center; justify-content:space-between;
  border-top:1px solid var(--slide-border);
  font-size:14px; color:var(--slide-text-3);
  font-family:'Inter',sans-serif;
}
.slide-brand{ display:flex; align-items:center; gap:10px; font-weight:500; letter-spacing:0.01em; }
.slide-brand .mark{
  width:9px; height:9px;
  background:linear-gradient(135deg, var(--slide-accent), var(--slide-accent-2));
  transform:rotate(45deg); border-radius:2px;
}
.slide-num{ font-variant-numeric:tabular-nums; letter-spacing:0.08em; }

/* ============ STAGE CONTROLS ============ */
.stage-controls{
  flex:0 0 auto;
  height:64px;
  display:flex; align-items:center; justify-content:center; gap:22px;
  transition:opacity .4s ease;
}
.nav-btn{
  width:42px; height:42px;
  display:grid; place-items:center;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface); color:var(--text-2);
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow);
}
.nav-btn svg{ width:20px; height:20px; }
.nav-btn:hover:not(:disabled){ color:var(--accent); border-color:var(--accent); transform:scale(1.06); }
.nav-btn:active:not(:disabled){ transform:scale(0.98); }
.nav-btn:disabled{ opacity:0.35; cursor:default; }
.dots{ display:flex; align-items:center; gap:8px; }
.dot{
  width:8px; height:8px;
  border-radius:50%;
  background:var(--border-2);
  border:none; padding:0; cursor:pointer;
  transition:all .22s cubic-bezier(0.22,1,0.36,1);
}
.dot:hover{ background:var(--text-3); }
.dot.active{ width:26px; border-radius:4px; background:var(--accent); }
.progress{
  flex:0 0 auto;
  height:3px;
  background:var(--border);
  position:relative; overflow:hidden;
  transition:opacity .4s ease;
}
.progress-fill{
  position:absolute; left:0; top:0; bottom:0;
  width:0%;
  background:linear-gradient(90deg, var(--accent), var(--slide-accent-2));
  transition:width .35s cubic-bezier(0.22,1,0.36,1);
}

/* ============ STATUS BAR ============ */
.statusbar{
  flex:0 0 auto;
  height:34px;
  display:flex; align-items:center; gap:20px;
  padding:0 20px;
  border-top:1px solid var(--border);
  background:var(--surface);
  color:var(--text-3); font-size:11.5px;
  user-select:none;
}
.kbd-hint{ display:flex; align-items:center; gap:6px; }
kbd{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-bottom-width:2px;
  border-radius:5px; padding:1px 5px;
  color:var(--text-2);
}
.statusbar .spacer{ flex:1; }
.statusbar .tag{ font-weight:600; letter-spacing:0.04em; }

/* ============ PRESENT MODE ============ */
#app.presenting .topbar,
#app.presenting .statusbar,
#app.presenting .editor-panel,
#app.presenting .stage-panel > .panel-head{ display:none; }
#app.presenting .workspace{ padding:0; gap:0; }
#app.presenting .stage-panel{ border:none; border-radius:0; box-shadow:none; }
#app.presenting #stage{
  background:radial-gradient(120% 120% at 50% 0%, #10141c 0%, #0a0c10 100%);
}
#app.presenting #stage.idle .stage-controls,
#app.presenting #stage.idle .progress{ opacity:0; pointer-events:none; }

/* ============ RESPONSIVE ============ */
@media (max-width:900px){
  .workspace{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
  .brand-name{ display:none; }
  .btn.primary span{ display:none; }
  .btn.primary{ padding:9px 12px; }
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="27" height="27" aria-hidden="true">
        <defs>
          <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e3a5f"/>
            <stop offset="1" stop-color="#b08a3e"/>
          </linearGradient>
        </defs>
        <rect x="3" y="6" width="26" height="20" rx="5" fill="url(#bm)"/>
        <rect x="8.5" y="12" width="11" height="3" rx="1.5" fill="#fff" opacity="0.95"/>
        <rect x="8.5" y="17.5" width="15" height="3" rx="1.5" fill="#fff" opacity="0.65"/>
      </svg>
      <span class="brand-name">Markdown <span class="brand-arrow">→</span> Slides</span>

<script>
/*==PARSER-START==*/
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function inline(text){
  var codes = [];
  text = String(text).replace(/`([^`]+)`/g, function(m,c){
    codes.push(c);
    return '\u0000C'+(codes.length-1)+'\u0000';
  });
  text = escapeHtml(text);
  // images
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, function(m,alt,src,t){
    return '<img src="'+src+'" alt="'+alt+'"'+(t?' title="'+t+'"':'')+' loading="lazy">';
  });
  // links
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, function(m,txt,href,t){
    return '<a href="'+href+'"'+(t?' title="'+t+'"':'')+' target="_blank" rel="noopener">'+txt+'</a>';
  });
  // bold
  text = text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  text = text.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  // italic
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  text = text.replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g,'$1<em>$2</em>');
  // strikethrough
  text = text.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // restore code
  text = text.replace(/\u0000C(\d+)\u0000/g, function(m,i){
    return '<code>'+escapeHtml(codes[i])+'</code>';
  });
  return text;
}

function splitRow(line){
  var s = String(line).trim();
  if(s.charAt(0)==='|') s = s.slice(1);
  if(s.charAt(s.length-1)==='|') s = s.slice(0,-1);
  return s.split('|').map(function(c){ return c.trim(); });
}

function parseList(lines){
  var minIndent = Infinity;
  for(var k=0;k<lines.length;k++){
    var mm = lines[k].match(/^(\s*)([-*+]|\d+[.)])\s+/);
    if(mm) minIndent = Math.min(minIndent, mm[1].length);
  }
  if(minIndent === Infinity) return '';
  var firstItem = null;
  for(var k2=0;k2<lines.length;k2++){
    var mm2 = lines[k2].match(/^(\s*)([-*+]|\d+[.)])\s+/);
    if(mm2){ firstItem = lines[k2]; break; }
  }
  var ordered = /^\s*\d+[.)]\s+/.test(firstItem || '');
  var html = ordered ? '<ol>' : '<ul>';
  var i = 0;
  while(i < lines.length){
    var line = lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    var m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if(!m || m[1].length !== minIndent){ i++; continue; }
    var text = m[3];
    i++;
    var nested = [];
    while(i < lines.length){
      var nl = lines[i];
      if(/^\s*$/.test(nl)){
        var j = i+1;
        while(j < lines.length && /^\s*$/.test(lines[j])) j++;
        if(j < lines.length){
          var ind = lines[j].match(/^\s*/)[0].length;
          if(ind > minIndent){ nested.push(''); i++; continue; }
        }
        break;
      }
      var ind2 = nl.match(/^\s*/)[0].length;
      if(ind2 > minIndent){ nested.push(nl); i++; }
      else break;
    }
    var inner = inline(text);
    var hasNestedList = nested.some(function(l){ return /^(\s*)([-*+]|\d+[.)])\s+/.test(l); });
    if(hasNestedList){
      inner += '<div class="nested">' + parseList(nested) + '</div>';
    } else {
      var cont = nested.filter(function(l){ return !/^\s*$/.test(l); }).join(' ');
      if(cont) inner += ' ' + inline(cont);
    }
    html += '<li>' + inner + '</li>';
  }
  html += ordered ? '</ol>' : '</ul>';
  return html;
}

function parseBlocks(src){
  var lines = String(src).replace(/\r\n/g,'\n').replace(/\t/g,'  ').split('\n');
  var html = '';
  var i = 0;
  function isBlank(l){ return /^\s*$/.test(l); }
  function isHeading(l){ return /^#{1,6}\s+/.test(l); }
  function isFence(l){ return /^\s*(```|~~~)/.test(l); }
  function isQuote(l){ return /^\s*>\s?/.test(l); }
  function isHr(l){ return /^\s*([-*_])\s*(\1\s*){2,}$/.test(l); }
  function isListItem(l){ return /^\s*([-*+]|\d+[.)])\s+/.test(l); }
  function isTableSep(l){ return /^\s*\|?\s*:?-{2,}/.test(l) && /\|/.test(l); }
  function isTableStart(idx){ return /\|/.test(lines[idx]) && idx+1 < lines.length && isTableSep(lines[idx+1]); }

  while(i < lines.length){
    var line = lines[i];
    if(isBlank(line)){ i++; continue; }

    // fenced code
    var f = line.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)/);
    if(f){
      var marker = f[1].charAt(0);
      var lang = f[2] || '';
      var closeRe = marker==='`' ? /^\s*```+\s*$/ : /^\s*~~~+\s*$/;
      var code = []; i++;
      while(i < lines.length && !closeRe.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      html += '<pre class="code"'+(lang?' data-lang="'+escapeHtml(lang)+'"':'')+'><code>'+escapeHtml(code.join('\n'))+'</code></pre>';
      continue;
    }
    // heading
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      var lv = h[1].length;
      html += '<h'+lv+'>'+inline(h[2].replace(/\s+#+\s*$/,''))+'</h'+lv+'>';
      i++; continue;
    }
    // hr
    if(isHr(line)){ html += '<hr>'; i++; continue; }
    // blockquote
    if(isQuote(line)){
      var q = [];
      while(i < lines.length && isQuote(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html += '<blockquote>'+parseBlocks(q.join('\n'))+'</blockquote>';
      continue;
    }
    // table
    if(isTableStart(i)){
      var header = splitRow(line);
      var aligns = splitRow(lines[i+1]).map(function(c){
        var t = c.trim();
        if(/^:-+:$/.test(t)) return 'center';
        if(/^-+:$/.test(t)) return 'right';
        return '';
      });
      i += 2;
      var rows = [];
      while(i < lines.length && /\|/.test(lines[i]) && !isBlank(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      var t = '<table><thead><tr>';
      header.forEach(function(c,idx){ t += '<th'+(aligns[idx]?' style="text-align:'+aligns[idx]+'"':'')+'>'+inline(c)+'</th>'; });
      t += '</tr></thead><tbody>';
      rows.forEach(function(r){
        t += '<tr>';
        r.forEach(function(c,idx){ t += '<td'+(aligns[idx]?' style="text-align:'+aligns[idx]+'"':'')+'>'+inline(c)+'</td>'; });
        t += '</tr>';
      });
      t += '</tbody></table>';
      html += t;
      continue;
    }
    // list
    if(isListItem(line)){
      var listLines = [];
      while(i < lines.length){
        var l = lines[i];
        if(isListItem(l)){ listLines.push(l); i++; }
        else if(isBlank(l)){
          if(i+1 < lines.length && (isListItem(lines[i+1]) || /^\s{2,}\S/.test(lines[i+1]))){ listLines.push(l); i++; }
          else break;
        }
        else if(/^\s{2,}\S/.test(l)){ listLines.push(l); i++; }
        else break;
      }
      html += parseList(listLines);
      continue;
    }
    // paragraph
    var para = [];
    while(i < lines.length){
      var pl = lines[i];
      if(isBlank(pl)||isHeading(pl)||isFence(pl)||isQuote(pl)||isHr(pl)||isListItem(pl)||isTableStart(i)) break;
      para.push(pl); i++;
    }
    if(para.length) html += '<p>'+inline(para.join(' '))+'</p>';
  }
  return html;
}

function splitSlides(md){
  var lines = String(md).replace(/\r\n/g,'\n').split('\n');
  var slides = [];
  var cur = [];
  var fence = false;
  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    if(/^\s*(```|~~~)/.test(line)) fence = !fence;
    if(!fence && /^\s*-{3,}\s*$/.test(line)){
      slides.push(cur.join('\n'));
      cur = [];
    } else {
      cur.push(line);
    }
  }
  slides.push(cur.join('\n'));
  var out = slides.filter(function(s){ return s.trim().length > 0; });
  if(out.length === 0) out = [''];
  return out;
}
/*==PARSER-END==*/

(function(){
  'use strict';

  var app = document.getElementById('app');
  var editor = document.getElementById('editor');
  var stage = document.getElementById('stage');
  var stageCenter = document.getElementById('stageCenter');
  var frame = document.getElementById('slideFrame');
  var scaler = document.getElementById('slideScaler');
  var wrap = document.getElementById('frameWrap');
  var dotsEl = document.getElementById('dots');
  var counterEl = document.getElementById('counter');
  var progressFill = document.getElementById('progressFill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var sampleSrc = document.getElementById('sampleSource').textContent.replace(/^\n/,'').replace(/\s+$/,'');

  var state = { slides: [], current: 0 };
  var inputTimer = null;
  var idleTimer = null;

  /* ---------- theme ---------- */
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('mdslides-theme', t); }catch(e){}
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme');
    setTheme(cur === 'dark' ? 'light' : 'dark');
  }
  (function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem('mdslides-theme'); }catch(e){}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(saved || (prefersDark ? 'dark' : 'light'));
  })();

  /* ---------- deck helpers ---------- */
  function getDeckTitle(){
    var first = state.slides[0] || '';
    var m = first.match(/^#{1,6}\s+(.*)$/m);
    if(m){
      var t = m[1].replace(/[*_`~]/g,'').trim();
      if(t) return t;
    }
    return 'Untitled Deck';
  }

  function isCover(html){
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var heading = tmp.querySelector('h1,h2,h3,h4,h5,h6');
    if(!heading) return false;
    heading.remove();
    if(tmp.querySelector('ul,ol,table,pre,blockquote')) return false;
    var text = tmp.textContent.trim();
    var blocks = tmp.children.length;
    return blocks <= 2 && text.length <= 120;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }

  function renderSlide(md, index, total){
    var html = parseBlocks(md);
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var heading = tmp.querySelector('h1,h2,h3,h4,h5,h6');
    var titleHtml = '';
    if(heading){
      titleHtml = heading.outerHTML;
      heading.remove();
    }
    var bodyHtml = tmp.innerHTML;
    var cover = isCover(html);
    var deckTitle = getDeckTitle();
    return '<div class="slide'+(cover?' cover':'')+'">'
      + '<div class="slide-accentbar"></div>'
      + '<div class="slide-inner">'
      + (titleHtml ? '<div class="slide-title">'+titleHtml+'</div>' : '')
      + '<div class="slide-body">'+bodyHtml+'</div>'
      + '</div>'
      + '<div class="slide-footer">'
      + '<span class="slide-brand"><span class="mark"></span>'+escapeHtml(deckTitle)+'</span>'
      + '<span class="slide-num">'+pad2(index+1)+' / '+pad2(total)+'</span>'
      + '</div>'
      + '</div>';
  }

  /* ---------- rendering ---------- */
  function fitSlide(){
    var availW = stageCenter.clientWidth - 48;
    var availH = stageCenter.clientHeight - 48;
    if(availW <= 0 || availH <= 0) return;
    var s = Math.min(availW/1280, availH/720);
    s = Math.max(0.1, Math.min(s, 2));
    scaler.style.transform = 'scale(' + s + ')';
    wrap.style.width = (1280*s) + 'px';
    wrap.style.height = (720*s) + 'px';
  }

  function renderDots(){
    dotsEl.innerHTML = '';
    state.slides.forEach(function(_, idx){
      var b = document.createElement('button');
      b.className = 'dot';
      b.setAttribute('aria-label','Go to slide '+(idx+1));
      b.addEventListener('click', function(e){
        goTo(idx);
        e.currentTarget.blur();
      });
      dotsEl.appendChild(b);
    });
  }

  function updateChrome(){
    var total = state.slides.length;
    counterEl.textContent = (state.current+1) + ' / ' + total;
    progressFill.style.width = (total > 1 ? (state.current/(total-1))*100 : 100) + '%';
    prevBtn.disabled = state.current === 0;
    nextBtn.disabled = state.current === total-1;
    var dots = dotsEl.querySelectorAll('.dot');
    dots.forEach(function(d, idx){ d.classList.toggle('active', idx === state.current); });
  }

  function updateStats(){
    var v = editor.value;
    var words = (v.match(/\S+/g) || []).length;
    document.getElementById('wordCount').textContent = words + ' words';
    document.getElementById('charCount').textContent = v.length + ' chars';
    document.getElementById('slideCount').textContent = state.slides.length + (state.slides.length === 1 ? ' slide' : ' slides');
  }

  function showSlide(i){
    state.current = Math.max(0, Math.min(i, state.slides.length-1));
    var total = state.slides.length;
    var md = state.slides[state.current];
    frame.innerHTML = renderSlide(md, state.current, total);
    // color metric deltas
    frame.querySelectorAll('td').forEach(function(td){
      var t = td.textContent.trim();
      if(/^\+/.test(t)) td.classList.add('pos');
      else if(/^[−\-]/.test(t)) td.classList.add('neg');
    });
    // retrigger entrance animation
    frame.classList.remove('slide-enter');
    void frame.offsetWidth;
    frame.classList.add('slide-enter');
    updateChrome();
    fitSlide();
  }

  function refresh(){
    var md = editor.value;
    state.slides = splitSlides(md);
    if(state.slides.length === 0) state.slides = [''];
    if(state.current > state.slides.length-1) state.current = state.slides.length-1;
    renderDots();
    showSlide(state.current);
    updateStats();
  }

  function goTo(i){ showSlide(i); }
  function next(){ if(state.current < state.slides.length-1) showSlide(state.current+1); }
  function prev(){ if(state.current > 0) showSlide(state.current-1); }

  /* ---------- present mode ---------- */
  function enterPresent(){
    app.classList.add('presenting');
    stage.focus();
    requestAnimationFrame(fitSlide);
    try{
      if(app.requestFullscreen) app.requestFullscreen().catch(function(){});
    }catch(e){}
  }
  function exitPresent(){
    app.classList.remove('presenting');
    if(document.fullscreenElement){
      try{ document.exitFullscreen().catch(function(){}); }catch(e){}
    }
    requestAnimationFrame(fitSlide);
  }
  function togglePresent(){
    if(app.classList.contains('presenting')) exitPresent();
    else enterPresent();
  }
  document.addEventListener('fullscreenchange', function(){
    if(!document.fullscreenElement) app.classList.remove('presenting');
    requestAnimationFrame(fitSlide);
  });

  stageCenter.addEventListener('mousemove', function(){
    if(!app.classList.contains('presenting')) return;
    stage.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(app.classList.contains('presenting')) stage.classList.add('idle');
    }, 2600);
  });

  /* ---------- events ---------- */
  editor.addEventListener('input', function(){
    clearTimeout(inputTimer);
    inputTimer = setTimeout(refresh, 120);
  });

  document.getElementById('sampleBtn').addEventListener('click', function(e){
    editor.value = sampleSrc;
    state.current = 0;
    refresh();
    e.currentTarget.blur();
  });
  document.getElementById('clearBtn').addEventListener('click', function(e){
    editor.value = '';
    state.current = 0;
    refresh();
    e.currentTarget.blur();
  });
  prevBtn.addEventListener('click', function(e){ prev(); e.currentTarget.blur(); });
  nextBtn.addEventListener('click', function(e){ next(); e.currentTarget.blur(); });
  document.getElementById('themeBtn').addEventListener('click', function(e){ toggleTheme(); e.currentTarget.blur(); });
  document.getElementById('presentBtn').addEventListener('click', function(e){ togglePresent(); e.currentTarget.blur(); });
  stageCenter.addEventListener('click', function(){ stage.focus(); });
  window.addEventListener('resize', fitSlide);
  window.addEventListener('load', function(){ requestAnimationFrame(fitSlide); });

  document.addEventListener('keydown', function(e){
    var ae = document.activeElement;
    var inEditor = (ae === editor);

    if(e.key === 'Escape'){
      if(document.fullscreenElement){
        try{ document.exitFullscreen(); }catch(err){}
      } else if(app.classList.contains('presenting')){
        app.classList.remove('presenting');
        requestAnimationFrame(fitSlide);
      } else if(inEditor){
        editor.blur();
        stage.focus();
      }
      return;
    }
    if(inEditor) return;

    var tag = ae && ae.tagName;
    if((e.key === ' ' || e.key === 'Enter') && tag === 'BUTTON') return;

    switch(e.key){
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter':
        e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace':
        e.preventDefault(); prev(); break;
      case 'Home': e.preventDefault(); goTo(0); break;
      case 'End': e.preventDefault(); goTo(state.slides.length-1); break;
      case 'f': case 'F': togglePresent(); break;
      case 't': case 'T': toggleTheme(); break;
    }
  });

  /* ---------- init ---------- */
  editor.value = sampleSrc;
  refresh();
  requestAnimationFrame(fitSlide);
})();
</script>
</body>
</html>
