return <div className="app"><div className="shell"><header className="topbar"><div className="brand"><span className="brand-icon"><Icon name="cup" size={19}/></span>The Dunk Lab</div><div className="topright"><span className="top-label">A little science for your tea break</span><span className="divider"></span><span className="live">Lab is open</span></div></header><div className="intro"><div><h1>Let’s get dunking.</h1><p>Find that perfect moment between a good dunk and a soggy disaster.</p></div><div className="intro-note"><Icon name="spark" size={15}/> Made for the biscuit curious</div></div><main className="workspace"><section className="card controls"><div className="section-head"><div><h2>Set the scene</h2><p>Your tea, your rules.</p></div><span className="tiny-icon"><Icon name="sliders"/></span></div><div className="control-group"><div className="control-top"><label htmlFor="biscuit">Biscuit type</label></div><div className="select-wrap"><select id="biscuit" value={biscuit} onChange={e=>setBiscuit(e.target.value)}>{Object.keys(biscuits).map(n=><option key={n}>{n}</option>)}</select></div><div className="select-hint">{b.note}</div></div><Slider label="Tea temperature" value={temp} set={setTemp} min={40} max={100} unit="°C" left="40°C" right="100°C"/><Slider label="Dunk time" value={time} set={setTime} min={1} max={12} unit=" sec" left="1 sec" right="12 sec"/><Slider label="Structural integrity" value={integrity} set={setIntegrity} min={20} max={100} unit="%" left="A little fragile" right="Factory fresh"/><div className="controls-divider"></div><div className="tip"><Icon name="info" size={15}/><span>Hotter tea and longer dunks make for a crumblier biscuit.</span></div><div className="actions"><button className="primary" onClick={dunk}><Icon name="play" size={15}/> {running?'Dunking...':'Dunk it'}</button><button className="reset" onClick={reset} aria-label="Reset settings" title="Reset settings">↺</button></div><p className="shortcuts"><kbd>space</kbd> to dunk <
