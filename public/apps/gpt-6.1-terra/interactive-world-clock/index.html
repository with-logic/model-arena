<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111a2c">
<title>Interactive World Clock</title>
<style>
  :root{color-scheme:dark;--ink:#f7f6f0;--muted:#9ba9b9;--line:rgba(221,232,242,.13);--bg:#111a2c;--orange:#f6ad72}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f6ad72;outline-offset:3px}.app{max-width:1440px;margin:auto;padding:0 6.1%}.topbar{height:91px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:700;letter-spacing:.01em}.brand-mark{width:34px;height:34px;border:1px solid #f0aa73;border-radius:50%;display:grid;place-items:center;color:#f0aa73}.brand-mark svg{width:19px}.top-right{display:flex;align-items:center;gap:10px;color:#b9c5d2;font-size:12px}.live-dot{width:7px;height:7px;border-radius:50%;background:#b1d5b6;box-shadow:0 0 0 4px rgba(177,213,182,.09)}
  main{padding:63px 0 67px}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:36px}.eyebrow{display:flex;align-items:center;gap:9px;color:#f1b17f;font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;margin:0 0 17px}.eyebrow:before{content:"";width:25px;height:1px;background:#f1b17f}h1{font-size:clamp(43px,5.6vw,74px);line-height:1.02;letter-spacing:-.055em;font-weight:550;margin:0}.intro-copy{color:#a8b6c6;font-size:15px;line-height:1.6;margin:16px 0 0}.controls{display:flex;align-items:center;gap:16px;padding-bottom:4px;flex-shrink:0}.format-label{font-size:12px;color:#a9b6c6}.switch{display:flex;padding:4px;border:1px solid #3b485c;border-radius:30px;background:#172338}.switch button{border:0;background:transparent;color:#9facbd;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:700;line-height:1}.switch button.active{color:#172032;background:#f5f3ea}.add-button{height:43px;padding:0 19px;border:0;border-radius:25px;background:#f0ad7b;color:#172032;font-weight:700;font-size:13px;display:flex;align-items:center;gap:9px}.add-button:hover{background:#ffc696}.add-button svg{width:16px;height:16px}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-head h2{font-size:13px;font-weight:650;margin:0;color:#e8edf1}.section-head span{font-size:12px;color:#8493a5}.clock-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.clock-card{height:254px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:var(--card);isolation:isolate}.clock-card.morning{--card:#b77e6c;--orb:#ffd59b;--horizon:#dca087;--cardtext:#fff8eb;--sub:#f6ddce}.clock-card.afternoon{--card:#b47d5a;--orb:#ffe0a2;--horizon:#dda77e;--cardtext:#fff9ed;--sub:#ffe4cf}.clock-card.evening{--card:#695b79;--orb:#f9ba8d;--horizon:#a27080;--cardtext:#fff8f2;--sub:#e9d6df}.clock-card.night{--card:#293d59;--orb:#e8e6cf;--horizon:#3b5572;--cardtext:#f7f8f5;--sub:#c3d0dc}.card-content{position:relative;z-index:2;height:100%;padding:24px 27px 20px;display:flex;flex-direction:column;color:var(--cardtext)}.card-top{display:flex;justify-content:space-between;align-items:flex-start}.place{display:flex;align-items:baseline;gap:10px;min-width:0}.city{font-size:19px;font-weight:650;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country{font-size:12px;color:var(--sub);white-space:nowrap}.remove{background:rgba(17,26,44,.12);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:29px;height:29px;color:rgba(255,255,255,.8);display:grid;place-items:center;padding:0;flex:none}.remove:hover{background:rgba(17,26,44,.35);color:white}.remove svg{width:13px}.time-wrap{display:flex;align-items:baseline;gap:8px;margin:auto 0 5px}.time{font-size:clamp(57px,6vw,82px);line-height:1;letter-spacing:-.065em;font-weight:400;font-variant-numeric:tabular-nums}.ampm{font-size:15px;font-weight:600;letter-spacing:.01em}.card-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.25);padding-top:15px;font-size:12px;color:var(--sub)}.date{color:var(--cardtext);font-weight:550}.phase{display:flex;gap:7px;align-items:center}.phase svg{width:16px;height:16px}.sky{position:absolute;z-index:0;right:0;top:0;width:47%;height:100%;overflow:hidden;pointer-events:none}.orb{position:absolute;width:116px;height:116px;border-radius:50%;background:var(--orb);right:13%;top:23%;box-shadow:0 0 65px rgba(255,224,178,.15)}.night .orb{width:87px;height:87px;right:18%;top:24%;box-shadow:0 0 48px rgba(225,233,231,.13)}.night .orb:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:#293d59;left:27px;top:-10px}.land{position:absolute;bottom:-55px;right:-25%;width:145%;height:145px;background:var(--horizon);border-radius:50% 50% 0 0;opacity:.7;transform:rotate(-8deg)}.land:after{content:"";position:absolute;bottom:3px;right:5%;width:120%;height:65px;border-top:1px solid rgba(255,255,255,.22);border-radius:50%}.stars{display:none}.night .stars{display:block;position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1.4px),radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.4px);background-size:75px 67px,109px 93px;background-position:4px 2px,29px 18px;opacity:.6}.card-content>*{position:relative}.empty{grid-column:1/-1;min-height:225px;border:1px dashed #45546a;border-radius:12px;display:grid;place-content:center;text-align:center;color:#abb9c8}.empty strong{color:#f4f6f6;font-size:17px}.empty p{font-size:13px;margin:9px 0 0}.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:35px;display:flex;justify-content:space-between;gap:20px;color:#8291a3;font-size:12px}.footer b{font-weight:500;color:#c0cbd4}.footer-note{display:flex;align-items:center;gap:8px}.footer-note svg{width:15px;color:#eeb180}
  .modal-backdrop{position:fixed;z-index:10;inset:0;background:rgba(5,11,20,.75);display:grid;place-items:center;padding:20px}.modal-backdrop[hidden]{display:none}.modal{width:min(100%,490px);max-height:min(680px,85vh);background:#1c293d;border:1px solid #435065;border-radius:15px;box-shadow:0 24px 90px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}.modal-head{padding:26px 26px 19px;display:flex;align-items:start;justify-content:space-between}.modal-head h2{font-size:23px;letter-spacing:-.035em;margin:0 0 6px}.modal-head p{font-size:13px;color:#a8b6c6;margin:0}.close{border:0;background:transparent;color:#aebdcb;font-size:25px;line-height:1;padding:0 2px}.search-wrap{padding:0 26px 18px;position:relative}.search-wrap svg{position:absolute;left:41px;top:14px;width:17px;color:#98a8b8}.search{width:100%;height:46px;background:#111d2f;border:1px solid #425065;border-radius:8px;padding:0 14px 0 42px;color:#fff;font-size:14px}.search::placeholder{color:#8493a5}.city-list{overflow:auto;padding:0 12px 14px;min-height:100px}.city-option{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:transparent;border:0;border-radius:8px;padding:12px 14px;color:#f5f6f3}.city-option:not(:disabled):hover,.city-option:not(:disabled):focus-visible{background:#2b3b51}.city-option:disabled{cursor:default;opacity:.45}.option-name{display:block;font-size:14px;font-weight:600}.option-country{display:block;color:#a5b3c1;font-size:12px;margin-top:4px}.option-action{font-size:12px;color:#f2b487}.no-results{font-size:13px;color:#a5b3c1;text-align:center;padding:24px}.modal-foot{border-top:1px solid #3a485a;padding:15px 26px;color:#9cabb9;font-size:12px}
  @media(max-width:800px){.app{padding:0 5%}.intro{align-items:flex-start;flex-direction:column}.controls{width:100%;justify-content:flex-start}.clock-card{height:235px}.card-content{padding:21px}.time{font-size:clamp(50px,7vw,67px)}.country{display:none}.orb{width:90px;height:90px}.footer{line-height:1.5}}@media(max-width:560px){.topbar{height:75px}.top-right{font-size:11px}main{padding-top:45px}h1{font-size:45px}.intro-copy{font-size:14px}.controls{gap:10px}.format-label{display:none}.add-button{margin-left:auto}.clock-grid{grid-template-columns:1fr}.clock-card{height:229px}.time{font-size:68px}.country{display:inline}.footer{flex-direction:column;gap:8px}.sky{width:50%}}
  @media(prefers-reduced-motion:no-preference){.add-button,.remove,.city-option{transition:background .18s ease}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.8 2.3" stroke-linecap="round"/></svg></span><span>Horizon</span></div>
    <div class="top-right"><span class="live-dot"></span><span>Keeping you in sync</span></div>
  </header>
  <main>
    <div class="intro"><div><p class="eyebrow">Your world clock</p><h1>Everywhere, right now.</h1><p class="intro-copy">A little perspective on the time we share.</p></div>
      <div class="controls"><span class="format-label">Time format</span><div class="switch" role="group" aria-label="Time format"><button id="format12" type="button">12h</button><button id="format24" type="button">24h</button></div><button class="add-button" id="openModal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add city</button></div>
    </div>
    <div class="section-head"><h2>Your places</h2><span id="placeCount"></span></div>
    <div class="clock-grid" id="clockGrid"></div>
    <div class="footer"><div class="footer-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 2.5 4.5 5.5 4.5 9S15 18.5 12 21c-3-2.5-4.5-5.5-4.5-9S9 5.5 12 3z"/></svg><span>All around the world, <b>in one place.</b></span></div><span>Times update automatically</span></div>
  </main>
</div>
<div class="modal-backdrop" id="modal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription">
    <div class="modal-head"><div><h2 id="modalTitle">Add a place</h2><p id="modalDescription">Find a city to add to your world clock.</p></div><button class="close" id="closeModal" aria-label="Close city picker">&times;</button></div>
    <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/></svg><input class="search" id="search" type="search" placeholder="Search cities or countries" autocomplete="off" aria-label="Search cities or countries"></div>
    <div class="city-list" id="cityList"></div><div class="modal-foot">Select a city to add it to your places</div>
  </section>
</div>
<script>
const cities = [
 ['Amsterdam','Netherlands','Europe/Amsterdam'],['Athens','Greece','Europe/Athens'],['Auckland','New Zealand','Pacific/Auckland'],['Bangkok','Thailand','Asia/Bangkok'],['Barcelona','Spain','Europe/Madrid'],['Beijing','China','Asia/Shanghai'],['Berlin','Germany','Europe/Berlin'],['Bogotá','Colombia','America/Bogota'],['Boston','United States','America/New_York'],['Buenos Aires','Argentina','America/Argentina/Buenos_Aires'],['Cairo','Egypt','Africa/Cairo'],['Cape Town','South Africa','Africa/Johannesburg'],['Chicago','United States','America/Chicago'],['Copenhagen','Denmark','Europe/Copenhagen'],['Delhi','India','Asia/Kolkata'],['Denver','United States','America/Denver'],['Dubai','United Arab Emirates','Asia/Dubai'],['Dublin','Ireland','Europe/Dublin'],['Hong Kong','Hong Kong','Asia/Hong_Kong'],['Honolulu','United States','Pacific/Honolulu'],['Istanbul','Turkey','Europe/Istanbul'],['Jakarta','Indonesia','Asia/Jakarta'],['Jerusalem','Israel','Asia/Jerusalem'],['Johannesburg','South Africa','Africa/Johannesburg'],['Karachi','Pakistan','Asia/Karachi'],['Kathmandu','Nepal','Asia/Kathmandu'],['Lagos','Nigeria','Africa/Lagos'],['Lisbon','Portugal','Europe/Lisbon'],['London','United Kingdom','Europe/London'],['Los Angeles','United States','America/Los_Angeles'],['Madrid','Spain','Europe/Madrid'],['Manila','Philippines','Asia/Manila'],['Melbourne','Australia','Australia/Melbourne'],['Mexico City','Mexico','America/Mexico_City'],['Miami','United States','America/New_York'],['Montreal','Canada','America/Toronto'],['Moscow','Russia','Europe/Moscow'],['Mumbai','India','Asia/Kolkata'],['Nairobi','Kenya','Africa/Nairobi'],['New York','United States','America/New_York'],['Oslo','Norway','Europe/Oslo'],['Paris','France','Europe/Paris'],['Perth','Australia','Australia/Perth'],['Prague','Czech Republic','Europe/Prague'],['Reykjavík','Iceland','Atlantic/Reykjavik'],['Rio de Janeiro','Brazil','America/Sao_Paulo'],['Rome','Italy','Europe/Rome'],['San Francisco','United States','America/Los_Angeles'],['Santiago','Chile','America/Santiago'],['São Paulo','Brazil','America/Sao_Paulo'],['Seattle','United States','America/Los_Angeles'],['Seoul','South Korea','Asia/Seoul'],['Shanghai','China','Asia/Shanghai'],['Singapore','Singapore','Asia/Singapore'],['Stockholm','Sweden','Europe/Stockholm'],['Sydney','Australia','Australia/Sydney'],['Taipei','Taiwan','Asia/Taipei'],['Tokyo','Japan','Asia/Tokyo'],['Toronto','Canada','America/Toronto'],['Vancouver','Canada','America/Vancouver'],['Vienna','Austria','Europe/Vienna'],['Warsaw','Poland','Europe/Warsaw'],['Wellington','New Zealand','Pacific/Auckland'],['Zurich','Switzerland','Europe/Zurich']
];
const defaults=['New York','London','Tokyo','Sydney'];
let selected=defaults.slice(),format='12';
try{const stored=JSON.parse(localStorage.getItem('horizon-cities'));if(Array.isArray(stored))selected=[...new Set(stored.filter(name=>cities.some(c=>c[0]===name)))];const saved=localStorage.getItem('horizon-format');if(saved==='12'||saved==='24')format=saved}catch(e){}
const grid=document.getElementById('clockGrid'),modal=document.getElementById('modal'),search=document.getElementById('search'),cityList=document.getElementById('cityList'),openButton=document.getElementById('openModal');
function save(){try{localStorage.setItem('horizon-cities',JSON.stringify(selected));localStorage.setItem('horizon-format',format)}catch(e){}}
function icon(phase){if(phase==='night')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/></svg>';if(phase==='evening')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 17h18M5 20h14M7 15a5 5 0 0 1 10 0M12 3v3M4.9 7.9 7 10M19.1 7.9 17 10"/></svg>';return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'}
function getData(city,now){const tz=city[2];const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const hour=Number(parts.find(p=>p.type==='hour').value),minute=parts.find(p=>p.type==='minute').value;const phase=hour>=5&&hour<12?'morning':hour>=12&&hour<17?'afternoon':hour>=17&&hour<21?'evening':'night';const shownHour=format==='12'?(hour%12||12):String(hour).padStart(2,'0');const date=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'short',day:'numeric'}).format(now);let offset=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName').value.replace('GMT','UTC');return {time:`${shownHour}:${minute}`,ampm:format==='12'?(hour<12?'AM':'PM'):'',phase,date,offset}}
function render(){const now=new Date();document.getElementById('placeCount').textContent=`${selected.length} ${selected.length===1?'place':'places'}`;document.getElementById('format12').classList.toggle('active',format==='12');document.getElementById('format24').classList.toggle('active',format==='24');document.getElementById('format12').setAttribute('aria-pressed',format==='12');document.getElementById('format24').setAttribute('aria-pressed',format==='24');if(!selected.length){grid.innerHTML='<div class="empty"><strong>No places yet</strong><p>Add a city to start keeping time.</p></div>';return}grid.innerHTML=selected.map(name=>{const c=cities.find(x=>x[0]===name),d=getData(c,now);return `<article class="clock-card ${d.phase}"><div class="sky" aria-hidden="true"><div class="stars"></div><div class="orb"></div><div class="land"></div></div><div class="card-content"><div class="card-top"><div class="place"><span class="city">${c[0]}</span><span class="country">${c[1]}</span></div><button class="remove" type="button" data-remove="${c[0]}" aria-label="Remove ${c[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="time-wrap"><span class="time">${d.time}</span><span class="ampm">${d.ampm}</span></div><div class="card-bottom"><span class="date">${d.date} <span style="opacity:.6;font-weight:400">&nbsp; / &nbsp; ${d.offset}</span></span><span class="phase">${icon(d.phase)} ${d.phase[0].toUpperCase()+d.phase.slice(1)}</span></div></div></article>`}).join('')}
function renderOptions(){const q=search.value.trim().toLocaleLowerCase();const matches=cities.filter(c=>(c[0]+' '+c[1]).toLocaleLowerCase().includes(q));cityList.innerHTML=matches.length?matches.map(c=>{const added=selected.includes(c[0]);return `<button class="city-option" type="button" data-city="${c[0]}" ${added?'disabled':''}><span><span class="option-name">${c[0]}</span><span class="option-country">${c[1]}</span></span><span class="option-action">${added?'Added':'+ Add'}</span></button>`}).join(''):'<div class="no-results">No cities found. Try another search.</div>'}
function openModal(){modal.hidden=false;search.value='';renderOptions();requestAnimationFrame(()=>search.focus())}function closeModal(){modal.hidden=true;openButton.focus()}
openButton.addEventListener('click',openModal);document.getElementById('closeModal').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal();if(e.key==='Tab'&&!modal.hidden){const focusable=[...modal.querySelectorAll('button:not(:disabled), input')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});search.addEventListener('input',renderOptions);cityList.addEventListener('click',e=>{const button=e.target.closest('[data-city]');if(!button)return;selected.push(button.dataset.city);save();render();closeModal()});grid.addEventListener('click',e=>{const button=e.target.closest('[data-remove]');if(!button)return;selected=selected.filter(name=>name!==button.dataset.remove);save();render()});['12','24'].forEach(value=>document.getElementById('format'+value).addEventListener('click',()=>{format=value;save();render()}));render();let lastMinute=Math.floor(Date.now()/60000);setInterval(()=>{const minute=Math.floor(Date.now()/60000);if(minute!==lastMinute){lastMinute=minute;const focused=document.activeElement;const city=focused&&focused.dataset?focused.dataset.remove:null;render();if(city){const replacement=[...grid.querySelectorAll('[data-remove]')].find(button=>button.dataset.remove===city);if(replacement)replacement.focus()}}},1000);
</script>
</body>
</html>
