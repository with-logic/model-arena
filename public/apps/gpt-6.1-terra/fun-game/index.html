<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9f4f4">
<title>Fun Game — The little jump club</title>
<style>
:root{--ink:#253d40;--deep:#214a49;--orange:#ff7851;--yellow:#ffcf5c;--paper:#fffbec;--sky:#bcebed;--green:#5eaf84}*{box-sizing:border-box}body{margin:0;background:#d8f1ed;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",sans-serif;min-height:100vh}.page{max-width:1220px;margin:auto;padding:26px 28px 20px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:48px;height:48px;background:var(--orange);border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);transform:rotate(-7deg)}.brand-icon svg{width:33px}.brand-name{font-size:25px;font-weight:1000;letter-spacing:-1.3px;line-height:1}.brand-sub{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-top:5px;color:#59817b}.header-right{display:flex;gap:10px;align-items:center}.sound{border:2px solid var(--ink);border-radius:50%;background:#fffdf3;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--ink)}.sound:hover{transform:translateY(-2px)}.sound:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.sound svg{width:21px;height:21px}.header-note{font-size:13px;font-weight:800;color:#5b807b;margin-right:8px}.game-shell{background:#fff9e8;border:3px solid var(--ink);border-radius:25px;padding:12px;box-shadow:0 8px 0 #789f96,0 13px 0 rgba(37,61,64,.12)}.game{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#a9e4e8;isolation:isolate}.game canvas{display:block;width:100%;aspect-ratio:1200/520;touch-action:manipulation}.hud{position:absolute;top:20px;left:24px;right:24px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.level-pill,.scorebox{background:rgba(255,253,238,.92);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(37,61,64,.8)}.level-pill{border-radius:30px;padding:9px 14px;font-size:12px;font-weight:1000;letter-spacing:.3px;display:flex;gap:7px;align-items:center}.level-pill .dot{width:9px;height:9px;background:#ff8a58;border-radius:50%;border:1.5px solid var(--ink)}.scores{display:flex;gap:8px}.scorebox{border-radius:12px;padding:7px 15px 6px;min-width:92px;text-align:center}.scorebox small{display:block;color:#68847c;text-transform:uppercase;font-size:9px;font-weight:1000;letter-spacing:1.2px}.scorebox strong{font-size:23px;line-height:1.15;letter-spacing:1px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.intro-card{pointer-events:auto;text-align:center;background:#fff9e8;border:3px solid var(--ink);border-radius:22px;padding:22px 32px 23px;box-shadow:6px 7px 0 rgba(37,61,64,.95);max-width:calc(100% - 30px);transform:rotate(-1deg)}.intro-card .tag{color:#d65e3e;font-size:11px;font-weight:1000;letter-spacing:1.5px;text-transform:uppercase}.intro-card h1{font-size:clamp(30px,4vw,49px);line-height:1;letter-spacing:-2px;margin:8px 0 8px}.intro-card p{font-size:14px;font-weight:700;color:#66827a;margin:0 0 17px}.play{border:3px solid var(--ink);border-radius:12px;background:var(--yellow);color:var(--ink);padding:11px 25px;font:1000 16px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--ink);min-width:155px}.play:hover{background:#ffdc79;transform:translateY(-2px)}.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.play .arrow{display:inline-block;margin-left:8px;font-size:18px}.overlay.hidden{display:none}.below{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:25px 2px 0}.how{display:flex;align-items:center;gap:13px}.key{display:flex;align-items:center;gap:5px}.key span{background:#fffdf2;border:2px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);padding:7px 11px;font-size:12px;font-weight:1000}.how-copy strong{display:block;font-size:14px}.how-copy small{display:block;font-size:12px;color:#66877f;margin-top:3px;font-weight:700}.tip{font-size:12px;font-weight:800;color:#66877f;text-align:right}.tip b{color:#df7352}.footer{display:flex;justify-content:center;gap:7px;align-items:center;margin-top:36px;color:#70938a;font-size:12px;font-weight:800}.footer .heart{color:#ef7a62;font-size:16px}button:focus-visible{outline:4px solid #ff9b6f;outline-offset:4px}@media(max-width:700px){.page{padding:18px 14px}.brand-name{font-size:22px}.brand-icon{width:42px;height:42px}.brand-sub{font-size:9px}.header-note{display:none}.game-shell{padding:7px;border-radius:19px}.game{border-radius:12px}.game canvas{aspect-ratio:1.35}.hud{top:10px;left:10px;right:10px}.level-pill{font-size:10px;padding:7px 9px}.scorebox{min-width:64px;padding:5px 8px}.scorebox strong{font-size:17px}.scorebox small{font-size:8px}.intro-card{padding:16px 23px}.intro-card h1{font-size:30px}.intro-card p{font-size:12px;margin-bottom:12px}.play{padding:8px 18px;font-size:14px}.below{align-items:flex-start;margin-top:22px}.how-copy small{max-width:180px}.tip{max-width:120px}.footer{margin-top:28px}}@media(max-width:400px){.tip{display:none}.level-pill{font-size:0}.level-pill .dot{margin:0}.intro-card h1{font-size:27px}}
</style>
</head>
<body>
<main class="page">
<header>
  <div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M6 28c-1-9 3-17 13-18 10-1 15 6 15 16 0 5-5 7-14 7S7 32 6 28Z" fill="#ffd16b" stroke="#253d40" stroke-width="2.5"/><circle cx="15" cy="21" r="2" fill="#253d40"/><circle cx="25" cy="21" r="2" fill="#253d40"/><path d="M17 26q3 3 6 0" stroke="#253d40" stroke-width="2" stroke-linecap="round"/></svg></div><div><div class="brand-name">fun game<span style="color:#f47955">.</span></div><div class="brand-sub">The little jump club</div></div></div>
  <div class="header-right"><span class="header-note">Made for a little joy</span><button class="sound" id="sound" aria-label="Mute sound" title="Toggle sound"><svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12"/></svg></button></div>
</header>
<section class="game-shell" aria-label="Fun Game">
  <div class="game" id="game"><canvas id="canvas" width="1200" height="520" aria-label="A cartoon runner jumping over obstacles"></canvas>
    <div class="hud"><div class="level-pill"><span class="dot"></span><span id="pace">A lovely day for a run</span></div><div class="scores"><div class="scorebox"><small>Score</small><strong id="score">00000</strong></div><div class="scorebox"><small>Best</small><strong id="best">00000</strong></div></div></div>
    <div class="overlay" id="overlay"><div class="intro-card"><div class="tag" id="tag">A tiny adventure awaits</div><h1 id="headline">Ready, set, bounce!</h1><p id="message">Hop over the bumps. See how far you go.</p><button class="play" id="play">Let's play <span class="arrow">→</span></button></div></div>
  </div>
</section>
<div class="below"><div class="how"><div class="key"><span>SPACE</span><span>↑</span></div><div class="how-copy"><strong>Press to jump</strong><small>Or tap anywhere on the game</small></div></div><div class="tip">Keep hopping! <b>It gets faster.</b></div></div>
<div class="footer"><span>Made for play</span><span class="heart">♥</span><span>Stay bouncy</span></div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),paceEl=document.getElementById('pace'),overlay=document.getElementById('overlay'),play=document.getElementById('play'),soundButton=document.getElementById('sound');
let W=1200;const H=520,G=404;let state='ready',score=0,best=0,speed=330,distance=0,spawn=0,obstacles=[],particles=[],last=0,time=0,soundOn=true,audio;
function resizeWorld(){W=window.innerWidth<=700?700:1200;canvas.width=W;if(state==='ready')obstacles=[{x:W-170,w:52,h:69,kind:1}]}
resizeWorld();window.addEventListener('resize',resizeWorld);
try{best=Number(localStorage.getItem('funGameBest'))||0}catch(e){};
const hero={x:205,y:0,vy:0,w:66,h:68,grounded:true};
const pad=n=>String(Math.floor(n)).padStart(5,'0');bestEl.textContent=pad(best);
function tone(type){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;function blip(f1,f2,d,delay=0,wave='sine',vol=.12){const o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(f1,now+delay);o.frequency.exponentialRampToValueAtTime(f2,now+delay+d);g.gain.setValueAtTime(.001,now+delay);g.gain.exponentialRampToValueAtTime(vol,now+delay+.015);g.gain.exponentialRampToValueAtTime(.001,now+delay+d);o.connect(g);g.connect(audio.destination);o.start(now+delay);o.stop(now+delay+d+.01)}if(type==='jump'){blip(420,720,.16,0,'sine',.11);blip(720,950,.09,.08,'sine',.04)}else if(type==='hit'){blip(280,90,.35,0,'sawtooth',.08);blip(160,70,.3,.08,'triangle',.08)}else if(type==='point'){blip(660,880,.1,0,'sine',.07);blip(880,1100,.13,.1,'sine',.07)}else{blip(350,560,.12,0,'triangle',.08);blip(560,800,.15,.09,'triangle',.08)}}catch(e){}}
function rounded(x,y,w,h,r,fill,stroke= null,lw=3){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill,stroke=null,lw=3){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(255,255,247,.78)';ctx.beginPath();ctx.moveTo(-56,10);ctx.bezierCurveTo(-70,-8,-48,-22,-30,-15);ctx.bezierCurveTo(-24,-43,5,-46,18,-22);ctx.bezierCurveTo(41,-33,62,-15,55,7);ctx.quadraticCurveTo(54,15,40,15);ctx.lineTo(-43,15);ctx.quadraticCurveTo(-55,15,-56,10);ctx.fill();ctx.restore()}
function hillLayer(color,base,amp,period,offset){ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=0;x<=W+20;x+=20){let y=base-Math.sin((x+offset)/period)*amp-Math.sin((x+offset)/(period*.47))*amp*.22;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function flower(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#498d68';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-17);ctx.moveTo(0,-7);ctx.lineTo(-6,-11);ctx.stroke();for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(Math.cos(a)*5,-19+Math.sin(a)*5,4,4,color)}ellipse(0,-19,3,3,'#ffcf5c');ctx.restore()}
function scenery(){ctx.fillStyle='#a9e4e8';ctx.fillRect(0,0,W,H);ellipse(1004,92,43,43,'#ffe594');ellipse(1004,92,32,32,'#ffdb70');cloud(170-(distance*.025)%150,85,.85);cloud(600-(distance*.035)%170,125,.6);cloud(890-(distance*.02)%180,64,.75);
 hillLayer('#c6e7b8',307,39,150,distance*.10);hillLayer('#9bd8aa',333,44,175,distance*.18);hillLayer('#6fbd8c',366,36,135,distance*.29);
 // distant little trees
 for(let i=0;i<9;i++){let x=((i*175+100-distance*.30)%1500+1500)%1500-100;let y=338+Math.sin((x+distance*.29)/135)*-16;ctx.strokeStyle='#589d75';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+30);ctx.lineTo(x,y-3);ctx.stroke();ellipse(x,y-6,15,21,'#80c997');ellipse(x-12,y+2,11,14,'#80c997');ellipse(x+12,y+2,11,14,'#80c997')}
 ctx.fillStyle='#f6d78c';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#f9e6b2';ctx.fillRect(0,G+8,W,H-G-8);ctx.strokeStyle='#344c43';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();ctx.fillStyle='#e9c97d';for(let i=0;i<20;i++){let x=((i*105-distance*.8)%1300+1300)%1300-40;rounded(x,G+30+(i%3)*26,18+(i%2)*10,4,3,'#e6c77e')}
 for(let i=0;i<9;i++){let x=((i*170+25-distance*.65)%1450+1450)%1450-50;flower(x,G+5,.65,i%2?'#fff8e3':'#ff9675')}
}
function cactus(o){let x=o.x,y=G-o.h;ctx.save();ctx.translate(x,y);let c=o.kind===1?'#7cbf83':'#70b886';ellipse(o.w/2,o.h+3,o.w*.65,5,'rgba(45,69,55,.16)');ctx.strokeStyle='#315247';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(o.w*.28,o.h);ctx.lineTo(o.w*.28,o.h*.55);ctx.lineTo(o.w*.1,o.h*.52);ctx.quadraticCurveTo(0,o.h*.5,0,o.h*.4);ctx.lineTo(0,o.h*.29);ctx.quadraticCurveTo(0,o.h*.2,o.w*.09,o.h*.2);ctx.quadraticCurveTo(o.w*.18,o.h*.2,o.w*.18,o.h*.29);ctx.lineTo(o.w*.18,o.h*.36);ctx.lineTo(o.w*.28,o.h*.38);ctx.lineTo(o.w*.28,o.h*.19);ctx.quadraticCurveTo(o.w*.28,0,o.w*.51,0);ctx.quadraticCurveTo(o.w*.73,0,o.w*.73,o.h*.19);ctx.lineTo(o.w*.73,o.h*.46);ctx.lineTo(o.w*.84,o.h*.43);ctx.lineTo(o.w*.84,o.h*.32);ctx.quadraticCurveTo(o.w*.84,o.h*.24,o.w*.92,o.h*.24);ctx.quadraticCurveTo(o.w,o.h*.24,o.w,o.h*.33);ctx.lineTo(o.w,o.h*.52);ctx.quadraticCurveTo(o.w,o.h*.6,o.w*.9,o.h*.62);ctx.lineTo(o.w*.73,o.h*.65);ctx.lineTo(o.w*.73,o.h);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(40,100,67,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.w*.45,10);ctx.lineTo(o.w*.45,o.h-7);ctx.moveTo(o.w*.6,22);ctx.lineTo(o.w*.6,o.h-8);ctx.stroke();ellipse(o.w*.43,o.h*.55,2.2,3,'#315247');ellipse(o.w*.61,o.h*.55,2.2,3,'#315247');ctx.beginPath();ctx.arc(o.w*.52,o.h*.61,3,0,Math.PI);ctx.strokeStyle='#315247';ctx.lineWidth=2;ctx.stroke();if(o.kind===1){for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(o.w*.51+Math.cos(a)*5,Math.sin(a)*5,4,4,'#ff9b8b')}ellipse(o.w*.51,0,3,3,'#ffdf70')}ctx.restore()}
function drawHero(){let bob=state==='playing'&&hero.grounded?Math.sin(time*15)*2:Math.sin(time*3)*1.5;let x=hero.x,y=G-hero.h-hero.y+bob;let run=state==='playing'&&hero.grounded?Math.sin(time*17):0;ellipse(x+33,G+2,34-hero.y*.07,6,'rgba(45,69,55,.18)');ctx.save();ctx.translate(x+33,y+35);ctx.rotate(hero.grounded?run*.035:-.12);ctx.translate(-33,-35);
 // ears and feet
 ctx.strokeStyle='#344941';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.fillStyle='#f57d56';ctx.beginPath();ctx.ellipse(11,15,9,16,-.45,0,Math.PI*2);ctx.ellipse(53,15,9,16,.45,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(18,60);ctx.lineTo(13+run*6,70);ctx.moveTo(48,60);ctx.lineTo(54-run*6,70);ctx.strokeStyle='#344941';ctx.lineWidth=7;ctx.stroke();
 ctx.beginPath();ctx.moveTo(4,42);ctx.bezierCurveTo(2,18,14,8,33,8);ctx.bezierCurveTo(54,8,65,21,63,43);ctx.bezierCurveTo(62,61,51,66,33,66);ctx.bezierCurveTo(14,66,5,60,4,42);ctx.closePath();ctx.fillStyle='#ff8a5e';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#344941';ctx.stroke();ellipse(33,53,19,9,'#ffa87e');ellipse(21,34,3.3,4.5,'#344941');ellipse(45,34,3.3,4.5,'#344941');ellipse(13,42,5,3,'#f46d5d');ellipse(53,42,5,3,'#f46d5d');ctx.beginPath();ctx.arc(33,39,5,0,Math.PI);ctx.strokeStyle='#344941';ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();ctx.moveTo(8,45);ctx.lineTo(0,40+run*3);ctx.moveTo(59,45);ctx.lineTo(66,39-run*3);ctx.strokeStyle='#344941';ctx.lineWidth=4;ctx.stroke();ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ellipse(p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1}
function draw(){scenery();obstacles.forEach(cactus);drawHero();drawParticles()}
function burst(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:-Math.random()*120,r:2+Math.random()*4,life:.4+Math.random()*.25,max:.65,color:['#fff8e0','#ffb775','#e8bc6d'][i%3]})}
function start(){score=0;speed=330;distance=0;spawn=1.55;obstacles=[];particles=[];hero.y=0;hero.vy=0;hero.grounded=true;state='playing';scoreEl.textContent=pad(0);paceEl.textContent='Nice and easy';overlay.classList.add('hidden');tone('start')}
function jump(){if(state!=='playing')return;if(hero.grounded){hero.vy=665;hero.grounded=false;burst(hero.x+25,G,6);tone('jump')}}
function end(){state='over';tone('hit');burst(hero.x+40,G-35,18);if(Math.floor(score)>best){best=Math.floor(score);try{localStorage.setItem('funGameBest',best)}catch(e){}bestEl.textContent=pad(best)}document.getElementById('tag').textContent='A very good run';document.getElementById('headline').textContent='Oopsie daisy!';document.getElementById('message').textContent='You scored '+pad(score)+' points. Ready for another?';play.innerHTML='Play again <span class="arrow">→</span>';overlay.classList.remove('hidden')}
function update(dt){time+=dt;particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}if(state!=='playing')return;distance+=speed*dt;speed=Math.min(610,330+score*.075);let prev=Math.floor(score/100);score+=dt*10;if(Math.floor(score/100)>prev)tone('point');scoreEl.textContent=pad(score);paceEl.textContent=speed>480?'Look at you go!':speed>390?'Picking up the pace':'Nice and easy';hero.y+=hero.vy*dt;hero.vy-=1750*dt;if(hero.y<=0){if(!hero.grounded)burst(hero.x+30,G,5);hero.y=0;hero.vy=0;hero.grounded=true}spawn-=dt;if(spawn<=0){let kind=Math.random()<.35?1:0,h=kind?69:52+Math.random()*10;obstacles.push({x:W+30,w:kind?52:42,h,kind});spawn=(1.28+Math.random()*.65)*(330/speed)**.45}for(const o of obstacles)o.x-=speed*dt;obstacles=obstacles.filter(o=>o.x+o.w>-30);for(const o of obstacles){if(hero.x+54>o.x+7&&hero.x+12<o.x+o.w-7&&G-hero.y-8>G-o.h+7){end();break}}}
function frame(t){let dt=last?Math.min((t-last)/1000,.033):0;last=t;update(dt);draw();requestAnimationFrame(frame)}
play.addEventListener('click',e=>{e.stopPropagation();start()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='playing')jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(e.target===play&&state!=='playing')return;e.preventDefault();if(e.repeat)return;if(state==='playing')jump();else start()}});soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.setAttribute('aria-label',soundOn?'Mute sound':'Turn sound on');document.getElementById('soundIcon').innerHTML=soundOn?'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M19 6c3 3 3 9 0 12"/>':'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/>';if(soundOn)tone('point')});requestAnimationFrame(frame);
})();
</script>
</body>
</html>
