<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI.fm — A little voice playground</title>
<style>
:root{--bg:#e9e9e9;--surface:#f1f1f1;--ink:#202020;--muted:#686868;--line:#d0d0d0;--orange:#ff4f00;--shadow:0 3px 5px #0002, 0 10px 17px #00000012, inset 0 1px 1px #fff;--inset:inset 0 1px 5px #00000020, 0 1px 0 #ffffffa6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:14px}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.app{width:min(100% - 12.5vw, 1680px);margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:25px 0 22px}
header{display:grid;grid-template-columns:16.8% 1fr auto;align-items:start;min-height:117px;gap:18px}
.brand{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;letter-spacing:-1.3px;white-space:nowrap}
.intro{font-size:14px;line-height:1.35;color:#606060;max-width:470px;margin:0}.intro a{display:inline-block;margin-top:13px;color:#222;text-decoration:none}.intro a:hover{text-decoration:underline}
.dev-switch{display:flex;align-items:center;gap:12px;user-select:none}.code-mark{font-size:20px;letter-spacing:-4px;margin-right:3px}.toggle{width:43px;height:26px;border:0;border-radius:20px;background:#d2d2d2;box-shadow:inset 0 1px 3px #0003;position:relative;padding:0}.toggle:before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#f8f8f8;box-shadow:0 2px 4px #0005;transition:transform .2s}.toggle[aria-pressed=true]{background:#ff6a27}.toggle[aria-pressed=true]:before{transform:translateX(17px)}
.section-title{display:flex;align-items:center;gap:9px;color:#666;font-size:14px;line-height:1;margin:0 0 15px;font-weight:400}.section-title:after{content:"";height:1px;flex:1;background:#d1d1d1}
.voice-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.tile{border:1px solid #fff9;background:var(--surface);border-radius:5px;box-shadow:var(--shadow);text-align:left;position:relative;transition:transform .12s,box-shadow .12s;background-clip:padding-box}.tile:hover{transform:translateY(-2px);box-shadow:0 5px 8px #0002,0 12px 20px #00000012,inset 0 1px 1px #fff}.tile:active{transform:translateY(1px);box-shadow:inset 0 2px 5px #0002}.voice{height:99px;padding:13px 12px;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.voice .name{overflow:hidden;text-overflow:ellipsis}.tile-bottom{display:flex;align-items:center;justify-content:space-between;width:100%}.dot{width:7px;height:7px;border-radius:50%;background:#d2d2d2;box-shadow:inset 0 1px 2px #0002}.selected .dot{background:var(--orange);box-shadow:none}.spark{font-family:Arial,sans-serif;font-size:16px;line-height:8px}.random{display:flex;align-items:center;justify-content:center;background:#aaa;color:white;font-size:27px;padding:0}.random svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:42px;flex:1}.vibe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.vibe{height:101px;padding:13px 12px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px}.vibe.random{align-items:center;justify-content:center;font-size:25px}.editor{width:100%;resize:none;border:1px solid #d7d7d7;border-radius:6px;background:#f0f0f0;box-shadow:var(--inset);padding:14px;color:#242424;line-height:1.35;font-size:14px;display:block}.direction{margin-top:10px;height:173px}.script-wrap{position:relative}.script{height:396px;padding-bottom:35px}.count{position:absolute;bottom:14px;right:15px;color:#aaa;font-size:13px;pointer-events:none}.helper{margin-top:9px;color:#858585;font-size:11px;line-height:1.4}.controls{display:grid;grid-template-columns:1fr 1fr 2.03fr;gap:10px;margin-top:30px}.action{height:61px;border-radius:5px;border:1px solid #ffffff80;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:13px;font-size:15px;letter-spacing:.04em;color:#fff}.action svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.4}.download{background:#737373}.share{background:#202020}.play{background:var(--orange);font-size:16px}.action:hover{filter:brightness(.94)}.action:active{transform:translateY(1px)}.play svg{fill:white;stroke:none;width:24px}.play.playing{background:#d94400}
.code-panel{display:none;margin:0 0 20px;background:#202020;color:#f4f4f4;border-radius:5px;padding:16px 18px;position:relative;line-height:1.5;overflow:auto}.code-panel.open{display:block}.code-panel pre{margin:0;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}.copy-code{position:absolute;right:10px;top:10px;border:1px solid #777;color:white;background:#333;padding:6px 10px;border-radius:4px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:#222;color:white;padding:11px 16px;border-radius:5px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.app{width:calc(100% - 64px)}.voice-grid{grid-template-columns:repeat(6,1fr)}.voice{height:85px}.workspace{margin-top:34px}header{grid-template-columns:22% 1fr auto}}
@media(max-width:700px){.app{width:calc(100% - 32px);padding-top:19px}header{grid-template-columns:1fr auto;min-height:0;gap:18px;margin-bottom:32px}.brand{font-size:22px}.intro{grid-row:2;grid-column:1/3;font-size:13px}.intro a{margin-top:9px}.voice-grid{grid-template-columns:repeat(4,1fr);gap:8px}.voice{height:78px;font-size:12px;padding:10px}.workspace{display:block;margin-top:32px}.script-section{margin-top:32px}.vibe-grid{gap:8px}.vibe{height:82px;font-size:12px;padding:10px}.direction{height:150px}.script{height:300px}.controls{grid-template-columns:1fr 1fr;margin-top:25px}.play{grid-column:1/3;grid-row:1}.action{height:55px;font-size:13px}.helper{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand">OpenAI.fm</div>
  <p class="intro">An interactive demo for exploring the possibilities of text to speech.<br><a href="https://platform.openai.com/docs/guides/text-to-speech" target="_blank" rel="noopener">START BUILDING ↗</a></p>
  <div class="dev-switch" title="Show developer code"><span class="code-mark" aria-hidden="true">‹/›</span><button class="toggle" id="codeToggle" aria-label="Show developer code" aria-pressed="false"></button></div>
</header>
<div class="code-panel" id="codePanel"><button class="copy-code" id="copyCode">Copy</button><pre id="codeText"></pre></div>
<section aria-labelledby="voice-heading">
  <h2 class="section-title" id="voice-heading">VOICE</h2>
  <div class="voice-grid" id="voices"></div>
</section>
<div class="workspace">
  <section aria-labelledby="vibe-heading">
    <h2 class="section-title" id="vibe-heading">VIBE</h2>
    <div class="vibe-grid" id="vibes"></div>
    <textarea class="editor direction" id="direction" aria-label="Voice direction" spellcheck="false"></textarea>
  </section>
  <section class="script-section" aria-labelledby="script-heading">
    <h2 class="section-title" id="script-heading">SCRIPT</h2>
    <div class="script-wrap"><textarea class="editor script" id="script" aria-label="Script to read aloud" maxlength="1000" spellcheck="false"></textarea><span class="count" id="count"></span></div>
    <div class="helper" id="status">Edit the script, choose a voice, and press play.</div>
  </section>
</div>
<div class="controls">
  <button class="action download" id="download" title="Download the current script"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v14m-5-5 5 5 5-5M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/></svg><span>DOWNLOAD</span></button>
  <button class="action share" id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V2m-5 5 5-5 5 5M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/></svg><span>SHARE</span></button>
  <button class="action play" id="play"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2 22 12 4 22z"/></svg><span id="playLabel">PLAY</span></button>
</div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const voiceNames=['Alloy','Ash','Ballad','Coral','Echo','Fable','Onyx','Nova','Sage','Shimmer','Verse'];
const presets=[
{name:'Gourmet Chef',direction:"Affect/Personality: An exuberant chef, describing the night's dinner specials to a table of friends.\n\nTone: Passionate about the ingredients and delighted to share a wonderful meal.\n\nPacing: Warm and lively, with a little room to savor each dish.",script:"Ah, buonissima sera, my friends! Tonight, we have something truly special for you.\n\nTo start, a classic bruschetta al pomodoro—crispy bread, sweet tomatoes, a drizzle of olive oil, semplice e perfetto!\n\nFor the main, you must try our slow-braised ossobuco, so tender it falls off the bone, served with rich risotto—golden, creamy, bellissimo!\n\nAnd for dessert? A slice of torta della nonna, delicate pastry and creamy custard, just like Nonna used to make.\n\nMangia bene, enjoy, and buon appetito!",rate:1.03,pitch:1.05},
{name:'Medieval Knight',direction:'Affect: A valiant knight addressing the people of the kingdom.\n\nTone: Grand, brave, and full of conviction.\n\nPacing: Measured and dramatic, with a pause before each proclamation.',script:'Hear ye, good people of the realm! A new day dawns upon our kingdom.\n\nGather your courage, ready your steeds, and let us ride forth together. For the greatest adventures are not found on maps, but in the stories we make along the way.\n\nOnward, my friends!',rate:.88,pitch:.85},
{name:'Old-Timey',direction:'Affect: A bright radio announcer from a bygone era.\n\nTone: Cheerful, theatrical, and a little nostalgic.\n\nPacing: Crisp and energetic, as if broadcasting to the whole town.',script:"Well, hello there, ladies and gentlemen! You're tuned in to the brightest little show on the dial.\n\nWherever this fine day finds you, take a moment to sit back, put your feet up, and enjoy the magic of a good story.\n\nStay tuned, folks—the best is yet to come!",rate:1.08,pitch:1.1},
{name:'Sincere',direction:'Affect: A thoughtful friend speaking from the heart.\n\nTone: Honest, gentle, and reassuring.\n\nPacing: Natural and unhurried, allowing the words to settle.',script:"Hey, I just wanted to take a moment to say something.\n\nI know things haven't always been easy, but I'm really proud of how far you've come. You don't have to have everything figured out right now.\n\nTake it one day at a time. I'm here, and we're in this together.",rate:.9,pitch:1},
{name:'Serene',direction:'Affect: A calm and grounding guide.\n\nTone: Soft, reassuring, and peaceful.\n\nPacing: Slow and spacious, with gentle pauses between thoughts.',script:'Take a slow, deep breath in. And gently let it go.\n\nLet your shoulders soften. Feel the ground beneath you and notice the quiet space around you.\n\nThere is nowhere else you need to be right now. Just breathe, and allow yourself a moment of calm.',rate:.8,pitch:.95},
{name:'Storyteller',direction:'Affect: A captivating storyteller sharing a tale by the fire.\n\nTone: Curious, expressive, and intimate.\n\nPacing: Unhurried, with a sense of wonder.',script:'Once, in a town at the very edge of the sea, there was a little shop that only appeared when it rained.\n\nIts windows glowed gold against the gray, and its shelves were filled with things people had almost forgotten: lost songs, old dreams, and the smell of summer afternoons.\n\nOne day, someone opened the door.',rate:.9,pitch:1.05},
{name:'Friendly',direction:'Affect: An easygoing, helpful companion.\n\nTone: Bright, approachable, and conversational.\n\nPacing: Relaxed and natural.',script:"Hey there! It's good to see you.\n\nWhether you're starting something new or just taking a little break, I'm glad you're here. Let's make today a good one, shall we?",rate:1,pitch:1.08},
{name:'News Anchor',direction:'Affect: A professional broadcast journalist.\n\nTone: Clear, confident, and composed.\n\nPacing: Steady, with precise articulation.',script:'Good evening, and welcome. Here is what you need to know today.\n\nAcross the world, people are finding new ways to create, connect, and share their ideas. And sometimes, the simplest idea can be the beginning of something extraordinary.\n\nMore on that story after the break.',rate:.95,pitch:.9}
];
let selectedVoice='Coral', selectedVibe=0, vibeOffset=0, speaking=false, timer;
const $=id=>document.getElementById(id), voiceGrid=$('voices'), vibeGrid=$('vibes'), script=$('script'), direction=$('direction');
function shuffleIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c5 0 5 5 9 9s5 5 9 5m-4-4 4 4-4 3M3 19c4 0 5-3 8-6m2-2c3-3 4-6 8-6m-4-3 4 3-4 3"/></svg>'}
function renderVoices(){voiceGrid.innerHTML='';voiceNames.forEach((name,i)=>{let b=document.createElement('button');b.className='tile voice'+(selectedVoice===name?' selected':'');b.setAttribute('aria-pressed',selectedVoice===name);b.innerHTML='<span class="name">'+name+'</span><span class="tile-bottom"><span class="dot"></span>'+([1,2,3,8,10].includes(i)?'<span class="spark">✧</span>':'')+'</span>';b.onclick=()=>{selectedVoice=name;renderVoices();updateCode()};voiceGrid.appendChild(b)});let b=document.createElement('button');b.className='tile voice random';b.title='Surprise me with a voice';b.setAttribute('aria-label','Choose a random voice');b.innerHTML=shuffleIcon();b.onclick=()=>{let choices=voiceNames.filter(x=>x!==selectedVoice);selectedVoice=choices[Math.floor(Math.random()*choices.length)];renderVoices();updateCode()};voiceGrid.appendChild(b)}
function renderVibes(){vibeGrid.innerHTML='';for(let i=0;i<5;i++){let n=(vibeOffset+i)%presets.length,p=presets[n],b=document.createElement('button');b.className='tile vibe'+(selectedVibe===n?' selected':'');b.setAttribute('aria-pressed',selectedVibe===n);b.innerHTML='<span>'+p.name+'</span><span class="dot"></span>';b.onclick=()=>selectVibe(n);vibeGrid.appendChild(b)}let b=document.createElement('button');b.className='tile vibe random';b.setAttribute('aria-label','Show more vibes');b.title='Show more vibes';b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V3l-3 3a8 8 0 0 0-13 5M4 17v4l3-3a8 8 0 0 0 13-5"/></svg>';b.onclick=()=>{vibeOffset=(vibeOffset+3)%presets.length;renderVibes()};vibeGrid.appendChild(b)}
function selectVibe(n){selectedVibe=n;direction.value=presets[n].direction;script.value=presets[n].script;renderVibes();update();stop()}
function update(){ $('count').textContent=script.value.length+' / 1000';updateCode() }
function updateCode(){ $('codeText').textContent='const response = await openai.audio.speech.create({\n  model: "gpt-4o-mini-tts",\n  voice: '+JSON.stringify(selectedVoice.toLowerCase())+',\n  input: '+JSON.stringify(script.value)+',\n  instructions: '+JSON.stringify(direction.value)+'\n});' }
function toast(message){let el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2600)}
function stop(){if('speechSynthesis'in window) speechSynthesis.cancel();speaking=false;$('playLabel').textContent='PLAY';$('playIcon').innerHTML='<path d="M4 2 22 12 4 22z"/>';$('play').classList.remove('playing')}
$('play').onclick=()=>{if(speaking){stop();$('status').textContent='Playback stopped.';return}if(!script.value.trim()){toast('Add a script to play');script.focus();return}if(!('speechSynthesis'in window)){toast('Speech playback is not available in this browser');return}let utter=new SpeechSynthesisUtterance(script.value);let available=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));if(available.length)utter.voice=available[voiceNames.indexOf(selectedVoice)%available.length];utter.rate=presets[selectedVibe].rate;utter.pitch=presets[selectedVibe].pitch;utter.onend=()=>{stop();$('status').textContent='Playback finished. Edit the script or try another voice.'};utter.onerror=()=>{stop();$('status').textContent='Playback could not start. Try again in a supported browser.'};speaking=true;$('playLabel').textContent='STOP';$('playIcon').innerHTML='<rect x="5" y="5" width="14" height="14" rx="1"/>';$('play').classList.add('playing');$('status').textContent='Playing with your browser’s available voices.';speechSynthesis.speak(utter)};
script.addEventListener('input',update);direction.addEventListener('input',updateCode);
$('codeToggle').onclick=function(){let on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);this.setAttribute('aria-label',on?'Hide developer code':'Show developer code');$('codePanel').classList.toggle('open',on);updateCode()};
async function copy(text){try{await navigator.clipboard.writeText(text);return true}catch(e){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();return ok}}
$('copyCode').onclick=async()=>toast(await copy($('codeText').textContent)?'Code copied':'Could not copy code');
$('share').onclick=async()=>{let data={voice:selectedVoice,vibe:selectedVibe,script:script.value,direction:direction.value};let url=new URL(location.href);url.hash=encodeURIComponent(JSON.stringify(data));if(await copy(url.href))toast('Share link copied');else toast('Could not copy link')};
$('download').onclick=()=>{let blob=new Blob([script.value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='openai-fm-script.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Script downloaded')};
renderVoices();renderVibes();selectVibe(0);
try{if(location.hash.length>1){let d=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(voiceNames.includes(d.voice))selectedVoice=d.voice;if(Number.isInteger(d.vibe)&&presets[d.vibe])selectedVibe=d.vibe;if(typeof d.script==='string')script.value=d.script.slice(0,1000);if(typeof d.direction==='string')direction.value=d.direction;renderVoices();renderVibes();update()}}catch(e){}
</script>
</body>
</html>
