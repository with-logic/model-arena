<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar System Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050b; --glass:rgba(13,16,28,.72); --glass2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.09); --txt:#e9ecf5; --dim:#8d94ab; --accent:#ffb454;
  --disp:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
canvas#gl.drag{cursor:grabbing} canvas#gl.hover{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

/* overlay labels */
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;margin-top:-9px;height:18px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  font:500 10.5px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:rgba(225,230,245,.72);
  text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .25s,color .2s;will-change:transform}
.lbl i{width:14px;height:1px;background:currentColor;opacity:.55}
.lbl.on{opacity:1} .lbl.hot{color:#fff} .lbl.sel{color:var(--accent)}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(255,255,255,.5);opacity:0;transition:opacity .25s;will-change:transform,width,height}
.ring.on{opacity:1}
#selRing{border:1.5px solid var(--accent);box-shadow:0 0 14px -2px var(--accent), inset 0 0 14px -6px var(--accent)}
#selRing::before,#selRing::after{content:"";position:absolute;left:50%;width:1.5px;height:7px;background:var(--accent);margin-left:-.75px}
#selRing::before{top:-10px} #selRing::after{bottom:-10px}
#hovRing{border-style:dashed;border-color:rgba(255,255,255,.55)}

/* glass */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 50px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05)}

/* top bar */
#brand{position:fixed;left:30px;top:20px;display:flex;align-items:center;gap:22px;pointer-events:none;user-select:none}
#brand .logo{width:34px;height:34px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 32%,#fff6d0,#ffc247 38%,#ff7a18 72%,#b93a00);box-shadow:0 0 22px 2px rgba(255,150,40,.55)}
#brand .logo::after{content:"";position:absolute;inset:-9px -13px;border:1px solid rgba(255,255,255,.35);border-radius:50%;transform:rotate(-24deg)}
#brand h1{font:600 17px/1.1 var(--disp);letter-spacing:.02em}
#brand p{font:500 10.5px/1 var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:5px}
#tools{position:fixed;right:18px;top:16px;display:flex;gap:6px;padding:5px;border-radius:14px;z-index:6}
.tbtn{height:34px;min-width:34px;padding:0 11px;border-radius:10px;display:flex;align-items:center;gap:7px;font:500 12px/1 var(--disp);letter-spacing:.04em;color:var(--dim);transition:.18s}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn:hover{background:var(--glass2);color:var(--txt)}
.tbtn.on{color:var(--txt);background:rgba(255,255,255,.09)}
.tbtn.on svg{color:var(--accent)}

/* zoom */
#zoom{position:fixed;left:18px;bottom:22px;display:flex;flex-direction:column;padding:5px;border-radius:14px;gap:2px;z-index:5}
#zoom .tbtn{padding:0;justify-content:center}
#zoom hr{border:0;height:1px;background:var(--line);margin:2px 6px}

/* dock */
#dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);border-radius:22px;padding:10px 12px 12px;max-width:calc(100vw - 150px);z-index:5}
body.panel #dock{left:calc(50% - 190px);max-width:calc(100vw - 530px)}
#dock{transition:left .55s cubic-bezier(.2,.9,.2,1)}
#chips{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:62px;padding:8px 0 6px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font:500 10px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);transition:.18s;position:relative}
.chip b{display:block;width:24px;height:24px;border-radius:50%;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1);box-shadow:inset -3px -3px 6px rgba(0,0,0,.55)}
.chip.sun b{box-shadow:0 0 12px 1px rgba(255,160,50,.7)}
.chip.ringed b::after{content:"";position:absolute;left:-7px;right:-7px;top:8px;height:8px;border:1.5px solid rgba(232,214,170,.8);border-radius:50%;transform:rotate(-18deg)}
.chip:hover{color:var(--txt);background:var(--glass2)} .chip:hover b{transform:scale(1.14)}
.chip.active{color:#fff;background:rgba(255,255,255,.09)}
.chip.active::after{content:"";position:absolute;bottom:1px;width:16px;height:2px;border-radius:2px;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent))}
#ctrl{display:flex;align-items:center;gap:10px}
.cbtn{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);transition:.18s;color:var(--txt)}
.cbtn svg{width:16px;height:16px}
.cbtn:hover{background:rgba(255,255,255,.11)} .cbtn:active{transform:scale(.94)}
.cbtn.primary{background:var(--accent);color:#16110a;border-color:transparent;box-shadow:0 4px 18px -4px var(--accent)}
.cbtn.primary:hover{filter:brightness(1.1)}
.cbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.speed{flex:1;min-width:170px;display:flex;flex-direction:column;gap:7px;padding:0 4px}
.speed .row{display:flex;justify-content:space-between;align-items:baseline;font:500 10px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.speed output{font:600 12px/1 var(--disp);letter-spacing:.03em;text-transform:none;color:var(--txt);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;--p:60%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(255,255,255,.13) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(255,255,255,.13) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent),0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.date{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-left:12px;border-left:1px solid var(--line);min-width:118px}
.date span{font:600 13px/1 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.date button{font:500 10px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:4px 8px;border-radius:7px;border:1px solid var(--line);transition:.18s}
.date button:hover{color:var(--txt);background:var(--glass2)}

/* info panel */
#info{position:fixed;right:18px;top:72px;width:360px;max-height:calc(100vh - 96px);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));opacity:0;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s;z-index:7}
#info.open{transform:none;opacity:1}
#info .scroll{overflow-y:auto;padding:20px 20px 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
#info .glow{position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:var(--accent);filter:blur(80px);opacity:.2;pointer-events:none;transition:background .4s}
.ihead{display:flex;align-items:center;gap:15px;position:relative}
.orb{flex:none;width:58px;height:58px;border-radius:50%;box-shadow:inset -9px -9px 16px rgba(0,0,0,.6),0 0 26px -6px var(--accent);position:relative}
.orb.ringed::after{content:"";position:absolute;left:-15px;right:-15px;top:20px;height:18px;border:2px solid rgba(232,214,170,.75);border-radius:50%;transform:rotate(-18deg)}
.ihead .kind{font:500 10px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.ihead h2{font:700 30px/1.05 var(--disp);letter-spacing:-.01em;margin-top:6px}
#close{position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);transition:.18s}
#close:hover{background:var(--glass2);color:#fff}
.tag{margin-top:14px;font-size:13.5px;line-height:1.55;color:#c3c8d8}
.live{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.live div{background:rgba(10,12,22,.75);padding:10px 12px}
.live small,.stat small{display:block;font:500 9.5px/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.live small::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#58e08a;margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.live b{display:block;margin-top:7px;font:600 15px/1 var(--disp);font-variant-numeric:tabular-nums}
.live em{font-style:normal;font-size:11px;color:var(--dim);font-weight:500;margin-left:3px}
.stats{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--glass2);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.stat b{display:block;margin-top:7px;font:600 14px/1.2 var(--disp)}
.cmp{margin-top:12px;display:flex;align-items:center;gap:14px;background:var(--glass2);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 14px;min-height:76px}
.cmp .balls{display:flex;align-items:center;gap:10px;flex:none;min-width:96px;justify-content:center}
.cmp .balls span{display:block;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.5)}
.cmp p{font-size:12px;line-height:1.5;color:#c3c8d8}.cmp p b{color:#fff;font-family:var(--disp)}
.sect{margin-top:16px;font:500 10px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.desc{margin-top:8px;font-size:13px;line-height:1.62;color:#c9cedd}
.moons{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.moons span{font:500 11.5px/1 var(--disp);padding:6px 10px;border-radius:20px;background:var(--glass2);border:1px solid var(--line)}
.fact{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent);font-size:12.5px;line-height:1.55;color:#dfe3ee}
.fact b{display:block;font:600 10px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.inav{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.inav button{flex:1;height:38px;border-radius:11px;background:var(--glass2);border:1px solid var(--line);font:500 12px/1 var(--disp);display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s;color:#cfd4e3}
.inav button:hover{background:rgba(255,255,255,.11);color:#fff}
.inav svg{width:13px;height:13px}

/* hint & loader */
#hint{position:fixed;left:50%;top:22px;transform:translateX(-50%);padding:9px 16px;border-radius:30px;font:500 12px/1 var(--disp);letter-spacing:.03em;color:#cfd4e3;display:flex;gap:14px;align-items:center;transition:opacity .8s,transform .8s;white-space:nowrap;z-index:4}
#hint.hide{opacity:0;transform:translate(-50%,-12px);pointer-events:none}
#hint kbd{font:600 10px/1 var(--disp);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid var(--line);margin-right:5px;color:#fff}
#hint span+span{padding-left:14px;border-left:1px solid var(--line)}
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#0c1022,#04050b 70%);transition:opacity 1s .1s,visibility 1.1s}
#loader.done{opacity:0;visibility:hidden}
#loader .box{text-align:center;width:min(320px,80vw)}
#loader .sunspin{width:74px;height:74px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff6d0,#ffc247 38%,#ff7a18 72%,#b93a00);box-shadow:0 0 60px 8px rgba(255,140,30,.45);position:relative}
#loader .sunspin::before,#loader .sunspin::after{content:"";position:absolute;inset:-22px;border:1px solid rgba(255,255,255,.18);border-radius:50%;animation:spin 3s linear infinite}
#loader .sunspin::after{inset:-40px;animation-duration:5.5s;border-color:rgba(255,255,255,.1)}
#loader .sunspin::before{border-top-color:#9cc8ff}#loader .sunspin::after{border-top-color:#ffb454}
@keyframes spin{to{transform:rotate(360deg)}}
#loader h3{font:600 20px/1 var(--disp);letter-spacing:.02em;margin-top:44px}
#loader p{font:500 10.5px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:12px;min-height:11px}
#loader .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:20px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a2a,#ffd27a);border-radius:3px;transition:width .25s}
#err{color:#ff9d8a;font-size:13px;line-height:1.5;margin-top:16px;display:none;letter-spacing:0;text-transform:none}

@media (max-width:860px){
  #brand p{display:none} #brand h1{font-size:15px} #brand{left:14px;top:14px}
  #brand .logo{width:28px;height:28px}
  #tools{right:10px;top:10px} .tbtn span{display:none}
  #hint{display:none}
  body.panel #dock,#dock{left:8px;right:8px;bottom:8px;transform:none;max-width:none;padding:8px 10px 10px;border-radius:18px}
  .chip{width:54px}
  .date{min-width:0;padding-left:8px} .date span{font-size:11.5px}
  .speed{min-width:90px}
  .cbtn{width:36px;height:36px}
  #zoom{display:none}
  #info{left:8px;right:8px;width:auto;top:auto;bottom:158px;max-height:44vh;transform:translateY(40px);border-radius:18px}
  #info .scroll{padding:16px 16px 12px}
  .ihead h2{font-size:24px}.orb{width:46px;height:46px}
  .inav{padding:10px 16px 12px}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Interactive 3D solar system"></canvas>
<div class="vignette"></div>
<div id="overlay"><div class="ring" id="hovRing"></div><div class="ring" id="selRing"></div></div>

<div id="brand">
  <div class="logo"></div>
  <div><h1>Solar System Explorer</h1><p>Live orbital positions</p></div>
</div>

<div id="hint" class="glass hide">
  <span><kbd>Drag</kbd>rotate</span><span><kbd>Scroll</kbd>zoom</span><span><kbd>Click</kbd>a planet for details</span><span><kbd>Space</kbd>pause</span>
</div>

<div id="tools" class="glass">
  <button class="tbtn on" id="tOrbits" title="Toggle orbit paths (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-20 12 12)"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg><span>Orbits</span></button>
  <button class="tbtn on" id="tLabels" title="Toggle labels (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/></svg><span>Labels</span></button>
  <button class="tbtn" id="tReset" title="Reset view (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Reset</span></button>
  <button class="tbtn" id="tFull" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="zoom" class="glass">
  <button class="tbtn" id="zIn" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <hr>
  <button class="tbtn" id="zOut" title="Zoom out (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
</div>

<div id="dock" class="glass">
  <div id="chips"></div>
  <div id="ctrl">
    <button class="cbtn" id="rev" title="Reverse time"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12zM21.5 6v12L13 12z"/></svg></button>
    <button class="cbtn primary" id="play" title="Play / pause (Space)"></button>
    <div class="speed">
      <div class="row"><label for="speed">Orbit speed</label><output id="speedOut"></output></div>
      <input type="range" id="speed" min="0" max="100" step="1" value="60" aria-label="Orbit speed">
    </div>
    <div class="date"><span id="date">—</span><button id="now" title="Jump back to today's date">Today</button></div>
  </div>
</div>

<aside id="info" class="glass" aria-live="polite">
  <div class="glow"></div>
  <div class="scroll" id="infoBody"></div>
  <div class="inav">
    <button id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="prevName"></span></button>
    <button id="next"><span id="nextName"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</aside>

<div id="loader"><div class="box">
  <div class="sunspin"></div>
  <h3>Solar System Explorer</h3>
  <p id="loadTxt">Igniting the Sun</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="err"></div>
</div></div>

<script type="module">
const $ = s => document.querySelector(s);
const fail = msg => { const e=$('#err'); e.style.display='block'; e.textContent=msg; $('#loadTxt').textContent='Something went wrong'; };

let THREE;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
catch(e){ try { THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js'); }
  catch(e2){ fail('Could not load the 3D engine (Three.js) from the CDN. Please check your internet connection and reload.'); throw e2; } }

/* ───────────────────────── constants & helpers ───────────────────────── */
const TAU = Math.PI*2, RAD = Math.PI/180, DIST = 30, J2000_UNIX_DAYS = 10957.5;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const frac=x=>x-Math.floor(x);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeNoise(seed){
  const rnd=mulberry(seed), p=new Uint8Array(512), g=new Float32Array(256);
  for(let i=0;i<256;i++){p[i]=i;g[i]=rnd()}
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0,t=p[i];p[i]=p[j];p[j]=t}
  for(let i=0;i<256;i++)p[i+256]=p[i];
  function n(x,y,z){
    let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);
    x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;

    const A=p[X]+Y,B=p[X+1]+Y,AA=p[A]+Z,AB=p[A+1]+Z,BA=p[B]+Z,BB=p[B+1]+Z;

function updateBodies(dSim,dt){
  const sgn=Math.sign(dSim)||1,cap=(rate,max)=>Math.sign(rate)*Math.min(Math.abs(rate),max);
  SUN.mesh.rotation.y+=cap(dSim*TAU/(SUN.rot/24),.25*dt);

    b.rAU=keplerPos(b.el,simDays,b.pos,b.au);b.pivot.position.copy(b.pos);
    b.mesh.rotation.y+=cap(dSim*TAU/(b.rot/24),.45*dt);
    if(b.clouds)b.clouds.rotation.y+=cap(dSim*TAU/(b.rot/24),.45*dt)*1.18+dt*.004;
    for(const m of (b.moons||[])){m.ang+=cap(dSim*TAU/m.P,1.6/Math.sqrt(Math.abs(m.P)+.6)*dt);const d=b.r*m.d;m.mesh.position.set(Math.cos(m.ang)*d,0,-Math.sin(m.ang)*d);m.mesh.rotation.y=m.ang}
    b.orbitMat.uniforms.cur.value=frac(simDays/b.el.P);b.orbitMat.uniforms.dir.value=dir;
    const tgt=(b===selected?1:b===hovered?.9:.6);b.orbitMat.uniforms.opacity.value+=(tgt-b.orbitMat.uniforms.opacity.value)*.12;
  }
  for(const m of beltMats){m.uniforms.days.value=simDays;m.uniforms.px.value=pxScale*DPR}
}
function minDist(){return focus.r*1.45+.15}
function updateCamera(dt){

  if(thetaGoal!==null&&!dragging){let d=(thetaGoal-theta)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;const k=1-Math.exp(-dt*3.2);theta+=d*k;if(phiGoal!==null)phi+=(phiGoal-phi)*k;if(Math.abs(d)<.004)thetaGoal=phiGoal=null}

  if(trans<1){trans=Math.min(1,trans+dt/1.15);const e=trans<.5?4*trans*trans*trans:1-Math.pow(-2*trans+2,3)/2;target.lerpVectors(fromTarget,focus.pos,e)}
  else target.copy(focus.pos);
  const sp=Math.sin(phi);
  camera.position.set(target.x+dist*sp*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*sp*Math.cos(theta));
  camera.lookAt(target);
  const mob=W<=860,gx=selected&&!mob?190:0,gy=selected&&mob?H*.17:0,k=1-Math.exp(-dt*5);
  shift.x+=(gx-shift.x)*k;shift.y+=(gy-shift.y)*k;

  skyGroup.position.copy(camera.position);
}

/* ───────────────────────── overlay (labels, rings, picking) ───────────────────────── */
const overlay=$('#overlay'),selRing=$('#selRing'),hovRing=$('#hovRing');
for(const b of BODIES){const l=document.createElement('div');l.className='lbl';l.innerHTML=`<i></i>${b.name}`;overlay.appendChild(l);b.lbl=l;b.scr={x:0,y:0,r:0,z:0,vis:false,lab:false,lw:70}}
const prio=['jupiter','saturn','earth','sun','mars','neptune','uranus','venus','mercury','pluto'].map(i=>byId[i]);
function placeRing(el,b,pad){const s=b.scr,on=s.vis&&s.r<Math.min(W,H)*.45;el.classList.toggle('on',!!on);if(!on)return;
  const R=Math.max(s.r+pad,11);el.style.width=el.style.height=R*2+'px';el.style.transform=`translate3d(${s.x-R}px,${s.y-R}px,0)`}
function updateOverlay(){
  for(const b of BODIES){const s=b.scr;v3.copy(b.pos).project(camera);
    s.z=camera.position.distanceTo(b.pos);s.vis=v3.z<1&&v3.z>-1;s.x=(v3.x*.5+.5)*W;s.y=(-v3.y*.5+.5)*H;s.r=b.r*pxScale/s.z}
  const placed=[],order=[selected,hovered,...prio].filter((b,i,a)=>b&&a.indexOf(b)===i);
  for(const b of order){const s=b.scr,forced=b===selected||b===hovered;
    let on=s.vis&&s.x>-50&&s.x<W+50&&s.y>-20&&s.y<H+20&&s.r<Math.min(W,H)*.3&&(showLabels||forced);
    const lx=s.x+Math.max(s.r*.9,3)+6,ly=s.y;
    if(on&&!forced)for(const p of placed)if(Math.abs(p.y-ly)<15&&lx<p.x+p.w+6&&p.x<lx+s.lw+6){on=false;break}
    s.lab=on;s.lx=lx;
    if(on){placed.push({x:lx,y:ly,w:s.lw});b.lbl.style.transform=`translate3d(${lx.toFixed(1)}px,${ly.toFixed(1)}px,0)`}
    b.lbl.classList.toggle('on',on);b.lbl.classList.toggle('hot',b===hovered);b.lbl.classList.toggle('sel',b===selected);
  }
  if(selected&&selected.scr.r<64)placeRing(selRing,selected,7);else selRing.classList.remove('on');
  if(hovered&&hovered!==selected)placeRing(hovRing,hovered,5);else hovRing.classList.remove('on');
}
function pick(x,y){let best=null,bz=1e9;
  for(const b of BODIES){const s=b.scr;if(!s.vis)continue;
    const d=Math.hypot(x-s.x,y-s.y),hit=d<Math.max(s.r,13)||(s.lab&&x>s.lx-4&&x<s.lx+s.lw+4&&Math.abs(y-s.y)<11);
    if(hit){const z=d<s.r?s.z-1e5:s.z;if(z<bz){bz=z;best=b}}}
  return best}

/* ───────────────────────── UI ───────────────────────── */
const info=$('#info'),infoBody=$('#infoBody'),chips=$('#chips');
const grad=g=>`radial-gradient(circle at 32% 30%,${g[0]},${g[1]} 55%,${g[2]})`;
for(const b of BODIES){const c=document.createElement('button');c.className='chip'+(b===SUN?' sun':'')+(b.id==='saturn'?' ringed':'');c.style.setProperty('--c',b.color);
  c.innerHTML=`<b style="background:${grad(b.g)}"></b>${b.name}`;c.title=b.name;c.onclick=()=>{touch();select(b)};chips.appendChild(c);b.chip=c}

function sizeCompare(b){
  if(b===EARTH)return `<div class="cmp"><div class="balls"><span style="width:44px;height:44px;background:${grad(EARTH.g)}"></span><span style="width:12px;height:12px;background:${grad(['#eee','#aaa','#555'])}"></span></div><p>The <b>Moon</b> is about <b>27%</b> of Earth’s diameter — unusually large for a moon relative to its planet.</p></div>`;
  const ratio=b.dkm/EARTH.dkm,big=Math.max(ratio,1),eS=Math.max(56/big,3),bS=Math.max(56*ratio/big,3);
  const txt=ratio>=1?`<b>${ratio>=10?ratio.toFixed(0):ratio.toFixed(1)}×</b> the diameter of Earth`:`<b>${(ratio*100).toFixed(0)}%</b> of Earth’s diameter`;
  const vol=Math.pow(ratio,3),vt=vol>=1?`About <b>${vol>=1e6?(vol/1e6).toFixed(1)+' million':vol>=100?(+vol.toPrecision(2)).toLocaleString():vol.toFixed(vol<10?1:0)}</b> Earths would fit inside.`:`It would take <b>${Math.round(1/vol).toLocaleString()}</b> of them to fill Earth.`;
  return `<div class="cmp"><div class="balls"><span title="${b.name}" style="width:${bS}px;height:${bS}px;background:${grad(b.g)}"></span><span title="Earth" style="width:${eS}px;height:${eS}px;background:${grad(EARTH.g)}"></span></div><p>${b.name} is ${txt}. ${vt}</p></div>`;
}
function renderInfo(b){
  info.style.setProperty('--accent',b.color);
  const live=b===SUN?`<div><small>From Earth now</small><b id="lv1">—</b></div><div><small>Light reaches Earth in</small><b id="lv2">—</b></div>`
    :b===EARTH?`<div><small>From Sun now</small><b id="lv1">—</b></div><div><small>Sunlight travel time</small><b id="lv2">—</b></div>`
    :`<div><small>From Sun now</small><b id="lv1">—</b></div><div><small>From Earth now</small><b id="lv2">—</b></div>`;
  const stats=b.stats.concat(b.vel?[['Orbital speed',b.vel+' km/s'],['Axial tilt',b.tilt+'°']]:[]).slice(0,10);
  infoBody.innerHTML=`<div class="ihead"><div class="orb${b.id==='saturn'?' ringed':''}" style="background:${grad(b.g)}"></div>
    <div><div class="kind">${b.kind}</div><h2>${b.name}</h2></div>
    <button id="close" title="Close (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="tag">${b.tag}</p><div class="live">${live}</div>
    <div class="stats">${stats.map(s=>`<div class="stat"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div>
    <div class="sect">Size comparison</div><div style="margin-top:-4px">${sizeCompare(b)}</div>
    <div class="sect">About</div><p class="desc">${b.desc}</p>
    ${b.moons?`<div class="sect">Moons shown</div><div class="moons">${b.moons.map(m=>`<span>${m.name}</span>`).join('')}</div>`:''}
    <div class="fact"><b>Did you know?</b>${b.fact}</div>`;
  infoBody.scrollTop=0;$('#close').onclick=deselect;
  const i=BODIES.indexOf(b),n=BODIES.length;$('#prevName').textContent=BODIES[(i+n-1)%n].name;$('#nextName').textContent=BODIES[(i+1)%n].name;
  updateLive(true);
}
const fmtAU=a=>`${a.toFixed(a<10?3:2)}<em>AU</em>`;
const fmtLight=a=>{const m=a*8.3167;return m<60?`${m.toFixed(1)}<em>min</em>`:`${(m/60).toFixed(2)}<em>hours</em>`};
let liveT=0;
function updateLive(force){
  if(!selected)return;const now=performance.now();if(!force&&now-liveT<200)return;liveT=now;
  const a=$('#lv1'),c=$('#lv2');if(!a)return;const b=selected,dE=b.au.distanceTo(EARTH.au);
  if(b===SUN){a.innerHTML=fmtAU(EARTH.rAU);c.innerHTML=fmtLight(EARTH.rAU)}
  else if(b===EARTH){a.innerHTML=`${(b.rAU*149.5979).toFixed(2)}<em>million km</em>`;c.innerHTML=fmtLight(b.rAU)}
  else{a.innerHTML=fmtAU(b.rAU);c.innerHTML=fmtAU(dE)}
}
function select(b,open=true){
  interacted=true;focus=b;fromTarget.copy(target);trans=0;selected=open?b:null;
  const mob=W<=860;
  distGoal=open?(b===SUN?46:b.r*(b.ring?8.5:b.moons&&b.r>2?8:6.5)*(mob?1.5:1.15)):215;
  for(const x of BODIES)x.chip.classList.toggle('active',x===selected);
  document.documentElement.style.setProperty('--accent',open?b.color:'#ffb454');
  document.body.classList.toggle('panel',open);
  if(open&&b!==SUN){thetaGoal=Math.atan2(-b.pos.x,-b.pos.z)+.62;if(phi<.75||phi>1.5)phiGoal=1.2;else phiGoal=null}else thetaGoal=phiGoal=null;
  if(open){renderInfo(b);info.classList.add('open');b.chip.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}else info.classList.remove('open');
}
function deselect(){select(SUN,false)}
function step(d){const i=BODIES.indexOf(selected||SUN),n=BODIES.length;select(BODIES[(i+d+n)%n])}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);

const playBtn=$('#play'),ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2"/></svg>',ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const setPaused=p=>{paused=p;playBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE};setPaused(false);
playBtn.onclick=()=>setPaused(!paused);
$('#rev').onclick=()=>{dir=-dir;$('#rev').classList.toggle('on',dir<0);showSpeed()};
$('#now').onclick=()=>{simDays=todayDays()};
const slider=$('#speed'),speedOut=$('#speedOut');
function showSpeed(){const v=+slider.value;speed=v===0?1/86400:.01*Math.pow(10,v/20);slider.style.setProperty('--p',v+'%');
  const n=x=>x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2).replace(/\.?0+$/,'')||'0';let s;
  if(v===0)s='Real time';else if(speed<1/24)s=n(speed*1440)+' min / sec';else if(speed<1)s=n(speed*24)+' hours / sec';else if(speed<365.25)s=n(speed)+(speed===1?' day / sec':' days / sec');else s=n(speed/365.25)+' years / sec';
  speedOut.textContent=(dir<0&&v!==0?'−':'')+s}
slider.oninput=showSpeed;showSpeed();
const dateEl=$('#date');let lastDate='';
function showDate(){const d=new Date((simDays+J2000_UNIX_DAYS)*864e5);let s;
  if(isNaN(d))s='—';else{const y=d.getUTCFullYear();s=d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})+', '+(y<0?(-y)+' BC':y);
    if(speed<.5)s=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}
  if(s!==lastDate){dateEl.textContent=s;lastDate=s}}

const tgl=(el,fn)=>{el.onclick=fn};
function setOrbits(v){showOrbits=v;$('#tOrbits').classList.toggle('on',v);orbitLines.forEach(l=>l.visible=v)}
function setLabels(v){showLabels=v;$('#tLabels').classList.toggle('on',v)}
tgl($('#tOrbits'),()=>setOrbits(!showOrbits));tgl($('#tLabels'),()=>setLabels(!showLabels));
function resetView(){deselect();theta=.75;phi=1.08;vTheta=vPhi=0;distGoal=215}
tgl($('#tReset'),resetView);
tgl($('#tFull'),()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{})});
$('#zIn').onclick=()=>{touch();distGoal*=.68};$('#zOut').onclick=()=>{touch();distGoal*=1.45};

const hint=$('#hint');let hintTimer;
function touch(){interacted=true;if(!hintTimer)hintTimer=setTimeout(()=>hint.classList.add('hide'),4500)}

/* pointer controls */
const ptrs=new Map();let downX=0,downY=0,moved=0,pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;thetaGoal=phiGoal=null;downX=e.clientX;downY=e.clientY;moved=0;vTheta=vPhi=0;canvas.classList.add('drag')}
  if(ptrs.size===2){const p=[...ptrs.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);moved=99}
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){const h=pick(e.clientX,e.clientY);if(h!==hovered){hovered=h;canvas.classList.toggle('hover',!!h)}return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){touch();const s=.0052;theta-=dx*s;phi-=dy*s;vTheta=-dx*s;vPhi=-dy*s;if(hovered){hovered=null;canvas.classList.remove('hover')}}}
  else if(ptrs.size===2){const q=[...ptrs.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(pinch>0&&d>0){touch();distGoal*=pinch/d;dist=dist+(distGoal-dist)*.5}pinch=d}
});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){dragging=false;canvas.classList.remove('drag');
    if(moved<=4&&e.type==='pointerup'){touch();const b=pick(e.clientX,e.clientY);if(b)select(b)}}
  pinch=0};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',()=>{if(!dragging&&hovered){hovered=null;canvas.classList.remove('hover')}});
canvas.addEventListener('wheel',e=>{e.preventDefault();touch();const d=e.deltaMode===1?e.deltaY*30:e.deltaY;distGoal*=Math.exp(clamp(d,-240,240)*(e.ctrlKey?.008:.0014))},{passive:false});
canvas.addEventListener('dblclick',e=>{const b=pick(e.clientX,e.clientY);if(!b)deselect()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!==' ')return;const k=e.key;
  if(k===' '){e.preventDefault();setPaused(!paused)}
  else if(k==='Escape')deselect();
  else if(k==='ArrowRight')step(1);else if(k==='ArrowLeft')step(-1);
  else if(k==='ArrowUp'||k===']'){slider.value=Math.min(100,+slider.value+5);showSpeed()}
  else if(k==='ArrowDown'||k==='['){slider.value=Math.max(0,+slider.value-5);showSpeed()}
  else if(k==='+'||k==='='){touch();distGoal*=.75}else if(k==='-'||k==='_'){touch();distGoal*=1.33}
  else if(k==='o'||k==='O')setOrbits(!showOrbits);else if(k==='l'||k==='L')setLabels(!showLabels);
  else if(k==='r'||k==='R')resetView();else if(k==='f'||k==='F')$('#tFull').click();
  else if(/^[0-9]$/.test(k)&&BODIES[+k]){touch();select(BODIES[+k])}
});
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;if(camera.view)camera.clearViewOffset();camera.updateProjectionMatrix();
  pxScale=H/(2*Math.tan(camera.fov*RAD/2));for(const b of BODIES)b.scr.lw=b.lbl.offsetWidth||70}
addEventListener('resize',resize);

/* ───────────────────────── boot ───────────────────────── */
let last=performance.now(),clock=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;clock+=dt;
  const dSim=paused?0:dt*speed*dir;simDays+=dSim;
  sunMat.uniforms.t.value=clock;starMat.uniforms.t.value=clock;
  updateBodies(dSim,dt);updateCamera(dt);updateOverlay();updateLive();showDate();
  renderer.render(scene,camera);
}
(async()=>{
  try{
    const bar=$('#loadBar'),txt=$('#loadTxt');
    for(let i=0;i<tasks.length;i++){txt.textContent=tasks[i][0];bar.style.width=(i/tasks.length*100)+'%';await new Promise(r=>setTimeout(r,30));tasks[i][1]()}
    txt.textContent='Setting planets in motion';bar.style.width='100%';await new Promise(r=>setTimeout(r,30));
    buildScene();resize();updateBodies(0,0);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);
    requestAnimationFrame(t=>{last=t;frame(t)});
    $('#loader').classList.add('done');
    setTimeout(()=>{if(!interacted)hint.classList.remove('hide')},1400);
    const h=byId[location.hash.slice(1).toLowerCase()];if(h){select(h);interacted=true;dist=distGoal;trans=1;if(thetaGoal!==null){theta=thetaGoal;thetaGoal=null}}
    window.__solar={BODIES,select,deselect,get state(){return{simDays,dist,distGoal,selected:selected&&selected.id}}};
  }catch(e){console.error(e);fail('The scene failed to initialise: '+e.message)}
})();
</script>
</body>
</html>
