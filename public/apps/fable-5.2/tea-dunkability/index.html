<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Dunkability Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110d0a; --bg2:#1d140d; --ink:#f6ebdc; --muted:#bfad97; --faint:#8d7c69;
  --card:rgba(255,238,214,.055); --card2:rgba(255,238,214,.07); --card-b:rgba(255,232,200,.14);
  --shadow:0 24px 60px -24px rgba(0,0,0,.7);
  --accent:#f2a950; --accent-ink:#2a1806; --good:#8ed3a2; --warn:#f3c555; --bad:#f27660; --cool:#8dbfe0;
  --tea:#e0934a; --track:rgba(255,232,200,.13); --grid:rgba(255,232,200,.09);
  --orb1:#a8500f; --orb2:#5b2a3c; --orb3:#3a4a2a;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f1e4d1; --bg2:#f8efe2; --ink:#2a1b10; --muted:#665241; --faint:#8f7a66;
  --card:rgba(255,255,255,.5); --card2:rgba(255,255,255,.55); --card-b:rgba(255,255,255,.85);
  --shadow:0 24px 50px -28px rgba(96,56,16,.45);
  --accent:#b55e0c; --accent-ink:#fff7ec; --good:#23804d; --warn:#9a6a00; --bad:#c63d27; --cool:#2f7aa8;
  --tea:#a85a14; --track:rgba(70,40,10,.14); --grid:rgba(70,40,10,.1);
  --orb1:#f0b56a; --orb2:#f3c1b0; --orb3:#d9dfae;
}
*{box-sizing:border-box}
html{color-scheme:dark}
[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.orb.a{width:520px;height:520px;left:-120px;top:-140px;background:var(--orb1)}
.orb.b{width:460px;height:460px;right:-100px;top:22%;background:var(--orb2);animation-duration:32s;animation-delay:-8s}
.orb.c{width:520px;height:520px;left:30%;bottom:-260px;background:var(--orb3);animation-duration:38s;animation-delay:-15s;opacity:.4}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
#crumbs{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:26px 24px 40px}

header.top{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#c96f1c);box-shadow:0 8px 22px -8px var(--accent);flex:none}
h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,3vw,34px);letter-spacing:-.02em;margin:0;line-height:1.05}
h1 i{font-weight:500;color:var(--accent)}
.tag{color:var(--muted);font-size:13.5px;margin-top:3px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}

.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--card-b);border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--accent) 16%,var(--card2));border-color:color-mix(in srgb,var(--accent) 50%,var(--card-b))}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#fff)}
.btn svg{flex:none}
kbd{font-family:var(--mono);font-size:10.5px;font-weight:600;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-bottom-width:2px;color:var(--muted);line-height:1}
.btn.primary kbd{color:inherit;border-color:color-mix(in srgb,var(--accent-ink) 30%,transparent);background:color-mix(in srgb,var(--accent-ink) 12%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.card{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--card-b);border-radius:24px;padding:22px;backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);min-width:0}
.c-stage{grid-column:span 5;display:flex;flex-direction:column}
.c-ctrl{grid-column:span 7}
.c-meter{grid-column:span 12}
.c-league{grid-column:span 8}
.c-notes{grid-column:span 4}
@media (max-width:1020px){.c-stage,.c-ctrl,.c-league,.c-notes{grid-column:span 12}}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);font-size:13px}

/* stage */
.stage{flex:1;display:grid;place-items:center;position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(60% 55% at 50% 62%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%)}
.stage svg{display:block;width:100%;max-width:470px;margin:0 auto;aspect-ratio:400/345;height:auto;justify-self:stretch}
.cap{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:6px;min-width:150px}
.cap .ph{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--card-b);padding:5px 10px;border-radius:999px;align-self:flex-start;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.cap .bar{height:4px;border-radius:9px;background:var(--track);overflow:hidden;width:150px}
.cap .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tally{position:absolute;right:12px;top:12px;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-family:var(--mono);font-weight:600}
.steam path{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;opacity:0;animation:steam var(--sd,4s) ease-in-out infinite}
[data-theme="light"] .steam path{stroke:#8c7a66}
@keyframes steam{0%{transform:translate(0,16px);opacity:0}30%{opacity:var(--so,.3)}100%{transform:translate(10px,-38px);opacity:0}}
.verdict{display:flex;gap:12px;align-items:flex-start;margin:16px 2px 14px;min-height:64px}
.vicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:18px;background:color-mix(in srgb,var(--tone) 18%,transparent);color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 40%,transparent)}
.verdict h3{margin:0;font-family:var(--display);font-size:19px;font-weight:600;color:var(--tone);letter-spacing:-.01em}
.verdict p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--grid);border-radius:14px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.tile .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:1px}

/* controls */
.sl{padding:12px 0;border-top:1px solid var(--grid)}
.sl:first-of-type{border-top:0;padding-top:2px}
.sl-top{display:flex;align-items:center;gap:10px}
.sl-top label{font-weight:600;font-size:14.5px}
.keys{display:inline-flex;gap:4px}
.sl-top output{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sl-top output small{font-size:12px;color:var(--muted);margin-left:2px;font-weight:500}
.sl-top output.name{font-family:var(--display);font-size:19px;letter-spacing:-.01em}
.sl-bot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);gap:10px}
.sl-bot em{font-style:normal;color:var(--muted);font-weight:500;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:2px 0 0;display:block;--pos:calc(12px + (100% - 24px) * var(--f,0))}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--fill,var(--accent)) var(--pos),var(--track) var(--pos))}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--fill,var(--accent))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6e4,#e7c58c 70%,#c9995a);border:2px solid var(--fill,var(--accent));box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6e4,#e7c58c 70%,#c9995a);border:2px solid var(--fill,var(--accent));box-shadow:0 3px 10px rgba(0,0,0,.4)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--ink);outline-offset:3px}
.bslider{padding:0 6.25%}
.picks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:2px}
.pick{font:inherit;background:none;border:1px solid transparent;border-radius:14px;padding:7px 2px 6px;color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;line-height:1.15;text-align:center;transition:background .2s,transform .2s,color .2s}
.pick svg{width:36px;height:36px;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.pick:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--muted)}
.pick:hover svg{transform:translateY(-2px) rotate(-6deg)}
.pick.on{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink)}
.pick.on svg{transform:scale(1.12)}
@media (max-width:560px){.pick span{display:none}.pick svg{width:30px;height:30px}}
.blurb{margin:10px 0 0;font-size:13.5px;color:var(--muted);font-family:var(--display);font-style:italic}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:16px;border-top:1px solid var(--grid)}

/* meter */
.meter{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){.meter{grid-template-columns:1fr}.gauge{max-width:260px;margin:0 auto}}
.gauge svg{width:100%;height:auto;display:block}
.needle{transition:transform .7s cubic-bezier(.3,1.55,.5,1);transform-origin:110px 112px}
.gz{font-family:var(--display);font-weight:600;font-size:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{flex:none}
.chart{width:100%;touch-action:pan-y;cursor:ew-resize;user-select:none}
.chart svg{display:block;width:100%}
.ax{fill:var(--faint);font-size:11px;font-family:var(--mono)}
.axt{fill:var(--faint);font-size:11px;font-weight:600;letter-spacing:.04em}
.zl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.hint{font-size:12px;color:var(--faint);margin-top:6px}

/* league */
.lrow{font:inherit;color:inherit;width:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 54px;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:5px 8px;cursor:pointer;text-align:left;transition:background .2s}
.lrow:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.lrow.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lname{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.on .lname{color:var(--ink)}
.lname svg{width:24px;height:24px;flex:none}
.ltrack{position:relative;height:14px;border-radius:5px;background:var(--track)}
.ltrack i{position:absolute;top:0;bottom:0;display:block}
.lbar{left:0;border-radius:5px;background:color-mix(in srgb,var(--ink) 26%,transparent);transition:width .35s}
.lwin{background:var(--good);border-radius:3px;min-width:4px;transition:left .35s,width .35s}
.lnow{width:2px;margin-left:-1px;top:-6px!important;bottom:-6px!important;background:var(--accent)}
.lval{font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.laxis{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:12px;padding:6px 8px 0}
.laxis div{position:relative;height:16px}
.laxis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--faint)}
@media (max-width:560px){.lrow,.laxis{grid-template-columns:96px minmax(0,1fr) 46px;gap:8px}.lname svg{display:none}.laxis div span:nth-child(even){display:none}}

/* notes */
.eq{font-family:var(--display);font-size:26px;text-align:center;padding:16px 8px;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--grid);margin-bottom:12px;letter-spacing:.01em}
.eq sup{font-size:.55em}
.eq .fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.8em;line-height:1.15;margin-left:4px}
.eq .fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.eq .fr span:last-child{padding-top:2px}
.facts{list-style:none;margin:0;padding:0}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--grid);font-size:13.5px;color:var(--muted)}
.facts li:first-child{border-top:0}
.facts b{font-family:var(--mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fine{font-size:12.5px;color:var(--faint);margin:10px 0 0}

footer{margin-top:22px;display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;color:var(--faint);font-size:12.5px}
footer span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(8,5,3,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:color-mix(in srgb,var(--bg2) 82%,transparent);animation:pop .28s cubic-bezier(.3,1.4,.5,1)}
.modal ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
@media (max-width:520px){.modal ul{grid-template-columns:1fr}}
.modal li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px;color:var(--muted)}
.modal li span:last-child{display:inline-flex;gap:4px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.boot{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-style:italic;font-size:20px}
@media (prefers-reduced-motion:reduce){.orb,.steam path{animation:none}.steam path{opacity:calc(var(--so,.3)*.7)}.needle,.lbar,.lwin{transition:none}}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div id="root"><div class="boot">Putting the kettle on…</div></div>
<canvas id="crumbs" aria-hidden="true"></canvas>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback,useSyncExternalStore,memo} = React;

/* ───────── helpers ───────── */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const f1=v=>v.toFixed(1);
/* viscosity of water, Pa·s, T in °C */
const eta=T=>2.414e-5*Math.pow(10,247.8/(T+133.15));

/* ───────── biscuits ───────── */
const BISCUITS=[
  {id:'richtea',name:'Rich Tea',shape:'round',deco:'holes',c1:'#e9cb93',c2:'#b48a50',wick:40,tough:.85,blurb:"The dunker's dunker. Tight crumb, low fat, heroic under pressure."},
  {id:'digestive',name:'Digestive',shape:'round',deco:'speckle',c1:'#cb9b5c',c2:'#8c6230',wick:14,tough:.6,blurb:'Wholesome and thirsty. It soaks fast, so keep your nerve and your dunks short.'},
  {id:'chocdig',name:'Choc Digestive',shape:'round',deco:'choc',c1:'#cb9b5c',c2:'#4b2b18',wick:17,tough:.66,blurb:'The chocolate acts as scaffolding. Briefly. Then it melts, and so does your resolve.'},
  {id:'hobnob',name:'Hobnob',shape:'round',deco:'oaty',c1:'#c98f48',c2:'#8a5a22',wick:16,tough:.58,blurb:'Oaty, craggy and absorbent as a sponge. Enormous flavour, alarming half-life.'},
  {id:'gingernut',name:'Ginger Nut',shape:'round',deco:'cracks',c1:'#bd7430',c2:'#7b4315',wick:60,tough:.95,blurb:'Practically geological. Needs a long soak just to become edible.'},
  {id:'shortbread',name:'Shortbread',shape:'rect',deco:'finger',c1:'#eed59d',c2:'#bf9c59',wick:18,tough:.45,blurb:'All butter, no backbone. Delicious, and structurally a liability.'},
  {id:'custard',name:'Custard Cream',shape:'rect',deco:'custard',c1:'#f1da8d',c2:'#c2a045',wick:24,tough:.7,blurb:'Two walls and a cream damp-proof course. Surprisingly resilient.'},

/* ───────── the model ─────────
   Capillary wicking follows Washburn: depth ∝ √(t/η). Wet biscuit loses strength,
   gains weight; the biscuit lets go when load exceeds strength. */
const TMAX=30, STEP=0.1;
function model(b,T,I){
  const tSat=b.wick*eta(T)/eta(60);
  const S0=b.tough*(0.3+0.7*I/100);
  const heat=1+0.006*(T-60);
  const flav=0.55+0.45*clamp((T-40)/45,0,1);
  const at=t=>{
    const s=Math.min(1,Math.sqrt(Math.max(0,t)/tSat));
    const strength=S0*(1-Math.min(1,0.88*Math.pow(s,1.5)*heat));
    const load=0.16+0.14*s;
    const risk=1/(1+Math.exp(-(load-strength)/0.045));
    const flavour=Math.pow(s,0.6)*flav;
    const score=Math.min(100,135*flavour*Math.pow(1-risk,1.2));
    return {t,s,risk,flavour,score};
  };
  const pts=[];let tc=null,best=at(0);
  for(let i=0;i<=Math.round(TMAX/STEP);i++){
    const p=at(i*STEP);pts.push(p);
    if(tc===null&&p.risk>=.5)tc=p.t;
    if(p.score>best.score+1e-9)best=p;
  }
  let lo=best.t,hi=best.t;const th=best.score*.9;
  for(const p of pts){if(p.score>=th){if(p.t<lo)lo=p.t;if(p.t>hi)hi=p.t;}}
  if(tc!==null)hi=Math.min(hi,Math.max(lo,tc-STEP));
  return {tSat,at,pts,tc,tOpt:best.t,best:best.score,lo,hi};
}
const zoneOf=(m,d)=>(m.tc!==null&&d>=m.tc)?'collapse':d<m.lo?'timid':d<=m.hi?'sweet':'risky';

  timid:{tone:'var(--cool)',icon:'~',title:'Timid dip',short:'Barely damp',

  sweet:{tone:'var(--good)',icon:'✓',title:'The perfect dunk',short:'Perfectly dunked',
    text:(b)=>`Soft on the outside, still a spine within. This is the ${b.name} at its very best.`},
  risky:{tone:'var(--warn)',icon:'!',title:'Living dangerously',short:'Just survived',
    text:(b,m,d)=>m.tc!==null?`Still in one piece, but shedding crumbs. You are ${f1(Math.max(.1,m.tc-d))}s from the bottom of the cup.`:'Sodden and sagging, but somehow hanging on.'},
  collapse:{tone:'var(--bad)',icon:'✕',title:'Catastrophic collapse',short:'Lost to the deep',
    text:(b,m)=>`It let go at ${f1(m.tc)}s. Fetch a teaspoon and say a few words.`},

const fresh=(time=0)=>({phase:'approach',pt:0,simT:0,collapsed:false,cT:0,time});
const live={state:fresh(),subs:new Set(),restart:false,
  get:()=>live.state,
  set(s){live.state=s;live.subs.forEach(f=>f());},
  subscribe(f){live.subs.add(f);return()=>live.subs.delete(f);}};
const useLive=()=>useSyncExternalStore(live.subscribe,live.get);
const Y_REST=100,Y_DUNK=243,SURF=239,VB_Y=30,VB_H=345;
function biscuitY(s){
  const jolt=s.collapsed?14*Math.min(1,s.cT/.2):0;
  if(s.phase==='approach')return lerp(Y_REST,Y_DUNK,ease(s.pt/.9));
  if(s.phase==='hold')return Y_DUNK+Math.sin(s.time*3)*1.2-jolt;
  if(s.phase==='lift')return lerp(Y_DUNK-(s.collapsed?14:0),Y_REST,ease(s.pt/.9));
  return Y_REST;
}

/* ───────── crumbs (canvas particles) ───────── */
const Crumbs=(()=>{
  let cv,ctx,parts=[],raf=0,last=0,dpr=1;
  const resize=()=>{if(!cv)return;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;};
  function init(c){cv=c;ctx=c.getContext('2d');resize();addEventListener('resize',resize);}
  function emit(x,y,n,colors,o={}){
    if(!cv)return;
    for(let i=0;i<n;i++){
      const shape=[];for(let k=0;k<5;k++)shape.push(.55+Math.random()*.6);
      parts.push({x:x+(Math.random()-.5)*(o.spread||30),y,vx:(Math.random()-.5)*(o.vx||120),vy:-Math.random()*(o.up||60),
        r:1.4+Math.random()*Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-.5)*12,c:colors[Math.floor(Math.random()*colors.length)],life:0,rest:false,shape});
    }
    if(parts.length>520)parts.splice(0,parts.length-520);
    if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}
  }
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    const floor=innerHeight-2;
    parts=parts.filter(p=>{
      if(!p.rest){
        p.vy+=1000*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        if(p.y>=floor-p.r){p.y=floor-p.r;if(p.vy>160){p.vy*=-.3;p.vx*=.6;p.vr*=.5;}else p.rest=true;}
      }else p.life+=dt;
      const a=p.rest?1-clamp((p.life-2.6)/1.4,0,1):1;
      if(a<=0)return false;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();
      p.shape.forEach((k,i)=>{const an=i/5*6.283,rr=p.r*k;i?ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):ctx.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);});
      ctx.closePath();ctx.fill();ctx.restore();
      return true;
    });
    raf=parts.length?requestAnimationFrame(loop):0;
  }
  return {init,emit};
})();
let stageEl=null;
function emitAt(sx,sy,n,colors,o){
  if(!stageEl)return;const r=stageEl.getBoundingClientRect();
  Crumbs.emit(r.left+sx/400*r.width,r.top+(sy-VB_Y)/VB_H*r.height,n,colors,o);
}

const decoCache={};
function buildDeco(b){
  const R=rng(b.wick*7919+b.name.length*131);const out=[];let k=0;
  const dot=(x,y,r,fill,op=1)=>out.push(<circle key={k++} cx={x.toFixed(1)} cy={y.toFixed(1)} r={r} fill={fill} opacity={op}/>);
  const inDisc=rad=>{const a=R()*6.283,d=Math.sqrt(R())*rad;return[Math.cos(a)*d,Math.sin(a)*d];};
  const ring=(n,rad,r,fill,op,off=0)=>{for(let i=0;i<n;i++){const a=off+i/n*6.283;dot(Math.cos(a)*rad,Math.sin(a)*rad,r,fill,op);}};
  switch(b.deco){
    case 'holes':

      ring(10,28,2,b.c2,.8);ring(5,13.5,2,b.c2,.8,.3);dot(0,0,2,b.c2,.8);break;
    case 'speckle':
      for(let i=0;i<50;i++){const[x,y]=inDisc(41);dot(x,y,.6+R()*1.1,b.c2,.5);}
      ring(6,21,1.9,b.c2,.75);dot(0,0,1.9,b.c2,.75);break;
    case 'oaty':
      for(let i=0;i<58;i++){const[x,y]=inDisc(41);
        out.push(<ellipse key={k++} cx={x.toFixed(1)} cy={y.toFixed(1)} rx={(1.6+R()*2.6).toFixed(1)} ry={(1+R()*1.5).toFixed(1)} transform={`rotate(${Math.round(R()*180)} ${x.toFixed(1)} ${y.toFixed(1)})`} fill={i%2?b.c2:'#f1d08f'} opacity={i%2?.5:.6}/>);}
      break;
    case 'cracks':
      for(let i=0;i<22;i++){const[x,y]=inDisc(40);dot(x,y,.6+R()*.9,b.c2,.45);}
      ['M-30,-12 L-16,-6 L-8,-14 L4,-8 L10,4 L24,8','M-8,-14 L-4,-30 L6,-36','M4,-8 L18,-20 L30,-18','M-16,-6 L-22,10 L-12,24 L-16,34','M10,4 L6,20 L16,32','M-22,10 L-36,14'].forEach(d=>
        out.push(<path key={k++} d={d} fill="none" stroke={b.c2} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" opacity=".75"/>));
      break;
    case 'choc':

        for(let x=-half;x<=half;x+=4)d+=(d?'L':'M')+x.toFixed(1)+','+(y+Math.sin(x/5)*2.4).toFixed(1);
        out.push(<path key={k++} d={d} fill="none" stroke="#6f4329" strokeWidth="2.2" strokeLinecap="round"/>);}
      out.push(<path key={k++} d="M-30,-22 A37,37 0 0 1 -6,-36" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" opacity=".16"/>);
      break;
    case 'finger':
      out.push(<rect key={k++} x="-27" y="-45" width="54" height="90" rx="6" fill="none" stroke={b.c2} strokeWidth="1" opacity=".35"/>);
      for(let r=0;r<6;r++)for(let c=-1;c<=1;c++)dot(c*17,-37.5+r*15,2,b.c2,.8);
      break;
    case 'custard':
      out.push(<rect key={k++} x="-26" y="-44" width="52" height="88" rx="6" fill="none" stroke={b.c2} strokeWidth="1.6" opacity=".7"/>);
      out.push(<polygon key={k++} points="0,-20 13,0 0,20 -13,0" fill="none" stroke={b.c2} strokeWidth="1.8" opacity=".8"/>);
      out.push(<polygon key={k++} points="0,-9 6,0 0,9 -6,0" fill={b.c2} opacity=".55"/>);
      [[-14,-31],[14,-31],[-14,31],[14,31]].forEach(([x,y])=>{
        out.push(<circle key={k++} cx={x} cy={y} r="6" fill="none" stroke={b.c2} strokeWidth="1.6" opacity=".7"/>);dot(x,y,1.8,b.c2,.7);});
      out.push(<path key={k++} d="M-5,-31 H5 M-5,31 H5" stroke={b.c2} strokeWidth="1.6" strokeLinecap="round" opacity=".7"/>);

      <g className="needle" style={{transform:`rotate(${-90+risk*180}deg)`}}>
        <path d="M106.5,112 L110,38 L113.5,112 Z" fill="var(--ink)"/>
      </g>
      <circle cx="110" cy="112" r="9" fill="var(--ink)"/><circle cx="110" cy="112" r="4" fill="var(--accent)"/>
      <text x="110" y="146" textAnchor="middle" style={{font:'600 24px var(--mono)',fill:'var(--ink)'}}>{Math.round(risk*100)}%</text>
      <text x="110" y="164" textAnchor="middle" className="gz" style={{fill:z.tone}}>{z.title}</text>
    </svg>

}
function useWidth(){
  const ref=useRef();const[w,setW]=useState(640);
  React.useLayoutEffect(()=>{const el=ref.current,m=()=>setW(el.clientWidth||640);m();const ro=new ResizeObserver(m);ro.observe(el);addEventListener('resize',m);return()=>{ro.disconnect();removeEventListener('resize',m);};},[]);
  return[ref,w];
}
function Playhead({X,Y,m,top,bottom}){
  const st=useLive();
  if(st.phase!=='hold'||st.collapsed)return null;
  const x=X(st.simT);
  return <g pointerEvents="none"><line x1={x} x2={x} y1={top} y2={bottom} stroke="var(--ink)" strokeWidth="1" opacity=".35"/>
    <circle cx={x} cy={Y(m.at(st.simT).risk)} r="3.5" fill="var(--ink)"/></g>;
}
function Chart({m,dunk,setDunk,zone}){
  const[ref,w]=useWidth();
  const H=276,M={l:44,r:14,t:36,b:34};
  const base=m.tc!==null?m.tc*1.8:TMAX;
  const xMax=clamp(Math.ceil(Math.max(base,10,dunk*1.08)/5)*5,10,TMAX);
  const iw=Math.max(40,w-M.l-M.r),ih=H-M.t-M.b;
  const X=t=>M.l+t/xMax*iw,Y=v=>M.t+(1-v)*ih;
  const paths=useMemo(()=>{
    const pts=m.pts.filter(p=>p.t<=xMax+1e-6);
    const line=f=>pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+','+Y(f(p)).toFixed(1)).join('');
    const risk=line(p=>p.risk);
    return {risk,area:risk+`L${X(xMax)},${Y(0)}L${X(0)},${Y(0)}Z`,sat:line(p=>p.s),score:line(p=>p.score/100)};
  },[m,xMax,iw]);
  const step=xMax<=10?1:xMax<=20?2:5;
  const ticks=[];for(let t=0;t<=xMax;t+=step)ticks.push(t);
  const end=m.tc!==null?Math.min(m.tc,xMax):xMax;
  const segs=[['timid',0,Math.min(m.lo,xMax),'var(--cool)'],['sweet spot',m.lo,Math.min(m.hi,xMax),'var(--good)'],['risky',m.hi,end,'var(--warn)'],['collapse',end,xMax,'var(--bad)']].filter(s=>s[2]-s[1]>0);
  const cur=m.at(dunk),dx=X(Math.min(dunk,xMax)),dy=Y(cur.risk);
  const pillW=96,px=clamp(dx-pillW/2,M.l+2,w-M.r-pillW-2),py=dy<M.t+34?dy+12:dy-32;
  const drag=e=>{const r=e.currentTarget.getBoundingClientRect();setDunk(clamp(Math.round((e.clientX-r.left-M.l)/iw*xMax*10)/10,.5,TMAX));};
  const tone=ZONES[zone].tone;
  return <div className="chart" ref={ref}>
    <svg height={H} role="img" aria-label={`Crumble-o-meter graph for the first ${xMax} seconds. Crumble risk at ${f1(dunk)} seconds is ${Math.round(cur.risk*100)} percent. Sweet spot from ${f1(m.lo)} to ${f1(m.hi)} seconds${m.tc!==null?`, collapse at ${f1(m.tc)} seconds`:''}.`}
      onPointerDown={e=>{e.currentTarget.setPointerCapture(e.pointerId);drag(e);}} onPointerMove={e=>{if(e.buttons&1)drag(e);}}>
      <defs>
        <linearGradient id="riskG" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1={Y(0)} y2={Y(1)}>
          <stop offset="0" stopColor="var(--good)"/><stop offset=".45" stopColor="var(--warn)"/><stop offset=".85" stopColor="var(--bad)"/>
        </linearGradient>
        <linearGradient id="riskA" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1={Y(0)} y2={Y(1)}>
          <stop offset="0" stopColor="var(--warn)" stopOpacity="0"/><stop offset="1" stopColor="var(--bad)" stopOpacity=".3"/>
        </linearGradient>
      </defs>
      {/* sweet-spot band */}
      {m.hi>m.lo&&m.lo<xMax&&<rect x={X(m.lo)} y={M.t} width={Math.max(2,X(Math.min(m.hi,xMax))-X(m.lo))} height={ih} fill="var(--good)" opacity=".1"/>}
      {/* grid */}
      {[0,.25,.5,.75,1].map(v=><g key={v}>
        <line x1={M.l} x2={w-M.r} y1={Y(v)} y2={Y(v)} stroke="var(--grid)" strokeWidth="1" strokeDasharray={v?'':undefined}/>
        <text x={M.l-8} y={Y(v)+4} textAnchor="end" className="ax">{v*100}%</text></g>)}
      {ticks.map(t=><text key={t} x={X(t)} y={H-M.b+17} textAnchor="middle" className="ax">{t}s</text>)}
      <text x={w-M.r} y={H-2} textAnchor="end" className="axt">DUNK TIME</text>
      {/* zone strip */}
      {segs.map(([n,a,z,c])=>{const x0=X(a),ww=X(z)-x0;return <g key={n}>
        <rect x={x0+1} y={M.t-22} width={Math.max(1,ww-2)} height="6" rx="3" fill={c} opacity=".85"/>
        {ww>n.length*7.5+8&&<text x={x0+ww/2} y={M.t-26} textAnchor="middle" className="zl" style={{fill:c}}>{n}</text>}</g>;})}
      {/* series */}
      <path d={paths.area} fill="url(#riskA)"/>
      <path d={paths.sat} fill="none" stroke="var(--tea)" strokeWidth="1.8" strokeDasharray="5 5" strokeLinecap="round"/>
      <path d={paths.score} fill="none" stroke="var(--ink)" strokeWidth="1.6" opacity=".7"/>
      <path d={paths.risk} fill="none" stroke="url(#riskG)" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round"/>
      {/* optimum */}
      {m.tOpt<=xMax&&<g><circle cx={X(m.tOpt)} cy={Y(m.best/100)} r="4" fill="var(--bg)" stroke="var(--good)" strokeWidth="2"/>
        <path d={`M${X(m.tOpt)},${Y(0)+1} l-5,8 h10 Z`} fill="var(--good)"/></g>}
      {/* collapse */}
      {m.tc!==null&&m.tc<=xMax&&<g>
        <line x1={X(m.tc)} x2={X(m.tc)} y1={M.t} y2={Y(0)} stroke="var(--bad)" strokeWidth="1.3" strokeDasharray="3 4"/>
        <text x={X(m.tc)+(X(m.tc)>w-130?-6:6)} y={Y(0)-8} textAnchor={X(m.tc)>w-130?'end':'start'} style={{font:'600 11.5px var(--sans)',fill:'var(--bad)'}}>✕ lets go at {f1(m.tc)}s</text></g>}
      <Playhead X={X} Y={Y} m={m} top={M.t} bottom={Y(0)}/>
      {/* your dunk */}
      <line x1={dx} x2={dx} y1={M.t-8} y2={Y(0)} stroke={tone} strokeWidth="2"/>
      <circle cx={dx} cy={dy} r="10" fill={tone} opacity=".22"/>
      <circle cx={dx} cy={dy} r="5.5" fill={tone} stroke="var(--bg)" strokeWidth="2"/>
      <g transform={`translate(${px},${py})`}>
        <rect width={pillW} height="22" rx="11" fill="var(--bg)" stroke={tone} strokeWidth="1.3"/>
        <text x={pillW/2} y="15" textAnchor="middle" style={{font:'600 11.5px var(--mono)',fill:'var(--ink)'}}>{f1(dunk)}s · {Math.round(cur.risk*100)}%</text>
      </g>
    </svg>
  </div>;
}

/* ───────── league ───────── */
function League({models,sel,setSel,dunk}){
  const pct=t=>(clamp(t,0,TMAX)/TMAX*100)+'%';
  return <div>
    {BISCUITS.map((b,i)=>{const m=models[i],end=m.tc??TMAX;
      return <button key={b.id} className={'lrow'+(i===sel?' on':'')} onClick={()=>setSel(i)} aria-pressed={i===sel}
        aria-label={`${b.name}: ${m.tc===null?'survives beyond 30 seconds':'collapses at '+f1(m.tc)+' seconds'}, sweet spot ${f1(m.lo)} to ${f1(m.hi)} seconds`}>
        <span className="lname"><BiscuitIcon b={b}/>{b.name}</span>
        <span className="ltrack"><i className="lbar" style={{width:pct(end)}}/><i className="lwin" style={{left:pct(m.lo),width:pct(Math.max(0,Math.min(m.hi,end)-m.lo))}}/><i className="lnow" style={{left:pct(dunk)}}/></span>
        <span className="lval">{m.tc===null?'30s+':f1(m.tc)+'s'}</span>
      </button>;})}
    <div className="laxis" aria-hidden="true"><span/><div>{[0,5,10,15,20,25,30].map(t=><span key={t} style={{left:pct(t)}}>{t}s</span>)}</div><span/></div>
  </div>;
}

const I={

};
const SHORTCUTS=[['Play / pause the loop',['Space']],['Previous / next biscuit',['[',']']],['Pick a biscuit',['1','–','8']],['Tea temperature up / down',['Q','A']],['Dunk time up / down',['W','S']],['Structural integrity up / down',['E','D']],['Bigger steps',['Shift']],['Jump to the sweet spot',['O']],['Random experiment',['R']],['Simulation speed',['X']],['Dark / light mode',['T']],['Reset everything',['0']],['This help',['?']],['Close',['Esc']]];
const SPEEDS=[1,2,4];
const DEF={biscuit:1,temp:82,integrity:85};
const defaults=()=>{const m=model(BISCUITS[DEF.biscuit],DEF.temp,DEF.integrity);return{...DEF,dunk:Math.round((m.hi+(m.tc??m.hi+2))/2*10)/10};};
const load=()=>{try{return JSON.parse(localStorage.getItem('dunkability-v1'))||{};}catch(e){return{};}};

/* ───────── app ───────── */
function App(){
  const saved=useMemo(load,[]);
  const[p,setP]=useState(()=>{const d=defaults(),s=saved.p||{};return{
    biscuit:clamp(Math.round(+s.biscuit)||0,0,BISCUITS.length-1)===+s.biscuit?+s.biscuit:d.biscuit,
    temp:isFinite(s.temp)?clamp(+s.temp,40,100):d.temp,dunk:isFinite(s.dunk)?clamp(+s.dunk,.5,TMAX):d.dunk,integrity:isFinite(s.integrity)?clamp(+s.integrity,10,100):d.integrity};});
  const[theme,setTheme]=useState(saved.theme==='light'?'light':'dark');
  const[speed,setSpeed]=useState(SPEEDS.includes(saved.speed)?saved.speed:2);
  const[playing,setPlaying]=useState(true);
  const[help,setHelp]=useState(false);
  const[tally,setTally]=useState({dunks:0,lost:0});

  const set=useCallback((k,fn)=>setP(o=>({...o,[k]:typeof fn==='function'?fn(o[k]):fn})),[]);
  const b=BISCUITS[p.biscuit];
  const models=useMemo(()=>BISCUITS.map(x=>model(x,p.temp,p.integrity)),[p.temp,p.integrity]);
  const m=models[p.biscuit];
  const zone=zoneOf(m,p.dunk);
  const cur=m.at(p.dunk);
  const Z=ZONES[zone];

  useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);
  useEffect(()=>{try{localStorage.setItem('dunkability-v1',JSON.stringify({p,theme,speed}));}catch(e){}},[p,theme,speed]);
  useEffect(()=>{Crumbs.init(document.getElementById('crumbs'));},[]);
  useEffect(()=>{live.restart=true;},[p.biscuit]);

  /* animation engine */
  const P=useRef();P.current={dunk:p.dunk,speed,playing,m,zone,b};
  useEffect(()=>{
    let raf,last=performance.now(),s=live.state,acc=0;
    const loop=now=>{
      raf=requestAnimationFrame(loop);
      const dt=Math.min(.05,(now-last)/1000);last=now;const c=P.current;
      if(live.restart){live.restart=false;s=fresh(s.time);live.set(s);}
      if(!c.playing)return;
      s={...s,time:s.time+dt};
      const cols=[c.b.c1,c.b.c2,c.b.c1,'#e9cf9c'];
      if(s.phase==='approach'){s.pt+=dt;if(s.pt>=.9){s.phase='hold';s.pt=0;s.simT=0;}}
      else if(s.phase==='hold'){
        if(s.collapsed){s.cT+=dt;if(s.cT>=.95){s.phase='lift';s.pt=0;}}
        else{
          s.simT+=dt*c.speed;
          if(c.m.tc!==null&&c.dunk>=c.m.tc&&s.simT>=c.m.tc){s.simT=c.m.tc;s.collapsed=true;s.cT=0;
            emitAt(200,234,54,cols,{up:520,vx:420,spread:80});}
          else if(s.simT>=c.dunk){s.simT=c.dunk;s.phase='lift';s.pt=0;}
        }
      }
      else if(s.phase==='lift'||s.phase==='result'){
        s.pt+=dt;if(s.collapsed)s.cT+=dt;
        const risk=c.m.at(s.simT).risk,y=biscuitY(s),lift=s.phase==='lift';
        let rate=0,ey=y+44;
        if(s.collapsed){rate=lift?16:3;ey=y-6;}
        else if(c.zone==='risky')rate=(lift?16+90*risk:6+26*risk)*(s.phase==='result'&&s.pt>1.5?0:1);
        acc+=rate*dt;
        while(acc>=1){acc-=1;if(ey<SURF||!lift||s.pt>.3)emitAt(200,Math.min(ey,SURF-2),1,cols,{up:30,vx:90,spread:60});}
        if(lift&&s.pt>=.9){s.phase='result';s.pt=0;const lost=s.collapsed;setTally(t=>({dunks:t.dunks+1,lost:t.lost+(lost?1:0)}));}
        else if(!lift&&s.pt>=2){s=fresh(s.time);}
      }
      live.set(s);
    };
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[]);

  /* actions */
  const A=useRef();
  A.current={
    optimal:()=>set('dunk',Math.max(.5,Math.round((m.lo+m.hi)/2*10)/10)),
    random:()=>{const bi=Math.floor(Math.random()*BISCUITS.length),temp=55+Math.round(Math.random()*43),integrity=30+Math.round(Math.random()*14)*5;
      const mm=model(BISCUITS[bi],temp,integrity),top=Math.min(TMAX,(mm.tc??20)*1.5);
      setP({biscuit:bi,temp,integrity,dunk:clamp(Math.round((0.8+Math.random()*top)*10)/10,.5,TMAX)});},
    reset:()=>{setP(defaults());setSpeed(2);setPlaying(true);setTally({dunks:0,lost:0});},
    speed:()=>setSpeed(v=>SPEEDS[(SPEEDS.indexOf(v)+1)%SPEEDS.length]),
    theme:()=>setTheme(t=>t==='dark'?'light':'dark'),
  };
  useEffect(()=>{
    const onKey=e=>{
      if(e.metaKey||e.ctrlKey||e.altKey)return;
      const tag=e.target.tagName,k=e.key.length===1?e.key.toLowerCase():e.key,big=e.shiftKey;
      if(k==='Escape'){setHelp(false);return;}
      if(k==='?'||(k==='/'&&big)||k==='h'){setHelp(h=>!h);e.preventDefault();return;}
      if(k===' '){if(tag==='BUTTON')return;e.preventDefault();setPlaying(v=>!v);return;}
      const N=BISCUITS.length,a=A.current;
      const map={
        '[':()=>set('biscuit',v=>(v+N-1)%N),']':()=>set('biscuit',v=>(v+1)%N),
        q:()=>set('temp',v=>clamp(v+(big?5:1),40,100)),a:()=>set('temp',v=>clamp(v-(big?5:1),40,100)),
        w:()=>set('dunk',v=>clamp(Math.round((v+(big?2:.5))*10)/10,.5,TMAX)),s:()=>set('dunk',v=>clamp(Math.round((v-(big?2:.5))*10)/10,.5,TMAX)),
        e:()=>set('integrity',v=>clamp(v+(big?10:5),10,100)),d:()=>set('integrity',v=>clamp(v-(big?10:5),10,100)),
        o:a.optimal,r:a.random,x:a.speed,t:a.theme,'0':a.reset,
      };
      if(map[k]){map[k]();e.preventDefault();}
      else if(/^[1-8]$/.test(k)){set('biscuit',+k-1);e.preventDefault();}
    };
    window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey);
  },[set]);

  const closeRef=useRef();
  useEffect(()=>{if(help&&closeRef.current)closeRef.current.focus();},[help]);
  const k=clamp((p.temp-40)/60,0,1);
  const tempFill=`color-mix(in oklab, var(--bad) ${Math.round(k*100)}%, var(--cool))`;
  const setDunk=useCallback(v=>set('dunk',v),[set]);
  const setSel=useCallback(v=>set('biscuit',v),[set]);
  const runnier=Math.round((eta(60)/eta(p.temp)-1)*100);

  return <div className="wrap">

      </div>

        <button className="btn" onClick={()=>setHelp(true)}>Shortcuts <kbd>?</kbd></button>
      </div>
    </header>

    <main className="grid">
      <section className="card c-stage" aria-label="Dunk simulation">
        <Stage b={b} m={m} dunk={p.dunk} temp={p.temp} zone={zone} playing={playing} tally={tally}/>
        <div className="verdict" style={{'--tone':Z.tone}} aria-live="polite">
          <div className="vicon" aria-hidden="true">{Z.icon}</div>
          <div><h3>{Z.title}</h3><p>{Z.text(b,m,p.dunk)}</p></div>
        </div>
        <div className="tiles">
          <div className="tile"><div className="k">Dunkability</div><div className="v">{Math.round(cur.score)}<small>/100</small></div></div>
          <div className="tile"><div className="k">Saturation</div><div className="v">{Math.round(cur.s*100)}<small>%</small></div></div>
          <div className="tile"><div className="k">Crumble risk</div><div className="v" style={{color:Z.tone}}>{Math.round(cur.risk*100)}<small>%</small></div></div>
          <div className="tile"><div className="k">Lets go at</div><div className="v">{m.tc===null?'30+':f1(m.tc)}<small>s</small></div></div>
        </div>
      </section>

      <section className="card c-ctrl" aria-label="Experiment controls">
        <div className="ch"><h2>The experiment</h2><span className="eyebrow">Four variables, one biscuit</span></div>
        <div className="sl">
          <div className="sl-top"><label htmlFor="s-b">Biscuit</label><span className="keys" aria-hidden="true"><kbd>[</kbd><kbd>]</kbd></span><output className="name" htmlFor="s-b">{b.name}</output></div>
          <div className="bslider"><input id="s-b" type="range" min="0" max={BISCUITS.length-1} step="1" value={p.biscuit} aria-valuetext={b.name} onChange={e=>set('biscuit',+e.target.value)} style={{'--f':p.biscuit/(BISCUITS.length-1)}}/></div>
          <div className="picks">
            {BISCUITS.map((x,i)=><button key={x.id} className={'pick'+(i===p.biscuit?' on':'')} onClick={()=>set('biscuit',i)} aria-pressed={i===p.biscuit} aria-label={x.name} title={`${x.name} (${i+1})`}><BiscuitIcon b={x}/><span>{x.name}</span></button>)}
          </div>
          <p className="blurb">“{b.blurb}”</p>
        </div>
        <Slider id="s-t" label="Tea temperature" keys={['Q','A']} value={p.temp} min={40} max={100} step={1} onChange={v=>set('temp',v)} vt={`${p.temp} degrees Celsius, ${tempNote(p.temp)}`} note={tempNote(p.temp)} lo="40°" hi="100°" fill={tempFill}>
          {p.temp}<small>°C</small></Slider>
        <Slider id="s-d" label="Dunk time" keys={['W','S']} value={p.dunk} min={.5} max={TMAX} step={.1} onChange={v=>set('dunk',v)} vt={`${f1(p.dunk)} seconds, ${dunkNote(p.dunk)}`} note={dunkNote(p.dunk)} lo="0.5s" hi="30s" fill={Z.tone}>
          {f1(p.dunk)}<small>s</small></Slider>
        <Slider id="s-i" label="Structural integrity" keys={['E','D']} value={p.integrity} min={10} max={100} step={1} onChange={v=>set('integrity',v)} vt={`${p.integrity} percent, ${intNote(p.integrity)}`} note={intNote(p.integrity)} lo="Crumbly" hi="Pristine">
          {p.integrity}<small>%</small></Slider>
        <div className="actions">
          <button className="btn primary" onClick={()=>setPlaying(v=>!v)} aria-pressed={!playing}>{playing?I.pause:I.play}{playing?'Pause':'Play'} <kbd>Space</kbd></button>
          <button className="btn" onClick={()=>A.current.optimal()}>Sweet spot <kbd>O</kbd></button>
          <button className="btn" onClick={()=>A.current.random()}>Randomise <kbd>R</kbd></button>
          <button className="btn" onClick={()=>A.current.speed()} aria-label={`Simulation speed ${speed} times. Change speed.`}>Speed {speed}× <kbd>X</kbd></button>
          <button className="btn" onClick={()=>A.current.reset()}>Reset <kbd>0</kbd></button>
        </div>
      </section>

      <section className="card c-meter" aria-label="Crumble-o-meter">
        <div className="ch">
          <div><h2>Crumble-o-meter</h2><div className="sub">How the {b.name} fares, second by second, at {p.temp}°C.</div></div>
          <div className="legend" aria-hidden="true">
            <span><svg width="22" height="8"><path d="M1,4H21" stroke="var(--bad)" strokeWidth="3.4" strokeLinecap="round"/></svg>Crumble risk</span>
            <span><svg width="22" height="8"><path d="M1,4H21" stroke="var(--tea)" strokeWidth="2" strokeDasharray="5 4"/></svg>Saturation</span>
            <span><svg width="22" height="8"><path d="M1,4H21" stroke="var(--ink)" strokeWidth="1.6" opacity=".7"/></svg>Dunkability</span>
            <span><svg width="12" height="10"><path d="M6,1 l-5,8 h10 Z" fill="var(--good)"/></svg>Best moment</span>
          </div>
        </div>
        <div className="meter">
          <Gauge risk={cur.risk} zone={zone}/>
          <div>
            <Chart m={m} dunk={p.dunk} setDunk={setDunk} zone={zone}/>
            <div className="hint">Drag across the graph to set the dunk time.</div>
          </div>
        </div>
      </section>

      <section className="card c-league" aria-label="Biscuit league">
        <div className="ch">
          <div><h2>The biscuit league</h2><div className="sub">Survival time in this cup of tea. Pick a contender.</div></div>
          <div className="legend" aria-hidden="true">
            <span><svg width="16" height="10"><rect y="1" width="16" height="8" rx="3" fill="var(--ink)" opacity=".28"/></svg>Holds together</span>
            <span><svg width="16" height="10"><rect y="1" width="16" height="8" rx="3" fill="var(--good)"/></svg>Sweet spot</span>
            <span><svg width="6" height="12"><rect x="2" width="2" height="12" fill="var(--accent)"/></svg>Your dunk</span>
          </div>
        </div>
        <League models={models} sel={p.biscuit} setSel={setSel} dunk={p.dunk}/>
      </section>

      <section className="card c-notes" aria-label="Field notes">
        <div className="ch"><h2>Field notes</h2><span className="eyebrow">Washburn's law</span></div>
        <div className="eq" aria-label="L squared equals gamma D t over 4 eta">L<sup>2</sup> = <span className="fr"><span>γ · D · t</span><span>4 · η</span></span></div>
        <ul className="facts">
          <li>Tea viscosity η <b>{(eta(p.temp)*1000).toFixed(2)} mPa·s</b></li>
          <li>Versus a 60°C cup <b>{runnier>=0?runnier+'% runnier':-runnier+'% thicker'}</b></li>
          <li>Fully soaked after <b>{m.tSat>99?'99+':f1(m.tSat)} s</b></li>
          <li>Sweet spot <b>{f1(m.lo)}–{f1(m.hi)} s</b></li>
        </ul>
        <p className="fine">Tea climbs the biscuit's pores by capillary action, with depth growing as √t. Hotter tea is thinner, so it wicks faster — and softens the fats and sugars holding everything together.</p>
      </section>
    </main>

    <footer>
      <span><kbd>Space</kbd> play / pause</span><span><kbd>[</kbd><kbd>]</kbd> biscuit</span><span><kbd>Q</kbd><kbd>A</kbd> temp</span><span><kbd>W</kbd><kbd>S</kbd> time</span><span><kbd>E</kbd><kbd>D</kbd> integrity</span><span><kbd>O</kbd> sweet spot</span><span><kbd>?</kbd> all shortcuts</span>
    </footer>

    {help&&<div className="scrim" onClick={()=>setHelp(false)}>
      <div className="card modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" onClick={e=>e.stopPropagation()}>
        <div className="ch"><h2>Keyboard shortcuts</h2><button ref={closeRef} className="btn" onClick={()=>setHelp(false)}>Close <kbd>Esc</kbd></button></div>
        <ul>{SHORTCUTS.map(([t,ks])=><li key={t}><span>{t}</span><span>{ks.map((x,i)=>x==='–'?<span key={i}>–</span>:<kbd key={i}>{x}</kbd>)}</span></li>)}</ul>
      </div>
    </div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
