<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Theatre — the forecast, staged nightly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Special+Elite&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<style>
:root{
  --gold:#d9b46a; --gold-hi:#f4dca0; --cream:#f3e8d2; --muted:#a8957c; --ink:#0b0709;
  --cosy:#f09a5a; --eerie:#7fe0b4; --heroic:#f1cb58; --crimson:#a3182b;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font-family:'EB Garamond',Georgia,'Times New Roman',serif;font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 376px;height:100vh;height:100dvh}
.stage-col{display:flex;flex-direction:column;min-width:0;min-height:0;background:#070405}
.canvas-wrap{position:relative;flex:1;min-height:0}
canvas.stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}

/* surtitles */
.surtitle{flex:none;display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;height:124px;padding:14px 28px 16px;
  background:linear-gradient(#0c0709,#050304);border-top:1px solid rgba(217,180,106,.5);box-shadow:inset 0 3px 0 #050304, inset 0 4px 0 rgba(217,180,106,.22);cursor:default}
.sur-act{border-right:1px solid rgba(217,180,106,.28);padding-right:18px;height:100%;display:flex;flex-direction:column;justify-content:center}
.sur-act b{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:800;font-size:30px;line-height:1;color:var(--gold-hi)}
.sur-act span{margin-top:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.sur-text{font-family:'Special Elite','Courier New',monospace;font-size:17.5px;line-height:1.5;color:#f6ecd6;text-shadow:0 0 14px rgba(255,214,150,.22);margin:0;max-height:100%;overflow:hidden}
.sur-text .rest{opacity:0}
.caret{display:inline-block;width:.55em;height:1.05em;margin:0 1px -0.18em 1px;background:var(--gold-hi);animation:blink 1s steps(1) infinite;box-shadow:0 0 10px rgba(244,220,160,.7)}
.caret.typing{animation:none}
@keyframes blink{50%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* playbill panel */
.panel{overflow-y:auto;padding:18px 24px 14px;border-left:1px solid rgba(217,180,106,.3);
  background:radial-gradient(120% 60% at 50% 0%,rgba(163,24,43,.2),transparent 60%),linear-gradient(#170d11,#0d0709);
  scrollbar-width:thin;scrollbar-color:#4a3524 transparent}
.mast{text-align:center;padding-bottom:12px}
.mast .the{font-size:11px;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);padding-left:.55em}
.mast h1{margin:2px 0 4px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:800;font-size:37px;line-height:1.02;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fbeab8,#d9b46a 55%,#9a733a);-webkit-background-clip:text;background-clip:text;color:transparent}
.mast p{margin:0;font-size:14px;font-style:italic;color:var(--muted)}
.orn{display:flex;align-items:center;gap:10px;margin:14px 0 9px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(217,180,106,.55))}
.orn::after{transform:scaleX(-1)}

.bill{position:relative;padding:12px 16px 11px;border:1px solid rgba(217,180,106,.45);border-radius:3px;background:rgba(0,0,0,.25);
  box-shadow:inset 0 0 0 3px #120a0d, inset 0 0 0 4px rgba(217,180,106,.18)}
.bill small{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.bill h2{margin:5px 0 3px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:23px;line-height:1.12;color:var(--cream);min-height:52px;display:flex;align-items:center}
.bill .sub{font-size:14.5px;color:#cdbb9f;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:9px;border-top:1px solid rgba(217,180,106,.22);padding-top:10px}
.stats div{text-align:center;border-left:1px solid rgba(217,180,106,.14)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:17px;color:var(--gold-hi);font-variant-numeric:tabular-nums}

.stats b i{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-weight:400;font-size:12px;color:var(--muted)}
.stats span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.acts{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.act{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 5px;border:1px solid rgba(217,180,106,.28);border-radius:5px;background:rgba(255,255,255,.02);
  transition:transform .18s,background .25s,border-color .25s,color .25s;color:#cdbb9f}
.act:hover{transform:translateY(-2px);border-color:var(--gold);color:var(--cream)}
.act .num{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:12px;opacity:.75}
.act .day{font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.act .t{font-size:14px;font-variant-numeric:tabular-nums}
.act canvas{width:26px;height:26px}
.act.on{background:linear-gradient(180deg,#f6dfa4,#cfa659);border-color:#f6dfa4;color:#24140a;box-shadow:0 6px 22px rgba(217,180,106,.28)}
.act:focus-visible,.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

.slider{margin-bottom:5px}
.slider .row{display:flex;align-items:baseline;gap:8px}
.slider label{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:19px;color:var(--col)}
.slider em{flex:1;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider output{font-size:13px;color:var(--cream);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--col) var(--p),rgba(255,255,255,.11) var(--p));box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;border:1px solid rgba(0,0,0,.55);
  background:radial-gradient(circle at 35% 30%,#fff6dc,var(--col) 58%,#3a2412);box-shadow:0 0 14px color-mix(in srgb,var(--col) 70%,transparent);transition:transform .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.11)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--col)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.55);background:radial-gradient(circle at 35% 30%,#fff6dc,var(--col) 58%,#3a2412);box-shadow:0 0 14px var(--col)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:3px 10px 4px;border-radius:99px;border:1px solid rgba(217,180,106,.3);background:transparent;font-size:13.5px;font-style:italic;color:#cdbb9f;transition:all .2s}
.chip:hover{border-color:var(--gold);color:var(--cream);background:rgba(217,180,106,.1)}

.seg{display:grid;grid-template-columns:1fr 1fr;position:relative;border:1px solid rgba(217,180,106,.4);border-radius:99px;padding:3px;background:rgba(0,0,0,.35)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(180deg,#f6dfa4,#cfa659);transition:transform .45s cubic-bezier(.6,.1,.2,1),background .45s}
.seg.night::before{transform:translateX(100%);background:linear-gradient(180deg,#c9d4ff,#7d8fd6)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:8px 0;border-radius:99px;font-size:15px;letter-spacing:.06em;color:#cdbb9f;transition:color .3s}
.seg button.on{color:#1d1109;font-weight:600}
.seg svg{width:16px;height:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{padding:9px 8px;border-radius:5px;border:1px solid rgba(217,180,106,.4);background:rgba(217,180,106,.06);font-size:15px;letter-spacing:.05em;color:var(--cream);transition:all .2s}
.btn:hover{background:rgba(217,180,106,.16);border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,#b81f34,#7c1021);border-color:#d5485c}
.btn.primary:hover{background:linear-gradient(180deg,#cf2a41,#8c1427)}
.btn.active{background:var(--gold);color:#1d1109;border-color:var(--gold-hi)}
.foot{margin-top:11px;text-align:center;font-size:12.5px;color:#7c6c59;font-style:italic;line-height:1.6}
kbd{font-family:'Special Elite',monospace;font-style:normal;font-size:11px;padding:1px 5px;border:1px solid #4a3a2a;border-radius:3px;color:#b9a585}

@media (max-width:940px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .canvas-wrap{height:60vh;min-height:330px;flex:none}
  .surtitle{grid-template-columns:1fr;gap:6px;height:auto;min-height:150px;padding:12px 16px 14px;align-items:start}
  .sur-act{border:0;padding:0;flex-direction:row;align-items:baseline;gap:12px;height:auto}
  .sur-act b{font-size:22px}.sur-act span{margin:0}
  .sur-text{font-size:15.5px}
  .panel{border-left:0;border-top:1px solid rgba(217,180,106,.3)}
}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>

<div id="root"><p style="padding:40px;font-style:italic;color:#a8957c">The house is opening… (this page needs JavaScript and the React CDN.)</p></div>
<script>
(function(){
'use strict';
const {useState,useEffect,useRef,useMemo,useCallback,createElement:h}=React;

  {day:'Monday',   abbr:'Mon',cond:'storm',hi:14,lo:9, wind:46,hum:92,pop:95},

const TITLES={

  storm:{n:'Thunder over Port Merriweather',c:'Candles Against the Thunder',e:'The House That Counts the Lightning',h:'Storm-Breaker'},
  fog:  {n:'A Morning of Fog',c:'The Town in a Woollen Scarf',e:'Something Stands in the Fog',h:'A Beacon in the Grey'},

const LINES={

    e:'Not a cloud. {hi}°. The shadows are slightly too long for the hour, and all of them point at you.',

  wind:{

    c:'The wind rattles the latch and borrows a hat or two. {wind} km/h; scarves are doubled and the soup is on.',
    e:'The wind goes door to door, trying each handle. {wind} km/h. It has learned to say your name.',
    h:'A gale at {wind} km/h! Every banner snaps to attention — lean into it, hero, the horizon is calling.'},
  snow:{
    n:'Snow through the day. High {hi}°, low {lo}°, {pop}% chance it settles.',
    c:'Snow settles soft as sifted sugar. {hi}° — mittens on the radiator, cocoa on the hob, lamplight on everything.',
    e:'It snows, and the town forgets its own sounds. {lo}° by nightfall. One set of footprints leads in. None lead out.',
    h:'Winter takes the throne in white and silver. {hi}° — the pass is hard, the air is clean, the summit waits.'},
  cloud:{
    n:'Overcast and mostly dry. High {hi}°, low {lo}°, wind {wind} km/h.',
    c:'The sky pulls up a grey quilt and sighs. {hi}° — a fine day for a long book and a longer pot of tea.',
    e:'The clouds hang low enough to listen. {hi}°. The weathervane turns slowly to face the audience.',

const MOODNAME={n:'plain-spoken',c:'cosy',e:'eerie',h:'heroic'};

function reading(m){
  const arr=[['c',m.c],['e',m.e],['h',m.h]].sort((a,b)=>b[1]-a[1]);
  const dom=arr[0][1]<0.12?'n':arr[0][0];
  const sec=(dom!=='n'&&arr[1][1]>=0.35&&arr[1][1]>=arr[0][1]*0.5)?arr[1][0]:null;
  return {dom,sec};
}
function compose(f,m,night){
  const {dom,sec}=reading(m);
  const line=LINES[f.cond][dom].replace(/\{(\w+)\}/g,(_,k)=>String(f[k]).replace('-','−'));
  return (night?'[Curtain. Night.] ':'[Curtain. Matinée.] ')+line+(sec?' '+ASIDE[sec]:'');
}

/* ───────────────────────── tiny maths / colour helpers ───────────────────────── */
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

const shade=(c,f,a=1)=>rgb([Math.min(255,c[0]*f),Math.min(255,c[1]*f),Math.min(255,c[2]*f)],a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const smooth=t=>t*t*(3-2*t);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const PAL={
  n:{day:{skyTop:[104,158,206],skyBot:[230,222,196],far:[128,150,172],mid:[92,122,120],near:[58,84,84],floor:[124,86,56],light:[255,244,214],curtain:[146,18,34]},
     night:{skyTop:[12,18,46],skyBot:[54,64,108],far:[38,48,86],mid:[24,34,64],near:[13,20,40],floor:[60,42,40],light:[204,216,255],curtain:[122,14,30]}},
  c:{day:{skyTop:[240,160,104],skyBot:[255,228,172],far:[216,142,112],mid:[176,98,84],near:[118,60,60],floor:[154,94,52],light:[255,214,150],curtain:[172,52,30]},
     night:{skyTop:[40,24,70],skyBot:[156,82,84],far:[96,52,86],mid:[64,34,66],near:[38,20,44],floor:[90,52,40],light:[255,190,112],curtain:[150,42,26]}},
  e:{day:{skyTop:[92,114,102],skyBot:[198,206,160],far:[104,124,114],mid:[62,82,80],near:[30,44,48],floor:[72,68,60],light:[200,255,216],curtain:[76,30,80]},
     night:{skyTop:[6,12,20],skyBot:[40,76,70],far:[26,50,54],mid:[13,29,35],near:[5,12,18],floor:[34,40,42],light:[140,255,200],curtain:[56,22,66]}},
  h:{day:{skyTop:[34,80,170],skyBot:[255,198,96],far:[112,98,154],mid:[126,62,72],near:[70,30,46],floor:[142,86,40],light:[255,228,134],curtain:[166,14,30]},
     night:{skyTop:[14,10,54],skyBot:[182,62,60],far:[72,42,104],mid:[56,24,62],near:[28,11,34],floor:[84,46,36],light:[255,208,120],curtain:[140,10,26]}},
};
const PKEYS=['skyTop','skyBot','far','mid','near','floor','light','curtain'];

/* ───────────────────────── shared icon painter ───────────────────────── */
function cloudPath(ctx,cx,cy,s){
  ctx.beginPath();
  ctx.arc(cx-.3*s,cy+.08*s,.24*s,Math.PI*.5,Math.PI*1.5);
  ctx.arc(cx-.05*s,cy-.12*s,.3*s,Math.PI*1.1,Math.PI*1.9);
  ctx.arc(cx+.3*s,cy+.05*s,.26*s,Math.PI*1.4,Math.PI*.5);
  ctx.closePath();
}
function drawIcon(ctx,cond,cx,cy,r,col){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(1,r*.13);ctx.lineCap='round';ctx.lineJoin='round';
  const L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(cx+a*r,cy+b*r);ctx.lineTo(cx+c*r,cy+d*r);ctx.stroke()};
  if(cond==='sun'){
    ctx.beginPath();ctx.arc(cx,cy,r*.36,0,TAU);ctx.fill();
    for(let i=0;i<8;i++){const a=i/8*TAU;L(Math.cos(a)*.56,Math.sin(a)*.56,Math.cos(a)*.86,Math.sin(a)*.86)}
  }else if(cond==='fog'){
