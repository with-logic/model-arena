<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festival Lights Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --a1:#ff2bd6; --a2:#7a5cff; --a3:#00e5ff;
  --bg:#06040f; --panel:rgba(16,11,32,.78); --line:rgba(255,255,255,.09);
  --txt:#f1ecff; --dim:#9a90bd;
  --disp:'Unbounded','Space Grotesk',system-ui,sans-serif;
  --body:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--a3);outline-offset:2px}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ---------- stage ---------- */
#stageWrap{position:relative;flex:1 1 auto;min-height:180px;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px 26px;
  background:linear-gradient(180deg,rgba(4,2,12,.88),rgba(4,2,12,.45) 60%,transparent);pointer-events:none}
header>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:10px;flex:none;position:relative;
  background:conic-gradient(from 210deg,var(--a1),var(--a2),var(--a3),var(--a1));
  box-shadow:0 0 22px -2px var(--a1);transition:background .6s}
.logo-mark::after{content:"";position:absolute;inset:3px;border-radius:8px;background:#0a0618;
  -webkit-mask:conic-gradient(from 0deg at 50% 0%,transparent 150deg,#000 150deg 165deg,transparent 165deg 172deg,#000 172deg 188deg,transparent 188deg 195deg,#000 195deg 210deg,transparent 210deg);
  mask:conic-gradient(from 0deg at 50% 0%,transparent 150deg,#000 150deg 165deg,transparent 165deg 172deg,#000 172deg 188deg,transparent 188deg 195deg,#000 195deg 210deg,transparent 210deg);
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.2))}
.logo-mark::before{content:"";position:absolute;inset:3px;border-radius:8px;background:#0a0618}
.logo h1{font-family:var(--disp);font-weight:900;font-size:clamp(13px,1.5vw,19px);letter-spacing:.06em;white-space:nowrap;line-height:1;
  background:linear-gradient(90deg,var(--a1),var(--a2) 50%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--dim);margin-top:5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.beat{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:999px;background:rgba(10,6,24,.6);border:1px solid var(--line);backdrop-filter:blur(8px)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .25s,box-shadow .25s,transform .25s}
.dots i.on{background:var(--a3);box-shadow:0 0 12px var(--a3);transform:scale(1.25);transition:none}
.dots i:first-child.on{background:var(--a1);box-shadow:0 0 14px var(--a1)}
.bpmread{font-family:var(--disp);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;min-width:74px}
.bpmread span{font-family:var(--body);font-weight:500;font-size:10px;color:var(--dim);letter-spacing:.14em;margin-left:4px}
.hbtn{height:34px;padding:0 13px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(10,6,24,.6);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--dim);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:all .18s}
.hbtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.hbtn.on{color:#fff;border-color:var(--a1);box-shadow:0 0 16px -4px var(--a1),inset 0 0 14px -6px var(--a1)}
.hbtn .led{width:7px;height:7px;border-radius:50%;background:#4a4168}
.hbtn.on .led{background:var(--a1);box-shadow:0 0 8px var(--a1)}
.hbtn.icon{width:34px;padding:0;justify-content:center}
.hbtn svg{width:15px;height:15px}
#showUI{position:absolute;right:18px;bottom:16px;z-index:6;display:none}
body.hide-ui #showUI{display:flex}
body.hide-ui #console{display:none}
#toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:7;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(10,6,24,.82);border:1px solid var(--a2);box-shadow:0 0 24px -6px var(--a2);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- console ---------- */
#console{flex:none;position:relative;z-index:4;display:grid;grid-template-columns:1.05fr 1.25fr 1.15fr 1.35fr;gap:10px;padding:13px 14px 14px;
  background:linear-gradient(180deg,#0d081d,#070411);border-top:1px solid rgba(255,255,255,.06)}
#console::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--a1),var(--a2),var(--a3),transparent);background-size:200% 100%;animation:slide 6s linear infinite;filter:drop-shadow(0 0 6px var(--a2))}
@keyframes slide{to{background-position:-200% 0}}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:11px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:9px}
.ptitle{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.ptitle::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--a1);box-shadow:0 0 8px var(--a1);transform:rotate(45deg)}
.ptitle em{margin-left:auto;font-family:var(--body);font-style:normal;font-weight:500;letter-spacing:.08em;font-size:10px;color:#6f6594;text-transform:none}

/* music */
.now{display:flex;align-items:center;gap:11px}
#play{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 26px -4px var(--a1),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,background .6s}
#play:hover{transform:scale(1.06)}#play:active{transform:scale(.95)}
#play svg{width:22px;height:22px;fill:#fff}
#play::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--a1);opacity:0;animation:ring 1.8s ease-out infinite}
#play.playing::after{animation:none}
@keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.np{min-width:0;flex:1}
.np b{display:block;font-family:var(--disp);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--a3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini{width:78px;height:40px;flex:none;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--dim);white-space:nowrap;transition:all .15s}
.seg button:hover{color:#fff}
.seg button.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 55%,transparent),color-mix(in srgb,var(--a2) 55%,transparent));box-shadow:0 0 14px -4px var(--a1)}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tracks button{padding:6px 6px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;transition:all .15s;min-width:0}
.tracks button b{display:block;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks button i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin-top:1px;white-space:nowrap}
.tracks button:hover{border-color:rgba(255,255,255,.28)}
.tracks button.on{border-color:var(--a3);box-shadow:0 0 14px -5px var(--a3),inset 0 0 16px -8px var(--a3)}
.row{display:flex;align-items:center;gap:9px;min-width:0}
.lbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex:none;width:44px}
.val{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;width:34px;text-align:right;flex:none}
.tap{flex:none;padding:5px 11px;border-radius:8px;border:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.14em;background:rgba(255,255,255,.04);transition:all .1s}
.tap:active,.tap.hit{background:var(--a3);color:#04121a;border-color:var(--a3);box-shadow:0 0 16px var(--a3)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:18px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--a1),var(--a3)) 0/var(--p) 100% no-repeat,#241b3d}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#241b3d}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--a1),var(--a3))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-5px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 0 14px var(--a3)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 0 14px var(--a3)}

/* pads */
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.pad{position:relative;border-radius:12px;padding:7px 6px 6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(180deg,#1c1433,#120c22);border:1px solid var(--line);color:#b9aede;transition:transform .08s,border-color .15s,box-shadow .15s,color .15s;overflow:hidden}
.pad svg{width:38px;height:24px}
.pad b{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.pad kbd,.sw kbd,.fx kbd{position:absolute;top:4px;right:6px;font:600 9px var(--body);color:#5f5585}
.pad:hover{border-color:rgba(255,255,255,.3);color:#fff}
.pad:active{transform:scale(.95)}
.pad.on{color:#fff;border-color:var(--a1);background:linear-gradient(180deg,color-mix(in srgb,var(--a1) 34%,#1c1433),color-mix(in srgb,var(--a2) 26%,#120c22));box-shadow:0 0 20px -4px var(--a1),inset 0 0 18px -6px var(--a1)}
.pad.on kbd{color:rgba(255,255,255,.7)}

/* colors */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw{position:relative;height:42px;border-radius:11px;border:1px solid var(--line);overflow:hidden;transition:transform .08s,box-shadow .15s,border-color .15s}
.sw span{position:absolute;left:0;right:0;bottom:0;padding:9px 4px 3px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.9);background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw kbd{color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000}
.sw:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.4)}
.sw:active{transform:scale(.95)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 0 20px -2px var(--a1)}
.custom{display:flex;align-items:center;gap:7px}
.custom input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.2);padding:0;background:none;cursor:pointer;overflow:hidden;flex:none}
.custom input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.custom input[type=color]::-webkit-color-swatch{border:0}
.custom input[type=color]::-moz-color-swatch{border:0}
.custom button{flex:1;height:26px;border-radius:8px;border:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:all .15s}
.custom button:hover{color:#fff}
.custom button.on{color:#fff;border-color:#fff;box-shadow:0 0 14px -4px var(--a1)}

/* master */
.sliders{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:10.5px;font-weight:600;letter-spacing:.07em;color:#6f6594;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#3a3157}
.chip.on{color:#fff;border-color:color-mix(in srgb,var(--a3) 60%,transparent);background:color-mix(in srgb,var(--a3) 10%,transparent)}
.chip.on::before{background:var(--a3);box-shadow:0 0 8px var(--a3)}
.chip.plain::before{display:none}
.chip.plain{color:#cfc6ee}
.fxrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.fx{position:relative;min-height:46px;border-radius:12px;font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.1em;border:1px solid var(--line);
  background:linear-gradient(180deg,#1c1433,#120c22);transition:transform .08s,box-shadow .12s,background .12s;display:flex;align-items:flex-end;justify-content:center;padding:0 2px 8px;user-select:none;-webkit-user-select:none;touch-action:none}
.fx::before{content:"";position:absolute;top:8px;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c)}
.fx kbd{color:#6a6090}
.fx:hover{border-color:var(--c)}
.fx:active,.fx.on{transform:scale(.95);background:var(--c);color:#0a0618;box-shadow:0 0 26px -2px var(--c)}
.fx:active::before,.fx.on::before{background:#0a0618;box-shadow:none}
.fx:active kbd,.fx.on kbd{color:rgba(0,0,0,.55)}
.fx.drop{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 45%,#1c1433),color-mix(in srgb,var(--a2) 45%,#120c22));--c:#fff;border-color:color-mix(in srgb,var(--a1) 60%,transparent)}
.fx.drop.arming{animation:arm .25s linear infinite alternate}
@keyframes arm{to{box-shadow:0 0 30px 0 var(--a1);filter:brightness(1.5)}}

@media (max-width:1180px){
  #console{grid-template-columns:1fr 1fr;max-height:47vh;overflow-y:auto}
  .hbtn .t{display:none}.hbtn{padding:0 10px}
}
@media (max-width:680px){
  #console{grid-template-columns:1fr;max-height:50vh;padding:10px}
  header{gap:8px;padding:10px 10px 22px}
  .logo small,.bpmread span{display:none}.bpmread{min-width:0}
  .logo-mark{width:28px;height:28px}
  .beat{padding:6px 9px}
}
@media (max-width:460px){.logo h1{display:none}}
@media (max-height:620px) and (min-width:1181px){.pad svg{display:none}.pad{min-height:34px}.sw{height:32px}.fx{min-height:38px}}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" aria-label="Virtual festival stage. Drag to aim the lights, click to launch fireworks."></canvas>
    <header>
      <div class="logo">
        <div class="logo-mark" id="logoMark"></div>
        <div style="min-width:0"><h1>FESTIVAL LIGHTS SHOW</h1><small id="status">Internal clock · press play for music sync</small></div>
      </div>
      <div class="spacer"></div>
      <div class="beat" title="Beat indicator">
        <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
        <div class="bpmread"><b id="bpmRead">124</b><span>BPM</span></div>
      </div>
      <button class="hbtn on" id="autoBtn" title="Auto Show: the lighting director changes patterns and palettes on phrase boundaries (A)"><i class="led"></i><span>Auto<span class="t"> Show</span></span></button>
      <button class="hbtn" id="safeBtn" title="Flash-safe: softens strobes and flashes"><i class="led"></i><span><span class="t">Flash-</span>Safe</span></button>
      <button class="hbtn icon" id="hideBtn" title="Hide controls (H)" aria-label="Hide controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15h16M4 20h16M8 5l4 4 4-4"/></svg></button>
      <button class="hbtn icon" id="fsBtn" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </header>
    <button class="hbtn on" id="showUI"><i class="led"></i>Show controls · H</button>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <section id="console" aria-label="Lighting console">
    <div class="panel">
      <div class="ptitle">Music Sync <em id="syncHint">P · play</em></div>
      <div class="now">
        <button id="play" aria-label="Play / pause music"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="np"><b id="npTitle">Neon Pulse</b><span id="npSub">Ready · tap play</span></div>
        <canvas id="mini" width="156" height="80"></canvas>
      </div>
      <div class="seg" id="srcSeg">
        <button data-src="synth" class="on">Built-in</button>
        <button data-src="mic">Microphone</button>
        <button data-src="file">Your file</button>
      </div>
      <div class="tracks" id="tracks"></div>
      <div class="row"><span class="lbl">Tempo</span><input type="range" id="bpm" min="70" max="180" step="1" value="124" aria-label="Tempo"><span class="val" id="bpmVal">124</span><button class="tap" id="tap" title="Tap tempo (Enter)">TAP</button></div>
      <div class="row"><span class="lbl">Volume</span><input type="range" id="vol" min="0" max="100" step="1" value="80" aria-label="Volume"><span class="val" id="volVal">80</span></div>
      <input type="file" id="file" accept="audio/*" hidden>
    </div>

    <div class="panel">
      <div class="ptitle">Patterns <em>keys 1–9</em></div>
      <div class="pads" id="pads"></div>
    </div>

    <div class="panel">
      <div class="ptitle">Colors <em>keys Q–I</em></div>
      <div class="swatches" id="swatches"></div>
      <div class="custom">
        <input type="color" id="c1" value="#ff3d00" aria-label="Custom color 1">
        <input type="color" id="c2" value="#00ffa3" aria-label="Custom color 2">
        <input type="color" id="c3" value="#2979ff" aria-label="Custom color 3">
        <button id="customBtn">Custom mix</button>
      </div>
      <div class="seg" id="modeSeg" title="How colors are distributed across the rig">
        <button data-m="0" class="on">Spread</button>
        <button data-m="1">Beat step</button>
        <button data-m="2">Flow</button>
        <button data-m="3">Split</button>
      </div>
    </div>

    <div class="panel">
      <div class="ptitle">Master &amp; FX <em>drag the stage to aim</em></div>
      <div class="sliders">
        <div class="row"><span class="lbl">Dimmer</span><input type="range" id="dimmer" min="0" max="100" value="100" aria-label="Dimmer"></div>
        <div class="row"><span class="lbl">Speed</span><input type="range" id="speed" min="25" max="200" value="100" aria-label="Speed"></div>
        <div class="row"><span class="lbl">Haze</span><input type="range" id="haze" min="0" max="100" value="60" aria-label="Haze"></div>
        <div class="row"><span class="lbl">Beam</span><input type="range" id="beamw" min="0" max="100" value="45" aria-label="Beam width"></div>
      </div>
      <div class="chips" id="chips">
        <button class="chip on" data-l="beams">Beams</button>
        <button class="chip on" data-l="lasers">Lasers</button>
        <button class="chip on" data-l="wall">LED wall</button>
        <button class="chip on" data-l="strobe">Strobes</button>
        <button class="chip on" data-l="pyro">Auto pyro</button>
        <button class="chip plain" id="wallBtn" title="Cycle LED wall content">Wall: Auto</button>
      </div>
      <div class="fxrow">
        <button class="fx" id="fxFlash" style="--c:#ffffff"><kbd>␣</kbd>FLASH</button>
        <button class="fx" id="fxStrobe" style="--c:#ffe14d"><kbd>S</kbd>STROBE</button>
        <button class="fx" id="fxBlack" style="--c:#ff4d6d"><kbd>B</kbd>BLACKOUT</button>
        <button class="fx" id="fxPyro" style="--c:#ff9a3d"><kbd>F</kbd>PYRO</button>
        <button class="fx drop" id="fxDrop"><kbd>D</kbd>DROP</button>
      </div>

/* ---------- pattern engine ---------- */
const o={pan:0,int:1,tilt:1,ct:0};
function pat(p,i,n,u,bp){
  o.pan=0;o.int=1;o.tilt=1;o.ct=0;const fr=fract(bp);
  switch(p){
    case 0:o.pan=Math.sin(bp*PI/2+i*.55)*.62;o.int=.72+.28*Math.sin(bp*PI+i*.9);break;
    case 1:{o.pan=u*.45;const ph=(((bp*2-i)%n)+n)%n;o.int=Math.max(.04,1-ph/2.6);}break;
    case 2:o.pan=u*.78;o.int=Math.pow(1-fr,1.5);o.tilt=.78+.22*(1-fr);break;
    case 3:{const s=.5-.5*Math.cos(bp*PI/2);o.pan=u*(.07+.88*s);o.int=.88;}break;
    case 4:{const s=.5-.5*Math.cos(bp*PI/2);o.pan=((i&1)?1:-1)*(.14+.62*s);o.int=((Math.floor(bp)+i)&1)?1:.2;}break;
    case 5:{o.pan=Math.sin(i*12.9+bp*.35)*.72;const k=Math.floor(bp*4),h=hash(i,k);o.int=h>.6?1-fract(bp*4)*.75:.03;o.ct=h*.5;}break;
    case 6:{const a=bp*PI/2+u*PI;o.pan=Math.sin(a)*.72;o.tilt=.68+.32*Math.cos(a);o.int=.92;}break;
    case 7:o.pan=Math.sin(bp*PI/4)*.62+u*.16;o.int=.9;o.ct=i/n*.7;break;
    case 8:{const k=Math.floor(bp*(S.safe?1:4));o.pan=u*.55+(hash(i,k)-.5)*.6;o.int=hash(i+7,k)>.45?(S.safe?.9:1-fract(bp*4)*.5):0;}break;
  }
}
function updFix(arr,isTop,dt,t,bp){
  const n=arr.length;
  for(let i=0;i<n;i++){
    const f=arr[i];pat(S.pattern,i,n,f.u,bp);
    let pan=o.pan,int=o.int,tilt=o.tilt,white=0,ct;
    switch(S.colorMode){
      case 0:ct=i/n*.8+patPos*.03;break;
      case 1:ct=Math.floor(patPos)*.21;break;
      case 2:ct=patPos*.06;break;
      default:ct=((i+Math.floor(patPos/2))&1)*.5+Math.floor(patPos/8)*.13;
    }
    ct+=o.ct+(isTop?0:.15);
    if(buildP>=0){
      const p=buildP;pan=lerp(pan,isTop?-f.u*.95:f.u*.1,Math.min(1,p*2.5));
      int=S.safe?.2+.8*p:(Math.sin(t*TAU*(2+p*p*10)+i)>0?1:.06)*(.4+.6*p);white=p*.85;tilt=1;
    }
    let ang=isTop?PI/2-pan:-PI/2+pan;
    if(aim){ang=Math.atan2(aim.y-f.y,aim.x-f.x);if(isTop){if(ang<-PI/2)ang+=TAU;}else if(ang>PI/2)ang-=TAU;int=1;tilt=1;}
    int=Math.max(int,flashEnv);white=Math.max(white,flashEnv*.85);
    f.ang+=(ang-f.ang)*Math.min(1,dt*9);
    f.int+=(int-f.int)*Math.min(1,dt*(int>f.int?45:11));
    f.tilt+=(tilt-f.tilt)*Math.min(1,dt*8);
    pc(ct);f.r=cr+(255-cr)*white;f.g=cg+(255-cg)*white;f.b=cb+(255-cb)*white;
  }
}
const BW=[1,.52,.2],BA=[.3,.42,.7];
function drawBeams(arr,len){
  const base=M*(.16+.4*S.haze),wk=.035+.1*S.beamW;
  for(const f of arr){
    const a=f.int*base;if(a<.008)continue;
    const L=len*f.tilt,dx=Math.cos(f.ang),dy=Math.sin(f.ang),px=-dy,py=dx,ex=f.x+dx*L,ey=f.y+dy*L;
    const w0=th*.22,w1=len*wk*(1.25-f.tilt*.25);
    for(let k=0;k<3;k++){
      const gr=g.createLinearGradient(f.x,f.y,ex,ey),wh=k===2?.45:0,al=a*BA[k];
      const r=f.r+(255-f.r)*wh,gg=f.g+(255-f.g)*wh,b=f.b+(255-f.b)*wh;
      gr.addColorStop(0,rgba(r,gg,b,al));gr.addColorStop(.45,rgba(r,gg,b,al*.42));gr.addColorStop(1,rgba(r,gg,b,0));
      g.fillStyle=gr;const a0=w0*BW[k]+.6,a1=w1*BW[k];
      g.beginPath();g.moveTo(f.x+px*a0,f.y+py*a0);g.lineTo(ex+px*a1,ey+py*a1);g.lineTo(ex-px*a1,ey-py*a1);g.lineTo(f.x-px*a0,f.y-py*a0);g.fill();

function drawLenses(arr){

    const R=th*(1.1+1.5*a)*(1.6-f.tilt*.6),gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,R);

    g.fillStyle=gr;g.fillRect(f.x-R,f.y-R,R*2,R*2);

/* ---------- LED wall ---------- */
function renderWall(t){
  const d=wimg.data,mode=buildP>=0?99:(S.wallMode<0?PATTERNS[S.pattern].wall:S.wallMode);
  const pulse=.62+.38*kickEnv,asp=WW/WH*.5,w=flashEnv*210,bp=patPos;let k=0;
  for(let j=0;j<WH;j++){
    const y=(j+.5)/WH;
    for(let i=0;i<WW;i++){
      const x=(i+.5)/WW;let v=0,c=0;
      switch(mode){
        case 0:{const bi=Math.min(63,Math.floor(Math.abs(x-.5)*2*46)),h=Math.pow(spec[bi],.85)*1.08;v=(1-y)<h?1:((1-y)<h+.05?.45:.045);c=(1-y)*.55+bp*.03;}break;
        case 1:{const a=Math.sin(x*7+t*1.3+Math.sin(y*5-t*.9)*1.4)+Math.sin((x+y)*5-t*1.1);v=Math.pow(.5+.25*a,1.3)*pulse*1.45;c=x*.5+y*.3+t*.04;}break;
        case 2:{const dd=Math.hypot((x-.5)*asp*2,y-.5);v=Math.pow(.5+.5*Math.sin(dd*20-bp*TAU),3)*pulse*1.2;c=dd*.9-bp*.2;}break;
        case 3:{const qv=Math.abs(x-.5)*2.4+y*.9-bp*.5,fq=fract(qv*3);v=(fq<.5?1:.06)*pulse;c=Math.floor(qv*3)/6;}break;
        case 4:{const rate=S.pattern===8&&!S.safe?4:2,kk=Math.floor(bp*rate),h=hash(Math.floor(x*8)+Math.floor(y*3)*13,kk);v=h>.55?1-fract(bp*rate)*.8:.05;c=h*2.3;}break;
        case 5:{const sp=.45+hash(i,3)*.9,yy=fract(y-t*sp*.7+hash(i,9));v=Math.pow(yy,7)*1.25+(hash(i+j*71,Math.floor(t*10))>.985?1:0);c=hash(i,5)*.4+bp*.03;}break;
        case 6:{const dx=(x-.5)*asp*2,dy=y-.5,dd=Math.hypot(dx,dy),an=Math.atan2(dy,dx);v=Math.pow(.5+.5*Math.sin(an*5+dd*16-bp*PI),2)*pulse*1.2;c=an/TAU+bp*.08;}break;
        case 7:{const px=.5+.5*Math.sin(bp*PI/4),dd=Math.abs(x-px);v=Math.max(Math.exp(-dd*dd*260),.22*(.5+.5*Math.sin(x*40-bp*TAU)))*pulse*1.25;c=x*.8+bp*.05;}break;
        default:{const fl=S.safe?1:(.6+.4*Math.sin(t*TAU*(2+buildP*10)));v=((1-y)<buildP?.5:.1)*fl;c=y*.4+t*.2;}
      }
      v=v<0?0:v>1?1:v;
      const idx=((fract(c)*256)|0)*3;
      d[k++]=palC[idx]*v+w;d[k++]=palC[idx+1]*v+w;d[k++]=palC[idx+2]*v+w;d[k++]=255;
    }
  }
  wg.putImageData(wimg,0,0);
  if(buildP>=0){
    const n=Math.max(1,Math.ceil((1-buildP)*8));
    wg.fillStyle='#fff';wg.font='900 22px Arial Black,Arial,sans-serif';wg.textAlign='center';wg.textBaseline='middle';
    wg.fillText(String(n),WW/2,WH/2+1.5);
  }
}

/* ---------- pyro ---------- */
function firework(x,y,big){
  const hue=Math.random(),n=big?110:75,sp=H*(big?.42:.32);
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=sp*(.25+.75*Math.sqrt(Math.random()));
    pc(hue+(Math.random()<.25?.33:0)+Math.random()*.08);
    const l=1+Math.random()*.9;
    parts.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,r:cr,g:cg,b:cb,s:1.4+Math.random()*1.4,type:0,drag:1.9,gv:.13});
  }
  for(let i=0;i<14;i++){const a=Math.random()*TAU,v=sp*.2*Math.random();parts.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4,max:.4,r:255,g:255,b:255,s:3,type:0,drag:3,gv:0});}

function launch(x,ty,delay,big){rockets.push({x,y:floorY-th,ty,delay,big,vy:-H*1.25});}
function pyroBurst(big){

function confetti(){

    parts.push({x:Math.random()*W,y:-20-Math.random()*H*.35,px:0,py:0,vx:(Math.random()-.5)*60,vy:H*(.12+Math.random()*.2),life:l,max:l,r:cr,g:cg,b:cb,s:3+Math.random()*4,type:1,rot:Math.random()*TAU,vr:(Math.random()-.5)*12,ph:Math.random()*TAU});

function updPyro(dt,t){
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];if(r.delay>0){r.delay-=dt;continue;}
    r.y+=r.vy*dt;
    parts.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:(Math.random()-.5)*30,vy:40,life:.35,max:.35,r:255,g:210,b:150,s:1.6,type:0,drag:1,gv:.1});
    if(r.y<=r.ty){firework(r.x,r.y,r.big);rockets.splice(i,1);}
  }
  for(let i=gerbs.length-1;i>=0;i--){
    const e=gerbs[i];if(t>e.until){gerbs.splice(i,1);continue;}
    for(let k=0;k<4;k++){
      const a=-PI/2+(Math.random()-.5)*.42,v=H*(.5+Math.random()*.45),l=.5+Math.random()*.5;
      parts.push({x:e.x,y:floorY-th*.3,px:e.x,py:floorY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,r:255,g:200+Math.random()*55,b:120+Math.random()*100,s:1.3,type:0,drag:1.2,gv:.75});
    }

}

/* ================= FRAME ================= */
let lastT=performance.now()/1000,avgE=0,prevE=0;const ivs=[];let lastOnset=0;
const mini=$('#mini'),mg=mini.getContext('2d');
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000,dt=Math.min(.05,Math.max(.001,t-lastT));lastT=t;
  const synthOn=S.source==='synth'&&S.playing,reactive=S.playing&&!synthOn;

  // ---- audio events ----
  if(synthOn&&AC){
    let guard=0;
    while(evq.length&&evq[0].t<=AC.currentTime&&guard++<64){
      const e=evq.shift();
      if(e.drop){if(build)doDrop();continue;}
      if(e.kick)kickEnv=1;if(e.snare)snareEnv=1;
      if(e.beat){beatCount++;beatPos=beatCount;onBeat();}
    }
  }
  // ---- analysis ----
  const live_=S.playing&&AN;
  if(live_){
    AN.getByteFrequencyData(fd);
    const nb=fd.length,maxBin=Math.min(nb-1,Math.floor(15000/(AC.sampleRate/2)*nb));
    for(let k=0;k<64;k++){
      const lo=Math.max(1,Math.floor(Math.pow(maxBin,k/64))),hi=Math.max(lo,Math.floor(Math.pow(maxBin,(k+1)/64)));
      let m=0;for(let b=lo;b<=hi;b++)if(fd[b]>m)m=fd[b];
      const v=m/255*(.75+k/64*.6);spec[k]=Math.max(v,spec[k]-dt*1.6);
    }
    let e=0;for(let b=1;b<=8;b++)e+=fd[b];e/=8*255;
    if(reactive){
      avgE=avgE*.94+e*.06;
      if(e>avgE*1.28&&e>.22&&e>prevE&&t-lastOnset>.27){
        if(lastOnset){const iv=t-lastOnset;if(iv<1.2){ivs.push(iv);if(ivs.length>9)ivs.shift();
          if(ivs.length>=5){const s=[...ivs].sort((a,b)=>a-b);let bpm=60/s[s.length>>1];while(bpm<80)bpm*=2;while(bpm>175)bpm/=2;if(Math.abs(bpm-S.bpm)>2)setBpm(bpm);}}}
        lastOnset=t;lastDetect=t;kickEnv=1;beatCount++;beatPos=beatCount;if(beatCount&1)snareEnv=.8;onBeat();
      }
      prevE=e;kickEnv=Math.max(kickEnv,e*.7);
    }
  }else{
    for(let k=0;k<64;k++){
      const u=k/64,n=.5+.5*Math.sin(t*3.1+k*1.7)*Math.sin(t*1.3+k*.61);
      const v=kickEnv*Math.pow(1-u,2.2)*.95+n*.3*(1-u*.5)+snareEnv*.45*Math.exp(-Math.pow((u-.6)*4,2));
      spec[k]+=(clamp(v,0,1)-spec[k])*.35;
    }
  }
  let rb=0,rm=0,rt=0;
  for(let k=0;k<10;k++)rb+=spec[k];for(let k=14;k<38;k++)rm+=spec[k];for(let k=40;k<64;k++)rt+=spec[k];
  bass+=(rb/10-bass)*.45;mid+=(rm/24-mid)*.3;treb+=(rt/24-treb)*.3;

  // ---- clock ----
  const prevBeat=beatPos,ext=synthOn||(reactive&&t-lastDetect<2.5);
  beatPos+=dt*S.bpm/60;
  if(ext){if(beatPos>beatCount+.999)beatPos=beatCount+.999;}
  else if(Math.floor(beatPos)>beatCount){beatCount=Math.floor(beatPos);onBeat();}
  patPos+=Math.max(0,Math.min(.5,beatPos-prevBeat))*S.speed;
  kickEnv*=Math.exp(-dt*5.5);snareEnv*=Math.exp(-dt*9);
  flashEnv=S.flashHold?1:flashEnv*Math.exp(-dt*4.5);
  M+=((S.blackout?0:S.dimmer)-M)*Math.min(1,dt*10);
  for(let i=0;i<768;i++)palC[i]+=(palT[i]-palC[i])*Math.min(1,dt*5);
  if(build){
    buildP=clamp((t-build.t0)/build.dur,0,1);
    const over=(t-build.t0)-build.dur;
    if((!build.synth&&over>=0)||over>.6||(build.synth&&!synthOn&&over>=0))doDrop();
  }
  updFix(tops,true,dt,t,patPos);updFix(floors,false,dt,t,patPos+.5);
  updPyro(dt,t);
  draw(t,dt);
  // header pulse + mini spectrum
  $('#logoMark').style.transform='scale('+(1+kickEnv*.14).toFixed(3)+')';
  mg.clearRect(0,0,156,80);
  for(let k=0;k<20;k++){const v=spec[Math.floor(k*2.6)],h=Math.max(3,v*70);pc(k/26+patPos*.03);mg.fillStyle=rgba(cr,cg,cb,.95);mg.fillRect(6+k*7.3,76-h,5,h);}
}

function draw(t,dt){
  g.setTransform(dpr,0,0,dpr,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;
  g.drawImage(bg,0,0,W,H);
  // stars
  g.fillStyle='#fff';
  for(const s of stars){g.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.7+s.p));g.fillRect(s.x,s.y,s.s,s.s);}
  g.globalAlpha=1;
  // ferris wheel
  if(wheel){
    const w=wheel,rot=t*.12;
    g.strokeStyle='rgba(190,170,255,.16)';g.lineWidth=1.2;
    g.beginPath();g.moveTo(w.x-w.r*.55,floorY+2);g.lineTo(w.x,w.y);g.lineTo(w.x+w.r*.55,floorY+2);
    for(let k=0;k<12;k++){const a=rot+k/12*TAU;g.moveTo(w.x,w.y);g.lineTo(w.x+Math.cos(a)*w.r,w.y+Math.sin(a)*w.r);}
    g.moveTo(w.x+w.r,w.y);g.arc(w.x,w.y,w.r,0,TAU);g.moveTo(w.x+w.r*.6,w.y);g.arc(w.x,w.y,w.r*.6,0,TAU);g.stroke();
    g.globalCompositeOperation='lighter';
    for(let k=0;k<12;k++){const a=rot+k/12*TAU,x=w.x+Math.cos(a)*w.r,y=w.y+Math.sin(a)*w.r;pc(k/12+t*.04);
      const br=.55+.45*((k+beatCount)%3===0?1:.3);
      g.fillStyle=rgba(cr,cg,cb,.2*br);g.beginPath();g.arc(x,y,w.r*.12,0,TAU);g.fill();
      g.fillStyle=rgba(cr,cg,cb,br);g.beginPath();g.arc(x,y,w.r*.04+1,0,TAU);g.fill();}
    g.globalCompositeOperation='source-over';
  }
  g.globalCompositeOperation='lighter';
  // festoon bulbs
  for(const b of bulbs){
    pc(b.k*.09+Math.floor(beatPos)*.17);const br=((b.k+beatCount)%3+3)%3===0?1:.4;
    g.fillStyle=rgba(cr,cg,cb,.16*br);g.beginPath();g.arc(b.x,b.y,7*Math.max(.8,sc),0,TAU);g.fill();
    g.fillStyle=rgba(cr+60,cg+60,cb+60,.55+.45*br);g.beginPath();g.arc(b.x,b.y,2*Math.max(.8,sc),0,TAU);g.fill();
  }
  // wash
  pc(patPos*.06);
  let gr=g.createRadialGradient(cx,floorY,0,cx,floorY,stageW*.62);
  const wa=M*(.12+.3*bass+.2*kickEnv)*(.5+S.haze*.6);
  gr.addColorStop(0,rgba(cr,cg,cb,wa));gr.addColorStop(1,rgba(cr,cg,cb,0));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  pc(patPos*.06+.4);
  gr=g.createRadialGradient(cx,roofY,0,cx,roofY,stageW*.7);
  gr.addColorStop(0,rgba(cr,cg,cb,wa*.5));gr.addColorStop(1,rgba(cr,cg,cb,0));
  g.fillStyle=gr;g.fillRect(0,0,W,floorY);

  // LED wall
  g.globalCompositeOperation='source-over';
  g.fillStyle='#04030a';g.fillRect(wall.x,wall.y,wall.w,wall.h);
  if(S.layers.wall){
    renderWall(t);
    const wm=Math.min(1,M*1.1);
    g.imageSmoothingEnabled=false;g.globalAlpha=wm;
    g.drawImage(wc,wall.x,wall.y,wall.w,wall.h);
    g.globalAlpha=1;
    // pixel grid
    g.strokeStyle='rgba(4,3,10,.55)';g.lineWidth=Math.max(1,wall.w/WW*.13);g.beginPath();
    for(let i=1;i<WW;i++){const x=wall.x+i*wall.w/WW;g.moveTo(x,wall.y);g.lineTo(x,wall.y+wall.h);}
    for(let j=1;j<WH;j++){const y=wall.y+j*wall.h/WH;g.moveTo(wall.x,y);g.lineTo(wall.x+wall.w,y);}
    g.stroke();
    // bloom
    g.globalCompositeOperation='lighter';g.imageSmoothingEnabled=true;g.imageSmoothingQuality='low';
    const pad=wall.h*.32;g.globalAlpha=.3*wm;
    g.drawImage(wc,wall.x-pad,wall.y-pad,wall.w+pad*2,wall.h+pad*2);
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
  }
  g.drawImage(rig,0,0,W,H);

  g.globalCompositeOperation='lighter';
  // lasers
  if(S.layers.lasers&&M>.02){
    const ex=[cx-stageW*.32,cx,cx+stageW*.32],ly=roofY+th*.5,K=6,L=H*1.5,lv=M*(.3+.7*Math.min(1,treb*1.6+kickEnv*.3));
    g.lineCap='round';
    for(let e=0;e<3;e++){
      const base=PI/2+Math.sin(patPos*PI/4+e*2.1)*(e===1?.25:.5)-(e-1)*.3;
      const spread=.18+.5*(.5+.5*Math.sin(patPos*PI/2+e*1.3));
      pc(patPos*.06+.5+e*.12);
      for(let k=0;k<K;k++){
        const a=base+(k/(K-1)-.5)*spread*2,fl=hash(e*10+k,Math.floor(patPos*4))>.3?1:.12;
        const x2=ex[e]+Math.cos(a)*L,y2=ly+Math.sin(a)*L;
        g.beginPath();g.moveTo(ex[e],ly);g.lineTo(x2,y2);
        g.strokeStyle=rgba(cr,cg,cb,.14*lv*fl);g.lineWidth=4*Math.max(.8,sc);g.stroke();
        g.strokeStyle=rgba(cr+90,cg+90,cb+90,.75*lv*fl);g.lineWidth=1.1;g.stroke();
      }
      g.fillStyle=rgba(cr+90,cg+90,cb+90,lv);g.beginPath();g.arc(ex[e],ly,th*.22,0,TAU);g.fill();
    }
  }
  // beams
  if(S.layers.beams){drawBeams(floors,H*.95);drawBeams(tops,H*.92);drawLenses(floors);drawLenses(tops);}
  // strobes
  let sv=0;
  const flick=S.safe?.35+.25*Math.sin(t*TAU*1.5):(Math.floor(t*22)%2?0:1);
  if(S.strobeHold)sv=flick;
  if(S.layers.strobe){
    if(S.pattern===8)sv=Math.max(sv,S.safe?snareEnv*.5:(hash(Math.floor(t*16),3)>.55?.9:0)*(.4+kickEnv*.6));
    else if(S.pattern===2||S.pattern===4)sv=Math.max(sv,snareEnv*snareEnv*(S.safe?.4:.85));
    if(buildP>.5)sv=Math.max(sv,S.safe?buildP*.4:flick*buildP);
  }
  sv*=Math.min(1,M*1.2+(S.strobeHold?.5:0));
  if(sv>.01){
    for(let k=0;k<6;k++){
      const x=left+stageW*(.09+.82*k/5),y=roofY+th*.5,R=th*5.5;
      gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,rgba(255,255,255,sv));gr.addColorStop(.25,rgba(220,230,255,sv*.35));gr.addColorStop(1,'rgba(220,230,255,0)');
      g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2);
      g.fillStyle=rgba(255,255,255,sv);g.fillRect(x-th*.7,y-th*.2,th*1.4,th*.4);
    }
    g.fillStyle=rgba(235,240,255,sv*(S.safe?.04:.13));g.fillRect(0,0,W,H);
  }
  // haze
  if(S.haze>.02){
    for(const b of hazeBlobs){
      b.x+=b.v*dt;if(b.x<-.3)b.x=1.3;if(b.x>1.3)b.x=-.3;
      const x=b.x*W,y=roofY+(floorY-roofY)*(.15+b.y*.9)+Math.sin(t*.3+b.p)*12,R=b.r*H*1.1;
      pc(patPos*.06+b.p*.05);
      gr=g.createRadialGradient(x,y,0,x,y,R);const a=S.haze*M*(.05+.07*bass);
      gr.addColorStop(0,rgba(cr,cg,cb,a));gr.addColorStop(1,rgba(cr,cg,cb,0));
      g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2);
    }
  }
  // sparks
  g.lineCap='round';
  for(const p of parts){
    if(p.type!==0)continue;
    const a=Math.min(1,p.life/p.max*1.6);
    g.strokeStyle=rgba(p.r,p.g,p.b,a);g.lineWidth=p.s*Math.max(.8,sc);
    g.beginPath();g.moveTo(p.px,p.py);g.lineTo(p.x,p.y);g.stroke();
  }

  // stage deck
  g.globalCompositeOperation='source-over';
  const dh=H*.032;
  g.fillStyle='#07050f';g.fillRect(left-th*1.5,floorY,stageW+th*3,H-floorY);
  g.fillStyle='#0d0a1c';g.fillRect(left-th*1.5,floorY,stageW+th*3,dh);
  g.globalCompositeOperation='lighter';
  const nseg=36,sw=(stageW+th*3)/nseg;
  for(let k=0;k<nseg;k++){
    const d=Math.abs(k-(nseg-1)/2)/(nseg/2);pc(d*.5-patPos*.12);
    const br=M*(.25+.75*Math.pow(.5+.5*Math.sin(d*9-patPos*PI),2))*(.6+.4*kickEnv);
    g.fillStyle=rgba(cr,cg,cb,br);g.fillRect(left-th*1.5+k*sw+1,floorY+dh*.3,sw-2,dh*.22);
  }
  // crowd
  const energy=Math.min(1.25,.35+bass*.9+kickEnv*.25),glow=M*(.25+.5*bass+.3*kickEnv)+flashEnv*.4;
  const fills=['#150d2b','#0c0719','#04030a'];
  for(let r=0;r<3;r++){
    const row=crowd[r],hr=row.hr;
    g.globalCompositeOperation='source-over';
    g.fillStyle=fills[r];g.strokeStyle=fills[r];g.lineWidth=hr*.55;g.lineCap='round';
    g.beginPath();
    const arms=new Path2D(),rim=new Path2D(),phones=[];
    for(const p of row.ppl){
      const j=Math.abs(Math.sin(PI*(beatPos*(p.half?.5:1)+p.ph))),y=p.y-j*p.amp*energy,x=p.x;
      g.moveTo(x+hr,y);g.arc(x,y,hr,0,TAU);
      g.moveTo(x-hr*1.55,H+4);g.lineTo(x-hr*1.55,y+hr*2);g.quadraticCurveTo(x-hr*1.5,y+hr*1.15,x,y+hr*1.15);g.quadraticCurveTo(x+hr*1.5,y+hr*1.15,x+hr*1.55,y+hr*2);g.lineTo(x+hr*1.55,H+4);g.closePath();
      rim.moveTo(x-hr,y);rim.arc(x,y,hr,PI,TAU);
      if(p.arms){
        const sway=Math.sin(p.aph+beatPos*PI)*.4;
        for(let s=-1;s<=1;s+=2){
          if(p.arms===1&&s!==p.side)continue;
          const hx=x+s*hr*(1.5+sway*s*.6),hy=y-hr*(1.7+.5*j);
          arms.moveTo(x+s*hr*1.3,y+hr*1.6);arms.lineTo(hx,hy);
          if(p.phone&&s===p.side)phones.push(hx,hy-hr*.35);
        }
      }
    }
    g.fill();g.stroke(arms);
    g.globalCompositeOperation='lighter';
    pc(patPos*.06+r*.08);
    g.strokeStyle=rgba(cr,cg,cb,glow*(.5-r*.1));g.lineWidth=Math.max(1,hr*.14);g.stroke(rim);
    for(let k=0;k<phones.length;k+=2){
      const tw=.6+.4*Math.sin(t*5+k);
      g.fillStyle=rgba(255,255,240,.14*tw);g.beginPath();g.arc(phones[k],phones[k+1],hr*.95,0,TAU);g.fill();
      g.fillStyle=rgba(255,255,245,.95*tw);g.beginPath();g.arc(phones[k],phones[k+1],hr*.2+.6,0,TAU);g.fill();
    }
  }
  // confetti
  g.globalCompositeOperation='source-over';
  for(const p of parts){
    if(p.type!==1)continue;
    const a=Math.min(1,p.life*.8),c=Math.cos(p.rot),s=Math.sin(p.rot),w=p.s*Math.max(.8,sc),h=w*.6*Math.cos(p.rot*1.7);
    g.fillStyle=rgba(p.r,p.g,p.b,a);
    g.beginPath();g.moveTo(p.x-c*w-s*h,p.y-s*w+c*h);g.lineTo(p.x+c*w-s*h,p.y+s*w+c*h);g.lineTo(p.x+c*w+s*h,p.y+s*w-c*h);g.lineTo(p.x-c*w+s*h,p.y-s*w-c*h);g.fill();
  }
  // flash + vignette
  if(flashEnv>.01){g.globalCompositeOperation='lighter';g.fillStyle=rgba(255,250,240,flashEnv*(S.safe?.07:.24));g.fillRect(0,0,W,H);}
  g.globalCompositeOperation='source-over';
  gr=g.createRadialGradient(cx,H*.5,H*.35,cx,H*.5,Math.max(W,H)*.75);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}

let toastT=0;

function fill(el){el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%');}
function refreshMusicUI(){
  $$('#srcSeg button').forEach(b=>b.classList.toggle('on',b.dataset.src===S.source));
  $$('#tracks button').forEach((b,i)=>b.classList.toggle('on',S.source==='synth'&&i===S.track));
  $('#tracks').style.opacity=S.source==='synth'?1:.45;
  $('#play').classList.toggle('playing',S.playing);
  $('#playIcon').innerHTML=S.playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  let title,sub,status;
  if(S.source==='synth'){title=TRACKS[S.track].name;sub=S.playing?'Synced · '+TRACKS[S.track].style:'Ready · tap play';status=S.playing?'Beat-locked to '+title:'Internal clock · press play for music sync';}
  else if(S.source==='mic'){title='Microphone';sub=S.playing?'Listening · beat detect':'Mic off';status=S.playing?'Reacting to live audio':'Internal clock';}
  else{title=S.fileName||'Your file';sub=S.playing?'Synced · beat detect':'Paused';status=S.playing?'Reacting to '+title:'Internal clock';}
  $('#npTitle').textContent=title;$('#npSub').textContent=sub;$('#status').textContent=status;
}

  const up=()=>{if(b.classList.contains('on')){b.classList.remove('on');off();}};

// keyboard
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tg=e.target,tag=tg.tagName;
  if(tag==='INPUT'&&tg.type!=='range'&&tg.type!=='color')return;
  const k=e.key.toLowerCase();
  if(k===' '){if(tag==='BUTTON')return;e.preventDefault();if(!e.repeat){S.flashHold=true;$('#fxFlash').classList.add('on');}return;}
  if(e.repeat)return;
  if(k>='1'&&k<='9'){setPattern(+k-1);return;}
  const pi=PAL_KEYS.toLowerCase().indexOf(k);
  if(pi>=0){setPalette(pi);return;}
  switch(k){
    case 's':S.strobeHold=true;$('#fxStrobe').classList.add('on');break;
    case 'b':toggleBlackout();break;
    case 'f':pyroBurst(false);break;
    case 'd':startBuild();break;
    case 'p':togglePlay();break;
    case 'a':toggleAuto();break;
    case 'h':toggleUI();break;
    case 'enter':if(tag!=='BUTTON')tapTempo();break;
  }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k===' '&&e.target.tagName!=='BUTTON'){S.flashHold=false;$('#fxFlash').classList.remove('on');}
  if(k==='s'){S.strobeHold=false;$('#fxStrobe').classList.remove('on');}
});
addEventListener('blur',()=>{S.flashHold=false;S.strobeHold=false;$('#fxFlash').classList.remove('on');$('#fxStrobe').classList.remove('on');});

/* ================= BOOT ================= */
new ResizeObserver(resize).observe(wrap);
resize();setPalette(0,true);refreshMusicUI();
requestAnimationFrame(frame);
setTimeout(()=>toast('Press ▶ for the music-synced show · drag the stage to aim the lights'),700);
})();
</script>
