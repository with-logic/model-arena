<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex Lab — a terminal-style regex playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --radius:12px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07090d; --glow1:rgba(110,231,168,.10); --glow2:rgba(88,166,255,.10);
  --win:#0e1218; --win2:#121720; --bar:#161c26; --line:#212836; --line2:#2c3545;
  --fg:#d9dfea; --dim:#8590a3; --faint:#566074;
  --accent:#6ee7a8; --accent-ink:#06130c; --blue:#6cb2ff; --err:#ff7b72; --warn:#f2c14e;
  --chip:#171d28; --chip-h:#1f2735; --shadow:0 30px 80px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04);
  --g0:96 165 250; --g1:255 159 67; --g2:74 222 128; --g3:244 114 182; --g4:167 139 250;
  --g5:45 212 191; --g6:250 204 21; --g7:248 113 113; --g8:163 230 53;
  --ma:.20; --ga:.36;
  --t-esc:#79c0ff; --t-class:#56d4c4; --t-quant:#ffa657; --t-anchor:#ff7b9c; --t-alt:#f2cc60; --t-any:#d2a8ff; --t-grp:#aab4c5;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#e6e9ef; --glow1:rgba(15,138,79,.10); --glow2:rgba(37,99,235,.08);
  --win:#fcfcfd; --win2:#f5f6f9; --bar:#eceef3; --line:#dde1e8; --line2:#cbd1dc;
  --fg:#1d2430; --dim:#5b6676; --faint:#98a1b0;
  --accent:#0b7f48; --accent-ink:#ffffff; --blue:#1d5fd1; --err:#c62828; --warn:#9a6700;
  --chip:#eff1f5; --chip-h:#e3e7ee; --shadow:0 30px 70px -25px rgba(30,40,60,.35),0 0 0 1px rgba(0,0,0,.05);
  --g0:37 99 235; --g1:234 88 12; --g2:22 163 74; --g3:219 39 119; --g4:124 58 237;
  --g5:13 148 136; --g6:202 138 4; --g7:220 38 38; --g8:101 163 13;
  --ma:.14; --ga:.26;
  --t-esc:#1d5fd1; --t-class:#0b7a70; --t-quant:#c2570c; --t-anchor:#c2255c; --t-alt:#9a6700; --t-any:#7c3aed; --t-grp:#4b5565;
}
*{box-sizing:border-box;font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0!important}
html,body{margin:0}
body{
  min-height:100vh;background:var(--bg);color:var(--fg);
  font:13px/1.55 var(--mono);-webkit-font-smoothing:antialiased;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;
  background-image:radial-gradient(900px 500px at 12% -5%,var(--glow1),transparent 60%),radial-gradient(900px 600px at 95% 105%,var(--glow2),transparent 60%);
  background-attachment:fixed;
  padding:28px 20px 40px;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:rgb(var(--g0)/.35)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* ───────── window ───────── */
.window{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 100px);background:var(--win);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px 0 14px;background:var(--bar);border-bottom:1px solid var(--line);user-select:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.title{flex:1;text-align:center;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{color:var(--fg);font-weight:500}
.tb-actions{display:flex;gap:6px;align-items:center;position:relative}
.tbtn{height:26px;padding:0 10px;border-radius:6px;color:var(--dim);border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.tbtn:hover{background:var(--chip-h);color:var(--fg)}
.tbtn svg{width:14px;height:14px}
html[data-theme="dark"] .i-sun{display:none}
html[data-theme="light"] .i-moon{display:none}
.menu{position:absolute;right:38px;top:32px;z-index:20;width:300px;background:var(--win2);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 18px 40px -10px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px}
.menu button:hover,.menu button:focus-visible{background:var(--chip-h)}
.menu button b{display:block;font-weight:500}
.menu button code{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────── command area ───────── */
.cmd{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.prompt-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ps1{color:var(--accent);font-weight:700;font-size:16px}
.cmdname{color:var(--dim)}
.pattern-box{flex:1 1 420px;min-width:0;display:flex;align-items:center;gap:2px;background:var(--win2);border:1px solid var(--line2);border-radius:9px;padding:0 6px 0 10px;transition:border-color .15s,box-shadow .15s}
.pattern-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgb(var(--g2)/.13)}
.pattern-box.bad{border-color:var(--err)}
.pattern-box.bad:focus-within{box-shadow:0 0 0 3px rgb(var(--g7)/.15)}
.slash{color:var(--faint);font-size:18px;font-weight:500}
.pat-wrap{position:relative;flex:1;min-width:0;height:42px}
.pat-back,#pattern{position:absolute;inset:0;width:100%;height:100%;font:500 16px/42px var(--mono);padding:0 3px;margin:0;border:0;white-space:pre;letter-spacing:0}
.pat-back{overflow:hidden;pointer-events:none;color:var(--fg)}
.pat-back>span{display:inline-block;padding-right:60px}
#pattern,#text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
#pattern{background:transparent;color:transparent;caret-color:var(--accent);outline:0}
#pattern::placeholder{color:var(--faint);font-weight:400}
.pat-back s{text-decoration:none}
.pat-back .hov{background:rgb(var(--g6)/.28);border-radius:2px}
.pat-back .err{text-decoration:underline wavy var(--err);text-underline-offset:5px;background:rgb(var(--g7)/.22)}
.t-esc{color:var(--t-esc)}.t-class{color:var(--t-class)}.t-quant{color:var(--t-quant)}.t-anchor{color:var(--t-anchor)}
.t-alt{color:var(--t-alt)}.t-any{color:var(--t-any)}.t-grp{color:var(--t-grp)}.t-lit{color:var(--fg)}
.gc1{color:rgb(var(--g1))}.gc2{color:rgb(var(--g2))}.gc3{color:rgb(var(--g3))}.gc4{color:rgb(var(--g4))}
.gc5{color:rgb(var(--g5))}.gc6{color:rgb(var(--g6))}.gc7{color:rgb(var(--g7))}.gc8{color:rgb(var(--g8))}
.flags{display:flex;gap:3px;padding-left:4px}
.flag{width:26px;height:28px;border-radius:6px;color:var(--faint);font-weight:500;font-size:14px;border:1px solid transparent;transition:all .12s}
.flag:hover{background:var(--chip-h);color:var(--fg)}
.flag[aria-pressed="true"]{background:rgb(var(--g2)/.16);color:var(--accent);border-color:rgb(var(--g2)/.4);font-weight:700}
.actions{display:flex;gap:6px}
.btn{height:36px;padding:0 12px;border-radius:8px;background:var(--chip);border:1px solid var(--line2);color:var(--fg);display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--chip-h);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px;height:14px;opacity:.8}
.btn.danger:hover{border-color:var(--err);color:var(--err)}

.error{margin:12px 0 0;border:1px solid rgb(var(--g7)/.45);background:rgb(var(--g7)/.08);border-radius:9px;padding:10px 14px;overflow-x:auto}
.error[hidden]{display:none}
.error .e-head{color:var(--err);font-weight:700}
.error .e-head span{font-weight:400;color:var(--fg)}
.error pre{margin:8px 0 0;font:inherit;font-size:14px;line-height:1.35;white-space:pre}
.error pre .ghost{visibility:hidden}
.error pre .caret{color:var(--err);font-weight:700}
.error pre .bad{color:var(--err);background:rgb(var(--g7)/.2);border-radius:2px}
.error .e-note{margin-top:6px;color:var(--dim)}
.error .e-note b{color:var(--fg);font-weight:500}

.quick{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;align-items:center}
.qgroup{display:flex;align-items:center;gap:4px}
.qlabel{color:var(--faint);font-size:11px;margin-right:2px;text-transform:lowercase}
.chip{height:26px;padding:0 8px;border-radius:6px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;transition:all .12s}
.chip:hover{background:var(--chip-h);border-color:var(--accent);transform:translateY(-1px)}
.chip:active{transform:none}

/* ───────── panes ───────── */
.panes{flex:1;grid-template-rows:auto minmax(0,1fr);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"test explain" "matches explain";gap:1px;background:var(--line)}
.pane{background:var(--win);min-width:0;display:flex;flex-direction:column}
#p-test{grid-area:test}#p-matches{grid-area:matches}#p-explain{grid-area:explain}
.pane-h{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 16px;background:var(--win2);border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.pane-h .name{color:var(--fg);font-weight:500;white-space:nowrap}
.pane-h .name::before{content:"$ ";color:var(--accent)}
.pane-h .meta{margin-left:auto;white-space:nowrap}
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.lg{padding:1px 7px;border-radius:4px;font-size:11px;color:var(--fg);white-space:nowrap}
.lg0{background:rgb(var(--g0)/var(--ma));box-shadow:inset 0 0 0 1px rgb(var(--g0)/.5)}

.editor{position:relative;overflow:auto;max-height:max(330px,calc(50vh - 200px));min-height:190px;cursor:text}
.stack{display:grid;grid-template-columns:minmax(0,1fr);min-height:190px}
.stack>*{grid-area:1/1;font:400 14px/1.75 var(--mono);padding:14px 16px;margin:0;border:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;letter-spacing:0;min-width:0}
#backdrop{color:transparent;pointer-events:none}
#text{background:transparent;color:var(--fg);resize:none;outline:0;overflow:hidden;width:100%;caret-color:var(--accent);display:block}
#text::placeholder{color:var(--faint)}
mark.m{color:transparent;background:rgb(var(--g0)/var(--ma));border-radius:3px;box-shadow:inset 0 -2px 0 rgb(var(--g0)/.75);-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.m.odd{background:rgb(var(--g0)/calc(var(--ma) + .13))}
mark.m.z{position:relative;background:none;box-shadow:none}
mark.m.z::after{content:"";position:absolute;left:-1px;top:.1em;bottom:.05em;width:2px;background:rgb(var(--g0));border-radius:1px;height:1.2em}
mark.m.on{outline:2px solid rgb(var(--g6));outline-offset:1px;background:rgb(var(--g6)/.3)}
mark.m.z.on::after{background:rgb(var(--g6));width:3px}
.g{border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.g1,.lg1{background:rgb(var(--g1)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g1))}
.g2,.lg2{background:rgb(var(--g2)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g2))}
.g3,.lg3{background:rgb(var(--g3)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g3))}
.g4,.lg4{background:rgb(var(--g4)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g4))}
.g5,.lg5{background:rgb(var(--g5)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g5))}
.g6,.lg6{background:rgb(var(--g6)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g6))}
.g7,.lg7{background:rgb(var(--g7)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g7))}
.g8,.lg8{background:rgb(var(--g8)/var(--ga));box-shadow:inset 0 -2px 0 rgb(var(--g8))}

.table-wrap{overflow:auto;flex:1 1 auto;max-height:max(310px,calc(100vh - 690px));min-height:150px;position:relative}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--win);color:var(--dim);font-weight:500;z-index:1;box-shadow:0 1px 0 var(--line)}
th .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:baseline}
td.num{color:var(--faint);width:1%;text-align:right}
td.idx{color:var(--dim)}
td.idx i{font-style:normal;color:var(--faint)}
td .v{display:inline-block;max-width:300px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:0 5px;border-radius:3px;white-space:pre}
td .v0{background:rgb(var(--g0)/var(--ma))}
td .ws{color:var(--faint)}
td .rng{color:var(--faint);font-size:11px;margin-left:6px}
td .nil{color:var(--faint);font-style:italic}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--win2)}
tbody tr.on{background:rgb(var(--g6)/.12);box-shadow:inset 3px 0 0 rgb(var(--g6))}
.empty{padding:26px 18px;color:var(--dim);text-align:center}
.empty b{color:var(--fg);font-weight:500}
.empty .big{font-size:22px;display:block;margin-bottom:6px;color:var(--faint)}
.tip{padding:8px 16px;color:var(--dim);border-bottom:1px solid var(--line);background:rgb(var(--g6)/.07);font-size:12px}
.tip kbd,.empty kbd{font:inherit;color:var(--accent);border:1px solid var(--line2);border-radius:4px;padding:0 5px}

.ex-outer{position:relative;flex:1;min-height:340px}
.ex-scroll{position:absolute;inset:0;overflow:auto;padding:12px 14px 20px}
.ex-node{margin:2px 0}
.ex-row{display:flex;gap:10px;align-items:baseline;padding:4px 6px;border-radius:6px;cursor:default}
.ex-row:hover{background:var(--chip)}
.tok{flex:none;font:500 12.5px var(--mono);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.ex-row:hover .tok{border-color:var(--line2)}
.ex-d{color:var(--fg);min-width:0;font-size:12.5px}
.ex-d b{font-weight:500;color:var(--t-class)}
.ex-d em{font-style:normal;color:var(--dim)}
.ex-q{display:inline-block;margin-left:4px;color:var(--t-quant);font-size:12px}
.ex-q::before{content:"× "}
.ex-kids{margin-left:13px;padding-left:10px;border-left:1px dashed var(--line2)}
.ex-or{color:var(--t-alt);font-size:11px;padding:3px 6px 0;text-transform:uppercase;letter-spacing:.08em}
.ex-sec{margin:16px 6px 6px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:10px}
.ex-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.ex-sec:first-child{margin-top:4px}
.ex-flag{display:flex;gap:10px;padding:3px 6px;align-items:baseline}
.ex-flag .tok{color:var(--accent)}
.ex-flag.off{opacity:.45}

/* ───────── status bar ───────── */
.status{display:flex;align-items:center;gap:14px;height:30px;padding:0 14px;background:var(--bar);border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .st{display:flex;align-items:center;gap:7px;color:var(--fg)}
.status .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status .st.ok::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.status .st.err::before{background:var(--err);box-shadow:0 0 8px var(--err)}
.status .st.warn::before{background:var(--warn)}
.status .st.busy::before{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.status .hint{flex:1;overflow:hidden;text-overflow:ellipsis}
.status .hint b{color:var(--fg);font-weight:500}
.status .right{color:var(--faint)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--win);padding:9px 14px;border-radius:9px;font-size:12.5px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);transition:all .2s;display:flex;gap:12px;align-items:center;max-width:90vw;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:inherit;text-decoration:underline;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{max-width:1240px;margin:14px auto 0;color:var(--faint);font-size:11.5px;text-align:center}

@media (max-width:920px){
  body{padding:10px 8px 24px}
  .window{min-height:0}
  .panes{grid-template-rows:none;grid-template-columns:minmax(0,1fr);grid-template-areas:"test" "matches" "explain"}
  .ex-outer{min-height:0}
  .ex-scroll{position:static;max-height:460px}
  .title{text-align:left}
  .status .right{display:none}
  .actions{flex:1}
  .actions .btn{flex:1;justify-content:center}
}
@media (max-width:520px){
  .lights{display:none}
  .cmdname{display:none}
  .cmd{padding:12px 10px}
  .pattern-box{flex-basis:100%;flex-wrap:wrap;padding-bottom:4px}
  .pat-wrap{flex-basis:70%}
  .flags{flex-basis:100%;padding:0 0 2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="window" role="application" aria-label="Regex Lab">
  <header class="titlebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title"><b>regex-lab</b> — ~/playground — js/ecmascript</div>
    <div class="tb-actions">
      <button class="tbtn" id="btn-examples" aria-haspopup="true" aria-expanded="false" data-hint="Load a ready-made pattern with sample text">examples ▾</button>
      <div class="menu" id="menu" hidden role="menu"></div>
      <button class="tbtn" id="btn-theme" aria-label="Toggle light / dark theme" data-hint="Toggle light / dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="cmd">
    <div class="prompt-line">
      <span class="ps1" aria-hidden="true">❯</span><span class="cmdname">regex</span>
      <div class="pattern-box" id="pattern-box">
        <span class="slash" aria-hidden="true">/</span>
        <div class="pat-wrap">
          <div class="pat-back" id="pat-back" aria-hidden="true"><span id="pat-inner"></span></div>
          <label class="sr" for="pattern">Regular expression pattern</label>
          <input id="pattern" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="type a pattern, e.g. \b\w+@\w+\.\w+\b">
        </div>
        <span class="slash" aria-hidden="true">/</span>
        <div class="flags" id="flags" role="group" aria-label="Flags"></div>
      </div>
      <div class="actions">
        <button class="btn" id="btn-copy" data-hint="Copy the regex literal /pattern/flags to the clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>copy</button>
        <button class="btn" id="btn-share" data-hint="Copy a permalink — pattern, flags and text are encoded in the URL hash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>share</button>
        <button class="btn danger" id="btn-clear" data-hint="Clear the pattern and the test text (can be undone)">

<script>
(function(){
'use strict';

/* ════════════ helpers ════════════ */
const $ = s => document.querySelector(s);
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
const FLAG_ORDER = 'gimsuy';
const MAX_MATCHES = 5000, MAX_ROWS = 400, TIMEOUT_MS = 1500;
const DEFAULT_HINT = 'hover any button or token for help · click a match row to locate it in the text';

const FLAG_INFO = {
  g:['global','find every match instead of stopping after the first one'],
  i:['ignore case','letters match both upper- and lower-case'],
  m:['multiline','^ and $ match at the start / end of every line'],
  s:['dotAll','the dot . also matches line breaks'],
  u:['unicode','treat the pattern as Unicode code points; enables \\p{…} and \\u{…}'],
  y:['sticky','match only at the exact lastIndex position (anchored search)']
};

const QUICK = [
  ['chars', [
    ['\\d','\\d','Digit — any character 0–9'],
    ['\\w','\\w','Word character — letter, digit or underscore'],
    ['\\s','\\s','Whitespace — space, tab, line break'],
    ['.','.','Any character except a line break (any at all with the s flag)'],
    ['\\b','\\b','Word boundary — position between a word and a non-word character']
  ]],
  ['classes', [
    ['[A-Z]','[A-Z]','Character class — one uppercase letter A to Z'],
    ['[a-z]','[a-z]','Character class — one lowercase letter a to z'],
    ['[0-9]','[0-9]','Character class — one digit 0 to 9'],
    ['[^…]','[^‸]','Negated class — any one character NOT listed']
  ]],
  ['repeat', [
    ['*','*','Zero or more of the preceding token (greedy)'],
    ['+','+','One or more of the preceding token (greedy)'],
    ['?','?','Makes the preceding token optional — or makes a quantifier lazy'],
    ['{n,m}','{1,3}','Between n and m repetitions of the preceding token'],
    ['*?','*?','Lazy — zero or more, but as few as possible']
  ]],
  ['groups', [
    ['(…)','(‸)','Capture group — groups tokens and remembers what they matched'],
    ['(?:…)','(?:‸)','Non-capturing group — groups tokens without remembering'],
    ['(?<name>…)','(?<name>‸)','Named capture group — access the match by name'],
    ['a|b','|','Alternation — match the left side OR the right side']

    ['(?=…)','(?=‸)','Positive lookahead — what follows must match, but is not consumed'],
    ['(?!…)','(?!‸)','Negative lookahead — what follows must NOT match'],
    ['(?<=…)','(?<=‸)','Positive lookbehind — what precedes must match'],
    ['(?<!…)','(?<!‸)','Negative lookbehind — what precedes must NOT match']
  ]],
  ['anchors', [
    ['^','^','Start of the string (or of each line with the m flag)'],
    ['$','$','End of the string (or of each line with the m flag)']
  ]]
];

const EXAMPLES = [
  {name:'ISO dates · named groups', p:'(?<year>\\d{4})-(?<month>\\d{2})-(?<day>\\d{2})', f:'g',
   t:'Release log\n2024-03-15  v2.0.0  shipped by ada@example.com\n2024-11-02  v2.1.0  hotfix from linus@kernel.org\nNext review: 2025-01-20 at 09:30 — room B-12\nNot dates: 2025/01/20, 20-01-2025, 2025-1-2'},
  {name:'Email addresses', p:'\\b([\\w.+-]+)@([\\w-]+(?:\\.[\\w-]+)+)\\b', f:'gi',
   t:'Contact: ada.lovelace@example.com, GRACE@Navy.mil\nSupport <help+tickets@regex-lab.dev> or sales@sub.domain.co.uk\nNot emails: @handle, user@, plain.text'},
  {name:'Hex colours', p:'#(?:[0-9a-f]{3}){1,2}\\b', f:'gi',
   t:':root {\n  --bg: #0e1218;\n  --fg: #FFF;\n  --accent: #6ee7a8;\n  --oops: #12; /* too short */\n  --also: #abcd12ef;\n}'},
  {name:'URL parts', p:'(https?):\\/\\/([^\\s\\/:]+)(?::(\\d+))?(\\/[^\\s?#]*)?', f:'g',
   t:'Docs live at https://developer.mozilla.org/en-US/docs/Web/JavaScript\nLocal dev: http://localhost:5173/app/index.html?debug=1\nftp://not.matched.example/file'},
  {name:'Repeated words · backreference', p:'\\b(\\w+)\\s+\\1\\b', f:'gi',
   t:'This sentence has has a doubled word.\nParis in the the spring — it is is easy to miss.\nNo repeats here at all.'},
  {name:'Prices · lookbehind & lookahead', p:'(?<=\\$)\\d+(?:\\.\\d{2})?(?!\\d)', f:'g',
   t:'Coffee $4.50, bagel $3, tip €2.00\nSubscription: $129.99 per year (was $199)\nInvoice #4521 — total $1040.00'},
  {name:'key = value lines · multiline', p:'^\\s*([\\w.]+)\\s*=\\s*(.*?)\\s*$', f:'gm',
   t:'# settings.ini\nname = Regex Lab\ntheme=dark\n  editor.font_size =  14\nthis line has no assignment\ndebug = false'},
  {name:'IPv4 addresses', p:'\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b', f:'g',
   t:'gateway 192.168.1.1 · dns 8.8.8.8 · broadcast 10.0.0.255\ninvalid: 256.300.1.1, 1.2.3\nlocalhost is 127.0.0.1'}
];

/* ════════════ pattern parser (explanation, colouring, error positions) ════════════ */
class RxError extends Error{ constructor(msg,pos,end){ super(msg); this.pos=pos; this.end=end==null?pos+1:end; } }

function parseRegex(src, flags){
  const uni = /[uv]/.test(flags);
  const cls = new Array(src.length).fill('t-lit');
  const names = {}; const backrefs = [];
  let i = 0, groups = 0;
  const paint = (s,e,c) => { for(let k=s;k<e;k++) cls[k]=c; };
  const sticky = (re,pos) => { re.lastIndex=pos; return re.exec(src); };

  function readBrace(pos){
    const m = sticky(/\{(\d+)(?:(,)(\d*))?\}/y, pos);
    if(!m) return null;
    const min = +m[1];
    const max = m[2] ? (m[3]===''?Infinity:+m[3]) : min;
    return {min,max,len:m[0].length};
  }

  function parseDisjunction(){
    const branches=[]; let items=[]; let bs=i;
    while(i<src.length && src[i]!==')'){
      if(src[i]==='|'){ paint(i,i+1,'t-alt'); branches.push({items:mergeLits(items),s:bs,e:i}); i++; items=[]; bs=i; continue; }
      const atom = parseAtom();
      parseQuantifier(atom);
      items.push(atom);
    }
    branches.push({items:mergeLits(items),s:bs,e:i});
    return branches;
  }
  function mergeLits(items){
    const out=[];
    for(const n of items){
      const p=out[out.length-1];
      if(n.t==='lit' && !n.q && p && p.t==='lit' && !p.q){ p.v+=n.v; p.e=n.e; }
      else out.push(n);
    }
    return out;
  }

  function parseAtom(){
    const c=src[i], s=i;
    if(c==='(') return parseGroup();
    if(c==='[') return parseClass();
    if(c==='\\') return parseEscape(false);
    if(c==='.'){ i++; paint(s,i,'t-any'); return {t:'any',s,e:i}; }
    if(c==='^'||c==='$'){ i++; paint(s,i,'t-anchor'); return {t:'anchor',k:c,s,e:i}; }
    if(c==='*'||c==='+'||c==='?') throw new RxError('Nothing to repeat — the quantifier "'+c+'" has no token before it',i);
    if(c==='{'){
      const b=readBrace(i);
      if(b) throw new RxError('Nothing to repeat — the quantifier "'+src.substr(i,b.len)+'" has no token before it',i,i+b.len);
      if(uni) throw new RxError('Lone "{" — in unicode mode it must be escaped as \\{',i);
    }
    if(uni && (c==='}'||c===']')) throw new RxError('Lone "'+c+'" — in unicode mode it must be escaped as \\'+c,i);
    const ch=String.fromCodePoint(src.codePointAt(i)); i+=ch.length;
    return {t:'lit',v:ch,s,e:i};
  }

  function parseQuantifier(atom){
    const s=i, c=src[i]; let min,max;
    if(c==='*'){min=0;max=Infinity;i++;}
    else if(c==='+'){min=1;max=Infinity;i++;}
    else if(c==='?'){min=0;max=1;i++;}
    else if(c==='{'){
      const b=readBrace(i); if(!b) return;
      min=b.min; max=b.max; i+=b.len;
      if(max<min) throw new RxError('Quantifier range is out of order — '+min+' is greater than '+max,s,i);
    } else return;
    let lazy=false; if(src[i]==='?'){ lazy=true; i++; }
    paint(s,i,'t-quant');
    const isPos = atom.t==='anchor'||atom.t==='wordb'||(atom.t==='group'&&(/lookbehind/.test(atom.kind)||(uni&&/lookahead/.test(atom.kind))));
    if(isPos) throw new RxError('Nothing to repeat — "'+src.slice(atom.s,atom.e)+'" is a position, not a character, so it cannot be quantified',s,i);
    atom.q={min,max,lazy,src:src.slice(s,i)}; atom.ae=atom.e; atom.e=i;
  }

  function parseGroup(){
    const s=i; i++;
    let kind='capture', name=null, no=0, mods=null;
    if(src[i]==='?'){
      const r=src.slice(i,i+80); let m;
      if(r.startsWith('?:')){kind='noncap';i+=2;}
      else if(r.startsWith('?=')){kind='lookahead';i+=2;}
      else if(r.startsWith('?!')){kind='neglookahead';i+=2;}
      else if(r.startsWith('?<=')){kind='lookbehind';i+=3;}
      else if(r.startsWith('?<!')){kind='neglookbehind';i+=3;}
      else if((m=/^\?<([^>]*)>/.exec(r))){
        let ok=false; try{ ok=new RegExp('^[\\p{ID_Start}$_][\\p{ID_Continue}$\\u200c\\u200d]*$','u').test(m[1]); }catch(_){ ok=/^[A-Za-z_$][\w$]*$/.test(m[1]); }
        if(!ok) throw new RxError('Invalid capture group name "'+m[1]+'" — use letters, digits, _ or $ and do not start with a digit',s+3,s+3+Math.max(1,m[1].length));
        kind='named'; name=m[1]; i+=m[0].length;
      }
      else if(r.startsWith('?<')) throw new RxError('Unterminated group name — "(?<" needs a closing ">"',s,s+3);
      else if((m=/^\?([ims]*)(?:-([ims]*))?:/.exec(r)) && (m[1]||m[2])){ kind='modifier'; mods=m; i+=m[0].length; }
      else throw new RxError('Invalid group — "(?" must be followed by :  =  !  <=  <!  or <name>',s,s+2);
    }
    let pc='t-grp';
    if(kind==='capture'||kind==='named'){ no=++groups; if(name) names[no]=name; pc='t-grp gc'+((no-1)%8+1); }
    const hs=i; paint(s,hs,pc);
    const branches=parseDisjunction();
    if(src[i]!==')') throw new RxError('Unterminated group — this "(" is never closed with ")"',s,hs);
    paint(i,i+1,pc); i++;
    return {t:'group',kind,name,no,mods,branches,s,e:i,hs};
  }

  function parseClass(){
    const s=i; i++; let neg=false;
    if(src[i]==='^'){neg=true;i++;}
    const parts=[];
    for(;;){
      if(i>=src.length) throw new RxError('Unterminated character class — this "[" is never closed with "]"',s);
      if(src[i]===']'){ i++; break; }
      const a=classAtom();
      if(src[i]==='-' && i+1<src.length && src[i+1]!==']'){
        i++; const b=classAtom();
        if(a.cp!=null && b.cp!=null){
          if(a.cp>b.cp) throw new RxError('Range out of order in character class — "'+src.slice(a.s,b.e)+'" goes backwards',a.s,b.e);
          parts.push({t:'range',a,b,s:a.s,e:b.e});
        } else {
          if(uni) throw new RxError('Invalid character class range — a shorthand like \\d cannot be a range endpoint',a.s,b.e);
          parts.push(a,{t:'lit',v:'-',cp:45},b);
        }
      } else parts.push(a);
    }
    for(let k=s;k<i;k++) if(cls[k]==='t-lit') cls[k]='t-class';
    return {t:'class',neg,parts,s,e:i};
  }
  function classAtom(){
    const s=i;
    if(src[i]==='\\') return parseEscape(true);
    const cp=src.codePointAt(i), ch=String.fromCodePoint(cp); i+=ch.length;
    return {t:'lit',v:ch,cp,s,e:i};
  }

  function parseEscape(inClass){
    const s=i; i++;
    if(i>=src.length) throw new RxError('Pattern ends with a lone backslash — "\\" must be followed by a character to escape',s);
    const cp0=src.codePointAt(i), c=String.fromCodePoint(cp0); i+=c.length;
    let n, m;
    const lit=(v)=>({t:'lit',v,cp:v.codePointAt(0),escaped:true});
    if('dDwWsS'.includes(c)) n={t:'set',k:c};
    else if(c==='b') n = inClass ? {t:'ctrl',k:'b',v:'\b',cp:8,name:'backspace'} : {t:'wordb',k:'b'};
    else if(c==='B' && !inClass) n={t:'wordb',k:'B'};
    else if('nrtfv'.includes(c)){
      const map={n:['\n','line feed (newline)'],r:['\r','carriage return'],t:['\t','tab'],f:['\f','form feed'],v:['\v','vertical tab']}[c];
      n={t:'ctrl',k:c,v:map[0],cp:map[0].charCodeAt(0),name:map[1]};
    }
    else if(c==='0' && !/\d/.test(src[i]||'')) n={t:'ctrl',k:'0',v:'\0',cp:0,name:'null character'};
    else if(/[1-9]/.test(c) && !inClass){
      m=sticky(/\d*/y,i); i+=m[0].length;
      n={t:'backref',n:+(c+m[0])}; backrefs.push({n:n.n,s,e:i});
    }
    else if(c==='k' && !inClass && (uni || /\(\?<[^=!]/.test(src)) && (m=sticky(/<([^>]*)>/y,i))){ i+=m[0].length; n={t:'backref',name:m[1]}; backrefs.push({name:m[1],s,e:i}); }
    else if((c==='p'||c==='P') && uni){
      m=sticky(/\{([^}]*)\}/y,i);
      if(!m) throw new RxError('Invalid Unicode property escape — expected \\'+c+'{Name}',s,i);
      i+=m[0].length; n={t:'prop',neg:c==='P',v:m[1]};
    }
    else if(c==='x' && (m=sticky(/[0-9a-fA-F]{2}/y,i))){ i+=2; n=lit(String.fromCharCode(parseInt(m[0],16))); n.code='U+'+m[0].toUpperCase().padStart(4,'0'); }
    else if(c==='u' && uni && (m=sticky(/\{([0-9a-fA-F]+)\}/y,i)) && parseInt(m[1],16)<=0x10FFFF){ i+=m[0].length; n=lit(String.fromCodePoint(parseInt(m[1],16))); n.code='U+'+m[1].toUpperCase().padStart(4,'0'); }
    else if(c==='u' && (m=sticky(/[0-9a-fA-F]{4}/y,i))){ i+=4; n=lit(String.fromCharCode(parseInt(m[0],16))); n.code='U+'+m[0].toUpperCase(); }
    else if(c==='c' && (m=sticky(/[A-Za-z]/y,i))){ i+=1; const v=String.fromCharCode(m[0].toUpperCase().charCodeAt(0)-64); n={t:'ctrl',k:'c',v,cp:v.charCodeAt(0),name:'control character Ctrl+'+m[0].toUpperCase()}; }
    else {
      if(uni && !/[\^$\\.*+?()[\]{}|\/-]/.test(c)) throw new RxError('Invalid escape "\\'+c+'" — in unicode mode only syntax characters may be escaped',s,i);
      n=lit(c);
    }
    paint(s,i,'t-esc');
    n.s=s; n.e=i;
    if(n.cp===undefined) n.cp=null;
    return n;
  }

  try{
    const branches=parseDisjunction();
    if(i<src.length) throw new RxError('Unmatched ")" — there is no "(" that opens this group',i);
    const nameSet=Object.values(names);
    for(const b of backrefs){
      if(b.name!=null && !nameSet.includes(b.name)) throw new RxError('Backreference to an undefined group name "'+b.name+'"',b.s,b.e);
      if(b.n!=null && uni && b.n>groups) throw new RxError('Backreference \\'+b.n+' points to a group that does not exist (only '+groups+' capture group'+(groups===1?'':'s')+')',b.s,b.e);
    }
    return {ok:true,branches,cls,names,groups};
  }catch(e){
    if(!(e instanceof RxError)) e=new RxError(String(e.message||e),Math.min(i,src.length));
    return {ok:false,error:e,cls,names,groups};
  }
}

/* largest prefix that still compiles → first offending character */
function locateByPrefix(src,flags){
  if(src.length>1500) return src.length;
  for(let k=src.length-1;k>=1;k--){ try{ new RegExp(src.slice(0,k),flags); return k; }catch(_){} }
  return 0;
}

/* ════════════ matching (runs inside a worker, or inline as fallback) ════════════ */
function matchJob(job){
  var re, ind=true;
  try{ re=new RegExp(job.pattern, job.flags+'d'); }
  catch(e){ ind=false; try{ re=new RegExp(job.pattern, job.flags); }catch(e2){ return {id:job.id,error:String(e2.message)}; } }
  var text=job.text, out=[], truncated=false, m;
  var now=function(){ return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now(); };
  var t0=now();
  function push(m){
    var g=[];
    for(var k=1;k<m.length;k++){
      if(m[k]===undefined) g.push(null);
      else { var r=ind&&m.indices&&m.indices[k]; g.push({v:m[k],s:r?r[0]:-1,e:r?r[1]:-1}); }
    }
    out.push({i:m.index,e:m.index+m[0].length,v:m[0],g:g});
  }
  if(re.global){
    while((m=re.exec(text))){
      push(m);
      if(m[0]===''){
        var c=text.charCodeAt(re.lastIndex);
        re.lastIndex += (re.unicode && c>=0xD800 && c<=0xDBFF) ? 2 : 1;
      }
      if(out.length>=job.max){ truncated=true; break; }
    }
  } else { m=re.exec(text); if(m) push(m); }
  return {id:job.id,matches:out,truncated:truncated,ms:now()-t0,indices:ind};
}

let worker=null, workerOK=true, busy=false, pendingJob=null, lastJob=null, jobSeq=0, timer=null;
function makeWorker(){
  try{
    const url=URL.createObjectURL(new Blob([matchJob.toString()+';onmessage=function(e){postMessage(matchJob(e.data));};'],{type:'text/javascript'}));
    const w=new Worker(url);
    w.onmessage=e=>jobDone(e.data);
    w.onerror=()=>{ workerOK=false; worker=null; busy=false; clearTimeout(timer); pendingJob=null; if(lastJob) jobDone(matchJob(lastJob)); };
    return w;
  }catch(_){ workerOK=false; return null; }
}
function runJob(job){
  lastJob=job;
  if(workerOK && !worker) worker=makeWorker();
  if(!worker){ jobDone(matchJob(job)); return; }
  if(busy){ pendingJob=job; return; }
  busy=true; worker.postMessage(job);
  clearTimeout(timer);
  timer=setTimeout(()=>{
    if(worker){ worker.terminate(); worker=null; }
    busy=false;
    const timedOut=job;
    if(pendingJob){ const p=pendingJob; pendingJob=null; runJob(p); }
    else if(timedOut.id===jobSeq) renderTimeout();
  },TIMEOUT_MS);
  setTimeout(()=>{ if(busy && job.id===jobSeq) setStatus('busy','matching…'); },180);
}
function jobDone(res){
  clearTimeout(timer); busy=false;
  if(pendingJob){ const p=pendingJob; pendingJob=null; runJob(p); return; }
  if(res.id!==jobSeq) return;
  renderResult(res);
}

/* ════════════ state ════════════ */
const state={pattern:'',flags:'g',text:''};
let parsed=null, result=null, groupCount=0, activeN=-1;

const elPat=$('#pattern'), elPatInner=$('#pat-inner'), elPatBack=$('#pat-back'), elBox=$('#pattern-box');
const elText=$('#text'), elBackdrop=$('#backdrop'), elEditor=$('#editor');
const elErr=$('#error'), elExplain=$('#explain'), elTable=$('#table-wrap'), elTip=$('#match-tip');
const elLegend=$('#legend'), elMatchMeta=$('#match-meta'), elTextMeta=$('#text-meta');
const elSt=$('#st'), elHint=$('#hint'), elToast=$('#toast');

function setStatus(kind,text){ elSt.className='st '+kind; elSt.textContent=text; }
function normFlags(f){ return FLAG_ORDER.split('').filter(c=>f.includes(c)).join(''); }

/* ════════════ rendering: pattern ════════════ */
function renderPattern(errPos,errEnd){
  const src=state.pattern, cls=parsed.cls; let h='', k=0;
  for(const ch of src){
    const bad = errPos!=null && k>=errPos && k<Math.max(errEnd,errPos+1);
    h+='<s class="'+cls[k]+(bad?' err':'')+'" data-i="'+k+'">'+esc(ch)+'</s>';
    k+=ch.length;
  }
  elPatInner.innerHTML=h;
  syncPatScroll();
}
function syncPatScroll(){ elPatBack.scrollLeft=elPat.scrollLeft; }
function hoverRange(s,e){
  for(const el of elPatInner.children){ const k=+el.dataset.i; el.classList.toggle('hov', s!=null && k>=s && k<e); }
}

/* ════════════ rendering: error ════════════ */
function showError(engineMsg){
  const src=state.pattern;
  let msg=String(engineMsg).replace(/^Invalid regular expression:\s*/,'');
  const lit='/'+src+'/'+state.flags;
  if(msg.startsWith(lit)) msg=msg.slice(lit.length).replace(/^[:\s]+/,'');
  else { const j=msg.lastIndexOf('/: '); if(msg[0]==='/' && j>0) msg=msg.slice(j+3); }
  msg=msg.replace(/^[a-z]/,c=>c.toUpperCase());
  let pos,end,note;
  if(!parsed.ok){ pos=parsed.error.pos; end=parsed.error.end; note=parsed.error.message; }
  else { pos=locateByPrefix(src,state.flags); end=pos+1; note=pos>=src.length?'The pattern is incomplete — something is still missing at the end':'The pattern stops being valid at this character'; }
  pos=Math.max(0,Math.min(pos,src.length)); end=Math.max(pos+1,Math.min(end,src.length));
  const before=src.slice(0,pos), mid=src.slice(pos,end), after=src.slice(end);
  const tail=Math.max(0,[...mid].length-1);
  elErr.innerHTML=
    '<div class="e-head">✗ SyntaxError <span>— '+esc(msg)+'</span></div>'+
    '<pre>/'+esc(before)+'<span class="bad">'+esc(mid||' ')+'</span>'+esc(after)+'/'+esc(state.flags)+'\n'+
    '<span class="ghost">/'+esc(before)+'</span><span class="caret">^'+'~'.repeat(tail)+'</span></pre>'+
    '<div class="e-note"><b>position '+pos+'</b> (column '+(pos+1)+') · '+esc(note)+'</div>';
  elErr.hidden=false; elBox.classList.add('bad');
  renderPattern(pos,end);
  return {pos,msg,note};
}
function hideError(){ elErr.hidden=true; elBox.classList.remove('bad'); }

/* ════════════ rendering: explanation ════════════ */
const SETS={d:'any digit <em>(0–9)</em>',D:'any character that is <em>not</em> a digit',w:'any word character <em>(a–z, A–Z, 0–9, _)</em>',W:'any character that is <em>not</em> a word character',s:'any whitespace <em>(space, tab, line break)</em>',S:'any character that is <em>not</em> whitespace'};
const SETS_SHORT={d:'a digit',D:'a non-digit',w:'a word character',W:'a non-word character',s:'whitespace',S:'non-whitespace'};
function visible(v){
  return v===' '?'space':v==='\n'?'newline':v==='\t'?'tab':v==='\r'?'carriage return':v;
}
function quote(v){ const x=visible(v); return x===v ? '<b>“'+esc(v)+'”</b>' : '<b>'+x+'</b>'; }
function shorten(s,n){ return s.length>n ? s.slice(0,Math.ceil(n*.6))+'…'+s.slice(-Math.floor(n*.3)) : s; }
function qDesc(q){
  let s;
  if(q.min===0&&q.max===Infinity) s='zero or more times';
  else if(q.min===1&&q.max===Infinity) s='one or more times';
  else if(q.min===0&&q.max===1) s='optional (zero or one time)';
  else if(q.max===Infinity) s=q.min+' or more times';
  else if(q.min===q.max) s='exactly '+q.min+' time'+(q.min===1?'':'s');
  else s='between '+q.min+' and '+q.max+' times';
  if(q.lazy) s+=' — lazy, as few as possible';
  else if(q.max!==q.min) s+=' — greedy, as many as possible';
  return s;
}
function partDesc(p){
  if(p.t==='range') return '<b>'+esc(visible(p.a.v))+'–'+esc(visible(p.b.v))+'</b>';
  if(p.t==='set') return SETS_SHORT[p.k];
  if(p.t==='prop') return (p.neg?'not ':'')+'Unicode <b>'+esc(p.v)+'</b>';
  if(p.t==='ctrl') return p.name;
  return quote(p.v);
}
function describe(n){
  const f=state.flags, ci=f.includes('i');
  switch(n.t){
    case 'lit':{
      const many=[...n.v].length>1;
      let d = many ? 'the text '+quote(n.v)+' exactly' : 'the character '+quote(n.v)+(n.code?' <em>('+n.code+')</em>':'')+(n.escaped&&!n.code?' <em>(escaped, taken literally)</em>':'');
      if(ci && /\p{L}/u.test(n.v)) d+=' <em>· any letter case</em>';
      return d;
    }
    case 'any': return f.includes('s') ? 'any character at all, <em>including line breaks (s flag)</em>' : 'any character <em>except a line break</em>';
    case 'anchor':
      if(n.k==='^') return f.includes('m') ? 'start of a line <em>(m flag)</em>' : 'start of the text';
      return f.includes('m') ? 'end of a line <em>(m flag)</em>' : 'end of the text';
    case 'set': return SETS[n.k];
    case 'wordb': return n.k==='b' ? 'word boundary <em>— the edge between a word character and a non-word character</em>' : 'not a word boundary <em>— inside a word, or between two non-word characters</em>';
    case 'ctrl': return n.name;
    case 'prop': return 'any character '+(n.neg?'<em>without</em>':'with')+' the Unicode property <b>'+esc(n.v)+'</b>';
    case 'backref': return n.name!=null ? 'backreference <em>— the same text that group</em> <b>'+esc(n.name)+'</b> <em>captured</em>' : 'backreference <em>— the same text that group</em> <b>#'+n.n+'</b> <em>captured</em>';
    case 'class':{
      if(!n.parts.length) return n.neg ? 'any character at all <em>(empty negated class)</em>' : 'nothing <em>(empty class never matches)</em>';
      const list=n.parts.map(partDesc).join(', ');
      return (n.neg ? 'any one character <em>except</em>: ' : 'any one character of: ')+list;
    }
    case 'group':
      switch(n.kind){
        case 'capture': return 'capture group <b class="gc'+((n.no-1)%8+1)+'">#'+n.no+'</b> <em>— remembers what it matched</em>';
        case 'named': return 'capture group <b class="gc'+((n.no-1)%8+1)+'">#'+n.no+' “'+esc(n.name)+'”</b> <em>— named, remembers what it matched</em>';
        case 'noncap': return 'non-capturing group <em>— groups tokens, remembers nothing</em>';
        case 'lookahead': return 'positive lookahead <em>— what follows must match this, but is not consumed</em>';
        case 'neglookahead': return 'negative lookahead <em>— what follows must not match this</em>';
        case 'lookbehind': return 'positive lookbehind <em>— what comes before must match this</em>';
        case 'neglookbehind': return 'negative lookbehind <em>— what comes before must not match this</em>';
        case 'modifier': return 'inline flag group <em>— turns '+(n.mods[1]?'on “'+n.mods[1]+'”':'')+(n.mods[1]&&n.mods[2]?' and ':'')+(n.mods[2]?'off “'+n.mods[2]+'”':'')+' for its contents</em>';
      }
  }
  return '';
}
function tokClass(n){
  switch(n.t){
    case 'any':return 't-any'; case 'anchor':case 'wordb':return 't-anchor';
    case 'set':case 'ctrl':case 'prop':case 'backref':return 't-esc';
    case 'class':return 't-class';
    case 'group':return n.no?'gc'+((n.no-1)%8+1):'t-grp';
    case 'lit':return n.escaped?'t-esc':'t-lit';
  }
  return '';
}
function renderNode(n){
  const src=state.pattern;
  let h='<div class="ex-node"><div class="ex-row" data-s="'+n.s+'" data-e="'+n.e+'"><code class="tok '+tokClass(n)+'">'+esc(shorten(src.slice(n.s,n.e),30))+'</code><div class="ex-d">'+describe(n)+(n.q?' <span class="ex-q">'+qDesc(n.q)+'</span>':'')+'</div></div>';
  if(n.t==='group') h+='<div class="ex-kids">'+renderBranches(n.branches)+'</div>';
  return h+'</div>';
}
function renderSeq(b){
  if(!b.items.length) return '<div class="ex-node"><div class="ex-row" data-s="'+b.s+'" data-e="'+b.e+'"><code class="tok t-grp">∅</code><div class="ex-d">nothing <em>— matches the empty string</em></div></div></div>';
  return b.items.map(renderNode).join('');
}
function renderBranches(br){
  if(br.length===1) return renderSeq(br[0]);
  return br.map((b,k)=>'<div class="ex-or">'+(k?'or':'either')+'</div><div class="ex-kids">'+renderSeq(b)+'</div>').join('');
}
function flagsHtml(){
  let h='<div class="ex-sec">flags</div>';
  for(const c of FLAG_ORDER){
    const on=state.flags.includes(c);
    h+='<div class="ex-flag'+(on?'':' off')+'"><code class="tok">'+c+'</code><div class="ex-d">'+FLAG_INFO[c][0]+' <em>— '+(on?'':'off · ')+esc(FLAG_INFO[c][1])+'</em></div></div>';
  }
  return h;
}
function renderExplain(err){
  if(!state.pattern){
    elExplain.innerHTML='<div class="empty"><span class="big">/ … /</span>Type a pattern above and every token<br>will be explained here in plain English.</div>'+flagsHtml();
    return;
  }
  if(err){
    elExplain.innerHTML='<div class="ex-sec">pattern</div><div class="empty"><span class="big" style="color:var(--err)">✗</span><b>This pattern does not compile yet.</b><br>'+esc(err.note)+'.<br><br>Fix the character marked at position '+err.pos+' and the explanation will come back.</div>'+flagsHtml();
    return;
  }
  if(!parsed.ok){
    elExplain.innerHTML='<div class="ex-sec">pattern</div><div class="empty">The engine accepts this pattern, but it uses syntax this explainer does not understand yet.</div>'+flagsHtml();
    return;
  }
  elExplain.innerHTML='<div class="ex-sec">pattern · reads left to right</div>'+renderBranches(parsed.branches)+flagsHtml();
}

/* ════════════ rendering: highlights + table ════════════ */
function buildBackdrop(text,matches){
  let h='', last=0;
  for(let n=0;n<matches.length;n++){
    const m=matches[n];
    if(m.i<last) continue;
    h+=esc(text.slice(last,m.i));
    if(m.e===m.i){ h+='<mark class="m z" data-n="'+n+'"></mark>'; last=m.i; continue; }
    h+='<mark class="m'+(n&1?' odd':'')+'" data-n="'+n+'">';
    const gs=[], pts=[m.i,m.e];
    for(let k=0;k<m.g.length;k++){
      const g=m.g[k];
      if(g && g.s>=0){ const s=Math.max(g.s,m.i), e=Math.min(g.e,m.e); if(e>s){ gs.push({k:k+1,s,e}); pts.push(s,e); } }
    }
    if(!gs.length) h+=esc(m.v);
    else{
      const arr=[...new Set(pts)].sort((a,b)=>a-b);
      for(let p=0;p<arr.length-1;p++){
        const a=arr[p], b=arr[p+1]; let best=0;
        for(const g of gs) if(g.s<=a && g.e>=b) best=g.k;
        const t=esc(text.slice(a,b));
        h+= best ? '<span class="g g'+((best-1)%8+1)+'">'+t+'</span>' : t;
      }
    }
    h+='</mark>';
    last=m.e;
  }
  return h+esc(text.slice(last))+' ';
}
function vis(s,cls){
  const max=120; let cut=s.length>max; if(cut) s=s.slice(0,max);
  let h=esc(s).replace(/\n/g,'<span class="ws">↵</span>').replace(/\t/g,'<span class="ws">→</span>').replace(/\r/g,'<span class="ws">␍</span>');
  if(cut) h+='<span class="ws">…</span>';
  return h;
}
function groupLabel(k){ return parsed && parsed.names && parsed.names[k] ? parsed.names[k] : '$'+k; }

function renderLegend(){
  let h='';
  if(state.pattern && result){
    h='<span class="lg lg0">match</span>';
    const n=Math.min(groupCount,10);
    for(let k=1;k<=n;k++) h+='<span class="lg lg'+((k-1)%8+1)+'">'+esc(groupLabel(k))+'</span>';
    if(groupCount>n) h+='<span class="lg">+'+(groupCount-n)+'</span>';
  }
  elLegend.innerHTML=h;
}
function renderTextMeta(){
  const t=state.text; const lines=t?t.split('\n').length:0;
  elTextMeta.textContent=t.length+' char'+(t.length===1?'':'s')+' · '+lines+' line'+(lines===1?'':'s');
}

function renderIdle(){
  result=null; activeN=-1;
  elBackdrop.innerHTML=esc(state.text)+' ';
  elLegend.innerHTML=''; elTip.innerHTML=''; elMatchMeta.textContent='';
}
function renderResult(res){
  if(res.error){ return; }
  result=res; activeN=-1;
  const ms=res.matches, n=ms.length;
  elBackdrop.innerHTML=buildBackdrop(state.text,ms);
  renderLegend();
  const count=(res.truncated?n+'+':n)+' match'+(n===1?'':'es');
  const t=res.ms<10?res.ms.toFixed(2):res.ms.toFixed(0);
  elMatchMeta.textContent=count+' · '+t+' ms';
  setStatus(n?'ok':'warn', n?count+' in '+t+' ms':'no matches');

  let tip='';
  if(!state.flags.includes('g') && n===1) tip='Only the first match is returned. Turn on the <kbd>g</kbd> flag to find them all.';
  else if(res.truncated) tip='Stopped after the first '+MAX_MATCHES+' matches to keep things fast.';
  else if(n>1 && ms.every(m=>m.e===m.i)) tip='Every match is empty (zero-length) — this pattern can match “nothing”. Thin bars mark the positions.';
  if(state.flags.includes('y') && !tip) tip='Sticky <kbd>y</kbd>: matching starts at index 0 and stops at the first gap.';
  elTip.innerHTML=tip?'<div class="tip">'+tip+'</div>':'';

  if(!n){
    elTable.innerHTML='<div class="empty"><span class="big">∅</span>'+(state.text?'<b>No matches.</b> The pattern is valid, but nothing in the test text fits it.':'<b>No test text.</b> Type something in the pane above.')+'</div>';
    return;
  }
  const gc=Math.max(groupCount, ms[0].g.length);
  let h='<table><thead><tr><th>#</th><th><span class="dot" style="background:rgb(var(--g0))"></span>match</th><th>index</th><th>len</th>';
  for(let k=1;k<=gc;k++) h+='<th><span class="dot" style="background:rgb(var(--g'+((k-1)%8+1)+'))"></span>'+esc(groupLabel(k))+(parsed.names&&parsed.names[k]?' <span style="color:var(--faint)">$'+k+'</span>':'')+'</th>';
  h+='</tr></thead><tbody>';
  const rows=Math.min(n,MAX_ROWS);
  for(let r=0;r<rows;r++){
    const m=ms[r];
    h+='<tr data-n="'+r+'"><td class="num">'+(r+1)+'</td><td>'+(m.v===''?'<span class="nil">empty</span>':'<span class="v v0" title="'+esc(m.v)+'">'+vis(m.v)+'</span>')+'</td><td class="idx">'+m.i+'<i> → </i>'+m.e+'</td><td class="idx">'+(m.e-m.i)+'</td>';
    for(let k=0;k<gc;k++){
      const g=m.g[k];
      if(!g) h+='<td><span class="nil">undefined</span></td>';
      else if(g.v==='') h+='<td><span class="nil">empty</span>'+(g.s>=0?'<span class="rng">@'+g.s+'</span>':'')+'</td>';
      else h+='<td><span class="v g'+(k%8+1)+'" title="'+esc(g.v)+'">'+vis(g.v)+'</span>'+(g.s>=0?'<span class="rng">'+g.s+'–'+g.e+'</span>':'')+'</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(n>rows) h+='<div class="empty">Showing the first '+rows+' of '+(res.truncated?n+'+':n)+' matches — all of them are highlighted in the text.</div>';
  elTable.innerHTML=h;
}
function renderTimeout(){
  result=null;
  elBackdrop.innerHTML=esc(state.text)+' ';
  elMatchMeta.textContent='timed out';
  elTip.innerHTML='';
  elTable.innerHTML='<div class="empty"><span class="big" style="color:var(--warn)">⏱</span><b>Stopped after '+(TIMEOUT_MS/1000)+' s.</b><br>This pattern is taking too long on this text — probably catastrophic backtracking.<br>Look for nested quantifiers like <kbd>(a+)+</kbd> or overlapping alternatives.</div>';
  setStatus('warn','timed out — catastrophic backtracking?');
}

function setActive(n,from){
  if(!result) return;
  const prev=elBackdrop.querySelector('mark.on'); if(prev) prev.classList.remove('on');
  const prow=elTable.querySelector('tr.on'); if(prow) prow.classList.remove('on');
  activeN=n; if(n<0) return;
  const mark=elBackdrop.querySelector('mark[data-n="'+n+'"]');
  const row=elTable.querySelector('tr[data-n="'+n+'"]');
  if(mark){
    mark.classList.add('on');
    if(from==='table'){
      const top=mark.offsetTop, vh=elEditor.clientHeight;
      if(top<elEditor.scrollTop+10 || top>elEditor.scrollTop+vh-40) elEditor.scrollTop=Math.max(0,top-vh/2);
    }
  }
  if(row){
    row.classList.add('on');
    if(from==='text'){
      const top=row.offsetTop, vh=elTable.clientHeight;
      if(top<elTable.scrollTop+34 || top>elTable.scrollTop+vh-34) elTable.scrollTop=Math.max(0,top-vh/2);
    }
  }
}
function matchAt(pos){
  if(!result) return -1;
  const ms=result.matches; let lo=0, hi=ms.length-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1, m=ms[mid];
    if(pos<m.i) hi=mid-1; else if(pos>m.e || (pos===m.e && m.e>m.i)) lo=mid+1; else return mid;
  }
  return -1;
}

/* ════════════ main update ════════════ */
function update(){
  const {pattern,flags,text}=state;
  parsed=parseRegex(pattern,flags);
  renderTextMeta();
  jobSeq++;
  if(!pattern){
    hideError(); renderPattern(); renderIdle(); renderExplain();
    elTable.innerHTML='<div class="empty"><span class="big">❯_</span>Waiting for a pattern. Try a quick insert, or pick one from <b>examples</b>.</div>';
    setStatus('','ready');
    persist(); return;
  }
  let engineErr=null;
  try{ new RegExp(pattern,flags); }catch(e){ engineErr=e; }
  if(engineErr){
    const info=showError(engineErr.message);
    renderIdle(); renderExplain(info);
    elMatchMeta.textContent='—';
    elTable.innerHTML='<div class="empty"><span class="big" style="color:var(--err)">✗</span><b>Invalid pattern.</b> Matching is paused until the error above is fixed.</div>';
    setStatus('err','syntax error at position '+info.pos);
    persist(); return;
  }
  hideError(); renderPattern(); renderExplain();
  try{ groupCount=new RegExp(pattern+'|',flags.replace(/[gy]/g,'')).exec('').length-1; }catch(_){ groupCount=parsed.groups||0; }
  runJob({id:jobSeq,pattern,flags,text,max:MAX_MATCHES});
  persist();
}

/* ════════════ persistence + permalink ════════════ */
let persistT=null;
function buildHash(){
  let h='#p='+encodeURIComponent(state.pattern)+'&f='+state.flags;
  if(state.text && state.text.length<=4000) h+='&t='+encodeURIComponent(state.text);
  return h;
}
function persist(){
  clearTimeout(persistT);
  persistT=setTimeout(()=>{
    try{ history.replaceState(null,'',state.pattern||state.text?buildHash():location.pathname+location.search); }catch(_){}
    try{ localStorage.setItem('regexlab:state',JSON.stringify(state)); }catch(_){}
  },250);
}
function readHash(){
  const raw=location.hash.replace(/^#/,''); if(!raw) return null;
  try{
    const q=new URLSearchParams(raw);
    if(!q.has('p')) return null;
    return {pattern:q.get('p')||'',flags:normFlags(q.get('f')||''),text:q.has('t')?q.get('t'):null};
  }catch(_){ return null; }
}
function load(s){
  state.pattern=s.pattern; state.flags=normFlags(s.flags||''); if(s.text!=null) state.text=s.text;
  elPat.value=state.pattern; elText.value=state.text;
  renderFlags(); update();
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(_){}
  try{
    const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(_){ return false; }
}
let toastT=null;
function toast(msg,action,fn){
  elToast.innerHTML='<span>'+esc(msg)+'</span>';
  if(action){ const b=document.createElement('button'); b.textContent=action; b.onclick=()=>{ fn(); elToast.classList.remove('show'); }; elToast.appendChild(b); }
  elToast.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>elToast.classList.remove('show'),action?6000:2200);
}

/* ════════════ UI wiring ════════════ */
function renderFlags(){
  $('#flags').innerHTML=FLAG_ORDER.split('').map(c=>'<button class="flag" data-f="'+c+'" aria-pressed="'+state.flags.includes(c)+'" aria-label="'+FLAG_INFO[c][0]+' flag" data-hint="<b>'+c+'</b> · '+FLAG_INFO[c][0]+' — '+esc(FLAG_INFO[c][1])+'">'+c+'</button>').join('');
}
$('#flags').addEventListener('click',e=>{
  const b=e.target.closest('.flag'); if(!b) return;
  const c=b.dataset.f;
  state.flags=normFlags(state.flags.includes(c)?state.flags.replace(c,''):state.flags+c);
  renderFlags(); update();
  const nb=$('#flags [data-f="'+c+'"]'); if(nb) nb.focus();
});

$('#quick').innerHTML=QUICK.map(([label,items])=>'<div class="qgroup"><span class="qlabel">'+label+'</span>'+items.map(([l,ins,d])=>'<button class="chip" data-ins="'+esc(ins)+'" data-hint="<b>'+esc(l)+'</b> · '+esc(d)+'" aria-label="Insert '+esc(l)+': '+esc(d)+'">'+esc(l)+'</button>').join('')+'</div>').join('');
$('#quick').addEventListener('mousedown',e=>{ if(e.target.closest('.chip')) e.preventDefault(); });
$('#quick').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  insertToken(b.dataset.ins);
});
function insertToken(tok){
  elPat.focus();
  const s=elPat.selectionStart, e=elPat.selectionEnd, sel=elPat.value.slice(s,e);
  const idx=tok.indexOf('‸'); let out=tok, caret;
  if(idx>=0){ out=tok.replace('‸',sel); caret= sel ? s+out.length : s+idx; }
  else caret=s+out.length;
  let done=false;
  try{ done=document.execCommand('insertText',false,out); }catch(_){}
  if(!done || elPat.value.slice(s,s+out.length)!==out) elPat.setRangeText(out,s,e,'end');
  elPat.setSelectionRange(caret,caret);
  state.pattern=elPat.value; update();
}

elPat.addEventListener('input',()=>{ state.pattern=elPat.value; update(); });
['scroll','keyup','click','select','focus','blur'].forEach(ev=>elPat.addEventListener(ev,()=>requestAnimationFrame(syncPatScroll)));
elPat.addEventListener('keydown',e=>{
  requestAnimationFrame(syncPatScroll);
  if(e.key==='Enter'){ e.preventDefault(); elText.focus(); }
});
elText.addEventListener('input',()=>{ state.text=elText.value; update(); });
function caretToMatch(){ if(elText.selectionStart===elText.selectionEnd) setActive(matchAt(elText.selectionStart),'text'); }
elText.addEventListener('click',caretToMatch);
elText.addEventListener('keyup',e=>{ if(/^Arrow|Home|End|Page/.test(e.key)) caretToMatch(); });
elEditor.addEventListener('mousedown',e=>{ if(e.target===elEditor){ e.preventDefault(); elText.focus(); } });

elTable.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-n]'); if(!tr) return;
  const n=+tr.dataset.n; setActive(n,'table');
});
elTable.addEventListener('dblclick',e=>{
  const tr=e.target.closest('tr[data-n]'); if(!tr||!result) return;
  const m=result.matches[+tr.dataset.n]; elText.focus(); elText.setSelectionRange(m.i,m.e);
});

elExplain.addEventListener('mouseover',e=>{
  const r=e.target.closest('.ex-row[data-s]');
  if(r) hoverRange(+r.dataset.s,+r.dataset.e); else hoverRange(null);
});
elExplain.addEventListener('mouseleave',()=>hoverRange(null));
elExplain.addEventListener('click',e=>{
  const r=e.target.closest('.ex-row[data-s]'); if(!r) return;
  elPat.focus(); elPat.setSelectionRange(+r.dataset.s,+r.dataset.e); requestAnimationFrame(syncPatScroll);
});

/* hint bar */
elHint.innerHTML=DEFAULT_HINT;
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-hint]');
  elHint.innerHTML=t?t.dataset.hint:DEFAULT_HINT;
});
document.addEventListener('focusin',e=>{
  const t=e.target.closest&&e.target.closest('[data-hint]');
  if(t) elHint.innerHTML=t.dataset.hint;
});

$('#btn-copy').addEventListener('click',async()=>{
  const lit='/'+(state.pattern||'(?:)')+'/'+state.flags;
  toast(await copyText(lit)?'Copied '+shorten(lit,48):'Could not access the clipboard');
});
$('#btn-share').addEventListener('click',async()=>{
  const hash=buildHash();
  try{ history.replaceState(null,'',hash); }catch(_){}
  const url=location.href.split('#')[0]+hash;
  toast(await copyText(url)?'Permalink copied — pattern + flags are in the URL hash':'Could not access the clipboard — copy the address bar instead');
});
$('#btn-clear').addEventListener('click',()=>{
  if(!state.pattern && !state.text){ elPat.focus(); return; }
  const prev={pattern:state.pattern,flags:state.flags,text:state.text};
  load({pattern:'',flags:state.flags,text:''});
  elPat.focus();
  toast('Cleared pattern and test text','undo',()=>load(prev));
});

/* theme */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('regexlab:theme',t); }catch(_){}
}
$('#btn-theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
try{ const t=localStorage.getItem('regexlab:theme'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(_){}

/* examples menu */
const elMenu=$('#menu'), elMenuBtn=$('#btn-examples');
elMenu.innerHTML=EXAMPLES.map((x,k)=>'<button role="menuitem" data-k="'+k+'"><b>'+esc(x.name)+'</b><code>/'+esc(x.p)+'/'+x.f+'</code></button>').join('');
function toggleMenu(open){ elMenu.hidden=!open; elMenuBtn.setAttribute('aria-expanded',String(open)); if(open){ const b=elMenu.querySelector('button'); if(b) b.focus(); } }
elMenuBtn.addEventListener('click',e=>{ e.stopPropagation(); toggleMenu(elMenu.hidden); });
elMenu.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const x=EXAMPLES[+b.dataset.k]; load({pattern:x.p,flags:x.f,text:x.t}); toggleMenu(false); elPat.focus();
});
elMenu.addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
  e.preventDefault();
  const bs=[...elMenu.querySelectorAll('button')], k=bs.indexOf(document.activeElement);
  bs[(k+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();
});
document.addEventListener('click',e=>{ if(!elMenu.hidden && !elMenu.contains(e.target)) toggleMenu(false); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !elMenu.hidden){ toggleMenu(false); elMenuBtn.focus(); }
  if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); elPat.focus(); elPat.select(); }
});

window.addEventListener('hashchange',()=>{
  const h=readHash();
  if(h && (h.pattern!==state.pattern || h.flags!==state.flags || (h.text!=null && h.text!==state.text))) load(h);
});

/* ════════════ boot ════════════ */
(function init(){
  renderFlags();
  let s=readHash();
  if(s && s.text==null) s.text=EXAMPLES[0].t;
  if(!s){ try{ const j=JSON.parse(localStorage.getItem('regexlab:state')||'null'); if(j && typeof j.pattern==='string' && (j.pattern||j.text)) s={pattern:j.pattern,flags:j.flags||'',text:j.text||''}; }catch(_){} }
  if(!s) s={pattern:EXAMPLES[0].p,flags:EXAMPLES[0].f,text:EXAMPLES[0].t};
  load(s);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncPatScroll);
})();
})();
</script>
</body>
</html>
