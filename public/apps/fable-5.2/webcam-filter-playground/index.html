<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webcam Filter Playground</title>
<meta name="description" content="Apply fun and surprising real-time filters to your webcam, snap a photo, save it.">
<meta name="theme-color" content="#0b0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a09; --panel:#171512; --panel2:#211e1a;
  --line:rgba(255,238,214,.11); --line2:rgba(255,238,214,.22);
  --text:#f3eee6; --mute:#958c80; --accent:#ff5a36; --accent-ink:#1a0a05;
  --glow:255 90 54;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{display:block}

.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  max-width:1500px;margin:0 auto}

/* ───── header ───── */
header{display:flex;align-items:center;gap:16px;padding:4px 2px 12px;min-width:0}
h1{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.01em;margin:0;white-space:nowrap;line-height:1}
h1 em{color:var(--accent)}
.legend{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto;white-space:nowrap;letter-spacing:.02em}
.legend kbd{font:inherit;color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;margin-right:4px}
.legend span+span{margin-left:14px}
.top{display:flex;align-items:center;gap:8px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.12em;display:flex;align-items:center;gap:7px;
  padding:0 10px;height:28px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.status[data-k=camera]{color:var(--text)}
.status[data-k=camera] i{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--text);transition:background .15s,border-color .15s,color .15s,transform .15s;flex:none;position:relative}
.ib:hover{background:var(--panel2);border-color:var(--line2)}
.ib:active{transform:scale(.93)}
.ib[aria-pressed=true]{color:var(--accent);border-color:rgba(255,90,54,.55);background:rgba(255,90,54,.1)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib.sm{width:32px;height:32px}
.ib.sm svg{width:16px;height:16px}
.ib .sub{position:absolute;right:-3px;bottom:-3px;font:500 9px var(--mono);background:var(--accent);color:var(--accent-ink);
  border-radius:99px;padding:1px 4px;line-height:1.3}
[hidden]{display:none!important}

/* ───── stage ───── */
.stage{container-type:size;display:grid;place-items:center;min-height:0;min-width:0}
.frame{--ar:1.7778;position:relative;width:min(100cqw,calc(100cqh * var(--ar)));aspect-ratio:var(--ar);
  border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--line),0 24px 110px -18px rgb(var(--glow) / .5);touch-action:none}
#view{width:100%;height:100%;display:block}
.tag{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:calc(100% - 28px)}
.tag-main{display:flex;align-items:baseline;gap:9px;background:rgba(11,10,9,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:5px 13px 7px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.09)}
.tag-main i{font:500 10px var(--mono);font-style:normal;color:var(--accent);letter-spacing:.08em}
.tag-main b{font-family:var(--serif);font-weight:400;font-style:italic;font-size:21px;line-height:1}
.tag.pop .tag-main{animation:tagin .45s cubic-bezier(.2,.9,.2,1.1)}
@keyframes tagin{from{transform:translateY(-6px) scale(.94);opacity:0}}
.hint{font-size:12.5px;color:#fff;background:rgba(11,10,9,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:5px 11px;border-radius:10px;opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s;max-width:340px}
.hint.on{opacity:1;transform:none}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-size:min(46cqh,40cqw);line-height:1;color:#fff;text-shadow:0 6px 60px rgba(0,0,0,.55)}
.count span{animation:tick .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes tick{0%{transform:scale(1.5);opacity:0}18%{opacity:1}80%{opacity:1}100%{transform:scale(.82);opacity:0}}
.count small{position:absolute;bottom:9%;font:500 12px var(--mono);font-style:normal;letter-spacing:.18em;text-shadow:none;
  background:rgba(11,10,9,.6);padding:5px 12px;border-radius:99px}

.dock{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;pointer-events:none}
.card{pointer-events:auto;display:flex;align-items:center;gap:12px;background:rgba(18,16,14,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:9px 10px 9px 14px;font-size:13px;max-width:560px;
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.card p{margin:0;min-width:0}
.card p b{font-weight:600}
.card p span{color:#c9c1b5}
.card .acts{display:flex;gap:6px;flex:none;align-items:center}
.toast{transform:translateY(12px);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .3s;pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast img{width:44px;height:44px;border-radius:8px;object-fit:cover;margin:-3px 0 -3px -7px;background:#000}
.btn{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);font-weight:500;font-size:13px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:#ff7352}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.lg{height:40px;padding:0 18px;font-size:14px}

/* ───── controls ───── */
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 2px 12px}
.gl{justify-self:start;display:flex;align-items:center;gap:12px}
.gc{display:flex;align-items:center;gap:18px}
.gr{justify-self:end;display:flex;align-items:center;gap:10px}

.roll{width:52px;height:52px;border-radius:13px;border:1px solid var(--line2);position:relative;background:var(--panel) center/cover;
  display:grid;place-items:center;color:var(--mute);transition:transform .15s,border-color .15s}
.roll:hover{border-color:var(--text);transform:rotate(-3deg) scale(1.04)}
.roll svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.roll.has svg{display:none}
.roll.pop{animation:rollpop .5s cubic-bezier(.2,1.4,.3,1)}
@keyframes rollpop{0%{transform:scale(.6) rotate(-12deg)}100%{transform:none}}
.roll em{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:99px;background:var(--text);color:var(--bg);
  font:500 11px/20px var(--mono);font-style:normal;text-align:center;padding:0 5px}
.roll-l{font:11px var(--mono);color:var(--mute);letter-spacing:.04em;line-height:1.5}
.roll-l b{display:block;color:var(--text);font-weight:500}

.shutter{width:74px;height:74px;border-radius:50%;border:3px solid var(--text);display:grid;place-items:center;flex:none;transition:border-color .2s}
.shutter i{width:58px;height:58px;border-radius:50%;background:var(--text);transition:transform .16s,border-radius .2s,background .2s,width .2s,height .2s;
  display:grid;place-items:center;font:500 13px var(--mono);font-style:normal;color:var(--bg)}
.shutter:hover i{transform:scale(.93);background:#fff}
.shutter:active i{transform:scale(.82)}
.shutter.busy{border-color:var(--accent)}
.shutter.busy i{width:26px;height:26px;border-radius:7px;background:var(--accent);font-size:0}
.dice.roll-it svg{animation:dice .5s cubic-bezier(.3,1.5,.4,1)}
@keyframes dice{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}

.amt{width:190px;display:flex;flex-direction:column;gap:7px;margin-right:6px}
.amt label{display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.amt label output{color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;margin:0;cursor:pointer;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--text) var(--v),var(--line2) var(--v))}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-7px;border:0;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}

/* ───── filter strip ───── */
.strip-wrap{position:relative;margin:0 -16px}
.strip-wrap::before,.strip-wrap::after{content:"";position:absolute;top:0;bottom:0;width:36px;z-index:1;pointer-events:none}
.strip-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.strip-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 20px 8px;scrollbar-width:none;scroll-padding:0 60px}
.strip::-webkit-scrollbar{display:none}
.fx{flex:none;width:108px;display:flex;flex-direction:column;gap:7px;text-align:left;color:var(--mute);transition:color .15s}
.fx canvas{width:108px;height:68px;border-radius:10px;object-fit:cover;background:var(--panel);display:block;
  box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s,transform .2s cubic-bezier(.2,.9,.2,1)}
.fx:hover{color:var(--text)}
.fx:hover canvas{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line2)}
.fx[aria-selected=true]{color:var(--text)}
.fx[aria-selected=true] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.fx span{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;display:flex;gap:6px;align-items:baseline}
.fx span i{font:10px var(--mono);font-style:normal;opacity:.6}
.fx[aria-selected=true] span i{color:var(--accent);opacity:1}
.fx:focus-visible{outline:none}
.fx:focus-visible canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}

/* ───── lightbox ───── */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100vw;height:100vh;height:100dvh;overflow:hidden}
dialog::backdrop{background:rgba(8,7,6,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:14px;padding:16px;animation:lbin .25s ease-out}
@keyframes lbin{from{opacity:0;transform:scale(.985)}}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lb-cap b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:26px;line-height:1.1;display:block}
.lb-cap span{font:11px var(--mono);color:var(--mute);letter-spacing:.05em}
.lb-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:0}
.lb-main img{width:100%;height:100%;object-fit:contain;min-height:0;filter:drop-shadow(0 20px 50px rgba(0,0,0,.6))}
.lb-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.lb-film{display:flex;gap:8px;justify-content:safe center;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none}
.lb-film::-webkit-scrollbar{display:none}
.lb-film button{flex:none;width:64px;height:48px;border-radius:8px;background:#000 center/cover;opacity:.5;transition:opacity .15s,box-shadow .15s}
.lb-film button:hover{opacity:.85}
.lb-film button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

.fatal{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:var(--bg);z-index:9}
.fatal h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;margin:0 0 8px}
.fatal p{color:var(--mute);max-width:420px;margin:0 auto}
.drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:22px;background:rgba(255,90,54,.08);z-index:8;display:none;
  place-items:center;font-family:var(--serif);font-style:italic;font-size:34px;pointer-events:none}
.dragging .drop{display:grid}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
video.src{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

@media (max-width:980px){.legend{display:none}.top{margin-left:auto}}
@media (max-width:720px){
  h1{font-size:20px}
  .frame{border-radius:14px}
  .controls{grid-template-columns:1fr auto auto auto 1fr;grid-template-areas:"amt amt amt strip mirror" "roll timer shut dice .";gap:12px 12px;padding:12px 0 10px}
  .gl,.gc,.gr{display:contents}
  .amt{grid-area:amt;width:auto;margin:0}
  #btnStrip{grid-area:strip}#btnMirror{grid-area:mirror;justify-self:end}
  .roll{grid-area:roll}.roll-l{display:none}
  #btnTimer{grid-area:timer}.shutter{grid-area:shut}#btnDice{grid-area:dice}
  .shutter{width:66px;height:66px}.shutter i{width:51px;height:51px}
  .fx{width:88px}.fx canvas{width:88px;height:58px}
  .card{font-size:12.5px;flex-wrap:wrap;justify-content:flex-end}.card p{flex:1 1 180px}
  .tag-main b{font-size:18px}
  .lb-main{grid-template-columns:minmax(0,1fr)}
  .lb-main .ib{display:none}
}
@media (max-height:560px){
  header{padding-bottom:6px}
  .fx canvas{height:44px}.fx span{display:none}
  .controls{padding:8px 0}
  .shutter{width:58px;height:58px}.shutter i{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Webcam Filter <em>Playground</em></h1>
    <div class="legend" aria-hidden="true"><span><kbd>Space</kbd>snap</span><span><kbd>←</kbd><kbd>→</kbd>filters</span><span><kbd>R</kbd>surprise me</span><span><kbd>S</kbd>save</span></div>
    <div class="top">
      <div class="status" id="status" data-k="demo" role="status"><i></i><span>DEMO</span></div>
      <button class="ib" id="btnCam" title="Use camera" aria-label="Use camera">
        <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h7l1.3 2h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.500z"/><circle cx="12" cy="13" r="3.6"/></svg>
      </button>
      <button class="ib" id="btnOpen" title="Open a photo instead" aria-label="Open a photo instead">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.500" width="18" height="15" rx="2.500"/><circle cx="8.500" cy="10" r="1.600"/><path d="m4 18 5.500-5 4 3.500 2.500-2 4.500 3.500"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="frame" id="frame">
      <canvas id="view" aria-label="Live filtered preview"></canvas>
      <div class="tag" id="tag"><div class="tag-main"><i id="tagIdx">01</i><b id="tagName">Au Naturel</b></div><div class="hint" id="hint"></div></div>
      <div class="count" id="count" hidden></div>
      <div class="flash" id="flash"></div>
      <div class="dock">
        <div class="card toast" id="toast" role="status" aria-live="polite">
          <img id="toastImg" alt=""><p id="toastMsg"></p>
          <div class="acts" id="toastActs"><button class="btn primary" id="toastSave"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.500-4.500M12 15l4.500-4.500M5 19.500h14"/></svg>Save</button><button class="btn" id="toastView">View</button></div>
        </div>
        <div class="card" id="notice" hidden>
          <p id="noticeMsg"></p>
          <div class="acts"><button class="btn primary" id="noticeRetry">Enable camera</button><button class="btn" id="noticePhoto">Use a photo</button><button class="ib sm" id="noticeX" aria-label="Dismiss"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        </div>
      </div>
    </div>
  </main>

  <section class="controls" aria-label="Capture controls">
    <div class="gl">
      <button class="roll" id="btnRoll" title="Your shots (G)" aria-label="Open your shots">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2.500"/><path d="M7 3.500h11.500A2.500 2.500 0 0 1 21 6v11"/></svg>
        <em id="rollN" hidden>0</em>
      </button>
      <div class="roll-l"><b id="rollT">No shots yet</b><span id="rollS">Press the shutter</span></div>
    </div>
    <div class="gc">
      <button class="ib" id="btnTimer" aria-pressed="false" title="Self-timer (T)" aria-label="Self-timer, off">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13.500" r="7.500"/><path d="M12 9.500v4l2.500 2M9.500 3h5"/></svg><span class="sub" id="timerSub" hidden>3s</span>
      </button>
      <button class="shutter" id="btnShoot" title="Take a snapshot (Space)" aria-label="Take a snapshot"><i id="shootI"></i></button>
      <button class="ib dice" id="btnDice" title="Surprise me (R)" aria-label="Surprise me with a random filter">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.500"/><circle cx="8.700" cy="8.700" r=".6" fill="currentColor"/><circle cx="15.300" cy="8.700" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="8.700" cy="15.300" r=".6" fill="currentColor"/><circle cx="15.300" cy="15.300" r=".6" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="gr">
      <div class="amt">
        <label for="amt"><span id="amtName">Polish</span><output id="amtVal">30</output></label>
        <input type="range" id="amt" min="0" max="100" value="30">
      </div>
      <button class="ib" id="btnStrip" aria-pressed="false" title="Photo-booth strip: four shots in one" aria-label="Photo-booth strip mode">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.500" width="10" height="19" rx="1.800"/><path d="M7 8.800h10M7 15.200h10"/></svg>
      </button>
      <button class="ib" id="btnMirror" aria-pressed="true" title="Mirror (M)" aria-label="Mirror image">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M8.500 7 3.500 17h5zM15.500 7l5 10h-5z"/></svg>
      </button>
    </div>
  </section>

  <div class="strip-wrap"><nav class="strip" id="strip" role="listbox" aria-label="Filters"></nav></div>
</div>

<dialog id="lb" aria-label="Your shots">
  <div class="lb-top">
    <div class="lb-cap"><b id="lbName"></b><span id="lbMeta"></span></div>
    <button class="ib" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="lb-main">

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const view = $('view'), frameEl = $('frame'), video = $('video');

/* ════════════════════════ Shaders ════════════════════════ */
const VS = `attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

const COMMON = `
varying vec2 vUv;
uniform sampler2D uTex;uniform sampler2D uPrev;
uniform vec2 uRes;uniform vec2 uMouse;
uniform float uTime;uniform float uAmt;uniform float uScan;uniform float uThumb;
#define PI 3.14159265
vec2 mir(vec2 u){u=mod(u,2.);return mix(u,2.-u,step(1.,u));}
vec3 tex(vec2 u){return texture2D(uTex,mir(u)).rgb;}
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 hash2(vec2 p){float n=hash(p);return vec2(n,hash(p+n+17.1));}
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
vec3 hueRot(vec3 c,float a){vec3 k=vec3(.57735);float ca=cos(a),sa=sin(a);return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca);}
float asp(){return uRes.x/uRes.y;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec2 sob(vec2 uv,float w){vec2 e=w/uRes;
 float a=luma(tex(uv+e*vec2(-1.,1.))),b=luma(tex(uv+e*vec2(0.,1.))),c=luma(tex(uv+e*vec2(1.,1.)));
 float d=luma(tex(uv+e*vec2(-1.,0.))),f=luma(tex(uv+e*vec2(1.,0.)));
 float g=luma(tex(uv+e*vec2(-1.,-1.))),h=luma(tex(uv+e*vec2(0.,-1.))),i=luma(tex(uv+e*vec2(1.,-1.)));
 return vec2((c+2.*f+i)-(a+2.*d+g),(a+2.*b+c)-(g+2.*h+i));}
`;
const MAIN = `
void main(){gl_FragColor=vec4(clamp(fx(vUv),0.,1.),1.);}`;

const FILTERS = [
{id:'clean',name:'Au Naturel',p:'Polish',amt:.3,src:`
vec3 fx(vec2 uv){vec3 c=tex(uv);float l=luma(c);c=mix(vec3(l),c,1.+uAmt*.55);c=mix(c,c*c*(3.-2.*c),uAmt*.5);
 float v=1.-smoothstep(.35,1.15,length((uv-.5)*vec2(1.2,1.)));return c*mix(1.,v,uAmt*.7);}`},

{id:'timewarp',name:'Time Warp',p:'Speed',amt:.45,fb:1,hint:'A line sweeps down and freezes whatever it crosses. Move as it passes — click the picture to rescan.',src:`
vec3 fx(vec2 uv){float line=1.-uScan;
 if(uv.y>line){
  if(uThumb>.5){float k=uv.y-line;return tex(uv+vec2(sin(uv.y*26.)*.22*k,0.));}
  return texture2D(uPrev,uv).rgb;}
 return tex(uv);}`},

{id:'kaleido',name:'Kaleidoscope',p:'Segments',amt:.35,hint:'Move your pointer to turn the mirrors.',src:`
vec3 fx(vec2 uv){vec2 p=(uv-.5)*vec2(asp(),1.);float r=length(p);float a=atan(p.y,p.x)+uTime*.12+(uMouse.x-.5)*3.;
 float n=floor(3.+uAmt*9.);float s=PI/n;a=mod(a,2.*s);a=abs(a-s)+uTime*.05;
 vec2 q=r*vec2(cos(a),sin(a));q.x/=asp();return tex(q*1.15+vec2(.5)+(uMouse-.5)*.35);}`},

{id:'ascii',name:'ASCII',p:'Density',amt:.55,src:`
float ch(float n,vec2 p){p=floor(p*vec2(4.,-4.)+2.5);
 if(clamp(p.x,0.,4.)==p.x&&clamp(p.y,0.,4.)==p.y){float k=p.x+5.*p.y;if(mod(floor(n/exp2(k)),2.)>.5)return 1.;}
 return 0.;}
vec3 fx(vec2 uv){float cell=max(uRes.y/mix(24.,80.,uAmt),5.);vec2 fc=uv*uRes;vec2 id=floor(fc/cell);
 vec3 c=tex((id+.5)*cell/uRes);float g=pow(luma(c),.7);
 float n=4096.;if(g>.16)n=65600.;if(g>.27)n=332772.;if(g>.38)n=15255086.;if(g>.49)n=23385164.;if(g>.6)n=15252014.;if(g>.72)n=13199452.;if(g>.84)n=11512810.;
 vec2 p=fract(fc/cell)*2.-1.;float m=ch(n,p);
 float mx=max(c.r,max(c.g,c.b));vec3 tint=mix(vec3(.3,1.,.55),c/max(mx,.2),.55);
 return mix(vec3(.015,.04,.03),tint*(.8+.5*g),m);}`},

{id:'bulge',name:'Big Head',p:'Bulge',amt:.7,hint:'The lens follows your pointer.',src:`
vec3 fx(vec2 uv){vec2 A=vec2(asp(),1.);vec2 d=(uv-uMouse)*A;float r=length(d);float k=clamp(r/.46,0.,1.);
 float f=1.-uAmt*.82*(1.-k)*(1.-k);return tex(uMouse+d*f/A);}`},

{id:'neon',name:'Neon Lines',p:'Glow',amt:.5,src:`
vec3 fx(vec2 uv){float w=max(uRes.y/480.,1.);vec2 g=sob(uv,w);vec2 g2=sob(uv,w*3.);float e=length(g),e2=length(g2);
 float ang=atan(g2.y,g2.x);vec3 col=hsv(fract(ang/(2.*PI)+uTime*.07+uv.x*.35+uv.y*.2),.8,1.);
 float m=smoothstep(.07,.45,e*(1.+uAmt*3.));float halo=smoothstep(.1,1.1,e2*(.6+uAmt*1.6));
 return tex(uv)*.1*(1.-uAmt*.6)+vec3(.02,.0,.05)+col*m*1.5+col*halo*.45;}`},

{id:'thermal',name:'Thermal',p:'Contrast',amt:.5,src:`
vec3 ramp(float t){vec3 c=mix(vec3(0.,0.,.14),vec3(.36,0.,.62),smoothstep(0.,.25,t));
 c=mix(c,vec3(.95,.1,.25),smoothstep(.25,.5,t));c=mix(c,vec3(1.,.66,0.),smoothstep(.5,.75,t));
 return mix(c,vec3(1.,1.,.8),smoothstep(.75,1.,t));}
vec3 fx(vec2 uv){vec2 e=max(uRes.y/240.,1.)/uRes;
 vec3 c=(tex(uv)*2.+tex(uv+vec2(e.x,0.))+tex(uv-vec2(e.x,0.))+tex(uv+vec2(0.,e.y))+tex(uv-vec2(0.,e.y)))/6.;
 float l=luma(c);l=clamp((l-.5)*(.9+uAmt*1.8)+.5,0.,1.);l+=(hash(uv*uRes+uTime)-.5)*.03;return ramp(clamp(l,0.,1.));}`},

{id:'halftone',name:'Halftone',p:'Dot size',amt:.45,src:`
float dots(vec2 fc,float ang,float sz,float v){vec2 p=rot(ang)*fc/sz;vec2 g=fract(p)-.5;float r=sqrt(clamp(v,0.,1.))*.72;float aa=1.2/sz;
 return (1.-smoothstep(r-aa,r+aa,length(g)))*step(.004,v);}
vec3 fx(vec2 uv){float sz=max(uRes.y/mix(120.,34.,uAmt),4.);vec2 fc=uv*uRes;vec3 c=pow(tex(uv),vec3(.85));
 vec3 cmy=1.-c;float k=min(cmy.x,min(cmy.y,cmy.z));cmy=(cmy-k)/max(1.-k,.001);k=smoothstep(.15,1.,k);
 vec3 o=vec3(.98,.95,.88);

{id:'glitch',name:'Glitch',p:'Chaos',amt:.55,src:`
vec3 fx(vec2 uv){float t=floor(uTime*11.);float a=uAmt;
 float band=floor(uv.y*mix(6.,28.,hash(vec2(t,1.))));float n=hash(vec2(band,t));
 float trig=step(.92-.4*a,hash(vec2(t*.37,band*.11)));
 vec2 u=uv;u.x+=(n-.5)*.3*a*trig;
 vec2 b=floor(uv*vec2(7.,5.));float bt=step(.965-.1*a,hash(b+t*.13));u+=bt*(hash2(b+t)-.5)*.25;
 float sp=(.003+.022*a*hash(vec2(t,7.)))*(1.+trig*2.);
 vec3 c=vec3(tex(u+vec2(sp,0.)).r,tex(u).g,tex(u-vec2(sp,0.)).b);
 if(bt>.5&&hash(b-t)>.55)c=1.-c;
 c+=(hash(uv*uRes+uTime)-.5)*.09;
 c*=.9+.1*sin(uv.y*min(uRes.y,540.)*2.094);
 c=mix(c,c*vec3(.8,1.1,1.2),trig*.6);return c;}`},

{id:'gameboy',name:"Pocket '89",p:'Chunkiness',amt:.5,src:`
float b2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
vec3 fx(vec2 uv){float cell=max(uRes.y/mix(150.,44.,uAmt),2.);vec2 g=uv*uRes/cell;vec2 id=floor(g);
 vec3 c=tex((id+.5)*cell/uRes);float l=clamp((luma(c)-.5)*1.3+.52,0.,1.);
 float q=clamp(floor(l*3.+.5+(b4(id)-.47)*.95),0.,3.);
 vec3 o=q<.5?vec3(.06,.22,.06):q<1.5?vec3(.19,.38,.19):q<2.5?vec3(.55,.67,.06):vec3(.72,.83,.2);
 vec2 f=fract(g);float grid=step(.1,f.x)*step(.1,f.y);return o*mix(1.,mix(.86,1.,grid),step(4.,cell));}`},

{id:'aura',name:'Aura',p:'Trail',amt:.6,fb:1,hint:'Wave your hands — colour streams off anything that moves.',src:`
vec3 fx(vec2 uv){vec3 c=tex(uv);vec2 q=(uv-.5)*(.988-.014*uAmt)+.5;
 vec3 p=texture2D(uPrev,q).rgb;if(uThumb>.5)p=tex((uv-.5)*.82+.5);
 p=hueRot(p,.32);float k=mix(.5,.9,uAmt);if(uThumb>.5)k=.5;
 return max(mix(c,p,k),c*.72);}`},

{id:'bug',name:'Bug Eyes',p:'Lenses',amt:.4,src:`
vec4 hexc(vec2 p){vec2 s=vec2(1.,1.7320508);vec4 hc=floor(vec4(p,p-vec2(.5,1.))/s.xyxy)+.5;
 vec4 h=vec4(p-hc.xy*s,p-(hc.zw+.5)*s);return dot(h.xy,h.xy)<dot(h.zw,h.zw)?vec4(h.xy,hc.xy):vec4(h.zw,hc.zw+.5);}
vec3 fx(vec2 uv){float n=floor(mix(3.,15.,uAmt));vec2 A=vec2(asp(),1.);vec4 h=hexc(uv*A*n);
 vec2 cen=h.zw*vec2(1.,1.7320508)/n/A;float r=length(h.xy);
 vec2 u=mix(cen,vec2(.5),.6)+h.xy*(1.+r*r*1.4)*.62/A;vec3 c=tex(u);
 vec2 q=abs(h.xy);float hd=max(q.x,q.x*.5+q.y*.8660254);
 c*=1.-smoothstep(.4,.5,hd)*.92;c+=pow(max(0.,1.-length(h.xy-vec2(-.16,.2))*3.2),3.)*.16;return c;}`},

{id:'popart',name:'Pop Art',p:'Contrast',amt:.5,src:`
vec3 fx(vec2 uv){vec2 g=floor(uv*2.);vec2 u=fract(uv*2.);float l=luma(tex(u));l=clamp((l-.5)*(1.+uAmt*1.4)+.5,0.,1.);
 float id=g.x+g.y*2.;vec3 a,b,d;
 if(id<.5){a=vec3(.1,.05,.35);b=vec3(1.,.2,.55);d=vec3(1.,.92,.2);}
 else if(id<1.5){a=vec3(0.,.22,.28);b=vec3(.1,.8,.7);d=vec3(1.,.95,.85);}
 else if(id<2.5){a=vec3(.35,0.,.1);b=vec3(1.,.45,.1);d=vec3(.6,.95,1.);}
 else{a=vec3(.12,.08,0.);b=vec3(.3,.4,1.);d=vec3(1.,.75,.85);}
 return mix(mix(a,b,smoothstep(.33,.36,l)),d,smoothstep(.6,.63,l));}`},

{id:'swirl',name:'Whirlpool',p:'Twist',amt:.5,hint:'The drain follows your pointer.',src:`
vec3 fx(vec2 uv){vec2 A=vec2(asp(),1.);vec2 d=(uv-uMouse)*A;float r=length(d);float k=max(1.-r/.62,0.);
 float a=k*k*(1.5+uAmt*8.)*(.8+.2*sin(uTime*.9));return tex(uMouse+rot(a)*d/A);}`},

{id:'vhs',name:"Rewind '92",p:'Wear',amt:.6,src:`
vec3 fx(vec2 uv){float t=uTime;float a=uAmt;vec2 u=uv;
 u.x+=(hash(vec2(floor(uv.y*240.),floor(t*30.)))-.5)*.006*a;
 float band=fract(uv.y*.7-t*.11);float tr=smoothstep(0.,.02,band)*(1.-smoothstep(.02,.1,band));
 u.x+=tr*.035*a*sin(uv.y*90.+t*40.);
 float o=.0025+.007*a;
 vec3 c=vec3(tex(u+vec2(o,0.)).r,tex(u).g,tex(u-vec2(o,0.)).b);
 vec3 bl=(tex(u+vec2(o*3.5,0.))+tex(u-vec2(o*3.5,0.)))*.5;
 c=mix(c,vec3(luma(c))+(bl-luma(bl))*1.25,.65);
 c=(c-.5)*.88+.53;c*=vec3(1.04,.97,1.1);c.b+=.03;
 c*=.9+.1*sin(uv.y*240.*6.2832);
 c+=(hash(uv*vec2(320.,240.)+fract(t)*50.)-.5)*(.07+tr*.6*a);
 float v=1.-smoothstep(.45,1.,length(uv-.5));return c*mix(.75,1.,v);}`},

{id:'twin',name:'Twin',p:'Mirror axis',amt:.5,src:`
vec3 fx(vec2 uv){float ax=.5+(uAmt-.5)*.6;vec2 u=uv;u.x=ax-abs(uv.x-ax);vec3 c=tex(u);
 return c*(1.-.18*(1.-smoothstep(0.,.004,abs(uv.x-ax))));}`},

{id:'crystal',name:'Crystal',p:'Shard size',amt:.45,src:`
vec3 fx(vec2 uv){float n=mix(44.,8.,uAmt);vec2 A=vec2(asp(),1.);vec2 p=uv*A*n;vec2 ip=floor(p),fp=fract(p);
 float md=9.,md2=9.;vec2 best=ip;
 for(int j=-1;j<=1;j++){for(int i=-1;i<=1;i++){vec2 o=vec2(float(i),float(j));vec2 h=hash2(ip+o);
  h=.5+.38*sin(uTime*.7+6.2832*h);vec2 r=o+h-fp;float d=dot(r,r);
  if(d<md){md2=md;md=d;best=ip+o+h;}else if(d<md2){md2=d;}}}
 vec3 c=tex(best/n/A);float ed=sqrt(md2)-sqrt(md);
 c*=.72+.34*smoothstep(0.,.3,ed);c+=(hash(floor(best*3.))-.5)*.1;return c;}`},

{id:'underwater',name:'Underwater',p:'Current',amt:.5,hint:'Your pointer makes ripples.',src:`
vec3 fx(vec2 uv){float t=uTime;vec2 A=vec2(asp(),1.);float a=.003+.014*uAmt;
 vec2 u=uv+a*vec2(sin(uv.y*18.+t*1.7)+sin(uv.y*7.-t),cos(uv.x*15.+t*1.3)+cos(uv.x*6.+t*.8));
 vec2 dm=(uv-uMouse)*A;float r=length(dm);u+=dm/(r+.001)*sin(r*42.-t*7.)*.014*exp(-r*4.5)*(.5+uAmt);
 vec3 c=tex(u);c=mix(c,c*vec3(.35,.85,1.05)+vec3(0.,.06,.13),.78);
 vec2 p=uv*A*6.;float ca=sin(p.x*1.3+t+sin(p.y*1.7+t*.7)*1.5)+sin(p.y*1.1-t*.8+sin(p.x*1.9-t*.5)*1.5);
 ca=pow(clamp(.5+.25*ca,0.,1.),3.);c+=vec3(.45,.9,1.)*ca*.24;return c*mix(.68,1.12,uv.y);}`},

{id:'sketch',name:'Pencil',p:'Pressure',amt:.5,src:`
vec3 fx(vec2 uv){float w=max(uRes.y/560.,1.);float e=length(sob(uv,w));float l=luma(tex(uv));vec2 fc=uv*uRes/w;
 float ink=smoothstep(.06,.4,e*(1.+uAmt*2.6));
 float h=step(l,.62)*smoothstep(.55,.9,sin((fc.x+fc.y)*1.05)*.5+.5)*.34;
 h+=step(l,.4)*smoothstep(.55,.9,sin((fc.x-fc.y)*1.05)*.5+.5)*.38;h+=step(l,.2)*.28;
 float paper=.965-.05*hash(floor(fc*.5));
 return mix(vec3(paper)*vec3(1.,.985,.95),vec3(.13,.13,.2),clamp(ink+h*(.45+uAmt),0.,1.));}`},

{id:'xray',name:'X-Ray',p:'Exposure',amt:.5,src:`
vec3 fx(vec2 uv){float l=1.-luma(tex(uv));float e=length(sob(uv,max(uRes.y/360.,1.)));
 l=pow(l,1.+uAmt*1.2)*.9+e*(.4+uAmt);
 vec3 o=mix(vec3(0.,.03,.08),vec3(.68,.92,1.),clamp(l,0.,1.));
 return o+(hash(uv*uRes+uTime)-.5)*.05;}`},

{id:'ghost',name:'Ghost',p:'Linger',amt:.7,fb:1,hint:'Move slowly. You leave yourself behind.',src:`
vec3 fx(vec2 uv){vec3 c=tex(uv);if(uThumb>.5)return mix(c,tex(uv+vec2(.07,0.)),.45)*vec3(.9,1.,1.08);
 vec3 p=texture2D(uPrev,uv).rgb;return mix(c*vec3(.94,1.,1.06),p,mix(.5,.93,uAmt));}`},

{id:'acid',name:'Acid',p:'Bands',amt:.4,src:`

 vec3 o=hsv(fract(l*mix(.8,4.5,uAmt)+uTime*.16),.82,.4+.7*smoothstep(0.,.85,l));
 float e=length(sob(uv,max(uRes.y/420.,1.)));return mix(o,o*c*2.2,.22)*(1.-smoothstep(.2,.9,e)*.6);}`},

{id:'noir',name:'Noir',p:'Drama',amt:.5,src:`
vec3 fx(vec2 uv){float l=luma(tex(uv));l=clamp((l-.46)*(1.3+uAmt*1.8)+.5,0.,1.);l=l*l*(3.-2.*l);
 l+=(hash(floor(uv*uRes/max(uRes.y/420.,1.))+fract(uTime)*91.)-.5)*(.08+.12*uAmt);
 float v=1.-smoothstep(.3,.98,length((uv-.5)*vec2(1.15,1.)));l*=mix(1.,v,.85)*(.96+.04*sin(uTime*37.));
 return vec3(l)*vec3(1.03,1.,.93);}`}
];

const FS_INGEST = `varying vec2 vUv;uniform sampler2D uTex;uniform float uFlip;
void main(){gl_FragColor=vec4(texture2D(uTex,vec2(mix(vUv.x,1.-vUv.x,uFlip),vUv.y)).rgb,1.);}`;
const FS_COPY = `varying vec2 vUv;uniform sampler2D uTex;uniform float uLine;
void main(){vec3 c=texture2D(uTex,vUv).rgb;
 if(uLine>=0.){float d=abs(vUv.y-uLine);c=mix(c,vec3(.75,1.,1.),1.-smoothstep(.0015,.004,d));c+=vec3(.2,.75,1.)*.45*(1.-smoothstep(0.,.045,d));}
 gl_FragColor=vec4(c,1.);}`;

/* ════════════════════════ WebGL plumbing ════════════════════════ */
let gl, PREC = 'precision highp float;\n';
let ingestP, copyP, passP, videoTex, srcT, fb = [], fbIx = 0, glReady = false;
let W = 0, H = 0;
const UNI = ['uTex','uPrev','uRes','uMouse','uTime','uAmt','uScan','uThumb','uFlip','uLine'];
const COLS = 6, ROWS = Math.ceil(FILTERS.length / COLS);

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error('SHADER_ERROR', gl.getShaderInfoLog(s)); return null; }
  return s;
}
function mkProg(fsBody, label){
  const v = sh(gl.VERTEX_SHADER, VS), f = sh(gl.FRAGMENT_SHADER, PREC + fsBody);
  if(!v || !f){ console.error('SHADER_FAIL', label); return null; }
  const p = gl.createProgram(); gl.attachShader(p, v); gl.attachShader(p, f);
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){ console.error('LINK_ERROR', label, gl.getProgramInfoLog(p)); return null; }
  const u = {}; UNI.forEach(n => u[n] = gl.getUniformLocation(p, n));
  return {p, u};
}
function mkTex(w, h){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}
function mkTarget(w, h){
  const tex = mkTex(w, h), f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);

}
function stopStream(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function startCamera(deviceId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setNotice('<b>No camera access here.</b> <span>This browser or page can’t reach a webcam (it needs https or localhost). You can still play with the demo or a photo.</span>', 'Try again');
    return;
  }
  if(src.kind !== 'camera') setNotice('<b>Waiting for your camera…</b> <span>Allow access when your browser asks. Until then, Blobby is standing in for you.</span>', 'Ask again');
  try{
    if(deviceId) stopStream();
    const base = {width:{ideal:1280}, height:{ideal:720}};
    const s = await navigator.mediaDevices.getUserMedia({audio:false, video: deviceId ? {...base, deviceId:{exact:deviceId}} : {...base, facingMode:'user'}});
    stopStream(); stream = s; video.srcObject = s;
    await video.play().catch(() => {});
    setSource('camera'); setNotice(null);
    const facing = (s.getVideoTracks()[0].getSettings() || {}).facingMode;
    if(facing === 'environment') setMirror(false);
    try{
      cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const id = (s.getVideoTracks()[0].getSettings() || {}).deviceId; const ix = cams.findIndex(c => c.deviceId === id); if(ix >= 0) camIx = ix;
    }catch(e){}
    updateCamBtn();
    s.getVideoTracks()[0].addEventListener('ended', () => { if(stream === s){ setSource('demo'); setNotice('<b>Camera disconnected.</b> <span>Back to the demo scene.</span>', 'Reconnect'); } });
  }catch(e){
    if(src.kind === 'camera' && !stream) setSource('demo');
    const n = e && e.name;
    if(n === 'NotAllowedError' || n === 'SecurityError') setNotice('<b>Camera is blocked.</b> <span>Allow it from the camera icon in the address bar, then try again — or carry on with the demo.</span>', 'Try again');
    else if(n === 'NotFoundError' || n === 'OverconstrainedError') setNotice('<b>No camera found.</b> <span>Plug one in, or try the filters on a photo.</span>', 'Try again');
    else if(n === 'NotReadableError') setNotice('<b>Camera is busy.</b> <span>Another app may be using it. Close it and try again.</span>', 'Try again');
    else setNotice('<b>Couldn’t start the camera.</b> <span>You can still play with the demo or a photo.</span>', 'Try again');
  }
}
$('noticeRetry').addEventListener('click', () => startCamera());
$('noticeX').addEventListener('click', () => setNotice(null));
$('btnCam').addEventListener('click', () => {
  if(src.kind === 'camera' && cams.length > 1){ camIx = (camIx + 1) % cams.length; startCamera(cams[camIx].deviceId); }
  else startCamera();
});
const fileIn = $('file');
$('btnOpen').addEventListener('click', () => fileIn.click());
$('noticePhoto').addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => { if(fileIn.files[0]) loadImage(fileIn.files[0]); fileIn.value = ''; });
function loadImage(file){
  if(!file.type.startsWith('image/')) return toast('That file isn’t an image.');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const m = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(img.naturalWidth * m)); c.height = Math.max(2, Math.round(img.naturalHeight * m));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    stopStream(); video.srcObject = null; setSource('image', c); setNotice(null);
    toast('Photo loaded. Tap the camera icon to go live again.', null, 3200);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t read that image.'); };
  img.src = url;
}
let dragDepth = 0;
addEventListener('dragenter', e => { if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if(--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer && e.dataTransfer.files[0]; if(f) loadImage(f); });

/* ════════════════════════ Keyboard ════════════════════════ */
addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(lb.open){
    if(e.key === 'ArrowLeft'){ lbIx--; renderLB(); } else if(e.key === 'ArrowRight'){ lbIx++; renderLB(); }
    else if(e.key.toLowerCase() === 's') save(shots[lbIx]);
    else if(e.key === 'Delete' || e.key === 'Backspace') $('lbDel').click();
    return;
  }
  const inRange = e.target === amtIn;
  switch(e.key){
    case ' ': e.preventDefault(); if(!e.repeat) shoot(); break;
    case 'Escape': if(busy) busy.cancel = true; break;
    case 'ArrowRight': if(!inRange){ e.preventDefault(); select(cur + 1); } break;
    case 'ArrowLeft': if(!inRange){ e.preventDefault(); select(cur - 1); } break;
    case 'r': case 'R': surprise(); break;
    case 'm': case 'M': setMirror(!mirror); break;
    case 't': case 'T': toggleTimer(); break;
    case 's': case 'S': save(shots[shots.length - 1]); break;
    case 'g': case 'G': openLB(); break;
  }
});

/* ════════════════════════ Boot ════════════════════════ */
function fatal(){
  const d = document.createElement('div'); d.className = 'fatal';
  d.innerHTML = '<div><h2>Filters need WebGL</h2><p>This browser has WebGL turned off or unavailable, so the live effects can’t run. Try a current version of Chrome, Firefox, Safari or Edge.</p></div>';
  document.body.appendChild(d);
}
view.addEventListener('webglcontextlost', e => { e.preventDefault(); glReady = false; });
view.addEventListener('webglcontextrestored', () => { initGL(); src.w = src.h = 0; src.dirty = true; });

if(!initGL()) fatal();
else {
  const want = FILTERS.findIndex(f => f.id === location.hash.slice(1));
  select(want > 0 ? want : 0, true); updateRoll();
  requestAnimationFrame(frame);
  startCamera();
}
})();
</script>
