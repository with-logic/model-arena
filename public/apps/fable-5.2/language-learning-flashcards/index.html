<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayfarer — Travel phrase flashcards</title>
<meta name="description" content="Interactive travel-phrase flashcards for English, Spanish, French and Japanese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee4;
  --paper-2:#ebe4d6;
  --card:#fffdf8;
  --ink:#1b2231;
  --ink-2:#4a5263;
  --ink-3:#8a8f9b;
  --line:rgba(27,34,49,.13);
  --accent:#2b54c9;
  --accent-ink:#fff;
  --serif:"Fraunces","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --sans:"Instrument Sans","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-accent="en"]{--accent:#2b54c9}
[data-accent="es"]{--accent:#d2472a}
[data-accent="fr"]{--accent:#17786a}
[data-accent="ja"]{--accent:#b8245a}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(1100px 520px at 88% -10%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),
    radial-gradient(800px 480px at -8% 108%,rgba(214,160,60,.16),transparent 70%),
    radial-gradient(rgba(27,34,49,.075) 1px,transparent 1.4px) 0 0/22px 22px,
    var(--paper);
  background-attachment:fixed;
  transition:background-color .5s;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:1040px;margin:0 auto;padding:18px 20px 0;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--ink);color:var(--paper);
  transition:background .5s;
}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.3rem;letter-spacing:-.01em}
.brand span{color:var(--ink-2);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sep{width:1px;height:18px;background:var(--line);flex:none}
@media(max-width:720px){.brand span,.brand .sep{display:none}}

.seg{
  display:flex;padding:3px;border-radius:999px;flex:none;
  background:rgba(255,253,248,.7);border:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.seg button{
  padding:7px 12px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--ink-2);
  transition:background .25s,color .25s;letter-spacing:.02em;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg svg{align-self:center;margin:0 4px 0 9px;color:var(--ink-3);flex:none}
@media(max-width:400px){.seg svg{display:none}.seg button{padding:7px 10px}}

main{max-width:1040px;margin:0 auto;padding:0 20px 56px}
.view{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- welcome ---------- */
#welcome{padding-top:clamp(28px,7vh,72px);text-align:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;
  font-size:.74rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);
}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:currentColor;opacity:.4}
h1{
  font-family:var(--serif);font-weight:500;letter-spacing:-.022em;line-height:1.06;
  font-size:clamp(2rem,5.6vw,3.6rem);margin:0 auto;max-width:17ch;text-wrap:balance;
}
:lang(ja) h1{font-size:clamp(1.8rem,4.8vw,3rem);letter-spacing:0;line-height:1.25}
.lede{margin:18px auto 0;max-width:46ch;color:var(--ink-2);font-size:1.05rem;line-height:1.55;text-wrap:pretty}
.tiles{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  margin:clamp(30px,6vh,56px) auto 0;text-align:left;
}
@media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.tiles{gap:12px}}
.tile{
  --accent:#2b54c9;
  position:relative;display:flex;flex-direction:column;min-height:228px;
  padding:18px 18px 16px;border-radius:20px;text-align:left;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 24px -18px rgba(27,34,49,.5);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;
  animation:tileIn .6s var(--ease) both;overflow:hidden;
}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}
@keyframes tileIn{from{opacity:0;transform:translateY(22px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.tile::after{
  content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease);
}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  box-shadow:0 26px 40px -24px color-mix(in srgb,var(--accent) 60%,#1b2231)}
.tile:hover::after,.tile:focus-visible::after{transform:scaleX(1)}
.tile:active{transform:translateY(-2px) scale(.985)}
.pstamp{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  color:var(--accent);border:2px solid currentColor;position:relative;
  font-weight:700;font-size:.82rem;letter-spacing:.1em;rotate:-9deg;
  transition:rotate .5s var(--ease),background .3s,color .3s;
}
.pstamp::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.7}
.tile:hover .pstamp{rotate:8deg;background:var(--accent);color:#fff}
.tile .arrow{position:absolute;top:22px;right:18px;color:var(--ink-3);transition:transform .35s var(--ease),color .3s}
.tile:hover .arrow{transform:translate(3px,-3px);color:var(--accent)}
.tile .hello{
  margin-top:auto;padding-top:22px;font-family:var(--serif);font-weight:500;
  font-size:clamp(1.5rem,3.1vw,2rem);letter-spacing:-.02em;line-height:1.1;
}
.tile .hello:lang(ja){letter-spacing:0;font-size:clamp(1.3rem,2.7vw,1.7rem);line-height:1.3}
.tile .name{margin-top:4px;color:var(--ink-2);font-size:.95rem;font-weight:500}
.tile .name::first-letter{text-transform:uppercase}
.tile .meta{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.76rem;color:var(--ink-3);font-weight:600;white-space:nowrap}
.bar{flex:1;height:4px;border-radius:4px;background:var(--paper-2);overflow:hidden;min-width:20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s var(--ease)}

/* ---------- study ---------- */
#study{padding-top:clamp(14px,3vh,30px)}
.study-top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  max-width:640px;margin:0 auto;
}
.ghost-btn{
  justify-self:start;display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px 9px 10px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line);background:rgba(255,253,248,.6);
  transition:background .25s,color .25s,transform .25s var(--ease);
}
.ghost-btn:hover{background:var(--card);color:var(--ink)}
.ghost-btn:hover svg{transform:translateX(-3px)}
.ghost-btn svg{transition:transform .25s var(--ease);flex:none}
@media(max-width:520px){.ghost-btn span{display:none}.ghost-btn{padding:10px}}
.now{text-align:center;min-width:0}
.now small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);transition:color .5s}
.now strong{display:block;font-family:var(--serif);font-weight:500;font-size:1.5rem;letter-spacing:-.01em;margin-top:2px}
.now strong::first-letter{text-transform:uppercase}
.ring{justify-self:end;position:relative;width:54px;height:54px}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:rgba(27,34,49,.1)}
.ring .val{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:138.23;transition:stroke-dashoffset .8s var(--ease),stroke .5s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.ring.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.18)}}

.stage{
  position:relative;margin:clamp(22px,4vh,38px) auto 0;
  width:min(100%,540px);height:clamp(290px,42vh,340px);
}
.ghost,.card{position:absolute;inset:0;border-radius:24px}
.ghost{
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 14px 26px -20px rgba(27,34,49,.5);
  transition:opacity .4s,translate .5s var(--ease),rotate .5s var(--ease),scale .5s var(--ease);
}
.ghost::after{content:"";position:absolute;inset:12px;border-radius:14px;border:1px dashed var(--line)}
.g1{translate:0 11px;rotate:-2.4deg;scale:.985}
.g2{translate:0 22px;rotate:2.8deg;scale:.965}
.ghost.off{opacity:0;translate:0 0;rotate:0deg;scale:.96}
.card{perspective:1600px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:0}
.card:focus-visible .face{outline:2.5px solid var(--accent);outline-offset:4px}
.inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.3,1.25,.4,1);
}
.card.flipped .inner{transform:rotateY(180deg)}
.card:not(.flipped):hover .inner{transform:rotateY(5deg) rotateX(2deg)}
.card.flipped:hover .inner{transform:rotateY(175deg) rotateX(2deg)}
.face{
  position:absolute;inset:0;border-radius:24px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;padding:20px 22px 18px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 50px -30px rgba(27,34,49,.55),0 4px 10px -6px rgba(27,34,49,.25);
}
.front{background:var(--card);border:1px solid var(--line)}
.front::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--accent);transition:background .5s}
.back{
  transform:rotateY(180deg);color:#fff;
  background:
    radial-gradient(rgba(255,255,255,.11) 1px,transparent 1.4px) 0 0/16px 16px,
    linear-gradient(150deg,color-mix(in srgb,var(--accent) 88%,#fff),color-mix(in srgb,var(--accent) 80%,#000));
}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.chip{padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent);transition:background .5s,color .5s}
.back .chip{background:rgba(255,255,255,.18);color:#fff}
.count{color:var(--ink-3);font-variant-numeric:tabular-nums}
.back .count{color:rgba(255,255,255,.7)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px;min-height:0}
.phrase{
  font-family:var(--serif);font-weight:500;line-height:1.14;letter-spacing:-.02em;
  font-size:clamp(1.6rem,5.4vw,2.55rem);text-wrap:balance;margin:0;
}
.phrase:lang(ja){letter-spacing:.01em;line-height:1.35;font-size:clamp(1.45rem,4.8vw,2.2rem);font-weight:500}
.romaji{margin-top:12px;font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:1.02rem}
.orig{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-size:.95rem;color:rgba(255,255,255,.85);max-width:90%}
.hint{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:.78rem;font-weight:600;letter-spacing:.02em;text-transform:none}
.back .hint{color:rgba(255,255,255,.75)}
.hint svg{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(180deg)}}
.speak{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;
  font-size:.8rem;font-weight:600;letter-spacing:.01em;text-transform:none;
  border:1px solid var(--line);color:var(--ink);background:var(--card);
  transition:background .25s,color .25s,border-color .25s,transform .2s;
}
.speak:hover{background:var(--accent);color:#fff;border-color:transparent}
.speak:active{transform:scale(.95)}
.speak.on svg{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.2)}}
.lstamp{
  position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;opacity:0;
  translate:-50% -50%;rotate:-13deg;
  padding:10px 22px;border-radius:12px;white-space:nowrap;
  font-weight:700;font-size:clamp(1.4rem,5vw,2rem);letter-spacing:.14em;
  color:#16824f;border:4px solid currentColor;background:rgba(255,253,248,.93);
  box-shadow:0 0 0 3px rgba(255,253,248,.93),0 14px 30px -12px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:12px;
}

/* done */
.done{
  position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 30px 50px -30px rgba(27,34,49,.55);
  animation:pop .7s var(--ease) both;
}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:none}}
.done .medal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#16824f;color:#fff;animation:medal .9s .15s var(--ease) both}
@keyframes medal{from{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.15)}to{transform:none}}
.done h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,5vw,2.1rem);margin:14px 0 6px;letter-spacing:-.02em}
.done p{margin:0;color:var(--ink-2);max-width:34ch;line-height:1.5}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}

/* controls */
.controls{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:clamp(34px,6vh,48px) auto 0;max-width:540px;
  transition:opacity .4s;
}
.controls.off{opacity:0;pointer-events:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 20px;
  border-radius:999px;font-weight:600;font-size:.96rem;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 8px 16px -12px rgba(27,34,49,.5);
  transition:transform .25s var(--ease),box-shadow .25s,background .3s,border-color .25s,color .25s;
}
.btn:hover{transform:translateY(-2px);border-color:rgba(27,34,49,.3);box-shadow:0 14px 22px -14px rgba(27,34,49,.55)}
.btn:active{transform:translateY(0) scale(.96)}
.btn.icon{width:50px;padding:0}
.btn.primary{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.primary:hover{background:#16824f;color:#fff}
.btn.primary:hover svg{transform:scale(1.2) rotate(-8deg)}
.btn svg{transition:transform .45s var(--ease);flex:none}
#shuffle:hover svg{transform:rotate(180deg)}
.btn.sm{height:44px;font-size:.9rem;padding:0 18px}
@media(max-width:520px){
  .controls{gap:8px}
  .btn.primary{order:5;flex:1 1 100%}
  #shuffle{flex:1}
}
.keys{text-align:center;color:var(--ink-3);font-size:.78rem;margin:18px 0 0;letter-spacing:.01em}
@media(hover:none),(max-width:640px){.keys{display:none}}

/* tray */
.tray{
  max-width:640px;margin:clamp(28px,5vh,44px) auto 0;padding:16px 18px 18px;
  border-radius:20px;border:1px dashed rgba(27,34,49,.22);background:rgba(255,253,248,.5);
}
.tray-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.tray-h h3{margin:0;font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tray-h h3 b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:.72rem;letter-spacing:0}
.link{font-size:.82rem;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--accent);text-decoration-color:currentColor}
.tray p{margin:10px 0 0;color:var(--ink-3);font-size:.88rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lchip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:.86rem;font-weight:500;text-align:left;
  transition:transform .25s var(--ease),border-color .25s,background .25s;
}
.lchip svg{color:#16824f;flex:none;transition:transform .3s var(--ease)}
.lchip:hover{transform:translateY(-2px);border-color:var(--accent)}
.lchip.new{animation:chipIn .6s var(--ease) both}
@keyframes chipIn{from{opacity:0;transform:translateY(-26px) scale(.6)}60%{transform:translateY(2px) scale(1.06)}to{opacity:1;transform:none}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),108vh,0) rotate(var(--r));opacity:.9}}

footer{text-align:center;color:var(--ink-3);font-size:.76rem;padding:0 20px 26px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2.5 10.8 13.2"/><path d="M21.5 2.5 14.7 21.5l-3.9-8.3-8.3-3.9z"/></svg>
    </div>
    <b>Wayfarer</b><i class="sep"></i><span data-i="tagline"></span>
  </div>
  <div class="seg" role="group" id="uiSeg">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg>
    <button data-ui="en" lang="en" title="English">EN</button>
    <button data-ui="es" lang="es" title="Español">ES</button>
    <button data-ui="fr" lang="fr" title="Français">FR</button>
    <button data-ui="ja" lang="ja" title="日本語">日本語</button>
  </div>
</header>

<main>
  <section id="welcome" class="view">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 data-i="chooseTitle"></h1>
    <p class="lede" data-i="chooseSub"></p>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="study" class="view" hidden>
    <div class="study-top">
      <button class="ghost-btn" id="back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span data-i="change"></span>
      </button>
      <div class="now"><small data-i="learning"></small><strong id="nowLang"></strong></div>
      <div class="ring" id="ring" role="img">
        <svg width="54" height="54" viewBox="0 0 54 54"><circle class="trk" cx="27" cy="27" r="22"/><circle class="val" id="ringVal" cx="27" cy="27" r="22" stroke-dashoffset="138.23"/></svg>
        <span id="ringTxt">0/10</span>
      </div>
    </div>

/* ---------- state ---------- */
var KEY='wayfarer.v1';
function short(l){return String(l||'').slice(0,2).toLowerCase();}
function prefs(){var a=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];return Array.prototype.map.call(a,short);}
function detectUI(){var p=prefs();for(var i=0;i<p.length;i++)if(LANGS.indexOf(p[i])>-1)return p[i];return 'en';}
function freshOrder(){return PHRASES.map(function(p){return p.id;});}
var state={ui:detectUI(),target:null,learned:{},order:{}};
try{
  var saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&typeof saved==='object'){
    if(LANGS.indexOf(saved.ui)>-1)state.ui=saved.ui;
    if(LANGS.indexOf(saved.target)>-1)state.target=saved.target;
    if(saved.learned)state.learned=saved.learned;
    if(saved.order)state.order=saved.order;
  }
}catch(e){}
LANGS.forEach(function(l){
  var ok=function(a){return Array.isArray(a)?a.filter(function(x,i){return BY_ID[x]&&a.indexOf(x)===i;}):[];};
  state.learned[l]=ok(state.learned[l]);
  var o=ok(state.order[l]);
  state.order[l]=o.length===TOTAL?o:freshOrder();
});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

var pos=0,busy=false;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function t(k,v){var s=T[state.ui][k];if(v)for(var x in v)s=s.replace('{'+x+'}',v[x]);return s;}
function deck(){var L=state.learned[state.target];return state.order[state.target].filter(function(id){return L.indexOf(id)<0;});}
function transLang(){
  if(state.ui!==state.target)return state.ui;
  var p=prefs();
  for(var i=0;i<p.length;i++)if(LANGS.indexOf(p[i])>-1&&p[i]!==state.target)return p[i];
  return state.target==='en'?'es':'en';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function sleep(ms){return new Promise(function(r){setTimeout(r,reduce?0:ms);});}
function run(el,kf,opt){
  if(!el.animate)return {finished:Promise.resolve(),cancel:function(){}};
  if(reduce)opt=Object.assign({},opt,{duration:1});
  var a=el.animate(kf,opt);
  return {finished:a.finished.catch(function(){}),cancel:function(){try{a.cancel();}catch(e){}}};
}

var card=$('card'),inner=$('inner'),g1=$('g1'),g2=$('g2'),lstamp=$('lstamp');

/* ---------- rendering ---------- */
function renderStatic(){
  document.documentElement.lang=state.ui;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=t(el.getAttribute('data-i'));});
  $('uiSeg').setAttribute('aria-label',t('uiLabel'));
  document.querySelectorAll('[data-ui]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-ui')===state.ui));});
  $('prev').setAttribute('aria-label',t('prev'));$('prev').title=t('prev');
  $('next').setAttribute('aria-label',t('next'));$('next').title=t('next');
  document.body.setAttribute('data-accent',state.target||state.ui);
  renderTiles();
  if(state.target)renderStudy();
}
function renderTiles(){
  var box=$('tiles');
  var first=!box.children.length;
  LANGS.forEach(function(l,i){
    var b=first?document.createElement('button'):box.children[i];
    var n=state.learned[l].length;
    if(first){
      b.className='tile';b.setAttribute('data-accent',l);b.setAttribute('data-lang',l);
      b.addEventListener('click',function(){choose(l);});
      box.appendChild(b);
    }
    b.innerHTML='<div class="pstamp" aria-hidden="true">'+l.toUpperCase()+'</div>'+
      '<svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>'+
      '<div class="hello" lang="'+l+'">'+HELLO[l]+'</div>'+
      '<div class="name">'+T[state.ui].names[l]+'</div>'+
      '<div class="meta"><span>'+(n?t('learnedOf',{n:n,t:TOTAL}):t('phrases10'))+'</span><div class="bar"><i style="width:'+(n/TOTAL*100)+'%"></i></div></div>';
  });
}
function renderStudy(){
  $('nowLang').textContent=T[state.ui].names[state.target];
  renderProgress();renderTray();renderCard();
}
function renderProgress(bump){
  var n=state.learned[state.target].length;
  $('ringVal').setAttribute('stroke-dashoffset',String(138.23*(1-n/TOTAL)));
  $('ringTxt').textContent=n+'/'+TOTAL;
  $('ring').setAttribute('aria-label',t('progress',{n:n,t:TOTAL}));
  if(bump){var r=$('ring');r.classList.remove('bump');void r.offsetWidth;r.classList.add('bump');}
}
function renderCard(){
  var d=deck(),done=d.length===0;
  $('done').hidden=!done;
  card.hidden=done;
  $('controls').classList.toggle('off',done);
  g1.classList.toggle('off',d.length<2);
  g2.classList.toggle('off',d.length<3);
  if(done){
    $('doneSub').textContent=t('doneSub',{lang:T[state.ui].names[state.target]});
    return;
  }
  if(pos>=d.length)pos=0;
  var p=BY_ID[d[pos]],tl=transLang(),tg=state.target;
  var cnt=(pos+1)+' / '+d.length;
  $('fCat').textContent=T[state.ui].cats[p.cat];
  $('fCount').textContent=cnt;$('bCount').textContent=cnt;
  var fp=$('fPhrase');fp.textContent=p[tg];fp.lang=tg;
  var ro=$('fRomaji');ro.textContent=tg==='ja'?p.ro:'';ro.hidden=tg!=='ja';
  $('bLang').textContent=cap(T[state.ui].names[tl]);
  var bp=$('bPhrase');bp.textContent=p[tl];bp.lang=tl;
  var bo=$('bOrig');bo.textContent=p[tg]+(tg==='ja'?'  ·  '+p.ro:'');bo.lang=tg;
  card.setAttribute('aria-label',p[tg]+' — '+t(card.classList.contains('flipped')?'flipBack':'flipHint'));

}
function renderTray(newId){
  var L=state.learned[state.target],box=$('chips');
  $('trayN').textContent=L.length;
  $('reset').hidden=!L.length;
  $('trayMsg').textContent=L.length?t('restoreTip'):t('learnedEmpty');
  box.innerHTML='';
  L.forEach(function(id){
    var p=BY_ID[id],b=document.createElement('button');
    b.className='lchip'+(id===newId?' new':'');
    b.title=p[transLang()];
    b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5.5 5.5L20 6.5"/></svg>';
    var s=document.createElement('span');s.lang=state.target;s.textContent=p[state.target];b.appendChild(s);
    b.addEventListener('click',function(){unlearn(id,b);});
    box.appendChild(b);
  });
}

/* ---------- views ---------- */
function show(view){
  ['welcome','study'].forEach(function(v){
    var el=$(v);el.hidden=v!==view;
    if(v===view){el.style.animation='none';void el.offsetWidth;el.style.animation='';}
  });
  window.scrollTo(0,0);
}
function choose(l){
  stopSpeak();
  state.target=l;pos=0;save();
  unflip(true);
  renderStatic();
  show('study');
  run(card,[{transform:'translateY(40px) scale(.94)',opacity:0},{transform:'none',opacity:1}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)',delay:80,fill:'backwards'});
}
function toWelcome(){
  if(busy)return;
  stopSpeak();
  state.target=null;save();
  renderStatic();show('welcome');
}

/* ---------- card actions ---------- */
function unflip(instant){
  if(!card.classList.contains('flipped'))return;
  if(instant){inner.style.transition='none';}
  card.classList.remove('flipped');card.setAttribute('aria-pressed','false');
  if(instant){void inner.offsetWidth;inner.style.transition='';}
}
function flip(){
  if(busy||card.hidden)return;
  var f=card.classList.toggle('flipped');
  card.setAttribute('aria-pressed',String(f));
  var d=deck(),p=BY_ID[d[pos]];
  if(p)$('live').textContent=f?p[transLang()]:p[state.target];
}
function go(dir){
  var d=deck();
  if(busy||d.length<2)return Promise.resolve();
  busy=true;stopSpeak();
  var out=run(card,[{transform:'none',opacity:1},{transform:'translateX('+(-dir*70)+'px) rotate('+(-dir*5)+'deg)',opacity:0}],{duration:190,easing:'ease-in',fill:'forwards'});
  return out.finished.then(function(){
    pos=(pos+dir+d.length)%d.length;
    unflip(true);renderCard();out.cancel();
    return run(card,[{transform:'translateX('+(dir*70)+'px) rotate('+(dir*5)+'deg)',opacity:0},{transform:'none',opacity:1}],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'}).finished;
  }).then(function(){busy=false;},function(){busy=false;});
}
function shuffle(){
  var d=deck();
  if(busy||!d.length)return;
  busy=true;stopSpeak();
  var cur=d[pos],D=950,E='cubic-bezier(.4,.1,.3,1)';
  if(d.length>1){
    var s=d.slice(),guard=0;
    do{
      for(var i=s.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=s[i];s[i]=s[j];s[j]=x;}
    }while(s[0]===cur&&++guard<20);
    state.order[state.target]=s.concat(state.learned[state.target]);
    pos=0;save();
  }
  var a=run(card,[
    {transform:'none',opacity:1},
    {transform:'translate(-58%,-5%) rotate(-13deg)',opacity:1,offset:.32},
    {transform:'translate(-58%,-5%) rotate(-13deg) scale(.95)',opacity:0,offset:.44},
    {transform:'translate(0,-34%) rotate(5deg) scale(1.04)',opacity:0,offset:.56},
    {transform:'translate(0,-6%) rotate(-1deg) scale(1.02)',opacity:1,offset:.82},
    {transform:'none',opacity:1}],{duration:D,easing:E});
  run(g1,[{transform:'none'},{transform:'translate(56%,-2%) rotate(13deg)',offset:.3},{transform:'translate(-34%,2%) rotate(-8deg)',offset:.58},{transform:'translate(10%,0) rotate(3deg)',offset:.82},{transform:'none'}],{duration:D,easing:E});
  run(g2,[{transform:'none'},{transform:'translate(-40%,-10%) rotate(-10deg)',offset:.3},{transform:'translate(46%,-6%) rotate(11deg)',offset:.58},{transform:'translate(-8%,0) rotate(-2deg)',offset:.82},{transform:'none'}],{duration:D,easing:E});
  setTimeout(function(){unflip(true);renderCard();},reduce?0:D*.5);
  a.finished.then(function(){unflip(true);renderCard();busy=false;});
}
function markLearned(){
  var d=deck();
  if(busy||!d.length)return;
  busy=true;stopSpeak();
  var id=d[pos],tg=state.target;
  var st=run(lstamp,[{opacity:0,transform:'scale(2.6)'},{opacity:1,transform:'scale(.92)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:340,easing:'cubic-bezier(.3,.9,.3,1)',fill:'forwards'});
  run(card,[{transform:'none'},{transform:'scale(.97)',offset:.7},{transform:'none'}],{duration:340,delay:120});
  var fly;
  st.finished.then(function(){return sleep(420);}).then(function(){
    fly=run(card,[{transform:'none',opacity:1},{transform:'translate(34%,-78%) rotate(16deg) scale(.5)',opacity:0}],{duration:480,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
    return fly.finished;
  }).then(function(){
    if(state.target!==tg)return;
    state.learned[tg].push(id);save();
    var left=deck();
    if(pos>=left.length)pos=0;
    unflip(true);
    renderProgress(true);renderTray(id);renderTiles();renderCard();
    st.cancel();fly.cancel();
    if(!left.length){confetti();$('live').textContent=t('doneTitle');return;}
    return run(card,[{transform:'translateY(11px) rotate(-2.4deg) scale(.985)',opacity:.6},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'}).finished;
  }).then(function(){busy=false;},function(){busy=false;});
}
function unlearn(id,chip){
  if(busy)return;
  busy=true;
  var L=state.learned[state.target],wasDone=deck().length===0;
  run(chip,[{transform:'none',opacity:1},{transform:'translateY(-18px) scale(.7)',opacity:0}],{duration:220,easing:'ease-in',fill:'forwards'}).finished.then(function(){
    var i=L.indexOf(id);if(i>-1)L.splice(i,1);
    /* returned card goes to the back of the deck */
    var o=state.order[state.target];o.splice(o.indexOf(id),1);o.push(id);
    var cur=wasDone?null:deck().filter(function(x){return x!==id;})[pos];
    save();
    if(cur!=null)pos=Math.max(0,deck().indexOf(cur));else pos=0;
    renderProgress(true);renderTray();renderTiles();renderCard();
    if(wasDone){unflip(true);run(card,[{transform:'translateY(30px) scale(.94)',opacity:0},{transform:'none',opacity:1}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'});}
    busy=false;
  });
}
function resetDeck(){
  if(busy)return;
  var tg=state.target,o=freshOrder();
  for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=o[i];o[i]=o[j];o[j]=x;}
  state.learned[tg]=[];state.order[tg]=o;pos=0;save();
  unflip(true);
  renderProgress(true);renderTray();renderTiles();renderCard();
  run(card,[{transform:'translateY(30px) scale(.94)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});
}

/* ---------- speech ---------- */
function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}$('speak').classList.remove('on');}
function speak(){
  if(!('speechSynthesis' in window))return;
  var d=deck(),p=BY_ID[d[pos]];if(!p)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(p[state.target]);
    u.lang=VOICE[state.target];u.rate=.88;
    var v=speechSynthesis.getVoices().filter(function(v){return short(v.lang)===state.target;});
    if(v.length)u.voice=v.filter(function(x){return x.lang.replace('_','-')===VOICE[state.target];})[0]||v[0];
    var b=$('speak');b.classList.add('on');
    u.onend=u.onerror=function(){b.classList.remove('on');};
    speechSynthesis.speak(u);
  }catch(e){}
}
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}

/* ---------- confetti ---------- */
function confetti(){
  if(reduce)return;
  var box=document.createElement('div');box.className='confetti';
  var cols=['#2b54c9','#d2472a','#17786a','#b8245a','#e0a526','#1b2231'];
  for(var i=0;i<90;i++){
    var c=document.createElement('i');
    c.style.left=(Math.random()*100)+'%';
    c.style.background=cols[i%cols.length];
    c.style.setProperty('--dx',(Math.random()*240-120)+'px');
    c.style.setProperty('--r',(Math.random()*1400-700)+'deg');
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s';
    c.style.animationDelay=(Math.random()*.5)+'s';
    if(i%3===0){c.style.borderRadius='50%';c.style.height='9px';}
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(function(){box.remove();},4400);
}

/* ---------- events ---------- */
document.querySelectorAll('[data-ui]').forEach(function(b){
  b.addEventListener('click',function(){stopSpeak();state.ui=b.getAttribute('data-ui');save();renderStatic();});
});
$('back').addEventListener('click',toWelcome);
$('another').addEventListener('click',toWelcome);
$('again').addEventListener('click',resetDeck);
$('reset').addEventListener('click',resetDeck);
$('prev').addEventListener('click',function(){go(-1);});
$('next').addEventListener('click',function(){go(1);});
$('shuffle').addEventListener('click',shuffle);
$('mark').addEventListener('click',markLearned);
$('speak').addEventListener('click',function(e){e.stopPropagation();speak();});

var sx=null,swiped=false;
card.addEventListener('pointerdown',function(e){sx=e.clientX;swiped=false;});
card.addEventListener('pointerup',function(e){
  if(sx==null)return;
  var dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>45){swiped=true;go(dx<0?1:-1);}
});
card.addEventListener('pointercancel',function(){sx=null;});
card.addEventListener('click',function(){if(swiped){swiped=false;return;}flip();});

document.addEventListener('keydown',function(e){
  if($('study').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  var a=document.activeElement,onBtn=a&&a.tagName==='BUTTON';
  var k=e.key;
  if((k===' '||k==='Enter')&&!onBtn){e.preventDefault();flip();}
  else if(k==='ArrowRight'){e.preventDefault();go(1);}
  else if(k==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(k==='s'||k==='S'){shuffle();}
  else if(k==='l'||k==='L'){markLearned();}
});

/* ---------- init ---------- */
renderStatic();
if(state.target){$('welcome').hidden=true;$('study').hidden=false;}
})();
</script>
