<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cloud Painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5b5f97; --ink-soft:#8f93c4; --pink:#ff8fb8; --pink-deep:#ff6fa3;
  --panel:rgba(255,255,255,.74); --ring:#ff9cc4;
  --font:'Fredoka','Baloo 2',ui-rounded,'Arial Rounded MT Bold','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a8deff;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7fb8ff;outline-offset:2px}

.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:3px solid rgba(255,255,255,.95);border-radius:30px;
  box-shadow:0 10px 30px rgba(96,104,190,.22),0 2px 0 rgba(255,255,255,.8) inset}

/* ---------- top bar ---------- */
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 12px}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.3px;line-height:1;
  background:linear-gradient(90deg,#ff86b3,#b08cff 50%,#5db9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{width:46px;height:34px;position:relative;animation:bob 3.2s ease-in-out infinite;flex:none}
.logo i{position:absolute;background:#fff;border-radius:50%;box-shadow:0 3px 0 #dfe6ff}
.logo i:nth-child(1){width:22px;height:22px;left:2px;top:11px}
.logo i:nth-child(2){width:28px;height:28px;left:11px;top:1px}
.logo i:nth-child(3){width:20px;height:20px;left:26px;top:13px}
.logo i:nth-child(4){width:30px;height:12px;left:8px;top:21px;border-radius:8px}
.logo::after{content:"";position:absolute;left:17px;top:15px;width:14px;height:7px;border-bottom:2.5px solid #8f93c4;border-radius:0 0 12px 12px;z-index:2}
.logo::before{content:"";position:absolute;left:17px;top:11px;width:3.5px;height:3.5px;border-radius:50%;background:#6c70a8;box-shadow:10px 0 0 #6c70a8;z-index:2}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}

.actions{display:flex;align-items:center;gap:6px;padding:7px 8px;margin-left:auto}
.themes{display:flex;gap:5px;padding:0 4px}
.theme{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(90,100,180,.3);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.theme:hover{transform:scale(1.12)}
.theme[aria-checked=true]{box-shadow:0 0 0 3px var(--ring),0 2px 6px rgba(90,100,180,.3);transform:scale(1.1)}
.theme[data-theme=day]{background:linear-gradient(#6cbeff,#e3f5ff)}
.theme[data-theme=candy]{background:linear-gradient(#a5b4ff,#ffc3dc 60%,#ffe6c4)}
.theme[data-theme=sunset]{background:linear-gradient(#5c54aa,#ff8c82 60%,#ffd68c)}
.theme[data-theme=night]{background:radial-gradient(circle at 68% 32%,#fff3b0 0 17%,transparent 19%),linear-gradient(#141848,#5a509a)}
.sep{width:2px;height:26px;border-radius:2px;background:rgba(140,146,210,.28);margin:0 2px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);
  box-shadow:0 3px 0 #dcdff7,0 5px 10px rgba(96,104,190,.16);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s;position:relative}
.ib:hover{transform:translateY(-2px) rotate(-4deg)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #dcdff7}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib.off{color:#c2c5e2}
.ib .badge{position:absolute;right:-3px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:#8fd0ff;color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;border:2px solid #fff}
.save{height:42px;padding:0 18px 0 14px;border-radius:24px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#ffa3c6,#ff78ab);box-shadow:0 3px 0 #e85c92,0 6px 14px rgba(255,111,163,.4);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
.save:hover{transform:translateY(-2px) scale(1.04)}
.save:active{transform:translateY(2px);box-shadow:0 1px 0 #e85c92}
.save svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;
  padding:8px 14px 10px;z-index:5;max-width:calc(100vw - 20px)}
.grp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 8px;flex:none}
.grp+.grp{border-left:2px dashed rgba(140,146,210,.3)}
.grp h2{margin:0;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft)}
.row{display:flex;gap:7px;align-items:center;flex:1}
.tool{width:50px;height:50px;border-radius:18px;background:linear-gradient(160deg,#8fd0ff,#c5e8ff);border:3px solid #fff;display:grid;place-items:center;
  box-shadow:0 3px 0 #cfd6f5,0 5px 10px rgba(96,104,190,.18);transition:transform .2s cubic-bezier(.3,1.7,.5,1),box-shadow .2s;position:relative}
.tool canvas{width:44px;height:44px;display:block;pointer-events:none}
.tool:hover{transform:translateY(-3px) rotate(-4deg)}
.tool:active{transform:scale(.92)}
.tool[aria-pressed=true]{box-shadow:0 0 0 3.5px var(--ring),0 6px 14px rgba(255,111,163,.35);transform:translateY(-4px) scale(1.06)}
.tool.friend{background:linear-gradient(160deg,#ffe9a8,#ffd0de)}
.tool.friend:active{transform:scale(.88) rotate(6deg)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 #cfd6f5,0 4px 8px rgba(96,104,190,.2);
  transition:transform .2s cubic-bezier(.3,1.7,.5,1),box-shadow .2s;position:relative;flex:none}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ring),0 4px 10px rgba(255,111,163,.35);transform:scale(1.18)}
.sw.storm::after{content:"";position:absolute;left:50%;top:54%;width:8px;height:8px;background:#7fc4ff;border-radius:0 50% 50% 50%;transform:translate(-50%,-50%) rotate(45deg)}
.sizebox{display:flex;align-items:center;gap:8px;flex:1}
.dot{background:#fff;border-radius:50%;box-shadow:0 2px 0 #cfd6f5;flex:none}
.dot.s{width:10px;height:10px}.dot.l{width:24px;height:24px}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:14px;border-radius:10px;margin:0;
  background:linear-gradient(90deg,#bfe4ff,#ffc4dd);box-shadow:inset 0 2px 3px rgba(96,104,190,.25);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--pink);
  box-shadow:0 3px 6px rgba(96,104,190,.35);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--pink);box-shadow:0 3px 6px rgba(96,104,190,.35)}

/* ---------- overlays ---------- */
.hint{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:14px 26px;font-size:22px;font-weight:600;text-align:center;
  pointer-events:none;z-index:4;transition:opacity .6s,transform .6s;animation:float 3s ease-in-out infinite;max-width:86vw}
.hint small{display:block;font-size:15px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.hint.gone{opacity:0;transform:translate(-50%,-80%) scale(.9)}
@keyframes float{50%{margin-top:-8px}}
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px) scale(.9);opacity:0;padding:9px 20px;font-size:17px;font-weight:600;z-index:8;
  pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

@media (max-width:1180px){
  .dock{left:10px;right:10px;transform:none;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;border-radius:26px}
  .dock::-webkit-scrollbar{display:none}
}
@media (max-width:640px){
  .brand{padding:6px 14px 6px 8px}.brand h1{font-size:20px}.logo{transform:scale(.85)}
  .actions{gap:4px;padding:5px 6px}
  .ib,.save{width:36px;height:36px}.save{padding:0;justify-content:center}.save span{display:none}
  .theme{width:24px;height:24px;border-width:2px}.themes{gap:4px;padding:0 2px}.sep{display:none}.actions{max-width:100%}
  .tool{width:46px;height:46px;border-radius:16px}.tool canvas{width:40px;height:40px}
  .hint{font-size:18px}.toast{top:124px;font-size:15px}
  .grp h2{font-size:10px}
}
@media (max-height:520px){.grp h2{display:none}.dock{padding:6px 10px}}
</style>
</head>
<body>
<canvas id="sky" aria-label="Sky canvas. Drag to paint clouds."></canvas>

<header class="top">
  <div class="brand panel"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Cloud Painter</h1></div>
  <div class="actions panel">
    <div class="themes" role="radiogroup" aria-label="Sky color">
      <button class="theme" data-theme="day" role="radio" aria-checked="true" title="Sunny day" aria-label="Sunny day"></button>
      <button class="theme" data-theme="candy" role="radio" aria-checked="false" title="Candy morning" aria-label="Candy morning"></button>
      <button class="theme" data-theme="sunset" role="radio" aria-checked="false" title="Sunset" aria-label="Sunset"></button>
      <button class="theme" data-theme="night" role="radio" aria-checked="false" title="Starry night" aria-label="Starry night"></button>
    </div>
    <span class="sep"></span>
    <button class="ib" id="wind" title="Wind: Breezy" aria-label="Change wind">
      <svg viewBox="0 0 24 24"><path d="M3 9h10a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/><path d="M3 19h6"/></svg><span class="badge" id="windBadge">2</span>
    </button>
    <button class="ib" id="sound" title="Sound on" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4z" fill="currentColor"/><path class="w" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
    <button class="ib" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h10a6 6 0 0 1 0 12h-4"/></svg>
    </button>
    <button class="ib" id="clear" title="Blow the clouds away" aria-label="Clear sky">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10.5 11v5M13.5 11v5"/></svg>
    </button>
    <button class="save" id="save" title="Save picture (S)" aria-label="Save picture">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Save</span>
    </button>
  </div>
</header>

<div class="hint panel" id="hint">Drag across the sky to paint clouds!<small>Then send a plane flying through them</small></div>
<div class="toast panel" id="toast" role="status" aria-live="polite"></div>
<div class="flash" id="flash"></div>

<footer class="dock panel">
  <section class="grp"><h2>Brushes</h2><div class="row" id="brushes"></div></section>
  <section class="grp"><h2>Colors</h2><div class="row" id="colors"></div></section>
  <section class="grp"><h2>Size</h2><div class="sizebox"><span class="dot s"></span><input type="range" id="size" min="14" max="90" value="40" aria-label="Brush size"><span class="dot l"></span></div></section>
  <section class="grp"><h2>Sky Friends</h2><div class="row" id="flyers"></div></section>
</footer>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FONT = "'Fredoka','Baloo 2',ui-rounded,'Arial Rounded MT Bold',sans-serif";

const cv = $('#sky'), ctx = cv.getContext('2d');
const live = document.createElement('canvas'), lctx = live.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ================= state ================= */
const clouds = [], flyers = [], parts = [], actions = [];
let liveCloud = null;
const pointers = new Map();
const mouse = { x: 0, y: 0, show: false };
let brushId = 'fluffy', colorId = 'white', size = 40;
const WINDS = [{ n: 'Calm', m: 0 }, { n: 'Breezy', m: 1 }, { n: 'Windy', m: 3.4 }];
let windIx = 1, windCur = 1;
let muted = false, hintGone = false, planeTip = false;

/* ================= sound ================= */
let ac = null;
function tone(f, d = .15, type = 'sine', v = .05, slide = 0, delay = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
const skyNote = y => tone(SCALE[clamp(Math.round((1 - y / H) * (SCALE.length - 1)), 0, SCALE.length - 1)], .35, 'sine', .035);

/* ================= colors ================= */
const COLORS = [
  { id: 'white', name: 'Snowy white', rgb: [255, 255, 255] },
  { id: 'pink', name: 'Cotton candy', rgb: [255, 186, 218] },
  { id: 'peach', name: 'Peach', rgb: [255, 204, 168] },
  { id: 'lemon', name: 'Lemon', rgb: [255, 240, 158] },
  { id: 'mint', name: 'Mint', rgb: [184, 240, 208] },
  { id: 'lilac', name: 'Lilac', rgb: [214, 196, 255] },
  { id: 'storm', name: 'Rain cloud', rgb: [146, 158, 190] },
  { id: 'rainbow', name: 'Rainbow' }
];
const colorById = id => COLORS.find(c => c.id === id);
function colFn(st) {
  if (st.colorId === 'rainbow') { const h = Math.round((st.hue + st.dist * .55) % 360); return a => `hsla(${h},95%,80%,${a})`; }
  const [r, g, b] = colorById(st.colorId).rgb; return a => `rgba(${r},${g},${b},${a})`;
}

/* ================= shape paths ================= */
function heartPath(c, s) { const k = s / 2; c.beginPath(); c.moveTo(0, k * .8);
  c.bezierCurveTo(-k * 1.55, -k * .15, -k * .8, -k * 1.2, 0, -k * .42); c.bezierCurveTo(k * .8, -k * 1.2, k * 1.55, -k * .15, 0, k * .8); c.closePath(); }
function starPath(c, s) { const R = s / 2, r = R * .52; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); } c.closePath(); }
function drawHeart(c, s, col) { heartPath(c, s); c.fillStyle = col(1); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(-s * .2, -s * .2, s * .09, s * .06, -.6, 0, TAU); c.fill(); }
function drawStar(c, s, col) { starPath(c, s * .88); c.fillStyle = c.strokeStyle = col(1); c.lineJoin = 'round'; c.lineWidth = s * .14; c.fill(); c.stroke(); c.shadowColor = 'transparent';
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(-s * .08, -s * .1, s * .07, 0, TAU); c.fill(); }
function drawFlower(c, s, col, center) { c.fillStyle = col(1);
  c.beginPath(); for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2, x = Math.cos(a) * s * .26, y = Math.sin(a) * s * .26; c.moveTo(x + s * .23, y); c.arc(x, y, s * .23, 0, TAU); } c.fill();
  c.shadowColor = 'transparent'; c.fillStyle = center; c.beginPath(); c.arc(0, 0, s * .15, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(-s * .04, -s * .05, s * .05, 0, TAU); c.fill(); }
function drawBubble(c, s, col) { const r = s * .45; c.shadowColor = 'transparent';
  const g = c.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); g.addColorStop(0, col(.12)); g.addColorStop(.75, col(.3)); g.addColorStop(1, col(.75));
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = Math.max(1.2, s * .05); c.stroke();
  c.lineCap = 'round'; c.lineWidth = Math.max(1.5, s * .08); c.beginPath(); c.arc(0, 0, r * .66, Math.PI * 1.08, Math.PI * 1.42); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(r * .38, r * .42, s * .035, 0, TAU); c.fill(); }
function puff(c, x, y, r, col) { const g = c.createRadialGradient(x, y, r * .15, x, y, r);
  g.addColorStop(0, col(1)); g.addColorStop(.62, col(.96)); g.addColorStop(1, col(0)); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
const RAINBOW = ['#ff7d92', '#ffb26b', '#ffe66d', '#8fe39a', '#73c7ff', '#b79aff'];
function ribbon(c, x0, y0, n0x, n0y, x1, y1, n1x, n1y, s) { const bw = s * 1.15 / 6; c.lineCap = 'round'; c.lineWidth = bw + .8;
  for (let i = 0; i < 6; i++) { const o = (i - 2.5) * bw; c.strokeStyle = RAINBOW[i]; c.beginPath(); c.moveTo(x0 + n0x * o, y0 + n0y * o); c.lineTo(x1 + n1x * o, y1 + n1y * o); c.stroke(); } }
function arch(c, x, y, s) { const bw = s * .19; c.lineCap = 'butt'; c.lineWidth = bw + .6;
  for (let i = 0; i < 6; i++) { c.strokeStyle = RAINBOW[i]; c.beginPath(); c.arc(x, y, s * 1.5 - i * bw, Math.PI, TAU); c.stroke(); } }
function shadowOn(c, s) { c.shadowColor = 'rgba(70,84,160,.28)'; c.shadowBlur = s * .16 * DPR; c.shadowOffsetY = s * .06 * DPR; }

/* ================= brushes ================= */
const shapeStamp = draw => (c, x, y, s, col, st) => { const k = s * rand(.7, 1.15); c.save(); c.translate(x + rand(-.15, .15) * s, y + rand(-.15, .15) * s); c.rotate(rand(-.45, .45)); shadowOn(c, k); draw(c, k, col, st); c.restore(); };
const BRUSHES = [
  { id: 'fluffy', name: 'Fluffy cloud', spacing: .28, shade: true,
    stamp(c, x, y, s, col) { for (let i = 0; i < 2; i++) puff(c, x + rand(-.3, .3) * s, y + rand(-.25, .25) * s, s * rand(.5, .92), col); },
    icon(c) { const w = a => `rgba(255,255,255,${a})`; puff(c, 14, 26, 10, w); puff(c, 23, 19, 13, w); puff(c, 32, 26, 10, w); puff(c, 22, 28, 10, w); } },
  { id: 'mist', name: 'Wispy mist', spacing: .22, shade: true,
    stamp(c, x, y, s, col) { for (let i = 0; i < 5; i++) { const a = rand(TAU), d = Math.sqrt(rand()) * s * .95; c.globalAlpha = rand(.45, .85); puff(c, x + Math.cos(a) * d, y + Math.sin(a) * d * .7, s * rand(.1, .3), col); } c.globalAlpha = 1; },
    icon(c) { const w = a => `rgba(255,255,255,${a})`; [[10, 24, 5], [17, 17, 6], [25, 25, 7], [33, 18, 5], [20, 31, 4], [31, 30, 4], [26, 13, 3], [12, 14, 3]].forEach(p => puff(c, p[0], p[1], p[2], w)); } },

/* ================= frame ================= */

/* ================= input ================= */
const pos = e => ({ x: e.clientX, y: e.clientY });

/* ================= actions ================= */

function iconCanvas(draw) { const c = document.createElement('canvas'); c.width = c.height = 88; const k = c.getContext('2d'); k.scale(2, 2); const d = DPR; DPR = 2; k.save(); draw(k); k.restore(); DPR = d; return c; }

addEventListener('keydown', e => {

function simCloud(cx, cy, wid, s, color = 'white') {

addEventListener('resize', resize);
