<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Practice Drills</title>
<meta name="description" content="Timed math drills to build speed and accuracy.">
<style>
:root{
  --bg:#f6f4ee; --card:#fffdf8; --ink:#16161b; --muted:#6d6b66; --line:#dcd8cd;
  --accent:#2748e8; --accent-ink:#ffffff; --good:#12804a; --bad:#cf3a26; --soft:#ebe8df;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1014; --card:#17181e; --ink:#f3f1ea; --muted:#9a988f; --line:#2c2e37;
  --accent:#8ba2ff; --accent-ink:#0b0d16; --good:#4fd08a; --bad:#ff7a66; --soft:#1e2028;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.45;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(18px,4vw,40px);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:1.1rem;display:flex;align-items:center;gap:10px}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);font-style:normal;font-size:1.25rem;line-height:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{padding:8px 14px;border-radius:999px;color:var(--muted);font-size:.9rem;font-weight:600}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}

main{flex:1;display:flex;flex-direction:column;width:100%;max-width:880px;margin:0 auto;padding:0 clamp(18px,4vw,40px) 40px}
section{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-size:clamp(2.5rem,8vw,4.6rem);line-height:1;letter-spacing:-.045em;margin:clamp(14px,5vh,48px) 0 12px;font-weight:800}
h2{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.035em;line-height:1.05;margin:clamp(14px,4vh,36px) 0 24px;font-weight:800}
.lede{color:var(--muted);font-size:1.2rem;margin:0 0 clamp(24px,5vh,44px);max-width:32ch}
.label{font-size:.8rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.group{margin-bottom:28px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;
  font-weight:700;font-size:1.25rem;transition:border-color .15s,background .15s,color .15s,transform .1s;min-height:68px}
.opt small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-top:2px;letter-spacing:0}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] small{color:inherit;opacity:.7}
.opt.sym{font-size:2rem;line-height:1.1}
@media(max-width:520px){.opts.wrap{grid-template-columns:repeat(2,1fr)}}

.switch{display:flex;align-items:center;gap:14px;font-size:1rem;color:var(--muted);text-align:left;padding:4px 0}
.switch b{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch b::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:transform .2s;box-shadow:0 1px 3px #0003}
.switch[aria-checked="true"] b{background:var(--accent)}
.switch[aria-checked="true"] b::after{transform:translateX(22px)}
.switch span strong{color:var(--ink);font-weight:600}

.cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:34px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.4rem;padding:20px 38px;border-radius:18px;
  letter-spacing:-.01em;transition:transform .12s,filter .15s;display:inline-flex;align-items:center;gap:12px}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn kbd{font:inherit;font-size:.75rem;font-weight:700;border:1.5px solid currentColor;opacity:.7;border-radius:6px;padding:1px 7px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:1.1rem;padding:16px 24px;font-weight:700}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.small{font-size:.95rem;padding:10px 18px;border-radius:12px}
.best-note{color:var(--muted);font-size:1.05rem}
.best-note strong{color:var(--ink);font-size:1.3rem}
@media(pointer:coarse){.btn kbd,.keys-hint{display:none}}

/* Quiz */
#quiz,#count{flex:1;display:flex;flex-direction:column}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--ink);transform-origin:left;border-radius:99px}
.bar.low div{background:var(--bad)}
.hud{display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px;gap:12px}
.hud>div{min-width:5.2rem}
.hud>div:nth-child(2){text-align:center}
.hud>div:last-child{text-align:right}
.hud .label{margin:0}
.hud .v{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.hud .v.low{color:var(--bad)}
.bump{animation:bump .25s ease}
@keyframes bump{40%{transform:scale(1.25);color:var(--good)}}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 0;min-height:230px}
.problem{font-size:clamp(3.2rem,13.5vw,8.5rem);font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.problem .o{color:var(--accent);margin:0 .12em;font-weight:700}
.problem.in{animation:pin .18s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.answer{margin-top:clamp(16px,4vh,36px);font-size:clamp(2.8rem,11vw,6.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;
  min-width:3.2ch;padding:0 .3ch .06em;border-bottom:6px solid var(--line);min-height:1.25em;display:inline-flex;justify-content:center;align-items:baseline;gap:.4ch;transition:border-color .15s}
.answer.has{border-color:var(--ink)}
.answer .caret{width:5px;height:.8em;background:var(--accent);align-self:center;border-radius:3px;animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:0}}
.answer.wrong{border-color:var(--bad);animation:shake .3s}
.answer.wrong s{color:var(--bad);opacity:.75;text-decoration-thickness:5px}
.answer.wrong em{color:var(--good);font-style:normal}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.keys-hint{color:var(--muted);font-size:.92rem;text-align:center;margin:0 0 6px}
.keys-hint kbd{font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink)}
.quit{color:var(--muted);font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:99px;align-self:center;margin-top:8px}
.quit:hover{background:var(--soft);color:var(--ink)}
.pad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;max-width:440px;width:100%;margin:0 auto}
.pad button{background:var(--card);border:2px solid var(--line);border-radius:16px;font-size:1.9rem;font-weight:700;height:clamp(54px,9.5vh,72px);user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media(pointer:coarse),(max-width:640px){.pad{display:grid}}
#count .stage div{font-size:clamp(7rem,30vw,14rem);font-weight:800;letter-spacing:-.05em;line-height:1}
#count .stage p{color:var(--muted);font-size:1.2rem;margin:10px 0 0}
.pop{animation:popn .5s ease-out}
@keyframes popn{from{opacity:0;transform:scale(1.5)}}

/* Results */
.badge{display:inline-block;background:var(--good);color:var(--bg);font-weight:800;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:99px;animation:popn .5s .5s both}
.big{font-size:clamp(6.5rem,28vw,13rem);font-weight:800;letter-spacing:-.06em;line-height:.95;margin:8px 0 0}
.big-cap{font-size:1.3rem;color:var(--muted);margin:4px 0 30px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:30px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.tile .label{margin:0 0 2px}
.tile .v{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.03em}
.tile .v small{font-size:.5em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.missed{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.missed li{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.4rem;font-weight:700}
.missed li span{display:block;font-size:.9rem;font-weight:500;color:var(--muted)}
.missed li em{font-style:normal;color:var(--good)}

/* Scores */
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:22px}
.panel svg{display:block;width:100%;height:auto;overflow:visible}
table{width:100%;border-collapse:collapse;font-size:1.05rem}
th{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;font-weight:700}
th:first-child,td:first-child{text-align:left}
td{padding:11px 8px;border-top:1.5px solid var(--line);text-align:right}
td.n{font-weight:800;font-size:1.3rem}
td.dim{color:var(--line);font-weight:500}
.scroll{overflow-x:auto}
.opbar{display:grid;grid-template-columns:2.2rem 1fr 4rem;align-items:center;gap:12px;margin:10px 0;font-weight:700}
.opbar>span:first-child{font-size:1.6rem;text-align:center;line-height:1}
.opbar i{display:block;height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.opbar i b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.opbar>span:last-child{text-align:right}
.empty{text-align:center;color:var(--muted);padding:48px 10px;font-size:1.15rem}
.danger{color:var(--muted);font-size:.9rem;font-weight:600;text-decoration:underline;text-underline-offset:4px;padding:8px}
.danger:hover,.danger.arm{color:var(--bad)}
.confetti{position:fixed;top:38%;left:50%;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-height:640px){.stage{min-height:150px;padding:6px 0}.hud{margin-top:8px}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><i aria-hidden="true">÷</i>Math Practice Drills</div>
  <nav aria-label="Main">
    <button id="navHome" aria-current="page">Practice</button>
    <button id="navScores">Scores</button>
    <button id="soundBtn" aria-pressed="true">Sound on</button>
    <button id="themeBtn">Dark</button>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section id="home">
    <h1>Get faster.<br>Miss less.</h1>
    <p class="lede">Short, timed drills. Answer as many as you can before the clock runs out.</p>

    <div class="group">
      <p class="label" id="lOps">Operations</p>
      <div class="opts" role="group" aria-labelledby="lOps" id="ops">
        <button class="opt sym" data-op="+" aria-label="Addition">+</button>
        <button class="opt sym" data-op="−" aria-label="Subtraction">−</button>
        <button class="opt sym" data-op="×" aria-label="Multiplication">×</button>
        <button class="opt sym" data-op="÷" aria-label="Division">÷</button>
      </div>
    </div>

    <div class="group">
      <p class="label" id="lDiff">Difficulty</p>
      <div class="opts wrap" role="group" aria-labelledby="lDiff" id="diffs">
        <button class="opt" data-diff="easy">Easy<small>Numbers to 10</small></button>
        <button class="opt" data-diff="medium">Medium<small>Tables to 12</small></button>
        <button class="opt" data-diff="hard">Hard<small>Two‑digit work</small></button>
        <button class="opt" data-diff="expert">Expert<small>Big numbers</small></button>
      </div>
    </div>

    <div class="group">
      <p class="label" id="lDur">Time</p>
      <div class="opts three" role="group" aria-labelledby="lDur" id="durs">
        <button class="opt" data-dur="30">30<small>seconds</small></button>
        <button class="opt" data-dur="60">60<small>seconds</small></button>
        <button class="opt" data-dur="120">2<small>minutes</small></button>
      </div>
    </div>

    <button class="switch" id="autoBtn" role="switch" aria-checked="true">
      <b></b><span><strong>Auto‑submit</strong> — answers check themselves as soon as you've typed enough digits</span>
    </button>

    <div class="cta">
      <button class="btn" id="startBtn">Start drill <kbd>Enter</kbd></button>
      <div class="best-note" id="bestNote"></div>
    </div>
  </section>

  <!-- COUNTDOWN -->
  <section id="count" hidden>
    <div class="stage"><div id="countNum">3</div><p>Get ready</p></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <div class="hud">
      <div><p class="label">Time</p><div class="v" id="hTime" role="timer">1:00</div></div>
      <div><p class="label">Score</p><div class="v" id="hScore">0</div></div>
      <div><p class="label">Streak</p><div class="v" id="hStreak">0</div></div>
    </div>
    <div class="stage">
      <div class="problem" id="problem" aria-live="polite"></div>
      <div class="answer" id="answer" aria-label="Your answer"></div>
    </div>
    <p class="keys-hint" id="hint"></p>
    <div class="pad" id="pad" aria-label="Number pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="Backspace" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="Enter" class="go" aria-label="Submit">↵</button>
    </div>
    <button class="quit" id="quitBtn">Quit drill</button>
    <div class="sr" aria-live="assertive" id="live"></div>
  </section>

  <!-- RESULTS -->
  <section id="results" hidden>
    <div style="margin-top:clamp(10px,3vh,30px);min-height:34px"><span class="badge" id="pbBadge" hidden>New personal best</span></div>
    <div class="big" id="rScore">0</div>
    <p class="big-cap" id="rCap"></p>
    <div class="tiles">
      <div class="tile"><p class="label">Accuracy</p><div class="v" id="rAcc"></div></div>
      <div class="tile"><p class="label">Speed</p><div class="v" id="rRate"></div></div>
      <div class="tile"><p class="label">Avg. time</p><div class="v" id="rAvg"></div></div>
      <div class="tile"><p class="label">Best streak</p><div class="v" id="rStreak"></div></div>
    </div>
    <div id="missedWrap" hidden>
      <p class="label">Worth another look</p>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="cta">
      <button class="btn" id="againBtn">Go again <kbd>Enter</kbd></button>
      <button class="btn ghost" id="setBtn">Change settings</button>
      <button class="btn ghost" id="toScores">All scores</button>
    </div>
  </section>

  <!-- SCORES -->
  <section id="scores" hidden>
    <h2>Your scores</h2>
    <div id="scoresBody"></div>
  </section>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const DIFFS={easy:'Easy',medium:'Medium',hard:'Hard',expert:'Expert'};
const DURS=[30,60,120];
const OPS=['+','−','×','÷'];
const S=Object.assign({ops:OPS.slice(),diff:'medium',dur:60,auto:true,sound:true,theme:null},store.get('mpd.settings',{}));
S.ops=(S.ops||[]).filter(o=>OPS.includes(o)); if(!S.ops.length)S.ops=OPS.slice();
if(!DIFFS[S.diff])S.diff='medium'; if(!DURS.includes(S.dur))S.dur=60;
let history=store.get('mpd.history',[]); if(!Array.isArray(history))history=[];
let view='home', q=null, raf=0, lockT=0, countT=0;
const save=()=>store.set('mpd.settings',S);
const durLabel=d=>d>=120?(d/60)+' min':d+' sec';
const fmtTime=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- theme & sound ---------- */
function applyTheme(){
  const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('themeBtn').textContent=dark?'Light':'Dark';
  $('themeBtn').setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');
}
$('themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme()};
function applySound(){$('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',S.sound)}
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();applySound();if(S.sound)tone(660,.08)};
let ac=null;
function tone(f,d,type,when,vol){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

/* ---------- views ---------- */
function show(v){
  view=v;
  ['home','count','quiz','results','scores'].forEach(id=>$(id).hidden=id!==v);
  $('top').hidden=(v==='quiz'||v==='count');
  $('navHome').toggleAttribute('aria-current',v==='home'||v==='results');
  $('navScores').toggleAttribute('aria-current',v==='scores');
  if(v==='home'||v==='results')$('navHome').setAttribute('aria-current','page');
  if(v==='scores')$('navScores').setAttribute('aria-current','page');
  window.scrollTo(0,0);
}
function stopAll(){cancelAnimationFrame(raf);clearTimeout(lockT);clearTimeout(countT)}
$('navHome').onclick=()=>{stopAll();renderHome();show('home')};
$('navScores').onclick=$('toScores').onclick=()=>{stopAll();renderScores();show('scores')};
$('setBtn').onclick=()=>{renderHome();show('home')};

/* ---------- home ---------- */
function bestFor(diff,dur){let b=0;for(const h of history)if(h.diff===diff&&h.dur===dur&&h.correct>b)b=h.correct;return b}
function renderHome(){
  document.querySelectorAll('#ops .opt').forEach(b=>b.setAttribute('aria-pressed',S.ops.includes(b.dataset.op)));
  document.querySelectorAll('#diffs .opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.diff===S.diff));
  document.querySelectorAll('#durs .opt').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.dur===S.dur));
  $('autoBtn').setAttribute('aria-checked',S.auto);
  const b=bestFor(S.diff,S.dur);
  $('bestNote').innerHTML=b?`Your best here: <strong>${b}</strong>`:(history.length?'No score at this setting yet':'');
}
$('ops').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const o=b.dataset.op;
  if(S.ops.includes(o)){if(S.ops.length>1)S.ops=S.ops.filter(x=>x!==o)}else S.ops=OPS.filter(x=>x===o||S.ops.includes(x));
  save();renderHome()};
$('diffs').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.diff=b.dataset.diff;save();renderHome()};
$('durs').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.dur=+b.dataset.dur;save();renderHome()};
$('autoBtn').onclick=()=>{S.auto=!S.auto;save();renderHome()};
$('startBtn').onclick=$('againBtn').onclick=startCountdown;

/* ---------- problem generation ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RANGE={
  easy:  {add:[1,10],   m1:[1,5],   m2:[1,10]},
  medium:{add:[5,50],   m1:[2,12],  m2:[2,12]},
  hard:  {add:[20,200], m1:[3,12],  m2:[11,30]},
  expert:{add:[100,999],m1:[11,30], m2:[11,30]}
};
function gen(){
  const r=RANGE[S.diff],op=S.ops[R(0,S.ops.length-1)];
  let a,b,ans;
  if(op==='+'){a=R(...r.add);b=R(...r.add);ans=a+b}
  else if(op==='−'){const x=R(...r.add),y=R(...r.add);if(S.diff==='easy'){a=Math.max(x,y);b=Math.min(x,y)}else{a=x+y;b=y}ans=a-b}
  else if(op==='×'){a=R(...r.m1);b=R(...r.m2);if(Math.random()<.5)[a,b]=[b,a];ans=a*b}
  else{b=R(...r.m1);ans=R(...r.m2);a=b*ans}
  return {a,b,op,ans,text:`${a} ${op} ${b}`};
}

/* ---------- quiz ---------- */
function startCountdown(){
  stopAll();
  tone(1,.01,'sine',0,.0001); // unlock audio on user gesture
  show('count');
  let n=3;
  const step=()=>{
    if(n===0){startQuiz();return}
    const el=$('countNum');el.textContent=n;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    tone(440,.09);n--;countT=setTimeout(step,650);
  };
  step();
}
function startQuiz(){
  const now=performance.now();
  q={start:now,deadline:now+S.dur*1000,correct:0,wrong:0,streak:0,best:0,cur:null,typed:'',locked:false,qStart:now,
     times:[],missed:[],retry:[],count:0,perOp:{},lastSec:-1};
  S.ops.forEach(o=>q.perOp[o]=[0,0]);
  $('hScore').textContent='0';$('hStreak').textContent='0';
  $('hint').innerHTML=S.auto?'Just type — answers check automatically · <kbd>Esc</kbd> quits':'Type your answer · <kbd>Enter</kbd> submits · <kbd>Esc</kbd> quits';
  show('quiz');tone(880,.18);
  next();tick();
}
function next(){
  q.count++;
  let p;
  if(q.retry.length&&q.retry[0].at<=q.count)p=q.retry.shift().p;
  else{let i=0;do{p=gen()}while(q.cur&&p.text===q.cur.text&&++i<20)}
  q.cur=p;q.typed='';q.locked=false;q.qStart=performance.now();
  const el=$('problem');
  el.innerHTML=`${p.a}<span class="o">${p.op}</span>${p.b}`;
  el.setAttribute('aria-label',p.text);
  el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
  renderAnswer();
}
function renderAnswer(){
  const el=$('answer');
  el.className='answer'+(q.typed?' has':'');
  el.innerHTML=esc(q.typed)+'<span class="caret"></span>';
}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function key(k){
  if(view!=='quiz'||!q||q.locked)return;
  if(/^\d$/.test(k)){
    if(q.typed==='0')q.typed='';
    if(q.typed.length>=7)return;
    q.typed+=k;renderAnswer();
    if(S.auto&&q.typed.length>=String(q.cur.ans).length)submit();
  }else if(k==='Backspace'){q.typed=q.typed.slice(0,-1);renderAnswer()}
  else if(k==='Enter')submit();
}
function submit(){
  if(!q||q.locked||!q.typed)return;
  const p=q.cur,val=Number(q.typed),now=performance.now();
  q.times.push(now-q.qStart);
  const po=q.perOp[p.op]||(q.perOp[p.op]=[0,0]);po[1]++;
  if(val===p.ans){
    q.correct++;q.streak++;po[0]++;if(q.streak>q.best)q.best=q.streak;
    $('hScore').textContent=q.correct;bump($('hScore'));
    $('hStreak').textContent=q.streak;
    tone(740+Math.min(q.streak,10)*30,.09,'triangle');
    next();
  }else{
    q.wrong++;q.streak=0;q.locked=true;
    $('hStreak').textContent='0';
    if(!q.missed.some(m=>m.text===p.text))q.missed.push({text:p.text,ans:p.ans,said:val});
    q.retry.push({p,at:q.count+3});
    const el=$('answer');el.className='answer wrong';
    el.innerHTML=`<s>${esc(q.typed)}</s><em>${p.ans}</em>`;
    $('live').textContent=`Incorrect. ${p.text} is ${p.ans}`;
    tone(170,.22,'sawtooth',0,.07);
    lockT=setTimeout(()=>{if(view==='quiz')next()},850);
  }
}
function tick(){
  if(view!=='quiz')return;
  const left=q.deadline-performance.now();
  if(left<=0){finish();return}
  $('barFill').style.transform=`scaleX(${left/(S.dur*1000)})`;
  const sec=Math.ceil(left/1000);
  if(sec!==q.lastSec){
    q.lastSec=sec;$('hTime').textContent=fmtTime(sec);
    const low=sec<=5;$('hTime').classList.toggle('low',low);$('bar').classList.toggle('low',low);
    if(low)tone(520,.05,'sine',0,.06);
  }
  raf=requestAnimationFrame(tick);
}
// keep the clock honest if the tab is backgrounded
setInterval(()=>{if(view==='quiz'&&q&&performance.now()>=q.deadline)finish()},500);
function quit(){stopAll();q=null;renderHome();show('home')}
$('quitBtn').onclick=quit;
$('pad').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();key(b.dataset.k)});

/* ---------- results ---------- */
function finish(){
  if(view!=='quiz'||!q)return;
  stopAll();
  const r=q;q=null;
  const total=r.correct+r.wrong;
  const prevBest=bestFor(S.diff,S.dur);
  const entry={t:Date.now(),diff:S.diff,dur:S.dur,ops:S.ops.join(''),correct:r.correct,wrong:r.wrong,streak:r.best,
    avg:r.times.length?Math.round(r.times.reduce((a,b)=>a+b,0)/r.times.length):0,perOp:r.perOp};
  history.push(entry);if(history.length>300)history=history.slice(-300);
  store.set('mpd.history',history);
  const isPB=r.correct>0&&r.correct>prevBest;
  $('pbBadge').hidden=!isPB;
  $('rCap').textContent=`correct in ${durLabel(S.dur)} · ${DIFFS[S.diff]} · ${S.ops.join(' ')}`+(!isPB&&prevBest?` · best ${prevBest}`:'');
  $('rAcc').innerHTML=total?Math.round(r.correct/total*100)+'<small>%</small>':'—';
  $('rRate').innerHTML=(r.correct/(S.dur/60)).toFixed(r.correct%(S.dur/60)?1:0)+'<small>/min</small>';
  $('rAvg').innerHTML=entry.avg?(entry.avg/1000).toFixed(1)+'<small>s</small>':'—';
  $('rStreak').textContent=r.best;
  $('missedWrap').hidden=!r.missed.length;
  $('missed').innerHTML=r.missed.map(m=>`<li>${esc(m.text)} = <em>${m.ans}</em><span>You answered ${m.said}</span></li>`).join('');
  show('results');
  // count-up
  const el=$('rScore'),t0=performance.now(),D=Math.min(700,r.correct*40);
  (function up(t){const k=D?Math.min(1,(t-t0)/D):1;el.textContent=Math.round(r.correct*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(up)})(t0);
  tone(523,.14,'triangle');tone(659,.14,'triangle',.12);tone(784,.3,'triangle',.24);
  if(isPB){tone(1047,.4,'triangle',.4);confetti()}
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!document.body.animate)return;
  const cs=getComputedStyle(document.documentElement),cols=['--accent','--good','--bad','--ink'].map(c=>cs.getPropertyValue(c));
  for(let i=0;i<46;i++){
    const d=document.createElement('div');d.className='confetti';d.style.background=cols[i%cols.length];document.body.appendChild(d);
    const ang=Math.random()*Math.PI*2,dist=140+Math.random()*320,x=Math.cos(ang)*dist,y=Math.sin(ang)*dist-120;
    d.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},
      {transform:`translate(${x}px,${y}px) rotate(${R(-360,360)}deg)`,opacity:1,offset:.6},
      {transform:`translate(${x*1.1}px,${y+260}px) rotate(${R(-720,720)}deg)`,opacity:0}],
      {duration:1300+Math.random()*700,delay:450,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}).onfinish=()=>d.remove();
  }
}

/* ---------- scores ---------- */
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dayStreak(){
  const days=new Set(history.map(h=>dayKey(h.t)));let d=new Date(),n=0;
  if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function chart(){
  const data=history.slice(-20).map(h=>h.correct/(h.dur/60));
  const W=640,H=190,pl=8,pr=8,pt=14,pb=10,max=Math.max(10,...data)*1.15;
  const X=i=>data.length===1?W/2:pl+i*(W-pl-pr)/(data.length-1),Y=v=>pt+(1-v/max)*(H-pt-pb);
  const pts=data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  const top=Math.max(...data),ti=data.lastIndexOf(top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Correct answers per minute over your last ${data.length} drills">`;
  s+=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  [0,.5,1].forEach(f=>{const y=pt+f*(H-pt-pb);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="${f===1?'0':'3 6'}"/>`});
  if(data.length>1){
    s+=`<polygon fill="url(#g)" points="${X(0)},${H-pb} ${pts.join(' ')} ${X(data.length-1)},${H-pb}"/>`;
    s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>`;
  }
  data.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===ti?7:4.5}" fill="${i===ti?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="3"><title>${v.toFixed(1)} per minute</title></circle>`});
  s+=`</svg>`;
  return s;
}
function renderScores(){
  const el=$('scoresBody');
  if(!history.length){
    el.innerHTML=`<div class="panel empty">No drills yet.<br>Finish one and your scores will show up here.<div class="cta" style="justify-content:center"><button class="btn" id="firstBtn">Start a drill</button></div></div>`;
    $('firstBtn').onclick=()=>{renderHome();show('home')};
    return;
  }
  let c=0,w=0;const ops={};
  history.forEach(h=>{c+=h.correct;w+=h.wrong;for(const o in h.perOp||{}){ops[o]=ops[o]||[0,0];ops[o][0]+=h.perOp[o][0];ops[o][1]+=h.perOp[o][1]}});
  const ds=dayStreak();
  let s=`<div class="tiles">
    <div class="tile"><p class="label">Drills</p><div class="v">${history.length}</div></div>
    <div class="tile"><p class="label">Solved</p><div class="v">${c.toLocaleString()}</div></div>
    <div class="tile"><p class="label">Accuracy</p><div class="v">${c+w?Math.round(c/(c+w)*100)+'<small>%</small>':'—'}</div></div>
    <div class="tile"><p class="label">Day streak</p><div class="v">${ds}<small>${ds===1?'day':'days'}</small></div></div></div>`;
  s+=`<div class="panel"><p class="label">Speed — correct per minute, last ${Math.min(20,history.length)} drill${history.length>1?'s':''}</p>${chart()}</div>`;
  s+=`<div class="panel"><p class="label">Personal bests</p><div class="scroll"><table><thead><tr><th>Difficulty</th>${DURS.map(d=>`<th>${durLabel(d)}</th>`).join('')}</tr></thead><tbody>`;
  for(const d in DIFFS)s+=`<tr><td>${DIFFS[d]}</td>${DURS.map(u=>{const b=bestFor(d,u);return b?`<td class="n">${b}</td>`:`<td class="dim">–</td>`}).join('')}</tr>`;
  s+=`</tbody></table></div></div>`;
  const opRows=OPS.filter(o=>ops[o]&&ops[o][1]);
  if(opRows.length)s+=`<div class="panel"><p class="label">Accuracy by operation</p>${opRows.map(o=>{const p=Math.round(ops[o][0]/ops[o][1]*100);return `<div class="opbar"><span>${o}</span><i><b style="width:${p}%"></b></i><span>${p}%</span></div>`}).join('')}</div>`;
  s+=`<div class="panel"><p class="label">Recent drills</p><div class="scroll"><table><thead><tr><th>When</th><th>Setting</th><th>Accuracy</th><th>Score</th></tr></thead><tbody>`;
  history.slice(-12).reverse().forEach(h=>{
    const t=h.correct+h.wrong;
    s+=`<tr><td>${new Date(h.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${DIFFS[h.diff]||h.diff} · ${durLabel(h.dur)} · ${esc(h.ops.split('').join(' '))}</td><td>${t?Math.round(h.correct/t*100)+'%':'—'}</td><td class="n">${h.correct}</td></tr>`;
  });
  s+=`</tbody></table></div></div><div style="text-align:center"><button class="danger" id="clearBtn">Clear all scores</button></div>`;
  el.innerHTML=s;
  const cb=$('clearBtn');let armT;
  cb.onclick=()=>{
    if(cb.classList.contains('arm')){history=[];store.set('mpd.history',history);renderScores();return}
    cb.classList.add('arm');cb.textContent='Click again to erase everything';
    armT=setTimeout(()=>{cb.classList.remove('arm');cb.textContent='Clear all scores'},4000);
  };
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(view==='quiz'){
    if(/^\d$/.test(e.key)||e.key==='Backspace'||e.key==='Enter'){e.preventDefault();key(e.key)}
    else if(e.key==='Escape')quit();
    return;
  }
  if(view==='count'){if(e.key==='Escape')quit();return}
  const t=e.target,plain=!t.closest||!t.closest('nav,.ghost,.danger');
  if(e.key==='Enter'&&(view==='home'||view==='results')&&plain){e.preventDefault();startCountdown()}
  else if(e.key==='Escape'&&view!=='home'){renderHome();show('home')}
});

applyTheme();applySound();renderHome();show('home');
})();
</script>
