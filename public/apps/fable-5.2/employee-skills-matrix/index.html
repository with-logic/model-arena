<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Skills Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#FAF8F3; --hover:#F5F1E8;
  --ink:#1E2330; --muted:#6A7082; --faint:#A3A7B3; --line:#E8E2D6; --line2:#D9D2C3;
  --accent:#4A43B0; --accent-soft:#ECEBFA; --accent-ink:#FFFFFF;
  --ok:#23806A; --ok-soft:#DFF1EB; --risk:#B67509; --risk-soft:#FBEFD3; --gap:#C8452F; --gap-soft:#FBE3DD;
  --l1:#E1F1EB; --l1t:#2C6B5B; --l2:#B2DDCE; --l2t:#184E41; --l3:#5CB59C; --l3t:#072E25; --l4:#176B58; --l4t:#FFFFFF;
  --shadow:0 1px 2px rgba(40,34,20,.05),0 8px 24px -12px rgba(40,34,20,.14);
  --shadow-lg:0 20px 60px -15px rgba(25,22,40,.35);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#12141A; --surface:#1B1E26; --surface2:#20242E; --hover:#262B37;
  --ink:#EDEAE3; --muted:#9BA0B0; --faint:#6B7080; --line:#2C313D; --line2:#3A4050;
  --accent:#A29CF5; --accent-soft:#2A2850; --accent-ink:#14122E;
  --ok:#5FD0B2; --ok-soft:#173A33; --risk:#F0B44C; --risk-soft:#3D3016; --gap:#F28470; --gap-soft:#45211B;
  --l1:#1D3833; --l1t:#8FCDBB; --l2:#28594D; --l2t:#C9EEE3; --l3:#3A9981; --l3t:#04201A; --l4:#84E3C8; --l4t:#04201A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px -15px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:16px;padding:18px 28px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:3px;place-content:center;flex:none}
.logo i{border-radius:2px;background:var(--accent-ink)}
.logo i:nth-child(1),.logo i:nth-child(6),.logo i:nth-child(8){opacity:.35}
.logo i:nth-child(3),.logo i:nth-child(4){opacity:.65}
.brand h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--gap);border-color:var(--gap-soft);background:var(--gap-soft)}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:14px 28px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.1;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meter{height:5px;border-radius:9px;background:var(--line);margin-top:9px;overflow:hidden}
.kpi .meter i{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .4s}
.kpi.t-gap .val{color:var(--gap)} .kpi.t-risk .val{color:var(--risk)} .kpi.t-ok .val{color:var(--ok)}

/* ---------- Layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px 28px 28px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;flex:1 1 190px;max-width:280px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search input{width:100%;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);padding:0 10px 0 31px;font-size:13px}
.field{height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);padding:0 9px;font-size:13px;font-weight:500;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);padding:2px;height:34px}
.seg button{padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tlabel{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-right:-4px}
.spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted)}
.toggle.on{background:var(--gap-soft);border-color:transparent;color:var(--gap)}
.toggle i{width:8px;height:8px;border-radius:50%;background:currentColor}

/* ---------- Matrix ---------- */
.mx-wrap{overflow:auto;max-height:calc(100vh - 150px);min-height:300px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
table.mx{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}
.mx th,.mx td{background:var(--surface);padding:0;font-weight:400;text-align:left;transition:background .08s}
.mx thead th{position:sticky;z-index:3}
.mx thead tr.grp th{top:0;height:30px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
.mx thead tr.grp th.g + th.g{border-left:1px solid var(--line)}
.mx thead tr.heads th{top:30px;border-bottom:1px solid var(--line2);vertical-align:bottom;padding:8px 2px 8px;text-align:center}
.mx th.corner{left:0;top:0!important;z-index:6!important;border-bottom:1px solid var(--line2)!important;border-right:1px solid var(--line);padding:0 14px 10px!important;vertical-align:bottom!important;text-align:left!important;text-transform:none!important;letter-spacing:0!important}
.corner .axis{font-size:12px;color:var(--muted);font-weight:500;line-height:1.5}
.corner .axis b{color:var(--ink);font-weight:600}
.corner .swap{margin-top:7px;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--accent);padding:4px 9px;border-radius:7px;background:var(--accent-soft)}
.corner .swap svg{width:13px;height:13px}
.mx th.sumh{right:0;top:0!important;z-index:6!important;border-left:1px solid var(--line);border-bottom:1px solid var(--line2)!important;padding:0 14px 10px!important;vertical-align:bottom!important;text-align:left!important;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx th.rowh{position:sticky;left:0;z-index:2;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:230px;max-width:260px}
.mx td.c{padding:3px;border-bottom:1px solid var(--line)}
.mx td.sum{position:sticky;right:0;z-index:2;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 14px;min-width:150px}
.mx tbody tr:hover > th.rowh,.mx tbody tr:hover > td{background:var(--hover)}
.mx tr.rg th{position:static;background:var(--surface2);border-bottom:1px solid var(--line);height:28px;padding:0}
.mx tr.rg span{position:sticky;left:14px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx tr.rg span em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint);margin-left:6px}
.mx tfoot td,.mx tfoot th{position:sticky;bottom:0;z-index:3;background:var(--surface2);border-top:1px solid var(--line2);height:44px;text-align:center;padding:0 2px}
.mx tfoot th{left:0;z-index:6;text-align:left;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line)}
.mx tfoot td.fc{right:0;z-index:6;border-left:1px solid var(--line)}

.cell{display:grid;place-items:center;width:100%;min-width:42px;height:38px;border-radius:8px;font-weight:700;font-size:13.5px;position:relative;font-variant-numeric:tabular-nums;transition:transform .08s,box-shadow .12s,opacity .2s}
.cell:hover{transform:scale(1.06);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--line2);z-index:1}
.cell:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);z-index:1}
.cell.l0{color:var(--faint)} .cell.l0::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line2)}
.l1{background:var(--l1);color:var(--l1t)} .l2{background:var(--l2);color:var(--l2t)}
.l3{background:var(--l3);color:var(--l3t)} .l4{background:var(--l4);color:var(--l4t)}
.cell.goal::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.cell.dim{opacity:.16}
.cell.pop{animation:pop .25s}
@keyframes pop{40%{transform:scale(1.18)}}

.rh{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px 7px 14px;text-align:left;min-height:44px}
.rh .tx{min-width:0;flex:1}
.rh .nm{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .sb{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh:hover .nm{color:var(--accent)}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}
.sdot.risk{background:var(--risk)} .sdot.gap{background:var(--gap)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:54px;height:54px;font-size:18px}
.av.sm{width:24px;height:24px;font-size:9.5px}
.ch{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;padding:0 2px}
.ch .n{font-size:11.5px;font-weight:600;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch:hover .n{color:var(--accent)}
.ch.v{gap:7px}
.ch.v .n{writing-mode:vertical-rl;transform:rotate(180deg);max-width:none;max-height:150px;font-size:12.5px;text-align:left}

.cov{display:flex;align-items:center;gap:9px}
.cov .num{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:30px}
.cov .num span{color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.risk{background:var(--risk-soft);color:var(--risk)} .pill.gap{background:var(--gap-soft);color:var(--gap)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;width:54px;flex:none}
.bar i{display:block;height:100%;background:var(--l3);border-radius:9px}
.fchip{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--ok-soft);color:var(--ok)}
.fchip.risk{background:var(--risk-soft);color:var(--risk)} .fchip.gap{background:var(--gap-soft);color:var(--gap)}
.fchip.plain{background:transparent;color:var(--ink)}

.legend{display:flex;gap:16px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend .lv{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:22px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
.legend .sw.l0{border:1px dashed var(--line2);color:var(--faint)}
.legend .gd{width:8px;height:8px;border-radius:50%;background:var(--accent)}
kbd{font-family:inherit;font-size:11px;font-weight:600;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2);color:var(--ink)}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:500;margin-bottom:4px}

/* ---------- Insights ---------- */
.side{display:flex;flex-direction:column;gap:16px}
.panel{padding:16px 16px 14px}
.panel h2{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0 0 2px;letter-spacing:-.005em}
.panel .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:104px;height:104px;flex:none}
.donut text{font-family:var(--display);font-weight:500;fill:var(--ink)}
.dl{display:grid;gap:7px;flex:1;font-size:13px}
.dl div{display:flex;align-items:center;gap:8px}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dist{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:14px;background:var(--line)}
.dist i{display:block;height:100%}
.dist .d0{background:var(--line2)}
.distl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:0 -8px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;width:calc(100%);text-align:left}
button.item:hover{background:var(--hover)}
.item .tx{min-width:0;flex:1}
.item .nm{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sb{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;align-items:center}
.pair .av + .av{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.none{font-size:13px;color:var(--muted);padding:6px 0}

/* ---------- Popover ---------- */
#pop{position:fixed;z-index:60;width:228px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px;display:none}
#pop.open{display:block;animation:rise .14s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
#pop .pt{font-size:12px;color:var(--muted);padding:2px 4px 8px;line-height:1.35}
#pop .pt b{color:var(--ink);display:block;font-size:13.5px}
.lvbtn{display:flex;align-items:center;gap:10px;width:100%;padding:5px;border-radius:9px;font-size:13px;font-weight:600;text-align:left}
.lvbtn:hover{background:var(--hover)}
.lvbtn .sw{width:28px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.lvbtn .sw.l0{border:1px dashed var(--line2);color:var(--faint)}
.lvbtn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.2}
.lvbtn.on{background:var(--accent-soft)}
.lvbtn.on::after{content:"✓";margin-left:auto;margin-right:6px;color:var(--accent);font-weight:700}
#pop hr{border:0;border-top:1px solid var(--line);margin:7px 0}
.goalbtn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;border-radius:9px;font-size:13px;font-weight:600}
.goalbtn:hover{background:var(--hover)}
.goalbtn i{width:28px;height:16px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.goalbtn i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.goalbtn.on i{background:var(--accent)} .goalbtn.on i::after{left:14px}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(20,18,30,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);z-index:50;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
.dh{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dh .tx{flex:1;min-width:0}
.inl{display:block;width:100%;border:1px solid transparent;border-radius:7px;background:transparent;padding:2px 6px;margin-left:-6px}
.inl:hover{border-color:var(--line2)} .inl:focus{border-color:var(--accent);outline:none;background:var(--surface2)}
.inl.title{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.inl.subt{font-size:13px;color:var(--muted)}
.dh .row{display:flex;gap:4px}
.db{flex:1;overflow:auto;padding:16px 22px 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.stat b{display:block;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.15}
.stat span{font-size:11.5px;color:var(--muted)}
.dsec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.dsec::after{content:"";flex:1;height:1px;background:var(--line)}
.drow{display:flex;align-items:center;gap:10px;padding:5px 0}
.drow .lnk{flex:1;min-width:0;text-align:left;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.drow .lnk:hover{color:var(--accent)}
.drow .lnk small{font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.pick{display:inline-flex;gap:3px;flex:none}
.pick button{width:27px;height:25px;border-radius:6px;font-size:12px;font-weight:700;color:var(--faint);background:var(--surface2);border:1px solid var(--line)}
.pick button:hover{border-color:var(--line2);color:var(--ink)}
.pick button.on{border-color:transparent}
.pick button.on.l0{background:var(--line2);color:var(--ink)}
.star{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;color:var(--line2);flex:none}
.star:hover{background:var(--hover);color:var(--muted)}
.star.on{color:var(--accent)}
.star svg{width:15px;height:15px}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:6px}
.stepper .tx{flex:1;font-size:13px}
.stepper .tx b{display:block}
.stepper .tx span{color:var(--muted);font-size:12px}
.stepper .ctl{display:flex;align-items:center;gap:4px}
.stepper .ctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:15px}
.stepper .ctl b{min-width:26px;text-align:center;font-family:var(--display);font-size:19px;font-weight:500}
.hbar{display:grid;grid-template-columns:92px 1fr 22px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar .t{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px;min-width:0;transition:width .3s}
.hbar .t i.l0{background:var(--line2)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.df{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.df span{font-size:12px;color:var(--muted)}

/* ---------- Dialog + toast ---------- */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,18,30,.45)}
dialog form{padding:22px}
dialog h3{font-family:var(--display);font-size:21px;font-weight:600;margin:0 0 4px}
dialog p{margin:0 0 16px;color:var(--muted);font-size:13px}
dialog label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
dialog input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);padding:0 11px}
dialog input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-weight:500;font-size:13.5px;z-index:80;box-shadow:var(--shadow-lg);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px)}
#toast.open{transform:translate(-50%,0)}
#toast button{font-weight:700;padding:4px 10px;border-radius:7px;background:rgba(128,128,128,.28);color:inherit}

@media (max-width:1180px){.main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){
  .top,.kpis,.main{padding-left:14px;padding-right:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:26px}
  .mx th.rowh{min-width:150px;max-width:170px}
  .mx td.sum,.mx th.sumh,.mx tfoot td.fc{position:static}
  .rh .av{display:none}
  .mx-wrap{max-height:76vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  .actions,.toolbar,.side,#drawer,#scrim,#pop,#toast,.swap,.kbdh{display:none!important}
  .main{display:block;padding:10px}.mx-wrap{max-height:none;overflow:visible}
  .card,.kpi{box-shadow:none}
  .mx th,.mx td{position:static!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>Employee Skills Matrix</h1>
      <p>See who can do what, where coverage is thin, and who is ready to grow.</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="undoBtn" data-act="undo" title="Undo (Ctrl/⌘ Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
    <button class="btn" data-act="export" title="Download the matrix as CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Export CSV</button>
    <button class="btn" data-act="add-skill">+ Skill</button>
    <button class="btn primary" data-act="add-emp">+ Employee</button>
    <button class="btn icon" data-act="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Team summary"></section>

<div class="main">
  <section class="card" aria-label="Skills matrix">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search people or skills…" aria-label="Search people or skills">
      </div>
      <select class="field" id="fDept" aria-label="Filter by department"></select>
      <select class="field" id="fCat" aria-label="Filter by skill category"></select>
      <select class="field" id="fSort" aria-label="Sort">
        <option value="group">Grouped</option><option value="name">Sort A–Z</option><option value="score">Sort by need</option>
      </select>
      <button class="toggle" id="gapsBtn" data-act="gaps" aria-pressed="false"><i></i>Gaps only</button>
      <span class="spacer"></span>
      <span class="tlabel">Highlight</span>
      <div class="seg" id="minSeg" role="group" aria-label="Highlight minimum level">
        <button data-act="min" data-v="0">All</button><button data-act="min" data-v="2">2+</button><button data-act="min" data-v="3">3+</button><button data-act="min" data-v="4">Experts</button>
      </div>
    </div>
    <div class="mx-wrap" id="mxWrap"></div>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="side" id="side" aria-label="Insights"></aside>
</div>

<div id="pop" role="dialog" aria-label="Set proficiency"></div>
<div id="scrim" data-act="close-drawer"></div>
<aside id="drawer" aria-label="Details"></aside>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<style id="colhl"></style>

<script>
(function(){
'use strict';

/* ================= Data ================= */
const LEVELS=[
  {n:'No experience',d:'Not yet exposed'},
  {n:'Novice',d:'Learning, needs guidance'},
  {n:'Developing',d:'Works with some support'},
  {n:'Proficient',d:'Fully independent'},
  {n:'Expert',d:'Can teach and lead others'}
];
const PROF=3; // level that counts toward coverage
const STORE='employee-skills-matrix-v1';
const AV=['#4A43B0','#B5533C','#23806A','#A9670A','#3B6EA8','#8A3F8F','#5A6B2F','#A63D5F','#2F7C8C','#6B5A45'];

function seed(){
  const SK=[
    ['JavaScript / TypeScript','Technical',3],['Python','Technical',2],['Cloud Infrastructure','Technical',2],['API Design','Technical',2],
    ['UX Research','Design',2],['UI Design','Design',2],['Prototyping','Design',2],['Accessibility','Design',2],
    ['SQL','Data & Analytics',3],['Data Visualization','Data & Analytics',2],['Machine Learning','Data & Analytics',2],
    ['People Management','Leadership',2],['Project Management','Leadership',3],['Mentoring & Coaching','Leadership',3],['Stakeholder Management','Leadership',3],
    ['Public Speaking','Communication',2],['Technical Writing','Communication',2],
    ['Security Practices','Risk & Compliance',2],['Data Privacy (GDPR)','Risk & Compliance',2]
  ];
  const EM=[
    ['Amara Okafor','Engineering Manager','Engineering','3223000121044433222'],
    ['Liam Chen','Senior Frontend Engineer','Engineering','4113122311012312211'],
    ['Sofia Rossi','Backend Engineer','Engineering','2424000031102111321'],
    ['Dev Patel','DevOps Engineer','Engineering','1342000021002111231'],
    ['Noah Williams','Junior Developer','Engineering','2101011110000001100'],
    ['Mei Tanaka','Lead Product Designer','Design','1000344202022333101'],
    ['Jonas Berg','UX Researcher','Design','0000423212001122202'],
    ['Priya Nair','Product Manager','Product','0101212022013133201'],
    ['Carlos Mendes','Senior Product Manager','Product','0002211023034344212'],
    ['Grace Kim','Technical Writer','Product','1001111201002122401'],
    ['Hannah Schmidt','Data Scientist','Data','1411000043401212212'],
    ['Omar Haddad','Data Analyst','Data','0200001034101011101']
  ];
  const skills=SK.map((s,i)=>({id:'s'+i,name:s[0],cat:s[1],target:s[2]}));
  const employees=EM.map((e,i)=>({id:'e'+i,name:e[0],role:e[1],dept:e[2]}));
  const ratings={};
  EM.forEach((e,i)=>[...e[3]].forEach((c,j)=>{if(+c)ratings['e'+i+'|s'+j]=+c}));
  const goals={};
  [[4,0],[4,3],[4,2],[2,2],[2,17],[7,8],[11,10],[9,4],[6,18],[0,18],[5,7],[3,1]].forEach(g=>goals['e'+g[0]+'|s'+g[1]]=true);
  return {employees,skills,ratings,goals};
}

let data, ui={orient:'skills',dept:'',cat:'',q:'',sort:'group',gaps:false,min:0,theme:'light',drawer:null};
let history=[];
try{
  const raw=JSON.parse(localStorage.getItem(STORE)||'null');
  if(raw&&raw.data&&Array.isArray(raw.data.employees)){data=raw.data;Object.assign(ui,raw.ui||{},{drawer:null,q:''});}
}catch(e){}
if(!data)data=seed();
data.goals=data.goals||{};

function save(){try{localStorage.setItem(STORE,JSON.stringify({data,ui:{orient:ui.orient,sort:ui.sort,theme:ui.theme}}))}catch(e){}}

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=(e,s)=>e+'|'+s;
const lvl=(e,s)=>data.ratings[K(e,s)]||0;
const emp=id=>data.employees.find(x=>x.id===id);
const skill=id=>data.skills.find(x=>x.id===id);
const uid=p=>p+Math.random().toString(36).slice(2,9);
const uniq=a=>[...new Set(a)];
const depts=()=>uniq(data.employees.map(e=>e.dept));
const cats=()=>uniq(data.skills.map(s=>s.cat));
const first=n=>n.trim().split(/\s+/)[0];
const initials=n=>{const p=n.trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return AV[h%AV.length]};
const avatar=(e,cls)=>`<span class="av ${cls||''}" style="background:${hue(e.name)}" aria-hidden="true">${esc(initials(e.name))}</span>`;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const STL={ok:'Covered',risk:'At risk',gap:'Gap'};

function sStat(s){
  const c=[0,0,0,0,0];let sum=0;
  data.employees.forEach(e=>{const v=lvl(e.id,s.id);c[v]++;sum+=v});
  const prof=c[3]+c[4];
  const status=prof>=s.target?'ok':prof===0?'gap':'risk';
  return {c,prof,status,short:Math.max(0,s.target-prof),avg:data.employees.length?sum/data.employees.length:0,spof:prof===1};
}
function eStat(e){
  let sum=0,prof=0,exp=0,goals=0;
  data.skills.forEach(s=>{const v=lvl(e.id,s.id);sum+=v;if(v>=PROF)prof++;if(v===4)exp++;if(data.goals[K(e.id,s.id)])goals++});
  return {avg:data.skills.length?sum/data.skills.length:0,prof,exp,goals};
}

/* ================= Mutations ================= */
function mutate(fn,msg){
  history.push(JSON.stringify(data)); if(history.length>60)history.shift();
  fn(); save(); render();
  if(msg)toast(msg,true);
}
function undo(){
  if(!history.length)return;
  data=JSON.parse(history.pop());
  if(ui.drawer&&!(ui.drawer.type==='emp'?emp(ui.drawer.id):skill(ui.drawer.id)))ui.drawer=null;
  closePop(); save(); render(); toast('Change undone');
}
let focusKey=null;
function setLevel(e,s,v){
  if(lvl(e,s)===v)return;
  mutate(()=>{if(v)data.ratings[K(e,s)]=v;else delete data.ratings[K(e,s)];if(v===4)delete data.goals[K(e,s)]});
  const b=cellEl(e,s); if(b)b.classList.add('pop');
}
function toggleGoal(e,s){mutate(()=>{const k=K(e,s);if(data.goals[k])delete data.goals[k];else data.goals[k]=true})}
const cellEl=(e,s)=>document.querySelector(`.cell[data-e="${e}"][data-s="${s}"]`);

/* ================= Filtering / axes ================= */
function visible(){
  let E=data.employees.slice(),S=data.skills.slice();
  if(ui.dept)E=E.filter(e=>e.dept===ui.dept);
  if(ui.cat)S=S.filter(s=>s.cat===ui.cat);
  if(ui.gaps)S=S.filter(s=>sStat(s).status!=='ok');
  const q=ui.q.trim().toLowerCase();
  if(q){
    const em=E.filter(e=>(e.name+' '+e.role+' '+e.dept).toLowerCase().includes(q));
    const sm=S.filter(s=>(s.name+' '+s.cat).toLowerCase().includes(q));
    if(!em.length&&!sm.length){E=[];S=[];}
    else{if(em.length)E=em;if(sm.length)S=sm;}
  }
  return {E,S};
}
function grouped(items,key,order){
  if(ui.sort==='name')return [{label:'',items:items.slice().sort((a,b)=>a.name.localeCompare(b.name))}];
  if(ui.sort==='score'){
    const sc=key==='cat'?x=>{const t=sStat(x);return -(t.short*10-t.prof)}:x=>eStat(x).avg;
    return [{label:'',items:items.slice().sort((a,b)=>sc(a)-sc(b))}];
  }
  return order.map(l=>({label:l,items:items.filter(i=>i[key]===l)})).filter(g=>g.items.length);
}

/* ================= Render: KPIs ================= */
function renderKPIs(){
  const st=data.skills.map(sStat), n=data.skills.length;
  const ok=st.filter(x=>x.status==='ok').length, gaps=n-ok, zero=st.filter(x=>x.status==='gap').length;
  const spof=st.filter(x=>x.spof).length;
  const pct=n?Math.round(ok/n*100):0;
  const goals=Object.keys(data.goals).length;
  $('#kpis').innerHTML=`
  <div class="kpi"><div class="lab">Team members</div><div class="val">${data.employees.length}</div><div class="sub">across ${plural(depts().length,'department')}</div></div>
  <div class="kpi"><div class="lab">Skills tracked</div><div class="val">${n}</div><div class="sub">in ${plural(cats().length,'category').replace('categorys','categories')}</div></div>
  <div class="kpi ${pct>=80?'t-ok':''}"><div class="lab">Skills coverage</div><div class="val">${pct}<small>%</small></div><div class="meter"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:7px">${ok} of ${n} skills meet their target</div></div>
  <div class="kpi ${gaps?'t-gap':'t-ok'}"><div class="lab">Coverage gaps</div><div class="val">${gaps}</div><div class="sub">${zero?plural(zero,'skill')+' with nobody proficient':gaps?'all have partial coverage':'every target is met'}</div></div>
  <div class="kpi ${spof?'t-risk':'t-ok'}"><div class="lab">Single points of failure</div><div class="val">${spof}</div><div class="sub">${spof?'skills held by one person':'no skill depends on one person'} · ${plural(goals,'growth goal')}</div></div>`;
}

/* ================= Render: Matrix ================= */
function head(type,x,vertical){
  if(type==='emp')return `<button class="ch" data-act="open-emp" data-id="${x.id}" title="${esc(x.name)} — ${esc(x.role)}">${avatar(x)}<span class="n">${esc(first(x.name))}</span></button>`;
  const t=sStat(x);
  return `<button class="ch v" data-act="open-skill" data-id="${x.id}" title="${esc(x.name)} — ${STL[t.status]}"><span class="n">${esc(x.name)}</span><span class="sdot ${t.status}"></span></button>`;
}
function rowHead(type,x){
  if(type==='emp')return `<button class="rh" data-act="open-emp" data-id="${x.id}">${avatar(x)}<span class="tx"><span class="nm">${esc(x.name)}</span><span class="sb">${esc(x.role)}</span></span></button>`;
  const t=sStat(x);
  return `<button class="rh" data-act="open-skill" data-id="${x.id}"><span class="sdot ${t.status}" title="${STL[t.status]}"></span><span class="tx"><span class="nm">${esc(x.name)}</span><span class="sb">Needs ${x.target} proficient${t.spof?' · single point of failure':''}</span></span></button>`;
}
function sumFull(type,x){
  if(type==='skill'){const t=sStat(x);return `<div class="cov"><span class="num">${t.prof}<span>/${x.target}</span></span><span class="pill ${t.status}">${STL[t.status]}</span></div>`}
  const t=eStat(x);return `<div class="cov"><span class="num">${t.avg.toFixed(1)}</span><span class="bar"><i style="width:${t.avg/4*100}%"></i></span><span class="rhs" style="font-size:12px;color:var(--muted);white-space:nowrap">${t.prof} at 3+</span></div>`;
}
function sumMini(type,x){
  if(type==='skill'){const t=sStat(x);return `<span class="fchip ${t.status}" title="${t.prof} of ${x.target} needed — ${STL[t.status]}">${t.prof}/${x.target}</span>`}
  const t=eStat(x);return `<span class="fchip plain" title="Average level ${t.avg.toFixed(2)} · ${t.prof} skills at Proficient or above">${t.avg.toFixed(1)}</span>`;
}
const SWAP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14m0 0-3-3m3 3 3-3M17 20V6m0 0-3 3m3-3 3 3"/></svg>';

function renderMatrix(){
  const {E,S}=visible();
  const wrap=$('#mxWrap');
  if(!E.length||!S.length){
    wrap.innerHTML=`<div class="empty"><b>${data.employees.length&&data.skills.length?'Nothing matches these filters':'Your matrix is empty'}</b>${data.employees.length&&data.skills.length?'Try clearing the search or switching off “Gaps only”.':'Add employees and skills to start mapping your team.'}<div style="margin-top:14px"><button class="btn" data-act="clear">Clear filters</button></div></div>`;
    return;
  }
  const sk=ui.orient==='skills';
  const eg=grouped(E,'dept',depts()), sg=grouped(S,'cat',cats());
  const rows=sk?sg:eg, cols=sk?eg:sg, rt=sk?'skill':'emp', ct=sk?'emp':'skill';
  const flat=cols.flatMap(g=>g.items), ncol=flat.length;
  const hasG=cols.some(g=>g.label);
  let h='<table class="mx"><thead><tr class="grp">';
  h+=`<th class="corner" rowspan="2"><div class="axis"><b>${sk?'Skills':'People'}</b> in rows · <b>${sk?'people':'skills'}</b> in columns</div><button class="swap" data-act="orient" title="Swap rows and columns">${SWAP}Swap axes</button></th>`;
  cols.forEach(g=>{h+=`<th class="g" colspan="${g.items.length}">${hasG?esc(g.label):''}</th>`});
  h+=`<th class="sumh" rowspan="2">${sk?'Coverage<br>vs. target':'Average<br>level'}</th></tr><tr class="heads">`;
  flat.forEach(x=>{h+=`<th data-c="${x.id}">${head(ct,x)}</th>`});
  h+='</tr></thead><tbody>';
  let r=0;
  rows.forEach(g=>{
    if(g.label)h+=`<tr class="rg"><th colspan="${ncol+2}"><span>${esc(g.label)}<em>${plural(g.items.length,rt==='skill'?'skill':'person').replace('persons','people')}</em></span></th></tr>`;
    g.items.forEach(x=>{
      h+=`<tr><th class="rowh" scope="row">${rowHead(rt,x)}</th>`;
      flat.forEach((y,ci)=>{
        const e=sk?y:x, s=sk?x:y, v=lvl(e.id,s.id), goal=data.goals[K(e.id,s.id)];
        h+=`<td class="c" data-c="${y.id}"><button class="cell l${v}${goal?' goal':''}${v<ui.min?' dim':''}" data-e="${e.id}" data-s="${s.id}" data-r="${r}" data-ci="${ci}" tabindex="${r===0&&ci===0?0:-1}" aria-label="${esc(e.name)}, ${esc(s.name)}: level ${v}, ${LEVELS[v].n}${goal?', growth goal':''}">${v||''}</button></td>`;
      });
      h+=`<td class="sum">${sumFull(rt,x)}</td></tr>`; r++;
    });
  });
  h+=`</tbody><tfoot><tr><th>${sk?'Average level':'Coverage vs. target'}</th>`;
  flat.forEach(x=>{h+=`<td data-c="${x.id}">${sumMini(ct,x)}</td>`});
  h+='<td class="fc"></td></tr></tfoot></table>';
  wrap.innerHTML=h;
  if(focusKey){const b=cellEl(...focusKey.split('|'));if(b){document.querySelectorAll('.cell[tabindex="0"]').forEach(c=>c.tabIndex=-1);b.tabIndex=0;b.focus({preventScroll:true})}focusKey=null}
}

function renderLegend(){
  $('#legend').innerHTML=LEVELS.map((l,i)=>`<span class="lv"><span class="sw l${i}">${i||'·'}</span>${l.n}</span>`).join('')+
  `<span class="lv"><span class="gd"></span>Growth goal</span><span class="spacer"></span><span class="kbdh">Click a cell, or focus it and press <kbd>0</kbd>–<kbd>4</kbd> · <kbd>G</kbd> goal · arrows to move</span>`;
}

/* ================= Render: Insights ================= */
function mentorFor(eId,sId){
  const me=emp(eId);let best=null,bs=-1;
  data.employees.forEach(o=>{if(o.id===eId)return;const v=lvl(o.id,sId);if(v<PROF)return;const sc=v*2+(o.dept===me.dept?1:0);if(sc>bs){bs=sc;best=o}});
  return best;
}
function renderSide(){
  const st=data.skills.map(s=>({s,t:sStat(s)}));
  const n=st.length, ok=st.filter(x=>x.t.status==='ok').length, risk=st.filter(x=>x.t.status==='risk').length, gap=n-ok-risk;
  const C=2*Math.PI*40; let off=0;
  const arc=(v,col)=>{if(!v)return'';const len=v/n*C;const o=`<circle cx="52" cy="52" r="40" fill="none" stroke="${col}" stroke-width="13" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 52 52)"/>`;off+=len;return o};
  const dist=[0,0,0,0,0];data.employees.forEach(e=>data.skills.forEach(s=>dist[lvl(e.id,s.id)]++));
  const tot=dist.reduce((a,b)=>a+b,0)||1;
  const need=st.filter(x=>x.t.status!=='ok').sort((a,b)=>(b.t.short-a.t.short)||(a.t.prof-b.t.prof)).slice(0,6);
  const pairs=Object.keys(data.goals).map(k=>{const [e,s]=k.split('|');return {e:emp(e),s:skill(s)}}).filter(p=>p.e&&p.s)
    .map(p=>({...p,m:mentorFor(p.e.id,p.s.id)})).sort((a,b)=>(b.m?1:0)-(a.m?1:0)).slice(0,6);
  $('#side').innerHTML=`
  <div class="card panel">
    <h2>Coverage health</h2><p class="hint">A skill is covered when enough people are Proficient (3) or Expert (4).</p>
    <div class="donut">
      <svg viewBox="0 0 104 104" role="img" aria-label="${ok} covered, ${risk} at risk, ${gap} gaps">
        <circle cx="52" cy="52" r="40" fill="none" stroke="var(--line)" stroke-width="13"/>
        ${arc(ok,'var(--ok)')}${arc(risk,'var(--risk)')}${arc(gap,'var(--gap)')}
        <text x="52" y="59" text-anchor="middle" font-size="22">${n?Math.round(ok/n*100):0}%</text>
      </svg>
      <div class="dl">
        <div><span class="sdot"></span>Covered<b>${ok}</b></div>
        <div><span class="sdot risk"></span>At risk<b>${risk}</b></div>
        <div><span class="sdot gap"></span>Gap<b>${gap}</b></div>
      </div>
    </div>
    <div class="dist" title="Share of all ratings by level">${dist.map((d,i)=>`<i class="${i?'l'+i:'d0'}" style="width:${d/tot*100}%" title="${LEVELS[i].n}: ${d}"></i>`).join('')}</div>
    <div class="distl"><span>${Math.round(dist[0]/tot*100)}% no experience</span><span>${Math.round((dist[3]+dist[4])/tot*100)}% proficient or expert</span></div>
  </div>
  <div class="card panel">
    <h2>Where to hire or train</h2><p class="hint">Skills furthest below their staffing target.</p>
    <div class="list">${need.length?need.map(({s,t})=>`<button class="item" data-act="open-skill" data-id="${s.id}">
      <span class="fchip ${t.status}">${t.prof}/${s.target}</span>
      <span class="tx"><span class="nm">${esc(s.name)}</span><span class="sb">${t.prof===0?'Nobody proficient yet':t.spof?'Only one person — single point of failure':'Needs '+t.short+' more'} · ${esc(s.cat)}</span></span></button>`).join(''):'<div class="none" style="padding-left:8px">Every skill meets its target. 🎉</div>'}</div>
  </div>
  <div class="card panel">
    <h2>Mentoring matches</h2><p class="hint">Growth goals paired with the strongest internal mentor.</p>
    <div class="list">${pairs.length?pairs.map(p=>`<button class="item" data-act="open-emp" data-id="${p.e.id}">
      <span class="pair">${avatar(p.e)}${p.m?avatar(p.m):''}</span>
      <span class="tx"><span class="nm">${esc(first(p.e.name))} ${p.m?'← '+esc(first(p.m.name)):'· no mentor yet'}</span><span class="sb">${esc(p.s.name)}${p.m?' · level '+lvl(p.e.id,p.s.id)+' → mentor at '+lvl(p.m.id,p.s.id):' · consider external training'}</span></span></button>`).join(''):'<div class="none" style="padding-left:8px">No growth goals yet. Mark one from any cell.</div>'}</div>
  </div>`;
}

/* ================= Render: Drawer ================= */
const STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>';
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
function picker(e,s){
  const v=lvl(e,s),g=data.goals[K(e,s)];
  return `<span class="pick" role="group" aria-label="Proficiency">${[0,1,2,3,4].map(i=>`<button class="${i===v?'on l'+i:''}" data-act="set" data-e="${e}" data-s="${s}" data-v="${i}" title="${LEVELS[i].n}" aria-pressed="${i===v}">${i}</button>`).join('')}</span>
  <button class="star ${g?'on':''}" data-act="goal" data-e="${e}" data-s="${s}" title="${g?'Remove growth goal':'Mark as growth goal'}" aria-pressed="${!!g}" aria-label="Growth goal">${STAR}</button>`;
}
function renderDrawer(){
  const d=$('#drawer'), sc=$('#scrim');
  const obj=ui.drawer&&(ui.drawer.type==='emp'?emp(ui.drawer.id):skill(ui.drawer.id));
  if(!obj){ui.drawer=null;d.classList.remove('open');sc.classList.remove('open');return}
  const keep=d.querySelector('.db'); const top=keep&&d.dataset.id===obj.id?keep.scrollTop:0;
  let h='';
  if(ui.drawer.type==='emp'){
    const e=obj,t=eStat(e);
    h=`<div class="dh">${avatar(e,'lg')}<div class="tx">
        <input class="inl title" value="${esc(e.name)}" data-field="name" data-type="emp" data-id="${e.id}" aria-label="Name">
        <input class="inl subt" value="${esc(e.role)}" data-field="role" data-type="emp" data-id="${e.id}" aria-label="Role" placeholder="Role">
        <input class="inl subt" value="${esc(e.dept)}" data-field="dept" data-type="emp" data-id="${e.id}" aria-label="Department" list="dlDept" placeholder="Department">
      </div><button class="btn icon ghost" data-act="close-drawer" aria-label="Close">${X}</button></div>
    <div class="db">
      <div class="stats">
        <div class="stat"><b>${t.avg.toFixed(1)}</b><span>Avg level</span></div>
        <div class="stat"><b>${t.prof}</b><span>Proficient+</span></div>
        <div class="stat"><b>${t.exp}</b><span>Expert</span></div>
        <div class="stat"><b>${t.goals}</b><span>Growth goals</span></div>
      </div>`;
    cats().forEach(c=>{
      h+=`<div class="dsec">${esc(c)}</div>`;
      data.skills.filter(s=>s.cat===c).forEach(s=>{h+=`<div class="drow"><button class="lnk" data-act="open-skill" data-id="${s.id}">${esc(s.name)}</button>${picker(e.id,s.id)}</div>`});
    });
    h+=`</div><div class="df"><span>★ marks a skill this person wants to grow</span><button class="btn danger" data-act="del-emp" data-id="${e.id}">Remove employee</button></div>`;
  }else{
    const s=obj,t=sStat(s),mx=Math.max(1,...t.c);
    const people=data.employees.slice().sort((a,b)=>lvl(b.id,s.id)-lvl(a.id,s.id)||a.name.localeCompare(b.name));
    h=`<div class="dh"><div class="tx">
        <span class="pill ${t.status}" style="margin-bottom:6px">${STL[t.status]}${t.spof?' · single point of failure':''}</span>
        <input class="inl title" value="${esc(s.name)}" data-field="name" data-type="skill" data-id="${s.id}" aria-label="Skill name">
        <input class="inl subt" value="${esc(s.cat)}" data-field="cat" data-type="skill" data-id="${s.id}" aria-label="Category" list="dlCat" placeholder="Category">
      </div><button class="btn icon ghost" data-act="close-drawer" aria-label="Close">${X}</button></div>
    <div class="db">
      <div class="stepper"><div class="tx"><b>Staffing target</b><span>People needed at Proficient or above · currently ${t.prof}</span></div>
        <div class="ctl"><button data-act="target" data-id="${s.id}" data-d="-1" aria-label="Decrease target">−</button><b>${s.target}</b><button data-act="target" data-id="${s.id}" data-d="1" aria-label="Increase target">+</button></div></div>
      <div class="dsec">Level distribution</div>
      ${[4,3,2,1,0].map(i=>`<div class="hbar"><span>${LEVELS[i].n}</span><span class="t"><i class="l${i}" style="width:${t.c[i]/mx*100}%"></i></span><b>${t.c[i]}</b></div>`).join('')}
      <div class="dsec">People</div>
      ${people.map(e=>`<div class="drow"><button class="lnk" data-act="open-emp" data-id="${e.id}">${avatar(e,'sm')}<span>${esc(e.name)}</span><small>${esc(e.dept)}</small></button>${picker(e.id,s.id)}</div>`).join('')||'<div class="none">No employees yet.</div>'}
    </div><div class="df"><span>Team average ${t.avg.toFixed(1)} / 4</span><button class="btn danger" data-act="del-skill" data-id="${s.id}">Delete skill</button></div>`;
  }
  h+=`<datalist id="dlDept">${depts().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dlCat">${cats().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  d.innerHTML=h; d.dataset.id=obj.id; d.classList.add('open'); sc.classList.add('open');
  const b=d.querySelector('.db'); if(b)b.scrollTop=top;
}

/* ================= Render: toolbar state ================= */
function renderToolbar(){
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`;
  if(ui.dept&&!depts().includes(ui.dept))ui.dept='';
  if(ui.cat&&!cats().includes(ui.cat))ui.cat='';
  $('#fDept').innerHTML=opt('','All departments',ui.dept)+depts().map(d=>opt(d,d,ui.dept)).join('');
  $('#fCat').innerHTML=opt('','All categories',ui.cat)+cats().map(c=>opt(c,c,ui.cat)).join('');
  $('#fSort').value=ui.sort;
  $('#gapsBtn').classList.toggle('on',ui.gaps); $('#gapsBtn').setAttribute('aria-pressed',ui.gaps);
  document.querySelectorAll('#minSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===ui.min));
  $('#undoBtn').disabled=!history.length;
  document.documentElement.dataset.theme=ui.theme;
}
function render(){renderToolbar();renderKPIs();renderMatrix();renderSide();renderDrawer()}

/* ================= Popover ================= */
let popCtx=null;
function openPop(btn){
  const e=btn.dataset.e,s=btn.dataset.s,v=lvl(e,s),g=data.goals[K(e,s)];
  popCtx={e,s};
  const p=$('#pop');
  p.innerHTML=`<div class="pt"><b>${esc(emp(e).name)}</b>${esc(skill(s).name)}</div>`+
    LEVELS.map((l,i)=>`<button class="lvbtn ${i===v?'on':''}" data-act="set" data-close="1" data-e="${e}" data-s="${s}" data-v="${i}"><span class="sw l${i}">${i||'·'}</span><span>${l.n}<small>${l.d}</small></span></button>`).join('')+
    `<hr><button class="goalbtn ${g?'on':''}" data-act="goal" data-close="1" data-e="${e}" data-s="${s}" aria-pressed="${!!g}"><i></i>Growth goal</button>`;
  p.classList.add('open');
  const r=btn.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  let x=r.left+r.width/2-pw/2, y=r.bottom+8;
  x=Math.max(8,Math.min(x,innerWidth-pw-8));
  if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-8);
  p.style.left=x+'px';p.style.top=y+'px';
  const cur=p.querySelector('.lvbtn.on'); if(cur)cur.focus({preventScroll:true});
}
function closePop(refocus){
  const p=$('#pop'); if(!p.classList.contains('open'))return;
  p.classList.remove('open');
  if(refocus&&popCtx){const b=cellEl(popCtx.e,popCtx.s);if(b)b.focus({preventScroll:true})}
  popCtx=null;
}

/* ================= Toast ================= */
let toastT;
function toast(msg,canUndo){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${canUndo?'<button data-act="undo">Undo</button>':''}`;
  t.classList.add('open'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('open'),canUndo?6000:2200);
}

/* ================= Dialog ================= */
function openDialog(type){
  const f=$('#dlgForm'); f.dataset.type=type;
  f.innerHTML=type==='emp'?`
    <h3>Add an employee</h3><p>They start with a blank profile — rate their skills right after.</p>
    <label for="dName">Full name</label><input id="dName" name="name" required maxlength="60" placeholder="e.g. Jordan Rivera" autocomplete="off">
    <div class="two"><div><label for="dRole">Role</label><input id="dRole" name="role" maxlength="60" placeholder="e.g. QA Engineer" autocomplete="off"></div>
    <div><label for="dDept">Department</label><input id="dDept" name="dept" maxlength="40" list="dlgList" placeholder="Choose or type" autocomplete="off" value="${esc(ui.dept)}"></div></div>
    <datalist id="dlgList">${depts().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <div class="foot"><button type="button" class="btn ghost" data-act="close-dlg">Cancel</button><button class="btn primary">Add employee</button></div>`:`
    <h3>Add a skill</h3><p>Set how many people you need at Proficient or above.</p>
    <label for="dName">Skill name</label><input id="dName" name="name" required maxlength="60" placeholder="e.g. Negotiation" autocomplete="off">
    <div class="two"><div><label for="dCat">Category</label><input id="dCat" name="cat" maxlength="40" list="dlgList" placeholder="Choose or type" autocomplete="off" value="${esc(ui.cat)}"></div>
    <div><label for="dTarget">Staffing target</label><input id="dTarget" name="target" type="number" min="1" max="99" value="2" required></div></div>
    <datalist id="dlgList">${cats().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <div class="foot"><button type="button" class="btn ghost" data-act="close-dlg">Cancel</button><button class="btn primary">Add skill</button></div>`;
  $('#dlg').showModal();
}
$('#dlgForm').addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target,fd=new FormData(f),name=(fd.get('name')||'').trim(); if(!name)return;
  if(f.dataset.type==='emp'){
    const id=uid('e');
    mutate(()=>data.employees.push({id,name,role:(fd.get('role')||'').trim()||'Team member',dept:(fd.get('dept')||'').trim()||'General'}),name+' added');
    ui.drawer={type:'emp',id};
  }else{
    const id=uid('s');
    mutate(()=>data.skills.push({id,name,cat:(fd.get('cat')||'').trim()||'General',target:Math.max(1,Math.min(99,parseInt(fd.get('target'),10)||1))}),name+' added');
    ui.drawer={type:'skill',id};
  }
  $('#dlg').close(); render();
});

/* ================= CSV ================= */
function exportCSV(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Employee','Role','Department',...data.skills.map(s=>s.name)].map(q).join(',')];
  data.employees.forEach(e=>rows.push([e.name,e.role,e.dept,...data.skills.map(s=>lvl(e.id,s.id))].map(q).join(',')));
  rows.push(['Proficient or above','','',...data.skills.map(s=>sStat(s).prof)].map(q).join(','));
  rows.push(['Target','','',...data.skills.map(s=>s.target)].map(q).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='skills-matrix.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Exported skills-matrix.csv');
}

/* ================= Events ================= */
document.addEventListener('click',ev=>{
  const cell=ev.target.closest('.cell');
  if(cell){ev.stopPropagation();if(popCtx&&popCtx.e===cell.dataset.e&&popCtx.s===cell.dataset.s){closePop(true);return}closePop();openPop(cell);return}
  const el=ev.target.closest('[data-act]');
  if(!el){if(!ev.target.closest('#pop'))closePop();return}
  const a=el.dataset.act,id=el.dataset.id;
  if(!el.closest('#pop'))closePop();
  switch(a){
    case 'set':{const {e,s}=el.dataset;if(el.dataset.close){closePop();focusKey=K(e,s);}setLevel(e,s,+el.dataset.v);if(focusKey){const b=cellEl(e,s);if(b)b.focus({preventScroll:true});focusKey=null}break}
    case 'goal':{const {e,s}=el.dataset;if(el.dataset.close){closePop();focusKey=K(e,s);}toggleGoal(e,s);break}
    case 'open-emp':ui.drawer={type:'emp',id};renderDrawer();break;
    case 'open-skill':ui.drawer={type:'skill',id};renderDrawer();break;
    case 'close-drawer':ui.drawer=null;renderDrawer();break;
    case 'del-emp':{const n=emp(id).name;ui.drawer=null;mutate(()=>{data.employees=data.employees.filter(e=>e.id!==id);for(const o of [data.ratings,data.goals])for(const k in o)if(k.startsWith(id+'|'))delete o[k]},n+' removed');break}
    case 'del-skill':{const n=skill(id).name;ui.drawer=null;mutate(()=>{data.skills=data.skills.filter(s=>s.id!==id);for(const o of [data.ratings,data.goals])for(const k in o)if(k.endsWith('|'+id))delete o[k]},n+' deleted');break}
    case 'target':{const s=skill(id),v=Math.max(1,Math.min(99,s.target+ +el.dataset.d));if(v!==s.target)mutate(()=>{s.target=v});break}
    case 'add-emp':openDialog('emp');break;
    case 'add-skill':openDialog('skill');break;
    case 'close-dlg':$('#dlg').close();break;
    case 'export':exportCSV();break;
    case 'undo':undo();break;
    case 'theme':ui.theme=ui.theme==='dark'?'light':'dark';save();renderToolbar();break;
    case 'orient':ui.orient=ui.orient==='skills'?'people':'skills';save();renderMatrix();$('#mxWrap').scrollTo(0,0);break;
    case 'gaps':ui.gaps=!ui.gaps;renderToolbar();renderMatrix();break;
    case 'min':ui.min=+el.dataset.v;renderToolbar();renderMatrix();break;
    case 'clear':ui.q='';ui.dept='';ui.cat='';ui.gaps=false;$('#q').value='';renderToolbar();renderMatrix();break;
  }
});
$('#dlg').addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()});

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.field){
    const o=t.dataset.type==='emp'?emp(t.dataset.id):skill(t.dataset.id),v=t.value.trim();
    if(!o)return; if(!v||v===o[t.dataset.field]){t.value=o[t.dataset.field];return}
    mutate(()=>{o[t.dataset.field]=v});
  }
  else if(t.id==='fDept'){ui.dept=t.value;renderMatrix()}
  else if(t.id==='fCat'){ui.cat=t.value;renderMatrix()}
  else if(t.id==='fSort'){ui.sort=t.value;save();renderMatrix()}
});
$('#q').addEventListener('input',ev=>{ui.q=ev.target.value;renderMatrix()});
$('#mxWrap').addEventListener('scroll',()=>closePop(),{passive:true});
addEventListener('resize',()=>closePop());

// column highlight
let hl='';
$('#mxWrap').addEventListener('mouseover',ev=>{
  const c=ev.target.closest('[data-c]'),id=c?c.dataset.c:'';
  if(id===hl)return; hl=id;
  $('#colhl').textContent=id?`.mx td[data-c="${id}"],.mx thead th[data-c="${id}"]{background:var(--hover)}`:'';
});
$('#mxWrap').addEventListener('mouseleave',()=>{hl='';$('#colhl').textContent=''});

document.addEventListener('keydown',ev=>{
  const tag=ev.target.tagName;
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'&&tag!=='INPUT'){ev.preventDefault();undo();return}
  if(ev.key==='Escape'){
    if($('#pop').classList.contains('open')){closePop(true);ev.preventDefault();return}
    if(ui.drawer&&!$('#dlg').open){ui.drawer=null;renderDrawer();return}
  }
  if(ev.key==='/'&&tag!=='INPUT'&&!$('#dlg').open){ev.preventDefault();$('#q').focus();return}
  const inPop=ev.target.closest&&ev.target.closest('#pop');
  if(inPop&&popCtx){
    if(/^[0-4]$/.test(ev.key)){ev.preventDefault();const {e,s}=popCtx;closePop();focusKey=K(e,s);setLevel(e,s,+ev.key);const b=cellEl(e,s);if(b)b.focus({preventScroll:true});focusKey=null;return}
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const bs=[...$('#pop').querySelectorAll('button')],i=bs.indexOf(document.activeElement);const n=bs[(i+(ev.key==='ArrowDown'?1:-1)+bs.length)%bs.length];n&&n.focus();return}
    if(ev.key==='Tab'){ev.preventDefault();closePop(true);return}
    return;
  }
  const cell=ev.target.closest&&ev.target.closest('.cell');
  if(!cell)return;
  const {e,s}=cell.dataset,r=+cell.dataset.r,c=+cell.dataset.ci;
  const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[ev.key];
  if(mv){
    ev.preventDefault();
    const n=document.querySelector(`.cell[data-r="${r+mv[0]}"][data-ci="${c+mv[1]}"]`);
    if(n){cell.tabIndex=-1;n.tabIndex=0;n.focus();closePop()}
  }else if(/^[0-4]$/.test(ev.key)&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    ev.preventDefault();closePop();focusKey=K(e,s);setLevel(e,s,+ev.key);
    const b=cellEl(e,s);if(b)b.focus({preventScroll:true});focusKey=null;
  }else if(ev.key.toLowerCase()==='g'&&!ev.metaKey&&!ev.ctrlKey){
    ev.preventDefault();closePop();focusKey=K(e,s);toggleGoal(e,s);
  }
});

renderLegend();
render();
})();
</script>
