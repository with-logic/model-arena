<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Customer Journey Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4ef; --panel:#ffffff; --panel2:#faf9f6; --ink:#1b1e25; --ink2:#444a57; --muted:#7b8190;
  --line:#e3e1d9; --dot:#d3d0c6; --accent:#3557f0; --danger:#d93f4c;
  --shadow:0 1px 2px rgba(25,25,35,.05),0 8px 22px -12px rgba(25,25,35,.22);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
body.dark{
  --bg:#0f1116; --panel:#181b22; --panel2:#14171d; --ink:#e9ebf1; --ink2:#b9bfcc; --muted:#808899;
  --line:#272c38; --dot:#2a3040; --accent:#7c93ff; --danger:#ff6b76;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:13px;overflow:hidden;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,textarea{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--panel);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand .t{display:flex;flex-direction:column;min-width:0}
#docTitle{border:0;background:transparent;font-weight:600;font-size:14px;padding:2px 6px;margin-left:-6px;border-radius:6px;
  width:230px;max-width:34vw;outline:0;text-overflow:ellipsis}
#docTitle:hover{background:var(--panel2)}
#docTitle:focus{background:var(--panel2);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpis{display:flex;gap:6px;margin-left:6px}
.kpi{display:flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.kpi b{font-family:var(--mono);font-size:12px;font-weight:600}
.kpi span{color:var(--muted);font-size:11.5px}
.kpi.hl{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.kpi.hl b{color:var(--accent)}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:6px}
.btn{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:inline-flex;
  align-items:center;gap:7px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--panel2);border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:default;pointer-events:none}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--panel))}
.btn:focus-visible,.seg button:focus-visible,.sw:focus-visible,.icb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.menuwrap{position:relative}
.menu{position:absolute;top:42px;right:0;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;display:none;z-index:50}
.menu.left{right:auto;left:0}
.menu.open{display:block;animation:menu .14s ease-out}
@keyframes menu{from{opacity:0;transform:translateY(-4px)}}
.menu h6{margin:6px 8px 4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.mi:hover{background:var(--panel2)}
.mi .sw0{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c)}
.mi .sw0 svg{width:14px;height:14px}
.mi kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 2px}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0;position:relative}
#canvas{flex:1;position:relative;overflow:hidden;cursor:default;touch-action:none;
  background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px)}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#labels,#nodes{position:absolute;left:0;top:0}

/* ---------- nodes ---------- */
.node{position:absolute;width:228px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 14px 11px;
  box-shadow:var(--shadow);cursor:grab;transition:box-shadow .15s,border-color .15s}
.node::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--c)}
.node.pop{animation:pop .32s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.node:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.node.sel{border-color:var(--c);z-index:5;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--c) 22%,transparent),var(--shadow)}
.node.dragging{cursor:grabbing;z-index:6;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--c) 22%,transparent),0 18px 34px -14px rgba(20,20,30,.4)}
.node.target{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent),var(--shadow)}
.n-head{display:flex;gap:10px;align-items:center}
.n-icon{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,var(--panel))}
.n-icon svg{width:19px;height:19px;stroke-width:1.75}
.n-tt{min-width:0;flex:1}
.n-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:13px;white-space:nowrap}
.n-kicker .goal{color:var(--c);font-weight:600}
.n-title{font-weight:600;font-size:15px;line-height:20px;letter-spacing:-.01em;overflow-wrap:anywhere;border-radius:4px;outline:0}
.n-title:empty::before{content:"Untitled";color:var(--muted)}
.n-desc{margin-top:10px;color:var(--ink2);font-size:12px;line-height:17px;overflow-wrap:anywhere;border-radius:4px;outline:0;min-height:17px}
.n-desc:empty::before{content:"Double-click to describe this stage";color:var(--muted);opacity:.7}
[contenteditable]{cursor:text;user-select:text;-webkit-user-select:text;box-shadow:0 0 0 2px var(--panel),0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.n-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.n-tags span{font-size:10.5px;line-height:14px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.n-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:11px;line-height:14px;color:var(--muted)}
.n-vol b{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600}
.n-mood{display:inline-flex;align-items:center;gap:5px}
.n-mood i,.md{width:7px;height:7px;border-radius:50%;background:var(--m);display:inline-block}
.m1{--m:#e5484d}.m2{--m:#f08a3c}.m3{--m:#9aa1ad}.m4{--m:#5aae4f}.m5{--m:#12a594}
.port{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--c);
  opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s,background .12s;cursor:crosshair;z-index:2}
.port::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.port[data-side=t]{left:calc(50% - 6.5px);top:-7px}
.port[data-side=b]{left:calc(50% - 6.5px);bottom:-7px}
.port[data-side=l]{top:calc(50% - 6.5px);left:-7px}
.port[data-side=r]{top:calc(50% - 6.5px);right:-7px}
.node:hover .port,.node.sel .port{opacity:1;transform:scale(1)}
.port:hover{background:var(--c);transform:scale(1.35)!important}
#canvas.connecting .port{opacity:0!important}
#canvas.connecting,#canvas.connecting .node{cursor:crosshair}

/* ---------- edges ---------- */
.edge .hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.edge .line{fill:none;stroke:color-mix(in srgb,var(--c) 55%,var(--bg));stroke-width:2;transition:stroke .12s}
.edge .flow{fill:none;stroke:var(--c);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:.1 17.9;animation:flow 1.1s linear infinite}
.edge .arrow{fill:var(--c)}
.edge.dashed .line{stroke-dasharray:6 6}
.edge.dashed .flow,body.noflow .edge .flow{display:none}
.edge:hover .line{stroke:var(--c)}
.edge.sel .line{stroke:var(--accent);stroke-width:2.6}
.edge.sel .arrow{fill:var(--accent)}
.edge.sel .flow{stroke:var(--accent)}
@keyframes flow{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.edge .flow{animation:none;display:none}.node.pop{animation:none}}
#temp{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 5;stroke-linecap:round}
#tempDot{fill:var(--accent)}
.elabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:14px;
  padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;cursor:pointer;outline:0}
.elabel.auto{color:var(--muted)}
.elabel.empty{display:none}
.elabel.sel{border-color:var(--accent);color:var(--accent)}
.elabel.empty.sel{display:block;opacity:.8;font-weight:500}
.elabel[contenteditable]{display:block;cursor:text;min-width:30px;text-align:center;color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}

/* ---------- canvas chrome ---------- */
.ui{position:absolute;z-index:10}
.zoom{left:14px;bottom:14px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);padding:3px}
.zoom button{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.zoom button:hover{background:var(--panel2);color:var(--ink)}
.zoom #zl{width:50px;font-family:var(--mono);font-size:11px;font-weight:600}
.zoom .sep{height:16px}
#minimap{right:14px;bottom:14px;width:176px;height:112px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);cursor:pointer;backdrop-filter:blur(6px)}
#minimap .vp{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:1.2}
.hint{left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--panel);
  padding:7px 8px 7px 14px;border-radius:999px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 420px);overflow:hidden}
.hint span{opacity:.6}
.hint i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;vertical-align:-1px}
.hint button{border:0;background:color-mix(in srgb,var(--panel) 16%,transparent);color:inherit;width:22px;height:22px;border-radius:50%;cursor:pointer;flex:none;line-height:1}
.empty{inset:0;display:none;place-items:center;pointer-events:none;text-align:center;color:var(--muted)}
.empty.show{display:grid}
.empty div{max-width:300px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-12px);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- inspector ---------- */
#insp{width:312px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 28px;z-index:20}
body.insp-off #insp{display:none}
#insp h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.ih .x{border:0;background:none;width:26px;height:26px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.ih .x:hover{background:var(--panel2);color:var(--ink)}
.tagk{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--c,var(--muted));
  background:color-mix(in srgb,var(--c,var(--muted)) 12%,var(--panel));padding:3px 8px;border-radius:6px;font-weight:600}
.fld{margin-bottom:14px}
.fld>span,.fld>label>span,.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lbl em{font-style:normal;color:var(--ink2);letter-spacing:.02em;text-transform:none;font-size:10.5px}
.in{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;outline:0;transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--panel)}
textarea.in{resize:vertical;min-height:68px;line-height:1.45;display:block}
input[type=number].in{font-family:var(--mono);font-weight:600;font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel2);font-family:var(--mono);font-weight:600;font-size:12.5px;height:35px;display:flex;align-items:center;color:var(--ink2)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--panel2)}
.seg button{flex:1;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--ink2);font-weight:500;font-size:12px}
.seg button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg button.on{background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.08);color:var(--ink)}
.seg .md{width:10px;height:10px}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:25px;height:25px;border-radius:50%;border:0;background:var(--c);cursor:pointer;position:relative;transition:transform .1s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.ics{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.icb{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.icb:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));color:var(--ink)}
.icb.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:5px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px}
.chips:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;padding:3px 4px 3px 8px;border-radius:6px;
  background:color-mix(in srgb,var(--c) 12%,var(--panel));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.chip button{border:0;background:none;cursor:pointer;color:inherit;opacity:.6;padding:0 3px;font-size:13px;line-height:1}
.chip button:hover{opacity:1}
.chips input{flex:1;min-width:80px;border:0;background:none;outline:0;padding:3px 4px;font-size:12px}
.tog{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;background:var(--panel2);width:100%;text-align:left}
.tog small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.tog .sw2{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.tog .sw2::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
.tog.on .sw2{background:var(--accent)}.tog.on .sw2::after{left:14px}
.conn{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 8px;border-radius:8px;cursor:pointer}
.conn:hover{background:var(--panel2)}
.conn .dir{font-family:var(--mono);color:var(--muted);width:14px}
.conn .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.conn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.conn .pc{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.conn button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:6px;font-size:14px;line-height:1}
.conn button:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.none{color:var(--muted);font-size:12px;padding:4px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btns .btn{justify-content:center}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 9%,var(--panel));border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.big{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;background:
  linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--panel)),var(--panel) 70%)}
.big b{font-size:30px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1.1}
.big span{color:var(--muted);font-size:12px}
.frow{padding:7px 8px;margin:0 -8px;border-radius:9px;cursor:pointer}
.frow:hover{background:var(--panel2)}
.frow .l1{display:flex;align-items:center;gap:7px}
.frow .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.frow .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .v{font-family:var(--mono);font-size:11.5px;font-weight:600}
.frow .p{font-family:var(--mono);font-size:10px;color:var(--muted);width:38px;text-align:right}
.frow .bar{height:6px;border-radius:99px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);margin-top:6px;overflow:hidden}
.frow .bar i{display:block;height:100%;border-radius:99px;background:var(--c);min-width:4px;transition:width .3s}
.sec{margin-top:22px}
.curve{border:1px solid var(--line);border-radius:12px;background:var(--panel2);display:block;width:100%;height:auto}
.keys{display:grid;grid-template-columns:1fr auto;gap:7px 10px;color:var(--ink2);font-size:12px}
.keys kbd{justify-self:end}

@media (max-width:1180px){.kpis .kpi:not(.hl){display:none}}
@media (max-width:980px){.btn .tx{display:none}.btn.has-tx{width:34px;padding:0;justify-content:center}.kpis{display:none}.hint{display:none}}
@media (max-width:760px){

}

<body>
<header class="top">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="7" r="2.2"/><circle cx="19" cy="7" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.2 7h9.6M6.3 9l4.3 7M17.7 9l-4.3 7" opacity=".65"/></svg></div>

    <button class="btn has-tx" id="layout" title="Tidy up the diagram (L)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h6M12 7v10h3"/></svg><span class="tx">Auto-layout</span></button>
    <div class="sep"></div>
    <div class="menuwrap">
      <button class="btn has-tx" data-menu="fileMenu"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg><span class="tx">Export</span></button>

<main>
  <section id="canvas">
    <div id="world">
      <svg id="edges"><g id="edgeG"></g><path id="temp" style="display:none"/><circle id="tempDot" r="4.5" style="display:none"/></svg>
      <div id="labels"></div>

    </div>

    <div class="ui zoom">

<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const LS='customer-journey-flow.v1', W=228, GRID=10;
const COLORS=['#3b6cf6','#7c5cf5','#d9489a','#ef7a36','#d99a12','#1fa46c','#0e98ad','#5d6779'];
const MOODS=['Frustrated','Uneasy','Neutral','Pleased','Delighted'];
const MOODC=['#e5484d','#f08a3c','#9aa1ad','#5aae4f','#12a594'];
const ICONS={
  megaphone:'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
  list:'M4 6h10M4 12h10M4 18h6M16 16l2 2 4-4',
  cart:'M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6.2M9 19.5a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zM17 19.5a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0z',
  card:'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18M7 15h3',
  mail:'M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM3.5 7.5l8.5 6 8.5-6',
  heart:'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.600-7 10-7 10z',
  star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.100L3.200 9.500l6.100-.9z',
  chat:'M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0',
  box:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9',
  flag:'M5 21V4M5 4h11l-2 4 2 4H5'
};
const PRESETS=[
  {title:'Awareness',icon:'megaphone',color:COLORS[0],desc:'Prospect first notices the brand through ads, social or word of mouth.',tags:['Social ads','SEO','Referrals'],mood:3},
  {title:'Interest',icon:'search',color:COLORS[1],desc:'Visits the site, reads content and starts following along.',tags:['Blog','Landing page','Newsletter'],mood:4},
  {title:'Consideration',icon:'list',color:COLORS[2],desc:'Compares options, reads reviews and checks pricing.',tags:['Reviews','Pricing page','Demo'],mood:3},
  {title:'Intent',icon:'cart',color:COLORS[3],desc:'Adds to cart or starts a trial — a clear signal to buy.',tags:['Cart','Free trial'],mood:4},
  {title:'Purchase',icon:'card',color:COLORS[5],desc:'Completes checkout and becomes a customer.',tags:['Checkout','Payment'],mood:5},
  {title:'Loyalty',icon:'heart',color:COLORS[4],desc:'Onboarding, support and rewards turn buyers into repeat customers.',tags:['Onboarding','Rewards'],mood:5},
  {title:'Advocacy',icon:'star',color:COLORS[6],desc:'Happy customers review, refer and bring new prospects in.',tags:['Reviews','Referral program'],mood:5}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const snap=v=>Math.round(v/GRID)*GRID;
const fmt=n=>n?Number(n).toLocaleString('en-US'):'—';
const pct=(a,b)=>{if(!(a>0)||!(b>0))return '';const p=b/a*100;return (p<10?Math.round(p*10)/10:Math.round(p))+'%'};
const icon=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${ICONS[k]||ICONS.flag}"/></svg>`;

const canvas=$('#canvas'),world=$('#world'),nodesEl=$('#nodes'),labelsEl=$('#labels'),edgeG=$('#edgeG'),temp=$('#temp'),tempDot=$('#tempDot'),insp=$('#insp'),mm=$('#minimap');
let doc={title:'',nodes:[],edges:[]},view={x:0,y:0,k:1},sel=null,hist=[],hi=-1,gesture=null,mmT=null,saveT=0;
const nodeEls=new Map,edgeEls=new Map,sizes={},pts=new Map;

/* ---------------- data ---------------- */
function sample(){
  const P=PRESETS,mk=(p,x,y,v,extra)=>({id:uid('n'),x,y,title:p.title,desc:p.desc,icon:p.icon,color:p.color,tags:[...p.tags],mood:p.mood,visitors:v,goal:false,...extra});
  const a=mk(P[0],0,120,10000),i=mk(P[1],290,120,4200),c=mk(P[2],580,120,1900),t=mk(P[3],870,120,820),p=mk(P[4],1160,120,410,{goal:true});
  const n=mk({title:'Email nurture',icon:'mail',color:COLORS[6],desc:"Drip sequence that warms up visitors who aren't ready to buy yet.",tags:['Email','Retargeting'],mood:3},580,440,1100);
  const l=mk(P[5],1160,440,180);
  const e=(f,to,label='',dashed=false)=>({id:uid('e'),from:f.id,to:to.id,label,dashed});
  return {title:'Online store — path to purchase',nodes:[a,i,c,t,p,n,l],
    edges:[e(a,i),e(i,c),e(c,t),e(t,p),e(i,n,'not ready yet',true),e(n,t,'re-engaged',true),e(p,l)]};
}
const byId=id=>doc.nodes.find(n=>n.id===id);
const edgeById=id=>doc.edges.find(e=>e.id===id);
const size=n=>sizes[n.id]||{w:W,h:170};
function normalize(d){
  if(!d||!Array.isArray(d.nodes))throw new Error('bad file');
  const nodes=d.nodes.map(n=>({id:String(n.id||uid('n')),x:+n.x||0,y:+n.y||0,title:String(n.title??''),desc:String(n.desc??''),
    icon:ICONS[n.icon]?n.icon:'flag',color:/^#[0-9a-f]{3,8}$/i.test(n.color)?n.color:COLORS[0],tags:Array.isArray(n.tags)?n.tags.map(String).slice(0,12):[],
    mood:clamp(parseInt(n.mood)||3,1,5),visitors:Math.max(0,parseInt(n.visitors)||0),goal:!!n.goal}));
  const ids=new Set(nodes.map(n=>n.id));
  const edges=(Array.isArray(d.edges)?d.edges:[]).filter(e=>ids.has(e.from)&&ids.has(e.to)&&e.from!==e.to)
    .map(e=>({id:String(e.id||uid('e')),from:e.from,to:e.to,label:String(e.label??''),dashed:!!e.dashed}));
  return {title:String(d.title||'Untitled journey'),nodes,edges};
}
function save(){try{localStorage.setItem(LS,JSON.stringify({doc,view,dark:document.body.classList.contains('dark'),noflow:document.body.classList.contains('noflow'),hint:$('#hint').hidden}))}catch(e){}}
function commit(){
  const s=JSON.stringify(doc);
  if(hist[hi]!==s){hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>120)hist.shift();hi=hist.length-1}
  save();updUndo();
}
function restore(i){
  hi=i;doc=JSON.parse(hist[hi]);
  if(sel&&!(sel.type==='node'?byId(sel.id):edgeById(sel.id)))sel=null;
  renderAll();save();updUndo();
}
const undo=()=>{if(hi>0){restore(hi-1);toast('Undone')}};
const redo=()=>{if(hi<hist.length-1){restore(hi+1);toast('Redone')}};
function updUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}

/* ---------------- analysis ---------------- */
function rankMap(){const r={};let i=0;mainPath().forEach(n=>r[n.id]=++i);[...doc.nodes].sort((a,b)=>a.x-b.x||a.y-b.y).forEach(n=>r[n.id]||(r[n.id]=++i));return r}
function mainPath(){
  if(!doc.nodes.length)return[];
  const inc=new Set(doc.edges.map(e=>e.to));
  let roots=doc.nodes.filter(n=>!inc.has(n.id));if(!roots.length)roots=doc.nodes;
  let cur=[...roots].sort((a,b)=>b.visitors-a.visitors||a.x-b.x)[0];
  const seen=new Set,path=[];
  while(cur&&!seen.has(cur.id)){
    seen.add(cur.id);path.push(cur);
    cur=doc.edges.filter(e=>e.from===cur.id).map(e=>byId(e.to)).filter(n=>n&&!seen.has(n.id)).sort((a,b)=>b.visitors-a.visitors)[0];
  }
  return path;
}
function overall(path){
  if(path.length<2)return null;
  const first=path[0],goal=path.find(n=>n.goal)||doc.nodes.find(n=>n.goal)||path[path.length-1];
  const p=pct(first.visitors,goal.visitors);
  return p&&goal!==first?{p,first,goal}:null;
}

/* ---------------- geometry ---------------- */
const cx=n=>n.x+size(n).w/2, cy=n=>n.y+size(n).h/2;
function pickSides(a,b){
  const sa=size(a),sb=size(b),dx=cx(b)-cx(a),dy=cy(b)-cy(a);
  const gx=Math.abs(dx)-(sa.w+sb.w)/2,gy=Math.abs(dy)-(sa.h+sb.h)/2;
  if(gx>=gy)return dx>=0?['r','l']:['l','r'];
  return dy>=0?['b','t']:['t','b'];
}
function anchor(n,side,f=.5){
  const s=size(n);
  if(side==='r')return[n.x+s.w,n.y+s.h*f,1,0];
  if(side==='l')return[n.x,n.y+s.h*f,-1,0];
  if(side==='b')return[n.x+s.w*f,n.y+s.h,0,1];
  return[n.x+s.w*f,n.y,0,-1];
}
function curve(p,q){ // p: source anchor, q: target anchor (with normals)
  const ex=q[0]+q[2]*10,ey=q[1]+q[3]*10,d=Math.hypot(ex-p[0],ey-p[1]),o=clamp(d*.42,30,170);
  const c1=[p[0]+p[2]*o,p[1]+p[3]*o],c2=[ex+q[2]*o,ey+q[3]*o];
  const r=v=>Math.round(v*10)/10;
  const tx=q[0]+q[2]*1.5,ty=q[1]+q[3]*1.5,bx=q[0]+q[2]*11.5,by=q[1]+q[3]*11.5,px=-q[3]*5,py=q[2]*5;
  return {d:`M${r(p[0])},${r(p[1])} C${r(c1[0])},${r(c1[1])} ${r(c2[0])},${r(c2[1])} ${r(ex)},${r(ey)}`,
    mid:[(p[0]+3*c1[0]+3*c2[0]+ex)/8,(p[1]+3*c1[1]+3*c2[1]+ey)/8],
    arrow:`M${r(tx)},${r(ty)} L${r(bx+px)},${r(by+py)} L${r(bx-px)},${r(by-py)}Z`,pts:[p[0],p[1],c1[0],c1[1],c2[0],c2[1],ex,ey],tri:[tx,ty,bx+px,by+py,bx-px,by-py]};
}
function geoms(){
  const g={},groups={};
  for(const e of doc.edges){
    const a=byId(e.from),b=byId(e.to);if(!a||!b)continue;
    const [sa,sb]=pickSides(a,b),G=g[e.id]={e,a,b,sa,sb,sf:.5,tf:.5};
    (groups[a.id+'|'+sa]??=[]).push({G,k:'sf',o:b});
    (groups[b.id+'|'+sb]??=[]).push({G,k:'tf',o:a});
  }
  for(const key in groups){
    const list=groups[key],hz=/[tb]$/.test(key);
    list.sort((p,q)=>hz?cx(p.o)-cx(q.o):cy(p.o)-cy(q.o));
    list.forEach((it,i)=>it.G[it.k]=(i+1)/(list.length+1));
  }
  for(const id in g){const G=g[id];G.c=curve(anchor(G.a,G.sa,G.sf),anchor(G.b,G.sb,G.tf))}
  return g;
}
function bbox(){
  if(!doc.nodes.length)return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of doc.nodes){const s=size(n);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+s.w);y1=Math.max(y1,n.y+s.h)}
  return{x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* ---------------- rendering ---------------- */
function nodeHTML(n,rank){
  return `<div class="n-head"><div class="n-icon">${icon(n.icon)}</div><div class="n-tt"><div class="n-kicker">Stage ${String(rank).padStart(2,'0')}${n.goal?' <span class="goal">· Goal</span>':''}</div><div class="n-title" data-edit="title" spellcheck="false">${esc(n.title)}</div></div></div>`+
  `<div class="n-desc" data-edit="desc">${esc(n.desc)}</div>`+
  (n.tags.length?`<div class="n-tags">${n.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:'')+
  `<div class="n-foot"><span class="n-vol"><b>${fmt(n.visitors)}</b> people</span><span class="n-mood m${n.mood}"><i></i>${MOODS[n.mood-1]}</span></div>`+
  ['t','r','b','l'].map(s=>`<div class="port" data-side="${s}" title="Drag to connect"></div>`).join('');
}
function renderNodes(){
  const ranks=rankMap(),seen=new Set;
  for(const n of doc.nodes){
    seen.add(n.id);let el=nodeEls.get(n.id);
    if(!el){el=document.createElement('div');el.className='node pop';el.dataset.id=n.id;nodesEl.appendChild(el);nodeEls.set(n.id,el);
      el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true})}
    if(!el.querySelector('[contenteditable]')){const h=nodeHTML(n,ranks[n.id]);if(el._h!==h){el.innerHTML=h;el._h=h}}
    el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--c',n.color);
    el.classList.toggle('sel',sel?.type==='node'&&sel.id===n.id);
    sizes[n.id]={w:el.offsetWidth||W,h:el.offsetHeight||170};
  }
  for(const [id,el] of nodeEls)if(!seen.has(id)){el.remove();nodeEls.delete(id);delete sizes[id]}
  $('#empty').classList.toggle('show',!doc.nodes.length);
}
function renderEdges(){
  const g=geoms(),seen=new Set;
  for(const e of doc.edges){
    const G=g[e.id];if(!G)continue;seen.add(e.id);
    let r=edgeEls.get(e.id);
    if(!r){
      const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','edge');el.dataset.id=e.id;
      el.innerHTML='<path class="hit"/><path class="line"/><path class="flow"/><path class="arrow"/>';edgeG.appendChild(el);
      const lab=document.createElement('div');lab.className='elabel';lab.dataset.id=e.id;labelsEl.appendChild(lab);
      r={el,lab,p:el.children};edgeEls.set(e.id,r);
    }
    const isSel=sel?.type==='edge'&&sel.id===e.id;
    r.p[0].setAttribute('d',G.c.d);r.p[1].setAttribute('d',G.c.d);r.p[2].setAttribute('d',G.c.d);r.p[3].setAttribute('d',G.c.arrow);
    r.el.style.setProperty('--c',G.a.color);
    r.el.setAttribute('class','edge'+(isSel?' sel':'')+(e.dashed?' dashed':''));
    const auto=pct(G.a.visitors,G.b.visitors),txt=e.label||auto;
    if(!r.lab.hasAttribute('contenteditable')){
      r.lab.textContent=txt||'+ label';
      r.lab.className='elabel'+(e.label?'':txt?' auto':' empty')+(isSel?' sel':'');
    }
    r.lab.style.left=G.c.mid[0]+'px';r.lab.style.top=G.c.mid[1]+'px';
  }
  for(const [id,r] of edgeEls)if(!seen.has(id)){r.el.remove();r.lab.remove();edgeEls.delete(id)}
}
function renderKpis(){
  const o=overall(mainPath());
  $('#kpis').innerHTML=`<div class="kpi"><b>${doc.nodes.length}</b><span>stage${doc.nodes.length===1?'':'s'}</span></div>`+
    `<div class="kpi"><b>${doc.edges.length}</b><span>connection${doc.edges.length===1?'':'s'}</span></div>`+
    (o?`<div class="kpi hl" title="${esc(o.first.title)} → ${esc(o.goal.title)}"><b>${o.p}</b><span>overall conversion</span></div>`:'');
}
function renderMinimap(){
  const mw=176,mh=112,r=canvas.getBoundingClientRect();
  const vp={x:-view.x/view.k,y:-view.y/view.k,w:r.width/view.k,h:r.height/view.k},b=bbox()||vp;
  const x0=Math.min(b.x,vp.x)-40,y0=Math.min(b.y,vp.y)-40,x1=Math.max(b.x+b.w,vp.x+vp.w)+40,y1=Math.max(b.y+b.h,vp.y+vp.h)+40;
  const s=Math.min(mw/(x1-x0),mh/(y1-y0)),ox=(mw-(x1-x0)*s)/2-x0*s,oy=(mh-(y1-y0)*s)/2-y0*s;
  mmT={s,ox,oy};
  mm.innerHTML=doc.nodes.map(n=>{const z=size(n);return `<rect x="${n.x*s+ox}" y="${n.y*s+oy}" width="${Math.max(3,z.w*s)}" height="${Math.max(2,z.h*s)}" rx="1.5" fill="${n.color}" opacity="${sel?.id===n.id?1:.6}"/>`}).join('')+
    `<rect class="vp" x="${vp.x*s+ox}" y="${vp.y*s+oy}" width="${vp.w*s}" height="${vp.h*s}" rx="2"/>`;
}
function applyView(){

/* ---------------- actions ---------------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1700)}
const toWorld=(x,y)=>{const r=canvas.getBoundingClientRect();return[(x-r.left-view.x)/view.k,(y-r.top-view.y)/view.k]};
function addNode(p={},x,y){
  if(x==null){const r=canvas.getBoundingClientRect();[x,y]=toWorld(r.left+r.width/2,r.top+r.height/2);x-=W/2;y-=90}
  x=snap(x);y=snap(y);
  while(doc.nodes.some(n=>Math.abs(n.x-x)<20&&Math.abs(n.y-y)<20)){x+=30;y+=30}
  const n={id:uid('n'),x,y,title:p.title??'New stage',desc:p.desc??'',icon:p.icon||'flag',color:p.color||COLORS[doc.nodes.length%COLORS.length],
    tags:[...(p.tags||[])],mood:p.mood||3,visitors:0,goal:false};
  doc.nodes.push(n);return n;
}
function addEdge(from,to){
  if(from===to)return null;
  const ex=doc.edges.find(e=>e.from===from&&e.to===to);
  if(ex){toast('Already connected');return ex}
  const e={id:uid('e'),from,to,label:'',dashed:false};doc.edges.push(e);return e;
}
function delSel(){
  if(!sel)return;
  if(sel.type==='node'){doc.nodes=doc.nodes.filter(n=>n.id!==sel.id);doc.edges=doc.edges.filter(e=>e.from!==sel.id&&e.to!==sel.id);toast('Stage deleted')}
  else{doc.edges=doc.edges.filter(e=>e.id!==sel.id);toast('Connection removed')}
  sel=null;commit();renderAll();
}
function dupSel(){
  if(sel?.type!=='node')return;const n=byId(sel.id);
  const c={...n,id:uid('n'),x:n.x+30,y:n.y+30,tags:[...n.tags],goal:false,title:n.title+' copy'};
  doc.nodes.push(c);sel={type:'node',id:c.id};commit();renderAll();
}
function tween(ms,step,done){
  const t0=performance.now();
  const f=now=>{const t=clamp((now-t0)/ms,0,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;step(e);t<1?requestAnimationFrame(f):done&&done()};
  requestAnimationFrame(f);
}
function zoomAt(k,px,py){
  const r=canvas.getBoundingClientRect();k=clamp(k,.25,2);
  if(px==null){px=r.left+r.width/2;py=r.top+r.height/2}
  const x=px-r.left,y=py-r.top,wx=(x-view.x)/view.k,wy=(y-view.y)/view.k;
  view={k,x:x-wx*k,y:y-wy*k};applyView();
}
function animView(t){const s={...view};tween(360,e=>{view={k:s.k+(t.k-s.k)*e,x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e};applyView()})}
function fit(anim){
  const b=bbox(),r=canvas.getBoundingClientRect();if(!r.width)return;
  if(!b){const t={k:1,x:0,y:0};return anim?animView(t):(view=t,applyView())}
  const pad=Math.min(80,r.width*.08),k=clamp(Math.min((r.width-pad*2)/b.w,(r.height-pad*2-20)/b.h),.25,1.1);
  const t={k,x:(r.width-b.w*k)/2-b.x*k,y:(r.height-b.h*k)/2-b.y*k};
  if(anim)animView(t);else{view=t;applyView()}
}
function reveal(n){
  if(!n)return;const r=canvas.getBoundingClientRect(),s=size(n);
  const sx=n.x*view.k+view.x,sy=n.y*view.k+view.y;
  if(sx<20||sy<20||sx+s.w*view.k>r.width-20||sy+s.h*view.k>r.height-20)
    animView({k:view.k,x:r.width/2-(n.x+s.w/2)*view.k,y:r.height/2-(n.y+s.h/2)*view.k});
}
function autoLayout(){
  if(!doc.nodes.length)return;
  const out={},st={},dag=[],layer={};
  doc.nodes.forEach(n=>{out[n.id]=[];layer[n.id]=0});
  doc.edges.forEach(e=>out[e.from]&&out[e.to]&&out[e.from].push(e.to));
  const inc=new Set(doc.edges.map(e=>e.to)),order=[...doc.nodes].sort((a,b)=>a.x-b.x||a.y-b.y);
  const dfs=u=>{st[u]=1;for(const v of out[u]){if(st[v]===1)continue;dag.push([u,v]);if(!st[v])dfs(v)}st[u]=2};
  order.filter(n=>!inc.has(n.id)).forEach(n=>!st[n.id]&&dfs(n.id));
  order.forEach(n=>!st[n.id]&&dfs(n.id));
  for(let i=0;i<doc.nodes.length;i++){let ch=false;for(const[u,v]of dag)if(layer[v]<layer[u]+1){layer[v]=layer[u]+1;ch=true}if(!ch)break}
  const cols=[];order.forEach(n=>(cols[layer[n.id]]??=[]).push(n));
  const b0=bbox(),tgt={},GAPX=104,GAPY=46;
  cols.forEach((col,ci)=>{
    const key=n=>{const ps=dag.filter(d=>d[1]===n.id&&tgt[d[0]]).map(d=>tgt[d[0]].y+size(byId(d[0])).h/2);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null};
    const keys=new Map(col.map(n=>[n.id,key(n)]));
    col.sort((a,b)=>{const ka=keys.get(a.id),kb=keys.get(b.id);return (ka??0)-(kb??0)||a.y-b.y});
    const total=col.reduce((s,n)=>s+size(n).h,0)+GAPY*(col.length-1);let y=-total/2;
    // single child directly following a single parent keeps its row
    col.forEach(n=>{const k=keys.get(n.id);tgt[n.id]={x:ci*(W+GAPX),y:col.length===1&&k!=null?k-size(n).h/2:y};y+=size(n).h+GAPY});
  });
  const minY=Math.min(...Object.values(tgt).map(t=>t.y));
  const from={};doc.nodes.forEach(n=>{from[n.id]={x:n.x,y:n.y};tgt[n.id].x=snap(tgt[n.id].x+b0.x);tgt[n.id].y=snap(tgt[n.id].y-minY+b0.y)});
  tween(420,e=>{
    doc.nodes.forEach(n=>{n.x=from[n.id].x+(tgt[n.id].x-from[n.id].x)*e;n.y=from[n.id].y+(tgt[n.id].y-from[n.id].y)*e;const el=nodeEls.get(n.id);el.style.left=n.x+'px';el.style.top=n.y+'px'});
    renderEdges();renderMinimap();
  },()=>{doc.nodes.forEach(n=>{n.x=tgt[n.id].x;n.y=tgt[n.id].y});commit();renderAll();fit(true)});
}

}

/* ---------------- pointer interaction ---------------- */
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ui')||e.target.isContentEditable)return;
  if(e.button===2)return;
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()];endGesture(true);
    gesture={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k};return;
  }
  const port=e.target.closest('.port'),nodeEl=e.target.closest('.node'),edgeEl=e.target.closest('.edge,.elabel');
  if(port&&nodeEl){
    e.preventDefault();
    gesture={type:'connect',from:nodeEl.dataset.id,side:port.dataset.side,sx:e.clientX,sy:e.clientY,target:null};
    canvas.classList.add('connecting');temp.style.display=tempDot.style.display='';moveConnect(e);
  }else if(nodeEl&&e.button===0){
    const n=byId(nodeEl.dataset.id);
    if(!(sel?.type==='node'&&sel.id===n.id))select({type:'node',id:n.id});
    gesture={type:'node',id:n.id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false};
  }else if(edgeEl&&e.button===0){
    select({type:'edge',id:edgeEl.dataset.id});
  }else{
    gesture={type:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};
  }
});
function moveConnect(e){
  const g=gesture,a=byId(g.from);if(!a)return;
  const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.node');
  const tid=el&&el.dataset.id!==g.from?el.dataset.id:null;
  if(tid!==g.target){nodeEls.get(g.target)?.classList.remove('target');g.target=tid;nodeEls.get(tid)?.classList.add('target')}
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  if(tid){const b=byId(tid),[sa,sb]=pickSides(a,b),c=curve(anchor(a,sa),anchor(b,sb));temp.setAttribute('d',c.d);tempDot.style.display='none'}
  else{
    const p=anchor(a,g.side),d=Math.hypot(wx-p[0],wy-p[1]),o=clamp(d*.45,10,150);
    temp.setAttribute('d',`M${p[0]},${p[1]} C${p[0]+p[2]*o},${p[1]+p[3]*o} ${wx},${wy} ${wx},${wy}`);
    tempDot.style.display='';tempDot.setAttribute('cx',wx);tempDot.setAttribute('cy',wy);
  }
}
window.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const g=gesture;if(!g)return;
  if(g.type==='pinch'){if(pts.size<2)return;const [a,b]=[...pts.values()];zoomAt(g.k*Math.hypot(a.x-b.x,a.y-b.y)/g.d,(a.x+b.x)/2,(a.y+b.y)/2);return}
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
  if(g.type==='connect')return moveConnect(e);
  if(!g.moved&&Math.hypot(dx,dy)<4)return;
  g.moved=true;
  if(g.type==='pan'){canvas.classList.add('panning');view.x=g.ox+dx;view.y=g.oy+dy;applyView()}
  else if(g.type==='node'){
    const n=byId(g.id),el=nodeEls.get(g.id);if(!n)return;
    n.x=snap(g.ox+dx/view.k);n.y=snap(g.oy+dy/view.k);el.classList.add('dragging');
    el.style.left=n.x+'px';el.style.top=n.y+'px';renderEdges();renderMinimap();
  }
});
function endGesture(abort,e){
  const g=gesture;gesture=null;if(!g)return;
  canvas.classList.remove('panning','connecting');
  if(g.type==='connect'){
    temp.style.display=tempDot.style.display='none';nodeEls.get(g.target)?.classList.remove('target');
    if(abort||!e)return;
    if(g.target){const ed=addEdge(g.from,g.target);commit();select({type:'edge',id:ed.id})}
    else if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>50&&document.elementFromPoint(e.clientX,e.clientY)?.closest('#canvas')&&!document.elementFromPoint(e.clientX,e.clientY).closest('.ui')){
      const [wx,wy]=toWorld(e.clientX,e.clientY),a=byId(g.from);
      const off={r:[0,-80],l:[-W,-80],b:[-W/2,0],t:[-W/2,-170]}[g.side];
      const n=addNode({color:a.color},wx+off[0],wy+off[1]);addEdge(g.from,n.id);commit();select({type:'node',id:n.id});
      editNodeField(n.id,'title');toast('Stage added and connected');
    }
  }else if(g.type==='node'){
    nodeEls.get(g.id)?.classList.remove('dragging');
    if(g.moved&&!abort){commit();renderAll()}
  }else if(g.type==='pan'&&!g.moved&&!abort&&sel)select(null);
}
window.addEventListener('pointerup',e=>{pts.delete(e.pointerId);endGesture(false,e)});
window.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);endGesture(true)});
canvas.addEventListener('dblclick',e=>{
  if(e.target.closest('.ui')||e.target.isContentEditable)return;
  const ed=e.target.closest('[data-edit]'),nodeEl=e.target.closest('.node'),edgeEl=e.target.closest('.edge,.elabel');
  if(ed&&nodeEl)return editNodeField(nodeEl.dataset.id,ed.dataset.edit);
  if(nodeEl)return;
  if(edgeEl){select({type:'edge',id:edgeEl.dataset.id});return editEdgeLabel(edgeEl.dataset.id)}
  const [wx,wy]=toWorld(e.clientX,e.clientY),n=addNode({},wx-W/2,wy-40);
  commit();select({type:'node',id:n.id});editNodeField(n.id,'title');
});
canvas.addEventListener('wheel',e=>{
  if(e.target.closest('#minimap'))return;
  e.preventDefault();
  zoomAt(view.k*Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)),e.clientX,e.clientY);
},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// minimap navigation
function mmGo(e){
  const r=mm.getBoundingClientRect(),c=canvas.getBoundingClientRect();if(!mmT)return;
  const wx=((e.clientX-r.left)*176/r.width-mmT.ox)/mmT.s,wy=((e.clientY-r.top)*112/r.height-mmT.oy)/mmT.s;
  view.x=c.width/2-wx*view.k;view.y=c.height/2-wy*view.k;applyView();
}
mm.addEventListener('pointerdown',e=>{mm.setPointerCapture(e.pointerId);mm._d=true;mmGo(e)});
mm.addEventListener('pointermove',e=>mm._d&&mmGo(e));
mm.addEventListener('pointerup',()=>mm._d=false);

/* ---------------- toolbar ---------------- */
$('#addMenu').classList.add('left');
$('#addMenu').innerHTML='<h6>Journey stages</h6>'+PRESETS.map((p,i)=>`<button class="mi" data-preset="${i}" style="--c:${p.color}"><span class="sw0">${icon(p.icon)}</span>${p.title}</button>`).join('')+
  `<hr><button class="mi" data-preset="-1" style="--c:${COLORS[7]}"><span class="sw0">${icon('flag')}</span>Blank stage<kbd>N</kbd></button>`;
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-menu]');
  document.querySelectorAll('.menu.open').forEach(m=>{if(!mb||m.id!==mb.dataset.menu)m.classList.remove('open')});
  if(mb)$('#'+mb.dataset.menu).classList.toggle('open');
  const pr=e.target.closest('[data-preset]');
  if(pr){const p=PRESETS[+pr.dataset.preset],n=addNode(p||{});commit();select({type:'node',id:n.id});reveal(n);if(!p)editNodeField(n.id,'title')}
  const cmd=e.target.closest('[data-cmd]')?.dataset.cmd;
  if(cmd==='png')exportPNG();
  else if(cmd==='json'){download(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),slug()+'.json');toast('JSON exported')}
  else if(cmd==='import')$('#file').click();
  else if(cmd==='flow'){document.body.classList.toggle('noflow');save();toast('Flow animation '+(document.body.classList.contains('noflow')?'off':'on'))}
  else if(cmd==='sample'){doc=sample();sel=null;commit();renderAll();fit(true);toast('Sample loaded — undo to go back')}
  else if(cmd==='clear'){if(!doc.nodes.length)return;doc.nodes=[];doc.edges=[];sel=null;commit();renderAll();toast('Canvas cleared — undo to go back')}
});
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{doc=normalize(JSON.parse(t));sel=null;commit();renderAll();fit(true);toast('Journey imported')}).catch(()=>toast('Could not read that file'));
  e.target.value='';
});
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#layout').onclick=autoLayout;
$('#zi').onclick=()=>zoomAt(view.k*1.2);$('#zo').onclick=()=>zoomAt(view.k/1.2);$('#zl').onclick=()=>zoomAt(1);$('#zf').onclick=()=>fit(true);
$('#theme').onclick=()=>{document.body.classList.toggle('dark');save()};
$('#panel').onclick=()=>{document.body.classList.toggle('insp-off');renderMinimap()};
$('#hint').querySelector('button').onclick=()=>{$('#hint').hidden=true;save()};
$('#docTitle').addEventListener('input',e=>doc.title=e.target.value);
$('#docTitle').addEventListener('change',()=>{doc.title=doc.title.trim()||'Untitled journey';$('#docTitle').value=doc.title;commit()});
$('#docTitle').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});

window.addEventListener('keydown',e=>{
  const t=e.target;if(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&k==='y'){e.preventDefault();redo()}
  else if(mod&&k==='d'){e.preventDefault();dupSel()}
  else if(mod)return;
  else if(k==='delete'||k==='backspace'){if(sel){e.preventDefault();delSel()}}
  else if(k==='escape'){if(gesture)endGesture(true);else select(null)}
  else if(k==='n'){const n=addNode({});commit();select({type:'node',id:n.id});editNodeField(n.id,'title');e.preventDefault()}
  else if(k==='l')autoLayout();
  else if(k==='f'||k==='1')fit(true);
  else if(k==='+'||k==='=')zoomAt(view.k*1.2);
  else if(k==='-')zoomAt(view.k/1.2);
  else if(k==='enter'&&sel){e.preventDefault();sel.type==='node'?editNodeField(sel.id,'title'):editEdgeLabel(sel.id)}
  else if(k.startsWith('arrow')&&sel?.type==='node'){
    e.preventDefault();const n=byId(sel.id),s=e.shiftKey?GRID*5:GRID;
    if(k==='arrowleft')n.x-=s;if(k==='arrowright')n.x+=s;if(k==='arrowup')n.y-=s;if(k==='arrowdown')n.y+=s;
    commit();renderAll();
  }
});
window.addEventListener('resize',renderMinimap);

/* ---------------- export ---------------- */
const slug=()=>(doc.title||'journey').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'journey';
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportPNG(){
  const b=bbox();if(!b)return toast('Nothing to export yet');
  const pad=64,top=58,sc=2,cw=Math.ceil(b.w+pad*2),ch=Math.ceil(b.h+pad*2+top);
  const c=document.createElement('canvas');c.width=cw*sc;c.height=ch*sc;const x=c.getContext('2d');x.scale(sc,sc);
  const cs=getComputedStyle(document.body),v=k=>cs.getPropertyValue(k).trim();
  const bg=v('--bg'),panel=v('--panel'),ink=v('--ink'),ink2=v('--ink2'),muted=v('--muted'),line=v('--line'),dot=v('--dot');
  const sans='Inter, system-ui, -apple-system, "Segoe UI", sans-serif',mono='"JetBrains Mono", ui-monospace, Menlo, monospace';
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  const wrap=(t,X,Y,mw,lh,fs)=>{let ln='',yy=Y+(lh-fs)/2;for(const w of String(t).split(/\s+/)){const tr=ln?ln+' '+w:w;if(ln&&x.measureText(tr).width>mw+1){x.fillText(ln,X,yy);yy+=lh;ln=w}else ln=tr}if(ln)x.fillText(ln,X,yy)};
  const sp=s=>{try{x.letterSpacing=s}catch(e){}};
  x.fillStyle=bg;x.fillRect(0,0,cw,ch);
  x.fillStyle=dot;for(let i=10;i<cw;i+=20)for(let j=10;j<ch;j+=20){x.beginPath();x.arc(i,j,1,0,7);x.fill()}
  x.textBaseline='top';x.fillStyle=ink;x.font=`600 20px ${sans}`;x.fillText(doc.title,pad,30);
  const o=overall(mainPath());x.fillStyle=muted;x.font=`500 10px ${mono}`;sp('1px');
  x.fillText(`CUSTOMER JOURNEY FLOW  ·  ${doc.nodes.length} STAGES${o?'  ·  '+o.p+' OVERALL CONVERSION':''}`,pad,58);sp('0px');
  x.translate(pad-b.x,pad+top-b.y);
  const g=geoms();
  for(const e of doc.edges){
    const G=g[e.id];if(!G)continue;const p=G.c.pts,t=G.c.tri;
    x.strokeStyle=x.fillStyle=G.a.color;x.lineWidth=2;x.globalAlpha=.75;x.setLineDash(e.dashed?[6,6]:[]);
    x.beginPath();x.moveTo(p[0],p[1]);x.bezierCurveTo(p[2],p[3],p[4],p[5],p[6],p[7]);x.stroke();x.setLineDash([]);x.globalAlpha=1;
    x.beginPath();x.moveTo(t[0],t[1]);x.lineTo(t[2],t[3]);x.lineTo(t[4],t[5]);x.closePath();x.fill();
  }
  for(const e of doc.edges){
    const G=g[e.id];if(!G)continue;const txt=e.label||pct(G.a.visitors,G.b.visitors);if(!txt)continue;
    x.font=`600 10.5px ${mono}`;const tw=x.measureText(txt).width+16,[mx,my]=G.c.mid;
    rr(mx-tw/2,my-9.5,tw,19,9.5);x.fillStyle=panel;x.fill();x.strokeStyle=line;x.lineWidth=1;x.stroke();
    x.fillStyle=e.label?ink2:muted;x.textAlign='center';x.fillText(txt,mx,my-5.5);x.textAlign='left';
  }
  const ranks=rankMap();
  for(const n of doc.nodes){
    const el=nodeEls.get(n.id),s=size(n),q=k=>el.querySelector(k),X=n.x+1,Y=n.y+1;
    x.save();x.shadowColor='rgba(20,20,30,.16)';x.shadowBlur=18;x.shadowOffsetY=6;rr(n.x,n.y,s.w,s.h,14);x.fillStyle=panel;x.fill();x.restore();
    x.strokeStyle=line;x.lineWidth=1;x.stroke();
    x.fillStyle=n.color;rr(n.x+16,n.y-.5,s.w-32,3,1.5);x.fill();
    const ic=q('.n-icon');x.globalAlpha=.13;rr(X+ic.offsetLeft,Y+ic.offsetTop,36,36,10);x.fill();x.globalAlpha=1;
    x.save();x.translate(X+ic.offsetLeft+8.5,Y+ic.offsetTop+8.5);x.scale(19/24,19/24);x.strokeStyle=n.color;x.lineWidth=1.9;x.lineCap=x.lineJoin='round';x.stroke(new Path2D(ICONS[n.icon]||ICONS.flag));x.restore();
    const kk=q('.n-kicker');x.font=`500 9.5px ${mono}`;sp('0.85px');x.fillStyle=muted;
    const kt='STAGE '+String(ranks[n.id]).padStart(2,'0');x.fillText(kt,X+kk.offsetLeft,Y+kk.offsetTop+2);
    if(n.goal){x.fillStyle=n.color;x.fillText(' · GOAL',X+kk.offsetLeft+x.measureText(kt).width,Y+kk.offsetTop+2)}sp('0px');
    const tt=q('.n-title');x.font=`600 15px ${sans}`;x.fillStyle=ink;wrap(n.title||'Untitled',X+tt.offsetLeft,Y+tt.offsetTop,tt.offsetWidth,20,15);
    const de=q('.n-desc');x.font=`400 12px ${sans}`;x.fillStyle=ink2;if(n.desc)wrap(n.desc,X+de.offsetLeft,Y+de.offsetTop,de.offsetWidth,17,12);
    el.querySelectorAll('.n-tags span').forEach(t=>{
      x.fillStyle=n.color;x.globalAlpha=.11;rr(X+t.offsetLeft,Y+t.offsetTop,t.offsetWidth,t.offsetHeight,6);x.fill();x.globalAlpha=1;
      x.font=`500 10.5px ${sans}`;x.fillText(t.textContent,X+t.offsetLeft+7,Y+t.offsetTop+4);
    });
    const ft=q('.n-foot');x.strokeStyle=line;x.setLineDash([3,3]);x.beginPath();x.moveTo(X+ft.offsetLeft,Y+ft.offsetTop+.5);x.lineTo(X+ft.offsetLeft+ft.offsetWidth,Y+ft.offsetTop+.5);x.stroke();x.setLineDash([]);
    const fy=Y+ft.offsetTop+ft.offsetHeight-13;
    x.font=`600 12px ${mono}`;x.fillStyle=ink;const vt=fmt(n.visitors);x.fillText(vt,X+ft.offsetLeft,fy-1);
    const vw=x.measureText(vt).width;x.font=`400 11px ${sans}`;x.fillStyle=muted;x.fillText(' people',X+ft.offsetLeft+vw,fy);
    const mt=MOODS[n.mood-1],mw=x.measureText(mt).width,rx=X+ft.offsetLeft+ft.offsetWidth;
    x.fillText(mt,rx-mw,fy);x.fillStyle=MOODC[n.mood-1];x.beginPath();x.arc(rx-mw-8,fy+5.5,3.5,0,7);x.fill();
  }
  c.toBlob(bl=>{if(bl){download(bl,slug()+'.png');toast('PNG exported')}else toast('Export failed')},'image/png');
}

/* ---------------- boot ---------------- */
let saved=null;
try{saved=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(saved?.dark??matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');
if(saved?.noflow)document.body.classList.add('noflow');
if(saved?.hint)$('#hint').hidden=true;
if(innerWidth<=760)document.body.classList.add('insp-off');
try{doc=saved?.doc?normalize(saved.doc):sample()}catch(e){doc=sample()}
hist=[JSON.stringify(doc)];hi=0;updUndo();
renderAll();
if(saved?.view&&isFinite(saved.view.k)&&saved.doc){view={x:+saved.view.x||0,y:+saved.view.y||0,k:clamp(+saved.view.k||1,.25,2)};applyView()}else fit(false);
const hadView=!!(saved?.view&&saved.doc);
document.fonts?.ready.then(()=>{nodeEls.forEach(el=>el._h=null);renderAll();if(!hadView)fit(false)});
})();
</script>
