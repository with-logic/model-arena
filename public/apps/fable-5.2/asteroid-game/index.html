<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOIDBREAKER — Asteroid Belt Dogfight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --cy:#5adcff; --or:#ffaa3c; --gr:#96ff78; --rd:#ff5a6e; --ink:#05070d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:#dfe9ff;
    font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,2vh,22px);padding:16px;z-index:5;transition:opacity .35s ease;overflow-y:auto}
  .overlay.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
  #menu{background:radial-gradient(ellipse at center,rgba(5,7,13,.35) 0%,rgba(5,7,13,.86) 80%)}
  #over,#pause{background:rgba(4,6,12,.72);backdrop-filter:blur(4px)}
  h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(34px,7.5vw,92px);letter-spacing:.14em;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#9eeaff 38%,#2b8fd6 70%,#7b4dff 100%);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 22px rgba(90,220,255,.45));text-align:center;padding-left:.14em}
  .sub{font-family:'Orbitron',sans-serif;font-weight:500;letter-spacing:.5em;font-size:clamp(10px,1.5vw,15px);color:#8fb4d8;text-align:center;padding-left:.5em}
  .cards{display:flex;gap:clamp(8px,1.6vw,20px);flex-wrap:wrap;justify-content:center}
  .card{width:clamp(150px,20vw,220px);padding:12px 14px 14px;border:1px solid rgba(140,180,230,.22);border-radius:14px;
    background:linear-gradient(180deg,rgba(22,30,48,.82),rgba(10,14,24,.82));cursor:pointer;position:relative;
    transition:transform .18s ease,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px)}
  .card.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 34px -6px var(--ac),inset 0 0 30px -18px var(--ac);transform:translateY(-5px)}
  .card canvas{width:100%;height:clamp(70px,13vh,120px);display:block}
  .card .nm{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.16em;font-size:16px;color:var(--ac)}
  .card .rl{font-size:13px;color:#9fb0cc;margin:1px 0 8px;font-weight:600;letter-spacing:.04em}
  .stat{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;color:#7f90ad;font-weight:700;margin-top:4px}
  .stat span{width:44px}
  .stat i{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;display:block}
  .stat b{display:block;height:100%;background:var(--ac);border-radius:3px;box-shadow:0 0 8px var(--ac)}
  .card .key{position:absolute;top:10px;right:12px;font-family:'Orbitron';font-size:10px;color:#6c7c98;border:1px solid #33405a;border-radius:4px;padding:1px 5px}
  .btn{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.3em;font-size:clamp(13px,1.6vw,17px);padding:14px 34px 14px 40px;
    color:#04121c;background:linear-gradient(180deg,#b9f1ff,#48c8f5);border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 0 34px -4px rgba(90,220,255,.8);transition:transform .15s,filter .15s;animation:pulse 2.2s ease-in-out infinite}
  .btn:hover{transform:scale(1.05);filter:brightness(1.12)}
  .btn.ghost{background:transparent;color:#bcd3f0;border:1px solid rgba(160,190,230,.4);box-shadow:none;animation:none}
  @keyframes pulse{50%{box-shadow:0 0 52px 0 rgba(90,220,255,.95)}}
  .keys{display:grid;grid-template-columns:repeat(4,auto);gap:6px 22px;font-size:14px;color:#93a6c6;font-weight:600;letter-spacing:.03em}
  .keys div{display:flex;align-items:center;gap:7px;white-space:nowrap}
  kbd{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:#d7e6ff;border:1px solid #3d4d6c;border-bottom-width:2px;border-radius:5px;
    padding:2px 6px;background:rgba(30,40,62,.8)}
  .best{font-family:'Orbitron';font-size:12px;letter-spacing:.3em;color:#6f86a8}
  h2{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(30px,6vw,64px);letter-spacing:.2em;color:#ff6b7c;
    text-shadow:0 0 30px rgba(255,90,110,.6);padding-left:.2em;text-align:center}
  #pause h2{color:#9eeaff;text-shadow:0 0 30px rgba(90,220,255,.6)}
  .results{display:grid;grid-template-columns:repeat(4,minmax(90px,auto));gap:10px 34px;text-align:center}
  .results div{font-size:12px;letter-spacing:.24em;color:#7f90ad;font-weight:700}
  .results b{display:block;font-family:'Orbitron';font-size:clamp(20px,3vw,32px);color:#fff;letter-spacing:.05em;margin-top:2px}
  .newbest{font-family:'Orbitron';letter-spacing:.3em;color:#ffd35a;font-size:14px;text-shadow:0 0 14px rgba(255,210,90,.7);min-height:18px}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #touch{position:fixed;right:14px;bottom:14px;z-index:4;display:none;grid-template-columns:repeat(2,auto);gap:12px;align-items:end;justify-items:end}
  #touch button{width:68px;height:68px;border-radius:50%;border:1.5px solid rgba(140,200,255,.5);background:rgba(20,34,58,.45);
    color:#cfe7ff;font-family:'Orbitron';font-size:10px;font-weight:700;letter-spacing:.1em}
  #touch button#tFire{width:92px;height:92px;border-color:rgba(255,120,130,.7);color:#ffd0d5}
  #touch button:active{background:rgba(90,220,255,.35)}
  @media (max-width:720px){.keys{grid-template-columns:repeat(2,auto)} .results{grid-template-columns:repeat(2,auto)}}
  @media (max-height:640px){.keys{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <div>
    <h1>VOIDBREAKER</h1>
    <div class="sub" style="margin-top:10px">ASTEROID BELT DOGFIGHT</div>
  </div>
  <div class="cards" id="cards"></div>
  <button class="btn" id="launch">LAUNCH</button>
  <div class="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows — fly</div>
    <div><kbd>SPACE</kbd> fire</div>
    <div><kbd>SHIFT</kbd> afterburner</div>
    <div><kbd>E</kbd> homing missile</div>
    <div><kbd>MOUSE L</kbd> aim + fire</div>
    <div><kbd>MOUSE R</kbd> aim + thrust</div>
    <div><kbd>P</kbd> pause</div>
    <div><kbd>M</kbd> mute</div>
  </div>
  <div class="best" id="menuBest"></div>
</div>

<div id="over" class="overlay hidden">
  <h2>SHIP LOST</h2>
  <div class="newbest" id="newBest"></div>
  <div class="results">
    <div>SCORE<b id="rScore">0</b></div>
    <div>WAVE<b id="rWave">1</b></div>
    <div>KILLS<b id="rKills">0</b></div>
    <div>ACCURACY<b id="rAcc">0%</b></div>
  </div>
  <div class="row">
    <button class="btn" id="retry">RETRY</button>
    <button class="btn ghost" id="hangar">HANGAR</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <h2>PAUSED</h2>
  <div class="sub">PRESS P TO RESUME</div>
  <div class="row" style="margin-top:10px">
    <button class="btn" id="resume">RESUME</button>
    <button class="btn ghost" id="quit">HANGAR</button>
  </div>
</div>

<div id="touch">
  <button id="tBoost">BOOST</button><button id="tMsl">MSL</button>
  <span></span><button id="tFire">FIRE</button>
</div>

<script>
(() => {
'use strict';
/* ============================================================
   VOIDBREAKER — single-file canvas space shooter
   ============================================================ */
const TAU = Math.PI * 2;
const WORLD = 4000;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W = 1280, H = 720, DPR = 1, zoom = 1, VW = 1280, VH = 720;

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (v, m) => ((v % m) + m) % m;
const wrap = v => mod(v, WORLD);
const wd = d => mod(d + WORLD / 2, WORLD) - WORLD / 2;            // shortest wrapped delta
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };

function resize() {
  W = window.innerWidth || 1280; H = window.innerHeight || 720;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  zoom = clamp(Math.sqrt(W * H) / 1000, 0.5, 1.3);
  zoom = Math.max(zoom, Math.max(W, H) / (WORLD - 700));
  VW = W / zoom; VH = H / zoom;
}
window.addEventListener('resize', resize); resize();

/* ---------------- audio ---------------- */
const A = {
  ac: null, master: null, music: null, nbuf: null, thr: null, muted: false, last: {}, step: 0, nextT: 0,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = this.ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.55; this.master.connect(comp);
      this.music = ac.createGain(); this.music.gain.value = 0.5; this.music.connect(this.master);
      const len = ac.sampleRate; this.nbuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = this.nbuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = this.nbuf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 220; f.Q.value = 0.7;
      const g = ac.createGain(); g.gain.value = 0; src.connect(f); f.connect(g); g.connect(this.master); src.start();
      this.thr = { g, f };
    } catch (e) { this.ac = null; }
  },
  ok(name, gap) {
    if (!this.ac || this.muted) return false;
    if (name) { const t = this.ac.currentTime; if (t - (this.last[name] || -1) < gap) return false; this.last[name] = t; }
    return true;
  },
  tone(f1, f2, dur, type, vol, delay, dest) {
    const ac = this.ac, t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, f1, f2, delay, ftype, dest) {
    const ac = this.ac, t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = this.nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = ftype || 'lowpass';
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master); s.start(t, Math.random() * 0.9); s.stop(t + dur + 0.03);
  },
  play(name, p) {
    switch (name) {
      case 'shoot': if (this.ok('shoot', 0.05)) { this.tone(p || 880, 180, 0.11, 'square', 0.06); this.tone((p || 880) * 1.5, 300, 0.07, 'sawtooth', 0.03); } break;
      case 'scatter': if (this.ok('shoot', 0.05)) { this.noise(0.16, 0.22, 3200, 300); this.tone(240, 70, 0.14, 'sawtooth', 0.09); } break;
      case 'eshoot': if (this.ok('eshoot', 0.07)) this.tone(520, 140, 0.13, 'sawtooth', 0.035); break;
      case 'rail': if (this.ok('rail', 0.1)) { this.tone(1800, 90, 0.35, 'sawtooth', 0.12); this.noise(0.25, 0.18, 6000, 400); } break;
      case 'charge': if (this.ok('charge', 0.3)) this.tone(180, 1300, 1.05, 'sine', 0.05); break;
      case 'hit': if (this.ok('hit', 0.04)) this.noise(0.06, 0.12, 2400, 600); break;
      case 'shield': if (this.ok('shield', 0.06)) { this.tone(1300, 500, 0.16, 'sine', 0.12); this.noise(0.08, 0.08, 5000, 1500); } break;
      case 'hurt': if (this.ok('hurt', 0.06)) { this.noise(0.25, 0.35, 900, 90); this.tone(140, 45, 0.25, 'square', 0.13); } break;
      case 'boom': if (this.ok('boom', 0.05)) { this.noise(0.45, 0.4, 1500, 70); this.tone(130, 32, 0.4, 'sine', 0.32); } break;
      case 'bigboom': if (this.ok('bigboom', 0.08)) { this.noise(1.3, 0.7, 2400, 40); this.tone(95, 22, 1.1, 'sine', 0.55); this.noise(0.5, 0.3, 500, 60, 0.18); } break;
      case 'rock': if (this.ok('rock', 0.05)) { this.noise(0.28, 0.3, 700 + (p || 0), 80); } break;
      case 'pickup': if (this.ok('pickup', 0.05)) { this.tone(660, 660, 0.09, 'triangle', 0.14); this.tone(990, 990, 0.09, 'triangle', 0.14, 0.08); this.tone(1320, 1320, 0.18, 'triangle', 0.14, 0.16); } break;
      case 'missile': if (this.ok('missile', 0.08)) { this.noise(0.5, 0.22, 500, 3500); this.tone(200, 620, 0.4, 'sawtooth', 0.05); } break;
      case 'boost': if (this.ok('boost', 0.3)) this.noise(0.45, 0.2, 300, 2600); break;
      case 'wave': if (this.ok('wave', 0.2)) { [392, 523, 659, 784].forEach((f, i) => this.tone(f, f, 0.28, 'triangle', 0.11, i * 0.09)); } break;
      case 'alarm': if (this.ok('alarm', 0.5)) { for (let i = 0; i < 4; i++) this.tone(440, 660, 0.22, 'square', 0.07, i * 0.3); } break;
      case 'warp': if (this.ok('warp', 0.1)) this.tone(90, 700, 0.4, 'sine', 0.08); break;
      case 'nova': if (this.ok('nova', 0.1)) { this.tone(60, 900, 0.6, 'sawtooth', 0.18); this.noise(1.0, 0.5, 5000, 80, 0.1); } break;
      case 'ui': if (this.ok('ui', 0.03)) this.tone(740, 980, 0.07, 'triangle', 0.1); break;
      case 'life': if (this.ok('life', 0.2)) { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, f, 0.2, 'square', 0.06, i * 0.07)); } break;
    }
  },
  setThrust(level, boost) {
    if (!this.thr || !this.ac) return;
    const t = this.ac.currentTime;
    this.thr.g.gain.setTargetAtTime(this.muted ? 0 : level * (boost ? 0.28 : 0.14), t, 0.06);
    this.thr.f.frequency.setTargetAtTime(boost ? 520 : 200, t, 0.1);
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.55; },
  tick(intense, boss) {
    const ac = this.ac; if (!ac || this.muted || ac.state !== 'running') return;
    const now = ac.currentTime, sd = 60 / (boss ? 132 : 116) / 4;
    if (this.nextT < now) this.nextT = now + 0.05;
    while (this.nextT < now + 0.2) {
      const s = this.step % 16, bar = Math.floor(this.step / 16) % 4, d = this.nextT - now;
      const root = [55, 55, 43.65, 49][bar];
      if ([0, 3, 6, 8, 11, 14].includes(s)) this.tone(root, root, 0.2, 'sawtooth', 0.0, d, this.music), this.bass(root, d);
      if (intense) {
        if (s % 4 === 0) this.tone(120, 38, 0.16, 'sine', 0.4, d, this.music);
        if (s % 4 === 2) this.noise(0.04, 0.05, 7000, 5000, d, 'highpass', this.music);
        if (s % 2 === 0 || boss) { const n = [1, 1.189, 1.498, 2, 1.498, 1.189, 1.782, 1.498][(this.step * 3) % 8]; this.tone(root * 4 * n, root * 4 * n, 0.14, 'triangle', 0.05, d, this.music); }
      } else if (s === 0) { [1, 1.498, 2.378].forEach(n => this.tone(root * 4 * n, root * 4 * n, sd * 15, 'sine', 0.035, d, this.music)); }
      this.nextT += sd; this.step++;
    }
  },
  bass(f, d) {
    const ac = this.ac, t = ac.currentTime + d;
    const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.setValueAtTime(520, t); fl.frequency.exponentialRampToValueAtTime(110, t + 0.2);
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
    o.connect(fl); fl.connect(g); g.connect(this.music); o.start(t); o.stop(t + 0.27);
  }
};

/* ---------------- sprites ---------------- */
const glowCache = {};
function glowSprite(col) {
  let c = glowCache[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${col},1)`); gr.addColorStop(0.25, `rgba(${col},.55)`); gr.addColorStop(0.6, `rgba(${col},.14)`); gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[col] = c;
}
function drawGlow(col, x, y, size, alpha) {
  if (alpha <= 0.004) return;
  ctx.globalAlpha = alpha > 1 ? 1 : alpha;
  ctx.drawImage(glowSprite(col), x - size / 2, y - size / 2, size, size);
}

// background
const starLayers = [
  { f: 0.10, n: 90, s: 1.0, a: 0.45 }, { f: 0.22, n: 60, s: 1.5, a: 0.7 }, { f: 0.42, n: 28, s: 2.2, a: 0.95 }
].map(L => ({ ...L, stars: Array.from({ length: L.n }, () => ({ x: rand(0, 1000), y: rand(0, 1000), k: rand(0.5, 1), c: pick(['255,255,255', '190,220,255', '255,225,190', '200,190,255']) })) }));
const nebulae = [];
(function () {
  const cols = ['60,90,220', '140,60,200', '20,140,170', '200,60,110', '50,70,160', '110,50,170', '30,110,150'];
  for (let i = 0; i < 9; i++) nebulae.push({ x: rand(0, 2600), y: rand(0, 2600), s: rand(700, 1300), c: cols[i % cols.length], a: rand(0.1, 0.2) });
})();
let planetSpr = null;
function makePlanet() {
  const c = document.createElement('canvas'); c.width = 520; c.height = 520; const g = c.getContext('2d');
  g.translate(260, 260);
  const halo = g.createRadialGradient(0, 0, 120, 0, 0, 200); halo.addColorStop(0, 'rgba(90,150,255,.35)'); halo.addColorStop(1, 'rgba(90,150,255,0)');
  g.fillStyle = halo; g.fillRect(-260, -260, 520, 520);
  // back half of ring
  g.save(); g.rotate(-0.35); g.scale(1, 0.26); g.strokeStyle = 'rgba(190,170,240,.3)'; g.lineWidth = 26; g.beginPath(); g.arc(0, 0, 215, Math.PI, TAU); g.stroke(); g.restore();
  g.save(); g.beginPath(); g.arc(0, 0, 130, 0, TAU); g.clip();
  const gr = g.createRadialGradient(-50, -55, 10, 0, 0, 150); gr.addColorStop(0, '#7fb0ff'); gr.addColorStop(0.45, '#3a4fae'); gr.addColorStop(1, '#0a0d24');
  g.fillStyle = gr; g.fillRect(-140, -140, 280, 280);
  for (let i = 0; i < 9; i++) { g.fillStyle = `rgba(${i % 2 ? '180,210,255' : '30,30,90'},${rand(0.05, 0.14)})`; g.beginPath(); g.ellipse(rand(-30, 30), -120 + i * 28 + rand(-6, 6), 170, rand(5, 13), -0.25, 0, TAU); g.fill(); }
  const sh = g.createRadialGradient(-60, -60, 60, 30, 30, 190); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,8,.88)');
  g.fillStyle = sh; g.fillRect(-140, -140, 280, 280); g.restore();
  g.save(); g.rotate(-0.35); g.scale(1, 0.26);
  g.strokeStyle = 'rgba(200,180,250,.42)'; g.lineWidth = 26; g.beginPath(); g.arc(0, 0, 215, 0, Math.PI); g.stroke();
  g.strokeStyle = 'rgba(255,240,255,.35)'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 196, 0, Math.PI); g.stroke(); g.restore();
  planetSpr = c;
}
makePlanet();

/* ---------------- ship art ---------------- */
function poly(g, p) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); }

    el.innerHTML = `<span class="key">${i + 1}</span><canvas></canvas><div class="nm">${c.name}</div><div class="rl">${c.role}</div>` +

$('retry').addEventListener('click', startGame);
$('hangar').addEventListener('click', toMenu);
$('resume').addEventListener('click', () => setPause(false));
$('quit').addEventListener('click', toMenu);

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.034, (now - last) / 1000); last = now; if (!(dt > 0)) dt = 0.016;
  timeScale += (1 - timeScale) * Math.min(1, dt * 1.6);
  if (!paused) update(dt * timeScale);
  render();
  if (state === 'menu') drawPreviews();
  if (!paused) A.tick(state === 'play', enemies.some(e => e.type === 'boss'));
}
buildCards(); toMenu();
window.__vb = { get player() { return player; }, get enemies() { return enemies; }, get wave() { return wave; }, get state() { return state; }, damageEnemy };
requestAnimationFrame(frame);
})();
</script>
