<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fun Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1b45; --paper:#fffaf0; --yellow:#ffd23f; --pink:#ff5fa2; --blue:#38b6ff; --green:#3fcf7a; --orange:#ff8a3d;
    --font:'Fredoka','Baloo 2','Arial Rounded MT Bold','Nunito','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#38b6ff;font-family:var(--font);color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- HUD ---------- */
  .hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
    pointer-events:none;z-index:5;gap:10px}
  .pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 12px;
    box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:8px;font-weight:700;line-height:1}
  .pill small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;font-weight:600}
  .pill b{font-size:26px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
  .pill.best b{font-size:18px}
  .pill svg{width:22px;height:22px;flex:none}
  .left,.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .right{justify-content:flex-end}
  #scorePill.bump{animation:bump .35s}
  @keyframes bump{30%{transform:scale(1.18) rotate(-3deg)}100%{transform:none}}
  .iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);
    box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .08s, box-shadow .08s;color:var(--ink)}
  .iconbtn:hover{background:#ffe066}
  .iconbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  .iconbtn:focus-visible,.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
  .iconbtn svg{width:22px;height:22px}
  #speedPill{font-size:14px;padding:6px 12px;background:#d8fff0}
  #speedPill b{font-size:15px;min-width:0}

  /* ---------- Overlays ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;
    transition:opacity .25s, visibility .25s}
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  #menu{flex-direction:column;cursor:pointer;justify-content:flex-start;padding-top:min(11vh,90px)}
  .title{display:flex;gap:.02em;font-weight:700;font-size:clamp(52px,12vw,124px);line-height:1;letter-spacing:.01em;
    filter:drop-shadow(0 8px 0 rgba(43,27,69,.25))}
  .title span{display:inline-block;-webkit-text-stroke:clamp(8px,1.4vw,14px) var(--ink);paint-order:stroke fill;
    animation:hop 1.3s cubic-bezier(.3,.6,.4,1) infinite;transform-origin:50% 100%}
  .title span.sp{width:.28em}
  @keyframes hop{0%,55%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.12,.86)}
    28%{transform:translateY(-.22em) scale(.94,1.08) rotate(-4deg)}46%{transform:translateY(0) scale(1.08,.92)}}
  .tag{margin-top:14px;font-size:clamp(15px,2.4vw,21px);font-weight:600;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-align:center}
  .btn{pointer-events:auto;font-family:inherit;font-weight:700;font-size:clamp(22px,3.4vw,30px);color:var(--ink);
    background:linear-gradient(#ffe36b,#ffc61a);border:4px solid var(--ink);border-radius:22px;padding:14px 38px;
    box-shadow:0 8px 0 var(--ink);cursor:pointer;transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;gap:12px}
  .btn:hover{background:linear-gradient(#fff08f,#ffd23f)}
  .btn:active{transform:translateY(8px);box-shadow:0 0 0 var(--ink)}
  .btn svg{width:26px;height:26px}
  #playBtn{margin-top:26px;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06) rotate(-1.5deg)}}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:680px}
  .chip{background:rgba(255,250,240,.94);border:3px solid var(--ink);border-radius:14px;padding:7px 13px;font-weight:600;font-size:15px;
    box-shadow:0 3px 0 var(--ink)}
  .chip kbd{font-family:inherit;background:var(--ink);color:#fff;border-radius:7px;padding:1px 8px;margin-right:5px;font-size:13px}

  .card{background:var(--paper);border:5px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 var(--ink), 0 30px 60px rgba(20,10,50,.35);
    padding:26px 34px 30px;text-align:center;width:min(420px,100%);pointer-events:auto;position:relative}
  #over .card{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
  .card h2{font-size:42px;line-height:1;color:var(--pink);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;margin-bottom:6px}
  .card p.quip{font-weight:600;font-size:16px;opacity:.75;margin-bottom:14px;min-height:1.3em}
  .big{font-size:76px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .biglabel{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.55}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 20px}
  .stat{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 4px}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.6}
  .stat:nth-child(1){background:#fff3c4}.stat:nth-child(2){background:#d8fff0}.stat:nth-child(3){background:#ffe0ee}
  #newBest{position:absolute;top:-22px;right:-18px;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:14px;
    padding:6px 12px;font-weight:700;font-size:17px;transform:rotate(9deg);box-shadow:0 5px 0 var(--ink);animation:wig .5s ease-in-out infinite alternate}
  #newBest.hidden{display:none}
  @keyframes wig{to{transform:rotate(14deg) scale(1.08)}}
  .sub{margin-top:14px;font-size:13px;font-weight:600;opacity:.55}
  #pause .card h2{color:var(--blue)}
  #hint{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;pointer-events:none;
    background:rgba(255,250,240,.95);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;font-size:16px;
    box-shadow:0 4px 0 var(--ink);transition:opacity .4s;white-space:nowrap}
  #hint.hidden{opacity:0}
  @media (max-width:560px){
    .pill b{font-size:21px}.pill.best b{font-size:15px}.iconbtn{width:40px;height:40px}
    #speedPill{display:none}.card{padding:22px 20px 24px}.big{font-size:62px}
  }
  @media (prefers-reduced-motion:reduce){.title span,#playBtn,#newBest{animation:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Fun Game play area"></canvas>

<div class="hud" id="hud">
  <div class="left">
    <div class="pill" id="scorePill" aria-live="off">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffd23f" stroke="#2b1b45" stroke-width="2" stroke-linejoin="round"/></svg>
      <b id="score">0</b>
    </div>
    <div class="pill" id="speedPill"><small>Speed</small><b id="speed">x1.0</b></div>
  </div>
  <div class="right">
    <div class="pill best"><small>Best</small><b id="best">0</b></div>
    <button class="iconbtn" id="muteBtn" aria-label="Toggle sound" title="Sound (M)"></button>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="menu">
  <h1 class="title" aria-label="Fun Game">
    <span style="color:#ff5fa2">F</span><span style="color:#ffd23f;animation-delay:.09s">u</span><span style="color:#3fcf7a;animation-delay:.18s">n</span><span class="sp"></span><span style="color:#38b6ff;animation-delay:.27s">G</span><span style="color:#ff8a3d;animation-delay:.36s">a</span><span style="color:#b57bff;animation-delay:.45s">m</span><span style="color:#ff5fa2;animation-delay:.54s">e</span>
  </h1>
  <p class="tag">Hop over the grumpy stuff. Grab stars. Don't go bonk.</p>
  <button class="btn" id="playBtn">
    <svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>Play
  </button>
  <div class="chips">
    <div class="chip"><kbd>Space</kbd>or tap to jump</div>
    <div class="chip"><kbd>Hold</kbd>jump higher</div>
    <div class="chip"><kbd>Again</kbd>double jump in mid-air</div>
  </div>
</div>

<div class="overlay hidden" id="over" style="pointer-events:none">
  <div class="card" role="dialog" aria-label="Game over">
    <div id="newBest" class="hidden">NEW BEST!</div>
    <h2 id="overTitle">Bonk!</h2>
    <p class="quip" id="quip"></p>
    <div class="biglabel">Score</div>
    <div class="big" id="finalScore">0</div>
    <div class="stats">
      <div class="stat"><b id="stStars">0</b><span>Stars</span></div>
      <div class="stat"><b id="stJumps">0</b><span>Dodged</span></div>
      <div class="stat"><b id="stBest">0</b><span>Best</span></div>
    </div>
    <button class="btn" id="retryBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 3.5V8h4.5"/></svg>Retry
    </button>
    <div class="sub">or press Space / Enter</div>
  </div>
</div>

<div class="overlay hidden" id="pause">
  <div class="card">
    <h2>Paused</h2>
    <p class="quip">Bloop is catching their breath.</p>
    <button class="btn" id="resumeBtn">
      <svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>Resume
    </button>
  </div>
</div>

<div id="hint" class="hidden">Tap or press Space to jump!</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const INK = '#2b1b45';
const FONT = "'Fredoka','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- helpers ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
function hsh(i, seed) { const x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453; return x - Math.floor(x); }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRgb(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function rgbStr(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fs(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || 3; ctx.strokeStyle = INK; ctx.stroke(); }

/* ---------------- sizing ---------------- */
let W = 960, H = 540, scale = 1, dpr = 1, GY = 430, PX = 160, maxSpeed = 900;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  scale = ch / 540; W = cw / scale;
  if (W < 700) { W = 700; scale = cw / W; }
  H = ch / scale;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  GY = H - Math.max(110, H * 0.2);
  PX = clamp(W * 0.19, 120, 190);
  maxSpeed = clamp(W * 0.95, 640, 900);
}
window.addEventListener('resize', resize);
resize();

/* ---------------- audio ---------------- */
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('funGame.muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      AC = new C(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.9;
      const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    } catch (e) { AC = null; return; }
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, t0, dur, type, vol, f2, curve) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  if (curve) { for (const [ff, tt] of curve) o.frequency.exponentialRampToValueAtTime(ff, t0 + tt); }
  else if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
}
let noiseBuf = null;
function noise(t0, dur, vol, freq, type) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 800;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.02);
}
const sfx = {
  jump() { if (!AC) return; const t = AC.currentTime; tone(420, t, 0.24, 'sine', 0.3, 0, [[250, 0.045], [760, 0.22]]); tone(210, t, 0.16, 'triangle', 0.12, 0, [[125, 0.045], [380, 0.15]]); },
  djump() { if (!AC) return; const t = AC.currentTime; tone(600, t, 0.2, 'square', 0.09, 0, [[1250, 0.08], [900, 0.12], [1500, 0.19]]); tone(300, t, 0.2, 'sine', 0.2, 900); },
  land() { if (!AC) return; const t = AC.currentTime; noise(t, 0.07, 0.22, 500); tone(130, t, 0.09, 'sine', 0.25, 55); },
  star(n) { if (!AC) return; const t = AC.currentTime, f = 880 * Math.pow(1.122, Math.min(n, 10)); tone(f, t, 0.12, 'triangle', 0.22); tone(f * 1.5, t + 0.06, 0.2, 'triangle', 0.2); },
  pass() { if (!AC) return; const t = AC.currentTime; tone(520, t, 0.07, 'sine', 0.14, 900); },
  click() { if (!AC) return; const t = AC.currentTime; tone(700, t, 0.1, 'sine', 0.22, 1400); },
  milestone() { if (!AC) return; const t = AC.currentTime;[523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.07, 0.18, 'square', 0.08)); tone(1568, t + 0.3, 0.3, 'triangle', 0.12); },
  hat() { if (!AC) return; const t = AC.currentTime; tone(300, t, 0.35, 'sine', 0.2, 1600); tone(1600, t + 0.33, 0.15, 'triangle', 0.15, 2000); },
  hit() {
    if (!AC) return; const t = AC.currentTime;
    tone(220, t, 0.18, 'square', 0.22, 50); noise(t, 0.16, 0.4, 1200);           // BONK
    tone(1300, t + 0.14, 0.55, 'sine', 0.2, 180);                                 // slide whistle
    // sad trombone
    const notes = [[311, 0.28], [294, 0.28], [277, 0.28], [262, 0.8]]; let tt = t + 0.75;
    for (const [f, d] of notes) {
      const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(f * 1.03, tt); o.frequency.linearRampToValueAtTime(f * 0.94, tt + d);
      lp.type = 'lowpass'; lp.Q.value = 4; lp.frequency.setValueAtTime(500, tt); lp.frequency.linearRampToValueAtTime(1300, tt + d * 0.3); lp.frequency.linearRampToValueAtTime(380, tt + d);
      g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.16, tt + 0.03); g.gain.setValueAtTime(0.16, tt + d * 0.7); g.gain.linearRampToValueAtTime(0.0001, tt + d);
      if (d > 0.5) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 6; lg.gain.value = 7; l.connect(lg); lg.connect(o.frequency); l.start(tt); l.stop(tt + d); }
      o.connect(lp); lp.connect(g); g.connect(master); o.start(tt); o.stop(tt + d + 0.02); tt += d + 0.02;
    }
  },
  best() { if (!AC) return; const t = AC.currentTime + 2.1;[523, 523, 523, 698, 880, 1047].forEach((f, i) => tone(f, t + [0, .1, .2, .3, .45, .6][i], i === 5 ? 0.5 : 0.14, 'square', 0.08)); }
};
/* bouncy background tune */
const _ = 0;
const MEL = [72, _, 76, 79, _, 76, 72, _, 74, _, 77, 81, _, 77, 74, _, 71, _, 74, 79, _, 74, 71, _, 72, 76, 79, 84, _, 79, 76, _];
const BASS = [48, _, 55, _, 48, _, 55, _, 50, _, 57, _, 50, _, 57, _, 43, _, 50, _, 43, _, 50, _, 48, _, 55, _, 48, 55, 52, 50];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let mStep = 0, mNext = 0;
function musicTick() {
  if (!AC || muted || state !== 'play' || paused) return;
  const now = AC.currentTime;
  if (mNext < now) mNext = now + 0.05;
  const bpm = 116 + clamp((speed - 380) / 520, 0, 1) * 54, sd = 60 / bpm / 2;
  while (mNext < now + 0.14) {
    const i = mStep % 32;
    if (MEL[i]) tone(mtof(MEL[i]), mNext, sd * 0.9, 'square', 0.028);
    if (BASS[i]) tone(mtof(BASS[i]), mNext, sd * 1.5, 'triangle', 0.1);
    if (i % 2 === 1) noise(mNext, 0.03, 0.035, 7000, 'highpass');
    mNext += sd; mStep++;
  }
}

/* ---------------- state ---------------- */
let state = 'menu', paused = false;
let time = 0, dayT = 0.04, dist = 0, speed = 220, elapsed = 0, runDist = 0;
let score = 0, bonus = 0, shown = -1, best = 0, starsGot = 0, dodged = 0, combo = 0, comboT = 0;
let obstacles = [], stars = [], parts = [], pops = [];
let spawnIn = 600, freeze = 0, shake = 0, flash = 0, overT = 0, hintT = 0, firstRun = true, highBeeHints = 0, lastMilestone = 0, hatLevel = 0, menuHop = 1.5;
try { best = parseInt(localStorage.getItem('funGame.best') || '0', 10) || 0; } catch (e) {}
const G = 2600, JUMP = 900, DJUMP = 800;
const player = { y: 0, vy: 0, ground: true, jumps: 0, s: 0, sv: 0, runT: 0, rot: 0, dead: false, blink: 0, coyote: 0, buffer: 0, held: false, hat: 0, dustT: 0 };

function resetGame() {
  obstacles = []; stars = []; pops = []; parts = [];
  elapsed = 0; runDist = 0; score = 0; bonus = 0; shown = -1; starsGot = 0; dodged = 0; combo = 0; lastMilestone = 0; hatLevel = 0;
  spawnIn = 700; freeze = 0; shake = 0; overT = 0; speed = 380;
  Object.assign(player, { y: 0, vy: 0, ground: true, jumps: 0, s: 0, sv: 0, rot: 0, dead: false, buffer: 0, held: false, hat: 0 });
  state = 'play'; paused = false; mStep = 0;
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');

      ctx.beginPath(); ctx.moveTo(20, -4); ctx.lineTo(32, 0); ctx.lineTo(20, 5); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
      ell(0, 0, 23, 16, 0); fs('#ffd23f', 3.5);
      ctx.save(); ell(0, 0, 23, 16, 0); ctx.clip(); ctx.fillStyle = INK; ctx.fillRect(0, -18, 7, 36); ctx.fillRect(12, -18, 7, 36); ctx.restore();
      eye(-13, -3, 6.5, -0.8, 0.2); eye(-2, -2, 5.5, -0.8, 0.2);
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-21, -12); ctx.lineTo(-9, -8); ctx.moveTo(4, -10); ctx.lineTo(-5, -7); ctx.stroke();
      ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(-11, 10, 4, 1.2 * Math.PI, 1.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14, -13); ctx.quadraticCurveTo(-20, -24, -26, -22); ctx.stroke(); circ(-26, -22, 2.5); ctx.fillStyle = INK; ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------------- render ---------------- */
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake) * 0.6);
  drawSky();
  drawClouds(0.03, 360, 5, 0.7, 0.75);
  drawMountains(0.06, 300, 250, '#b9c4f5', true, 11);
  drawMountains(0.12, 250, 170, '#8f9be8', false, 13);
  drawClouds(0.09, 430, 7, 1.05, 0.95);
  drawHills(0.22, 62, 26, 0.006, '#8fe0a0', 1);
  drawTrees(0.34, 210, 51, 0.62);
  drawHills(0.4, 26, 16, 0.009, '#63d184', 2);
  drawTrees(0.6, 260, 61, 1);
  drawGround();
  for (const s of stars) {
    const y = GY - s.y + Math.sin(time * 4 + s.seed) * 5;
    ctx.fillStyle = 'rgba(255,240,150,.35)'; circ(s.x, y, 20); ctx.fill();
    drawStar(s.x, y, 15, Math.sin(time * 3 + s.seed) * 0.3, '#ffd23f', 3);
    ctx.fillStyle = '#fff'; circ(s.x - 4, y - 4, 2.5); ctx.fill();
  }
  for (const o of obstacles) drawObstacle(o);
  drawPlayer();
  for (const q of parts) {
    const k = 1 - q.life / q.max; ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = q.color;
    if (q.type === 'c') { circ(q.x, q.y, q.r * (0.5 + (1 - k) * 0.9)); ctx.fill(); }
    else if (q.type === 'r') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.r, -q.r * 0.5, q.r * 2, q.r); ctx.restore(); }
    else drawStar(q.x, q.y, q.r * k + 1, q.rot, q.color, 0);
  }
  ctx.globalAlpha = 1;
  drawForeground();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const q of pops) {
    const k = q.life / q.max, sc = k < 0.15 ? 0.4 + (k / 0.15) * 0.75 : k < 0.25 ? 1.15 - ((k - 0.15) / 0.1) * 0.15 : 1;
    ctx.save(); ctx.translate(clamp(q.x, 90, W - 90), q.y); ctx.rotate(q.rot); ctx.scale(sc, sc); ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.font = '700 ' + q.size + 'px ' + FONT; ctx.lineWidth = Math.max(5, q.size * 0.26); ctx.strokeStyle = INK; ctx.strokeText(q.text, 0, 0); ctx.fillStyle = q.color; ctx.fillText(q.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + clamp(flash, 0, 0.6) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'menu') { ctx.fillStyle = 'rgba(30,15,70,.12)'; ctx.fillRect(0, 0, W, H); }
}

/* ---------------- HUD sync & loop ---------------- */
let countFrom = 0, lastSpeedTxt = '';
function syncHud() {
  if (state === 'play' && score !== shown) { shown = score; $('score').textContent = score; if (score > best) $('best').textContent = score; }
  const st = 'x' + (Math.max(speed, 380) / 380).toFixed(1);
  if (state === 'play' && st !== lastSpeedTxt) { lastSpeedTxt = st; $('speed').textContent = st; }
  if (state === 'over' && countFrom) {
    const k = clamp((performance.now() - countFrom) / 700, 0, 1), e = 1 - Math.pow(1 - k, 3);
    $('finalScore').textContent = Math.round(score * e);
    if (k >= 1) { countFrom = 0; $('over').style.pointerEvents = ''; }
  }
  $('pauseBtn').style.visibility = state === 'play' ? 'visible' : 'hidden';
}
let last = performance.now();
function frame(ts) {
  const dt = clamp((ts - last) / 1000, 0, 0.034); last = ts;
  if (!paused) { if (freeze > 0) freeze -= dt; else update(dt); }
  render(); syncHud(); musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
