<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Happy Holidays! — A Card You Can Play With</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--u:8px;--th:clamp(88px,15vh,120px);--red:#e63946;--gold:#ffd166;--green:#2fbf71;--ink:#2b2d42}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1445;font-family:'Fredoka','Arial Rounded MT Bold',ui-rounded,'Comic Sans MS',system-ui,sans-serif;color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

/* ---------- scene ---------- */
#scene{position:relative;flex:1;min-height:0;z-index:2}
.clip{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#0a1040 0%,#1a2473 32%,#4a3a9c 55%,#b85c9e 74%,#ffb38a 92%)}
.aurora{position:absolute;left:-20%;width:140%;height:34%;top:6%;filter:blur(calc(var(--u)*5));opacity:.42;mix-blend-mode:screen;border-radius:50%;animation:aur 16s ease-in-out infinite alternate}
.aurora.a1{background:linear-gradient(90deg,transparent,#3dffb5 25%,#49c6ff 55%,transparent 85%)}
.aurora.a2{top:16%;height:24%;background:linear-gradient(90deg,transparent 10%,#b96bff 40%,#ff7ad1 65%,transparent);animation-duration:22s;animation-direction:alternate-reverse;opacity:.32}
@keyframes aur{from{transform:translateX(-7%) skewX(-12deg) scaleY(.8)}to{transform:translateX(7%) skewX(10deg) scaleY(1.25)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}

#moon{position:absolute;left:7%;top:calc(var(--u)*13);width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf0,#ffeeb0 60%,#f7d877);box-shadow:0 0 calc(var(--u)*5) calc(var(--u)*1.2) rgba(255,240,170,.55);cursor:pointer;animation:moonbob 6s ease-in-out infinite}
#moon i{position:absolute;border-radius:50%;background:rgba(225,180,80,.35)}
#moon .eye{position:absolute;top:44%;width:14%;height:8%;border-bottom:calc(var(--u)*.45) solid #8a6a2a;border-radius:0 0 50% 50%;background:none}
#moon .smile{position:absolute;left:38%;top:56%;width:24%;height:13%;border-bottom:calc(var(--u)*.45) solid #8a6a2a;border-radius:0 0 50% 50%}
#moon .ck{position:absolute;top:56%;width:13%;height:9%;border-radius:50%;background:#ffa7a7;opacity:.7}
#moon .zz{position:absolute;right:-18%;top:-6%;font-size:calc(var(--u)*3);color:#fff;font-weight:700;opacity:.8;animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,6px) scale(.7);opacity:0}50%{opacity:.9}100%{transform:translate(8px,-10px) scale(1.1);opacity:0}}
@keyframes moonbob{50%{transform:translateY(calc(var(--u)*-1)) rotate(4deg)}}
#moon.wow{animation:wow .8s}
@keyframes wow{30%{transform:scale(1.25) rotate(-12deg)}60%{transform:scale(.92) rotate(10deg)}}

@media(max-aspect-ratio:1/1){#moon{top:calc(var(--u)*34);left:6%}}
.hill{position:absolute;left:0;bottom:0;width:100%;height:40%;display:block}
.pine{position:absolute;transform:translateX(-50%)}
.pine svg{height:100%;display:block}

/* string lights */
#lights{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*9);z-index:6}
#lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:clamp(15px,calc(var(--u)*3.3),30px);aspect-ratio:.78;transform:translate(-50%,0);border-radius:50% 50% 50% 50%/38% 38% 62% 62%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,currentColor 45%);box-shadow:0 0 calc(var(--u)*2.4) calc(var(--u)*.5) currentColor;cursor:pointer;animation:glow 2.4s ease-in-out infinite;transform-origin:50% 0;padding:0}
.bulb::before{content:'';position:absolute;left:30%;right:30%;top:-22%;height:26%;background:#3b4a3f;border-radius:3px 3px 1px 1px}
.bulb::after{content:'';position:absolute;inset:-9px}
@keyframes glow{0%,100%{filter:brightness(.72)}50%{filter:brightness(1.3)}}
.bulb.hit{animation:hit .45s}
@keyframes hit{0%{transform:translate(-50%,0) scale(1)}30%{transform:translate(-50%,0) scale(1.6) rotate(14deg);filter:brightness(1.9)}60%{transform:translate(-50%,0) scale(.9) rotate(-10deg)}100%{transform:translate(-50%,0) scale(1)}}

/* title */
#title{position:absolute;left:0;right:0;top:calc(var(--u)*10.5);margin:0;text-align:center;font-size:min(calc(var(--u)*11.5),11.5vw);font-weight:700;line-height:1;letter-spacing:.01em;z-index:5;white-space:nowrap;pointer-events:none}
#title span{display:inline-block;pointer-events:auto;cursor:pointer;animation:bob 2.6s ease-in-out infinite;-webkit-text-stroke:calc(var(--u)*.22) #fff;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.55) 0 rgba(20,10,70,.55),0 0 calc(var(--u)*3) rgba(255,255,255,.35)}
#title span.sp{width:.3em}
#title span.pop{animation:lpop .5s}
@keyframes bob{50%{transform:translateY(-9%) rotate(-3deg)}}
@keyframes lpop{30%{transform:translateY(-45%) scale(1.3) rotate(12deg)}70%{transform:translateY(6%) scale(.95,.9)}}
#to{position:absolute;left:50%;top:calc(var(--u)*10.5 + min(calc(var(--u)*13.5),13.5vw));transform:translateX(-50%) rotate(-1.5deg);z-index:5;background:#fff8ef;border:3px dashed #ff9aa2;border-radius:999px;padding:.3em 1em;font-size:clamp(13px,calc(var(--u)*2.6),22px);font-weight:500;white-space:nowrap;box-shadow:0 4px 0 rgba(20,10,70,.3);max-width:94%}
#to b{color:var(--red)}
#to [contenteditable]{outline:none;border-bottom:2px dotted #c9a;min-width:1.5em;display:inline-block;user-select:text;-webkit-user-select:text;cursor:text;padding:0 .15em;border-radius:6px}
#to [contenteditable]:focus{background:#fff1b8}

/* things in the scene */
.thing{position:absolute;cursor:pointer;transform-origin:50% 100%}
.thing svg{display:block;height:100%;overflow:visible}
#tree{left:50%;bottom:8%;height:calc(var(--u)*56);margin-left:calc(var(--u)*-21);width:calc(var(--u)*42);filter:drop-shadow(0 calc(var(--u)*.6) calc(var(--u)*.8) rgba(10,20,80,.35))}
#tree.shake{animation:tshake .7s}
@keyframes tshake{15%{transform:rotate(-5deg) scale(1.02,.98)}35%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}75%{transform:rotate(2deg)}}
.tl{animation:tlg 1.6s ease-in-out infinite;transition:fill .4s}
@keyframes tlg{0%,100%{opacity:.45}50%{opacity:1}}
#tstar{transform-origin:150px 30px;transform-box:view-box;animation:spinstar 5s ease-in-out infinite;cursor:pointer}
@keyframes spinstar{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.14)}}
#cabin{left:14%;bottom:17%;height:calc(var(--u)*30);width:calc(var(--u)*37);margin-left:calc(var(--u)*-18.5);filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.6) rgba(10,20,80,.3))}
#cabin .win{fill:#ffd76a;transition:fill .3s;filter:drop-shadow(0 0 6px #ffc94d)}
#cabin.dark .win{fill:#2c3a66;filter:none}
#cabin.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.05,.95)}70%{transform:scale(.98,1.03)}}
.smoke{position:absolute;left:69%;top:10%;width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;background:rgba(255,255,255,.7);animation:smoke 4s ease-out infinite;opacity:0;pointer-events:none}
.smoke:nth-of-type(2){animation-delay:1.3s}.smoke:nth-of-type(3){animation-delay:2.6s}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.75}100%{transform:translate(calc(var(--u)*7),calc(var(--u)*-15)) scale(2.4);opacity:0}}
#snowman{left:80%;bottom:9%;height:calc(var(--u)*31);width:calc(var(--u)*24);margin-left:calc(var(--u)*-12);filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*.6) rgba(10,20,80,.3));animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
#snowman.jump{animation:sjump .7s}
@keyframes sjump{20%{transform:scale(1.12,.82)}45%{transform:translateY(-22%) scale(.92,1.1) rotate(-5deg)}70%{transform:translateY(0) scale(1.1,.88)}}
#snowman .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#snowman .arm{transform-origin:128px 112px;transform-box:view-box}
#snowman.jump .arm{animation:wave .7s}
@keyframes wave{25%{transform:rotate(-28deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-22deg)}}
#bubble{position:absolute;left:80%;bottom:calc(9% + var(--u)*32);transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;border-radius:18px;padding:.45em .8em;font-size:clamp(13px,calc(var(--u)*2.5),20px);font-weight:500;box-shadow:0 4px 0 rgba(20,10,70,.25);transition:transform .25s cubic-bezier(.3,1.6,.5,1);z-index:7;white-space:nowrap;pointer-events:none}
#bubble::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
#bubble.on{transform:translateX(-50%) scale(1)}
.gift{bottom:5%;height:calc(var(--u)*9);width:calc(var(--u)*8.5)}
.gift .lid{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-origin:30px 30px;transform-box:view-box}
.gift.open .lid{transform:translateY(-20px) rotate(-22deg)}
.gift:hover{animation:wig .5s}
.gift.open{animation:bump .4s}
@keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

/* stickers */
#stickers{position:absolute;inset:0;pointer-events:none;z-index:4}
.sticker{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*var(--u));line-height:1;cursor:grab;touch-action:none;pointer-events:auto;filter:drop-shadow(0 calc(var(--u)*.35) calc(var(--u)*.3) rgba(10,10,60,.4))}
.sticker.fly{transition:left .7s cubic-bezier(.2,.9,.3,1.2),top .7s cubic-bezier(.2,1.5,.4,1)}
.sticker .m{transform:scaleX(var(--f,1)) rotate(var(--r,0deg));transition:transform .2s}
.sticker .i{display:block;transform-origin:50% 90%}
.sticker.drag{cursor:grabbing;z-index:99;filter:drop-shadow(0 calc(var(--u)*1.6) calc(var(--u)*1) rgba(10,10,60,.45))}
.sticker.drag .m{transform:scaleX(var(--f,1)) rotate(-8deg) scale(1.18)}
.sticker.sel::after{content:'';position:absolute;inset:-12%;border:3px dashed #fff;border-radius:50%;animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.idle-sway{animation:sway 3s ease-in-out infinite}
.idle-hop{animation:hop 2.2s ease-in-out infinite}
.idle-pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(0) scale(1.08,.9)}82%{transform:translateY(-16%) scale(.96,1.06)}92%{transform:translateY(0) scale(1.05,.94)}}
@keyframes pulse{0%,100%{transform:scale(.9) rotate(-5deg)}50%{transform:scale(1.12) rotate(5deg)}}
.i.fall{animation:fall .9s cubic-bezier(.4,0,.6,1)}
@keyframes fall{0%{transform:translateY(-110vh) rotate(-40deg)}60%{transform:translateY(0) scale(1.2,.75)}75%{transform:translateY(-22%) scale(.95,1.08)}90%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.i.plop{animation:plop .45s}
@keyframes plop{0%{transform:scale(1.5)}40%{transform:scale(1.25,.7)}70%{transform:scale(.9,1.12)}100%{transform:none}}
.i.jump{animation:jump .6s}
@keyframes jump{20%{transform:scale(1.2,.8)}50%{transform:translateY(-35%) rotate(14deg) scale(.95,1.1)}80%{transform:translateY(0) scale(1.12,.88)}}
.i.poof{animation:poof .35s forwards}
@keyframes poof{to{transform:scale(0) rotate(200deg);opacity:0}}

#selbar{position:absolute;z-index:8;display:none;gap:6px;padding:6px;background:#fff8ef;border-radius:999px;box-shadow:0 4px 0 rgba(20,10,70,.3),0 0 0 3px #ffb4a2;transform:translate(-50%,-100%)}
#selbar.on{display:flex;animation:plop .3s}
#selbar button{width:40px;height:40px;border-radius:50%;background:#fff;font-size:20px;box-shadow:inset 0 -3px 0 #f0d5c0;transition:transform .12s}
#selbar button:active{transform:scale(.85)}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#santa{position:absolute;left:0;top:0;font-size:calc(var(--u)*7.5);white-space:nowrap;visibility:hidden;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,40,.4))}
#santa span{display:inline-block;animation:gallop .5s ease-in-out infinite}
#santa span:nth-child(2){animation-delay:.12s}#santa span:nth-child(3){animation-delay:.24s}
#santa .sled{position:relative;margin-left:.1em;animation:none}
#santa .sled i{position:absolute;left:.18em;top:-.52em;font-style:normal;font-size:.8em}
#santa em{position:absolute;right:-.2em;top:-1.1em;font-style:normal;font-size:.36em;font-weight:700;background:#fff;border-radius:12px;padding:.2em .6em;color:var(--red)}
@keyframes gallop{50%{transform:translateY(-14%) rotate(-8deg)}}

/* controls */
#ctrl{position:absolute;right:calc(var(--u)*1.6);top:calc(var(--u)*11.5);display:flex;flex-direction:column;gap:calc(var(--u)*.9);z-index:9}
#ctrl button{--b:clamp(40px,calc(var(--u)*7.2),60px);width:var(--b);height:var(--b);border-radius:32%;background:linear-gradient(#fff,#ffe9d2);font-size:calc(var(--b)*.48);box-shadow:0 4px 0 #d98c6a,0 6px 12px rgba(0,0,40,.35);transition:transform .12s,box-shadow .12s;position:relative;display:grid;place-items:center;padding:0}
#ctrl button:hover{transform:translateY(-2px) rotate(-5deg)}
#ctrl button:active{transform:translateY(3px);box-shadow:0 1px 0 #d98c6a}
#ctrl button.off{filter:grayscale(1);opacity:.75}
#ctrl button::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%) scale(0);transform-origin:100% 50%;background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:.35em .7em;border-radius:10px;white-space:nowrap;transition:transform .15s;pointer-events:none}
@media(hover:hover){#ctrl button:hover::after{transform:translateY(-50%) scale(1)}}

#hint{position:absolute;left:calc(var(--u)*1.6);bottom:calc(var(--u)*1.4);z-index:9;background:rgba(255,255,255,.93);border-radius:999px;padding:.45em 1em;font-size:clamp(12px,calc(var(--u)*2.3),18px);font-weight:500;box-shadow:0 4px 0 rgba(20,10,70,.25);max-width:72%;pointer-events:none;transition:opacity .4s,transform .4s;animation:hintbob 2s ease-in-out infinite}
#hint.swap{opacity:0;transform:translateY(8px)}
@keyframes hintbob{50%{translate:0 -4px}}

/* tray */
#tray{position:relative;z-index:1;height:var(--th);flex:none;display:flex;gap:10px;align-items:center;padding:16px 10px 8px;background:linear-gradient(#fff8ef,#ffe3c8);box-shadow:0 -6px 20px rgba(0,0,40,.4)}
#tray::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#fff 12px 24px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
#tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
#tabs button{--t:calc((var(--th) - 30px)/2);width:var(--t);height:var(--t);border-radius:30%;background:#fff;font-size:calc(var(--t)*.56);box-shadow:inset 0 -3px 0 #f0d5c0;transition:transform .15s,background .15s;padding:0}
#tabs button.on{background:var(--red);box-shadow:inset 0 -3px 0 #a81f2b;transform:scale(1.08) rotate(-4deg)}
#row{flex:1;min-width:0;height:100%;display:flex;gap:8px;align-items:center;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;padding:0 6px;mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
#row::-webkit-scrollbar{display:none}
#row button{--z:calc(var(--th) - 34px);flex:none;width:var(--z);height:var(--z);border-radius:28%;background:#fff;border:3px solid #ffd3b0;font-size:calc(var(--z)*.58);line-height:1;padding:0;box-shadow:0 4px 0 #f3b78e;transition:transform .15s;touch-action:pan-x}
#row.sw button{animation:rowin .35s backwards cubic-bezier(.3,1.5,.5,1)}
@keyframes rowin{from{transform:scale(0) rotate(-30deg)}}
@media(hover:hover){#row button:hover{transform:translateY(-5px) rotate(-6deg) scale(1.06)}}
#row button:active{transform:scale(.9)}
#tray.trash::after{content:'🗑️  Drop here to put it away';position:absolute;inset:9px 0 0;background:rgba(230,57,70,.94);color:#fff;display:grid;place-items:center;font-size:clamp(16px,3vh,24px);font-weight:700;letter-spacing:.02em}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) rotate(-8deg) scale(1.15);font-size:calc(var(--u)*8);line-height:1;filter:drop-shadow(0 12px 8px rgba(10,10,60,.45))}
</style>
</head>
<body>
<div id="scene">
  <div class="clip">
    <div class="sky"></div>
    <div class="aurora a1"></div><div class="aurora a2"></div>
    <div id="stars"></div>
    <div id="moon" class="thing" title="Shh… the moon is sleeping">
      <i style="left:62%;top:20%;width:16%;height:16%"></i><i style="left:20%;top:68%;width:12%;height:12%"></i><i style="left:70%;top:66%;width:9%;height:9%"></i>
      <b class="eye" style="left:26%"></b><b class="eye" style="left:60%"></b><b class="smile"></b>
      <b class="ck" style="left:14%"></b><b class="ck" style="left:73%"></b><span class="zz">z</span>
    </div>
    <svg class="hill" viewBox="0 0 1000 300" preserveAspectRatio="none"><defs><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b6f0"/><stop offset="1" stop-color="#7e93dc"/></linearGradient></defs>
      <path d="M0 80 Q150 10 330 60 T640 50 T1000 30 V300 H0Z" fill="url(#hb)"/></svg>
    <div id="pines"></div>
    <svg class="hill" viewBox="0 0 1000 300" preserveAspectRatio="none"><defs><linearGradient id="hm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3e0fb"/><stop offset="1" stop-color="#b3c8f3"/></linearGradient><linearGradient id="hf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0fb"/></linearGradient></defs>
      <path d="M0 125 Q200 65 420 115 T800 95 T1000 115 V300 H0Z" fill="url(#hm)"/>
      <path d="M0 170 Q250 110 500 150 T1000 140 V300 H0Z" fill="url(#hf)"/></svg>
  </div>

  <div id="lights"></div>
  <h1 id="title" aria-label="Happy Holidays!"></h1>
  <div id="to">💌 <b>To:</b> <span contenteditable spellcheck="false">my favorite friend</span> &nbsp;<b>From:</b> <span contenteditable spellcheck="false">me</span> ✏️</div>

  <!-- cabin -->
  <div id="cabin" class="thing">
    <svg viewBox="0 0 260 210">
      <rect x="175" y="42" width="28" height="55" fill="#9b4a3c"/><rect x="170" y="34" width="38" height="13" rx="6.5" fill="#fff"/>
      <polygon points="130,25 15,106 245,106" fill="#7a3b2e"/>
      <rect x="35" y="100" width="190" height="96" fill="#b06f44"/>
      <g stroke="#8c5230" stroke-width="3"><path d="M35 119H225M35 138H225M35 157H225M35 176H225"/></g>
      <path d="M12 104 L130 24 L248 104" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <g fill="#fff"><circle cx="40" cy="100" r="8"/><circle cx="75" cy="76" r="7"/><circle cx="190" cy="78" r="7"/><circle cx="222" cy="100" r="8"/></g>
      <rect x="110" y="132" width="42" height="64" rx="8" fill="#6b2f1f"/><circle cx="144" cy="168" r="3.5" fill="#ffd166"/>
      <circle cx="131" cy="152" r="10" fill="none" stroke="#2fa860" stroke-width="7"/><circle cx="131" cy="162" r="4" fill="#e63946"/>
      <g><rect class="win" x="52" y="124" width="42" height="38" rx="6"/><rect class="win" x="168" y="124" width="42" height="38" rx="6"/>
      <g stroke="#6b2f1f" stroke-width="4" fill="none"><rect x="52" y="124" width="42" height="38" rx="6"/><rect x="168" y="124" width="42" height="38" rx="6"/><path d="M73 124V162M52 143H94M189 124V162M168 143H210"/></g></g>
      <rect x="48" y="160" width="50" height="8" rx="4" fill="#fff"/><rect x="164" y="160" width="50" height="8" rx="4" fill="#fff"/>
      <ellipse cx="130" cy="198" rx="125" ry="10" fill="#fff"/>
    </svg>
    <div class="smoke"></div><div class="smoke"></div><div class="smoke"></div>
  </div>

  <!-- tree -->

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scene=$('#scene'), layer=$('#stickers'), tray=$('#tray'), row=$('#row'), tabs=$('#tabs'), canvas=$('#fx'), ctx=canvas.getContext('2d');
const hint=$('#hint'), selbar=$('#selbar'), treeEl=$('#tree'), snowman=$('#snowman'), cabin=$('#cabin'), moon=$('#moon'), bubble=$('#bubble'), santa=$('#santa');
let W=1,H=1,U=8,DPR=1;
const COLORS=['#ff4d5e','#ffd166','#3ddc84','#4cc9f0','#ff8fd0','#ff9f43','#b28dff'];

/* ================= AUDIO ================= */
let ac=null,master,noiseBuf,musicOn=true,songGain=null,nextSong=0,songIdx=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ac) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC(); master=ac.createGain(); master.gain.value=.85;
  const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function env(g,t,vol,dur,att=.006){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur); }
function sweep(pts,dur,o={}){
  if(!ac) return; const t=ac.currentTime+(o.when||0), os=ac.createOscillator(), g=ac.createGain();
  os.type=o.type||'sine'; os.frequency.setValueAtTime(pts[0],t);
  for(let i=1;i<pts.length;i++) os.frequency.exponentialRampToValueAtTime(pts[i],t+dur*i/(pts.length-1));
  env(g,t,o.vol||.25,dur+.03);
  let n=os; if(o.lp){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; os.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||master); os.start(t); os.stop(t+dur+.08);
}
function noise(dur,o={}){
  if(!ac) return; const t=ac.currentTime+(o.when||0), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; s.loop=true; f.type=o.type||'lowpass'; f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f0||1000,t); if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  env(g,t,o.vol||.2,dur,o.att||.005); s.connect(f); f.connect(g); g.connect(o.dest||master); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
}
function bell(m,when=0,vol=.22,dest){
  if(!ac) return; const t=ac.currentTime+when, f=mtof(m);
  [[1,1,1.3],[2,.45,.8],[3.01,.2,.45],[4.2,.1,.25]].forEach(([k,a,d])=>{ if(f*k>15000) return;
    const os=ac.createOscillator(), g=ac.createGain(); os.frequency.value=f*k; env(g,t,vol*a,d); os.connect(g); g.connect(dest||master); os.start(t); os.stop(t+d+.05); });
}
const PENT=[72,74,76,79,81,84,86,88,91,93,96,98,100,103,105,108];
const sfx={
  pop(){sweep([320,950],.09,{vol:.3})},
  plop(){sweep([720,210],.14,{vol:.3})},
  boing(){sweep([170,520,230,430,210],.42,{type:'triangle',vol:.35})},
  squeak(){sweep([900,1750],.08,{type:'triangle',vol:.2});sweep([1000,1900],.09,{type:'triangle',vol:.2,when:.12})},
  meow(){sweep([620,1080,960,560],.5,{type:'sawtooth',vol:.14,lp:1900})},
  woof(){sweep([330,150],.12,{type:'sawtooth',vol:.25,lp:900});sweep([350,150],.14,{type:'sawtooth',vol:.25,lp:900,when:.2})},
  hoot(){sweep([430,380],.22,{vol:.3});sweep([430,350],.42,{vol:.3,when:.3})},
  chirp(){for(let i=0;i<3;i++)sweep([2300,3300,2500],.07,{vol:.14,when:i*.11})},
  growl(){sweep([120,92,125,84],.5,{type:'sawtooth',vol:.25,lp:520})},
  hoho(){[210,185,160].forEach((f,i)=>sweep([f,f*.72],.24,{type:'sawtooth',vol:.26,lp:800,when:i*.3}))},
  munch(){for(let i=0;i<3;i++)noise(.07,{f0:1500,vol:.3,when:i*.13})},
  slurp(){sweep([260,880],.35,{type:'triangle',vol:.2});noise(.35,{type:'bandpass',f0:600,f1:2400,q:4,vol:.12})},
  whoosh(){noise(.55,{type:'bandpass',f0:350,f1:2800,q:1.5,vol:.3,att:.2})},
  sparkle(){for(let i=0;i<6;i++)bell(pick(PENT.slice(6)),i*.06,.1)},
  magic(){[72,76,79,84,88,91,96].forEach((m,i)=>bell(m,i*.065,.14))},
  jingle(){for(let i=0;i<4;i++){noise(.06,{type:'highpass',f0:6000,vol:.16,when:i*.12});bell(i%2?103:100,i*.12,.07)}},
  bell(){bell(84,0,.28);bell(79,.22,.24)},
  trash(){sweep([520,110],.28,{type:'square',vol:.08});noise(.2,{f0:900,f1:200,vol:.15})},
  thump(){sweep([170,60],.16,{vol:.4});noise(.14,{f0:700,vol:.12})},
  boom(){noise(.6,{f0:1800,f1:120,vol:.4});sweep([150,45],.4,{vol:.45});for(let i=0;i<5;i++)noise(.04,{type:'highpass',f0:5000,vol:.07,when:.25+i*.08+Math.random()*.05})},
  click(){sweep([1300,900],.04,{type:'square',vol:.08})},
  fanfare(){[72,72,76,79,84].forEach((m,i)=>{bell(m,[0,.14,.28,.42,.6][i],.2);bell(m-12,[0,.14,.28,.42,.6][i],.1)})}
};
function play(n){ if(ac&&sfx[n]) sfx[n](); }

/* music */
const rep=(a,n)=>Array.from({length:n},()=>a).flat();
const jA=[[64,1],[64,1],[64,2],[64,1],[64,1],[64,2],[64,1],[67,1],[60,1.5],[62,.5],[64,4],[65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5]];
const bar=r=>[[r,2],[r+7,2]];
const SONGS=[
 {beat:.29,tr:12,mel:[...jA,[64,1],[62,1],[62,1],[64,1],[62,2],[67,2],...jA,[67,1],[67,1],[65,1],[62,1],[60,4]],
  bass:[48,48,48,48,53,48,50,55,48,48,48,48,53,48,55,48].flatMap(bar)},
 {beat:.37,tr:12,mel:[[62,1],[67,1],[67,.5],[69,.5],[67,.5],[66,.5],[64,1],[64,1],[64,1],[69,1],[69,.5],[71,.5],[69,.5],[67,.5],[66,1],[62,1],[62,1],[71,1],[71,.5],[72,.5],[71,.5],[69,.5],[67,1],[64,1],[62,.5],[62,.5],[64,1],[69,1],[66,1],[67,2],[0,1],
   [62,1],[67,1],[67,.5],[69,.5],[67,.5],[66,.5],[64,1],[64,1],[64,1],[69,1],[69,.5],[71,.5],[69,.5],[67,.5],[66,1],[62,1],[62,1],[71,1],[71,.5],[72,.5],[71,.5],[69,.5],[67,1],[64,1],[62,.5],[62,.5],[64,1],[69,1],[66,1],[67,2],[0,2]],
  bass:[...rep([[0,1],[43,3],[48,3],[45,3],[50,3],[43,3],[48,3],[48,1],[50,2],[43,3]],2),[0,1]]}
];
function scheduleSong(){
  const s=SONGS[songIdx++%SONGS.length]; songGain=ac.createGain(); songGain.gain.value=.5; songGain.connect(master);
  const t0=Math.max(nextSong,ac.currentTime+.08)-ac.currentTime; let b=0;
  for(const [m,d] of s.mel){ if(m){ bell(m+s.tr,t0+b*s.beat,.16,songGain); } b+=d; }
  const total=b; b=0;
  for(const [m,d] of s.bass){ if(m){ const t=ac.currentTime+t0+b*s.beat, os=ac.createOscillator(), g=ac.createGain(); os.type='triangle'; os.frequency.value=mtof(m); env(g,t,.22,d*s.beat*.95,.02); os.connect(g); g.connect(songGain); os.start(t); os.stop(t+d*s.beat+.05);} b+=d; }
  for(let i=0;i<total;i++) noise(.05,{type:'highpass',f0:7000,vol:i%2?.05:.025,when:t0+i*s.beat,dest:songGain});
  nextSong=ac.currentTime+t0+total*s.beat+.5;
}
setInterval(()=>{ if(ac&&musicOn&&ac.state==='running'&&ac.currentTime>nextSong-.4) scheduleSong(); },150);
function setMusic(on){ musicOn=on; $('#bMusic').classList.toggle('off',!on); $('#bMusic').textContent=on?'🎵':'🔇';
  if(!on&&songGain){ try{songGain.disconnect()}catch(e){} songGain=null; nextSong=0; } }
let unlocked=false;
function unlock(){ initAudio(); if(ac&&ac.state==='suspended') ac.resume(); if(!unlocked&&ac){ unlocked=true; nextTip(); } }
window.addEventListener('pointerdown',unlock,true); window.addEventListener('keydown',unlock,true);
document.addEventListener('visibilitychange',()=>{ if(!ac) return; document.hidden?ac.suspend():ac.resume(); });

/* ================= FX CANVAS ================= */
let flakes=[],parts=[],shooters=[],snowLevel=1,wind=0,windT=0;
const SNOW=[70,170,380];
function mkFlake(top){ const d=Math.random(); return {x:rnd(-20,W+20),y:top?rnd(-40,-5):rnd(0,H),r:1+d*d*4.2,vy:18+d*55,ph:rnd(0,6.3),sw:rnd(.6,1.8),a:.45+d*.55,rot:rnd(0,6),bx:0,by:0}; }
function fitSnow(){ const n=Math.round(SNOW[snowLevel]*clamp(W*H/900000,.45,1.6)); while(flakes.length<n) flakes.push(mkFlake(false)); flakes.length=n; }
function burst(x,y,n=14,o={}){
  for(let i=0;i<n;i++){ const a=rnd(0,6.283), sp=rnd(.3,1)*(o.speed||220);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),g:o.g==null?260:o.g,life:0,max:rnd(.5,1)*(o.life||1),size:rnd(.5,1)*(o.size||U*1.1),color:o.color||pick(o.colors||COLORS),shape:o.shape||'star',rot:rnd(0,6),vr:rnd(-6,6),drag:o.drag||1.5}); }
  if(parts.length>900) parts.splice(0,parts.length-900);
}
function firework(x,y){ const c=[pick(COLORS),pick(COLORS),'#fff']; burst(x,y,46,{speed:U*46,colors:c,g:90,life:1.6,size:U*.9,drag:1.9,shape:'dot'}); burst(x,y,14,{speed:U*24,colors:c,g:90,life:1.3,size:U*1.4}); play('boom'); }
function starPath(x,y,r,rot){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } ctx.closePath(); }
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  wind+=(windT-wind)*dt*1.5;
  ctx.fillStyle='#fff'; ctx.strokeStyle='#fff'; ctx.lineCap='round';
  for(const f of flakes){
    f.bx*=1-dt*1.8; f.by*=1-dt*1.8;
    f.x+=(Math.sin(t*f.sw+f.ph)*18+wind*(40+f.vy*1.6)+f.bx)*dt; f.y+=(f.vy+f.by)*dt; f.rot+=dt*f.sw;
    if(f.y>H+8){ Object.assign(f,mkFlake(true)); } if(f.x<-30) f.x=W+25; else if(f.x>W+30) f.x=-25; if(f.y<-60) f.y=-60;
    ctx.globalAlpha=f.a;
    if(f.r>4){ ctx.lineWidth=1.3; ctx.beginPath(); for(let i=0;i<3;i++){ const a=f.rot+i*1.047, c=Math.cos(a)*f.r*1.5, s=Math.sin(a)*f.r*1.5; ctx.moveTo(f.x-c,f.y-s); ctx.lineTo(f.x+c,f.y+s); } ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.283); ctx.fill(); }
  }
  for(let i=shooters.length-1;i>=0;i--){ const s=shooters[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life+=dt;
    parts.push({x:s.x,y:s.y,vx:rnd(-10,10),vy:rnd(-10,10),g:0,life:0,max:.5,size:U*.5,color:'#fff8c9',shape:'dot',rot:0,vr:0,drag:0});
    if(s.life>s.max) shooters.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life+=dt; if(p.life>p.max){ parts.splice(i,1); continue; }
    const k=1-p.drag*dt; p.vx*=k; p.vy=p.vy*k+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    const q=1-p.life/p.max; ctx.globalAlpha=Math.min(1,q*1.6); ctx.fillStyle=p.color;
    if(p.shape==='star'){ starPath(p.x,p.y,p.size*(.5+q*.5),p.rot); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.size*.5*(.4+q*.6),0,6.283); ctx.fill(); } }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
window.addEventListener('pointermove',e=>{ windT=(e.clientX/innerWidth-.5)*1.1; });
setInterval(()=>{ if(document.hidden) return; const x=rnd(.1,.8)*W; shooters.push({x,y:rnd(.04,.25)*H,vx:U*rnd(50,80),vy:U*rnd(14,26),life:0,max:rnd(.5,.9)}); },9000);

/* ================= SCENE BUILD ================= */
// stars
{ const s=$('#stars'); let h=''; for(let i=0;i<70;i++){ const z=rnd(1.5,4); h+=`<div class="star" style="left:${rnd(0,100)}%;top:${rnd(0,58)}%;width:${z}px;height:${z}px;animation-delay:${-rnd(0,3)}s;animation-duration:${rnd(2,5)}s"></div>`; } s.innerHTML=h; }
// pines
{ const P=[[3,29,15],[9,31,9],[25,33,10],[35,34,8],[61,33,9],[70,32,13],[90,31,11],[96,29,17]];
  $('#pines').innerHTML=P.map(([x,b,h])=>`<div class="pine" style="left:${x}%;bottom:${b}%;height:calc(var(--u)*${h})"><svg viewBox="0 0 60 100"><rect x="26" y="84" width="8" height="16" fill="#4a3566"/><path d="M30 2 46 34H38L52 62H42L58 90H2L18 62H8L22 34H14Z" fill="#3b5aa0"/><path d="M30 2 40 22Q30 28 20 22ZM22 34 38 34 45 48Q30 56 15 48ZM18 62H42L49 74Q30 82 11 74Z" fill="#e6efff"/></svg></div>`).join(''); }
// tree garlands, lights, star
const treeLights=[];
{ const g=$('#garl'), NS='http://www.w3.org/2000/svg'; let h='';
  [[114,98,186,10,3],[90,168,210,13,4],[66,243,234,16,5],[42,316,258,18,6]].forEach(([x0,y,x1,sag,n])=>{
    h+=`<path d="M${x0} ${y} Q150 ${y+sag*2} ${x1} ${y}" stroke="#ffe08a" stroke-width="2.5" fill="none" opacity=".9"/>`;
    for(let i=0;i<n;i++){ const t=(i+.5)/n; h+=`<circle class="tl" cx="${x0+(x1-x0)*t}" cy="${y+4*sag*t*(1-t)+3}" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" style="animation-delay:${-rnd(0,1.6)}s"/>`; } });
  g.innerHTML=h; g.querySelectorAll('.tl').forEach((c,i)=>{ treeLights.push(c); c.setAttribute('fill',COLORS[i%COLORS.length]); });
  let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?13:28; d+=(i?'L':'M')+(150+Math.cos(a)*r).toFixed(1)+' '+(30+Math.sin(a)*r).toFixed(1); } $('#tstarp').setAttribute('d',d+'Z'); }
// title
{ const T='Happy Holidays!', C=['#ff4d5e','#3ddc84','#ffd166','#4cc9f0','#ff8fd0']; let k=0;
  $('#title').innerHTML=[...T].map((ch,i)=>ch===' '?'<span class="sp"></span>':`<span style="color:${C[k++%C.length]};animation-delay:${-i*.18}s">${ch}</span>`).join('');
  $('#title').addEventListener('pointerdown',e=>{ const s=e.target.closest('span'); if(!s||s.classList.contains('sp')) return; const i=[...s.parentNode.children].indexOf(s);
