<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Feedback Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f2ec;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --ink: #16181d;
    --ink-2: #454a55;
    --ink-3: #7a7f8a;
    --line: #e6e3da;
    --line-2: #efede6;
    --accent: #1f6f5c;
    --accent-soft: #e3f0ec;
    --amber: #e2a100;
    --amber-off: #e4e1d8;
    --mark: #ffe59a;
    --good: #1f7a55;
    --good-bg: #e4f3eb;
    --mid: #8a6a12;
    --mid-bg: #f8efd3;
    --bad: #b3402f;
    --bad-bg: #fbe7e2;
    --night: #13161b;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(22,24,29,.04), 0 8px 28px -12px rgba(22,24,29,.12);
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page { max-width: 1320px; margin: 0 auto; padding: 28px 28px 56px; }

  /* ---------- Header ---------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .brand-dot { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
  .brand-dot svg { width: 12px; height: 12px; }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(34px, 4.4vw, 50px); line-height: 1.02; letter-spacing: -.01em; margin: 0;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .sub { color: var(--ink-2); margin: 10px 0 0; max-width: 56ch; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(112px, 1fr)); gap: 10px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px 12px; min-width: 0;
  }
  .kpi-label { font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .kpi-value { font-family: var(--serif); font-size: 32px; line-height: 1.1; margin-top: 4px; white-space: nowrap; }
  .kpi-value small { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-left: 3px; }

  /* ---------- AI summary ---------- */
  .ai-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .38s cubic-bezier(.4,0,.2,1), opacity .28s ease, margin .38s ease; margin-bottom: 20px; }
  .ai-wrap.closed { grid-template-rows: 0fr; opacity: 0; margin-bottom: 0; }
  .ai-clip { overflow: hidden; min-height: 0; }
  .ai {
    position: relative; isolation: isolate; overflow: hidden;
    background: var(--night); color: #eef0f2; border-radius: 20px;
    padding: 24px 26px 24px;
    display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 32px;
  }
  .ai::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(520px 260px at 4% -10%, rgba(64,190,156,.30), transparent 65%),
      radial-gradient(460px 300px at 100% 120%, rgba(128,116,255,.26), transparent 65%);
  }
  .ai-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-right: 8px; flex-wrap: wrap; }
  .ai-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 5px 11px 5px 9px; border-radius: 999px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); color: #d9f5ec;
  }
  .ai-badge svg { width: 14px; height: 14px; }
  .ai-meta { font-size: 12.5px; color: #99a0ab; }
  .ai-lead { font-family: var(--serif); font-size: clamp(21px, 2.1vw, 26px); line-height: 1.28; margin: 0 0 16px; color: #fff; max-width: 60ch; text-wrap: pretty; }
  .ai-lead b { font-weight: 400; font-style: italic; color: #8fe3c8; }
  .ai-points { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .ai-points li { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.09); border-radius: 13px; padding: 12px 14px; font-size: 13.5px; color: #c9ced6; }
  .ai-points strong { display: flex; align-items: center; gap: 7px; color: #fff; font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
  .ai-points .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ai-points span.hl { color: #fff; font-weight: 500; }

  .ai-side { border-left: 1px solid rgba(255,255,255,.1); padding-left: 28px; display: flex; flex-direction: column; justify-content: center; padding-top: 30px; }
  .ai-side h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #99a0ab; }
  .dist-row { display: grid; grid-template-columns: 26px 1fr 20px; align-items: center; gap: 10px; font-size: 12.5px; color: #c9ced6; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .dist-row .lbl { display: inline-flex; align-items: center; gap: 3px; }
  .dist-row .lbl svg { width: 10px; height: 10px; color: var(--amber); }
  .dist-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #52c7a5, #8fe3c8); width: 0; transition: width .8s cubic-bezier(.2,.7,.2,1); }
  .dist-row .n { text-align: right; color: #99a0ab; }

  .ai-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #dfe3e8;
    transition: background .15s, transform .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.16); }
  .icon-btn:active { transform: scale(.95); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:focus-visible { outline-color: #8fe3c8; border-radius: 10px; }
  .ai.loading .icon-btn.refresh svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ai-content { transition: opacity .35s ease; }
  .ai.loading .ai-content { display: none; }
  .ai-skel { display: none; }
  .ai.loading .ai-skel { display: block; }
  .sk { height: 14px; border-radius: 7px; margin-bottom: 12px;
    background: linear-gradient(90deg, rgba(255,255,255,.07) 20%, rgba(255,255,255,.17) 40%, rgba(255,255,255,.07) 60%);
    background-size: 220% 100%; animation: shimmer 1.2s linear infinite; }
  .sk.big { height: 22px; }
  .sk-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 18px; }
  .sk-grid .sk { height: 74px; border-radius: 13px; margin: 0; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }
  .fade-in { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .reopen {
    display: none; align-items: center; gap: 8px; margin-bottom: 16px;
    background: var(--night); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px 8px 11px;
    font-size: 13px; font-weight: 500;
  }
  .reopen svg { width: 14px; height: 14px; color: #8fe3c8; }
  .reopen.show { display: inline-flex; animation: fadeUp .3s ease both; }
  .reopen:hover { background: #262b33; }

  /* ---------- Table card ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: clip; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 300px; min-width: 220px; }
  .search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-3); pointer-events: none; }
  .search input {
    width: 100%; height: 42px; padding: 0 76px 0 40px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2);
    font-size: 14.5px; transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:hover { border-color: #d5d1c5; }
  .search input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(31,111,92,.13); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search-end { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; }
  kbd { font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-bottom-width: 2px; background: #fff; border-radius: 6px; padding: 1px 7px; }
  .clear { display: none; border: 0; background: #e9e6dd; color: var(--ink-2); width: 24px; height: 24px; border-radius: 50%; place-items: center; padding: 0; }
  .clear svg { width: 12px; height: 12px; }
  .clear:hover { background: #dcd8cc; }
  .search.has-value .clear { display: grid; }
  .search.has-value kbd { display: none; }

  .chips { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 11px; }
  .chip { border: 0; background: transparent; border-radius: 8px; padding: 0 12px; height: 34px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .15s, color .15s; }
  .chip:hover { color: var(--ink); background: #f0eee7; }
  .chip .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-3); background: #ebe8df; border-radius: 99px; padding: 0 7px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip[aria-pressed="true"] .cnt { background: rgba(255,255,255,.18); color: #fff; }

  .mobile-sort { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
  .mobile-sort select { height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 10px; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  col.c-date { width: 132px; } col.c-event { width: 236px; } col.c-name { width: 204px; } col.c-rating { width: 142px; }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--surface-2);
    border-bottom: 1px solid var(--line); padding: 0; text-align: left; font-weight: 600;
  }
  .th-btn {
    width: 100%; display: flex; align-items: center; gap: 7px; padding: 11px 16px;
    background: none; border: 0; text-align: left;
    font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3);
    transition: color .15s, background .15s;
  }
  .th-btn:hover { color: var(--ink); background: #f1efe8; }
  .th-btn:focus-visible { outline-offset: -3px; }
  th[aria-sort="ascending"] .th-btn, th[aria-sort="descending"] .th-btn { color: var(--ink); }
  .sort-ico { width: 10px; height: 14px; flex: none; }
  .sort-ico path { fill: #c9c5b9; transition: fill .15s; }
  .th-btn:hover .sort-ico path { fill: #a9a598; }
  th[aria-sort="ascending"] .sort-ico .up, th[aria-sort="descending"] .sort-ico .down { fill: var(--accent); }
  th[aria-sort="ascending"] .sort-ico .down, th[aria-sort="descending"] .sort-ico .up { fill: #dedbd1; }

  tbody td { padding: 15px 16px; border-bottom: 1px solid var(--line-2); vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #fbfaf7; }
  tbody tr.row-in { animation: fadeUp .28s ease both; }

  .date { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
  .event-name { font-weight: 600; line-height: 1.35; }
  .person { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
  .person-name { font-weight: 500; line-height: 1.3; min-width: 0; }

  .rating { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .stars { display: inline-flex; gap: 1.5px; }
  .stars svg { width: 15px; height: 15px; color: var(--amber-off); }
  .stars svg.on { color: var(--amber); }
  .rating-num { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tone { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
  .tone.good { color: var(--good); background: var(--good-bg); }
  .tone.mid { color: var(--mid); background: var(--mid-bg); }
  .tone.bad { color: var(--bad); background: var(--bad-bg); }

  .fb-text { color: var(--ink-2); line-height: 1.6; margin: 0; max-width: 78ch; text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .fb.open .fb-text { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
  .fb-more { display: none; margin-top: 5px; padding: 0; border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 600; align-items: center; gap: 4px; }
  .fb-more:hover { text-decoration: underline; }
  .fb-more svg { width: 11px; height: 11px; transition: transform .2s; }
  .fb.can-toggle .fb-more { display: inline-flex; }
  .fb.open .fb-more svg { transform: rotate(180deg); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--mark); }

  .empty td { padding: 56px 20px; text-align: center; color: var(--ink-3); }
  .empty-ico { width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 14px; color: var(--ink-3); }
  .empty-ico svg { width: 22px; height: 22px; }
  .empty h4 { margin: 0 0 4px; font-family: var(--serif); font-weight: 400; font-size: 24px; color: var(--ink); }
  .empty p { margin: 0 0 16px; }
  .btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 500; font-size: 13px; }
  .btn:hover { background: var(--surface-2); border-color: #d5d1c5; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); color: var(--ink-3); font-size: 12.5px; }
  .foot b { color: var(--ink); font-weight: 600; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .ai { grid-template-columns: 1fr; gap: 20px; }
    .ai-side { border-left: 0; border-top: 1px solid rgba(255,255,255,.1); padding: 18px 0 0; }
    .ai-dist { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); column-gap: 28px; }
    .top { align-items: stretch; flex-direction: column; }
  }
  @media (max-width: 920px) {
    .page { padding: 20px 14px 40px; }
    .ai-points { grid-template-columns: 1fr; }
    .sk-grid { grid-template-columns: 1fr; }
    .mobile-sort { display: flex; }
    table, tbody { display: block; }
    colgroup, thead { display: none; }
    tbody tr { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 14px; padding: 16px; border-bottom: 1px solid var(--line-2); }
    tbody tr:last-child { border-bottom: 0; }
    tbody td { display: block; padding: 0; border: 0; }
    td.td-event { grid-column: 1; grid-row: 1; }
    td.td-date { grid-column: 2; grid-row: 1; text-align: right; }
    td.td-name { grid-column: 1; grid-row: 2; align-self: center; }
    td.td-rating { grid-column: 2; grid-row: 2; align-self: center; }
    td.td-rating .tone { display: none; }
    td.td-fb { grid-column: 1 / -1; grid-row: 3; }
    tr.empty { display: block; } tr.empty td { padding: 40px 10px; }
  }
  @media (max-width: 620px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .ai { padding: 58px 18px 20px; border-radius: 16px; }
    .ai-head { margin-top: -40px; padding-right: 84px; min-height: 34px; }
    .ai-dist { display: block; }
    .chips { width: 100%; overflow-x: auto; }
    .chip { flex: 1; justify-content: center; padding: 0 9px; }
    .search { flex-basis: 100%; }
    .search kbd { display: none; }
    .mobile-sort { width: 100%; } .mobile-sort select { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 20 20"><path fill="currentColor" d="M10 1.6l2.47 5.24 5.73.72-4.2 3.97 1.07 5.69L10 14.46 4.93 17.22 6 11.53 1.8 7.56l5.73-.72L10 1.6z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 20 20"><path fill="currentColor" d="M9 1.5l1.7 4.8a3 3 0 001.9 1.9L17.5 10l-4.9 1.8a3 3 0 00-1.9 1.9L9 18.5l-1.7-4.8a3 3 0 00-1.9-1.9L.5 10l4.9-1.8a3 3 0 001.9-1.9L9 1.5zM16.5 1l.6 1.7c.1.3.4.6.7.7l1.7.6-1.7.6c-.3.1-.6.4-.7.7L16.5 7l-.6-1.7a1.2 1.2 0 00-.7-.7L13.5 4l1.7-.6c.3-.1.6-.4.7-.7L16.5 1z"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="page">
  <header class="top">
    <div>
      <div class="brand">
        <span class="brand-dot"><svg style="color:#8fe3c8"><use href="#i-spark"/></svg></span>
        Events · Voice of Participant
      </div>
      <h1>Event feedback, <em>at a glance</em></h1>
      <p class="sub">Every participant submission from this year's event programme — searchable, sortable and summarised.</p>
    </div>
    <div class="kpis" id="kpis" aria-label="Key figures"></div>
  </header>

  <button class="reopen" id="reopen" type="button">
    <svg><use href="#i-spark"/></svg> Show AI summary
  </button>

  <div class="ai-wrap" id="aiWrap">
    <div class="ai-clip">
      <section class="ai loading" id="ai" aria-labelledby="aiTitle">
        <div class="ai-actions">
          <button class="icon-btn refresh" id="aiRefresh" type="button" aria-label="Regenerate summary" title="Regenerate summary">
            <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 11-1.7-4M13.5 2v2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="aiClose" type="button" aria-label="Close AI summary" title="Close">
            <svg><use href="#i-x"/></svg>
          </button>
        </div>
        <div class="ai-main">
          <div class="ai-head">
            <span class="ai-badge" id="aiTitle"><svg><use href="#i-spark"/></svg> AI summary</span>
            <span class="ai-meta" id="aiMeta"></span>
          </div>
          <div class="ai-skel" aria-hidden="true">
            <div class="sk big" style="width:92%"></div>
            <div class="sk big" style="width:78%"></div>
            <div class="sk big" style="width:48%"></div>
            <div class="sk-grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
          </div>
          <div class="ai-content" id="aiContent" aria-live="polite"></div>
        </div>
        <aside class="ai-side">
          <h3>Rating distribution</h3>
          <div class="ai-dist" id="aiDist"></div>
        </aside>
      </section>
    </div>
  </div>

  <section class="card" aria-label="Feedback submissions">
    <div class="toolbar">
      <div class="search" id="searchBox">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <label class="sr-only" for="q">Search feedback</label>
        <input id="q" type="search" placeholder="Search by event, participant, keyword…" autocomplete="off" spellcheck="false">
        <div class="search-end">
          <kbd aria-hidden="true">/</kbd>
          <button class="clear" id="clear" type="button" aria-label="Clear search"><svg><use href="#i-x"/></svg></button>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by rating"></div>
      <label class="mobile-sort">Sort
        <select id="mSort" aria-label="Sort submissions">
          <option value="date:desc">Date — newest first</option>
          <option value="date:asc">Date — oldest first</option>
          <option value="rating:desc">Rating — high to low</option>
          <option value="rating:asc">Rating — low to high</option>
          <option value="event:asc">Event — A to Z</option>
          <option value="event:desc">Event — Z to A</option>
          <option value="name:asc">Participant — A to Z</option>
          <option value="name:desc">Participant — Z to A</option>
          <option value="feedback:asc">Feedback — A to Z</option>
          <option value="feedback:desc">Feedback — Z to A</option>
        </select>
      </label>
    </div>

    <table id="table">
      <colgroup><col class="c-date"><col class="c-event"><col class="c-name"><col class="c-rating"><col></colgroup>
      <thead>
        <tr id="headRow"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="foot">
      <span id="count" role="status" aria-live="polite"></span>
      <span id="sortInfo"></span>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* ================= Data generation ================= */
  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rand(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const EVENTS = [
    { name: 'Leadership Summit 2026',        type: 'Conference · Chicago',   date: [2026, 2, 12] },
    { name: 'Product Vision Kickoff',        type: 'Town hall · Austin',     date: [2026, 4, 9] },
    { name: 'Design Systems Workshop',       type: 'Workshop · Lisbon',      date: [2026, 5, 21] },
    { name: 'Customer Success Forum',        type: 'Forum · Toronto',        date: [2026, 6, 18] },
    { name: 'Data & AI Innovation Day',      type: 'Conference · Berlin',    date: [2026, 8, 24] },
    { name: 'Annual Sales Conference',       type: 'Conference · Singapore', date: [2026, 9, 15] },
    { name: 'Partner Ecosystem Meetup',      type: 'Meetup · Amsterdam',     date: [2026, 9, 29] }
  ];

  const FIRST = ['Amelia','Marcus','Priya','Jonas','Sofia','Daniel','Hannah','Mateo','Yuki','Olivia','Kwame','Elena','Lucas','Aisha','Noah','Ingrid','Rafael','Mei','Thomas','Zara','Viktor','Camille','Omar','Nadia','Ethan','Leila','Sebastian','Tessa','Arjun','Greta','Felix','Naomi'];
  const LAST = ['Okafor','Lindqvist','Patel','Brenner','Moreau','Castillo','Nakamura','Whitfield','Haddad','Sorensen','Kowalski','Ferreira','Chen','Abernathy','Novak','Mbeki','Delgado','Fischer','Rahman','Sinclair','Vasquez','Olsen','Tanaka','Bianchi','Hughes','Demir','Kapoor','Laurent','Mwangi','Ritter','Park','Donovan'];

  const TOPICS = {
    speakers: { label: 'the speakers', pos: [
        'The keynote speaker was outstanding and managed to make a complex topic feel practical and relevant to my day-to-day work.',
        'Every presenter was well prepared, and the panel discussion in the afternoon was honestly the best I have attended in years.',
        'The speakers were engaging and generous with their time, staying on afterwards to answer questions one-on-one.'
      ], neg: [
        'Several speakers simply read from their slides, which made it hard to stay engaged through the afternoon.',
        'The keynote felt more like a sales pitch than a talk, and I left without anything concrete to apply.',
        'A couple of the presenters were clearly under-rehearsed and ran well past their allotted time.'
      ] },
    venue: { label: 'the venue', pos: [
        'The venue was beautiful, easy to reach by public transport, and the rooms were comfortable all day.',
        'I really appreciated the bright, spacious layout — there was always somewhere quiet to take a call between sessions.',
        'The location was a great choice, with clear signage and plenty of seating throughout.'
      ], neg: [
        'The main hall was far too cold and the seating was cramped, so it was difficult to concentrate after lunch.',
        'The venue was hard to find, parking was limited, and signage inside the building was almost non-existent.',
        'Breakout rooms were too small for the number of attendees, and several people had to stand at the back.'
      ] },
    catering: { label: 'catering', pos: [
        'Lunch was excellent, with plenty of vegetarian and gluten-free choices that were clearly labelled.',
        'The coffee stations were well stocked throughout the day, which made a bigger difference than you would think.',
        'Catering was a real highlight — fresh, varied and served quickly with almost no queueing.'
      ], neg: [
        'The lunch queue took nearly forty minutes and the vegetarian options had run out by the time I reached the front.',
        'Coffee ran out before the first break ended, and there was no water available in the session rooms.',
        'Food options were very limited for anyone with dietary restrictions, despite asking for this at registration.'
      ] },
    networking: { label: 'networking', pos: [
        'The structured networking session helped me meet three people I am already following up with this week.',
        'I made more useful connections here than at any other event this year, thanks largely to the small-group roundtables.',
        'The evening reception was well organised and made it easy to start conversations with people outside my own team.'
      ], neg: [
        'There was very little time set aside for networking, and the breaks were too short to have a real conversation.',
        'The networking hour felt unstructured and awkward — some icebreakers or themed tables would have helped a lot.',
        'I had hoped to meet peers from other regions, but there was no easy way to find out who else was attending.'
      ] },
    schedule: { label: 'scheduling', pos: [
        'The agenda was paced perfectly, with sessions starting on time and breaks exactly where they were needed.',
        'I liked that the day was split into shorter blocks, so it never felt overwhelming or rushed.',
        'Everything ran to schedule, which meant I could plan my day around the sessions I cared about most.'
      ], neg: [
        'Sessions consistently ran over, which meant the final talks were rushed and the Q&A was cut entirely.',
        'The schedule was too packed, with back-to-back sessions and barely five minutes to move between rooms.',
        'Two of the sessions I most wanted to attend were scheduled at the same time, which was frustrating.'
      ] },
    content: { label: 'session content', pos: [
        'The content was directly relevant to my role, and I came away with a full page of ideas to try with my team.',
        'The hands-on workshop was the most valuable part — working through real examples made the concepts stick.',
        'I appreciated the balance between high-level strategy and concrete case studies from real customers.'
      ], neg: [
        'Much of the content was too introductory for the audience, and I was hoping for far more depth.',
        'The sessions were heavy on theory and light on practical examples that we could actually take back to work.',
        'A lot of the material repeated what was shared at last year’s event, so there was little that felt new.'
      ] },
    logistics: { label: 'registration & logistics', pos: [
        'Registration took less than a minute and the pre-event emails told me everything I needed to know.',
        'The event app was genuinely useful for building my own agenda and finding rooms quickly.',
        'The organising team was friendly, visible and quick to solve any issue that came up.'
      ], neg: [
        'Check-in was chaotic, with a single desk for hundreds of people, and I missed the opening remarks as a result.',
        'Communication before the event was poor — the final agenda only arrived the night before.',
        'The event app kept crashing, so I had to rely on a printed schedule that was already out of date.'
      ] },
    av: { label: 'audio & visuals', pos: [
        'Sound and visuals were flawless, and the live captions on the main screen were a thoughtful touch.',
        'Slides were easy to read from anywhere in the room and the recordings were shared the very next day.',
        'The hybrid setup worked seamlessly, and remote colleagues told me they felt fully included.'
      ], neg: [
        'The microphones cut out repeatedly during the main session, and people at the back could barely hear.',
        'Slides were impossible to read from the back half of the room because the screen was far too small.',
        'The livestream dropped several times, so colleagues joining remotely missed large parts of the keynote.'
      ] }
  };
  const TOPIC_KEYS = Object.keys(TOPICS);

  const OPEN = {
    5: ['Easily one of the best events I have attended.', 'A fantastic day from start to finish.', 'I could not have asked for a better experience.', 'This exceeded my expectations in almost every way.'],
    4: ['Overall a very good event that I would happily attend again.', 'A really worthwhile day with only a few small things to improve.', 'I enjoyed this a lot and got real value from it.', 'Well organised and well worth the time away from my desk.'],
    3: ['A decent event overall, though it was a mixed experience for me.', 'There were some good moments, but it did not quite come together.', 'It was fine — neither a highlight nor a disappointment.', 'Some parts worked well while others clearly need attention.'],
    2: ['Unfortunately this fell short of what I was expecting.', 'I wanted to like this event, but several issues got in the way.', 'I left feeling a little disappointed, to be honest.', 'There is a lot of room for improvement here.'],
    1: ['I am sorry to say this was a frustrating experience.', 'This was not a good use of a full working day.', 'I was very disappointed with how this event was run.']
  };
  const CLOSE = {
    5: ['I have already recommended it to my whole team.', 'Please keep this exact format for next year.', 'Thank you to everyone involved — I will definitely be back.'],
    4: ['With a couple of small tweaks this would be a five-star event.', 'Looking forward to the next one.', 'I would recommend it to colleagues.'],
    3: ['I would consider returning if these points are addressed.', 'It has potential, but it needs some refinement.', 'On balance I am glad I went, but I expected a little more.'],
    2: ['I hope the team takes this feedback on board before the next edition.', 'I am unlikely to attend again unless things change.', 'There was a good event in here somewhere, but the execution let it down.'],
    1: ['I will not be attending again unless there are significant changes.', 'I would strongly encourage a rethink before the next edition.', 'I expected far better given the cost and travel involved.']
  };
  const BRIDGE_NEG = ['That said, ', 'My only real complaint: ', 'One thing to improve — ', 'On the downside, '];
  const BRIDGE_POS = ['On a positive note, ', 'To be fair, ', 'One bright spot: ', 'In fairness, '];
  const lowerFirst = (s) => /^I\b/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1);

  function buildFeedback(rating) {
    const plan = { 5: [2, 0], 4: [2, 1], 3: [1, 1], 2: [1, 2], 1: [0, 2] }[rating];
    if (rating === 5 && Math.random() < .5) plan[0] = 3;
    if (rating === 1 && Math.random() < .5) plan[1] = 3;
    const topics = shuffle(TOPIC_KEYS).slice(0, plan[0] + plan[1]);
    const pos = topics.slice(0, plan[0]), neg = topics.slice(plan[0]);
    const parts = [pick(OPEN[rating])];
    if (rating >= 4) {
      pos.forEach(t => parts.push(pick(TOPICS[t].pos)));
      neg.forEach(t => parts.push(pick(BRIDGE_NEG) + lowerFirst(pick(TOPICS[t].neg))));
    } else {
      neg.forEach(t => parts.push(pick(TOPICS[t].neg)));
      pos.forEach(t => parts.push(pick(BRIDGE_POS) + lowerFirst(pick(TOPICS[t].pos))));
    }
    parts.push(pick(CLOSE[rating]));
    return { text: parts.join(' '), pos, neg };
  }

  function generate(n) {
    const firsts = shuffle(FIRST), lasts = shuffle(LAST);
    const weights = [5,5,5,5,5,5,5,5,5, 4,4,4,4,4,4,4,4,4,4, 3,3,3,3,3, 2,2,2,2, 1,1];
    const ratings = shuffle(weights);
    const today = new Date();
    const rows = [];
    for (let i = 0; i < n; i++) {
      const ev = EVENTS[i < EVENTS.length ? i : rand(EVENTS.length)];
      const d = new Date(ev.date[0], ev.date[1] - 1, ev.date[2] + rand(9));
      const rating = ratings[i % ratings.length];
      const fb = buildFeedback(rating);
      const name = firsts[i % firsts.length] + ' ' + lasts[i % lasts.length];
      rows.push({
        id: i, date: d > today ? today : d, event: ev.name, eventType: ev.type,
        name, rating, feedback: fb.text, pos: fb.pos, neg: fb.neg
      });
    }
    return rows;
  }

  const DATA = generate(30);

  /* ================= Helpers ================= */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const fmtDay = (d) => d.toLocaleDateString('en-US', { weekday: 'long' });
  const initials = (n) => n.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const toneOf = (r) => r >= 4 ? ['good', 'Positive'] : r === 3 ? ['mid', 'Neutral'] : ['bad', 'Critical'];
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  function highlighter(terms) {
    if (!terms.length) return esc;
    const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length).join('|') + ')', 'gi');
    return (s) => String(s).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
  }

  /* ================= State ================= */
  const COLS = [
    { key: 'date', label: 'Date', first: 'desc' },
    { key: 'event', label: 'Event', first: 'asc' },
    { key: 'name', label: 'Participant', first: 'asc' },
    { key: 'rating', label: 'Rating', first: 'desc' },
    { key: 'feedback', label: 'Feedback', first: 'asc' }
  ];
  const FILTERS = [
    { key: 'all', label: 'All', test: () => true },
    { key: 'pos', label: 'Positive', test: (r) => r.rating >= 4 },
    { key: 'mid', label: 'Neutral', test: (r) => r.rating === 3 },
    { key: 'neg', label: 'Critical', test: (r) => r.rating <= 2 }
  ];
  const state = { q: '', sort: 'date', dir: 'desc', filter: 'all', open: new Set() };

  /* ================= KPIs ================= */
  const avg = DATA.reduce((s, r) => s + r.rating, 0) / DATA.length;
  const posCount = DATA.filter(r => r.rating >= 4).length;
  const posPct = Math.round(posCount / DATA.length * 100);
  const eventNames = [...new Set(DATA.map(r => r.event))];

  $('kpis').innerHTML = [
    ['Avg. rating', avg.toFixed(1) + '<small>/ 5</small>'],
    ['Responses', DATA.length],
    ['Positive', posPct + '<small>%</small>'],
    ['Events', eventNames.length]
  ].map(([l, v]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div></div>`).join('');

  /* ================= AI summary ================= */
  function topTopic(side) {
    const c = {};
    DATA.forEach(r => r[side].forEach(t => c[t] = (c[t] || 0) + 1));
    const e = Object.entries(c).sort((a, b) => b[1] - a[1]);
    return e.length ? { key: e[0][0], n: e[0][1], second: e[1] } : null;
  }
  function eventStats() {
    return eventNames.map(n => {
      const rs = DATA.filter(r => r.event === n);
      return { name: n, n: rs.length, avg: rs.reduce((s, r) => s + r.rating, 0) / rs.length };
    }).sort((a, b) => b.avg - a.avg || b.n - a.n);
  }
  let variant = 0;
  function summaryHTML() {
    const praise = topTopic('pos'), issue = topTopic('neg'), evs = eventStats();
    const best = evs[0], worst = evs[evs.length - 1];
    const mood = avg >= 4.2 ? 'overwhelmingly positive' : avg >= 3.6 ? 'largely positive' : avg >= 3 ? 'mixed but leaning positive' : 'mixed, with clear frustrations';
    const lead = variant % 2 === 0
      ? `Across <b>${DATA.length} submissions</b> from ${eventNames.length} events, sentiment is <b>${mood}</b> — participants gave an average of ${avg.toFixed(1)} out of 5, and ${posPct}% rated their experience four stars or higher.`
      : `Participants are <b>${mood}</b> about this year’s programme: ${posCount} of ${DATA.length} respondents gave four or five stars, for an overall average of <b>${avg.toFixed(1)} out of 5</b> across ${eventNames.length} events.`;
    const p2 = praise && praise.second ? ` followed by ${TOPICS[praise.second[0]].label}` : '';
    const i2 = issue && issue.second ? `, then ${TOPICS[issue.second[0]].label}` : '';
    const points = [
      ['#8fe3c8', 'What worked', praise ? `<span class="hl">${cap(TOPICS[praise.key].label)}</span> drew the most praise (${plural(praise.n, 'mention')})${p2}.` : 'No clear positive theme emerged.'],
      ['#ffb199', 'What to improve', issue ? `<span class="hl">${cap(TOPICS[issue.key].label)}</span> was the most common complaint (${plural(issue.n, 'mention')})${i2}.` : 'No recurring complaints were raised.'],
      ['#b9b1ff', 'Events to watch', `<span class="hl">${esc(best.name)}</span> leads at ${best.avg.toFixed(1)}★` + (worst.name !== best.name ? `; <span class="hl">${esc(worst.name)}</span> trails at ${worst.avg.toFixed(1)}★.` : '.')]
    ];
    return `<p class="ai-lead">${lead}</p><ul class="ai-points">` +
      points.map(([c, t, b]) => `<li><strong><span class="dot" style="background:${c}"></span>${t}</strong>${b}</li>`).join('') + '</ul>';
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderDist() {
    const counts = [5, 4, 3, 2, 1].map(r => DATA.filter(d => d.rating === r).length);
    const max = Math.max(...counts);
    $('aiDist').innerHTML = [5, 4, 3, 2, 1].map((r, i) =>
      `<div class="dist-row"><span class="lbl">${r}<svg><use href="#i-star"/></svg></span><div class="dist-track"><div class="dist-fill" data-w="${counts[i] / max * 100}"></div></div><span class="n">${counts[i]}</span></div>`).join('');
  }
  let aiTimer;
  function loadSummary(delay) {
    const ai = $('ai');
    ai.classList.add('loading');
    $('aiMeta').textContent = 'Analysing ' + DATA.length + ' responses…';
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      $('aiContent').innerHTML = summaryHTML();
      $('aiContent').classList.remove('fade-in'); void $('aiContent').offsetWidth; $('aiContent').classList.add('fade-in');
      ai.classList.remove('loading');
      $('aiMeta').textContent = 'Based on ' + DATA.length + ' responses · updated just now';
      document.querySelectorAll('.dist-fill').forEach(el => el.style.width = el.dataset.w + '%');
      variant++;
    }, delay);
  }
  renderDist();
  loadSummary(1000);

  $('aiRefresh').addEventListener('click', () => loadSummary(900));
  $('aiClose').addEventListener('click', () => {
    $('aiWrap').classList.add('closed');
    $('aiWrap').setAttribute('inert', '');
    $('reopen').classList.add('show');
    $('reopen').focus();
  });
  $('reopen').addEventListener('click', () => {
    $('aiWrap').classList.remove('closed');
    $('aiWrap').removeAttribute('inert');
    $('reopen').classList.remove('show');
    $('aiClose').focus();
  });

  /* ================= Table ================= */
  const sortIcon = '<svg class="sort-ico" viewBox="0 0 10 14" aria-hidden="true"><path class="up" d="M5 0.5L9.2 5.6H0.8z"/><path class="down" d="M5 13.5L0.8 8.4h8.4z"/></svg>';
  $('headRow').innerHTML = COLS.map(c =>
    `<th scope="col" data-key="${c.key}" aria-sort="none"><button class="th-btn" type="button" title="Sort by ${c.label.toLowerCase()}">${c.label}${sortIcon}</button></th>`).join('');

  $('chips').innerHTML = FILTERS.map(f =>
    `<button class="chip" type="button" data-f="${f.key}" aria-pressed="${f.key === 'all'}">${f.label}<span class="cnt">${DATA.filter(f.test).length}</span></button>`).join('');

  const starsHTML = (r) => '<span class="stars" aria-hidden="true">' +
    [1, 2, 3, 4, 5].map(i => `<svg class="${i <= r ? 'on' : ''}"><use href="#i-star"/></svg>`).join('') + '</span>';

  function compare(a, b) {
    let v;
    switch (state.sort) {
      case 'date': v = a.date - b.date; break;
      case 'rating': v = a.rating - b.rating; break;
      default: v = a[state.sort].localeCompare(b[state.sort], 'en', { sensitivity: 'base' });
    }
    if (state.dir === 'desc') v = -v;
    return v || (b.date - a.date) || a.name.localeCompare(b.name);
  }

  function render(animate) {
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const filter = FILTERS.find(f => f.key === state.filter);
    const hl = highlighter(terms);
    const rows = DATA.filter(filter.test).filter(r => {
      if (!terms.length) return true;
      const hay = [fmtDate(r.date), fmtDay(r.date), r.event, r.eventType, r.name, r.rating + ' stars', toneOf(r.rating)[1], r.feedback].join(' \n ').toLowerCase();
      return terms.every(t => hay.includes(t));
    }).sort(compare);

    const tbody = $('rows');
    if (!rows.length) {
      tbody.innerHTML = `<tr class="empty"><td colspan="5">
        <div class="empty-ico"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <h4>No matching feedback</h4>
        <p>Nothing matches ${state.q.trim() ? '“' + esc(state.q.trim()) + '”' : 'this filter'}${state.filter !== 'all' && state.q.trim() ? ' in ' + filter.label.toLowerCase() + ' submissions' : ''}.</p>
        <button class="btn" type="button" id="reset">Clear search &amp; filters</button></td></tr>`;
    } else {
      tbody.innerHTML = rows.map((r, i) => {
        const [tc, tl] = toneOf(r.rating);
        const h = hue(r.name);
        const fbMatch = terms.length && terms.some(t => r.feedback.toLowerCase().includes(t));
        const open = state.open.has(r.id) || fbMatch;
        return `<tr data-id="${r.id}" class="${animate ? 'row-in' : ''}" style="${animate ? 'animation-delay:' + Math.min(i * 14, 240) + 'ms' : ''}">
          <td class="td-date"><div class="date">${hl(fmtDate(r.date))}</div><div class="muted">${hl(fmtDay(r.date))}</div></td>
          <td class="td-event"><div class="event-name">${hl(r.event)}</div><div class="muted">${hl(r.eventType)}</div></td>
          <td class="td-name"><div class="person"><span class="avatar" style="background:hsl(${h} 42% 90%);color:hsl(${h} 45% 28%)" aria-hidden="true">${initials(r.name)}</span><span class="person-name">${hl(r.name)}</span></div></td>
          <td class="td-rating"><div class="rating" role="img" aria-label="${r.rating} out of 5 stars">${starsHTML(r.rating)}<span class="rating-num">${r.rating}.0</span></div><span class="tone ${tc}">${hl(tl)}</span></td>
          <td class="td-fb"><div class="fb${open ? ' open' : ''}${fbMatch ? ' forced' : ''}"><p class="fb-text">${hl(r.feedback)}</p>
            <button class="fb-more" type="button" aria-expanded="${open}"><span>${open ? 'Show less' : 'Show more'}</span><svg><use href="#i-chev"/></svg></button></div></td>
        </tr>`;
      }).join('');
    }

    document.querySelectorAll('#headRow th').forEach(th => {
      th.setAttribute('aria-sort', th.dataset.key === state.sort ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none');
    });
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.f === state.filter)));
    $('searchBox').classList.toggle('has-value', !!state.q);
    $('mSort').value = state.sort + ':' + state.dir;

    $('count').innerHTML = rows.length === DATA.length
      ? `Showing all <b>${DATA.length}</b> submissions`
      : `Showing <b>${rows.length}</b> of ${DATA.length} submissions`;
    const col = COLS.find(c => c.key === state.sort);
    const dirLabel = { date: ['oldest first', 'newest first'], rating: ['lowest first', 'highest first'] }[state.sort] || ['A → Z', 'Z → A'];
    $('sortInfo').innerHTML = `Sorted by <b>${col.label.toLowerCase()}</b>, ${dirLabel[state.dir === 'asc' ? 0 : 1]}`;
    measure();
  }

  // Only offer "Show more" where the text is actually truncated.
  function measure() {
    document.querySelectorAll('#rows .fb').forEach(fb => {
      if (fb.classList.contains('forced')) { fb.classList.remove('can-toggle'); return; }
      if (fb.classList.contains('open')) { fb.classList.add('can-toggle'); return; }
      const p = fb.firstElementChild;
      fb.classList.toggle('can-toggle', p.scrollHeight > p.clientHeight + 2);
    });
  }

  /* ================= Events ================= */
  $('headRow').addEventListener('click', (e) => {
    const th = e.target.closest('th'); if (!th) return;
    const key = th.dataset.key;
    if (state.sort === key) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort = key; state.dir = COLS.find(c => c.key === key).first; }
    render(true);
  });
  $('mSort').addEventListener('change', (e) => {
    [state.sort, state.dir] = e.target.value.split(':'); render(true);
  });
  $('chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    state.filter = c.dataset.f; render(true);
  });
  const q = $('q');
  q.addEventListener('input', () => { state.q = q.value; render(false); });
  q.addEventListener('keydown', (e) => { if (e.key === 'Escape' && q.value) { e.preventDefault(); q.value = ''; state.q = ''; render(false); } });
  $('clear').addEventListener('click', () => { q.value = ''; state.q = ''; render(false); q.focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); q.focus(); q.select();
    }
  });
  $('rows').addEventListener('click', (e) => {
    if (e.target.closest('#reset')) { q.value = ''; state.q = ''; state.filter = 'all'; render(true); q.focus(); return; }
    const btn = e.target.closest('.fb-more'); if (!btn) return;
    const id = +btn.closest('tr').dataset.id, fb = btn.closest('.fb');
    const open = !fb.classList.contains('open');
    open ? state.open.add(id) : state.open.delete(id);
    fb.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.firstElementChild.textContent = open ? 'Show less' : 'Show more';
    if (!open) measure();
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  render(true);
})();
</script>
</body>
</html>
