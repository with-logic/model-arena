function icon(name,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.leaf}</svg>`}
function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}
const $=(selector,root=document)=>root.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=n=>Math.round(n).toLocaleString('en-US');
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=localDate(new Date());
const dateObject=s=>new Date(s+'T12:00:00');

const defaultGoals={calories:2000,protein:100,carbs:250,fat:65,water:8};

 {id:'recipe-toast',name:'Avocado & egg toast',type:'Breakfast',time:'08:30',image:'toast',ingredients:[{name:'Sourdough',amount:'1 slice',calories:130,protein:5,carbs:25,fat:1},{name:'Avocado',amount:'½ medium',calories:120,protein:2,carbs:6,fat:11},{name:'Eggs',amount:'2 medium',calories:140,protein:14,carbs:1,fat:7},{name:'Cherry tomatoes',amount:'100 g',calories:30,protein:2,carbs:11,fat:0}]},

 {id:'recipe-yogurt',name:'Berry yogurt bowl',type:'Snack',time:'15:30',image:'yogurt',ingredients:[{name:'Greek yogurt',amount:'170 g',calories:130,protein:15,carbs:9,fat:4},{name:'Strawberries',amount:'100 g',calories:35,protein:1,carbs:8,fat:0},{name:'Granola',amount:'25 g',calories:100,protein:2,carbs:13,fat:5},{name:'Honey',amount:'1 tsp',calories:15,protein:0,carbs:4,fat:0}]}
];
const clone=o=>JSON.parse(JSON.stringify(o));
const STORAGE_KEY='healthy-meal-tracker-v1';
let state={goals:{...defaultGoals},name:'',days:{[today]:{meals:recipes.map((r,i)=>({...clone(r),id:'starter-'+i})),water:6}}};
let saveAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&saved.days&&typeof saved.days==='object'&&saved.goals){state={...state,...saved,goals:{...defaultGoals,...saved.goals}}}}catch(e){saveAvailable=false}
let view=['today','library','insights','goals'].includes(location.hash.slice(1))?location.hash.slice(1):'today';
let selectedDate=today,libraryFilter='All meals',librarySearch='',editingId=null,editingDate=null,editingImage='salad',detailMeal=null,toastTimer,undoAction=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){saveAvailable=false;return false}}
function day(date=selectedDate){return state.days[date]||{meals:[],water:0}}
function ensureDay(date=selectedDate){return state.days[date]||(state.days[date]={meals:[],water:0})}
function nutrition(meal){return meal.ingredients.reduce((sum,i)=>{for(const k of ['calories','protein','carbs','fat'])sum[k]+=Number(i[k])||0;return sum},{calories:0,protein:0,carbs:0,fat:0})}
function totals(date=selectedDate){return day(date).meals.reduce((sum,m)=>{const n=nutrition(m);for(const k in sum)sum[k]+=n[k];return sum},{calories:0,protein:0,carbs:0,fat:0})}
function timeLabel(time){const [h,m]=time.split(':');return `${Number(h)%12||12}:${m} ${Number(h)>=12?'PM':'AM'}`}
function dateLabel(date=selectedDate){return date===today?'Today':dateObject(date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function toast(message,undo=null){clearTimeout(toastTimer);undoAction=undo;$('#toast').innerHTML=icon('check')+`<span>${esc(message)}</span>`+(undo?'<button data-action="undo">Undo</button>':'');$('#toast').classList.add('visible');toastTimer=setTimeout(()=>{$('#toast').classList.remove('visible');undoAction=null},undo?8000:3500)}
function savedToast(message,undo=null){toast(saveAvailable?message:message+' · Storage unavailable; keep this tab open.',undo)}
function closeMenu(){$('#sidebar').classList.remove('open');$('#sidebar-overlay').classList.remove('visible');$('.mobile-menu').setAttribute('aria-expanded','false')}
function setView(next){view=next;location.hash=next;closeMenu();render();window.scrollTo({top:0,behavior:'instant'})}
function footer(){return `<footer class="page-footer"><span class="footer-brand">${icon('sprout')}<span>Good food. Good habits. A little better every day.</span></span><button class="footer-link" data-action="export">${icon('download')} Export daily summary</button></footer>`}
function pageHeading(title,subtitle,action=true){return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${action?`<button class="button button-primary" data-action="add-meal">${icon('plus')} Log a meal</button>`:`<span class="welcome-pill">${icon('leaf')} Made for your wellbeing</span>`}</div>`}
function statCards(n){const stats=[['calories','Calories','fire','#759461','#edf2e7','kcal'],['protein','Protein','protein','#bc9fc7','#f4eef5','g'],['carbs','Carbs','wheat','#d6ad72','#f9f2e7','g'],['fat','Healthy fats','avocado','#7dada1','#ecf4f0','g']];return `<div class="stat-grid">${stats.map(([key,label,ico,color,tint,unit])=>`<article class="stat-card" style="--color:${color};--tint:${tint}"><div class="stat-head"><span class="stat-label">${label}</span><span class="stat-icon">${icon(ico)}</span></div><div class="stat-number">${number(n[key])}<span>/ ${number(state.goals[key])} ${unit}</span></div><div class="stat-progress" role="progressbar" aria-label="${label} daily goal" aria-valuenow="${Math.round(n[key])}" aria-valuemin="0" aria-valuemax="${Math.max(state.goals[key],Math.round(n[key]))}"><span style="width:${Math.min(100,n[key]/state.goals[key]*100)}%"></span></div><div class="stat-caption"><span>${Math.round(n[key]/state.goals[key]*100)}% of daily goal</span><span>${n[key]<=state.goals[key]?number(state.goals[key]-n[key])+' '+unit+' left':number(n[key]-state.goals[key])+' '+unit+' over'}</span></div></article>`).join('')}</div>`}
function mealCard(meal,library=false){const n=nutrition(meal);return `<article class="meal-card"><button class="meal-image-button" data-action="${library?'recipe-detail':'meal-detail'}" data-id="${esc(meal.id)}" aria-label="View ${esc(meal.name)}"><img class="meal-image" src="${ASSETS[meal.image]||ASSETS.salad}" alt="${esc(meal.name)}" loading="eager"><span class="meal-type">${icon(typeIcons[meal.type])}${esc(meal.type)}</span></button>${library?'':`<button class="meal-menu" data-action="edit-meal" data-id="${esc(meal.id)}" aria-label="Edit ${esc(meal.name)}">${icon('edit')}</button>`}<div class="meal-body"><div class="meal-time">${icon(library?'bowl':'clock')}${library?meal.ingredients.length+' ingredients':timeLabel(meal.time)}</div><button class="meal-name" data-action="${library?'recipe-detail':'meal-detail'}" data-id="${esc(meal.id)}">${esc(meal.name)}</button><div class="ingredient-tags">${meal.ingredients.slice(0,2).map(i=>`<span class="ingredient-tag">${esc(i.name)}</span>`).join('')}${meal.ingredients.length>2?`<span class="ingredient-tag">+${meal.ingredients.length-2}</span>`:''}</div><div class="meal-footer"><span class="meal-cal">${icon('fire')}${number(n.calories)} <small>kcal</small></span><span class="meal-macros"><b>P</b> ${number(n.protein)} &nbsp;<b>C</b> ${number(n.carbs)} &nbsp;<b>F</b> ${number(n.fat)}</span></div>${library?`<button class="button button-quiet library-add" data-action="use-recipe" data-id="${esc(meal.id)}">${icon('plus')} Add to my day</button>`:''}</div></article>`}
function balancePanel(n){const total=n.protein*4+n.carbs*4+n.fat*9;const categories=[['Protein',n.protein,'#bba1c6',4],['Carbs',n.carbs,'#d7b27d',4],['Fats',n.fat,'#88ada1',9]];const shares=categories.map(([,v,,k])=>total?v*k/total*100:0),percents=shares.map(Math.floor);if(total){const order=shares.map((v,i)=>({i,fraction:v-percents[i]})).sort((a,b)=>b.fraction-a.fraction);for(let i=0,remaining=100-percents.reduce((a,b)=>a+b,0);i<remaining;i++)percents[order[i].i]++;}let offset=0;const rings=categories.map(([label,v,c,k])=>{const amount=total?v*k/total*100:0;const circle=`<circle cx="66" cy="66" r="54" fill="none" stroke="${c}" stroke-width="10" pathLength="100" stroke-dasharray="${Math.max(0,amount-1.8)} ${100-Math.max(0,amount-1.8)}" stroke-dashoffset="${-offset}" stroke-linecap="round"/>`;offset+=amount;return amount>0?circle:''}).join('');const remaining=state.goals.calories-n.calories;return `<section class="panel balance-panel"><div class="panel-heading"><h2>Daily balance</h2>${icon('leaf')}</div><p class="balance-topline">A little of everything good.</p><div class="balance-chart" role="img" aria-label="${number(Math.abs(remaining))} calories ${remaining>=0?'remaining':'over goal'}"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="54" fill="none" stroke="#f1f3ed" stroke-width="10"/>${rings}</svg><div class="ring-center"><strong>${number(Math.abs(remaining))}</strong><span>kcal ${remaining>=0?'remaining':'over goal'}</span></div></div><div class="balance-legend">${categories.map(([label,v,c,k],index)=>`<div class="legend-row"><span class="dot" style="--dot:${c}"></span>${label}<strong>${number(v)} g</strong><small>${percents[index]}%</small></div>`).join('')}</div></section>`}
function glass(filled){return `<svg viewBox="0 0 21 27" fill="none" aria-hidden="true"><path d="M3 3h15l-2 21H5L3 3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>${filled?'<path d="m4 11 2 12h9l1-12c-4 2-8-2-12 0Z" fill="currentColor" opacity=".62"/>':''}<path d="M7 7v4" stroke="white" opacity=".8" stroke-linecap="round"/></svg>`}
function waterPanel(){const count=day().water,target=state.goals.water,visible=Math.max(target,Math.min(count,16));return `<section class="panel water-panel"><div class="water-heading">${icon('drop')} A sip in the right direction</div><div class="water-number">${(count*.25).toLocaleString('en-US',{maximumFractionDigits:2})} L <span>/ ${(target*.25).toLocaleString('en-US',{maximumFractionDigits:2})} L daily goal</span></div><div class="water-glasses">${Array.from({length:Math.min(visible,16)},(_,i)=>`<button class="glass-button ${i<count?'filled':''}" data-action="water-set" data-count="${i+1}" aria-label="${i<count?'Set water intake to '+i:'Log '+(i+1)} glasses" title="${i+1} glass${i?'es':''} · ${(i+1)*250} ml">${glass(i<count)}</button>`).join('')}</div><div class="water-foot"><span>${count} of ${target} glasses${count>=target?' · Goal reached!':''}</span><button class="water-add" data-action="water-add">${icon('plus')} Add water</button></div></section>`}
function renderToday(){const n=totals(),meals=day().meals.slice().sort((a,b)=>a.time.localeCompare(b.time));return pageHeading('A good day starts here.', 'A little intention in every bite. Here’s your daily picture.')+`<section class="hero"><div class="hero-content"><div class="hero-kicker">${icon('sprout')} Small steps. Lasting habits.</div><h2>Your day, well nourished.</h2><p>Fill your plate with good things.<br>We’ll take care of the bigger picture.</p></div><div class="hero-art" aria-hidden="true"><img class="hero-bowl" src="${ASSETS.hero}" alt=""><span class="hero-leaf one">${icon('leaf')}</span><span class="hero-leaf two">${icon('leaf')}</span></div><span class="hero-tag">${icon('heart')} Made of the good stuff</span></section>`+statCards(n)+`<div class="dashboard-lower"><section><div class="section-heading"><div class="section-title"><h2>Your meals</h2><span class="count-badge">${meals.length} logged</span></div><div class="date-controls"><button class="icon-button" data-action="previous-day" aria-label="Previous day">${icon('left')}</button><label class="date-button">${icon('calendar')}${dateLabel()}<input type="date" id="day-picker" value="${selectedDate}" aria-label="Choose journal date"></label><button class="icon-button" data-action="next-day" aria-label="Next day">${icon('chevron')}</button></div></div><div class="meal-grid">${meals.length?meals.map(m=>mealCard(m)).join(''):`<div class="empty-state">${icon('bowl')}<h3>A fresh page for your plate.</h3><p>Log your first meal and watch your day come together.</p><button class="button button-primary" data-action="add-meal">${icon('plus')} Log a meal</button></div>`}</div>${meals.length?`<button class="add-meal-placeholder" data-action="add-dinner"><span>${icon('plus')}</span><span><strong>${meals.some(m=>m.type==='Dinner')?'Something else on your plate?':'What’s for dinner?'}</strong><small>${meals.some(m=>m.type==='Dinner')?'Every bite is part of your day. Log it here.':'There’s room for something delicious. Log your next meal.'}</small></span></button>`:''}<p class="bottom-note">${icon('leaf')} Nourishment over numbers. Every balanced choice counts.</p></section><aside class="right-column" aria-label="Daily nutrition and hydration">${balancePanel(n)}${waterPanel()}</aside></div>`+footer()}
function renderLibrary(){const matched=recipes.filter(r=>(libraryFilter==='All meals'||r.type===libraryFilter)&&(`${r.name} ${r.ingredients.map(i=>i.name).join(' ')}`.toLowerCase().includes(librarySearch.toLowerCase())));return pageHeading('Good things on repeat.','A few balanced favorites to make meal logging feel effortless.')+`<div class="filter-row">${['All meals',...types].map(t=>`<button class="filter-button ${t===libraryFilter?'active':''}" data-action="filter" data-filter="${t}" aria-pressed="${t===libraryFilter}">${t}</button>`).join('')}<label class="search-box">${icon('search')}<input id="library-search" type="search" placeholder="Find a meal or ingredient" value="${esc(librarySearch)}" aria-label="Search meal library"></label></div><div class="library-grid" id="library-results">${matched.length?matched.map(m=>mealCard(m,true)).join(''):`<div class="empty-state">${icon('search')}<h3>No meals here yet.</h3><p>Try another ingredient or create a meal of your own.</p><button class="button button-primary" data-action="add-meal">${icon('plus')} Create a meal</button></div>`}</div><p class="library-note">Nutrition values are estimates. Adjust ingredients and portions when adding a meal.</p>`+footer()}
function renderInsights(){const dates=Array.from({length:7},(_,i)=>{const d=dateObject(selectedDate);d.setDate(d.getDate()-6+i);return localDate(d)});const data=dates.map(d=>({date:d,...totals(d),count:day(d).meals.length}));const logged=data.filter(d=>d.count),sum=data.reduce((a,d)=>a+d.calories,0),max=Math.max(state.goals.calories,...data.map(d=>d.calories));return pageHeading('See the bigger picture.','Your nutrition journal, one day at a time.',false)+`<div class="insight-grid"><section class="panel chart-panel"><h2>Your week in nourishment</h2><p class="chart-subtitle">Daily calories · ${dateObject(dates[0]).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${dateObject(selectedDate).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</p><div class="week-chart" role="img" aria-label="Daily calories for the last seven days: ${data.map(d=>d.date+' '+Math.round(d.calories)+' kcal').join(', ')}">${data.map(d=>`<div class="day-column"><span class="day-value">${d.count?number(d.calories):'—'}</span><div class="day-bar" style="--height:${d.calories/max*80}%"></div><span class="day-label">${dateObject(d.date).toLocaleDateString('en-US',{weekday:'short'})}</span></div>`).join('')}</div><p class="chart-subtitle" style="margin-top:16px">Days without entries are shown as a dash. Keep logging to see your habits take shape.</p></section><section class="panel chart-panel"><h2>This week, so far</h2><div class="insight-summary"><div class="insight-item"><span>Average per logged day</span><strong>${logged.length?number(sum/logged.length):'—'}</strong><small>kcal</small></div><div class="insight-item"><span>Meals enjoyed</span><strong>${data.reduce((a,d)=>a+d.count,0)}</strong><small>meals</small></div><div class="insight-item"><span>Days you showed up</span><strong>${logged.length}</strong><small>of 7 days</small></div></div></section></div><div style="margin-top:24px">${statCards(totals())}</div>`+footer()}
function renderGoals(){return pageHeading('Your goals. Your pace.','Set daily targets that feel right for you. You can change them anytime.',false)+`<div class="goal-layout"><form id="goals-form" class="panel goal-panel"><h2>Daily nutrition goals</h2>${[['calories','Daily calories','fire','kcal',100,20000],['protein','Protein','protein','g',1,1000],['carbs','Carbohydrates','wheat','g',1,2000],['fat','Fats','avocado','g',1,1000],['water','Water','drop','glasses',1,16]].map(([key,label,ico,unit,min,max])=>`<label class="goal-field"><span class="goal-label">${icon(ico)}${label}</span><span class="input-unit"><input name="${key}" aria-label="${label} target" type="number" min="${min}" max="${max}" step="1" required value="${state.goals[key]}"><span>${unit}</span></span></label>`).join('')}<p class="form-help">One glass of water is 250 ml.</p><button class="button button-primary" type="submit">${icon('check')} Save my goals</button></form><aside class="goal-aside">${icon('plant')}<h3>Progress is personal.<br>Make space for yours.</h3><p>Your needs are unique. Use these goals as a gentle guide and adjust them to fit your routine.</p><p>Building a specific nutrition plan? A registered dietitian can help find the balance that’s right for you.</p></aside></div>`+footer()}
function render(){const labels={today:'Daily overview',library:'Meal library',insights:'Nutrition insights',goals:'My goals'};$('#main').innerHTML=({today:renderToday,library:renderLibrary,insights:renderInsights,goals:renderGoals}[view])();$('#breadcrumb-title').textContent=labels[view];document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#profile-name').textContent=state.name||'Your space';$('#avatar').textContent=state.name?state.name.split(' ').map(p=>p[0]).filter(Boolean).slice(0,2).join('').toUpperCase():'YO';$('#today-label').innerHTML=icon('calendar')+esc(new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}));}
function ingredientRow(i={name:'',amount:'',calories:'',protein:'',carbs:'',fat:''}){return `<div class="ingredient-row"><input data-field="name" value="${esc(i.name)}" placeholder="e.g. Quinoa" aria-label="Ingredient name" maxlength="60" required><input data-field="amount" value="${esc(i.amount)}" placeholder="100 g" aria-label="Ingredient portion" maxlength="30" required>${['calories','protein','carbs','fat'].map(k=>`<input data-field="${k}" type="number" value="${i[k]}" min="0" max="${k==='calories'?10000:1000}" step="${k==='calories'?'1':'0.1'}" placeholder="0" aria-label="Ingredient ${k}" ${k==='calories'?'required':''}>`).join('')}<button type="button" data-action="remove-ingredient" aria-label="Remove ingredient">${icon('close')}</button></div>`}
function readIngredients(){return Array.from($('#ingredients-editor').children).map(row=>Object.fromEntries(Array.from(row.querySelectorAll('input')).map(input=>[input.dataset.field,['name','amount'].includes(input.dataset.field)?input.value.trim():Math.max(0,Number(input.value)||0)])))}
function updateNutritionPreview(){const n=nutrition({ingredients:readIngredients()});$('#nutrition-preview').innerHTML=[['calories','Calories','kcal'],['protein','Protein','g'],['carbs','Carbs','g'],['fat','Fats','g']].map(([key,label,unit])=>`<div><span>${label}</span><strong>${number(n[key])} <small>${unit}</small></strong></div>`).join('')}
function openMeal(meal=null,copy=false,type=null){$('#detail-dialog').close();editingId=meal&&!copy?meal.id:null;editingDate=selectedDate;editingImage=meal?.image||({Breakfast:'toast',Lunch:'salad',Dinner:'salad',Snack:'yogurt'}[type]||'salad');const m=meal?clone(meal):{name:'',type:type||'Lunch',time:new Date().toTimeString().slice(0,5),ingredients:[{name:'',amount:'',calories:'',protein:'',carbs:'',fat:''}]};const dialog=$('#meal-dialog');dialog.innerHTML=`<div class="modal-head"><div><h2 id="meal-dialog-title">${editingId?'Edit your meal':'A little goodness, logged.'}</h2><p>${editingId?'Make your meal a little more you.':'What’s on your plate? Every ingredient counts.'}</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close meal form">${icon('close')}</button></div><form id="meal-form" class="modal-body"><div class="form-grid"><label class="field full">Meal name<input id="meal-name" name="name" placeholder="e.g. My favorite quinoa bowl" value="${esc(m.name)}" required maxlength="80"></label><label class="field">Meal type<select name="type">${types.map(t=>`<option ${m.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Time<input name="time" type="time" value="${m.time}" required></label><label class="field full">Date<input name="date" type="date" value="${selectedDate}" required></label></div><div class="form-section"><h3>What’s in it?</h3><button type="button" class="text-button" data-action="add-ingredient">${icon('plus')} Add ingredient</button></div><div class="ingredient-row ingredient-table-head"><span>Ingredient</span><span>Portion</span><span>kcal</span><span>P (g)</span><span>C (g)</span><span>F (g)</span><span></span></div><div class="ingredients-editor" id="ingredients-editor">${m.ingredients.map(ingredientRow).join('')}</div><p class="form-help">Enter nutrition for each portion. Your meal totals add up automatically.</p><div class="nutrition-preview" id="nutrition-preview" aria-live="polite"></div><div class="modal-actions">${editingId?`<button type="button" class="delete-button" data-action="delete-meal">${icon('trash')} Delete meal</button>`:''}<button type="button" class="button button-secondary" data-action="close-dialog">Cancel</button><button type="submit" class="button button-primary">${icon('check')}${editingId?'Save changes':'Log meal'}</button></div></form>`;updateNutritionPreview();dialog.showModal();}
function openDetail(meal,isRecipe=false){if(!meal)return;detailMeal={meal,isRecipe};const n=nutrition(meal),dialog=$('#detail-dialog');dialog.innerHTML=`<div class="modal-head"><div><h2 id="detail-dialog-title">${esc(meal.name)}</h2><p>Good ingredients. A meal to feel good about.</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close meal details">${icon('close')}</button></div><img class="detail-photo" src="${ASSETS[meal.image]||ASSETS.salad}" alt="${esc(meal.name)}"><div class="modal-body"><div class="detail-heading"><span class="detail-type">${icon(typeIcons[meal.type])}${esc(meal.type)} ${isRecipe?'':'· '+timeLabel(meal.time)}</span><span class="meal-cal">${icon('fire')}${number(n.calories)} <small>kcal</small></span></div><h3 class="detail-ingredient-heading">The good stuff inside</h3>${meal.ingredients.map(i=>`<div class="detail-ingredient"><span class="ingredient-mark"></span>${esc(i.name)}<small>${esc(i.amount)}</small><strong>${number(i.calories)} kcal</strong></div>`).join('')}<div class="nutrition-preview">${[['protein','Protein'],['carbs','Carbs'],['fat','Fats']].map(([key,label])=>`<div><span>${label}</span><strong>${number(n[key])} <small>g</small></strong></div>`).join('')}</div><p class="form-help">Nutrition values are estimates based on the portions logged.</p><div class="modal-actions"><button class="button button-secondary" data-action="close-dialog">Close</button><button class="button button-primary" data-action="detail-edit">${icon(isRecipe?'plus':'edit')}${isRecipe?'Add to my day':'Edit meal'}</button></div></div>`;dialog.showModal()}
function openSmall(title,subtitle,body){const d=$('#small-dialog');d.innerHTML=`<div class="modal-head"><div><h2 id="small-dialog-title">${title}</h2><p>${subtitle}</p></div><button class="icon-button" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>`;d.showModal()}
function exportSummary(){const meals=day().meals,n=totals();const csvCell=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['Healthy Meal Tracker',selectedDate],[],['Meal','Type','Time','Ingredients','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)'],...meals.map(m=>{const v=nutrition(m);return [m.name,m.type,m.time,m.ingredients.map(i=>i.name+' ('+i.amount+')').join('; '),v.calories,v.protein,v.carbs,v.fat]}),[],['Daily total','','','',n.calories,n.protein,n.carbs,n.fat],['Daily goal','','','',state.goals.calories,state.goals.protein,state.goals.carbs,state.goals.fat],[],['Water (ml)',day().water*250],['Water goal (ml)',state.goals.water*250]];const blob=new Blob(['\ufeff'+rows.map(row=>row.map(v=>csvCell(typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:v)).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`healthy-meals-${selectedDate}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your daily summary is ready.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
 if(action==='add-meal')openMeal();
 else if(action==='add-dinner')openMeal(null,false,day().meals.some(m=>m.type==='Dinner')?'Snack':'Dinner');
 else if(action==='meal-detail')openDetail(day().meals.find(m=>m.id===b.dataset.id));
 else if(action==='recipe-detail')openDetail(recipes.find(m=>m.id===b.dataset.id),true);
 else if(action==='edit-meal')openMeal(day().meals.find(m=>m.id===b.dataset.id));
 else if(action==='use-recipe')openMeal(recipes.find(m=>m.id===b.dataset.id),true);
 else if(action==='detail-edit'&&detailMeal)openMeal(detailMeal.meal,detailMeal.isRecipe);
 else if(action==='close-dialog')b.closest('dialog').close();
 else if(action==='add-ingredient'){$('#ingredients-editor').insertAdjacentHTML('beforeend',ingredientRow());$('#ingredients-editor').lastElementChild.querySelector('input').focus()}
 else if(action==='remove-ingredient'){if($('#ingredients-editor').children.length>1){b.closest('.ingredient-row').remove();updateNutritionPreview()}else toast('Keep at least one ingredient in your meal.')}
 else if(action==='delete-meal'){const originalDay=editingDate,meals=ensureDay(originalDay).meals,index=meals.findIndex(m=>m.id===editingId);if(index<0)return;const removed=meals.splice(index,1)[0];save();$('#meal-dialog').close();render();savedToast('Meal removed from your day.',()=>{ensureDay(originalDay).meals.splice(index,0,removed);save();render();savedToast('Your meal is back.')})}
 else if(action==='water-add'||action==='water-set'){const d=ensureDay();d.water=action==='water-add'?Math.min(32,d.water+1):(Number(b.dataset.count)<=d.water?Number(b.dataset.count)-1:Number(b.dataset.count));save();render();if(d.water===state.goals.water)toast('Water goal reached. A little care goes a long way.')}
 else if(action==='previous-day'||action==='next-day'){const d=dateObject(selectedDate);d.setDate(d.getDate()+(action==='next-day'?1:-1));selectedDate=localDate(d);render()}
 else if(action==='filter'){libraryFilter=b.dataset.filter;render()}
 else if(action==='export')exportSummary();
 else if(action==='menu'){$('#sidebar').classList.toggle('open');$('#sidebar-overlay').classList.toggle('visible');b.setAttribute('aria-expanded',$('#sidebar').classList.contains('open'))}
 else if(action==='close-menu')closeMenu();
 else if(action==='undo'&&undoAction){const fn=undoAction;undoAction=null;fn()}
 else if(action==='about')openSmall('A little better, every day.','Welcome to Healthy Meal Tracker.',`<div class="about-icon">${icon('sprout')}</div><p class="about-copy">A simple space to keep track of what nourishes you. Log meals, explore ingredients, and see your nutrition and hydration come together.</p><p class="about-copy" style="margin-top:14px">Your first day includes three sample meals to help you get started. Edit, remove, or replace them to make the journal yours.</p><p class="about-copy" style="margin-top:14px">Everything stays in this browser on your device. No account needed. Export your daily summary whenever you like.</p><div class="modal-actions"><button class="button button-primary" data-action="close-dialog">Sounds good</button></div>`);
 else if(action==='profile')openSmall('Make yourself at home.','A small space that’s just for you.',`<form id="profile-form"><label class="field">What should we call you?<input name="name" placeholder="Your name" value="${esc(state.name)}" maxlength="40" autocomplete="given-name"></label><p class="form-help">Your journal is saved only in this browser. Clearing site data will remove your entries.</p><div class="modal-actions"><button type="button" class="button button-secondary" data-action="close-dialog">Cancel</button><button type="submit" class="button button-primary">Save name</button></div></form>`);
});
document.addEventListener('input',e=>{if(e.target.closest('#ingredients-editor'))updateNutritionPreview();if(e.target.id==='library-search'){librarySearch=e.target.value;const start=e.target.selectionStart,end=e.target.selectionEnd;render();const input=$('#library-search');input.focus();input.setSelectionRange(start,end)}});
document.addEventListener('change',e=>{if(e.target.id==='day-picker'&&e.target.value){selectedDate=e.target.value;render()}if(e.target.closest('#meal-form')&&e.target.name==='type'&&!editingId)editingImage={Breakfast:'toast',Lunch:'salad',Dinner:'salad',Snack:'yogurt'}[e.target.value]});
document.addEventListener('submit',e=>{if(e.target.id==='meal-form'){e.preventDefault();const f=e.target,fd=new FormData(f),name=fd.get('name').trim();if(!name){f.elements.name.setCustomValidity('Give your meal a name.');f.elements.name.reportValidity();f.elements.name.addEventListener('input',()=>f.elements.name.setCustomValidity(''),{once:true});return}const ingredients=readIngredients();if(ingredients.some(i=>!i.name||!i.amount)){toast('Add a name and portion for every ingredient.');return}const date=fd.get('date');const meal={id:editingId||'meal-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,type:fd.get('type'),time:fd.get('time'),image:editingImage,ingredients};if(editingId){const original=ensureDay(editingDate);original.meals=original.meals.filter(m=>m.id!==editingId)}ensureDay(date).meals.push(meal);selectedDate=date;save();$('#meal-dialog').close();setView('today');savedToast(editingId?'Meal updated. Looking good.':'Meal logged. A little goodness added.')}
 else if(e.target.id==='goals-form'){e.preventDefault();const fd=new FormData(e.target);for(const key of Object.keys(defaultGoals))state.goals[key]=Number(fd.get(key));save();render();savedToast('Your daily goals are saved.')}
 else if(e.target.id==='profile-form'){e.preventDefault();state.name=new FormData(e.target).get('name').trim();save();$('#small-dialog').close();render();savedToast(state.name?`Welcome, ${state.name.split(' ')[0]}.`:'Your personal space is ready.')}
});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['today','library','insights','goals'].includes(next)&&next!==view){view=next;render();closeMenu()}});
hydrateIcons();render();
</script>
</body>
</html>
