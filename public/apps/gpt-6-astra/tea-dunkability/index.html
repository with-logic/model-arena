:root{color-scheme:dark;--bg:#171c1e;--panel:rgba(34,40,42,.77);--panel-solid:#23292b;--inner:#1c2224;--text:#f0eee7;--muted:#969e9e;--subtle:#717d7e;--line:rgba(219,225,221,.10);--gold:#dabb86;--gold-soft:rgba(218,187,134,.10);--green:#a9c5ac;--danger:#e39a87;--shadow:0 8px 35px rgba(0,0,0,.06);--serif:'Lora',Georgia,serif;--sans:'DM Sans',sans-serif}
