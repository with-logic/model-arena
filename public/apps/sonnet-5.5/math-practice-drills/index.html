<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Practice Drills</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#77736b; --line:#e5e2da;
  --accent:#3b5bdb; --accent-ink:#fff; --good:#2f9e44; --bad:#e03131; --warn:#f08c00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14151a;--card:#1d1f27;--ink:#f1f0ec;--muted:#9a98a0;--line:#2c2f3a;--accent:#748ffc;--accent-ink:#10131f;--good:#51cf66;--bad:#ff6b6b;--warn:#ffa94d;--shadow:0 8px 30px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:6px 10px;border-radius:8px}
.linkbtn:hover{color:var(--ink);background:var(--line)}
h1{font-size:2.4rem;letter-spacing:-.03em;margin:0 0 6px;line-height:1.1}
.sub{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.group{margin-bottom:24px}
.label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 0;min-width:84px;padding:14px 12px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:center;transition:.12s}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;margin-top:2px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.chip.op{font-size:1.5rem;padding:10px}
.btn{font:inherit;font-weight:800;font-size:1.25rem;border:0;border-radius:16px;padding:18px 28px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%;transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
kbd{font:inherit;font-size:.7em;padding:2px 7px;border-radius:6px;border:1px solid currentColor;opacity:.7;margin-left:8px}
.hidden{display:none!important}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.stat{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.stat b{display:block;font-size:1.7rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
/* quiz */
.hud{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.hud div{display:flex;flex-direction:column}
.hud .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.hud .v{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hud .mid{align-items:center}.hud .end{align-items:flex-end}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar>i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:background .3s}
.bar>i.low{background:var(--bad)}
.stage{text-align:center;padding:36px 16px 30px;position:relative;overflow:hidden}
.stage.flash-good{animation:fg .35s}.stage.flash-bad{animation:fb .4s}
@keyframes fg{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 24px transparent}}
@keyframes fb{0%{box-shadow:0 0 0 0 var(--bad);transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}100%{box-shadow:0 0 0 24px transparent;transform:none}}
.problem{font-size:clamp(3.2rem,13vw,6.5rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;margin-bottom:26px;white-space:nowrap}
.problem .o{color:var(--accent);margin:0 .15em}
input.ans{font:inherit;font-weight:800;font-size:clamp(2.2rem,9vw,3.6rem);width:min(320px,80%);text-align:center;padding:12px;border-radius:18px;border:3px solid var(--line);background:var(--bg);color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
input.ans:focus{border-color:var(--accent)}
.fb{height:1.8em;margin-top:16px;font-weight:700;font-size:1.1rem}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{padding:14px;font-size:1rem}
.streak{color:var(--warn)}
/* results */
.big{font-size:5rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0}
.badge{display:inline-block;background:var(--good);color:#fff;font-weight:800;font-size:.75rem;padding:5px 12px;border-radius:99px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
@media(min-width:560px){.grid4{grid-template-columns:repeat(4,1fr)}}
.missed{margin:0 0 22px;padding:0;list-style:none}
.missed li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.missed .your{color:var(--bad);text-decoration:line-through;margin-right:12px}
.missed .right{color:var(--good);font-weight:800}
.row2{display:flex;gap:12px}.row2 .btn{flex:1}
/* history */
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid var(--line)}
td.sc{font-weight:800}
.empty{color:var(--muted);text-align:center;padding:28px 0}
canvas{width:100%;height:130px;display:block;margin-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h2{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer}
@media(max-width:480px){body{font-size:18px}h1{font-size:2rem}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">∑</div>Math Drills</div>
    <div>
      <button class="linkbtn" id="soundBtn" aria-pressed="true">🔊 Sound on</button>
      <button class="linkbtn" id="histBtn">Scores</button>
    </div>
  </header>

  <!-- SETUP -->
  <section id="setup">
    <h1>Faster. Sharper.</h1>
    <p class="sub">Pick your drill and beat the clock.</p>
    <div class="card">
      <div class="group"><div class="label">Operation</div>
        <div class="seg" id="ops">
          <button class="chip op" data-op="+" aria-pressed="true" title="Addition">+</button>
          <button class="chip op" data-op="−" aria-pressed="false" title="Subtraction">−</button>
          <button class="chip op" data-op="×" aria-pressed="false" title="Multiplication">×</button>
          <button class="chip op" data-op="÷" aria-pressed="false" title="Division">÷</button>
        </div>
        <div class="sub" style="font-size:.8rem;margin:8px 0 0">Select one or more — multiple will mix.</div>
      </div>
      <div class="group"><div class="label">Difficulty</div>
        <div class="seg" id="diff">
          <button class="chip" data-v="easy" aria-pressed="false">Easy<small>Small numbers</small></button>
          <button class="chip" data-v="medium" aria-pressed="true">Medium<small>Times tables</small></button>
          <button class="chip" data-v="hard">Hard<small>Big numbers</small></button>
        </div>
      </div>
      <div class="group"><div class="label">Time</div>
        <div class="seg" id="time">
          <button class="chip" data-v="30" aria-pressed="false">30s</button>
          <button class="chip" data-v="60" aria-pressed="true">60s</button>
          <button class="chip" data-v="120" aria-pressed="false">2 min</button>
          <button class="chip" data-v="0" aria-pressed="false">Free<small>No timer</small></button>
        </div>
      </div>
      <button class="btn" id="startBtn">Start drill <kbd>Enter</kbd></button>
    </div>
    <div class="stats3" id="homeStats"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="hud">
      <div><span class="k">Score</span><span class="v" id="score">0</span></div>
      <div class="mid"><span class="k" id="timeLbl">Time</span><span class="v" id="clock">60</span></div>
      <div class="end"><span class="k">Streak</span><span class="v streak" id="streak">0</span></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card stage" id="stage">
      <div class="problem" id="problem"></div>
      <input class="ans" id="answer" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="?">
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="skipBtn">Skip <kbd>Tab</kbd></button>
      <button class="btn ghost" id="endBtn">Finish <kbd>Esc</kbd></button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card" style="text-align:center">
      <div class="badge hidden" id="newBest">New best!</div>
      <div class="label" id="resCfg"></div>
      <div class="big" id="resScore">0</div>
      <div class="label">points</div>
      <div class="grid4">
        <div class="stat"><b id="rCorrect">0</b><span>Correct</span></div>
        <div class="stat"><b id="rAcc">0%</b><span>Accuracy</span></div>
        <div class="stat"><b id="rAvg">0s</b><span>Avg / answer</span></div>
        <div class="stat"><b id="rBest">0</b><span>Best streak</span></div>
      </div>
      <div id="missedWrap" class="hidden" style="text-align:left">
        <div class="label">Review mistakes</div>
        <ul class="missed" id="missed"></ul>
      </div>
      <div class="row2">
        <button class="btn" id="againBtn">Play again <kbd>Enter</kbd></button>
        <button class="btn ghost" id="menuBtn">Menu</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="history" class="hidden">
    <div class="top"><h2>Score tracker</h2><button class="linkbtn" id="closeHist">✕ Close</button></div>
    <div class="card">
      <div class="label">Recent scores</div>
      <canvas id="chart"></canvas>
      <div id="histTable"></div>
      <button class="linkbtn" id="clearBtn" style="margin-top:14px">Clear all history</button>
    </div>
  </section>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const LS = 'mathdrills.v1';
let store = { history: [], sound: true, cfg: null };
try { Object.assign(store, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch(e){} };

const cfg = Object.assign({ ops:['+'], diff:'medium', time:60 }, store.cfg || {});
const DIFFMULT = { easy:1, medium:2, hard:3 };
const DIFFNAME = { easy:'Easy', medium:'Medium', hard:'Hard' };

/* ---------- screens ---------- */
const screens = ['setup','quiz','results','history'];
let current = 'setup', prevScreen = 'setup';
function show(name){
  prevScreen = current; current = name;
  screens.forEach(s => $(s).classList.toggle('hidden', s !== name));
  if (name === 'setup') renderHome();
  window.scrollTo(0,0);
}

/* ---------- setup UI ---------- */
function syncSetup(){
  document.querySelectorAll('#ops .chip').forEach(b => b.setAttribute('aria-pressed', cfg.ops.includes(b.dataset.op)));
  document.querySelectorAll('#diff .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cfg.diff));
  document.querySelectorAll('#time .chip').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === cfg.time));
}
$('ops').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  const o = b.dataset.op, i = cfg.ops.indexOf(o);
  if (i >= 0) { if (cfg.ops.length > 1) cfg.ops.splice(i,1); } else cfg.ops.push(o);
  syncSetup();
});
$('diff').addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; cfg.diff=b.dataset.v; syncSetup(); });
$('time').addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; cfg.time=+b.dataset.v; syncSetup(); });

const cfgKey = c => `${[...c.ops].sort().join('')}|${c.diff}|${c.time}`;
const cfgLabel = c => `${c.ops.length===4?'Mixed':c.ops.join(' ')} · ${DIFFNAME[c.diff]} · ${c.time?(c.time>=120?c.time/60+' min':c.time+'s'):'Free'}`;

function renderHome(){
  const h = store.history;
  const best = h.reduce((m,r)=>Math.max(m,r.score),0);
  const same = h.filter(r => r.key === cfgKey(cfg));
  const bestHere = same.reduce((m,r)=>Math.max(m,r.score),0);
  $('homeStats').innerHTML = h.length ? `
    <div class="stat"><b>${h.length}</b><span>Drills played</span></div>
    <div class="stat"><b>${bestHere || '—'}</b><span>Best · this setup</span></div>
    <div class="stat"><b>${best}</b><span>All-time best</span></div>` : '';
}

/* ---------- problem generation ---------- */
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function gen(op, d){
  let a,b,ans;
  if (op === '+'){
    const m = {easy:[1,20],medium:[10,99],hard:[100,999]}[d];
    a = rnd(...m); b = rnd(...m); ans = a+b;
  } else if (op === '−'){
    const m = {easy:[1,20],medium:[10,99],hard:[100,999]}[d];
    a = rnd(...m); b = rnd(...m); if (b>a) [a,b]=[b,a]; ans = a-b;
  } else if (op === '×'){
    if (d==='easy'){ a=rnd(2,5); b=rnd(2,9); }
    else if (d==='medium'){ a=rnd(2,12); b=rnd(2,12); }
    else { a=rnd(11,25); b=rnd(6,19); }
    ans = a*b;
  } else {
    let q;
    if (d==='easy'){ b=rnd(2,5); q=rnd(2,9); }
    else if (d==='medium'){ b=rnd(2,12); q=rnd(2,12); }
    else { b=rnd(6,19); q=rnd(11,25); }
    a = b*q; ans = q;
  }
  return { a, b, op, ans };
}

/* ---------- audio ---------- */
let actx;
function tone(f, dur, type='sine', vol=.12, when=0){
  if (!store.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  good(){ tone(660,.12,'triangle'); tone(880,.16,'triangle',.12,.07); },
  bad(){ tone(180,.25,'sawtooth',.08); },
  end(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.1)); },
  tick(){ tone(1000,.05,'square',.04); }
};
function syncSound(){ $('soundBtn').textContent = store.sound ? '🔊 Sound on' : '🔇 Sound off'; }
$('soundBtn').onclick = () => { store.sound = !store.sound; syncSound(); save(); };

/* ---------- quiz ---------- */
let S = null, timerId = null;
function start(){
  store.cfg = { ops:[...cfg.ops], diff:cfg.diff, time:cfg.time }; save();
  S = { score:0, correct:0, wrong:0, streak:0, best:0, times:[], missed:[], q:null, qStart:0,
        start:performance.now(), total:cfg.time*1000, lastTick:-1, over:false, locked:false };
  $('score').textContent = 0; $('streak').textContent = 0;
  $('timeLbl').textContent = cfg.time ? 'Time left' : 'Elapsed';
  $('barFill').parentElement.style.visibility = cfg.time ? 'visible' : 'hidden';
  $('fb').textContent = '';
  show('quiz');
  next();
  clearInterval(timerId); timerId = setInterval(tick, 100); tick();
}
function next(){
  let q, tries = 0;
  do { q = gen(cfg.ops[rnd(0,cfg.ops.length-1)], cfg.diff); tries++; }
  while (S.q && q.a===S.q.a && q.b===S.q.b && q.op===S.q.op && tries<10);
  S.q = q; S.qStart = performance.now();
  $('problem').innerHTML = `${q.a}<span class="o">${q.op}</span>${q.b}`;
  $('answer').value = ''; $('answer').focus();
}
function fmt(ms){ const s = Math.max(0,Math.ceil(ms/1000)); return s>=60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : s; }
function tick(){
  if (!S || S.over) return;
  const el = performance.now() - S.start;
  if (cfg.time){
    const left = S.total - el;
    $('clock').textContent = fmt(left);
    const pct = Math.max(0,left/S.total*100);
    $('barFill').style.width = pct+'%';
    $('barFill').classList.toggle('low', left <= 10000);
    const sec = Math.ceil(left/1000);
    if (left<=5000 && sec!==S.lastTick && left>0){ S.lastTick = sec; sfx.tick(); }
    if (left <= 0) finish();
  } else {
    $('clock').textContent = fmt(el+999);
  }
}
function flash(cls){
  const st = $('stage'); st.classList.remove('flash-good','flash-bad'); void st.offsetWidth; st.classList.add(cls);
}
function submit(auto){
  if (!S || S.over) return;
  const raw = $('answer').value.trim();
  if (raw === '') return;
  const val = Number(raw);
  const q = S.q, dt = performance.now() - S.qStart;
  if (val === q.ans){
    S.correct++; S.streak++; S.best = Math.max(S.best,S.streak); S.times.push(dt);
    const speed = dt < 2000 ? 5 : dt < 4000 ? 2 : 0;
    S.score += 10*DIFFMULT[cfg.diff] + Math.min(S.streak,10) + speed;
    $('fb').className='fb good'; $('fb').textContent = S.streak>=3 ? `🔥 ${S.streak} in a row` : 'Correct!';
    flash('flash-good'); sfx.good();
  } else {
    miss(val);
    $('fb').className='fb bad'; $('fb').textContent = `Answer was ${q.ans}`;
    flash('flash-bad'); sfx.bad();
  }
  $('score').textContent = S.score; $('streak').textContent = S.streak;
  next();
}
function miss(val){
  const q = S.q;
  S.wrong++; S.streak = 0;
  S.missed.push({ text:`${q.a} ${q.op} ${q.b}`, ans:q.ans, your:val });
}
$('answer').addEventListener('input', e => {
  const v = e.target.value.replace(/[^0-9\-]/g,'');
  if (v !== e.target.value) e.target.value = v;
  if (S && !S.over && v !== '' && Number(v) === S.q.ans) submit(true);
});
$('skipBtn').onclick = () => { if(!S||S.over) return; miss('—'); $('fb').className='fb bad'; $('fb').textContent=`Answer was ${S.q.ans}`; $('streak').textContent=0; next(); };
$('endBtn').onclick = () => finish();

function finish(){
  if (!S || S.over) return;
  S.over = true; clearInterval(timerId);
  const elapsed = Math.min(performance.now()-S.start, cfg.time?S.total:Infinity);
  const answered = S.correct + S.wrong;
  const acc = answered ? Math.round(S.correct/answered*100) : 0;
  const avg = S.times.length ? S.times.reduce((a,b)=>a+b,0)/S.times.length/1000 : 0;
  const key = cfgKey(cfg);
  const prevBest = store.history.filter(r=>r.key===key).reduce((m,r)=>Math.max(m,r.score),0);
  const isBest = answered>0 && S.score > prevBest && prevBest > 0;
  if (answered > 0){
    store.history.push({ t:Date.now(), key, label:cfgLabel(cfg), score:S.score, correct:S.correct, answered, acc, avg:+avg.toFixed(2), dur:Math.round(elapsed/1000) });
    store.history = store.history.slice(-200); save();
  }
  $('resCfg').textContent = cfgLabel(cfg);
  $('resScore').textContent = S.score;
  $('rCorrect').textContent = `${S.correct}/${answered}`;
  $('rAcc').textContent = acc+'%';
  $('rAvg').textContent = avg ? avg.toFixed(1)+'s' : '—';
  $('rBest').textContent = S.best;
  $('newBest').classList.toggle('hidden', !isBest);
  $('missedWrap').classList.toggle('hidden', !S.missed.length);
  $('missed').innerHTML = S.missed.slice(0,8).map(m =>
    `<li><span>${m.text}</span><span><span class="your">${m.your}</span><span class="right">${m.ans}</span></span></li>`).join('');
  sfx.end();
  show('results');
}

/* ---------- history ---------- */
function renderHistory(){
  const h = store.history;
  if (!h.length){
    $('histTable').innerHTML = '<div class="empty">No drills yet. Finish one and your scores show up here.</div>';
    $('chart').style.display = 'none'; $('clearBtn').classList.add('hidden'); return;
  }
  $('chart').style.display = 'block'; $('clearBtn').classList.remove('hidden');
  const rows = h.slice(-10).reverse().map(r => `<tr><td>${new Date(r.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td><td>${r.label}</td><td class="sc">${r.score}</td><td>${r.acc}%</td><td>${r.avg?r.avg+'s':'—'}</td></tr>`).join('');
  $('histTable').innerHTML = `<table><thead><tr><th>Date</th><th>Drill</th><th>Score</th><th>Acc</th><th>Avg</th></tr></thead><tbody>${rows}</tbody></table>`;
  drawChart(h.slice(-20));
}
function drawChart(data){
  const c = $('chart'), dpr = window.devicePixelRatio||1;
  const w = c.clientWidth, hgt = c.clientHeight;
  c.width = w*dpr; c.height = hgt*dpr;
  const g = c.getContext('2d'); g.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim(), line = css.getPropertyValue('--line').trim();
  const max = Math.max(...data.map(d=>d.score),1), pad = 8, bw = (w-pad*2)/data.length;
  g.strokeStyle = line; g.beginPath(); g.moveTo(0,hgt-.5); g.lineTo(w,hgt-.5); g.stroke();
  data.forEach((d,i)=>{
    const bh = Math.max(4,(d.score/max)*(hgt-14)), x = pad+i*bw+bw*.18;
    g.fillStyle = accent; g.globalAlpha = i===data.length-1 ? 1 : .55;
    g.beginPath(); g.roundRect(x, hgt-bh, bw*.64, bh, 5); g.fill();
  });
  g.globalAlpha = 1;
}
$('histBtn').onclick = () => { if (current==='history') return; if (current==='quiz' && S && !S.over) return; renderHistory(); show('history'); renderHistory(); };
$('closeHist').onclick = () => show('setup');
$('clearBtn').onclick = () => { if (confirm('Clear all score history?')){ store.history=[]; save(); renderHistory(); } };
window.addEventListener('resize', () => { if (current==='history') renderHistory(); });

/* ---------- wiring ---------- */
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('menuBtn').onclick = () => show('setup');
document.addEventListener('keydown', e => {
  if (current === 'quiz'){
    if (e.key === 'Enter'){ e.preventDefault(); submit(); }
    else if (e.key === 'Escape'){ finish(); }
    else if (e.key === 'Tab'){ e.preventDefault(); $('skipBtn').click(); }
    else if (document.activeElement !== $('answer') && !e.metaKey && !e.ctrlKey) $('answer').focus();
  } else if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON'){
    if (current === 'setup') start();
    else if (current === 'results') start();
  } else if (e.key === 'Escape' && current === 'history') show('setup');
});
syncSetup(); syncSound(); renderHome();
})();
</script>
