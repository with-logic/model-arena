<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthy Meal Tracker</title>
<style>
:root{
  --bg:#f4f8f1; --card:#fff; --ink:#1f2d24; --muted:#6b7b70; --line:#e4ece4;
  --green:#2f9e5b; --green-d:#1f7a43; --green-l:#e3f4e8;
  --cal:#ff7a45; --pro:#4c8dff; --carb:#f5b82e; --fat:#e5648f;
  --shadow:0 1px 2px rgba(31,45,36,.05),0 8px 24px rgba(31,45,36,.07);
  --r:20px;
}
*{box-sizing:border-box;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:
 radial-gradient(900px 400px at 10% -10%,#d9f0dc 0,transparent 60%),
 radial-gradient(700px 400px at 100% 0,#fff1d6 0,transparent 55%),var(--bg);
 color:var(--ink);min-height:100vh;padding-bottom:90px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#4cc77f,#1f9a55);display:grid;place-items:center;font-size:25px;box-shadow:0 6px 16px rgba(47,158,91,.35)}
h1{font-size:22px;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--muted)}
.datenav{display:flex;align-items:center;gap:6px;background:var(--card);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.datenav button{width:34px;height:34px;border-radius:50%;font-size:16px}
.datenav button:hover{background:var(--green-l)}
.datenav .d{min-width:150px;text-align:center;font-weight:700;font-size:14px}
.datenav .today{font-size:12px;font-weight:700;padding:0 12px;width:auto;color:var(--green-d)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card h2{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:500;color:var(--muted);font-size:12px}
.ringbox{position:relative;width:210px;height:210px;margin:6px auto 18px}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ringbox .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.ringbox .left{font-size:13px;font-weight:700;margin-top:8px;padding:3px 10px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
.ringbox .left.over{background:#ffe5e0;color:#c4381f}
.macro{margin-bottom:13px}
.macro .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.macro .row b{font-weight:700}
.macro .row span{color:var(--muted)}
.bar{height:9px;background:#eef3ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goalbtn{margin-top:6px;font-size:12px;color:var(--green-d);font-weight:700;padding:6px 0}
.goalbtn:hover{text-decoration:underline}
.mealhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mealhead h2{margin:0;font-size:18px}
.btn{background:linear-gradient(135deg,#3bb36d,#238a4b);color:#fff;font-weight:700;padding:11px 18px;border-radius:14px;box-shadow:0 6px 14px rgba(47,158,91,.3);transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(47,158,91,.35)}
.btn.ghost{background:#eef3ee;color:var(--ink);box-shadow:none}
.section{margin-bottom:16px}
.section .st{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 2px 8px}
.section .st em{margin-left:auto;font-style:normal;text-transform:none;letter-spacing:0}
.meal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mi{width:54px;height:54px;border-radius:16px;background:var(--green-l);display:grid;place-items:center;font-size:30px;flex:none}
.mb{flex:1;min-width:0}
.mt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mt b{font-size:16px}
.mt .kc{font-weight:800;color:var(--cal);white-space:nowrap}
.mt .kc small{font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font-size:12px;background:#f2f6f2;border-radius:99px;padding:3px 9px;white-space:nowrap}
.mm{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.mm span b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.acts{margin-left:auto;display:flex;gap:2px}
.acts button{width:28px;height:28px;border-radius:8px;font-size:14px;opacity:.6}
.acts button:hover{background:#eef3ee;opacity:1}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:2px dashed var(--line);border-radius:18px;font-size:14px}
.empty .e{font-size:38px;display:block;margin-bottom:6px}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer}
.wd .col{width:100%;max-width:38px;border-radius:10px 10px 6px 6px;background:#dfeee2;transition:height .5s;min-height:4px;position:relative}
.wd.sel .col{background:linear-gradient(#4cc77f,#2f9e5b)}
.wd.over .col{background:linear-gradient(#ff9a7a,#ff7a45)}
.wd span{font-size:11px;color:var(--muted);font-weight:600}
.wd.sel span{color:var(--green-d)}
.wd .v{font-size:10px;color:var(--muted)}
.goalline{position:relative}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,35,26,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.on{display:flex}
.modal{background:#fff;border-radius:24px;width:100%;max-width:640px;max-height:94vh;overflow:auto;padding:24px;animation:pop .25s both}
.modal h3{font-size:20px;margin-bottom:16px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafcfa;outline:0}
.in:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--green-l)}
.types{display:flex;gap:8px;flex-wrap:wrap}
.types button{padding:8px 14px;border-radius:99px;background:#f2f6f2;font-weight:600;font-size:14px}
.types button.on{background:var(--green);color:#fff}
.nameRow{display:flex;gap:8px}
.iconpick{width:56px;text-align:center;font-size:22px;padding:6px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:112px;overflow:auto}
.sugg button{background:#f6f9f6;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px}
.sugg button:hover{background:var(--green-l);border-color:var(--green)}
.ing{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#f7faf7;margin-bottom:6px}
.ing .em{font-size:22px}
.ing .n{flex:1;min-width:0;font-size:14px;font-weight:600}
.ing .n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.step{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px}
.step button{width:26px;height:28px;font-weight:700}
.step span{min-width:30px;text-align:center;font-size:13px;font-weight:700}
.ing .k{width:62px;text-align:right;font-weight:700;font-size:13px}
.ing .x{color:#c4381f;width:24px}
.custom{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:6px;margin-top:10px}
.custom .in{padding:8px 9px;font-size:13px;min-width:0}
@media(max-width:560px){.custom{grid-template-columns:1fr 1fr 1fr}.custom .in:first-child{grid-column:1/-1}}
.tot{display:flex;justify-content:space-between;background:var(--green-l);padding:12px 14px;border-radius:14px;margin-top:14px;font-size:13px;flex-wrap:wrap;gap:6px}
.tot b{font-size:15px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#1f2d24;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;transition:transform .3s;z-index:40}
.toast.on{transform:translate(-50%,0)}
.fab{display:none}
@media(max-width:860px){.fab{display:grid;position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#3bb36d,#238a4b);color:#fff;font-size:30px;place-items:center;box-shadow:0 10px 24px rgba(47,158,91,.5);z-index:10}}
.tip{margin-top:14px;font-size:13px;color:var(--muted);background:#fff8e8;border-radius:12px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">🥗</div><div><h1>Healthy Meal Tracker</h1><div class="sub">Eat well. Log it. Feel great.</div></div></div>
    <div class="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="d" id="dlabel"></div>
      <button id="next" aria-label="Next day">›</button>
      <button class="today" id="today">Today</button>
    </div>
  </header>

  <div class="grid">
    <aside>
      <div class="card">
        <h2>Daily summary <small id="dsub"></small></h2>
        <div class="ringbox">
          <svg width="210" height="210" viewBox="0 0 210 210">
            <circle cx="105" cy="105" r="90" fill="none" stroke="#eef3ee" stroke-width="18"/>
            <circle id="ring" cx="105" cy="105" r="90" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc77f"/><stop offset="1" stop-color="#1f9a55"/></linearGradient></defs>
          </svg>
          <div class="c"><div class="big" id="kcal">0</div><div class="lbl" id="kgoal">of 2000 kcal</div><div class="left" id="kleft"></div></div>
        </div>
        <div id="macros"></div>
        <button class="goalbtn" id="goalbtn">⚙️ Edit daily goals</button>
        <div class="tip" id="tip"></div>
      </div>
      <div class="card" style="margin-top:20px">
        <h2>This week <small>kcal per day</small></h2>
        <div class="week" id="week"></div>
      </div>
    </aside>

    <main>
      <div class="mealhead"><h2>Today's meals</h2><button class="btn" id="add">＋ Log meal</button></div>
      <div id="meals"></div>
    </main>
  </div>
</div>
<button class="fab" id="fab" aria-label="Log meal">＋</button>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const FOODS=[
["Apple","🍎","1 medium",95,0.5,25,0.3],["Banana","🍌","1 medium",105,1.3,27,0.4],["Blueberries","🫐","1 cup",84,1.1,21,0.5],["Strawberries","🍓","1 cup",49,1,12,0.5],["Avocado","🥑","½ fruit",160,2,9,15],["Orange","🍊","1 medium",62,1.2,15,0.2],["Grapes","🍇","1 cup",104,1,27,0.2],["Lemon","🍋","1 tbsp juice",3,0,1,0],
["Broccoli","🥦","1 cup",55,3.7,11,0.6],["Carrot","🥕","1 medium",25,0.6,6,0.1],["Spinach","🥬","2 cups",14,1.7,2,0.2],["Tomato","🍅","1 medium",22,1,5,0.2],["Cucumber","🥒","½ cup",8,0.4,2,0.1],["Bell pepper","🫑","1 medium",30,1,7,0.3],["Corn","🌽","1 ear",90,3,19,1.4],["Sweet potato","🍠","1 medium",112,2,26,0.1],["Mushrooms","🍄","1 cup",15,2.2,2,0.2],["Onion","🧅","½ medium",22,0.6,5,0],["Garlic","🧄","2 cloves",9,0.4,2,0],
["Chicken breast","🍗","100 g",165,31,0,3.6],["Salmon","🐟","100 g",208,20,0,13],["Egg","🥚","1 large",72,6.3,0.4,4.8],["Tofu","🧈","100 g",76,8,1.9,4.8],["Shrimp","🍤","100 g",99,24,0.2,0.3],["Lean beef","🥩","100 g",250,26,0,15],["Greek yogurt","🥛","¾ cup",100,17,6,0.7],["Milk","🥛","1 cup",103,8,12,2.4],["Cheese","🧀","1 oz",113,7,0.4,9],
["Brown rice","🍚","1 cup cooked",216,5,45,1.8],["Quinoa","🌾","1 cup cooked",222,8,39,3.6],["Oats","🥣","½ cup dry",150,5,27,3],["Whole wheat bread","🍞","1 slice",81,4,14,1.1],["Pasta","🍝","1 cup cooked",220,8,43,1.3],["Lentils","🫘","1 cup cooked",230,18,40,0.8],["Chickpeas","🫘","½ cup",134,7,22,2],["Black beans","🫘","½ cup",114,7.6,20,0.5],
["Almonds","🌰","1 oz",164,6,6,14],["Peanut butter","🥜","1 tbsp",94,4,3,8],["Olive oil","🫒","1 tbsp",119,0,0,13.5],["Honey","🍯","1 tbsp",64,0,17,0],["Dark chocolate","🍫","1 oz",170,2,13,12],["Tortilla","🫓","1 medium",140,4,24,3],["Coffee w/ milk","☕","1 cup",30,1.5,2.5,1.5]
].map(a=>({name:a[0],emoji:a[1],serving:a[2],cal:a[3],p:a[4],c:a[5],f:a[6]}));
const TYPES=[["Breakfast","🍳"],["Lunch","🥪"],["Dinner","🍽️"],["Snack","🍎"]];
const ICONS=["🍳","🥗","🥪","🍲","🍝","🍣","🥙","🌮","🍜","🍛","🥞","🥣","🍕","🍔","🍱","🥘","🍎","🥤","🍿","🧁"];
const $=s=>document.querySelector(s);
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const parse=s=>new Date(s+"T12:00:00");
const r1=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state=load();
let date=iso(new Date());
function load(){
  try{const s=JSON.parse(localStorage.getItem("hmt2"));if(s)return s}catch(e){}
  const s={goals:{cal:2000,p:100,c:250,f:70},meals:[]};
  const F=n=>FOODS.find(f=>f.name===n);
  const mk=(off,type,name,icon,items)=>{const d=new Date();d.setDate(d.getDate()-off);
    return{id:Math.random().toString(36).slice(2),date:iso(d),type,name,icon,ings:items.map(([n,q])=>({...F(n),qty:q}))}};
  s.meals.push(
    mk(0,"Breakfast","Berry Oatmeal Bowl","🥣",[["Oats",1],["Blueberries",1],["Almonds",1],["Honey",1]]),
    mk(0,"Lunch","Chicken Quinoa Salad","🥗",[["Chicken breast",1.5],["Quinoa",1],["Spinach",1],["Avocado",1],["Tomato",1],["Olive oil",1]]),
    mk(0,"Snack","Apple & Peanut Butter","🍎",[["Apple",1],["Peanut butter",1]]),
    mk(1,"Breakfast","Veggie Scramble","🍳",[["Egg",3],["Spinach",1],["Whole wheat bread",2]]),
    mk(1,"Lunch","Lentil Power Bowl","🍲",[["Lentils",1],["Brown rice",1],["Carrot",1],["Olive oil",1]]),
    mk(1,"Dinner","Baked Salmon & Greens","🐟",[["Salmon",1.5],["Broccoli",1.5],["Sweet potato",1]]),
    mk(2,"Breakfast","Yogurt Parfait","🥛",[["Greek yogurt",1],["Strawberries",1],["Oats",1]]),
    mk(2,"Dinner","Veggie Pasta","🍝",[["Pasta",1.5],["Tomato",2],["Mushrooms",1],["Cheese",1],["Garlic",1]]),
    mk(3,"Lunch","Tofu Stir-fry","🥘",[["Tofu",2],["Brown rice",1],["Bell pepper",1],["Broccoli",1]]),
    mk(4,"Dinner","Burrito Bowl","🌮",[["Black beans",2],["Brown rice",1],["Corn",1],["Avocado",1],["Tomato",1]]),
    mk(5,"Breakfast","Banana Toast","🍞",[["Whole wheat bread",2],["Peanut butter",1],["Banana",1]]),
    mk(5,"Dinner","Shrimp & Veg","🍤",[["Shrimp",2],["Bell pepper",1],["Onion",1],["Quinoa",1]])
  );
  return s;
}
const save=()=>localStorage.setItem("hmt2",JSON.stringify(state));
const tot=ings=>ings.reduce((a,i)=>({cal:a.cal+i.cal*i.qty,p:a.p+i.p*i.qty,c:a.c+i.c*i.qty,f:a.f+i.f*i.qty}),{cal:0,p:0,c:0,f:0});
const dayMeals=d=>state.meals.filter(m=>m.date===d);
const dayTot=d=>tot(dayMeals(d).flatMap(m=>m.ings));

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}

function render(){
  const now=iso(new Date());
  const dd=parse(date);
  $("#dlabel").textContent=date===now?"Today":dd.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("#dsub").textContent=dd.toLocaleDateString(undefined,{month:"long",day:"numeric"});
  $(".mealhead h2").textContent=date===now?"Today's meals":dd.toLocaleDateString(undefined,{weekday:"long"})+"'s meals";
  const T=dayTot(date),G=state.goals;
  $("#kcal").textContent=Math.round(T.cal).toLocaleString();
  $("#kgoal").textContent="of "+G.cal.toLocaleString()+" kcal";
  const left=Math.round(G.cal-T.cal),lf=$("#kleft");
  lf.textContent=left>=0?left.toLocaleString()+" left":Math.abs(left).toLocaleString()+" over";
  lf.className="left"+(left<0?" over":"");
  $("#ring").style.strokeDashoffset=565.5*(1-Math.min(1,T.cal/G.cal));
  $("#macros").innerHTML=[["🍗 Protein","p","var(--pro)"],["🍞 Carbs","c","var(--carb)"],["🥑 Fat","f","var(--fat)"]].map(([l,k,col])=>
   `<div class="macro"><div class="row"><b>${l}</b><span>${Math.round(T[k])} / ${G[k]} g</span></div><div class="bar"><i style="width:${Math.min(100,T[k]/G[k]*100)}%;background:${col}"></i></div></div>`).join("");
  const ms=dayMeals(date);
  const pr=T.p/G.p, tips=[];
  let tip;
  if(!ms.length)tip="🌱 Nothing logged yet — start with a nutritious breakfast!";
  else if(T.cal>G.cal*1.05)tip="⚖️ You're over your calorie goal. A light, veggie-rich dinner can balance things.";
  else if(pr<.6&&T.cal>G.cal*.4)tip="💪 Protein is running low — try eggs, yogurt, chicken or lentils.";
  else if(T.cal>=G.cal*.9)tip="🎉 Right on target today. Nice work!";
  else tip="🥦 Going well! Add colourful veggies to your next meal.";
  $("#tip").textContent=tip;

  // meals by type
  let h="";
  TYPES.forEach(([t,ic])=>{
    const l=ms.filter(m=>m.type===t);if(!l.length)return;
    const k=l.reduce((a,m)=>a+tot(m.ings).cal,0);
    h+=`<div class="section"><div class="st">${ic} ${t}<em>${Math.round(k)} kcal</em></div>`+l.map(card).join("")+`</div>`;
  });
  $("#meals").innerHTML=h||`<div class="empty"><span class="e">🍽️</span>No meals logged for this day.<br>Tap <b>Log meal</b> to add your first one.</div>`;

  // week
  const days=[];for(let i=6;i>=0;i--){const d=new Date(dd);d.setDate(d.getDate()-i);days.push(iso(d))}
  const vals=days.map(d=>dayTot(d).cal),mx=Math.max(G.cal*1.1,...vals);
  $("#week").innerHTML=days.map((d,i)=>`<div class="wd ${d===date?"sel":""} ${vals[i]>G.cal?"over":""}" data-d="${d}" title="${Math.round(vals[i])} kcal"><div class="v">${vals[i]?Math.round(vals[i]):""}</div><div class="col" style="height:${vals[i]/mx*85}%"></div><span>${parse(d).toLocaleDateString(undefined,{weekday:"short"}).slice(0,3)}</span></div>`).join("");
  document.querySelectorAll(".wd").forEach(e=>e.onclick=()=>{date=e.dataset.d;render()});
}
function card(m){
  const t=tot(m.ings);
  return `<div class="meal"><div class="mi">${m.icon}</div><div class="mb">
  <div class="mt"><b>${esc(m.name)}</b><span class="kc">${Math.round(t.cal)} <small>kcal</small></span></div>
  <div class="chips">${m.ings.map(i=>`<span class="chip">${i.emoji} ${esc(i.name)}${i.qty!==1?" ×"+r1(i.qty):""}</span>`).join("")}</div>
  <div class="mm"><span><i class="dot" style="background:var(--pro)"></i><b>${r1(t.p)}g</b> protein</span><span><i class="dot" style="background:var(--carb)"></i><b>${r1(t.c)}g</b> carbs</span><span><i class="dot" style="background:var(--fat)"></i><b>${r1(t.f)}g</b> fat</span>
  <div class="acts"><button title="Edit" data-e="${m.id}">✏️</button><button title="Delete" data-x="${m.id}">🗑️</button></div></div></div></div>`;
}
$("#meals").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)openMeal(state.meals.find(m=>m.id===b.dataset.e));
  if(b.dataset.x){const m=state.meals.find(m=>m.id===b.dataset.x);
    if(confirm(`Delete "${m.name}"?`)){state.meals=state.meals.filter(x=>x.id!==m.id);save();render();toast("Meal deleted")}}
};

/* ---- meal modal ---- */
let draft;
function openMeal(m){
  const hour=new Date().getHours();
  const dt=hour<10?"Breakfast":hour<15?"Lunch":hour<21?"Dinner":"Snack";
  draft=m?JSON.parse(JSON.stringify(m)):{id:null,date,type:dt,name:"",icon:TYPES.find(t=>t[0]===dt)[1],ings:[],manualIcon:false};
  if(m)draft.manualIcon=true;
  showModal(`
  <h3>${m?"Edit meal":"Log a meal"}</h3>
  <label class="f">Meal type</label><div class="types" id="types"></div>
  <label class="f">Name & icon</label>
  <div class="nameRow"><select class="in iconpick" id="icon">${ICONS.map(i=>`<option ${i===draft.icon?"selected":""}>${i}</option>`).join("")}</select>
  <input class="in" id="mname" placeholder="e.g. Grilled chicken salad" maxlength="60" value="${esc(draft.name)}"></div>
  <label class="f">Add ingredients</label>
  <input class="in" id="search" placeholder="🔍 Search foods (apple, salmon, quinoa…)" autocomplete="off">
  <div class="sugg" id="sugg"></div>
  <details style="margin-top:10px"><summary style="font-size:13px;color:var(--green-d);font-weight:700;cursor:pointer">＋ Add a custom ingredient</summary>
   <div class="custom"><input class="in" id="cn" placeholder="Name"><input class="in" id="cc" type="number" min="0" placeholder="kcal"><input class="in" id="cp" type="number" min="0" placeholder="P g"><input class="in" id="cca" type="number" min="0" placeholder="C g"><input class="in" id="cf" type="number" min="0" placeholder="F g"><button class="btn ghost" id="cadd" style="padding:8px 12px">Add</button></div></details>
  <label class="f">Ingredient list (<span id="cnt">0</span>)</label>
  <div id="ings"></div>
  <div class="tot" id="tot"></div>
  <div class="mf"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">${m?"Save changes":"Save meal"}</button></div>`);
  drawTypes();drawSugg("");drawIngs();
  $("#icon").onchange=e=>{draft.icon=e.target.value;draft.manualIcon=true};
  $("#search").oninput=e=>drawSugg(e.target.value);
  $("#cadd").onclick=()=>{
    const n=$("#cn").value.trim(),c=parseFloat($("#cc").value);
    if(!n||isNaN(c)){toast("Enter a name and calories");return}
    draft.ings.push({name:n,emoji:"🍴",serving:"1 serving",cal:c,p:+$("#cp").value||0,c:+$("#cca").value||0,f:+$("#cf").value||0,qty:1});
    ["cn","cc","cp","cca","cf"].forEach(i=>$("#"+i).value="");drawIngs();
  };
  $("#cancel").onclick=closeModal;
  $("#save").onclick=()=>{
    draft.name=$("#mname").value.trim();
    if(!draft.ings.length){toast("Add at least one ingredient");return}
    if(!draft.name)draft.name=draft.ings.slice(0,2).map(i=>i.name).join(" & ");
    const o={id:draft.id||Math.random().toString(36).slice(2),date:draft.date,type:draft.type,name:draft.name,icon:draft.icon,ings:draft.ings};
    if(draft.id)state.meals=state.meals.map(x=>x.id===o.id?o:x);else state.meals.push(o);
    save();closeModal();render();toast(draft.id?"Meal updated ✓":"Meal logged ✓");
  };
  setTimeout(()=>$("#mname").focus(),50);
}
function drawTypes(){
  $("#types").innerHTML=TYPES.map(([t,i])=>`<button class="${draft.type===t?"on":""}" data-t="${t}">${i} ${t}</button>`).join("");
  $("#types").onclick=e=>{const b=e.target.closest("button");if(!b)return;draft.type=b.dataset.t;
    if(!draft.manualIcon){draft.icon=TYPES.find(t=>t[0]===draft.type)[1];$("#icon").value=draft.icon}drawTypes()};
}
function drawSugg(q){
  q=q.toLowerCase().trim();
  const l=FOODS.filter(f=>f.name.toLowerCase().includes(q));
  $("#sugg").innerHTML=l.map(f=>`<button data-n="${esc(f.name)}" title="${f.serving} · ${f.cal} kcal">${f.emoji} ${esc(f.name)}</button>`).join("")||`<span class="sub">No match — add it as a custom ingredient.</span>`;
  $("#sugg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    const f=FOODS.find(x=>x.name===b.dataset.n);
    const ex=draft.ings.find(i=>i.name===f.name);
    if(ex)ex.qty+=1;else draft.ings.push({...f,qty:1});
    drawIngs()};
}
function drawIngs(){
  $("#cnt").textContent=draft.ings.length;
  $("#ings").innerHTML=draft.ings.map((i,x)=>`<div class="ing"><span class="em">${i.emoji}</span>
   <div class="n">${esc(i.name)}<small>${esc(i.serving)} · P${r1(i.p*i.qty)} C${r1(i.c*i.qty)} F${r1(i.f*i.qty)}</small></div>
   <div class="step"><button data-m="${x}">−</button><span>${r1(i.qty)}</span><button data-p="${x}">+</button></div>
   <div class="k">${Math.round(i.cal*i.qty)}<small style="color:var(--muted);font-weight:500"> kcal</small></div><button class="x" data-r="${x}">✕</button></div>`).join("")
   ||`<div class="empty" style="padding:16px;font-size:13px">No ingredients yet — tap foods above.</div>`;
  const t=tot(draft.ings);
  $("#tot").innerHTML=`<span>🔥 <b>${Math.round(t.cal)}</b> kcal</span><span>🍗 <b>${r1(t.p)}</b>g protein</span><span>🍞 <b>${r1(t.c)}</b>g carbs</span><span>🥑 <b>${r1(t.f)}</b>g fat</span>`;
  $("#ings").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if(d.p!==undefined)draft.ings[d.p].qty+=.5;
    if(d.m!==undefined){const i=draft.ings[d.m];i.qty=Math.max(.5,i.qty-.5)}
    if(d.r!==undefined)draft.ings.splice(d.r,1);
    drawIngs()};
}
function showModal(h){$("#modal").innerHTML=h;$("#ov").classList.add("on")}
function closeModal(){$("#ov").classList.remove("on")}
$("#ov").onmousedown=e=>{if(e.target.id==="ov")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function openGoals(){
  const G=state.goals;
  showModal(`<h3>⚙️ Daily goals</h3><div class="goalgrid">
   <div><label class="f">🔥 Calories</label><input class="in" id="g1" type="number" min="500" value="${G.cal}"></div>
   <div><label class="f">🍗 Protein (g)</label><input class="in" id="g2" type="number" min="1" value="${G.p}"></div>
   <div><label class="f">🍞 Carbs (g)</label><input class="in" id="g3" type="number" min="1" value="${G.c}"></div>
   <div><label class="f">🥑 Fat (g)</label><input class="in" id="g4" type="number" min="1" value="${G.f}"></div></div>
   <div class="mf"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="sg">Save goals</button></div>`);
  $("#cancel").onclick=closeModal;
  $("#sg").onclick=()=>{const v=i=>Math.max(1,+$("#g"+i).value||1);
    state.goals={cal:v(1),p:v(2),c:v(3),f:v(4)};save();closeModal();render();toast("Goals updated ✓")};
}
$("#goalbtn").onclick=openGoals;
$("#add").onclick=()=>openMeal();
$("#fab").onclick=()=>openMeal();
const shift=n=>{const d=parse(date);d.setDate(d.getDate()+n);date=iso(d);render()};
$("#prev").onclick=()=>shift(-1);$("#next").onclick=()=>shift(1);
$("#today").onclick=()=>{date=iso(new Date());render()};
save();render();
</script>
</body>
</html>
