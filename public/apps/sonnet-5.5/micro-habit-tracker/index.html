<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro Habit Tracker</title>
<style>
:root{--bg:#0e0b1f;--bg2:#171233;--card:#1d1740;--card2:#262051;--line:#ffffff14;--text:#f4f2ff;--mute:#9a94c4;--accent:#ff7a59;--accent2:#ffc247;--ok:#3ee0a0;--r:20px}
*{box-sizing:border-box;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1000px 600px at 85% -10%,#4b2a9c55,transparent),radial-gradient(800px 500px at -10% 10%,#ff7a5922,transparent),var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
header{display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px #ff7a5955}
h1{font-size:20px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--card2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff4d7d);border:0;box-shadow:0 8px 22px #ff4d7d44}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger{color:#ff7a8a}
.hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#3b2a8f,#1d1740 70%);border:1px solid var(--line);border-radius:28px;padding:22px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#ffc24744,transparent 70%)}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.hero h2{font-size:clamp(20px,3.2vw,28px);letter-spacing:-.02em;margin-bottom:4px}
.hero p{color:#cfc8ff;font-size:14px}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.chip{background:#ffffff14;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
main{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}.hero{padding:18px}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:0 4px 10px;display:flex;justify-content:space-between}
.habit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;transition:.2s;position:relative;overflow:hidden}
.habit:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.habit.done{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--card))}
.habit.skip{opacity:.62}
.check{width:54px;height:54px;border-radius:17px;border:2.5px solid var(--c);display:grid;place-items:center;font-size:26px;transition:.2s;background:transparent;position:relative}
.check:hover{transform:scale(1.07)}
.done .check{background:var(--c);box-shadow:0 6px 20px color-mix(in srgb,var(--c) 55%,transparent)}
.done .check:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#10102a;font-size:30px;font-weight:900;animation:pop .35s}
.done .check span{opacity:0}
.skip .check{border-style:dashed}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.info{min-width:0}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:3px;flex-wrap:wrap}
.streak{color:var(--accent2);font-weight:700}
.streak.zero{color:var(--mute);font-weight:500}
.dots{display:flex;gap:5px;margin-top:9px}
.dot{width:24px;height:24px;border-radius:8px;background:#ffffff0f;display:grid;place-items:center;font-size:10px;color:var(--mute);transition:.15s}
.dot:hover{transform:translateY(-2px);background:#ffffff22}
.dot.d{background:var(--c);color:#10102a;font-weight:800}
.dot.s{background:repeating-linear-gradient(45deg,#ffffff1c 0 3px,transparent 3px 6px);color:var(--text)}
.dot.t{outline:1.5px solid var(--text);outline-offset:1px}
.acts{display:flex;flex-direction:column;gap:4px}
.mini{font-size:12px;padding:5px 9px;border-radius:9px;background:#ffffff0f;color:var(--mute);font-weight:600;white-space:nowrap}
.mini:hover{background:#ffffff22;color:var(--text)}
.mini.on{background:#ffffff2a;color:var(--text)}
.empty{text-align:center;padding:40px 20px;color:var(--mute);background:var(--card);border:1px dashed #ffffff30;border-radius:var(--r)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.panel h3{font-size:14px;margin-bottom:2px}
.panel .sub{margin-bottom:12px}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:6px;background:#ffffff0d;display:block}
.legend{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute);margin-top:10px;justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:4px;display:block}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:90px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:9px;border-radius:9px;background:#ffffff10;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .6s}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span:last-child{text-align:right;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--bg2);color:var(--text);padding:24px;width:min(420px,92vw);margin:auto}
dialog::backdrop{background:#05030fcc;backdrop-filter:blur(4px)}
dialog h3{margin-bottom:16px;font-size:18px}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px}
.picks{display:flex;gap:7px;flex-wrap:wrap}
.pick{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;border:2px solid transparent}
.pick.sel{border-color:var(--accent2);background:var(--card2)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw.sel{border-color:#fff}
.row{display:flex;gap:8px;margin-top:22px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#fff;color:#14112e;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:.35s;box-shadow:0 10px 40px #0008;z-index:50;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;top:0;width:9px;height:14px;z-index:40;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg);opacity:.2}}
@media(max-width:480px){.habit{grid-template-columns:auto 1fr;}.acts{flex-direction:row;grid-column:1/-1;justify-content:flex-end}.check{width:48px;height:48px}.bar{grid-template-columns:70px 1fr 36px}.hero{gap:14px}.ring{width:84px;height:84px}.dot{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">⚡</div><div><h1>Micro Habit Tracker</h1><div class="sub" id="date"></div></div></div>
    <div class="tools">
      <button class="btn primary" id="add">+ New habit</button>
      <button class="btn" id="exp">Export</button>
      <button class="btn" id="imp">Import</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="hero">
    <div class="ring"><svg width="100%" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="#ffffff1c" stroke-width="10"/><circle id="arc" cx="52" cy="52" r="44" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="transition:stroke-dashoffset .7s"/><defs><linearGradient id="g"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#ff4d7d"/></linearGradient></defs></svg><b id="pct">0%</b></div>
    <div><h2 id="msg"></h2><p id="msg2"></p><div class="stats" id="stats"></div></div>
  </section>

  <main>
    <div>
      <div class="sec"><span>Today</span><span id="count"></span></div>
      <div id="list"></div>
    </div>
    <div>
      <div class="panel"><h3>Last 14 days</h3><div class="sub">Share of habits completed each day</div><div id="chart"></div></div>
      <div class="panel"><h3>30-day consistency</h3><div class="sub">Completion rate per habit</div><div class="bars" id="bars"></div></div>
      <div class="panel"><h3>Activity heatmap</h3><div class="sub">Last 60 days — brighter is better</div><div class="heat" id="heat"></div><div class="legend">Less <i style="background:#ffffff0d"></i><i style="background:#ff7a5966"></i><i style="background:#ff7a59aa"></i><i style="background:#ffc247"></i> More</div></div>
    </div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="form">
  <h3 id="dtitle">New habit</h3>
  <label for="nm">Name</label><input type="text" id="nm" maxlength="40" placeholder="e.g. Drink water" autocomplete="off" required>
  <label>Icon</label><div class="picks" id="picks"></div>
  <label>Colour</label><div class="picks" id="sws"></div>
  <div class="row"><button type="button" class="btn danger" id="del" hidden>Delete</button><span style="flex:1"></span><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
const KEY='micro-habits-v1',MAX=7;
const EMOJI=['💧','🏃','📖','🧘','😴','🥗','✍️','🎸','🧠','🦷','🚶','🌿'];
const COLORS=['#ff7a59','#ffc247','#3ee0a0','#4dc9ff','#a78bfa','#ff4d7d','#9be564'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ago=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d};
const todayK=()=>key(ago(0));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function demo(){
  const H=[['Drink 2L water','💧',COLORS[3],.9],['Move 20 min','🏃',COLORS[0],.75],['Read 10 pages','📖',COLORS[1],.8],['Meditate','🧘',COLORS[4],.65],['Lights out by 11','😴',COLORS[2],.7]];
  const habits=[],log={};
  H.forEach(([name,emoji,color,p],i)=>{
    const id=uid();habits.push({id,name,emoji,color});log[id]={};
    for(let n=1;n<=45;n++){
      // deterministic pseudo-random; first 3-6 days strong so streaks show
      const r=Math.abs(Math.sin((i+3)*97+n*13.7))%1;
      const strong=n<=[6,4,3,5,2][i];
      if(strong||r<p)log[id][key(ago(n))]='done';
      else if(r>.93)log[id][key(ago(n))]='skip';
    }
  });
  log[habits[0].id][todayK()]='done';
  return{habits,log};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.habits))S=demo();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function streak(id){
  const L=S.log[id]||{};let n=0,i=0;
  if(!L[todayK()])i=1; // today still open: don't break
  for(;i<400;i++){const v=L[key(ago(i))];if(v==='done')n++;else if(v==='skip')continue;else break}
  return n;
}
function best(id){
  const L=S.log[id]||{};let b=0,c=0;
  for(let i=400;i>=0;i--){const v=L[key(ago(i))];if(v==='done'){c++;b=Math.max(b,c)}else if(v!=='skip')c=0}
  return b;
}
// share of habits done on day n (skips excluded from denominator)
function dayRate(n){
  const k=key(ago(n));let d=0,t=0;
  S.habits.forEach(h=>{const v=(S.log[h.id]||{})[k];if(v==='skip')return;t++;if(v==='done')d++});
  return t?d/t:(S.habits.length?null:0);
}
function habitRate(id,days=30){
  const L=S.log[id]||{};let d=0,t=0;
  for(let i=0;i<days;i++){const v=L[key(ago(i))];if(v==='skip')continue;t++;if(v==='done')d++}
  return t?d/t:0;
}

function setMark(id,k,val){
  S.log[id]=S.log[id]||{};
  if(val)S.log[id][k]=val;else delete S.log[id][k];
}
function toggleToday(id){
  const k=todayK(),v=(S.log[id]||{})[k];
  setMark(id,k,v==='done'?null:'done');
  save();render();
  if(v!=='done'){
    const s=streak(id);
    const allDone=S.habits.every(h=>(S.log[h.id]||{})[k]);
    if(allDone&&S.habits.length){confetti();toast('🎉 Perfect day! Every habit handled.')}
    else if([3,7,14,21,30,50,100].includes(s))toast(`🔥 ${s}-day streak! Keep it blazing.`);
  }
}
function toggleSkip(id){
  const k=todayK(),v=(S.log[id]||{})[k];
  setMark(id,k,v==='skip'?null:'skip');save();render();
  if(v!=='skip')toast('Day skipped — your streak is safe 🛡️');
}
function cycleDay(id,n){
  const k=key(ago(n)),v=(S.log[id]||{})[k];
  setMark(id,k,!v?'done':v==='done'?'skip':null);save();render();
}

function render(){
  const now=new Date();
  $('#date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const k=todayK(),H=S.habits;
  const doneN=H.filter(h=>(S.log[h.id]||{})[k]==='done').length;
  const skipN=H.filter(h=>(S.log[h.id]||{})[k]==='skip').length;
  const active=H.length-skipN;
  const pct=active?Math.round(doneN/active*100):(H.length?100:0);
  $('#pct').textContent=pct+'%';
  $('#arc').style.strokeDashoffset=276.46*(1-pct/100);
  const hr=now.getHours(),greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  let m,m2;
  if(!H.length){m=`${greet}! Let's begin.`;m2='Add your first micro habit — small steps compound.'}
  else if(pct===100&&active){m='Perfect day! 🎉';m2='Everything done. You are building something real.'}
  else if(!doneN){m=`${greet}! Ready?`;m2=`${active} habit${active===1?'':'s'} waiting. Start with the easiest one.`}
  else{m=`${greet} — nice momentum!`;m2=`${active-doneN} to go. Finish strong.`}
  $('#msg').textContent=m;$('#msg2').textContent=m2;
  const top=H.reduce((a,h)=>Math.max(a,streak(h.id)),0);
  const wk=H.length?Math.round([...Array(7).keys()].reduce((a,n)=>a+(dayRate(n)||0),0)/7*100):0;
  $('#stats').innerHTML=`<span class="chip">🔥 Best live streak: ${top}</span><span class="chip">📈 7-day avg: ${wk}%</span><span class="chip">✅ ${doneN}/${H.length} today</span>`;
  $('#count').textContent=`${H.length}/${MAX} habits`;
  $('#add').disabled=H.length>=MAX;
  $('#add').title=H.length>=MAX?'Maximum of 7 habits reached':'';

  $('#list').innerHTML=H.length?H.map(h=>{
    const v=(S.log[h.id]||{})[k],s=streak(h.id),b=best(h.id);
    const dots=[6,5,4,3,2,1,0].map(n=>{
      const x=(S.log[h.id]||{})[key(ago(n))],d=ago(n);
      return `<button class="dot ${x==='done'?'d':x==='skip'?'s':''} ${n===0?'t':''}" data-id="${h.id}" data-n="${n}" aria-label="${d.toDateString()}: ${x||'none'}" title="${d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})} — click to cycle">${x==='skip'?'–':'SMTWTFS'[d.getDay()]}</button>`}).join('');
    return `<div class="habit ${v||''}" style="--c:${h.color}">
      <button class="check" data-act="chk" data-id="${h.id}" aria-label="Mark ${esc(h.name)} ${v==='done'?'not done':'done'}" aria-pressed="${v==='done'}"><span>${esc(h.emoji)}</span></button>
      <div class="info"><div class="name">${esc(h.name)}</div>
        <div class="meta"><span class="streak ${s?'':'zero'}">🔥 ${s} day${s===1?'':'s'}</span><span>Best ${b}</span><span>${Math.round(habitRate(h.id)*100)}% / 30d</span></div>
        <div class="dots">${dots}</div></div>
      <div class="acts"><button class="mini ${v==='skip'?'on':''}" data-act="skip" data-id="${h.id}">${v==='skip'?'Skipped ✓':'Skip day'}</button><button class="mini" data-act="edit" data-id="${h.id}">Edit</button></div>
    </div>`}).join(''):`<div class="empty">No habits yet.<br>Tap <b>+ New habit</b> to start your streak.</div>`;

  // 14-day bar chart
  const W=460,Hh=170,bw=W/14;let svg=`<svg viewBox="0 0 ${W} ${Hh+22}" width="100%" role="img" aria-label="Daily completion, last 14 days">`;
  [0,50,100].forEach(g=>{const y=Hh-g/100*(Hh-14);svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#ffffff12"/>`});
  svg+=`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#ff4d7d"/></linearGradient></defs>`;
  for(let i=13;i>=0;i--){
    const r=dayRate(i)||0,x=(13-i)*bw+5,h=Math.max(3,r*(Hh-14)),d=ago(i);
    svg+=`<rect x="${x}" y="${Hh-h}" width="${bw-10}" height="${h}" rx="6" fill="${r?'url(#bg)':'#ffffff14'}" opacity="${i===0?1:.88}"><title>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}: ${Math.round(r*100)}%</title></rect>`;
    if(r>=.01)svg+=`<text x="${x+(bw-10)/2}" y="${Hh-h-4}" text-anchor="middle">${Math.round(r*100)}</text>`;
    svg+=`<text x="${x+(bw-10)/2}" y="${Hh+14}" text-anchor="middle" ${i===0?'style="fill:#f4f2ff;font-weight:700"':''}>${i===0?'Today':d.getDate()}</text>`;
  }
  $('#chart').innerHTML=svg+'</svg>';

  $('#bars').innerHTML=H.length?H.map(h=>{const p=Math.round(habitRate(h.id)*100);return `<div class="bar" style="--c:${h.color}"><span>${esc(h.emoji)} ${esc(h.name)}</span><div class="t"><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join(''):'<div class="sub">Nothing to chart yet.</div>';

  let hm='';
  for(let i=59;i>=0;i--){
    const r=dayRate(i),d=ago(i);
    const col=r===null||r===0?'#ffffff0d':r<.4?'#ff7a5966':r<.75?'#ff7a59aa':r<1?'#ffa94d':'#ffc247';
    hm+=`<i style="background:${col}" title="${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}: ${Math.round((r||0)*100)}%"></i>`;
  }
  $('#heat').innerHTML=hm;
}

// ---- events
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.id;
  if(b.dataset.act==='chk')toggleToday(id);
  else if(b.dataset.act==='skip')toggleSkip(id);
  else if(b.dataset.act==='edit')openDlg(id);
  else if(b.dataset.n!==undefined)cycleDay(id,+b.dataset.n);
});

// ---- dialog
let editing=null,selE=EMOJI[0],selC=COLORS[0];
function paintPicks(){
  $('#picks').innerHTML=EMOJI.map(x=>`<button type="button" class="pick ${x===selE?'sel':''}" data-e="${x}" aria-label="Icon ${x}">${x}</button>`).join('');
  $('#sws').innerHTML=COLORS.map(c=>`<button type="button" class="sw ${c===selC?'sel':''}" data-c="${c}" style="--c:${c}" aria-label="Colour ${c}"></button>`).join('');
}
$('#dlg').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.e){selE=b.dataset.e;paintPicks()}
  if(b&&b.dataset.c){selC=b.dataset.c;paintPicks()}
  if(e.target===$('#dlg'))$('#dlg').close();
});
function openDlg(id){
  editing=id||null;
  const h=S.habits.find(x=>x.id===id);
  $('#dtitle').textContent=h?'Edit habit':'New habit';
  $('#nm').value=h?h.name:'';
  selE=h?h.emoji:EMOJI[S.habits.length%EMOJI.length];
  selC=h?h.color:COLORS[S.habits.length%COLORS.length];
  $('#del').hidden=!h;paintPicks();$('#dlg').showModal();$('#nm').focus();
}
$('#add').onclick=()=>{if(S.habits.length<MAX)openDlg()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').addEventListener('submit',e=>{
  const name=$('#nm').value.trim();if(!name){e.preventDefault();return}
  if(editing){const h=S.habits.find(x=>x.id===editing);Object.assign(h,{name,emoji:selE,color:selC});toast('Habit updated ✏️')}
  else if(S.habits.length<MAX){const id=uid();S.habits.push({id,name,emoji:selE,color:selC});S.log[id]={};toast('Habit added — go get it! 💪')}
  save();render();
});
$('#del').onclick=()=>{
  const h=S.habits.find(x=>x.id===editing);
  if(h&&confirm(`Delete "${h.name}" and its history?`)){
    S.habits=S.habits.filter(x=>x.id!==editing);delete S.log[editing];save();render();$('#dlg').close();toast('Habit deleted');
  }
};

// ---- export / import
$('#exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'micro-habit-tracker',version:1,exported:new Date().toISOString(),...S},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`habits-${todayK()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Exported 📦');
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.habits)||typeof d.log!=='object'||!d.log)throw 0;
    const habits=d.habits.slice(0,MAX).map(h=>({id:String(h.id||uid()),name:String(h.name||'Habit').slice(0,40),emoji:String(h.emoji||'⭐').slice(0,4),color:/^#[0-9a-f]{6}$/i.test(h.color)?h.color:COLORS[0]}));
    const log={};
    habits.forEach(h=>{log[h.id]={};const L=d.log[h.id]||{};for(const k in L)if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(L[k]==='done'||L[k]==='skip'))log[h.id][k]=L[k]});
    if(!confirm(`Replace current data with ${habits.length} imported habit(s)?`))return;
    S={habits,log};save();render();toast('Imported ✅');
  }catch(err){toast('Import failed: invalid file')}
};

// ---- fx
let tt;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600)}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=COLORS[i%COLORS.length];
    c.style.setProperty('--x',(Math.random()*200-100)+'px');c.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),2300);
  }
}
render();
// refresh when the day rolls over
let lastDay=todayK();setInterval(()=>{if(todayK()!==lastDay){lastDay=todayK();render()}},60000);
</script>
</body>
</html>
