<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merry Christmas! A Holiday Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1240;font-family:'Fredoka','Comic Sans MS','Trebuchet MS',sans-serif;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:default}
#scene>*{position:absolute}
#sky,#skyday{inset:0;transition:opacity 1.4s}
#sky{background:linear-gradient(#070b30 0%,#1a1c68 38%,#4a3a99 66%,#d27fb0 100%)}
#skyday{background:linear-gradient(#5db6ff 0%,#a9dcff 55%,#fff0dc 100%);opacity:0}
body.day #skyday{opacity:1}
#stars{inset:0 0 40% 0;transition:opacity 1.2s}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out;box-shadow:0 0 6px #fff}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.aurora{left:-10%;width:120%;height:40%;filter:blur(40px);opacity:.45;transition:opacity 1.2s;pointer-events:none}
.a1{top:5%;background:linear-gradient(90deg,transparent,#2cffb4 30%,#5a8bff 60%,transparent);animation:aur 14s infinite alternate ease-in-out}
.a2{top:12%;background:linear-gradient(90deg,transparent,#ff6bd5 25%,#7a5cff 65%,transparent);opacity:.3;animation:aur 19s infinite alternate-reverse ease-in-out}
@keyframes aur{from{transform:translateX(-8%) skewX(-10deg) scaleY(.8)}to{transform:translateX(8%) skewX(12deg) scaleY(1.2)}}
body.day .aurora,body.day #stars,body.day #moon{opacity:0}
#moon{right:9%;top:22%;width:clamp(50px,9vw,100px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffefa8 60%,#f1d76e);box-shadow:0 0 40px 12px rgba(255,240,170,.45),0 0 120px 40px rgba(255,240,170,.2);transition:opacity 1.2s;cursor:pointer;z-index:2}
#moon::before,#moon::after{content:"";position:absolute;border-radius:50%;background:rgba(200,170,80,.25)}
#moon::before{width:22%;height:22%;left:55%;top:20%}
#moon::after{width:15%;height:15%;left:25%;top:58%}
#sun{left:12%;top:18%;width:clamp(50px,9vw,100px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff9c4,#ffd54a);box-shadow:0 0 60px 25px rgba(255,220,90,.6);opacity:0;transition:opacity 1.2s;pointer-events:none}
body.day #sun{opacity:1}
#hills{left:0;right:0;top:50%;height:50%;width:100%}
#hills path{transition:fill 1.4s}
.h1{fill:#6f86c8}.h2{fill:#9bb1e6}.h3{fill:#eaf1ff}
body.day .h1{fill:#a9cdf0}body.day .h2{fill:#cfe5fa}body.day .h3{fill:#fff}
#items{inset:0}
.item{position:absolute;translate:-50% -90%;cursor:grab;touch-action:none}
.item.dragging{cursor:grabbing}
.flip{display:block;transition:scale .15s}
.item.dragging .flip{scale:1.18}
.tap{display:block;transform-origin:50% 90%}
.face{line-height:1;filter:drop-shadow(0 5px 3px rgba(0,0,30,.35));transform-origin:50% 90%;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;padding:2px}
.item.selected .face{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #ffd84a)}
.item.drop{animation:dropin .85s cubic-bezier(.3,0,.6,1) both;transform-origin:50% 100%}
@keyframes dropin{0%{transform:translateY(-85vh) rotate(-25deg) scale(.5);opacity:0}15%{opacity:1}60%{transform:translateY(0) rotate(0) scale(1)}72%{transform:scale(1.18,.8)}86%{transform:scale(.94,1.07)}100%{transform:none}}
.idle-bob{animation:bob 2.2s infinite ease-in-out alternate}
@keyframes bob{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-4%) scaleY(1.03)}}
.idle-sway{animation:sway 4s infinite ease-in-out alternate}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.idle-float{animation:flt 4s infinite ease-in-out alternate}
@keyframes flt{from{transform:translateY(-6%) rotate(-4deg)}to{transform:translateY(6%) rotate(4deg)}}
.idle-twinkle{animation:twk 1.8s infinite ease-in-out alternate}
@keyframes twk{from{transform:scale(.88) rotate(-6deg);filter:drop-shadow(0 0 4px #ffe680)}to{transform:scale(1.1) rotate(6deg);filter:drop-shadow(0 0 16px #fff2a8)}}
.idle-swing{animation:swg 2.4s infinite ease-in-out alternate;transform-origin:50% 5%}
@keyframes swg{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.idle-pulse{animation:pls 1.4s infinite ease-in-out alternate}
@keyframes pls{from{transform:scale(.95);filter:drop-shadow(0 0 4px #ffb347)}to{transform:scale(1.06);filter:drop-shadow(0 0 16px #ffc46b)}}
.a-jump{animation:ajump .6s ease-out}
@keyframes ajump{0%{transform:scale(1)}15%{transform:scale(1.15,.8)}45%{transform:translateY(-38%) scale(.92,1.12)}75%{transform:translateY(0) scale(1.12,.88)}100%{transform:scale(1)}}
.a-wiggle{animation:awig .7s ease-in-out}
@keyframes awig{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
.a-spin{animation:aspin .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes aspin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.4)}100%{transform:rotate(360deg) scale(1)}}
.a-squash{animation:asq .5s ease-out}
@keyframes asq{0%{transform:scale(1)}25%{transform:scale(1.2,.8)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
/* lights */
#lights{left:0;right:0;top:0;height:60px;z-index:900;pointer-events:none}
#lights svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{position:absolute;width:13px;height:19px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 12px 3px var(--c);pointer-events:auto;cursor:pointer;animation:bl 1.6s infinite ease-in-out;transform-origin:50% 0}
.bulb::before{content:"";position:absolute;left:3px;top:-5px;width:7px;height:6px;background:#3a3a3a;border-radius:2px}
.bulb.flash{animation:none;filter:brightness(2);transform:scale(1.4)}
@keyframes bl{0%,100%{opacity:.55}50%{opacity:1}}
#titlebox{top:56px;left:0;right:0;text-align:center;pointer-events:none;z-index:800}
#title{display:inline-block;margin:0;padding:0 .3em;pointer-events:auto;font-family:'Mountains of Christmas','Fredoka',cursive;font-weight:700;font-size:clamp(2.1rem,6.4vw,4.6rem);line-height:1.1;outline:none;cursor:text;
background:linear-gradient(90deg,#ff5a5a,#ffd84a,#7dff9a,#ff5a5a,#ffd84a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:tg 6s linear infinite;filter:drop-shadow(0 3px 0 rgba(90,0,30,.6)) drop-shadow(0 0 14px rgba(255,255,255,.35))}
#title:focus{filter:drop-shadow(0 0 3px #fff)}
@keyframes tg{to{background-position:300% 0}}
#sub{margin:2px 0 0;font-size:clamp(.75rem,1.7vw,1rem);opacity:.9;text-shadow:0 2px 4px rgba(0,0,40,.6)}
#hint{left:50%;bottom:12px;translate:-50% 0;z-index:850;background:rgba(0,0,40,.45);backdrop-filter:blur(6px);padding:7px 16px;border-radius:99px;font-size:clamp(.72rem,1.6vw,.95rem);white-space:nowrap;pointer-events:none;transition:opacity .8s,transform .8s;animation:hintp 2.5s infinite ease-in-out}
@keyframes hintp{50%{transform:translateY(-4px)}}
#hint.gone{opacity:0}
#controls{right:10px;top:84px;z-index:950;display:flex;flex-direction:column;gap:8px}
.cbtn{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(20,20,70,.5);backdrop-filter:blur(6px);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .2s;padding:0;font-family:inherit}
.cbtn:hover{transform:scale(1.12);background:rgba(200,40,60,.6)}
.cbtn:active{transform:scale(.9)}
.cbtn.off{opacity:.55}
#fx{inset:0;width:100%;height:100%;pointer-events:none;z-index:1000}
.bubble{z-index:960;background:#fff;color:#c4182b;font-weight:600;padding:7px 13px;border-radius:16px;font-size:clamp(.8rem,2vw,1.05rem);white-space:nowrap;translate:-50% -100%;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,40,.35);animation:bub 2s ease-out forwards;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bub{0%{transform:scale(0)}12%{transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#selbar{z-index:970;display:none;gap:6px;translate:-50% -100%;background:rgba(20,20,70,.75);backdrop-filter:blur(6px);padding:5px;border-radius:99px;border:2px solid #ffd84a}
#selbar button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:17px;cursor:pointer;padding:0}
#selbar button:hover{background:rgba(255,255,255,.35)}
#trash{right:14px;bottom:14px;width:84px;height:84px;border-radius:50%;background:rgba(40,0,20,.55);border:3px dashed #fff;display:grid;place-items:center;font-size:38px;z-index:965;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#trash.show{transform:scale(1)}
#trash.hot{background:rgba(255,50,70,.8);transform:scale(1.25)}
.sleigh{z-index:940;pointer-events:none;white-space:nowrap;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
/* tray */
#tray{flex:none;background:linear-gradient(#b3162e,#7d0c20);border-top:4px solid #ffd84a;box-shadow:0 -8px 24px rgba(0,0,30,.45);padding:6px 8px 8px;position:relative;z-index:50}
#tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.tab{border:0;border-radius:99px;padding:5px 14px;background:rgba(255,255,255,.18);color:#fff;font:600 clamp(.75rem,1.8vw,.95rem) 'Fredoka',sans-serif;cursor:pointer;transition:.2s}
.tab.active{background:#ffd84a;color:#8a0f22;transform:translateY(-2px);box-shadow:0 3px 0 #c99a00}
#row{display:flex;gap:6px;overflow-x:auto;padding:2px 4px 4px;scrollbar-width:thin;justify-content:safe center;scrollbar-color:#ffd84a transparent}
.pi{flex:none;width:clamp(50px,9vw,64px);height:clamp(50px,9vw,64px);border-radius:16px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:clamp(28px,5.2vw,38px);cursor:grab;touch-action:pan-x;position:relative;transition:transform .15s,background .2s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;padding:0;color:#fff}
.pi:hover{transform:translateY(-4px) scale(1.1);background:rgba(255,255,255,.3)}
.pi:active{transform:scale(.92)}
.pi.fxi{border-color:#ffd84a;background:rgba(255,216,74,.22)}
.pi.fxi::after{content:"✦";position:absolute;top:-6px;right:-3px;font-size:14px;color:#ffd84a;font-family:sans-serif}
.ghost{position:fixed;left:0;top:0;z-index:5000;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
/* cover */
#cover{position:fixed;inset:0;z-index:9000;perspective:1600px;background:rgba(5,8,40,.85);transition:opacity 1s .5s,visibility 0s 1.6s}
#cover.open{opacity:0;visibility:hidden}
#cover .page{position:absolute;inset:0;transform-origin:left center;transition:transform 1.3s cubic-bezier(.6,.05,.3,1);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
background:radial-gradient(circle at 50% 40%,#e0243c,#a30f26 70%);overflow:hidden}
#cover.open .page{transform:rotateY(-115deg)}
#cover .page::before{content:"";position:absolute;inset:14px;border:4px dashed #ffd84a;border-radius:26px;opacity:.8}
#cover h2{font-family:'Mountains of Christmas',cursive;font-size:clamp(2.4rem,9vw,5.5rem);margin:0;line-height:1;color:#fff;text-shadow:0 4px 0 #6a0719,0 0 30px rgba(255,220,100,.6)}
#cover .big{font-size:clamp(4rem,16vw,9rem);animation:bob 1.4s infinite alternate ease-in-out;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
#cover p{margin:0;font-size:clamp(1rem,3vw,1.4rem)}
#openbtn{margin-top:8px;font:600 clamp(1.2rem,4vw,1.8rem) 'Fredoka',sans-serif;border:0;border-radius:99px;padding:14px 38px;background:#ffd84a;color:#a30f26;cursor:pointer;box-shadow:0 6px 0 #c99a00,0 10px 20px rgba(0,0,0,.35);animation:pulseb 1.3s infinite ease-in-out}
#openbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a00}
@keyframes pulseb{50%{transform:scale(1.08)}}
.cf{position:absolute;font-size:2rem;animation:cfa 6s linear infinite;top:-10%;opacity:.9}
@keyframes cfa{to{transform:translateY(120vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="sky"></div><div id="skyday"></div>
    <div id="stars"></div><div class="aurora a1"></div><div class="aurora a2"></div>
    <div id="moon" title="Goodnight moon"></div><div id="sun"></div>
    <svg id="hills" viewBox="0 0 100 50" preserveAspectRatio="none">
      <path class="h1" d="M0 8 C18 0 32 9 50 5 S82 -2 100 6 V50 H0Z"/>
      <path class="h2" d="M0 13 C20 7 38 15 60 10 S90 9 100 12 V50 H0Z"/>
      <path class="h3" d="M0 18 C25 13 48 20 72 15 S95 15 100 17 V50 H0Z"/>
    </svg>
    <div id="items"></div>
    <div id="lights"></div>
    <div id="titlebox"><h1 id="title" contenteditable="true" spellcheck="false" title="Click to write your own message!">Merry Christmas!</h1><p id="sub">Drag things in · Tap them to hear them · Click the lights!</p></div>
    <div id="hint">👇 Drag a friend from the box into the snow!</div>
    <canvas id="fx"></canvas>
    <div id="selbar"><button data-a="small" title="Smaller">➖</button><button data-a="big" title="Bigger">➕</button><button data-a="flip" title="Flip">↔️</button><button data-a="del" title="Remove">🗑️</button></div>
    <div id="trash">🗑️</div>
    <div id="controls">
      <button class="cbtn" id="bSound" title="Sound on/off">🔊</button>
      <button class="cbtn" id="bMusic" title="Music">🎵</button>
      <button class="cbtn" id="bSnow" title="Snow amount">❄️</button>
      <button class="cbtn" id="bDay" title="Day / Night">🌙</button>
      <button class="cbtn" id="bShake" title="Shake the snow globe!">🌀</button>
      <button class="cbtn" id="bReset" title="Start over">↺</button>
    </div>
  </div>
  <div id="tray"><div id="tabs"></div><div id="row"></div></div>
</div>
<div id="cover"><div class="page">
  <div class="big">🎄</div>
  <h2>Happy Holidays!</h2>
  <p>A magical card made just for you ✨</p>
  <button id="openbtn">Open me! 🎁</button>
</div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scene=$('#scene'),itemsEl=$('#items'),fx=$('#fx'),ctx=fx.getContext('2d');
let W=0,H=0,U=50,DPR=1;

/* ---------------- AUDIO ---------------- */
let AC=null,master=null,muted=false,noiseBuf=null;
function ensureAudio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    AC=new C(); master=AC.createGain(); master.gain.value=muted?0:.8;
    const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
}
const N=n=>261.63*Math.pow(2,n/12);
function voice({f=440,f2=null,d=.2,t=0,v=.2,type='sine',cut=null,atk=.01}){
  if(!AC)return; const t0=AC.currentTime+t;
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t0); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+atk); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let out=o;
  if(cut){const b=AC.createBiquadFilter();b.type='lowpass';b.frequency.value=cut;o.connect(b);out=b;}
  out.connect(g).connect(master); o.start(t0); o.stop(t0+d+.05);
}
function noise({d=.2,t=0,v=.2,type='bandpass',f=1000,f2=null,q=1}){
  if(!AC)return; const t0=AC.currentTime+t;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const b=AC.createBiquadFilter(); b.type=type; b.Q.value=q; b.frequency.setValueAtTime(f,t0);
  if(f2)b.frequency.exponentialRampToValueAtTime(f2,t0+d);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(b).connect(g).connect(master); s.start(t0,Math.random()); s.stop(t0+d+.05);
}
function bell(f,v=.16,t=0,d=1.3){
  [[1,1],[2.01,.45],[2.76,.3],[4.07,.2],[5.4,.12]].forEach(([m,a],i)=>voice({f:f*m,d:d/(1+i*.7),t,v:v*a,type:'sine',atk:.004}));
}
function musicNote(f,t=0,d=.5,v=.14){
  voice({f,d,t,v,type:'sine',atk:.005}); voice({f:f*2,d:d*.6,t,v:v*.35,type:'triangle',atk:.005}); voice({f:f*3,d:d*.25,t,v:v*.12,type:'sine',atk:.003});
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
const sfx={
  hohoho(){for(let i=0;i<3;i++){voice({f:140,f2:100,d:.3,t:i*.36,v:.4,type:'sawtooth',cut:650});voice({f:280,f2:200,d:.25,t:i*.36,v:.08,type:'square',cut:500});}},
  bell(){const f=rand(700,1000);bell(f);bell(f*1.5,.08,.12)},
  jingle(){for(let i=0;i<7;i++){bell(rand(1500,2600),.07,i*.06,.5)}noise({d:.5,v:.05,type:'highpass',f:6000})},
  chime(){[0,4,7,12,16].forEach((n,i)=>bell(N(n+12),.12,i*.09,1.2))},
  twinkle(){for(let i=0;i<6;i++)bell(N(pick(PENTA)+24),.08,i*.07,.7)},
  boing(){voice({f:180,f2:700,d:.18,v:.25,type:'sine'});voice({f:700,f2:220,d:.3,t:.17,v:.22,type:'sine'});voice({f:300,f2:420,d:.2,t:.4,v:.1,type:'triangle'})},
  squeak(){const f=rand(900,1300);voice({f,f2:f*1.6,d:.1,v:.14,type:'square',cut:3000});voice({f:f*1.5,f2:f,d:.12,t:.1,v:.12,type:'square',cut:3000})},
  pop(){voice({f:700,f2:80,d:.12,v:.35});noise({d:.1,v:.25,type:'highpass',f:2500})},
  munch(){for(let i=0;i<4;i++)noise({d:.07,t:i*.11,v:.4,type:'bandpass',f:rand(900,2000),q:2})},
  tada(){[0,4,7].forEach(n=>musicNote(N(n+12),0,.3,.12));[7,12,16,19].forEach((n,i)=>musicNote(N(n+12),.25+i*.05,.9,.12));noise({d:.6,t:.25,v:.08,type:'highpass',f:5000})},
  meow(){voice({f:450,f2:900,d:.2,v:.2,type:'sawtooth',cut:1800});voice({f:900,f2:420,d:.35,t:.2,v:.2,type:'sawtooth',cut:1500})},
  woof(){for(let i=0;i<2;i++){voice({f:330,f2:130,d:.16,t:i*.25,v:.35,type:'sawtooth',cut:900});noise({d:.1,t:i*.25,v:.12,f:900})}},
  hoot(){voice({f:420,f2:380,d:.35,v:.3,type:'sine'});voice({f:340,f2:320,d:.5,t:.4,v:.3,type:'sine'})},
  rawr(){voice({f:95,f2:60,d:.7,v:.4,type:'sawtooth',cut:420});voice({f:140,f2:80,d:.6,v:.12,type:'square',cut:300})},
  whoosh(){noise({d:.8,v:.3,type:'bandpass',f:300,f2:3500,q:.8});noise({d:.6,t:.5,v:.2,type:'bandpass',f:3500,f2:300,q:.8})},
  crackle(){for(let i=0;i<10;i++)noise({d:.04,t:rand(0,.6),v:rand(.1,.3),type:'highpass',f:rand(2500,6000)})},
  boom(){noise({d:.9,v:.55,type:'lowpass',f:900,f2:60});voice({f:110,f2:35,d:.6,v:.5})},

function startPalette(e,def,btn){

  const up=ev=>{

  let n=0,d='';
  for(let x=-4;x<W+step;x+=6){const f=((x%seg)+seg)%seg/seg;const y=4+sag*Math.sin(Math.PI*f);d+=(d?'L':'M')+x+' '+y;}
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('stroke','#1c3a24');p.setAttribute('stroke-width','3');p.setAttribute('fill','none');svg.appendChild(p);L.appendChild(svg);
  for(let x=10;x<W;x+=step){
    const f=((x%seg)/seg),y=4+sag*Math.sin(Math.PI*f);
    const b=document.createElement('div'); b.className='bulb'; b.style.left=(x-6)+'px'; b.style.top=(y+2)+'px';
    b.style.setProperty('--c',COLORS[n%COLORS.length]); b.style.animationDelay=(-n*.23)+'s';
    const note=PENTA[Math.floor(x/W*PENTA.length)];
    const ring=()=>{ensureAudio();bell(N(note+12)*1.0,.18,0,1.1);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),200);if(Math.random()<.3)emojiBurst(x,y+30,['✨'],3,.4)};
    b.addEventListener('pointerdown',e=>{e.stopPropagation();ring()});
    b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')ring()});
    L.appendChild(b); n++;
  }
}

/* ---------------- PARTICLES / SNOW / FX ---------------- */
let parts=[],flakes=[],wind=0,mouse={x:-999,y:-999,on:false},snowLevel=1,rockets=[],comets=[];
const SNOW_N=[0,80,190,420];
function mkFlake(top){
  const r=rand(1,4.2); return {x:rand(0,W),y:top?rand(-H,0):rand(0,H),r,vy:.5+r*.38,ph:rand(0,6.28),ex:0,ey:0,t:false};
}
function setSnow(l){snowLevel=l;const n=SNOW_N[l]*(W<600?.6:1);flakes=flakes.filter(f=>f.t);for(let i=0;i<n;i++)flakes.push(mkFlake(false));}
function spark(x,y,tiny){parts.push({k:'d',c:pick(['#fff','#ffe680','#aef','#fbc']),x,y,vx:rand(-.6,.6),vy:rand(-.2,.8),g:.02,life:40,max:40,r:rand(1,2.6),drag:.98,add:true});}
function emojiBurst(x,y,chars,n=8,pw=1){
  for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(1.5,5)*pw;
    parts.push({k:'e',ch:pick(chars),x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*pw,g:.12,life:rand(45,80),max:80,s:rand(14,28),rot:rand(0,6),vr:rand(-.2,.2),drag:.97});}
}
function confetti(x,y,n=60,burst=false){
  for(let i=0;i<n;i++){
    const o=burst?{x,y,vx:rand(-6,6),vy:rand(-9,-2)}:{x:rand(0,W),y:rand(-60,-5),vx:rand(-1.5,1.5),vy:rand(1,4)};
    parts.push({k:'r',c:pick(['#ff3b4e','#ffd84a','#3bff8a','#3bb7ff','#ff7be5','#fff']),...o,g:.12,life:rand(110,200),max:200,w:rand(5,10),h:rand(3,6),rot:rand(0,6),vr:rand(-.3,.3),drag:.985,fl:rand(0,6)});
  }
}
function launch(tx,ty){
  const x=clamp(tx,30,W-30); rockets.push({x,y:H*.85,ty,vy:-Math.max(7,(H*.85-ty)/42),tx}); play('rocket');
}
function explode(x,y){
  play('boom'); setTimeout(()=>play('crackle'),200);
  const pal=pick([['#ff3b4e','#ffd84a'],['#3bb7ff','#fff'],['#3bff8a','#ffe680'],['#ff7be5','#b58bff'],['#ffd84a','#ff9a3b']]);
  const style=Math.random()<.5,n=90;
  for(let i=0;i<n;i++){
    const a=i/n*6.28+rand(-.05,.05),s=style?rand(2,7):(i%2?6:3.2)+rand(-.2,.2);
    parts.push({k:'d',c:pick(pal),x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.07,life:rand(60,100),max:100,r:rand(1.6,3.2),drag:.965,add:true,trail:true});
  }
  emojiBurst(x,y,['⭐','✨'],5,1.2);
}
function comet(){
  comets.push({x:W*rand(.6,1.0),y:H*rand(.02,.2),vx:-rand(6,9),vy:rand(2.5,4),life:0}); play('star');
}
function sleigh(){
  const el=document.createElement('div'); el.className='sleigh'; el.style.fontSize=(U*1.5)+'px'; el.textContent='🦌🦌🛷';
  const ty=H*rand(.12,.3); el.style.top=ty+'px'; el.style.left='0'; scene.appendChild(el);
  const dur=5200; const a=el.animate([{transform:`translate(${-U*7}px,20px) rotate(3deg)`},{transform:`translate(${W*.5}px,-30px) rotate(-3deg)`},{transform:`translate(${W+U}px,10px) rotate(2deg)`}],{duration:dur,easing:'linear'});
  play('jingle'); const jt=setInterval(()=>{if(AC)sfx.jingle()},1100);
  const t0=performance.now();
  // gifts less often
  let gl=0; const trail2=()=>{ if(!el.isConnected)return; const r=el.getBoundingClientRect(),s=scene.getBoundingClientRect();
    parts.push({k:'e',ch:pick(['✨','⭐','❄️','💫']),x:r.left-s.left+rand(0,20),y:r.top-s.top+r.height*.7,vx:rand(-1.5,-.2),vy:rand(-.3,1),g:.02,life:70,max:70,s:rand(14,24),rot:0,vr:rand(-.1,.1)});
    if(++gl%30===0)parts.push({k:'e',ch:pick(['🎁','🍬','🧸']),x:r.left-s.left+r.width*.6,y:r.top-s.top+r.height*.8,vx:rand(-1,1),vy:0,g:.12,life:90,max:90,s:24,rot:0,vr:.05});
    requestAnimationFrame(trail2)};
  trail2();
  a.onfinish=()=>{clearInterval(jt);el.remove()};
}
function storm(){
  play('whoosh'); wind=3; for(let i=0;i<260;i++){const f=mkFlake(true);f.t=true;f.vy*=1.6;f.y=rand(-H,0);flakes.push(f);}
}
function runEffect(k,x,y){
  ensureAudio(); const px=x==null?rand(W*.2,W*.8):x*W,py=y==null?rand(H*.15,H*.4):y*H; $('#hint').classList.add('gone');
  if(k==='fireworks'){launch(px,py);setTimeout(()=>launch(rand(W*.1,W*.9),rand(H*.1,H*.45)),400);setTimeout(()=>launch(rand(W*.1,W*.9),rand(H*.1,H*.45)),800);}
  if(k==='comet')comet();
  if(k==='sleigh')sleigh();
  if(k==='storm')storm();
  if(k==='confetti'){play('tada');confetti(0,0,170);}
}
function shake(){
  play('jingle'); play('whoosh');
  flakes.forEach(f=>{f.ex=rand(-8,8);f.ey=rand(-12,-3);});
  for(let i=0;i<120;i++){const f=mkFlake(false);f.t=true;f.y=rand(H*.3,H);f.ex=rand(-8,8);f.ey=rand(-10,-2);flakes.push(f);}
  items.forEach(it=>{const d=DEFS[it.ch];setTimeout(()=>anim(it,'a-wiggle'),rand(0,300));});
  scene.animate([{transform:'translate(0,0)'},{transform:'translate(-8px,4px)'},{transform:'translate(7px,-5px)'},{transform:'translate(-6px,3px)'},{transform:'translate(4px,-2px)'},{transform:'translate(0,0)'}],{duration:500});
}

let last=performance.now(),tm=0;
function frame(now){
  const dt=Math.min(2.5,(now-last)/16.67); last=now; tm+=dt;
  ctx.clearRect(0,0,W,H);
  wind*=Math.pow(.97,dt); const base=Math.sin(tm*.004)*.35+(snowLevel===3?.8:0);
  // snow
  ctx.fillStyle='#fff';
  for(let i=flakes.length-1;i>=0;i--){
    const f=flakes[i]; f.ph+=.02*dt;
    f.x+=((wind+base)*(.4+f.r*.25)+Math.sin(f.ph)*.45+f.ex)*dt; f.y+=(f.vy+f.ey)*dt; f.ex*=Math.pow(.95,dt); f.ey*=Math.pow(.95,dt);
    if(mouse.on){const dx=f.x-mouse.x,dy=f.y-mouse.y,d2=dx*dx+dy*dy;if(d2<8100){const d=Math.sqrt(d2)||1;f.x+=dx/d*(90-d)*.05*dt;f.y+=dy/d*(90-d)*.05*dt;}}
    if(f.y>H+10){ if(f.t){flakes.splice(i,1);continue;} f.y=-10;f.x=rand(0,W); }
    if(f.x>W+10)f.x=-10; else if(f.x<-10)f.x=W+10;
    ctx.globalAlpha=.45+f.r*.13;
    if(f.r>3.4){ctx.strokeStyle='#fff';ctx.lineWidth=1.1;ctx.beginPath();for(let k=0;k<3;k++){const a=f.ph*.3+k*1.047;ctx.moveTo(f.x-Math.cos(a)*f.r*1.3,f.y-Math.sin(a)*f.r*1.3);ctx.lineTo(f.x+Math.cos(a)*f.r*1.3,f.y+Math.sin(a)*f.r*1.3);}ctx.stroke();}
    else{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
  }
  ctx.globalAlpha=1;
  // rockets
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;r.x+=Math.sin(tm*.3)*.3;
    parts.push({k:'d',c:'#ffd27a',x:r.x,y:r.y,vx:rand(-.3,.3),vy:rand(.5,1.5),g:.02,life:22,max:22,r:2,drag:.95,add:true});
    if(r.y<=r.ty){explode(r.x,r.y);rockets.splice(i,1);}}
  // comets
  for(let i=comets.length-1;i>=0;i--){const c=comets[i];c.x+=c.vx*dt;c.y+=c.vy*dt;c.life+=dt;
    for(let k=0;k<3;k++)parts.push({k:'d',c:pick(['#fff','#ffe680','#aef']),x:c.x+rand(-3,3),y:c.y+rand(-3,3),vx:rand(-.3,.3),vy:rand(-.3,.5),g:.01,life:50,max:50,r:rand(1.5,3.5),drag:.97,add:true});
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(c.x,c.y,5,0,6.28);ctx.fill();ctx.shadowBlur=0;
    if(c.x<-50||c.y>H+50){comets.splice(i,1);play('twinkle');}}
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;}
    if(p.drag){p.vx*=p.drag;p.vy*=p.drag;} p.vy+=p.g*dt; p.x+=p.vx*dt;p.y+=p.vy*dt;
    const a=clamp(p.life/(p.max*.6),0,1); ctx.globalAlpha=a;
    if(p.k==='d'){ctx.globalCompositeOperation=p.add?'lighter':'source-over';ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.trail?a*.8+.4:1),0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';}
    else if(p.k==='r'){p.rot+=p.vr*dt;p.fl+=.15*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.fl));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
    else{p.rot+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*.3);ctx.font=p.s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(p.ch,0,0);ctx.restore();}
  }
  ctx.globalAlpha=1;
  if(parts.length>1500)parts.splice(0,parts.length-1500);
  requestAnimationFrame(frame);
}

/* ---------------- LAYOUT ---------------- */
function measure(){
  const r=scene.getBoundingClientRect(); W=r.width;H=r.height; DPR=Math.min(2,devicePixelRatio||1);
  U=clamp(Math.min(W/11,H/6.2),36,90);
  fx.width=W*DPR;fx.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
function relayout(){measure();items.forEach(layout);buildLights();positionSel();}
addEventListener('resize',()=>{relayout();setSnow(snowLevel)});

function buildStars(){const s=$('#stars');for(let i=0;i<110;i++){const d=document.createElement('div');d.className='star';const z=rand(.5,1.5);d.style.cssText=`left:${rand(0,100)}%;top:${rand(0,100)}%;transform:scale(${z});animation-delay:${-rand(0,3)}s;animation-duration:${rand(2,5)}s`;s.appendChild(d);}}

/* controls */
$('#bSound').onclick=()=>{ensureAudio();muted=!muted;if(master)master.gain.value=muted?0:.8;$('#bSound').textContent=muted?'🔇':'🔊';$('#bSound').classList.toggle('off',muted);if(!muted)play('switchOn');};
$('#bMusic').onclick=()=>{ensureAudio();setMusic(!musicOn);play(musicOn?'switchOn':'switchOff');};
$('#bSnow').onclick=()=>{ensureAudio();const l=(snowLevel+1)%4;setSnow(l);$('#bSnow').style.opacity=l===0?.45:1;$('#bSnow').textContent=['🚫','❄️','🌨️','🌬️'][l];play('whoosh');};
$('#bDay').onclick=()=>{ensureAudio();const d=document.body.classList.toggle('day');$('#bDay').textContent=d?'☀️':'🌙';play(d?'fanfare':'twinkle');};
$('#bShake').onclick=()=>{ensureAudio();shake();};
$('#bReset').onclick=()=>{ensureAudio();play('tada');itemsEl.innerHTML='';deselect();items=defaultItems();items.forEach(it=>mount(it,true));$('#title').textContent='Merry Christmas!';save();confetti(0,0,90);};
['#bSound','#bMusic','#bSnow','#bDay','#bShake','#bReset'].forEach(s=>$(s).addEventListener('pointerdown',e=>e.stopPropagation()));

/* open the card */
$('#openbtn').onclick=()=>{
  ensureAudio(); $('#cover').classList.add('open'); play('fanfare'); setTimeout(()=>sfx.jingle(),200);
  setTimeout(()=>{confetti(0,0,120);setMusic(true);},900);
  setTimeout(()=>{const s=items.find(i=>i.ch==='🎅');if(s){say(s,'Merry Christmas!');anim(s,'a-jump');play('hohoho');}},1700);
};
// cover decoration
(function(){const cv=$('#cover .page');['❄️','⭐','🎁','🔔','🍪','🦌','⛄','🎄','✨'].forEach((c,i)=>{for(let k=0;k<2;k++){const s=document.createElement('div');s.className='cf';s.textContent=c;s.style.left=rand(0,95)+'%';s.style.animationDelay=-rand(0,6)+'s';s.style.animationDuration=rand(5,9)+'s';s.style.fontSize=rand(1.2,2.6)+'rem';cv.appendChild(s);}});})();

/* init */
load(); buildStars(); buildTabs(); buildRow(); measure();
items.forEach(it=>mount(it,false)); buildLights(); setSnow(1);
requestAnimationFrame(frame);
setTimeout(relayout,100); // after fonts/layout settle
</script>
