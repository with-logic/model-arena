<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinetic Typography Studio</title>
<meta name="description" content="Design and export animated text sequences with a keyframe timeline, easing curves, audio-reactive beats and WebM/MP4/GIF/PNG export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Inter:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@100..800&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rubik+Mono+One&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232938;--line2:#2e3547;
  --text:#e8ebf4;--muted:#8d96ab;--accent:#8b6cff;--accent2:#34e3c4;--warn:#ffcf5c;--danger:#ff5d78;
  --kf:#ffcf5c;--radius:10px;--hdh:54px;--tlh:340px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:1px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;z-index:100;text-decoration:none}
.skip:focus{top:8px}
#app{display:grid;height:100%;grid-template-columns:330px minmax(0,1fr) 310px;grid-template-rows:var(--hdh) minmax(0,1fr) var(--tlh);grid-template-areas:"hd hd hd" "left stage right" "tl tl tl"}
#hd{grid-area:hd;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151925,#10131a);min-width:0}
#left{grid-area:left;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:#07080c}
#tl{grid-area:tl;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#right{grid-area:right;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:800 15px "Archivo Black",Inter,sans-serif;color:#0b0d12;overflow:hidden}
.logo .mark span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo .mark span:nth-child(2){animation-delay:.18s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.logo small{font-weight:500;color:var(--muted);letter-spacing:0}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;min-height:32px;color:var(--text);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:#1e2330;border-color:#40496a}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed=true],.btn.on{background:rgba(139,108,255,.2);border-color:var(--accent);color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--accent),#6a4df0);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 18px rgba(139,108,255,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{min-height:26px;padding:3px 8px;font-size:12px;border-radius:7px}
.btn.icon{padding:0;width:32px}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
#projName{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:200px;font-weight:600;color:var(--text);min-width:80px}
#projName:hover{border-color:var(--line2)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-weight:600;border-radius:6px 6px 0 0;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--accent)}
.panes{overflow:auto;flex:1;min-height:0;padding:4px 14px 24px}
.pane[hidden]{display:none}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>h3,.rh h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;margin:7px 0}
.row>label,.row>.lab{color:#b6bdd0;font-size:12px}
.row.sl{grid-template-columns:96px minmax(0,1fr) 48px}
.row.sl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:11.5px}
.row.full{grid-template-columns:1fr}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0;background:transparent}
input[type=number],input[type=text],select,textarea{background:#0c0f15;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;width:100%;min-height:30px}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:62px;font-size:14px}
input[type=color]{width:100%;height:30px;padding:2px;background:#0c0f15;border:1px solid var(--line2);border-radius:7px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chk{display:flex;align-items:center;gap:8px;margin:7px 0;color:#b6bdd0;font-size:12px;cursor:pointer}
.seg{display:flex;background:#0c0f15;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;background:transparent;border:0;border-radius:6px;padding:5px 6px;color:var(--muted);font-weight:600;font-size:12px;min-height:26px}
.seg button:hover{color:var(--text)}
.seg button[aria-checked=true]{background:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.layers{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.layers li{display:flex;gap:4px}
.layers .pick{flex:1;text-align:left;background:#0e1118;border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.layers .pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers .pick[aria-current=true]{border-color:var(--accent);background:rgba(139,108,255,.14)}
.layers .pick i{width:8px;height:8px;border-radius:50%;background:var(--accent2);flex:none}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.preset{background:#0e1118;border:1px solid var(--line);border-radius:9px;padding:9px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text)}
.preset b{font-size:12px}
.preset small{color:var(--muted);font-size:10.5px;line-height:1.2}
.preset canvas{width:100%;height:34px;display:block}
.preset:hover{border-color:#44507a}
.preset[aria-pressed=true]{border-color:var(--accent);background:rgba(139,108,255,.16)}
.hint{color:var(--muted);font-size:11.5px;margin:6px 0}
/* stage */
.stagebar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #1a1e2a;flex-wrap:wrap;background:#0d1016}
.stagebar .seg{width:auto}
.stagebar .seg button{padding:4px 9px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,207,92,.14);color:var(--warn);border:1px solid rgba(255,207,92,.35)}
.badge[hidden]{display:none}
#stageArea{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#161a26,#07080c 70%)}
#cvwrap{position:relative;box-shadow:0 20px 70px rgba(0,0,0,.65),0 0 0 1px #2a3045;touch-action:none;border-radius:2px;outline-offset:4px}
#cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.dropmsg{position:absolute;inset:10px;border:2px dashed var(--accent2);border-radius:14px;display:none;place-items:center;background:rgba(7,8,12,.75);font-size:18px;font-weight:700;z-index:5}
.dropmsg.show{display:grid}
/* timeline */
.tlbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tlbar .grp{display:flex;align-items:center;gap:4px}
.tlbar label{color:var(--muted);font-size:11.5px}
.tlbar select,.tlbar input[type=number]{width:auto;min-height:28px;padding:3px 6px}
.tlbar input[type=number]{width:62px}
.timecode{font:600 15px "JetBrains Mono",ui-monospace,monospace;color:#fff;padding:0 8px;min-width:150px;font-variant-numeric:tabular-nums}
.timecode small{color:var(--muted);font-size:11px;font-weight:500}
#tlScroll{flex:1;min-height:0;overflow:auto;position:relative;background:#0e1118}
#tlInner{position:relative;min-height:100%}
.trow{display:flex;height:27px;border-bottom:1px solid #181d29}
.trow.act .tlabel{background:#1b2030;color:#fff}
.tlabel{position:sticky;left:0;z-index:4;flex:none;width:150px;background:#12151c;border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;color:#aab2c6;font-size:12px;cursor:pointer;user-select:none}
.tlabel .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.tlabel:focus-visible{outline-offset:-2px}
.lane{position:relative;flex:none}
.lane.beats{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0,rgba(255,255,255,.06) 1px,transparent 1px,transparent var(--bp,60px));background-position-x:var(--bo,0)}
.lane canvas{position:sticky;left:150px;display:block}
.trow.ruler{height:28px;background:#10131a;position:sticky;top:0;z-index:6}
.trow.wave{height:44px}
.kf{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--kf);border:1px solid #6b5412;transform:rotate(45deg);border-radius:2px;padding:0;z-index:3;touch-action:none;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.kf[aria-pressed=true]{background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 12px var(--accent)}
.kf:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.kf.hold{border-radius:0;background:#ff9d5c}
.clipbar{position:absolute;top:5px;bottom:5px;background:linear-gradient(180deg,rgba(139,108,255,.55),rgba(139,108,255,.3));border:1px solid var(--accent);border-radius:7px;cursor:grab;touch-action:none;z-index:2}
.clipbar .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.clipbar .h.l{left:-2px}.clipbar .h.r{right:-2px}
.clipbar .h::after{content:"";position:absolute;top:6px;bottom:6px;left:4px;width:2px;background:#fff;border-radius:2px;opacity:.7}
.clipbar span{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#playhead{position:absolute;top:0;bottom:0;width:0;z-index:5;pointer-events:none}
#playhead::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--danger);box-shadow:0 0 8px rgba(255,93,120,.7)}
#playhead::after{content:"";position:absolute;left:-6px;top:0;border:6px solid transparent;border-top:9px solid var(--danger)}
/* inspector */
.rh{padding:12px 14px 0}
.prop{display:grid;grid-template-columns:86px minmax(0,1fr) 24px 24px 24px;gap:4px;align-items:center;margin:4px 0}
.prop .lab{color:#b6bdd0;font-size:12px;cursor:ew-resize;user-select:none;touch-action:none}
.prop .lab:hover{color:#fff}
.prop input{padding:4px 6px;min-height:28px}
.prop button{width:24px;height:24px;padding:0;background:#0e1118;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font-size:11px;line-height:1}
.prop button:hover{color:#fff;border-color:#4a5578}
.prop button.kfb[aria-pressed=true]{background:var(--kf);color:#2a2000;border-color:var(--kf)}
.prop.active .lab{color:var(--accent2)}
.easegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.easegrid button{padding:2px;background:#0e1118;border:1px solid var(--line2);border-radius:7px;aspect-ratio:1;display:block}
.easegrid button[aria-pressed=true]{border-color:var(--accent);background:rgba(139,108,255,.2)}
.easegrid canvas{width:100%;height:100%;display:block}
#bez{width:100%;aspect-ratio:1;background:#0b0e14;border:1px solid var(--line2);border-radius:10px;touch-action:none;display:block}
.bzin{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.bzin input{padding:3px 4px;text-align:center;font-size:12px}
.empty{color:var(--muted);padding:10px 0;font-size:12px}
.meter{height:6px;background:#0b0e14;border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat div{background:#0e1118;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11px}
/* dialogs */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 30px 100px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(3,4,8,.7);backdrop-filter:blur(4px)}
dialog .dh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:17px;flex:1}
dialog .db{padding:6px 20px 16px;overflow:auto;max-height:calc(92vh - 140px)}
dialog .df{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;align-items:center}
.fmtgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.fmtgrid button{padding:10px 4px;background:#0e1118;border:1px solid var(--line2);border-radius:9px;text-align:center}
.fmtgrid button b{display:block;font-size:14px}
.fmtgrid button small{color:var(--muted);font-size:10.5px}
.fmtgrid button[aria-checked=true]{border-color:var(--accent);background:rgba(139,108,255,.18)}
.fmtgrid button[disabled]{opacity:.35;cursor:not-allowed}
progress{width:100%;height:10px;accent-color:var(--accent2)}
kbd{background:#0b0e14;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:600 11.5px "JetBrains Mono",monospace}
table.keys{width:100%;border-collapse:collapse}
table.keys td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.keys td:first-child{width:46%;white-space:nowrap}
#result video,#result img{max-width:100%;border-radius:10px;margin-top:8px;background:#000}
a.btn{text-decoration:none}
@media (max-width:1180px){
  #app{grid-template-columns:290px minmax(0,1fr) 270px}
}
@media (max-width:980px){
  html,body{height:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100%;width:100%;overflow-x:hidden}
  #hd{order:0}#stage{order:1}#tl{order:2}#left{order:3}#right{order:4}
  #app>*{min-width:0;max-width:100vw}
  #hd{position:sticky;top:0;z-index:30;flex-wrap:wrap;height:auto;padding:8px 10px;gap:6px}
  #hd .sp{display:none}#hd .btn.primary{margin-left:auto}
  #projName{width:120px}
  .logo small{display:none}
  #stage{position:sticky;top:var(--hdh,54px);z-index:20;height:46vh;min-height:260px}
  #tl{height:330px}
  #left{border-right:0}
  .panes{overflow:visible}
  #right{border-left:0;border-top:1px solid var(--line);overflow:visible}
  #left{min-height:0}
  .row{grid-template-columns:100px minmax(0,1fr)}
  .row.sl{grid-template-columns:100px minmax(0,1fr) 48px}
  .btn{min-height:38px}.btn.sm{min-height:32px}
  .timecode{min-width:120px}
}
@media (max-width:560px){
  .logo span.t{display:none}
  .presets{grid-template-columns:repeat(2,1fr)}
  .tlabel{width:104px}
  .tlabel .v{display:none}
  .fmtgrid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#cvwrap">Skip to preview</a>
<div id="app">
  <header id="hd" role="banner">
    <div class="logo"><div class="mark" aria-hidden="true"><span>K</span><span>T</span></div><span class="t">Kinetic Type <small>Studio</small></span></div>
    <input id="projName" type="text" value="Untitled sequence" aria-label="Project name" spellcheck="false">
    <div class="sp"></div>
    <button class="btn icon" id="btnUndo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn icon" id="btnRedo" aria-label="Redo (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button class="btn" id="btnOpen" aria-label="Open project file">Open</button>
    <button class="btn" id="btnSave" aria-label="Save project file">Save</button>
    <button class="btn icon" id="btnHelp" aria-label="Keyboard shortcuts (?)" title="Keyboard shortcuts (?)">?</button>
    <button class="btn primary" id="btnExport" aria-haspopup="dialog">Export ▸</button>
  </header>

  <aside id="left" aria-label="Design panels">
    <div class="tabs" role="tablist" aria-label="Panels" id="tabs"></div>
    <div class="panes" id="panes"></div>
  </aside>

  <main id="stage" aria-label="Preview">
    <div class="stagebar" role="toolbar" aria-label="Preview options">
      <div class="seg" role="radiogroup" aria-label="Aspect ratio" id="sbAspect"></div>
      <button class="btn sm" id="sbSafe" aria-pressed="true" title="Toggle safe-area guides (S)">Safe</button>
      <button class="btn sm" id="sbGrid" aria-pressed="false" title="Toggle grid (G)">Grid</button>
      <button class="btn sm" id="sbMB" aria-pressed="false" title="Toggle motion blur (M)">Motion blur</button>
      <span class="badge" id="rmBadge" hidden>Reduced motion: heavy effects off</span>
      <span class="sp"></span>
      <span id="sbInfo" style="color:var(--muted);font-size:11.5px"></span>
    </div>
    <div id="stageArea">
      <div id="cvwrap" tabindex="0" role="group" aria-label="Preview canvas. Drag text to move it. Arrow keys nudge the selected layer.">
        <canvas id="cv" role="img" aria-label="Animation preview"></canvas>
        <canvas id="ov" aria-hidden="true"></canvas>
      </div>
      <div class="dropmsg" id="dropmsg">Drop an audio file to load it</div>
    </div>
  </main>

  <section id="tl" aria-label="Timeline editor">
    <div class="tlbar" role="toolbar" aria-label="Transport and timeline options">
      <div class="grp">
        <button class="btn sm icon" id="tStart" aria-label="Go to start (Home)" title="Start (Home)">⏮</button>
        <button class="btn sm icon" id="tPrevF" aria-label="Previous frame (Left)" title="Previous frame (←)">◂</button>
        <button class="btn sm primary" id="tPlay" aria-label="Play (Space)" title="Play / Pause (Space)" style="min-width:74px">▶ Play</button>
        <button class="btn sm icon" id="tNextF" aria-label="Next frame (Right)" title="Next frame (→)">▸</button>
        <button class="btn sm icon" id="tEnd" aria-label="Go to end (End)" title="End (End)">⏭</button>
        <button class="btn sm" id="tLoop" aria-pressed="true" title="Loop (L)">Loop</button>
      </div>
      <div class="timecode" id="timecode" aria-live="off">0:00.00</div>
      <div class="grp"><label for="snapSel">Snap</label>
        <select id="snapSel" aria-label="Snap keyframes to">
          <option value="off">Frames</option><option value="half">½ beat</option><option value="beat">Beats</option><option value="bar">Bars</option>
        </select></div>
      <div class="grp"><label for="durIn">Length</label><input type="number" id="durIn" min="0.5" max="300" step="0.5" aria-label="Duration in seconds"><label for="fpsSel">FPS</label>
        <select id="fpsSel" aria-label="Frame rate"><option>12</option><option>15</option><option>24</option><option selected>30</option><option>60</option></select></div>
      <span class="sp"></span>
      <div class="grp"><label for="zoom">Zoom</label><input type="range" id="zoom" min="20" max="400" step="1" style="width:110px" aria-label="Timeline zoom">
        <button class="btn sm" id="tFit" aria-label="Fit timeline to window">Fit</button>
        <button class="btn sm" id="tAddKf" aria-label="Add keyframe on active track at playhead (K)" title="Add / remove keyframe (K)">◆ Key</button></div>
    </div>

  const key=[l.text,l.font,l.weight,l.italic,l.size,l.caps,maxW|0,fontEpoch].join('|');let c=layCache.get(l);if(c&&c.key===key)return c;

/* ============================== audio analysis ============================== */

function analyze(buf){

wrap.addEventListener('pointerup',()=>{if(dragL){dragL=null;changed('tl');commitNow()}});wrap.addEventListener('pointercancel',()=>dragL=null);
wrap.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;e.preventDefault();e.stopPropagation();const l=L(),st=e.shiftKey?10:1;
  setProp(l,'x',evalTrack(l,'x',S.time)+d[0]*st);setProp(l,'y',evalTrack(l,'y',S.time)+d[1]*st);dirty=true;syncInspectorValues();changed('tl')});
/* drag & drop audio */
['dragenter','dragover'].forEach(ev=>area.addEventListener(ev,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#dropmsg').classList.add('show')}}));
['dragleave','drop'].forEach(ev=>area.addEventListener(ev,e=>{e.preventDefault();$('#dropmsg').classList.remove('show')}));
area.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(!f)return;if(f.type.startsWith('audio')||/\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(f.name))loadAudioFile(f);else if(f.type.startsWith('image')){const r=new FileReader();r.onload=()=>setBgImage(r.result);r.readAsDataURL(f)}});

/* ============================== keyboard ============================== */
const typing=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['range','checkbox','color','button'].includes(el.type))||el.tagName==='SELECT'||el.isContentEditable);
document.addEventListener('keydown',e=>{const el=document.activeElement;const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){if(typing(el)&&el.tagName==='TEXTAREA')return;e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='e'){e.preventDefault();openExport();return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}
  if(typing(el)||mod||e.altKey)return;if(document.querySelector('dialog[open]')){return}
  const onBtn=el&&(el.tagName==='BUTTON'||el.tagName==='A')&&!el.classList.contains('kf');
  switch(e.key){
    case' ':if(onBtn||(el&&el.getAttribute&&el.getAttribute('role')==='tab'))return;e.preventDefault();toggle();break;
    case'ArrowLeft':case'ArrowRight':if(el&&(el.type==='range'||el.getAttribute('role')==='radio'||el.getAttribute('role')==='tab'))return;e.preventDefault();seek(S.time+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?1:frameDur()),true);break;
    case'Home':if(el&&el.getAttribute('role')==='tab')return;e.preventDefault();seek(0);break;
    case'End':if(el&&el.getAttribute('role')==='tab')return;e.preventDefault();seek(S.duration);break;
    case'[':jumpKey(S.selTrack,-1);break;case']':jumpKey(S.selTrack,1);break;
    case'k':case'K':toggleKey(S.selTrack);break;
    case'b':case'B':{if(!S.audio.bpm)break;const per=60/S.audio.bpm,k=(S.time-S.audio.offset)/per;const n=e.shiftKey?Math.ceil(k-.001)-1:Math.floor(k+.001)+1;seek(S.audio.offset+n*per,true);break}
    case'Delete':case'Backspace':if(keySel&&!(el&&el.classList.contains('kf'))){L().tracks[keySel.id]=L().tracks[keySel.id].filter(k=>k!==keySel.k);keySel=null;changed('tl');buildKeyEditor();announce('Keyframe deleted')}break;
    case'l':case'L':S.loop=!S.loop;$('#tLoop').setAttribute('aria-pressed',S.loop);announce('Loop '+(S.loop?'on':'off'));break;
    case'm':case'M':S.mb.on=!S.mb.on;syncAll();changed();syncStageBtns();break;
    case'g':case'G':S.guides.grid=!S.guides.grid;syncAll();changed();syncStageBtns();break;
    case's':case'S':S.guides.safe=!S.guides.safe;syncAll();changed();syncStageBtns();break;
    case'?':$('#dlgHelp').showModal();break;
    default:if(/^[1-8]$/.test(e.key)){S.selTrack=TRACKS[+e.key-1].id;updateRowActive();announce(TR[S.selTrack].label+' track active')}}});

/* ============================== wiring ============================== */
function syncStageBtns(){$('#sbSafe').setAttribute('aria-pressed',S.guides.safe);$('#sbGrid').setAttribute('aria-pressed',S.guides.grid);$('#sbMB').setAttribute('aria-pressed',S.mb.on);$('#rmBadge').hidden=!rm();
  [...$('#sbAspect').children].forEach((b,i)=>b.setAttribute('aria-checked',Object.keys(ASPECTS)[i]===S.aspect));
  $('#sbInfo').textContent=`${S.w}×${S.h} · ${S.fps} fps`;$('#tLoop').setAttribute('aria-pressed',S.loop);$('#durIn').value=S.duration;$('#fpsSel').value=S.fps;$('#snapSel').value=S.audio.snap;$('#projName').value=S.name}
function fullRefresh(){fitStage();buildLayerList();syncAll();buildInspector();rebuildTimeline();syncStageBtns();updateTimeUI();setPlayBtn();dirty=true;updUndo()}
syncs.push(syncStageBtns);
function init(){
  buildPanels();buildHelp();
  Object.keys(ASPECTS).forEach(k=>{const b=h('button',{type:'button',role:'radio','aria-checked':'false',onclick:()=>setAspect(k)},k);$('#sbAspect').append(b)});
  $('#sbSafe').onclick=()=>{S.guides.safe=!S.guides.safe;syncAll();changed()};$('#sbGrid').onclick=()=>{S.guides.grid=!S.guides.grid;syncAll();changed()};$('#sbMB').onclick=()=>{S.mb.on=!S.mb.on;syncAll();changed()};
  $('#tPlay').onclick=toggle;$('#tStart').onclick=()=>seek(0);$('#tEnd').onclick=()=>seek(S.duration);$('#tPrevF').onclick=()=>seek(S.time-frameDur(),true);$('#tNextF').onclick=()=>seek(S.time+frameDur(),true);
  $('#tLoop').onclick=()=>{S.loop=!S.loop;syncStageBtns()};$('#tAddKf').onclick=()=>toggleKey(S.selTrack);$('#tFit').onclick=fitZoom;$('#zoom').oninput=e=>setZoom(+e.target.value);
  $('#snapSel').onchange=e=>{S.audio.snap=e.target.value;changed();syncAll()};
  $('#fpsSel').onchange=e=>{S.fps=+e.target.value;S.layers.forEach(l=>TRACKS.forEach(t=>l.tracks[t.id].forEach(k=>k.t=quant(k.t))));changed('tl');syncStageBtns();EX.fps=S.fps;updateTimeUI()};
  $('#durIn').onchange=e=>{const v=clamp(parseFloat(e.target.value)||6,.5,300);const old=S.duration;S.duration=v;S.time=Math.min(S.time,v);changed('tl');syncAll();updateTimeUI();dirty=true};
  $('#projName').oninput=e=>{S.name=e.target.value;changed()};
  $('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnExport').onclick=openExport;$('#btnHelp').onclick=()=>$('#dlgHelp').showModal();
  $('#btnSave').onclick=saveProject;$('#btnOpen').onclick=()=>$('#fileProj').click();
  $('#fileAudio').onchange=e=>{if(e.target.files[0])loadAudioFile(e.target.files[0]);e.target.value=''};
  $('#fileImg').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>setBgImage(r.result);r.readAsDataURL(f)}e.target.value=''};
  $('#fileProj').onchange=e=>{if(e.target.files[0])loadProject(e.target.files[0]);e.target.value=''};
  ['#dlgExport','#dlgHelp'].forEach(s=>{const d=$(s);d.addEventListener('click',e=>{if(e.target===d&&!EX.running)d.close()})});
  new ResizeObserver(()=>{fitStage();sizeCanvases()}).observe(area);new ResizeObserver(()=>{if(rulerCv)sizeCanvases()}).observe(scroller);
  mqRM.addEventListener&&mqRM.addEventListener('change',()=>{syncStageBtns();dirty=true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.playing&&!S.exporting)pause()});
  fullRefresh();fitZoom();commitNow();
  requestAnimationFrame(loop);
  S.layers.forEach(ensureFont);
}
init();
</script>
</body>
