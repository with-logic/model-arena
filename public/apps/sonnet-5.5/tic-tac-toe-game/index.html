<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Toe · Ludus Romanus</title>
<meta name="theme-color" content="#efeae0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#b8892b; --gold-hi:#e6c35c; --gold-lo:#7d5a14;
  --bg:#efeae0; --bg2:#e2dccf; --panel:rgba(255,252,245,.78); --panel-solid:#fbf7ee;
  --ink:#2b2418; --ink-soft:#6d6250; --line:rgba(125,90,20,.28);
  --cell:linear-gradient(160deg,#fffdf8,#ece5d6); --cell-hover:linear-gradient(160deg,#fffef9,#f5eedd);
  --x:#9b1c22; --o:#8a6414;
  --shadow:0 18px 40px -18px rgba(60,40,10,.45),0 4px 10px -4px rgba(60,40,10,.2);
  --vein:.55; --arch:rgba(125,90,20,.09);
  --font-d:'Cinzel','Trajan Pro',Georgia,serif; --font-b:'Cormorant Garamond',Georgia,serif;
  --board:clamp(240px,min(90vw,100dvh - 330px,92vmin),620px);
}
[data-theme=night]{
  --bg:#14141a; --bg2:#0c0c11; --panel:rgba(32,30,38,.72); --panel-solid:#1d1c24;
  --ink:#f1e9d6; --ink-soft:#a89f8a; --line:rgba(230,195,92,.28);
  --cell:linear-gradient(160deg,#2a2832,#1b1a22); --cell-hover:linear-gradient(160deg,#34313e,#22212a);
  --x:#ef6a6a; --o:#e6c35c; --gold:#d6a93f;
  --shadow:0 20px 44px -16px rgba(0,0,0,.8),0 4px 10px -4px rgba(0,0,0,.5);
  --vein:.22; --arch:rgba(230,195,92,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-b);font-size:clamp(16px,2.2vmin + 8px,20px);color:var(--ink);
  background:var(--bg);overflow-x:hidden;transition:background .5s,color .5s;
}
/* marble */
.marble{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(90% 70% at 100% 100%,var(--bg2),transparent 70%),var(--bg);}
[data-theme=night] .marble{background:
    radial-gradient(120% 80% at 20% 0%,rgba(90,80,120,.25),transparent 60%),
    radial-gradient(90% 70% at 100% 100%,var(--bg2),transparent 70%),var(--bg);}
.marble::before{content:"";position:absolute;inset:0;opacity:var(--vein);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.004 .011' numOctaves='5' seed='7'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .28  0 0 0 -9 5.1'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  background-size:900px 900px;}
[data-theme=night] .marble::before{mix-blend-mode:screen;opacity:.16}
.colosseum{position:fixed;left:0;right:0;bottom:0;height:34vmin;z-index:-1;pointer-events:none;
  color:var(--arch);opacity:1}
.colosseum svg{width:100%;height:100%;display:block}

.app{min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr;justify-items:center;
  padding:max(10px,env(safe-area-inset-top)) clamp(10px,3vw,32px) max(14px,env(safe-area-inset-bottom));gap:clamp(8px,1.6vmin,16px)}

/* top bar */
header{width:min(100%,900px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px clamp(12px,2vw,20px);border:1px solid var(--line);border-radius:18px;background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);position:relative}
header::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{width:clamp(40px,7vmin,54px);height:clamp(40px,7vmin,54px);flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.brand h1{margin:0;font-family:var(--font-d);font-weight:700;letter-spacing:.14em;font-size:clamp(.95rem,2.6vmin + .3rem,1.45rem);line-height:1.1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=day] .brand h1{background:linear-gradient(180deg,#c99a32,#6f4f0f);-webkit-background-clip:text;background-clip:text}
.brand small{display:block;font-style:italic;color:var(--ink-soft);letter-spacing:.04em;font-size:.82em}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--font-d);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.7em 1.15em;border-radius:12px;border:1px solid var(--line);color:var(--ink);cursor:pointer;
  background:var(--cell);box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 12px -8px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .2s,border-color .2s,background .2s;min-height:42px}
.btn:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 8px 16px -8px rgba(0,0,0,.45)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1d04;border-color:var(--gold-lo)}
.btn:focus-visible,.cell:focus-visible,.seg label:has(input:focus-visible){outline:3px solid var(--gold-hi);outline-offset:2px}

/* banner + status: reserved space, no layout shift */
.info{width:min(100%,900px);display:grid;gap:10px;justify-items:center}
.banner{width:min(100%,var(--board));min-height:clamp(52px,9vmin,70px);display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:14px;padding:.4em 1em;font-family:var(--font-d);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:clamp(.82rem,2.4vmin + .2rem,1.25rem);color:#2a1d04;
  background:linear-gradient(100deg,var(--gold),var(--gold-hi),var(--gold));border:1px solid var(--gold-lo);
  box-shadow:var(--shadow);opacity:0;transform:translateY(-8px) scale(.98);visibility:hidden;
  transition:opacity .4s,transform .4s,visibility 0s .4s}
.banner.show{opacity:1;transform:none;visibility:visible;transition:opacity .45s,transform .45s}
.banner.draw{background:linear-gradient(100deg,#8c8577,#bdb5a2,#8c8577);border-color:#5d574b}
.status{margin:0;font-style:italic;font-size:1.1em;color:var(--ink-soft);text-align:center;min-height:1.4em}
.status b{font-style:normal;font-family:var(--font-d);color:var(--ink);letter-spacing:.08em}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,16px);width:min(100%,var(--board))}
.score{padding:.55em .5em;border-radius:14px;text-align:center;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);
  position:relative;transition:border-color .3s,transform .3s}
.score.active{border-color:var(--gold);transform:translateY(-2px)}
.score.active::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:3px;border-radius:3px;background:var(--gold-hi)}
.score .lbl{font-family:var(--font-d);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.score .num{font-family:var(--font-d);font-weight:700;font-size:clamp(1.5rem,5vmin,2.3rem);line-height:1.1}
.score.x .num{color:var(--x)} .score.o .num{color:var(--o)}
.score .num.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}

/* board */
main{display:grid;place-items:center;width:100%;align-self:start}
.frame{padding:clamp(8px,1.6vmin,14px);border-radius:clamp(18px,3vmin,28px);position:relative;
  background:linear-gradient(145deg,var(--gold-hi),var(--gold-lo) 55%,var(--gold));box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.3)}
.board{width:var(--board);height:var(--board);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:clamp(6px,1.4vmin,12px);padding:clamp(6px,1.4vmin,12px);border-radius:clamp(12px,2.2vmin,20px);
  background:linear-gradient(145deg,#2b2214,#0f0b05);box-shadow:inset 0 4px 14px rgba(0,0,0,.6)}
[data-theme=night] .board{background:linear-gradient(145deg,#0b0b10,#000)}
.row{display:contents}
.cell{position:relative;border-radius:clamp(8px,1.6vmin,14px);border:0;padding:0;margin:0;cursor:pointer;display:grid;place-items:center;
  background:var(--cell);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 8px -3px rgba(0,0,0,.5);color:var(--ink);
  transition:transform .18s,box-shadow .25s,background .25s,filter .25s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
[data-theme=night] .cell{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 8px -3px rgba(0,0,0,.8)}
.cell:not(.filled):not(.locked):hover{background:var(--cell-hover);transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--gold),0 8px 14px -6px rgba(0,0,0,.5)}
.cell:not(.filled):not(.locked):active{transform:scale(.96)}
.cell.filled,.cell.locked{cursor:default}
.cell svg{width:68%;height:68%;overflow:visible;pointer-events:none}
.cell .ghost{position:absolute;display:grid;place-items:center;width:100%;height:100%;opacity:0;transition:opacity .2s;pointer-events:none}
.cell:not(.filled):not(.locked):hover .ghost,.cell:not(.filled):not(.locked):focus-visible .ghost{opacity:.18}
.cell.win{background:linear-gradient(160deg,#fff3c4,var(--gold-hi));box-shadow:inset 0 0 0 3px var(--gold-lo),0 0 22px 2px rgba(230,195,92,.7);animation:glow 2.2s ease-in-out infinite alternate}
[data-theme=night] .cell.win{background:linear-gradient(160deg,#5a4616,#2f2509);box-shadow:inset 0 0 0 3px var(--gold-hi),0 0 24px 2px rgba(230,195,92,.55)}
.cell.win svg{--x:#6e1015;--o:#5a3f06}
[data-theme=night] .cell.win svg{--x:#ff8c8c;--o:#ffe28a}
@keyframes glow{to{box-shadow:inset 0 0 0 3px var(--gold-lo),0 0 32px 6px rgba(230,195,92,.85)}}
.cell.dim:not(.win){filter:saturate(.6) brightness(.93)}
.mark-x{color:var(--x)} .mark-o{color:var(--o)}
.mark{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.draw-s{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .35s .02s forwards ease-out}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{margin:10px 0 0;text-align:center;font-size:.85em;color:var(--ink-soft);font-style:italic}
.hint kbd{font-family:var(--font-d);font-size:.8em;border:1px solid var(--line);border-radius:6px;padding:0 .4em;background:var(--panel)}
@media (max-width:560px),(pointer:coarse){.hint{display:none}}

canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* dialog */
dialog{border:1px solid var(--gold);border-radius:22px;padding:0;color:var(--ink);background:var(--panel-solid);
  width:min(94vw,520px);max-height:92dvh;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);overflow:hidden}
dialog[open]{animation:dlg .28s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,8,4,.55);backdrop-filter:blur(3px)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.97)}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(230,195,92,.2),transparent)}
.dhead h2{margin:0;font-family:var(--font-d);letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem}
.x-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--cell);color:var(--ink);font-size:1.2rem;cursor:pointer;line-height:1;transition:.15s}
.x-btn:hover{border-color:var(--gold);transform:rotate(90deg)}
.x-btn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.dbody{padding:8px 20px 4px;overflow:auto}
fieldset{border:0;margin:0;padding:12px 0;border-bottom:1px dashed var(--line)}
fieldset:last-child{border-bottom:0}
legend{font-family:var(--font-d);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0;margin-bottom:8px;float:left;width:100%}
.seg{display:flex;gap:6px;clear:both;padding:4px;border-radius:14px;background:rgba(125,90,20,.1);border:1px solid var(--line)}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg label>span{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;padding:.6em .4em;min-height:44px;border-radius:10px;font-size:.98em;font-weight:600;cursor:pointer;transition:.2s;color:var(--ink-soft);line-height:1.15}
.seg input:checked+span{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1d04;box-shadow:0 3px 8px -3px rgba(0,0,0,.5)}
.seg input:not(:checked):hover+span{color:var(--ink);background:rgba(230,195,92,.15)}
.seg svg{width:1.4em;height:1.4em;flex:none}
.note{clear:both;margin:6px 2px 0;font-size:.85em;font-style:italic;color:var(--ink-soft)}
fieldset:disabled{opacity:.45}
.dfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:620px){
  header{justify-content:center}
  .brand{width:100%;justify-content:center}
  .bar{width:100%;justify-content:center;flex-wrap:nowrap}
  .btn{flex:1;padding:.7em .4em;font-size:.64rem;letter-spacing:.06em}
  :root{--board:clamp(240px,min(94vw,100dvh - 390px),620px)}
}
@media (max-height:640px) and (orientation:landscape){
  :root{--board:clamp(200px,100dvh - 230px,520px)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="marble" aria-hidden="true"></div>
<div class="colosseum" aria-hidden="true"><svg id="arches" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice"></svg></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="app">
  <header>
    <div class="brand">
      <svg class="crest" viewBox="0 0 100 100" role="img" aria-label="SPQR crest">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d77a"/><stop offset="1" stop-color="#9a6f1a"/></linearGradient></defs>
        <path d="M50 4 90 18v34c0 24-17 38-40 45C27 90 10 76 10 52V18z" fill="#7f1519" stroke="url(#g1)" stroke-width="4"/>
        <path d="M50 11 83 22v30c0 19-13 31-33 38C30 83 17 71 17 52V22z" fill="none" stroke="url(#g1)" stroke-width="1" opacity=".7"/>
        <text x="50" y="47" text-anchor="middle" font-family="Cinzel,serif" font-weight="700" font-size="21" fill="url(#g1)" letter-spacing="1">SPQR</text>
        <path d="M30 60h40M33 66h34" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
        <path d="M36 76q14-9 28 0" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div><h1>TIC TAC TOE</h1><small>Ludus Romanus · The Colosseum Game</small></div>
    </div>
    <div class="bar" role="toolbar" aria-label="Game controls">
      <button class="btn primary" id="newRound" type="button">New Round</button>
      <button class="btn" id="customize" type="button" aria-haspopup="dialog">Customize</button>
      <button class="btn" id="reset" type="button">Reset Scores</button>
    </div>
  </header>

  <section class="info" aria-label="Match information">
    <div class="banner" id="banner" aria-hidden="true"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="scores" role="group" aria-label="Scoreboard">
      <div class="score x" id="sx"><div class="lbl" id="lx">X</div><div class="num" id="nx">0</div></div>
      <div class="score d" id="sd"><div class="lbl">Draws</div><div class="num" id="nd">0</div></div>
      <div class="score o" id="so"><div class="lbl" id="lo">O</div><div class="num" id="no">0</div></div>
    </div>
  </section>

  <main>
    <div>
      <div class="frame">
        <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board, 3 by 3" aria-rowcount="3" aria-colcount="3"></div>
      </div>
      <p class="hint">Arrow keys to move · <kbd>Enter</kbd> to place · <kbd>1</kbd>–<kbd>9</kbd> jump · <kbd>N</kbd> new round</p>
    </div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="dhead"><h2 id="dtitle">Customize</h2><button class="x-btn" id="dx" type="button" aria-label="Close customize dialog">×</button></div>
  <div class="dbody" id="opts"></div>
  <div class="dfoot"><button class="btn primary" id="done" type="button">Done</button></div>
</dialog>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const DEF = {theme:'day', glyphs:'std', mode:'ai', first:'X', ai:'perfect'};
let S = {...DEF};
try { Object.assign(S, JSON.parse(localStorage.getItem('ttt-roman-settings')||'{}')); } catch(e){}
let scores = {X:0,O:0,D:0};
try { Object.assign(scores, JSON.parse(localStorage.getItem('ttt-roman-scores')||'{}')); } catch(e){}
const save = () => { try{ localStorage.setItem('ttt-roman-settings',JSON.stringify(S)); localStorage.setItem('ttt-roman-scores',JSON.stringify(scores)); }catch(e){} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

let board, turn, over, winLine, aiTimer, focusIdx = 4, moveCount;
const HUMAN = 'X', AI = 'O';

/* ---------- glyphs ---------- */
const sw = (rot) => `<g transform="rotate(${rot} 50 50) translate(50 50) scale(.92) translate(-50 -50)">
  <path d="M50 4 57 19V63H43V19Z" fill="currentColor"/><path d="M50 10V60" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/>
  <rect x="31" y="63" width="38" height="7" rx="3.5" fill="currentColor"/><rect x="46" y="70" width="8" height="15" rx="2" fill="currentColor"/>
  <circle cx="50" cy="90" r="5" fill="currentColor"/></g>`;
// cleaner laurel: leaves tangent to the ring, alternating outward/inward tilt
function laurelSVG(){
  let s='';
  for(const side of [-1,1]){
    for(let k=0;k<9;k++){
      const t = 0.25 + k*0.29;
      const x = 50 + side*Math.sin(t)*32, y = 50 + Math.cos(t)*32;
      const ang = Math.atan2(-Math.sin(t), side*Math.cos(t))*57.2958;
      const tilt = k%2 ? 34 : -34;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="9.5" ry="4" transform="rotate(${(ang+tilt).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="currentColor"/>`;
    }
  }
  s += '<path d="M50 84 43 96M50 84 57 96" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="50" cy="83" r="3.4" fill="currentColor"/>';
  return s;
}
function glyph(p, anim=true){
  return anim ? glyphRaw(p,'mark mark-'+p.toLowerCase(),'draw-s') : glyphRaw(p,'','');
}
function glyphRaw(p,cls,ds){
  if(S.glyphs==='std'){
    return p==='X'
      ? `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g stroke="currentColor" stroke-width="13" stroke-linecap="round"><path class="${ds}" d="M20 20 80 80"/><path class="${ds}" d="M80 20 20 80" style="animation-delay:.12s"/></g></svg>`
      : `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><circle class="${ds}" cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/></svg>`;
  }
  return p==='X'
    ? `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${sw(45)}${sw(-45)}</svg>`
    : `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${laurelSVG()}</svg>`;
}
const iconX = g => g==='std' ? '<svg viewBox="0 0 100 100"><path d="M20 20 80 80M80 20 20 80" stroke="currentColor" stroke-width="13" stroke-linecap="round"/></svg>' : `<svg viewBox="0 0 100 100">${sw(45)}${sw(-45)}</svg>`;
const iconO = g => g==='std' ? '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="13"/></svg>' : `<svg viewBox="0 0 100 100">${laurelSVG()}</svg>`;

/* ---------- colosseum backdrop ---------- */
(function(){
  let d='<g fill="currentColor">';
  d+='<path d="M0 200V60h1200v140z"/>';
  d+='</g><g fill="var(--bg)" >';
  for(let tier=0;tier<3;tier++){
    const y=70+tier*45;
    for(let i=0;i<24;i++){ const x=10+i*50; d+=`<path d="M${x} ${y+34}V${y+14}a15 15 0 0 1 30 0V${y+34}z"/>`; }
  }
  d+='</g>';
  $('#arches').innerHTML=d;
})();

/* ---------- build board ---------- */
const boardEl = $('#board'); const cells = [];
for(let r=0;r<3;r++){
  const row = document.createElement('div'); row.className='row'; row.setAttribute('role','row'); row.setAttribute('aria-rowindex',r+1);
  for(let c=0;c<3;c++){
    const i=r*3+c, b=document.createElement('div');
    b.className='cell'; b.setAttribute('role','gridcell'); b.setAttribute('aria-colindex',c+1); b.tabIndex = i===focusIdx?0:-1;
    b.dataset.i=i;
    row.appendChild(b); cells.push(b);
  }
  boardEl.appendChild(row);
}
const cellName = i => `Row ${Math.floor(i/3)+1}, column ${i%3+1}`;

function render(){
  cells.forEach((el,i)=>{
    const v = board[i];
    const lock = over || (S.mode==='ai' && turn===AI);
    el.classList.toggle('filled',!!v);
    el.classList.toggle('locked',!v && lock);
    el.classList.toggle('win',!!winLine && winLine.includes(i));
    el.classList.toggle('dim',!!winLine && !winLine.includes(i));
    const gn = v ? (S.glyphs==='std'?v:(v==='X'?'Gladius':'Laurel')) : 'empty';
    el.setAttribute('aria-label', `${cellName(i)}, ${gn}`);
    const key = v ? v+S.glyphs : 'e'+S.glyphs+turn;
    if(el.dataset.v!==key){
      el.dataset.v=key;
      el.innerHTML = v ? glyph(v) : `<span class="ghost" aria-hidden="true" style="color:var(${turn==='X'?'--x':'--o'})">${glyph(turn,false)}</span>`;
    }
  });
  $('#sx').classList.toggle('active',!over && turn==='X');
  $('#so').classList.toggle('active',!over && turn==='O');
}

function names(){
  return S.glyphs==='std' ? {X:'X',O:'O'} : {X:'Gladius',O:'Laurel'};
}
function plr(p){ const n=names()[p]; return S.mode==='ai' ? (p===HUMAN?`${n} (You)`:`${n} (Legion AI)`) : n; }
function setStatus(html, plain){ const el=$('#status'); el.innerHTML=html; }
function updateLabels(){
  const n=names();
  $('#lx').textContent = S.mode==='ai' ? n.X+' · You' : n.X;
  $('#lo').textContent = S.mode==='ai' ? n.O+' · AI' : n.O;
  $('#nx').textContent=scores.X; $('#no').textContent=scores.O; $('#nd').textContent=scores.D;
}
function turnStatus(){
  if(S.mode==='ai' && turn===AI) setStatus(`<b>${plr(AI)}</b> ponders the legion's next move…`);
  else setStatus(`Your move, <b>${plr(turn)}</b>`);
}

/* ---------- logic ---------- */
function winnerOf(b){
  for(const l of LINES){ const [a,c,d]=l; if(b[a] && b[a]===b[c] && b[a]===b[d]) return {p:b[a],line:l}; }
  return null;
}
function newRound(){
  clearTimeout(aiTimer); stopConfetti();
  board = Array(9).fill(null); over=false; winLine=null; moveCount=0; turn=S.first;
  const bn=$('#banner'); bn.classList.remove('show','draw'); bn.setAttribute('aria-hidden','true');
  cells.forEach(c=>delete c.dataset.v);
  render(); turnStatus();
  maybeAI();
}
function place(i){
  if(over || board[i]) return false;
  board[i]=turn; moveCount++;
  const w = winnerOf(board);
  if(w){ finish(w); }
  else if(board.every(Boolean)){ finish(null); }
  else { turn = turn==='X'?'O':'X'; render(); turnStatus(); maybeAI(); }
  return true;
}
function bump(id){ const e=$(id); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
function finish(w){
  over=true; const bn=$('#banner');
  if(w){
    winLine=w.line; scores[w.p]++; bump(w.p==='X'?'#nx':'#no');
    let msg;
    if(S.mode==='ai') msg = w.p===HUMAN ? `Victory! ${names()[w.p]} conquers the arena` : `The Legion AI claims the arena`;
    else msg = `${names()[w.p]} is victorious — Ave, Imperator!`;
    bn.textContent=msg; bn.classList.remove('draw');
    setStatus(`<b>${msg}.</b> Press New Round to fight again.`);
    if(!(S.mode==='ai' && w.p===AI)) confetti();
  } else {
    scores.D++; bump('#nd'); const msg='A draw — the gods are evenly matched';
    bn.textContent=msg; bn.classList.add('draw'); setStatus(`<b>${msg}.</b> Press New Round to fight again.`);
  }
  bn.classList.add('show'); bn.removeAttribute('aria-hidden'); bn.setAttribute('role','presentation');
  save(); updateLabels(); render();
}

/* ---------- AI: minimax with discipline handicaps ---------- */
function minimax(b,p,depth){
  const w=winnerOf(b);
  if(w) return w.p===AI ? 10-depth : depth-10;
  if(b.every(Boolean)) return 0;
  let best = p===AI ? -Infinity : Infinity;
  for(let i=0;i<9;i++) if(!b[i]){
    b[i]=p; const s=minimax(b,p==='X'?'O':'X',depth+1); b[i]=null;
    best = p===AI ? Math.max(best,s) : Math.min(best,s);
  }
  return best;
}
function aiPick(){
  const empty=[]; for(let i=0;i<9;i++) if(!board[i]) empty.push(i);
  const scored = empty.map(i=>{ board[i]=AI; const s = winnerOf(board)?10-moveCount:minimax(board,HUMAN,moveCount+1); board[i]=null; return {i,s}; });
  const top = Math.max(...scored.map(m=>m.s));
  const bestMoves = scored.filter(m=>m.s===top).map(m=>m.i);
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const blunderP = {perfect:0, pragmatic:.28, reckless:.65}[S.ai];
  if(Math.random()>=blunderP) return rnd(bestMoves);
  if(S.ai==='pragmatic'){
    // plausible-but-flawed: pick any non-losing move if one exists, else anything
    const ok = scored.filter(m=>m.s>=0 && !bestMoves.includes(m.i)).map(m=>m.i);
    // never miss an immediate win even when sloppy
    return rnd(ok.length?ok:empty);
  }
  return rnd(empty); // reckless: pure chaos
}
function maybeAI(){
  if(S.mode!=='ai' || over || turn!==AI) return;
  render();
  aiTimer=setTimeout(()=>{ if(!over && turn===AI) place(aiPick()); }, 520+Math.random()*320);
}

/* ---------- input ---------- */
function setFocus(i,doFocus=true){
  cells[focusIdx].tabIndex=-1; focusIdx=i; cells[i].tabIndex=0; if(doFocus) cells[i].focus();
}
function humanPlay(i){
  if(over || (S.mode==='ai' && turn!==HUMAN)) return;
  if(board[i]){ setStatus(`That square is taken. Choose another, <b>${plr(turn)}</b>.`); return; }
  place(i);
}
boardEl.addEventListener('click',e=>{ const c=e.target.closest('.cell'); if(!c) return; setFocus(+c.dataset.i,false); humanPlay(+c.dataset.i); });
boardEl.addEventListener('keydown',e=>{
  const c=e.target.closest('.cell'); if(!c) return; let i=+c.dataset.i, r=Math.floor(i/3), col=i%3;
  const k=e.key;
  if(k==='ArrowRight') col=Math.min(2,col+1); else if(k==='ArrowLeft') col=Math.max(0,col-1);
  else if(k==='ArrowDown') r=Math.min(2,r+1); else if(k==='ArrowUp') r=Math.max(0,r-1);
  else if(k==='Home') col=0; else if(k==='End') col=2;
  else if(k==='Enter'||k===' '){ e.preventDefault(); humanPlay(i); return; }
  else return;
  e.preventDefault(); setFocus(r*3+col);
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||$('#dlg').open) return;
  if(/^[1-9]$/.test(e.key) && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ const i=+e.key-1; setFocus(i); humanPlay(i); }
  else if((e.key==='n'||e.key==='N') && document.activeElement.tagName!=='INPUT') newRound();
});
$('#newRound').onclick=newRound;
$('#reset').onclick=()=>{ scores={X:0,O:0,D:0}; save(); updateLabels(); setStatus('Scores reset. The arena is clean.'); setTimeout(()=>{ if(!over) turnStatus(); },1600); };

/* ---------- customize dialog ---------- */
const OPTS = [
  {k:'theme',label:'Theme',vals:[['day','Marble Day'],['night','Night Legion']]},
  {k:'glyphs',label:'Glyphs',vals:[['std','X / O'],['rome','Gladius / Laurel']],icons:true},
  {k:'mode',label:'Mode',vals:[['2p','2 Players'],['ai','vs AI']]},
  {k:'first',label:'First move',vals:[['X','X'],['O','O']]},
  {k:'ai',label:'AI discipline',vals:[['perfect','Perfect'],['pragmatic','Pragmatic'],['reckless','Reckless']],
    note:{perfect:'Unbeatable minimax. The best you can do is a draw.',pragmatic:'Plays well, but errs about one move in four.',reckless:'Charges in blindly — beatable, often chaotic.'}},
];
function buildDialog(){
  $('#opts').innerHTML = OPTS.map(o=>`<fieldset id="fs-${o.k}"><legend>${o.label}</legend><div class="seg">${
    o.vals.map(([v,t])=>`<label><input type="radio" name="${o.k}" value="${v}" ${S[o.k]===v?'checked':''}><span>${
      o.icons ? (v==='std'?iconX('std')+iconO('std'):iconX('rome')+iconO('rome')) : ''}${o.icons?'':t}${o.icons?`<span class="sr">${t}</span>`:''}</span></label>`).join('')
  }</div>${o.k==='ai'?'<p class="note" id="ainote"></p>':''}${o.k==='first'?'<p class="note" id="fnote"></p>':''}</fieldset>`).join('');
  syncDialog();
}
function syncDialog(){
  $('#fs-ai').disabled = S.mode!=='ai';
  $('#ainote').textContent = S.mode==='ai' ? OPTS[4].note[S.ai] : 'Only used in vs AI mode.';
  $('#fnote').textContent = S.mode==='ai' ? 'In vs AI mode you play X; the AI plays O.' : 'Applies from the next round.';
}
$('#opts').addEventListener('change',e=>{
  const k=e.target.name, v=e.target.value; if(!k) return;
  const prev=S[k]; S[k]=v; save();
  if(k==='theme') applyTheme();
  if(k==='glyphs'){ cells.forEach(c=>delete c.dataset.v); updateLabels(); render(); }
  if(k==='mode'||k==='first'||k==='ai'){ if(prev!==v){ updateLabels(); newRound(); } }
  syncDialog();
});
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  document.querySelector('meta[name=theme-color]').content = S.theme==='night'?'#14141a':'#efeae0';
}
const dlg=$('#dlg');
$('#customize').onclick=()=>{ buildDialog(); dlg.showModal(); };
$('#dx').onclick=$('#done').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener('close',()=>$('#customize').focus());

/* ---------- confetti (canvas) ---------- */
const cv=$('#confetti'), ctx=cv.getContext('2d'); let parts=[], raf=0, endAt=0;
function sizeCv(){ const d=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize',sizeCv); sizeCv();
function confetti(){
  if(reduced.matches) return;
  stopConfetti(); sizeCv();
  const cols=['#e6c35c','#b8892b','#f6e7a8','#9b1c22','#f4efe2','#c9482f'];
  const rect=boardEl.getBoundingClientRect(), n= innerWidth<600?110:190;
  for(let i=0;i<n;i++){
    const left=i%2; const ang=(left? -Math.PI*.5-Math.random()*.7 : -Math.PI*.5+Math.random()*.7);
    const sp=8+Math.random()*10;
    parts.push({x:rect.left+rect.width*(.2+Math.random()*.6),y:rect.top+rect.height*.5,vx:Math.cos(ang)*sp*.9,vy:Math.sin(ang)*sp,
      w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],t:Math.random()*6,
      shape:Math.random()<.25?1:0});
  }
  endAt=performance.now()+4200; raf=requestAnimationFrame(tick);
}
function tick(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const fade=Math.min(1,(endAt-now)/900);
  for(const p of parts){
    p.vy+=.22; p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.t+=.1;
    ctx.save(); ctx.globalAlpha=Math.max(0,fade); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    if(p.shape){ ctx.beginPath(); ctx.ellipse(0,0,p.w*.8,p.h*.5,0,0,7); ctx.fill(); }
    else ctx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.t)),p.w,p.h*Math.abs(Math.cos(p.t))+.5);
    ctx.restore();
  }
  parts=parts.filter(p=>p.y<innerHeight+30);
  if(now<endAt && parts.length) raf=requestAnimationFrame(tick); else stopConfetti();
}
function stopConfetti(){ cancelAnimationFrame(raf); parts=[]; ctx.clearRect(0,0,innerWidth,innerHeight); }

/* ---------- init ---------- */
if(!['day','night'].includes(S.theme)) S.theme='day';
applyTheme(); updateLabels(); newRound();
})();
</script>
</body>
