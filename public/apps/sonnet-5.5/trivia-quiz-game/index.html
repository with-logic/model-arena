<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars & Stripes Trivia</title>
<style>
:root{
  --navy:#0b1f4d; --navy2:#16346f; --red:#d7263d; --green:#16a34a; --cream:#fffaf0; --ink:#14213d;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(215,38,61,.35),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(80,130,255,.35),transparent 45%),
    linear-gradient(160deg,var(--navy),#071433 70%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
}
body::before{ /* subtle stars */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff8,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff6,transparent),radial-gradient(2px 2px at 150px 20px,#fff7,transparent);
  background-size:180px 120px;
}
.progress-wrap{position:sticky;top:0;width:100%;z-index:5;background:rgba(7,20,51,.7);backdrop-filter:blur(8px);padding:14px 20px 12px}
.progress-meta{max-width:720px;margin:0 auto 8px;display:flex;justify-content:space-between;color:#cfd9f5;font-size:.9rem;font-weight:600;letter-spacing:.04em}
.bar{max-width:720px;margin:0 auto;height:12px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),#ff7b8a,#fff);transition:width .6s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 12px #ff7b8a88}
main{width:100%;max-width:720px;padding:28px 18px 50px;flex:1;display:flex;align-items:center}
.card{
  width:100%;background:var(--cream);border-radius:26px;padding:34px 30px 28px;position:relative;
  box-shadow:0 30px 60px -15px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.08);
  animation:in .5s cubic-bezier(.2,.9,.3,1.1);overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,var(--red) 0 40px,#fff 40px 80px,var(--navy2) 80px 120px)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-40px) scale(.97)}}
.card.leaving{animation:out .28s ease forwards}
.tag{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);background:#d7263d14;padding:5px 12px;border-radius:99px}
h2{font-size:clamp(1.5rem,4.6vw,2.1rem);line-height:1.25;margin:16px 0 24px;color:var(--navy);font-weight:800}
.answers{display:grid;gap:12px}
.ans{
  font:inherit;font-size:clamp(1.05rem,3.4vw,1.3rem);font-weight:600;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;color:var(--ink);
  background:#fff;border:2.5px solid #dfe5f3;transition:transform .15s,border-color .15s,background .2s,box-shadow .15s;
}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:var(--navy2);box-shadow:0 8px 18px -8px #16346f66}
.ans:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
.ans .k{flex:none;width:34px;height:34px;border-radius:10px;background:#edf1fb;color:var(--navy2);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.ans:disabled{cursor:default}
.ans.correct{background:#dcfce7;border-color:var(--green);animation:pop .45s}
.ans.correct .k{background:var(--green);color:#fff}
.ans.wrong{background:#fee2e2;border-color:var(--red);animation:shake .45s}
.ans.wrong .k{background:var(--red);color:#fff}
.ans.dim{opacity:.5}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.feedback{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;background:rgba(255,250,240,.0)}
.feedback.show{display:grid}
.badge{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;animation:badge 1s ease forwards;box-shadow:0 20px 50px -10px #0006}
.badge.ok{background:var(--green)}.badge.no{background:var(--red)}
.badge svg{width:70px;height:70px}
.badge path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .45s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes badge{0%{transform:scale(0);opacity:0}30%{transform:scale(1.15);opacity:1}45%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.foot{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.fact{font-size:1rem;color:#4a5573;line-height:1.4;flex:1;opacity:0;transition:opacity .4s}
.fact.show{opacity:1}
.btn{
  font:inherit;font-weight:800;font-size:1.05rem;border:0;cursor:pointer;color:#fff;padding:14px 28px;border-radius:14px;
  background:linear-gradient(135deg,var(--red),#b5172c);box-shadow:0 10px 20px -8px #d7263d99;transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid var(--navy2);outline-offset:3px}
.btn.next{visibility:hidden}.btn.next.show{visibility:visible;animation:in .3s}
.center{text-align:center}
.hero-ico{font-size:4.5rem;margin-top:18px}
.lead{font-size:1.15rem;color:#4a5573;margin:10px 0 24px;line-height:1.5}
.ring{width:190px;height:190px;margin:10px auto 6px;position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:#e3e8f5}.ring .fg{stroke:var(--red);stroke-dasharray:502;stroke-dashoffset:502;transition:stroke-dashoffset 1.4s cubic-bezier(.3,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:900;color:var(--navy)}
.ring .num small{font-size:1.2rem;color:#7b86a6;font-weight:700}
.verdict{font-size:1.7rem;font-weight:800;color:var(--navy);margin:14px 0 4px}
.review{margin:18px 0 24px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
.dot.y{background:var(--green)}.dot.n{background:var(--red)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:480px){.card{padding:28px 18px 22px}.foot{flex-direction:column-reverse;align-items:stretch}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="progress-wrap">
  <div class="progress-meta"><span id="pLabel">Ready?</span><span id="pScore">Score: 0</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div>
</div>
<main><div id="stage" style="width:100%"></div></main>
<canvas id="fx"></canvas>

<script>
const QUESTIONS=[
 {c:"Geography",q:"What is the capital city of the United States?",a:["New York City","Washington, D.C.","Philadelphia","Los Angeles"],r:1,f:"Washington, D.C. has been the capital since 1800."},
 {c:"Symbols",q:"How many stars are on the American flag?",a:["13","48","50","52"],r:2,f:"One star for each state — Hawaii added the 50th in 1959."},
 {c:"History",q:"Who was the first President of the United States?",a:["Thomas Jefferson","Abraham Lincoln","John Adams","George Washington"],r:3,f:"Washington served from 1789 to 1797."},
 {c:"Civics",q:"Which document begins with the words “We the People”?",a:["The Constitution","The Declaration of Independence","The Bill of Rights","The Gettysburg Address"],r:0,f:"The Preamble opens the U.S. Constitution."},
 {c:"History",q:"In what year was the Declaration of Independence adopted?",a:["1492","1776","1812","1865"],r:1,f:"The Continental Congress adopted it on July 4, 1776."},
 {c:"Holidays",q:"Which holiday is celebrated on the fourth Thursday of November?",a:["Memorial Day","Labor Day","Thanksgiving","Veterans Day"],r:2,f:"Thanksgiving became a national holiday under Lincoln in 1863."},
 {c:"Geography",q:"Which is the largest U.S. state by area?",a:["Texas","Alaska","California","Montana"],r:1,f:"Alaska is more than twice the size of Texas."},
 {c:"Civics",q:"How many branches does the U.S. federal government have?",a:["2","3","4","5"],r:1,f:"Legislative, Executive, and Judicial."},
 {c:"History",q:"Who was the principal author of the Declaration of Independence?",a:["Benjamin Franklin","George Washington","Thomas Jefferson","James Madison"],r:2,f:"Jefferson drafted it at age 33."},
 {c:"Landmarks",q:"The Statue of Liberty was a gift to the U.S. from which country?",a:["England","France","Spain","Canada"],r:1,f:"France gave it in 1886 to celebrate American liberty."}
];
const $=s=>document.querySelector(s), stage=$("#stage");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let deck,idx,score,locked,results,cur;

function setProgress(done){
  $("#fill").style.width=(done/deck.length*100)+"%";
  $("#bar").setAttribute("aria-valuenow",done);
  $("#pScore").textContent="Score: "+score;
}
function start(){
  deck=shuffle(QUESTIONS).map(q=>{const o=q.a.map((t,i)=>({t,ok:i===q.r}));return{...q,opts:shuffle(o)}});
  idx=0;score=0;results=[];setProgress(0);
  $("#pLabel").textContent="Ready?";
  stage.innerHTML=`<div class="card center"><div class="hero-ico">🇺🇸</div>
   <h2>Stars &amp; Stripes Trivia</h2>
   <p class="lead">10 quick questions on American history, civics and geography. How well do you know the USA?</p>
   <button class="btn" id="go">Start Quiz</button></div>`;
  $("#go").onclick=show;$("#go").focus();
}
function show(){
  locked=false;cur=deck[idx];
  $("#pLabel").textContent=`Question ${idx+1} of ${deck.length}`;
  const letters="ABCD";
  stage.innerHTML=`<div class="card" id="card">
    <span class="tag">${cur.c}</span>
    <h2>${cur.q}</h2>
    <div class="answers">${cur.opts.map((o,i)=>`<button class="ans" data-i="${i}"><span class="k">${letters[i]}</span><span>${o.t}</span></button>`).join("")}</div>
    <div class="foot"><div class="fact" id="fact"></div><button class="btn next" id="next">${idx===deck.length-1?"See Results":"Next →"}</button></div>
    <div class="feedback" id="fb"></div></div>`;
  stage.querySelectorAll(".ans").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $("#next").onclick=advance;
}
function pick(i){
  if(locked)return;locked=true;
  const ok=cur.opts[i].ok;
  if(ok)score++;
  results.push(ok);
  const btns=[...stage.querySelectorAll(".ans")];
  btns.forEach((b,j)=>{b.disabled=true;if(cur.opts[j].ok)b.classList.add("correct");else if(j===i)b.classList.add("wrong");else b.classList.add("dim")});
  const fb=$("#fb");
  fb.innerHTML=`<div class="badge ${ok?"ok":"no"}"><svg viewBox="0 0 60 60">${ok?'<path d="M14 31 L26 43 L47 18" pathLength="100"/>':'<path d="M17 17 L43 43 M43 17 L17 43" pathLength="100"/>'}</svg></div>`;
  fb.classList.add("show");setTimeout(()=>fb.classList.remove("show"),1050);
  const f=$("#fact");f.textContent=(ok?"Correct! ":"Not quite. ")+cur.f;f.classList.add("show");
  const n=$("#next");n.classList.add("show");n.focus();
  if(ok)burst(0.5,0.4,40);
  setProgress(idx+1);
}
function advance(){
  if(!locked)return;
  const c=$("#card");c.classList.add("leaving");
  setTimeout(()=>{idx++;idx<deck.length?show():finish()},280);
  locked=false;
}
function finish(){
  $("#pLabel").textContent="Complete!";
  const pct=score/deck.length;
  const [v,e]=score===10?["Perfect score! Patriot genius!","🏆"]:score>=8?["Great job, true American scholar!","🎉"]:score>=6?["Nice work — solid knowledge!","👍"]:score>=4?["Not bad — keep studying!","📚"]:["Time to hit the history books!","🗽"];
  stage.innerHTML=`<div class="card center"><span class="tag">Final Score</span>
   <div class="ring"><svg viewBox="0 0 180 180"><circle class="bg" cx="90" cy="90" r="80"/><circle class="fg" id="fg" cx="90" cy="90" r="80"/></svg>
   <div class="num"><span>${score}<small>/${deck.length}</small></span></div></div>
   <div class="verdict">${e} ${v}</div>
   <p class="lead">You answered ${Math.round(pct*100)}% correctly.</p>
   <div class="review">${results.map((r,i)=>`<div class="dot ${r?"y":"n"}" title="Q${i+1}">${r?"✓":"✗"}</div>`).join("")}</div>
   <button class="btn" id="again">Play Again</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#fg").style.strokeDashoffset=502*(1-pct)}));
  $("#again").onclick=start;$("#again").focus();
  if(score>=6)for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random(),.3+Math.random()*.2,70),i*250);
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(!locked&&$("#card")&&"1234abcd".includes(k)&&k.length===1){const i="1234".includes(k)?+k-1:"abcd".indexOf(k);if(i<4)pick(i)}
});

/* confetti */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(x,y,n){
  const cols=["#d7263d","#ffffff","#3b82f6","#facc15","#16a34a"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*8;
    parts.push({x:x*cv.width,y:y*cv.height,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:6+Math.random()*6,h:4+Math.random()*5,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.012;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;
}
start();
</script>
</body>
</html>
