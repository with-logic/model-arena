<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive World Clock</title>
<style>
:root{--bg:#0b1020;--fg:#fff;--muted:rgba(255,255,255,.65)}
*{box-sizing:border-box;margin:0}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1d2a5a55,transparent),radial-gradient(900px 500px at 100% 0,#5b21b633,transparent),var(--bg);color:var(--fg);min-height:100vh;padding:28px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
h1 svg{width:34px;height:34px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 13px inherit;font-family:inherit;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s}
.seg button.on{background:#fff;color:#111}
.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font:600 13px inherit;font-family:inherit;padding:10px 16px;border-radius:999px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(135deg,#6366f1,#a855f7);border:0}
.btn.primary:hover{filter:brightness(1.1)}
.scrub{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 18px;margin-bottom:24px;flex-wrap:wrap}
.scrub label{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.scrub input{flex:1;min-width:160px;accent-color:#a78bfa}
.scrub output{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;min-width:84px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;border-radius:24px;padding:22px 22px 18px;overflow:hidden;box-shadow:0 14px 40px #0006,inset 0 0 0 1px rgba(255,255,255,.12);transition:background 1s,transform .25s;animation:pop .45s cubic-bezier(.2,1.2,.4,1) both;min-height:230px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(12px)}}
.card.out{animation:out .3s forwards}
@keyframes out{to{opacity:0;transform:scale(.85)}}
.morning{background:linear-gradient(160deg,#fcd77a,#f6a273 55%,#e9779a);color:#3b1d12}
.afternoon{background:linear-gradient(160deg,#38bdf8,#3b82f6 60%,#2563eb);color:#fff}
.evening{background:linear-gradient(160deg,#fb923c,#e0457b 50%,#6d28d9);color:#fff}
.night{background:linear-gradient(160deg,#1e1b4b,#111a3d 55%,#0a1028);color:#e8ecff}
.card .stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 12%,#fff,transparent);animation:tw 3s infinite alternate}
.card.night .stars{opacity:.9}
@keyframes tw{to{opacity:.4}}
.glow{position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.city{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.country{font-size:12px;opacity:.75;margin-top:2px;font-weight:500}
.icon{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 8px #0003)}
.time{font-size:clamp(44px,5.2vw,56px);font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:18px;line-height:1;position:relative;display:flex;align-items:baseline;gap:6px}
.time .s{font-size:.4em;opacity:.7;font-weight:400}
.time .ap{font-size:.34em;font-weight:700;opacity:.85;letter-spacing:.04em}
.meta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:10px;opacity:.85;font-weight:500;position:relative;gap:8px}
.badge{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.9}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:12px;position:relative}
.bar i{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);transform:translateX(-50%)}
.morning .bar{background:rgba(60,30,10,.2)}
.x{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff;cursor:pointer;opacity:0;transition:.2s;font-size:15px;line-height:1;display:none}
.card:hover .x{opacity:1}
.top .x{position:static;display:block;width:24px;height:24px;margin-left:6px;opacity:0}
.x:hover{background:rgba(220,38,38,.9)}
.right{display:flex;align-items:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
dialog{margin:auto;border:1px solid rgba(255,255,255,.15);background:#141a33;color:#fff;border-radius:22px;padding:22px;width:min(440px,92vw);box-shadow:0 30px 80px #000a}
dialog::backdrop{background:rgba(5,8,20,.65);backdrop-filter:blur(6px)}
dialog h2{font-size:20px;margin-bottom:12px}
dialog input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:15px inherit;font-family:inherit;outline:none}
dialog input:focus{border-color:#a78bfa}
.list{max-height:300px;overflow:auto;margin:12px 0;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;background:none;border:0;color:#fff;font-family:inherit;text-align:left}
.opt:hover,.opt:focus{background:rgba(255,255,255,.1);outline:none}
.opt span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.opt.has{opacity:.4;pointer-events:none}
.foot{text-align:right}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:28px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6v6l4 2.5"/></svg>
    <div>World Clock<small id="localInfo"></small></div></h1>
  <div class="controls">
    <div class="seg" role="group" aria-label="Time format"><button id="b12">12h</button><button id="b24">24h</button></div>
    <div class="seg" role="group" aria-label="Seconds"><button id="bsec">Seconds</button></div>
    <button class="btn primary" id="add">+ Add city</button>
  </div>
</header>
<div class="scrub">
  <label for="shift">Time travel</label>
  <input type="range" id="shift" min="-720" max="720" step="15" value="0">
  <output id="shiftOut">Now</output>
  <button class="btn" id="reset">Reset</button>
</div>
<div class="grid" id="grid"></div>
<div class="legend">
  <span><b style="background:#f6a273"></b>Morning 5–12</span><span><b style="background:#3b82f6"></b>Afternoon 12–17</span><span><b style="background:#e0457b"></b>Evening 17–21</span><span><b style="background:#1e1b4b"></b>Night 21–5</span>
</div>
</div>

<dialog id="dlg">
  <h2>Add a city</h2>
  <input id="q" placeholder="Search cities or countries…" autocomplete="off">
  <div class="list" id="list"></div>
  <div class="foot"><button class="btn" id="close">Close</button></div>
</dialog>

<script>
const CITIES=[
["New York","United States","America/New_York"],["Los Angeles","United States","America/Los_Angeles"],["Chicago","United States","America/Chicago"],["Denver","United States","America/Denver"],["Anchorage","United States","America/Anchorage"],["Honolulu","United States","Pacific/Honolulu"],["Vancouver","Canada","America/Vancouver"],["Toronto","Canada","America/Toronto"],["Mexico City","Mexico","America/Mexico_City"],["Bogotá","Colombia","America/Bogota"],["Lima","Peru","America/Lima"],["Santiago","Chile","America/Santiago"],["São Paulo","Brazil","America/Sao_Paulo"],["Buenos Aires","Argentina","America/Argentina/Buenos_Aires"],["Reykjavík","Iceland","Atlantic/Reykjavik"],["London","United Kingdom","Europe/London"],["Dublin","Ireland","Europe/Dublin"],["Lisbon","Portugal","Europe/Lisbon"],["Madrid","Spain","Europe/Madrid"],["Paris","France","Europe/Paris"],["Berlin","Germany","Europe/Berlin"],["Rome","Italy","Europe/Rome"],["Amsterdam","Netherlands","Europe/Amsterdam"],["Stockholm","Sweden","Europe/Stockholm"],["Athens","Greece","Europe/Athens"],["Istanbul","Türkiye","Europe/Istanbul"],["Moscow","Russia","Europe/Moscow"],["Cairo","Egypt","Africa/Cairo"],["Lagos","Nigeria","Africa/Lagos"],["Nairobi","Kenya","Africa/Nairobi"],["Johannesburg","South Africa","Africa/Johannesburg"],["Dubai","UAE","Asia/Dubai"],["Tehran","Iran","Asia/Tehran"],["Karachi","Pakistan","Asia/Karachi"],["Mumbai","India","Asia/Kolkata"],["Kathmandu","Nepal","Asia/Kathmandu"],["Dhaka","Bangladesh","Asia/Dhaka"],["Bangkok","Thailand","Asia/Bangkok"],["Jakarta","Indonesia","Asia/Jakarta"],["Singapore","Singapore","Asia/Singapore"],["Hong Kong","China","Asia/Hong_Kong"],["Shanghai","China","Asia/Shanghai"],["Seoul","South Korea","Asia/Seoul"],["Tokyo","Japan","Asia/Tokyo"],["Perth","Australia","Australia/Perth"],["Sydney","Australia","Australia/Sydney"],["Auckland","New Zealand","Pacific/Auckland"],["UTC","Coordinated Universal Time","UTC"]
];
const localTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
const DEF=["America/Los_Angeles","America/New_York","Europe/London","Europe/Paris","Asia/Dubai","Asia/Kolkata","Asia/Tokyo","Australia/Sydney"];
const store=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let zones=store('wc.zones',DEF), h24=store('wc.h24',false), showSec=store('wc.sec',true), shift=0;
const $=id=>document.getElementById(id);
const info=tz=>CITIES.find(c=>c[2]===tz)||[tz.split('/').pop().replace(/_/g,' '),tz.split('/')[0],tz];

const fmts={};
function parts(tz,ts){
  const f=fmts[tz]||(fmts[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',weekday:'short',month:'short'}));
  const o={};f.formatToParts(ts).forEach(p=>o[p.type]=p.value);
  const y=+o.year,mo=new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'numeric'}).format(ts)|0;
  const h=+o.hour%24,m=+o.minute,s=+o.second,d=+o.day;
  const asUTC=Date.UTC(y,mo-1,d,h,m,s);
  return{h,m,s,d,wd:o.weekday,mon:o.month,dayKey:Math.floor(asUTC/864e5),off:Math.round((asUTC-Math.floor(ts/1000)*1000)/60000)};
}
function period(h){return h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=17&&h<21?'evening':'night'}
const NAMES={morning:'Morning',afternoon:'Afternoon',evening:'Evening',night:'Night'};
const ICONS={
morning:'<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 36h36M12 36a12 12 0 0124 0" fill="#fff6" /><path d="M24 10v6M10 17l4 4M38 17l-4 4M4 28h5M39 28h5"/><path d="M18 42h12" /></svg>',
afternoon:'<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="#ffe66d" stroke-width="2.8" stroke-linecap="round"><circle cx="24" cy="24" r="8.5" fill="#ffd93d"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/></svg>',
evening:'<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 34h36M13 34a11 11 0 0122 0" fill="#fff4"/><path d="M24 26v-8m0 0l-4 4m4-4l4 4M10 42h28M4 26h4M40 26h4"/></svg>',
night:'<svg class="icon" viewBox="0 0 48 48"><path d="M33 31A15 15 0 0117 9a15 15 0 1016 22z" fill="#f4efc7"/><circle cx="36" cy="10" r="1.6" fill="#fff"/><circle cx="42" cy="22" r="1.2" fill="#fff"/><path d="M30 6l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fff"/></svg>'};

const cards={};
const pad=n=>String(n).padStart(2,'0');
function build(tz){
  const [city,country]=info(tz);
  const el=document.createElement('div');el.className='card night';
  el.innerHTML=`<div class="stars"></div><div class="glow"></div>
  <div class="top"><div><div class="city"></div><div class="country"></div></div><div class="right"><span class="ico"></span><button class="x" title="Remove city" aria-label="Remove city">✕</button></div></div>
  <div class="time"><span class="hm"></span><span class="s"></span><span class="ap"></span></div>
  <div class="meta"><span class="date"></span><span class="badge"></span></div>
  <div class="meta"><span class="rel"></span><span class="off"></span></div>
  <div class="bar"><i></i></div>`;
  el.querySelector('.city').textContent=city;el.querySelector('.country').textContent=country;
  el.querySelector('.x').onclick=()=>{el.classList.add('out');setTimeout(()=>{zones=zones.filter(z=>z!==tz);save('wc.zones',zones);delete cards[tz];el.remove();empty()},280)};
  const q=s=>el.querySelector(s);
  return{el,hm:q('.hm'),s:q('.s'),ap:q('.ap'),date:q('.date'),badge:q('.badge'),rel:q('.rel'),off:q('.off'),ico:q('.ico'),bar:q('.bar i'),per:''};
}
function empty(){
  let e=$('emp');
  if(!zones.length&&!e){e=document.createElement('div');e.id='emp';e.className='empty';e.textContent='No cities yet — add one to get started.';$('grid').append(e)}
  else if(zones.length&&e)e.remove();
}
function sync(){
  zones.forEach(tz=>{if(!cards[tz]){cards[tz]=build(tz);$('grid').append(cards[tz].el)}});
  empty();
}
function fmtOff(m){const s=m<0?'-':'+',a=Math.abs(m);return 'UTC'+s+Math.floor(a/60)+(a%60?':'+pad(a%60):'')}
function tick(){
  const ts=Date.now()+shift*60000;
  const loc=parts(localTz,ts);
  zones.forEach(tz=>{
    const c=cards[tz];if(!c)return;
    const p=parts(tz,ts);
    let h=p.h,ap='';
    if(!h24){ap=h<12?'AM':'PM';h=h%12||12}
    c.hm.textContent=(h24?pad(h):h)+':'+pad(p.m);
    c.s.textContent=showSec?':'+pad(p.s):'';
    c.ap.textContent=ap;
    c.date.textContent=`${p.wd}, ${p.mon} ${p.d}`;
    const per=period(p.h);
    if(c.per!==per){c.per=per;c.el.className='card '+per;c.ico.innerHTML=ICONS[per];c.badge.textContent=NAMES[per]}
    const dd=p.dayKey-loc.dayKey;
    const dh=(p.off-loc.off)/60;
    c.rel.textContent=(dd===0?'Today':dd>0?'Tomorrow':'Yesterday')+(tz===localTz?' · Local':'');
    c.off.textContent=fmtOff(p.off)+(tz!==localTz&&dh?` (${dh>0?'+':''}${+dh.toFixed(2)}h)`:'');
    c.bar.style.left=((p.h*60+p.m)/1440*100)+'%';
  });
}
function ui(){
  $('b12').classList.toggle('on',!h24);$('b24').classList.toggle('on',h24);$('bsec').classList.toggle('on',showSec);
  const m=shift,a=Math.abs(m);
  $('shiftOut').textContent=m===0?'Now':(m>0?'+':'−')+Math.floor(a/60)+'h'+(a%60?' '+a%60+'m':'');
}
$('b12').onclick=()=>{h24=false;save('wc.h24',h24);ui();tick()};
$('b24').onclick=()=>{h24=true;save('wc.h24',h24);ui();tick()};
$('bsec').onclick=()=>{showSec=!showSec;save('wc.sec',showSec);ui();tick()};
$('shift').oninput=e=>{shift=+e.target.value;ui();tick()};
$('reset').onclick=()=>{shift=0;$('shift').value=0;ui();tick()};

const dlg=$('dlg');
function renderList(){
  const q=$('q').value.trim().toLowerCase(),L=$('list');L.innerHTML='';
  const hits=CITIES.filter(c=>!q||(c[0]+' '+c[1]+' '+c[2]).toLowerCase().includes(q));
  hits.forEach(c=>{
    const b=document.createElement('button');b.className='opt'+(zones.includes(c[2])?' has':'');
    const p=parts(c[2],Date.now());
    b.innerHTML='<div></div><span></span>';
    b.firstChild.textContent=c[0]+' · '+c[1];
    b.lastChild.textContent=fmtOff(p.off);
    b.onclick=()=>{zones.push(c[2]);save('wc.zones',zones);sync();tick();renderList()};
    L.append(b);
  });
  if(!hits.length){
    const custom=$('q').value.trim();
    L.innerHTML='<div class="opt" style="cursor:default">No match. Try an IANA zone like "Asia/Manila" and press Enter.</div>';
  }
}
$('add').onclick=()=>{$('q').value='';renderList();dlg.showModal();$('q').focus()};
$('close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('q').oninput=renderList;
$('q').onkeydown=e=>{
  if(e.key!=='Enter')return;
  const v=$('q').value.trim();
  const first=$('list').querySelector('.opt:not(.has)[class="opt"]');
  if(first&&first.tagName==='BUTTON'){first.click();return}
  try{new Intl.DateTimeFormat('en-US',{timeZone:v});if(!zones.includes(v)){zones.push(v);save('wc.zones',zones);sync();tick()}$('q').value='';renderList()}catch{}
};

$('localInfo').textContent='Your time zone: '+localTz.replace(/_/g,' ');
ui();sync();tick();
setInterval(tick,1000);
</script>
</body>
</html>
