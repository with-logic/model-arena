<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Journey Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --ink:#14172b; --muted:#6b7190; --line:#e3e6f0; --card:#fff;
  --accent:#5b5bf0; --accent-soft:#ececff; --danger:#e5484d;
  --shadow:0 1px 2px rgba(20,23,43,.06),0 6px 20px rgba(20,23,43,.07);
  --shadow-lg:0 2px 4px rgba(20,23,43,.06),0 16px 40px rgba(20,23,43,.14);
  --W:244px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* top bar */
#top{position:fixed;z-index:30;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:12px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:11px;background:var(--card);padding:8px 16px 8px 10px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b5bf0,#a855f7);display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1}
#jname{border:0;background:transparent;font-weight:650;font-size:15px;padding:2px 0;width:230px;outline:none;border-bottom:1.5px solid transparent;margin-top:3px}
#jname:hover{border-bottom-color:var(--line)} #jname:focus{border-bottom-color:var(--accent)}
.bar{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:7px 11px;border-radius:9px;font-weight:550;font-size:13px;color:#2b3050;transition:.15s}
.btn:hover{background:#f0f1f8}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,91,240,.35)}
.btn.primary:hover{background:#4a4ae0}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;background:var(--line);margin:4px 3px}
.spacer{flex:1}

/* stage */
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(circle,#c9cde0 1.1px,transparent 1.3px);background-size:24px 24px}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges .hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:18;fill:none}
#edges .edge{fill:none;stroke-width:2.5;stroke-linecap:round;pointer-events:none}
#edges .flow{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:2 14;stroke-linecap:round;opacity:.9;animation:flow 1.1s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-16}}
#edges .g.sel .edge{stroke-width:3.5;filter:drop-shadow(0 0 4px rgba(91,91,240,.5))}
#edges .lbl rect{fill:#fff;stroke:var(--line);stroke-width:1}
#edges .g.sel .lbl rect{stroke:var(--accent)}
#edges .lbl text{font-size:11px;font-weight:600;fill:#444a6b;text-anchor:middle;dominant-baseline:central;font-family:inherit}
#edges .lbl{pointer-events:all;cursor:pointer}
#edges .del{pointer-events:all;cursor:pointer}
#edges .del circle{fill:var(--danger)} #edges .del path{stroke:#fff;stroke-width:2;stroke-linecap:round}
#edges .temp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 6;stroke-linecap:round}

/* nodes */
.node{position:absolute;width:var(--W);background:var(--card);border-radius:16px;border:1.5px solid var(--line);box-shadow:var(--shadow);
  cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s;overflow:visible}
.node:hover{box-shadow:var(--shadow-lg)}
.node.sel{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),var(--shadow-lg)}
.node.drag{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:5}
.node.target{border-color:var(--accent);box-shadow:0 0 0 5px rgba(91,91,240,.25),var(--shadow-lg)}
.node .strip{height:6px;border-radius:14px 14px 0 0;background:var(--c)}
.n-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.n-icon{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--c) 14%,#fff);display:grid;place-items:center;font-size:19px;flex:none}
.n-titlewrap{min-width:0;flex:1}
.n-step{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--c);filter:brightness(.85)}
.n-title{font-weight:650;font-size:15.5px;line-height:1.25;outline:none;word-break:break-word;border-radius:4px}
.n-desc{padding:2px 14px 10px;color:var(--muted);font-size:12.5px;line-height:1.45;outline:none;word-break:break-word;min-height:18px}
[contenteditable=true]{cursor:text;user-select:text;background:#f3f4ff;box-shadow:0 0 0 3px #dcdcff}
.n-tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.chip{font-size:11px;font-weight:550;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 11%,#fff);color:color-mix(in srgb,var(--c) 60%,#000)}
.n-foot{border-top:1px dashed var(--line);padding:10px 14px 12px}
.n-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.n-row b{color:var(--ink);font-weight:650;font-size:13px}
.bar-t{height:6px;border-radius:9px;background:#eef0f7;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .3s}
.port{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--c);cursor:crosshair;z-index:3;transition:transform .15s,background .15s}
.port::after{content:"";position:absolute;inset:-9px}
.port:hover{transform:scale(1.35);background:var(--c)}
.port.in{left:-8px}.port.out{right:-8px}
body.linking .node:not(.target) .port{transform:scale(1.15)}

/* floating panels */
.panel{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#stats{left:14px;bottom:14px;padding:14px 16px;width:300px}
#stats h4{margin:0 0 10px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
.kpis{display:flex;gap:16px;margin-bottom:8px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:11px;color:var(--muted)}
#spark{width:100%;height:56px;display:block}
#zoom{right:14px;bottom:14px;display:flex;align-items:center;padding:4px;gap:2px}
#zoom .btn{padding:7px 9px}
#zoomv{min-width:46px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
#hint{left:50%;bottom:18px;transform:translateX(-50%);padding:9px 16px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;align-items:center;white-space:nowrap;transition:opacity .4s}
#hint kbd{background:#f0f1f8;border-radius:5px;padding:1px 6px;font:600 11px Inter,sans-serif;color:#444a6b}
#hint button{border:0;background:none;color:var(--muted);font-size:16px;padding:0 2px}

/* inspector */
#insp{top:78px;right:14px;width:310px;max-height:calc(100vh - 150px);overflow:auto;padding:16px;transform:translateX(30px);opacity:0;pointer-events:none;transition:.22s}
#insp.open{transform:none;opacity:1;pointer-events:auto}
#insp h3{margin:0 0 14px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;justify-content:space-between;align-items:center}
#insp h3 button{border:0;background:none;font-size:18px;color:var(--muted);line-height:1}
.f{margin-bottom:14px}
.f>label{display:block;font-size:12px;font-weight:600;color:#444a6b;margin-bottom:6px;display:flex;justify-content:space-between}
.f>label em{font-style:normal;color:var(--muted);font-weight:500}
.f input[type=text],.f input[type=number],.f textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfd;outline:none;transition:.15s;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.icons button{border:1.5px solid transparent;background:#f4f5fa;border-radius:8px;height:30px;font-size:15px;padding:0}
.icons button:hover{background:#e9eaf5}.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);padding:0;transition:.15s}
.swatches button.on{outline:2.5px solid var(--c);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.faces{display:flex;justify-content:space-between;font-size:17px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 6px 4px 10px;font-size:12px}
.chips .chip button{border:0;background:none;padding:0 3px;font-size:14px;line-height:1;opacity:.6}
.chips .chip button:hover{opacity:1}
.danger{width:100%;justify-content:center;color:var(--danger);border:1.5px solid #fadadd;background:#fff7f7;padding:9px}
.danger:hover{background:#ffecec}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;justify-content:center;border:1.5px solid var(--line)}
.flowline{display:flex;align-items:center;gap:8px;background:#f6f7fb;border-radius:10px;padding:10px;font-weight:600;font-size:13px;margin-bottom:14px}
.flowline span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toast{position:fixed;z-index:50;top:80px;left:50%;transform:translate(-50%,-12px);background:#14172b;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){#top{flex-wrap:wrap}.btn span{display:none}#jname{width:140px}#hint{display:none}#stats{display:none}}
</style>
</head>
<body>

<div id="top">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/></svg></div>
    <div><small>Customer Journey Flow</small><input id="jname" spellcheck="false" aria-label="Journey name"></div>
  </div>
  <div class="bar">
    <button class="btn primary" id="bAdd" title="Add stage (N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add stage</span></button>
    <div class="sep"></div>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <div class="sep"></div>
    <button class="btn" id="bLayout" title="Auto-arrange"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1"/><rect x="15" y="4" width="6" height="6" rx="1"/><rect x="9" y="14" width="6" height="6" rx="1"/><path d="M9 7h6M6 10v2h12v-2M12 12v2"/></svg><span>Auto-arrange</span></button>
    <button class="btn" id="bFit" title="Fit to view (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fit</span></button>
  </div>
  <div class="spacer"></div>
  <div class="bar">
    <button class="btn" id="bImport" title="Import JSON"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Import</span></button>
    <button class="btn" id="bExport" title="Export JSON"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg><span>Export</span></button>
    <button class="btn" id="bReset" title="Reset to sample"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.5L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
</div>
<input type="file" id="file" accept="application/json" hidden>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="panel" id="stats">
  <h4>Journey pulse</h4>
  <div class="kpis">
    <div class="kpi"><b id="kConv">–</b><span>Overall conversion</span></div>
    <div class="kpi"><b id="kStages">0</b><span>Stages</span></div>
    <div class="kpi"><b id="kFace">😐</b><span>Avg. mood</span></div>
  </div>
  <svg id="spark" viewBox="0 0 270 56" preserveAspectRatio="none"></svg>
</div>

<div class="panel" id="hint">
  <span>Drag from a <b style="color:var(--accent)">●</b> port to connect</span>
  <span>Double-click text to edit</span>
  <span><kbd>Del</kbd> remove</span>
  <span>Scroll to zoom</span>
  <button id="hintX" aria-label="Dismiss">×</button>
</div>

<div class="panel" id="zoom">
  <button class="btn" id="zOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <div id="zoomv">100%</div>
  <button class="btn" id="zIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="panel" id="insp"></div>
<div id="toast"></div>

<script>
(()=>{
const W=244, KEY='cjf-v1';
const COLORS=['#5b5bf0','#0ea5e9','#14b8a6','#22c55e','#f59e0b','#f97316','#ef4444','#ec4899','#a855f7'];
const ICONS=['🔍','👀','🤔','🛒','💳','🎁','📣','💬','📧','🎯','⭐','🤝','📱','🖥️','🧪','🚀','📞','📦','💡','❤️','🏷️','🔔','📈','🎉'];
const FACES=['😞','🙁','😐','🙂','😍'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'n'+Math.random().toString(36).slice(2,8);
const fmt=n=>Number(n||0).toLocaleString('en-US');

function sample(){
  const mk=(id,x,y,title,desc,icon,color,users,mood,tp)=>({id,x,y,title,desc,icon,color,users,mood,tp});
  return {name:'SaaS Buyer Journey',
   nodes:[
    mk('a',0,160,'Awareness','Prospect discovers the brand for the first time.','🔍',COLORS[1],10000,3,['Social ads','SEO','Word of mouth']),
    mk('b',330,160,'Interest','Engages with content and explores what we offer.','👀',COLORS[0],6400,3,['Blog','Newsletter','Webinar']),
    mk('c',660,160,'Consideration','Compares us with alternatives and reads reviews.','🤔',COLORS[8],3800,2,['Pricing page','Reviews','Comparison']),
    mk('d',990,20,'Free Trial','Hands-on test drive of the product.','🧪',COLORS[2],1700,4,['Onboarding','In-app tips']),
    mk('e',990,330,'Sales Demo','Guided walkthrough with a specialist.','📞',COLORS[4],900,4,['Video call','Proposal']),
    mk('f',1320,160,'Purchase','Customer subscribes and becomes active.','🎉',COLORS[3],1050,5,['Checkout','Welcome email'])],
   edges:[
    {id:'e1',from:'a',to:'b',label:'64%'},{id:'e2',from:'b',to:'c',label:'59%'},
    {id:'e3',from:'c',to:'d',label:'45%'},{id:'e4',from:'c',to:'e',label:'24%'},
    {id:'e5',from:'d',to:'f',label:'41%'},{id:'e6',from:'e',to:'f',label:'66%'}]};
}

let S, view={x:60,y:120,k:.85}, sel=null, hist=[], hi=-1;
const els=new Map();
const stage=$('#stage'), world=$('#world'), svg=$('#edges'), nodesEl=$('#nodes');

/* ---------- persistence & history ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function snap(){return JSON.stringify(S)}
function commit(){const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>100)hist.shift();hi=hist.length-1;save();syncUI()}
function restore(s){S=JSON.parse(s);if(sel&&!find(sel))sel=null;rebuild();save();syncUI()}
function undo(){if(hi>0){hi--;restore(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi])}}
const nodeById=id=>S.nodes.find(n=>n.id===id);
const edgeById=id=>S.edges.find(e=>e.id===id);
function find(s){return s.type==='node'?nodeById(s.id):edgeById(s.id)}

/* ---------- rendering ---------- */
function stepIndex(n){return [...S.nodes].sort((a,b)=>a.x-b.x||a.y-b.y).indexOf(n)+1}
function nodeHTML(n){
  const max=Math.max(1,...S.nodes.map(m=>+m.users||0));
  return `<div class="strip"></div>
  <div class="port in" data-port="in"></div><div class="port out" data-port="out"></div>
  <div class="n-head"><div class="n-icon">${esc(n.icon)}</div><div class="n-titlewrap"><div class="n-step">Stage ${stepIndex(n)}</div><div class="n-title" data-f="title">${esc(n.title)}</div></div></div>
  <div class="n-desc" data-f="desc">${esc(n.desc)||'<span style="opacity:.5">Add a description…</span>'}</div>
  ${n.tp.length?`<div class="n-tags">${n.tp.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
  <div class="n-foot"><div class="n-row"><span>Customers</span><b>${fmt(n.users)} <span style="font-size:15px;margin-left:4px">${FACES[n.mood-1]}</span></b></div>
  <div class="bar-t"><i style="width:${Math.max(2,(+n.users||0)/max*100)}%"></i></div></div>`;
}
function paintNode(n){
  let el=els.get(n.id);
  if(!el){el=document.createElement('div');el.className='node';el.dataset.id=n.id;nodesEl.appendChild(el);els.set(n.id,el)}
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--c',n.color);
  el.classList.toggle('sel',!!sel&&sel.type==='node'&&sel.id===n.id);
  el.innerHTML=nodeHTML(n);
}
function rebuild(){
  for(const [id,el] of els) if(!nodeById(id)){el.remove();els.delete(id)}
  S.nodes.forEach(paintNode);
  measure();drawEdges();syncUI();renderInsp();
}
function refreshAllNodes(){S.nodes.forEach(paintNode);measure();drawEdges()}
function measure(){S.nodes.forEach(n=>{const el=els.get(n.id);if(el)n.h=el.offsetHeight})}
function portPos(n,side){return {x:n.x+(side==='out'?W:0),y:n.y+(n.h||160)/2}}
function bez(a,b){const d=Math.max(60,Math.abs(b.x-a.x)*.5);return `M${a.x},${a.y} C${a.x+d},${a.y} ${b.x-d},${b.y} ${b.x},${b.y}`}
function drawEdges(){
  let defs='',body='';
  S.edges.forEach(e=>{
    const f=nodeById(e.from),t=nodeById(e.to);if(!f||!t)return;
    const a=portPos(f,'out'),b0=portPos(t,'in'),b={x:b0.x-9,y:b0.y};
    const d=bez({x:a.x+8,y:a.y},b),isSel=sel&&sel.type==='edge'&&sel.id===e.id;
    const mx=(a.x+8+b.x)/2,my=(a.y+b.y)/2;
    defs+=`<linearGradient id="g${e.id}" gradientUnits="userSpaceOnUse" x1="${a.x}" y1="0" x2="${b.x}" y2="0"><stop offset="0" stop-color="${f.color}"/><stop offset="1" stop-color="${t.color}"/></linearGradient>
    <marker id="m${e.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="${t.color}"/></marker>`;
    const lw=e.label?Math.max(34,e.label.length*6.6+16):0;
    body+=`<g class="g${isSel?' sel':''}" data-eid="${e.id}">
      <path class="hit" d="${d}" data-eid="${e.id}"/>
      <path class="edge" d="${d}" stroke="${Math.abs(b.x-a.x)<1?f.color:`url(#g${e.id})`}" marker-end="url(#m${e.id})" ${isSel?'':'opacity=".85"'}/>
      <path class="flow" d="${d}"/>
      ${e.label?`<g class="lbl" data-eid="${e.id}" transform="translate(${mx},${my})"><rect x="${-lw/2}" y="-11" width="${lw}" height="22" rx="11"/><text>${esc(e.label)}</text></g>`:''}
      ${isSel?`<g class="del" data-del="${e.id}" transform="translate(${mx},${my+(e.label?26:0)})"><circle r="10"/><path d="M-3.5-3.5l7 7M3.5-3.5l-7 7"/></g>`:''}
    </g>`;
  });
  svg.innerHTML=`<defs>${defs}</defs>${body}`;
  // keep in-flight temp path
  if(link&&link.path)svg.appendChild(link.path);
}
function syncUI(){
  $('#jname').value!==S.name&&($('#jname').value=S.name);
  $('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;
  // stats
  const n=S.nodes;$('#kStages').textContent=n.length;
  const src=n.filter(x=>!S.edges.some(e=>e.to===x.id)),snk=n.filter(x=>!S.edges.some(e=>e.from===x.id));
  const si=src.reduce((s,x)=>s+(+x.users||0),0),so=snk.reduce((s,x)=>s+(+x.users||0),0);
  $('#kConv').textContent=n.length>1&&si?((so/si*100).toFixed(si&&so/si<.1?1:0)+'%'):'–';
  const avg=n.length?n.reduce((s,x)=>s+x.mood,0)/n.length:3;
  $('#kFace').textContent=FACES[Math.round(avg)-1]||'😐';
  // sparkline of mood across the journey (left→right)
  const ord=[...n].sort((a,b)=>a.x-b.x),sp=$('#spark');
  if(ord.length<2){sp.innerHTML='';return}
  const pts=ord.map((m,i)=>[8+i*(254/(ord.length-1)),50-(m.mood-1)/4*42]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const[p,q]=[pts[i-1],pts[i]],cx=(p[0]+q[0])/2;d+=` C${cx},${p[1]} ${cx},${q[1]} ${q[0]},${q[1]}`}
  sp.innerHTML=`<defs><linearGradient id="sg" x1="0" x2="1">${ord.map((m,i)=>`<stop offset="${i/(ord.length-1)}" stop-color="${m.color}"/>`).join('')}</linearGradient>
  <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5bf0" stop-opacity=".16"/><stop offset="1" stop-color="#5b5bf0" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L${pts.at(-1)[0]},56 L${pts[0][0]},56z" fill="url(#sf)"/>
  <path d="${d}" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`+
  pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${ord[i].color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('');
}
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  stage.style.backgroundSize=`${24*view.k}px ${24*view.k}px`;
  stage.style.backgroundPosition=`${view.x}px ${view.y}px`;
  $('#zoomv').textContent=Math.round(view.k*100)+'%';
}
const toWorld=(cx,cy)=>({x:(cx-view.x)/view.k,y:(cy-view.y)/view.k});
function zoomAt(cx,cy,k2){k2=Math.min(2,Math.max(.25,k2));const w=toWorld(cx,cy);view.k=k2;view.x=cx-w.x*k2;view.y=cy-w.y*k2;applyView()}
function fit(animate=true){
  if(!S.nodes.length)return;
  measure();
  const x0=Math.min(...S.nodes.map(n=>n.x)),x1=Math.max(...S.nodes.map(n=>n.x+W));
  const y0=Math.min(...S.nodes.map(n=>n.y)),y1=Math.max(...S.nodes.map(n=>n.y+n.h));
  const vw=innerWidth,vh=innerHeight,padT=110,padB=150,padS=70;
  const k=Math.min(1.1,Math.max(.25,Math.min((vw-padS*2)/(x1-x0),(vh-padT-padB)/(y1-y0))));
  const t={k,x:(vw-(x1-x0)*k)/2-x0*k,y:padT+(vh-padT-padB-(y1-y0)*k)/2-y0*k};
  if(!animate){view=t;applyView();return}
  const s={...view},st=performance.now();
  (function step(now){const p=Math.min(1,(now-st)/350),e=1-Math.pow(1-p,3);
    view={k:s.k+(t.k-s.k)*e,x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e};applyView();if(p<1)requestAnimationFrame(step)})(st);
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- selection & inspector ---------- */
function select(s){
  sel=s;
  els.forEach((el,id)=>el.classList.toggle('sel',!!s&&s.type==='node'&&s.id===id));
  drawEdges();renderInsp();
}
function renderInsp(){
  const p=$('#insp');
  if(!sel||!find(sel)){p.classList.remove('open');return}
  p.classList.add('open');
  if(sel.type==='node'){
    const n=nodeById(sel.id);
    p.style.setProperty('--c',n.color);
    p.innerHTML=`<h3>Edit stage <button id="iX" aria-label="Close">×</button></h3>
    <div class="f"><label>Name</label><input type="text" id="iTitle" value="${esc(n.title)}"></div>
    <div class="f"><label>Description</label><textarea id="iDesc" rows="3">${esc(n.desc)}</textarea></div>
    <div class="f"><label>Icon</label><div class="icons">${ICONS.map(i=>`<button data-icon="${i}" class="${i===n.icon?'on':''}">${i}</button>`).join('')}</div></div>
    <div class="f"><label>Color</label><div class="swatches">${COLORS.map(c=>`<button style="--c:${c}" data-color="${c}" class="${c===n.color?'on':''}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="f"><label>Customers at this stage</label><input type="number" min="0" id="iUsers" value="${n.users}"></div>
    <div class="f"><label>Customer mood <em id="iFace">${FACES[n.mood-1]}</em></label><input type="range" min="1" max="5" id="iMood" value="${n.mood}"><div class="faces">${FACES.map(f=>`<span>${f}</span>`).join('')}</div></div>
    <div class="f"><label>Touchpoints</label><div class="chips">${n.tp.map((t,i)=>`<span class="chip" style="--c:${n.color}">${esc(t)}<button data-rmtp="${i}" aria-label="Remove">×</button></span>`).join('')}</div><input type="text" id="iTp" placeholder="Add touchpoint, press Enter"></div>
    <button class="btn danger" id="iDel"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete stage</button>`;
    const up=(fn)=>e=>{fn(n,e.target);paintNode(n);measure();drawEdges();syncUI()};
    $('#iTitle').oninput=up((n,t)=>n.title=t.value);
    $('#iDesc').oninput=up((n,t)=>n.desc=t.value);
    $('#iUsers').oninput=e=>{n.users=Math.max(0,+e.target.value||0);refreshAllNodes();syncUI()};
    $('#iMood').oninput=e=>{n.mood=+e.target.value;$('#iFace').textContent=FACES[n.mood-1];paintNode(n);syncUI()};
    ['#iTitle','#iDesc','#iUsers','#iMood'].forEach(s=>$(s).onchange=commit);
    $('#iTp').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){n.tp.push(e.target.value.trim());commit();paintNode(n);measure();drawEdges();renderInsp();$('#iTp').focus()}};
    p.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{n.icon=b.dataset.icon;commit();paintNode(n);renderInsp()});
    p.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{n.color=b.dataset.color;commit();paintNode(n);drawEdges();renderInsp();syncUI()});
    p.querySelectorAll('[data-rmtp]').forEach(b=>b.onclick=()=>{n.tp.splice(+b.dataset.rmtp,1);commit();paintNode(n);measure();drawEdges();renderInsp()});
    $('#iDel').onclick=()=>removeSel();
  }else{
    const e=edgeById(sel.id),f=nodeById(e.from),t=nodeById(e.to);
    p.innerHTML=`<h3>Edit connection <button id="iX" aria-label="Close">×</button></h3>
    <div class="flowline"><span>${esc(f.icon)} ${esc(f.title)}</span>→<span>${esc(t.icon)} ${esc(t.title)}</span></div>
    <div class="f"><label>Label <em>e.g. conversion rate</em></label><input type="text" id="eLbl" value="${esc(e.label||'')}" placeholder="No label"></div>
    <div class="row2" style="margin-bottom:12px"><button class="btn" id="eRev">⇄ Reverse</button></div>
    <button class="btn danger" id="iDel"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete connection</button>`;
    $('#eLbl').oninput=ev=>{e.label=ev.target.value;drawEdges()};
    $('#eLbl').onchange=commit;
    $('#eRev').onclick=()=>{[e.from,e.to]=[e.to,e.from];commit();drawEdges();renderInsp()};
    $('#iDel').onclick=()=>removeSel();
  }
  $('#iX').onclick=()=>select(null);
}

/* ---------- mutations ---------- */
function addStage(x,y,opts={}){
  const c=COLORS[S.nodes.length%COLORS.length];
  const n={id:uid(),x:Math.round(x/10)*10,y:Math.round(y/10)*10,title:'New stage',desc:'Describe what the customer does here.',icon:ICONS[S.nodes.length%ICONS.length],color:c,users:0,mood:3,tp:[],...opts};
  S.nodes.push(n);paintNode(n);measure();commit();return n;
}
function addEdge(from,to){
  if(from===to)return toast('A stage can’t connect to itself');
  if(S.edges.some(e=>e.from===from&&e.to===to))return toast('Those stages are already connected');
  const e={id:uid(),from,to,label:''};S.edges.push(e);commit();return e;
}
function removeSel(){
  if(!sel)return;
  if(sel.type==='node'){
    const id=sel.id;S.nodes=S.nodes.filter(n=>n.id!==id);S.edges=S.edges.filter(e=>e.from!==id&&e.to!==id);
  }else S.edges=S.edges.filter(e=>e.id!==sel.id);
  sel=null;commit();rebuild();toast('Deleted');
}
function autoLayout(){
  if(!S.nodes.length)return;
  measure();
  const N=S.nodes.length,depth={};S.nodes.forEach(n=>depth[n.id]=0);
  for(let i=0;i<N;i++)S.edges.forEach(e=>{if(depth[e.to]<depth[e.from]+1&&depth[e.from]+1<N)depth[e.to]=depth[e.from]+1});
  const cols={};S.nodes.forEach(n=>(cols[depth[n.id]]??=[]).push(n));
  const target={};
  Object.keys(cols).forEach(d=>{
    const g=cols[d].sort((a,b)=>a.y-b.y),gap=50,tot=g.reduce((s,n)=>s+n.h,0)+gap*(g.length-1);
    let y=-tot/2+200;g.forEach(n=>{target[n.id]={x:d*330,y:Math.round(y/10)*10};y+=n.h+gap});
  });
  const start=S.nodes.map(n=>({n,x:n.x,y:n.y})),st=performance.now();
  (function step(now){const p=Math.min(1,(now-st)/500),e=1-Math.pow(1-p,3);
    start.forEach(s=>{const t=target[s.n.id];s.n.x=s.x+(t.x-s.x)*e;s.n.y=s.y+(t.y-s.y)*e;const el=els.get(s.n.id);el.style.left=s.n.x+'px';el.style.top=s.n.y+'px'});
    drawEdges();
    if(p<1)requestAnimationFrame(step);else{commit();refreshAllNodes();fit()}})(st);
}

/* ---------- pointer interactions ---------- */
let drag=null,pan=null,link=null;
stage.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const t=e.target;
  if(t.isContentEditable&&t.getAttribute('contenteditable')==='true')return;
  const port=t.closest('.port');
  if(port){e.preventDefault();startLink(e,port);return}
  const del=t.closest('[data-del]');
  if(del){return}
  const nodeEl=t.closest('.node');
  if(nodeEl){
    const n=nodeById(nodeEl.dataset.id);
    if(!sel||sel.type!=='node'||sel.id!==n.id)select({type:'node',id:n.id});
    const el=els.get(n.id);
    drag={n,el,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false};
    stage.setPointerCapture(e.pointerId);
    return;
  }
  const eid=t.closest('[data-eid]');
  if(eid){select({type:'edge',id:eid.dataset.eid});return}
  pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};
  stage.setPointerCapture(e.pointerId);stage.classList.add('panning');
});
stage.addEventListener('pointermove',e=>{
  if(drag){
    const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(dx,dy)*view.k<3)return;
    if(!drag.moved){drag.moved=true;drag.el.classList.add('drag')}
    const snapv=e.altKey?1:10;
    drag.n.x=Math.round((drag.ox+dx)/snapv)*snapv;drag.n.y=Math.round((drag.oy+dy)/snapv)*snapv;
    drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';drawEdges();
  }else if(pan){
    const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;
    if(Math.hypot(dx,dy)>3)pan.moved=true;
    view.x=pan.vx+dx;view.y=pan.vy+dy;applyView();
  }else if(link){moveLink(e)}
});
function endPointer(e){
  if(drag){drag.el.classList.remove('drag');if(drag.moved){commit();refreshAllNodes();syncUI()}drag=null}
  if(pan){stage.classList.remove('panning');if(!pan.moved)select(null);pan=null}
  if(link)finishLink(e);
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',e=>{if(link){cancelLink()}drag=null;pan=null;stage.classList.remove('panning')});

function startLink(e,port){
  const n=nodeById(port.closest('.node').dataset.id),side=port.dataset.port;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','temp');
  svg.appendChild(path);
  link={n,side,path,sx:e.clientX,sy:e.clientY,target:null};
  document.body.classList.add('linking');
  stage.setPointerCapture(e.pointerId);
  moveLink(e);
}
function moveLink(e){
  const a=portPos(link.n,link.side),b=toWorld(e.clientX,e.clientY);
  link.path.setAttribute('d',link.side==='out'?bez(a,b):bez(b,a));
  const el=document.elementFromPoint(e.clientX,e.clientY),ne=el&&el.closest('.node');
  const id=ne&&ne.dataset.id!==link.n.id?ne.dataset.id:null;
  if(id!==link.target){
    if(link.target)els.get(link.target)?.classList.remove('target');
    link.target=id;if(id)els.get(id).classList.add('target');
  }
}
function cancelLink(){
  if(!link)return;
  if(link.target)els.get(link.target)?.classList.remove('target');
  link.path.remove();link=null;document.body.classList.remove('linking');
}
function finishLink(e){
  const l=link;const target=l.target;
  const far=Math.hypot(e.clientX-l.sx,e.clientY-l.sy)>90;
  const w=toWorld(e.clientX,e.clientY);
  cancelLink();
  if(target){
    const ed=l.side==='out'?addEdge(l.n.id,target):addEdge(target,l.n.id);
    if(ed){select({type:'edge',id:ed.id});drawEdges()}
  }else if(far){
    // dropped on empty canvas: spawn a connected stage
    const out=l.side==='out',nn=addStage(out?w.x+20:w.x-W-20,w.y-60);
    const ed=out?addEdge(l.n.id,nn.id):addEdge(nn.id,l.n.id);
    select({type:'node',id:nn.id});drawEdges();toast('New stage created and connected');
  }
}

stage.addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){S.edges=S.edges.filter(x=>x.id!==d.dataset.del);sel=null;commit();rebuild();toast('Connection removed')}
});
stage.addEventListener('dblclick',e=>{
  const f=e.target.closest('[data-f]');
  if(f){startEdit(f);return}
  const lb=e.target.closest('.lbl');
  if(lb){select({type:'edge',id:lb.dataset.eid});setTimeout(()=>$('#eLbl')?.focus(),50);return}
  if(!e.target.closest('.node')&&!e.target.closest('[data-eid]')){
    const w=toWorld(e.clientX,e.clientY);const n=addStage(w.x-W/2,w.y-60);select({type:'node',id:n.id});
  }
});
function startEdit(f){
  const el=f.closest('.node'),n=nodeById(el.dataset.id),field=f.dataset.f,orig=n[field];
  if(field==='desc'&&!orig)f.textContent='';
  f.contentEditable='true';f.focus();
  const r=document.createRange();r.selectNodeContents(f);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const done=ok=>{
    f.removeEventListener('blur',onBlur);f.removeEventListener('keydown',onKey);
    f.contentEditable='false';
    if(ok){const v=f.innerText.replace(/\n+/g,' ').trim();n[field]=field==='title'?(v||'Untitled'):v}
    commit();paintNode(n);measure();drawEdges();
    if(sel&&sel.type==='node'&&sel.id===n.id)renderInsp();
  };
  const onBlur=()=>done(true);
  const onKey=e=>{
    if(e.key==='Enter'&&(field==='title'||!e.shiftKey)){e.preventDefault();f.blur()}
    else if(e.key==='Escape'){e.preventDefault();f.removeEventListener('blur',onBlur);done(false)}
    else{setTimeout(()=>{n.h=el.offsetHeight;drawEdges()},0)}
    e.stopPropagation();
  };
  f.addEventListener('blur',onBlur);f.addEventListener('keydown',onKey);
}
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.shiftKey){view.x-=e.deltaY;view.y-=e.deltaX;applyView();return}
  const f=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015));
  zoomAt(e.clientX,e.clientY,view.k*f);
},{passive:false});

/* ---------- toolbar ---------- */
$('#bAdd').onclick=()=>{
  const c=toWorld(innerWidth/2,innerHeight/2);
  let x=c.x-W/2,y=c.y-80;
  while(S.nodes.some(n=>Math.abs(n.x-x)<40&&Math.abs(n.y-y)<40)){x+=30;y+=30}
  const n=addStage(x,y);select({type:'node',id:n.id});
  setTimeout(()=>{const i=$('#iTitle');if(i){i.focus();i.select()}},60);
};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bLayout').onclick=autoLayout;$('#bFit').onclick=()=>fit();
$('#zIn').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.k*1.2);
$('#zOut').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.k/1.2);
$('#jname').oninput=e=>{S.name=e.target.value};
$('#jname').onchange=commit;
$('#jname').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
$('#bExport').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download=(S.name||'journey').replace(/\W+/g,'-').toLowerCase()+'.json';a.click();toast('Exported JSON');
};
$('#bImport').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    try{const d=JSON.parse(t);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;
      d.nodes.forEach(n=>{n.tp=n.tp||[];n.mood=n.mood||3;n.users=n.users||0;n.color=n.color||COLORS[0];n.icon=n.icon||'⭐'});
      S=d;sel=null;rebuild();commit();fit(false);toast('Imported')}
    catch{toast('Invalid journey file')}
    e.target.value='';
  });
};
$('#bReset').onclick=()=>{
  if(!confirm('Reset to the sample journey? Your current diagram will be replaced (undo is available).'))return;
  S=sample();sel=null;rebuild();commit();fit();
};
$('#hintX').onclick=()=>{$('#hint').style.opacity=0;$('#hint').style.pointerEvents='none';localStorage.setItem('cjf-hint','1')};
if(localStorage.getItem('cjf-hint'))$('#hint').style.display='none';

addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.isContentEditable)return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(e.key==='Delete'||e.key==='Backspace'){if(sel){e.preventDefault();removeSel()}}
  else if(e.key==='Escape')select(null);
  else if(!mod&&e.key.toLowerCase()==='n')$('#bAdd').click();
  else if(!mod&&e.key.toLowerCase()==='f')fit();
  else if(e.key==='Enter'&&sel&&sel.type==='node'){const f=els.get(sel.id).querySelector('.n-title');startEdit(f)}
});
addEventListener('resize',()=>{});

/* ---------- boot ---------- */
(function init(){
  try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):sample();if(!S.nodes||!S.edges)throw 0}catch{S=sample()}
  hist=[snap()];hi=0;
  rebuild();
  document.fonts&&document.fonts.ready.then(()=>{measure();drawEdges()});
  fit(false);
})();
})();
</script>
</body>
</html>
