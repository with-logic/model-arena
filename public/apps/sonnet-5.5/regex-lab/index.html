<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex Lab — a terminal regex playground</title>
<style>
:root{
  --font: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", monospace;
  --g0:#ff7b72; --g1:#58a6ff; --g2:#3fb950; --g3:#d2a8ff; --g4:#ffa657; --g5:#39c5cf; --g6:#f778ba; --g7:#e3b341;
}
html[data-theme="dark"]{
  --page:#05070b; --bg:#0d1117; --bg2:#10161e; --bar:#161b22; --line:#262d38; --fg:#d7dde6; --dim:#7d8896;
  --accent:#3fb950; --accent2:#58a6ff; --err:#ff7b72; --input:#0a0e14; --mA:#58a6ff; --mB:#e3b341;
  --shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #000; --glow:rgba(63,185,80,.15);
}
html[data-theme="light"]{
  --page:#dfe5ec; --bg:#fbfbfa; --bg2:#f3f4f2; --bar:#e8eaed; --line:#d3d8de; --fg:#24292f; --dim:#6a737d;
  --accent:#1a7f37; --accent2:#0969da; --err:#cf222e; --input:#fff; --mA:#0969da; --mB:#bf8700;
  --shadow:0 20px 50px rgba(30,40,60,.2), 0 0 0 1px #c5cbd3; --glow:rgba(26,127,55,.12);
  --g0:#d1242f; --g1:#0969da; --g2:#1a7f37; --g3:#8250df; --g4:#bc4c00; --g5:#0a7d87; --g6:#bf3989; --g7:#9a6700;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.5;min-height:100vh;padding:22px;
  background-image:radial-gradient(ellipse at 50% -10%, var(--glow), transparent 60%);transition:background .25s,color .25s}
.win{max-width:1480px;margin:0 auto;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.titlebar{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f56}.dots i:nth-child(2){background:#ffbd2e}.dots i:nth-child(3){background:#27c93f}
.title{flex:1;text-align:center;color:var(--dim);font-size:12px;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;transition:.15s}
button:hover,select:hover{border-color:var(--accent2);color:var(--accent2)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
button.primary{background:var(--accent);color:#fff;border-color:transparent}
html[data-theme="dark"] button.primary{color:#04130a}
button.primary:hover{filter:brightness(1.1);color:inherit}
button.danger:hover{border-color:var(--err);color:var(--err)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0}
.col{padding:16px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.col+.col{border-left:1px solid var(--line);background:var(--bg2)}
@media(max-width:960px){main{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}body{padding:8px}}
h2{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px;text-transform:none}
h2 .p{color:var(--accent)}
h2 .sp{flex:1}
h2 .stat{font-weight:400;color:var(--dim)}
.patrow{display:flex;align-items:center;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:0 10px;transition:.15s}
.patrow:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 22%,transparent)}
.patrow.bad{border-color:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 20%,transparent)}
.patrow .sl{color:var(--dim);font-size:18px}
.patrow input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;padding:11px 6px}
.patrow .fl{color:var(--accent);font-size:16px;min-width:8px}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.flag{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;user-select:none;color:var(--dim);transition:.15s}
.flag b{color:var(--fg)}
.flag:hover{border-color:var(--accent2)}
.flag.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--fg)}
.flag.on b{color:var(--accent)}
.flag small{font-size:11px}
.err{border:1px solid var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);border-radius:8px;padding:10px 12px;color:var(--fg)}
.err .em{color:var(--err);font-weight:700}
.err pre{margin:8px 0 0;overflow-x:auto;font:inherit;font-size:14px;line-height:1.35}
.err .caret{color:var(--err);font-weight:700}
.err .hint{color:var(--dim);margin-top:6px;font-size:12px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.grp{margin-bottom:8px}
.grp .gl{font-size:11px;color:var(--dim);margin-bottom:4px}
.chips button{padding:2px 8px;font-size:12px}
.chips button code{color:var(--accent2)}
textarea{width:100%;min-height:230px;resize:vertical;background:var(--input);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.6;tab-size:4}
textarea:focus{border-color:var(--accent2);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 22%,transparent)}
.hl{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:90px;max-height:340px;overflow:auto;line-height:1.7;font-size:13.5px}
.hl .hm{border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl .m0{background:color-mix(in srgb,var(--mA) 28%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--mA) 55%,transparent)}
.hl .m1{background:color-mix(in srgb,var(--mB) 28%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--mB) 55%,transparent)}
.hl .g{box-shadow:none;border-bottom:2px solid currentColor}
.hl .g0{background:color-mix(in srgb,var(--g0) 42%,transparent);border-color:var(--g0)}
.hl .g1{background:color-mix(in srgb,var(--g1) 42%,transparent);border-color:var(--g1)}
.hl .g2{background:color-mix(in srgb,var(--g2) 42%,transparent);border-color:var(--g2)}
.hl .g3{background:color-mix(in srgb,var(--g3) 42%,transparent);border-color:var(--g3)}
.hl .g4{background:color-mix(in srgb,var(--g4) 42%,transparent);border-color:var(--g4)}
.hl .g5{background:color-mix(in srgb,var(--g5) 42%,transparent);border-color:var(--g5)}
.hl .g6{background:color-mix(in srgb,var(--g6) 42%,transparent);border-color:var(--g6)}
.hl .g7{background:color-mix(in srgb,var(--g7) 42%,transparent);border-color:var(--g7)}
.hl .hm.on{outline:2px solid var(--fg)}
.hl .empty{display:inline-block;width:0;height:1.2em;border-left:2px solid var(--err);vertical-align:text-bottom;margin:0 -1px}
.hl .ph{color:var(--dim)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tablewrap{background:var(--input);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--bar);text-align:left;color:var(--dim);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent2) 9%,transparent)}
td.n{color:var(--dim)}
td .v{white-space:pre-wrap;word-break:break-all}
.gv{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.gv + .gv{margin-top:2px}
.gv em{font-style:normal;color:var(--dim)}
.undef{color:var(--dim);font-style:italic}
.ws{color:var(--dim)}
.explain{display:flex;flex-direction:column;gap:3px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto}
.ex{display:flex;gap:12px;align-items:baseline;border-left:3px solid transparent;padding-left:8px}
.ex code{flex:none;color:var(--accent2);background:color-mix(in srgb,var(--accent2) 12%,transparent);border-radius:4px;padding:0 6px;white-space:pre;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.ex span{color:var(--fg);min-width:0}
.ex.q code{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ex.a code{color:var(--mB);background:color-mix(in srgb,var(--mB) 14%,transparent)}
.ex.bad code{color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
.ex.l code{color:var(--fg);background:color-mix(in srgb,var(--dim) 18%,transparent)}
.empty-note{color:var(--dim);font-style:italic;padding:4px 2px}
.status{display:flex;gap:16px;padding:6px 14px;background:var(--bar);border-top:1px solid var(--line);color:var(--dim);font-size:12px;flex-wrap:wrap}
.status .ok{color:var(--accent)} .status .bad{color:var(--err)}
.status .sp{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--accent);color:#04130a;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;font-weight:600;z-index:9}
html[data-theme="light"] .toast{color:#fff}
.toast.show{opacity:1;transform:translate(-50%,0)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--dim)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--accent);vertical-align:text-bottom;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="title">regex-lab — zsh — <span id="ttl">/ /</span></div>
    <div class="tools">
      <select id="examples" aria-label="Load example"><option value="">Examples…</option></select>
      <button id="copyLink" class="primary" title="Copy a permalink with pattern, flags and text">⎘ Copy link</button>
      <button id="copyRe" title="Copy /pattern/flags">Copy /re/</button>
      <button id="clear" class="danger" title="Clear pattern and test text">✕ Clear</button>
      <button id="theme" title="Toggle light / dark">☀ Light</button>
    </div>
  </div>

  <main>
    <section class="col">
      <div>
        <h2><span class="p">$</span> pattern <span class="sp"></span><span class="stat" id="gcount"></span></h2>
        <div class="patrow" id="patrow">
          <span class="sl">/</span>
          <input id="pat" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="enter a regular expression" aria-label="Regular expression pattern">
          <span class="sl">/</span><span class="fl" id="flOut"></span>
        </div>
        <div class="flags" id="flags"></div>
      </div>
      <div id="errbox" class="err hidden" role="alert"></div>
      <div>
        <h2><span class="p">$</span> quick insert <span class="stat">(select text to wrap it)</span></h2>
        <div id="quick"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column">
        <h2><span class="p">$</span> test string <span class="sp"></span><span class="stat" id="tcount"></span></h2>
        <textarea id="txt" spellcheck="false" placeholder="paste or type text to test against…" aria-label="Test text"></textarea>
      </div>
    </section>

    <section class="col">
      <div>
        <h2><span class="p">$</span> matches <span class="sp"></span><span class="stat" id="mcount"></span></h2>
        <div class="hl" id="hl"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div>
        <h2><span class="p">$</span> match table</h2>
        <div class="tablewrap" id="tbl"></div>
      </div>
      <div>
        <h2><span class="p">$</span> explain</h2>
        <div class="explain" id="exp"></div>
      </div>
    </section>
  </main>
  <div class="status"><span id="st" class="ok">● ready</span><span class="sp"></span><span>live · hash permalink · <kbd>g</kbd><kbd>i</kbd><kbd>m</kbd><kbd>s</kbd><kbd>u</kbd><kbd>y</kbd></span><span class="cursor"></span></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIMIT = 1000, ROWS = 300;
const FLAGS = [
  ['g','global','Find all matches, not just the first'],
  ['i','ignore case','Case-insensitive matching'],
  ['m','multiline','^ and $ match at line breaks'],
  ['s','dotAll','. also matches newlines'],
  ['u','unicode','Full Unicode mode, stricter syntax'],
  ['y','sticky','Match only at lastIndex']
];
const state = { flags:new Set(['g']) };
const pat = $('#pat'), txt = $('#txt');

/* ---------- examples ---------- */
const EXAMPLES = [
  {n:'Emails (named groups)', p:'(?<user>[\\w.+-]+)@(?<domain>[\\w-]+\\.[\\w.]+)', f:'gi', t:'Contact: alice@example.com, bob.smith+tag@mail.co.uk\nor reach support@regex-lab.dev. Not an email: foo@bar'},
  {n:'ISO dates', p:'(?<y>\\d{4})-(?<m>0[1-9]|1[0-2])-(?<d>0[1-9]|[12]\\d|3[01])', f:'g', t:'Released 2024-03-15, patched 2024-04-02.\nInvalid: 2024-13-45. Next: 2025-01-31.'},
  {n:'URLs', p:'(https?):\\/\\/([^\\s/:]+)(?::(\\d+))?(\\/[^\\s?#]*)?(\\?[^\\s#]*)?', f:'g', t:'Docs at https://developer.mozilla.org/en-US/docs/Web?q=regex and http://localhost:8080/api/v1/users.\nftp://nope.example.com is skipped.'},
  {n:'Hex colors', p:'#(?:[0-9a-f]{3}){1,2}\\b', f:'gi', t:'primary: #ff7b72; accent: #3fb; bg: #0D1117; bad: #12345; text: #FFF'},
  {n:'Repeated words (backref)', p:'\\b(\\w+)\\s+\\1\\b', f:'gi', t:'This is is a test of the the emergency broadcast.\nNo no duplicates here? Yes yes.'},
  {n:'Password check (lookahead)', p:'^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^\\w\\s]).{8,}$', f:'gm', t:'Passw0rd!\nweakpass\nSTRONG1234!\nGood#Pass9'},
  {n:'Phone numbers', p:'\\(?(\\d{3})\\)?[-.\\s]?(\\d{3})[-.\\s]?(\\d{4})', f:'g', t:'Call (415) 555-0132 or 415.555.0199\nAlso 800 555 0100 and 5551234567.'},
  {n:'Lookbehind prices', p:'(?<=\\$)\\d+(?:\\.\\d{2})?', f:'g', t:'Coffee $4.50, sandwich $12, juice €3.00, tip $2.25'}
];
EXAMPLES.forEach((e,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=e.n; $('#examples').appendChild(o); });

/* ---------- quick inserts ---------- */
const QUICK = [
  ['Character classes',[['\\d','digit'],['\\D','non-digit'],['\\w','word char'],['\\W','non-word'],['\\s','whitespace'],['\\S','non-space'],['.','any char'],['[A-Z]','uppercase'],['[a-z]','lowercase'],['[0-9]','digits'],['[^]','negated set','[^',']'],['[]','set','[',']'],['\\p{L}','unicode letter']]],
  ['Anchors',[['^','start'],['$','end'],['\\b','word boundary'],['\\B','non-boundary']]],
  ['Groups & lookaround',[['(…)','capture group','(',')'],['(?:…)','non-capturing','(?:',')'],['(?<name>…)','named group','(?<name>',')'],['(?=…)','lookahead','(?=',')'],['(?!…)','negative lookahead','(?!',')'],['(?<=…)','lookbehind','(?<=',')'],['(?<!…)','negative lookbehind','(?<!',')'],['a|b','alternation','|'],['\\1','backreference']]],
  ['Quantifiers',[['*','0 or more'],['+','1 or more'],['?','optional'],['{n}','exactly n','{3}'],['{n,m}','between n and m','{2,5}'],['*?','lazy 0+'],['+?','lazy 1+']]]
];
{
  const q = $('#quick');
  QUICK.forEach(([label, items])=>{
    const g=document.createElement('div'); g.className='grp';
    g.innerHTML=`<div class="gl">${esc(label)}</div><div class="chips"></div>`;
    const c=g.querySelector('.chips');
    items.forEach(([shown,tip,a,b])=>{
      const btn=document.createElement('button'); btn.type='button'; btn.title=tip;
      btn.innerHTML=`<code>${esc(shown)}</code>`;
      const before = a===undefined ? shown : a, after = b===undefined ? '' : b;
      btn.addEventListener('click',()=>insertToken(before,after));
      c.appendChild(btn);
    });
    q.appendChild(g);
  });
}
function insertToken(before, after){
  const s=pat.selectionStart ?? pat.value.length, e=pat.selectionEnd ?? s;
  const sel=pat.value.slice(s,e);
  pat.focus();
  pat.setRangeText(before+sel+after, s, e, 'end');
  if(!sel && after) { const pos=s+before.length; pat.setSelectionRange(pos,pos); }
  run();
}

/* ---------- flags UI ---------- */
function buildFlags(){
  const box=$('#flags'); box.innerHTML='';
  FLAGS.forEach(([k,name,tip])=>{
    const l=document.createElement('label'); l.className='flag'+(state.flags.has(k)?' on':''); l.title=tip;
    l.innerHTML=`<input type="checkbox" hidden ${state.flags.has(k)?'checked':''}><b>${k}</b><small>${name}</small>`;
    l.tabIndex=0;
    const toggle=ev=>{ ev.preventDefault(); state.flags.has(k)?state.flags.delete(k):state.flags.add(k); buildFlags(); run(); };
    l.addEventListener('click',toggle);
    l.addEventListener('keydown',ev=>{ if(ev.key===' '||ev.key==='Enter') toggle(ev); });
    box.appendChild(l);
  });
}
const flagStr = () => FLAGS.map(f=>f[0]).filter(k=>state.flags.has(k)).join('');

/* ---------- explanation ---------- */
const ESC_DESC = {d:'Any digit (0–9)',D:'Any character that is not a digit',w:'Any word character (letter, digit or _)',W:'Any non-word character',s:'Any whitespace character',S:'Any non-whitespace character',b:'Word boundary',B:'Not a word boundary',n:'Newline',r:'Carriage return',t:'Tab',v:'Vertical tab',f:'Form feed',0:'Null character'};
const CLS_DESC = {d:'a digit',D:'a non-digit',w:'a word character',W:'a non-word character',s:'whitespace',S:'non-whitespace',n:'newline',r:'carriage return',t:'tab',b:'backspace'};
const ord = n => n + (['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
function explain(src){
  const out=[], names=[null]; let i=0, depth=0, gc=0;
  const add=(tok,desc,o={})=>out.push(Object.assign({tok,desc,depth},o));
  const quantRe=/^\{(\d+)(,(\d*))?\}/;
  while(i<src.length){
    const c=src[i];
    if(c==='\\'){
      const n=src[i+1];
      if(n===undefined){ add('\\','Trailing backslash — nothing to escape',{cls:'bad'}); i++; continue; }
      let len=2, desc, cls='';
      const rest=src.slice(i+1);
      let m;
      if((m=/^[1-9]\d*/.exec(rest))){ len=1+m[0].length; desc=`Backreference — matches the same text as capture group ${m[0]}`; cls='a'; }
      else if((m=/^k<([^>]+)>/.exec(rest))){ len=1+m[0].length; desc=`Named backreference to group “${m[1]}”`; cls='a'; }
      else if((m=/^x[0-9a-fA-F]{2}/.exec(rest))){ len=1+m[0].length; desc=`Character with hex code ${m[0].slice(1)}`; }
      else if((m=/^u\{[0-9a-fA-F]+\}/.exec(rest))||(m=/^u[0-9a-fA-F]{4}/.exec(rest))){ len=1+m[0].length; desc=`Unicode character U+${m[0].replace(/[u{}]/g,'').toUpperCase()}`; }
      else if((m=/^[pP]\{[^}]*\}/.exec(rest))){ len=1+m[0].length; desc=`Unicode property ${n==='P'?'NOT ':''}“${m[0].slice(2,-1)}” (needs u flag)`; }
      else if((m=/^c[A-Za-z]/.exec(rest))){ len=3; desc=`Control character Ctrl+${m[0][1].toUpperCase()}`; }
      else if(ESC_DESC[n]!==undefined){ desc=ESC_DESC[n]; if('bB'.includes(n)) cls='a'; }
      else desc=`Literal “${n}” (escaped)`, cls='l';
      add(src.slice(i,i+len),desc,{cls}); i+=len; continue;
    }
    if(c==='['){
      let j=i+1; const neg=src[j]==='^'; if(neg) j++;
      const items=[]; let closed=false;
      while(j<src.length){
        if(src[j]===']'){closed=true;break;}
        let a;
        if(src[j]==='\\'){ const n=src[j+1]; a=src.slice(j,j+2); j+=2; if(n==='x'||n==='u'){ const mm=/^(x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})/.exec(src.slice(j-1)); if(mm){ a='\\'+mm[0]; j+=mm[0].length-1; } } }
        else { a=src[j]; j++; }
        if(src[j]==='-'&&src[j+1]!==undefined&&src[j+1]!==']'){
          let b; if(src[j+1]==='\\'){ b=src.slice(j+1,j+3); j+=3; } else { b=src[j+1]; j+=2; }
          items.push(`“${a.replace(/^\\/,'')}” to “${b.replace(/^\\/,'')}”`);
        } else if(a[0]==='\\'&&CLS_DESC[a[1]]) items.push(CLS_DESC[a[1]]);
        else items.push(`“${a.replace(/^\\(?=.)/,'')}”`);
      }
      const end=closed?j+1:src.length;
      let desc;
      if(!closed) desc='Unterminated character set';
      else if(!items.length) desc=neg?'Any character (including newlines)':'Empty set — never matches';
      else desc=(neg?'Any character except: ':'Any one of: ')+items.join(', ');
      add(src.slice(i,end),desc,{cls:closed?'':'bad'}); i=end; continue;
    }
    if(c==='('){
      const rest=src.slice(i); let m, tok, desc, cls='';
      if((m=/^\(\?<=/.exec(rest))){ tok=m[0]; desc='Positive lookbehind — preceded by…'; cls='a'; }
      else if((m=/^\(\?<!/.exec(rest))){ tok=m[0]; desc='Negative lookbehind — NOT preceded by…'; cls='a'; }
      else if((m=/^\(\?<([A-Za-z_$][\w$]*)>/.exec(rest))){ tok=m[0]; gc++; names[gc]=m[1]; desc=`Start of named capture group #${gc} “${m[1]}”`; cls='g'+((gc-1)%8); }
      else if((m=/^\(\?:/.exec(rest))){ tok=m[0]; desc='Start of non-capturing group'; }
      else if((m=/^\(\?=/.exec(rest))){ tok=m[0]; desc='Positive lookahead — followed by…'; cls='a'; }
      else if((m=/^\(\?!/.exec(rest))){ tok=m[0]; desc='Negative lookahead — NOT followed by…'; cls='a'; }
      else { tok='('; gc++; names[gc]=null; desc=`Start of capture group #${gc}`; cls='g'+((gc-1)%8); }
      add(tok,desc,{cls}); depth++; i+=tok.length; continue;
    }
    if(c===')'){ depth=Math.max(0,depth-1); add(')','End of group'); i++; continue; }
    if(c==='|'){ add('|','Alternation — match either the left or the right side',{cls:'a'}); i++; continue; }
    if(c==='^'){ add('^','Start of input (or line with m flag)',{cls:'a'}); i++; continue; }
    if(c==='$'){ add('$','End of input (or line with m flag)',{cls:'a'}); i++; continue; }
    if(c==='.'){ add('.','Any character except line breaks (with s flag: any character)'); i++; continue; }
    let q=null, qlen=0, m;
    if(c==='*'){q='Zero or more times';qlen=1}
    else if(c==='+'){q='One or more times';qlen=1}
    else if(c==='?'){q='Optional (zero or one time)';qlen=1}
    else if(c==='{'&&(m=quantRe.exec(src.slice(i)))){
      qlen=m[0].length;
      q = m[2]===undefined ? `Exactly ${m[1]} time${m[1]==='1'?'':'s'}` : (m[3]==='' ? `${m[1]} or more times` : `Between ${m[1]} and ${m[3]} times`);
    }
    if(q){
      let lazy=false; if(src[i+qlen]==='?'){lazy=true;qlen++;}
      add(src.slice(i,i+qlen), q+' of the previous token — '+(lazy?'lazy (as few as possible)':'greedy (as many as possible)'),{cls:'q'}); i+=qlen; continue;
    }
    // literal run
    let j=i, run='';
    while(j<src.length && !'\\[()|^$.*+?'.includes(src[j]) && !(src[j]==='{'&&quantRe.test(src.slice(j)))){
      const nx=src[j+1];
      if(run && (nx==='*'||nx==='+'||nx==='?'||(nx==='{'&&quantRe.test(src.slice(j+1))))) break;
      run+=src[j]; j++;
      if(nx==='*'||nx==='+'||nx==='?'||(nx==='{'&&quantRe.test(src.slice(j)))) break;
    }
    if(!run){ run=src[i]; j=i+1; }
    add(run, run===' '?'Literal space':`Literal text “${run}”`,{cls:'l'}); i=j;
  }
  return {out,names,gc};
}

/* ---------- error caret ---------- */
function errorPos(p, flags, msg){
  const stack=[]; let inCls=-1, canRep=false;
  const uni=flags.includes('u');
  for(let i=0;i<p.length;i++){
    const c=p[i];
    if(c==='\\'){ if(i===p.length-1) return i; i++; canRep=true; continue; }
    if(inCls>=0){ if(c===']') {inCls=-1; canRep=true;} continue; }
    if(c==='['){ inCls=i; continue; }
    if(c==='('){ stack.push(i); canRep=false; if(p[i+1]==='?'){ if(p[i+2]===':'||p[i+2]==='='||p[i+2]==='!') i+=2; else if(p[i+2]==='<'&&(p[i+3]==='='||p[i+3]==='!')) i+=3; else if(p[i+2]==='<'){ const e=p.indexOf('>',i); if(e>0) i=e; } if(/^\(\?[=!]/.test(p.slice(stack[stack.length-1]))===false) {} } continue; }
    if(c===')'){ if(!stack.length) return i; stack.pop(); canRep=true; continue; }
    if(c==='|'){ canRep=false; continue; }
    if(c==='^'){ canRep=false; continue; }
    if(c==='*'||c==='+'||c==='?'){ if(!canRep) return i; if(p[i+1]==='?') i++; else canRep=false; if(c==='?'&&false) {} ; canRep=false; continue; }
    if(c==='{' && uni){ return i; }
    canRep=true;
  }
  if(inCls>=0) return inCls;
  if(stack.length) return stack[stack.length-1];
  for(let i=1;i<=p.length;i++){
    try{ new RegExp(p.slice(0,i),flags); }
    catch(e){ if(!/nterminated|nmatched|end of pattern|Incomplete|\\ at end/.test(e.message)) return i-1; }
  }
  return Math.max(0,p.length-1);
}
function showError(e,p,f){
  const pos=errorPos(p,f,e.message);
  const msg=e.message.replace(/^Invalid regular expression: /,'');
  const box=$('#errbox');
  box.classList.remove('hidden');
  box.innerHTML=`<div><span class="em">✖ SyntaxError</span> ${esc(msg)}</div>
<pre>/${esc(p)}/${esc(f)}\n${' '.repeat(pos+1)}<span class="caret">^</span> <span class="caret">position ${pos+1}${p[pos]!==undefined?` (“${esc(p[pos])}”)`:''}</span></pre>
<div class="hint">The caret marks the most likely culprit; engines don't always report an exact position.</div>`;
  $('#patrow').classList.add('bad');
}

/* ---------- main run ---------- */
const GROUP_VAR = g => 'g'+((g-1)%8);
let lastMatches=[], lastNames=[null];

function visible(s){
  return esc(s).replace(/\n/g,'<span class="ws">↵</span>').replace(/\t/g,'<span class="ws">→</span>').replace(/ /g,'<span class="ws">·</span>');
}
function run(){
  const p=pat.value, text=txt.value, f=flagStr();
  $('#flOut').textContent=f;
  $('#ttl').textContent='/'+p+'/'+f;
  $('#tcount').textContent=`${text.length} chars · ${text?text.split('\n').length:0} lines`;
  scheduleHash();
  const errbox=$('#errbox'); errbox.classList.add('hidden'); $('#patrow').classList.remove('bad');
  const ex=explain(p);
  lastNames=ex.names;
  $('#gcount').textContent = p ? `${ex.gc} capture group${ex.gc===1?'':'s'}` : '';
  renderExplain(ex,p);
  const st=$('#st');
  if(!p){
    $('#hl').innerHTML='<span class="ph">Enter a pattern to see matches highlighted here.</span>';
    $('#tbl').innerHTML='<div class="empty-note" style="padding:12px">No pattern.</div>';
    $('#legend').innerHTML=''; $('#mcount').textContent='';
    st.className='ok'; st.textContent='● ready';
    return;
  }
  let re, hasD=true;
  try{ re=new RegExp(p,f+'d'); }
  catch(e1){
    try{ re=new RegExp(p,f); hasD=false; }
    catch(e){
      showError(e,p,f);
      $('#hl').innerHTML='<span class="ph">Fix the pattern to see matches.</span>';
      $('#tbl').innerHTML='<div class="empty-note" style="padding:12px">Invalid pattern.</div>';
      $('#legend').innerHTML=''; $('#mcount').textContent='';
      st.className='bad'; st.textContent='● invalid pattern';
      return;
    }
  }
  const ms=[]; let truncated=false; const t0=performance.now();
  try{
    if(!re.global){ re.lastIndex=0; const m=re.exec(text); if(m) ms.push(m); }
    else{
      let m;
      while((m=re.exec(text))){
        ms.push(m);
        if(m[0]===''){
          const cp=text.codePointAt(re.lastIndex);
          re.lastIndex+= (f.includes('u')&&cp>0xffff)?2:1;
        }
        if(ms.length>=LIMIT){truncated=true;break;}
      }
    }
  }catch(e){ showError(e,p,f); return; }
  const dt=performance.now()-t0;
  lastMatches=ms;
  const ng=ms.length&&ms[0].length-1 || ex.gc;
  $('#mcount').textContent=`${ms.length}${truncated?'+':''} match${ms.length===1?'':'es'} · ${dt<0.1?'<0.1':dt.toFixed(1)} ms`;
  renderHL(text,ms,ex.names,ng);
  renderTable(ms,ex.names,ng,truncated);
  st.className=ms.length?'ok':'';
  st.textContent=ms.length?`● ${ms.length}${truncated?'+':''} match${ms.length===1?'':'es'}`:'● no matches';
}

function renderExplain(ex,p){
  const box=$('#exp');
  if(!p){ box.innerHTML='<div class="empty-note">Type a pattern and each token is explained here.</div>'; return; }
  box.innerHTML=ex.out.map(r=>{
    const gcls=/^g\d$/.test(r.cls||'');
    const style=(r.depth?`margin-left:${r.depth*20}px;`:'')+(gcls?`border-left-color:var(--${r.cls});`:'');
    return `<div class="ex ${gcls?'':(r.cls||'')}" style="${style}"><code>${esc(r.tok)}</code><span>${esc(r.desc)}</span></div>`;
  }).join('');
}

function renderHL(text,ms,names,ng){
  const hl=$('#hl'), lg=$('#legend');
  if(!text){ hl.innerHTML='<span class="ph">Add some test text on the left.</span>'; lg.innerHTML=''; return; }
  if(!ms.length){ hl.innerHTML=esc(text)+'​'; lg.innerHTML='<span>no matches</span>'; return; }
  const n=text.length, mi=new Int32Array(n).fill(-1), gi=new Int16Array(n).fill(-1), empties=new Set();
  ms.forEach((m,k)=>{
    const s=m.index, e=s+m[0].length;
    for(let x=s;x<e;x++) mi[x]=k;
    if(s===e) empties.add(s);
    if(m.indices){
      const gs=[];
      for(let g=1;g<m.indices.length;g++){ const r=m.indices[g]; if(r&&r[1]>r[0]) gs.push([r[0],r[1],g]); }
      gs.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0])||a[2]-b[2]);
      for(const [a,b,g] of gs) for(let x=a;x<b;x++) gi[x]=g;
    }
  });
  let html='', x=0;
  const label=(k,g)=>`Match ${k+1}`+(g>0?` · group ${names[g]?names[g]+' (#'+g+')':'#'+g}`:'');
  while(x<=n){
    if(empties.has(x)) html+='<span class="empty" title="Empty match"></span>';
    if(x===n) break;
    const a=mi[x], b=gi[x]; let y=x+1;
    while(y<n && mi[y]===a && gi[y]===b && !empties.has(y)) y++;
    const seg=esc(text.slice(x,y));
    if(a<0&&b<0) html+=seg;
    else html+=`<span class="hm m${a%2}${b>0?' g '+GROUP_VAR(b):''}" data-m="${a}" title="${esc(label(a,b))}">${seg}</span>`;
    x=y;
  }
  hl.innerHTML=html+'​';
  let leg='';
  for(let g=1;g<=ng;g++) leg+=`<span><i class="dot" style="background:var(--${GROUP_VAR(g)})"></i>${names[g]?esc(names[g])+' ':''}#${g}</span>`;
  lg.innerHTML=`<span><i class="dot" style="background:var(--mA)"></i>match A</span><span><i class="dot" style="background:var(--mB)"></i>match B</span>`+leg;
}

function renderTable(ms,names,ng,truncated){
  const box=$('#tbl');
  if(!ms.length){ box.innerHTML='<div class="empty-note" style="padding:12px">No matches.</div>'; return; }
  let h='<table><thead><tr><th>#</th><th>Match</th><th>Index</th><th>Groups</th></tr></thead><tbody>';
  ms.slice(0,ROWS).forEach((m,k)=>{
    const s=m.index, e=s+m[0].length;
    let gs='';
    for(let g=1;g<m.length;g++){
      const v=m[g], r=m.indices&&m.indices[g];
      gs+=`<div class="gv"><i class="dot" style="background:var(--${GROUP_VAR(g)})"></i><em>${names[g]?esc(names[g])+' ':''}$${g}</em>`+
        (v===undefined?'<span class="undef">undefined</span>':`<span class="v">${visible(v)||'<span class="undef">(empty)</span>'}</span>`)+
        (r?`<em>[${r[0]}–${r[1]}]</em>`:'')+`</div>`;
    }
    h+=`<tr data-m="${k}"><td class="n">${k+1}</td><td><span class="v">${m[0]===''?'<span class="undef">(empty)</span>':visible(m[0])}</span></td><td>${s}–${e}<br><span class="ws">len ${m[0].length}</span></td><td>${gs||'<span class="ws">—</span>'}</td></tr>`;
  });
  h+='</tbody></table>';
  if(ms.length>ROWS||truncated) h+=`<div class="empty-note" style="padding:8px 10px">Showing first ${Math.min(ROWS,ms.length)} of ${ms.length}${truncated?'+':''} matches.</div>`;
  box.innerHTML=h;
}

/* hover linking: table row <-> highlight */
$('#tbl').addEventListener('mouseover',e=>{
  const tr=e.target.closest('tr[data-m]'); document.querySelectorAll('.hm.on').forEach(x=>x.classList.remove('on'));
  if(tr) document.querySelectorAll(`.hm[data-m="${tr.dataset.m}"]`).forEach(x=>x.classList.add('on'));
});
$('#tbl').addEventListener('mouseleave',()=>document.querySelectorAll('.hm.on').forEach(x=>x.classList.remove('on')));

/* ---------- permalink ---------- */
let hashTimer=null, settingHash=false;
function buildHash(includeText=true){
  const u=new URLSearchParams();
  u.set('p',pat.value); u.set('f',flagStr());
  if(includeText && txt.value && txt.value.length<=2000) u.set('t',txt.value);
  return '#'+u.toString();
}
function scheduleHash(){
  clearTimeout(hashTimer);
  hashTimer=setTimeout(()=>{
    try{ settingHash=true; history.replaceState(null,'',buildHash()); }catch(e){}
    setTimeout(()=>settingHash=false,0);
  },250);
}
function loadHash(){
  const h=location.hash.replace(/^#/,''); if(!h) return false;
  const u=new URLSearchParams(h);
  if(!u.has('p')&&!u.has('f')&&!u.has('t')) return false;
  pat.value=u.get('p')||'';
  state.flags=new Set((u.get('f')||'').split('').filter(c=>FLAGS.some(f=>f[0]===c)));
  if(u.has('t')) txt.value=u.get('t');
  return true;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }
async function copy(s,msg){
  try{ await navigator.clipboard.writeText(s); }
  catch(e){ const a=document.createElement('textarea'); a.value=s; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(_){} a.remove(); }
  toast(msg);
}
$('#copyLink').onclick=()=>{ const url=location.href.split('#')[0]+buildHash(); try{history.replaceState(null,'',buildHash());}catch(e){} copy(url,'✓ Permalink copied'); };
$('#copyRe').onclick=()=>copy('/'+pat.value+'/'+flagStr(),'✓ Copied /'+'regex'+'/');
window.addEventListener('hashchange',()=>{ if(settingHash) return; if(loadHash()){ buildFlags(); run(); } });

/* ---------- misc controls ---------- */
$('#clear').onclick=()=>{ pat.value=''; txt.value=''; $('#examples').value=''; run(); pat.focus(); toast('Cleared'); };
$('#examples').onchange=e=>{
  const ex=EXAMPLES[e.target.value]; if(!ex) return;
  pat.value=ex.p; txt.value=ex.t; state.flags=new Set(ex.f.split('')); buildFlags(); run();
};
function setTheme(t){
  document.documentElement.dataset.theme=t;
  $('#theme').textContent=t==='dark'?'☀ Light':'☾ Dark';
  try{ localStorage.setItem('regexlab-theme',t); }catch(e){}
}
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
pat.addEventListener('input',run); txt.addEventListener('input',run);

/* ---------- init ---------- */
let saved=null; try{ saved=localStorage.getItem('regexlab-theme'); }catch(e){}
setTheme(saved==='light'?'light':'dark');
if(!loadHash()){
  const ex=EXAMPLES[0]; pat.value=ex.p; txt.value=ex.t; state.flags=new Set(ex.f.split(''));
}
buildFlags(); run();
})();
</script>
