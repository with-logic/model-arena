<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Match Challenge</title>
<style>
  :root{
    --bg:#0b0d17; --panel:#141829; --text:#f4f6ff; --muted:#8b93b5;
    --red:#ff4757; --blue:#3b82f6; --green:#22c55e; --yellow:#facc15; --purple:#a855f7; --orange:#fb923c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1d2250 0%,var(--bg) 60%);
    color:var(--text);font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.25;z-index:0;animation:float 14s ease-in-out infinite}
  .b1{width:380px;height:380px;background:var(--purple);left:-100px;top:10%}
  .b2{width:340px;height:340px;background:var(--blue);right:-80px;bottom:5%;animation-delay:-6s}
  @keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
  #app{position:relative;z-index:1;width:min(720px,100%);height:100%;max-height:900px;padding:20px;display:flex;flex-direction:column;gap:16px}
  .hud{display:flex;justify-content:space-between;align-items:stretch;gap:12px}
  .stat{flex:1;background:var(--panel);border:1px solid #232a48;border-radius:18px;padding:10px 16px;text-align:center}
  .stat small{display:block;font-size:.7rem;letter-spacing:.18em;color:var(--muted);font-weight:700}
  .stat b{font-size:2rem;font-variant-numeric:tabular-nums;display:inline-block}
  .bump{animation:bump .3s}
  @keyframes bump{40%{transform:scale(1.35)}}
  .timebar{height:12px;background:#1a2038;border-radius:99px;overflow:hidden}
  .timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));background-size:300% 100%;border-radius:99px;transform-origin:left}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--panel);border:1px solid #232a48;border-radius:28px;overflow:hidden}
  .hint{position:absolute;top:14px;font-size:.8rem;letter-spacing:.15em;color:var(--muted);font-weight:700;text-transform:uppercase}
  #word{font-size:clamp(4rem,19vw,9.5rem);font-weight:900;letter-spacing:-.02em;line-height:1;text-shadow:0 0 40px currentColor;transition:none}
  #word.pop{animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #streak{position:absolute;bottom:14px;font-weight:800;color:var(--yellow);height:1.4em;font-size:1.05rem;letter-spacing:.05em}
  .stage.good{animation:good .35s}.stage.bad{animation:bad .4s}
  @keyframes good{0%{box-shadow:inset 0 0 0 0 #22c55e00}30%{box-shadow:inset 0 0 80px 10px #22c55e66}100%{box-shadow:inset 0 0 0 0 #22c55e00}}
  @keyframes bad{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}
    0%{box-shadow:inset 0 0 90px 10px #ff475788}100%{box-shadow:inset 0 0 0 0 #ff475700}}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .btn{
    position:relative;border:0;border-radius:20px;padding:0;height:clamp(64px,11vh,96px);cursor:pointer;
    font:800 1.15rem/1 inherit;font-family:inherit;color:#0b0d17;letter-spacing:.06em;
    background:var(--c);box-shadow:0 8px 0 var(--d),0 14px 24px -8px var(--c);
    transition:transform .08s,box-shadow .08s,filter .15s;overflow:hidden;
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .btn:active,.btn.press{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 var(--d),0 4px 10px -6px var(--c)}
  .btn kbd{position:absolute;top:6px;right:10px;font:700 .7rem monospace;opacity:.55}
  .btn .rip{position:absolute;border-radius:50%;background:#fff;opacity:.5;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  .grid.off .btn{pointer-events:none;filter:saturate(.5) brightness(.7)}
  .overlay{position:absolute;inset:0;z-index:5;background:#0b0d17ee;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .3s}
  .overlay.hide{opacity:0;pointer-events:none}
  h1{font-size:clamp(2.4rem,9vw,4.4rem);margin:0;font-weight:900;letter-spacing:-.03em;line-height:1}
  h1 span{display:inline-block}
  .overlay p{color:var(--muted);max-width:420px;margin:0;line-height:1.5}
  .go{border:0;border-radius:99px;padding:18px 48px;font:800 1.3rem inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 10px 30px -8px var(--purple);transition:transform .1s;animation:pulse 1.6s infinite}
  .go:hover{transform:scale(1.05)}.go:active{transform:scale(.95)}
  @keyframes pulse{50%{box-shadow:0 10px 50px -2px var(--blue)}}
  .big{font-size:5.5rem;font-weight:900;line-height:1}
  .res{display:flex;gap:12px}
  .res div{background:var(--panel);border:1px solid #232a48;border-radius:16px;padding:10px 18px}
  .res small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:.15em;font-weight:700}
  .res b{font-size:1.5rem}
  .new{color:var(--yellow);font-weight:800;letter-spacing:.1em;animation:pulse2 .8s infinite alternate}
  @keyframes pulse2{to{transform:scale(1.1)}}
  #count{font-size:9rem;font-weight:900;animation:pop .6s}
  .float{position:fixed;font-weight:900;font-size:2rem;pointer-events:none;z-index:9;animation:up .8s ease-out forwards}
  @keyframes up{to{transform:translateY(-80px);opacity:0}}
  @media(max-width:480px){.grid{gap:8px}.btn{font-size:.95rem;border-radius:16px}.stat b{font-size:1.5rem}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="app">
  <div class="hud">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>TIME</small><b id="time">30</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="timebar"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <div class="hint">Click the <u>ink color</u> — not the word</div>
    <div id="word">READY</div>
    <div id="streak"></div>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="grid off" id="grid"></div>
</div>
<script>
const COLORS=[
  {n:'RED',c:'#ff4757',d:'#b3202e'},
  {n:'BLUE',c:'#3b82f6',d:'#1d4ed8'},
  {n:'GREEN',c:'#22c55e',d:'#15803d'},
  {n:'YELLOW',c:'#facc15',d:'#a16207'},
  {n:'PURPLE',c:'#a855f7',d:'#6b21a8'},
  {n:'ORANGE',c:'#fb923c',d:'#c2410c'}
];
const $=id=>document.getElementById(id);
const wordEl=$('word'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),bar=$('bar'),
  stage=$('stage'),grid=$('grid'),ov=$('ov'),streakEl=$('streak');
const DURATION=30;
let score,streak,maxStreak,correct,wrong,endAt,raf,current,playing=false,best=+localStorage.getItem('cmc-best')||0;
bestEl.textContent=best;

// Audio
let ac;
function tone(f,d=.12,type='sine',v=.08,when=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const sfx={
  ok:()=>{tone(660,.1,'triangle');tone(880,.12,'triangle',.08,.06)},
  bad:()=>{tone(160,.25,'sawtooth',.07)},
  tick:()=>tone(520,.08,'square',.04),
  end:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.08,i*.1))
};

// Buttons
COLORS.forEach((k,i)=>{
  const b=document.createElement('button');
  b.className='btn';b.style.setProperty('--c',k.c);b.style.setProperty('--d',k.d);
  b.innerHTML=k.n+'<kbd>'+(i+1)+'</kbd>';b.dataset.i=i;
  b.addEventListener('pointerdown',e=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,rp=document.createElement('span');
    rp.className='rip';rp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
    b.appendChild(rp);setTimeout(()=>rp.remove(),500);
    answer(i,e.clientX,e.clientY);
  });
  grid.appendChild(b);
});

function nextWord(){
  let w,c;
  do{w=Math.floor(Math.random()*6);c=Math.floor(Math.random()*6);}
  while(w===c || (current && w===current.w && c===current.c));
  // ~15% chance of congruent trick (word matches its own color) for spice
  if(Math.random()<.12)c=w;
  current={w,c};
  wordEl.textContent=COLORS[w].n;
  wordEl.style.color=COLORS[c].c;
  wordEl.classList.remove('pop');void wordEl.offsetWidth;wordEl.classList.add('pop');
}

function flash(cls){stage.classList.remove('good','bad');void stage.offsetWidth;stage.classList.add(cls)}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function floatText(t,x,y,color){
  const f=document.createElement('div');f.className='float';f.textContent=t;f.style.color=color;
  f.style.left=(x-20)+'px';f.style.top=(y-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
}

function answer(i,x,y){
  if(!playing)return;
  if(i===current.c){
    streak++;maxStreak=Math.max(maxStreak,streak);correct++;
    const bonus=streak>=5?2:1; score+=bonus;
    flash('good');sfx.ok();floatText('+'+bonus,x,y,COLORS[i].c);
  }else{
    wrong++;streak=0;score=Math.max(0,score-1);
    flash('bad');sfx.bad();floatText('−1',x,y,'#ff4757');
  }
  scoreEl.textContent=score;bump(scoreEl);
  streakEl.textContent=streak>=3?'🔥 '+streak+' STREAK'+(streak>=5?'  ·  2× POINTS':''):'';
  nextWord();
}

document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=6&&playing){
    const b=grid.children[n-1];b.classList.add('press');setTimeout(()=>b.classList.remove('press'),110);
    const r=b.getBoundingClientRect();answer(n-1,r.left+r.width/2,r.top);
  }else if((e.key==='Enter'||e.key===' ')&&!playing&&!ov.classList.contains('hide')&&!counting){
    e.preventDefault();start();
  }
});

let counting=false;
function start(){
  if(counting)return;counting=true;
  score=0;streak=0;maxStreak=0;correct=0;wrong=0;
  scoreEl.textContent=0;timeEl.textContent=DURATION;streakEl.textContent='';
  bar.style.transform='scaleX(1)';bar.style.backgroundPosition='0 0';
  wordEl.textContent='';
  ov.classList.remove('hide');
  let n=3;
  const step=()=>{
    if(n===0){ov.classList.add('hide');counting=false;begin();return}
    ov.innerHTML='<div id="count">'+n+'</div>';tone(440,.15,'sine',.08);n--;setTimeout(step,700);
  };
  step();
}
function begin(){
  playing=true;grid.classList.remove('off');nextWord();
  endAt=performance.now()+DURATION*1000;let lastSec=DURATION;
  const loop=now=>{
    const left=Math.max(0,endAt-now),frac=left/(DURATION*1000);
    bar.style.transform='scaleX('+frac+')';bar.style.backgroundPosition=((1-frac)*100)+'% 0';
    const s=Math.ceil(left/1000);
    if(s!==lastSec){lastSec=s;timeEl.textContent=s;if(s<=5&&s>0){sfx.tick();bump(timeEl)}}
    timeEl.style.color=s<=5?'#ff4757':'';
    if(left<=0)return finish();
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function finish(){
  playing=false;grid.classList.add('off');timeEl.textContent=0;timeEl.style.color='';
  cancelAnimationFrame(raf);sfx.end();
  const isNew=score>best&&score>0;
  if(isNew){best=score;localStorage.setItem('cmc-best',best);bestEl.textContent=best}
  const total=correct+wrong,acc=total?Math.round(correct/total*100):0;
  wordEl.textContent='TIME!';wordEl.style.color='#f4f6ff';streakEl.textContent='';
  ov.innerHTML=`
    <div style="color:var(--muted);letter-spacing:.2em;font-weight:700">FINAL SCORE</div>
    <div class="big">${score}</div>
    ${isNew?'<div class="new">★ NEW BEST ★</div>':''}
    <div class="res">
      <div><small>CORRECT</small><b>${correct}</b></div>
      <div><small>ACCURACY</small><b>${acc}%</b></div>
      <div><small>BEST STREAK</small><b>${maxStreak}</b></div>
    </div>
    <button class="go" id="again">Play Again</button>`;
  ov.classList.remove('hide');
  $('again').onclick=start;
}

// Intro
ov.innerHTML=`
  <h1><span style="color:var(--red)">C</span><span style="color:var(--orange)">O</span><span style="color:var(--yellow)">L</span><span style="color:var(--green)">O</span><span style="color:var(--blue)">R</span>
  <br>MATCH</h1>
  <p>A word appears in a <b>different ink color</b>. Tap the button that matches the <b>ink color</b> — not what the word says. Wrong answers cost a point. 5+ streak earns double points!</p>
  <p style="font-size:.85rem">Keyboard: keys <b>1–6</b> · Enter to start · 30 seconds</p>
  <button class="go" id="startBtn">Start Game</button>`;
$('startBtn').onclick=start;
</script>
</body>
</html>
