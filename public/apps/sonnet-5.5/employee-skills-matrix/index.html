<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Skills Matrix</title>
<style>
:root{
  --bg:#f6f4f0; --surface:#fff; --ink:#1f2a37; --muted:#6b7280; --line:#e6e2da; --line2:#efece6;
  --brand:#0f766e; --brand-d:#0b5a54; --brand-l:#e0f2ef; --accent:#c2410c;
  --l0:#f3f1ec; --l1:#cfe9e4; --l2:#8fd0c5; --l3:#2fa597; --l4:#0b5a54;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --radius:12px; --shadow:0 1px 2px rgba(31,42,55,.06),0 4px 14px rgba(31,42,55,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1500px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:8px}
.logo-mark i{border-radius:2px;background:#fff}
.logo-mark i:nth-child(1){opacity:.35}.logo-mark i:nth-child(2){opacity:.6}.logo-mark i:nth-child(3){opacity:1}
.logo-mark i:nth-child(4){opacity:.8}.logo-mark i:nth-child(5){opacity:1}.logo-mark i:nth-child(6){opacity:.5}
.logo-mark i:nth-child(7){opacity:1}.logo-mark i:nth-child(8){opacity:.45}.logo-mark i:nth-child(9){opacity:.75}
.logo h1{font-size:17px;margin:0;letter-spacing:-.01em}
.logo small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--l0);padding:4px;border-radius:10px;margin-left:12px}
.tab{border:0;background:transparent;padding:7px 15px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:#fff;color:var(--brand-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:#cfc9bd;background:#fbfaf8}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
main{max-width:1500px;margin:0 auto;padding:22px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;display:flex;align-items:baseline;gap:8px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--l0);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.field{position:relative}
.field input[type=search],.field select,.fi{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;min-width:150px}
.field input[type=search]{padding-left:32px;min-width:240px}
.field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:99px;border:1px solid var(--line);background:#fff}
.sw{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:700}
.lv0{background:var(--l0);color:#9a958a}.lv1{background:var(--l1);color:#0b5a54}.lv2{background:var(--l2);color:#07403c}.lv3{background:var(--l3);color:#fff}.lv4{background:var(--l4);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.matrix-wrap{overflow:auto;max-height:calc(100vh - 290px);min-height:320px;border-radius:var(--radius)}
table.matrix{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.matrix th,.matrix td{padding:0}
.matrix thead th{position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid var(--line);vertical-align:bottom}
.matrix .c-skill{position:sticky;left:0;z-index:2;background:#fff;min-width:270px;max-width:270px;border-right:1px solid var(--line)}
.matrix thead .c-skill{z-index:5}
.matrix .c-cov{position:sticky;left:270px;z-index:2;background:#fff;min-width:150px;border-right:1px solid var(--line)}
.matrix thead .c-cov{z-index:5}
.emp-h{min-width:92px;width:92px;padding:12px 6px 10px;text-align:center}
.emp-h button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:2px;border-radius:8px}
.emp-h button:hover{background:var(--l0)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff}
.emp-h .nm{font-weight:600;font-size:12.5px;line-height:1.2}
.emp-h .rl{font-size:11px;color:var(--muted);line-height:1.2;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emp-h .sc{font-size:10.5px;font-weight:700;color:var(--brand-d);background:var(--brand-l);border-radius:99px;padding:1px 7px;margin-top:2px}
.th-lbl{padding:12px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left}
tr.cat td{background:#faf8f4;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:7px 16px;border-bottom:1px solid var(--line2);position:sticky;left:0}
.skill-cell{padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line2)}
.skill-cell button{border:0;background:none;text-align:left;font-weight:600;padding:0;border-radius:4px}
.skill-cell button:hover{color:var(--brand)}
.skill-cell .tg{font-size:11px;color:var(--muted);white-space:nowrap}
.cov-cell{padding:9px 14px;border-bottom:1px solid var(--line2);height:100%}
.cov-top{display:flex;align-items:center;gap:7px;font-size:12px}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.b-ok{background:#dcfce7;color:var(--ok)}.b-warn{background:#fef3c7;color:var(--warn)}.b-bad{background:#fee2e2;color:var(--bad)}
.cov-bar{height:5px;border-radius:5px;background:var(--l0);margin-top:6px;overflow:hidden}
.cov-bar i{display:block;height:100%;border-radius:5px}
td.cell{border-bottom:1px solid var(--line2);text-align:center;padding:4px}
.cellbtn{width:100%;height:36px;border:0;border-radius:8px;font-weight:700;font-size:12.5px;transition:transform .08s, box-shadow .15s;position:relative}
.cellbtn:hover{transform:scale(1.07);box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:1}
.cellbtn.gap::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.matrix tbody tr:hover td.c-skill,.matrix tbody tr:hover td.c-cov{background:#fbfaf8}
.dim{opacity:.18}
.empty{padding:50px;text-align:center;color:var(--muted)}
.pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:8px;width:230px;animation:pin .12s}
@keyframes pin{from{opacity:0;transform:translateY(-4px)}}
.pop h4{margin:4px 8px 8px;font-size:12px;color:var(--muted);font-weight:600}
.pop h4 b{color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.opt:hover,.opt.sel{background:var(--l0)}
.opt .sw{width:24px;height:24px;font-size:12px;border-radius:7px}
.opt span.d{font-size:11.5px;color:var(--muted);display:block}
.opt b{font-size:13px}
.opt kbd{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.panel{padding:18px 20px}
.panel h3{margin:0 0 4px;font-size:15px}
.panel p.hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:12px;color:var(--muted)}
.mini{height:8px;background:var(--l0);border-radius:8px;overflow:hidden;flex:1}
.mini i{display:block;height:100%;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
.dept-row{display:grid;grid-template-columns:130px 1fr 48px;gap:12px;align-items:center;padding:7px 0}
.dist{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--l0)}
.dist i{display:block;height:100%}
.overlay{position:fixed;inset:0;background:rgba(20,26,34,.45);z-index:90;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}
.modal header{padding:18px 22px 4px}
.modal h2{margin:0;font-size:18px}
.modal .body{padding:12px 22px 6px;display:grid;gap:13px}
.modal label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.modal label .fi{width:100%;color:var(--ink);font-weight:400;font-size:14px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal footer{padding:16px 22px 20px;display:flex;gap:8px;justify-content:flex-end}
.modal footer .l{margin-right:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:10px 18px;border-radius:10px;z-index:120;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:pin .2s}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:700px){.top-in{padding:12px 14px}.tabs{margin-left:0}main{padding:16px 12px 50px}.matrix .c-skill{min-width:190px;max-width:190px}.matrix .c-cov{display:none}.field input[type=search]{min-width:160px}}
@media print{header.top,.toolbar,.pop{display:none}.matrix-wrap{max-height:none;overflow:visible}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div><h1>Employee Skills Matrix</h1><small>People &amp; Talent · Team capability tracker</small></div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="matrix" aria-selected="true">Matrix</button>
      <button class="tab" role="tab" data-tab="insights" aria-selected="false">Insights</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnExport">⬇ Export CSV</button>
    <button class="btn" id="btnAddSkill">+ Skill</button>
    <button class="btn primary" id="btnAddEmp">+ Employee</button>
  </div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <div id="view"></div>
</main>
<div id="layer"></div>

<script>
const LEVELS=[
  {n:0,name:'No exposure',desc:'Not yet started'},
  {n:1,name:'Beginner',desc:'Learning, needs close guidance'},
  {n:2,name:'Intermediate',desc:'Works with occasional support'},
  {n:3,name:'Advanced',desc:'Fully independent'},
  {n:4,name:'Expert',desc:'Can coach & lead others'}
];
const COLORS=['#0f766e','#7c3aed','#c2410c','#2563eb','#be185d','#4d7c0f','#b45309','#0e7490','#9333ea','#475569'];
const CATS=['Technical','Tools & Platforms','People & Leadership','Compliance & Process'];
const DEPTS=['Engineering','Product','People Ops','Sales','Finance','Customer Success'];
const KEY='skills-matrix-v1';

function demo(){
  const E=[
    ['Priya Raman','Staff Engineer','Engineering'],['Marcus Cole','Engineering Manager','Engineering'],
    ['Elena Petrova','Product Manager','Product'],['Tom Okafor','HR Business Partner','People Ops'],
    ['Aiko Tanaka','Data Analyst','Finance'],['Diego Alvarez','Account Executive','Sales'],
    ['Sarah Lindqvist','Support Lead','Customer Success'],['Jamal Brooks','Software Engineer','Engineering'],
    ['Naomi Fischer','Talent Partner','People Ops'],['Liam O\'Connor','Finance Controller','Finance']
  ].map((e,i)=>({id:'e'+i,name:e[0],role:e[1],dept:e[2]}));
  const S=[
    ['JavaScript / TypeScript','Technical',3,2],['Cloud Infrastructure','Technical',3,2],['Data Analysis & SQL','Technical',3,2],['System Design','Technical',3,2],
    ['Jira & Confluence','Tools & Platforms',2,3],['Salesforce CRM','Tools & Platforms',3,2],['Workday HRIS','Tools & Platforms',3,2],
    ['Coaching & Mentoring','People & Leadership',3,3],['Conflict Resolution','People & Leadership',3,2],['Public Speaking','People & Leadership',2,2],['Stakeholder Management','People & Leadership',3,3],
    ['Employment Law','Compliance & Process',3,1],['Data Privacy (GDPR)','Compliance & Process',3,2],['Financial Reporting','Compliance & Process',3,2],['Agile Delivery','Compliance & Process',3,3]
  ].map((s,i)=>({id:'s'+i,name:s[0],cat:s[1],target:s[2],minHC:s[3]}));
  // rating rows per skill across 10 employees
  const R=[
    [4,3,1,0,1,0,0,3,0,0],[4,3,0,0,0,0,0,2,0,0],[3,1,3,1,4,2,2,1,1,3],[4,4,2,0,0,0,0,2,0,0],
    [3,3,4,2,1,1,3,3,2,1],[0,0,1,0,0,4,3,0,0,0],[0,0,0,4,1,0,0,0,4,2],
    [3,4,2,3,0,1,3,1,3,1],[2,3,2,4,1,2,3,1,4,2],[1,2,3,2,1,3,2,1,3,1],[2,3,4,3,2,3,3,1,2,3],
    [0,0,0,4,0,0,0,0,2,1],[2,2,3,3,2,1,1,2,2,3],[0,0,0,0,3,0,0,0,0,4],[3,4,3,1,0,1,1,3,1,0]
  ];
  const ratings={};
  S.forEach((s,si)=>E.forEach((e,ei)=>{ratings[e.id+'|'+s.id]=R[si][ei]}));
  return{employees:E,skills:S,ratings,seq:100};
}
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.employees)return s}catch(e){}return demo()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const ui={tab:'matrix',q:'',dept:'all',cat:'all',status:'all',sort:'category',hl:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=(e,s)=>state.ratings[e+'|'+s]||0;
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const empColor=e=>COLORS[Math.abs([...e.id].reduce((a,c)=>a+c.charCodeAt(0)*7,0))%COLORS.length];

function skillStats(s){
  const emps=state.employees;
  const qual=emps.filter(e=>R(e.id,s.id)>=s.target).length;
  const any=emps.filter(e=>R(e.id,s.id)>0).length;
  const avg=emps.length?emps.reduce((a,e)=>a+R(e.id,s.id),0)/emps.length:0;
  const status=qual===0?'bad':qual<s.minHC?'warn':'ok';
  return{qual,any,avg,status,ratio:Math.min(1,qual/Math.max(1,s.minHC))};
}
const statusLabel={ok:'Covered',warn:'At risk',bad:'Gap'};
function empScore(e){
  const t=state.skills.length*4;if(!t)return 0;
  return Math.round(state.skills.reduce((a,s)=>a+R(e.id,s.id),0)/t*100);
}

/* ---------- KPIs ---------- */
function renderKpis(){
  const S=state.skills,E=state.employees;
  const st=S.map(skillStats);
  const covered=st.filter(x=>x.status==='ok').length;
  const risk=st.filter(x=>x.status==='warn').length;
  const gap=st.filter(x=>x.status==='bad').length;
  const cells=S.length*E.length;
  const filled=S.reduce((a,s)=>a+E.filter(e=>R(e.id,s.id)>0).length,0);
  const avg=cells?(S.reduce((a,s)=>a+E.reduce((b,e)=>b+R(e.id,s.id),0),0)/cells):0;
  const pct=S.length?Math.round(covered/S.length*100):0;
  $('#kpis').innerHTML=`
  <div class="kpi"><div class="lbl">Team coverage</div><div class="val">${pct}%<small>${covered} of ${S.length} skills</small></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="kpi"><div class="lbl">Skills at risk</div><div class="val" style="color:var(--warn)">${risk}<small>below min. headcount</small></div><div class="sub">Single points of failure to de-risk</div></div>
  <div class="kpi"><div class="lbl">Critical gaps</div><div class="val" style="color:${gap?'var(--bad)':'var(--ok)'}">${gap}<small>no qualified person</small></div><div class="sub">${gap?'Hire, train or contract':'No uncovered skills'}</div></div>
  <div class="kpi"><div class="lbl">Avg. proficiency</div><div class="val">${avg.toFixed(1)}<small>of 4.0 · ${E.length} people</small></div><div class="bar"><i style="width:${avg/4*100}%"></i></div></div>
  <div class="kpi"><div class="lbl">Assessment completion</div><div class="val">${cells?Math.round(filled/cells*100):0}%<small>${filled}/${cells} rated</small></div><div class="bar"><i style="width:${cells?filled/cells*100:0}%;background:#7c3aed"></i></div></div>`;
}

/* ---------- Matrix ---------- */
function filteredEmps(){
  const q=ui.q.trim().toLowerCase();
  return state.employees.filter(e=>(ui.dept==='all'||e.dept===ui.dept)&&(!q||(e.name+' '+e.role).toLowerCase().includes(q)||false));
}
function filteredSkills(){
  const q=ui.q.trim().toLowerCase();
  let list=state.skills.filter(s=>(ui.cat==='all'||s.cat===ui.cat));
  if(q){const byName=list.filter(s=>s.name.toLowerCase().includes(q));
    const empHit=state.employees.some(e=>(e.name+' '+e.role).toLowerCase().includes(q));
    if(byName.length||!empHit)list=byName;}
  if(ui.status!=='all')list=list.filter(s=>skillStats(s).status===ui.status);
  return list;
}
function matrixView(){
  const q=ui.q.trim().toLowerCase();
  let emps=filteredEmps();
  const skillHit=state.skills.some(s=>s.name.toLowerCase().includes(q));
  if(q&&emps.length===0&&skillHit)emps=state.employees.filter(e=>ui.dept==='all'||e.dept===ui.dept);
  const skills=filteredSkills();
  const order={bad:0,warn:1,ok:2};
  let rows=[];
  if(ui.sort==='risk'){
    rows=[...skills].sort((a,b)=>order[skillStats(a).status]-order[skillStats(b).status]||skillStats(a).qual-skillStats(b).qual).map(s=>({s}));
  }else{
    CATS.concat([...new Set(state.skills.map(s=>s.cat))].filter(c=>!CATS.includes(c))).forEach(c=>{
      const g=skills.filter(s=>s.cat===c);if(!g.length)return;rows.push({cat:c});g.forEach(s=>rows.push({s}));
    });
  }
  const depts=[...new Set(state.employees.map(e=>e.dept))];
  const cats=[...new Set(CATS.concat(state.skills.map(s=>s.cat)))];
  const toolbar=`
  <div class="toolbar">
    <div class="field"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search people or skills…" value="${esc(ui.q)}" aria-label="Search"></div>
    <div class="field"><select id="fDept" aria-label="Department"><option value="all">All departments</option>${depts.map(d=>`<option ${ui.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
    <div class="field"><select id="fCat" aria-label="Category"><option value="all">All skill categories</option>${cats.map(d=>`<option ${ui.cat===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
    <div class="field"><select id="fStatus" aria-label="Coverage"><option value="all">Any coverage</option>${['bad','warn','ok'].map(k=>`<option value="${k}" ${ui.status===k?'selected':''}>${statusLabel[k]} only</option>`).join('')}</select></div>
    <div class="field"><select id="fSort" aria-label="Sort"><option value="category" ${ui.sort==='category'?'selected':''}>Group by category</option><option value="risk" ${ui.sort==='risk'?'selected':''}>Sort by risk</option></select></div>
    <div class="spacer"></div>
    <div class="legend">${LEVELS.map(l=>`<span class="chip" title="${l.desc}"><span class="sw lv${l.n}">${l.n}</span>${l.name}</span>`).join('')}<span class="chip"><span class="sw" style="background:#fff;border:1px solid var(--line)"><i style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></i></span>Below target</span></div>
  </div>`;
  let table;
  if(!emps.length||!skills.length){
    table=`<div class="empty"><b>No matches</b><br>Try adjusting your filters or search.</div>`;
  }else{
    table=`<div class="matrix-wrap"><table class="matrix"><thead><tr>
      <th class="c-skill"><div class="th-lbl">Skill <span style="font-weight:500;text-transform:none;letter-spacing:0">· target level</span></div></th>
      <th class="c-cov"><div class="th-lbl">Coverage</div></th>
      ${emps.map(e=>`<th class="emp-h"><button data-edit-emp="${e.id}" title="Edit ${esc(e.name)} — ${esc(e.dept)}"><span class="avatar" style="background:${empColor(e)}">${esc(initials(e.name))}</span><span class="nm">${esc(e.name.split(' ')[0])}<br>${esc(e.name.split(' ').slice(1).join(' '))}</span><span class="rl">${esc(e.role)}</span><span class="sc">${empScore(e)}%</span></button></th>`).join('')}
    </tr></thead><tbody>
    ${rows.map(r=>{
      if(r.cat)return`<tr class="cat"><td colspan="${emps.length+2}">${esc(r.cat)}</td></tr>`;
      const s=r.s,st=skillStats(s);
      const col=st.status==='ok'?'var(--ok)':st.status==='warn'?'#d97706':'var(--bad)';
      return`<tr data-skill="${s.id}"><td class="c-skill"><div class="skill-cell"><button data-edit-skill="${s.id}">${esc(s.name)}</button><span class="tg">Target <span class="sw lv${s.target}" style="vertical-align:middle">${s.target}</span></span></div></td>
      <td class="c-cov"><div class="cov-cell"><div class="cov-top"><span class="badge b-${st.status}">${statusLabel[st.status]}</span><span style="color:var(--muted)">${st.qual}/${s.minHC} qualified</span></div><div class="cov-bar"><i style="width:${st.ratio*100}%;background:${col}"></i></div></div></td>
      ${emps.map(e=>{const v=R(e.id,s.id);return`<td class="cell"><button class="cellbtn lv${v}${v>0&&v<s.target?' gap':''}" data-e="${e.id}" data-s="${s.id}" aria-label="${esc(e.name)}, ${esc(s.name)}: ${LEVELS[v].name}. Press to change">${v}</button></td>`}).join('')}
      </tr>`}).join('')}
    </tbody></table></div>`;
  }
  return toolbar+`<div class="card">${table}</div><div class="note">Tip: click any cell to set a proficiency level, or hover a cell and press 0–4. “Qualified” means rated at or above the skill’s target level. Click a skill or person to edit.</div>`;
}

/* ---------- Insights ---------- */
function insightsView(){
  const S=state.skills,E=state.employees;
  const st=S.map(s=>({s,...skillStats(s)}));
  const risky=st.filter(x=>x.status!=='ok').sort((a,b)=>a.qual-b.qual||a.avg-b.avg);
  const experts=s=>E.filter(e=>R(e.id,s.id)>=s.target).map(e=>e.name.split(' ')[0]).join(', ')||'—';
  const depts=[...new Set(E.map(e=>e.dept))];
  const dist=[0,1,2,3,4].map(n=>S.reduce((a,s)=>a+E.filter(e=>R(e.id,s.id)===n).length,0));
  const tot=dist.reduce((a,b)=>a+b,0)||1;
  const ranked=[...E].sort((a,b)=>empScore(b)-empScore(a));
  const cats=[...new Set(S.map(s=>s.cat))];
  const growth=[];
  S.filter(s=>skillStats(s).status!=='ok').forEach(s=>{
    E.forEach(e=>{const v=R(e.id,s.id);if(v>=s.target-1&&v<s.target&&v>0)growth.push({e,s,v})});
  });
  return`<div class="grid2">
  <div class="card panel"><h3>⚠ Priority coverage gaps</h3><p class="hint">Skills with fewer qualified people than the minimum headcount.</p>
    ${risky.length?risky.map(x=>`<div class="row"><div class="grow"><div class="t">${esc(x.s.name)}</div><div class="s">${esc(x.s.cat)} · Qualified: ${esc(experts(x.s))}</div></div><span class="badge b-${x.status}">${x.qual}/${x.s.minHC}</span></div>`).join(''):'<div class="empty">All skills meet coverage targets 🎉</div>'}
  </div>
  <div class="card panel"><h3>🌱 Upskilling opportunities</h3><p class="hint">People one level below target on an at-risk skill — the fastest way to close gaps.</p>
    ${growth.length?growth.slice(0,8).map(g=>`<div class="row"><span class="avatar" style="background:${empColor(g.e)};width:30px;height:30px;font-size:11px">${esc(initials(g.e.name))}</span><div class="grow"><div class="t">${esc(g.e.name)}</div><div class="s">${esc(g.s.name)}</div></div><span class="sw lv${g.v}" style="width:22px;height:22px">${g.v}</span>→<span class="sw lv${g.s.target}" style="width:22px;height:22px">${g.s.target}</span></div>`).join(''):'<div class="empty">No near-miss candidates right now.</div>'}
  </div>
  <div class="card panel"><h3>Proficiency distribution</h3><p class="hint">Share of all ${S.length*E.length} assessments by level.</p>
    <div class="dist" style="height:30px">${dist.map((n,i)=>n?`<i class="lv${i}" style="width:${n/tot*100}%" title="${LEVELS[i].name}: ${n}"></i>`:'').join('')}</div>
    <div style="margin-top:14px">${LEVELS.map((l,i)=>`<div class="row"><span class="sw lv${i}" style="width:22px;height:22px">${i}</span><div class="grow t">${l.name}</div><span class="s">${dist[i]}</span><span class="num">${Math.round(dist[i]/tot*100)}%</span></div>`).join('')}</div>
  </div>
  <div class="card panel"><h3>Coverage by category</h3><p class="hint">Average proficiency across the team.</p>
    ${cats.map(c=>{const g=S.filter(s=>s.cat===c);const a=g.reduce((x,s)=>x+skillStats(s).avg,0)/g.length;const cv=g.filter(s=>skillStats(s).status==='ok').length;
    return`<div class="dept-row" style="grid-template-columns:170px 1fr 70px"><div><div class="t" style="font-size:13px">${esc(c)}</div><div class="s" style="font-size:11.5px;color:var(--muted)">${cv}/${g.length} covered</div></div><div class="mini" style="height:12px"><i style="width:${a/4*100}%;background:var(--brand)"></i></div><div class="num">${a.toFixed(2)}</div></div>`}).join('')}
    <h3 style="margin-top:22px">By department</h3><p class="hint">Average proficiency score per department.</p>
    ${depts.map(d=>{const m=E.filter(e=>e.dept===d);const a=m.reduce((x,e)=>x+empScore(e),0)/m.length;
    return`<div class="dept-row"><div class="t" style="font-size:13px">${esc(d)}<div class="s" style="font-size:11.5px;color:var(--muted);font-weight:400">${m.length} ${m.length===1?'person':'people'}</div></div><div class="mini" style="height:12px"><i style="width:${a}%;background:#7c3aed"></i></div><div class="num">${Math.round(a)}%</div></div>`}).join('')}
  </div>
  <div class="card panel"><h3>Breadth leaderboard</h3><p class="hint">Overall skill score (sum of levels ÷ maximum possible).</p>
    ${ranked.map((e,i)=>`<div class="row"><span class="s" style="width:18px">${i+1}</span><span class="avatar" style="background:${empColor(e)};width:30px;height:30px;font-size:11px">${esc(initials(e.name))}</span><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.role)} · ${esc(e.dept)}</div></div><div class="mini" style="max-width:110px"><i style="width:${empScore(e)}%;background:var(--brand)"></i></div><span class="num">${empScore(e)}%</span></div>`).join('')}
  </div>
  <div class="card panel"><h3>Key-person dependency</h3><p class="hint">Skills where one person holds all the expertise.</p>
    ${(()=>{const k=st.filter(x=>x.qual===1);return k.length?k.map(x=>{const p=E.find(e=>R(e.id,x.s.id)>=x.s.target);return`<div class="row"><span class="avatar" style="background:${empColor(p)};width:30px;height:30px;font-size:11px">${esc(initials(p.name))}</span><div class="grow"><div class="t">${esc(x.s.name)}</div><div class="s">Only ${esc(p.name)} (level ${R(p.id,x.s.id)})</div></div><span class="badge b-warn">Single point</span></div>`}).join(''):'<div class="empty">No single-person dependencies.</div>'})()}
  </div>
  </div>`;
}

/* ---------- Render ---------- */
function render(keepFocus){
  renderKpis();
  const v=$('#view');
  const sx=v.querySelector('.matrix-wrap');const sl=sx?sx.scrollLeft:0,stp=sx?sx.scrollTop:0;
  v.innerHTML=ui.tab==='matrix'?matrixView():insightsView();
  const w=v.querySelector('.matrix-wrap');if(w){w.scrollLeft=sl;w.scrollTop=stp}
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===ui.tab));
  if(keepFocus){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

/* ---------- Popover ---------- */
let pop=null,hoverCell=null;
function closePop(){if(pop){pop.remove();pop=null}}
function setRating(e,s,v){
  state.ratings[e+'|'+s]=v;save();render();
}
function openPop(btn){
  closePop();
  const e=state.employees.find(x=>x.id===btn.dataset.e),s=state.skills.find(x=>x.id===btn.dataset.s);
  const cur=R(e.id,s.id);
  pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','menu');
  pop.innerHTML=`<h4><b>${esc(e.name)}</b><br>${esc(s.name)} · target ${s.target}</h4>`+LEVELS.map(l=>`<button class="opt ${l.n===cur?'sel':''}" role="menuitem" data-v="${l.n}"><span class="sw lv${l.n}">${l.n}</span><span><b>${l.name}</b><span class="d">${l.desc}</span></span><kbd>${l.n}</kbd></button>`).join('');
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(),pr=pop.getBoundingClientRect();
  let x=r.left+r.width/2-pr.width/2,y=r.bottom+6;
  x=Math.max(8,Math.min(x,innerWidth-pr.width-8));
  if(y+pr.height>innerHeight-8)y=Math.max(8,r.top-pr.height-6);
  pop.style.left=x+'px';pop.style.top=y+'px';
  pop.dataset.e=e.id;pop.dataset.s=s.id;
  (pop.querySelector('.sel')||pop.querySelector('.opt')).focus();
}

/* ---------- Modals ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function closeModal(){$('#layer').innerHTML=''}
function modal(title,body,footer,onsubmit){
  $('#layer').innerHTML=`<div class="overlay" id="ov"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2></header><div class="body">${body}</div><footer>${footer}</footer></form></div>`;
  const f=$('#layer form');
  f.addEventListener('submit',ev=>{ev.preventDefault();onsubmit(Object.fromEntries(new FormData(f)))});
  f.querySelector('[data-cancel]').onclick=closeModal;
  const first=f.querySelector('input');if(first)first.focus();
  return f;
}
const opts=(arr,sel)=>arr.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
function empModal(id){
  const e=id?state.employees.find(x=>x.id===id):null;
  const f=modal(e?'Edit employee':'Add employee',`
    <label>Full name<input class="fi" name="name" required maxlength="60" value="${e?esc(e.name):''}" placeholder="e.g. Jordan Lee"></label>
    <label>Job title<input class="fi" name="role" required maxlength="50" value="${e?esc(e.role):''}" placeholder="e.g. Analyst"></label>
    <label>Department<input class="fi" name="dept" required list="dl-dept" maxlength="40" value="${e?esc(e.dept):''}" placeholder="Choose or type"><datalist id="dl-dept">${opts([...new Set(DEPTS.concat(state.employees.map(x=>x.dept)))])}</datalist></label>`,
    `${e?'<button type="button" class="btn danger l" data-del>Remove</button>':''}<button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">${e?'Save':'Add employee'}</button>`,
    d=>{
      if(e){Object.assign(e,{name:d.name.trim(),role:d.role.trim(),dept:d.dept.trim()});toast('Employee updated')}
      else{const n={id:'e'+(state.seq++),name:d.name.trim(),role:d.role.trim(),dept:d.dept.trim()};state.employees.push(n);toast(n.name+' added — rate their skills in the new column')}
      save();closeModal();render();
    });
  const del=f.querySelector('[data-del]');
  if(del)del.onclick=()=>{if(confirm('Remove '+e.name+' and all their ratings?')){state.employees=state.employees.filter(x=>x.id!==e.id);Object.keys(state.ratings).forEach(k=>{if(k.startsWith(e.id+'|'))delete state.ratings[k]});save();closeModal();render();toast('Employee removed')}};
}
function skillModal(id){
  const s=id?state.skills.find(x=>x.id===id):null;
  const cats=[...new Set(CATS.concat(state.skills.map(x=>x.cat)))];
  const f=modal(s?'Edit skill':'Add skill',`
    <label>Skill name<input class="fi" name="name" required maxlength="60" value="${s?esc(s.name):''}" placeholder="e.g. Negotiation"></label>
    <label>Category<input class="fi" name="cat" required list="dl-cat" maxlength="40" value="${s?esc(s.cat):CATS[0]}"><datalist id="dl-cat">${opts(cats)}</datalist></label>
    <div class="two">
      <label>Target level<select class="fi" name="target">${LEVELS.slice(1).map(l=>`<option value="${l.n}" ${(s?s.target:3)===l.n?'selected':''}>${l.n} · ${l.name}</option>`).join('')}</select></label>
      <label>Min. people at target<input class="fi" type="number" name="minHC" min="1" max="50" value="${s?s.minHC:2}"></label>
    </div>`,
    `${s?'<button type="button" class="btn danger l" data-del>Delete</button>':''}<button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">${s?'Save':'Add skill'}</button>`,
    d=>{
      const v={name:d.name.trim(),cat:d.cat.trim(),target:+d.target,minHC:Math.max(1,+d.minHC||1)};
      if(s){Object.assign(s,v);toast('Skill updated')}else{state.skills.push({id:'s'+(state.seq++),...v});toast('Skill added')}
      save();closeModal();render();
    });
  const del=f.querySelector('[data-del]');
  if(del)del.onclick=()=>{if(confirm('Delete skill "'+s.name+'"?')){state.skills=state.skills.filter(x=>x.id!==s.id);Object.keys(state.ratings).forEach(k=>{if(k.endsWith('|'+s.id))delete state.ratings[k]});save();closeModal();render();toast('Skill deleted')}};
}
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Skill','Category','Target','Min headcount','Status',...state.employees.map(e=>e.name)]];
  state.skills.forEach(s=>rows.push([s.name,s.cat,s.target,s.minHC,statusLabel[skillStats(s).status],...state.employees.map(e=>R(e.id,s.id))]));
  const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skills-matrix.csv';a.click();toast('CSV exported');
}

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  const opt=t.closest('.opt');
  if(opt&&pop){setRating(pop.dataset.e,pop.dataset.s,+opt.dataset.v);closePop();return}
  if(pop&&!t.closest('.pop'))closePop();
  const cell=t.closest('.cellbtn');if(cell){openPop(cell);return}
  const ee=t.closest('[data-edit-emp]');if(ee){empModal(ee.dataset.editEmp);return}
  const es=t.closest('[data-edit-skill]');if(es){skillModal(es.dataset.editSkill);return}
  const tab=t.closest('.tab');if(tab){ui.tab=tab.dataset.tab;render();return}
  if(t.id==='ov')closeModal();
});
$('#btnAddEmp').onclick=()=>empModal();
$('#btnAddSkill').onclick=()=>skillModal();
$('#btnExport').onclick=exportCsv;
document.addEventListener('input',ev=>{if(ev.target.id==='q'){ui.q=ev.target.value;render(true)}});
document.addEventListener('change',ev=>{
  const m={fDept:'dept',fCat:'cat',fStatus:'status',fSort:'sort'}[ev.target.id];
  if(m){ui[m]=ev.target.value;render()}
});
document.addEventListener('mouseover',ev=>{const c=ev.target.closest&&ev.target.closest('.cellbtn');hoverCell=c||null});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(pop){const f=document.querySelector(`.cellbtn[data-e="${pop.dataset.e}"][data-s="${pop.dataset.s}"]`);closePop();f&&f.focus()}else closeModal();return}
  if(/^[0-4]$/.test(ev.key)&&!ev.target.matches('input,select,textarea')){
    if(pop){setRating(pop.dataset.e,pop.dataset.s,+ev.key);const e=pop.dataset.e,s=pop.dataset.s;closePop();
      const f=document.querySelector(`.cellbtn[data-e="${e}"][data-s="${s}"]`);f&&f.focus();return}
    const c=document.activeElement.classList&&document.activeElement.classList.contains('cellbtn')?document.activeElement:hoverCell;
    if(c){const e=c.dataset.e,s=c.dataset.s;setRating(e,s,+ev.key);
      const f=document.querySelector(`.cellbtn[data-e="${e}"][data-s="${s}"]`);f&&f.focus();hoverCell=f}
  }
  if(pop&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){
    ev.preventDefault();const o=[...pop.querySelectorAll('.opt')];const i=o.indexOf(document.activeElement);
    o[(i+(ev.key==='ArrowDown'?1:-1)+o.length)%o.length].focus();
  }
});
addEventListener('resize',closePop);
$('.matrix-wrap')&&0;
render();
</script>
</body>
</html>
