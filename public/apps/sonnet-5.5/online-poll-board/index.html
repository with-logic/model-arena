<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Poll Board</title>
<style>
:root{
  --ink:#2b2350; --muted:#7a7399; --card:#ffffffd9; --line:#ece6fb;
  --c0:#7c5cff; --c1:#ff6fa8; --c2:#2ec4b6; --c3:#ffb020; --c4:#4aa3ff; --c5:#ff7a45;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 8% -5%, #ffe0f0 0%, transparent 60%),
    radial-gradient(800px 500px at 95% 5%, #d6f3ff 0%, transparent 60%),
    radial-gradient(900px 600px at 50% 110%, #e6ddff 0%, transparent 60%),
    #fff7ec;
  background-attachment:fixed;
}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.45;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
.b1{width:260px;height:260px;background:#ffd1e8;left:-60px;top:35%}
.b2{width:300px;height:300px;background:#c9f0e8;right:-80px;top:55%;animation-delay:-5s}
@keyframes float{50%{transform:translateY(-40px) translateX(20px)}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--c0),var(--c1));display:grid;place-items:center;font-style:normal;font-size:24px;box-shadow:0 8px 20px #7c5cff55;transform:rotate(-6deg)}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c0),#9b6bff);box-shadow:0 8px 20px #7c5cff44;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px #7c5cff55}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0001;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);backdrop-filter:blur(8px);border-radius:20px;padding:16px 18px;border:1px solid #fff;box-shadow:0 6px 24px #6a4cff14}
.stat b{display:block;font-size:30px;letter-spacing:-1px}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.chip{border:1px solid var(--line);background:#ffffffb0;padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
.chip:hover{background:#fff;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{margin-left:auto;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:#ffffffc0;font:inherit;outline:none;min-width:200px}
.search:focus{border-color:var(--c0);box-shadow:0 0 0 4px #7c5cff22}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:24px;padding:22px;border:1px solid #fff;box-shadow:0 10px 30px #6a4cff17;animation:pop .5s both;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #6a4cff26}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;font-weight:800}
.tag{padding:4px 10px;border-radius:99px;background:#efe9ff;color:var(--c0);text-transform:uppercase;letter-spacing:.6px}
.live{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#2ec4b6;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #2ec4b600;background:#2ec4b6aa}0%{box-shadow:0 0 0 0 #2ec4b688}}
.q{font-size:19px;font-weight:800;line-height:1.3;margin:0 0 16px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;overflow:hidden;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;transition:.2s;min-height:48px}
.opt .emo{font-size:18px;z-index:1}
.opt .lbl{z-index:1;flex:1}
.opt .pct{z-index:1;font-variant-numeric:tabular-nums;font-weight:800}
.opt .cnt{z-index:1;font-size:12px;color:var(--muted);font-weight:700;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.opt .bar{position:absolute;inset:0 auto 0 0;width:0;opacity:.18;transition:width .9s cubic-bezier(.2,.8,.2,1);background:var(--col)}
.opt .bar:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:translateX(-100%)}
.opt.vote:hover{border-color:var(--col);transform:translateX(4px);box-shadow:0 4px 14px #0000000f}
.opt.vote .pct,.opt.vote .cnt{display:none}
.voted .opt{cursor:default}
.voted .opt .bar{opacity:.3}
.opt.mine{border-color:var(--col)}
.opt.mine .lbl:after{content:" ✓";color:var(--col)}
.opt.lead .bar:after{animation:shine 2.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.opt.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.03)}}
.foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:700}
.link{background:none;border:0;color:var(--c0);font-weight:800;padding:4px 0;font-size:13px}
.link:hover{text-decoration:underline}
.total b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-weight:700;grid-column:1/-1}
/* modal */
.modal{position:fixed;inset:0;background:#2b235055;backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.sheet{background:#fff;border-radius:26px;padding:26px;width:100%;max-width:460px;box-shadow:0 30px 80px #2b235066;animation:pop .35s both;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 16px}
.sheet label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.sheet input,.sheet select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;outline:none}
.sheet input:focus,.sheet select:focus{border-color:var(--c0)}
.row{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;transition:.4s cubic-bezier(.2,1.4,.4,1);z-index:80;box-shadow:0 10px 30px #0004}
.toast.show{transform:translate(-50%,0)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:99}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat b{font-size:22px}.stat{padding:12px}.search{margin-left:0;width:100%}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <header>
    <div class="logo"><i>🗳️</i><div><h1>Online Poll Board</h1><div class="sub">Cast your vote. Watch the results come alive.</div></div></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="reset">↺ Reset demo</button>
      <button class="btn" id="new">＋ New poll</button>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><b id="sPolls">0</b><span>Active polls</span></div>
    <div class="stat"><b id="sVotes">0</b><span>Total votes</span></div>
    <div class="stat"><b id="sMine">0</b><span>Your votes</span></div>
  </section>
  <div class="toolbar" id="tools"></div>
  <main class="grid" id="grid"></main>
</div>

<div class="modal" id="modal"><form class="sheet" id="form">
  <h2>✨ Create a poll</h2>
  <label>Question</label><input id="fq" maxlength="90" placeholder="What should we ask the world?" required>
  <label>Category</label>
  <select id="fc"><option>Fun</option><option>Tech</option><option>Food</option><option>Life</option></select>
  <label>Options (2–5)</label>
  <div id="fo"></div>
  <button type="button" class="link" id="addOpt">＋ Add option</button>
  <div class="row"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Publish</button></div>
</form></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
const COLORS=['#7c5cff','#ff6fa8','#2ec4b6','#ffb020','#4aa3ff','#ff7a45'];
const EMO={Fun:'🎉',Tech:'💻',Food:'🍕',Life:'🌱'};
const SEED=[
 {q:'What is the best way to start the morning?',c:'Life',o:[['☕ Strong coffee',212],['🍵 Calming tea',98],['🏃 A quick run',64],['😴 Snooze, obviously',140]]},
 {q:'Which programming language deserves more love?',c:'Tech',o:[['🦀 Rust',180],['🐍 Python',122],['🟦 TypeScript',201],['💎 Ruby',57],['🐹 Go',90]]},
 {q:'Pineapple on pizza?',c:'Food',o:[['🍍 Yes, delicious',301],['🚫 Never',276],['🤷 Only if no one is looking',88]]},
 {q:'Ideal weekend plan?',c:'Life',o:[['⛰️ Hike somewhere',133],['🛋️ Couch + series',187],['🎲 Game night',96],['🍳 Long brunch',151]]},
 {q:'Tabs or spaces?',c:'Tech',o:[['↹ Tabs',143],['␣ Spaces',166],['🤖 Let the formatter decide',240]]},
 {q:'Pick a superpower',c:'Fun',o:[['🦅 Flying',210],['⏳ Time travel',185],['👻 Invisibility',77],['🧠 Mind reading',102],['⚡ Super speed',64]]}
];
let polls=[],mine={},filter='All',query='';
const $=s=>document.querySelector(s);
const save=()=>{localStorage.setItem('pb_polls',JSON.stringify(polls));localStorage.setItem('pb_mine',JSON.stringify(mine))};
function seed(){polls=SEED.map((p,i)=>({id:'p'+i,q:p.q,c:p.c,o:p.o.map(x=>({t:x[0],v:x[1]}))}));mine={}}
try{polls=JSON.parse(localStorage.getItem('pb_polls'));mine=JSON.parse(localStorage.getItem('pb_mine'))||{}}catch(e){}
if(!Array.isArray(polls)||!polls.length)seed();

const total=p=>p.o.reduce((a,b)=>a+b.v,0);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function split(t){const m=t.match(/^(\p{Extended_Pictographic}️?|[↹␣])\s*(.*)$/u);return m?[m[1],m[2]]:['',t]}

function tools(){
  const cats=['All',...new Set(polls.map(p=>p.c))];
  $('#tools').innerHTML=cats.map(c=>`<button class="chip ${c===filter?'on':''}" data-c="${c}">${EMO[c]||'✨'} ${c}</button>`).join('')+
   `<input class="search" id="search" placeholder="🔍 Search polls…" value="${esc(query)}">`;
  $('#tools').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.c;tools();render()});
  const s=$('#search');s.oninput=()=>{query=s.value;render()};
}
function cardHTML(p,i){
  const t=total(p),voted=mine[p.id]!==undefined,max=Math.max(...p.o.map(o=>o.v));
  return `<article class="card ${voted?'voted':''}" data-id="${p.id}" style="animation-delay:${i*60}ms">
   <div class="meta"><span class="tag">${EMO[p.c]||'✨'} ${p.c}</span><span class="live">Live</span></div>
   <h3 class="q">${esc(p.q)}</h3>
   <div class="opts">${p.o.map((o,j)=>{const [e,l]=split(o.t);const pc=t?o.v/t*100:0;
     return `<button class="opt ${voted?'':'vote'} ${voted&&mine[p.id]===j?'mine':''} ${voted&&o.v===max?'lead':''}" data-j="${j}" style="--col:${COLORS[j%6]}" ${voted?'tabindex="-1"':''}>
      <div class="bar" style="width:${voted?pc:0}%" data-w="${pc}"></div>
      ${e?`<span class="emo">${e}</span>`:''}<span class="lbl">${esc(l)}</span>
      <span class="pct" data-pct="${pc}">${voted?pc.toFixed(0):0}%</span><span class="cnt" data-v="${o.v}">${o.v.toLocaleString()}</span></button>`}).join('')}</div>
   <div class="foot"><span class="total"><b data-t="${t}">${t.toLocaleString()}</b> votes</span>
    ${voted?`<button class="link" data-act="undo">Change vote</button>`:`<button class="link" data-act="peek">Peek results</button>`}</div></article>`;
}
function render(){
  const list=polls.filter(p=>(filter==='All'||p.c===filter)&&p.q.toLowerCase().includes(query.toLowerCase()));
  $('#grid').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">No polls found. Create one! 🎈</div>';
  stats();
}
function stats(){
  anim($('#sPolls'),polls.length);anim($('#sVotes'),polls.reduce((a,p)=>a+total(p),0));anim($('#sMine'),Object.keys(mine).length);
}
function anim(el,to,dur=800){
  const from=+el.dataset.v||0;el.dataset.v=to;if(from===to){el.textContent=to.toLocaleString();return}
  const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e).toLocaleString();if(k<1)requestAnimationFrame(f)})(t0);
}
/* update a card in place so bars & numbers animate smoothly */
function update(p,bump){
  const card=document.querySelector(`[data-id="${p.id}"]`);if(!card)return;
  const t=total(p),voted=mine[p.id]!==undefined,max=Math.max(...p.o.map(o=>o.v));
  card.classList.toggle('voted',voted);
  card.querySelectorAll('.opt').forEach((b,j)=>{
    const o=p.o[j],pc=t?o.v/t*100:0;
    b.classList.toggle('vote',!voted);b.classList.toggle('mine',voted&&mine[p.id]===j);b.classList.toggle('lead',voted&&o.v===max);
    b.querySelector('.bar').style.width=(voted?pc:0)+'%';
    const pe=b.querySelector('.pct'),ce=b.querySelector('.cnt');
    const from=+pe.dataset.pct||0;pe.dataset.pct=pc;
    const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/900),e=1-Math.pow(1-k,3);pe.textContent=Math.round(from+(pc-from)*e)+'%';if(k<1)requestAnimationFrame(f)})(t0);
    anim(ce,o.v,900);
    if(bump===j){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
  });
  anim(card.querySelector('.total b'),t,900);
  const f=card.querySelector('.foot');
  const old=f.querySelector('.link');old.dataset.act=voted?'undo':'peek';old.textContent=voted?'Change vote':'Peek results';
}
$('#grid').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;const p=polls.find(x=>x.id===card.dataset.id);
  const act=e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='undo'){p.o[mine[p.id]].v--;delete mine[p.id];save();update(p);stats();toast('Vote removed — pick again!')}
    else{card.classList.toggle('voted');const v=card.classList.contains('voted');card.dataset.peek=v;
      const t=total(p);card.querySelectorAll('.opt').forEach((b,j)=>{const pc=t?p.o[j].v/t*100:0;b.querySelector('.bar').style.width=v?pc+'%':'0%';
        const pe=b.querySelector('.pct');pe.dataset.pct=pc;pe.textContent=Math.round(pc)+'%'});
      act.textContent=v?'Hide results':'Peek results'}
    return;
  }
  const opt=e.target.closest('.opt.vote');if(!opt||card.dataset.peek==='true')return;
  const j=+opt.dataset.j;p.o[j].v++;mine[p.id]=j;save();
  const r=opt.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,COLORS[j%6]);
  update(p,j);stats();toast('Vote counted! 🎉');
});
/* peek mode: allow voting after peek */
$('#grid').addEventListener('click',e=>{
  const opt=e.target.closest('.opt');const card=e.target.closest('.card');
  if(!opt||!card||card.dataset.peek!=='true')return;
  const p=polls.find(x=>x.id===card.dataset.id);if(mine[p.id]!==undefined)return;
  const j=+opt.dataset.j;p.o[j].v++;mine[p.id]=j;card.dataset.peek='';save();
  const r=opt.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,COLORS[j%6]);
  update(p,j);stats();toast('Vote counted! 🎉');
});
/* simulated live votes from other visitors */
setInterval(()=>{
  if(document.hidden||!polls.length)return;
  const p=polls[Math.random()*polls.length|0];const j=Math.random()*p.o.length|0;
  p.o[j].v+=1+(Math.random()*3|0);save();
  const card=document.querySelector(`[data-id="${p.id}"]`);
  if(card&&(mine[p.id]!==undefined||card.dataset.peek==='true')){update(p);card.dataset.peek==='true'&&mine[p.id]===undefined&&null}
  else if(card){const b=card.querySelector('.total b');anim(b,total(p),700);b.dataset.t=total(p)}
  const sv=$('#sVotes');anim(sv,polls.reduce((a,q)=>a+total(q),0),700);
},2600);

/* toast */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
/* confetti */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function confetti(x,y,col){
  const cols=[col,'#ffb020','#ff6fa8','#2ec4b6','#4aa3ff'];
  for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:3+Math.random()*4,c:cols[i%5],rot:Math.random()*6,vr:Math.random()-.5,l:1})}
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.rot+=p.vr;p.l-=.014;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}
  if(parts.length)requestAnimationFrame(tick);else run=false;
}
/* modal */
function optRow(v=''){const d=document.createElement('div');d.style.cssText='display:flex;gap:6px;margin-bottom:8px';
  d.innerHTML=`<input maxlength="40" placeholder="Option" value="${v}" required><button type="button" class="link" title="Remove">✕</button>`;
  d.querySelector('button').onclick=()=>{if($('#fo').children.length>2)d.remove()};$('#fo').appendChild(d)}
function openM(){$('#form').reset();$('#fo').innerHTML='';optRow();optRow();$('#modal').classList.add('open');$('#fq').focus()}
$('#new').onclick=openM;$('#cancel').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('open')};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});
$('#addOpt').onclick=()=>{if($('#fo').children.length<5)optRow();else toast('Max 5 options')};
$('#form').onsubmit=e=>{e.preventDefault();
  const o=[...$('#fo').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);if(o.length<2)return;
  polls.unshift({id:'u'+Date.now(),q:$('#fq').value.trim(),c:$('#fc').value,o:o.map(t=>({t,v:0}))});
  save();$('#modal').classList.remove('open');filter='All';query='';tools();render();toast('Poll published! 🚀');
};
$('#reset').onclick=()=>{seed();save();filter='All';query='';tools();render();toast('Demo reset')};
tools();render();
</script>
</body>
</html>
