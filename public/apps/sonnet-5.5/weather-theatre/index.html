<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Theatre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<style>
:root{--accent:#e0a458;--accent-rgb:224,164,88;--ink:#f4ead7;--muted:#a99d8a;--panel:#15111a;--panel2:#1d1824;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0b080d;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(var(--accent-rgb),.16),transparent 70%),radial-gradient(900px 500px at 90% 110%,rgba(var(--accent-rgb),.08),transparent 70%);
  transition:background .6s}
#root{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand h1{font:700 26px/1 Cinzel,serif;letter-spacing:.22em;margin:0;text-transform:uppercase;color:#f1dfb4}
.brand p{margin:6px 0 0;font:italic 500 16px 'Cormorant Garamond',Georgia,serif;color:var(--muted)}
.toggle{display:flex;align-items:center;background:#120e16;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px;position:relative;cursor:pointer;user-select:none}
.toggle button{all:unset;position:relative;z-index:1;cursor:pointer;padding:8px 18px;font:600 13px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .3s;border-radius:999px}
.toggle button[aria-pressed=true]{color:#17110a}
.toggle button:focus-visible,.chip:focus-visible,.day:focus-visible,.replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(135deg,#ffe6a8,var(--accent));transition:transform .45s cubic-bezier(.6,.1,.2,1);box-shadow:0 0 18px rgba(var(--accent-rgb),.5)}
.toggle.night .knob{transform:translateX(100%);background:linear-gradient(135deg,#d8e0ff,#8e9ee0)}
.proscenium{position:relative;padding:16px;border-radius:14px;background:linear-gradient(145deg,#5b3f14,#e9cd8a 18%,#7a5a22 42%,#f0d899 62%,#6b4c18 82%,#3f2b0c);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 120px rgba(var(--accent-rgb),.12)}
.proscenium:before{content:"";position:absolute;inset:7px;border-radius:9px;border:1px solid rgba(0,0,0,.45);pointer-events:none}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.8),0 0 0 2px rgba(0,0,0,.6)}
.stage canvas{width:100%;height:100%;display:block;cursor:pointer}
.act{position:absolute;left:18px;top:17.5%;font:600 11px Inter;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,240,210,.85);text-shadow:0 1px 8px #000;transition:opacity .6s;pointer-events:none;z-index:2}
.subtitle{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);width:min(82%,900px);text-align:center;padding:12px 22px 14px;border-radius:10px;background:linear-gradient(180deg,rgba(8,6,10,.55),rgba(8,6,10,.78));backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);font:italic 600 clamp(15px,2.15vw,24px)/1.38 'Cormorant Garamond',Georgia,serif;color:#fff4dc;text-shadow:0 1px 10px rgba(0,0,0,.8);transition:opacity .6s,transform .6s;z-index:2;pointer-events:none}
.subtitle.off{opacity:0;transform:translateX(-50%) translateY(10px)}
.subtitle .ghost{color:transparent}
.subtitle .cur{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.12em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.replay{all:unset;position:absolute;right:14px;top:17.5%;z-index:3;cursor:pointer;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:999px;color:#fff1cf;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);transition:background .2s}
.replay:hover{background:rgba(0,0,0,.7)}
.deck{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-top:20px}
@media(max-width:860px){.deck{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h2{margin:0 0 4px;font:700 13px Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;color:#e9d5a2}
.card .sub{margin:0 0 14px;font:italic 500 15px 'Cormorant Garamond',serif;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:1000px){.days{grid-template-columns:repeat(6,1fr)}}
.day{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 4px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:transform .25s,background .25s,border-color .25s}
.day:hover{transform:translateY(-3px);background:rgba(255,255,255,.07)}
.day.sel{border-color:var(--accent);background:rgba(var(--accent-rgb),.13);box-shadow:0 0 22px rgba(var(--accent-rgb),.2)}
.day .dn{font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.day .ic{font-size:28px;margin:6px 0 2px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.day .tt{font:700 20px Cinzel,serif}
.day .lo{font:500 12px Inter;color:var(--muted)}
.detail{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;font:500 13px Inter;color:var(--muted)}
.detail b{color:var(--ink);font-weight:600}
.slider{margin:0 0 16px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider label{font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.slider label span{margin-right:8px;font-size:16px}
.slider output{font:600 12px Inter;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--c) calc(var(--v)*1%),rgba(255,255,255,.1) calc(var(--v)*1%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 70%);border:2px solid rgba(0,0,0,.4);box-shadow:0 0 14px var(--c);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.4);box-shadow:0 0 14px var(--c)}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}
footer{margin-top:22px;text-align:center;font:italic 500 14px 'Cormorant Garamond',serif;color:#6f6578}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
const h=React.createElement,{useState,useEffect,useRef,useMemo,useCallback}=React;

/* ---------------- Mock forecast ---------------- */
const CITY="Port Marlowe";
const FORECAST=[
 {d:'Mon',name:'Monday',cond:'clear',label:'Clear',ic:'☀️',t:24,lo:15,wind:8,pop:0},
 {d:'Tue',name:'Tuesday',cond:'cloud',label:'Overcast',ic:'☁️',t:17,lo:11,wind:14,pop:20},
 {d:'Wed',name:'Wednesday',cond:'rain',label:'Rain',ic:'🌧️',t:13,lo:9,wind:22,pop:85},
 {d:'Thu',name:'Thursday',cond:'storm',label:'Thunderstorm',ic:'⛈️',t:11,lo:7,wind:48,pop:95},
 {d:'Fri',name:'Friday',cond:'snow',label:'Snow',ic:'❄️',t:-2,lo:-7,wind:12,pop:70},
 {d:'Sat',name:'Saturday',cond:'wind',label:'Gales',ic:'💨',t:9,lo:3,wind:56,pop:10}
];
const ROMAN=['I','II','III','IV','V','VI'];
const LINES={
 clear:{cosy:"A buttery sun settles over the rooftops, {t}° and drowsy — perfect for toast and open windows.",
        eerie:"The sky is far too clean at {t}°. Every shadow stands a little too still, waiting for its cue.",
        heroic:"{t}° and not a cloud to hide behind. The horizon rises like a challenge, and the wind brings fanfare."},
 cloud:{cosy:"Soft wool clouds blanket the town at {t}°; the cardigan forecast is in full effect.",
        eerie:"A low grey ceiling presses down at {t}°. The streetlamps hum a note nobody asked for.",
        heroic:"Clouds muster like armies at {t}°, and through one gap a single banner of sunlight charges."},
 rain:{cosy:"Rain taps a gentle tune on the roof at {t}°. Windows fog, tea steeps, nobody is going anywhere.",
        eerie:"Rain whispers down at {t}°, each drop counting something. The puddles reflect more than they should.",
        heroic:"Rain lashes the cliffs at {t}°, yet one lone figure stands unbowed against the {w} km/h gale."},
 storm:{cosy:"Thunder grumbles far off at {t}°, like a big dog dreaming. Blankets are deployed.",
        eerie:"Lightning writes a name across the sky at {t}°. The thunder answers in a voice you almost recognise.",
        heroic:"The storm breaks at {t}°! Lightning forges the skyline as our hero plants a flag in {w} km/h winds."},
 snow:{cosy:"Snow drifts down at {t}°, quiet as a held breath. Every lamp wears a small white hat.",
        eerie:"Snow falls without a sound at {t}°. Footprints appear in the yard, leading nowhere.",
        heroic:"Snow sweeps the summit at {t}°. Up here only the brave — and the very well insulated — dare tread."},
 wind:{cosy:"A frisky {w} km/h breeze at {t}° tumbles laundry and leaves; the kitchen smells of cinnamon.",
        eerie:"The wind howls at {w} km/h, {t}° — and beneath it, a second voice, slightly out of time.",
        heroic:"Winds of {w} km/h at {t}° whip every cape and banner. Today the weather is on your side."}
};
const CLAUSE={cosy:"Somewhere a kettle hums agreeably.",eerie:"Something in the fog is listening.",heroic:"Cue the trumpets: destiny enters stage left."};
const NIGHTTAG={cosy:"Lamplight does the rest.",eerie:"Midnight has its own opinions.",heroic:"The stars hold up their spotlights."};
const MOODS=['cosy','eerie','heroic'];
function narrate(day,dom,sec,night){
  const f=FORECAST[day];
  let s=LINES[f.cond][dom].replace('{t}',f.t).replace('{w}',f.wind);
  if(sec) s+=" "+CLAUSE[sec];
  if(night) s+=" "+NIGHTTAG[dom];
  return s;
}

/* ---------------- helpers ---------------- */
const W=1600,H=900,FY=700,BASE=790;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a=1)=>"rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a+")";
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const fract=x=>x-Math.floor(x);
const hh=n=>fract(Math.sin(n*127.1+311.7)*43758.5453);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const PALH={
 cosy:{day:{top:'#f2b27a',bot:'#ffe7b8',ridge:'#b9754f',acc:'#ffb454'},night:{top:'#2b1c3d',bot:'#b4577a',ridge:'#3b2344',acc:'#ffb454'}},
 eerie:{day:{top:'#6d8484',bot:'#c3ccbd',ridge:'#4b5d5a',acc:'#9bf0c8'},night:{top:'#050b14',bot:'#2c4b4f',ridge:'#12262b',acc:'#9bf0c8'}},
 heroic:{day:{top:'#2b6bd6',bot:'#ffd986',ridge:'#4a5d8a',acc:'#ffd166'},night:{top:'#0e1a4a',bot:'#e8803c',ridge:'#1c2750',acc:'#ffd166'}}
};
const PAL={};
for(const m of MOODS){PAL[m]={};for(const p of ['day','night']){PAL[m][p]={};for(const k in PALH[m][p])PAL[m][p][k]=hex(PALH[m][p][k]);}}
const LIGHT={cosy:[255,196,116],eerie:[140,255,205],heroic:[255,234,165]};
const CURT={cosy:[150,36,44],eerie:[58,40,96],heroic:[158,22,30]};
const CONDS={
 clear:{cloud:.15,grey:0,rain:0,snow:0,wind:.2,storm:0},
 cloud:{cloud:.8,grey:.28,rain:0,snow:0,wind:.3,storm:0},
 rain:{cloud:1,grey:.48,rain:1,snow:0,wind:.4,storm:0},
 storm:{cloud:1,grey:.66,rain:1.4,snow:0,wind:.85,storm:1},
 snow:{cloud:.85,grey:.2,rain:0,snow:1,wind:.25,storm:0},
 wind:{cloud:.55,grey:.1,rain:0,snow:0,wind:1,storm:0}
};

function ridgeY(x,seed,base,amp,m){
  const s=x*0.004+seed;
  const soft=Math.sin(s*1.3)*.5+Math.sin(s*2.7+1)*.3+Math.sin(s*.6+2)*.4;
  const jag=Math.abs(Math.sin(s*3.1))*.9+Math.abs(Math.sin(s*7.3+1))*.35-.6;
  const spike=Math.pow(Math.abs(Math.sin(s*5+seed)),6)*.8-.2;
  return base-amp*(soft*(.5+m.c*.8)+jag*(m.h*1.6)+spike*(m.e*1.0)+m.h*.8);
}

/* ---------------- Canvas stage ---------------- */
function Stage({target,cb}){
  const ref=useRef(null);
  const tg=useRef(target);tg.current=target;
  const cbr=useRef(cb);cbr.current=cb;
  useEffect(()=>{
    const cv=ref.current,ctx=cv.getContext('2d');
    const R=mulberry(11);
    const trees=[...Array(30)].map((_,i)=>({x:-40+i*(W+80)/30+R()*30,r:R(),s:.7+R()*.7,type:-1,sc:1,ph:R()*6.28}));
    const clouds=[...Array(16)].map((_,i)=>({x:R()*W*1.4-200,y:40+R()*250,s:.7+R()*1.3,sp:6+R()*14,a:0,ly:i/16}));
    const stars=[...Array(170)].map(()=>({x:R()*W,y:R()*430,r:.5+R()*1.4,ph:R()*6.28}));
    const rain=[...Array(520)].map(()=>({x:R()*(W+500)-200,y:R()*H,z:R()}));
    const snow=[...Array(300)].map(()=>({x:R()*(W+200)-100,y:R()*H,z:R(),ph:R()*6.28}));
    const leaves=[...Array(40)].map(()=>({x:R()*W,y:200+R()*600,z:R(),ph:R()*6.28}));
    const motes=[...Array(90)].map((_,i)=>({k:Math.floor(i/30),x:R()*W,y:260+R()*520,ph:R()*6.28,sp:.3+R()*.7}));
    const bats=[...Array(5)].map(()=>({x:R()*W,y:120+R()*220,sp:60+R()*70,ph:R()*6.28}));
    const splashes=[];
    const fenceTilt=[...Array(8)].map(()=>(R()-.5)*.35);
    function sprite(c){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,rgb(c,1));gr.addColorStop(.25,rgb(c,.55));gr.addColorStop(1,rgb(c,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return s;}
    const SPR=[sprite([235,255,130]),sprite([150,255,230]),sprite([255,170,60]),sprite([255,214,140])];

    const S={c:.7,e:.25,h:.35,n:0,px:0,pxT:0,hasPtr:false,
      cfg:Object.assign({},CONDS.clear),p:0,want:0,closedT:-.1,swapTo:null,shown:tg.current.day,
      boost:0,lightning:0,boltT:2,bolt:null,spPh:[0,2.1],lastCurt:null,replay:tg.current.replay};
    const C={};
    let t=0,last=performance.now(),raf=0,scale=1;
    if(/open/.test(location.hash)){S.p=1;S.want=1;}
    S.c=tg.current.c;S.e=tg.current.e;S.h=tg.current.h;S.n=tg.current.night?1:0;
    S.cfg=Object.assign({},CONDS[FORECAST[S.shown].cond]);

    function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth,hh_=cv.clientHeight;if(!w)return;cv.width=Math.round(w*dpr);cv.height=Math.round(hh_*dpr);scale=cv.width/W;}
    const ro=new ResizeObserver(resize);ro.observe(cv);resize();
    const onMove=e=>{const r=cv.getBoundingClientRect();S.pxT=((e.clientX-r.left)/r.width)*2-1;S.hasPtr=true};
    const onLeave=()=>{S.hasPtr=false};
    cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerleave',onLeave);
    cv.addEventListener('click',()=>{S.replay=-1;cmdReplay();});
    function cmdReplay(){ if(S.p>0.02||S.want){S.want=0;} }

    /* ---- state update ---- */
    function update(dt){
      const T=tg.current,k=1-Math.exp(-dt*5);
      S.c=lerp(S.c,T.c,k);S.e=lerp(S.e,T.e,k);S.h=lerp(S.h,T.h,k);
      S.n=lerp(S.n,T.night?1:0,1-Math.exp(-dt*1.6));
      if(!S.hasPtr)S.pxT=Math.sin(t*.17)*.55;
      S.px=lerp(S.px,S.pxT,1-Math.exp(-dt*2.5));
      if(T.replay!==S.replay){S.replay=T.replay;S.want=0;}
      if(T.day!==S.shown){S.want=0;S.swapTo=T.day;}
      // curtain
      if(S.want){S.p=Math.min(1,S.p+dt/2.8);}
      else{
        S.p=Math.max(0,S.p-dt/1.5);
        if(S.p<=0){
          S.closedT+=dt;
          if(S.swapTo!=null&&S.swapTo!==S.shown){S.shown=S.swapTo;S.swapTo=null;cbr.current.onDay(S.shown);}
          if(S.closedT>.75){S.want=1;S.closedT=0;S.boost=1;}
        }else S.closedT=0;
      }
      const open=!!S.want&&S.p>.45;
      if(open!==S.lastCurt){S.lastCurt=open;cbr.current.onCurtain(open);}
      S.boost=Math.max(0,S.boost-dt/3.2);
      const tc=CONDS[FORECAST[S.shown].cond],kc=1-Math.exp(-dt*3);
      for(const key in tc)S.cfg[key]=lerp(S.cfg[key],tc[key],kc);
      // lightning
      if(S.cfg.storm>.5&&S.p>.3){S.boltT-=dt;if(S.boltT<0){S.lightning=1;S.boltT=2+Math.random()*4.5;
        const bx=250+Math.random()*1100;const pts=[[bx,60]];let x=bx,y=60;while(y<650){y+=40+Math.random()*50;x+=(Math.random()-.5)*90;pts.push([x,y]);}S.bolt=pts;}}
      S.lightning=Math.max(0,S.lightning-dt*2.6);
      // colours
      const ws=S.c+S.e+S.h;let wc,we,wh;if(ws<.05){wc=we=wh=1/3}else{wc=S.c/ws;we=S.e/ws;wh=S.h/ws}
      const wt={cosy:wc,eerie:we,heroic:wh};
      function mood(key){const o=[0,0,0];for(const m of MOODS){const c=mixc(PAL[m].day[key],PAL[m].night[key],S.n);o[0]+=c[0]*wt[m];o[1]+=c[1]*wt[m];o[2]+=c[2]*wt[m];}return o;}
      let top=mood('top'),bot=mood('bot'),ridge=mood('ridge');C.acc=mood('acc');
      const cf=S.cfg;
      const grey=mixc([150,158,170],[44,50,64],clamp(S.n*.7+cf.storm*.5));
      top=mixc(top,grey,cf.grey);bot=mixc(bot,mixc(grey,[255,255,255],.15),cf.grey*.9);
      bot=mixc(bot,mixc([225,234,248],[60,70,95],S.n),cf.snow*.3);
      C.top=top;C.bot=bot;
      C.far=mixc(ridge,bot,.5);C.mid=ridge;C.near=mixc(ridge,[6,4,10],.62);
      C.cloud=mixc(mixc(bot,[255,255,255],.45),mixc(grey,[20,24,34],.35),cf.grey*.95);
      C.cloud=mixc(C.cloud,[20,24,40],S.n*.55);
      C.light=[0,0,0];C.curt=[0,0,0];
      for(const m of MOODS){for(let i=0;i<3;i++){C.light[i]+=LIGHT[m][i]*wt[m];C.curt[i]+=CURT[m][i]*wt[m];}}
      C.floor=mixc(mixc([86,56,40],[34,22,24],S.n),[32,44,46],we*.55);
      C.fog=mixc(mixc(bot,[255,255,255],.35),[20,30,40],S.n*.6);
      C.wt=wt;
    }

    /* ---- drawing pieces ---- */
    function drawSky(){
      const g=ctx.createLinearGradient(0,0,0,FY);g.addColorStop(0,rgb(C.top));g.addColorStop(1,rgb(C.bot));

      for(const b of bats){
        const x=((b.x+t*b.sp)%(W+260))-130+S.px*40,y=b.y+Math.sin(t*2+b.ph)*30,f=Math.sin(t*14+b.ph)*16;
        ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-14,y-14+f,x-30,y-4+f*.5);ctx.quadraticCurveTo(x-18,y+2,x-10,y+4);ctx.quadraticCurveTo(x-4,y+9,x,y+4);
        ctx.quadraticCurveTo(x+4,y+9,x+10,y+4);ctx.quadraticCurveTo(x+18,y+2,x+30,y-4+f*.5);ctx.quadraticCurveTo(x+14,y-14+f,x,y);ctx.fill();
      }
    }
    function drawWeather(dt){
      const cf=S.cfg,off=S.px*90,slant=.12+cf.wind*.55;
      // rain
      const nr=Math.min(rain.length,cf.rain*370|0);
      if(nr>0){
        ctx.lineCap='round';ctx.strokeStyle=S.n>.5?'rgba(170,195,235,1)':'rgba(205,220,245,1)';
        for(let i=0;i<nr;i++){const r=rain[i],v=900+r.z*900,len=14+r.z*26;
          r.y+=v*dt;r.x+=v*slant*dt;
          const gz=720+r.z*170;
          if(r.y>gz){if(r.z>.35&&splashes.length<90)splashes.push({x:r.x,y:gz,a:1});r.y=-30;r.x=Math.random()*(W+500)-200;}
          ctx.globalAlpha=(.22+r.z*.35)*Math.min(1,cf.rain);ctx.lineWidth=.8+r.z*1.3;
          ctx.beginPath();ctx.moveTo(r.x+off*r.z,r.y);ctx.lineTo(r.x+off*r.z-slant*len,r.y-len);ctx.stroke();}
        ctx.globalAlpha=1;
      }
      for(let i=splashes.length-1;i>=0;i--){const s=splashes[i];s.a-=dt*3.5;if(s.a<=0){splashes.splice(i,1);continue;}
        ctx.strokeStyle='rgba(200,215,240,'+s.a*.5+')';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(s.x+off*.5,s.y,(1-s.a)*14+2,(1-s.a)*4+1,0,0,6.283);ctx.stroke();}
      // snow
      const ns=Math.min(snow.length,cf.snow*300|0);
      if(ns>0){ctx.fillStyle='#fff';
        for(let i=0;i<ns;i++){const s=snow[i];s.y+=(40+s.z*75)*dt;s.x+=Math.sin(t*.9+s.ph)*22*dt+cf.wind*90*dt;
          if(s.y>730+s.z*160){s.y=-10;s.x=Math.random()*(W+200)-100;}if(s.x>W+100)s.x=-100;
          ctx.globalAlpha=.55+s.z*.4;ctx.beginPath();ctx.arc(s.x+off*s.z,s.y,1.1+s.z*2.7,0,6.283);ctx.fill();}
        ctx.globalAlpha=1;}
      // leaves / wind streaks
      const nl=Math.max(0,((cf.wind-.3)*57)|0);
      if(nl>0){const lc=mixc(C.acc,[120,70,30],.35);
        for(let i=0;i<Math.min(nl,leaves.length);i++){const l=leaves[i];
          l.x+=(220+l.z*340)*cf.wind*dt;l.y+=(Math.sin(t*3+l.ph)*50+14)*dt;
          if(l.x>W+60){l.x=-60;l.y=200+Math.random()*600;}
          const X=l.x+off*l.z,sz=4+l.z*5;
          ctx.strokeStyle='rgba(255,255,255,'+(.08+.1*l.z)+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(X-80*l.z-30,l.y);ctx.lineTo(X,l.y);ctx.stroke();
          ctx.fillStyle=rgb(lc,.9);ctx.save();ctx.translate(X,l.y);ctx.rotate(t*4+l.ph);ctx.beginPath();ctx.ellipse(0,0,sz,sz*.45,0,0,6.283);ctx.fill();ctx.restore();}
      }
    }
    function drawFootlights(){
      const g=ctx.createLinearGradient(0,H,0,H-170);g.addColorStop(0,rgb(C.light,.3));g.addColorStop(1,rgb(C.light,0));
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(0,H-170,W,170);ctx.restore();
      ctx.fillStyle='#120b08';ctx.fillRect(0,H-16,W,16);ctx.fillStyle='rgba(215,175,95,.8)';ctx.fillRect(0,H-17,W,2);
      for(let i=0;i<20;i++){const x=40+i*(W-80)/19;ctx.fillStyle=rgb(mixc(C.light,[255,255,255],.5),.95);ctx.beginPath();ctx.arc(x,H-14,7,Math.PI,0);ctx.fill();
        ctx.save();ctx.globalCompositeOperation='lighter';glow(3,x,H-18,40,.75);ctx.restore();}
    }
    function drawVignette(){
      const g=ctx.createRadialGradient(W/2,H*.5,320,W/2,H*.5,1050);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(.5+.2*S.e+.15*S.n)+')');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }
    function drawCurtain(){
      const ep=easeIO(S.p);
      if(ep<.995){
        const base=C.curt,N=56;
        const edge=y=>{const q=clamp(ep*(.78+.5*(y/H)));return lerp(W/2+8,W*.075,easeIO(q));};
        const panel=()=>{
          const eT=edge(0),eB=edge(H);
          for(let i=0;i<N;i++){
            const u=i/N,u2=(i+1)/N;
            const f=.5+.5*Math.cos((u+.5/N)*Math.PI*2*7+Math.sin(t*.7+u*5)*.12*(1-ep));
            const sh=.38+.82*f;
            ctx.fillStyle="rgb("+(base[0]*sh|0)+","+(base[1]*sh|0)+","+(base[2]*sh|0)+")";
            ctx.beginPath();ctx.moveTo(u*eT,0);ctx.lineTo(u2*eT+.6,0);ctx.lineTo(u2*eB+.6,H);ctx.lineTo(u*eB,H);ctx.closePath();ctx.fill();
          }
          const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(.35,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.4)');
          ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(eT,0);ctx.lineTo(eB,H);ctx.lineTo(0,H);ctx.fill();
          ctx.strokeStyle='rgba(222,181,98,.95)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(eT,0);ctx.lineTo(eB,H);ctx.stroke();
          ctx.strokeStyle='rgba(120,80,20,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(eT-4,0);ctx.lineTo(eB-4,H);ctx.stroke();
          // fringe
          ctx.strokeStyle='rgba(222,181,98,.9)';ctx.lineWidth=2;ctx.beginPath();
          for(let y=40;y<H;y+=11){const ex=lerp(eT,eB,y/H);ctx.moveTo(ex,y);ctx.lineTo(ex+3,y+8);}ctx.stroke();
        };
        panel();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);panel();ctx.restore();
        // title
        const ta=1-ep*4;
        if(ta>0){
          const f=FORECAST[S.shown];
          ctx.save();ctx.globalAlpha=ta;ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=12;
          ctx.fillStyle='#f0d596';ctx.font='700 76px Cinzel,serif';ctx.fillText('WEATHER THEATRE',W/2,H/2-30);
          ctx.font='italic 500 34px "Cormorant Garamond",Georgia,serif';ctx.fillStyle='#f7e7c0';
          ctx.fillText('Act '+ROMAN[S.shown]+' — '+f.name+' · '+f.label+' · '+f.t+'°',W/2,H/2+30);
          ctx.font='500 18px Inter,sans-serif';ctx.fillStyle='rgba(240,213,150,.75)';ctx.fillText('— '+CITY.toUpperCase()+' —',W/2,H/2+76);
          ctx.restore();}
      }
      // valance
      const vb=90,sc=10,sw=W/sc,col=C.curt;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,vb);
      for(let i=sc-1;i>=0;i--){ctx.quadraticCurveTo(i*sw+sw*.5+sw*.0,vb+58,i*sw,vb);}
      ctx.closePath();
      const vg=ctx.createLinearGradient(0,0,0,vb+50);vg.addColorStop(0,rgb(mixc(col,[0,0,0],.5)));vg.addColorStop(1,rgb(mixc(col,[255,255,255],.04)));
      ctx.fillStyle=vg;ctx.fill();
      ctx.save();ctx.clip();
      for(let i=0;i<sc*4;i++){const f=.5+.5*Math.cos(i/(sc*4)*Math.PI*2*sc);ctx.fillStyle='rgba(0,0,0,'+(.28-.28*f)+')';ctx.fillRect(i*W/(sc*4),0,W/(sc*4),vb+60);}
      ctx.restore();
      ctx.strokeStyle='rgba(224,184,100,.95)';ctx.lineWidth=5;ctx.stroke();
      ctx.fillStyle='rgba(224,184,100,.95)';ctx.fillRect(0,vb-86,W,8);
      for(let i=0;i<sc;i++){const x=i*sw;ctx.fillStyle='#e2b864';ctx.beginPath();ctx.arc(x,vb+2,7,0,6.283);ctx.fill();ctx.fillRect(x-2,vb+8,4,18);ctx.beginPath();ctx.arc(x,vb+30,5,0,6.283);ctx.fill();}
      const sg=ctx.createLinearGradient(0,vb+30,0,vb+120);sg.addColorStop(0,'rgba(0,0,0,.45)');sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg;ctx.fillRect(0,vb+30,W,90);
    }

    /* ---- frame ---- */
    function frame(now){
      const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
      if(cv.width){
        update(dt);
        ctx.setTransform(scale,0,0,scale,0,0);
        ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
        drawSky();drawStars();drawCelestial();drawRays();drawClouds(dt);drawBolt();
        drawBats();
        const cf=S.cfg,snowAmt=clamp(S.h*.8+cf.snow*.75)*(1-.5*S.n);
        drawRidge(520,120,1.0,mixc(C.far,C.bot,.15),18,snowAmt,false);
        fogBand(600,1,9,0);fogBand(630,.8,-14,1);
        drawRidge(610,70,5.0,C.mid,36,snowAmt*.5,true);
        fogBand(690,1,12,2);
        drawFloor();
        drawProps();
        drawSpots(dt);
        drawMotes(dt);
        drawWeather(dt);
        fogBand(780,.9,16,3);fogBand(850,.6,-10,4);
        if(S.lightning>.02){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(205,220,255,'+S.lightning*.32*(.7+.3*Math.sin(t*70))+')';ctx.fillRect(0,0,W,H);ctx.restore();}
        drawFootlights();drawVignette();drawCurtain();
      }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    return()=>{cancelAnimationFrame(raf);ro.disconnect();cv.removeEventListener('pointermove',onMove);cv.removeEventListener('pointerleave',onLeave);};
  },[]);
  return h('canvas',{ref,'aria-label':'Animated weather stage'});
}

/* ---------------- Typewriter ---------------- */
function Typewriter({text,ready}){
  const[n,setN]=useState(0);
  useEffect(()=>{
    let i=0,to;setN(0);
    if(!ready)return;
    const step=()=>{i++;setN(i);if(i<text.length){const ch=text[i-1];to=setTimeout(step,/[.!;—]/.test(ch)?240:ch===','?150:ch===' '?32:22+Math.random()*28);}};
    to=setTimeout(step,450);
    return()=>clearTimeout(to);
  },[text,ready]);
  return h('span',null,text.slice(0,n),h('span',{className:'cur'}),h('span',{className:'ghost'},text.slice(n)));
}

/* ---------------- App ---------------- */
const SLIDERS=[
 {k:'c',name:'Cosy',ic:'🕯️',col:'#ffb454'},
 {k:'e',name:'Eerie',ic:'🌫️',col:'#7be0b4'},
 {k:'h',name:'Heroic',ic:'⚔️',col:'#ffd23f'}
];
const PRESETS=[
 {n:'Hearth',v:{c:.95,e:.05,h:.1}},{n:'Haunt',v:{c:.1,e:.95,h:.1}},{n:'Epic',v:{c:.1,e:.1,h:.95}},
 {n:'Gothic Romance',v:{c:.55,e:.7,h:.2}},{n:'Fairytale',v:{c:.6,e:.35,h:.65}}
];

function App(){
  const[mood,setMood]=useState({c:.7,e:.25,h:.35});
  const[night,setNight]=useState(false);
  const[day,setDay]=useState(1);
  const[shown,setShown]=useState(1);
  const[open,setOpen]=useState(false);
  const[replay,setReplay]=useState(0);

  const target=useMemo(()=>({...mood,night,day,replay}),[mood,night,day,replay]);
  const cb=useMemo(()=>({onDay:setShown,onCurtain:setOpen}),[]);

  const{dom,sec,acc}=useMemo(()=>{
    const sum=mood.c+mood.e+mood.h||1;
    const w=MOODS.map((m,i)=>({m,v:mood[['c','e','h'][i]],n:mood[['c','e','h'][i]]/sum})).sort((a,b)=>b.v-a.v);
    const s=w[1].v>.3&&w[1].n>.28?w[1].m:null;
    const cols={cosy:[255,180,84],eerie:[123,224,180],heroic:[255,210,63]};
    const ac=[0,0,0];MOODS.forEach(m=>{const nn=(mood[{cosy:'c',eerie:'e',heroic:'h'}[m]])/sum;for(let i=0;i<3;i++)ac[i]+=cols[m][i]*nn;});
    return{dom:w[0].m,sec:s,acc:ac.map(Math.round)};
  },[mood]);

  useEffect(()=>{const r=document.documentElement.style;r.setProperty('--accent','rgb('+acc.join(',')+')');r.setProperty('--accent-rgb',acc.join(','));},[acc]);

  const text=useMemo(()=>narrate(shown,dom,sec,night),[shown,dom,sec,night]);
  const f=FORECAST[day];

  const slider=s=>h('div',{className:'slider',key:s.k},
    h('div',{className:'row'},h('label',{htmlFor:'sl-'+s.k},h('span',null,s.ic),s.name),h('output',null,Math.round(mood[s.k]*100)+'%')),
    h('input',{id:'sl-'+s.k,type:'range',min:0,max:100,value:Math.round(mood[s.k]*100),style:{'--c':s.col,'--v':mood[s.k]*100},
      onChange:e=>setMood(m=>({...m,[s.k]:e.target.value/100}))}));

  return h('div',{className:'wrap'},
    h('header',{className:'top'},
      h('div',{className:'brand'},h('h1',null,'Weather Theatre'),h('p',null,'One forecast. Three moods. Every night a different production.')),
      h('div',{className:'toggle'+(night?' night':''),role:'group','aria-label':'Performance time'},
        h('span',{className:'knob'}),
        h('button',{'aria-pressed':!night,onClick:()=>setNight(false)},'☀ Matinée'),
        h('button',{'aria-pressed':night,onClick:()=>setNight(true)},'☾ Night'))),
    h('div',{className:'proscenium'},
      h('div',{className:'stage'},
        h(Stage,{target,cb}),
        h('div',{className:'act',style:{opacity:open?1:0}},'Act '+ROMAN[shown]+' · '+FORECAST[shown].name+' · '+(night?'Night':'Matinée')),
        h('button',{className:'replay',onClick:()=>setReplay(r=>r+1)},'↻ Curtain call'),
        h('div',{className:'subtitle'+(open?'':' off'),'aria-live':'polite'},h(Typewriter,{text,ready:open})))),
    h('div',{className:'deck'},
      h('section',{className:'card'},
        h('h2',null,CITY+' · 6-Day Forecast'),
        h('p',{className:'sub'},'Pick a day — the curtain falls and the same weather returns in costume.'),
        h('div',{className:'days'},FORECAST.map((d,i)=>h('button',{key:d.d,className:'day'+(i===day?' sel':''),'aria-pressed':i===day,onClick:()=>setDay(i)},
          h('div',{className:'dn'},d.d),h('div',{className:'ic'},d.ic),h('div',{className:'tt'},d.t+'°'),h('div',{className:'lo'},'lo '+d.lo+'°')))),
        h('div',{className:'detail'},
          h('span',null,'Conditions ',h('b',null,f.label)),h('span',null,'Wind ',h('b',null,f.wind+' km/h')),h('span',null,'Precip ',h('b',null,f.pop+'%')),h('span',null,'High/Low ',h('b',null,f.t+'° / '+f.lo+'°')))),
      h('section',{className:'card'},
        h('h2',null,'Director’s Mixing Desk'),
        h('p',{className:'sub'},'Blend the moods; props rise from the trapdoor as you slide.'),
        SLIDERS.map(slider),
        h('div',{className:'chips'},PRESETS.map(p=>h('button',{key:p.n,className:'chip',onClick:()=>setMood(p.v)},p.n))))),
    h('footer',null,'All weather is invented. Applause is optional.'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
