<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cloud Painter ☁️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5a4f8a; --ink-soft:#8a82b5; --pink:#ff9ec7; --lilac:#c3b0ff; --sky:#9fd4ff;
    --glass:rgba(255,255,255,.74);
    --font:'Fredoka','Nunito',ui-rounded,'SF Pro Rounded','Comic Sans MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd4ff;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  canvas#sky.mouse{cursor:none}

  .logo{position:fixed;top:14px;left:16px;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;
    box-shadow:0 8px 28px rgba(120,100,200,.2),inset 0 0 0 2px rgba(255,255,255,.8);pointer-events:none}
  .logo svg{width:38px;height:38px;animation:bob 4s ease-in-out infinite}
  .logo h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px;
    background:linear-gradient(90deg,#ff7fb5,#a58bff,#5bb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}

  .actions{position:fixed;top:14px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 260px)}
  .btn{font:inherit;font-weight:600;font-size:15px;color:var(--ink);border:0;cursor:pointer;
    display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 20px rgba(120,100,200,.18),inset 0 0 0 2px rgba(255,255,255,.85);
    transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
  .btn:hover{transform:translateY(-3px) scale(1.05)}
  .btn:active{transform:scale(.94)}
  .btn .e{font-size:19px;line-height:1}
  .btn.primary{background:linear-gradient(135deg,#ff9ec7,#b79bff);color:#fff;text-shadow:0 1px 2px rgba(90,60,160,.3)}
  .btn.off{opacity:.6}

  .dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 20px);
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 18px;padding:12px 20px;
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:32px;
    box-shadow:0 14px 44px rgba(120,100,200,.28),inset 0 0 0 2px rgba(255,255,255,.85)}
  .grp{display:flex;align-items:center;gap:7px}
  .sep{width:2px;height:44px;border-radius:2px;background:linear-gradient(transparent,rgba(160,140,220,.3),transparent)}
  .lbl{font-size:11px;font-weight:600;color:var(--ink-soft);text-align:center;margin-top:2px;letter-spacing:.3px}

  .brush{border:0;background:rgba(255,255,255,.55);border-radius:18px;width:58px;padding:5px 2px 4px;cursor:pointer;font:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
  .brush svg{width:36px;height:36px}
  .brush span{font-size:11px;font-weight:600;margin-top:1px}
  .brush:hover{transform:translateY(-4px)}
  .brush.active{background:linear-gradient(160deg,#ffe0f0,#e0d4ff);box-shadow:0 4px 14px rgba(167,139,255,.45),inset 0 0 0 2.5px #fff;transform:translateY(-4px) scale(1.06)}

  .sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;padding:0;position:relative;
    box-shadow:inset 0 -3px 5px rgba(90,70,160,.18),0 2px 6px rgba(90,70,160,.2),inset 0 0 0 2px rgba(255,255,255,.9);
    transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
  .sw:hover{transform:scale(1.18)}
  .sw.active{transform:scale(1.22);box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--lilac),0 4px 10px rgba(90,70,160,.3)}
  .custom{overflow:hidden;background:conic-gradient(#ff9ec7,#ffe69a,#b5f0cf,#a8d8ff,#cdb6ff,#ff9ec7)}
  .custom input{position:absolute;inset:-6px;width:44px;height:44px;opacity:0;cursor:pointer}

  .slider{display:flex;flex-direction:column;align-items:stretch;width:112px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;outline:none;margin:6px 0 0;
    background:linear-gradient(90deg,#ffc6e0,#c9b8ff,#a8dcff);box-shadow:inset 0 2px 4px rgba(90,70,160,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;
    border:3px solid #b79bff;box-shadow:0 3px 8px rgba(90,70,160,.35)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #b79bff}

  .skyb{width:34px;height:34px;border-radius:12px;border:0;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 2px 6px rgba(90,70,160,.25);transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
  .skyb:hover{transform:scale(1.15) rotate(-4deg)}
  .skyb.active{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--lilac),0 4px 10px rgba(90,70,160,.3);transform:scale(1.15)}

  .hint{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);padding:16px 28px;border-radius:28px;font-size:22px;font-weight:600;text-align:center;
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 36px rgba(120,100,200,.25),inset 0 0 0 2px #fff;
    pointer-events:none;transition:opacity .8s,transform .8s;animation:float 3s ease-in-out infinite;max-width:86vw}
  .hint small{display:block;font-size:14px;color:var(--ink-soft);font-weight:500;margin-top:3px}
  .hint.gone{opacity:0;transform:translate(-50%,-70%)}
  @keyframes float{50%{margin-top:-8px}}

  .toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;padding:10px 20px;border-radius:999px;font-weight:600;
    background:#fff;box-shadow:0 8px 24px rgba(120,100,200,.3);pointer-events:none;transition:all .35s cubic-bezier(.3,1.5,.5,1);z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  @media (max-width:900px){
    .actions{max-width:calc(100vw - 32px);top:70px}
    .btn{padding:8px 12px;font-size:13px}
    .btn .t{display:none}
  }
  @media (max-width:640px){
    .dock{gap:8px 12px;padding:10px 12px;border-radius:26px}
    .sep{display:none}
    .brush{width:46px}.brush svg{width:28px;height:28px}.brush span{font-size:9px}
    .sw{width:26px;height:26px}.slider{width:92px}
    .logo h1{font-size:19px}.logo svg{width:30px;height:30px}
    .hint{font-size:17px}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="logo">
  <svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9e6ff"/></linearGradient></defs>
    <path d="M11 31a7 7 0 0 1-.5-14A10 10 0 0 1 29 14.5 8.3 8.3 0 0 1 31 31Z" fill="url(#lg)" stroke="#a58bff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="16" cy="24" r="1.7" fill="#5a4f8a"/><circle cx="25" cy="24" r="1.7" fill="#5a4f8a"/>
    <path d="M18 27.5q2.5 2.3 5 0" stroke="#5a4f8a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="13" cy="27" r="2" fill="#ffb3d1" opacity=".8"/><circle cx="28" cy="27" r="2" fill="#ffb3d1" opacity=".8"/></svg>
  <h1>Cloud Painter</h1>
</div>

<div class="actions">
  <button class="btn" id="undo" title="Undo (Ctrl+Z)"><span class="e">↩️</span><span class="t">Undo</span></button>
  <button class="btn" id="clear" title="Clear the sky"><span class="e">🧽</span><span class="t">Clear</span></button>
  <button class="btn" id="plane" title="Send an airplane"><span class="e">✈️</span><span class="t">Plane</span></button>
  <button class="btn" id="sound" title="Sound on/off"><span class="e">🔔</span><span class="t">Sound</span></button>
  <button class="btn primary" id="save" title="Save picture"><span class="e">💾</span><span class="t">Save</span></button>
</div>

<div class="hint" id="hint">Paint the sky with clouds! ☁️<small>Draw with your finger or mouse · tap a plane for a loop-the-loop</small></div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>

<div class="dock">
  <div class="grp" id="brushes">
    <button class="brush active" data-k="fluffy"><svg viewBox="0 0 40 40"><path d="M11 30a6.5 6.5 0 0 1-.5-13A9 9 0 0 1 27.500 14 7.800 7.800 0 0 1 29 30Z" fill="#fff" stroke="#8fb8ff" stroke-width="2.200" stroke-linejoin="round"/><path d="M13 27q5 2 12 0" stroke="#cfe0ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Fluffy</span></button>
    <button class="brush" data-k="soft"><svg viewBox="0 0 40 40"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#cfe3ff"/><stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="16" fill="url(#sg)"/><circle cx="20" cy="20" r="16" fill="none" stroke="#b7ccff" stroke-width="1.500" stroke-dasharray="2 3"/></svg><span>Mist</span></button>
    <button class="brush" data-k="star"><svg viewBox="0 0 40 40"><path d="M20 4l4.800 10.200 11.200 1.300-8.300 7.700 2.200 11.100L20 28.700 10.100 34.300l2.200-11.100L4 15.500l11.200-1.300z" fill="#ffe27a" stroke="#ffc94a" stroke-width="2.500" stroke-linejoin="round"/></svg><span>Star</span></button>
    <button class="brush" data-k="heart"><svg viewBox="0 0 40 40"><path d="M20 35C5 25 4 14 11 10.500c4-2 7.500 0 9 3.500 1.500-3.500 5-5.500 9-3.500C36 14 35 25 20 35Z" fill="#ff9ec7" stroke="#ff7fb2" stroke-width="2.500" stroke-linejoin="round"/><ellipse cx="13" cy="15" rx="2.500" ry="1.800" fill="#fff" opacity=".7" transform="rotate(-30 13 15)"/></svg><span>Heart</span></button>
    <button class="brush" data-k="cutie"><svg viewBox="0 0 40 40"><path d="M11 31a7 7 0 0 1-.5-14A10 10 0 0 1 29 14.500 8.300 8.300 0 0 1 31 31Z" fill="#fff" stroke="#a58bff" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="23" r="1.700" fill="#5a4f8a"/><circle cx="25" cy="23" r="1.700" fill="#5a4f8a"/><path d="M18 26.500q2.500 2.300 5 0" stroke="#5a4f8a" stroke-width="1.600" fill="none" stroke-linecap="round"/><circle cx="13" cy="26" r="2" fill="#ffb3d1"/><circle cx="28" cy="26" r="2" fill="#ffb3d1"/></svg><span>Cutie</span></button>
    <button class="brush" data-k="rainbow"><svg viewBox="0 0 40 40"><path d="M5 30a15 15 0 0 1 30 0" fill="none" stroke="#ff8fa8" stroke-width="4"/><path d="M10 30a10 10 0 0 1 20 0" fill="none" stroke="#ffd36e" stroke-width="4"/><path d="M15 30a5 5 0 0 1 10 0" fill="none" stroke="#7cc8ff" stroke-width="4"/></svg><span>Rainbow</span></button>
    <button class="brush" data-k="eraser"><svg viewBox="0 0 40 40"><g transform="rotate(-30 20 20)"><rect x="7" y="13" width="26" height="15" rx="5" fill="#ffc6e0" stroke="#ff9ec7" stroke-width="2"/><rect x="7" y="13" width="11" height="15" rx="5" fill="#fff" stroke="#c9b8ff" stroke-width="2"/></g></svg><span>Eraser</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="colors"></div>
  <div class="sep"></div>
  <div class="grp">
    <div class="slider"><input type="range" id="size" min="8" max="80" value="34" aria-label="Brush size"><div class="lbl">Brush size</div></div>
    <div class="slider"><input type="range" id="wind" min="-10" max="10" value="3" aria-label="Wind"><div class="lbl" id="windl">Wind 💨 →</div></div>
  </div>
  <div class="sep"></div>
  <div class="grp" id="skies" title="Change the sky"></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#sky'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const mod=(a,n)=>((a%n)+n)%n;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function hsl(h,s,l){h=mod(h,360)/360;s/=100;l/=100;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- state ---------- */
let W=0,H=0,dpr=1,zoom=1;
let layer=null,lctx=null,off=0;
let brush='fluffy', color=hex('#ffffff'), size=34, wind=3, soundOn=true, hue=0;
const undoStack=[];
const planes=[],trails=[],sparks=[];
let time=0, ptr={x:-999,y:-999,in:false,mouse:true};
let hintGone=false;

/* ---------- sky themes ---------- */
const THEMES={
  day:{top:hex('#6dbcff'),mid:hex('#a9dcff'),bot:hex('#fff0e1'),sun:[255,226,120],sx:.84,sy:.2,night:0,amb:.95,grad:'linear-gradient(#6dbcff,#fff0e1)',name:'Sunny'},
  candy:{top:hex('#ffb7da'),mid:hex('#d7c6ff'),bot:hex('#b9ecff'),sun:[255,205,225],sx:.5,sy:.2,night:0,amb:.95,grad:'linear-gradient(#ffb7da,#b9ecff)',name:'Candy'},
  sunset:{top:hex('#7a68cf'),mid:hex('#ff9fb6'),bot:hex('#ffd896'),sun:[255,166,90],sx:.2,sy:.62,night:0,amb:.8,grad:'linear-gradient(#7a68cf,#ffd896)',name:'Sunset'},
  night:{top:hex('#161a5c'),mid:hex('#3d3586'),bot:hex('#8a62b8'),sun:[255,248,215],sx:.8,sy:.2,night:1,amb:.3,grad:'linear-gradient(#161a5c,#8a62b8)',name:'Night'}
};
let themeKey='day', cur=JSON.parse(JSON.stringify(THEMES.day));
const KEYS=['top','mid','bot','sun'];
function stepTheme(dt){
  const t=THEMES[themeKey],k=1-Math.exp(-dt*3.2);
  for(const key of KEYS) cur[key]=mix(cur[key],t[key],k);
  for(const key of ['sx','sy','night','amb']) cur[key]+=(t[key]-cur[key])*k;
}

/* ---------- sizing ---------- */
let stars=[];
function resize(){
  const nd=Math.min(window.devicePixelRatio||1,2);
  const nw=Math.floor(innerWidth*nd), nh=Math.floor(innerHeight*nd);
  if(layer && nw===cv.width && nh===cv.height) return;
  const old=layer, oldW=old?old.width:0;
  dpr=nd; cv.width=W=nw; cv.height=H=nh;
  zoom=clamp(innerWidth/1100,.62,1.25);
  layer=document.createElement('canvas'); layer.width=nw; layer.height=nh; lctx=layer.getContext('2d');
  if(old){const o=mod(off,oldW);lctx.drawImage(old,o,0);lctx.drawImage(old,o-oldW,0);off=0}
  undoStack.length=0;
  const r=rng(7); stars=Array.from({length:140},()=>({x:r(),y:r()*.75,s:.5+r()*1.6,p:r()*TAU}));
}
addEventListener('resize',resize);

/* ---------- brush rendering ---------- */
function puff(c,x,y,r,col,hi){
  const g=c.createRadialGradient(x-r*.25,y-r*.3,r*.05,x,y,r);
  g.addColorStop(0,rgba(hi,1));g.addColorStop(.55,rgba(col,.96));g.addColorStop(1,rgba(col,0));
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
}
const SHADE=[128,146,214];
function drawBrush(c,x,y,r,seed,kind,col){
  const rnd=rng(seed), hi=mix(col,[255,255,255],.65), shade=mix(col,SHADE,.4);
  c.save();
  if(kind==='eraser'){
    c.globalCompositeOperation='destination-out';
    const g=c.createRadialGradient(x,y,0,x,y,r*1.1);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.65,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(x,y,r*1.1,0,TAU);c.fill();
  }else if(kind==='soft'){
    c.globalAlpha=.5;puff(c,x,y,r*1.15,col,hi);
  }else if(kind==='fluffy'||kind==='rainbow'){
    const ps=[];
    for(let i=0;i<5;i++)ps.push([x+(rnd()-.5)*r*1.5,y+(rnd()-.45)*r*.8,r*(.42+rnd()*.34)]);
    c.globalAlpha=.55;for(const p of ps)puff(c,p[0],p[1]+p[2]*.28,p[2],shade,shade);
    c.globalAlpha=1;for(const p of ps)puff(c,p[0],p[1],p[2],col,hi);
  }else if(kind==='star'){
    c.translate(x,y);c.rotate((rnd()-.5)*.7);
    c.shadowColor=rgba(col,.95);c.shadowBlur=r*.55;
    const o=r*1.1,i=o*.5;
    c.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?i:o;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();
    const g=c.createRadialGradient(-o*.2,-o*.3,o*.05,0,0,o);g.addColorStop(0,rgba(hi,1));g.addColorStop(1,rgba(col,1));
    c.fillStyle=g;c.strokeStyle=rgba(col,1);c.lineJoin='round';c.lineWidth=r*.28;c.stroke();c.fill();
  }else if(kind==='heart'){
    c.translate(x,y);c.rotate((rnd()-.5)*.5);c.scale(r*.9,r*.9);
    c.shadowColor=rgba(col,.9);c.shadowBlur=r*.45;
    c.beginPath();c.moveTo(0,.9);c.bezierCurveTo(-1.3,.1,-.9,-.8,0,-.3);c.bezierCurveTo(.9,-.8,1.3,.1,0,.9);c.closePath();
    const g=c.createRadialGradient(-.4,-.3,.05,0,0,1.1);g.addColorStop(0,rgba(hi,1));g.addColorStop(1,rgba(col,1));
    c.fillStyle=g;c.strokeStyle=rgba(col,1);c.lineJoin='round';c.lineWidth=.22;c.stroke();c.fill();
  }else if(kind==='cutie'){
    c.translate(x,y);c.scale(r,r);
    const body=()=>{c.beginPath();
      for(const a of [[-.75,.18,.4],[-.3,-.2,.55],[.3,-.1,.5],[.75,.2,.38],[.45,.18,.4],[-.45,.18,.4]]){c.moveTo(a[0]+a[2],a[1]);c.arc(a[0],a[1],a[2],0,TAU)}
      c.rect(-.75,.15,1.5,.43);};
    c.shadowColor='rgba(110,90,190,.25)';c.shadowBlur=.25;
    c.fillStyle=rgba(shade,.9);c.save();c.translate(0,.07);body();c.fill();c.restore();
    c.shadowBlur=0;
    const g=c.createLinearGradient(0,-.7,0,.6);g.addColorStop(0,rgba(hi,1));g.addColorStop(.5,rgba(col,1));g.addColorStop(1,rgba(mix(col,shade,.5),1));
    c.fillStyle=g;body();c.fill();
    const dark='rgba(80,66,125,.95)';
    c.fillStyle=dark;c.beginPath();c.arc(-.22,.12,.065,0,TAU);c.arc(.22,.12,.065,0,TAU);c.fill();
    c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(-.2,.1,.02,0,TAU);c.arc(.24,.1,.02,0,TAU);c.fill();
    c.strokeStyle=dark;c.lineWidth=.045;c.lineCap='round';c.beginPath();c.arc(0,.17,.13,.15*Math.PI,.85*Math.PI);c.stroke();
    c.fillStyle='rgba(255,140,185,.6)';c.beginPath();c.ellipse(-.4,.26,.1,.065,0,0,TAU);c.ellipse(.4,.26,.1,.065,0,0,TAU);c.fill();
  }
  c.restore();
}
function dab(p,pressure=1){
  const r=size*dpr*pressure;
  const seed=(Math.random()*1e9)|0;
  let col=color;
  if(brush==='rainbow'){hue+=7;col=hsl(hue,85,76)}
  const lx=mod(p.x-off,W);
  for(const X of [lx,lx-W,lx+W]) if(X>-r*2&&X<W+r*2) drawBrush(lctx,X,p.y,r,seed,brush,col);
  if(brush!=='eraser'){
    if(Math.random()<.5) addSpark(p.x+(Math.random()-.5)*r*2,p.y+(Math.random()-.5)*r*2,col,.6+Math.random()*.6);
    note(p.x);
  }
}
const spacing=()=>{const r=size*dpr;

/* ---------- sparkles ---------- */
function addSpark(x,y,col,s=1,vy=-20){
  if(sparks.length>220)return;
  sparks.push({x,y,vx:(Math.random()-.5)*30*dpr,vy:vy*dpr+(Math.random()-.5)*20*dpr,life:0,max:.7+Math.random()*.7,s:s*dpr*(4+Math.random()*5),col:mix(col,[255,255,255],.5),rot:Math.random()*TAU});
}
function drawSpark(c,sp){
  const a=1-sp.life/sp.max;
  c.save();c.translate(sp.x,sp.y);c.rotate(sp.rot+sp.life*2);c.globalAlpha=Math.max(0,a);
  c.fillStyle=rgba(sp.col,1);c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=8*dpr;
  const s=sp.s*(.4+a*.6);
  c.beginPath();for(let k=0;k<8;k++){const an=k*Math.PI/4,r=k%2?s*.3:s;c.lineTo(Math.cos(an)*r,Math.sin(an)*r)}c.closePath();c.fill();

/* ---------- audio ---------- */
let actx=null,lastNote=0;
const PENTA=[0,2,4,7,9];
function initAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function note(x){
  if(!soundOn||!actx)return;
  const now=actx.currentTime;if(now-lastNote<.13)return;lastNote=now;
  const idx=Math.floor(clamp(x/W,0,.999)*10),semis=PENTA[idx%5]+12*Math.floor(idx/5);
  const f=392*Math.pow(2,semis/12);

  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.05,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.6);
  o.connect(g).connect(actx.destination);o.start(now);o.stop(now+.65);
}
function whoosh(){
  if(!soundOn||!actx)return;
  const now=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(260,now);o.frequency.exponentialRampToValueAtTime(900,now+.5);o.frequency.exponentialRampToValueAtTime(300,now+1.1);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.05,now+.15);g.gain.exponentialRampToValueAtTime(.0001,now+1.2);
  o.connect(g).connect(actx.destination);o.start(now);o.stop(now+1.3);
}

/* ---------- ambient clouds ---------- */
function makeSprite(seed,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),r=rng(seed);
  const n=6+Math.floor(r()*3),ps=[];
  for(let i=0;i<n;i++){const t=i/(n-1);const rad=h*(.28+Math.sin(t*Math.PI)*.3)*(.8+r()*.4);ps.push([w*.14+t*w*.72,h*.62-Math.sin(t*Math.PI)*h*.18*r()-rad*.1,rad])}
  x.globalAlpha=.5;for(const p of ps)puff(x,p[0],p[1]+p[2]*.3,p[2],[160,178,230],[160,178,230]);
  x.globalAlpha=1;for(const p of ps)puff(x,p[0],p[1],p[2],[255,255,255],[255,255,255]);
  return c;
}
const sprites=[makeSprite(3,360,170),makeSprite(11,300,150),makeSprite(21,420,190),makeSprite(33,260,130)];
const ambient=Array.from({length:10},(_,i)=>{const r=rng(100+i);return{sp:sprites[i%4],x:r(),y:.05+r()*.6,sc:.5+r()*.9,v:4+r()*14,a:.55+r()*.4}});

/* ---------- planes ---------- */
const PCOLS=[['#ff8fa8','#e2587d'],['#7cc8ff','#4a9be0'],['#ffd36e','#f0a93a'],['#a9e8c0','#58c08a'],['#c4a8ff','#9170e0']];
const BANNERS=['Hello!','Have fun!','Wheee!','You rock!','Paint me!','Beep beep!','Cloudy day!','♥ Sky ♥'];
function spawnPlane(inView,banner){
  const d=Math.random()<.5?1:-1, S=(.7+Math.random()*.55)*zoom*dpr;
  const pl={d,S,x:inView?W*(.15+Math.random()*.7):(d>0?-250*S:W+250*S),y:H*(.1+Math.random()*.42),
    speed:(70+Math.random()*70)*dpr*zoom,col:PCOLS[(Math.random()*PCOLS.length)|0],theta:0,loop:false,
    ph:Math.random()*TAU,banner:banner?BANNERS[(Math.random()*BANNERS.length)|0]:null,ba:1,tt:0,prop:0};
  planes.push(pl);return pl;
}
function loopPlane(p){
  if(p.loop)return;p.loop=true;p.theta=0;whoosh();toast('Wheee! 🌀');
  for(let i=0;i<10;i++)addSpark(p.x,p.y,[255,230,140],1.4,-40);
}
function updatePlane(p,dt){
  p.prop+=dt*40;
  let heading,spd=p.speed;
  if(p.loop){
    const R=75*p.S, w=(spd*1.15)/R; p.theta-=w*dt; spd*=1.15;
    if(Math.random()<.5)addSpark(p.x,p.y,[255,230,150],.9,0);
    if(p.theta<=-TAU){p.theta=0;p.loop=false}
  }else p.theta=Math.sin(time*1.4+p.ph)*.06;
  p.ba+=((p.loop?0:1)-p.ba)*Math.min(1,dt*4);
  heading=p.d>0?p.theta:Math.PI-p.theta;
  p.h=heading;
  p.x+=Math.cos(heading)*spd*dt;p.y+=Math.sin(heading)*spd*dt;
  p.tt+=dt;
  while(p.tt>.03){p.tt-=.03;
    const tx=p.x-Math.cos(heading)*48*p.S,ty=p.y-Math.sin(heading)*48*p.S;
    if(trails.length<700)trails.push({x:tx+(Math.random()-.5)*3*dpr,y:ty+(Math.random()-.5)*3*dpr,r:(3+Math.random()*2)*p.S,life:0,max:2.6+Math.random()*1.2});
  }
}
function drawPlane(c,p){
  const S=p.S;
  // banner
  if(p.banner&&p.ba>.02){
    c.save();c.globalAlpha=p.ba;
    const tx=p.x-p.d*50*S,ty=p.y+3*S;
    c.font=`700 ${Math.round(17*S)}px Fredoka, ui-rounded, sans-serif`;
    const tw=c.measureText(p.banner).width,bw=tw+34*S,bh=30*S,rope=34*S;
    const left=p.d>0?tx-rope-bw:tx+rope;
    c.strokeStyle='rgba(120,100,180,.7)';c.lineWidth=1.5*S;c.beginPath();
    c.moveTo(tx,ty);c.lineTo(p.d>0?left+bw:left,ty+Math.sin(time*5)*2*S);c.stroke();
    const wv=(x)=>Math.sin(x/(14*S)-time*6)*2.6*S;
    c.beginPath();
    const n=14;
    for(let i=0;i<=n;i++){const x=left+bw*i/n;c.lineTo(x,ty-bh/2+wv(x-left))}
    for(let i=n;i>=0;i--){const x=left+bw*i/n;c.lineTo(x,ty+bh/2+wv(x-left))}
    c.closePath();
    c.fillStyle='rgba(255,255,255,.95)';c.strokeStyle=p.col[0];c.lineWidth=2.5*S;c.lineJoin='round';c.shadowColor='rgba(90,70,160,.25)';c.shadowBlur=8*S;
    c.fill();c.shadowBlur=0;c.stroke();
    c.fillStyle=p.col[1];c.textAlign='center';c.textBaseline='middle';
    c.fillText(p.banner,left+bw/2,ty+wv(bw/2)+1*S);
    c.restore();
  }
  c.save();c.translate(p.x,p.y);c.rotate(p.h);if(p.d<0)c.scale(1,-1);c.scale(S,S);
  c.shadowColor='rgba(70,60,140,.22)';c.shadowBlur=10;c.shadowOffsetY=4;
  const [c1,c2]=p.col;
  // tail fin
  c.fillStyle=c2;c.beginPath();c.moveTo(-34,-6);c.lineTo(-52,-28);c.lineTo(-38,-28);c.lineTo(-16,-8);c.closePath();c.fill();
  // body
  const g=c.createLinearGradient(0,-14,0,14);g.addColorStop(0,'#fff');g.addColorStop(.35,'#fff');g.addColorStop(1,'#e3e9ff');
  c.fillStyle=g;c.beginPath();c.moveTo(-50,-4);c.quadraticCurveTo(-52,-12,-40,-13);c.lineTo(32,-14);c.quadraticCurveTo(58,-12,58,0);c.quadraticCurveTo(56,13,30,14);c.lineTo(-36,10);c.quadraticCurveTo(-50,6,-50,-4);c.closePath();c.fill();
  c.shadowColor='transparent';
  // stripe
  c.fillStyle=c1;c.beginPath();c.moveTo(-44,2);c.lineTo(54,3);c.quadraticCurveTo(52,10,30,10.500);c.lineTo(-38,8);c.quadraticCurveTo(-46,6,-44,2);c.closePath();c.fill();
  // nose
  c.fillStyle=c2;c.beginPath();c.moveTo(50,-10);c.quadraticCurveTo(60,-6,58,2);c.quadraticCurveTo(57,9,48,11);c.closePath();c.fill();
  // windows
  for(let i=0;i<4;i++){const x=-18+i*13;c.fillStyle='#8fd0ff';c.beginPath();c.arc(x,-3,4.4,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(x-1.2,-4.4,1.5,0,TAU);c.fill()}
  c.fillStyle='#8fd0ff';c.beginPath();c.moveTo(34,-12);c.quadraticCurveTo(46,-12,48,-3);c.lineTo(34,-3);c.closePath();c.fill();
  // wing
  c.fillStyle=c2;c.beginPath();c.moveTo(-6,5);c.lineTo(-26,26);c.lineTo(-10,26);c.lineTo(20,5);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.moveTo(-8,6);c.lineTo(-22,22);c.lineTo(-17,22);c.lineTo(-1,6);c.closePath();c.fill();
  // propeller
  const pr=Math.abs(Math.cos(p.prop));
  c.fillStyle='rgba(120,100,180,.45)';c.beginPath();c.ellipse(60,0,3.5,6+22*pr,0,0,TAU);c.fill();
  c.fillStyle=c1;c.beginPath();c.arc(60,0,3.2,0,TAU);c.fill();
  c.restore();
}

/* ---------- render ---------- */
function drawSky(c,t,exp){
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgba(cur.top,1));g.addColorStop(.55,rgba(cur.mid,1));g.addColorStop(1,rgba(cur.bot,1));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  // stars
  if(cur.night>.02){
    c.fillStyle='#fff';
    for(const s of stars){c.globalAlpha=cur.night*(.45+.55*Math.sin(t*2+s.p))*.9;c.beginPath();c.arc(s.x*W,s.y*H,s.s*dpr,0,TAU);c.fill()}
    c.globalAlpha=1;
  }
  // sun / moon
  const sx=cur.sx*W,sy=cur.sy*H,R=58*dpr*zoom;
  const gl=c.createRadialGradient(sx,sy,R*.4,sx,sy,R*3.4);
  gl.addColorStop(0,rgba(cur.sun,.65));gl.addColorStop(1,rgba(cur.sun,0));
  c.fillStyle=gl;c.fillRect(sx-R*3.5,sy-R*3.5,R*7,R*7);
  c.save();c.translate(sx,sy);
  if(cur.night<.5){c.globalAlpha=1-cur.night*2;c.rotate(t*.1);c.strokeStyle=rgba(cur.sun,.9);c.lineWidth=5*dpr;c.lineCap='round';
    for(let i=0;i<12;i++){c.rotate(TAU/12);c.beginPath();c.moveTo(R*1.28,0);c.lineTo(R*(1.5+.1*Math.sin(t*2+i)),0);c.stroke()}
    c.rotate(-t*.1);c.globalAlpha=1}
  const bg=c.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);bg.addColorStop(0,rgba(mix(cur.sun,[255,255,255],.6),1));bg.addColorStop(1,rgba(cur.sun,1));
  c.fillStyle=bg;c.beginPath();c.arc(0,0,R,0,TAU);c.fill();
  // face
  c.strokeStyle='rgba(110,80,130,.75)';c.fillStyle='rgba(110,80,130,.8)';c.lineWidth=3*dpr;c.lineCap='round';
  const n=cur.night;
  c.globalAlpha=1-n;c.beginPath();c.arc(-R*.3,-R*.05,R*.07,0,TAU);c.arc(R*.3,-R*.05,R*.07,0,TAU);c.fill();
  c.beginPath();c.arc(0,R*.08,R*.3,.15*Math.PI,.85*Math.PI);c.stroke();
  c.globalAlpha=n;c.beginPath();c.arc(-R*.3,-R*.02,R*.12,.1*Math.PI,.9*Math.PI);c.stroke();c.beginPath();c.arc(R*.3,-R*.02,R*.12,.1*Math.PI,.9*Math.PI);c.stroke();
  c.beginPath();c.arc(0,R*.25,R*.1,0,TAU);c.stroke();
  c.fillStyle='rgba(200,190,220,.5)';c.beginPath();c.arc(R*.45,R*.5,R*.14,0,TAU);c.arc(-R*.55,-R*.45,R*.1,0,TAU);c.fill();
  c.globalAlpha=1-n*.0;
  c.fillStyle='rgba(255,140,170,.45)';c.globalAlpha=1-n;c.beginPath();c.ellipse(-R*.52,R*.2,R*.15,R*.1,0,0,TAU);c.ellipse(R*.52,R*.2,R*.15,R*.1,0,0,TAU);c.fill();
  c.restore();c.globalAlpha=1;
  // ambient clouds
  for(const a of ambient){
    const w=a.sp.width*a.sc*dpr*zoom,h=a.sp.height*a.sc*dpr*zoom;
    const span=W+w;const px=mod(a.x*span+(a.px||0),span)-w;
    c.globalAlpha=a.a*cur.amb;c.drawImage(a.sp,px,a.y*H,w,h);
  }
  c.globalAlpha=1;
}
function drawAll(c,t,exp){
  drawSky(c,t,exp);
  const ox=mod(off,W);c.drawImage(layer,ox,0);c.drawImage(layer,ox-W,0);
  for(const tr of trails){const a=1-tr.life/tr.max;c.fillStyle=`rgba(255,255,255,${a*.6})`;c.beginPath();c.arc(tr.x,tr.y,tr.r*(1+tr.life*.9),0,TAU);c.fill()}
  for(const p of planes)drawPlane(c,p);
  for(const s of sparks)drawSpark(c,s);
}
function render(){
  drawAll(ctx,time,false);
  if(ptr.in&&ptr.mouse){
    const r=size*dpr*(brush==='eraser'?1.1:.9);
    ctx.save();ctx.lineWidth=2.5*dpr;ctx.setLineDash([6*dpr,6*dpr]);ctx.lineDashOffset=-time*20;
    ctx.strokeStyle='rgba(255,255,255,.95)';ctx.shadowColor='rgba(90,70,160,.5)';ctx.shadowBlur=4*dpr;
    ctx.beginPath();ctx.arc(ptr.x,ptr.y,r,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.shadowBlur=0;ctx.fillStyle=brush==='eraser'?'#ff9ec7':brush==='rainbow'?rgba(hsl(hue,85,70),1):rgba(color,1);
    ctx.strokeStyle='#fff';ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(ptr.x,ptr.y,4.5*dpr,0,TAU);ctx.fill();ctx.stroke();
    ctx.restore();
  }
}
let lastT=performance.now(),autoT=3;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;time+=dt;
  stepTheme(dt);
  const dOff=wind*6*dpr*dt;off+=dOff;
  for(const a of ambient){a.px=(a.px||0)+(a.v*.5+wind*5*(.3+a.sc*.5))*dpr*dt*zoom}
  for(const t of trails){t.life+=dt;t.x+=dOff}
  for(let i=trails.length-1;i>=0;i--)if(trails[i].life>trails[i].max)trails.splice(i,1);
  for(const s of sparks){s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=20*dpr*dt}
  for(let i=sparks.length-1;i>=0;i--)if(sparks[i].life>sparks[i].max)sparks.splice(i,1);
  for(const p of planes)updatePlane(p,dt);
  for(let i=planes.length-1;i>=0;i--){const p=planes[i];if(!p.loop&&(p.x<-500*p.S||p.x>W+500*p.S||p.y<-300||p.y>H+300))planes.splice(i,1)}
  autoT-=dt;if(autoT<=0){autoT=6+Math.random()*7;if(planes.length<4)spawnPlane(false,Math.random()<.45)}
  render();
  requestAnimationFrame(frame);
}

  const clouds=[[.2,.34,46,'#ffffff'],[.62,.26,40,'#ffffff'],[.42,.52,36,'#ffd9ea'],[.82,.5,32,'#e6dcff']];
  for(const [cx,cy,r0,hx] of clouds){

    for(let i=0;i<9;i++){
      const x=cx*W+(i-4)*r*.62,y=cy*H-Math.sin(i/8*Math.PI)*r*.5;
      drawBrush(lctx,x,y,r*(.8+Math.sin(i/8*Math.PI)*.5),1000*s+i*17+Math.round(cx*100),'fluffy',col);
    }
  }
})();
spawnPlane(true,true);spawnPlane(true,false);

})();
