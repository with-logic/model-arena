<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Acronym List</title>
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f8;--text:#1b1f2e;--muted:#667088;--border:#e2e5ef;
  --brand:#4f46e5;--brand2:#7c3aed;--brand-soft:#eef0ff;--good:#16a34a;--good-soft:#e7f7ed;--bad:#dc2626;--bad-soft:#fdecec;
  --shadow:0 1px 2px rgba(20,24,50,.06),0 4px 16px rgba(20,24,50,.05);
  --c-team:#2563eb;--c-project:#9333ea;--c-process:#ea580c;--c-tool:#0d9488;--c-metric:#db2777;
}
[data-theme=dark]{
  --bg:#0f1220;--surface:#171b2e;--surface2:#1e2339;--text:#e8eaf5;--muted:#8e97b5;--border:#2a3050;
  --brand:#818cf8;--brand2:#a78bfa;--brand-soft:#23284a;--good:#4ade80;--good-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --c-team:#60a5fa;--c-project:#c084fc;--c-process:#fb923c;--c-tool:#2dd4bf;--c-metric:#f472b6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{background:linear-gradient(135deg,#312e81,#4f46e5 55%,#7c3aed);color:#fff;padding:28px 20px 70px}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px;border:1px solid rgba(255,255,255,.3)}
h1{font-size:1.35rem;margin:0;letter-spacing:-.3px}
.sub{font-size:.85rem;opacity:.8}
.iconbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;font-size:.85rem}
.iconbtn:hover{background:rgba(255,255,255,.25)}
main{margin-top:-50px;padding:0 16px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;padding:6px;margin-bottom:16px;max-width:420px}
.tab{flex:1;border:0;background:none;padding:10px 14px;border-radius:11px;font-weight:600;color:var(--muted);transition:.15s}
.tab[aria-selected=true]{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35)}
.tab:not([aria-selected=true]):hover{background:var(--surface2);color:var(--text)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
#q{width:100%;border:0;background:transparent;padding:18px 90px 18px 48px;font-size:1.05rem;color:var(--text);border-radius:16px}
#q:focus-visible{outline-offset:-2px}
.kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.72rem;border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--muted);background:var(--surface2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;align-items:center}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--muted))}
.chip .n{font-size:.72rem;color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 4px;color:var(--muted);font-size:.85rem;flex-wrap:wrap;gap:8px}
.meta select,.field select,.field input,.field textarea{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font:inherit;font-size:.9rem}
.list{display:grid;gap:10px}
.item{overflow:hidden;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--brand)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;text-align:left}
.acr{min-width:78px;font-weight:800;font-size:1.25rem;letter-spacing:.3px;color:var(--brand)}
.row .mid{flex:1;min-width:0}
.full{font-weight:600}
.short{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);white-space:nowrap}
.mastery{display:flex;gap:3px}
.mastery i{width:6px;height:16px;border-radius:3px;background:var(--border)}
.mastery i.on{background:var(--good)}
.chev{transition:transform .2s;color:var(--muted)}
.item.open .chev{transform:rotate(180deg)}
.detail{display:none;padding:0 16px 16px;border-top:1px dashed var(--border)}
.item.open .detail{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.detail p{margin:12px 0}
.ex{background:var(--surface2);border-left:3px solid var(--brand);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.9rem;color:var(--muted);font-style:italic}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.star{background:none;border:0;font-size:1.2rem;color:var(--border);padding:4px}
.star.on{color:#f59e0b}
mark{background:#fde68a;color:#422006;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty b{display:block;font-size:1.1rem;color:var(--text);margin-bottom:4px}
/* quiz */
.pane{padding:26px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:.85rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
h2{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.3px}
.lead{color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.75rem;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin:8px 0 22px}
.prompt{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.qbig{font-size:2.6rem;font-weight:800;color:var(--brand);margin:4px 0 6px;letter-spacing:.5px;word-break:break-word}
.qbig.sm{font-size:1.5rem;color:var(--text);letter-spacing:0}
.answers{display:grid;gap:10px;margin-top:20px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:13px 15px;transition:.15s;font-weight:500}
.ans:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.ans .k{width:26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);flex:none}
.ans.right{border-color:var(--good);background:var(--good-soft)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.92rem}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback span{color:var(--text)}
.score{font-size:3.4rem;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.center{text-align:center}
.review{display:grid;gap:8px;margin:18px 0;text-align:left}
.rv{display:flex;gap:10px;align-items:baseline;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:.9rem}
.rv b{color:var(--brand);min-width:60px}
.hidden{display:none!important}
dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:24px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,30,.55);backdrop-filter:blur(3px)}
dialog .field input,dialog .field select,dialog .field textarea{width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.88rem;transition:.3s;z-index:9}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:30px}
@media(max-width:640px){
  header{padding:20px 16px 66px}
  .sub{display:none}
  .row{flex-wrap:wrap;gap:8px 12px;padding:13px}
  .acr{min-width:64px;font-size:1.1rem}
  .row .tag{order:5}
  .mastery{display:none}
  .opts,.stats{grid-template-columns:1fr 1fr 1fr}
  .opts{grid-template-columns:1fr}
  .pane{padding:18px}
  .qbig{font-size:2.1rem}
  .kbd{display:none}
  #q{padding-right:16px}
  .tabs{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <div class="logo" aria-hidden="true">A→Z</div>
      <div><h1>Company Acronym List</h1><div class="sub">Learn the language of the company, one acronym at a time.</div></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="addBtn">+ Add</button>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card tabs" role="tablist">
    <button class="tab" role="tab" id="tab-browse" aria-selected="true" data-tab="browse">📖 Browse</button>
    <button class="tab" role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz">🎯 Quiz</button>
  </div>

  <section id="browse">
    <div class="card searchbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search acronyms, meanings, or descriptions…" autocomplete="off" aria-label="Search acronyms">
      <span class="kbd">/</span>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <div class="meta">
      <span id="count"></span>
      <label>Sort <select id="sort"><option value="az">A → Z</option><option value="za">Z → A</option><option value="cat">Category</option><option value="weak">Least mastered</option></select></label>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="quiz" class="hidden"><div class="card pane" id="quizPane"></div></section>
</main>
<footer>Tip: press <b>/</b> to search · in a quiz use <b>1–4</b> to answer and <b>Enter</b> for next.</footer>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2>Add an acronym</h2>
    <p class="lead" style="margin-bottom:16px">Saved in your browser only.</p>
    <div class="field"><label for="fa">Acronym</label><input id="fa" required maxlength="12"></div>
    <div class="field"><label for="ff">Stands for</label><input id="ff" required></div>
    <div class="field"><label for="fd">Description</label><textarea id="fd" rows="3" required></textarea></div>
    <div class="field"><label for="fc">Category</label><select id="fc"></select></div>
    <div class="acts" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="saveAdd" value="ok">Save</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS={Team:'--c-team',Project:'--c-project',Process:'--c-process',Tool:'--c-tool',Metric:'--c-metric'};
const SEED=[
["OKR","Objectives and Key Results","Our quarterly goal-setting framework. Teams set an ambitious objective and 3–5 measurable key results to track progress.","Process","\"Have you drafted your Q3 OKRs yet?\""],
["RFC","Request for Comments","A written proposal circulated for feedback before any significant technical or process change is made.","Process","\"I'll open an RFC for the new auth flow.\""],
["PRD","Product Requirements Document","A document describing what a feature should do, who it's for, and how success is measured.","Process","\"The PRD is ready for design review.\""],
["SLA","Service Level Agreement","A commitment to customers on uptime, response time, or resolution time for a service.","Metric","\"Enterprise tickets have a 4-hour SLA.\""],
["SLO","Service Level Objective","An internal reliability target, stricter than the SLA, that engineering aims to hit.","Metric","\"We're burning through our SLO error budget.\""],
["ARR","Annual Recurring Revenue","The yearly value of active subscription contracts, excluding one-time fees.","Metric","\"ARR crossed the $50M mark last quarter.\""],
["NPS","Net Promoter Score","A customer loyalty score from 0–10 survey responses: promoters minus detractors.","Metric","\"NPS rose 6 points after the redesign.\""],
["CSAT","Customer Satisfaction Score","Percentage of customers who rate a support interaction as satisfied or very satisfied.","Metric","\"CSAT for onboarding is 92%.\""],
["MTTR","Mean Time To Recovery","The average time it takes to restore service after an incident begins.","Metric","\"Our MTTR dropped to 22 minutes.\""],
["CAC","Customer Acquisition Cost","Total sales and marketing spend divided by the number of new customers acquired.","Metric","\"Paid channels are pushing CAC too high.\""],
["PTO","Paid Time Off","Vacation, personal, and sick leave. Request through the HR portal and notify your team.","Process","\"I'm on PTO next Friday.\""],
["PIP","Performance Improvement Plan","A structured plan with clear goals and support for employees who need to improve performance.","Process","\"HR will walk managers through the PIP template.\""],
["QBR","Quarterly Business Review","A meeting with a key customer or leadership to review results, goals, and roadmap for the quarter.","Process","\"Prep the deck for Acme's QBR.\""],
["SOP","Standard Operating Procedure","Step-by-step instructions that ensure a recurring task is done consistently.","Process","\"Follow the SOP for vendor onboarding.\""],
["RCA","Root Cause Analysis","A blameless post-incident investigation that identifies why something went wrong and how to prevent it.","Process","\"The RCA is due within 5 business days.\""],
["SRE","Site Reliability Engineering","The team responsible for keeping production systems reliable, scalable, and observable.","Team","\"Page SRE if the dashboard is red.\""],
["DevEx","Developer Experience","The team that builds internal tooling, CI pipelines, and docs to make engineers more productive.","Team","\"DevEx shipped faster builds this week.\""],
["GTM","Go-To-Market","The cross-functional team (marketing, sales, product) that plans and executes product launches.","Team","\"GTM is syncing on the launch plan.\""],
["CS","Customer Success","The team that onboards customers, drives adoption, and handles renewals and expansion.","Team","\"CS flagged churn risk at three accounts.\""],
["PeopleOps","People Operations","Our HR function: hiring, onboarding, benefits, culture, and employee programs.","Team","\"Ask PeopleOps about the parental leave policy.\""],
["SecOps","Security Operations","The team that monitors threats, handles security incidents, and runs vulnerability management.","Team","\"SecOps approved the new vendor.\""],
["DataEng","Data Engineering","The team that builds and maintains our data pipelines and warehouse.","Team","\"DataEng is backfilling the events table.\""],
["PMO","Project Management Office","Sets project standards, tracks cross-team initiatives, and reports status to leadership.","Team","\"Send your milestones to the PMO.\""],
["Atlas","Project Atlas","The multi-year initiative to migrate our monolith to a service-oriented architecture.","Project","\"Atlas phase 2 begins in January.\""],
["Beacon","Project Beacon","The customer-facing analytics dashboard, launching to all plans next quarter.","Project","\"Beacon beta feedback is very positive.\""],
["Nimbus","Project Nimbus","Our move to multi-region cloud infrastructure for resilience and lower latency.","Project","\"Nimbus will cut EU latency by half.\""],
["Phoenix","Project Phoenix","The rebuild of the legacy billing system with usage-based pricing support.","Project","\"Phoenix cutover is scheduled for March.\""],
["Compass","Project Compass","The company-wide initiative to define career ladders and leveling guidelines.","Project","\"Compass levels go live after calibration.\""],
["JIRA","Jira Software","Our issue tracker for engineering tickets, sprints, and roadmaps.","Tool","\"Link the PR to the Jira ticket.\""],
["CRM","Customer Relationship Management","The system of record for leads, accounts, and sales activity (Salesforce).","Tool","\"Log the call in the CRM.\""],
["SSO","Single Sign-On","One company login that grants access to all internal apps via our identity provider.","Tool","\"SSO is down, try again in a minute.\""],
["VPN","Virtual Private Network","Secure connection required to reach internal systems when working remotely.","Tool","\"Connect to the VPN before opening the wiki.\""],
["CI/CD","Continuous Integration / Continuous Delivery","Automated pipeline that builds, tests, and deploys code on every merge.","Tool","\"CI/CD failed on the lint step.\""],
["HRIS","Human Resources Information System","The tool for payroll, time off, and employee records (Workday).","Tool","\"Update your address in the HRIS.\""],
["EOD","End of Day","Deadline shorthand: before you sign off in your local time zone, unless otherwise stated.","Process","\"Need the draft by EOD.\""],
["WFH","Work From Home","Remote working day. Flag it on the team calendar so colleagues know.","Process","\"I'll be WFH Tuesday.\""],
["ELT","Executive Leadership Team","The CEO and their direct reports, who set company strategy and priorities.","Team","\"The ELT approved the budget.\""],
["MVP","Minimum Viable Product","The smallest version of a product that delivers value and lets us learn from real users.","Project","\"Let's scope the MVP to two weeks.\""],
["KPI","Key Performance Indicator","A measurable value that shows how effectively a team or company is hitting objectives.","Metric","\"Activation rate is our top KPI.\""]
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem('acr_'+k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('acr_'+k,JSON.stringify(v))}catch(e){}}
};
let custom=store.get('custom',[]);
let prog=store.get('prog',{});   // id -> mastery 0..3
let favs=store.get('favs',[]);
const all=()=>SEED.map((r,i)=>({id:'s'+i,a:r[0],f:r[1],d:r[2],c:r[3],e:r[4]})).concat(custom);
let state={cat:'All',q:'',sort:'az',open:null};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'☀️':'🌙';store.set('theme',t)}
setTheme(store.get('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* tabs */
function showTab(t){
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $('#browse').classList.toggle('hidden',t!=='browse');
  $('#quiz').classList.toggle('hidden',t!=='quiz');
  if(t==='quiz')renderQuizSetup(); else renderList();
}
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* browse */
function hl(text,q){
  const t=esc(text); if(!q)return t;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/&/g,'&amp;')+')','ig');
  return t.replace(re,'<mark>$1</mark>');
}
function renderFilters(){
  const data=all(), cats=['All','★ Favorites',...Object.keys(CATS)];
  $('#filters').innerHTML=cats.map(c=>{
    const n=c==='All'?data.length:c==='★ Favorites'?data.filter(x=>favs.includes(x.id)).length:data.filter(x=>x.c===c).length;
    const col=CATS[c]?`style="--cc:var(${CATS[c]})"`:'';
    return `<button class="chip" aria-pressed="${state.cat===c}" data-c="${esc(c)}" ${col}>${CATS[c]?'<span class="dot"></span>':''}${c==='Team'?'Teams':c==='Project'?'Projects':c==='Process'?'Processes':c==='Tool'?'Tools':c==='Metric'?'Metrics':c} <span class="n">${n}</span></button>`;
  }).join('');
  $$('#filters .chip').forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;renderFilters();renderList()});
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  let r=all().filter(x=>{
    if(state.cat==='★ Favorites'?!favs.includes(x.id):state.cat!=='All'&&x.c!==state.cat)return false;
    return !q||[x.a,x.f,x.d,x.c].some(s=>s.toLowerCase().includes(q));
  });
  const score=x=>{ if(!q)return 0; const a=x.a.toLowerCase(); return a===q?0:a.startsWith(q)?1:x.f.toLowerCase().includes(q)?2:3};
  r.sort((x,y)=>{
    if(q&&score(x)!==score(y))return score(x)-score(y);
    if(state.sort==='za')return y.a.localeCompare(x.a);
    if(state.sort==='cat')return x.c.localeCompare(y.c)||x.a.localeCompare(y.a);
    if(state.sort==='weak')return (prog[x.id]||0)-(prog[y.id]||0)||x.a.localeCompare(y.a);
    return x.a.localeCompare(y.a,undefined,{sensitivity:'base'});
  });
  return r;
}
function renderList(){
  const r=filtered(), q=state.q.trim();
  $('#count').textContent=`${r.length} acronym${r.length===1?'':'s'}`+(q?` matching “${q}”`:'');
  if(!r.length){
    $('#list').innerHTML=`<div class="card empty"><b>No acronyms found</b>Try a different search or category — or add a new one with “+ Add”.</div>`;return;
  }
  $('#list').innerHTML=r.map(x=>{
    const m=prog[x.id]||0, open=state.open===x.id, fav=favs.includes(x.id);
    return `<article class="card item ${open?'open':''}" data-id="${x.id}" style="--cc:var(${CATS[x.c]})">
      <button class="row" aria-expanded="${open}">
        <span class="acr">${hl(x.a,q)}</span>
        <span class="mid"><div class="full">${hl(x.f,q)}</div><div class="short">${hl(x.d,q)}</div></span>
        <span class="tag">${x.c}</span>
        <span class="mastery" title="Mastery ${m}/3">${[1,2,3].map(i=>`<i class="${m>=i?'on':''}"></i>`).join('')}</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="detail">
        <p>${esc(x.d)}</p>
        ${x.e?`<div class="ex">${esc(x.e)}</div>`:''}
        <div class="acts">
          <button class="btn" data-act="fav">${fav?'★ Favorited':'☆ Favorite'}</button>
          <button class="btn" data-act="copy">Copy</button>
          ${x.id[0]==='c'?'<button class="btn danger" data-act="del">Delete</button>':''}
        </div>
      </div></article>`;
  }).join('');
}
$('#list').addEventListener('click',e=>{
  const item=e.target.closest('.item'); if(!item)return;
  const id=item.dataset.id, act=e.target.closest('[data-act]')?.dataset.act;
  const x=all().find(v=>v.id===id);
  if(act==='fav'){favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];store.set('favs',favs);renderFilters();renderList();return}
  if(act==='copy'){navigator.clipboard?.writeText(`${x.a} — ${x.f}: ${x.d}`).then(()=>toast('Copied to clipboard'),()=>toast('Copy unavailable'));return}
  if(act==='del'){custom=custom.filter(c=>c.id!==id);store.set('custom',custom);renderFilters();renderList();toast('Deleted');return}
  if(e.target.closest('.row')){state.open=state.open===id?null:id;renderList()}
});
let deb;$('#q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{state.q=e.target.value;renderList()},80)});
$('#sort').onchange=e=>{state.sort=e.target.value;renderList()};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();showTab('browse');$('#q').focus()}
  if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';state.q='';renderList()}
});

/* add */
$('#fc').innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
$('#addBtn').onclick=()=>{$('#addForm').reset();$('#dlg').showModal();$('#fa').focus()};
$('#addForm').addEventListener('submit',e=>{
  if(e.submitter?.value!=='ok')return;
  const a=$('#fa').value.trim(),f=$('#ff').value.trim(),d=$('#fd').value.trim();
  if(!a||!f||!d)return;
  const x={id:'c'+Date.now(),a,f,d,c:$('#fc').value,e:''};
  custom.push(x);store.set('custom',custom);
  state.cat='All';state.q='';$('#q').value='';state.open=x.id;
  renderFilters();showTab('browse');toast(`Added ${a}`);
});

/* quiz */
let qs={cat:'All',len:10,mode:'mixed',focus:false};
let run=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(){
  let p=all().filter(x=>qs.cat==='All'||x.c===qs.cat);
  return p;
}
function renderQuizSetup(){
  run=null;
  const mastered=all().filter(x=>(prog[x.id]||0)>=3).length, total=all().length;
  const seg=(key,opts)=>opts.map(([v,l])=>`<button class="chip" aria-pressed="${qs[key]===v}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  const p=pool();
  $('#quizPane').innerHTML=`
    <h2>Test your knowledge</h2><p class="lead">Answer correctly to build mastery. Three right answers in a row-ish and an acronym is yours.</p>
    <div class="stats">
      <div class="stat"><b>${total}</b><span>Acronyms</span></div>
      <div class="stat"><b>${mastered}</b><span>Mastered</span></div>
      <div class="stat"><b>${store.get('best',0)}%</b><span>Best score</span></div>
    </div>
    <div class="bar" title="Overall mastery"><div style="width:${Math.round(mastered/total*100)}%"></div></div>
    <div style="height:22px"></div>
    <div class="field"><label>Category</label><div class="seg">${seg('cat',[['All','All'],...Object.keys(CATS).map(c=>[c,c])])}</div></div>
    <div class="field"><label>Question type</label><div class="seg">${seg('mode',[['mixed','Mixed'],['a2f','Acronym → Meaning'],['f2a','Meaning → Acronym']])}</div></div>
    <div class="field"><label>Questions</label><div class="seg">${seg('len',[[5,'5'],[10,'10'],[20,'20']])}</div></div>
    <div class="field"><label>Focus</label><div class="seg">${seg('focus',[[false,'Random'],[true,'Weakest first']])}</div></div>
    <div class="acts" style="margin-top:22px"><button class="btn primary" id="start" ${p.length<4?'disabled':''}>Start quiz →</button>
    ${p.length<4?'<span class="lead" style="margin:8px 0 0">Need at least 4 acronyms in this category.</span>':`<span class="lead" style="margin:8px 0 0">${Math.min(qs.len,p.length)} of ${p.length} available</span>`}</div>`;
  $$('#quizPane [data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=b.dataset.v;
    qs[k]=k==='len'?+v:k==='focus'?v==='true':v;renderQuizSetup();
  });
  $('#start').onclick=startQuiz;
}
function startQuiz(){
  let p=pool();
  p=qs.focus?shuffle(p).sort((a,b)=>(prog[a.id]||0)-(prog[b.id]||0)):shuffle(p);
  const picked=shuffle(p.slice(0,Math.min(qs.len,p.length)));
  const universe=all();
  const questions=picked.map(x=>{
    const dir=qs.mode==='mixed'?(Math.random()<.5?'a2f':'f2a'):qs.mode;
    const same=shuffle(universe.filter(y=>y.id!==x.id&&y.c===x.c)), other=shuffle(universe.filter(y=>y.id!==x.id&&y.c!==x.c));
    const key=dir==='a2f'?'f':'a';
    const seen=new Set([x[key]]), d=[];
    for(const y of [...same,...other]){ if(d.length>=3)break; if(!seen.has(y[key])){seen.add(y[key]);d.push(y)} }
    return {x,dir,opts:shuffle([x,...d]),done:false};
  });
  run={qn:questions,i:0,score:0,streak:0,bestStreak:0,missed:[]};
  renderQ();
}
function renderQ(){
  const q=run.qn[run.i], x=q.x, a2f=q.dir==='a2f';
  const pct=Math.round(run.i/run.qn.length*100);
  $('#quizPane').innerHTML=`
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="qhead"><span>Question ${run.i+1} of ${run.qn.length}</span><span>🔥 Streak ${run.streak} · Score ${run.score}</span></div>
    <div class="prompt">${a2f?'What does this stand for?':'Which acronym means…'}</div>
    <div class="qbig ${a2f?'':'sm'}">${esc(a2f?x.a:x.f)}</div>
    ${a2f?'':`<div class="short" style="white-space:normal">${esc(x.d)}</div>`}
    <div class="answers" role="group">${q.opts.map((o,i)=>`<button class="ans" data-i="${i}"><span class="k">${i+1}</span><span>${esc(a2f?o.f:o.a)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="acts" style="justify-content:space-between;margin-top:18px"><button class="btn" id="quit">Quit</button><button class="btn primary hidden" id="next">${run.i+1===run.qn.length?'See results':'Next'} ↵</button></div>`;
  $$('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#quit').onclick=()=>showTab('quiz');
  $('#next').onclick=next;
}
function answer(i){
  const q=run.qn[run.i]; if(q.done)return; q.done=true;
  const ok=q.opts[i].id===q.x.id, a2f=q.dir==='a2f';
  $$('.ans').forEach((b,j)=>{b.disabled=true;if(q.opts[j].id===q.x.id)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
  if(ok){run.score++;run.streak++;run.bestStreak=Math.max(run.bestStreak,run.streak);prog[q.x.id]=Math.min(3,(prog[q.x.id]||0)+1)}
  else{run.streak=0;run.missed.push(q.x);prog[q.x.id]=Math.max(0,(prog[q.x.id]||0)-1)}
  store.set('prog',prog);
  $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Correct! 🎉':'Not quite.'}</b> <span>${esc(q.x.a)} = ${esc(q.x.f)}. ${esc(q.x.d)}</span></div>`;
  $('#next').classList.remove('hidden');$('#next').focus();
}
function next(){
  if(run.i+1>=run.qn.length)return renderResults();
  run.i++;renderQ();
}
function renderResults(){
  const n=run.qn.length,pct=Math.round(run.score/n*100);
  if(pct>store.get('best',0))store.set('best',pct);
  const msg=pct===100?'Flawless! You speak fluent company.':pct>=80?'Great work — nearly there!':pct>=50?'Solid start. Keep practicing!':'Keep going — repetition is the key.';
  $('#quizPane').innerHTML=`<div class="center"><div class="prompt">Quiz complete</div><div class="score">${pct}%</div>
    <h2>${run.score} / ${n} correct</h2><p class="lead">${msg} Best streak: ${run.bestStreak} 🔥</p></div>
    ${run.missed.length?`<h3 style="margin:0">Review these</h3><div class="review">${run.missed.map(x=>`<div class="rv"><b>${esc(x.a)}</b><span>${esc(x.f)}</span></div>`).join('')}</div>`:''}
    <div class="acts" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="setup">Change settings</button><button class="btn" id="tobrowse">Back to list</button></div>`;
  if(pct>=80)confetti();
  $('#again').onclick=startQuiz;$('#setup').onclick=renderQuizSetup;$('#tobrowse').onclick=()=>showTab('browse');
}
document.addEventListener('keydown',e=>{
  if(!run||$('#quiz').classList.contains('hidden')||$('#dlg').open)return;
  const q=run.qn[run.i]; if(!q)return;
  if(/^[1-4]$/.test(e.key)&&!q.done&&$('.ans'))answer(+e.key-1);
  else if(e.key==='Enter'&&q.done&&!$('#next')?.matches(':focus')){e.preventDefault();next()}
});
function confetti(){
  const c=document.createElement('canvas');Object.assign(c.style,{position:'fixed',inset:0,pointerEvents:'none',zIndex:20});
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext('2d'),cols=['#4f46e5','#7c3aed','#f59e0b','#16a34a','#ec4899'];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function t(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=.2;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.s/2,-p.s/2,p.s,p.s/2);g.restore()});
    if(++f<110)requestAnimationFrame(t);else c.remove()})();
}

renderFilters();renderList();
</script>
