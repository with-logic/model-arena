<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tea Dunkability Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" integrity="sha384-NFMPdlT9NRMyYGArFJIgafm5emdRea6aGKLXhUrnDhERRKmOn3QJsnCiZpc1+CD9" crossorigin="anonymous"></script>
<style>
:root{
  --bg1:#fff6e8; --bg2:#f6dcb8; --ink:#3a2a1f; --ink2:#7a604d; --accent:#c4631f; --accent2:#e59a4a;
  --glass:rgba(255,255,255,.52); --glass-b:rgba(255,255,255,.75); --glass-s:0 10px 40px -12px rgba(120,70,20,.35);
  --track:rgba(90,60,30,.14); --chip:rgba(255,255,255,.55); --good:#3f9b5f; --warn:#e0a028; --bad:#d6482f;
  --stage1:#fbe3bf; --stage2:#e9b887; --grid:rgba(90,60,30,.12); --blob1:#ffb35c; --blob2:#ff8f7a; --blob3:#ffd98a;
}
.dark{
  --bg1:#14100d; --bg2:#2a1b12; --ink:#f4e7d6; --ink2:#b79f8a; --accent:#f2a25c; --accent2:#ffcf8c;
  --glass:rgba(48,34,26,.55); --glass-b:rgba(255,230,200,.13); --glass-s:0 14px 50px -14px rgba(0,0,0,.8);
  --track:rgba(255,235,210,.14); --chip:rgba(255,235,210,.07); --good:#5fc884; --warn:#f0bb48; --bad:#ff6a4d;
  --stage1:#3a2518; --stage2:#1b110b; --grid:rgba(255,235,210,.1); --blob1:#7a3a10; --blob2:#6b1f2a; --blob3:#5a4010;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;transition:background .5s,color .4s;-webkit-font-smoothing:antialiased}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:520px;height:520px;background:var(--blob1);left:-120px;top:-100px}
.blobs i:nth-child(2){width:460px;height:460px;background:var(--blob2);right:-100px;top:25%;animation-duration:28s}
.blobs i:nth-child(3){width:560px;height:560px;background:var(--blob3);left:30%;bottom:-260px;animation-duration:34s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
#crumbs{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
h1 span{color:var(--accent)}
.sub{color:var(--ink2);font-size:14px;margin-top:6px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--glass-b);border-radius:12px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(10px);transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#2b1608;border-color:transparent}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--track);border:1px solid var(--glass-b);color:var(--ink2);margin-left:6px;font-weight:500}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:24px;box-shadow:var(--glass-s);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);padding:20px;position:relative;transition:background .4s}
.card h2{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2 small{font-family:Inter;font-size:12px;font-weight:500;color:var(--ink2)}
.stage{padding:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,var(--stage1),var(--stage2))}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:560/500}
.pills{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.stagebtns{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.verdict{position:absolute;left:50%;top:14%;transform:translate(-50%,0);pointer-events:none;font-family:Fraunces,serif;font-weight:700;font-size:clamp(20px,3.4vw,30px);padding:6px 20px;border-radius:16px;background:var(--bad);color:#fff;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 10px 30px -8px var(--bad)}
.verdict.on{opacity:1;transform:translate(-50%,-6px) rotate(-3deg);animation:shake .5s}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
/* chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.chip{font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:14px;padding:9px 10px;transition:all .18s;position:relative}
.chip:hover{transform:translateY(-2px)}
.chip.on{border-color:var(--accent);background:linear-gradient(160deg,var(--chip),rgba(229,154,74,.22));box-shadow:0 8px 20px -10px var(--accent)}
.chip b{display:block;font-size:13px}
.chip span{font-size:11px;color:var(--ink2)}
.chip .sw{display:block;width:100%;height:6px;border-radius:4px;margin-bottom:7px}
.chip kbd{position:absolute;right:6px;top:6px;margin:0;padding:0 5px}
@media(max-width:480px){.chips{grid-template-columns:repeat(2,1fr)}}
/* sliders */
.slider{margin-bottom:18px}
.srow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.srow label{font-size:13px;font-weight:600}
.srow output{font-family:Fraunces,serif;font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(to right,transparent 0 var(--pct),var(--track) var(--pct)),var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.3)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--chip);border-radius:16px;padding:12px 14px}
.stat small{display:block;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{font-family:Fraunces,serif;font-size:22px;font-variant-numeric:tabular-nums}
.gaugewrap{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.gaugewrap svg{width:190px;flex:none}
.vtext h3{font-family:Fraunces,serif;font-size:20px;line-height:1.15;margin-bottom:4px}
.vtext p{font-size:13px;color:var(--ink2);line-height:1.45}
.needle{transition:transform .7s cubic-bezier(.3,1.5,.5,1);transform-origin:100px 100px}
/* chart */
.chart{width:100%;height:auto;display:block;touch-action:none}
.chart text{fill:var(--ink2);font-size:11px;font-family:Inter}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,6,3,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .card{max-width:520px;width:100%;background:var(--bg1);}
.dark .modal .card{background:#241911}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--grid)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;padding:10px 18px;border-radius:99px;background:var(--ink);color:var(--bg1);font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toast 1.8s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
footer{text-align:center;color:var(--ink2);font-size:12px;margin-top:26px}
@media(prefers-reduced-motion:reduce){.blobs i{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect,useMemo,useCallback} = React;

const BISCUITS = [
  {id:'digestive',name:'Digestive',tag:'The classic',sturdy:.75,absorb:.10,col:[208,156,88],dark:[118,72,32],w:46,len:170,flecks:.5},
  {id:'richtea',name:'Rich Tea',tag:'Dunk at your peril',sturdy:.35,absorb:.22,col:[236,201,138],dark:[150,104,50],w:44,len:172,flecks:.1},
  {id:'hobnob',name:'Hobnob',tag:'Oaty fortress',sturdy:.85,absorb:.08,col:[192,136,68],dark:[104,62,26],w:50,len:160,flecks:1},
  {id:'gingernut',name:'Ginger Nut',tag:'Basically a brick',sturdy:.9,absorb:.06,col:[152,90,40],dark:[82,42,18],w:48,len:160,flecks:.3},
  {id:'shortbread',name:'Shortbread',tag:'Buttery, brittle',sturdy:.5,absorb:.14,col:[243,212,148],dark:[172,124,62],w:50,len:170,flecks:0},
  {id:'custard',name:'Custard Cream',tag:'Sandwich risk',sturdy:.6,absorb:.09,col:[240,219,168],dark:[162,122,68],w:50,len:160,flecks:.2,cream:true},
];
const MAXT = 30, SPEED = 4;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const mix=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`;

function makeModel({temp,biscuit,integ}){
  const b = BISCUITS.find(x=>x.id===biscuit);
  const f = .4 + 1.2*(temp-40)/60;
  const k = b.absorb*.6*f;
  const crit = b.sturdy*(.3+.6*integ/100);
  const soak = t=>1-Math.exp(-k*t);
  const tOf = s=> s>=1?Infinity : -Math.log(1-s)/k;
  const risk = t=>{const r=soak(t)/crit; return clamp(Math.pow(Math.min(r,1.2),2.2),0,1)};
  return {b,k,crit,soak,risk,tc:tOf(crit),t60:tOf(.6*crit),t95:tOf(.95*crit)};
}
const verdictFor = r => r>=1 ? ['Total collapse','Plop. Your biscuit has left the building — enjoy the sludge at the bottom.','bad']
  : r>=.95 ? ['Living dangerously','One more second and it\'s a soggy goodbye. Hold your nerve.','warn']
  : r>=.6 ? ['Perfect dunk','Soft, sweet, and still structurally sound. Chef\'s kiss.','good']
  : r>=.3 ? ['Gently softened','Pleasant — a little tea in the crunch, but you could go further.','good']
  : ['Barely kissed','Practically a dry biscuit with ambition. Dunk longer!','warn'];
const tempLabel = t => t<55?'Tepid, sadly':t<70?'Sippable':t<85?'Proper cuppa':t<95?'Builder\'s brew':'Scalding!';

/* ---------------- Cup scene ---------------- */
function CupScene({model,temp,time,integ,playing,dark,restartKey,onLive,onBreak}){
  const cvs=useRef(null);
  const P=useRef({}); P.current={model,temp,time,integ,playing,dark,restartKey,onLive,onBreak};
  useEffect(()=>{
    const c=cvs.current, ctx=c.getContext('2d'); const W=560,H=500,SURF=292;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const fresh=()=>({t:0,broken:false,lenCur:1,bend:0,wet:0,sub:0,rk:P.current.restartKey,chunks:[],sed:[],sedA:1,sedFade:false,steam:[],ripples:[],drips:[],tip:{x:280,y:200},steamAcc:0,dripAcc:0,lastLive:0,prevSub:0});
    let st=fresh(); let last=performance.now(), raf, clock=0;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    function resetCycle(keepSed){st.t=0;st.broken=false;st.lenCur=1;st.bend=0;st.wet=0;st.sub=0;st.prevSub=0;st.drips=[]; if(st.sed.length){st.sedFade=true}}
    function frame(now){
      raf=requestAnimationFrame(frame);
      const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
      const q=P.current, m=q.model, b=m.b;
      if(q.restartKey!==st.rk){const rk=q.restartKey; st=fresh(); st.rk=rk;}
      if(q.playing) st.t+=dt;
      const D=1.1,Hd=Math.max(.2,q.time/SPEED),U=1.1,R=1.8,total=D+Hd+U+R;
      if(st.t>=total) resetCycle();
      let p,simT,phase;
      if(st.t<D){p=ease(st.t/D);simT=0;phase='Lowering'}
      else if(st.t<D+Hd){p=1;simT=Math.min(q.time,(st.t-D)*SPEED);phase='Dunking'}
      else if(st.t<D+Hd+U){p=1-ease((st.t-D-Hd)/U);simT=q.time;phase='Lifting'}
      else {p=0;simT=q.time;phase='Result'}
      const soakNow=m.soak(simT), r=soakNow/m.crit;
      const Lfull=b.len, topFull=lerp(105,402,p)-Lfull*.98, hx=268;
      // break
      if(!st.broken && simT>=m.tc && p>.8 && q.time>=m.tc){
        st.broken=true;
        st.chunks.push({x:st.tip.x,y:st.tip.y-10,vy:30,rot:0,vr:rnd(-1,1),w:b.w*.95,h:Lfull*.34,big:1,col:b.col});
        for(let i=0;i<16;i++)st.chunks.push({x:st.tip.x+rnd(-24,24),y:st.tip.y-rnd(0,40),vy:rnd(10,60),rot:rnd(0,6),vr:rnd(-3,3),w:rnd(3,8),h:rnd(3,7),col:b.col});
        for(let i=0;i<3;i++)st.ripples.push({x:st.tip.x+rnd(-20,20),age:-i*.12,max:rnd(70,110)});
        if(q.onBreak){const rc=c.getBoundingClientRect(),s=rc.width/W;q.onBreak(rc.left+st.tip.x*s,rc.top+(SURF-20)*s,b.col)}
      }
      const lenT=st.broken?.62:1; st.lenCur+=(lenT-st.lenCur)*Math.min(1,dt*9);
      const bendT=st.broken?.1:clamp((r-.5)/.5,0,1)*.9; st.bend+=(bendT-st.bend)*Math.min(1,dt*6);
      const Lc=Lfull*st.lenCur;
      const bottomApprox=topFull+Lc*.98;
      const sub=clamp((bottomApprox-SURF)/Lc,0,1);
      if(sub>0&&st.prevSub===0) st.ripples.push({x:st.tip.x,age:0,max:60});
      st.prevSub=sub;
      if(sub>0){st.wet=Math.max(st.wet,clamp(sub+soakNow*.9,0,1))}
      st.sub=sub;
      // steam
      const inten=clamp((q.temp-38)/62,.05,1);
      st.steamAcc+=dt*(3+13*inten);
      while(st.steamAcc>1){st.steamAcc--;st.steam.push({x:280+rnd(-85,85),y:SURF-4,age:0,life:rnd(2.4,4),size:rnd(14,26),ph:rnd(0,6),sp:rnd(26,46)})}
      st.steam=st.steam.filter(s=>(s.age+=dt)<s.life);
      st.ripples=st.ripples.filter(rp=>(rp.age+=dt)<1.4);
      // drips
      if(phase==='Lifting'&&st.wet>0&&st.tip.y<SURF){st.dripAcc+=dt*9;while(st.dripAcc>1){st.dripAcc--;st.drips.push({x:st.tip.x+rnd(-10,10),y:st.tip.y,vy:0})}}
      st.drips=st.drips.filter(d=>{d.vy+=900*dt;d.y+=d.vy*dt;if(d.y>=SURF){st.ripples.push({x:d.x,age:0,max:26});return false}return true});
      // chunks
      st.chunks=st.chunks.filter(ch=>{ch.vy=Math.min(ch.big?110:70,ch.vy+60*dt);ch.y+=ch.vy*dt;ch.rot+=ch.vr*dt;ch.x+=Math.sin(clock*2+ch.rot)*8*dt;
        if(ch.y>=418){if(st.sed.length<14)st.sed.push({x:ch.x,y:rnd(414,424),w:ch.w,h:ch.h,rot:ch.rot,col:ch.col});return false}return true});
      if(st.sedFade){st.sedA-=dt*.7;if(st.sedA<=0){st.sed=[];st.sedA=1;st.sedFade=false}}

      /* ---- draw ---- */
      const dk=q.dark;
      ctx.clearRect(0,0,W,H);
      // saucer
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(280,462,215,26,0,0,7);ctx.fill();
      let g=ctx.createLinearGradient(0,430,0,480);
      g.addColorStop(0,dk?'#4a382c':'#fff8ee');g.addColorStop(1,dk?'#2a1d15':'#e6cfae');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(280,452,205,28,0,0,7);ctx.fill();
      ctx.fillStyle=dk?'rgba(0,0,0,.35)':'rgba(120,80,40,.18)';ctx.beginPath();ctx.ellipse(280,449,140,16,0,0,7);ctx.fill();
      // handle
      const glassS=dk?'rgba(255,240,220,.6)':'rgba(255,255,255,.9)', glassF=dk?'rgba(255,240,220,.1)':'rgba(255,255,255,.3)';
      ctx.lineWidth=14;ctx.strokeStyle=dk?'rgba(255,240,220,.28)':'rgba(255,255,255,.55)';
      ctx.beginPath();ctx.ellipse(408,326,54,50,0,-1.45,1.5);ctx.stroke();
      ctx.lineWidth=2;ctx.strokeStyle=glassS;ctx.beginPath();ctx.ellipse(408,326,61,57,0,-1.45,1.5);ctx.stroke();
      ctx.beginPath();ctx.ellipse(408,326,47,43,0,-1.45,1.5);ctx.stroke();
      // cup back & interior
      const cupPath=()=>{ctx.beginPath();ctx.moveTo(150,252);ctx.bezierCurveTo(150,385,192,442,280,442);ctx.bezierCurveTo(368,442,410,385,410,252)};
      ctx.fillStyle=dk?'rgba(30,18,10,.55)':'rgba(120,80,40,.15)';ctx.beginPath();ctx.ellipse(280,252,130,28,0,0,7);ctx.fill();
      // tea back surface
      const bob=Math.sin(clock*2)*.8+ -sub*4;
      const sy=SURF+bob;
      g=ctx.createRadialGradient(280,sy,10,280,sy,130);g.addColorStop(0,'#e29a48');g.addColorStop(1,'#a8591d');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(280,sy,126,25,0,0,7);ctx.fill();
      // sediment (inside)
      // biscuit
      let x=hx,y=topFull; const n=14,sl=Lc/n; const W_=b.w;
      for(let i=0;i<n;i++){
        const a=.1+st.bend*Math.pow((i+.5)/n,2);
        const dFromBottom=1-(i+.5)/n;
        const wetI=dFromBottom<st.wet?1:0;
        const edge=clamp((st.wet-dFromBottom)/.12,0,1);
        const mixAmt=edge*clamp(.35+.65*Math.min(1,soakNow/m.crit),0,1);
        ctx.save();ctx.translate(x,y);ctx.rotate(-a);
        ctx.fillStyle=mix(b.col,b.dark,mixAmt);
        ctx.beginPath();ctx.roundRect(-W_/2,0,W_,sl+1.5,i===0?[7,7,0,0]:i===n-1?[0,0,8,8]:0);ctx.fill();
        // edge shading
        ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(-W_/2,0,5,sl+1);
        ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(W_/2-6,0,6,sl+1);
        if(b.cream&&i>=4&&i<n-0){ctx.fillStyle=mix([250,240,205],b.dark,mixAmt*.6);ctx.fillRect(-W_/2,0,W_,sl+1.5)}
        // flecks
        ctx.fillStyle=`rgba(${b.dark.join(',')},.35)`;
        for(let j=0;j<3*b.flecks+1;j++){const fx=((i*37+j*53)%100)/100*(W_-10)-W_/2+5, fy=((i*29+j*71)%100)/100*sl;ctx.fillRect(fx,fy,2.2,2.2)}
        ctx.restore();
        x+=Math.sin(a)*sl;y+=Math.cos(a)*sl;
      }
      st.tip={x,y};
      // chunks (inside tea)
      for(const ch of st.chunks){ctx.save();ctx.translate(ch.x,ch.y);ctx.rotate(ch.rot);ctx.fillStyle=mix(ch.col,b.dark,.8);
        ctx.beginPath();ctx.roundRect(-ch.w/2,-ch.h/2,ch.w,ch.h,ch.big?5:2);ctx.fill();ctx.restore()}
      // tea overlay below surface
      ctx.save();cupPath();ctx.lineTo(410,252);ctx.closePath();ctx.clip();
      g=ctx.createLinearGradient(0,sy,0,442);g.addColorStop(0,'rgba(215,130,52,.62)');g.addColorStop(1,'rgba(98,42,12,.9)');
      ctx.fillStyle=g;ctx.fillRect(140,sy,280,160);
      // sediment
      ctx.globalAlpha=st.sedA;
      for(const s of st.sed){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=mix(s.col,b.dark,.9);ctx.beginPath();ctx.roundRect(-s.w/2,-s.h/2,s.w,s.h,2);ctx.fill();ctx.restore()}
      ctx.globalAlpha=1;
      // front surface edge
      ctx.strokeStyle='rgba(255,210,140,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(280,sy,126,25,0,0,Math.PI);ctx.stroke();
      ctx.restore();
      // ripples
      for(const rp of st.ripples){if(rp.age<0)continue;const k=rp.age/1.4;ctx.strokeStyle=`rgba(255,225,170,${(1-k)*.7})`;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.ellipse(rp.x,sy,Math.min(120,rp.max*k+4),Math.min(24,(rp.max*k+4)*.2),0,0,7);ctx.stroke()}
      // glass cup
      cupPath();ctx.lineTo(410,252);ctx.closePath();ctx.fillStyle=glassF;ctx.fill();
      cupPath();ctx.lineWidth=3;ctx.strokeStyle=glassS;ctx.stroke();
      ctx.strokeStyle=dk?'rgba(255,255,255,.35)':'rgba(255,255,255,.95)';ctx.lineWidth=7;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(170,290);ctx.bezierCurveTo(172,350,190,392,226,418);ctx.stroke();ctx.lineCap='butt';
      ctx.lineWidth=3;ctx.strokeStyle=glassS;ctx.beginPath();ctx.ellipse(280,252,130,28,0,0,7);ctx.stroke();
      // drips
      ctx.fillStyle='rgba(190,100,30,.9)';for(const d of st.drips){ctx.beginPath();ctx.ellipse(d.x,d.y,2.2,4,0,0,7);ctx.fill()}
      // steam
      for(const s of st.steam){const k=s.age/s.life,al=Math.sin(Math.PI*k)*.28*(.4+inten*.8);
        const sx=s.x+Math.sin(s.age*1.6+s.ph)*(14+k*22),syy=s.y-s.age*s.sp,sz=s.size*(1+k*1.9);
        const sg=ctx.createRadialGradient(sx,syy,0,sx,syy,sz);sg.addColorStop(0,`rgba(255,250,245,${al})`);sg.addColorStop(1,'rgba(255,250,245,0)');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,syy,sz,0,7);ctx.fill()}
      // live
      if(now-st.lastLive>66){st.lastLive=now;if(q.onLive)q.onLive({simT,r,phase,broken:st.broken,p,t:st.t})}
    }
    raf=requestAnimationFrame(frame);
    return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={cvs} aria-label="Animated teacup with a biscuit being dunked" role="img"/>;
}

/* ---------------- Gauge ---------------- */
function Gauge({value}){
  const pt=(a,r=80)=>[100+r*Math.cos(Math.PI-a*Math.PI),100-r*Math.sin(Math.PI-a*Math.PI)];
  const arc=(a0,a1)=>{const [x0,y0]=pt(a0),[x1,y1]=pt(a1);return `M${x0} ${y0} A80 80 0 0 1 ${x1} ${y1}`};
  const col=value>=.8?'var(--bad)':value>=.5?'var(--warn)':'var(--good)';
  return <svg viewBox="0 0 200 124" role="img" aria-label={`Crumble risk ${Math.round(value*100)} percent`}>
    <path d={arc(0,.5)} stroke="var(--good)" strokeWidth="14" fill="none" opacity=".85"/>
    <path d={arc(.5,.8)} stroke="var(--warn)" strokeWidth="14" fill="none" opacity=".85"/>
    <path d={arc(.8,1)} stroke="var(--bad)" strokeWidth="14" fill="none" opacity=".85" strokeLinecap="butt"/>
    <g className="needle" style={{transform:`rotate(${-90+value*180}deg)`}}>
      <path d="M96 100 L100 28 L104 100Z" fill="var(--ink)"/>
    </g>
    <circle cx="100" cy="100" r="8" fill="var(--ink)"/><circle cx="100" cy="100" r="3" fill={col}/>
    <text x="100" y="121" textAnchor="middle" style={{fontFamily:'Fraunces',fontWeight:700,fontSize:15,fill:col}}>{Math.round(value*100)}% crumble</text>
  </svg>;
}

/* ---------------- Chart ---------------- */
function Chart({model,time,live,playing}){
  const w=640,h=270,L=44,Rm=16,T=14,B=34,iw=w-L-Rm,ih=h-T-B;
  const X=t=>L+t/MAXT*iw, Y=v=>T+(1-v)*ih;
  const [hov,setHov]=useState(null);
  const pts=useMemo(()=>{const a=[];for(let i=0;i<=150;i++){const t=i/150*MAXT;a.push([t,model.soak(t),model.risk(t)])}return a},[model]);
  const line=idx=>pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[idx]).toFixed(1)}`).join('');
  const area=line(2)+`L${X(MAXT)} ${Y(0)}L${X(0)} ${Y(0)}Z`;
  const tc=model.tc;
  const onMove=e=>{const r=e.currentTarget.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*w;setHov(clamp((px-L)/iw*MAXT,0,MAXT))};
  const showLive=live&&live.simT>0.01&&live.p>.5;
  return <div>
  <svg className="chart" viewBox={`0 0 ${w} ${h}`} onMouseMove={onMove} onMouseLeave={()=>setHov(null)} role="img" aria-label="Crumble risk over dunk time">
    <defs>
      <linearGradient id="rg" x1="0" y1={Y(1)} x2="0" y2={Y(0)} gradientUnits="userSpaceOnUse">
        <stop offset="0" stopColor="var(--bad)" stopOpacity=".75"/><stop offset=".45" stopColor="var(--warn)" stopOpacity=".45"/><stop offset="1" stopColor="var(--good)" stopOpacity=".15"/>
      </linearGradient>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="7" fill="var(--bad)" opacity=".16"/></pattern>
      <clipPath id="cp"><rect x={L} y={T} width={iw} height={ih}/></clipPath>
    </defs>
    {[0,.25,.5,.75,1].map(v=><g key={v}><line x1={L} x2={w-Rm} y1={Y(v)} y2={Y(v)} stroke="var(--grid)"/><text x={L-8} y={Y(v)+4} textAnchor="end">{v*100}%</text></g>)}
    {[0,5,10,15,20,25,30].map(t=><g key={t}><line x1={X(t)} x2={X(t)} y1={T} y2={T+ih} stroke="var(--grid)" strokeDasharray="2 4"/><text x={X(t)} y={h-14} textAnchor="middle">{t}s</text></g>)}
    {isFinite(tc)&&tc<MAXT&&<rect x={X(tc)} y={T} width={X(MAXT)-X(tc)} height={ih} fill="url(#hatch)"/>}
    <rect x={X(model.t60<MAXT?model.t60:MAXT)} y={T} width={Math.max(0,X(Math.min(MAXT,model.t95))-X(Math.min(MAXT,model.t60)))} height={ih} fill="var(--good)" opacity=".16"/>
    <path d={area} fill="url(#rg)" clipPath="url(#cp)"/>
    <path d={line(1)} fill="none" stroke="var(--accent2)" strokeWidth="2.5" strokeDasharray="6 5" clipPath="url(#cp)"/>
    <path d={line(2)} fill="none" stroke="var(--bad)" strokeWidth="3.5" strokeLinejoin="round" clipPath="url(#cp)"/>
    <line x1={L} x2={w-Rm} y1={Y(1)} y2={Y(1)} stroke="var(--bad)" strokeDasharray="4 4" opacity=".7"/>
    <text x={w-Rm-4} y={Y(1)-6} textAnchor="end" style={{fill:'var(--bad)',fontWeight:600}}>collapse line</text>
    {/* set time marker */}
    <g style={{transition:'transform .25s'}} transform={`translate(${X(time)},0)`}>
      <line y1={T} y2={T+ih} stroke="var(--ink)" strokeWidth="2"/>
      <circle cx="0" cy={Y(model.risk(time))} r="6.5" fill="var(--ink)" stroke="var(--bg1)" strokeWidth="2.5"/>
      <rect x="-22" y={h-30} width="44" height="18" rx="9" fill="var(--ink)"/><text x="0" y={h-17} textAnchor="middle" style={{fill:'var(--bg1)',fontWeight:700}}>{time}s</text>
    </g>
    {showLive&&<circle cx={X(live.simT)} cy={Y(model.risk(live.simT))} r="5" fill="#fff" stroke="var(--accent)" strokeWidth="3"><animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/></circle>}
    {hov!==null&&<g>
      <line x1={X(hov)} x2={X(hov)} y1={T} y2={T+ih} stroke="var(--ink2)" strokeDasharray="3 3"/>
      <g transform={`translate(${clamp(X(hov)+10,L,w-Rm-130)},${T+6})`}>
        <rect width="124" height="46" rx="10" fill="var(--bg1)" stroke="var(--grid)"/>
        <text x="10" y="17" style={{fontWeight:700,fill:'var(--ink)'}}>t = {hov.toFixed(1)}s</text>
        <text x="10" y="31">soak {Math.round(model.soak(hov)*100)}%</text>
        <text x="10" y="43" style={{fill:'var(--bad)'}}>crumble {Math.round(model.risk(hov)*100)}%</text>
      </g>
    </g>}
  </svg>
  <div className="legend"><span><i style={{background:'var(--bad)'}}/>Crumble risk</span><span><i style={{background:'var(--accent2)'}}/>Tea soaked in</span><span><i style={{background:'var(--good)',opacity:.5,height:10}}/>Sweet spot</span><span><i style={{background:'var(--bad)',opacity:.35,height:10}}/>Collapse zone</span></div>
  </div>;
}

/* ---------------- Slider ---------------- */
function Slider({id,label,k,value,min,max,step,onChange,display,fill,hint}){
  const pct=(value-min)/(max-min)*100;
  return <div className="slider">
    <div className="srow"><label htmlFor={id}>{label}<kbd>{k}</kbd></label><output htmlFor={id}>{display}</output></div>
    <input id={id} type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(+e.target.value)} style={{'--pct':pct+'%','--fill':fill}}/>
    <div className="hint">{hint}</div>
  </div>;
}

/* ---------------- App ---------------- */
function App(){
  const [dark,setDark]=useState(()=>{try{const s=localStorage.getItem('tds-dark');if(s!==null)return s==='1'}catch(e){}return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches});
  const [temp,setTemp]=useState(85);
  const [time,setTime]=useState(6);
  const [biscuit,setBiscuit]=useState('digestive');
  const [integ,setInteg]=useState(70);
  const [playing,setPlaying]=useState(true);
  const [fahr,setFahr]=useState(false);
  const [help,setHelp]=useState(false);
  const [toast,setToast]=useState(null);
  const [live,setLive]=useState(null);
  const [restartKey,setRestartKey]=useState(0);
  const [swept,setSwept]=useState(0);
  const crumbCv=useRef(null), parts=useRef([]);

  useEffect(()=>{document.documentElement.className=dark?'dark':'';try{localStorage.setItem('tds-dark',dark?'1':'0')}catch(e){}},[dark]);
  const model=useMemo(()=>makeModel({temp,biscuit,integ}),[temp,biscuit,integ]);
  const r=model.soak(time)/model.crit;
  const risk=model.risk(time);
  const verdict=verdictFor(r);
  const say=useCallback(m=>setToast({m,k:Date.now()}),[]);
  useEffect(()=>{if(toast){const id=setTimeout(()=>setToast(null),1800);return()=>clearTimeout(id)}},[toast]);

  // crumb overlay
  const spawn=useCallback((x,y,col,n=70)=>{
    const out=parts.current;const rnd=(a,b)=>a+Math.random()*(b-a);
    for(let i=0;i<n;i++){const spray=i<n*.55;
      out.push({x:spray?x+rnd(-40,40):rnd(0,innerWidth),y:spray?y:rnd(-60,-5),vx:spray?rnd(-280,280):rnd(-30,30),vy:spray?-rnd(180,560):rnd(0,120),
        s:rnd(2.5,8),rot:rnd(0,6),vr:rnd(-8,8),shade:rnd(-.25,.2),col,landed:0,floor:innerHeight-rnd(2,16),sides:3+Math.floor(Math.random()*3)});}
    if(out.length>500)out.splice(0,out.length-500);
    setSwept(s=>s+n);
  },[]);
  useEffect(()=>{
    const c=crumbCv.current,ctx=c.getContext('2d');let raf,last=performance.now();
    const size=()=>{const d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)};
    size();addEventListener('resize',size);
    const f=now=>{raf=requestAnimationFrame(f);const dt=Math.min(.04,(now-last)/1000);last=now;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      parts.current=parts.current.filter(p=>{
        if(!p.landed){p.vy+=1200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
          if(p.y>=p.floor){p.y=p.floor;if(Math.abs(p.vy)>160){p.vy*=-.3;p.vx*=.5}else{p.landed=1e-3;p.vr=0;p.vx=0;p.vy=0}}}
        else{p.landed+=dt;if(p.landed>5)return false}
        const a=p.landed>3.5?1-(p.landed-3.5)/1.5:1;
        ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=`rgb(${p.col.map(v=>clamp(Math.round(v*(1+p.shade)),0,255)).join(',')})`;
        ctx.beginPath();for(let i=0;i<p.sides;i++){const an=i/p.sides*6.283,rr=p.s*(i%2?.7:1);ctx[i?'lineTo':'moveTo'](Math.cos(an)*rr,Math.sin(an)*rr)}ctx.closePath();ctx.fill();ctx.restore();
        return true});
    };
    raf=requestAnimationFrame(f);
    return()=>{cancelAnimationFrame(raf);removeEventListener('resize',size)};
  },[]);

  const dunkNow=useCallback(()=>{setRestartKey(k=>k+1);setPlaying(true);say('Dunking!')},[say]);
  const sweet=useCallback(()=>{
    const m=model;const t=isFinite(m.t60)?Math.min(MAXT,(m.t60+Math.min(m.t95,MAXT))/2):MAXT;
    setTime(Math.round(t*2)/2);say('Sweet spot set');
  },[model,say]);
  const sprinkle=useCallback(()=>{spawn(innerWidth/2,innerHeight/2,model.b.col,60);say('Crumbs!')},[spawn,model,say]);

  const fmtT=t=>fahr?Math.round(t*9/5+32)+'°F':t+'°C';
  const A=useRef({});A.current={temp,time,integ,biscuit,dark,playing,fahr,help,dunkNow,sweet,sprinkle,say};
  useEffect(()=>{
    const onKey=e=>{
      if(e.metaKey||e.ctrlKey||e.altKey)return;
      const a=A.current,tg=e.target,tag=tg.tagName,k=e.key,kl=k.toLowerCase();
      if(k==='Escape'){setHelp(false);return}
      if((k===' '||k==='Enter')&&(tag==='BUTTON'))return;
      if(tag==='SELECT'||tag==='TEXTAREA')return;
      if(tag==='INPUT'&&k.startsWith('Arrow'))return;
      let h=true;
      if(k===' '){setPlaying(p=>!p);a.say(a.playing?'Paused':'Playing')}
      else if(k==='ArrowRight'){setTime(t=>clamp(t+.5,0,MAXT))}
      else if(k==='ArrowLeft'){setTime(t=>clamp(t-.5,0,MAXT))}
      else if(k==='ArrowUp'){setTemp(t=>clamp(t+(e.shiftKey?1:5),40,100))}
      else if(k==='ArrowDown'){setTemp(t=>clamp(t-(e.shiftKey?1:5),40,100))}
      else if(k===']'){setInteg(t=>clamp(t+5,5,100))}
      else if(k==='['){setInteg(t=>clamp(t-5,5,100))}
      else if(/^[1-6]$/.test(k)){const b=BISCUITS[+k-1];setBiscuit(b.id);setRestartKey(x=>x+1);a.say(b.name)}
      else if(kl==='d'){setDark(d=>!d)}
      else if(kl==='u'){setFahr(f=>!f)}
      else if(kl==='n'||k==='Enter'){a.dunkNow()}
      else if(kl==='s'){a.sweet()}
      else if(kl==='c'){a.sprinkle()}
      else if(kl==='r'){setTemp(85);setTime(6);setInteg(70);setBiscuit('digestive');setRestartKey(x=>x+1);a.say('Reset')}
      else if(k==='?'||kl==='h'){setHelp(x=>!x)}
      else h=false;
      if(h)e.preventDefault();
    };
    addEventListener('keydown',onKey);return()=>removeEventListener('keydown',onKey);
  },[]);

  const phaseTxt=live?(live.broken?'Collapsed!':live.phase):'Ready';
  const shortcuts=[['Pause / play','Space'],['Dunk now','N'],['Dark mode','D'],['°C / °F','U'],['Dunk time','← →'],['Tea temp (Shift = fine)','↑ ↓'],['Integrity','[ ]'],['Biscuit','1 – 6'],['Sweet spot','S'],['Sprinkle crumbs','C'],['Reset','R'],['This panel','? / H']];

  return <>
    <div className="blobs"><i/><i/><i/></div>
    <canvas id="crumbs" ref={crumbCv}/>
    <div className="app">
      <header>
        <div>
          <h1>Tea <span>Dunkability</span> Simulator</h1>
          <p className="sub">Find the exact moment between “crunchy” and “catastrophe”.</p>
        </div>
        <div className="hbtns">
          <button className="btn" onClick={()=>setFahr(f=>!f)} title="Toggle units (U)">{fahr?'°F':'°C'}<kbd>U</kbd></button>
          <button className="btn" onClick={()=>setDark(d=>!d)} title="Toggle dark mode (D)">{dark?'☀️ Light':'🌙 Dark'}<kbd>D</kbd></button>
          <button className="btn" onClick={()=>setHelp(true)}>⌨️ Shortcuts<kbd>?</kbd></button>
        </div>
      </header>

      <div className="grid">
        <div className="col">
          <section className="card stage" aria-label="Teacup animation">
            <div className="pills">
              <span className="pill"><span className="dot" style={{background:live&&live.broken?'var(--bad)':'var(--good)',animationPlayState:playing?'running':'paused'}}/>{playing?phaseTxt:'Paused'}</span>
              <span className="pill">⏱ {live?live.simT.toFixed(1):'0.0'}s dunked · {Math.round((live?Math.min(1,live.r):0)*100)}% limit</span>
            </div>
            <div className={'verdict'+(live&&live.broken?' on':'')} aria-live="polite">Crumble!</div>
            <CupScene model={model} temp={temp} time={time} integ={integ} playing={playing} dark={dark} restartKey={restartKey} onLive={setLive} onBreak={(x,y,col)=>spawn(x,y,col,80)}/>
            <div className="stagebtns">
              <button className="btn" onClick={()=>setPlaying(p=>!p)}>{playing?'⏸ Pause':'▶ Play'}<kbd>Space</kbd></button>
              <span style={{display:'flex',gap:8}}>
                <button className="btn" onClick={sprinkle}>🍪 Crumbs<kbd>C</kbd></button>
                <button className="btn primary" onClick={dunkNow}>☕ Dunk now<kbd style={{background:'rgba(0,0,0,.12)',color:'#2b1608'}}>N</kbd></button>
              </span>
            </div>
          </section>

          <section className="card">
            <h2>Crumble-o-meter <small>risk vs. dunk time · hover to inspect</small></h2>
            <Chart model={model} time={time} live={live} playing={playing}/>
          </section>
        </div>

        <div className="col">
          <section className="card">
            <h2>The biscuit</h2>
            <div className="chips" role="radiogroup" aria-label="Biscuit type">
              {BISCUITS.map((b,i)=><button key={b.id} role="radio" aria-checked={biscuit===b.id} className={'chip'+(biscuit===b.id?' on':'')} onClick={()=>{setBiscuit(b.id);setRestartKey(k=>k+1)}}>
                <i className="sw" style={{background:`linear-gradient(90deg,rgb(${b.col}),rgb(${b.dark}))`}}/>
                <b>{b.name}</b><span>{b.tag}</span><kbd>{i+1}</kbd>
              </button>)}
            </div>
            <Slider id="temp" label="Tea temperature" k="↑ ↓" value={temp} min={40} max={100} step={1} onChange={setTemp} display={fmtT(temp)}
              fill="linear-gradient(90deg,#4aa3e8,#f0c14a 55%,#e5482f)" hint={tempLabel(temp)+' — hotter tea soaks in faster.'}/>
            <Slider id="time" label="Dunk time" k="← →" value={time} min={0} max={MAXT} step={.5} onChange={setTime} display={time.toFixed(1)+'s'}
              fill="linear-gradient(90deg,var(--accent2),var(--accent))" hint={isFinite(model.tc)?`Collapse in about ${model.tc.toFixed(1)}s.`:'Practically indestructible.'}/>
            <Slider id="integ" label="Structural integrity" k="[ ]" value={integ} min={5} max={100} step={1} onChange={setInteg} display={integ+'%'}
              fill="linear-gradient(90deg,#b0a79c,var(--good))" hint={integ<30?'Fresh from a damp tin…':integ>85?'Factory fresh. Snaps cleanly.':'A respectable snap.'}/>
          </section>

          <section className="card">
            <h2>The verdict <small>at {time.toFixed(1)}s</small></h2>
            <div className="gaugewrap">
              <Gauge value={risk}/>
              <div className="vtext"><h3 style={{color:`var(--${verdict[2]})`}}>{verdict[0]}</h3><p>{verdict[1]}</p></div>
            </div>
            <div className="stats">
              <div className="stat"><small>Tea absorbed</small><b>{Math.round(model.soak(time)*100)}%</b></div>
              <div className="stat"><small>Collapse at</small><b>{isFinite(model.tc)?model.tc.toFixed(1)+'s':'never'}</b></div>
              <div className="stat"><small>Sweet spot</small><b>{isFinite(model.t60)?`${model.t60.toFixed(1)}–${isFinite(model.t95)?model.t95.toFixed(1):'∞'}s`:'—'}</b></div>
              <div className="stat"><small>Crumbs swept</small><b>{swept}</b></div>
            </div>
            <button className="btn" style={{marginTop:12,width:'100%',justifyContent:'center'}} onClick={sweet}>🎯 Find the sweet spot<kbd>S</kbd></button>
          </section>
        </div>
      </div>
      <footer>Scientifically dubious · deliciously accurate. Press <kbd>?</kbd> for keyboard shortcuts.</footer>
    </div>

    {help&&<div className="modal" onClick={()=>setHelp(false)}>
      <div className="card" onClick={e=>e.stopPropagation()} role="dialog" aria-label="Keyboard shortcuts">
        <h2>Keyboard shortcuts <button className="btn" onClick={()=>setHelp(false)}>Esc</button></h2>
        <div className="keys">{shortcuts.map(([l,k])=><div key={l}><span>{l}</span><kbd>{k}</kbd></div>)}</div>
      </div>
    </div>}
    {toast&&<div className="toast" key={toast.k}>{toast.m}</div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
