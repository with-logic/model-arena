<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown → Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Fraunces','Georgia','Times New Roman',serif;
  --sans:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --app-bg:#0a0e17; --panel:#10151f; --panel-2:#151b28; --line:#222b3b; --text:#e6e9f0; --muted:#8892a6;
  --accent:#d4a857; --accent-ink:#1a1405; --focus:rgba(212,168,87,.35);
  --s-bg:#0f1a2e; --s-bg2:#16284a; --s-text:#e9edf5; --s-head:#ffffff; --s-muted:#9aa8c2; --s-accent:#d4a857;
  --s-code:#0a1220; --s-line:rgba(255,255,255,.12); --s-card:rgba(255,255,255,.05);
  --shadow:0 30px 80px -20px rgba(0,0,0,.7);
}
[data-theme="light"]{
  --app-bg:#eceae4; --panel:#fbfaf7; --panel-2:#f3f1ea; --line:#dedbd0; --text:#1b2433; --muted:#6c7587;
  --accent:#1d3557; --accent-ink:#fff; --focus:rgba(29,53,87,.25);
  --s-bg:#fdfcf8; --s-bg2:#f1ede1; --s-text:#2a3445; --s-head:#12233f; --s-muted:#6c7587; --s-accent:#a8741a;
  --s-code:#f0ece0; --s-line:rgba(18,35,63,.14); --s-card:rgba(18,35,63,.04);
  --shadow:0 30px 70px -25px rgba(30,40,60,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--app-bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button,select,textarea{font-family:inherit}

/* header */
header{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#000));display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:15px;font-family:var(--sans)}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;margin-left:2px}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.btn,select.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);height:36px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
select.btn{padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238892a6' fill='none' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn svg{width:16px;height:16px;flex:none}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--panel)}
.btn.primary .kbd{border-color:rgba(0,0,0,.25);color:inherit;background:transparent;opacity:.75}

/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(300px,40%) 1fr;min-height:0}
.editor{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:44px;flex:none;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.pane-head .meta{letter-spacing:.02em;text-transform:none;font-weight:500;font-family:var(--mono);font-size:11.5px}
textarea#src{flex:1;resize:none;border:0;background:transparent;color:var(--text);font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:18px 20px;tab-size:2;outline:none;white-space:pre;overflow:auto}
textarea#src::selection{background:var(--focus)}
.hint{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.hint b{color:var(--text);font-weight:600}

.preview{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px;position:relative}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.frame{position:relative;box-shadow:var(--shadow);border-radius:6px;overflow:hidden;background:var(--s-bg);outline:1px solid var(--line)}
.frame .slide{position:absolute;left:0;top:0;transform-origin:0 0}
.controls{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:70px;text-align:center}
.counter b{color:var(--text);font-weight:500}
.progress{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
.thumbs{display:flex;gap:12px;padding:14px 20px;overflow-x:auto;border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.thumb{flex:none;width:168px;height:94.5px;position:relative;border-radius:5px;overflow:hidden;cursor:pointer;border:2px solid transparent;outline:1px solid var(--line);opacity:.65;transition:.15s;padding:0;background:none}
.thumb:hover{opacity:1}
.thumb.active{border-color:var(--accent);opacity:1}
.thumb .slide{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(.0875);pointer-events:none}
.thumb em{position:absolute;right:4px;bottom:3px;font:500 10px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:1px 5px;border-radius:3px;z-index:2;font-style:normal}

/* ===== SLIDE (1920x1080 design space) ===== */
.slide{width:1920px;height:1080px;background:radial-gradient(1400px 800px at 100% 0%,var(--s-bg2),var(--s-bg) 70%);color:var(--s-text);font-family:var(--sans);overflow:hidden;position:relative}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--s-accent)}
.slide-inner{position:absolute;left:150px;right:150px;top:110px;bottom:130px;font-size:40px;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
.slide-inner>*{margin:0 0 .6em}
.slide-inner>*:last-child{margin-bottom:0}
.slide h1,.slide h2,.slide h3,.slide h4{font-family:var(--serif);color:var(--s-head);line-height:1.12;font-weight:600;letter-spacing:-.01em}
.slide h1{font-size:2.9em}
.slide h2{font-size:1.9em;padding-bottom:.28em;position:relative;margin-bottom:.7em}
.slide h2::after{content:"";position:absolute;left:0;bottom:0;width:96px;height:5px;background:var(--s-accent);border-radius:3px}
.slide h3{font-size:1.25em;color:var(--s-accent);font-family:var(--sans);font-weight:600;letter-spacing:.02em}
.slide h4{font-size:1em;text-transform:uppercase;letter-spacing:.14em;color:var(--s-muted);font-family:var(--sans)}
.slide p{margin-top:0}
.slide strong{color:var(--s-head);font-weight:700}
.slide em{color:var(--s-accent);font-style:italic}
.slide a{color:var(--s-accent);text-decoration:none;border-bottom:2px solid currentColor}
.slide ul,.slide ol{padding-left:1.2em;list-style:none;counter-reset:n}
.slide ul ul,.slide ol ol,.slide ul ol,.slide ol ul{margin:.3em 0 .1em;font-size:.88em;color:var(--s-muted)}
.slide li{position:relative;margin:.35em 0;padding-left:.3em}
.slide ul>li::before{content:"";position:absolute;left:-.9em;top:.62em;width:.28em;height:.28em;background:var(--s-accent);border-radius:2px;transform:rotate(45deg)}
.slide ol>li{counter-increment:n}
.slide ol>li::before{content:counter(n);position:absolute;left:-1.35em;top:.12em;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border-radius:50%;background:var(--s-accent);color:var(--s-bg);font-size:.62em;font-weight:700}
.slide blockquote{border-left:6px solid var(--s-accent);padding:.5em 1.2em;background:var(--s-card);border-radius:0 12px 12px 0;font-family:var(--serif);font-size:1.15em;line-height:1.4;color:var(--s-head)}
.slide blockquote p{margin:0 0 .4em}.slide blockquote p:last-child{margin:0}
.slide blockquote em{font-style:normal;font-family:var(--sans);font-size:.65em;color:var(--s-muted)}
.slide code{font-family:var(--mono);font-size:.82em;background:var(--s-code);padding:.08em .4em;border-radius:6px;color:var(--s-accent)}
.slide pre{background:var(--s-code);border:1px solid var(--s-line);border-radius:14px;padding:.8em 1em;font-size:.72em;line-height:1.55;overflow:hidden}
.slide pre code{background:none;padding:0;color:var(--s-text);font-size:1em}
.slide pre .k{color:var(--s-accent)}.slide pre .s{color:#7fc79a}.slide pre .c{color:var(--s-muted);font-style:italic}.slide pre .n{color:#79b1e8}
.slide table{border-collapse:collapse;width:100%;font-size:.78em}
.slide th{text-align:left;font-size:.8em;text-transform:uppercase;letter-spacing:.1em;color:var(--s-accent);padding:.6em .9em;border-bottom:3px solid var(--s-accent)}
.slide td{padding:.65em .9em;border-bottom:1px solid var(--s-line)}
.slide tbody tr:nth-child(even){background:var(--s-card)}
.slide td.r,.slide th.r{text-align:right}.slide td.c,.slide th.c{text-align:center}
.slide img{max-width:100%;max-height:520px;border-radius:12px;display:block}
.slide hr{display:none}
.slide .cols{display:grid;gap:70px;grid-template-columns:repeat(var(--n),1fr);align-items:start}
.slide .cols>div>*:first-child{margin-top:0}
.slide .cols>div>*:last-child{margin-bottom:0}
.slide-foot{position:absolute;left:150px;right:150px;bottom:48px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-muted);border-top:1px solid var(--s-line);padding-top:22px}
.slide-foot b{font-weight:600;color:var(--s-accent);letter-spacing:.08em}
/* layouts */
.slide.title::before{width:100%;height:14px;bottom:auto}
.slide.title .slide-inner{left:170px;right:170px}
.slide.title h1{font-size:4em;line-height:1.05;margin-bottom:.35em;max-width:1400px}
.slide.title h1+p,.slide.title h2+p{color:var(--s-muted);font-size:1.1em}
.slide.title h2{font-family:var(--sans);font-size:1.3em;font-weight:500;color:var(--s-accent);padding:0;letter-spacing:.02em}
.slide.title h2::after{display:none}
.slide.title .slide-foot,.slide.section .slide-foot{display:none}
.slide.title::after{content:"";position:absolute;right:-220px;bottom:-260px;width:820px;height:820px;border-radius:50%;border:2px solid var(--s-line);box-shadow:0 0 0 70px transparent,inset 0 0 0 90px var(--s-card)}
.slide.section .slide-inner{left:170px}
.slide.section h2{font-size:3.4em;padding:0;margin:0}
.slide.section h2::after{bottom:-.35em;width:140px}
.slide.section{background:linear-gradient(135deg,var(--s-bg2),var(--s-bg))}
.slide.empty .slide-inner{align-items:center;color:var(--s-muted)}
.slide.quote .slide-inner{justify-content:center}
.slide.quote blockquote{font-size:1.6em;border-left-width:8px}
.slide.top .slide-inner{justify-content:flex-start}

/* fullscreen / presenting */
body.presenting header,body.presenting .editor,body.presenting .controls,body.presenting .thumbs{display:none}
body.presenting main{display:block;position:fixed;inset:0;z-index:50;background:#000}
body.presenting .preview{height:100%}
body.presenting .stage-wrap{padding:0;background:#000}
body.presenting .frame{box-shadow:none;border-radius:0;outline:0}
.hud{display:none}
body.presenting .hud{display:flex;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;gap:6px;align-items:center;padding:6px;border-radius:14px;background:rgba(15,20,30,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);transition:opacity .4s;color:#dfe5f1}
body.presenting .hud.idle{opacity:0;pointer-events:none}
.hud .btn{background:transparent;border-color:transparent;color:#dfe5f1}
.hud .btn:hover{background:rgba(255,255,255,.1)}
.hud .counter{color:#9aa6bd}.hud .counter b{color:#fff}
body.presenting.idle-cursor{cursor:none}
.bar-fs{display:none}
body.presenting .bar-fs{display:block;position:fixed;left:0;bottom:0;height:3px;background:var(--s-accent);z-index:61;transition:width .35s}

@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide.anim .slide-inner{animation:in .45s cubic-bezier(.2,.7,.2,1)}
.toast{position:fixed;top:74px;left:50%;transform:translate(-50%,-10px);background:var(--panel-2);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:42% 1fr}
  .editor{border-right:0;border-bottom:1px solid var(--line)}
  .brand small,.hint,.kbd{display:none}
  header{gap:8px;padding:0 12px}
  .stage-wrap{padding:14px}
  .thumbs{display:none}
}
@media print{body{display:block;overflow:visible}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">M</div>Markdown → Slides<small>Turn plain text into a boardroom-ready deck</small></div>
  <div class="spacer"></div>
  <div class="ctl">
    <select id="samples" class="btn" aria-label="Load sample deck">
      <option value="" disabled selected>Load sample deck…</option>
      <option value="qbr">Quarterly Business Review</option>
      <option value="pitch">Product Launch Pitch</option>
      <option value="guide">Markdown Syntax Guide</option>
      <option value="blank">Blank deck</option>
    </select>
    <button id="theme" class="btn" title="Toggle theme (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="themeIcon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeLabel">Dark</span></button>
    <button id="fs" class="btn primary" title="Present full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen <span class="kbd">F</span></button>
  </div>
</header>
<main>
  <section class="editor">
    <div class="pane-head"><span>Markdown</span><span class="meta" id="meta"></span></div>
    <textarea id="src" spellcheck="false" aria-label="Markdown source"></textarea>
    <div class="hint"><span>Use <b>---</b> on its own line to split slides</span><span><b>::: cols</b> … <b>|||</b> … <b>:::</b> for columns</span></div>
  </section>
  <section class="preview">
    <div class="pane-head"><span>Live preview</span><span class="meta">← → to navigate · F full screen · T theme</span></div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"><div class="frame" id="frame"></div></div></div>
    <div class="controls">
      <button class="btn icon-btn" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="counter" id="counter"></div>
      <button class="btn icon-btn" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>
</main>
<div class="hud" id="hud">
  <button class="btn icon-btn" id="hPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="counter" id="hCount"></span>
  <button class="btn icon-btn" id="hNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="btn" id="hTheme">Theme</button>
  <button class="btn" id="hExit">Exit <span class="kbd" style="color:#9aa6bd;border-color:rgba(255,255,255,.2);background:none">Esc</span></button>
</div>
<div class="bar-fs" id="barFs"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Sample decks ---------- */
const SAMPLES = {

/* ---------- Markdown parser ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  const stash=[];
  s = esc(s).replace(/`([^`]+)`/g,(_,c)=>{stash.push('<code>'+c+'</code>');return '\u0000'+(stash.length-1)+'\u0000'});
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,a,u)=>'<img alt="'+a+'" src="'+safeUrl(u)+'">')
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>'<a href="'+safeUrl(u)+'" target="_blank" rel="noopener">'+t+'</a>')
       .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(_,a,b)=>'<strong>'+(a||b)+'</strong>')
       .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>')
       .replace(/(^|[^_\w])_([^_\s][^_]*?)_(?![_\w])/g,'$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>stash[i]);
}
function safeUrl(u){return /^\s*javascript:/i.test(u)?'#':u}
function highlight(code,lang){
  let h=esc(code);
  if(!lang||/^(text|txt|plain)$/.test(lang))return h;
  const hash=/^(yaml|yml|python|py|bash|sh|shell|ruby|toml)$/.test(lang);
  const re=new RegExp([
    hash?'(#[^\\n]*)':'(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|--[^\\n]*)',
    '(&quot;.*?&quot;|"[^"\\n]*"|\'[^\'\\n]*\'|`[^`]*`)',
    '\\b(function|const|let|var|return|if|else|for|while|class|import|from|export|def|async|await|new|true|false|null|None|SELECT|FROM|WHERE|JOIN|GROUP|BY|ORDER|type|interface)\\b',
    '\\b(\\d+(?:\\.\\d+)?[A-Za-z%]*)\\b'
  ].join('|'),'g');
  return h.replace(re,(m,c,s,k,n)=>c?'<span class="c">'+c+'</span>':s?'<span class="s">'+s+'</span>':k?'<span class="k">'+k+'</span>':'<span class="n">'+n+'</span>');
}
function md(src){
  const L=src.replace(/\r\n?/g,'\n').split('\n'); let i=0; const out=[];
  const isBlockStart=l=>/^\s{0,3}(#{1,6}\s|>|```|\s*([-*+]|\d+\.)\s)/.test(l)||/^::: ?cols/.test(l);
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if((m=l.match(/^\s*```\s*(\w*)/))){ // fence
      const buf=[];i++;
      while(i<L.length&&!/^\s*```/.test(L[i]))buf.push(L[i++]);
      i++; out.push('<pre><code>'+highlight(buf.join('\n'),m[1].toLowerCase())+'</code></pre>');continue;
    }
    if(/^::: ?cols\s*$/.test(l)){
      const buf=[];i++;
      while(i<L.length&&!/^:::\s*$/.test(L[i]))buf.push(L[i++]);
      i++;
      const parts=[[]];let f=false;
      buf.forEach(b=>{if(/^```/.test(b.trim()))f=!f; if(!f&&/^\|\|\|\s*$/.test(b))parts.push([]);else parts[parts.length-1].push(b)});
      out.push('<div class="cols" style="--n:'+parts.length+'">'+parts.map(p=>'<div>'+md(p.join('\n'))+'</div>').join('')+'</div>');continue;
    }
    if((m=l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))){out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');i++;continue}
    if(/^\s{0,3}>/.test(l)){
      const buf=[];
      while(i<L.length&&/^\s{0,3}>/.test(L[i]))buf.push(L[i++].replace(/^\s{0,3}>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const items=[];
      while(i<L.length&&(/^\s*([-*+]|\d+\.)\s+/.test(L[i])||(L[i].trim()&&/^\s{2,}\S/.test(L[i])&&items.length))){
        const mm=L[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(mm)items.push({d:mm[1].replace(/\t/g,'  ').length,o:/\d/.test(mm[2]),t:mm[3]});
        else items[items.length-1].t+=' '+L[i].trim();
        i++;
      }
      let p=0;
      const build=base=>{
        const tag=items[p].o?'ol':'ul';let h='<'+tag+'>';
        while(p<items.length&&items[p].d>=base){
          const it=items[p++];h+='<li>'+inline(it.t);
          if(p<items.length&&items[p].d>it.d)h+=build(items[p].d);
          h+='</li>';
        }
        return h+'</'+tag+'>';
      };
      while(p<items.length)out.push(build(items[p].d));
      continue;
    }
    if(l.includes('|')&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(l),al=cells(L[i+1]).map(a=>/^:-+:$/.test(a)?'c':/-:$/.test(a)?'r':'');
      i+=2;const rows=[];
      while(i<L.length&&L[i].trim()&&L[i].includes('|'))rows.push(cells(L[i++]));
      const cls=k=>al[k]?' class="'+al[k]+'"':'';
      out.push('<table><thead><tr>'+head.map((c,k)=>'<th'+cls(k)+'>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,k)=>'<td'+cls(k)+'>'+inline(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    const buf=[];
    while(i<L.length&&L[i].trim()&&!isBlockStart(L[i]))buf.push(L[i++].trim());
    if(!buf.length){buf.push(L[i++])}
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}
function splitSlides(src){
  const slides=[[]];let f=false;
  src.replace(/\r\n?/g,'\n').split('\n').forEach(l=>{
    if(/^\s*```/.test(l))f=!f;
    if(!f&&/^\s{0,3}-{3,}\s*$/.test(l)&&!(slides[slides.length-1].length&&slides[slides.length-1].at(-1).trim()&&false))slides.push([]);
    else slides[slides.length-1].push(l);
  });
  const r=slides.map(s=>s.join('\n').trim());
  return r.filter((s,k)=>s||r.length===1);
}

/* ---------- App ---------- */
const $=id=>document.getElementById(id);
const src=$('src'),frame=$('frame'),thumbs=$('thumbs');
let slides=[],cur=0,theme=localStorage.getItem('m2s-theme')||'dark';
let deckTitle='';

function layoutOf(html){
  const tags=[...html.matchAll(/<(h[1-6]|p|ul|ol|pre|table|blockquote|div|img)[\s>]/g)].map(m=>m[1]);
  const top=html.replace(/<(ul|ol|blockquote|table|div)[\s\S]*<\/\1>/g,'<$1></$1>');
  const kinds=[...top.matchAll(/<(h[1-6]|p|ul|ol|pre|table|blockquote|div)[\s>]/g)].map(m=>m[1]);
  if(!kinds.length)return 'empty';
  if(kinds[0]==='h1'&&kinds.every(k=>k==='h1'||k==='h2'||k==='p')&&kinds.length<=4)return 'title';
  if(kinds.length===1&&kinds[0]==='h2')return 'section';
  if(kinds.length===1&&kinds[0]==='h1')return 'title';
  if(kinds.length===1&&kinds[0]==='blockquote')return 'quote';
  return '';
}
function slideHTML(html,idx,total,anim){
  const lay=layoutOf(html);
  const body=lay==='empty'?'<p>Empty slide</p>':html;
  return '<div class="slide '+lay+(anim?' anim':'')+'"><div class="slide-inner">'+body+'</div><div class="slide-foot"><span><b>'+esc(deckTitle)+'</b></span><span>'+(idx+1)+' / '+total+'</span></div></div>';
}
function fit(root){
  root.querySelectorAll('.slide-inner').forEach(el=>{
    let size=40;el.style.fontSize=size+'px';
    while(el.scrollHeight>el.clientHeight+2&&size>16){size-=2;el.style.fontSize=size+'px'}
  });
}
function parse(){
  const v=src.value;
  slides=splitSlides(v).map(md);
  const t=v.match(/^#\s+(.+)$/m);deckTitle=t?t[1].replace(/[*_`]/g,''):'Untitled deck';
  if(cur>=slides.length)cur=slides.length-1;if(cur<0)cur=0;
  $('meta').textContent=slides.length+(slides.length===1?' slide':' slides')+' · '+(v.trim()?v.trim().split(/\s+/).length:0)+' words';
  buildThumbs();show(false);
  localStorage.setItem('m2s-md',v);
}
function buildThumbs(){
  thumbs.innerHTML='';
  slides.forEach((h,k)=>{
    const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label','Go to slide '+(k+1));
    b.innerHTML=slideHTML(h,k,slides.length)+'<em>'+(k+1)+'</em>';
    b.onclick=()=>go(k);thumbs.appendChild(b);
  });
  fit(thumbs);
}
function show(anim=true){
  frame.innerHTML=slideHTML(slides[cur]||'',cur,slides.length,anim);
  fit(frame);scale();
  [...thumbs.children].forEach((t,k)=>{t.classList.toggle('active',k===cur);if(k===cur&&!document.body.classList.contains('presenting'))t.scrollIntoView({block:'nearest',inline:'nearest'})});
  const pct=slides.length>1?cur/(slides.length-1)*100:100;
  $('counter').innerHTML='<b>'+(cur+1)+'</b> / '+slides.length;
  $('hCount').innerHTML='<b>'+(cur+1)+'</b> / '+slides.length;
  $('bar').style.width=pct+'%';$('barFs').style.width=pct+'%';
}
function go(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===cur)return;cur=n;show()}
function scale(){
  const w=$('stage').clientWidth,h=$('stage').clientHeight;if(!w||!h)return;
  const s=Math.min(w/1920,h/1080);
  frame.style.width=1920*s+'px';frame.style.height=1080*s+'px';
  const sl=frame.firstElementChild;if(sl)sl.style.transform='scale('+s+')';
}
new ResizeObserver(scale).observe($('stage'));
addEventListener('resize',scale);

/* theme */
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  $('themeLabel').textContent=theme==='dark'?'Dark':'Light';
  $('themeIcon').setAttribute('d',theme==='dark'?'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z':'M12 4V2m0 20v-2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z');
  localStorage.setItem('m2s-theme',theme);
}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();toast((theme==='dark'?'Dark':'Light')+' theme')}

/* fullscreen */
function isPresenting(){return document.body.classList.contains('presenting')}
function setPresenting(on){
  document.body.classList.toggle('presenting',on);
  requestAnimationFrame(()=>{scale();show(false);});
  if(on){wake()}
}
function enterFS(){
  setPresenting(true);
  const el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
}
function exitFS(){
  setPresenting(false);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&isPresenting())setPresenting(false);else setTimeout(scale,50)});
let idleT;function wake(){
  $('hud').classList.remove('idle');document.body.classList.remove('idle-cursor');
  clearTimeout(idleT);idleT=setTimeout(()=>{if(isPresenting()){$('hud').classList.add('idle');document.body.classList.add('idle-cursor')}},2500);
}
addEventListener('mousemove',()=>{if(isPresenting())wake()});

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400)}

/* events */
$('fs').onclick=enterFS;$('hExit').onclick=exitFS;
$('theme').onclick=toggleTheme;$('hTheme').onclick=toggleTheme;
$('prev').onclick=$('hPrev').onclick=()=>go(cur-1);
$('next').onclick=$('hNext').onclick=()=>go(cur+1);
$('stage').addEventListener('click',e=>{if(isPresenting()){const r=$('stage').getBoundingClientRect();go(e.clientX<r.left+r.width*.25?cur-1:cur+1)}});
$('stage').addEventListener('dblclick',()=>{if(!isPresenting())enterFS()});
$('samples').onchange=e=>{
  const k=e.target.value;src.value=k==='blank'?'# Untitled deck\n\n---\n\n## First slide\n\n- Start writing…\n':SAMPLES[k];
  cur=0;parse();e.target.selectedIndex=0;toast('Loaded: '+e.target.options[[...e.target.options].findIndex(o=>o.value===k)].text);
};
let pt;src.addEventListener('input',()=>{clearTimeout(pt);pt=setTimeout(parse,120)});
function syncCaret(){
  const before=src.value.slice(0,src.selectionStart);
  let f=false,n=0;before.split('\n').forEach(l=>{if(/^\s*```/.test(l))f=!f;if(!f&&/^\s{0,3}-{3,}\s*$/.test(l))n++});
  const idx=Math.min(n,slides.length-1);if(idx!==cur&&!pt){cur=idx;show()}
}
['keyup','click'].forEach(ev=>src.addEventListener(ev,e=>{if(ev==='click'||!/Arrow(Left|Right)|Shift|Control|Meta|Alt/.test(e.key)||true)syncCaret()}));
src.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const typing=document.activeElement===src||document.activeElement.tagName==='SELECT';
  if(e.key==='Escape'&&isPresenting()){exitFS();return}
  if(typing&&!isPresenting())return;
  switch(e.key){
    case 'ArrowRight':case 'ArrowDown':case 'PageDown':case ' ':case 'Enter':if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;e.preventDefault();go(cur+1);break;
    case 'ArrowLeft':case 'ArrowUp':case 'PageUp':case 'Backspace':e.preventDefault();go(cur-1);break;
    case 'Home':e.preventDefault();go(0);break;
    case 'End':e.preventDefault();go(slides.length-1);break;
    case 'f':case 'F':isPresenting()?exitFS():enterFS();break;
    case 't':case 'T':toggleTheme();break;
  }
  if(isPresenting())wake();
});

/* init */
applyTheme();
src.value=localStorage.getItem('m2s-md')||SAMPLES.qbr;
if(!src.value.trim())src.value=SAMPLES.qbr;
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{parse()});
parse();
</script>
