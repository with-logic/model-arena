<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Virtual Drum Kit</title>
<style>
:root{
  --bg:#0c0b10; --panel:#16141d; --panel2:#1d1a27; --line:#2c2839; --text:#e9e6f2; --dim:#8b86a0;
  --amber:#ffb020; --red:#ff3b4e; --green:#35e08a; --cyan:#33d6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a1f3f55, transparent 70%),
    radial-gradient(800px 500px at 100% 100%, #3a1a2a44, transparent 70%),
    repeating-linear-gradient(45deg,#0e0d13 0 14px,#100f16 14px 28px);
  user-select:none;-webkit-user-select:none;overflow-x:hidden;
}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 30px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(#211e2d,#15131c);border:1px solid var(--line);border-radius:14px;padding:12px 16px;
  box-shadow:0 10px 30px #0008, inset 0 1px #ffffff12}
.logo{display:flex;align-items:center;gap:12px}
.logo .badge{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd36b,#c77b00 70%);display:grid;place-items:center;box-shadow:0 0 18px #ffb02055, inset 0 -3px 6px #0006;font-size:22px}
h1{font-size:20px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
h1 small{display:block;font-size:10px;letter-spacing:.3em;color:var(--amber);font-weight:600;margin-top:2px}
.scope{flex:1;min-width:160px;height:46px;background:#07060a;border:1px solid #000;border-radius:8px;box-shadow:inset 0 0 14px #000;position:relative;overflow:hidden}
.scope canvas{width:100%;height:100%;display:block}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
select,input[type=range]{accent-color:var(--amber)}
select{background:#0f0e15;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;letter-spacing:0;text-transform:none}

.stage-wrap{margin-top:14px;border-radius:18px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:
   radial-gradient(ellipse at 50% 85%,#4a2f1a 0,#2a1a10 35%,transparent 70%),
   linear-gradient(#17141f,#0f0d15);
  box-shadow:0 20px 50px #000a, inset 0 0 80px #000a}
.stage-wrap::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 38px,#ffffff05 38px 40px),repeating-linear-gradient(0deg,transparent 0 38px,#ffffff05 38px 40px);pointer-events:none}
.stage{position:relative;width:100%;padding-bottom:76%;margin:0 auto;max-width:980px}
.rug{position:absolute;left:14%;right:14%;bottom:2%;height:34%;border-radius:50%;background:radial-gradient(ellipse,#5a1f2a 0,#3a1219 60%,transparent 72%);opacity:.55;filter:blur(2px)}

.pad{position:absolute;left:calc(var(--x)*1% - var(--s)*.5%);top:calc(var(--y)*1.316% - var(--s)*.658%);
  width:calc(var(--s)*1%);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;font:inherit;
  touch-action:none;outline:none;display:grid;place-items:center;
  --c:#ff4d5e;
}
.pad .body{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 35%,color-mix(in srgb,var(--c) 40%,#000) 100%);
  box-shadow:0 0 0 4px #111, 0 0 0 7px #3a3646, 0 10px 22px #000c, inset 0 -8px 16px #0008, inset 0 6px 12px #fff3;
  transition:box-shadow .1s}
.pad.cym .body{
  background:conic-gradient(from 20deg,#f7d56a,#b98512,#f3cd5b,#9b6b0a,#f7d56a,#b98512,#f3cd5b,#9b6b0a,#f7d56a);
  box-shadow:0 0 0 3px #3b2a05, 0 10px 22px #000c, inset 0 0 0 10px #0002, inset 0 0 22px #000a;
}
.pad.cym .body::after{content:"";position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#8a5e06);box-shadow:inset 0 -3px 5px #0007}
.pad .body::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px solid #ffffff22;box-shadow:inset 0 0 18px #0005}
.pad.kick .body{background:radial-gradient(circle at 50% 50%,#0b0b0f 0 18%,#22222c 19% 24%,#15151b 25%,#2c2c38 60%,#14141a 100%);
  box-shadow:0 0 0 6px #aaa8b8, 0 0 0 12px #3a3646, 0 14px 28px #000c, inset 0 0 40px #000}
.pad.kick .body::before{inset:30%;border:3px solid var(--c);box-shadow:0 0 14px var(--c), inset 0 0 14px #000;opacity:.8}
.pad .lbl{position:relative;z-index:2;text-align:center;line-height:1.1;pointer-events:none;text-shadow:0 2px 4px #000a}
.pad .lbl b{display:block;font-size:clamp(14px,2.6vw,28px);font-weight:800}
.pad .lbl span{display:block;font-size:clamp(8px,1.1vw,11px);letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:3px}
.pad.cym .lbl{color:#3a2600;text-shadow:0 1px 0 #ffe8a066}
.pad.cym .lbl{position:absolute;bottom:14%}
.pad.hit .body{filter:brightness(1.5) saturate(1.2);box-shadow:0 0 0 4px #111,0 0 0 7px var(--c),0 0 50px 8px var(--c),inset 0 -8px 16px #0008}
.pad.cym.hit .body{box-shadow:0 0 0 3px #3b2a05,0 0 50px 10px #ffc83a}
.pad.kick.hit .body{box-shadow:0 0 0 6px #fff,0 0 0 12px var(--c),0 0 60px 12px var(--c),inset 0 0 40px #000}
.pad:focus-visible .body{outline:3px solid var(--cyan);outline-offset:6px}
.pad.rip::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}

.panel{margin-top:14px;background:linear-gradient(#1d1a27,#14121b);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px #0008, inset 0 1px #ffffff10}
.transport{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(#2e2a3d,#1c1927);border:1px solid #3b3650;color:var(--text);border-radius:10px;height:48px;padding:0 18px;font:inherit;font-weight:700;letter-spacing:.08em;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 #0009, inset 0 1px #fff1;transition:transform .05s,box-shadow .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0009}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.btn.rec.on{background:linear-gradient(#7a1420,#4a0a12);border-color:var(--red);animation:blink 1s infinite}
.btn.play.on{background:linear-gradient(#0f5a37,#0a3a24);border-color:var(--green)}
.btn.toggle.on{border-color:var(--amber);color:var(--amber);box-shadow:0 4px 0 #0009,0 0 14px #ffb02040}
@keyframes blink{50%{box-shadow:0 4px 0 #0009,0 0 22px var(--red)}}
.sep{flex:1}
.lcd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0a1a12;color:var(--green);border:1px solid #000;border-radius:8px;padding:8px 12px;min-width:200px;text-shadow:0 0 8px #35e08a88;box-shadow:inset 0 0 12px #000;font-size:13px}
.lcd.rec{color:var(--red);background:#1a0a0c;text-shadow:0 0 8px #ff3b4e88}
.row2{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row2 label{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.row2 output{color:var(--amber);font-family:ui-monospace,Menlo,monospace;min-width:48px;letter-spacing:0}
.timeline{margin-top:12px;height:120px;background:#07060a;border:1px solid #000;border-radius:8px;box-shadow:inset 0 0 14px #000;position:relative;overflow:hidden}
.timeline canvas{width:100%;height:100%;display:block}
.hint{margin-top:10px;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
kbd{display:inline-block;background:#262233;border:1px solid #3b3650;border-bottom-width:3px;border-radius:5px;padding:0 6px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:#000d;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
#start{position:fixed;inset:0;background:#000c;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;cursor:pointer}
#start div{text-align:center;padding:30px}
#start .big{font-size:56px}
#start h2{letter-spacing:.2em;text-transform:uppercase;margin:8px 0}
#start p{color:var(--dim)}
#start.gone{display:none}

@media (max-width:700px){
  .wrap{padding:10px 10px 24px}
  h1{font-size:16px}
  .scope{order:5;flex-basis:100%}
  .stage{padding-bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px 16px 22px}
  .rug{display:none}
  .pad{position:relative;left:auto;top:auto;width:100%;--s:20}
  .pad .lbl b{font-size:24px}.pad .lbl span{font-size:10px}
  .pad.kick{grid-column:1/-1;aspect-ratio:auto;height:120px;border-radius:999px;order:20}
  .pad.kick .body{border-radius:999px}
  .pad.kick .body::before{border-radius:999px;inset:22% 30%}
  .pad[data-id=crash]{order:1}.pad[data-id=hat]{order:2}.pad[data-id=ride]{order:3}
  .pad[data-id=open]{order:4}.pad[data-id=snare]{order:5}.pad[data-id=clap]{order:6}
  .pad[data-id=tom1]{order:7}.pad[data-id=tom2]{order:8}.pad[data-id=floor]{order:9}
  .pad[data-id=cow]{order:10}
  .btn{flex:1;justify-content:center;padding:0 10px}
  .lcd{flex-basis:100%}
  .hint.desk{display:none}
}
</style>
</head>
<body>
<div id="start"><div><div class="big">🥁</div><h2>Virtual Drum Kit</h2><p>Tap anywhere to start the session</p></div></div>
<div class="wrap">
  <header>
    <div class="logo"><div class="badge">🥁</div><h1>Virtual Drum Kit<small>Studio A · Live Room</small></h1></div>
    <div class="scope"><canvas id="scope"></canvas></div>
    <div class="ctl">Kit<select id="kit"><option value="acoustic">Studio Acoustic</option><option value="808">Electro 808</option><option value="rock">Arena Rock</option></select></div>
    <div class="ctl">Volume<input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
  </header>

  <div class="stage-wrap"><div class="stage" id="stage"><div class="rug"></div></div></div>

  <div class="panel">
    <div class="transport">
      <button class="btn rec" id="rec" title="Record (Enter)"><span class="dot"></span>REC</button>
      <button class="btn play" id="play" disabled title="Play (P)">▶ PLAY</button>
      <button class="btn" id="stop" title="Stop (Esc)">■ STOP</button>
      <button class="btn toggle" id="loop" title="Loop (O)">⟲ LOOP</button>
      <button class="btn" id="clear" disabled>✕ CLEAR</button>
      <div class="sep"></div>
      <div class="lcd" id="lcd">READY · no take recorded</div>
    </div>
    <div class="row2">
      <label>Speed <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1"><output id="speedo">1.00×</output></label>
      <label>Metronome <input type="range" id="bpm" min="40" max="220" step="1" value="100"><output id="bpmo">100</output></label>
      <button class="btn toggle" id="metro" style="height:38px">♩ CLICK</button>
    </div>
    <div class="timeline"><canvas id="tl"></canvas></div>
    <div class="hint desk">Press <kbd>Enter</kbd> to record · <kbd>P</kbd> play · <kbd>Esc</kbd> stop · <kbd>O</kbd> loop &nbsp;|&nbsp; Click, tap or use the keys shown on each pad</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const PADS=[
 {id:'crash',name:'Crash',key:'j',x:15,y:14,s:22,cym:1},
 {id:'ride', name:'Ride', key:'k',x:85,y:14,s:22,cym:1},
 {id:'tom1', name:'Tom 1',key:'f',x:37,y:24,s:19,c:'#ff4d5e'},
 {id:'tom2', name:'Tom 2',key:'g',x:63,y:24,s:19,c:'#ff7a3d'},
 {id:'hat',  name:'Hi-Hat',key:'a',x:9, y:42,s:16,cym:1},
 {id:'open', name:'Open Hat',key:'s',x:9,y:62,s:14,cym:1},
 {id:'snare',name:'Snare',key:'d',x:27,y:53,s:20,c:'#f2f2f2'},
 {id:'floor',name:'Floor Tom',key:'h',x:73,y:53,s:20,c:'#b44dff'},
 {id:'clap', name:'Clap',key:'l',x:91,y:42,s:16,c:'#33d6ff'},
 {id:'cow',  name:'Cowbell',key:'c',x:91,y:62,s:14,c:'#35e08a'},
 {id:'kick', name:'Kick',key:' ',x:50,y:62,s:26,c:'#ffb020',kick:1},
];
const byId=Object.fromEntries(PADS.map(p=>[p.id,p]));
const byKey={};PADS.forEach(p=>byKey[p.key]=p);byKey['b']=byId.kick;

// ---------- Audio ----------
let ctx,master,analyser,noiseBuf,liveBus,playBus,openHat=null;
const KITS={
 acoustic:{kickF:160,kickE:50,kickD:.4,tom:1,tomD:.38,snF:190,snN:.2,hatD:.05,openD:.45,sine:0},
 '808':{kickF:125,kickE:36,kickD:1.0,tom:.8,tomD:.7,snF:230,snN:.13,hatD:.035,openD:.3,sine:1},
 rock:{kickF:210,kickE:55,kickD:.33,tom:.85,tomD:.5,snF:165,snN:.3,hatD:.07,openD:.55,sine:0},
};
let K=KITS.acoustic;
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
  master=ctx.createGain();master.gain.value=.8;
  analyser=ctx.createAnalyser();analyser.fftSize=1024;
  master.connect(comp);comp.connect(analyser);analyser.connect(ctx.destination);
  liveBus=master;newPlayBus();
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function newPlayBus(){playBus=ctx.createGain();playBus.connect(master)}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function noise(t,dur,type,freq,q,peak,dec,dest,a=.001){
  const s=ctx.createBufferSource();s.buffer=noiseBuf;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ctx.createGain();env(g,t,a,peak,dec);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*1.5,dur);return g;
}
function osc(t,type,f0,f1,fdur,peak,dec,dest){
  const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+fdur);
  const g=ctx.createGain();env(g,t,.002,peak,dec);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dec+.1);return g;
}
const METAL=[205.3,284.7,369.4,421.2,540.6,800.1];
function metal(t,base,peak,dec,hp,dest){
  const hf=ctx.createBiquadFilter();hf.type='highpass';hf.frequency.value=hp;
  const g=ctx.createGain();env(g,t,.001,peak,dec);hf.connect(g);g.connect(dest);
  METAL.forEach(f=>{const o=ctx.createOscillator();o.type='square';o.frequency.value=f*base;o.connect(hf);o.start(t);o.stop(t+dec+.1)});
  return g;
}
function synth(id,t,dest,v=1){
  switch(id){
   case'kick':
     osc(t,'sine',K.kickF,K.kickE,.12,1.0*v,K.kickD,dest);
     if(!K.sine)osc(t,'triangle',K.kickF*2,K.kickE*2,.04,.35*v,.08,dest);
     noise(t,.03,'lowpass',3000,1,.4*v,.02,dest);break;
   case'snare':
     osc(t,K.sine?'sine':'triangle',K.snF,K.snF*.65,.08,.55*v,.12,dest);
     noise(t,.5,'highpass',1800,.7,.8*v,K.snN,dest);break;
   case'tom1':osc(t,'sine',220*K.tom,130*K.tom,.15,.9*v,K.tomD,dest);noise(t,.05,'bandpass',1200,1,.2*v,.03,dest);break;
   case'tom2':osc(t,'sine',165*K.tom,95*K.tom,.17,.95*v,K.tomD*1.1,dest);noise(t,.05,'bandpass',1000,1,.2*v,.03,dest);break;
   case'floor':osc(t,'sine',110*K.tom,62*K.tom,.2,1.0*v,K.tomD*1.3,dest);noise(t,.05,'bandpass',800,1,.2*v,.03,dest);break;
   case'hat':
     if(openHat){try{openHat.gain.cancelScheduledValues(t);openHat.gain.setTargetAtTime(0.0001,t,.01)}catch(e){}openHat=null}
     noise(t,.2,'highpass',7500,.8,.55*v,K.hatD,dest);metal(t,1.6,.12*v,K.hatD,6000,dest);break;
   case'open':
     openHat=noise(t,1,'highpass',7000,.8,.5*v,K.openD,dest);metal(t,1.6,.1*v,K.openD,6000,dest);break;
   case'crash':
     noise(t,2.5,'highpass',3500,.6,.7*v,1.7,dest,.003);metal(t,1.1,.12*v,1.6,4000,dest);break;
   case'ride':
     metal(t,1.3,.16*v,1.1,5000,dest);noise(t,.6,'highpass',6500,1,.18*v,.5,dest);
     osc(t,'sine',3200,null,0,.15*v,.5,dest);break;
   case'clap':
     [0,.011,.023].forEach(d=>noise(t+d,.1,'bandpass',1500,1.2,.75*v,.018,dest));
     noise(t+.034,.5,'bandpass',1400,1,.6*v,.16,dest);break;
   case'cow':
     {const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=1.2;bp.connect(dest);
      osc(t,'square',540,null,0,.4*v,.35,bp);osc(t,'square',810,null,0,.4*v,.35,bp);}break;
  }
}

// ---------- UI build ----------
const stage=document.getElementById('stage');
const els={};
PADS.forEach(p=>{
  const b=document.createElement('button');
  b.className='pad'+(p.cym?' cym':'')+(p.kick?' kick':'');
  b.dataset.id=p.id;b.style.setProperty('--x',p.x);b.style.setProperty('--y',p.y);b.style.setProperty('--s',p.s);
  if(p.c)b.style.setProperty('--c',p.c);
  b.setAttribute('aria-label',p.name+' ('+(p.key===' '?'Space':p.key.toUpperCase())+')');
  b.innerHTML='<span class="body"></span><span class="lbl"><b>'+(p.key===' '?'SPACE':p.key.toUpperCase())+'</b><span>'+p.name+'</span></span>';
  b.addEventListener('pointerdown',e=>{e.preventDefault();hit(p.id)});
  b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')e.preventDefault()});
  stage.appendChild(b);els[p.id]=b;
});
function flash(id){
  const el=els[id];el.classList.add('hit');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('hit'),110);
  el.classList.remove('rip');void el.offsetWidth;el.classList.add('rip');
  el.animate([{transform:'scale(.93)'},{transform:'scale(1)'}],{duration:130,easing:'ease-out'});
}

// ---------- Recorder ----------
let mode='idle',events=[],recStart=null,duration=0,loop=false,speed=1,timers=[],playStart=0;
const $=id=>document.getElementById(id);
const lcd=$('lcd');
function now(){return performance.now()}
function hit(id,v=1){
  initAudio();if(ctx.state!=='running')ctx.resume();
  synth(id,ctx.currentTime,liveBus,v);flash(id);
  if(mode==='rec'){
    if(recStart===null){recStart=now();setLcd('● REC · recording…',true)}
    events.push({t:now()-recStart,id});
  }
}
function setLcd(s,rec){lcd.textContent=s;lcd.classList.toggle('rec',!!rec)}
function fmt(ms){return (ms/1000).toFixed(2)+'s'}
function updateButtons(){
  $('rec').classList.toggle('on',mode==='rec');
  $('play').classList.toggle('on',mode==='play');
  $('play').disabled=!events.length||mode==='rec';
  $('clear').disabled=!events.length||mode!=='idle';
}
function startRec(){
  initAudio();stopPlay(true);
  mode='rec';events=[];recStart=null;duration=0;
  setLcd('● REC · armed — play a pad to begin',true);updateButtons();
}
function stopRec(){
  if(mode!=='rec')return;
  mode='idle';
  if(recStart!==null&&events.length){duration=now()-recStart+250;setLcd('TAKE 1 · '+events.length+' hits · '+fmt(duration))}
  else{events=[];setLcd('READY · no take recorded')}
  updateButtons();
}
function startPlay(){
  if(!events.length)return;
  initAudio();ctx.resume();stopPlay(true);
  mode='play';updateButtons();runPass();
  setLcd('▶ PLAYING · '+events.length+' hits'+(loop?' · loop':''));
}
function runPass(){
  const lead=.08;playStart=now()+lead*1000;
  const t0=ctx.currentTime+lead;
  events.forEach(e=>{
    const dt=e.t/1000/speed;
    synth(e.id,t0+dt,playBus);
    timers.push(setTimeout(()=>flash(e.id),(lead+dt)*1000));
  });
  timers.push(setTimeout(()=>{
    if(mode!=='play')return;
    if(loop){timers=[];runPass()}else stopPlay();
  },(lead+duration/1000/speed)*1000));
}
function stopPlay(silent){
  timers.forEach(clearTimeout);timers=[];
  if(ctx&&playBus){const old=playBus;old.gain.setTargetAtTime(0,ctx.currentTime,.02);setTimeout(()=>old.disconnect(),400);newPlayBus()}
  if(mode==='play'){mode='idle';if(!silent)setLcd('TAKE 1 · '+events.length+' hits · '+fmt(duration))}
  updateButtons();
}
function stopAll(){stopRec();stopPlay()}
$('rec').onclick=()=>mode==='rec'?stopRec():startRec();
$('play').onclick=()=>mode==='play'?stopPlay():startPlay();
$('stop').onclick=stopAll;
$('loop').onclick=()=>{loop=!loop;$('loop').classList.toggle('on',loop);toast('Loop '+(loop?'on':'off'))};
$('clear').onclick=()=>{events=[];duration=0;setLcd('READY · no take recorded');updateButtons()};
$('speed').oninput=e=>{speed=+e.target.value;$('speedo').textContent=speed.toFixed(2)+'×';if(mode==='play'){startPlay()}};
$('vol').oninput=e=>{initAudio();master.gain.value=+e.target.value};
$('kit').onchange=e=>{K=KITS[e.target.value];initAudio();toast('Kit: '+e.target.selectedOptions[0].text);
  synth('snare',ctx.currentTime,liveBus);};

// ---------- Metronome ----------
let metroOn=false,metroTimer=null,nextClick=0,beat=0;
function sched(){
  const spb=60/(+$('bpm').value);
  while(nextClick<ctx.currentTime+.15){
    const t=nextClick,acc=beat%4===0;
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1500:1000;o.type='sine';
    env(g,t,.001,acc?.35:.22,.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.08);
    beat++;nextClick+=spb;
  }
}
$('metro').onclick=()=>{
  initAudio();metroOn=!metroOn;$('metro').classList.toggle('on',metroOn);
  clearInterval(metroTimer);
  if(metroOn){ctx.resume();nextClick=ctx.currentTime+.05;beat=0;metroTimer=setInterval(sched,25)}
};
$('bpm').oninput=e=>$('bpmo').textContent=e.target.value;

// ---------- Keyboard ----------
const down=new Set();
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.type==='range')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='Enter'){e.preventDefault();if(!e.repeat)$('rec').click();return}
  if(k==='Escape'){stopAll();return}
  if(e.repeat)return;
  if(k==='p'){$('play').click();return}
  if(k==='o'){$('loop').click();return}
  const p=byKey[k];
  if(p){e.preventDefault();down.add(k);hit(p.id)}
});
addEventListener('blur',()=>down.clear());
$('start').addEventListener('pointerdown',()=>{initAudio();ctx.resume();$('start').classList.add('gone')});
addEventListener('keydown',()=>{if(!$('start').classList.contains('gone')){initAudio();ctx.resume();$('start').classList.add('gone')}},{capture:true});

// ---------- Toast ----------
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400)}

// ---------- Canvases ----------
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;return c.getContext('2d')}
const sc=$('scope'),tl=$('tl');let sx=fit(sc),tx=fit(tl);
addEventListener('resize',()=>{sx=fit(sc);tx=fit(tl)});
const buf=new Uint8Array(1024);
function frame(){
  // scope
  const w=sc.width,h=sc.height;sx.clearRect(0,0,w,h);
  sx.strokeStyle='#35e08a18';sx.lineWidth=1;
  for(let i=1;i<6;i++){sx.beginPath();sx.moveTo(0,h*i/6);sx.lineTo(w,h*i/6);sx.stroke()}
  sx.beginPath();sx.lineWidth=2*(devicePixelRatio||1);sx.strokeStyle='#35e08a';sx.shadowColor='#35e08a';sx.shadowBlur=8;
  if(analyser){analyser.getByteTimeDomainData(buf);for(let i=0;i<buf.length;i++){const x=i/buf.length*w,y=buf[i]/255*h;i?sx.lineTo(x,y):sx.moveTo(x,y)}}
  else{sx.moveTo(0,h/2);sx.lineTo(w,h/2)}
  sx.stroke();sx.shadowBlur=0;
  // timeline
  const W=tl.width,H=tl.height,d=devicePixelRatio||1;tx.clearRect(0,0,W,H);
  const lanes=PADS.length,lh=H/lanes;
  PADS.forEach((p,i)=>{tx.fillStyle=i%2?'#ffffff05':'#ffffff0a';tx.fillRect(0,i*lh,W,lh)});
  const rec=mode==='rec';
  let span=rec?Math.max(4000,(recStart===null?0:now()-recStart)+500):Math.max(duration,1);
  if(events.length||rec){
    events.forEach(e=>{const i=PADS.findIndex(p=>p.id===e.id),x=e.t/span*W;
      tx.fillStyle=byId[e.id].cym?'#ffc83a':(byId[e.id].c||'#fff');
      tx.fillRect(x-1.5*d,i*lh+lh*.2,3*d,lh*.6)});
    let ph=null;
    if(rec&&recStart!==null)ph=(now()-recStart)/span;
    else if(mode==='play')ph=Math.max(0,((now()-playStart)*speed)/duration);
    if(ph!==null){tx.fillStyle=rec?'#ff3b4e':'#35e08a';tx.fillRect(Math.min(ph,1)*W-1*d,0,2*d,H)}
  }else{
    tx.fillStyle='#8b86a0';tx.font=(12*d)+'px system-ui';tx.textAlign='center';
    tx.fillText('Press REC, then play the pads — your take appears here',W/2,H/2+4*d);
  }
  requestAnimationFrame(frame);
}
frame();updateButtons();
})();
</script>
