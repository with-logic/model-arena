<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Feedback Dashboard</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#fff; --ink:#1b2236; --muted:#6a7389; --line:#e6e9f1;
  --brand:#4f46e5; --brand-2:#7c3aed; --brand-soft:#eef0ff;
  --good:#12a370; --warn:#e8a317; --bad:#dc4b4b; --star:#f5b301;
  --shadow:0 1px 2px rgba(20,28,58,.05),0 8px 24px rgba(20,28,58,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:2px}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;margin-right:10px;vertical-align:middle;font-size:18px}

/* AI summary */
.ai{position:relative;border-radius:16px;padding:22px 24px;margin-bottom:20px;color:#fff;overflow:hidden;
  background:linear-gradient(120deg,#3730a3 0%,#5b3fd6 55%,#7c3aed 100%);box-shadow:0 10px 30px rgba(79,70,229,.28);
  transition:opacity .25s,transform .25s,max-height .3s,margin .3s,padding .3s;max-height:600px}
.ai::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.ai.hide{opacity:0;transform:translateY(-8px);max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em}
.ai-title{font-weight:650;font-size:16px}
.close{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.close:hover{background:rgba(255,255,255,.28)}
.close:focus-visible,.chip:focus-visible,th button:focus-visible,.search input:focus-visible{outline:2px solid #a5b4fc;outline-offset:2px}
.ai-body{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;position:relative;z-index:1}
.ai-text{font-size:14.5px;line-height:1.65;color:#eceafe;margin:0}
.ai-text b{color:#fff}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.theme{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px;font-size:12px}
.theme.neg{background:rgba(255,190,190,.22)}
.dist{display:grid;gap:5px;align-content:start}
.dist-row{display:grid;grid-template-columns:26px 1fr 22px;align-items:center;gap:8px;font-size:12px;color:#ddd9ff}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.show-ai{display:none;margin-bottom:16px;border:1px dashed #b9bfe9;background:var(--brand-soft);color:var(--brand);padding:7px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.show-ai.on{display:inline-flex;gap:6px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 320px;max-width:480px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 36px 0 38px;font:inherit;background:#fafbfe;color:var(--ink);transition:border .15s,box-shadow .15s,background .15s}
.search input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12);background:#fff}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#e9ecf5;color:var(--muted);width:24px;height:24px;border-radius:50%;cursor:pointer;display:none;line-height:1;font-size:14px}
.search .clear.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s}
.chip:hover{border-color:#c5caea;color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.count{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.tablewrap{overflow-x:auto;max-height:calc(100vh - 140px);min-height:300px;overflow-y:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:#f8f9fd;border-bottom:1px solid var(--line);text-align:left;padding:0;white-space:nowrap}
th button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#59627a}
th button:hover{background:#eff1fa;color:var(--ink)}
th.sorted button{color:var(--brand)}
.ico{display:inline-flex;flex-direction:column;gap:1px;margin-left:2px}
.ico svg{display:block;opacity:.28}
.ico svg.act{opacity:1;color:var(--brand)}
td{padding:14px 16px;border-bottom:1px solid #eef0f6;vertical-align:top}
tbody tr{transition:background .12s}
tbody tr:hover{background:#f8f9ff}
tbody tr:last-child td{border-bottom:0}
.c-date{width:120px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.c-event{width:210px;font-weight:600}
.c-name{width:190px}
.c-rate{width:150px}
.person{display:flex;align-items:center;gap:10px}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:600;line-height:1.5}
.stars{display:flex;align-items:center;gap:1px;white-space:nowrap}
.stars svg{width:15px;height:15px}
.stars span{margin-left:7px;font-weight:700;font-size:13px}
.fb{color:#38405a;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fb.open{-webkit-line-clamp:unset;display:block}
.more{all:unset;color:var(--brand);font-size:12.5px;font-weight:600;cursor:pointer;margin-top:3px;display:inline-block}
.more:hover{text-decoration:underline}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin:8px 0 2px}
@media(max-width:860px){.ai-body{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.count{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="logo">★</span>Event Feedback Dashboard</h1>
      <div class="sub">Participant feedback submissions across recent events</div>
    </div>
  </header>

  <section class="ai" id="ai" aria-label="AI summary">
    <div class="ai-head">
      <span class="badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7zM19 15l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"/></svg>
        AI summary
      </span>
      <span class="ai-title" id="aiTitle">What attendees are saying</span>
      <button class="close" id="closeAi" aria-label="Close AI summary" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="ai-body">
      <div>
        <p class="ai-text" id="aiText"></p>
        <div class="themes" id="themes"></div>
      </div>
      <div class="dist" id="dist"></div>
    </div>
  </section>
  <button class="show-ai" id="showAi">✨ Show AI summary</button>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search by keyword — name, event, feedback…" autocomplete="off" aria-label="Search feedback">
        <button class="clear" id="clr" aria-label="Clear search">✕</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by rating"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="heads"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DATA = [
["2026-10-28","Product Summit 2026","Priya Natarajan",5,"The keynote was easily the best I've attended in years. The speakers balanced strategy with real examples, and the breakout sessions were small enough that I could actually ask questions. I left with three ideas I'm taking straight to my team."],
["2026-10-27","Product Summit 2026","Marcus Holloway",4,"Great lineup and well-organized schedule, but the afternoon tracks overlapped in a way that forced me to skip a talk I really wanted to see. Recordings available soon after would solve that. Catering was a pleasant surprise."],
["2026-10-24","Cloud Security Workshop","Elena Vasquez",5,"Hands-on labs were the highlight. Our instructor walked through real incident scenarios and gave us templates we can reuse at work immediately. I'd happily pay for an advanced follow-up session."],
["2026-10-22","Leadership Roundtable","Jonathan Park",3,"Interesting conversations, though the format felt a bit unstructured. A couple of voices dominated the discussion and quieter participants never got a chance to share. A stronger moderator would make a big difference."],
["2026-10-19","Data & AI Conference","Amara Okafor",5,"Fantastic mix of technical depth and practical case studies. The talk on evaluating language model outputs was clear and immediately useful. Networking breaks were well-timed and the app made it easy to meet people."],
["2026-10-17","Data & AI Conference","Liam O'Connor",2,"The content was solid but the venue was a real problem: the main hall was freezing, the audio echoed, and Wi-Fi dropped repeatedly during demos. I struggled to follow the second half of the day."],
["2026-10-15","Design Systems Meetup","Sofia Rossi",4,"Loved the case study on scaling tokens across multiple brands. The Q&A ran long, which I enjoyed, though it pushed the lightning talks into a rushed final slot. Friendly, welcoming crowd."],
["2026-10-12","Annual Customer Conference","Daniel Kim",4,"Well-run event with a strong customer panel. Product roadmap session gave honest answers about trade-offs, which I appreciated. Registration queue was slow on day one, so arrive early next time."],
["2026-10-10","Cloud Security Workshop","Fatima Al-Sayed",5,"Exactly the right level of depth. The instructor clearly had field experience and shared war stories that made the concepts stick. Materials were shared afterwards in a tidy, searchable format."],
["2026-10-08","Startup Pitch Night","Ben Carter",3,"Energy in the room was great and a few pitches were genuinely impressive. However, the judging criteria were never explained, and the evening ran 45 minutes over so many guests left before the final presentations."],
["2026-10-05","Leadership Roundtable","Chloe Dubois",5,"A rare event where senior people spoke candidly. The facilitated small-group exercise on managing through change was practical and thoughtful. I've already scheduled coffee chats with two attendees I met."],
["2026-10-03","Annual Customer Conference","Rajesh Menon",2,"Too many sessions felt like product advertisements rather than learning opportunities. The signage was confusing and I got lost twice finding the right room. A few standout talks saved the day, but overall I expected more."],
["2026-09-30","Product Summit 2026","Hannah Schmidt",4,"Very polished production and excellent speakers. I would have liked more time for hands-on discussion and a clearer agenda posted in advance. The closing fireside chat was a perfect end to the day."],
["2026-09-27","Women in Tech Forum","Nia Johnson",5,"Inspiring, warm, and genuinely useful. The mentoring speed-rounds connected me with people I'd never have met otherwise, and the career panel was refreshingly honest about setbacks. Please make this recurring."],
["2026-09-25","Data & AI Conference","Oliver Grant",3,"Some excellent sessions, others were too introductory for a conference at this price. Better session level labeling would help attendees pick wisely. Food options were limited for dietary restrictions."],
["2026-09-22","Design Systems Meetup","Mei Lin Zhao",5,"One of the best meetups I've been to. Speakers shared real code and real failures, not just polished success stories. The venue was cozy, and the organizers made sure first-timers felt included."],
["2026-09-20","Developer Bootcamp","Tomás Herrera",4,"Intense but rewarding weekend. The mentors were patient and the project-based format helped concepts click. Pace was fast for beginners, so a short pre-reading list would help people prepare."],
["2026-09-18","Startup Pitch Night","Grace Adeyemi",4,"Well curated founders and thoughtful investor feedback. I appreciated the quick networking session at the end. Sound system needed work in the back of the room, but the overall experience was lively and fun."],
["2026-09-15","Women in Tech Forum","Isabella Moretti",5,"Warm atmosphere and brilliant speakers. The workshop on negotiating compensation gave me scripts I can use right away. Childcare support and accessible seating showed real thoughtfulness from the organizers."],
["2026-09-12","Developer Bootcamp","Noah Fischer",2,"The material was good, but the schedule was packed with no breaks, and the lab environment kept failing to start. I lost about an hour of the workshop to setup issues that should have been tested beforehand."],
["2026-09-10","Annual Customer Conference","Aisha Rahman",5,"Excellent hospitality and content. The customer success stories were authentic and the executive Q&A did not dodge difficult questions. The mobile app agenda and reminders worked flawlessly."],
["2026-09-08","Sustainability Expo","Lucas Meyer",4,"Inspiring exhibitors and a thoughtful focus on practical steps for businesses. Some booths were crowded and hard to approach, but the talks stage was excellent. Nice to see reusable cups and minimal waste."],
["2026-09-05","Sustainability Expo","Yuki Tanaka",3,"Good ideas, but the layout was confusing and the floor map was out of date. I'd have liked more measurable case studies and fewer high-level pledges. Still, I made several useful contacts."],
["2026-09-03","Leadership Roundtable","Camila Reyes",4,"A thoughtful, candid discussion with a diverse group. Facilitators kept things moving and the pre-event brief was helpful. I'd suggest sharing a short summary of key takeaways afterward so we can keep momentum."],
["2026-08-30","Developer Bootcamp","Ethan Brooks",5,"Best learning experience I've had this year. The mentors reviewed my code line by line, and by Sunday I had a working deployed app. Great community vibe and the snacks kept everyone going."],
["2026-08-28","Cloud Security Workshop","Zara Ahmed",4,"Practical, well-paced and very relevant. The threat modeling exercise was my favorite part. I would add a short session on compliance reporting, and the room could use more power outlets."],
["2026-08-25","Product Summit 2026","Victor Novak",3,"Mixed experience. A few sessions were outstanding while others felt recycled from last year. Check-in was smooth and staff were friendly, but the schedule changes were not communicated clearly."],
["2026-08-22","Sustainability Expo","Olivia Bennett",5,"A beautifully organized expo with real substance. The workshop on carbon accounting was concrete and actionable, and the exhibitors were eager to share data rather than just sell. Will definitely return."],
["2026-08-20","Startup Pitch Night","Samuel Osei",2,"Disappointing overall. The venue was too small for the number of attendees, it was hard to hear the pitches, and networking time was almost nonexistent. The concept is great, it just needs better logistics."],
["2026-08-17","Design Systems Meetup","Anika Sharma",4,"Insightful talks about accessibility in component libraries. I took lots of notes and enjoyed the live critique segment. More time for open discussion and a clearer way to share slides would make it perfect."]
].map((r,i)=>({id:i,date:r[0],event:r[1],name:r[2],rating:r[3],feedback:r[4]}));

const COLS=[
 {k:'date',t:'Date',c:'c-date'},{k:'event',t:'Event',c:'c-event'},
 {k:'name',t:'Participant',c:'c-name'},{k:'rating',t:'Rating',c:'c-rate'},{k:'feedback',t:'Feedback',c:''}
];
let sort={k:'date',dir:'desc'}, query='', minRating=0, expanded=new Set();
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const colors=['#4f46e5','#0ea5a4','#d9468f','#e07a1f','#2f7de1','#7c3aed','#12a370','#c2410c'];
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const hue=n=>colors[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length];
const star=(f)=>`<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="${f?'var(--star)':'#dfe3ee'}"/></svg>`;
const stars=n=>`<div class="stars" aria-label="${n} out of 5">${[1,2,3,4,5].map(i=>star(i<=n)).join('')}<span>${n}.0</span></div>`;

function hl(text){
  const t=esc(text); if(!query.trim()) return t;
  const words=query.trim().split(/\s+/).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return t.replace(new RegExp('('+words.join('|')+')','gi'),'<mark>$1</mark>');
}
function filtered(){
  const words=query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return DATA.filter(r=>r.rating>=minRating && words.every(w=>
    (r.event+' '+r.name+' '+r.feedback+' '+fmtDate(r.date)+' '+r.date+' '+r.rating).toLowerCase().includes(w)));
}
function sorted(rows){
  const {k,dir}=sort, m=dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{
    const x=a[k],y=b[k];
    const c=typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{sensitivity:'base'});
    return (c||a.id-b.id)*m;
  });
}
const up=a=>`<svg class="${a?'act':''}" width="10" height="6" viewBox="0 0 10 6"><path d="M5 0l5 6H0z" fill="currentColor"/></svg>`;
const dn=a=>`<svg class="${a?'act':''}" width="10" height="6" viewBox="0 0 10 6"><path d="M5 6L0 0h10z" fill="currentColor"/></svg>`;

function renderHead(){
  $('#heads').innerHTML=COLS.map(c=>{
    const on=sort.k===c.k;
    return `<th class="${c.c} ${on?'sorted':''}" aria-sort="${on?(sort.dir==='asc'?'ascending':'descending'):'none'}">
      <button data-k="${c.k}" title="Sort by ${c.t}">${c.t}<span class="ico">${up(on&&sort.dir==='asc')}${dn(on&&sort.dir==='desc')}</span></button></th>`;
  }).join('');
}
function renderRows(){
  const rows=sorted(filtered());
  $('#count').textContent=`Showing ${rows.length} of ${DATA.length} entries`;
  $('#clr').classList.toggle('on',!!query);
  $('#rows').innerHTML=rows.length?rows.map(r=>{
    const open=expanded.has(r.id), long=r.feedback.length>170;
    return `<tr>
      <td class="c-date">${fmtDate(r.date)}</td>
      <td class="c-event"><span class="tag">${hl(r.event)}</span></td>
      <td class="c-name"><div class="person"><span class="av" style="background:${hue(r.name)}">${initials(r.name)}</span>${hl(r.name)}</div></td>
      <td class="c-rate">${stars(r.rating)}</td>
      <td><div class="fb ${open?'open':''}">${hl(r.feedback)}</div>${long?`<button class="more" data-id="${r.id}">${open?'Show less':'Read more'}</button>`:''}</td>
    </tr>`}).join(''):
    `<tr><td colspan="5"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a3abc2" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8.5 11h5"/></svg><b>No matching feedback</b>Try a different keyword or clear the filters.</div></td></tr>`;
  renderAI(rows);
}
const THEMES=[['Speakers & content',/speaker|talk|keynote|content|session|case stud/i,1],['Hands-on learning',/hands-on|lab|workshop|exercise|mentor/i,1],['Networking',/network|meet|community|connect/i,1],['Venue & logistics',/venue|wi-?fi|signage|check-in|registration|room|layout|sound|audio|cold|freezing/i,-1],['Schedule & timing',/ran over|overlap|rushed|schedule|breaks|long/i,-1]];
function renderAI(rows){
  const n=rows.length;
  if(!n){ $('#aiText').innerHTML='No entries match the current filters, so there is nothing to summarize.'; $('#themes').innerHTML=''; $('#dist').innerHTML=''; renderStats(rows); return; }
  const avg=rows.reduce((a,r)=>a+r.rating,0)/n;
  const pos=rows.filter(r=>r.rating>=4).length, neg=rows.filter(r=>r.rating<=2).length;
  const byEv={}; rows.forEach(r=>(byEv[r.event]??=[]).push(r.rating));
  const evs=Object.entries(byEv).map(([e,a])=>[e,a.reduce((x,y)=>x+y,0)/a.length,a.length]).sort((a,b)=>b[1]-a[1]);
  const best=evs[0], worst=evs[evs.length-1];
  const th=THEMES.map(([l,re,s])=>[l,rows.filter(r=>re.test(r.feedback)).length,s]).filter(t=>t[1]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#aiTitle').textContent=query||minRating?'Summary of filtered feedback':'What attendees are saying';
  $('#aiText').innerHTML=`Across <b>${n} submissions</b>, sentiment is ${avg>=4?'strongly positive':avg>=3.3?'generally positive':'mixed'} with an average rating of <b>${avg.toFixed(1)} / 5</b>; <b>${Math.round(pos/n*100)}%</b> of attendees rated 4 or higher${neg?` while ${neg} gave 2 or less`:''}. `+
   `Praise centers on ${th.filter(t=>t[2]>0).slice(0,2).map(t=>t[0].toLowerCase()).join(' and ')||'the overall experience'}. `+
   (th.some(t=>t[2]<0)?`Recurring concerns involve ${th.filter(t=>t[2]<0).slice(0,2).map(t=>t[0].toLowerCase()).join(' and ')}, such as audio, Wi-Fi, session overlap and running over time. `:'')+
   (evs.length>1?`<b>${esc(best[0])}</b> is the top-rated event (${best[1].toFixed(1)}), while <b>${esc(worst[0])}</b> scores lowest (${worst[1].toFixed(1)}).`:'');
  $('#themes').innerHTML=th.map(t=>`<span class="theme ${t[2]<0?'neg':''}">${t[2]<0?'⚠':'✓'} ${t[0]} · ${t[1]}</span>`).join('');
  $('#dist').innerHTML=[5,4,3,2,1].map(s=>{const c=rows.filter(r=>r.rating===s).length;return `<div class="dist-row"><span>${s} ★</span><div class="bar"><i style="width:${c/n*100}%"></i></div><span>${c}</span></div>`}).join('');
  renderStats(rows);
}
function renderStats(rows){
  const n=rows.length, avg=n?rows.reduce((a,r)=>a+r.rating,0)/n:0;
  const ppl=new Set(rows.map(r=>r.name)).size, evs=new Set(rows.map(r=>r.event)).size;
  const promo=n?Math.round(rows.filter(r=>r.rating>=4).length/n*100):0;
  $('#stats').innerHTML=[['Submissions',n,''],['Average rating',avg.toFixed(1),' / 5'],['Satisfied (4–5★)',promo,'%'],['Events covered',evs,` · ${ppl} people`]]
    .map(s=>`<div class="stat"><div class="l">${s[0]}</div><div class="v">${s[1]}<small>${s[2]}</small></div></div>`).join('');
}

$('#chips').innerHTML=[[0,'All ratings'],[5,'5★'],[4,'4★ & up'],[3,'3★ & up']].map(([v,l])=>`<button class="chip ${v===0?'on':''}" data-v="${v}" aria-pressed="${v===0}">${l}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;minRating=+b.dataset.v;
  document.querySelectorAll('.chip').forEach(c=>{const on=c===b;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});renderRows()};
$('#heads').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
  sort=sort.k===k?{k,dir:sort.dir==='asc'?'desc':'asc'}:{k,dir:(k==='date'||k==='rating')?'desc':'asc'};renderHead();renderRows()};
$('#rows').onclick=e=>{const b=e.target.closest('.more');if(!b)return;const id=+b.dataset.id;expanded.has(id)?expanded.delete(id):expanded.add(id);renderRows()};
$('#q').oninput=e=>{query=e.target.value;renderRows()};
$('#clr').onclick=()=>{query='';$('#q').value='';renderRows();$('#q').focus()};
$('#closeAi').onclick=()=>{$('#ai').classList.add('hide');$('#showAi').classList.add('on')};
$('#showAi').onclick=()=>{$('#ai').classList.remove('hide');$('#showAi').classList.remove('on')};
renderHead();renderRows();
</script>
</body>
</html>
