<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target Clicker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,sans-serif;color:#1f2547;
background:radial-gradient(circle at 15% 20%,#ffe9f3 0,transparent 40%),radial-gradient(circle at 85% 80%,#e0f0ff 0,transparent 45%),radial-gradient(circle at 80% 15%,#fff3d6 0,transparent 35%),#f6f8ff;
user-select:none;-webkit-user-select:none}
#arena{position:absolute;inset:0;cursor:crosshair;touch-action:manipulation}
#arena::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#c9d0ee 1.5px,transparent 1.5px);background-size:32px 32px;opacity:.6;pointer-events:none}
.hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border-radius:20px;box-shadow:0 10px 30px rgba(80,90,160,.18);z-index:10;pointer-events:none}
.stat{min-width:92px;text-align:center;padding:6px 14px;border-radius:14px;background:#fff}
.stat small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8087ad;font-weight:700}
.stat b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.15}
#score b{color:#6c5ce7}#acc b{color:#00b894}#time b{color:#ff6b6b}
.bar{position:absolute;top:0;left:0;height:6px;width:100%;background:linear-gradient(90deg,#ff6b6b,#feca57,#1dd1a1,#54a0ff,#a55eea);transform-origin:left;z-index:11}
.target{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:pop .25s cubic-bezier(.3,1.6,.5,1) forwards;
background:radial-gradient(circle,var(--c) 0 18%,#fff 18% 36%,var(--c) 36% 58%,#fff 58% 78%,var(--c) 78%);
box-shadow:0 6px 18px color-mix(in srgb,var(--c) 55%,transparent);cursor:crosshair}
.target i{position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--c);opacity:.5;animation:life var(--life) linear forwards}
.target.hit{animation:hit .3s ease-out forwards;pointer-events:none}
.target.gone{animation:gone .25s ease-in forwards;pointer-events:none}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes life{from{transform:scale(1.6);opacity:.6}to{transform:scale(1);opacity:0}}
@keyframes hit{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes gone{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(0);opacity:0}}
.float{position:absolute;font-weight:800;font-size:24px;pointer-events:none;transform:translate(-50%,-50%);animation:fl .8s ease-out forwards;text-shadow:0 2px 6px #fff}
@keyframes fl{to{transform:translate(-50%,-120px);opacity:0}}
.ring{position:absolute;border-radius:50%;border:3px solid;pointer-events:none;transform:translate(-50%,-50%);animation:rg .5s ease-out forwards}
@keyframes rg{from{width:10px;height:10px;opacity:1}to{width:120px;height:120px;opacity:0}}
.miss{position:absolute;width:22px;height:22px;pointer-events:none;transform:translate(-50%,-50%);color:#ff6b6b;font-weight:900;font-size:22px;line-height:22px;text-align:center;animation:ms .5s forwards}
@keyframes ms{to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(240,243,255,.6);backdrop-filter:blur(8px);z-index:20;transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}
.card{background:#fff;border-radius:28px;padding:38px 44px;text-align:center;box-shadow:0 30px 80px rgba(80,90,160,.28);max-width:92vw;width:440px;animation:up .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(30px) scale(.94);opacity:0}}
h1{font-size:42px;letter-spacing:-.02em;background:linear-gradient(90deg,#ff6b6b,#f7b731,#20bf6b,#4b7bec,#a55eea);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:12px 0 26px;color:#6b7299;line-height:1.5}
button{font:inherit;font-weight:700;font-size:18px;color:#fff;border:0;padding:14px 38px;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#a55eea);box-shadow:0 10px 24px rgba(108,92,231,.4);transition:transform .15s}
button:hover{transform:translateY(-2px) scale(1.04)}button:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 8px}
.grid div{background:#f3f5ff;border-radius:16px;padding:14px 6px}
.grid small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8087ad;font-weight:700}
.grid b{font-size:30px}
.rank{font-size:20px;font-weight:700;margin-top:6px}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:160px;font-weight:900;color:#6c5ce7;z-index:15;pointer-events:none}
#count span{animation:cn 1s ease-out}
@keyframes cn{from{transform:scale(2);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.2}}
</style>
</head>
<body>
<div id="arena"></div>
<div class="bar" id="bar"></div>
<div class="hud">
 <div class="stat" id="score"><small>Score</small><b>0</b></div>
 <div class="stat" id="acc"><small>Accuracy</small><b>100%</b></div>
 <div class="stat" id="time"><small>Time</small><b>20</b></div>
</div>
<div id="count"><span></span></div>
<div class="overlay" id="start"><div class="card">
 <h1>Target Clicker</h1>
 <p>Targets pop up for just a moment. Click as many as you can in <b>20 seconds</b>. Smaller and faster targets are worth more!</p>
 <button id="go">Start Game</button></div></div>
<div class="overlay hidden" id="end"><div class="card">
 <h1>Time's up!</h1>
 <div class="grid">
  <div><small>Score</small><b id="fs">0</b></div>
  <div><small>Accuracy</small><b id="fa">0%</b></div>
  <div><small>Hits</small><b id="fh">0</b></div>
 </div>
 <div class="rank" id="rank"></div>
 <p id="best"></p>
 <button id="again">Play Again</button></div></div>
<script>
const $=s=>document.querySelector(s);
const arena=$('#arena'),COLORS=['#ff6b6b','#feca57','#1dd1a1','#54a0ff','#a55eea','#ff9ff3','#ff9f43','#00d2d3'];
const DURATION=20;
let running=false,score=0,hits=0,clicks=0,endAt=0,spawnT=null,raf=0,streak=0;
const AC=window.AudioContext?new AudioContext():null;
function beep(f,d=.08,type='sine',v=.08){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function updAcc(){$('#acc b').textContent=(clicks?Math.round(hits/clicks*100):100)+'%'}
function spawn(){
  if(!running)return;
  const elapsed=DURATION-(endAt-performance.now())/1000;
  const size=Math.round(46+Math.random()*44-elapsed*.8);
  const life=Math.max(650,1500-elapsed*35+Math.random()*300);
  const W=innerWidth,H=innerHeight,m=size/2+10,top=110;
  const x=m+Math.random()*(W-2*m),y=top+m+Math.random()*Math.max(10,H-top-2*m);
  const t=document.createElement('div');
  t.className='target';
  t.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;--c:${COLORS[Math.random()*COLORS.length|0]};--life:${life}ms`;
  t.dataset.pts=Math.round(10+(90-size)/3+(1500-life)/60);
  t.innerHTML='<i></i>';
  arena.appendChild(t);
  t._to=setTimeout(()=>{if(!t.classList.contains('hit')){t.classList.add('gone');streak=0;setTimeout(()=>t.remove(),260)}},life);
  spawnT=setTimeout(spawn,Math.max(260,720-elapsed*20)*(.7+Math.random()*.6));
}
function fx(x,y,txt,col){
  const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.cssText=`left:${x}px;top:${y}px;color:${col}`;arena.appendChild(f);setTimeout(()=>f.remove(),850);
  const r=document.createElement('div');r.className='ring';r.style.cssText=`left:${x}px;top:${y}px;border-color:${col}`;arena.appendChild(r);setTimeout(()=>r.remove(),550);
  for(let i=0;i<10;i++){const p=document.createElement('div'),a=Math.random()*6.28,d=40+Math.random()*50;
    p.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:8px;height:8px;border-radius:50%;background:${col};pointer-events:none`;
    arena.appendChild(p);p.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(.2)`,opacity:0}],{duration:500,easing:'ease-out'}).onfinish=()=>p.remove()}
}
arena.addEventListener('pointerdown',e=>{
  if(!running)return;
  clicks++;
  const t=e.target.closest('.target');
  if(t&&!t.classList.contains('hit')&&!t.classList.contains('gone')){
    hits++;streak++;clearTimeout(t._to);t.classList.add('hit');
    const bonus=Math.min(streak-1,10)*2,pts=+t.dataset.pts+bonus;score+=pts;
    $('#score b').textContent=score;
    fx(e.clientX,e.clientY,'+'+pts+(streak>2?' 🔥':''),getComputedStyle(t).getPropertyValue('--c'));
    beep(520+Math.min(streak,12)*40,.12,'triangle');
    setTimeout(()=>t.remove(),300);
  }else{
    streak=0;beep(150,.12,'sawtooth',.05);
    const m=document.createElement('div');m.className='miss';m.textContent='✕';m.style.cssText=`left:${e.clientX}px;top:${e.clientY}px`;arena.appendChild(m);setTimeout(()=>m.remove(),500);
  }
  updAcc();
});
function tick(){
  if(!running)return;
  const left=Math.max(0,endAt-performance.now());
  $('#time b').textContent=Math.ceil(left/1000);
  $('#bar').style.transform=`scaleX(${left/(DURATION*1000)})`;
  $('#time b').style.color=left<5000?'#e84118':'';
  if(left<=0)return finish();
  raf=requestAnimationFrame(tick);
}
function begin(){
  if(AC&&AC.state==='suspended')AC.resume();
  $('#start').classList.add('hidden');$('#end').classList.add('hidden');
  arena.querySelectorAll('.target').forEach(t=>t.remove());
  score=hits=clicks=streak=0;$('#score b').textContent=0;updAcc();$('#time b').textContent=DURATION;$('#bar').style.transform='scaleX(1)';
  const c=$('#count');c.style.display='flex';let n=3;
  const step=()=>{if(n===0){c.style.display='none';running=true;endAt=performance.now()+DURATION*1000;spawn();tick();return}
    c.firstElementChild.textContent=n;c.firstElementChild.style.animation='none';void c.offsetWidth;c.firstElementChild.style.animation='';beep(440,.1);n--;setTimeout(step,800)};
  step();
}
function finish(){
  running=false;clearTimeout(spawnT);cancelAnimationFrame(raf);
  $('#time b').textContent=0;$('#bar').style.transform='scaleX(0)';
  arena.querySelectorAll('.target').forEach(t=>{clearTimeout(t._to);t.remove()});
  const acc=clicks?Math.round(hits/clicks*100):0;
  $('#fs').textContent=score;$('#fa').textContent=acc+'%';$('#fh').textContent=hits;
  const best=Math.max(score,+localStorage.getItem('tcBest')||0);
  try{localStorage.setItem('tcBest',best)}catch(e){}
  $('#best').textContent=score>=best&&score>0?'🏆 New personal best!':'Personal best: '+best;
  $('#rank').textContent=score>=600?'🏅 Sharpshooter':score>=350?'🎯 Marksman':score>=150?'👍 Getting there':'🌱 Warming up';
  $('#end').classList.remove('hidden');beep(660,.3,'triangle');
}
$('#go').onclick=begin;$('#again').onclick=begin;
</script>
</body>
</html>
