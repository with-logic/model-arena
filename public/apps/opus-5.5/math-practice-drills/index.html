<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Practice Drills</title>
<meta name="description" content="Timed arithmetic drills with four difficulty levels and a score tracker.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECF1E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..1000,0..1,0..1&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('mpd.theme')); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --paper: #ECF1E6;
    --ink: #1C2733;
    --graphite: #56655B;
    --pen: #2547C4;
    --on-pen: #FFFFFF;
    --red: #C4302A;
    --line: rgba(28, 39, 51, .2);
    --tint: rgba(28, 39, 51, .06);
    --tint-strong: rgba(28, 39, 51, .12);
    --grid-major: rgba(46, 116, 76, .26);
    --grid-minor: rgba(46, 116, 76, .1);
    --casl: 0;
    --mono: 0;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #1D2A23;
    --ink: #ECEFE6;
    --graphite: #A7B5AB;
    --pen: #93C1FF;
    --on-pen: #10201A;
    --red: #FF8E80;
    --line: rgba(236, 239, 230, .2);
    --tint: rgba(236, 239, 230, .07);
    --tint-strong: rgba(236, 239, 230, .14);
    --grid-major: rgba(236, 239, 230, .13);
    --grid-minor: rgba(236, 239, 230, .045);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { font-variation-settings: "CASL" var(--casl), "MONO" var(--mono); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: "Recursive", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color .25s ease, color .25s ease;
  }
  [data-theme="dark"] body {
    background-image:
      radial-gradient(ellipse 60% 45% at 22% 18%, rgba(255, 255, 255, .035), transparent 70%),
      radial-gradient(ellipse 50% 40% at 82% 88%, rgba(255, 255, 255, .03), transparent 70%);
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; border-radius: 4px; }
  .sr-only {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  [hidden] { display: none !important; }
  .mono { --mono: 1; }
  kbd {
    --mono: 1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    padding: 4px 7px 5px;
    border: 1.5px solid currentColor;
    border-radius: 4px;
    opacity: .7;
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 24px);
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px clamp(16px, 4vw, 48px);
  }
  .brand {
    --casl: 1;
    margin: 0 auto 0 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.1;
  }
  .brand button { all: unset; cursor: pointer; border-radius: 4px; }
  .brand button:focus-visible { outline: 3px solid var(--pen); outline-offset: 4px; }
  .nav { display: flex; gap: 2px; }
  .nav button {
    border: 0;
    background: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 600;
    color: var(--graphite);
    text-decoration: underline;
    text-decoration-color: transparent;
    text-decoration-thickness: 3px;
    text-underline-offset: 9px;
    transition: color .15s, text-decoration-color .15s;
  }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); text-decoration-color: var(--pen); }
  .tools { display: flex; gap: 2px; }
  .icon-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: none;
    color: var(--ink);
    transition: background-color .15s;
  }
  .icon-btn:hover { background: var(--tint); }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #soundBtn[aria-pressed="false"] .on, #soundBtn[aria-pressed="true"] .off { display: none; }
  [data-theme="dark"] #themeBtn .moon, [data-theme="light"] #themeBtn .sun { display: none; }

  main {
    flex: 1;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 clamp(16px, 4vw, 48px) 56px;
    min-height: 0;
  }

  /* ---------- The squared pad ---------- */
  .pad {
    --cell: 80px;
    --pt: 1; --pb: 1; --px: 1;
    position: relative;
    width: max-content;
    padding: calc(var(--pt) * var(--cell)) calc(var(--px) * var(--cell)) calc(var(--pb) * var(--cell));
    user-select: none;
    -webkit-user-select: none;
  }
  .pad::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid-major) 0 1.5px, transparent 1.5px),
      linear-gradient(to bottom, var(--grid-major) 0 1.5px, transparent 1.5px),
      linear-gradient(to right, var(--grid-minor) 0 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-minor) 0 1px, transparent 1px);
    background-size:
      var(--cell) var(--cell), var(--cell) var(--cell),
      calc(var(--cell) / 4) calc(var(--cell) / 4), calc(var(--cell) / 4) calc(var(--cell) / 4);
    background-position: calc(var(--px) * var(--cell)) calc(var(--pt) * var(--cell));
    -webkit-mask-image:
      linear-gradient(to right, transparent, #000 calc(var(--px) * var(--cell)), #000 calc(100% - var(--px) * var(--cell)), transparent),
      linear-gradient(to bottom, transparent, #000 calc(var(--pt) * var(--cell)), #000 calc(100% - var(--pb) * var(--cell)), transparent);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent, #000 calc(var(--px) * var(--cell)), #000 calc(100% - var(--px) * var(--cell)), transparent),
      linear-gradient(to bottom, transparent, #000 calc(var(--pt) * var(--cell)), #000 calc(100% - var(--pb) * var(--cell)), transparent);
    mask-composite: intersect;
  }
  .pad .rows { position: relative; }
  .pad .row,
  .pad .fix {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    height: var(--cell);
    position: relative;
  }
  .pad .cell {
    --mono: 1;
    display: grid;
    place-items: center;
    font-size: calc(var(--cell) * .72);
    font-weight: 480;
    line-height: 1;
  }
  .pad .cell.opc { font-weight: 400; }
  .pad .answer .cell,
  .pad .fix .cell {
    --casl: 1;
    font-weight: 640;
    color: var(--pen);
    transform: rotate(var(--r, 0deg)) translateY(calc(var(--y, 0) * var(--cell)));
  }
  .pad .fix .cell { color: var(--red); }
  .pad .rule {
    position: absolute;
    left: calc((var(--px) - .14) * var(--cell));
    width: calc((var(--cols) + .28) * var(--cell));
    top: calc((var(--pt) + 2) * var(--cell));
    height: max(3px, calc(var(--cell) * .045));
    transform: translateY(-50%);
    background: var(--ink);
    border-radius: 99px;
  }
  .pad .mark {
    position: absolute;
    left: calc((var(--px) + var(--cols)) * var(--cell));
    top: calc((var(--pt) + 2) * var(--cell));
    width: var(--cell);
    height: var(--cell);
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .pad .mark svg {
    width: 62%; height: 62%;
    fill: none;
    stroke: var(--pen);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw .2s ease-out forwards, fade-out .25s .38s ease-in forwards;
  }
  .pad .fix {
    position: absolute;
    left: calc(var(--px) * var(--cell));
    top: calc((var(--pt) + 3) * var(--cell));
  }
  .pad .caret {
    align-self: end;
    width: calc(var(--cell) * .46);
    height: max(3px, calc(var(--cell) * .05));
    margin-bottom: calc(var(--cell) * .16);
    background: var(--pen);
    border-radius: 99px;
    animation: blink 1.1s steps(1) infinite;
  }
  .pad .answer.wrong::after {
    content: "";
    position: absolute;
    top: 50%;
    left: calc(var(--from, 0) * var(--cell) - var(--cell) * .08);
    right: calc(var(--cell) * -.08);
    height: max(3px, calc(var(--cell) * .05));
    margin-top: calc(var(--cell) * -.025);
    background: var(--red);
    border-radius: 99px;
    transform-origin: left center;
    animation: strike .18s ease-out both;
  }
  .pad .answer.shake { animation: shake .34s ease-in-out; }
  .pad .count {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    --casl: 1;
    --mono: 1;
    font-size: calc(var(--cell) * 2.1);
    font-weight: 800;
    line-height: 1;
    color: var(--pen);
    pointer-events: none;
  }
  .pad .count span { animation: count-in .5s var(--ease-out) both; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes strike {
    from { transform: rotate(-9deg) scaleX(0); }
    to { transform: rotate(-9deg) scaleX(1); }
  }
  @keyframes shake {
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  @keyframes count-in {
    from { opacity: 0; transform: scale(1.25); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ---------- Home ---------- */
  .home {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 500px);
    gap: clamp(32px, 6vw, 96px);
    align-items: center;
    min-height: calc(100dvh - 160px);
    padding-bottom: 24px;
  }
  .preview {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .preview-btn {
    padding: 0;
    border: 0;
    background: none;
    border-radius: 12px;
    color: inherit;
    cursor: pointer;
  }
  .preview .pad { --cell: min(104px, calc(100cqi / (var(--cols) + 2))); }
  .caption {
    margin: 0;
    font-size: 15px;
    color: var(--graphite);
    text-align: center;
  }
  .setup { display: flex; flex-direction: column; gap: 26px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend {
    padding: 0;
    margin-bottom: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--graphite);
  }
  .ops { display: flex; gap: 10px; }
  .op {
    --mono: 1;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    padding: 0;
    border: 2px solid var(--line);
    border-radius: 4px;
    background: transparent;
    font-size: 34px;
    font-weight: 450;
    line-height: 1;
    transition: background-color .12s, color .12s, border-color .12s;
  }
  .op:hover { border-color: var(--ink); }
  .op[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .op.nope { animation: shake .34s ease-in-out; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg label { position: relative; display: block; }
  .seg input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .seg span {
    display: block;
    min-width: 64px;
    padding: 12px 18px;
    border: 2px solid var(--line);
    border-radius: 4px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
    text-align: center;
    transition: background-color .12s, color .12s, border-color .12s;
  }
  .seg label:hover span { border-color: var(--ink); }
  .seg input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--pen); outline-offset: 3px; }
  .desc { margin: 10px 0 0; min-height: 1.5em; font-size: 16px; color: var(--graphite); max-width: 44ch; }
  .hint-error { color: var(--red); }
  #opsDesc:empty { margin: 0; min-height: 0; }
  .start-row { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 4px; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 18px 28px;
    border: 0;
    border-radius: 6px;
    background: var(--pen);
    color: var(--on-pen);
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    transition: transform .1s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:focus-visible { outline-offset: 4px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: transparent;
    font-size: 18px;
    font-weight: 650;
    line-height: 1.2;
    transition: border-color .15s;
  }
  .btn:hover { border-color: var(--ink); }
  .best-line { margin: 0; font-size: 16px; color: var(--graphite); }
  .best-line b { color: var(--ink); font-weight: 700; }
  .checks { display: flex; flex-direction: column; gap: 10px; }
  .check { display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer; width: fit-content; }
  .check input {
    appearance: none; -webkit-appearance: none;
    width: 24px; height: 24px; margin: 0;
    border: 2px solid var(--line);
    border-radius: 4px;
    display: grid; place-items: center;
    flex: none;
    cursor: pointer;
    transition: background-color .12s, border-color .12s;
  }
  .check input::after {
    content: "";
    width: 11px; height: 6px;
    border: solid var(--paper);
    border-width: 0 0 2.5px 2.5px;
    transform: translateY(-2px) rotate(-45deg) scale(0);
    transition: transform .12s;
  }
  .check input:checked { background: var(--ink); border-color: var(--ink); }
  .check input:checked::after { transform: translateY(-2px) rotate(-45deg) scale(1); }
  .check:hover input { border-color: var(--ink); }

  /* ---------- Drill ---------- */
  body[data-view="drill"] { height: 100vh; height: 100dvh; overflow: hidden; }
  body[data-view="drill"] .nav { display: none; }
  body[data-view="drill"] main { display: flex; flex-direction: column; padding-bottom: 16px; }
  #view-drill { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .hud {
    display: grid;
    grid-template-columns: auto minmax(80px, 1fr) auto auto;
    grid-template-areas: "clock bar tally btns";
    align-items: center;
    gap: 10px 28px;
    padding: 4px 0 8px;
  }
  .clock-wrap { grid-area: clock; position: relative; }
  .clock {
    --mono: 1;
    display: block;
    min-width: 4.4ch;
    font-size: clamp(32px, 4vw, 44px);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color .2s;
  }
  .hud.low .clock { color: var(--red); }
  .float {
    --mono: 1;
    position: absolute;
    left: 100%;
    top: -6px;
    margin-left: 8px;
    font-size: 18px;
    font-weight: 700;
    color: var(--pen);
    white-space: nowrap;
    pointer-events: none;
    animation: float-up .9s var(--ease-out) forwards;
  }
  .float.minus { color: var(--red); }
  @keyframes float-up {
    from { opacity: 0; transform: translateY(8px); }
    25% { opacity: 1; }
    to { opacity: 0; transform: translateY(-16px); }
  }
  .bar { grid-area: bar; height: 6px; background: var(--tint-strong); border-radius: 99px; overflow: hidden; }
  .bar span {
    display: block;
    height: 100%;
    background: var(--ink);
    border-radius: 99px;
    transform-origin: left center;
    transform: scaleX(1);
  }
  .hud.low .bar span { background: var(--red); }
  .tally { grid-area: tally; display: flex; gap: 22px; font-size: 16px; color: var(--graphite); white-space: nowrap; }
  .tally b {
    --mono: 1;
    display: inline-block;
    margin-right: 5px;
    font-size: 24px;
    font-weight: 650;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .tally b.bump { animation: bump .25s var(--ease-out); }
  @keyframes bump { 40% { transform: scale(1.25); } }
  .hud-btns { grid-area: btns; display: flex; gap: 6px; }
  .hud-btn {
    height: 44px;
    min-width: 44px;
    padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: transparent;
    font-size: 16px;
    font-weight: 650;
  }
  .hud-btn:hover { border-color: var(--ink); }
  .hud-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  .stage .pad { --pt: .7; --pb: 1; }
  .stage.paused .rows, .stage.paused .fix, .stage.paused .rule, .stage.paused .mark { visibility: hidden; }
  .veil {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    border: 0;
    background: none;
    width: 100%;
  }
  .veil strong { --casl: 1; font-size: clamp(40px, 7vw, 64px); font-weight: 800; line-height: 1; }
  .veil span { color: var(--graphite); font-size: 17px; }
  .drill-hint {
    margin: 0 0 6px;
    text-align: center;
    font-size: 15px;
    color: var(--graphite);
  }
  .drill-hint kbd { margin: 0 2px; }
  .skip {
    border: 0;
    background: none;
    padding: 6px 10px;
    border-radius: 6px;
    color: var(--graphite);
    font-size: 15px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
  }
  .skip:hover { color: var(--ink); }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-areas:
      "k7 k8 k9 del"
      "k4 k5 k6 neg"
      "k1 k2 k3 ent"
      "k0 k0 k0 ent";
    gap: 8px;
    width: 100%;
    max-width: 440px;
    margin: 4px auto 0;
    padding-bottom: env(safe-area-inset-bottom);
    touch-action: manipulation;
  }
  .keypad button {
    --mono: 1;
    height: clamp(50px, 7.5vh, 68px);
    border: 2px solid var(--line);
    border-radius: 6px;
    background: transparent;
    font-size: 28px;
    font-weight: 550;
    line-height: 1;
    display: grid; place-items: center;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .08s, border-color .08s;
  }
  .keypad button.down { background: var(--tint-strong); border-color: var(--ink); }
  .keypad .k-ent {
    grid-area: ent;
    height: auto;
    --mono: 0;
    background: var(--pen);
    color: var(--on-pen);
    border-color: var(--pen);
    font-size: 20px;
    font-weight: 700;
  }
  .keypad .k-ent.down { background: var(--pen); filter: brightness(1.15); }
  .keypad svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }

  /* ---------- Results ---------- */
  .results { max-width: 1020px; margin: 0 auto; padding-top: 4px; }
  .res-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px 48px;
    align-items: start;
  }
  .res-title { margin: 0; font-size: 30px; font-weight: 750; line-height: 1.2; letter-spacing: -.005em; }
  .res-title:focus { outline: none; }
  .res-sub { margin: 4px 0 0; color: var(--graphite); font-size: 17px; }
  .res-actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .res-actions .btn-primary, .res-actions .btn { justify-content: space-between; }
  .score {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 6px 22px;
    margin: 30px 0 10px;
  }
  .score .num {
    --casl: 1;
    position: relative;
    display: inline-block;
    padding: 0 .22em;
    font-size: clamp(92px, 15vw, 168px);

  /* ---------- Responsive ---------- */

<body data-view="home">
  <header class="top">
    <h1 class="brand"><button type="button" data-nav="home">Math Practice Drills</button></h1>
    <nav class="nav" aria-label="Main">
      <button type="button" data-nav="home" aria-current="page">Practice</button>
      <button type="button" data-nav="progress">Progress</button>
    </nav>
    <div class="tools">
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><g class="on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
      </button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></g></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Home / setup -->
    <section id="view-home" aria-label="Set up a drill">
      <div class="home">
        <div class="preview">
          <button type="button" class="preview-btn" id="previewBtn" aria-label="Show another example problem"></button>
          <p class="caption" id="previewCaption">An example problem. Click it for another.</p>
        </div>

        <form class="setup" id="setup" novalidate>
          <fieldset>
            <legend>Operations</legend>
            <div class="ops" id="ops">
              <button type="button" class="op" data-op="add" aria-pressed="true" aria-label="Addition">+</button>
              <button type="button" class="op" data-op="sub" aria-pressed="true" aria-label="Subtraction">−</button>

          <fieldset>
            <legend>Difficulty</legend>
            <div class="seg" id="levelSeg"></div>
            <p class="desc" id="levelDesc"></p>
          </fieldset>

          <fieldset>
            <legend>Drill</legend>
            <div class="seg" id="modeSeg"></div>
            <p class="desc" id="modeDesc"></p>

        </form>
      </div>
    </section>

    <!-- Drill -->
    <section id="view-drill" aria-label="Drill" hidden>
      <div class="hud" id="hud">
        <div class="clock-wrap" id="clockWrap"><span class="clock" id="clock" role="timer" aria-live="off">1:00</span></div>
        <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
        <div class="tally" id="tally"></div>
        <div class="hud-btns">
          <button type="button" class="hud-btn" id="pauseBtn" aria-label="Pause" title="Pause (Space)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>

        <button type="button" tabindex="-1" data-k="9" style="grid-area:k9">9</button>
        <button type="button" tabindex="-1" data-k="Backspace" style="grid-area:del" aria-label="Delete"><svg viewBox="0 0 28 28"><path d="M10 7h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-7-7z"/><path d="M13.5 11l6 6M19.5 11l-6 6"/></svg></button>
        <button type="button" tabindex="-1" data-k="4" style="grid-area:k4">4</button>
        <button type="button" tabindex="-1" data-k="5" style="grid-area:k5">5</button>

      <button type="button" class="btn-primary btn-danger" id="clearConfirm">Clear history</button>
    </div>
  </dialog>

  <noscript><p style="padding:24px;font-size:20px">Math Practice Drills needs JavaScript to run.</p></noscript>

<script>
(() => {
  'use strict';

  /* ================= Constants ================= */
  const OP_ORDER = ['add', 'sub', 'mul', 'div'];
  const SYM = { add: '+', sub: '−', mul: '×', div: '÷' };
  const WORD = { add: 'plus', sub: 'minus', mul: 'times', div: 'divided by' };
  const OP_NAME = { add: 'Addition', sub: 'Subtraction', mul: 'Multiplication', div: 'Division' };

  const LEVELS = {
    easy: { label: 'Easy', desc: 'Numbers up to 10. Times tables up to 5.', cols: 3 },
    medium: { label: 'Medium', desc: 'Two-digit sums and differences. Times tables up to 12.', cols: 3 },
    hard: { label: 'Hard', desc: 'Three-digit sums and differences. Two-digit times one-digit.', cols: 4 },
    expert: { label: 'Expert', desc: 'Four-digit sums, negative answers, two-digit times two-digit.', cols: 5 },
  };
  const MODES = {
    sprint: { label: 'Sprint', desc: 'Answer as many as you can before time runs out.' },
    race: { label: 'Race', desc: 'Get a set number right as fast as you can. Misses don’t count toward it.' },
    survival: { label: 'Survival', desc: 'Start with 20 seconds. Right answers add time, misses take 3 seconds away. Bonuses shrink as you go.' },
  };
  const SPRINT_LENGTHS = [30, 60, 120, 300];
  const RACE_LENGTHS = [10, 20, 50];
  const SURVIVAL = { start: 20000, miss: 3000, cap: 60000, barMax: 30000 };
  const survivalBonus = (correct) => Math.max(1000, 3000 - Math.floor(correct / 10) * 500);
  const WRONG_HOLD_MS = 1300;

  /* ================= Helpers ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } },
  };
  const R = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const swap = (x, y) => (Math.random() < 0.5 ? [x, y] : [y, x]);
  const fmtNum = (n) => (n < 0 ? '−' : '') + Math.abs(n);
  const secs = (ms, d = 1) => (ms / 1000).toFixed(d);
  const pct = (x) => Math.round(x * 100);
  const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const pad2 = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const live = (msg) => { const el = $('#live'); el.textContent = ''; requestAnimationFrame(() => { el.textContent = msg; }); };

  /* ================= Settings ================= */
  const DEFAULTS = { ops: ['add', 'sub', 'mul', 'div'], level: 'medium', mode: 'sprint', sprint: 60, race: 20, auto: true, keypad: isCoarse, sound: true };
  const S = Object.assign({}, DEFAULTS, store.get('mpd.settings', {}));
  if (!Array.isArray(S.ops)) S.ops = DEFAULTS.ops.slice();
  S.ops = OP_ORDER.filter((o) => S.ops.includes(o));
  if (!S.ops.length) S.ops = DEFAULTS.ops.slice();
  if (!LEVELS[S.level]) S.level = DEFAULTS.level;
  if (!MODES[S.mode]) S.mode = DEFAULTS.mode;
  if (!SPRINT_LENGTHS.includes(S.sprint)) S.sprint = DEFAULTS.sprint;
  if (!RACE_LENGTHS.includes(S.race)) S.race = DEFAULTS.race;
  const saveSettings = () => store.set('mpd.settings', S);

  /* ================= Sound ================= */
  const Sound = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(freq, dur, { type = 'sine', gain = 0.05, when = 0, to } = {}) {
      if (!S.sound || !this.ctx) return;
      const t = this.ctx.currentTime + when;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    },
    right() { this.tone(880, 0.09, { to: 1320, gain: 0.045 }); },
    wrong() { this.tone(210, 0.24, { type: 'triangle', to: 150, gain: 0.07 }); },
    tick() { this.tone(620, 0.07, { gain: 0.04 }); },
    go() { this.tone(940, 0.14, { gain: 0.05 }); },
    done() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.18, { gain: 0.04, when: i * 0.085 })); },
  };

  /* ================= Problems ================= */
  const GEN = {
    easy: {
      add: () => [R(1, 10), R(1, 10)],
      sub: () => { const x = R(1, 10), y = R(1, 10); return [x + y, y]; },
      mul: () => swap(R(2, 10), R(2, 5)),
      div: () => { const q = R(1, 10), d = R(2, 5); return [q * d, d]; },
    },
    medium: {
      add: () => [R(10, 99), R(10, 99)],
      sub: () => { const a = R(20, 99); return [a, R(10, a - 1)]; },
      mul: () => [R(2, 12), R(2, 12)],
      div: () => { const q = R(2, 12), d = R(2, 12); return [q * d, d]; },
    },
    hard: {
      add: () => [R(100, 999), R(100, 999)],
      sub: () => { const a = R(200, 999); return [a, R(100, a - 1)]; },
      mul: () => swap(R(12, 99), R(3, 9)),
      div: () => { const q = R(12, 99), d = R(3, 9); return [q * d, d]; },
    },
    expert: {
      add: () => [R(1000, 9999), R(1000, 9999)],
      sub: () => [R(1000, 9999), R(1000, 9999)],
      mul: () => [R(11, 99), R(11, 99)],
      div: () => { const q = R(11, 99), d = R(11, 25); return [q * d, d]; },
    },
  };
  const solve = (a, op, b) => (op === 'add' ? a + b : op === 'sub' ? a - b : op === 'mul' ? a * b : a / b);
  function makeProblem(level, ops, recent = []) {
    let p;
    for (let i = 0; i < 40; i++) {
      const op = ops[R(0, ops.length - 1)];
      const [a, b] = GEN[level][op]();
      const key = `${a}${op}${b}`;
      p = { a, b, op, ans: solve(a, op, b), key };
      if (!recent.includes(key)) break;
    }
    return p;
  }
  const colsFor = (p, level) => Math.max(LEVELS[level].cols, fmtNum(p.a).length, fmtNum(p.b).length + 1, fmtNum(p.ans).length);
  const problemText = (p) => `${fmtNum(p.a)} ${SYM[p.op]} ${fmtNum(p.b)}`;
  const problemSpeech = (p) => `${p.a} ${WORD[p.op]} ${p.b}`;

  /* ================= Pad rendering ================= */
  function cellsHTML(str, cols, { opChar = '', jitter = null } = {}) {
    const ch = [...str];
    const offset = cols - ch.length;
    let out = '';
    for (let i = 0; i < cols; i++) {
      const idx = i - offset;
      let c = idx >= 0 ? ch[idx] : '';
      let cls = 'cell';
      if (i === 0 && opChar && idx < 0) { c = opChar; cls += ' opc'; }
      let style = '';
      if (jitter && idx >= 0 && jitter[idx]) style = ` style="--r:${jitter[idx][0]}deg;--y:${jitter[idx][1]}"`;
      out += `<span class="${cls}"${style}>${c}</span>`;
    }
    return out;
  }
  function createPad(cols) {
    const el = document.createElement('div');
    el.className = 'pad';
    el.setAttribute('aria-hidden', 'true');
    el.style.setProperty('--cols', cols);
    el.innerHTML = '<div class="rows"><div class="row r1"></div><div class="row r2"></div><div class="row answer"></div></div><div class="rule"></div><div class="mark"></div><div class="fix"></div>';
    return el;
  }
  function padSetProblem(pad, p, cols) {
    pad.style.setProperty('--cols', cols);
    $('.r1', pad).innerHTML = p ? cellsHTML(fmtNum(p.a), cols) : cellsHTML('', cols);
    $('.r2', pad).innerHTML = p ? cellsHTML(fmtNum(p.b), cols, { opChar: SYM[p.op] }) : cellsHTML('', cols);
    const ans = $('.answer', pad);
    ans.classList.remove('wrong', 'shake');
    $('.fix', pad).innerHTML = '';
  }
  function padSetAnswer(pad, str, cols, { caret = true, jitter = null } = {}) {
    const shown = str.replace('-', '−');
    const row = $('.answer', pad);
    let html = cellsHTML(shown, cols, { jitter });
    if (!shown && caret) {
      html = cellsHTML('', cols - 1) + '<span class="cell"><i class="caret"></i></span>';
    }
    row.innerHTML = html;
  }
  const makeJitter = (n) => Array.from({ length: n }, () => [(Math.random() * 6 - 3).toFixed(1), (Math.random() * 0.05 - 0.025).toFixed(3)]);

  /* ================= History ================= */
  const loadHistory = () => { const h = store.get('mpd.history', []); return Array.isArray(h) ? h : []; };
  const saveHistory = (h) => store.set('mpd.history', h.slice(-1500));
  const lenFor = (mode, s = S) => (mode === 'sprint' ? s.sprint : mode === 'race' ? s.race : 0);
  const configKey = (mode, level, ops, len) => `${mode}|${level}|${OP_ORDER.filter((o) => ops.includes(o)).join(',')}|${len}`;
  const currentKey = () => configKey(S.mode, S.level, S.ops, lenFor(S.mode));
  const better = (mode, a, b) => (mode === 'race' ? a < b : a > b);
  function drillTitle(mode, len) {
    if (mode === 'sprint') return ({ 30: '30-second', 60: '1-minute', 120: '2-minute', 300: '5-minute' }[len] || `${len}-second`) + ' sprint';
    if (mode === 'race') return `Race to ${len}`;
    return 'Survival';
  }
  const drillSub = (level, ops) => `${LEVELS[level].label}, ${OP_ORDER.filter((o) => ops.includes(o)).map((o) => SYM[o]).join(' ')}`;
  const scoreText = (rec) => (rec.mode === 'race' ? `${secs(rec.score)} s` : `${rec.score} right`);
  function bestFor(key, hist = loadHistory()) {
    let best = null;
    for (const r of hist) if (r.key === key && (!best || better(r.mode, r.score, best.score))) best = r;
    return best;
  }
  const shortDate = (ts) => new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
  function dateLabel(ts) {
    const d = new Date(ts);
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const today = new Date();
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    if (dayKey(d) === dayKey(today)) return `Today, ${time}`;
    if (dayKey(d) === dayKey(yest)) return `Yesterday, ${time}`;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
  }
  function streakInfo(hist) {
    const days = new Set(hist.map((r) => dayKey(new Date(r.ts))));
    const d = new Date();
    const today = days.has(dayKey(d));
    if (!today) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return { n, today, days };
  }
  function humanDuration(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return plural(s, 'second');
    const m = Math.round(s / 60);
    if (m < 60) return plural(m, 'minute');
    const h = Math.floor(m / 60), mm = m % 60;
    return plural(h, 'hour') + (mm ? ` ${plural(mm, 'minute')}` : '');
  }

  /* ================= Views ================= */
  let view = 'home';
  function show(v) {
    view = v;
    document.body.dataset.view = v;
    for (const id of ['home', 'drill', 'results', 'progress']) $('#view-' + id).hidden = id !== v;
    const navTarget = v === 'progress' ? 'progress' : 'home';
    $$('.nav [data-nav]').forEach((b) => {
      if (b.dataset.nav === navTarget) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const hash = v === 'progress' ? '#progress' : '';
    if (location.hash !== hash) history.replaceState(null, '', hash || location.pathname + location.search);
    window.scrollTo(0, 0);
  }
  $$('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    if (view === 'drill') return;
    if (b.dataset.nav === 'progress') { show('progress'); renderProgress(); $('.pg-title')?.focus(); }
    else { show('home'); refreshHome(); }
  }));

  /* ================= Theme & sound toggles ================= */
  const themeBtn = $('#themeBtn');
  function applyThemeMeta() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to paper theme' : 'Switch to chalkboard theme');
    themeBtn.title = dark ? 'Paper theme' : 'Chalkboard theme';
    $('meta[name="theme-color"]').setAttribute('content', dark ? '#1D2A23' : '#ECF1E6');
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('mpd.theme', next);
    applyThemeMeta();
    if (view === 'results' && lastResult) drawResultChart();
    if (view === 'progress') drawTrend();
  });
  applyThemeMeta();
  const soundBtn = $('#soundBtn');
  const applySound = () => {
    soundBtn.setAttribute('aria-pressed', String(S.sound));
    soundBtn.title = S.sound ? 'Sound on' : 'Sound off';
  };
  soundBtn.addEventListener('click', () => {
    S.sound = !S.sound;
    saveSettings();
    applySound();
    if (S.sound) { Sound.init(); Sound.right(); }
  });
  applySound();

  /* ================= Home ================= */
  const previewBtn = $('#previewBtn');
  const previewPad = createPad(LEVELS[S.level].cols);
  previewBtn.appendChild(previewPad);
  let previewTimers = [];

  function segHTML(name, items, current) {
    return items.map(([value, label]) => `<label><input type="radio" name="${name}" value="${value}"${String(value) === String(current) ? ' checked' : ''}><span>${label}</span></label>`).join('');
  }
  function renderSetup() {
    $$('#ops .op').forEach((b) => b.setAttribute('aria-pressed', String(S.ops.includes(b.dataset.op))));
    $('#levelSeg').innerHTML = segHTML('level', Object.entries(LEVELS).map(([k, v]) => [k, v.label]), S.level);
    $('#modeSeg').innerHTML = segHTML('mode', Object.entries(MODES).map(([k, v]) => [k, v.label]), S.mode);
    $('#optAuto').checked = !!S.auto;
    $('#optPad').checked = !!S.keypad;
    renderModeDependent();
    $('#levelDesc').textContent = LEVELS[S.level].desc;
  }
  function renderModeDependent() {
    $('#modeDesc').textContent = MODES[S.mode].desc;
    const field = $('#lengthField');
    if (S.mode === 'survival') { field.hidden = true; return; }
    field.hidden = false;
    if (S.mode === 'sprint') {
      $('#lengthLegend').textContent = 'Time limit';
      $('#lengthSeg').innerHTML = segHTML('len', SPRINT_LENGTHS.map((s) => [s, s < 60 ? `${s} sec` : `${s / 60} min`]), S.sprint);
    } else {
      $('#lengthLegend').textContent = 'Problems to get right';
      $('#lengthSeg').innerHTML = segHTML('len', RACE_LENGTHS.map((n) => [n, String(n)]), S.race);
    }
  }
  function refreshBestLine() {
    const hist = loadHistory();
    const best = bestFor(currentKey(), hist);
    const st = streakInfo(hist);
    let html = best
      ? `Your best on this drill: <b>${scoreText(best)}</b>, set ${shortDate(best.ts)}.`
      : 'No score on this drill yet.';
    if (st.n >= 2) html += ` You’re on a <b>${st.n}-day</b> streak.`;
    $('#bestLine').innerHTML = html;
  }
  function refreshPreview() {
    previewTimers.forEach(clearTimeout);
    previewTimers = [];
    const p = makeProblem(S.level, S.ops);
    const cols = colsFor(p, S.level);
    padSetProblem(previewPad, p, cols);
    padSetAnswer(previewPad, '', cols, { caret: true });
    $('#previewCaption').textContent = `An example ${LEVELS[S.level].label.toLowerCase()} problem. ${isCoarse ? 'Tap' : 'Click'} it for another.`;
    previewBtn.setAttribute('aria-label', `Example problem: ${problemSpeech(p)} equals ${p.ans}. Show another.`);
    const ans = String(p.ans);
    const jitter = makeJitter(ans.length);
    if (reduceMotion()) { padSetAnswer(previewPad, ans, cols, { jitter }); return; }
    for (let i = 1; i <= ans.length; i++) {
      previewTimers.push(setTimeout(() => padSetAnswer(previewPad, ans.slice(0, i), cols, { jitter }), 420 + i * 170));
    }
  }
  function refreshHome() { refreshBestLine(); }

  $('#ops').addEventListener('click', (e) => {
    const b = e.target.closest('.op');
    if (!b) return;
    const op = b.dataset.op;
    const desc = $('#opsDesc');
    if (S.ops.includes(op)) {
      if (S.ops.length === 1) {
        b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
        desc.textContent = 'Keep at least one operation selected.';
        desc.classList.add('hint-error');
        return;
      }
      S.ops = S.ops.filter((o) => o !== op);
    } else {
      S.ops = OP_ORDER.filter((o) => o === op || S.ops.includes(o));
    }
    desc.textContent = '';
    desc.classList.remove('hint-error');
    b.setAttribute('aria-pressed', String(S.ops.includes(op)));
    saveSettings();
    refreshPreview();
    refreshBestLine();
  });
  $('#setup').addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'level') { S.level = t.value; $('#levelDesc').textContent = LEVELS[S.level].desc; refreshPreview(); }
    else if (t.name === 'mode') { S.mode = t.value; renderModeDependent(); }
    else if (t.name === 'len') { if (S.mode === 'sprint') S.sprint = Number(t.value); else S.race = Number(t.value); }
    else if (t.id === 'optAuto') S.auto = t.checked;
    else if (t.id === 'optPad') S.keypad = t.checked;
    saveSettings();
    refreshBestLine();
  });
  $('#setup').addEventListener('submit', (e) => { e.preventDefault(); startDrill(); });
  previewBtn.addEventListener('click', refreshPreview);

  /* ================= Drill engine ================= */
  const stage = $('#stage');
  const holder = $('#drillHolder');
  const clockEl = $('#clock');
  const barFill = $('#barFill');
  const hud = $('#hud');
  const keypad = $('#keypad');
  let D = null;
  let drillPad = null;

  function startDrill() {
    Sound.init();
    if (D) cleanupDrill();
    const ops = S.ops.slice();
    D = {
      mode: S.mode,
      level: S.level,
      ops,
      len: lenFor(S.mode),
      key: currentKey(),
      auto: S.auto,
      cols: LEVELS[S.level].cols,
      limit: S.sprint * 1000,
      target: S.race,
      bank: SURVIVAL.start,
      recent: [],
      log: [],
      input: '',
      jitter: makeJitter(8),
      correct: 0,
      wrong: 0,
      streak: 0,
      bestStreak: 0,
      phase: 'countdown',
      paused: false,
      pausedTotal: 0,
      pauseAt: 0,
      startAt: 0,
      pStart: 0,
      p: null,
      hold: null,
      raf: 0,
      timers: [],
      lastLabel: '',
    };
    holder.innerHTML = '';
    drillPad = createPad(D.cols);
    holder.appendChild(drillPad);
    $('#veil').hidden = true;
    stage.classList.remove('paused');
    hud.classList.remove('low');
    keypad.hidden = !S.keypad;
    $('#drillHint').hidden = S.keypad && isCoarse;
    buildTally();
    updateTally();
    barFill.style.transform = D.mode === 'race' ? 'scaleX(0)' : 'scaleX(1)';
    clockEl.textContent = D.mode === 'race' ? '0:00.0' : clockDown(D.mode === 'sprint' ? D.limit : D.bank);
    show('drill');
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    fitDrill();
    countdown();
  }

  function cleanupDrill() {
    if (!D) return;
    cancelAnimationFrame(D.raf);
    clearTimeout(D.hold);
    D.timers.forEach(clearTimeout);
  }

  function fitDrill() {
    if (!D || !drillPad) return;
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const cell = Math.max(34, Math.floor(Math.min(118, r.width / (D.cols + 2), r.height / 4.7)));
    drillPad.style.setProperty('--cell', cell + 'px');
  }
  new ResizeObserver(() => fitDrill()).observe(stage);

  function buildTally() {
    const first = D.mode === 'race'
      ? `<span><b id="tRight">0</b>of ${D.target}</span>`
      : `<span><b id="tRight">0</b>right</span>`;
    $('#tally').innerHTML = `${first}<span><b id="tMiss">0</b>missed</span><span class="streak">streak <b id="tStreak" style="margin:0 0 0 5px">0</b></span>`;
  }
  function updateTally(bump) {
    const r = $('#tRight'), m = $('#tMiss'), s = $('#tStreak');
    r.textContent = D.correct;
    m.textContent = D.wrong;
    s.textContent = D.streak;
    if (bump) { bump.classList.remove('bump'); void bump.offsetWidth; bump.classList.add('bump'); }
  }

  function countdown() {
    D.phase = 'countdown';
    padSetProblem(drillPad, null, D.cols);
    padSetAnswer(drillPad, '', D.cols, { caret: false });
    const c = document.createElement('div');
    c.className = 'count';
    drillPad.appendChild(c);
    let n = 3;
    live('Get ready.');
    const step = () => {
      if (!D || D.phase !== 'countdown') return;
      if (n === 0) { c.remove(); begin(); return; }
      c.innerHTML = `<span>${n}</span>`;
      Sound.tick();
      n--;
      D.timers.push(setTimeout(step, 620));
    };
    step();
  }

  function begin() {
    D.phase = 'run';
    D.startAt = performance.now();
    Sound.go();
    nextProblem();
    D.raf = requestAnimationFrame(tick);
  }

  const now = () => performance.now();
  const elapsed = (t = now()) => (D.paused ? D.pauseAt : t) - D.startAt - D.pausedTotal;
  function clockDown(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
  }
  function clockUp(ms) {
    const t = Math.max(0, Math.floor(ms / 100));
    const s = Math.floor(t / 10);
    return `${Math.floor(s / 60)}:${pad2(s % 60)}.${t % 10}`;
  }

  function tick() {
    if (!D || D.phase !== 'run') return;
    D.raf = requestAnimationFrame(tick);
    if (D.paused) return;
    const t = elapsed();
    let remain = Infinity, frac, label;
    if (D.mode === 'sprint') {
      remain = D.limit - t; frac = remain / D.limit; label = clockDown(remain);
    } else if (D.mode === 'survival') {
      remain = D.bank - t; frac = remain / SURVIVAL.barMax; label = clockDown(remain);
    } else {
      frac = D.correct / D.target; label = clockUp(t);
    }
    if (label !== D.lastLabel) { clockEl.textContent = label; D.lastLabel = label; }
    barFill.style.transform = `scaleX(${Math.min(1, Math.max(0, frac)).toFixed(4)})`;
    hud.classList.toggle('low', remain <= 5000);
    if (remain <= 0) finish('time');
  }

  function nextProblem() {
    const p = makeProblem(D.level, D.ops, D.recent);
    D.recent.push(p.key);
    if (D.recent.length > 12) D.recent.shift();
    const need = colsFor(p, D.level);
    if (need > D.cols) { D.cols = need; fitDrill(); }
    D.p = p;
    D.input = '';
    D.jitter = makeJitter(8);
    padSetProblem(drillPad, p, D.cols);
    padSetAnswer(drillPad, '', D.cols);
    D.pStart = now();
    live(problemSpeech(p));
  }

  function renderInput() {
    padSetAnswer(drillPad, D.input, D.cols, { jitter: D.jitter });
  }

  function press(k) {
    if (!D || D.phase !== 'run' || D.paused) return;
    if (D.hold) {
      if (k === 'Backspace') return;
      endHold();
      if (k === 'Enter') return;
    }
    if (/^\d$/.test(k)) {
      if (D.input.length >= D.cols) return;
      D.input += k;
    } else if (k === '-') {
      if (D.input.startsWith('-')) D.input = D.input.slice(1);
      else if (D.input.length < D.cols) D.input = '-' + D.input;
    } else if (k === 'Backspace') {
      D.input = D.input.slice(0, -1);
    } else if (k === 'Enter') {
      submit();
      return;
    } else return;
    renderInput();
    if (D.auto && D.input === String(D.p.ans)) submit();
  }

  function submit(skipped = false) {
    if (!D || D.phase !== 'run' || D.paused || D.hold) return;
    const raw = D.input;
    if (!skipped && (raw === '' || raw === '-')) return;
    const t = now();
    const given = skipped ? null : Number(raw);
    const ok = !skipped && given === D.p.ans;
    const p = D.p;
    D.log.push({ a: p.a, b: p.b, op: p.op, ans: p.ans, given, ok, ms: t - D.pStart, skipped });
    if (ok) {
      D.correct++;
      D.streak++;
      D.bestStreak = Math.max(D.bestStreak, D.streak);
      Sound.right();
      flashCheck();
      if (D.mode === 'survival') {
        const el = elapsed(t);
        const bonus = survivalBonus(D.correct - 1);
        const before = D.bank;
        D.bank = Math.min(D.bank + bonus, el + SURVIVAL.cap);
        const gained = D.bank - before;
        if (gained > 0) floatNote(`+${secs(gained, gained % 1000 ? 1 : 0)}s`);
      }
      updateTally($('#tRight'));
      if (D.mode === 'race' && D.correct >= D.target) { finish('done'); return; }
      nextProblem();
    } else {
      D.wrong++;
      D.streak = 0;
      Sound.wrong();
      if (D.mode === 'survival') { D.bank -= SURVIVAL.miss; floatNote(`−${SURVIVAL.miss / 1000}s`, true); }
      updateTally($('#tMiss'));
      showCorrection(p, raw);
      live(`${skipped ? 'Skipped' : 'Not quite'}. ${problemSpeech(p)} is ${p.ans}.`);
      D.hold = setTimeout(endHold, WRONG_HOLD_MS);
    }
  }

  function flashCheck() {
    const mark = $('.mark', drillPad);
    mark.innerHTML = '<svg viewBox="0 0 32 32"><path pathLength="1" d="M6 17.5 L13 24.5 L26.5 8"/></svg>';
    clearTimeout(D.markTimer);
    D.markTimer = setTimeout(() => { if (mark.isConnected) mark.innerHTML = ''; }, 650);
  }
  function showCorrection(p, raw) {
    $('.mark', drillPad).innerHTML = '';
    const row = $('.answer', drillPad);
    if (raw && raw !== '-') {
      row.style.setProperty('--from', D.cols - raw.length);
      row.classList.add('wrong');
    }
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    $('.fix', drillPad).innerHTML = cellsHTML(fmtNum(p.ans), D.cols, { jitter: makeJitter(6) });
  }
  function endHold() {
    if (!D || !D.hold) return;
    clearTimeout(D.hold);
    D.hold = null;
    if (D.phase === 'run') nextProblem();
  }
  function floatNote(text, minus) {
    const f = document.createElement('span');
    f.className = 'float' + (minus ? ' minus' : '');
    f.textContent = text;
    $('#clockWrap').appendChild(f);
    setTimeout(() => f.remove(), 950);
  }

  function togglePause() {
    if (!D || D.phase !== 'run') return;
    const t = now();
    if (!D.paused) {
      D.paused = true;
      D.pauseAt = t;
      D.heldWhenPaused = !!D.hold;
      if (D.hold) { clearTimeout(D.hold); }
      stage.classList.add('paused');
      $('#veil').hidden = false;
      $('#pauseBtn').setAttribute('aria-label', 'Resume');
      live('Paused.');
    } else {
      const dur = t - D.pauseAt;
      D.pausedTotal += dur;
      D.pStart += dur;
      D.paused = false;
      stage.classList.remove('paused');
      $('#veil').hidden = true;
      $('#pauseBtn').setAttribute('aria-label', 'Pause');
      if (D.heldWhenPaused && D.hold) endHold();
      live('Resumed. ' + problemSpeech(D.p));
    }
  }

  function finish(reason) {
    if (!D || D.phase === 'done') return;
    const wasCountdown = D.phase === 'countdown';
    const t = now();
    let el = elapsed(t);
    D.phase = 'done';
    cleanupDrill();
    if (wasCountdown || (reason === 'quit' && D.log.length === 0)) {
      D = null;
      show('home');
      refreshHome();
      return;
    }
    if (D.mode === 'sprint' && reason === 'time') el = D.limit;
    if (D.mode === 'survival' && reason === 'time') el = Math.max(0, D.bank);
    const log = D.log;
    const okTimes = log.filter((x) => x.ok).map((x) => x.ms);
    const byOp = {};
    for (const x of log) {
      const o = byOp[x.op] || (byOp[x.op] = { n: 0, ok: 0, ms: 0 });
      o.n++;
      if (x.ok) { o.ok++; o.ms += x.ms; }
    }
    const rec = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(),
      mode: D.mode,
      level: D.level,
      ops: D.ops,
      len: D.len,
      key: D.key,
      correct: D.correct,
      wrong: D.wrong,
      attempts: log.length,
      accuracy: log.length ? D.correct / log.length : 0,
      avgMs: okTimes.length ? okTimes.reduce((a, b) => a + b, 0) / okTimes.length : 0,
      elapsedMs: Math.round(el),
      bestStreak: D.bestStreak,
      score: D.mode === 'race' ? Math.round(el) : D.correct,
      byOp,
    };
    const completed = reason !== 'quit';
    const hist = loadHistory();
    const prev = bestFor(rec.key, hist);
    const saved = completed && log.length > 0;
    if (saved) { hist.push(rec); saveHistory(hist); }
    lastResult = {
      rec, log, reason, saved, prev,
      isBest: saved && !!prev && better(rec.mode, rec.score, prev.score),
      first: saved && !prev,
    };
    D = null;
    Sound.done();
    show('results');
    renderResults();
    resultsShownAt = now();
    $('.res-title')?.focus({ preventScroll: true });
  }

  $('#pauseBtn').addEventListener('click', (e) => { e.currentTarget.blur(); togglePause(); });
  $('#endBtn').addEventListener('click', (e) => { e.currentTarget.blur(); finish('quit'); });
  $('#veil').addEventListener('click', (e) => { e.currentTarget.blur(); togglePause(); });
  $('#skipBtn').addEventListener('click', (e) => {
    e.currentTarget.blur();
    if (!D || D.phase !== 'run' || D.paused) return;
    if (D.hold) { endHold(); return; }
    submit(true);
  });
  keypad.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    e.preventDefault();
    Sound.init();
    b.classList.add('down');
    setTimeout(() => b.classList.remove('down'), 110);
    press(b.dataset.k);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && D && D.phase === 'run' && !D.paused) togglePause();
  });

  /* ================= Results ================= */
  let lastResult = null;
  let resultsShownAt = 0;
  const CIRCLE_PATH = 'M152 14 C 104 2, 34 10, 14 50 C -2 86, 56 116, 112 110 C 170 104, 200 76, 188 42 C 178 16, 136 4, 90 12';

  function renderResults() {
    const { rec, log, reason, saved, prev, isBest, first } = lastResult;
    const quit = reason === 'quit';
    const raceDone = rec.mode === 'race' && !quit;
    const bigNum = raceDone ? secs(rec.score) : String(rec.correct);
    const unit = raceDone ? 'seconds' : (rec.mode === 'race' ? `of ${rec.len} right` : 'right');
    const remark = isBest ? 'New best!' : (saved && rec.attempts >= 5 && rec.wrong === 0 ? 'Perfect!' : '');

    let note;
    if (quit) note = 'You ended this drill early, so it isn’t saved to your progress.';
    else if (!saved) note = 'No answers this time, so nothing was saved.';
    else if (isBest) note = `New personal best. Your previous best was <b>${scoreText(prev)}</b>.`;
    else if (first) note = 'Your first score on this drill. Try again to beat it.';
    else note = `Your best on this drill is <b>${scoreText(prev)}</b>, set ${shortDate(prev.ts)}.`;

    const facts = [];
    facts.push(['Accuracy', rec.attempts ? `${pct(rec.accuracy)}<small>%</small>` : '–']);
    facts.push(['Average time', rec.avgMs ? `${secs(rec.avgMs)}<small> s</small>` : '–']);
    if (rec.mode === 'survival') facts.push(['Lasted', clockDown(rec.elapsedMs)]);
    else if (rec.mode === 'sprint') facts.push(['Pace', `${rec.elapsedMs ? Math.round(rec.correct / (rec.elapsedMs / 60000)) : 0}<small> a minute</small>`]);
    else facts.push(['Missed', String(rec.wrong)]);
    facts.push(['Best streak', String(rec.bestStreak)]);

    const opsUsed = OP_ORDER.filter((o) => rec.byOp[o]);
    const opRows = opsUsed.map((o) => {
      const s = rec.byOp[o];
      return `<tr><td><span class="sym" aria-hidden="true">${SYM[o]}</span>${OP_NAME[o]}</td><td class="num">${s.ok} of ${s.n}</td><td class="num">${pct(s.ok / s.n)}%</td><td class="num">${s.ok ? secs(s.ms / s.ok) + ' s' : '–'}</td></tr>`;
    }).join('');

    const misses = log.filter((x) => !x.ok);
    const fixItems = misses.slice(0, 10).map((x) => `<li><span class="prob">${problemText(x)} =</span>${x.given == null ? '<span class="muted" style="font-size:16px">skipped</span>' : `<s>${fmtNum(x.given)}</s>`}<span class="right">${fmtNum(x.ans)}</span></li>`).join('');
    const more = misses.length > 10 ? `<li><span class="fixes empty">and ${misses.length - 10} more</span></li>` : '';
    const slow = log.filter((x) => x.ok).sort((a, b) => b.ms - a.ms).slice(0, 3);
    const slowItems = slow.map((x) => `<li><span class="prob">${problemText(x)} =</span><span class="right" style="color:var(--pen)">${fmtNum(x.ans)}</span><span class="t">${secs(x.ms)} s</span></li>`).join('');

    $('#view-results').innerHTML = `
      <div class="results">
        <div class="res-top">
          <div>
            <h2 class="res-title" tabindex="-1">${drillTitle(rec.mode, rec.len)}</h2>
            <p class="res-sub">${drillSub(rec.level, rec.ops)}</p>
            <div class="score">
              <span class="num">${bigNum}<svg viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="${CIRCLE_PATH}"/></svg></span>
              <span class="unit">${unit}</span>
              ${remark ? `<span class="remark">${remark}</span>` : ''}
            </div>
            <p class="res-note">${note}</p>
          </div>
          <div class="res-actions">
            <button type="button" class="btn-primary" data-act="retry">Try again <kbd>Enter</kbd></button>
            <button type="button" class="btn" data-act="home">Change settings</button>
            <button type="button" class="btn" data-act="progress">See progress</button>
          </div>
        </div>
        <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
        ${log.length ? `
        <section class="panel">
          <div class="panel-head">
            <h3>Time per problem</h3>
            <div class="legend"><span><i style="background:var(--pen)"></i>Right</span><span><i style="background:var(--red)"></i>Missed</span></div>
          </div>
          <div class="chart" id="resChart"></div>
        </section>
        <div class="two-col">
          <section class="panel">
            <div class="panel-head"><h3>By operation</h3></div>
            <table class="optable"><thead><tr><th>Operation</th><th class="num">Right</th><th class="num">Accuracy</th><th class="num">Avg time</th></tr></thead><tbody>${opRows}</tbody></table>
          </section>
          <section class="panel">
            <div class="panel-head"><h3>${misses.length ? 'Corrections' : 'Slowest answers'}</h3></div>
            <ul class="fixes">${misses.length ? fixItems + more : (slowItems || '<li><span class="empty">Nothing to show.</span></li>')}</ul>
            ${misses.length && slowItems ? `<div class="panel-head" style="margin-top:36px"><h3>Slowest answers</h3></div><ul class="fixes">${slowItems}</ul>` : ''}
          </section>
        </div>` : ''}
      </div>`;
    fitCircle();
    drawResultChart();
    live(`Drill over. ${raceDone ? `${bigNum} seconds` : `${rec.correct} right`}, ${pct(rec.accuracy)} percent accuracy.${isBest ? ' New personal best.' : ''}`);
  }

  function fitCircle() {
    const svg = $('.score .num svg');
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const w = r.width, h = r.height;
    svg.setAttribute('viewBox', `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
    svg.removeAttribute('preserveAspectRatio');
    const d = CIRCLE_PATH.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, (m, x, y) => `${(x / 200 * w).toFixed(1)} ${(y / 120 * h).toFixed(1)}`);
    svg.querySelector('path').setAttribute('d', d);
  }

  function niceCeil(v) {
    const steps = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30, 40, 60, 90, 120, 180, 300];
    for (const s of steps) if (v <= s) return s;
    return Math.ceil(v / 60) * 60;
  }

  function drawResultChart() {
    const host = $('#resChart');
    if (!host || !lastResult) return;
    const log = lastResult.log;
    const W = Math.max(280, host.clientWidth);
    const H = 190, L = 34, B = 26, T = 10, Rt = 4;
    const max = niceCeil(Math.max(...log.map((x) => x.ms)) / 1000);
    const innerW = W - L - Rt, innerH = H - T - B;
    const n = log.length;
    const bw = innerW / n;
    const gap = Math.min(5, bw * 0.28);
    const y = (s) => T + innerH - (s / max) * innerH;
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of seconds spent on each problem">`;
    for (const f of [0.5, 1]) {
      const v = max * f;
      svg += `<line class="axis" x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(1)}s</text>`;
    }
    log.forEach((x, i) => {
      const h = Math.max(2, (x.ms / 1000 / max) * innerH);
      svg += `<rect class="${x.ok ? 'ok' : 'miss'}" x="${(L + i * bw + gap / 2).toFixed(2)}" y="${(T + innerH - h).toFixed(2)}" width="${Math.max(1, bw - gap).toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(3, (bw - gap) / 3).toFixed(1)}"><title>${problemText(x)} = ${fmtNum(x.ans)}${x.ok ? '' : x.given == null ? ' (skipped)' : ` (you wrote ${fmtNum(x.given)})`}, ${secs(x.ms)} s</title></rect>`;
    });
    const sorted = log.map((x) => x.ms).sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)] / 1000;
    if (n > 2) {
      svg += `<line class="median" x1="${L}" x2="${W - Rt}" y1="${y(med)}" y2="${y(med)}"/>`;
      svg += `<text x="${W - Rt}" y="${y(med) - 7}" text-anchor="end" style="fill:var(--ink);font-weight:600">median ${med.toFixed(1)}s</text>`;
    }
    svg += `<line class="base" x1="${L}" x2="${W - Rt}" y1="${T + innerH}" y2="${T + innerH}"/>`;
    svg += `<text x="${L}" y="${H - 6}">1st</text><text x="${W - Rt}" y="${H - 6}" text-anchor="end">${n}${ordinal(n)} problem</text>`;
    svg += '</svg>';
    host.innerHTML = svg;
  }
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };

  $('#view-results').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'retry') startDrill();
    else if (act === 'home') { show('home'); refreshHome(); }
    else if (act === 'progress') { show('progress'); renderProgress(); $('.pg-title')?.focus(); }
  });

  /* ================= Progress ================= */
  let trendKey = null;

  function renderProgress() {
    const hist = loadHistory();
    const host = $('#view-progress');
    if (!hist.length) {
      host.innerHTML = `
        <div class="progress">
          <h2 class="pg-title" tabindex="-1">Progress</h2>
          <div class="empty-state">
            <p>No drills yet. Finish one and your scores, personal bests, and practice streak will show up here.</p>
            <button type="button" class="btn-primary" id="emptyStart">Start a drill</button>
          </div>
        </div>`;
      $('#emptyStart').addEventListener('click', () => { show('home'); refreshHome(); });
      return;
    }
    const solved = hist.reduce((a, r) => a + r.correct, 0);
    const attempts = hist.reduce((a, r) => a + r.attempts, 0);
    const time = hist.reduce((a, r) => a + r.elapsedMs, 0);
    const st = streakInfo(hist);

    let streakLine;
    if (st.n >= 2) streakLine = `You’re on a <b>${st.n}-day</b> practice streak.${st.today ? '' : ' Practice today to keep it going.'}`;
    else if (st.n === 1 && st.today) streakLine = 'You practiced today. Come back tomorrow to start a streak.';
    else if (st.n === 1) streakLine = 'You practiced yesterday. Practice today to keep your streak going.';
    else streakLine = 'Practice today to start a new streak.';

    const agg = {};
    for (const r of hist) for (const [o, s] of Object.entries(r.byOp || {})) {
      const a = agg[o] || (agg[o] = { n: 0, ok: 0, ms: 0 });
      a.n += s.n; a.ok += s.ok; a.ms += s.ms;
    }
    const qualified = OP_ORDER.filter((o) => agg[o] && agg[o].ok >= 8);
    let insight = '';
    if (qualified.length >= 2) {
      const slowest = qualified.reduce((a, b) => (agg[b].ms / agg[b].ok > agg[a].ms / agg[a].ok ? b : a));
      const leastAcc = qualified.reduce((a, b) => (agg[b].ok / agg[b].n < agg[a].ok / agg[a].n ? b : a));
      insight = ` <b>${OP_NAME[slowest]}</b> is your slowest operation, at <b>${secs(agg[slowest].ms / agg[slowest].ok)} s</b> per problem.`;
      if (leastAcc !== slowest && agg[leastAcc].ok / agg[leastAcc].n < 0.95) {
        insight += ` Your accuracy is lowest on <b>${OP_NAME[leastAcc].toLowerCase()}</b> (${pct(agg[leastAcc].ok / agg[leastAcc].n)}%).`;
      }
    }

    // Personal bests, grouped by drill config
    const groups = new Map();
    for (const r of hist) {
      const g = groups.get(r.key) || { key: r.key, runs: [], last: 0 };
      g.runs.push(r);
      g.last = Math.max(g.last, r.ts);
      groups.set(r.key, g);
    }
    const sortedGroups = [...groups.values()].sort((a, b) => b.last - a.last);
    if (!trendKey || !groups.has(trendKey)) trendKey = groups.has(currentKey()) ? currentKey() : sortedGroups[0].key;

    const bestItems = sortedGroups.slice(0, 8).map((g) => {
      const best = bestFor(g.key, g.runs);
      return `<li><div><div class="t">${drillTitle(best.mode, best.len)}</div><div class="s">${drillSub(best.level, best.ops)}. ${plural(g.runs.length, 'try', 'tries')}</div></div><div class="v">${scoreText(best)}<small>${shortDate(best.ts)}</small></div></li>`;
    }).join('');
    const recentItems = hist.slice(-8).reverse().map((r) =>
      `<li><div><div class="t">${drillTitle(r.mode, r.len)}</div><div class="s">${drillSub(r.level, r.ops)}. ${dateLabel(r.ts)}</div></div><div class="v">${scoreText(r)}<small>${pct(r.accuracy)}% accuracy</small></div></li>`
    ).join('');
    const options = sortedGroups.map((g) => {
      const r = g.runs[0];
      return `<option value="${g.key}"${g.key === trendKey ? ' selected' : ''}>${drillTitle(r.mode, r.len)}, ${drillSub(r.level, r.ops).replace(/^\w/, (c) => c.toLowerCase())}</option>`;
    }).join('');

    host.innerHTML = `
      <div class="progress">
        <h2 class="pg-title" tabindex="-1">Progress</h2>
        <p class="summary">You’ve finished <b>${plural(hist.length, 'drill')}</b> and solved <b>${plural(solved, 'problem')}</b> with <b>${attempts ? pct(solved / attempts) : 0}%</b> accuracy, over ${humanDuration(time)} of practice.</p>
        <p class="summary">${streakLine}${insight}</p>

        <section class="panel">
          <div class="panel-head"><h3>Practice calendar</h3></div>
          <div id="calHost"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>Score history</h3>
            <label class="sr-only" for="trendSel">Drill to chart</label>
            <select id="trendSel">${options}</select>
          </div>
          <div class="chart" id="trendChart"></div>
        </section>

        <div class="two-col">
          <section class="panel">
            <div class="panel-head"><h3>Personal bests</h3></div>
            <ul class="list">${bestItems}</ul>
          </section>
          <section class="panel">
            <div class="panel-head"><h3>Recent drills</h3></div>
            <ul class="list">${recentItems}</ul>
          </section>
        </div>
        <div class="pg-foot"><button type="button" class="btn-quiet" id="clearBtn">Clear history</button></div>
      </div>`;
    $('#trendSel').addEventListener('change', (e) => { trendKey = e.target.value; drawTrend(); });
    $('#clearBtn').addEventListener('click', () => {
      const dlg = $('#clearDialog');
      if (dlg.showModal) dlg.showModal(); else if (confirm('Clear all history?')) clearHistory();
    });
    drawCalendar(hist);
    drawTrend();
  }

  function drawCalendar(hist) {
    const host = $('#calHost');
    if (!host) return;
    const w = host.clientWidth || 600;
    const weeks = Math.max(12, Math.min(40, Math.floor((w - 50) / 18)));
    const counts = {};
    for (const r of hist) { const k = dayKey(new Date(r.ts)); counts[k] = (counts[k] || 0) + r.correct; }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dow = (today.getDay() + 6) % 7; // Monday = 0
    const start = new Date(today); start.setDate(today.getDate() - dow - (weeks - 1) * 7);
    let cells = '', months = '';
    let lastMonth = -1;
    const level = (c) => (c <= 0 ? 0 : c < 20 ? 1 : c < 50 ? 2 : c < 100 ? 3 : 4);
    for (let wk = 0; wk < weeks; wk++) {
      const monday = new Date(start); monday.setDate(start.getDate() + wk * 7);
      if (monday.getMonth() !== lastMonth && wk < weeks - 2) {
        months += `<span style="grid-column:${wk + 1} / span 3">${monday.toLocaleDateString([], { month: 'short' })}</span>`;
        lastMonth = monday.getMonth();
      }
      for (let d = 0; d < 7; d++) {
        const day = new Date(monday); day.setDate(monday.getDate() + d);
        if (day > today) { cells += '<i style="visibility:hidden"></i>'; continue; }
        const k = dayKey(day);
        const c = counts[k] || 0;
        const label = `${day.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}: ${c ? plural(c, 'problem') + ' solved' : 'no practice'}`;
        cells += `<i data-l="${level(c)}"${k === dayKey(today) ? ' class="today"' : ''} title="${label}"></i>`;
      }
    }
    host.innerHTML = `
      <div class="cal" style="--weeks:${weeks}" role="img" aria-label="Practice calendar for the last ${weeks} weeks">
        <div class="cal-months">${months}</div>
        <div class="cal-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-legend">Fewer<span></span><i></i><i style="background:color-mix(in srgb, var(--pen) 28%, transparent)"></i><i style="background:color-mix(in srgb, var(--pen) 52%, transparent)"></i><i style="background:color-mix(in srgb, var(--pen) 76%, transparent)"></i><i style="background:var(--pen)"></i><span></span>More problems solved</div>
      </div>`;
  }

  function drawTrend() {
    const host = $('#trendChart');
    if (!host || !trendKey) return;
    const runs = loadHistory().filter((r) => r.key === trendKey).slice(-40);
    if (!runs.length) { host.innerHTML = ''; return; }
    const race = runs[0].mode === 'race';
    const vals = runs.map((r) => (race ? r.score / 1000 : r.score));
    const W = Math.max(280, host.clientWidth);
    const H = 220, L = 40, B = 28, T = 16, Rt = 16;
    const innerW = W - L - Rt, innerH = H - T - B;
    const max = niceCeil(Math.max(...vals) * 1.1 || 1);
    const y = (v) => T + innerH - (v / max) * innerH;
    const x = (i) => (runs.length === 1 ? L + innerW / 2 : L + (i / (runs.length - 1)) * innerW);
    const bestIdx = vals.reduce((bi, v, i) => (race ? (v < vals[bi] ? i : bi) : (v > vals[bi] ? i : bi)), 0);
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of ${race ? 'finish times' : 'scores'} for this drill">`;
    for (const f of [0.5, 1]) {
      const v = max * f;
      svg += `<line class="axis" x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(1)}${race ? 's' : ''}</text>`;
    }
    svg += `<line class="base" x1="${L}" x2="${W - Rt}" y1="${T + innerH}" y2="${T + innerH}"/>`;
    if (runs.length > 1) svg += `<path class="line" d="${vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}"/>`;
    vals.forEach((v, i) => {
      const r = runs[i];
      svg += `<g><circle class="dot${i === bestIdx ? ' best' : ''}" cx="${x(i)}" cy="${y(v)}" r="${i === bestIdx ? 6 : 4.5}"/><circle class="hit" cx="${x(i)}" cy="${y(v)}" r="12"><title>${dateLabel(r.ts)}: ${scoreText(r)}, ${pct(r.accuracy)}% accuracy</title></circle></g>`;
    });
    const bx = x(bestIdx), by = y(vals[bestIdx]);
    svg += `<ellipse class="ring" cx="${bx}" cy="${by}" rx="13" ry="11" transform="rotate(-12 ${bx} ${by})"/>`;
    const anchor = bx > W - 90 ? 'end' : bx < L + 60 ? 'start' : 'middle';
    svg += `<text x="${bx}" y="${Math.max(12, by - 18)}" text-anchor="${anchor}" style="fill:var(--red);font-weight:700">Best ${race ? vals[bestIdx].toFixed(1) + 's' : vals[bestIdx]}</text>`;
    svg += `<text x="${L}" y="${H - 6}">${shortDate(runs[0].ts)}</text>`;
    if (runs.length > 1) svg += `<text x="${W - Rt}" y="${H - 6}" text-anchor="end">${shortDate(runs[runs.length - 1].ts)}</text>`;
    svg += `<text x="${L + innerW / 2}" y="${H - 6}" text-anchor="middle">${race ? 'Finish time, lower is better' : 'Right answers per drill'}</text>`;
    svg += '</svg>';
    host.innerHTML = svg;
  }

  function clearHistory() {
    store.set('mpd.history', []);
    trendKey = null;
    renderProgress();
    refreshBestLine();
  }
  $('#clearCancel').addEventListener('click', () => $('#clearDialog').close());
  $('#clearConfirm').addEventListener('click', () => { $('#clearDialog').close(); clearHistory(); $('.pg-title')?.focus(); });

  /* ================= Resize redraws ================= */
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (view === 'results') { drawResultChart(); fitCircle(); }
      if (view === 'progress') { drawTrend(); drawCalendar(loadHistory()); }
    }, 120);
  });

  /* ================= Keyboard ================= */
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('#clearDialog').open) return;
    const k = e.key;
    if (view === 'drill') {
      if (!D) return;
      if (D.phase === 'countdown') {
        if (k === 'Escape') { e.preventDefault(); finish('quit'); }
        return;
      }
      if (k === 'Escape') { e.preventDefault(); finish('quit'); return; }
      if (k === ' ' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); return; }
      if (D.paused) { if (k === 'Enter') { e.preventDefault(); togglePause(); } return; }
      if (/^[0-9]$/.test(k) || k === '-' || k === 'Backspace' || k === 'Enter' || k === 'Delete') {
        e.preventDefault();
        press(k === 'Delete' ? 'Backspace' : k);
      }
      return;
    }
    if (k === 'Enter') {
      const tag = e.target.tagName;
      if (['BUTTON', 'A', 'SUMMARY', 'SELECT', 'TEXTAREA'].includes(tag)) return;
      if (tag === 'INPUT' && e.target.type === 'checkbox') return;
      if (view === 'home') { e.preventDefault(); startDrill(); }
      else if (view === 'results' && now() - resultsShownAt > 700) { e.preventDefault(); startDrill(); }
    } else if (k === 'Escape' && view === 'results') {
      show('home'); refreshHome();
    }
  });

  window.addEventListener('hashchange', () => {
    if (view === 'drill') return;
    if (location.hash === '#progress' && view !== 'progress') { show('progress'); renderProgress(); }
    else if (location.hash !== '#progress' && view === 'progress') { show('home'); refreshHome(); }
  });

  /* ================= Boot ================= */
  renderSetup();
  refreshPreview();
  refreshHome();
  if (location.hash === '#progress') { show('progress'); renderProgress(); }
})();
</script>
</body>
</html>
