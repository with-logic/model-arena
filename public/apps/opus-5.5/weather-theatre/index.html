<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Theatre — The Week in Seven Acts</title>
<meta name="description" content="A React + Canvas weather theatre: mood faders remix one mock forecast into cosy, eerie and heroic stage sets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --gold1:#fff1b8; --gold2:#e2b54e; --gold3:#a57d1f; --gold4:#5a4109;
  --ink:#0d0607; --cream:#f3e6c8; --muted:#b39b74;
  --cosy:#f2a14a; --eerie:#5fd8ad; --heroic:#7aa4ff;
  --side-w: clamp(300px, 24vw, 372px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070304;color:var(--cream);font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font-family:inherit}
.house{
  position:relative;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) var(--side-w);
  background:
    radial-gradient(90% 70% at 40% -10%, rgba(140,24,40,.55), transparent 60%),
    radial-gradient(120% 90% at 40% 110%, rgba(60,10,18,.6), transparent 60%),
    linear-gradient(180deg,#24070c 0%,#120407 55%,#070203 100%);
}
.house::before{ /* damask-ish wallpaper */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;transition:opacity 1.6s;
  background-image:
    radial-gradient(circle at 50% 50%, #ffd59a 0 1.5px, transparent 2.5px),
    radial-gradient(ellipse 9px 14px at 50% 50%, transparent 7px, #ffd59a 8px, transparent 9.5px);
  background-size:34px 34px, 68px 68px; background-position:0 0, 17px 17px;
}
.house::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 60% at 40% 45%,rgba(0,0,0,.2),rgba(0,0,0,.55));opacity:0;transition:opacity 1.8s ease}
.house.night::after{opacity:1}
.main,.side{z-index:1}
.house.night::before{opacity:.035}

/* ───────────── main column ───────────── */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 18px 14px 26px}
.marquee{display:flex;justify-content:center;padding:6px 0 0;position:relative;z-index:4}
.sign{
  position:relative;padding:9px 54px 8px;border-radius:14px;text-align:center;
  background:linear-gradient(180deg,#2c0a11,#13040a);
  border:2px solid var(--gold3);
  box-shadow:0 0 0 4px #1b060b,0 0 0 6px #7a5a14,0 12px 30px rgba(0,0,0,.6),inset 0 0 26px rgba(0,0,0,.7);
}
.sign h1{
  margin:0;font-family:Limelight,Georgia,serif;font-weight:400;font-size:clamp(22px,2.5vw,36px);letter-spacing:.14em;line-height:1.05;
  background:linear-gradient(180deg,#fff7d6 0%,#f4cf62 46%,#b5841d 56%,#ffe9a2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,196,90,.35));
}
.sign .tag{margin-top:3px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.bulbs{position:absolute;display:flex;justify-content:space-between;pointer-events:none}
.bulbs.h{left:12px;right:12px;height:8px}
.bulbs.top{top:-6px}.bulbs.bottom{bottom:-6px}
.bulbs.v{top:12px;bottom:12px;width:8px;flex-direction:column}
.bulbs.left{left:-6px}.bulbs.right{right:-6px}
.bulb{width:8px;height:8px;border-radius:50%;background:#fff0c0;box-shadow:0 0 6px 2px rgba(255,196,90,.85);animation:chase 1.35s infinite steps(1)}
.bulb:nth-child(3n+2){animation-delay:-.45s}.bulb:nth-child(3n+3){animation-delay:-.9s}
@keyframes chase{0%{opacity:1}33.3%{opacity:.22;box-shadow:none;background:#8a6a3a}100%{opacity:.22;box-shadow:none;background:#8a6a3a}}

.pros{position:relative;flex:1;min-height:0;display:flex;justify-content:center;padding-top:30px}
.arch{
  position:relative;display:flex;flex-direction:column;width:100%;max-width:calc((100vh - 250px) * 2.25 + 60px);
  padding:15px 17px 12px;
  border-radius:46% 46% 12px 12px / 66px 66px 12px 12px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 18%,rgba(0,0,0,0) 80%,rgba(0,0,0,.35)),
    linear-gradient(90deg,#5c430b 0%,#e8c45c 3.5%,#9a7517 7%,#f3d987 14%,#c79c33 30%,#f6e09a 50%,#c79c33 70%,#f3d987 86%,#9a7517 93%,#e8c45c 96.5%,#5c430b 100%);
  box-shadow:0 0 0 2px #2a1c04,0 0 0 6px #b38d2c,0 0 0 8px #2a1c04,0 0 0 9px rgba(255,220,140,.25),0 40px 90px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,250,220,.7),inset 0 -2px 0 rgba(0,0,0,.45);
}
.arch::before,.arch::after{ /* fluted pilasters */
  content:"";position:absolute;top:70px;bottom:12px;width:9px;border-radius:3px;pointer-events:none;
  background:repeating-linear-gradient(90deg,#6b4f10 0 1px,#f4dc8e 1px 3px,#b48c27 3px 5px);opacity:.85;
}
.arch::before{left:4px}.arch::after{right:4px}
.stage{
  position:relative;flex:1;min-height:240px;overflow:hidden;background:#000;
  border-radius:46% 46% 4px 4px / 54px 54px 4px 4px;
  box-shadow:0 0 0 2px #3b2905,0 0 0 3px rgba(255,230,160,.35);
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.55)}
.medal{position:absolute;left:50%;top:-30px;width:64px;height:64px;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));pointer-events:none}
.medal .dial{transform-box:view-box;transform-origin:32px 32px;transition:transform 2.4s cubic-bezier(.65,0,.3,1)}
.scroll-l,.scroll-r{position:absolute;top:-14px;width:120px;height:26px;z-index:4;pointer-events:none}
.scroll-l{right:calc(50% + 26px)}.scroll-r{left:calc(50% + 26px);transform:scaleX(-1)}

.sconce{position:absolute;top:44%;width:16px;height:60px;pointer-events:none;z-index:1}
.sconce.l{left:-46px}.sconce.r{right:-46px}
.sconce::before{content:"";position:absolute;left:3px;bottom:0;width:10px;height:34px;border-radius:2px 2px 6px 6px;background:linear-gradient(90deg,#6b4f10,#f0d27a,#8a6a18)}
.sconce i{position:absolute;left:2px;top:4px;width:12px;height:18px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff8e0,#ffc867 55%,#d9862c);box-shadow:0 0 18px 6px rgba(255,190,100,.55),0 0 90px 40px rgba(255,160,70,.16);transition:all 1.6s}
.night .sconce i{opacity:.35;box-shadow:0 0 6px 2px rgba(255,190,100,.35),0 0 30px 10px rgba(255,160,70,.06)}

.surtitle{
  position:relative;margin-top:10px;padding:9px 26px 11px;border-radius:6px;text-align:center;
  background:linear-gradient(180deg,#160709,#070203);
  box-shadow:inset 0 0 0 1px rgba(226,181,78,.45),inset 0 0 22px rgba(0,0,0,.9),0 1px 0 rgba(255,240,200,.3);
}
.surtitle .act{font-weight:700;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px}
.surtitle .act b{color:#fff0c8;font-weight:700}
.surtitle .act .dot{opacity:.5}
.tw{position:relative;margin:6px auto 0;max-width:1040px;font-family:'Special Elite','Courier New',monospace;font-size:clamp(14px,1.18vw,18px);line-height:1.45;color:#f7ead0;text-shadow:0 0 12px rgba(255,200,120,.18);min-height:2.9em}
.tw .ghost{visibility:hidden}
.tw .typed{position:absolute;inset:0}
.caret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;vertical-align:-.17em;background:#f2c46a;box-shadow:0 0 8px rgba(242,196,106,.7);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ───────────── side desk ───────────── */
.side{
  position:relative;z-index:2;overflow-y:auto;overflow-x:hidden;padding:14px 16px 16px;
  background:linear-gradient(180deg,rgba(30,12,10,.96),rgba(14,6,6,.98));
  border-left:1px solid rgba(201,160,70,.28);box-shadow:-20px 0 50px rgba(0,0,0,.45);
  scrollbar-width:thin;scrollbar-color:#5a4210 transparent;
}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#4a3410;border-radius:8px}
.sec{position:relative;margin-bottom:12px;padding:12px 13px 12px;border-radius:12px;
  background:linear-gradient(180deg,rgba(60,32,18,.55),rgba(28,14,9,.55));
  box-shadow:inset 0 1px 0 rgba(255,220,150,.09),inset 0 0 0 1px rgba(201,160,70,.18),0 10px 24px rgba(0,0,0,.35)}
.sec::before,.sec::after{content:"";position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe7a8,#8a6618 70%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.sec::before{left:8px}.sec::after{right:8px}
.sec h2{margin:0 0 2px;text-align:center;font-family:Limelight,Georgia,serif;font-weight:400;font-size:19px;letter-spacing:.16em;color:#f3d27e}
.sec .sub{margin:0 0 8px;text-align:center;font-style:italic;font-size:14px;color:var(--muted)}
.sec .sub::after{content:"";display:block;width:56%;height:1px;margin:7px auto 0;background:linear-gradient(90deg,transparent,#b48c34,transparent)}
.house-sec{padding:12px}
.house-sec::before,.house-sec::after{display:none}
.orn{display:flex;align-items:center;gap:8px;margin:0 auto 10px;width:70%}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#b48c34,transparent)}
.orn i{width:6px;height:6px;transform:rotate(45deg);background:#d9ad4a}

.acts{display:flex;flex-direction:column;gap:2px}
.act-row{display:grid;grid-template-columns:24px 24px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:4px 10px 4px 8px;border-radius:8px;border:1px solid transparent;background:transparent;color:#ecdcbc;text-align:left;cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s}
.act-row:hover{background:rgba(255,214,140,.07)}
.act-row:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
.act-row.on{background:linear-gradient(90deg,rgba(240,190,90,.24),rgba(240,190,90,.03));border-color:rgba(230,180,80,.5);box-shadow:inset 3px 0 0 #e7b54a,0 0 18px rgba(240,190,90,.12)}
.act-row .rn{font-family:Limelight,serif;font-size:13px;color:#c9a04a;text-align:center}
.act-row .ic{display:grid;place-items:center;color:#f1d79a}
.act-row .ic svg{width:22px;height:22px}
.act-row .nm{display:block;font-weight:700;font-size:15.5px;line-height:1.08}
.act-row .cd{display:block;font-size:13px;line-height:1.15;font-style:italic;color:#b8a07a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-row .tp{font-family:Limelight,serif;font-size:16px;color:#f6e3b4;white-space:nowrap}
.act-row .tp small{font-size:12px;color:#9a8462;margin-left:3px}
.act-row.on .rn{color:#ffe08a}

.fader{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;align-items:center;gap:2px 10px;margin:2px 0 8px}
.fader .ico{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 calc(var(--g) * 18px) var(--c)}
.fader .ico svg{width:18px;height:18px}
.fader .lbl{display:flex;align-items:baseline;gap:8px;min-width:0}
.fader .lbl b{font-size:17px;font-weight:700;color:#f6e7c6}
.fader .lbl span{font-size:13px;font-style:italic;color:#9f8866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fader .val{grid-row:span 2;font-family:Limelight,serif;font-size:16px;color:var(--c);text-align:right;text-shadow:0 0 10px var(--c)}
.fader input{grid-column:2}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c) 0 var(--p),#2a1a10 var(--p) 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,220,150,.1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff6d0,#e2b44c 45%,#7d5a12 100%);box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(0,0,0,.35),0 0 14px var(--c)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--c),0 2px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#2a1a10;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--c)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff6d0,#e2b44c 45%,#7d5a12 100%);box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 14px var(--c)}

.staging{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(201,160,70,.2)}
.staging small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#a88c5a;font-weight:700}
.staging strong{font-family:Limelight,serif;font-weight:400;font-size:16px;color:#ffe3a0;text-align:right;letter-spacing:.04em}
.mixbar{display:flex;height:4px;border-radius:4px;overflow:hidden;margin:-4px 0 12px;background:#24150d}
.mixbar i{display:block;height:100%;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(214,170,80,.45);background:linear-gradient(180deg,rgba(255,220,150,.08),rgba(0,0,0,.2));color:#f0dfb8;padding:5px 11px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#f0c35c;background:rgba(240,195,92,.16);color:#fff}
.chip:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.chip svg{width:15px;height:15px}
.chip.dice{border-color:rgba(240,195,92,.8);color:#ffe7a6}

.dn{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;width:100%;height:48px;padding:0;border-radius:999px;cursor:pointer;overflow:hidden;
  border:1px solid #7a5a1a;background:linear-gradient(90deg,rgba(246,196,107,.18),rgba(40,52,110,.5));
  box-shadow:inset 0 2px 8px rgba(0,0,0,.6);color:#e9d8b0;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.dn .knob{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:38px;border-radius:999px;background:linear-gradient(180deg,#ffeab0,#e0a63c);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.7),0 0 22px rgba(255,190,90,.45);transition:transform .7s cubic-bezier(.6,-.25,.3,1.25),background .7s,box-shadow .7s}
.dn.night .knob{transform:translateX(100%);background:linear-gradient(180deg,#d6dcff,#5d6fc4);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6),0 0 22px rgba(120,140,255,.45)}
.dn span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;transition:color .5s}
.dn span svg{width:18px;height:18px}
.dn span.on{color:#2a1906}
.dn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid rgba(214,170,80,.5);background:linear-gradient(180deg,rgba(130,20,34,.55),rgba(60,8,16,.6));color:#fbe6bd;font-size:15px;font-weight:700;letter-spacing:.04em;transition:all .2s;box-shadow:inset 0 1px 0 rgba(255,220,180,.15)}
.btn:hover{border-color:#f0c35c;filter:brightness(1.18)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn svg{width:17px;height:17px}
.btn.on{background:linear-gradient(180deg,rgba(220,170,70,.45),rgba(120,80,20,.5));color:#fff3d0}
.keys{margin:4px 0 0;font-size:13px;color:#9b8460;text-align:center;line-height:1.7}
kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:4px;border:1px solid #6b5122;background:#1e120b;color:#f0d79c;font-family:'Special Elite',monospace;font-size:11px;line-height:17px;text-align:center}
.credit{margin-top:6px;text-align:center;font-size:12px;font-style:italic;color:#7d6748}

.boot{height:100vh;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 30%,#3a0d14,#0b0305)}
.boot-in{text-align:center}
.boot b{display:block;font-family:Limelight,Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,48px);letter-spacing:.14em;color:#f0c95a;text-shadow:0 0 18px rgba(255,190,90,.4)}
.boot span{display:block;margin-top:10px;font-style:italic;color:#b39b74;font-size:16px;animation:blink 1.6s ease-in-out infinite}
/* ───────────── responsive ───────────── */
@media (max-height:760px){
  .sign{padding:6px 44px 6px}.sign .tag{display:none}
  .pros{padding-top:26px}
  .tw{min-height:2.9em}
}
@media (max-width:1100px){
  body{overflow:auto}
  .house{height:auto;min-height:100vh;grid-template-columns:1fr}
  .main{padding:10px 14px}
  .pros{flex:none}
  .arch{max-width:none}
  .stage{flex:none;aspect-ratio:16/10;min-height:0}
  .side{border-left:0;border-top:1px solid rgba(201,160,70,.28);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;overflow:visible}
  .sec{margin-bottom:0}
  .sconce{display:none}
}
@media (max-width:640px){
  .stage{aspect-ratio:4/3.4}
  .sign{padding:7px 26px}.sign h1{letter-spacing:.08em}
  .surtitle .act{font-size:10px;letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){
  .bulb{animation:none}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"><div class="boot"><div class="boot-in"><b>Weather Theatre</b><span>The house lights are dimming…</span></div></div></div>

<!-- ═══════════════════════════ CANVAS STAGE ENGINE (plain JS) ═══════════════════════════ -->
<script>
(function(){
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.45, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed){

/* ══════════════════════════════ ENGINE ══════════════════════════════ */
class Engine {
  constructor(canvas){
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.W = 960; this.H = 540; this.dpr = 1;
    this.t = 0; this.prev = performance.now();
    this.mT = { cosy:.7, eerie:.15, heroic:.3 }; this.m = { ...this.mT };
    this.night = 0; this.nightTw = null;
    this.wxT = { cloud:.4, rain:0, snow:0, fog:0, wind:.2, storm:0, sun:.7 }; this.wx = { ...this.wxT };
    this.par = { x:0, y:0, tx:0, ty:0 };
    this.curt = { v:0, from:0, to:0, start:0, dur:0, res:null }; this.curtVel = 0; this.prevCurt = 0;
    this.busy = false; this.queued = null; this.everOpened = false;
    this.sweep = 0; this.flashT = 99; this.bolt = null; this.boltTimer = 2.5; this.shoot = null; this.shootTimer = 5;
    this.mill = 0; this.card = null; this.dayInfo = null;
    this.onEvent = null; this.alive = true;
    this.n1 = makeNoise(7); this.n2 = makeNoise(19); this.n3 = makeNoise(43);
    this.moonCv = document.createElement('canvas');
    this.wn = { n:.2, c:.4, e:.1, h:.3 };
    this.initScene();
    this.props.forEach(p => p.pr = this.m[p.mood] >= p.th ? 1 : 0);
    this.backY = 350; this.frontY = 520; this.rows = ROWDEF.map(d => ({ ...d, y: 540 * d.base }));
    this.update(0, performance.now());
    this._ro = new ResizeObserver(() => this.resize()); this._ro.observe(canvas.parentElement);
    this.resize();
    this._pm = e => { const r = this.cv.getBoundingClientRect(); this.par.tx = ((e.clientX - r.left) / r.width - .5) * 2; this.par.ty = ((e.clientY - r.top) / r.height - .5) * 2; };
    this._pl = () => { this.par.tx = 0; this.par.ty = 0; };
    canvas.addEventListener('pointermove', this._pm); canvas.addEventListener('pointerleave', this._pl);
    this._loop = this.loop.bind(this); this._raf = requestAnimationFrame(this._loop);
  }
  destroy(){ this.alive = false; cancelAnimationFrame(this._raf); this._ro.disconnect(); this.cv.removeEventListener('pointermove', this._pm); this.cv.removeEventListener('pointerleave', this._pl); }
  emit(type){ try { this.onEvent && this.onEvent(type); } catch (e) {} }

  /* ── public API ── */
  setMoods(m){ this.mT = { cosy: clamp(m.cosy / 100), eerie: clamp(m.eerie / 100), heroic: clamp(m.heroic / 100) }; }
  setNight(on, instant){ const to = on ? 1 : 0; if (instant){ this.night = to; this.nightTw = null; return; } this.nightTw = { from: this.night, to, start: performance.now(), dur: 2400 * Math.max(.3, Math.abs(to - this.night)) }; }
  setWeather(w, instant){ this.wxT = { ...w }; if (instant) this.snap(); }
  setCard(card){ this.card = card; }
  setDayInfo(d){ this.dayInfo = d; }
  snap(){ this.wx = { ...this.wxT }; this.boltTimer = 1.2 + Math.random() * 2; }
  tween(to, dur){
    if (this.curt.res){ const r = this.curt.res; this.curt.res = null; r(); }
    return new Promise(res => { const C = this.curt; C.from = C.v; C.to = to; C.start = performance.now(); C.dur = Math.max(.25, dur * Math.abs(to - C.v)); C.res = res; if (Math.abs(to - C.v) < .001){ C.v = to; C.dur = 0; C.res = null; res(); } });
  }
  raise(){ if (!this.busy && !this.everOpened) this.sceneChange(null); }
  sceneChange(fn){ this.queued = fn || (() => {}); if (!this.busy) this._direct(); }
  async _direct(){
    this.busy = true;
    while (this.queued && this.alive){
      if (this.curt.v > .002){ this.emit('curtain'); await this.tween(0, 1.0); }
      const fn = this.queued; this.queued = null; fn(); this.snap();
      await sleep(this.everOpened ? 420 : 200);
      if (this.queued) continue;
      this.sweep = 1; this.everOpened = true; this.emit('curtain'); this.emit('opening');
      await this.tween(1, 2.6);
    }
    this.busy = false;
  }

  /* ── setup ── */
  initScene(){
    const r = rng(2024);
    this.props = PROPS.map(p => ({ ...p, pr: 0 }));
    this.stars = Array.from({ length: 230 }, () => ({ x: r(), y: Math.pow(r(), 1.3) * .92, s: .6 + r() * 1.5, b: .35 + r() * .65, sp: 1 + r() * 3, ph: r() * TAU }));
    this.craters = Array.from({ length: 7 }, () => ({ x: (r() - .5) * 1.1, y: (r() - .5) * 1.1, r: .08 + r() * .18 }));
    const order = [3, 7, 1, 5, 0, 8, 2, 6, 4];
    this.clouds = order.map((ord, i) => {
      const n = 5 + Math.floor(r() * 3), bumps = [];
      for (let j = 0; j < n; j++){ const u = j / (n - 1); const rr = .36 + .52 * Math.sin(u * Math.PI) + r() * .1; bumps.push({ x: (u - .5) * 2.1, y: -rr * .55, r: rr }); }
      return { x: (i + .5) / 9 + (r() - .5) * .05, y: .15 + r() * .15, s: .7 + r() * .55, bumps, ord, ph: r() * TAU };
    });
    this.rain = Array.from({ length: 720 }, () => ({ x: r() * 1.3 - .15, y: r() * 1.1 - .1, z: r() }));
    this.snowP = Array.from({ length: 460 }, () => ({ x: r() * 1.2 - .1, y: r(), z: r(), ph: r() * TAU }));
    this.leaves = Array.from({ length: 38 }, () => ({ x: r() * 1.2 - .1, y: .25 + r() * .65, rot: r() * TAU, spin: (r() - .5) * 8, sp: .6 + r() * .8, ph: r() * TAU, u: r(), ci: Math.floor(r() * 3), s: .7 + r() * .6 }));
    this.splash = Array.from({ length: 70 }, () => ({ x: 0, y: 0, life: 9 })); this.splashI = 0;
    this.motes = Array.from({ length: 90 }, () => ({ x: r(), y: r() * .9, ph: r() * TAU, s: .6 + r() * 1.2 }));

function Typewriter({ text, onChar }){

    setN(0); let i = 0, timer;
    const step = () => {
      i++; setN(i);
      const ch = text[i - 1];
      if (ch && ch !== ' ' && cb.current) cb.current();
      if (i < text.length){ const d = /[.,;:!?—]/.test(ch) ? 170 + Math.random() * 140 : 20 + Math.random() * 34; timer = setTimeout(step, d); }
    };
    timer = setTimeout(step, 380);
    return () => clearTimeout(timer);
  }, [text]);
  return (
    <p className="tw" aria-live="polite">
      <span className="ghost" aria-hidden="true">{text}<span className="caret"/></span>

}

function App(){
  const canvasRef = useRef(null), engRef = useRef(null), soundRef = useRef(null);

      const s = soundRef.current; if (!s || !s.on) return;

  }, []);

  useEffect(() => {
    moodsRef.current = moods; engRef.current && engRef.current.setMoods(moods);

  }, [moods]);

  }, [night]);
  useEffect(() => {
    const s = soundRef.current; if (!s || !sound) return;
    const w = FORECAST[shownDay].w;
    s.update({ cosy: moods.cosy / 100, eerie: moods.eerie / 100, heroic: moods.heroic / 100, night, rain: w.rain, wind: w.wind, storm: w.storm, snow: w.snow });
  }, [moods, night, shownDay, sound]);

  const goDay = useCallback(i => {
    i = (i + DAYS.length) % DAYS.length;
    if (i === dayRef.current) return;
    dayRef.current = i; setDay(i);

  const curtainCall = useCallback(() => {

  }, []);
  const tweenMoods = useCallback(target => {
    cancelAnimationFrame(animRef.current);
    const from = { ...moodsRef.current }, t0 = performance.now(), dur = 950;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), k = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      const v = {}; for (const key of ['cosy','eerie','heroic']) v[key] = Math.round(from[key] + (target[key] - from[key]) * k);
      setMoods(v); if (p < 1) animRef.current = requestAnimationFrame(step);
    };
    animRef.current = requestAnimationFrame(step);
  }, []);

    const r = () => Math.round(Math.pow(Math.random(), .75) * 100);

  const toggleSound = useCallback(() => {
    if (!soundRef.current) soundRef.current = new WT.Sound();

  const scene = useMemo(() => composeScene(shownDay, settled, night), [shownDay, settled, night]);
  const text = started ? scene : 'Ladies and gentlemen, please take your seats — the forecast is about to begin.';
  const sd = DAYS[shownDay];
  const staging = stagingName(moods);
  const tot = moods.cosy + moods.eerie + moods.heroic || 1;
  const onChar = useCallback(() => { const s = soundRef.current; s && s.on && s.click(); }, []);

  return (
    <div className={'house' + (night ? ' night' : '')}>
      <main className="main">
        <header className="marquee">
          <div className="sign">
            <Bulbs cls="h top" n={22}/><Bulbs cls="h bottom" n={22}/><Bulbs cls="v left" n={4}/><Bulbs cls="v right" n={4}/>
            <h1>Weather Theatre</h1>
            <div className="tag">{night ? 'Tonight' : 'This afternoon'} · {TOWN} · The week in seven acts</div>
          </div>
        </header>
        <section className="pros">
          <div className="arch">
            <span className="sconce l"><i/></span><span className="sconce r"><i/></span>
            <Medallion night={night}/>
            <div className="stage">
              <canvas ref={canvasRef} role="img" aria-label={`Stage: Act ${sd.roman}, ${sd.long}. ${scene}`}/>
            </div>
            <div className="surtitle">
              <div className="act">
                <span>Act <b>{sd.roman}</b></span><span className="dot">◆</span>
                <span><b>{sd.long}</b> {sd.date}</span><span className="dot">◆</span>
                <span>{night ? sd.condN : sd.cond}</span><span className="dot">◆</span>
                <span><b>{sd.hi}°</b> / {sd.lo}°</span><span className="dot">◆</span>
                <span>Wind {sd.wind} km/h</span><span className="dot">◆</span>
                <span>Rain {sd.rain}%</span>
              </div>
              <Typewriter text={text} onChar={onChar}/>
            </div>
          </div>
        </section>
      </main>

      <aside className="side" aria-label="Stage manager's desk">
        <div className="sec house-sec">
          <button className={'dn' + (night ? ' night' : '')} onClick={() => setNight(x => !x)} aria-pressed={night} aria-label={night ? 'Switch to Matinée' : 'Switch to Night'}>
            <i className="knob"/>
            <span className={night ? '' : 'on'}>{Ic.sun()} Matinée</span>
            <span className={night ? 'on' : ''}>{Ic.moon()} Night</span>
          </button>
          <div className="row2">
            <button className="btn" onClick={curtainCall} title="Key C">{Ic.curtain()} Curtain</button>
            <button className={'btn' + (sound ? ' on' : '')} onClick={toggleSound} aria-pressed={sound} title="Key M">{sound ? Ic.soundOn() : Ic.soundOff()} {sound ? 'Sound on' : 'Sound off'}</button>
          </div>
        </div>

        <div className="sec">
          <h2>Mood Desk</h2>
          <p className="sub">Same forecast. Different play.</p>
          {MOODS.map(m => (
            <div key={m.key} className="fader" style={{ '--c': m.color, '--p': moods[m.key] + '%', '--g': (moods[m.key] / 100).toFixed(2) }}>
              <span className="ico">{Ic[m.key]()}</span>
              <label className="lbl" htmlFor={'f-' + m.key}><b>{m.label}</b><span>{m.hint}</span></label>
              <span className="val">{moods[m.key]}</span>
              <input id={'f-' + m.key} type="range" min="0" max="100" value={moods[m.key]} onChange={e => setMood(m.key, +e.target.value)} aria-valuetext={`${m.label} ${moods[m.key]} percent`}/>
            </div>
          ))}
          <div className="staging"><small>Now staging</small><strong>{staging}</strong></div>
          <div className="mixbar" aria-hidden="true">
            <i style={{ width: (moods.cosy / tot * 100) + '%', background:'var(--cosy)' }}/>
            <i style={{ width: (moods.eerie / tot * 100) + '%', background:'var(--eerie)' }}/>
            <i style={{ width: (moods.heroic / tot * 100) + '%', background:'var(--heroic)' }}/>
          </div>
          <div className="chips">
            {PRESETS.map(p => <button key={p.name} className="chip" onClick={() => tweenMoods(p.v)}>{p.name}</button>)}
            <button className="chip dice" onClick={remix} title="Key R">{Ic.dice()} Remix</button>
          </div>
        </div>

        <div className="sec">
          <h2>Programme</h2>
          <p className="sub">{TOWN} · seven-day forecast</p>
          <div className="acts" role="listbox" aria-label="Choose an act (day)">
            {DAYS.map(d => (
              <button key={d.i} role="option" aria-selected={day === d.i} className={'act-row' + (day === d.i ? ' on' : '')} onClick={() => goDay(d.i)} title={`Key ${d.i + 1}`}>
                <span className="rn">{d.roman}</span>
                <span className="ic"><WxIcon kind={d.key} night={night}/></span>
                <span><span className="nm">{d.i === 0 ? 'Today' : d.long}</span><span className="cd">{night ? d.condN : d.cond}</span></span>
                <span className="tp">{d.hi}°<small>{d.lo}°</small></span>
              </button>
            ))}
          </div>
        </div>

        <p className="keys"><kbd>1</kbd>–<kbd>7</kbd> acts &nbsp; <kbd>←</kbd><kbd>→</kbd> next &nbsp; <kbd>N</kbd> night &nbsp; <kbd>C</kbd> curtain<br/><kbd>R</kbd> remix &nbsp; <kbd>M</kbd> sound &nbsp;·&nbsp; move over the stage for parallax</p>
        <p className="credit">All weather is mock — no forecasts were harmed.</p>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
