<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Holidays! ❄ Decorate Your Snowy Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--red:#e63946;--red2:#c1121f;--teal:#2a9d8f;--gold:#ffd166;--ink:#1d2b4f;--ui-h:205px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Fredoka',ui-rounded,'Segoe UI Rounded','Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,#4a5ba3 0%,#222c62 45%,#0d1330 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;
  height:100dvh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.06;
  background-image:radial-gradient(#fff 1.6px,transparent 2.2px),radial-gradient(#fff 1px,transparent 1.6px);
  background-size:48px 48px,24px 24px;background-position:0 0,12px 12px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- card frame ---------- */
.frame{position:relative;flex:none;width:min(96vw,1180px,calc((100dvh - var(--ui-h)) * 1.6));aspect-ratio:16/10;
  padding:clamp(6px,.9vw,11px);border-radius:clamp(18px,2.4vw,30px);
  background:repeating-linear-gradient(-45deg,var(--red) 0 16px,#fff 16px 32px);
  box-shadow:0 0 0 3px rgba(255,255,255,.3),0 26px 60px rgba(0,0,0,.55),0 0 90px rgba(255,209,102,.18)}
.frame.enter{animation:cardIn 1s cubic-bezier(.3,1.35,.55,1) both}
@keyframes cardIn{0%{transform:translateY(40px) scale(.55) rotate(-7deg);opacity:0}100%{transform:none;opacity:1}}
.frame.shake{animation:globe .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes globe{10%,90%{transform:translateX(-3px) rotate(-.6deg)}20%,80%{transform:translateX(6px) rotate(1deg)}30%,50%,70%{transform:translateX(-10px) rotate(-1.4deg)}40%,60%{transform:translateX(10px) rotate(1.4deg)}}
.holly{position:absolute;width:clamp(40px,6vw,76px);z-index:60;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.holly.tl{left:-14px;top:-16px;transform:rotate(-20deg)}
.holly.br{right:-14px;bottom:-16px;transform:rotate(160deg)}

.scene{position:relative;width:100%;height:100%;overflow:hidden;container-type:size;touch-action:none;--k:1;
  border-radius:clamp(12px,1.7vw,21px);
  background:linear-gradient(#081333 0%,#172a66 34%,#3c4795 58%,#7d6bb3 76%,#b996c9 92%)}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stars circle{animation:twk 3s ease-in-out infinite alternate}
@keyframes twk{0%{opacity:.15}100%{opacity:1}}
.stars path{animation:twk 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}

.aurora{position:absolute;left:-15%;right:-15%;top:2%;height:48%;pointer-events:none;mix-blend-mode:screen;opacity:.6}
.aurora i{position:absolute;border-radius:50%;animation:aur 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:2%;top:12%;width:55%;height:42%;background:radial-gradient(closest-side,rgba(80,255,190,.5),transparent)}
.aurora i:nth-child(2){left:42%;top:0;width:58%;height:52%;background:radial-gradient(closest-side,rgba(120,150,255,.5),transparent);animation-duration:19s;animation-delay:-7s}
.aurora i:nth-child(3){left:24%;top:24%;width:46%;height:36%;background:radial-gradient(closest-side,rgba(255,130,220,.35),transparent);animation-duration:11s;animation-delay:-3s}
@keyframes aur{0%{transform:translateX(-9%) scaleY(.75) skewX(-12deg)}100%{transform:translateX(11%) scaleY(1.25) skewX(12deg)}}

.moon{position:absolute;left:5%;top:8%;width:11.5%;aspect-ratio:1;cursor:pointer;z-index:2;
  filter:drop-shadow(0 0 1.6cqw rgba(255,240,180,.8));animation:moonf 9s ease-in-out infinite}
@keyframes moonf{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6%) rotate(4deg)}}
.moon svg{width:100%;height:100%;overflow:visible}
.moon .awake{display:none}.moon.wake .awake{display:inline}.moon.wake .sleep,.moon.wake .zz{display:none}
.moon .zz text{font:700 14px 'Fredoka',sans-serif;fill:#fff;animation:zz 3.6s ease-in infinite;opacity:0}
.moon .zz text:nth-child(2){animation-delay:1.2s}.moon .zz text:nth-child(3){animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(18px,-34px) scale(1.3)}}
.moon.wake{animation:moonf 9s ease-in-out infinite,wiggle .5s}

.sleigh{position:absolute;width:24%;z-index:5;display:none;pointer-events:none;transform:translate(-50%,-50%)}
.sleigh svg{width:100%;display:block;overflow:visible}
.sleigh .leg{animation:gallop .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
@keyframes gallop{0%{transform:rotate(-25deg)}100%{transform:rotate(30deg)}}

.hills .hit{pointer-events:auto;cursor:pointer}
.hills .pine,.hills .door,.hills .win{transform-box:fill-box;transform-origin:50% 100%}
.hills .pine.shk{animation:pshake .7s}
@keyframes pshake{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.hills .win .glass{transition:fill .3s}
.hills .win.off .glass{fill:#2b3767}
.hills .win:not(.off){filter:drop-shadow(0 0 6px #ffcf5c)}
.hills .smoke circle{animation:smoke 4.5s linear infinite;opacity:0;transform-box:fill-box;transform-origin:center}
.hills .smoke circle:nth-child(2){animation-delay:1.5s}.hills .smoke circle:nth-child(3){animation-delay:3s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.75}100%{opacity:0;transform:translate(-22px,-70px) scale(2.4)}}
.hills .rl circle{animation:bulbtw 1.3s steps(2) infinite}
.hills .rl circle:nth-child(odd){animation-delay:.65s}
@keyframes bulbtw{0%{opacity:1}100%{opacity:.35}}
.hills .door.knock{animation:knock .45s}
@keyframes knock{30%{transform:scale(1.06,.97)}60%{transform:scale(.98,1.02)}}

/* ---------- greeting ---------- */
.greet{position:absolute;top:10.5%;left:16%;right:16%;text-align:center;z-index:4;line-height:1;pointer-events:none}
.greet h1{font-weight:700;font-size:clamp(22px,6.4cqw,82px);letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.3em}
.greet .word{display:inline-flex;white-space:nowrap}
.greet .ch{display:inline-block;cursor:pointer;pointer-events:auto;color:var(--c);
  text-shadow:0 .045em 0 #fff,.045em 0 0 #fff,-.045em 0 0 #fff,0 -.045em 0 #fff,.032em .032em 0 #fff,-.032em .032em 0 #fff,.032em -.032em 0 #fff,-.032em -.032em 0 #fff,0 .13em 0 rgba(10,20,60,.35),0 0 .5em rgba(255,255,255,.35);
  animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.13s)}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.08em) rotate(3deg)}}
.greet .ch.jump{animation:jump .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes jump{0%{transform:none}35%{transform:translateY(-.4em) scale(1.25) rotate(-12deg)}100%{transform:none}}
.greet p{font-family:'Pacifico',cursive;font-size:clamp(11px,2.1cqw,26px);margin-top:.35em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);opacity:.95}

/* ---------- string lights ---------- */
.lights{position:absolute;left:0;right:0;top:0;height:12%;pointer-events:none;z-index:30}
.lights svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bulb{position:absolute;width:1.9cqw;min-width:10px;aspect-ratio:.66;pointer-events:auto;cursor:pointer;
  transform:translate(-50%,0) rotate(var(--r));transform-origin:50% 0}
.bulb::before{content:'';position:absolute;left:22%;right:22%;top:0;height:24%;background:#4d5a6b;border-radius:2px}
.bulb i{position:absolute;left:0;right:0;top:20%;bottom:0;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);
  box-shadow:0 0 .9cqw .2cqw var(--c),inset -2px -3px 0 rgba(0,0,0,.18);animation:glow 1.8s ease-in-out infinite alternate;animation-delay:var(--d)}
.bulb i::after{content:'';position:absolute;left:24%;top:16%;width:22%;height:30%;border-radius:50%;background:rgba(255,255,255,.75)}
@keyframes glow{0%{filter:brightness(.7) saturate(.9);opacity:.75}100%{filter:brightness(1.25);opacity:1}}
.bulb.ding{animation:ding .5s cubic-bezier(.3,1.6,.6,1)}
.bulb.ding i{animation:none;filter:brightness(1.8);box-shadow:0 0 2.6cqw .8cqw var(--c)}
@keyframes ding{0%{transform:translate(-50%,0) rotate(var(--r))}40%{transform:translate(-50%,0) rotate(calc(var(--r) + 28deg)) scale(1.3)}100%{transform:translate(-50%,0) rotate(var(--r))}}

/* ---------- items ---------- */
.items{position:absolute;inset:0;pointer-events:none;z-index:10}.items.drag{z-index:41}
.it.dragging.doom .fx{transform:scale(.55) rotate(-14deg);opacity:.7}
.it{position:absolute;width:calc(var(--s) * var(--k) * 1%);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;touch-action:none}
.it svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.it .fx,.it .rot,.it .idle{width:100%;height:100%}
.it .fx{transform-origin:50% 92%;transition:transform .18s,filter .18s;filter:drop-shadow(0 .35cqw .25cqw rgba(10,20,60,.22))}
.it.dragging{cursor:grabbing;z-index:999!important}
.it.dragging .fx{transform:scale(1.14) rotate(-5deg);filter:drop-shadow(0 1.6cqw 1cqw rgba(10,20,60,.3))}
.it.sel::before{content:'';position:absolute;inset:-7%;border:2.5px dashed rgba(255,255,255,.95);border-radius:22%;animation:selspin 8s linear infinite;pointer-events:none;box-shadow:0 0 12px rgba(255,255,255,.35)}
@keyframes selspin{to{transform:rotate(360deg)}}
.it.act>.fx{animation:squish .65s cubic-bezier(.3,1.5,.6,1)}
@keyframes squish{0%{transform:none}18%{transform:scale(1.18,.82)}42%{transform:scale(.9,1.12) translateY(-14%)}68%{transform:scale(1.05,.95)}100%{transform:none}}
.it.pop>.fx{animation:popin .55s cubic-bezier(.3,1.7,.6,1) both}
@keyframes popin{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.it.drop>.fx{animation:drop 1s both}
@keyframes drop{0%{transform:translateY(var(--fall)) rotate(-18deg);opacity:0;animation-timing-function:cubic-bezier(.5,0,.85,.6)}
  8%{opacity:1}55%{transform:translateY(0) scale(1.15,.8);animation-timing-function:ease-out}72%{transform:translateY(-12%) scale(.94,1.06);animation-timing-function:ease-in}86%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
.it.bye{pointer-events:none}
.it.bye>.fx{animation:bye .45s cubic-bezier(.6,-.4,.7,1) forwards}
@keyframes bye{to{transform:scale(0) rotate(160deg);opacity:0}}

.idle{animation-duration:3s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}
.idle.bob{animation-name:bob}.idle.sway{animation-name:sway;transform-origin:50% 95%}
.idle.swing{animation-name:swing;transform-origin:50% 4%}.idle.twinkle{animation-name:twinkle;animation-duration:1.6s}
.idle.waddle{animation-name:waddle;animation-duration:.9s;transform-origin:50% 95%}.idle.spinS{animation:spinS 14s linear infinite}
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-5%)}}
@keyframes sway{0%{transform:rotate(-2.5deg)}100%{transform:rotate(2.5deg)}}
@keyframes swing{0%{transform:rotate(-7deg)}100%{transform:rotate(7deg)}}
@keyframes twinkle{0%{transform:scale(1) rotate(-4deg);filter:brightness(1)}100%{transform:scale(1.08) rotate(4deg);filter:brightness(1.18) drop-shadow(0 0 6px #fff3b0)}}
@keyframes waddle{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
@keyframes spinS{to{transform:rotate(360deg)}}

.it .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.it:nth-child(2n) .eyes{animation-duration:5.3s;animation-delay:-2s}.it:nth-child(3n) .eyes{animation-duration:3.9s;animation-delay:-1s}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.it .hop,.it .lid,.it .nose,.it .spin,.it .clap{transform-box:fill-box;transform-origin:50% 100%}
.it.act .hop{animation:hop .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-16px) rotate(-10deg)}}
.it.act .lid{animation:lid .9s cubic-bezier(.3,1.5,.6,1)}
@keyframes lid{0%,100%{transform:none}30%{transform:translateY(-26px) rotate(-16deg)}62%{transform:translateY(-20px) rotate(10deg)}}
.it .nose{transform-origin:center}
.it.act .nose{animation:nose 1.1s}
@keyframes nose{0%,100%{transform:none;filter:none}25%,75%{transform:scale(1.45);filter:drop-shadow(0 0 5px #ff4d6d) brightness(1.4)}}
.it .spin{transform-origin:center}.it.act .spin{animation:spin .9s cubic-bezier(.3,1.3,.6,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.it .clap{transform-origin:50% 0;animation:clap 1.8s ease-in-out infinite alternate}.it.act .clap{animation:clap .14s 6 alternate}
@keyframes clap{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
.it .tl circle{animation:twk 1s ease-in-out infinite alternate}
.it .tl circle:nth-child(3n){animation-delay:-.4s}.it .tl circle:nth-child(3n+1){animation-delay:-.75s}
.it.act .tl circle{animation-duration:.15s}
.it .steam path{animation:steam 2.6s ease-in-out infinite;opacity:0}.it .steam path:nth-child(2){animation-delay:1.3s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}

/* ---------- in-scene UI ---------- */
.trash{position:absolute;left:2.2%;bottom:4%;width:clamp(46px,8cqw,86px);aspect-ratio:1;border-radius:50%;z-index:40;
  background:radial-gradient(circle at 40% 35%,#fff,#dfe8f8);display:grid;place-items:center;font-size:clamp(22px,4cqw,44px);
  box-shadow:0 6px 18px rgba(0,0,0,.35);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.6,1),background .2s;pointer-events:none}
.trash.show{transform:scale(1)}.trash.hot{transform:scale(1.3);background:radial-gradient(circle at 40% 35%,#ffe0e6,#ff8fa3)}
.seltools{position:absolute;z-index:45;display:none;transform:translate(-50%,-100%);gap:4px;padding:5px;border-radius:999px;
  background:rgba(20,30,70,.88);box-shadow:0 8px 20px rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.25)}
.seltools.show{display:flex;animation:popin .3s cubic-bezier(.3,1.6,.6,1)}
.seltools button{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);font-size:17px;font-weight:700;display:grid;place-items:center;transition:transform .15s}
.seltools button:hover{transform:scale(1.15)}.seltools button:active{transform:scale(.9)}
.seltools button.del{background:#ffccd5}
.hint{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);z-index:33;pointer-events:none;white-space:nowrap;
  background:#fff;color:var(--ink);padding:.45em 1.1em;border-radius:999px;font-weight:600;font-size:clamp(12px,1.7cqw,19px);
  box-shadow:0 6px 16px rgba(0,0,0,.3);animation:hintb 1.4s ease-in-out infinite;transition:opacity .5s}
.hint::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.hint.gone{opacity:0}
@keyframes hintb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}

.note{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);z-index:31;display:flex;align-items:center;gap:.35em;white-space:nowrap;
  background:linear-gradient(#ef4b59,#d62839);padding:.28em 1.2em .32em;border-radius:12px;font-weight:600;
  font-size:clamp(11px,1.75cqw,21px);box-shadow:0 5px 12px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.25)}
.note::before,.note::after{content:'';position:absolute;top:22%;width:1.4em;height:80%;background:#b5172b;z-index:-1}
.note::before{left:-.9em;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.note::after{right:-.9em;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.note input{font-family:'Pacifico',cursive;font-size:1.05em;color:#fff;background:transparent;border:0;border-bottom:2px dashed rgba(255,255,255,.65);
  padding:0 .15em;width:auto;min-width:2.5em;text-align:center;outline:none;touch-action:manipulation}
.note input:focus{border-bottom-color:var(--gold);background:rgba(255,255,255,.12);border-radius:6px 6px 0 0}
.note .hrt{display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* ---------- controls & tray ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none;position:relative;z-index:5}
.ctl{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 10px;border-radius:999px;background:linear-gradient(#fff,#e6eeff);color:var(--ink);
  font-weight:600;font-size:15px;box-shadow:0 4px 0 #9fb3d9,0 7px 14px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s,background .2s}
.ctl .ic{font-size:21px;line-height:1;display:inline-block;transition:transform .3s cubic-bezier(.3,1.6,.6,1)}
.ctl:hover .ic{transform:scale(1.2) rotate(-10deg)}
.ctl:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3d9,0 3px 6px rgba(0,0,0,.25)}
.ctl.on{background:linear-gradient(#ffe48f,#ffc53d);box-shadow:0 4px 0 #cf9500,0 7px 14px rgba(0,0,0,.28)}
.ctl.on:active{box-shadow:0 1px 0 #cf9500}
.tray{width:min(96vw,1180px);flex:none;display:flex;gap:10px;align-items:center;padding:7px 10px;position:relative;z-index:5;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs{display:flex;flex-direction:column;gap:5px;flex:none}
.tab{padding:5px 12px 5px 8px;border-radius:13px;background:rgba(255,255,255,.12);font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.tab:hover{background:rgba(255,255,255,.22)}
.tab.on{background:#fff;color:var(--ink);transform:scale(1.04)}
.tab .ic{font-size:18px}
.shelf{flex:1;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:7px 4px 9px;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
.titem{flex:none;width:80px;height:88px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#fff,#dde8fd);color:var(--ink);
  box-shadow:0 4px 0 #9fb3d9,0 8px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:grab;transition:transform .25s cubic-bezier(.3,1.6,.6,1);touch-action:pan-x;animation:popin .4s cubic-bezier(.3,1.6,.6,1) both}
.shelf>:first-child{margin-left:auto}.shelf>:last-child{margin-right:auto}
.titem svg{width:60px;height:60px;pointer-events:none;overflow:visible}
.titem span{font-size:11.5px;font-weight:600;margin-top:1px;pointer-events:none;opacity:.85}
.titem:hover{transform:translateY(-6px) rotate(-4deg) scale(1.06)}
.titem:active{transform:scale(.94)}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-6deg);filter:drop-shadow(0 14px 12px rgba(0,0,0,.35));transition:width .15s}
.ghost svg{width:100%;height:100%;overflow:visible}
.toast{position:fixed;left:50%;bottom:22px;z-index:95;transform:translate(-50%,calc(100% + 60px));background:#fff;color:var(--ink);font-weight:600;
  padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;transition:transform .4s cubic-bezier(.3,1.5,.6,1)}
.toast.show{transform:translate(-50%,0)}
.toast button{background:var(--red);color:#fff;padding:6px 14px;border-radius:999px;font-weight:600}

/* ---------- intro envelope ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);
  background:radial-gradient(ellipse at 50% 25%,#4a5ba3,#151d47 65%,#0b1029);transition:opacity .8s,visibility .8s;cursor:pointer;padding:20px;text-align:center}
#intro.gone{opacity:0;visibility:hidden}

// talking friends (speech synthesis, optional)
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
  voice=vs.find(v=>/^en/i.test(v.lang)&&/Samantha|Google US English|Jenny|Aria|Zira|Karen|Moira|Tessa|Female/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,pitch=1,rate=1){
  if(A.muted||!('speechSynthesis' in window)||!voice)return false;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.pitch=pitch;u.rate=rate;u.volume=.95;
    setTimeout(()=>speechSynthesis.speak(u),40);return true}catch(e){return false}
}

const Music={on:false,bpm:138,timer:null,ev:null,len:64,
  build(){
    const E=76,F=77,G=79,C=72,D=74,mel=[];
    const l1=[[E,1],[E,1],[E,2],[E,1],[E,1],[E,2],[E,1],[G,1],[C,1.5],[D,.5],[E,4]];
    const l2=[[F,1],[F,1],[F,1.5],[F,.5],[F,1],[E,1],[E,1],[E,.5],[E,.5],[E,1],[D,1],[D,1],[E,1],[D,2],[G,2]];
    const l4=[[F,1],[F,1],[F,1.5],[F,.5],[F,1],[E,1],[E,1],[E,.5],[E,.5],[G,1],[G,1],[F,1],[D,1],[C,4]];
    let b=0;[...l1,...l2,...l1,...l4].forEach(([m,d])=>{mel.push({b,k:'m',m,d});b+=d});
    const ch=['C','C','C','C','F','C','G','G','C','C','C','C','F','C','G','C'],R={C:[48,55],F:[53,48],G:[43,50]};
    ch.forEach((c,i)=>{mel.push({b:i*4,k:'b',m:R[c][0]},{b:i*4+2,k:'b',m:R[c][1]});
      [[60,64,67],[60,64,67],[60,64,67],[60,64,67],[60,65,69],[60,64,67],[59,62,67],[59,62,65],[60,64,67],[60,64,67],[60,64,67],[60,64,67],[60,65,69],[60,64,67],[59,62,67],[60,64,67]][i]
        .forEach(m=>{mel.push({b:i*4+1,k:'c',m},{b:i*4+3,k:'c',m})})});
    for(let i=0;i<64;i++)mel.push({b:i,k:'s',acc:i%2===0},{b:i+.5,k:'s',acc:false});
    this.ev=mel.sort((a,b)=>a.b-b.b);
  },
  start(){A.init();if(!A.ctx)return;if(!this.ev)this.build();this.on=true;this.i=0;this.loop=0;this.t0=A.t+.12;
    clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),40);this.tick()},
  stop(){this.on=false;clearInterval(this.timer)},
  tick(){const spb=60/this.bpm,look=A.t+.3;
    for(;;){const e=this.ev[this.i],t=this.t0+(this.loop*this.len+e.b)*spb;if(t>look)break;
      if(t>A.t-.05)this.play(e,Math.max(t,A.t),spb);
      if(++this.i>=this.ev.length){this.i=0;this.loop++}}},
  play(e,t,spb){const d=A.mus;
    if(e.k==='m'){const f=mtf(e.m),du=Math.max(.35,e.d*spb)+.35;A.osc(f,t,du,{vol:.24,dest:d});A.osc(f*2,t,.5,{vol:.06,dest:d});A.osc(f*3.01,t,.18,{vol:.03,dest:d,type:'triangle'})}
    else if(e.k==='b')A.osc(mtf(e.m),t,.42,{vol:.26,type:'triangle',dest:d});
    else if(e.k==='c')A.osc(mtf(e.m),t,.2,{vol:.045,type:'triangle',dest:d});
    else A.noise(t,e.acc?.09:.05,{vol:e.acc?.09:.045,type:'highpass',f:7500,dest:d});
  }
};

for(const k in ITEMS){const it=ITEMS[k];if(typeof it.svg==='function')it.svg=it.svg();it.html=`<svg viewBox="0 0 100 100" aria-hidden="true">${it.svg}</svg>`}
const CATS=[{n:'Friends',ic:'🐧'},{n:'Decorations',ic:'🎄'},{n:'Treats & Toys',ic:'🧸'}];

/* =================== SCENE SETUP =================== */
const scene=$('#scene'),layer=$('#items'),frame=$('#frame'),tools=$('#seltools'),trash=$('#trash'),moon=$('#moon');
const spark=(x,y,s)=>`M${x} ${y-s} Q${x} ${y} ${x+s} ${y} Q${x} ${y} ${x} ${y+s} Q${x} ${y} ${x-s} ${y} Q${x} ${y} ${x} ${y-s}Z`;
(()=>{let h='';
  for(let i=0;i<95;i++)h+=`<circle cx="${rnd(0,1000)|0}" cy="${rnd(0,340)|0}" r="${rnd(.6,2.2).toFixed(1)}" fill="#fff" style="animation-delay:${rnd(-4,0).toFixed(2)}s;animation-duration:${rnd(1.5,4).toFixed(1)}s"/>`;
  for(let i=0;i<12;i++)h+=`<path d="${spark(rnd(30,970)|0,rnd(20,290)|0,rnd(4,9)|0)}" fill="#fff8d6" style="animation-delay:${rnd(-2,0).toFixed(2)}s"/>`;
  $('#stars').innerHTML=h;
  let g='';for(let i=0;i<30;i++)g+=`<path d="${spark(rnd(0,1000)|0,rnd(496,620)|0,+rnd(2,5).toFixed(1))}" fill="${pick(['#fff','#bfe1ff','#fff3b8'])}" style="animation:twk ${rnd(1,2.6).toFixed(1)}s ease-in-out ${rnd(-3,0).toFixed(1)}s infinite alternate"/>`;
  $('#glit').innerHTML=g;
})();
function anim(el,cls,ms){el.classList.remove(cls);el.getBoundingClientRect();el.classList.add(cls);clearTimeout(el['_t'+cls]);el['_t'+cls]=setTimeout(()=>el.classList.remove(cls),ms)}
const center=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2,r]};

// greeting letters → musical!
(()=>{const h=$('#greet'),cols=['#e63946','#2a9d8f','#ff9f1c','#4361ee','#ff006e','#2db35f','#e63946','#7b2cbf'];let i=0;
  h.innerHTML='Happy Holidays!'.split(' ').map(w=>`<span class="word" aria-hidden="true">${[...w].map(c=>{const s=`<span class="ch" style="--i:${i};--c:${cols[i%cols.length]}" data-i="${i}">${c}</span>`;i++;return s}).join('')}</span>`).join('');
  h.addEventListener('pointerdown',e=>{const c=e.target.closest('.ch');if(!c)return;e.stopPropagation();A.init();anim(c,'jump',650);
    S.xylo(penta(+c.dataset.i,72));const[x,y]=center(c);burst(x,y-10,'stars',7)});
})();

// string of lights → a xylophone!
(()=>{const L=$('#lights'),cols=['#ff4d6d','#ffd166','#7bf1a8','#4cc9f0','#c77dff'];let wire='',b='',n=0;
  for(let s=0;s<3;s++){const x0=s*100/3,x1=(s+1)*100/3,xm=(x0+x1)/2;wire+=`<path d="M${x0} 6 Q${xm} 110 ${x1} 6" stroke="#29402f" stroke-width="2.2" fill="none" vector-effect="non-scaling-stroke"/>`;
    for(const t of[.12,.31,.5,.69,.88]){const x=(1-t)**2*x0+2*(1-t)*t*xm+t*t*x1,y=(1-t)**2*6+2*(1-t)*t*110+t*t*6;
      b+=`<button class="bulb" aria-label="Light ${n+1}" data-n="${n}" style="left:${x.toFixed(2)}%;top:${(y-2).toFixed(1)}%;--c:${cols[n%5]};--r:${(n%2?8:-8)+(t-.5)*-30}deg;--d:${(-n*.37).toFixed(2)}s"><i></i></button>`;n++}}
  L.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${wire}</svg>${b}`;
  L.addEventListener('pointerdown',e=>{const bl=e.target.closest('.bulb');if(!bl)return;e.stopPropagation();A.init();anim(bl,'ding',520);
    const f=penta(+bl.dataset.n,72);S.xylo(f,0,.2);S.bell(f*2,0,.04);const[x,y]=center(bl);burst(x,y+6,'stars',5,getComputedStyle(bl).getPropertyValue('--c'))});
})();

/* =================== STICKERS ON THE CARD =================== */
let items=[],sel=null;
const KEY='holiday-card-for-kids-v1';
const kMul=()=>parseFloat(getComputedStyle(scene).getPropertyValue('--k'))||1;
function mkItem(d){const def=ITEMS[d.t];if(!def)return null;
  const el=document.createElement('div');el.className='it';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',def.n);
  el.innerHTML=`<div class="fx"><div class="rot"><div class="idle ${def.idle||''}" style="animation-delay:${rnd(-3,0).toFixed(2)}s">${def.html}</div></div></div>`;
  const it={t:d.t,x:+d.x,y:+d.y,s:+d.s||def.sz,r:+d.r||0,f:d.f?1:0,el};items.push(it);layer.appendChild(el);place(it);return it}
function place(it){const st=it.el.style;st.left=it.x+'%';st.top=it.y+'%';st.setProperty('--s',it.s.toFixed(2));st.zIndex=10+Math.round(it.y*10);
  it.el.firstChild.firstChild.style.transform=`rotate(${it.r}deg) scaleX(${it.f?-1:1})`;if(it===sel)posTools()}
const SKY=new Set(['star','ornament','flake','bell','wreath','stocking']);
function randSpot(t){let x=rnd(8,92),y;
  if(SKY.has(t)&&t!=='stocking'&&t!=='wreath')y=rnd(26,50);else{y=rnd(72,88);if(y>83&&x>30&&x<70)y=rnd(72,80)}
  return{x,y}}
function addItem(t,x,y,how){
  if(items.length>=70){toast('Wow, your card is super full! 🎉');S.boing();return}
  const def=ITEMS[t],it=mkItem({t,x,y,s:def.sz*rnd(.92,1.08),r:0,f:Math.random()<.3?1:0});
  if(how==='drop'){const R=scene.getBoundingClientRect();it.el.style.setProperty('--fall',`${-(y/100*R.height+it.el.offsetHeight)}px`);anim(it.el,'drop',1050);S.whoosh(false);
    setTimeout(()=>{if(!it.el.isConnected)return;S.plop();const[cx,,r]=center(it.el);burst(cx,r.bottom-r.height*.1,'puff',8)},560)}
  else{anim(it.el,'pop',600);S.pop();setTimeout(()=>S.plop(),90);const[cx,cy,r]=center(it.el);burst(cx,r.bottom-r.height*.1,'puff',8);burst(cx,cy,'stars',8)}
  hideHint();save();return it}
function removeItem(it){items=items.filter(i=>i!==it);if(sel===it)deselect();it.el.classList.add('bye');S.swish();
  const[x,y]=center(it.el);burst(x,y,'puff',10);burst(x,y,'stars',6);setTimeout(()=>it.el.remove(),470);save()}
function tapItem(it){const def=ITEMS[it.t];anim(it.el,'act',950);def.snd&&def.snd();
  if(def.talk&&Math.random()<.8){const[txt,p,r]=pick(def.talk);say(txt,p,r||1)}

  if(!sleigh.ho&&p>.42){sleigh.ho=true;if(!say('Ho ho ho! Happy holidays!',.35,.85))S.hoho()}
  const r=sleighEl.getBoundingClientRect(),tx=d>0?r.left+r.width*.04:r.right-r.width*.04;
  for(let i=0;i<2;i++)P.push(mkP(tx,r.top+r.height*rnd(.55,.8),'trail',{vx:-d*rnd(.4,2),vy:rnd(-.4,1),c:pick(['#ffd166','#fff','#ff8fab','#7bf1a8','#4cc9f0'])}))}

/* =================== SNOW GLOBE SHAKE =================== */
function shakeGlobe(){A.init();anim(frame,'shake',820);globe=1;
  for(const f of flakes){f.vx=rnd(-9,9);f.vy=rnd(-14,-3)}
  const R=scene.getBoundingClientRect();
  for(let i=0;i<70;i++){const f=mkFlake();Object.assign(f,{x:rnd(R.left,R.right),y:rnd(R.top+R.height*.55,R.bottom),vx:rnd(-6,6),vy:rnd(-16,-4),z:rnd(.5,1)});flakes.push(f)}
  S.jingle(16);S.jingle(10,.35);S.magic();
  items.forEach((it,i)=>setTimeout(()=>anim(it.el,'act',950),120+i*45))}

/* =================== MAIN LOOP =================== */
let last=performance.now(),nextShoot=Infinity,nextIdle=Infinity,started=false;
function loop(now){const dt=Math.min(3,(now-last)/16.67);last=now;
  cx.clearRect(0,0,W,H);
  const tg=target();for(let i=0;i<3&&flakes.length<tg;i++)flakes.push(mkFlake());
  globe=Math.max(0,globe-.0055*dt);gust*=Math.pow(.985,dt);
  const wind=LEVELS[level].w+Math.sin(now*.00023)*.35+gust,pm=now-ptr.t<120;
  for(let i=flakes.length-1;i>=0;i--){const f=flakes[i];
    f.vx*=.965;f.vy*=.965;
    if(pm){const dx=f.x-ptr.x,dy=f.y-ptr.y,d2=dx*dx+dy*dy;if(d2<8100){const dd=Math.sqrt(d2)||1,k=(1-dd/90)*.6;f.vx+=dx/dd*k*1.6+ptr.vx*.05*k;f.vy+=dy/dd*k*1.6+ptr.vy*.05*k}}
    f.x+=(wind*(.4+f.z)+Math.sin(now*.0011+f.ph)*.45*f.z+f.vx)*dt;
    f.y+=((.5+f.z*1.5)*(1-globe*.85)+f.vy)*dt;f.rot+=f.vr*dt;
    if(f.y>H+14||f.x<-70||f.x>W+70){if(flakes.length>tg){flakes.splice(i,1);continue}
      Object.assign(f,mkFlake());if(wind>.9&&Math.random()<.45){f.x=-20;f.y=rnd(0,H*.8)}}
    cx.globalAlpha=.28+.65*f.z;
    if(f.c)rotDraw(f.c,f.x,f.y,8+f.z*10,f.rot);
    else{const s=f.r*(.55+f.z*1.1);cx.drawImage(DOT,f.x-s*1.6,f.y-s*1.6,s*3.2,s*3.2)}}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>=p.max){P.splice(i,1);continue}
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const lf=1-p.life/p.max;cx.globalAlpha=Math.min(1,lf*1.7);
    switch(p.k){
      case'stars':case'trail':cx.fillStyle=p.c;star4(p.x,p.y,p.s*(.35+lf*.65));break;
      case'confetti':{p.flip+=.2*dt;const c=Math.cos(p.rot)*DPR,s=Math.sin(p.rot)*DPR,sy=Math.cos(p.flip);
        cx.setTransform(c,s,-s*sy,c*sy,p.x*DPR,p.y*DPR);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6);cx.setTransform(DPR,0,0,DPR,0,0);break}
      case'puff':cx.globalAlpha=lf*.75;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,p.s*(1+(1-lf)*1.3),0,7);cx.fill();break;
      case'snowdot':cx.drawImage(DOT,p.x-p.s*1.6,p.y-p.s*1.6,p.s*3.2,p.s*3.2);break;
      case'heart':cx.fillStyle=p.c;heartP(p.x+Math.sin(p.life*.15)*3,p.y,p.s*.62);break;
      case'note':cx.font=`700 ${p.s|0}px Fredoka,sans-serif`;cx.textAlign='center';cx.lineWidth=3;cx.strokeStyle='rgba(20,30,70,.35)';
        cx.strokeText(p.ch,p.x+Math.sin(p.life*.12)*4,p.y);cx.fillStyle=p.c;cx.fillText(p.ch,p.x+Math.sin(p.life*.12)*4,p.y);break;
      case'crumb':cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();break;
      case'flake':rotDraw(CRYS[i%3],p.x,p.y,p.s*2,p.rot);break;
      case'shoot':{const tx=p.x-p.vx*13,ty=p.y-p.vy*13,gr=cx.createLinearGradient(p.x,p.y,tx,ty);
        gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(1,'rgba(255,250,220,0)');cx.strokeStyle=gr;cx.lineWidth=2.6;cx.lineCap='round';
        cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(tx,ty);cx.stroke();cx.drawImage(DOT,p.x-9,p.y-9,18,18);
        if(Math.random()<.5)P.push(mkP(p.x,p.y,'trail',{vx:rnd(-.4,.4),vy:rnd(-.3,.5),c:'#fff6c8'}));break}}}
  cx.globalAlpha=1;
  if(started&&now>nextShoot){nextShoot=now+rnd(5000,11000);const R=scene.getBoundingClientRect(),d=pick([1,-1]);
    shoot(R.left+R.width*(d>0?rnd(.08,.45):rnd(.55,.92)),R.top+R.height*rnd(.04,.2),d)}
  if(started&&now>nextIdle){nextIdle=now+rnd(2200,4500);const c=items.filter(i=>ITEMS[i.t].c===0&&i!==sel);if(c.length)anim(pick(c).el,'act',950)}
  updSleigh(now);
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* =================== CONTROLS =================== */
const bMusic=$('#bMusic'),bSound=$('#bSound'),bSnow=$('#bSnow');
const setSnowUI=()=>{$('#snowLb').textContent=LEVELS[level].n;bSnow.querySelector('.ic').textContent=LEVELS[level].ic};setSnowUI();
bMusic.onclick=()=>{A.init();if(Music.on)Music.stop();else Music.start();bMusic.classList.toggle('on',Music.on);bMusic.setAttribute('aria-pressed',Music.on);
  if(Music.on){const[x,y]=center(bMusic);burst(x,y,'note',7)}};
bSnow.onclick=()=>{A.init();level=(level+1)%3;setSnowUI();S.magic();gust=level===2?2.5:0;toast(LEVELS[level].ic+' '+LEVELS[level].n);
  const[x,y]=center(bSnow);burst(x,y,'flake',8)};
$('#bSleigh').onclick=flySleigh;
$('#bShake').onclick=shakeGlobe;
$('#bSurprise').onclick=()=>{A.init();const keys=Object.keys(ITEMS),n=Math.min(5,70-items.length);
  if(n<=0){toast('Wow, your card is super full! 🎉');return}
  for(let i=0;i<n;i++)setTimeout(()=>{const t=pick(keys),p=randSpot(t);addItem(t,p.x,p.y,'drop')},i*230);
  setTimeout(()=>{S.tada();const R=scene.getBoundingClientRect();for(let i=0;i<5;i++)burst(R.left+R.width*(i+.5)/5,R.top+R.height*.15,'confetti',16)},n*230+450)};
$('#bClear').onclick=()=>{A.init();if(!items.length){toast('The card is already empty! ✨');return}
  const snap=items.map(({t,x,y,s,r,f})=>({t,x,y,s,r,f})),old=items;deselect();items=[];
  old.forEach((it,i)=>setTimeout(()=>{it.el.classList.add('bye');const[x,y]=center(it.el);burst(x,y,'puff',4);setTimeout(()=>it.el.remove(),470)},i*35));
  S.whoosh();save();
  toast('All clean! ✨',()=>{items.forEach(i=>i.el.remove());items=[];snap.forEach(d=>{const it=mkItem(d);if(it)anim(it.el,'pop',600)});S.arpUp();save()})};
bSound.onclick=()=>{A.init();A.muted=!A.muted;if(A.out)A.out.gain.setTargetAtTime(A.muted?0:.9,A.t,.05);
  if(A.muted&&'speechSynthesis' in window)speechSynthesis.cancel();
  bSound.querySelector('.ic').textContent=A.muted?'🔇':'🔊';bSound.querySelector('.lb').textContent=A.muted?'Muted':'Sound';
  bSound.setAttribute('aria-pressed',!A.muted);bSound.classList.toggle('on',A.muted);if(!A.muted)S.pop()};

/* =================== OPEN THE CARD =================== */
const intro=$('#intro');intro.tabIndex=0;
function openCard(){if(intro.classList.contains('open'))return;A.init();intro.classList.add('open');S.pop();
  setTimeout(()=>S.whoosh(),280);
  setTimeout(()=>{S.tada();const[x,y]=center($('.env'));burst(x,y,'confetti',100);burst(x,y,'stars',24)},850);
  setTimeout(()=>{intro.classList.add('gone');frame.classList.add('enter');started=true;S.jingle(12);
    nextShoot=performance.now()+2500;nextIdle=performance.now()+3000;
    $$('#greet .ch').forEach((c,i)=>setTimeout(()=>{anim(c,'jump',650);S.xylo(penta(i,72),0,.12)},500+i*85))},1550);
  setTimeout(()=>frame.classList.remove('enter'),2700)}
intro.addEventListener('click',openCard);
intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard()}});
intro.focus({preventScroll:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Music.on){Music.stop();bMusic.classList.remove('on')}});
})();
</script>
</body>
