<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Dunkability Simulator</title>
<meta name="description" content="Simulate how long classic biscuits survive a dunk in hot tea.">
<meta name="theme-color" content="#0B1638">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Young+Serif&display=swap" rel="stylesheet">
<script>
  (function () { try { var t = localStorage.getItem('tds-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
@property --soak { syntax: '<percentage>'; inherits: true; initial-value: 0%; }

:root {
  --font-ui: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Young Serif', 'Iowan Old Style', Georgia, serif;
  --r-xl: 30px; --r-l: 22px; --r-m: 14px; --r-s: 10px;
  --cobalt-paint: #2546A6;
  --tea-hi: #DDA466; --tea: #AD6A31; --tea-deep: #6B3814;
  --stage-h: min(540px, 64vh);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-0: #08112E; --bg-1: #10205A;
  --glow-a: rgba(222, 150, 60, .20); --glow-b: rgba(64, 98, 235, .36); --glow-c: rgba(126, 92, 214, .22);
  --pattern-ink: #A9BCFF; --pattern-alpha: .06;
  --ink: #EEF2FC; --ink-2: #BAC5E6; --ink-3: #8F9CC6;
  --glass-1: rgba(168, 190, 255, .12); --glass-2: rgba(120, 146, 230, .05);
  --glass-border: rgba(196, 212, 255, .16); --glass-hi: rgba(255, 255, 255, .13);
  --card-shadow: 0 30px 60px -30px rgba(1, 4, 24, .85), 0 2px 6px rgba(1, 4, 24, .25);
  --chip-bg: rgba(20, 34, 84, .55); --hud-bg: rgba(10, 20, 56, .52); --stat-bg: rgba(10, 20, 56, .38);
  --btn-bg: rgba(170, 192, 255, .08); --btn-bg-hover: rgba(170, 192, 255, .17);
  --seg-on: #EEF2FC; --seg-on-ink: #0F1E4E;
  --track-solid: #263769; --track: rgba(190, 206, 255, .14);
  --thumb: #F4F6FC; --thumb-ring: #0F1E4E;
  --focus: #FFD08A;
  --kbd-bg: rgba(190, 206, 255, .10); --kbd-border: rgba(190, 206, 255, .24);
  --jam: #E45C72; --sky: #3A9FD8; --sage: #6CC59A; --amber: #E7A646;
  --jam-ink: #FF9DAD; --sage-ink: #93E2B9; --amber-ink: #FFCB7D;
  --grid: rgba(190, 206, 255, .10); --axis: rgba(190, 206, 255, .30); --ring: #17275E;
  --por-hi: #F4F7FD; --por-mid: #CED7EA; --por-lo: #7F8CB6; --por-inner-a: #93A0C6; --por-inner-b: #E3E9F5;
  --steel-a: #59648A; --steel-b: #E3E8F5; --steel-c: #6F7AA0;
  --steam: 236, 241, 255; --steam-alpha: 1; --divider: rgba(196, 212, 255, .16);
  --scene-floor: rgba(3, 8, 32, .55); --scene-light: rgba(255, 184, 100, .12);
  --toast-bg: rgba(16, 30, 80, .82);
  --modal-scrim: rgba(3, 8, 28, .55);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg-0: #E6ECF8; --bg-1: #F7F9FE;
  --glow-a: rgba(236, 168, 82, .28); --glow-b: rgba(88, 126, 236, .22); --glow-c: rgba(160, 128, 236, .16);
  --pattern-ink: #2546A6; --pattern-alpha: .075;
  --ink: #12204D; --ink-2: #3B4A7C; --ink-3: #5D6C9C;
  --glass-1: rgba(255, 255, 255, .74); --glass-2: rgba(255, 255, 255, .46);
  --glass-border: rgba(255, 255, 255, .9); --glass-hi: rgba(255, 255, 255, .95);
  --card-shadow: 0 24px 50px -28px rgba(30, 50, 120, .38), 0 1px 3px rgba(30, 50, 120, .08);
  --chip-bg: rgba(255, 255, 255, .72); --hud-bg: rgba(255, 255, 255, .62); --stat-bg: rgba(255, 255, 255, .58);
  --btn-bg: rgba(255, 255, 255, .62); --btn-bg-hover: rgba(255, 255, 255, .98);
  --seg-on: #12204D; --seg-on-ink: #FFFFFF;
  --track-solid: #D3DBEE; --track: rgba(30, 50, 120, .10);
  --thumb: #FFFFFF; --thumb-ring: #12204D;
  --focus: #2546A6;
  --kbd-bg: rgba(255, 255, 255, .85); --kbd-border: rgba(30, 50, 120, .2);
  --jam: #C42F4A; --sky: #2A7FC0; --sage: #2E8F62; --amber: #B97814;
  --jam-ink: #A3223A; --sage-ink: #1F6E4A; --amber-ink: #8A5606;
  --grid: rgba(30, 50, 120, .09); --axis: rgba(30, 50, 120, .32); --ring: #FFFFFF;
  --por-hi: #FFFFFF; --por-mid: #DCE3F2; --por-lo: #8593BD; --por-inner-a: #A3B0D3; --por-inner-b: #EEF2FA;
  --steel-a: #66708F; --steel-b: #F3F5FB; --steel-c: #7E88A9;
  --steam: 150, 166, 205; --steam-alpha: .75; --divider: rgba(30, 50, 120, .10);
  --scene-floor: rgba(40, 60, 130, .16); --scene-light: rgba(255, 190, 110, .2);
  --toast-bg: rgba(255, 255, 255, .9);
  --modal-scrim: rgba(40, 56, 110, .25);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5; color: var(--ink);
  background: var(--bg-0); min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
.backdrop {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1000px 640px at 50% 16%, var(--glow-a), transparent 62%),
    radial-gradient(900px 720px at -4% 104%, var(--glow-b), transparent 62%),
    radial-gradient(760px 620px at 104% 58%, var(--glow-c), transparent 62%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0) 70%);
}
.backdrop::after {
  content: ''; position: absolute; inset: 0; background: var(--pattern-ink); opacity: var(--pattern-alpha);
  -webkit-mask: var(--pattern) 0 0 / 176px 176px repeat; mask: var(--pattern) 0 0 / 176px 176px repeat;
}
#crumbs { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#root { position: relative; z-index: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { max-width: 1480px; margin: 0 auto; padding: clamp(14px, 2.2vw, 28px) clamp(12px, 2.4vw, 32px) 32px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .35)); }
.title {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 3.5vw, 50px);
  line-height: 1.04; letter-spacing: -0.012em; margin: 0; padding-bottom: .06em;
  background: linear-gradient(180deg,
    var(--ink) 0%, var(--ink) calc(100% - var(--soak)),
    var(--tea-hi) calc(100% - var(--soak) + 2%), var(--tea) calc(100% - var(--soak) + 22%), var(--tea-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  transition: --soak .55s ease;
}
.tagline { margin: 4px 0 0; color: var(--ink-2); font-size: 15.5px; max-width: 58ch; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.layout {
  display: grid; gap: 18px; align-items: stretch;
  grid-template-columns: minmax(290px, 330px) minmax(0, 1fr) minmax(282px, 322px);
  grid-template-areas: "controls scene verdict" "graph graph league" "log log keys";
}
.a-controls { grid-area: controls; } .a-scene { grid-area: scene; } .a-verdict { grid-area: verdict; }
.a-graph { grid-area: graph; } .a-league { grid-area: league; } .a-log { grid-area: log; display: flex; flex-direction: column; } .a-log .empty { flex: 1; } .a-keys { grid-area: keys; }

/* ---------- glass ---------- */
.card {
  position: relative; min-width: 0; padding: 20px 22px 22px; border-radius: var(--r-l);
  background: linear-gradient(160deg, var(--glass-1), var(--glass-2));
  border: 1px solid var(--glass-border);
  box-shadow: var(--card-shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
}
.card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, .07), transparent 38%);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.15; margin: 0; }
.card-head .sub { display: block; color: var(--ink-3); font-size: 13.5px; margin-top: 3px; max-width: 62ch; }

/* ---------- buttons & keys ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  border-radius: 12px; border: 1px solid var(--glass-border); background: var(--btn-bg);
  font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap;
  transition: background .15s ease, transform .1s ease;
}
.btn:hover { background: var(--btn-bg-hover); }
.btn:active { transform: translateY(1px); }
.btn.icon { width: 38px; padding: 0; justify-content: center; }
.btn.small { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--btn-bg); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[aria-pressed="true"].toggle { background: var(--btn-bg-hover); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--btn-bg); border: 1px solid var(--glass-border); }
.seg button {
  height: 30px; min-width: 38px; padding: 0 9px; border: 0; border-radius: 9px; background: transparent;
  font-weight: 600; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-ink); }
kbd {
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 700; line-height: 1;
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 6px; background: var(--kbd-bg); border: 1px solid var(--kbd-border); border-bottom-width: 2px;
  color: var(--ink-2);
}
.keys { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; color: var(--ink-3); }

/* ---------- controls ---------- */
.controls { display: flex; flex-direction: column; gap: 18px; }
.controls .card-head { margin-bottom: -2px; }
.slider { display: grid; gap: 6px; }
.slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.slider-label { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.slider-value { font-family: var(--font-display); font-size: 25px; line-height: 1; white-space: nowrap; }
.slider-value.name { font-size: 20px; }
.slider-value small { font-family: var(--font-ui); font-size: 13px; color: var(--ink-3); margin-left: 3px; font-weight: 600; }
.slider-note { font-size: 13px; color: var(--ink-3); min-height: 1.45em; }
.range-wrap { position: relative; height: 26px; --spectrum: linear-gradient(90deg, var(--ink-3), var(--ink-2)); }
.range-wrap.has-marks { height: 42px; }
.range-track { position: absolute; left: 0; right: 0; top: 9px; height: 8px; border-radius: 99px; background: var(--track-solid); overflow: hidden; }
.range-fill { position: absolute; inset: 0; background: var(--spectrum); clip-path: inset(0 calc(100% - 11px - (100% - 22px) * var(--p)) 0 0); }
.sp-temp { --spectrum: linear-gradient(90deg, #3A9FD8, #E7A646 62%, #E45C72); }
.sp-dunk { --spectrum: linear-gradient(90deg, #EAD1A0, #B5743A 55%, #5E2E0C); }
.sp-biscuit { --spectrum: linear-gradient(90deg, #E9C990, #C8935A 50%, #6B3B22); }
.sp-integ { --spectrum: linear-gradient(90deg, #E45C72, #E7A646 45%, #6CC59A); }
.range-wrap input[type=range] {
  position: absolute; left: 0; top: 0; width: 100%; height: 26px; margin: 0; z-index: 3;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: 26px; background: transparent; border: 0; }
input[type=range]::-moz-range-track { height: 26px; background: transparent; border: 0; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%;
  background: var(--thumb); border: 3px solid var(--thumb-ring);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .35), 0 3px 10px rgba(0, 0, 0, .35); transition: transform .12s ease;
}
input[type=range]::-moz-range-thumb {
  box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%;
  background: var(--thumb); border: 3px solid var(--thumb-ring); box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--focus), 0 3px 10px rgba(0, 0, 0, .35); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--focus); }
.zone-broken {
  position: absolute; top: 9px; height: 8px; right: 0; z-index: 2; border-radius: 0 99px 99px 0;
  background: repeating-linear-gradient(135deg, var(--jam) 0 3px, transparent 3px 6px); opacity: .9;
}
.mark-best { position: absolute; top: 4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 3px; background: var(--sage); box-shadow: 0 0 0 2px var(--track-solid); z-index: 2; }
.mark-label { position: absolute; top: 27px; font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 1; }
.mark-label.best { color: var(--sage-ink); transform: translateX(-50%); }
.mark-label.broken { color: var(--jam-ink); }
.stop { position: absolute; top: 11px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255, 255, 255, .55); z-index: 2; }
.biscuit-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 2px 0 2px; }
.bchip {
  display: grid; place-items: center; height: 40px; padding: 0; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; background: transparent; transition: background .15s, transform .15s;
}
.bchip:hover { background: var(--btn-bg); }
.bchip.on { background: var(--btn-bg-hover); border-color: var(--glass-border); }
.bchip svg { width: 30px; height: 30px; }
.presets-title { font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .btn { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 99px; }
.controls .spacer { flex: 1; }

/* ---------- scene ---------- */
.scene-card { padding: 0; border-radius: var(--r-xl); display: flex; flex-direction: column; overflow: hidden; }
.scene-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 8px; z-index: 3; pointer-events: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 99px;
  background: var(--chip-bg); border: 1px solid var(--glass-border); font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.chip svg { width: 14px; height: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sage) 25%, transparent); }
.dot.paused { background: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent); }
.stage-wrap {
  position: relative; flex: 1; display: grid; place-items: center; padding: 26px 12px 4px;
  background:
    radial-gradient(46% 42% at 50% 46%, var(--scene-light), transparent 72%),
    radial-gradient(70% 26% at 50% 96%, var(--scene-floor), transparent 72%);
}
.stage { position: relative; width: min(100%, calc(var(--stage-h) * 400 / 420)); aspect-ratio: 400 / 420; }
.stage svg, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas { pointer-events: none; }
.float-score {
  position: absolute; left: 71%; top: 16%; font-family: var(--font-display); font-size: clamp(22px, 3vw, 32px);
  color: var(--sage-ink); opacity: 0; pointer-events: none; text-shadow: 0 2px 14px rgba(0, 0, 0, .35); white-space: nowrap;
}
.float-score[data-tone="critical"] { color: var(--jam-ink); }
.float-score[data-tone="warn"] { color: var(--amber-ink); }
.float-score[data-tone="neutral"] { color: var(--ink-2); }
.float-score.go { animation: floatUp 1.6s ease-out forwards; }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(12px) scale(.9); }
  14% { opacity: 1; transform: translateY(0) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-28px); }
}
.hud {
  position: relative; z-index: 2; margin: 0 14px 14px; padding: 12px 16px; border-radius: 18px;
  background: var(--hud-bg); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  display: grid; grid-template-columns: minmax(118px, auto) minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 62px;
}
.hud-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.hud-label .tone-ico { display: none; width: 18px; height: 18px; }
.hud-label .tone-ico svg { display: none; width: 18px; height: 18px; }
.hud[data-mode="result"] .tone-ico { display: inline-grid; }
.hud[data-tone="good"] .hud-label { color: var(--sage-ink); } .hud[data-tone="good"] .ti-good { display: block; }
.hud[data-tone="warn"] .hud-label { color: var(--amber-ink); } .hud[data-tone="warn"] .ti-warn { display: block; }
.hud[data-tone="critical"] .hud-label { color: var(--jam-ink); } .hud[data-tone="critical"] .ti-critical { display: block; }
.hud[data-tone="neutral"] .hud-label { color: var(--ink); } .hud[data-tone="neutral"] .ti-neutral { display: block; }
.hud-mid { position: relative; min-width: 0; }
.hud-bar { position: relative; height: 8px; border-radius: 99px; background: var(--track); }
.hud-bar i { position: absolute; inset: 0; border-radius: 99px; background: linear-gradient(90deg, #EAD1A0, var(--tea)); transform-origin: 0 50%; transform: scaleX(0); }
.hud-bar i.over { background: linear-gradient(90deg, var(--tea), var(--jam)); }
.hud-bar b { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--jam); display: none; }
.hud-line { margin: 0; font-size: 13.5px; color: var(--ink-2); display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud[data-mode="result"] .hud-bar { display: none; }
.hud[data-mode="result"] .hud-line { display: block; }
.hud-nums { display: grid; justify-items: end; font-size: 12.5px; color: var(--ink-3); line-height: 1.35; white-space: nowrap; min-width: 112px; }
.hud-nums span:last-child { color: var(--ink); font-weight: 700; font-size: 13.5px; }

/* ---------- verdict ---------- */
.verdict { display: flex; flex-direction: column; }
.score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.score { display: flex; align-items: baseline; }
.score-num { font-family: var(--font-display); font-size: 86px; line-height: .86; letter-spacing: -0.03em; min-width: 1.2ch; }
.score-den { font-size: 16px; color: var(--ink-3); margin-left: 6px; font-weight: 600; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 9px; border-radius: 99px;
  font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--tone-ink);
  background: color-mix(in srgb, var(--tone) 16%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 42%, transparent);
}
.badge svg { width: 16px; height: 16px; flex: none; }
.badge.sm { height: 24px; font-size: 12px; padding: 0 9px 0 7px; gap: 5px; }
.badge.sm svg { width: 13px; height: 13px; }
.tone-good { --tone: var(--sage); --tone-ink: var(--sage-ink); }
.tone-warn { --tone: var(--amber); --tone-ink: var(--amber-ink); }
.tone-critical { --tone: var(--jam); --tone-ink: var(--jam-ink); }
.tone-neutral { --tone: var(--sky); --tone-ink: var(--ink-2); }
.verdict-line { margin: 12px 0 0; font-size: 15px; color: var(--ink-2); min-height: 3em; }
.best-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  margin-top: 14px; padding: 10px 12px; border-radius: 14px; background: var(--stat-bg); border: 1px solid var(--glass-border);
  font-size: 13px; color: var(--ink-2);
}

/* ---------- verdict ---------- */

    ['Breaks at', tc !== null ? html`${fmt(tc)}<small>s</small>` : 'Holds past 40 s'],
    ['Flavour release', html`×${e.flavour.toFixed(1)}`],
    ['Tea absorbed', html`${e.absorbed.toFixed(1)}<small>g</small>`],
    ['Wicking rate', html`${e.k.toFixed(2)}<small>mm²/s</small>`],
    ['Tea viscosity', html`${viscosity(T).toFixed(3)}<small>mPa·s</small>`],
    b.coat ? ['Chocolate support', pct(e.choc)] : ['Surface tension', html`${surfaceTension(T).toFixed(1)}<small>mN/m</small>`],
  ];

/* ---------- the dunking rig ---------- */

  pts.push([150, y0]);

  const line = pts.slice(1, -1).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const upper = 'M-150,-90L150,-90' + rev.map(p => `L${p[0].toFixed(1)},${(p[1] + 1.4).toFixed(1)}`).join('') + 'Z';
  const lower = 'M-150,420L150,420' + rev.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('') + 'Z';

  const pillX = clamp(x(dunk), m.l + 40, W - m.r + 30);
  const yTicks = [0, .25, .5, .75, 1], xTicks = [0, 5, 10, 15, 20, 25, 30, 35, 40];
  const summary = `Crumble-o-meter for ${b.name} in ${T} °C tea. ${tc !== null ? `Breaks at ${fmt(tc)} seconds.` : 'Does not break within 40 seconds.'} Best dunk ${fmt(an.tBest)} seconds. Your dunk ${fmt(dunk)} seconds.`;
  let tip = null;
  if (hv && !table) {
    const tx = x(hv.t), flip = tx > W - 200, gone = tc !== null && hv.t >= tc;
    tip = html`<div className="tip" style=${{ left: flip ? tx - 14 : tx + 14, top: m.t, transform: flip ? 'translateX(-100%)' : 'none' }}>
      <div className="tip-t">At ${fmt(hv.t)} s</div>
      <div className="tip-row"><i className="sw" />Crumble-o-meter<b>${gone ? 'Broken' : pct(hv.crumble)}</b></div>
      <div className="tip-row"><i className="sw soft" />Softness<b>${pct(hv.s)}</b></div>
      <div className="tip-row"><i className="sw none" />Dunkability<b>${Math.round(hv.score)}</b></div>
      ${gone && html`<div className="tip-warn">The biscuit has broken by now</div>`}
      <div className="tip-hint">Click or drag to set the dunk time</div>
    </div>`;
  }
  return html`<section className="card graph-card a-graph" aria-labelledby="graph-title">
    <div className="card-head">
      <div><h2 id="graph-title">Crumble-o-meter</h2><span className="sub">How close the ${b.name} is to breaking at each second of the dunk. At 100% the wet half tears off.</span></div>
      <button className="btn small ghost toggle" aria-pressed=${table} onClick=${() => setTable(v => !v)}>${table ? 'Show graph' : 'Show table'}</button>
    </div>
    ${!table && html`<div className="legend">
      <span className="lg"><i className="lg-line" />Crumble-o-meter</span>
      <span className="lg"><i className="lg-line dash" />Softness</span>
      <span className="lg"><i className="lg-box" />Best window</span>
      <span className="lg"><i className="lg-box hatch" />Broken</span>
    </div>`}
    <div className="graph-wrap" ref=${wrapRef}>
      ${table ? html`<${GraphTable} an=${an} dunk=${dunk} />` : html`<svg ref=${svgRef} width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${summary}>
        <defs>
          <linearGradient id="gr-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" className="st-jam" stopOpacity=".26" /><stop offset="1" className="st-jam" stopOpacity="0" /></linearGradient>
          <pattern id="gr-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" className="f-jam-faint" /><line x1="0" y1="0" x2="0" y2="7" className="s-jam" strokeWidth="2" /></pattern>
          <clipPath id="gr-clip"><rect x=${m.l} y=${m.t - 3} width=${iw} height=${ih + 6} /></clipPath>
        </defs>
        ${yTicks.map(v => html`<line key=${'g' + v} className=${v === 0 ? 'g-axis' : 'g-grid'} x1=${m.l} x2=${m.l + iw} y1=${y(v)} y2=${y(v)} />`)}
        ${[0, .5, 1].map(v => html`<text key=${'y' + v} className="g-tick" x=${m.l - 8} y=${y(v) + 4} textAnchor="end">${v * 100}%</text>`)}
        ${xTicks.map(t => html`<text key=${'x' + t} className="g-tick" x=${x(t)} y=${H - m.b + 18} textAnchor="middle">${t === 40 ? '40 s' : t}</text>`)}
        <rect className="g-best" x=${x(an.winStart)} y=${m.t} width=${Math.max(2, x(an.winEnd) - x(an.winStart))} height=${ih} rx="3" />
        ${x(an.winEnd) - x(an.winStart) > 54 && html`<text className="g-zone-label g-best-t" x=${(x(an.winStart) + x(an.winEnd)) / 2} y=${y(0) - 8} textAnchor="middle">Best window</text>`}
        ${tc !== null && html`<rect x=${x(tc)} y=${m.t} width=${x(T_MAX) - x(tc)} height=${ih} fill="url(#gr-hatch)" />`}
        ${tc !== null && x(T_MAX) - x(tc) > 50 && html`<text className="g-zone-label g-broken-t" x=${x(tc) + 8} y=${m.t + 16}>Broken</text>`}
        <line className="g-limit" x1=${m.l} x2=${m.l + iw} y1=${y(1)} y2=${y(1)} />
        <g clipPath="url(#gr-clip)">
          <path d=${paths.area} fill="url(#gr-area)" />
          <path d=${paths.s} className="ln-soft" />
          <path d=${paths.c} className="ln-crumble" />
        </g>
        <text className="g-label" x=${x(T_MAX) + 10} y=${lc + 4}>Crumble</text>
        <text className="g-label" x=${x(T_MAX) + 10} y=${ls + 4}>Softness</text>
        ${hv && html`<g><line className="g-hover" x1=${x(hv.t)} x2=${x(hv.t)} y1=${m.t} y2=${y(0)} />
          <circle className="g-dot-s" cx=${x(hv.t)} cy=${y(hv.s)} r="4" /><circle className="g-dot-c" cx=${x(hv.t)} cy=${y(hv.crumble)} r="4" /></g>`}
        <line className="g-dunk" x1=${x(dunk)} x2=${x(dunk)} y1=${m.t - 6} y2=${y(0)} />
        <circle className="g-dot-s" cx=${x(dunk)} cy=${y(de.s)} r="5" />
        <circle className="g-dot-c" cx=${x(dunk)} cy=${y(de.crumble)} r="5" />
        <g transform=${`translate(${pillX} ${m.t - 18})`}>
          <rect className="g-pill" x="-45" y="-11" width="90" height="22" rx="11" />
          <text className="g-pill-t" y="4" textAnchor="middle">Dunk ${fmt(dunk)} s</text>
        </g>
        <line ref=${liveLine} className="g-live" x1=${m.l} x2=${m.l} y1=${m.t} y2=${y(0)} style=${{ opacity: 0 }} />
        <circle ref=${liveDot} className="g-live-dot" cx=${m.l} cy=${y(0)} r="5" style=${{ opacity: 0 }} />
        <rect className="g-hit" x=${m.l - 6} y=${m.t - 30} width=${iw + 12} height=${ih + 30 + m.b}
          onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp} onPointerLeave=${onLeave} />
      </svg>`}
      ${tip}
    </div>
  </section>`;
}

/* ---------- league ---------- */
function League({ T, I, bi, onPick }) {
  const rows = useMemo(() => BISCUITS.map((b, i) => ({ b, i, an: analyse(b, T, I) })).sort((p, q) => q.an.bestScore - p.an.bestScore), [T, I]);
  const p = t => (t / T_MAX * 100).toFixed(2) + '%';
  return html`<section className="card a-league" aria-labelledby="league-title">
    <div className="card-head"><div><h2 id="league-title">Biscuit league</h2><span className="sub">Best possible dunk for each biscuit at ${T} °C and ${Math.round(I * 100)}% integrity</span></div></div>
    <ol className="league-list">
      ${rows.map((r, rank) => {
        const tc = r.an.tCollapse, end = tc === null ? T_MAX : tc;
        return html`<li key=${r.b.id}>
          <button className=${'league-row' + (r.i === bi ? ' is-current' : '')} aria-pressed=${r.i === bi} onClick=${() => onPick(r.i)}
            aria-label=${`${r.b.name}: best score ${Math.round(r.an.bestScore)} at ${fmt(r.an.tBest)} seconds, ${tc === null ? 'holds past 40 seconds' : `breaks at ${fmt(tc)} seconds`}`}>
            <span className="lr-rank">${rank + 1}</span>
            <${BiscuitIcon} b=${r.b} />
            <span className="lr-main">
              <span className="lr-top"><span className="lr-name">${r.b.short}</span><span className="lr-when">${fmt(r.an.tBest)} s</span></span>
              <span className="lr-bar" aria-hidden="true">
                <i className="safe" style=${{ width: p(end) }} />
                <i className="win" style=${{ left: p(r.an.winStart), width: p(Math.max(.4, r.an.winEnd - r.an.winStart)) }} />
                ${tc !== null && html`<i className="broke" style=${{ left: p(tc) }} />`}
              </span>
            </span>
            <span className="lr-score">${Math.round(r.an.bestScore)}</span>
          </button>
        </li>`;
      })}
    </ol>
    <div className="league-key" aria-hidden="true"><span><i className="k-safe" />Safe to dunk</span><span><i className="k-win" />Best window</span><span><i className="k-broke" />Broken</span></div>
  </section>`;
}

/* ---------- log ---------- */
function DunkLog({ history, onClear }) {
  const lost = history.filter(h => isLost(h.outcome)).length;
  return html`<section className="card a-log" aria-labelledby="log-title">
    <div className="card-head">
      <div><h2 id="log-title">Dunk log</h2><span className="sub">${history.length ? `${history.length} ${history.length === 1 ? 'dunk' : 'dunks'} so far, ${lost} ${lost === 1 ? 'biscuit' : 'biscuits'} lost to the tea` : 'Every run of the rig is recorded here.'}</span></div>
      ${history.length > 0 && html`<button className="btn small ghost" onClick=${onClear}>Clear log</button>`}
    </div>
    ${history.length === 0
      ? html`<div className="empty"><div><strong>No dunks yet.</strong><br />The first result lands here when the biscuit comes out of the tea.</div></div>`
      : html`<ul className="log-list">${history.slice(0, 12).map(h => {
          const b = BY_ID[h.bid];
          return html`<li key=${h.id} className="log-item">
            <${BiscuitIcon} b=${b} />
            <div className="li-mid"><div className="li-name">${b.name}</div><div className="li-meta">${fmt(h.t)} s in ${h.T} °C tea, ${Math.round(h.I * 100)}% intact</div><${Badge} outcome=${h.outcome} sm /></div>
            <span className="li-score" aria-label=${`Score ${Math.round(h.score)}`}>${Math.round(h.score)}</span>
          </li>`;
        })}</ul>`}
  </section>`;
}

/* ---------- shortcuts ---------- */
const SHORTCUTS = [
  [['Space'], 'Pause or resume the rig'],
  [['Enter'], 'Dunk a fresh biscuit now'],
  [['←', '→'], 'Dunk time (Shift for 5 s steps)'],
  [['↑', '↓'], 'Tea temperature (Shift for 5 °C)'],
  [['1', '8'], 'Pick a biscuit', true],
  [['[', ']'], 'Structural integrity'],
  [['O'], 'Use the best dunk time'],
  [['S'], 'Change simulation speed'],
  [['D'], 'Switch dark and light mode'],
  [['M'], 'Sound on or off'],
  [['X'], 'Sweep up the crumbs'],
  [['R'], 'Reset the settings'],
  [['?'], 'Show these shortcuts'],
];
const ShortcutList = () => html`<ul className="keys-list">${SHORTCUTS.map(([keys, label, range]) => html`<li key=${label}>
  <span>${label}</span>
  <span className="kc">${range ? html`<kbd>${keys[0]}</kbd>–<kbd>${keys[1]}</kbd>` : keys.map(k => html`<kbd key=${k}>${k}</kbd>`)}</span>
</li>`)}</ul>`;
function KeysCard() {
  return html`<section className="card a-keys" aria-labelledby="keys-title">
    <div className="card-head"><h2 id="keys-title">Keyboard shortcuts</h2></div>
    <${ShortcutList} />
  </section>`;
}
function HelpModal({ onClose }) {
  const closeRef = useRef(null);
  useEffect(() => { const prev = document.activeElement; closeRef.current && closeRef.current.focus(); return () => { prev && prev.focus && prev.focus(); }; }, []);
  return html`<div className="modal-scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="card modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div className="card-head"><div><h2 id="help-title">Keyboard shortcuts</h2><span className="sub">They work anywhere on the page.</span></div>
        <button ref=${closeRef} className="btn small" onClick=${onClose}>Close <kbd>Esc</kbd></button></div>
      <${ShortcutList} />
    </div>
  </div>`;
}

/* ---------- header ---------- */
const SPEEDS = [1, 2, 4, 8];
function Header({ titleRef, theme, onTheme, speed, setSpeed, paused, onPause, sound, onSound, onHelp, onDunk }) {
  return html`<header className="top">
    <div className="brand">
      <${Logo} />
      <div>
        <h1 className="title" ref=${titleRef}>Tea Dunkability Simulator</h1>
        <p className="tagline">Choose a biscuit, set the tea, and find the longest dunk it survives.</p>
      </div>
    </div>
    <div className="toolbar" role="toolbar" aria-label="Simulation">
      <button className="btn" onClick=${onDunk} aria-keyshortcuts="Enter" title="Enter"><${IconDunk} /><span className="label-text">Dunk now</span></button>
      <div className="seg" role="group" aria-label="Simulation speed">
        ${SPEEDS.map(s => html`<button key=${s} aria-pressed=${speed === s} onClick=${() => setSpeed(s)} title="S">${s}×</button>`)}
      </div>
      <button className="btn icon" onClick=${onPause} aria-label=${paused ? 'Resume' : 'Pause'} aria-keyshortcuts="Space" title=${paused ? 'Resume (Space)' : 'Pause (Space)'}>${paused ? html`<${IconPlay} />` : html`<${IconPause} />`}</button>
      <button className="btn icon toggle" onClick=${onSound} aria-pressed=${sound} aria-label="Sound" aria-keyshortcuts="M" title=${sound ? 'Sound on (M)' : 'Sound off (M)'}>${sound ? html`<${IconSoundOn} />` : html`<${IconSoundOff} />`}</button>
      <button className="btn icon" onClick=${onTheme} aria-label=${theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'} aria-keyshortcuts="D" title="D">${theme === 'dark' ? html`<${IconSun} />` : html`<${IconMoon} />`}</button>
      <button className="btn" onClick=${onHelp} aria-keyshortcuts="?"><kbd>?</kbd><span className="label-text">Shortcuts</span></button>
    </div>
  </header>`;
}

/* ---------- app ---------- */
const DEFAULTS = { T: 85, dunk: 12, bi: 1, integ: 90, speed: 4 };
function App() {
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'dark');
  const [T, setT] = useState(DEFAULTS.T);
  const [dunk, setDunkRaw] = useState(DEFAULTS.dunk);
  const [bi, setBi] = useState(DEFAULTS.bi);
  const [integ, setInteg] = useState(DEFAULTS.integ);
  const [speed, setSpeed] = useState(DEFAULTS.speed);
  const [paused, setPaused] = useState(false);
  const [sound, setSound] = useState(false);
  const [history, setHistory] = useState([]);
  const [help, setHelp] = useState(false);
  const [toast, setToast] = useState(null);
  const setDunk = useCallback(v => setDunkRaw(clamp(Math.round(v * 2) / 2, 0, T_MAX)), []);

  const b = BISCUITS[bi], I = integ / 100;
  const an = useMemo(() => analyse(b, T, I), [b, T, I]);
  const e = an.samples[Math.round(dunk / STEP)];
  const outcome = classify(an, e, dunk);

  const paramsRef = useRef({});
  paramsRef.current = { b, T, I, dunk, speed, paused, an, theme, geom: shapeOf(b.look) };
  const controlRef = useRef({ dunkNow() {}, restart() {} });
  const titleRef = useRef(null);
  const st = useRef({}); st.current = { an, help, paused, sound, theme, speed };

  useLayoutEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('tds-theme', theme); } catch (err) {}
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1638' : '#EEF2FA');
  }, [theme]);
  useEffect(() => { Crumbs.init(document.getElementById('crumbs')); }, []);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 1500); return () => clearTimeout(id); }, [toast]);
  useLive(L => {
    const el = titleRef.current; if (!el) return;
    const v = (L.phase === 'ready' || L.phase === 'exit' ? 0 : L.s) * 52;
    if (Math.abs(v - (el._soak ?? -1)) > .25) { el.style.setProperty('--soak', v.toFixed(1) + '%'); el._soak = v; }
  });
  useEffect(() => {
    const onUp = ev => { const btn = ev.target.closest && ev.target.closest('button'); if (btn && ev.pointerType) setTimeout(() => btn.blur(), 0); };
    document.addEventListener('pointerup', onUp); return () => document.removeEventListener('pointerup', onUp);
  }, []);

  const say = text => setToast({ text, id: Date.now() });
  const actions = useRef({});
  actions.current = {
    pause() { const p = !st.current.paused; setPaused(p); say(p ? 'Paused' : 'Running'); },
    dunkNow() { setPaused(false); controlRef.current.dunkNow(); },
    speed(s) { setSpeed(s); say(`Speed ${s}×`); },
    cycleSpeed() { const i = SPEEDS.indexOf(st.current.speed); actions.current.speed(SPEEDS[(i + 1) % SPEEDS.length]); },
    theme() { const t = st.current.theme === 'dark' ? 'light' : 'dark'; setTheme(t); say(t === 'dark' ? 'Dark mode' : 'Light mode'); },
    sound() { const s = !st.current.sound; setSound(s); Sound.setOn(s); say(s ? 'Sound on' : 'Sound off'); if (s) Sound.plop(); },
    best() { setDunk(st.current.an.tBest); say(`Dunk time set to ${fmt(st.current.an.tBest)} s`); },
    sweep() { Crumbs.sweep(); say('Crumbs swept away'); },
    reset() { setT(DEFAULTS.T); setDunk(DEFAULTS.dunk); setBi(DEFAULTS.bi); setInteg(DEFAULTS.integ); setSpeed(DEFAULTS.speed); setPaused(false); say('Settings reset'); },
    preset(p) { setT(p.T); setBi(p.bi); setInteg(p.integ); setDunk(p.dunk); controlRef.current.restart(); say(p.name); },
    surprise() {
      const p = { T: 55 + Math.round(Math.random() * 43), bi: (Math.random() * 8) | 0, integ: 25 + Math.round(Math.random() * 75), dunk: 2 + Math.round(Math.random() * 32) / 2 };
      setT(p.T); setBi(p.bi); setInteg(p.integ); setDunk(p.dunk); controlRef.current.restart(); say(`${BISCUITS[p.bi].name}, ${p.T} °C, ${fmt(p.dunk)} s`);
    },
  };

  useEffect(() => {
    const onKey = ev => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const t = ev.target, tag = t.tagName, k = ev.key, A = actions.current;
      if ((tag === 'INPUT' && t.type !== 'range') || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
      if (st.current.help) { if (k === 'Escape' || k === '?') { setHelp(false); ev.preventDefault(); } return; }
      if (t.type === 'range' && /^(Arrow|Home|End|Page)/.test(k)) return;
      if (tag === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
      const big = ev.shiftKey;
      let handled = true;
      switch (k) {
        case ' ': case 'Spacebar': A.pause(); break;
        case 'Enter': A.dunkNow(); break;
        case 'ArrowLeft': setDunkRaw(d => clamp(Math.round((d - (big ? 5 : .5)) * 2) / 2, 0, T_MAX)); break;
        case 'ArrowRight': setDunkRaw(d => clamp(Math.round((d + (big ? 5 : .5)) * 2) / 2, 0, T_MAX)); break;
        case 'ArrowUp': setT(v => clamp(v + (big ? 5 : 1), 40, 100)); break;
        case 'ArrowDown': setT(v => clamp(v - (big ? 5 : 1), 40, 100)); break;
        case '[': case '{': setInteg(v => clamp(v - (big ? 20 : 5), 0, 100)); break;
        case ']': case '}': setInteg(v => clamp(v + (big ? 20 : 5), 0, 100)); break;
        case 'o': case 'O': A.best(); break;
        case 's': case 'S': A.cycleSpeed(); break;
        case 'd': case 'D': A.theme(); break;
        case 'm': case 'M': A.sound(); break;
        case 'x': case 'X': A.sweep(); break;
        case 'r': case 'R': A.reset(); break;
        case '?': case '/': setHelp(true); break;
        default:
          if (/^[1-8]$/.test(k)) setBi(parseInt(k, 10) - 1); else handled = false;
      }
      if (handled) ev.preventDefault();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const onComplete = useCallback(rec => setHistory(h => [rec, ...h].slice(0, 30)), []);

  return html`<div className="app">
    <${Header} titleRef=${titleRef} theme=${theme} onTheme=${() => actions.current.theme()} speed=${speed} setSpeed=${s => actions.current.speed(s)}
      paused=${paused} onPause=${() => actions.current.pause()} sound=${sound} onSound=${() => actions.current.sound()} onHelp=${() => setHelp(true)} onDunk=${() => actions.current.dunkNow()} />
    <main className="layout">
      <${Controls} T=${T} setT=${setT} dunk=${dunk} setDunk=${setDunk} bi=${bi} setBi=${setBi} integ=${integ} setInteg=${setInteg} an=${an}
        onPreset=${p => actions.current.preset(p)} onSurprise=${() => actions.current.surprise()} />
      <${Scene} b=${b} T=${T} speed=${speed} paused=${paused} paramsRef=${paramsRef} controlRef=${controlRef} onComplete=${onComplete} />
      <${Verdict} b=${b} T=${T} dunk=${dunk} an=${an} e=${e} outcome=${outcome} onBest=${() => actions.current.best()} />
      <${CrumbleGraph} an=${an} dunk=${dunk} setDunk=${setDunk} b=${b} T=${T} />
      <${League} T=${T} I=${I} bi=${bi} onPick=${setBi} />
      <${DunkLog} history=${history} onClear=${() => setHistory([])} />
      <${KeysCard} />
    </main>
    <footer className="foot">
      <p>Soaking follows the Washburn capillary equation, with tea viscosity and surface tension that change with temperature, in the spirit of Len Fisher's 1998 biscuit-dunking experiments. The numbers are illustrative, not peer reviewed.</p>
      <p>Press <kbd>?</kbd> for shortcuts.</p>
    </footer>
    ${help && html`<${HelpModal} onClose=${() => setHelp(false)} />`}
    ${toast && html`<div className="toast" key=${toast.id} role="status">${toast.text}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
</body>
</html>
