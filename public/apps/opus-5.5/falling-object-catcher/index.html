const FRUIT_KEYS = ['apple', 'orange', 'banana', 'strawberry', 'grapes', 'watermelon', 'pear', 'cherry', 'peach'];

const iconCache = {};
function fruitIcon(type, mood = 'happy', blink = false) {
  const key = type + mood + blink;
  if (iconCache[key]) return iconCache[key];
  const S = 160, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.translate(S / 2, S / 2 + S * 0.03);
  FRUITS[type].draw(g, S * (type === 'star' ? 0.3 : 0.37), mood, blink, 0);
  return (iconCache[key] = cv.toDataURL());
}

/* =========================================================
   Canvas, layout & background
   ========================================================= */
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const L = {};
const BG_PAD = 24; // background is rendered larger than the screen so screen-shake never shows edges
const bgSky = document.createElement('canvas');
const bgFront = document.createElement('canvas');

function computeLayout() {
  const m = Math.min(W, H);
  L.fruitR = Math.round(clamp(m * 0.092, 34, 66));
  L.grassH = clamp(H * 0.13, 58, 130);
  L.groundTop = H - L.grassH;
  L.basketW = clamp(L.fruitR * 3.7, 120, Math.min(270, W * 0.44));
  L.basketH = L.basketW * 0.46;
  L.basketBottom = H - L.grassH * 0.36;
  L.rimY = L.basketBottom - L.basketH;
  L.landY = H - L.grassH * 0.4;
  L.keySpeed = Math.max(680, W * 0.95);
  L.sunR = clamp(m * 0.065, 30, 66);
  L.sunX = W - Math.max(L.sunR * 2.6, W * 0.16);
  L.sunY = Math.max(L.sunR * 1.6 + 84, H * 0.2);
  L.speedScale = H / 800;
}

function hillY(x, base, amp, f, p) {
  return base - amp * (0.62 * Math.sin(x * f + p) + 0.38 * Math.sin(x * f * 2.17 + p * 1.7));
}
function drawHills(g, base, amp, f, p, top, bottom) {
  g.beginPath(); g.moveTo(-BG_PAD, H + BG_PAD);
  for (let x = -BG_PAD; x <= W + BG_PAD + 8; x += 8) g.lineTo(x, hillY(x, base, amp, f, p));
  g.lineTo(W + BG_PAD, H + BG_PAD); g.closePath();
  const gr = g.createLinearGradient(0, base - amp, 0, H);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fill();
}
function drawTree(g, x, y, s, rnd) {
  g.fillStyle = '#9a6233';
  g.beginPath(); g.moveTo(x - s * 0.1, y + s * 0.1); g.lineTo(x - s * 0.07, y - s * 0.6); g.lineTo(x + s * 0.07, y - s * 0.6); g.lineTo(x + s * 0.1, y + s * 0.1); g.closePath(); g.fill();
  const blobs = [[0, -1.0, 0.5], [-0.38, -0.78, 0.36], [0.38, -0.78, 0.36], [-0.2, -1.25, 0.34], [0.22, -1.22, 0.32]];
  g.fillStyle = '#4fb748';
  for (const [bx, by, br] of blobs) { g.beginPath(); g.arc(x + bx * s, y + by * s, br * s, 0, TAU); g.fill(); }
  g.fillStyle = '#6fd062';
  for (const [bx, by, br] of blobs) { g.beginPath(); g.arc(x + bx * s - br * s * 0.2, y + by * s - br * s * 0.25, br * s * 0.62, 0, TAU); g.fill(); }
  const fc = pick(['#ff4d5e', '#ff9f1c', '#ffd23f', '#ff5d8f']);
  for (let i = 0; i < 5; i++) {
    const a = rnd() * TAU, d = rnd() * 0.42;
    g.fillStyle = fc; g.beginPath(); g.arc(x + Math.cos(a) * d * s, y - s + Math.sin(a) * d * s, s * 0.075, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(x + Math.cos(a) * d * s - s * 0.025, y - s + Math.sin(a) * d * s - s * 0.025, s * 0.025, 0, TAU); g.fill();
  }
}
function drawFlower(g, x, y, s, petal) {
  g.fillStyle = petal;
  for (let i = 0; i < 5; i++) { const a = i * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.75, 0, TAU); g.fill(); }
  g.fillStyle = '#ffc928'; g.beginPath(); g.arc(x, y, s * 0.6, 0, TAU); g.fill();
}

function renderBackground() {
  const bw = W + BG_PAD * 2, bh = H + BG_PAD * 2;
  for (const c of [bgSky, bgFront]) { c.width = Math.round(bw * DPR); c.height = Math.round(bh * DPR); }
  let g = bgSky.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, BG_PAD * DPR, BG_PAD * DPR);
  const sky = g.createLinearGradient(0, -BG_PAD, 0, H);
  sky.addColorStop(0, '#46bdfc'); sky.addColorStop(0.55, '#9ee0ff'); sky.addColorStop(1, '#ecfbff');
  g.fillStyle = sky; g.fillRect(-BG_PAD, -BG_PAD, bw, bh);
  // soft light bands
  g.globalAlpha = 0.07; g.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(W * 0.5, H * 1.1, W * (0.4 + i * 0.25), H * (0.5 + i * 0.22), 0, 0, TAU); g.fill(); }
  g.globalAlpha = 1;

  g = bgFront.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, BG_PAD * DPR, BG_PAD * DPR);
  g.clearRect(-BG_PAD, -BG_PAD, bw, bh);
  const rnd = mulberry32(20241113);
  const gy = L.groundTop;
  const fFar = TAU * 1.4 / Math.max(W, 600), fMid = TAU * 2.2 / Math.max(W, 600);
  const farBase = gy - H * 0.15, farAmp = H * 0.055;
  drawHills(g, farBase, farAmp, fFar, 1.3, '#c4f09a', '#93d86c');
  const treeN = Math.max(3, Math.round(W / 230));
  for (let i = 0; i < treeN; i++) {
    const x = (i + 0.2 + rnd() * 0.6) * W / treeN;
    const s = clamp(H * 0.06, 26, 58) * (0.8 + rnd() * 0.45);
    drawTree(g, x, hillY(x, farBase, farAmp, fFar, 1.3) + s * 0.25, s, rnd);
  }
  drawHills(g, gy - H * 0.06, H * 0.04, fMid, 4.1, '#9ee070', '#6cc94f');
  // bushes on the mid hills
  const bushN = Math.max(2, Math.round(W / 380));
  for (let i = 0; i < bushN; i++) {
    const x = (i + 0.3 + rnd() * 0.4) * W / bushN, y = hillY(x, gy - H * 0.06, H * 0.04, fMid, 4.1) + 6, s = clamp(H * 0.03, 14, 30);
    g.fillStyle = '#58bd45';
    for (const [bx, by, br] of [[-0.8, 0, 0.7], [0, -0.35, 0.9], [0.85, 0, 0.7]]) { g.beginPath(); g.arc(x + bx * s, y + by * s, br * s, 0, TAU); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.arc(x - s * 0.2, y - s * 0.6, s * 0.4, 0, TAU); g.fill();
  }
  // grass band with scalloped top
  const gr = g.createLinearGradient(0, gy, 0, H);
  gr.addColorStop(0, '#7ada52'); gr.addColorStop(1, '#3fae35');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(-BG_PAD, H + BG_PAD); g.lineTo(-BG_PAD, gy);
  const step = 26;
  for (let x = -BG_PAD; x <= W + BG_PAD; x += step) g.quadraticCurveTo(x + step / 2, gy - 9, x + step, gy);
  g.lineTo(W + BG_PAD + step, H + BG_PAD); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3;
  g.beginPath();
  for (let x = -BG_PAD; x <= W + BG_PAD; x += step) { g.moveTo(x + 4, gy + 1); g.quadraticCurveTo(x + step / 2, gy - 6, x + step - 4, gy + 1); }
  g.stroke();
  // grass tufts
  g.strokeStyle = 'rgba(40,130,40,.45)'; g.lineWidth = 2.2; g.lineCap = 'round';
  const tufts = Math.round(W / 16);
  for (let i = 0; i < tufts; i++) {
    const x = rnd() * W, y = gy + 12 + rnd() * (H - gy - 8), s = 5 + rnd() * 6;
    g.beginPath(); g.moveTo(x - s * 0.6, y - s); g.lineTo(x, y); g.lineTo(x + s * 0.6, y - s); g.moveTo(x, y); g.lineTo(x + s * 0.1, y - s * 1.3); g.stroke();
  }
  const flowers = Math.round(W / 55);
  const petals = ['#ffffff', '#ffd6e8', '#fff3a6', '#d9c8ff', '#ffc2c2'];
  for (let i = 0; i < flowers; i++) {
    const x = rnd() * W, y = gy + 14 + rnd() * (H - gy - 18);
    drawFlower(g, x, y, 3 + rnd() * 2.5, petals[(rnd() * petals.length) | 0]);
  }
}

/* =========================================================
   Game state
   ========================================================= */
const G = {
  state: 'menu', time: 0, score: 0, lives: 3, level: 1, caught: 0, combo: 0, bestCombo: 0,
  spawnT: 0.6, readyT: 0, readyStage: 0, endT: 0, tally: {}, lastType: null, lastSpawn: null, prevState: null,
};
let best = store.get('fruitCatcher.best', 0) | 0;
const basket = { x: 0, vx: 0, target: 0, tilt: 0, sq: 0, sqv: 0, pile: [], mode: 'pointer', glow: 0 };
const keys = { left: false, right: false };
let fruits = [], particles = [], texts = [], splats = [], clouds = [], butterflies = [];
let shake = 0;
let pointerDown = false;

const PRAISE = ['Yummy!', 'Awesome!', 'Fruit-tastic!', 'Super!', 'Amazing!', 'Wow-wee!', 'Unstoppable!'];
const RAINBOW = ['#ff4d6d', '#ff9f1c', '#ffd23f', '#3fc46a', '#3fa9f5', '#8b5cf6'];
const CONFETTI = ['#ff4d6d', '#ff9f1c', '#ffd23f', '#3fc46a', '#3fa9f5', '#8b5cf6', '#ff5d8f'];

function levelParams(level) {
  return {
    speed: H * Math.min(0.25 + 0.034 * (level - 1), 0.7),
    interval: Math.max(0.5, 1.5 - 0.1 * (level - 1)),
    maxOnScreen: Math.min(2 + Math.floor((level - 1) / 2), 6),
    golden: level >= 2 ? 0.07 : 0.03,
  };
}

function makeScenery() {
  clouds = [];
  const n = Math.max(4, Math.round(W / 280));
  for (let i = 0; i < n; i++) {
    clouds.push({ x: rand(-100, W + 100), y: rand(H * 0.08, H * 0.45), s: rand(0.55, 1.15) * clamp(Math.min(W, H) / 700, 0.6, 1.3), v: rand(7, 18), kind: i % 3 });
  }
  butterflies = [];
  for (let i = 0; i < 2; i++) {
    butterflies.push({ x: rand(0, W), y: rand(L.groundTop - H * 0.18, L.groundTop - 20), t: rand(0, 10), tx: rand(0, W), ty: 0, col: i ? '#ff8fc8' : '#ffd23f', vx: 0, vy: 0 });
  }
}

function resize() {
  const oldW = W, oldH = H;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  computeLayout();
  renderBackground();
  if (!oldW) {
    basket.x = basket.target = W / 2;
    makeScenery();
    return;
  }
  const sx = W / oldW, sy = H / oldH;
  for (const f of fruits) { f.x *= sx; f.y *= sy; f.r = L.fruitR * (f.golden ? 0.95 : 1); }
  for (const s of splats) { s.x *= sx; s.y = L.landY; }
  for (const c of clouds) { c.x *= sx; c.y *= sy; }
  for (const b of butterflies) { b.x *= sx; b.y *= sy; }
  basket.x *= sx; basket.target *= sx;
  basket.x = clamp(basket.x, L.basketW / 2, W - L.basketW / 2);
}

/* =========================================================
   HUD helpers
   ========================================================= */
const hearts = Array.from(document.querySelectorAll('#lives .heart'));
function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function announce(msg) { const sr = $('sr'); sr.textContent = ''; setTimeout(() => { sr.textContent = msg; }, 30); }
function updateHUD() {
  $('score').textContent = G.score;
  $('level').textContent = G.level;
}
function renderHearts() {
  hearts.forEach((h, i) => h.classList.toggle('lost', i >= G.lives));
  $('lives').classList.toggle('danger', G.lives === 1);
  $('lives').setAttribute('aria-label', `${G.lives} ${G.lives === 1 ? 'life' : 'lives'} left`);
}
let bannerTimer = 0;
function showBanner(text, color = '#ff5d8f') {
  const b = $('banner');
  b.textContent = text;
  b.style.setProperty('--bc', color);
  retrigger(b, 'go');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('go'), 1300);
}

/* =========================================================
   Effects
   ========================================================= */
function burst(x, y, color, n, o = {}) {
  const sc = L.speedScale;
  const cap = reduceMotion ? Math.ceil(n / 2) : n;
  for (let i = 0; i < cap; i++) {
    const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 1.4);
    const sp = rand(o.min ?? 180, o.max ?? 520) * sc;
    const life = rand(o.lifeMin ?? 0.45, o.lifeMax ?? 0.85);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: (o.g ?? 1500) * sc,
      life, max: life, size: rand(o.sMin ?? L.fruitR * 0.08, o.sMax ?? L.fruitR * 0.17),
      color: Array.isArray(color) ? pick(color) : color, kind: o.kind || 'drop',
      rot: rand(0, TAU), vr: rand(-8, 8), drag: o.drag ?? 0.6, flutter: rand(0, TAU),
    });
  }
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}
function ring(x, y, color, size) { particles.push({ x, y, vx: 0, vy: 0, g: 0, life: 0.45, max: 0.45, size, color, kind: 'ring', rot: 0, vr: 0, drag: 0 }); }
function confettiRain(n = 140) {
  const sc = L.speedScale;
  const cap = reduceMotion ? 40 : n;
  for (let i = 0; i < cap; i++) {
    const life = rand(2.2, 3.6);
    particles.push({
      x: rand(0, W), y: rand(-H * 0.4, -10), vx: rand(-60, 60) * sc, vy: rand(80, 220) * sc, g: 90 * sc,
      life, max: life, size: rand(7, 13), color: pick(CONFETTI), kind: 'confetti', rot: rand(0, TAU), vr: rand(-7, 7), drag: 0.15, flutter: rand(0, TAU),
    });
  }
}
function floatText(x, y, text, color, size, o = {}) {
  texts.push({ x, y, text, color, size, life: o.life ?? 1.0, max: o.life ?? 1.0, vy: (o.vy ?? -70) * L.speedScale, sub: o.sub || null, rainbow: !!o.rainbow });
}

/* =========================================================
   Spawning
   ========================================================= */
function spawnFruit() {
  const p = levelParams(G.level);
  const isPlay = G.state === 'play';
  const golden = isPlay && G.caught >= 5 && Math.random() < p.golden;
  let type;
  if (golden) type = 'star';
  else { do { type = pick(FRUIT_KEYS); } while (type === G.lastType); }
  G.lastType = type;
  const r = L.fruitR * (golden ? 0.95 : 1);
  const margin = r * 1.15;
  // Fairness: keep each new fruit within keyboard reach of the previous one.
  const last = G.lastSpawn && G.lastSpawn.state === 'fall' ? G.lastSpawn : null;
  const reach = L.keySpeed * p.interval * 0.7 + L.basketW * 0.35;
  let x = W / 2;
  for (let i = 0; i < 12; i++) {
    x = margin + Math.random() * (W - margin * 2);
    if (last) x = clamp(x, last.x - reach, last.x + reach);
    const crowded = fruits.some((f) => f.state === 'fall' && f.y < r * 3.2 && Math.abs(f.x - x) < r * 2.3);
    if (!crowded) break;
  }
  const speed = p.speed * rand(0.95, 1.06) * (golden ? 1.05 : 1);
  const f = {
    type, golden, x, y: -r * 1.4, prevY: -r * 1.4, r,
    vx: 0, vy: speed * 0.45, acc: speed * 1.1, vmax: speed,
    rot: 0, phase: rand(0, TAU), spin: 0, t: 0, sx: 1, sy: 1, alpha: 1,
    state: 'fall', mood: 'happy', blink: false, blinkT: rand(0.6, 3.2), splatT: 0, counted: isPlay,
  };
  fruits.push(f);
  G.lastSpawn = f;
}

/* =========================================================
   Catch / miss
   ========================================================= */
const PILE_SLOTS = [[-0.27, 0.035], [0.27, 0.03], [0, -0.03], [-0.13, -0.06], [0.14, -0.075]];
function addToPile(f) {
  const used = new Set(basket.pile.filter((p) => !p.dying).map((p) => p.slot));
  let slot = PILE_SLOTS.findIndex((_, i) => !used.has(i));
  if (slot < 0) {
    const oldest = basket.pile.find((p) => !p.dying);
    slot = oldest.slot; oldest.dying = true;
  }
  basket.pile.push({
    type: f.type, slot, x: f.x - basket.x, y: f.y - L.basketBottom, s: 1, rot: f.rot,
    tRot: rand(-0.35, 0.35), dying: false, a: 1, vy: 0,
  });
}

function catchFruit(f) {
  f.state = 'gone';
  const def = FRUITS[f.type];
  const rimX = f.x, rimY = L.rimY;
  basket.sqv += 7; basket.glow = 1;
  addToPile(f);
  burst(rimX, rimY, def.juice, f.golden ? 10 : 14, { spread: Math.PI * 0.9, min: 160, max: 460 });
  burst(rimX, rimY, ['#ffffff', '#fff6b0'], 6, { kind: 'star', spread: Math.PI * 1.2, min: 120, max: 360, g: 500, sMin: L.fruitR * 0.12, sMax: L.fruitR * 0.22 });
  if (f.golden) {
    burst(rimX, rimY, ['#ffd23f', '#fff27a', '#ffffff', '#ffb300'], 26, { kind: 'star', spread: TAU, min: 200, max: 620, g: 400, sMin: L.fruitR * 0.14, sMax: L.fruitR * 0.28, lifeMax: 1.1 });
    ring(rimX, rimY, '#ffd23f', L.basketW * 0.7);
  }
  ring(rimX, rimY, 'rgba(255,255,255,0.9)', L.basketW * 0.45);
  if (!f.counted || G.state !== 'play') return;

  const pts = def.points || 1;
  G.score += pts; G.caught++; G.combo++;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  G.tally[f.type] = (G.tally[f.type] || 0) + 1;
  updateHUD();
  retrigger($('scorePill'), f.golden ? 'bump-big' : 'bump');
  if (f.golden) Sound.golden(); else Sound.catch(G.combo);
  floatText(rimX, rimY - f.r * 1.1, `+${pts}`, f.golden ? '#ffb300' : def.juice, L.fruitR * (f.golden ? 1.05 : 0.8), { sub: def.name });

  if (G.combo % 5 === 0) {
    const word = PRAISE[Math.min(G.combo / 5 - 1, PRAISE.length - 1)];
    floatText(basket.x, L.rimY - L.basketH * 1.9, word, '#ff5d8f', L.fruitR * 0.95, { rainbow: true, life: 1.4, vy: -40 });
    Sound.praise();
    burst(basket.x, L.rimY - L.basketH, CONFETTI, 18, { kind: 'confetti', spread: Math.PI * 0.8, min: 300, max: 650, g: 900, sMin: 6, sMax: 11, lifeMin: 0.9, lifeMax: 1.4, drag: 0.8 });
  }
  const newLevel = 1 + Math.floor(G.caught / 10);
  if (newLevel > G.level) {
    G.level = newLevel;
    updateHUD();
    retrigger($('levelPill'), 'bump');
    setTimeout(() => { if (G.state === 'play') { showBanner(`Level ${G.level}!`, '#8b5cf6'); Sound.level(); } }, 250);
    burst(W / 2, -10, CONFETTI, 46, { kind: 'confetti', angle: Math.PI / 2, spread: Math.PI * 0.9, min: 120, max: 420, g: 220, sMin: 7, sMax: 12, lifeMin: 1.6, lifeMax: 2.6, drag: 0.5 });
    announce(`Level ${G.level}!`);
  }
}

function bounceOff(f, dx) {
  f.state = 'bounce';
  const dir = Math.sign(dx) || 1;
  f.vx = dir * rand(160, 260) * L.speedScale;
  f.vy = -Math.abs(f.vy) * 0.38;
  f.spin = dir * rand(5, 8);
  f.mood = 'wow';
  basket.sqv += 3;
  if (f.counted && G.state === 'play') Sound.bonk();
}

function landFruit(f) {
  f.state = 'splat'; f.splatT = 0; f.y = L.landY - f.r * 0.82; f.mood = 'sad'; f.rot *= 0.3;
  const def = FRUITS[f.type];
  splats.push({ x: f.x, y: L.landY, color: def.juice, r: f.r, t: 0, seed: Math.random() * 1000 });
  burst(f.x, L.landY - f.r * 0.2, def.juice, 16, { spread: Math.PI * 0.95, min: 140, max: 420, g: 1700 });
  if (f.counted && G.state === 'play') missFruit(f);
}

function missFruit(f) {
  G.lives--; G.combo = 0;
  renderHearts();
  Sound.miss();
  shake = Math.max(shake, 0.35);
  floatText(f.x, L.landY - f.r * 2.1, G.lives > 0 ? 'Oops!' : 'Oh no!', '#7a6a99', L.fruitR * 0.75, { life: 1.1, vy: -50 });
  announce(G.lives > 0 ? `Oops, a fruit fell! ${G.lives} ${G.lives === 1 ? 'life' : 'lives'} left.` : 'Game over!');
  if (G.lives <= 0) startEnding();
}

/* =========================================================
   Flow control
   ========================================================= */
const overlays = { menu: $('menu'), pause: $('pause'), over: $('over') };
function showOverlay(name) {
  for (const k in overlays) {
    const on = k === name;
    overlays[k].classList.toggle('show', on);
    overlays[k].setAttribute('aria-hidden', on ? 'false' : 'true');
    if ('inert' in overlays[k]) overlays[k].inert = !on;
  }
}
function focusLater(id, delay = 80) { setTimeout(() => { const el = $(id); if (el) el.focus({ preventScroll: true }); }, delay); }

function popAllFruits() {
  for (const f of fruits) {
    if (f.state === 'fall' || f.state === 'bounce') {
      burst(f.x, f.y, FRUITS[f.type].juice, 8, { spread: TAU, min: 80, max: 280, g: 600 });
      burst(f.x, f.y, '#ffffff', 4, { kind: 'star', spread: TAU, min: 60, max: 200, g: 200 });
    }
  }
  fruits = [];
}

function resetRun() {
  G.score = 0; G.lives = 3; G.level = 1; G.caught = 0; G.combo = 0; G.bestCombo = 0;
  G.tally = {}; G.lastType = null; G.lastSpawn = null;
  popAllFruits();
  splats = []; texts = [];
  basket.pile.forEach((p) => { p.dying = true; });
  updateHUD(); renderHearts();
}

function startGame() {
  Sound.init(); Sound.click();
  showOverlay(null);
  resetRun();
  G.state = 'ready'; G.readyT = 0; G.readyStage = 0;
  basket.target = basket.x; basket.vx = 0;
  document.body.classList.remove('in-menu', 'paused');
  document.body.classList.add('playing');
  $('hud').classList.remove('hidden');
  canvas.focus && canvas.blur();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function pauseGame() {
  if (G.state !== 'play' && G.state !== 'ready') return;
  G.prevState = G.state; G.state = 'paused';
  keys.left = keys.right = false; pointerDown = false;
  document.body.classList.remove('playing'); document.body.classList.add('paused');
  showOverlay('pause');
  focusLater('resumeBtn');
}
function resumeGame() {
  if (G.state !== 'paused') return;
  Sound.init(); Sound.click();
  G.state = G.prevState || 'play';
  document.body.classList.remove('paused'); document.body.classList.add('playing');
  showOverlay(null);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function goMenu() {
  Sound.click();
  G.state = 'menu';
  document.body.classList.remove('playing', 'paused');
  document.body.classList.add('in-menu');
  $('hud').classList.add('hidden');
  popAllFruits(); splats = []; texts = [];
  basket.pile.forEach((p) => { p.dying = true; });
  G.level = 1; G.spawnT = 0.8; G.lastSpawn = null;
  $('bestMenu').textContent = best;
  showOverlay('menu');
  focusLater('playBtn');
}

function startEnding() {
  G.state = 'ending'; G.endT = 0;
  Sound.over();
  document.body.classList.remove('playing');
}

function showGameOver() {
  G.state = 'over';
  const newBest = G.score > best && G.score > 0;
  if (G.score > best) { best = G.score; store.set('fruitCatcher.best', best); }
  $('hud').classList.add('hidden');

  const s = G.score;
  const [title, sub] =
    s === 0 ? ['Oopsie!', "Let's try again — you can do it!"] :
    s < 10 ? ['Nice try!', 'Every fruit counts. Have another go!'] :
    s < 25 ? ['Good job!', 'Your basket is filling up!'] :
    s < 50 ? ['Great job!', 'What a fruity feast!'] :
             ['Fruit Master!', 'Wow — you are a super catcher!'];
  $('overTitle').textContent = title;
  $('overSub').textContent = sub;
  $('bestOver').textContent = best;
  $('streakOver').textContent = G.bestCombo;
  $('newBest').classList.toggle('show', newBest);

  const starCount = s >= 30 ? 3 : s >= 12 ? 2 : s >= 1 ? 1 : 0;
  const starEls = $('stars').querySelectorAll('svg');
  starEls.forEach((el) => { el.classList.remove('on'); el.style.animationDelay = ''; });
  starEls.forEach((el, i) => {
    if (i < starCount) {
      const delay = 0.45 + i * 0.28;
      el.style.animationDelay = `${delay}s`;
      el.classList.add('on');
      setTimeout(() => { if (G.state === 'over') Sound.star(i); }, delay * 1000);
    }
  });

  const tally = $('tally');
  tally.innerHTML = '';
  const entries = Object.entries(G.tally).sort((a, b) => b[1] - a[1]);
  if (!entries.length) {
    const p = document.createElement('div');
    p.className = 'tally-empty'; p.textContent = 'Empty! Catch some fruit next time.';
    tally.appendChild(p);
  } else {
    entries.forEach(([type, n], i) => {
      const item = document.createElement('div');
      item.className = 'tally-item';
      item.style.animationDelay = `${0.6 + i * 0.08}s`;
      item.title = FRUITS[type].name;
      const img = document.createElement('img');
      img.src = fruitIcon(type, 'joy'); img.alt = FRUITS[type].name;
      const span = document.createElement('span'); span.textContent = `×${n}`;
      item.append(img, span);
      tally.appendChild(item);
    });
  }

  countUp($('finalScore'), s, 900);
  const card = overlays.over.querySelector('.card');
  card.classList.add('locked');
  setTimeout(() => card.classList.remove('locked'), 750);
  showOverlay('over');
  focusLater('againBtn', 760);
  if (newBest) { confettiRain(160); Sound.best(); }
  announce(`Game over. You scored ${s}. ${newBest ? 'New best score!' : `Best score is ${best}.`}`);
}

function countUp(el, to, dur) {
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = '0';
  requestAnimationFrame(step);
}

/* =========================================================
   Update
   ========================================================= */
function update(dt) {
  if (G.state === 'paused') return;
  G.time += dt;
  let gdt = dt;
  if (G.state === 'ending') {
    G.endT += dt;
    gdt = dt * (G.endT < 0.9 ? 0.3 : 0.8);
    if (G.endT > 1.25) showGameOver();
  }

  updateScenery(dt);
  updateBasket(dt);

  if (G.state === 'ready') {
    G.readyT += dt;
    if (G.readyStage === 0) { G.readyStage = 1; showBanner('Ready?', '#ff9f1c'); Sound.ready(); }
    else if (G.readyStage === 1 && G.readyT > 1.05) { G.readyStage = 2; showBanner('Go!', '#3fc46a'); Sound.go(); }
    else if (G.readyStage === 2 && G.readyT > 1.45) { G.state = 'play'; G.spawnT = 0.15; }
  }

  if (G.state === 'play' || G.state === 'menu') {
    const p = levelParams(G.level);
    G.spawnT -= gdt;
    const falling = fruits.reduce((n, f) => n + (f.state === 'fall'), 0);
    const maxN = G.state === 'menu' ? 2 : p.maxOnScreen;
    if (G.spawnT <= 0 && falling < maxN) {
      spawnFruit();
      G.spawnT = (G.state === 'menu' ? 1.5 : p.interval) * rand(0.85, 1.15);
    }
  }

  updateFruits(gdt);
  updatePile(dt);
  updateParticles(gdt);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 1 - damp(1.5, dt); }
  texts = texts.filter((t) => t.life > 0);
  for (const s of splats) s.t += gdt;
  splats = splats.filter((s) => s.t < 3.2);
  shake = Math.max(0, shake - dt);
}

function updateScenery(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x - 140 * c.s > W + 20) { c.x = -160 * c.s; c.y = rand(H * 0.08, H * 0.45); }
  }
  for (const b of butterflies) {
    b.t += dt;
    if (Math.hypot(b.tx - b.x, b.ty - b.y) < 20 || !b.ty) { b.tx = rand(20, W - 20); b.ty = rand(L.groundTop - H * 0.2, L.groundTop - 16); }
    b.vx += ((b.tx - b.x) * 0.6 - b.vx) * damp(1.2, dt);
    b.vy += ((b.ty - b.y) * 0.6 - b.vy) * damp(1.2, dt);
    const sp = Math.hypot(b.vx, b.vy), maxSp = 70;
    if (sp > maxSp) { b.vx *= maxSp / sp; b.vy *= maxSp / sp; }
    b.x += b.vx * dt; b.y += (b.vy + Math.sin(b.t * 5) * 30) * dt;
  }
}

function updateBasket(dt) {
  const half = L.basketW / 2;
  const prevX = basket.x;
  const st = G.state;
  if (st === 'menu' || st === 'over') {
    // Attract mode: the basket happily plays by itself behind the menu.
    let tgt = W / 2, low = null;
    for (const f of fruits) if (f.state === 'fall' && (!low || f.y > low.y)) low = f;
    if (low) tgt = low.x + Math.sin(G.time * 1.3) * L.basketW * 0.12;
    const maxStep = L.keySpeed * 0.55 * dt;
    basket.x += clamp((tgt - basket.x) * damp(5, dt) * 1.4, -maxStep, maxStep);
  } else if (st === 'play' || st === 'ready' || st === 'ending') {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) basket.mode = 'keys';
    if (basket.mode === 'keys') {
      basket.vx += (dir * L.keySpeed - basket.vx) * damp(dir ? 13 : 18, dt);
      basket.x += basket.vx * dt;
      basket.target = basket.x;
    } else {
      basket.x += (basket.target - basket.x) * damp(22, dt);
    }
  }
  basket.x = clamp(basket.x, half, W - half);
  const v = (basket.x - prevX) / Math.max(dt, 1e-4);
  if (basket.mode === 'keys' && (st === 'play' || st === 'ready' || st === 'ending')) basket.vx = v;
  const tiltT = clamp(v / L.keySpeed, -1, 1) * 0.17;
  basket.tilt += (tiltT - basket.tilt) * damp(10, dt);
  basket.sqv += (-340 * basket.sq - 15 * basket.sqv) * dt;
  basket.sq += basket.sqv * dt;
  basket.glow = Math.max(0, basket.glow - dt * 2.5);
}

function updateFruits(dt) {
  const half = L.basketW / 2;
  const grav = 2400 * L.speedScale;
  for (const f of fruits) {
    f.t += dt;
    f.blinkT -= dt;
    if (f.blinkT <= 0) { f.blink = !f.blink; f.blinkT = f.blink ? 0.12 : rand(1.4, 3.6); }

    if (f.state === 'fall') {
      f.prevY = f.y;
      f.vy = Math.min(f.vmax, f.vy + f.acc * dt);
      f.y += f.vy * dt;
      f.rot = Math.sin(f.t * 2.4 + f.phase) * 0.22;
      const stretch = clamp(f.vy / (H * 0.7), 0, 1) * 0.06;
      f.sx = 1 - stretch * 0.5; f.sy = 1 + stretch;
      const dx = f.x - basket.x;
      const over = Math.abs(dx) < half + f.r * 0.2;
      f.mood = f.y > L.rimY - f.r * 3.2 ? (over ? 'happy' : 'wow') : 'happy';
      if (f.golden && Math.random() < dt * 20) {
        burst(f.x + rand(-f.r, f.r) * 0.6, f.y + rand(-f.r, f.r) * 0.6, ['#fff27a', '#ffffff', '#ffd23f'], 1, { kind: 'star', spread: TAU, min: 10, max: 60, g: 60, lifeMin: 0.4, lifeMax: 0.8, sMin: f.r * 0.1, sMax: f.r * 0.2 });
      }
      const bPrev = f.prevY + f.r * 0.45, bNow = f.y + f.r * 0.45;
      if (bPrev < L.rimY && bNow >= L.rimY) {
        if (Math.abs(dx) <= half * 0.92 + f.r * 0.35) { catchFruit(f); continue; }
        if (Math.abs(dx) <= half + f.r * 0.85) { bounceOff(f, dx); continue; }
      }
      if (f.y + f.r * 0.82 >= L.landY) landFruit(f);
    } else if (f.state === 'bounce') {
      f.vy += grav * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.rot += f.spin * dt;
      if (f.x < f.r * 0.6 || f.x > W - f.r * 0.6) { f.vx *= -0.5; f.x = clamp(f.x, f.r * 0.6, W - f.r * 0.6); }
      if (f.vy > 0 && f.y + f.r * 0.82 >= L.landY) landFruit(f);
    } else if (f.state === 'splat') {
      f.splatT += dt;
      const k = f.splatT;
      const wob = Math.exp(-k * 7) * Math.cos(k * 26);
      f.sx = 1 + 0.32 * wob; f.sy = 1 - 0.3 * wob;
      f.y = L.landY - f.r * 0.82 * f.sy;
      if (k > 0.9) f.alpha = Math.max(0, 1 - (k - 0.9) / 0.45);
      if (k > 1.35) f.state = 'gone';
    }
  }
  fruits = fruits.filter((f) => f.state !== 'gone');
}

function updatePile(dt) {
  const k = damp(13, dt);
  for (const p of basket.pile) {
    const [sx, sy] = PILE_SLOTS[p.slot];
    const tx = sx * L.basketW, ty = -L.basketH + sy * L.basketW;
    p.x += (tx - p.x) * k;
    p.y += (ty - p.y) * k;
    p.s += (0.62 - p.s) * k;
    p.rot += (p.tRot - p.rot) * k;
    if (p.dying) p.a -= dt * 5;
  }
  basket.pile = basket.pile.filter((p) => p.a > 0);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.vy += p.g * dt;
    const d = 1 - damp(p.drag, dt);
    p.vx *= d; p.vy *= p.kind === 'confetti' ? d : 1;
    if (p.kind === 'confetti') { p.flutter += dt * 6; p.x += Math.sin(p.flutter) * 40 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
  }
  particles = particles.filter((p) => p.life > 0 && p.y < H + 60);
}

/* =========================================================
   Render
   ========================================================= */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let sx = 0, sy = 0;
  if (shake > 0 && !reduceMotion) { const m = shake * 18; sx = (Math.random() - 0.5) * m; sy = (Math.random() - 0.5) * m; }
  ctx.drawImage(bgSky, -BG_PAD, -BG_PAD, W + BG_PAD * 2, H + BG_PAD * 2);
  ctx.save();
  ctx.translate(sx, sy);
  drawSun();
  drawClouds();
  ctx.drawImage(bgFront, -BG_PAD, -BG_PAD, W + BG_PAD * 2, H + BG_PAD * 2);
  drawButterflies();
  drawSplats();
  drawFruitShadows();
  drawBasket();
  for (const f of fruits) drawFruit(f);
  drawParticles();
  drawTexts();
  ctx.restore();
}

function drawSun() {
  const R = L.sunR;
  ctx.save(); ctx.translate(L.sunX, L.sunY);
  const g = ctx.createRadialGradient(0, 0, R * 0.6, 0, 0, R * 3);
  g.addColorStop(0, 'rgba(255,240,150,0.55)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 3, 0, TAU); ctx.fill();
  ctx.save();
  ctx.rotate(G.time * 0.18);
  ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = '#ffd84a'; ctx.lineJoin = 'round'; ctx.lineWidth = R * 0.12;
  for (let i = 0; i < 12; i++) {
    const len = R * (i % 2 ? 1.5 : 1.72) + Math.sin(G.time * 3 + i) * R * 0.05;
    ctx.beginPath(); ctx.moveTo(R * 1.12, -R * 0.15); ctx.lineTo(len, 0); ctx.lineTo(R * 1.12, R * 0.15); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.rotate(TAU / 12);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = radial(ctx, R, '#fff8c2', '#ffd83d', '#ffb81c'); ctx.fill();
  ctx.lineWidth = R * 0.06; ctx.strokeStyle = '#f5a300'; ctx.stroke();
  drawFace(ctx, R * 0.9, 'joy', false, 0, R * 0.06);
  ctx.restore();
}

const CLOUD_SHAPES = [
  [[-52, 6, 30], [-22, -14, 38], [18, -20, 34], [50, 2, 28], [0, 10, 34]],
  [[-40, 4, 26], [-8, -16, 34], [28, -4, 30], [8, 10, 28]],
  [[-60, 8, 24], [-30, -8, 32], [6, -18, 36], [42, -6, 30], [68, 8, 22], [10, 12, 30]],
];
function drawClouds() {
  for (const c of clouds) {
    const shape = CLOUD_SHAPES[c.kind];
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(160,210,240,0.45)';
    for (const [x, y, r] of shape) { ctx.beginPath(); ctx.arc(x, y + 7, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#fff';
    for (const [x, y, r] of shape) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawButterflies() {
  for (const b of butterflies) {
    const flap = Math.abs(Math.sin(b.t * 14));
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(clamp(b.vx / 120, -0.5, 0.5));
    ctx.fillStyle = b.col; ctx.strokeStyle = 'rgba(59,42,89,.5)'; ctx.lineWidth = 1;
    for (const s of [-1, 1]) {
      ctx.save(); ctx.scale(s * (0.25 + flap * 0.75), 1);
      ctx.beginPath(); ctx.ellipse(6, -4, 7, 5.5, -0.4, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(5, 4, 5, 4, 0.4, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, 0, 1.6, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawSplats() {
  for (const s of splats) {
    const a = s.t < 2.2 ? 0.6 : 0.6 * Math.max(0, 1 - (s.t - 2.2));
    const grow = Math.min(1, s.t * 8);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r * 1.15 * grow, s.r * 0.28 * grow, 0, 0, TAU); ctx.fill();
    const rnd = mulberry32(s.seed | 0);
    for (let i = 0; i < 6; i++) {
      const ang = rnd() * TAU, d = s.r * (1.1 + rnd() * 0.7) * grow;
      ctx.beginPath(); ctx.ellipse(s.x + Math.cos(ang) * d, s.y + Math.sin(ang) * d * 0.25, s.r * (0.08 + rnd() * 0.1), s.r * 0.06, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawFruitShadows() {
  for (const f of fruits) {
    if (f.state !== 'fall') continue;
    const k = clamp((f.y + f.r) / L.landY, 0, 1);
    const kk = k * k;
    ctx.fillStyle = `rgba(30,90,30,${0.08 + 0.2 * kk})`;
    ctx.beginPath(); ctx.ellipse(f.x, L.landY + f.r * 0.06, f.r * (0.35 + 0.5 * kk), f.r * (0.1 + 0.12 * kk), 0, 0, TAU); ctx.fill();
  }
}

function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);
  ctx.scale(f.sx, f.sy);
  if (f.alpha < 1) ctx.globalAlpha = f.alpha;
  FRUITS[f.type].draw(ctx, f.r, f.mood, f.blink && f.mood !== 'sad', G.time);
  ctx.restore();
}

function drawBasket() {
  const BW = L.basketW, BH = L.basketH;
  const x = basket.x, y = L.basketBottom;
  ctx.fillStyle = 'rgba(30,90,30,0.28)';
  ctx.beginPath(); ctx.ellipse(x, y + BH * 0.03, BW * 0.48, BH * 0.13, 0, 0, TAU); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(basket.tilt);
  const sq = clamp(basket.sq, -0.6, 0.6);
  ctx.scale(1 + sq * 0.14, 1 - sq * 0.14);

  const top = -BH, rx = BW / 2, ry = BH * 0.17, botW = BW * 0.37;

  // catch glow
  if (basket.glow > 0) {
    const gg = ctx.createRadialGradient(0, top, 0, 0, top, BW * 0.75);
    gg.addColorStop(0, `rgba(255,250,200,${0.75 * basket.glow})`); gg.addColorStop(1, 'rgba(255,250,200,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(0, top, BW * 0.75, BW * 0.5, 0, 0, TAU); ctx.fill();
  }

  // interior
  const ig = ctx.createLinearGradient(0, top - ry, 0, top + ry);
  ig.addColorStop(0, '#5a3210'); ig.addColorStop(1, '#8a5424');
  ctx.fillStyle = ig;
  ctx.beginPath(); ctx.ellipse(0, top, rx, ry, 0, 0, TAU); ctx.fill();
  // back rim
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, top, rx, ry, 0, Math.PI, TAU);
  ctx.lineWidth = BH * 0.13; ctx.strokeStyle = '#a5652a'; ctx.stroke();

  // fruit pile (sits inside the basket)
  for (const p of basket.pile) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s, p.s);
    ctx.globalAlpha = clamp(p.a, 0, 1);
    FRUITS[p.type].draw(ctx, L.fruitR, 'joy', false, G.time);
    ctx.restore();
  }

  // body
  const bodyPath = () => {
    ctx.beginPath();
    ctx.ellipse(0, top, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(botW, -BH * 0.14);
    ctx.quadraticCurveTo(botW * 0.98, 0, botW * 0.78, 0);
    ctx.lineTo(-botW * 0.78, 0);
    ctx.quadraticCurveTo(-botW * 0.98, 0, -botW, -BH * 0.14);
    ctx.closePath();
  };
  bodyPath();
  const bg = ctx.createLinearGradient(-rx, 0, rx, 0);
  bg.addColorStop(0, '#c07a36'); bg.addColorStop(0.35, '#f2b766'); bg.addColorStop(0.65, '#e9a552'); bg.addColorStop(1, '#a9652a');
  ctx.fillStyle = bg; ctx.fill();
  ctx.save(); ctx.clip();
  // weave
  const rows = 4, cols = 9;
  const bodyTop = top + ry * 0.6, rowH = (0 - bodyTop) / rows;
  for (let i = 0; i < rows; i++) {
    const y0 = bodyTop + i * rowH;
    const tw = rx + (botW - rx) * ((i + 0.5) / rows);
    const cw = (tw * 2) / cols;
    for (let j = 0; j < cols; j++) {
      const cx = -tw + j * cw + cw / 2;
      const curve = ry * 0.9 * Math.sqrt(Math.max(0, 1 - (cx / rx) * (cx / rx))) * (1 - i / rows);
      ctx.fillStyle = (i + j) % 2 ? 'rgba(255,240,200,0.22)' : 'rgba(110,55,15,0.16)';
      ctx.beginPath();
      ctx.ellipse(cx, y0 + rowH * 0.5 + curve, cw * 0.46, rowH * 0.4, 0, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(110,60,20,0.35)'; ctx.lineWidth = Math.max(1.2, BH * 0.025);
    ctx.beginPath();
    const ly = y0 + rowH;
    ctx.ellipse(0, ly - ry * (1 - (i + 1) / rows) * 0.2, rx * 1.1, ry * (1 - (i + 1) / rows) + 0.01, 0, 0.05, Math.PI - 0.05);
    ctx.stroke();
  }
  ctx.restore();
  bodyPath();
  ctx.lineWidth = Math.max(2, BW * 0.014); ctx.strokeStyle = '#7d4416'; ctx.lineJoin = 'round'; ctx.stroke();

  // front rim (braided)
  ctx.beginPath(); ctx.ellipse(0, top, rx, ry, 0, Math.PI, 0, true);
  ctx.lineWidth = BH * 0.17; ctx.strokeStyle = '#9a5a22'; ctx.stroke();
  ctx.lineWidth = BH * 0.12; ctx.strokeStyle = '#d99550'; ctx.stroke();
  ctx.setLineDash([BH * 0.07, BH * 0.09]);
  ctx.lineWidth = BH * 0.12; ctx.strokeStyle = 'rgba(140,80,30,0.55)'; ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.ellipse(0, top - BH * 0.03, rx * 0.97, ry, 0, Math.PI * 0.9, Math.PI * 0.12, true);
  ctx.lineWidth = BH * 0.035; ctx.strokeStyle = 'rgba(255,235,190,0.7)'; ctx.stroke();

  // a little bow
  const bx = -rx * 0.62, by = top + ry * 0.75;
  ctx.fillStyle = '#ff5d8f'; ctx.strokeStyle = '#c92f63'; ctx.lineWidth = Math.max(1.5, BH * 0.025);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(bx + s * BH * 0.13, by, BH * 0.13, BH * 0.085, s * 0.35, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(bx - BH * 0.03, by); ctx.lineTo(bx - BH * 0.1, by + BH * 0.2); ctx.lineTo(bx - BH * 0.02, by + BH * 0.17); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + BH * 0.03, by); ctx.lineTo(bx + BH * 0.1, by + BH * 0.2); ctx.lineTo(bx + BH * 0.02, by + BH * 0.17); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by, BH * 0.055, 0, TAU); ctx.fill(); ctx.stroke();

  ctx.restore();
}

function drawStarShape(c, R) {
  c.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rr = i % 2 ? R * 0.35 : R;
    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  c.closePath();
}

function drawParticles() {
  for (const p of particles) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = p.kind === 'confetti' ? Math.min(1, k * 3) : k;
    ctx.fillStyle = p.color;
    if (p.kind === 'drop') {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * k), 0, TAU); ctx.fill();
    } else if (p.kind === 'star') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      drawStarShape(ctx, p.size * (0.5 + 0.5 * k)); ctx.fill();
    } else if (p.kind === 'confetti') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.flutter * 1.3));
      ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6);
    } else if (p.kind === 'ring') {
      const e = 1 - k;
      ctx.strokeStyle = p.color; ctx.lineWidth = 6 * k + 1;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * (0.3 + e), p.size * (0.3 + e) * 0.4, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts) {
    const prog = 1 - t.life / t.max;
    const pop = prog < 0.18 ? easeOutBack(prog / 0.18) : 1;
    const alpha = t.life < 0.3 ? t.life / 0.3 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.translate(t.x, t.y);
    ctx.scale(Math.max(0.01, pop), Math.max(0.01, pop));
    ctx.font = `700 ${Math.round(t.size)}px ${FONT}`;
    ctx.lineWidth = t.size * 0.24;
    ctx.strokeStyle = 'rgba(59,42,89,0.22)';
    ctx.strokeText(t.text, 0, t.size * 0.09);
    ctx.strokeStyle = '#fff';
    ctx.strokeText(t.text, 0, 0);
    if (t.rainbow) {
      const w = ctx.measureText(t.text).width;
      const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      const shift = (G.time * 0.6) % 1;
      RAINBOW.forEach((c, i) => g.addColorStop(((i / RAINBOW.length) + shift) % 1, c));
      ctx.fillStyle = g;
    } else ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);
    if (t.sub) {
      const fs = Math.round(t.size * 0.42);
      ctx.font = `600 ${fs}px ${FONT}`;
      ctx.lineWidth = fs * 0.3; ctx.strokeStyle = '#fff';
      ctx.strokeText(t.sub, 0, t.size * 0.72);
      ctx.fillStyle = INK; ctx.fillText(t.sub, 0, t.size * 0.72);
    }
    ctx.restore();
  }
}

/* =========================================================
   Main loop
   ========================================================= */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   Input
   ========================================================= */
function setPointerTarget(clientX) {
  basket.target = clientX;
  basket.mode = 'pointer';
}
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' || pointerDown) setPointerTarget(e.clientX);
});
canvas.addEventListener('pointerdown', (e) => {
  pointerDown = true;
  Sound.init();
  setPointerTarget(e.clientX);
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
});
window.addEventListener('pointerup', () => { pointerDown = false; });
window.addEventListener('pointercancel', () => { pointerDown = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

const LEFT_KEYS = new Set(['ArrowLeft', 'a', 'A']);
const RIGHT_KEYS = new Set(['ArrowRight', 'd', 'D']);
window.addEventListener('keydown', (e) => {
  const k = e.key;
  const inGame = G.state === 'play' || G.state === 'ready' || G.state === 'ending';
  if (LEFT_KEYS.has(k)) { keys.left = true; if (inGame) e.preventDefault(); }
  else if (RIGHT_KEYS.has(k)) { keys.right = true; if (inGame) e.preventDefault(); }
  else if (k === 'p' || k === 'P' || k === 'Escape') {
    if (G.state === 'play' || G.state === 'ready') { e.preventDefault(); pauseGame(); }
    else if (G.state === 'paused') { e.preventDefault(); resumeGame(); }
  } else if (k === 'm' || k === 'M') {
    toggleSound();
  } else if ((k === 'Enter' || k === ' ') && G.state === 'menu') {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag !== 'BUTTON') { e.preventDefault(); startGame(); }
  } else if (k === ' ' && inGame) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => {
  if (LEFT_KEYS.has(e.key)) keys.left = false;
  else if (RIGHT_KEYS.has(e.key)) keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; pointerDown = false; pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else lastT = performance.now(); });
window.addEventListener('resize', resize);

function toggleSound() {
  Sound.init();
  const m = Sound.toggle();
  const btn = $('soundBtn');
  btn.classList.toggle('muted', m);
  btn.setAttribute('aria-label', m ? 'Turn sound on (M)' : 'Turn sound off (M)');
  if (!m) Sound.click();
}

$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('restartBtn').addEventListener('click', startGame);
$('homeBtn').addEventListener('click', goMenu);
$('pauseMenuBtn').addEventListener('click', goMenu);
$('resumeBtn').addEventListener('click', resumeGame);
$('pauseBtn').addEventListener('click', () => { Sound.init(); Sound.click(); pauseGame(); });
$('soundBtn').addEventListener('click', toggleSound);
// Keep keyboard focus off the HUD buttons so Space/Enter don't re-trigger them mid-game.
for (const id of ['pauseBtn', 'soundBtn']) $(id).addEventListener('mouseup', (e) => e.currentTarget.blur());

/* =========================================================
   Boot
   ========================================================= */
function buildTitle() {
  const lines = [
    ['Fruit', ['#ff4757', '#ff8c1a', '#ffb703', '#2ecc71', '#2fa4f5']],
    ['Catcher', ['#8b5cf6', '#ff5d8f', '#ff8c1a', '#2ecc71', '#2fa4f5', '#ff4757', '#ffb703']],
  ];
  const darker = { '#ff4757': '#c9283a', '#ff8c1a': '#c86400', '#ffb703': '#c98a00', '#2ecc71': '#1e9a52', '#2fa4f5': '#1a78bf', '#8b5cf6': '#5b2fc4', '#ff5d8f': '#c93a6a' };
  const h1 = $('gameTitle');
  let i = 0;
  for (const [word, cols] of lines) {
    const line = document.createElement('span');
    line.className = 'line'; line.setAttribute('aria-hidden', 'true');
    [...word].forEach((ch, j) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch;
      s.style.setProperty('--c', cols[j % cols.length]);
      s.style.setProperty('--d', darker[cols[j % cols.length]]);
      s.style.setProperty('--i', i++);
      line.appendChild(s);
    });
    h1.appendChild(line);
  }
}

function boot() {
  buildTitle();
  document.querySelectorAll('img[data-icon]').forEach((img) => {
    img.src = fruitIcon(img.dataset.icon, img.dataset.mood === 'blink' ? 'happy' : 'happy', img.dataset.mood === 'blink');
  });
  $('scoreIcon').src = fruitIcon('apple', 'joy');
  $('bestMenu').textContent = best;
  $('soundBtn').classList.toggle('muted', Sound.muted);
  $('soundBtn').setAttribute('aria-label', Sound.muted ? 'Turn sound on (M)' : 'Turn sound off (M)');
  showOverlay('menu');
  resize();
  updateHUD(); renderHearts();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  focusLater('playBtn', 300);
  // Make sure canvas text uses the rounded font once it arrives.
  if (document.fonts && document.fonts.load) document.fonts.load(`700 40px Fredoka`).catch(() => {});
}
boot();
})();
</script>
