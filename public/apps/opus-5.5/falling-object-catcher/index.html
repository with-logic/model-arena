<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fruit Catcher!</title>
<meta name="description" content="Catch the falling fruit in your basket! A bright, friendly game for kids.">
<meta name="theme-color" content="#4fc3ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 18c6-6 20-6 22 8 2 14-8 30-22 30S8 40 10 26c2-14 16-14 22-8z' fill='%23f53b4a' stroke='%238f0f24' stroke-width='3'/%3E%3Cpath d='M32 18c0-6 2-10 6-12' stroke='%235e3a17' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='44' cy='10' rx='9' ry='5' fill='%235fd23e' transform='rotate(-25 44 10)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a59;
    --ink-soft:#7a6a99;
    --pink:#ff5d8f;
    --pink-d:#d63a6d;
    --orange:#ff9f1c;
    --yellow:#ffd23f;
    --green:#3fc46a;
    --green-d:#2a9a4f;
    --blue:#3fa9f5;
    --purple:#8b5cf6;
    --cream:#fffaf0;
    --font:'Fredoka','Baloo 2','Nunito','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#4fc3ff;
    font-family:var(--font);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  body.playing canvas#game{cursor:none}
  img{-webkit-user-drag:none;user-select:none}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:max(14px,env(safe-area-inset-top)) calc(max(16px,env(safe-area-inset-right)) + 66px) 0 max(16px,env(safe-area-inset-left));
    pointer-events:none;
    transition:opacity .35s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  #hud.hidden{opacity:0;transform:translateY(-120%)}
  .hud-group{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .hud-group.right{flex-direction:row;align-items:center}
  .pill{
    background:#fff;border-radius:999px;
    box-shadow:0 5px 0 rgba(59,42,89,.16),0 12px 28px rgba(59,42,89,.14);
  }
  .score-pill{display:flex;align-items:center;gap:8px;padding:6px 22px 6px 8px;transform-origin:30% 50%}
  .score-pill img{width:48px;height:48px;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
  .score-text{display:flex;flex-direction:column;line-height:1}
  .score-text .label{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-soft)}
  #score{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:1.2ch}
  .score-pill.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
  .score-pill.bump-big{animation:bumpBig .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-3deg)}100%{transform:scale(1)}}
  @keyframes bumpBig{0%{transform:scale(1)}30%{transform:scale(1.32) rotate(4deg);box-shadow:0 5px 0 rgba(59,42,89,.16),0 0 0 8px rgba(255,210,63,.6)}100%{transform:scale(1)}}
  .level-pill{
    padding:5px 14px 6px;font-size:15px;font-weight:600;letter-spacing:.08em;color:#fff;
    background:linear-gradient(180deg,#a98bff,#7c4dea);
    box-shadow:0 4px 0 #5b2fc4,0 10px 22px rgba(91,47,196,.3);
  }
  .level-pill b{font-size:18px;margin-left:2px}
  .level-pill.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
  .lives-pill{display:flex;align-items:center;gap:4px;padding:8px 12px}
  .heart{width:38px;height:38px;display:block;overflow:visible;transition:transform .2s}
  .heart{--hf:#ff4d6d;--he:#c9184a;--hs:.75}
  .heart.lost{--hf:#e4ddef;--he:#c3b8d6;--hs:0;animation:heartBreak .7s ease forwards}
  @keyframes heartBreak{0%{transform:scale(1)}20%{transform:scale(1.45) rotate(-14deg)}40%{transform:scale(.8) rotate(10deg)}65%{transform:scale(1.05) rotate(-4deg)}100%{transform:scale(.88)}}
  .lives-pill.danger .heart:not(.lost){animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .round-btn{
    pointer-events:auto;width:54px;height:54px;border-radius:50%;
    display:grid;place-items:center;background:#fff;color:var(--ink);
    box-shadow:0 5px 0 rgba(59,42,89,.18),0 12px 24px rgba(59,42,89,.14);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .round-btn svg{width:26px;height:26px}
  .round-btn:hover{transform:translateY(-2px)}
  .round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,42,89,.18),0 4px 10px rgba(59,42,89,.14)}
  .round-btn:focus-visible,.btn:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 8px rgba(139,92,246,.55)}
  #soundBtn{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}
  #soundBtn .off{display:none}
  #soundBtn.muted .on{display:none}
  #soundBtn.muted .off{display:block}

  /* ---------- Banner ---------- */
  #banner{
    position:fixed;left:50%;top:40%;z-index:6;pointer-events:none;
    transform:translate(-50%,-50%);opacity:0;white-space:nowrap;
    font-size:clamp(54px,12vw,120px);font-weight:700;letter-spacing:.01em;color:#fff;
    --bc:#ff5d8f;
    text-shadow:
      0 0 0 var(--bc),
      4px 0 0 var(--bc),-4px 0 0 var(--bc),0 4px 0 var(--bc),0 -4px 0 var(--bc),
      3px 3px 0 var(--bc),-3px 3px 0 var(--bc),3px -3px 0 var(--bc),-3px -3px 0 var(--bc),
      0 10px 0 var(--bc),4px 9px 0 var(--bc),-4px 9px 0 var(--bc),
      0 18px 30px rgba(59,42,89,.3);
  }
  #banner.go{animation:bannerPop 1.15s cubic-bezier(.34,1.56,.64,1) forwards}
  body.paused #banner{animation-play-state:paused}
  @keyframes bannerPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}
    36%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    74%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-75%) scale(.92)}
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));
    overflow-y:auto;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.12),rgba(59,42,89,.38));
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;
  }
  .overlay.show{opacity:1;visibility:visible}
  .card{
    position:relative;margin:auto;width:100%;max-width:540px;text-align:center;
    background:var(--cream);border:6px solid #fff;border-radius:40px;
    padding:30px 32px 28px;
    box-shadow:0 12px 0 rgba(59,42,89,.16),0 34px 70px rgba(59,42,89,.3);
    transform:scale(.8) translateY(40px);opacity:.4;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  }
  .overlay.show .card{transform:none;opacity:1}
  .card::before{
    content:"";position:absolute;inset:10px;border-radius:30px;pointer-events:none;
    border:3px dashed rgba(255,159,28,.28);
  }

  .title{line-height:.92;font-weight:700;font-size:clamp(50px,12vw,88px);letter-spacing:.01em;margin:4px 0 10px}
  .title .line{display:block;white-space:nowrap}
  .title .ch{
    display:inline-block;color:var(--c);
    text-shadow:0 5px 0 var(--d),0 10px 18px rgba(59,42,89,.18);
    animation:wave 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.13s);
  }
  @keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-4deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(3px) rotate(3deg)}}
  .tagline{font-size:clamp(17px,3.6vw,21px);font-weight:500;color:var(--ink-soft);margin-bottom:18px}

  .rules{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .rule{
    display:flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-radius:999px;
    background:#fff;box-shadow:0 3px 0 rgba(59,42,89,.1);font-size:15px;font-weight:500;
  }
  .rule img{width:34px;height:34px}
  .rule b{font-weight:700;color:var(--pink-d)}
  .rule .mini-hearts{display:flex;padding-left:6px}
  .rule .mini-hearts svg{width:18px;height:18px;margin-right:-3px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    font-weight:700;border-radius:999px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,filter .15s;
  }
  .btn svg{width:.9em;height:.9em}
  .btn-primary{
    font-size:clamp(28px,6vw,36px);padding:14px 52px 16px;color:#fff;
    background:linear-gradient(180deg,#ff86ad 0%,#ff4f86 55%,#f43f78 100%);
    box-shadow:0 8px 0 var(--pink-d),0 16px 30px rgba(214,58,109,.35),inset 0 3px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(160,20,70,.35);
  }
  .btn-primary:hover{transform:translateY(-3px);filter:brightness(1.05);box-shadow:0 11px 0 var(--pink-d),0 20px 34px rgba(214,58,109,.38),inset 0 3px 0 rgba(255,255,255,.35)}
  .btn-primary:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-d),0 6px 14px rgba(214,58,109,.3),inset 0 3px 0 rgba(255,255,255,.35)}
  .btn-primary.breathe{animation:breathe 2.2s ease-in-out infinite}
  .btn-primary.breathe:hover,.btn-primary.breathe:active{animation:none}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .btn-secondary{
    font-size:clamp(20px,4.4vw,24px);padding:12px 30px 13px;background:#fff;color:var(--ink);
    box-shadow:0 6px 0 #d9cfe9,0 12px 22px rgba(59,42,89,.12);
  }
  .btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 0 #d9cfe9,0 14px 24px rgba(59,42,89,.14)}
  .btn-secondary:active{transform:translateY(5px);box-shadow:0 1px 0 #d9cfe9,0 4px 10px rgba(59,42,89,.12)}
  .btn-green{
    font-size:clamp(24px,5vw,30px);padding:12px 38px 14px;color:#fff;
    background:linear-gradient(180deg,#6fe08e,#34c062);
    box-shadow:0 7px 0 var(--green-d),0 14px 26px rgba(42,154,79,.3),inset 0 3px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(20,100,40,.3);
  }
  .btn-green:hover{transform:translateY(-2px)}
  .btn-green:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d),0 5px 12px rgba(42,154,79,.3)}
  .btn-row{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;align-items:center;margin-top:6px}
  .locked .btn{pointer-events:none}

  .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:15px;font-weight:500;color:var(--ink-soft)}
  .ctl{display:inline-flex;align-items:center;gap:6px}
  .ctl svg{width:22px;height:22px;color:var(--ink-soft)}
  kbd{
    font-family:inherit;font-size:14px;font-weight:700;display:inline-grid;place-items:center;
    min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:#fff;color:var(--ink);
    box-shadow:0 3px 0 #d9cfe9,inset 0 0 0 2px #ece6f5;
  }
  .best{
    display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 16px;border-radius:999px;
    background:#fff3c4;color:#8a5a00;font-weight:600;font-size:17px;
  }
  .best svg{width:22px;height:22px}

  .deco{position:absolute;width:var(--s,84px);height:var(--s,84px);pointer-events:none;
    animation:floaty 3.6s ease-in-out infinite;animation-delay:var(--dl,0s);filter:drop-shadow(0 8px 10px rgba(59,42,89,.18))}
  .deco img{width:100%;height:100%;transform:rotate(var(--r,0deg))}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* Game over */
  .big-title{font-size:clamp(42px,10vw,64px);font-weight:700;line-height:1.05;margin:6px 0 8px;color:var(--pink);
    text-shadow:0 5px 0 var(--pink-d),0 10px 18px rgba(59,42,89,.15)}
  .sub{font-size:18px;color:var(--ink-soft);font-weight:500}
  .stars{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
  .stars svg{width:62px;height:62px;overflow:visible}
  .stars svg:nth-child(2){transform:translateY(-12px);width:72px;height:72px}
  .stars svg{--sf:#ece6f5;--se:#d9cfe9}
  .stars .on{--sf:url(#starGrad);--se:#e08a00;animation:starPop .55s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 4px 6px rgba(224,138,0,.35))}
  @keyframes starPop{0%{transform:scale(.2) rotate(-60deg)}100%{transform:scale(1) rotate(0)}}
  .stars svg.on:nth-child(2){animation-name:starPop2}
  @keyframes starPop2{0%{transform:translateY(-12px) scale(.2) rotate(-60deg)}100%{transform:translateY(-12px) scale(1) rotate(0)}}
  .final{display:flex;flex-direction:column;align-items:center;margin:2px 0 6px}
  .final .label{font-size:14px;letter-spacing:.16em;font-weight:600;color:var(--ink-soft)}
  #finalScore{font-size:clamp(64px,15vw,92px);font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .best-line{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:#fff;font-weight:500;font-size:16px;box-shadow:0 3px 0 rgba(59,42,89,.08)}
  .chip b{font-weight:700}
  .chip svg{width:18px;height:18px}
  .ribbon{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-3deg);
    padding:8px 26px 10px;border-radius:14px;font-weight:700;font-size:20px;color:#7a4b00;white-space:nowrap;
    background:linear-gradient(180deg,#fff27a,#ffc928);box-shadow:0 5px 0 #e0a100,0 12px 22px rgba(224,161,0,.35);
    display:none;
  }
  .ribbon.show{display:block;animation:ribbon .7s .5s cubic-bezier(.34,1.56,.64,1) both, wiggle 2s 1.4s ease-in-out infinite}
  @keyframes ribbon{0%{transform:translateX(-50%) scale(0) rotate(-20deg)}100%{transform:translateX(-50%) scale(1) rotate(-3deg)}}
  @keyframes wiggle{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg) scale(1.04)}}
  .tally-wrap{background:#fff;border-radius:24px;padding:12px 14px 14px;margin:0 0 20px;box-shadow:inset 0 0 0 2px #f1ebf8}
  .tally-title{font-size:13px;letter-spacing:.14em;font-weight:600;color:var(--ink-soft);margin-bottom:8px}
  .tally{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px}
  .tally-item{display:flex;align-items:center;gap:2px;font-weight:700;font-size:18px;opacity:0;animation:tallyIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
  .tally-item img{width:44px;height:44px}
  .tally-empty{color:var(--ink-soft);font-weight:500;font-size:16px;padding:6px 0}
  @keyframes tallyIn{0%{opacity:0;transform:translateY(12px) scale(.6)}100%{opacity:1;transform:none}}

  .pause-card{max-width:420px}
  .pause-card .big-title{color:var(--purple);text-shadow:0 5px 0 #5b2fc4,0 10px 18px rgba(59,42,89,.15)}
  .pause-card .btn-row{flex-direction:column;margin-top:22px}
  .pause-card .btn{min-width:230px}
  .pause-art{width:96px;height:96px;margin:0 auto -4px;display:block;animation:floaty 3s ease-in-out infinite}

  @media (max-width:560px){
    .card{padding:24px 18px 22px;border-radius:32px}
    .card::before{inset:8px;border-radius:24px}
    .score-pill{padding:4px 16px 4px 6px;gap:6px}
    .score-pill img{width:36px;height:36px}
    #score{font-size:30px}
    .score-text .label{font-size:10px}
    .level-pill{font-size:12px;padding:4px 11px 5px}
    .level-pill b{font-size:15px}
    .lives-pill{padding:6px 8px;gap:2px}
    .heart{width:28px;height:28px}
    .round-btn{width:46px;height:46px}
    .round-btn svg{width:22px;height:22px}
    #hud{padding-right:calc(max(12px,env(safe-area-inset-right)) + 54px);padding-left:max(12px,env(safe-area-inset-left))}
    #soundBtn{right:max(12px,env(safe-area-inset-right))}
    .rule{font-size:13px}
    .rule img{width:28px;height:28px}
    .stars svg{width:50px;height:50px}
    .stars svg:nth-child(2){width:58px;height:58px}
    .tally-item img{width:36px;height:36px}
    .deco{--s:60px !important}
  }
  @media (max-height:560px){
    .overlay{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
    .card{padding:16px 22px 16px;max-width:680px;border-radius:30px}
    .card::before{inset:7px;border-radius:22px}
    .title{font-size:clamp(38px,11vh,56px);margin:0 0 4px}
    .title .line{display:inline-block;margin:0 .14em}
    .tagline{font-size:17px;margin-bottom:10px}
    .rules{margin-bottom:12px;gap:8px}
    .rule{font-size:14px;padding:4px 12px 4px 4px}
    .rule img{width:28px;height:28px}
    .btn-primary{font-size:26px;padding:10px 40px 12px}
    .controls{margin-top:12px;font-size:14px}
    .best{margin-top:10px;font-size:15px;padding:4px 14px}
    .deco{--s:58px !important}
    .over-card{max-width:760px;display:grid;grid-template-columns:1fr 1.15fr;column-gap:22px;align-items:center;padding-top:22px}
    .over-card .big-title{font-size:44px}
    .stars{margin:4px 0 0}
    .stars svg{width:44px;height:44px}
    .stars svg:nth-child(2){width:52px;height:52px}
    #finalScore{font-size:60px}
    .over-card .sub{font-size:15px}
    .tally-wrap{margin-bottom:12px;padding:8px 12px 10px}
    .tally-item img{width:34px;height:34px}
    .over-card .btn-primary{font-size:24px;padding:10px 26px 12px}
    .over-card .btn-secondary{font-size:19px;padding:10px 22px 11px}
    .pause-art{width:64px;height:64px}
    .pause-card{max-width:560px}
    .pause-card .btn-row{flex-direction:row;margin-top:14px}
    .pause-card .btn{min-width:0}
    .pause-card .btn-green{font-size:22px;padding:10px 24px 12px}
    .pause-card .btn-secondary{font-size:18px;padding:10px 20px 11px}
  }
  @media (prefers-reduced-motion:reduce){
    .title .ch,.deco,.btn-primary.breathe,.pause-art,.lives-pill.danger .heart:not(.lost){animation:none !important}
  }
</style>
</head>

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Fredoka","Baloo 2","Nunito","Trebuchet MS","Comic Sans MS",system-ui,sans-serif';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

/* =========================================================
   Sound (tiny Web Audio synth — no files needed)
   ========================================================= */
const Sound = (() => {
  let ac = null, master = null;
  let muted = !!store.get('fruitCatcher.muted', false);
  const VOL = 0.55;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : VOL;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function tone({ freq = 440, to = null, type = 'sine', dur = 0.15, vol = 0.3, delay = 0, attack = 0.006 }) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  let noiseBuf = null;
  function noise({ dur = 0.2, vol = 0.2, delay = 0, freq = 900, type = 'lowpass' }) {
    if (!ac || muted) return;
    if (!noiseBuf) {
      const len = Math.floor(ac.sampleRate * 0.6);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const note = (step, base = 523.25) => {
    const oct = Math.floor(step / 5), idx = ((step % 5) + 5) % 5;
    return base * Math.pow(2, (PENTA[idx] + 12 * oct) / 12);
  };
  const semi = (s, base = 523.25) => base * Math.pow(2, s / 12);

  return {
    init,
    get muted() { return muted; },
    toggle() {
      muted = !muted; store.set('fruitCatcher.muted', muted);
      if (master) master.gain.setTargetAtTime(muted ? 0 : VOL, ac.currentTime, 0.02);
      return muted;
    },
    // Each catch climbs a pentatonic scale, so streaks literally sound like a song.
    catch(combo) {
      const f = note(Math.min(combo - 1, 12));
      tone({ freq: f, type: 'triangle', dur: 0.2, vol: 0.32 });
      tone({ freq: f * 2, type: 'sine', dur: 0.12, vol: 0.1, delay: 0.015 });
      tone({ freq: 220, to: 110, type: 'sine', dur: 0.09, vol: 0.22 });
    },
    golden() {
      [0, 4, 7, 12, 16, 19].forEach((s, i) => tone({ freq: semi(s, 783.99), type: 'triangle', dur: 0.22, vol: 0.2, delay: i * 0.055 }));
      tone({ freq: 220, to: 110, type: 'sine', dur: 0.1, vol: 0.25 });
    },
    bonk() { tone({ freq: 330, to: 160, type: 'square', dur: 0.08, vol: 0.08 }); noise({ dur: 0.06, vol: 0.18, freq: 1800, type: 'bandpass' }); },
    miss() {
      tone({ freq: 440, to: 150, type: 'triangle', dur: 0.4, vol: 0.28 });
      noise({ dur: 0.22, vol: 0.3, freq: 700 });
    },
    level() {
      [0, 4, 7, 12].forEach((s, i) => {
        tone({ freq: semi(s), type: 'triangle', dur: 0.22, vol: 0.22, delay: i * 0.09 });
        tone({ freq: semi(s + 12), type: 'sine', dur: 0.12, vol: 0.06, delay: i * 0.09 });
      });
    },
    praise() { [7, 12].forEach((s, i) => tone({ freq: semi(s, 659.25), type: 'sine', dur: 0.16, vol: 0.14, delay: i * 0.07 })); },
    ready() { tone({ freq: 523.25, type: 'triangle', dur: 0.18, vol: 0.25 }); },
    go() { tone({ freq: 783.99, type: 'triangle', dur: 0.18, vol: 0.28 }); tone({ freq: 1046.5, type: 'triangle', dur: 0.3, vol: 0.26, delay: 0.1 }); },
    over() { [7, 4, 0, -5].forEach((s, i) => tone({ freq: semi(s), type: 'triangle', dur: 0.32, vol: 0.24, delay: 0.1 + i * 0.17 })); },
    best() { [0, 4, 7, 12, 7, 12, 16].forEach((s, i) => tone({ freq: semi(s), type: 'triangle', dur: 0.2, vol: 0.22, delay: 0.5 + i * 0.1 })); },
    star(i) { tone({ freq: semi(i * 4 + 7, 659.25), type: 'triangle', dur: 0.2, vol: 0.2 }); },
    click() { tone({ freq: 620, to: 930, type: 'sine', dur: 0.09, vol: 0.2 }); },
  };
})();

/* =========================================================
   Fruit artwork (all procedurally drawn — crisp at any size)
   ========================================================= */
const INK = '#3b2a59';

function radial(c, r, c1, c2, c3, ox = -0.35, oy = -0.4) {
  const g = c.createRadialGradient(r * ox, r * oy, r * 0.05, 0, 0, r * 1.15);
  g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c3);
  return g;
}
function strokeOutline(c, r, color) {
  c.lineWidth = Math.max(1.5, r * 0.07); c.strokeStyle = color;
  c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
}
function shine(c, x, y, rx, ry, rot, a = 0.6) {
  c.fillStyle = `rgba(255,255,255,${a})`;
  c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill();
}
function leafShape(c, x, y, len, ang, r) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.45, -len * 0.44, len, 0);
  c.quadraticCurveTo(len * 0.45, len * 0.44, 0, 0);
  c.closePath();
  const g = c.createLinearGradient(0, -len * 0.3, 0, len * 0.3);
  g.addColorStop(0, '#86e85a'); g.addColorStop(1, '#3fb52a');
  c.fillStyle = g; c.fill();
  c.lineWidth = Math.max(1.2, r * 0.05); c.strokeStyle = '#25801c'; c.lineJoin = 'round'; c.stroke();
  c.beginPath(); c.moveTo(len * 0.12, 0); c.lineTo(len * 0.75, 0);
  c.lineWidth = Math.max(1, r * 0.03); c.stroke();
  c.restore();
}
function stemLine(c, x1, y1, cx, cy, x2, y2, r, light = '#9a6a35', dark = '#5e3a17') {
  c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(cx, cy, x2, y2);
  c.lineCap = 'round';
  c.lineWidth = Math.max(2.5, r * 0.14); c.strokeStyle = dark; c.stroke();
  c.lineWidth = Math.max(1, r * 0.07); c.strokeStyle = light; c.stroke();
}

// Friendly face. mood: happy | joy | wow | sad
function drawFace(c, r, mood, blink, x = 0, y = 0) {
  c.save(); c.translate(x, y);
  const ex = r * 0.3, ey = -r * 0.04, er = r * 0.105;
  c.fillStyle = 'rgba(255,105,150,0.45)';
  c.beginPath(); c.ellipse(-r * 0.5, r * 0.17, r * 0.13, r * 0.08, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(r * 0.5, r * 0.17, r * 0.13, r * 0.08, 0, 0, TAU); c.fill();
  c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = 'round'; c.lineJoin = 'round';
  c.lineWidth = Math.max(1.4, r * 0.07);
  if (mood === 'joy') {
    for (const s of [-1, 1]) { c.beginPath(); c.arc(s * ex, ey + er * 0.7, er * 0.95, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
  } else if (blink) {
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * ex - er, ey); c.quadraticCurveTo(s * ex, ey + er * 0.9, s * ex + er, ey); c.stroke(); }
  } else {
    const big = mood === 'wow' ? 1.18 : 1;
    for (const s of [-1, 1]) {
      c.fillStyle = INK; c.beginPath(); c.ellipse(s * ex, ey, er * 0.85 * big, er * 1.12 * big, 0, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex - er * 0.28, ey - er * 0.42, er * 0.36 * big, 0, TAU); c.fill();
    }
    if (mood === 'sad') {
      c.beginPath();
      c.moveTo(-ex - er * 1.1, ey - er * 1.5); c.lineTo(-ex + er * 0.9, ey - er * 2.2);
      c.moveTo(ex + er * 1.1, ey - er * 1.5); c.lineTo(ex - er * 0.9, ey - er * 2.2);
      c.lineWidth = Math.max(1.2, r * 0.055); c.stroke();
    }
  }
  c.fillStyle = INK; c.lineWidth = Math.max(1.4, r * 0.07);
  if (mood === 'sad') {
    c.beginPath(); c.arc(0, r * 0.36, r * 0.13, Math.PI * 1.2, Math.PI * 1.8); c.stroke();
    c.fillStyle = '#6cc8ff';
    c.beginPath();
    c.moveTo(ex + er * 0.5, ey + er * 1.3);
    c.quadraticCurveTo(ex + er * 1.5, ey + er * 2.7, ex + er * 0.5, ey + er * 2.9);
    c.quadraticCurveTo(ex - er * 0.5, ey + er * 2.7, ex + er * 0.5, ey + er * 1.3);
    c.fill();
  } else if (mood === 'wow') {
    c.beginPath(); c.ellipse(0, r * 0.23, r * 0.08, r * 0.105, 0, 0, TAU); c.fill();
  } else if (mood === 'joy') {
    c.beginPath(); c.moveTo(r * 0.17, r * 0.1); c.arc(0, r * 0.1, r * 0.17, 0, Math.PI); c.closePath(); c.fill();
    c.save(); c.clip();
    c.fillStyle = '#ff7a9c'; c.beginPath(); c.ellipse(0, r * 0.26, r * 0.1, r * 0.07, 0, 0, TAU); c.fill();
    c.restore();
  } else {
    c.beginPath(); c.arc(0, r * 0.08, r * 0.15, Math.PI * 0.18, Math.PI * 0.82); c.stroke();
  }
  c.restore();
}

function drawApple(c, r, mood, blink) {
  stemLine(c, 0, -r * 0.56, -r * 0.02, -r * 0.85, r * 0.1, -r * 1.02, r);
  leafShape(c, r * 0.06, -r * 0.82, r * 0.55, -0.45, r);
  c.beginPath();
  c.moveTo(0, -r * 0.6);
  c.bezierCurveTo(r * 0.4, -r * 0.98, r * 1.05, -r * 0.78, r * 0.98, -r * 0.05);
  c.bezierCurveTo(r * 0.93, r * 0.6, r * 0.55, r * 0.97, r * 0.22, r * 0.92);
  c.quadraticCurveTo(0, r * 0.86, -r * 0.22, r * 0.92);
  c.bezierCurveTo(-r * 0.55, r * 0.97, -r * 0.93, r * 0.6, -r * 0.98, -r * 0.05);
  c.bezierCurveTo(-r * 1.05, -r * 0.78, -r * 0.4, -r * 0.98, 0, -r * 0.6);
  c.closePath();
  c.fillStyle = radial(c, r, '#ff9c9c', '#f53b4a', '#c4142d');
  c.fill(); strokeOutline(c, r, '#8f0f24');
  shine(c, -r * 0.5, -r * 0.38, r * 0.2, r * 0.11, -0.8);

}

const ORANGE_DOTS = [[-.62, -.32], [-.3, -.62], [.3, -.6], [.62, -.3], [.76, .15], [-.76, .15], [-.55, .62], [.55, .62], [0, .8], [-.05, -.42], [.26, .5], [-.26, .5]];
function drawOrange(c, r, mood, blink) {

  c.fillStyle = '#6aa832'; c.beginPath(); c.ellipse(0, -r * 0.9, r * 0.11, r * 0.07, 0, 0, TAU); c.fill();
  leafShape(c, r * 0.04, -r * 0.92, r * 0.55, -0.3, r);

function drawBanana(c, r, mood, blink) {
  c.save(); c.rotate(-0.12);
  c.beginPath(); c.moveTo(r * 0.86, -r * 0.42); c.lineTo(r * 1.02, -r * 0.74);
  c.lineCap = 'round'; c.lineWidth = r * 0.2; c.strokeStyle = '#6b4d1c'; c.stroke();
  c.lineWidth = r * 0.11; c.strokeStyle = '#a3803f'; c.stroke();
  c.beginPath();
  c.moveTo(-r * 0.98, -r * 0.42);

  c.bezierCurveTo(r * 0.62, r * 0.16, -r * 0.48, r * 0.2, -r * 0.78, -r * 0.5);

  c.fillStyle = '#6b4d1c'; c.beginPath(); c.ellipse(-r * 0.9, -r * 0.47, r * 0.085, r * 0.06, 0.6, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-r * 0.8, -r * 0.18); c.quadraticCurveTo(-r * 0.74, r * 0.25, -r * 0.48, r * 0.42);

  drawFace(c, r * 0.62, mood, blink, r * 0.04, r * 0.34);

}

const STRAW_SEEDS = [[-.48, -.4], [0, -.36], [.48, -.4], [-.8, -.06], [.8, -.06], [-.7, .38], [.7, .38], [-.4, .68], [.4, .68], [0, .86]];
const CALYX = [2.6, -3.0, -2.15, -1.0, -0.15, 0.55];
function drawStrawberry(c, r, mood, blink) {
  c.beginPath();
  c.moveTo(0, -r * 0.66);
  c.bezierCurveTo(r * 0.6, -r * 0.86, r * 1.04, -r * 0.52, r * 0.92, -r * 0.02);
  c.bezierCurveTo(r * 0.82, r * 0.5, r * 0.32, r * 0.95, 0, r * 1.0);
  c.bezierCurveTo(-r * 0.32, r * 0.95, -r * 0.82, r * 0.5, -r * 0.92, -r * 0.02);
  c.bezierCurveTo(-r * 1.04, -r * 0.52, -r * 0.6, -r * 0.86, 0, -r * 0.66);
  c.closePath();
  c.fillStyle = radial(c, r, '#ff9fb0', '#ff2f58', '#cf0f3c'); c.fill(); strokeOutline(c, r, '#930a2b');
  c.fillStyle = '#ffeaa8';
  for (const [x, y] of STRAW_SEEDS) { c.beginPath(); c.ellipse(x * r, y * r, r * 0.045, r * 0.07, x * 0.6, 0, TAU); c.fill(); }
  shine(c, -r * 0.52, -r * 0.3, r * 0.16, r * 0.09, -0.7, 0.5);
  stemLine(c, 0, -r * 0.66, r * 0.02, -r * 0.86, r * 0.1, -r * 0.98, r, '#6fc94a', '#2a7d22');
  c.save(); c.translate(0, -r * 0.62);
  const len = r * 0.42, w = r * 0.13;
  for (const a of CALYX) {
    c.save(); c.rotate(a);
    c.beginPath(); c.moveTo(0, -w);
    c.quadraticCurveTo(len * 0.6, -w, len, 0);
    c.quadraticCurveTo(len * 0.6, w, 0, w);
    c.closePath();
    c.fillStyle = '#4ccb43'; c.fill();
    c.lineWidth = Math.max(1.2, r * 0.05); c.strokeStyle = '#25801c'; c.lineJoin = 'round'; c.stroke();
    c.restore();
  }
  c.fillStyle = '#4ccb43'; c.beginPath(); c.arc(0, 0, r * 0.12, 0, TAU); c.fill();
  c.restore();
  drawFace(c, r, mood, blink, 0, r * 0.16);
}

const GRAPE_RING = [[-.5, -.52], [0, -.64], [.5, -.52], [-.74, -.04], [.74, -.04], [-.46, .46], [.46, .46], [0, .74]];
function grape(c, x, y, gr, r) {
  c.beginPath(); c.arc(x, y, gr, 0, TAU);
  const g = c.createRadialGradient(x - gr * 0.35, y - gr * 0.4, gr * 0.1, x, y, gr * 1.1);
  g.addColorStop(0, '#dcc1ff'); g.addColorStop(0.5, '#9a5cf5'); g.addColorStop(1, '#6a2fd0');
  c.fillStyle = g; c.fill(); strokeOutline(c, r, '#4a1a99');
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - gr * 0.38, y - gr * 0.4, gr * 0.22, gr * 0.13, -0.7, 0, TAU); c.fill();
}
function drawGrapes(c, r, mood, blink) {

function drawWatermelon(c, r, mood, blink) {
  c.save(); c.rotate(-0.12);
  const cy = -r * 0.42, R = r * 1.04;
  c.beginPath(); c.moveTo(-R, cy); c.arc(0, cy, R, Math.PI, 0, true); c.closePath();
  c.fillStyle = '#3fae3a'; c.fill(); strokeOutline(c, r, '#1d6b1b');
  c.save(); c.clip();
  c.strokeStyle = 'rgba(25,100,25,.55)'; c.lineWidth = r * 0.06;
  for (let i = 1; i < 8; i++) {
    const a = Math.PI * (i / 8);
    c.beginPath(); c.moveTo(Math.cos(a) * R * 0.86, cy + Math.sin(a) * R * 0.86); c.lineTo(Math.cos(a) * R * 1.1, cy + Math.sin(a) * R * 1.1); c.stroke();
  }
  c.restore();
  c.beginPath(); c.moveTo(-R * 0.88, cy); c.arc(0, cy, R * 0.88, Math.PI, 0, true); c.closePath();
  c.fillStyle = '#d4f7a6'; c.fill();
  c.beginPath(); c.moveTo(-R * 0.8, cy); c.arc(0, cy, R * 0.8, Math.PI, 0, true); c.closePath();
  const g = c.createRadialGradient(-r * 0.2, cy + r * 0.12, r * 0.05, 0, cy, R * 0.85);
  g.addColorStop(0, '#ffa6b6'); g.addColorStop(0.6, '#ff4d6d'); g.addColorStop(1, '#e92e52');
  c.fillStyle = g; c.fill();
  c.beginPath(); c.moveTo(-R, cy); c.lineTo(R, cy); c.lineWidth = Math.max(1.5, r * 0.07); c.strokeStyle = '#1d6b1b'; c.lineCap = 'round'; c.stroke();
  c.fillStyle = INK;
  for (const deg of [22, 50, 130, 158, 90]) {
    const a = deg * Math.PI / 180, rr = deg === 90 ? R * 0.66 : R * 0.6;
    c.save(); c.translate(Math.cos(a) * rr, cy + Math.sin(a) * rr); c.rotate(a + Math.PI / 2);
    c.beginPath(); c.ellipse(0, 0, r * 0.04, r * 0.075, 0, 0, TAU); c.fill(); c.restore();
  }
  shine(c, -R * 0.55, cy + r * 0.08, r * 0.14, r * 0.05, 0.25, 0.45);
  drawFace(c, r * 0.68, mood, blink, 0, cy + r * 0.3);
  c.restore();
}

function drawPear(c, r, mood, blink) {
  stemLine(c, 0, -r * 0.78, r * 0.02, -r * 0.95, r * 0.12, -r * 1.06, r);
  leafShape(c, r * 0.06, -r * 0.92, r * 0.5, -0.5, r);
  c.beginPath();
  c.moveTo(0, -r * 0.82);
  c.bezierCurveTo(r * 0.34, -r * 0.84, r * 0.4, -r * 0.45, r * 0.52, -r * 0.2);
  c.bezierCurveTo(r * 0.98, r * 0.22, r * 0.92, r * 0.98, 0, r * 0.98);
  c.bezierCurveTo(-r * 0.92, r * 0.98, -r * 0.98, r * 0.22, -r * 0.52, -r * 0.2);
  c.bezierCurveTo(-r * 0.4, -r * 0.45, -r * 0.34, -r * 0.84, 0, -r * 0.82);
  c.closePath();
  c.fillStyle = radial(c, r, '#f2ffb0', '#bde540', '#86b51a', -0.3, 0.0);
  c.fill(); strokeOutline(c, r, '#5b8510');
  c.fillStyle = 'rgba(255,140,90,.2)'; c.beginPath(); c.ellipse(r * 0.42, r * 0.5, r * 0.28, r * 0.24, 0, 0, TAU); c.fill();
  shine(c, -r * 0.45, r * 0.05, r * 0.15, r * 0.09, -1.0);
  shine(c, -r * 0.18, -r * 0.5, r * 0.05, r * 0.1, -0.3, 0.45);

}

function cherryBall(c, x, y, cr, r) {
  c.beginPath(); c.arc(x, y, cr, 0, TAU);
  const g = c.createRadialGradient(x - cr * 0.35, y - cr * 0.4, cr * 0.08, x, y, cr * 1.1);
  g.addColorStop(0, '#ffa0b6'); g.addColorStop(0.5, '#ec1b4b'); g.addColorStop(1, '#a5002e');
  c.fillStyle = g; c.fill(); strokeOutline(c, r, '#75001f');
  shine(c, x - cr * 0.42, y - cr * 0.38, cr * 0.22, cr * 0.13, -0.7, 0.6);
}
function drawCherry(c, r, mood, blink) {
  const ax = -r * 0.44, ay = r * 0.36, bx = r * 0.45, by = r * 0.26, cr = r * 0.5, jx = r * 0.12, jy = -r * 0.98;
  stemLine(c, ax + r * 0.04, ay - cr * 0.85, -r * 0.3, -r * 0.45, jx, jy, r, '#7cc443', '#3d7a1c');
  stemLine(c, bx, by - cr * 0.85, r * 0.38, -r * 0.4, jx, jy, r, '#7cc443', '#3d7a1c');
  leafShape(c, jx, jy, r * 0.55, -0.1, r);
  cherryBall(c, ax, ay, cr, r);
  drawFace(c, r * 0.6, mood, blink, ax, ay + r * 0.04);
  cherryBall(c, bx, by, cr, r);
  drawFace(c, r * 0.6, mood, blink, bx, by + r * 0.04);
}

function drawPeach(c, r, mood, blink) {
  stemLine(c, 0, -r * 0.7, -r * 0.02, -r * 0.88, r * 0.06, -r * 0.98, r);
  leafShape(c, r * 0.04, -r * 0.86, r * 0.55, -0.55, r);
  leafShape(c, -r * 0.02, -r * 0.86, r * 0.4, -2.65, r);
  c.beginPath();
  c.moveTo(0, -r * 0.72);
  c.bezierCurveTo(r * 0.5, -r * 1.0, r * 1.02, -r * 0.62, r * 0.96, r * 0.02);
  c.bezierCurveTo(r * 0.9, r * 0.66, r * 0.45, r * 0.98, 0, r * 0.96);
  c.bezierCurveTo(-r * 0.45, r * 0.98, -r * 0.9, r * 0.66, -r * 0.96, r * 0.02);
  c.bezierCurveTo(-r * 1.02, -r * 0.62, -r * 0.5, -r * 1.0, 0, -r * 0.72);
  c.closePath();
  const g = c.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.05, r * 0.1, r * 0.1, r * 1.15);
  g.addColorStop(0, '#fff2dc'); g.addColorStop(0.45, '#ffc08c'); g.addColorStop(1, '#ff7a73');
  c.fillStyle = g; c.fill(); strokeOutline(c, r, '#cf523e');
  c.beginPath(); c.moveTo(-r * 0.02, -r * 0.7); c.bezierCurveTo(-r * 0.3, -r * 0.56, -r * 0.46, -r * 0.4, -r * 0.54, -r * 0.16);
  c.strokeStyle = 'rgba(207,82,62,0.45)'; c.lineWidth = r * 0.055; c.lineCap = 'round'; c.stroke();
  shine(c, -r * 0.3, -r * 0.48, r * 0.14, r * 0.08, -0.5, 0.55);
  drawFace(c, r, mood, blink, r * 0.04, r * 0.18);
}

function starPath(c, R, ri, oy) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 === 0 ? R : ri;
    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr + oy);
  }
  c.closePath();
}
function drawStar(c, r, mood, blink, t = 0) {
  const pulse = 1 + Math.sin(t * 6) * 0.08;
  const gl = c.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.7 * pulse);
  gl.addColorStop(0, 'rgba(255,245,150,0.85)'); gl.addColorStop(0.5, 'rgba(255,220,80,0.32)'); gl.addColorStop(1, 'rgba(255,220,80,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(0, 0, r * 1.7 * pulse, 0, TAU); c.fill();
  starPath(c, r * 1.0, r * 0.52, r * 0.06);
  c.lineJoin = 'round';
  c.lineWidth = r * 0.26; c.strokeStyle = '#d98200'; c.stroke();
  const g = c.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.05, 0, 0, r * 1.0);
  g.addColorStop(0, '#fffbd6'); g.addColorStop(0.5, '#ffe03d'); g.addColorStop(1, '#ffb300');
  c.fillStyle = g; c.fill();
  c.lineWidth = r * 0.13; c.strokeStyle = g; c.stroke();
  shine(c, -r * 0.2, -r * 0.4, r * 0.1, r * 0.06, -0.6, 0.75);
  drawFace(c, r * 0.7, mood, blink, 0, r * 0.12);
}
