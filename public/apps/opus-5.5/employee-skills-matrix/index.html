<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Skills Matrix</title>
<meta name="description" content="Track your team's skills coverage: a skills-by-people matrix with proficiency levels, coverage risks, mentoring matches and development goals.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='white' stroke='%23642b74' stroke-width='3'/%3E%3Cpath d='M16 16V2a14 14 0 1 1-14 14z' fill='%23642b74'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap">
<script>
(function(){try{var t=localStorage.getItem('skills-matrix:theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
/* ---------- Tokens ---------- */
:root{
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#f5f4f7; --surface:#ffffff; --surface-2:#faf8fb; --row-hover:#f9f5fa;
  --ink:#221a2b; --ink-2:#574f60; --muted:#716a7a;
  --line:#e8e4ec; --line-2:#d6d0dc;
  --brand:#642b74; --brand-ink:#4f215c; --brand-tint:#f4ecf6; --brand-tint-2:#e6d3ec; --on-brand:#ffffff;
  --ball:#642b74; --ball-ghost:#dcb8e7; --ball-zero:#cfc8d6; --ball-bg:#ffffff;
  --h0:#f4f2f6; --h1:#f4e5f9; --h2:#dcb8e7; --h3:#ad71bf; --h4:#6f3680;
  --ht0:#9a92a2; --ht1:#574f60; --ht2:#3d2a44; --ht3:#221a2b; --ht4:#ffffff;
  --o1:#c99fd6; --o2:#ad71bf; --o3:#894b9c; --o4:#642b74;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --critical-ink:#b42c2c;
  --tip-bg:#221a2b; --tip-ink:#f6f2f8; --tip-muted:#c9bfd0; --toast-action:#e6c4f0;
  --shadow-float:0 18px 40px -12px rgba(34,26,43,.28),0 3px 8px rgba(34,26,43,.08);
  --scrim:rgba(24,16,30,.36);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#131116; --surface:#1c1a20; --surface-2:#232028; --row-hover:#24202a;
  --ink:#f0edf3; --ink-2:#c4bdcb; --muted:#9b93a3;
  --line:#2e2a34; --line-2:#3f3946;
  --brand:#d9a9e8; --brand-ink:#ecc9f5; --brand-tint:#2c2233; --brand-tint-2:#4a3554; --on-brand:#1c1a20;
  --ball:#d9a9e8; --ball-ghost:#5f3d6b; --ball-zero:#4d4655; --ball-bg:#1c1a20;
  --h0:#25222a; --h1:#3d2a43; --h2:#674173; --h3:#a065b2; --h4:#d2a3e1;
  --ht0:#6f6878; --ht1:#d9cfe0; --ht2:#f3e6f7; --ht3:#ffffff; --ht4:#1c1a20;
  --o1:#6a4475; --o2:#915ca2; --o3:#ad77be; --o4:#d6ace4;
  --critical-ink:#f08585;
  --tip-bg:#302b37; --tip-ink:#f6f2f8; --tip-muted:#b9b0c2; --toast-action:#e8c0f4;
  --shadow-float:0 18px 44px -10px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
kbd{font:inherit;font-size:12px;font-weight:600;line-height:1;padding:3px 6px 2px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface);color:var(--ink-2)}
svg{display:block}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px 20px;min-height:60px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.015em;white-space:nowrap}
.brand svg{width:24px;height:24px}
.tabs{display:flex;align-self:stretch;gap:2px;margin-left:16px}
.tab{position:relative;border:0;background:none;padding:0 14px;color:var(--ink-2);font-weight:600;font-size:14px;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.spacer{flex:1}
.actions{display:flex;gap:8px;align-items:center;position:relative}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--brand-tint);color:var(--ink)}
.btn.danger{color:var(--critical-ink)}
.btn.danger:hover{border-color:var(--critical);background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.icon-btn{width:34px;padding:0}

.menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-float);padding:6px;z-index:30}
.menu button{display:block;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:600}
.menu button:hover,.menu button:focus-visible{background:var(--brand-tint);outline:none}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* ---------- Intro / headline ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 32px;align-items:end;padding:30px 28px 6px}
#copyBtn{justify-self:end}
.teamline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--ink-2);font-size:14px}
.teamname{border:0;background:none;padding:2px 6px;margin:-2px -6px;border-radius:6px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.teamname svg{width:14px;height:14px;color:var(--muted);opacity:0;transition:opacity .12s}
.teamname:hover{background:var(--brand-tint)}
.teamname:hover svg,.teamname:focus-visible svg{opacity:1}
.team-input{height:28px;border:1px solid var(--brand);border-radius:6px;padding:0 8px;font-weight:700;background:var(--surface);width:240px}
.headline{font-size:24px;line-height:1.34;font-weight:600;letter-spacing:-.018em;max-width:62ch;margin-top:8px;text-wrap:pretty}
.headline .sk{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:var(--brand-tint-2);text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-skip-ink:none;transition:text-decoration-color .12s}
.headline .sk:hover{text-decoration-color:var(--brand)}
.headline .nw{white-space:nowrap}
.headline .si{display:inline-block;width:18px;height:18px;vertical-align:-2px;margin-right:5px}
.headline .si svg{width:18px;height:18px}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:20px 28px 12px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{height:34px;width:230px;padding:0 30px 0 33px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.search .clear svg{position:static;transform:none;width:14px;height:14px}
.search .clear:hover{background:var(--brand-tint);color:var(--ink)}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;-webkit-appearance:none;height:34px;padding:0 32px 0 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-weight:500;max-width:220px;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:hover,.search input:hover{border-color:var(--muted)}
.sel.active select{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip .box{width:15px;height:15px;border-radius:4px;border:1.6px solid var(--muted);display:grid;place-items:center}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.chip[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.chip[aria-pressed="true"] .box::after{content:"";width:7px;height:4px;border-left:2px solid var(--on-brand);border-bottom:2px solid var(--on-brand);transform:translateY(-1px) rotate(-45deg)}
.tb-sep{width:1px;height:24px;background:var(--line-2);margin:0 6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--surface);gap:2px}
.seg button{height:28px;border:0;border-radius:6px;background:none;padding:0 10px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--brand-tint);color:var(--brand-ink)}
.tb-count{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}

/* ---------- Legend ---------- */
.legend-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:0 28px 12px 22px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.view-ctl{display:flex;gap:8px;align-items:center;margin-left:auto}
.mx-hint{margin:12px 2px 0;font-size:13px;color:var(--muted);line-height:1.9}
.tb-rest{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lg-item{display:inline-flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;border:0;background:none;color:var(--ink-2);font-size:13.5px;font-weight:500}
.lg-item:hover,.lg-item:focus-visible{background:var(--brand-tint);color:var(--ink)}
.lg-item .n{color:var(--muted);font-weight:400}
.lg-gap{width:1px;height:18px;background:var(--line-2);margin:0 6px}

/* ---------- Harvey ball ---------- */
.ball .b-bg{fill:var(--ball-bg)}
.ball .b-fill{fill:none;stroke:var(--ball)}
.ball .b-ghost{fill:none;stroke:var(--ball-ghost)}
.ball .b-ring{fill:none;stroke:var(--ball);stroke-width:1.5}
.ball.l0 .b-ring{stroke:var(--ball-zero);stroke-width:1.4}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes grow{from{stroke-dasharray:var(--from)}}
.intro-anim .b-fill,.intro-anim .b-ghost{animation:sweep .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0ms)}
.intro-anim .ball.l0 .b-ring{animation:fade .5s both;animation-delay:var(--d,0ms)}
@keyframes fade{from{opacity:0}}
.b-fill.chg{animation:grow .38s cubic-bezier(.2,.75,.25,1)}

/* ---------- Matrix ---------- */
.view{padding:0 28px 40px}
.mx-wrap{position:relative;isolation:isolate;overflow:auto;width:fit-content;max-width:100%;max-height:calc(100dvh - 84px);min-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overscroll-behavior:contain}
.mx{border-collapse:separate;border-spacing:0;font-size:13.5px}
.mx-wrap.is-empty{width:auto}
.mx th,.mx td{padding:0;font-weight:inherit}
.mx thead{position:sticky;top:0;z-index:3;background:var(--surface)}
.mx tfoot{position:sticky;bottom:0;z-index:3;background:var(--surface)}
.mx .corner{position:sticky;left:0;z-index:2;background:var(--surface);vertical-align:bottom;text-align:left;padding:0 16px 10px 20px;border-bottom:1px solid var(--line-2);min-width:280px;width:280px}
.mx.people-rows .corner{min-width:260px;width:260px}
.corner-t{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.corner-t b{color:var(--ink);font-size:14px;font-weight:700}
.mx .colh{position:relative;height:var(--hh,150px);width:40px;min-width:40px;max-width:40px;vertical-align:bottom;border-bottom:1px solid var(--line-2)}
.mx .rot{position:absolute;z-index:1;left:calc(50% - 5px);bottom:6px;transform-origin:0 100%;transform:rotate(-45deg);white-space:nowrap;border:0;background:none;padding:2px 6px;border-radius:5px;font-size:13px;font-weight:600;color:var(--ink-2);max-width:200px;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.mx .rot:hover{color:var(--brand-ink);background:var(--brand-tint)}
.mx .colh.hot .rot{color:var(--ink);background:var(--brand-tint)}
.mx .colh.sorted .rot{color:var(--brand-ink)}
.mx .sumh{vertical-align:bottom;text-align:right;padding:0 20px 10px 16px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--muted);white-space:nowrap;min-width:180px}
.mx tr.cgrp th{height:30px;vertical-align:bottom;padding:0 4px 6px;border-bottom:1px solid var(--line-2);text-align:left;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:0}
.mx tr.cgrp th span{display:block;padding:0 0 3px 2px;border-bottom:2px solid var(--brand-tint-2);overflow:hidden;text-overflow:ellipsis}
.mx tr.cgrp th.gs{border-left:1px solid var(--line)}

.mx tbody th.rowh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:0 10px 0 12px;height:40px;border-bottom:1px solid var(--line)}
.rl{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;border:0;background:none;padding:3px 8px;border-radius:7px;text-align:left;font-weight:600;color:var(--ink)}
.rl:hover{background:var(--brand-tint)}
.rl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.rl-s{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .dot{margin-left:auto;flex:none}
.mx tr.hot > th.rowh .rl{background:var(--brand-tint)}
.mx td.c{width:40px;min-width:40px;height:40px;border-bottom:1px solid var(--line);text-align:center;padding:0}
.mx td.gs,.mx tfoot td.gs{border-left:1px solid var(--line)}
.cell{position:relative;display:grid;place-items:center;width:100%;height:39px;border:0;background:none;padding:0;border-radius:7px;transition:opacity .15s}
.cell:hover{background:var(--brand-tint)}
.cell:focus-visible,.cell.active{outline:2px solid var(--brand);outline-offset:-3px}
.mx tbody tr:not(.grp):hover > td,.mx tbody tr:not(.grp):hover > th{background:var(--row-hover)}
.mx tr.grp th{position:static;text-align:left;padding:18px 0 6px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.grp-l{position:sticky;left:20px;display:inline-flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.grp-n{font-weight:400;color:var(--muted)}
.mx tbody tr:first-child.grp th{padding-top:12px}
.mx td.sum{padding:0 20px 0 16px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.st svg{width:16px;height:16px;flex:none}
.st-n{color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ps{display:inline-flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ps b{color:var(--ink);font-weight:700}
.mini{display:flex;width:84px;height:8px;gap:1px;border-radius:2px;overflow:hidden;background:var(--h0)}
.mini i{display:block;height:100%}
.mx tfoot th,.mx tfoot td{border-top:1px solid var(--line-2);height:44px;background:var(--surface)}
.mx tfoot th.rowh{position:sticky;left:0;z-index:2;text-align:left;padding:0 16px 0 20px;font-size:13px;color:var(--muted);font-weight:500}
.mx tfoot td.fsum{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.mx tfoot td.fsum .fst{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600}
.mx tfoot td.fsum .fst svg{width:14px;height:14px}

/* heat display */
.mx.heat td.c{border-bottom-color:transparent}
.mx.heat .cell{margin:1px auto;width:calc(100% - 2px);height:37px;border-radius:5px;background:var(--h0);color:var(--ht0);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.mx.heat .cell.h1{background:var(--h1);color:var(--ht1)}
.mx.heat .cell.h2{background:var(--h2);color:var(--ht2)}
.mx.heat .cell.h3{background:var(--h3);color:var(--ht3)}
.mx.heat .cell.h4{background:var(--h4);color:var(--ht4)}
.mx.heat .cell:hover{filter:brightness(1.06) saturate(1.05)}
.mx.heat tbody tr:not(.grp):hover > td{background:var(--surface)}
.gm{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 1.5px var(--surface)}
.mx.intro-anim.heat .cell{animation:fade .5s both;animation-delay:var(--d,0ms)}

/* legend highlight */
.mx[data-hl] .cell{opacity:.14}
.mx[data-hl="0"] .cell[data-l="0"],.mx[data-hl="1"] .cell[data-l="1"],.mx[data-hl="2"] .cell[data-l="2"],.mx[data-hl="3"] .cell[data-l="3"],.mx[data-hl="4"] .cell[data-l="4"],.mx[data-hl="g"] .cell[data-g]{opacity:1}

/* empty states */
.empty{display:grid;place-items:center;text-align:center;padding:72px 24px;gap:8px}
.empty h2{font-size:20px;letter-spacing:-.01em}
.empty p{color:var(--ink-2);max-width:46ch}
.empty .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.empty svg.big{width:56px;height:56px;margin-bottom:8px}

/* ---------- Coverage report ---------- */
.cov{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sbar{grid-column:1/-1;padding:18px 20px 16px}
.sbar-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sbar-h h2{font-size:16px;font-weight:700}
.sbar-h p{font-size:13px;color:var(--muted)}
.sb-track{display:flex;gap:2px;height:26px}
.sb-seg{display:flex;align-items:center;padding:0 10px;min-width:30px;font-weight:700;font-size:13px;color:#221a2b;cursor:default}
.sb-seg:first-child{border-radius:6px 0 0 6px}
.sb-seg:last-child{border-radius:0 6px 6px 0}
.sb-seg:only-child{border-radius:6px}
.sb-seg.gap{background:var(--critical);color:#fff}
.sb-seg.spof{background:var(--serious)}
.sb-seg.below{background:var(--warn)}
.sb-seg.covered{background:var(--good)}
.sb-legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.sb-legend span{display:inline-flex;align-items:center;gap:7px}
.sb-legend b{color:var(--ink)}
.sb-legend svg{width:16px;height:16px}

.chart-h{display:flex;align-items:flex-start;gap:16px;padding:18px 20px 6px}
.chart-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.chart-h p{margin-top:3px;color:var(--ink-2);font-size:13.5px;max-width:58ch}
.chart-h .seg{margin-left:auto;flex:none}
.chart-legend{display:flex;gap:6px 16px;flex-wrap:wrap;padding:8px 20px 4px;font-size:13px;color:var(--ink-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend .sw{width:12px;height:12px;border-radius:3px}
.chart-legend .tk{width:2px;height:14px;background:var(--ink);border-radius:1px}
.bars{--lw:210px;--sw:150px;padding:4px 20px 18px}
.brow{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--sw);align-items:center;gap:14px;height:32px}
.brow.axis{height:26px;align-items:end}
.blabel{border:0;background:none;padding:2px 6px;margin-left:-6px;border-radius:6px;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.blabel:hover{background:var(--brand-tint)}
.track{position:relative;height:100%}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gl.zero{background:var(--line-2)}
.segm{position:absolute;top:50%;height:14px;transform:translateY(-50%);cursor:default}
.segm::before{content:"";position:absolute;inset:-9px 0}
.segm.end{border-radius:0 4px 4px 0}
.segm.o1{background:var(--o1)}.segm.o2{background:var(--o2)}.segm.o3{background:var(--o3)}.segm.o4{background:var(--o4)}
.segm:hover{filter:brightness(1.12)}
.need{position:absolute;top:5px;bottom:5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;pointer-events:none}
.tick{position:absolute;bottom:4px;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis-l{font-size:12px;color:var(--muted);padding-bottom:4px}
.bgroup{padding:14px 0 4px;font-size:13px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line);margin-bottom:2px}
.bstat{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.bstat svg{width:16px;height:16px;flex:none}
.bstat .n{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

.dtable{width:100%;border-collapse:collapse;font-size:13.5px}
.dtable th,.dtable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{font-size:12.5px;color:var(--muted);font-weight:600;border-bottom-color:var(--line-2);vertical-align:bottom}
.dtable td.stc{text-align:left}
.dtable-wrap{padding:6px 10px 14px;overflow-x:auto}

.side .sec{padding:18px 20px 16px;border-top:1px solid var(--line)}
.side .sec:first-child{border-top:0}
.side h3{font-size:16px;font-weight:700;letter-spacing:-.005em}
.side .sub{font-size:13px;color:var(--muted);margin-top:2px}
.risk{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 10px;padding:12px 0 0}
.risk svg{width:16px;height:16px;margin-top:2px}
.risk .rk-n{border:0;background:none;padding:0;font-weight:700;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.risk .rk-n:hover{text-decoration-color:var(--brand)}
.risk p{font-size:13.5px;color:var(--ink-2);grid-column:2}
.risk p.plan{color:var(--muted);font-size:13px}
.match{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:12px 0 0;font-size:13.5px;color:var(--ink-2)}
.match b{color:var(--ink);font-weight:700}
.match .lvl{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;margin-top:3px}
.more-btn{margin-top:12px}
.gtag{color:var(--muted);font-weight:500}
.linkish{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--brand)}
.none{font-size:13.5px;color:var(--muted);padding-top:10px}

/* ---------- Avatars ---------- */
.av{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-tint-2);color:var(--brand-ink);font-weight:700;font-size:11.5px;letter-spacing:.02em;line-height:1}
.av.sm{width:24px;height:24px;font-size:10px}
.av.lg{width:56px;height:56px;font-size:19px}

/* ---------- Floating: tooltip, popover, drawer, dialog, toast ---------- */
.tip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;max-width:290px;padding:9px 11px;border-radius:9px;background:var(--tip-bg);color:var(--tip-ink);font-size:13px;line-height:1.4;box-shadow:var(--shadow-float);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip strong{display:block;font-size:14.5px;font-weight:700;margin-bottom:1px}
.tip .m{color:var(--tip-muted);display:block}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .k{width:10px;height:3px;border-radius:2px;flex:none}

.popover{position:fixed;left:0;top:0;z-index:50;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-float);padding:14px 10px 10px;animation:pop-in .14s ease-out}
@keyframes pop-in{from{opacity:0;transform:translate(var(--px),calc(var(--py) + 4px))}}
.pop-h{display:flex;align-items:flex-start;gap:10px;padding:0 4px 10px 6px}
.pop-t{font-weight:700;font-size:15px;line-height:1.25}
.pop-s{color:var(--muted);font-size:13px;margin-top:1px}
.xbtn{margin-left:auto;width:30px;height:30px;flex:none;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.xbtn:hover{background:var(--brand-tint);color:var(--ink)}
.xbtn svg{width:16px;height:16px}
.lv-list{display:grid;gap:2px}
.lv{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:8px 8px;border:0;background:none;border-radius:9px;text-align:left}
.lv:hover{background:var(--surface-2)}
.lv:focus-visible{outline-offset:-2px}
.lv[aria-checked="true"]{background:var(--brand-tint)}
.lv-n{display:block;font-weight:700;font-size:14px}
.lv-d{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.lv[aria-checked="true"] .lv-d{color:var(--ink-2)}
.pop-goal{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:8px 4px 0;padding:10px 4px 0;border-top:1px solid var(--line)}
.pop-goal label{font-weight:600;display:flex;align-items:center;gap:8px}
.pop-goal .sel select{height:32px}
.pop-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:10px 8px 2px}

.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(470px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-float);display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.drawer.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dr-top{display:flex;align-items:center;gap:6px;padding:12px 14px 0 24px;min-height:50px}
.dr-top .crumb{font-size:13px;color:var(--muted);font-weight:500}
.dr-body{flex:1;overflow:auto;padding:4px 24px 40px;overscroll-behavior:contain}
.dr-head{display:flex;gap:16px;align-items:center;padding:6px 0 16px}
.dr-head h2{font-size:22px;letter-spacing:-.015em;line-height:1.2}
.dr-head .role{color:var(--ink-2);margin-top:2px}
.dr-meta{color:var(--muted);font-size:13px;margin-top:2px}
.dr-actions{display:flex;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.dr-sec{padding:18px 0 4px}
.dr-sec h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.dr-sec h3 span{font-weight:400;color:var(--muted);font-size:13px}
.dr-lede{font-size:15px;color:var(--ink-2);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-s{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--brand-tint);color:var(--ink);font-size:13px;font-weight:600;border:0}
.chip-s:hover{background:var(--brand-tint-2)}
.callout{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;margin-top:14px}
.callout svg{width:18px;height:18px;margin-top:1px}
.callout b{display:block}
.callout span{color:var(--ink-2)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.stepper .lab{font-weight:600}
.stepper .lab small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.step-c{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.step-c button{width:34px;height:32px;border:0;background:var(--surface);font-size:18px;line-height:1;color:var(--ink-2)}
.step-c button:hover{background:var(--brand-tint);color:var(--ink)}
.step-c output{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.dist{display:flex;gap:2px;height:12px;margin:6px 0 10px}
.dist i{display:block;height:100%}
.dist i:last-child{border-radius:0 4px 4px 0}
.dist-l{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.dist-l span{display:inline-flex;align-items:center;gap:6px}
.dist-l .sw{width:10px;height:10px;border-radius:3px}
.lvl-grp{padding:10px 0 2px}
.lvl-grp h4{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.lvl-grp h4 span{color:var(--muted);font-weight:400}
.goal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.goal-row:last-child{border-bottom:0}
.goal-row .gtxt{flex:1;min-width:0}
.goal-row .gtxt b{display:block;font-weight:600}
.goal-row .gtxt span{font-size:12.5px;color:var(--muted)}
.prof-cat{font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 0 4px}
.prof-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.prof-row .pn{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-row .pl{font-size:12.5px;color:var(--muted);width:72px;text-align:right}
.picker{display:inline-flex;gap:1px}
.picker button{width:28px;height:28px;border:0;background:none;border-radius:7px;display:grid;place-items:center;padding:0}
.picker button:hover{background:var(--surface-2)}
.picker button[aria-checked="true"]{background:var(--brand-tint);box-shadow:inset 0 0 0 1.5px var(--brand)}
.picker button:not([aria-checked="true"]) .ball{opacity:.55}
.picker button:hover .ball{opacity:1}

dialog{border:0;border-radius:16px;padding:0;width:min(500px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow-float)}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:dlg-in .18s ease-out}
@keyframes dlg-in{from{opacity:0;transform:translateY(6px) scale(.99)}}
.dlg-h{padding:22px 24px 2px}
.dlg-h h2{font-size:20px;letter-spacing:-.01em}
.dlg-h p{color:var(--ink-2);margin-top:4px}
.dlg-b{padding:16px 24px 4px;display:grid;gap:14px}
.dlg-f{padding:18px 24px 22px;display:flex;justify-content:flex-end;gap:8px}
.fl{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.fl .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.inp{height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-weight:400;font-size:14px;width:100%}
.inp:hover{border-color:var(--muted)}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea.inp{height:auto;min-height:70px;padding:9px 12px;resize:vertical;line-height:1.45}
select.inp{appearance:none;-webkit-appearance:none;padding-right:32px}
.fl .sel{display:flex}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--critical-ink);font-size:13px;font-weight:600}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 16px;border-radius:11px;background:var(--tip-bg);color:var(--tip-ink);box-shadow:var(--shadow-float);font-weight:500;animation:toast-in .2s ease-out;max-width:calc(100vw - 32px)}
.toast.plain{padding-right:16px}
.toast button{background:none;border:0;color:var(--toast-action);font-weight:700;padding:5px 8px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.08)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .cov{grid-template-columns:minmax(0,1fr)}
  .intro{grid-template-columns:minmax(0,1fr)}
  #copyBtn{justify-self:start;margin-left:-10px}
}
@media (max-width:860px){
  .appbar{padding:8px 16px;flex-wrap:wrap}
  .tabs{order:3;width:100%;margin:0;height:40px}
  .btn .lbl{display:none}
  .btn:has(.lbl){width:34px;padding:0}
  .intro{padding:22px 16px 4px}
  .headline{font-size:20px}
  .toolbar{padding:16px 16px 10px}
  .search,.search input{width:100%}
  .tb-rest{flex-wrap:nowrap;overflow-x:auto;width:calc(100% + 32px);margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .tb-rest::-webkit-scrollbar{display:none}
  .tb-rest>*{flex:none}
  .tb-count{margin-left:0;width:100%}
  .legend-row{padding:0 16px 10px 10px}
  .view-ctl{margin-left:6px}
  .mx-hint{display:none}
  .view{padding:0 12px 32px}
  .mx .corner,.mx.people-rows .corner{min-width:180px;width:180px}
  .rl-s{display:none}
  .bars{--lw:120px;--sw:30px}
  .bstat span:not(.n){display:none}
  .bstat .n{display:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff}
  .appbar .actions,.tabs,.toolbar,.view-ctl,.mx-hint,.drawer,.toasts,.popover,.tip,#copyBtn{display:none!important}
  .appbar{position:static;border:0}
  .view{padding:0}
  .mx-wrap{max-height:none;overflow:visible;border:0}
  .mx thead,.mx tfoot{position:static}
  .mx .corner,.mx tbody th.rowh,.mx tfoot th.rowh{position:static}
  .headline{font-size:18px}
}
@media (forced-colors:active){
  .ball .b-fill{stroke:CanvasText}.ball .b-ring{stroke:CanvasText}.ball .b-ghost{stroke:GrayText}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.25" fill="var(--ball-bg)" stroke="var(--ball)" stroke-width="2"/><path d="M12 12V1.75A10.25 10.25 0 1 1 1.75 12z" fill="var(--ball)"/></svg>
    <span>Skills Matrix</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-matrix" aria-controls="view-matrix" data-view="matrix">Matrix</button>
    <button class="tab" role="tab" id="tab-coverage" aria-controls="view-coverage" data-view="coverage">Coverage report</button>
  </nav>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn primary" data-act="add-person" aria-label="Add person"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="6.6" r="3"/><path d="M2.8 16.2c.6-3 2.7-4.6 5.2-4.6 1.2 0 2.3.4 3.2 1.1M15.5 11v6M12.5 14h6"/></svg><span class="lbl">Add person</span></button>
    <button class="btn" data-act="add-skill" aria-label="Add skill"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="9.5" r="6"/><path d="M8.5 3.5v6h-6" /><path d="M15.5 12v6M12.5 15h6"/></svg><span class="lbl">Add skill</span></button>
    <button class="btn icon-btn quiet" data-act="theme" id="themeBtn" aria-label="Switch to dark theme"></button>
    <button class="btn icon-btn quiet" data-act="menu" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="More actions"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
    <div class="menu" id="menu" role="menu" hidden>
      <button role="menuitem" data-act="export-csv">Export to CSV<small>One row per person, levels 0 to 4</small></button>
      <button role="menuitem" data-act="export-json">Download backup<small>Everything, as a .json file</small></button>
      <button role="menuitem" data-act="import-json">Restore from backup<small>Replaces the current matrix</small></button>
      <button role="menuitem" data-act="print">Print or save as PDF</button>
      <hr>
      <button role="menuitem" data-act="sample">Load sample team<small>14 people, 22 skills</small></button>
      <button role="menuitem" data-act="blank">Start a blank matrix</button>
    </div>
  </div>
</header>

<main>
  <section class="intro" id="intro" aria-live="polite"></section>

  <div class="toolbar" role="search">
    <label class="search">
      <span class="sr-only">Search people and skills</span>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg>
      <input type="search" id="q" placeholder="Search people or skills" autocomplete="off">
      <button type="button" class="clear" id="qClear" aria-label="Clear search" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg></button>
    </label>
    <div class="tb-rest">
    <span class="sel" id="deptWrap"><select id="dept" aria-label="Department"></select></span>
    <span class="sel" id="catWrap"><select id="cat" aria-label="Skill category"></select></span>
    <button class="chip" id="attn" aria-pressed="false"><span class="box" aria-hidden="true"></span>Only skills at risk</button>
    <span class="tb-sep" aria-hidden="true"></span>
    <span class="sel matrix-only"><select id="sortPeople" aria-label="Sort people"></select></span>
    <span class="sel"><select id="sortSkills" aria-label="Order skills">
      <option value="category">Skills by category</option>
      <option value="risk">Weakest coverage first</option>
      <option value="name">Skills A to Z</option>
    </select></span>
    </div>
    <span class="tb-count" id="count" aria-live="polite"></span>
  </div>

  <section id="view-matrix" role="tabpanel" aria-labelledby="tab-matrix">
    <div class="legend-row">
      <div class="legend" id="legend"></div>
      <div class="view-ctl">
        <span class="seg" role="group" aria-label="Display">
          <button data-display="balls" aria-pressed="true" title="Harvey balls"><span id="ballIcon"></span>Circles</button>
          <button data-display="heat" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6.4" height="6.4" rx="1.6" fill="currentColor" opacity=".3"/><rect x="10.6" y="3" width="6.4" height="6.4" rx="1.6" fill="currentColor"/><rect x="3" y="10.6" width="6.4" height="6.4" rx="1.6" fill="currentColor" opacity=".65"/><rect x="10.6" y="10.6" width="6.4" height="6.4" rx="1.6" fill="currentColor" opacity=".15"/></svg>Heatmap</button>
        </span>
        <button class="btn" data-act="swap" aria-label="Swap rows and columns" title="Swap rows and columns"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5v13M6 16.5 3.5 14M6 16.5 8.5 14M14 16.5v-13M14 3.5 11.5 6M14 3.5 16.5 6"/></svg><span class="lbl">Swap axes</span></button>
      </div>
    </div>
    <div class="view"><div class="mx-wrap" id="mxWrap"></div>
      <p class="mx-hint">Select a cell, then press <kbd>0</kbd> to <kbd>4</kbd> to rate. Arrow keys move between cells, <kbd>Enter</kbd> opens the full editor and <kbd>Ctrl</kbd> <kbd>Z</kbd> undoes a change.</p>

/* Harvey ball: stroke-dasharray pie so the wedge can sweep */
function ball(l,g=0,size=18,extra=''){
  const c=size/2,R=c-1.25,r=R/2,C=2*Math.PI*r,f=v=>(C*v/4).toFixed(2);
  let s=`<svg class="ball l${l}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"${extra}>`;
  s+=`<circle class="b-bg" cx="${c}" cy="${c}" r="${R}"/>`;
  if(g>l)s+=`<circle class="b-ghost" cx="${c}" cy="${c}" r="${r}" stroke-width="${R}" stroke-dasharray="${f(g)} ${C.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
  if(l>0)s+=`<circle class="b-fill" cx="${c}" cy="${c}" r="${r}" stroke-width="${R}" stroke-dasharray="${f(l)} ${C.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
  s+=`<circle class="b-ring" cx="${c}" cy="${c}" r="${R}"/></svg>`;
  return s;
}

/* =========================================================

const STORE='skills-matrix:v1',PREFS='skills-matrix:prefs:v1';
function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.people)||!Array.isArray(d.skills))throw new Error('shape');
  const categories=(Array.isArray(d.categories)?d.categories:[]).filter(c=>c&&c.id&&c.name).map(c=>({id:String(c.id),name:String(c.name).slice(0,60)}));
  const skills=d.skills.filter(s=>s&&s.id&&s.name).map(s=>({id:String(s.id),name:String(s.name).slice(0,80),cat:String(s.cat||''),desc:String(s.desc||'').slice(0,300),need:clamp(parseInt(s.need,10)||1,1,99)}));
  for(const s of skills){
    if(!categories.some(c=>c.id===s.cat)){let c=categories.find(c=>c.name==='General');if(!c){c={id:uid('c_'),name:'General'};categories.push(c)}s.cat=c.id}
  }
  const people=d.people.filter(p=>p&&p.id&&p.name).map(p=>({id:String(p.id),name:String(p.name).slice(0,80),role:String(p.role||'').slice(0,80),dept:String(p.dept||'').slice(0,60),loc:String(p.loc||'').slice(0,60),start:/^\d{4}-\d{2}-\d{2}$/.test(p.start||'')?p.start:''}));
  const pids=new Set(people.map(p=>p.id)),sids=new Set(skills.map(s=>s.id));
  const ratings={};
  if(d.ratings&&typeof d.ratings==='object'){
    for(const [k,v] of Object.entries(d.ratings)){
      const [p,s]=k.split('|');if(!pids.has(p)||!sids.has(s)||!v)continue;
      const l=clamp(parseInt(v.l,10)||0,0,4),g=clamp(parseInt(v.g,10)||0,0,4);
      if(l||g>l)ratings[k]={l,g:g>l?g:0,u:typeof v.u==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v.u)?v.u:''};
    }
  }
  return {v:1,team:String(d.team||'My team').slice(0,60),categories,skills,people,ratings};
}

const ZERO={l:0,g:0,u:''};

const person=id=>S.people.find(p=>p.id===id);

const catName=id=>(S.categories.find(c=>c.id===id)||{}).name||'General';

function scopePeople(){return S.people.filter(p=>!UI.dept||p.dept===UI.dept)}
function skillStats(sid,ppl){
  const counts=[0,0,0,0,0],by=[[],[],[],[],[]],goals=[];
  for(const p of ppl){const r=R(p.id,sid);counts[r.l]++;by[r.l].push(p);if(r.g>r.l)goals.push({p,l:r.l,g:r.g})}
  const prof=counts[3]+counts[4];const need=(skill(sid)||{need:1}).need;
  const status=prof>=need?'covered':prof===0?'gap':prof===1?'spof':'below';
  return {counts,by,goals,prof,need,status,n:ppl.length};
}
function strength(pid){let t=0;for(const s of S.skills)t+=R(pid,s.id).l;return t}
function matchQ(str){return String(str).toLowerCase().includes(UI.q)}

function queryAxes(){
  let people=scopePeople(),skills=S.skills.slice();
  if(UI.cat)skills=skills.filter(s=>s.cat===UI.cat);
  if(UI.q){
    const pm=people.filter(p=>matchQ(p.name)||matchQ(p.role)||matchQ(p.dept)||matchQ(p.loc));
    const sm=skills.filter(s=>matchQ(s.name)||matchQ(catName(s.cat)));
    if(pm.length||sm.length){if(pm.length)people=pm;if(sm.length)skills=sm}
    else{people=[];skills=[]}
  }
  const scope=scopePeople();
  const stats=new Map(S.skills.map(s=>[s.id,skillStats(s.id,scope)]));
  if(UI.attention)skills=skills.filter(s=>stats.get(s.id).status!=='covered');
  // sort skills
  const catIdx=id=>S.categories.findIndex(c=>c.id===id);
  const order=new Map(S.skills.map((s,i)=>[s.id,i]));
  if(UI.sortSkills==='name')skills.sort((a,b)=>a.name.localeCompare(b.name));
  else if(UI.sortSkills==='risk')skills.sort((a,b)=>{const A=stats.get(a.id),B=stats.get(b.id);return STATUS[A.status].rank-STATUS[B.status].rank||(A.prof/A.need)-(B.prof/B.need)||a.name.localeCompare(b.name)});
  else skills.sort((a,b)=>catIdx(a.cat)-catIdx(b.cat)||order.get(a.id)-order.get(b.id));
  // sort people
  const sp=UI.sortPeople||'name';
  if(sp==='dept')people.sort((a,b)=>(a.dept||'~').localeCompare(b.dept||'~')||a.name.localeCompare(b.name));
  else if(sp==='strength'){const m=new Map(people.map(p=>[p.id,strength(p.id)]));people.sort((a,b)=>m.get(b.id)-m.get(a.id)||a.name.localeCompare(b.name))}
  else if(sp.startsWith('skill:')){const sid=sp.slice(6);people.sort((a,b)=>{const A=R(a.id,sid),B=R(b.id,sid);return B.l-A.l||(B.g>B.l)-(A.g>A.l)||a.name.localeCompare(b.name)})}
  else people.sort((a,b)=>a.name.localeCompare(b.name));
  return {people,skills,stats,scope};
}
function groupSkills(skills){
  const out=[];
  for(const s of skills){let g=out[out.length-1];if(!g||g.id!==s.cat){g={id:s.cat,name:catName(s.cat),skills:[]};out.push(g)}g.skills.push(s)}

function skillLink(s,st){return `<span class="nw"><span class="si">${statusIcon(st)}</span><button class="sk" data-open-skill="${esc(s.id)}">${esc(s.name)}</button></span>`}
function headline(){
  const scope=scopePeople();
  if(!S.people.length&&!S.skills.length)return{html:'Add the people on your team and the skills you need, then rate each person.',text:''};
  if(!S.people.length)return{html:'Add people to see who covers each skill.',text:''};
  if(!S.skills.length)return{html:'Add the skills your team needs, then rate each person.',text:''};
  if(!scope.length)return{html:`Nobody in ${esc(UI.dept)} yet.`,text:''};
  const all=S.skills.map(s=>({s,st:skillStats(s.id,scope)}));
  const pick=k=>all.filter(x=>x.st.status===k);
  const gaps=pick('gap'),spof=pick('spof'),below=pick('below');
  const cov=all.length-gaps.length-spof.length-below.length;
  const H=[],T=[];
  const pre=UI.dept?`In ${UI.dept}, `:'';
  if(cov===all.length){H.push(`${esc(pre)}${pre?'every':'Every'} skill has the cover you need.`);T.push(`${pre}${pre?'every':'Every'} skill has the cover you need.`)}
  else{const t=`${pre}${cov} of ${all.length} skills have the cover you need.`;H.push(esc(t));T.push(t)}
  const L=arr=>arr.map(x=>skillLink(x.s,x.st.status)),N=arr=>arr.map(x=>x.s.name);
  if(spof.length===1){H.push(`${L(spof)[0]} depends on one person.`);T.push(`${N(spof)[0]} depends on one person.`)}
  else if(spof.length===2){H.push(`${listNames(L(spof))} each depend on one person.`);T.push(`${listNames(N(spof))} each depend on one person.`)}
  else if(spof.length>2){H.push(`${spof.length} skills depend on one person, including ${L(spof)[0]}.`);T.push(`${spof.length} skills depend on one person: ${listNames(N(spof))}.`)}
  if(gaps.length&&gaps.length<=2){H.push(`Nobody is Proficient in ${listNames(L(gaps))}.`);T.push(`Nobody is Proficient in ${listNames(N(gaps))}.`)}
  else if(gaps.length>2){H.push(`${gaps.length} skills have nobody at Proficient, including ${L(gaps)[0]}.`);T.push(`${gaps.length} skills have nobody at Proficient: ${listNames(N(gaps))}.`)}
  if(below.length===1){H.push(`${L(below)[0]} is short of its target.`);T.push(`${N(below)[0]} is short of its target.`)}
  else if(below.length===2){H.push(`${listNames(L(below))} are short of their targets.`);T.push(`${listNames(N(below))} are short of their targets.`)}
  else if(below.length>2){H.push(`${below.length} more skills are short of their targets.`);T.push(`${below.length} more skills are short of their targets: ${listNames(N(below))}.`)}
  return{html:H.join(' '),text:T.join(' ')};
}

   Render: coverage report
   ========================================================= */
function mentorPlan(scope){
  // returns {matches:[{mentor,skill,mentees:[{p,l,g}]}], external:[{skill,people:[]}]}
  const load=new Map(),matches=new Map(),external=new Map();
  const goals=[];
  for(const s of S.skills)for(const p of scope){const r=R(p.id,s.id);if(r.g>r.l)goals.push({p,s,l:r.l,g:r.g})}
  goals.sort((a,b)=>b.g-a.g||a.s.name.localeCompare(b.s.name));
  for(const G of goals){
    const need=Math.max(3,G.g);
    const cands=scope.filter(m=>m.id!==G.p.id&&R(m.id,G.s.id).l>=need);
    if(!cands.length){const e=external.get(G.s.id)||{skill:G.s,people:[]};e.people.push(G.p);external.set(G.s.id,e);continue}
    cands.sort((a,b)=>R(b.id,G.s.id).l-R(a.id,G.s.id).l||(load.get(a.id)||0)-(load.get(b.id)||0)||a.name.localeCompare(b.name));
    const m=cands[0];load.set(m.id,(load.get(m.id)||0)+1);
    const k=m.id+'|'+G.s.id;const x=matches.get(k)||{mentor:m,skill:G.s,mentees:[]};x.mentees.push(G);matches.set(k,x);
  }
  return {goals,matches:[...matches.values()].sort((a,b)=>b.mentees.length-a.mentees.length||a.skill.name.localeCompare(b.skill.name)),external:[...external.values()]};
}
function renderCoverage(q){

  if(!N){root.innerHTML=`<div class="panel"><div class="empty"><h2>Nobody in ${esc(UI.dept)}</h2><p>Choose another department to see its coverage.</p><div class="row"><button class="btn" data-act="clear-filters">Clear filters</button></div></div></div>`;return}
  const skills=q.skills;
  const rows=skills.map(s=>({s,st:q.stats.get(s.id)}));
  const counts={gap:0,spof:0,below:0,covered:0};rows.forEach(x=>counts[x.st.status]++);
  // status bar
  let h=`<div class="cov"><section class="panel sbar" aria-labelledby="sbH"><div class="sbar-h"><h2 id="sbH">${plural(rows.length,'skill')} by coverage</h2><p>Covered means enough people are Proficient or Expert to meet the skill's target.</p></div>`;

  }

    rows.forEach(({s,st})=>{h+=`<tr><td><button class="linkish" data-open-skill="${esc(s.id)}">${esc(s.name)}</button></td><td>${st.counts[4]}</td><td>${st.counts[3]}</td><td>${st.counts[2]}</td><td>${st.counts[1]}</td><td>${st.counts[0]}</td><td>${st.need}</td><td class="stc"><span class="st">${statusIcon(st.status)}${STATUS[st.status].label}</span></td></tr>`});

        for(const l of [4,3,2,1]){const n=st.counts[l];if(!n)continue;segs.push({l,n,left:cum,w:n});cum+=n}

        segs.forEach((g2,i)=>{h+=`<span class="segm o${g2.l}${i===segs.length-1?' end':''}" style="left:${pct(g2.left)}%;width:calc(${pct(g2.w)}% - 2px)" data-tipk="seg:${esc(s.id)}:${g2.l}"></span>`});

    h+=`<div class="match">${avatar(e.p)}<div><button class="linkish" data-open-person="${esc(e.p.id)}">${esc(e.p.name)}</button><div class="lvl" style="font-size:13px;color:var(--ink-2)">Only Proficient person for ${listNames(e.skills.map(s=>esc(s.name)))}</div></div></div>`;
  });
  h+='</section></aside></div>';
  root.innerHTML=h;
}

function placePop(){
  if(!pop)return;const el=$('#pop'),c=cellEl(pop.p,pop.s);
  if(!c){closePop();return}
  const r=c.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,m=10;
  let x=r.right+m;if(x+w>innerWidth-m)x=r.left-m-w;if(x<m)x=clamp(r.left+r.width/2-w/2,m,innerWidth-w-m);
  let y=r.top+r.height/2-h/2;y=clamp(y,m,Math.max(m,innerHeight-h-m));
  el.style.setProperty('--px',x+'px');el.style.setProperty('--py',y+'px');
  el.style.transform=`translate(${x}px,${y}px)`;
}

/* =========================================================

   ========================================================= */
function toast(msg,action){
  const t=document.createElement('div');t.className='toast'+(action?'':' plain');t.setAttribute('role','status');
  const span=document.createElement('span');span.textContent=msg;t.appendChild(span);
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();t.remove()};t.appendChild(b)}
  const box=$('#toasts');box.appendChild(t);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),action?7000:3200);
}
const tip=$('#tip');let tipEl=null;
function tipHtml(el){

  }
  const k=el.dataset.tipk;
  if(k){
    const [type,id,lv]=k.split(':');
    if(type==='p'){const p=person(id);return p?`<strong>${esc(p.name)}</strong><span class="m">${esc([p.role,p.dept].filter(Boolean).join(', '))}</span>`:''}
    if(type==='s'){const s=skill(id);return s?`<strong>${esc(s.name)}</strong><span class="m">${esc(s.desc||catName(s.cat))}</span>`:''}
    if(type==='st'){const s=skill(id);if(!s)return'';const st=skillStats(id,scopePeople());return `<strong>${STATUS[st.status].label}</strong><span class="m">${esc(statusText(st,s))}</span>`}
    if(type==='seg'){
      const s=skill(id);if(!s)return'';const st=skillStats(id,scopePeople());const l=+lv;const ppl=st.by[l];
      return `<strong>${plural(ppl.length,'person','people')}</strong><span class="r"><i class="k" style="background:var(--o${l})"></i>${LEVELS[l].name} in ${esc(s.name)}</span><span class="m" style="margin-top:3px">${esc(listNames(ppl.slice(0,6).map(p=>p.name)))}${ppl.length>6?` and ${ppl.length-6} more`:''}</span>`;
    }
  }
  if(el.dataset.tip)return el.dataset.tip;
  return '';
}
function showTipAt(el,x,y){
  const html=tipHtml(el);if(!html){hideTip();return}
  if(tipEl!==el){tip.innerHTML=html;tipEl=el}
  tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let l=x+14,t=y+18;if(l+w>innerWidth-8)l=x-w-14;if(t+h>innerHeight-8)t=y-h-14;
  tip.style.transform=`translate(${Math.max(8,l)}px,${Math.max(8,t)}px)`;
}
function hideTip(){tip.classList.remove('on');tipEl=null}

/* =========================================================
   Master render
   ========================================================= */
function render(){
  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  const q=queryAxes();
  renderIntro();renderToolbar(q);
  if(UI.view==='matrix'){renderLegend(q);renderMatrix(q)}else renderCoverage(q);
  if(drawer)renderDrawer();
  if(pop){renderPopover();placePop()}
  if(fk){const el=document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);if(el&&el!==document.activeElement)el.focus({preventScroll:true})}
}

/* =========================================================
   Actions
   ========================================================= */
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csvCell(v){v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function exportCSV(){
  const sk=S.skills;
  const head=['Name','Job title','Department','Location',...sk.map(s=>s.name)];
  const lines=[head.map(csvCell).join(',')];
  S.people.forEach(p=>lines.push([p.name,p.role,p.dept,p.loc,...sk.map(s=>R(p.id,s.id).l)].map(csvCell).join(',')));
  lines.push('');lines.push(['Target (people at Proficient or above)','','','',...sk.map(s=>s.need)].map(csvCell).join(','));
  lines.push(['Scale: 0 None, 1 Awareness, 2 Working, 3 Proficient, 4 Expert'].map(csvCell).join(','));
  download(`skills-matrix-${isoToday()}.csv`,'﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
  toast('Exported to CSV');
}
function act(name,el){
  switch(name){
    case 'add-person':closeMenu();personDialog();break;
    case 'add-skill':closeMenu();skillDialog();break;
    case 'edit-person':personDialog(el.dataset.id);break;
    case 'edit-skill':skillDialog(el.dataset.id);break;
    case 'remove-person':{const p=person(el.dataset.id);if(!p)return;commit(st=>{st.people=st.people.filter(x=>x.id!==p.id);for(const k of Object.keys(st.ratings))if(k.startsWith(p.id+'|'))delete st.ratings[k]});toast(`Removed ${p.name}`,{label:'Undo',fn:undo});break}
    case 'remove-skill':{const s=skill(el.dataset.id);if(!s)return;commit(st=>{st.skills=st.skills.filter(x=>x.id!==s.id);for(const k of Object.keys(st.ratings))if(k.endsWith('|'+s.id))delete st.ratings[k]});toast(`Removed ${s.name}`,{label:'Undo',fn:undo});break}
    case 'need':{const s=skill(el.dataset.id);if(!s)return;const v=clamp(s.need+(+el.dataset.d),1,99);if(v!==s.need)commit(st=>{st.skills.find(x=>x.id===s.id).need=v});break}
    case 'clear-goal':setGoal(el.dataset.p,el.dataset.s,0);break;
    case 'sort-by-skill':UI.sortPeople='skill:'+el.dataset.id;UI.view='matrix';savePrefs();render();toast(`People sorted by ${skill(el.dataset.id).name}`);break;
    case 'sort-by-person':{const p=person(el.dataset.id);UI.view='matrix';UI.q='';UI.dept='';$('#q').value='';$('#qClear').hidden=true;render();closeDrawer();
      const target=$(`[data-fk="${UI.orient==='skills'?'colh':'rowh'}:${CSS.escape(p.id)}"]`);
      if(target){target.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});const c=$(`.cell[data-p="${CSS.escape(p.id)}"]`);if(c){UI.cur={p:p.id,s:c.dataset.s};$$('.cell[tabindex="0"]').forEach(x=>x.tabIndex=-1);c.tabIndex=0;setTimeout(()=>c.focus({preventScroll:true}),350)}}
      break}
    case 'close-drawer':closeDrawer();break;
    case 'all-mentors':UI.allMentors=true;render();break;
    case 'close-pop':closePop(true);break;
    case 'dlg-cancel':dlg.close();break;
    case 'swap':UI.orient=UI.orient==='skills'?'people':'skills';savePrefs();closePop();render();break;
    case 'theme':{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('skills-matrix:theme',n)}catch(e){}render();break}
    case 'menu':toggleMenu();break;
    case 'export-csv':closeMenu();exportCSV();break;
    case 'export-json':closeMenu();download(`skills-matrix-backup-${isoToday()}.json`,JSON.stringify(S,null,2),'application/json');toast('Backup downloaded');break;
    case 'import-json':closeMenu();$('#importFile').value='';$('#importFile').click();break;
    case 'print':closeMenu();UI.view='matrix';render();setTimeout(()=>print(),60);break;
    case 'sample':closeMenu();closeDrawer();commit(st=>{const d=sampleData();for(const k of Object.keys(st))delete st[k];Object.assign(st,d)});introPending=true;render();toast('Sample team loaded',{label:'Undo',fn:undo});break;
    case 'blank':closeMenu();closeDrawer();commit(st=>{const d=blankData();d.team=st.team;for(const k of Object.keys(st))delete st[k];Object.assign(st,d)});toast('Started a blank matrix',{label:'Undo',fn:undo});break;
    case 'clear-filters':UI.q='';UI.dept='';UI.cat='';UI.attention=false;$('#q').value='';$('#qClear').hidden=true;render();break;
    case 'copy-summary':{
      const h=headline();const q=queryAxes();
      const risks=S.skills.map(s=>({s,st:q.stats.get(s.id)})).filter(x=>x.st.status!=='covered').sort((a,b)=>STATUS[a.st.status].rank-STATUS[b.st.status].rank);
      const txt=`${S.team}: skills coverage, ${fmtDate(isoToday())}\n\n${h.text}\n`+(risks.length?`\nRisks to address:\n`+risks.map(x=>`- ${x.s.name}: ${STATUS[x.st.status].label} (${x.st.prof} of ${x.st.need} at Proficient or above)`).join('\n'):'');
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Summary copied')).catch(()=>{download('skills-summary.txt',txt,'text/plain');toast('Summary downloaded as a text file')});
      break}
    case 'rename-team':{
      const b=el;const inp=document.createElement('input');inp.className='team-input';inp.id='teamInput';inp.value=S.team;inp.maxLength=60;inp.setAttribute('aria-label','Team name');
      b.replaceWith(inp);inp.focus();inp.select();let done=false;
      const finish=save=>{if(done)return;done=true;const v=inp.value.trim();inp.remove();if(save&&v&&v!==S.team)commit(st=>{st.team=v});else render()};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finish(false)}});
      inp.addEventListener('blur',()=>finish(true));
      break}
  }
}
function toggleMenu(){const m=$('#menu');const open=m.hidden;m.hidden=!open;$('#menuBtn').setAttribute('aria-expanded',String(open));if(open)m.querySelector('button').focus()}
function closeMenu(){const m=$('#menu');if(!m.hidden){m.hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')}}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('#menu')&&!t.closest('#menuBtn'))closeMenu();
  const view=t.closest('[data-view]');if(view){UI.view=view.dataset.view;savePrefs();closePop();render();return}
  const disp=t.closest('[data-display]');if(disp){UI.display=disp.dataset.display;savePrefs();render();return}
  const ct=t.closest('[data-covtable]');if(ct){UI.covTable=ct.dataset.covtable==='1';render();return}
  const lv=t.closest('.lv');if(lv&&pop){const {p,s}=pop;setLevel(p,s,+lv.dataset.level);closePop(true);return}
  const pk=t.closest('[data-pick]');if(pk){const [p,s,l]=pk.dataset.pick.split('|');setLevel(p,s,+l);return}
  const os=t.closest('[data-open-skill]');if(os){openDrawer('skill',os.dataset.openSkill,os);return}
  const op=t.closest('[data-open-person]');if(op){openDrawer('person',op.dataset.openPerson,op);return}
  const a=t.closest('[data-act]');if(a){act(a.dataset.act,a);return}
  const cell=t.closest('.cell');
  if(cell){
    if(pop&&pop.p===cell.dataset.p&&pop.s===cell.dataset.s){closePop(true);return}
    $$('.cell[tabindex="0"]').forEach(x=>x.tabIndex=-1);cell.tabIndex=0;cell.focus({preventScroll:true});
    openPop(cell.dataset.p,cell.dataset.s);return;
  }
  const hl=t.closest('.lg-item');if(hl){UI.hl=UI.hl===hl.dataset.hl?null:hl.dataset.hl;const m=$('.mx');if(m){if(UI.hl==null)m.removeAttribute('data-hl');else m.dataset.hl=UI.hl}return}
});
document.addEventListener('pointerdown',e=>{
  if(pop&&!e.target.closest('#pop')&&!e.target.closest('.cell'))closePop(false);
  hideTip();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='goalSel'&&pop){setGoal(pop.p,pop.s,+t.value);return}
  if(t.id==='dept'){UI.dept=t.value;closePop();render();return}
  if(t.id==='cat'){UI.cat=t.value;closePop();render();return}
  if(t.id==='sortPeople'){UI.sortPeople=t.value;savePrefs();render();return}
  if(t.id==='sortSkills'){UI.sortSkills=t.value;savePrefs();render();return}
});
$('#attn').addEventListener('click',()=>{UI.attention=!UI.attention;closePop();render()});
let qTimer;
$('#q').addEventListener('input',e=>{clearTimeout(qTimer);$('#qClear').hidden=!e.target.value;qTimer=setTimeout(()=>{UI.q=e.target.value.trim().toLowerCase();closePop();render()},90)});
$('#qClear').addEventListener('click',()=>{$('#q').value='';$('#qClear').hidden=true;UI.q='';render();$('#q').focus()});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=normalize(JSON.parse(String(rd.result)));closeDrawer();commit(st=>{for(const k of Object.keys(st))delete st[k];Object.assign(st,d)});toast(`Restored ${plural(d.people.length,'person','people')} and ${plural(d.skills.length,'skill')}`,{label:'Undo',fn:undo})}
    catch(err){toast('That file isn’t a Skills Matrix backup. Choose a .json file downloaded from this app.')}};
  rd.readAsText(f);
});

/* hover: tooltip + crosshair + legend highlight */
let hotCol=null,hotRow=null;
function setHot(cell){
  const ci=cell?cell.dataset.c:null;const tr=cell?cell.closest('tr'):null;
  if(hotCol!==ci){$$('.mx .colh.hot').forEach(x=>x.classList.remove('hot'));if(ci!=null){const th=$(`.mx .colh[data-c="${ci}"]`);if(th)th.classList.add('hot')}hotCol=ci}
  if(hotRow!==tr){if(hotRow)hotRow.classList.remove('hot');if(tr)tr.classList.add('hot');hotRow=tr}
}
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  const t=e.target.closest?e.target.closest('.cell,[data-tipk],[data-tip]'):null;
  setHot(e.target.closest?e.target.closest('.mx .cell'):null);
  if(!t||(pop&&t.classList.contains('cell'))){hideTip();return}
  showTipAt(t,e.clientX,e.clientY);
},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{hideTip();setHot(null)});
$('#legend').addEventListener('pointerover',e=>{const b=e.target.closest('.lg-item');const m=$('.mx');if(!m)return;if(b)m.dataset.hl=b.dataset.hl});
$('#legend').addEventListener('pointerleave',()=>{const m=$('.mx');if(!m)return;if(UI.hl==null)m.removeAttribute('data-hl');else m.dataset.hl=UI.hl});
document.addEventListener('focusin',e=>{
  const c=e.target.closest&&e.target.closest('.mx .cell');
  setHot(c);
  if(c&&!pop&&c.matches(':focus-visible')){const r=c.getBoundingClientRect();showTipAt(c,r.right-6,r.bottom-10)}
});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.mx .cell'))hideTip()});
addEventListener('scroll',()=>{hideTip();if(pop)placePop()},{capture:true,passive:true});
addEventListener('resize',()=>{if(pop)placePop()});

/* keyboard */
document.addEventListener('keydown',e=>{
  const t=e.target;const typing=t.matches&&t.matches('input,textarea,select,[contenteditable]');
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&!typing&&!dlg.open&&(e.key==='z'||e.key==='Z')){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&!typing&&!dlg.open&&(e.key==='y')){e.preventDefault();redo();return}
  if(e.key==='Escape'){
    if(dlg.open)return;
    if(!$('#menu').hidden){closeMenu();$('#menuBtn').focus();return}
    if(pop){closePop(true);return}
    if(drawer){closeDrawer();return}
    if(UI.hl!=null){UI.hl=null;const m=$('.mx');if(m)m.removeAttribute('data-hl');return}
  }
  if(e.key==='/'&&!typing&&!dlg.open){e.preventDefault();$('#q').focus();return}
  // menu arrows
  if(t.closest&&t.closest('#menu')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=$$('#menu button');let i=items.indexOf(t);i=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[i].focus();return}
  // popover: digits + arrows
  if(pop&&t.closest&&t.closest('#pop')&&!typing){
    if(/^[0-4]$/.test(e.key)){e.preventDefault();const {p,s}=pop;setLevel(p,s,+e.key);closePop(true);return}
    if(t.classList.contains('lv')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=$$('#pop .lv');let i=items.indexOf(t);i=clamp(i+(e.key==='ArrowDown'?1:-1),0,items.length-1);items[i].focus();return}
  }
  // drawer pickers: arrows
  if(t.closest&&t.closest('.picker')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault();const [p,s,l]=t.dataset.pick.split('|');const n=clamp(+l+(e.key==='ArrowRight'?1:-1),0,4);if(n!==+l){setLevel(p,s,n);const nb=$(`[data-fk="pk:${CSS.escape(p)}:${CSS.escape(s)}:${n}"]`);if(nb)nb.focus()}return;
  }
  // matrix grid navigation
  if(t.classList&&t.classList.contains('cell')&&!mod&&!e.altKey){
    const r=+t.dataset.r,c=+t.dataset.c;let nr=r,nc=c;
    const k=e.key;
    if(/^[0-4]$/.test(k)){e.preventDefault();setLevel(t.dataset.p,t.dataset.s,+k);return}
    if(k==='Backspace'||k==='Delete'){e.preventDefault();setLevel(t.dataset.p,t.dataset.s,0);return}
    if(k==='ArrowRight')nc++;else if(k==='ArrowLeft')nc--;else if(k==='ArrowDown')nr++;else if(k==='ArrowUp')nr--;
    else if(k==='Home')nc=0;else if(k==='End')nc=9999;else if(k==='PageDown')nr+=8;else if(k==='PageUp')nr-=8;else return;
    e.preventDefault();
    const cells=$$('.mx .cell');const maxR=Math.max(...cells.map(x=>+x.dataset.r)),maxC=Math.max(...cells.map(x=>+x.dataset.c));
    nr=clamp(nr,0,maxR);nc=clamp(nc,0,maxC);
    const n=$(`.mx .cell[data-r="${nr}"][data-c="${nc}"]`);
    if(n&&n!==t){t.tabIndex=-1;n.tabIndex=0;UI.cur={p:n.dataset.p,s:n.dataset.s};n.focus();n.scrollIntoView({block:'nearest',inline:'nearest'})}
  }
});

/* init */
$('#ballIcon').innerHTML=ball(3,0,16);
$('#ballIcon').style.display='contents';
render();
</script>
