<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c14;
  --panel:rgba(255,255,255,.045);
  --panel-hi:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.10);
  --stroke-hi:rgba(255,255,255,.22);
  --ink:#f2f4f9;
  --ink-2:rgba(242,244,249,.66);
  --ink-3:rgba(242,244,249,.40);
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
/* ambient background driven by the "primary" city's phase */
#aura{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1.6s var(--ease)}
#aura::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% -10%, transparent 40%, rgba(5,6,12,.72) 100%);
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.8s linear}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:36px 24px 96px}

/* ── header ───────────────────────────────────────────── */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:38px;height:38px;flex:0 0 auto}
h1{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(26px,4.4vw,36px);font-weight:400;margin:0;letter-spacing:-.01em;line-height:1}
.tag{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em}
.tools{display:flex;align-items:center;gap:10px}

.seg{display:flex;background:var(--panel);border:1px solid var(--stroke);border-radius:999px;padding:3px;position:relative}
.seg button{
  position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);
  padding:7px 15px;border-radius:999px;transition:color .28s var(--ease);letter-spacing:.02em;
}
.seg button[aria-pressed="true"]{color:#0a0c14}
.seg .thumb{position:absolute;top:3px;left:3px;height:calc(100% - 6px);background:var(--ink);border-radius:999px;
  transition:transform .42s var(--ease),width .42s var(--ease);z-index:0}

.btn{
  appearance:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;color:var(--ink);
  background:var(--panel);border:1px solid var(--stroke);
  transition:background .2s,border-color .2s,transform .15s var(--ease);
}
.btn:hover{background:var(--panel-hi);border-color:var(--stroke-hi)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#0a0c14;border-color:transparent}
.btn.primary:hover{background:#fff}
.btn svg{width:15px;height:15px}

/* ── grid ─────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}

.card{
  position:relative;overflow:hidden;
  border-radius:var(--r);
  border:1px solid var(--stroke);
  background:#11141f;
  padding:20px;
  min-height:212px;
  display:flex;flex-direction:column;
  transition:transform .45s var(--ease),border-color .3s,box-shadow .45s var(--ease);
  animation:pop .55s var(--ease) both;
  cursor:default;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);border-color:var(--stroke-hi);box-shadow:0 22px 50px -20px rgba(0,0,0,.8)}
.card .sky{position:absolute;inset:0;z-index:0;transition:background 1.2s var(--ease)}
.card .grain{position:absolute;inset:0;z-index:1;opacity:.35;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.12) .5px,transparent .5px);background-size:4px 4px}
.card .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,9,16,.10),rgba(8,9,16,.62))}
/* Lift content above the sky layers, but leave the absolutely-positioned
   overlays (.homepill/.acts) alone — they set their own position/z-index. */
.card > *:not(.sky):not(.grain):not(.veil):not(.homepill):not(.acts){position:relative;z-index:2}

.card.primary{border-color:rgba(255,255,255,.30)}
.card.primary::after{
  content:'';position:absolute;z-index:3;inset:0;border-radius:var(--r);pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.homepill{
  position:absolute;z-index:3;top:14px;right:14px;
  font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);
}

.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cname{font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cmeta{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:3px;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.offset{font-variant-numeric:tabular-nums;padding:1.5px 6px;border-radius:5px;background:rgba(255,255,255,.13);font-size:10.5px;font-weight:600}

.icon{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
/* Home cards carry a badge in the top-right, so drop the icon clear of it. */
.card:has(.homepill:not([hidden])) .iconwrap{margin-top:22px}

.time{
  margin-top:auto;display:flex;align-items:baseline;gap:3px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  letter-spacing:-.03em;
}
.time .ampm{margin-left:5px}
.hhmm{font-size:clamp(40px,8.4vw,49px);font-weight:500;line-height:.95}
.secs{font-size:14px;font-weight:500;color:rgba(255,255,255,.42);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.secs::before{content:':';margin-right:1px;opacity:.55}
.ampm{font-size:14px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.04em}

.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
.datel{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.01em}
.phase{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.82);
  display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 9px currentColor;background:currentColor}
.diff{font-size:11.5px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}

/* day arc */
.arc{margin-top:13px;height:3px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.arc i{position:absolute;top:0;left:0;height:100%;border-radius:99px;background:rgba(255,255,255,.85);
  transition:width 1s linear}
.arc b{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px 1px rgba(255,255,255,.9);transition:left 1s linear}

.acts{position:absolute;z-index:4;bottom:14px;right:14px;display:flex;gap:6px;opacity:0;transform:translateY(5px);
  transition:opacity .25s,transform .25s var(--ease)}
.card:hover .acts,.card:focus-within .acts{opacity:1;transform:none}
.act{
  appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(10,12,20,.5);backdrop-filter:blur(8px);
  color:#fff;width:29px;height:29px;border-radius:9px;cursor:pointer;display:grid;place-items:center;
  transition:background .18s,border-color .18s,transform .15s var(--ease);padding:0;
}
.act:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.act:active{transform:scale(.9)}
.act.del:hover{background:rgba(255,74,74,.42);border-color:rgba(255,110,110,.6)}
.act svg{width:14px;height:14px}

/* add tile */
.add{
  border:1px dashed var(--stroke-hi);background:transparent;border-radius:var(--r);min-height:212px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-3);gap:0;
  transition:border-color .25s,color .25s,background .25s,transform .15s var(--ease);
  font:inherit;
}
.add:hover{border-color:rgba(255,255,255,.45);color:var(--ink);background:var(--panel)}
.add:active{transform:scale(.985)}
.add .in{display:flex;flex-direction:column;align-items:center;gap:10px}
.add svg{width:24px;height:24px}
.add span{font-size:13px;font-weight:600;letter-spacing:.01em}

/* ── modal ────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(4,5,10,.7);backdrop-filter:blur(10px);
  display:grid;place-items:start center;padding:12vh 20px 20px;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:480px;background:#12151f;border:1px solid var(--stroke);border-radius:20px;
  box-shadow:0 40px 90px -25px rgba(0,0,0,.9);overflow:hidden;transform:translateY(-14px) scale(.98);
  transition:transform .38s var(--ease)}
.scrim.on .modal{transform:none}
.mhead{padding:16px 18px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:11px}
.mhead svg{width:17px;height:17px;color:var(--ink-3);flex:0 0 auto}
#q{flex:1;appearance:none;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:15.5px}
#q::placeholder{color:var(--ink-3)}
.kbd{font-size:10px;font-weight:600;color:var(--ink-3);border:1px solid var(--stroke);border-radius:6px;padding:3px 6px}
.results{max-height:min(52vh,420px);overflow-y:auto;padding:7px;scrollbar-width:thin}
.results::-webkit-scrollbar{width:8px}
.results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent}
.row.sel{background:var(--panel-hi);border-color:var(--stroke)}
.row .rn{font-size:14px;font-weight:500}
.row .rs{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.row .rt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.row .rtime{font-size:14px;font-weight:600}
.row .rz{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.row .flag{font-size:20px;line-height:1;width:24px;text-align:center;flex:0 0 auto}
.row.dis{opacity:.36;cursor:not-allowed}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.mfoot{padding:9px 14px;border-top:1px solid var(--stroke);display:flex;gap:16px;color:var(--ink-3);font-size:11px}
.mfoot b{color:var(--ink-2);font-weight:600}

.toast{position:fixed;z-index:80;left:50%;bottom:26px;transform:translate(-50%,80px);
  background:var(--ink);color:#0a0c14;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:999px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.8);transition:transform .42s var(--ease),opacity .3s;opacity:0;
  display:flex;align-items:center;gap:10px}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast button{appearance:none;border:0;background:rgba(10,12,20,.12);font:inherit;font-size:11.5px;font-weight:700;
  color:#0a0c14;border-radius:99px;padding:4px 10px;cursor:pointer}
.toast button:hover{background:rgba(10,12,20,.22)}

footer{margin-top:34px;color:var(--ink-3);font-size:11.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer kbd{font-family:inherit;border:1px solid var(--stroke);border-radius:5px;padding:1px 5px;font-size:10.5px}

@media (max-width:560px){
  .wrap{padding:22px 15px 80px}
  header{align-items:stretch;flex-direction:column;gap:16px}
  .tools{justify-content:space-between}
  .grid{grid-template-columns:1fr}
  .acts{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   Solar geometry — real sunrise/sunset per city, per day.
   Lets us classify dawn/day/dusk/night truthfully instead of by
   fixed clock hours (a 5am Reykjavík summer is broad daylight).
   ══════════════════════════════════════════════════════════════ */
const RAD = Math.PI / 180;

/** Solar elevation in degrees for a lat/lon at a given UTC instant. */
function solarElevation(date, lat, lon) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0;                       // days since J2000
  const L = (280.460 + 0.9856474 * n) % 360;      // mean longitude
  const g = ((357.528 + 0.9856003 * n) % 360) * RAD; // mean anomaly
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD; // ecliptic longitude
  const eps = (23.439 - 0.0000004 * n) * RAD;     // obliquity
  const decl = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24;
  const lst = (gmst * 15 + lon) * RAD;            // local sidereal, radians
  const ha = lst - ra;
  const phi = lat * RAD;
  const sin = Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(ha);
  return Math.asin(Math.max(-1, Math.min(1, sin))) / RAD;
}

/* ── Time-zone plumbing ─────────────────────────────────────── */
const partsCache = new Map();
function fmt(zone, opts) {
  const key = zone + JSON.stringify(opts);
  let f = partsCache.get(key);
  if (!f) { f = new Intl.DateTimeFormat("en-US", { timeZone: zone, ...opts }); partsCache.set(key, f); }
  return f;
}

/** Wall-clock fields for `zone` at instant `d`. */
function zoned(d, zone) {
  const p = fmt(zone, {
    hour12: false, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"
  }).formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  let h = +p.hour % 24; // Intl can emit "24" at midnight
  return { y:+p.year, mo:+p.month, d:+p.day, h, mi:+p.minute, s:+p.second, wd:p.weekday };
}

/** UTC offset in minutes for `zone` at instant `d`. */
function offsetMinutes(d, zone) {
  const z = zoned(d, zone);
  const asUTC = Date.UTC(z.y, z.mo - 1, z.d, z.h, z.mi, z.s);
  return Math.round((asUTC - Math.floor(d.getTime() / 1000) * 1000) / 60000);
}

function offsetLabel(mins) {
  const s = mins < 0 ? "-" : "+", a = Math.abs(mins);
  const h = Math.floor(a / 60), m = a % 60;
  return "UTC" + s + h + (m ? ":" + String(m).padStart(2, "0") : "");
}

function zoneAbbr(d, zone) {
  try {
    const p = fmt(zone, { timeZoneName: "short" }).formatToParts(d).find(x => x.type === "timeZoneName");
    return p ? p.value : "";
  } catch { return ""; }
}

/* ── Phase classification & palettes ───────────────────────── */
const PHASES = {
  night:     { label:"Night",     dot:"#8ea2ff", sky:["#0b1024","#141a38","#1c2149"] },
  astro:     { label:"Twilight",  dot:"#a58bff", sky:["#121538","#2a2058","#40275f"] },
  dawn:      { label:"Dawn",      dot:"#ff9e7d", sky:["#3a2350","#8a4360","#e08a5e"] },
  sunrise:   { label:"Sunrise",   dot:"#ffc46b", sky:["#7a3a5c","#e0784f","#ffc16b"] },
  morning:   { label:"Morning",   dot:"#ffd98a", sky:["#2f7fc4","#68b2de","#ffd9a0"] },
  midday:    { label:"Midday",    dot:"#ffe680", sky:["#1e6fc4","#4d9fe0","#8fd0f0"] },
  afternoon: { label:"Afternoon", dot:"#ffcf6b", sky:["#2c72b8","#7fb3dd","#ffd48f"] },
  golden:    { label:"Golden hour", dot:"#ffb04f", sky:["#25518f","#d1743f","#ffb15a"] },
  sunset:    { label:"Sunset",    dot:"#ff7a5c", sky:["#3b2a63","#c4514f","#ff9152"] },
  dusk:      { label:"Dusk",      dot:"#a98cff", sky:["#141a3d","#3d2a63","#7a3f66"] },
};

/**
 * Choose a phase from solar elevation, disambiguating rising vs setting
 * so dawn and dusk read differently even at the same altitude.
 */
function phaseFor(elev, rising) {
  if (elev < -18) return "night";
  if (elev < -6)  return "astro";
  if (elev < -0.833) return rising ? "dawn" : "dusk";
  if (elev < 4)   return rising ? "sunrise" : "sunset";
  if (elev < 10)  return rising ? "morning" : "golden";
  if (elev < 25)  return rising ? "morning" : "afternoon";
  return "midday";
}

/* Icon set — each phase gets a distinct hand-built SVG. */
function iconFor(phase) {
  const S = (inner, extra = "") =>
    `<svg class="icon" viewBox="0 0 44 44" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${extra}${inner}</svg>`;
  const rays = (c, o = 1) => {
    let p = "";
    for (let i = 0; i < 8; i++) {
      const a = i * 45 * RAD, x = 22 + Math.cos(a) * 12.5, y = 22 + Math.sin(a) * 12.5,
            x2 = 22 + Math.cos(a) * 17.5, y2 = 22 + Math.sin(a) * 17.5;
      p += `<path d="M${x.toFixed(1)} ${y.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${c}" stroke-width="2.2" opacity="${o}"/>`;
    }
    return p;
  };
  switch (phase) {
    case "night": case "astro":
      return S(`<path d="M28.5 27.5A11 11 0 0 1 17.2 12a13 13 0 1 0 14.4 19.6 11 11 0 0 1-3.1-4.1z" fill="#dfe6ff" opacity=".95"/>
        <circle cx="33" cy="12" r="1.5" fill="#fff"/><circle cx="12" cy="9" r="1.1" fill="#fff" opacity=".8"/><circle cx="37" cy="21" r="1" fill="#fff" opacity=".7"/>`);
    case "dawn": case "sunrise": {
      const c = phase === "dawn" ? "#ffb08a" : "#ffd066";
      return S(`<circle cx="22" cy="26" r="8.5" fill="${c}"/>
        <path d="M6 34h32" stroke="rgba(255,255,255,.85)" stroke-width="2.4"/>
        <path d="M22 8v6M11.5 12.5l3.5 3.5M32.5 12.5 29 16" stroke="${c}" stroke-width="2.4"/>
        <path d="M16 20l6-6 6 6" stroke="#fff" stroke-width="2.2" opacity=".9"/>`);
    }
    case "morning":
      return S(rays("#ffd98a") + `<circle cx="22" cy="22" r="9" fill="#ffe4a3"/>`);
    case "midday":
      return S(rays("#ffe680") + `<circle cx="22" cy="22" r="10" fill="#fff1b8"/><circle cx="22" cy="22" r="10" fill="none" stroke="#fff" stroke-width="1" opacity=".6"/>`);
    case "afternoon":
      return S(rays("#ffcf6b", .9) + `<circle cx="22" cy="22" r="9" fill="#ffdd94"/>`);
    case "golden":
      return S(rays("#ffb04f", .85) + `<circle cx="22" cy="24" r="8.5" fill="#ffc06a"/><path d="M8 33h28" stroke="rgba(255,255,255,.5)" stroke-width="2"/>`);
    case "sunset":
      return S(`<circle cx="22" cy="24" r="8.5" fill="#ff9152"/>
        <path d="M6 33h32" stroke="rgba(255,255,255,.85)" stroke-width="2.4"/>
        <path d="M22 8v5M12 13l3 3M32 13l-3 3" stroke="#ffb07a" stroke-width="2.2"/>
        <path d="M16 12l6 6 6-6" stroke="#fff" stroke-width="2.2" opacity=".9"/>`);
    default: // dusk
      return S(`<path d="M22 30a9 9 0 0 1 18 0" fill="none"/>
        <circle cx="22" cy="27" r="7.5" fill="#8e79d6"/>
        <path d="M7 33h30" stroke="rgba(255,255,255,.7)" stroke-width="2.4"/>
        <circle cx="34" cy="12" r="1.4" fill="#fff"/><circle cx="11" cy="14" r="1" fill="#fff" opacity=".75"/>`);
  }
}

/* ══════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════ */
const KEY = "meridian.v1";
const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

function findCity(name, zone) {
  return CITIES.find(c => c[0] === name && c[2] === zone) || CITIES.find(c => c[2] === zone);
}

/** Best-guess home city from the browser zone, else a synthetic entry. */
function homeCity() {
  const exact = CITIES.filter(c => c[2] === localZone);
  if (exact.length) return exact[0];
  const leaf = (localZone.split("/").pop() || localZone).replace(/_/g, " ");
  return [leaf, "Your location", localZone, "📍", 0, 0];
}

let state = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && Array.isArray(raw.cities) && raw.cities.length) {
      const cities = raw.cities.map(c => {
        const hit = findCity(c.name, c.zone);
        return hit ? hit.slice() : (c.zone ? [c.name, c.country || "", c.zone, c.flag || "🌐", c.lat || 0, c.lon || 0] : null);
      }).filter(Boolean);
      if (cities.length) return { h12: raw.h12 !== false, cities };
    }
  } catch {}
  const home = homeCity();
  const seed = ["New York", "London", "Tokyo", "Sydney"]
    .map(n => CITIES.find(c => c[0] === n))
    .filter(c => c && c[2] !== home[2]);
  return { h12: true, cities: [home, ...seed].slice(0, 5) };
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      h12: state.h12,
      cities: state.cities.map(c => ({ name:c[0], country:c[1], zone:c[2], flag:c[3], lat:c[4], lon:c[5] }))
    }));
  } catch {}
}

   Rendering
   ══════════════════════════════════════════════════════════════ */
const grid = document.getElementById("grid");
const aura = document.getElementById("aura");
const nodes = new Map(); // zone|name -> {el, refs}
const uid = c => c[2] + "|" + c[0];

function skyCss(p, angle = 155) {
  const [a, b, c] = PHASES[p].sky;
  return `linear-gradient(${angle}deg, ${a} 0%, ${b} 52%, ${c} 100%)`;
}

function build(city, i) {
  const el = document.createElement("article");
  el.className = "card";
  el.style.animationDelay = (i * 55) + "ms";
  el.innerHTML = `
    <div class="sky"></div><div class="grain"></div><div class="veil"></div>
    <div class="homepill" hidden>Home</div>
    <div class="ctop">
      <div>
        <div class="cname"></div>
        <div class="cmeta"><span class="cwhere"></span><span class="offset"></span></div>
      </div>
      <div class="iconwrap"></div>
    </div>
    <div class="time"><span class="hhmm">--:--</span><span class="secs"></span><span class="ampm"></span></div>
    <div class="cbot">
      <span class="datel"></span>
      <span class="phase"><span class="dot"></span><span class="plabel"></span></span>
    </div>
    <div class="arc"><i></i><b></b></div>
    <div class="acts">
      <button class="act up" title="Move earlier in list" aria-label="Move left">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 6 10l6 6"/></svg>
      </button>
      <button class="act dn" title="Move later in list" aria-label="Move right">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"/></svg>
      </button>
      <button class="act del" title="Remove city" aria-label="Remove">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg>
      </button>
    </div>`;
  const r = {
    el, sky:el.querySelector(".sky"), name:el.querySelector(".cname"), where:el.querySelector(".cwhere"),
    off:el.querySelector(".offset"), icon:el.querySelector(".iconwrap"), hhmm:el.querySelector(".hhmm"),
    secs:el.querySelector(".secs"), ampm:el.querySelector(".ampm"), date:el.querySelector(".datel"),
    dot:el.querySelector(".dot"), plabel:el.querySelector(".plabel"), fill:el.querySelector(".arc i"),
    knob:el.querySelector(".arc b"), home:el.querySelector(".homepill"), phase:null, iconPhase:null
  };
  r.name.textContent = city[0];
  r.where.textContent = city[1];
  el.querySelector(".del").onclick = () => remove(city);
  el.querySelector(".up").onclick  = () => move(city, -1);
  el.querySelector(".dn").onclick  = () => move(city, 1);
  return r;
}

function render() {
  const ids = new Set(state.cities.map(uid));
  for (const [k, r] of nodes) if (!ids.has(k)) { r.el.remove(); nodes.delete(k); }

  state.cities.forEach((c, i) => {
    let r = nodes.get(uid(c));
    if (!r) { r = build(c, i); nodes.set(uid(c), r); }
    grid.appendChild(r.el);
    r.el.classList.toggle("primary", i === 0);
    r.home.hidden = c[2] !== localZone;
    r.el.querySelector(".up").disabled = i === 0;
    r.el.querySelector(".dn").disabled = i === state.cities.length - 1;
    r.el.querySelector(".up").style.opacity = i === 0 ? .3 : 1;
    r.el.querySelector(".dn").style.opacity = i === state.cities.length - 1 ? .3 : 1;
  });

  let addTile = document.getElementById("addTile");
  if (!addTile) {
    addTile = document.createElement("button");
    addTile.id = "addTile"; addTile.className = "add";
    addTile.innerHTML = `<span class="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add a city</span></span>`;
    addTile.onclick = openModal;
  }
  grid.appendChild(addTile);
  tick();
}

const WD = { Sun:"Sunday", Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday", Thu:"Thursday", Fri:"Friday", Sat:"Saturday" };
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2, "0");

function relDayLabel(z, base) {
  const a = Date.UTC(z.y, z.mo - 1, z.d), b = Date.UTC(base.y, base.mo - 1, base.d);
  const d = Math.round((a - b) / 86400000);
  return d === 0 ? "Today" : d === 1 ? "Tomorrow" : d === -1 ? "Yesterday" : null;
}

function tick() {
  const now = new Date();
  const homeZ = zoned(now, localZone);
  const homeOff = offsetMinutes(now, localZone);

  state.cities.forEach((c, i) => {
    const r = nodes.get(uid(c));
    if (!r) return;
    const [name, , zone, , lat, lon] = c;
    const z = zoned(now, zone);

    // clock
    let hh = z.h, ampm = "";
    if (state.h12) { ampm = z.h < 12 ? "AM" : "PM"; hh = z.h % 12 || 12; }
    r.hhmm.textContent = (state.h12 ? hh : p2(hh)) + ":" + p2(z.mi);
    r.secs.textContent = p2(z.s);
    r.ampm.textContent = ampm;

    // date + day delta relative to home
    const rel = relDayLabel(z, homeZ);
    r.date.textContent = `${WD[z.wd] || z.wd}, ${MO[z.mo - 1]} ${z.d}` + (rel && rel !== "Today" ? ` · ${rel}` : "");

    // offset chip: hours ahead/behind home, plus abbreviation
    const off = offsetMinutes(now, zone);
    const dm = off - homeOff;
    const dh = dm / 60;
    const relStr = zone === localZone ? "Local"
      : (dm === 0 ? "Same time" : (dm > 0 ? "+" : "−") + (Math.abs(dh) % 1 ? Math.abs(dh).toFixed(1) : Math.abs(dh)) + "h");
    r.off.textContent = relStr;
    r.off.title = offsetLabel(off) + (zoneAbbr(now, zone) ? " · " + zoneAbbr(now, zone) : "");

    // solar phase (true elevation; 10 min earlier tells us rising vs setting)
    const elev = solarElevation(now, lat, lon);
    const rising = elev > solarElevation(new Date(now.getTime() - 600000), lat, lon);
    const ph = phaseFor(elev, rising);
    if (r.phase !== ph) {
      r.phase = ph;
      r.sky.style.background = skyCss(ph);
      r.dot.style.color = PHASES[ph].dot;
      r.plabel.textContent = PHASES[ph].label;
      if (r.iconPhase !== ph) { r.icon.innerHTML = iconFor(ph); r.iconPhase = ph; }
      if (i === 0) {
        aura.style.background = skyCss(ph, 175);
        document.getElementById("stars").style.opacity =
          (ph === "night" || ph === "astro") ? .85 : (ph === "dusk" || ph === "dawn" ? .35 : 0);
      }
    }

    // day progress arc
    const pct = ((z.h * 3600 + z.mi * 60 + z.s) / 86400) * 100;
    r.fill.style.width = pct.toFixed(2) + "%";
    r.knob.style.left = pct.toFixed(2) + "%";
  });

  const tl = document.getElementById("tagline");
  const n = state.cities.length;
  tl.textContent = `${n} ${n === 1 ? "city" : "cities"} · ${state.h12 ? "12-hour" : "24-hour"} · anchored to ${homeCity()[0]}`;
}

/* ── Mutations ─────────────────────────────────────────────── */
let undo = null;
function remove(city) {
  const i = state.cities.findIndex(c => uid(c) === uid(city));
  if (i < 0) return;
  const r = nodes.get(uid(city));
  if (r) { r.el.style.transition = "opacity .22s, transform .28s"; r.el.style.opacity = 0; r.el.style.transform = "scale(.94)"; }
  undo = { city, i };
  setTimeout(() => {
    state.cities.splice(i, 1); save(); render();
    toast(`Removed ${city[0]}`, "Undo", () => { state.cities.splice(undo.i, 0, undo.city); save(); render(); });
  }, 180);
}
function move(city, dir) {
  const i = state.cities.findIndex(c => uid(c) === uid(city));
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.cities.length) return;
  [state.cities[i], state.cities[j]] = [state.cities[j], state.cities[i]];
  save(); render();
}
function add(city) {
  if (state.cities.some(c => uid(c) === uid(city))) { toast(`${city[0]} is already on your board`); return; }
  state.cities.push(city); save(); render();
  const r = nodes.get(uid(city));
  if (r) { r.el.style.animation = "none"; requestAnimationFrame(() => { r.el.style.animation = "pop .5s cubic-bezier(.22,1,.36,1) both"; }); }
  toast(`Added ${city[0]}`);
}

/* ── Format toggle ─────────────────────────────────────────── */
const f12 = document.getElementById("f12"), f24 = document.getElementById("f24"), thumb = document.getElementById("thumb");
function syncSeg() {
  f12.setAttribute("aria-pressed", state.h12); f24.setAttribute("aria-pressed", !state.h12);
  const t = state.h12 ? f12 : f24;
  thumb.style.width = t.offsetWidth + "px";
  thumb.style.transform = `translateX(${t.offsetLeft - 3}px)`;
}
function setFormat(v) { if (state.h12 === v) return; state.h12 = v; save(); syncSeg(); tick(); }
f12.onclick = () => setFormat(true);
f24.onclick = () => setFormat(false);

/* ── Search modal ──────────────────────────────────────────── */
const scrim = document.getElementById("scrim"), q = document.getElementById("q"), results = document.getElementById("results");
let matches = [], sel = 0;

/* Cities users most often mean when a query is ambiguous. Breaks scoring
   ties ahead of alphabetical order, so "reykja" → Reykjavík (not another
   Icelandic locality) and "new" → New York. */
const PROMINENT = new Set([
  "London","New York","Tokyo","Paris","Singapore","Hong Kong","Dubai","Sydney",
  "Los Angeles","San Francisco","Chicago","Berlin","Amsterdam","Madrid","Rome",
  "Toronto","Vancouver","Mexico City","São Paulo","Buenos Aires","Mumbai","Delhi",
  "Shanghai","Beijing","Seoul","Bangkok","Jakarta","Istanbul","Moscow","Cairo",
  "Lagos","Nairobi","Johannesburg","Reykjavík","Dublin","Lisbon","Stockholm",
  "Zurich","Vienna","Copenhagen","Oslo","Helsinki","Auckland","Honolulu","UTC",
]);

function score(c, term) {
  const [n, k, z] = c;
  const N = n.toLowerCase(), K = k.toLowerCase(), Z = z.toLowerCase().replace(/_/g, " ");
  if (N === term) return 0;
  if (N.startsWith(term)) return 1;
  if (K.startsWith(term)) return 2;
  if (N.includes(term)) return 3;
  if (K.includes(term)) return 4;
  if (Z.includes(term)) return 5;
  return -1;
}

/** Sort key within an equal score: prominent cities first, then A–Z. */
const rank = c => (PROMINENT.has(c[0]) ? 0 : 1);

function drawResults() {
  const term = q.value.trim().toLowerCase();
  const have = new Set(state.cities.map(uid));
  matches = (!term
    ? CITIES.filter(c => !have.has(uid(c)))
        .sort((a, b) => rank(a) - rank(b) || a[0].localeCompare(b[0])).slice(0, 60)
    : CITIES.map(c => [score(c, term), c]).filter(x => x[0] >= 0)
        .sort((a, b) => a[0] - b[0] || rank(a[1]) - rank(b[1]) || a[1][0].localeCompare(b[1][0]))
        .map(x => x[1]).slice(0, 60));

  if (!matches.length) { results.innerHTML = `<div class="empty">No cities match “${q.value}”</div>`; return; }
  sel = Math.min(sel, matches.length - 1);
  const now = new Date();
  results.innerHTML = matches.map((c, i) => {
    const z = zoned(now, c[2]);
    let hh = z.h, ap = "";
    if (state.h12) { ap = z.h < 12 ? " AM" : " PM"; hh = z.h % 12 || 12; }
    const dup = have.has(uid(c));
    return `<div class="row${i === sel ? " sel" : ""}${dup ? " dis" : ""}" data-i="${i}">
      <span class="flag">${c[3]}</span>
      <span><span class="rn">${c[0]}</span><div class="rs">${c[1]}${dup ? " · already added" : ""}</div></span>
      <span class="rt"><div class="rtime">${state.h12 ? hh : p2(hh)}:${p2(z.mi)}${ap}</div>
        <div class="rz">${offsetLabel(offsetMinutes(now, c[2]))}</div></span>
    </div>`;
  }).join("");
  results.querySelectorAll(".row").forEach(row => {
    row.onclick = () => { const c = matches[+row.dataset.i]; if (!have.has(uid(c))) { add(c); closeModal(); } };
    row.onmouseenter = () => { sel = +row.dataset.i; results.querySelectorAll(".row").forEach(x => x.classList.toggle("sel", x === row)); };
  });
}
function scrollSel() {
  const el = results.querySelector(".row.sel");
  if (el) el.scrollIntoView({ block: "nearest" });
}
function openModal() { scrim.classList.add("on"); q.value = ""; sel = 0; drawResults(); setTimeout(() => q.focus(), 60); }
function closeModal() { scrim.classList.remove("on"); q.blur(); }
document.getElementById("openAdd").onclick = openModal;
scrim.onclick = e => { if (e.target === scrim) closeModal(); };
q.oninput = () => { sel = 0; drawResults(); };
q.onkeydown = e => {
  if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, matches.length - 1); drawResults(); scrollSel(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); scrollSel(); }
  else if (e.key === "Enter") {
    const c = matches[sel];
    if (c && !state.cities.some(x => uid(x) === uid(c))) { add(c); closeModal(); }
  } else if (e.key === "Escape") closeModal();
};
document.addEventListener("keydown", e => {
  if (scrim.classList.contains("on")) { if (e.key === "Escape") closeModal(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "c" || k === "/") { e.preventDefault(); openModal(); }
  else if (k === "t") setFormat(!state.h12);
});

/* ── Toast ─────────────────────────────────────────────────── */
const toastEl = document.getElementById("toast"), toastMsg = document.getElementById("toastMsg");
let toastT;
function toast(msg, actionLabel, fn) {
  toastMsg.textContent = msg;
  toastEl.querySelectorAll("button").forEach(b => b.remove());
  if (actionLabel) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = () => { fn(); hideToast(); };
    toastEl.appendChild(b);
  }
  toastEl.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, actionLabel ? 5200 : 2400);
}
function hideToast() { toastEl.classList.remove("on"); }

/* ── Starfield (only visible when the anchor city is dark) ──── */
const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
let stars = [];
function seedStars() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(innerWidth * innerHeight / 9000);
  stars = Array.from({ length: n }, (_, i) => ({
    x: (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * innerWidth,
    y: (Math.sin(i * 78.233) * 12345.6789 % 1 + 1) % 1 * innerHeight * .82,
    r: ((Math.sin(i * 3.77) + 1) / 2) * 1.05 + .25,
    ph: i * 1.7, sp: .4 + ((Math.sin(i * 5.1) + 1) / 2) * 1.1
  }));
}
function drawStars(t) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = .28 + .55 * (0.5 + 0.5 * Math.sin(t / 1000 * s.sp + s.ph));
    ctx.globalAlpha = a; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
seedStars();
addEventListener("resize", () => { seedStars(); syncSeg(); });
requestAnimationFrame(drawStars);

/* ── Boot ──────────────────────────────────────────────────── */
render();
syncSeg();
setInterval(tick, 250);
document.fonts && document.fonts.ready.then(syncSeg);
</script>
</body>
</html>
