<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#12100f" />
<title>STUDIO ONE — Virtual Drum Kit</title>
<style>
  :root{
    --bg:#100e0d;
    --bg2:#191614;
    --panel:#211d1a;
    --panel-hi:#2b2622;
    --edge:#3a332e;
    --edge-hi:#54493f;
    --brass:#d8a24a;
    --brass-2:#f3cd82;
    --led:#ff5a3c;
    --led-glow:#ff7a4d;
    --green:#57e39b;
    --cyan:#5ad7e8;
    --text:#f1e9df;
    --muted:#9b8e81;
    --dim:#6d6259;
    --shadow:rgba(0,0,0,.55);
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% -12%, #2a2320 0%, rgba(42,35,32,0) 62%),
      radial-gradient(900px 500px at 12% 108%, #1d2a2c 0%, rgba(29,42,44,0) 60%),
      radial-gradient(900px 500px at 88% 108%, #2c2118 0%, rgba(44,33,24,0) 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* subtle studio texture + vignette */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
  }
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 40px}

  /* ---------- header / rack ---------- */
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--panel-hi),var(--panel));
    border:1px solid var(--edge);border-radius:14px;
    padding:12px 16px;
    box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .rack-screws{display:flex;flex-direction:column;gap:22px}
  .screw{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8d8377,#3b342e 60%,#221e1a);
    box-shadow:inset 0 0 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06)}
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand .t{
    font-size:clamp(19px,4.6vw,27px);font-weight:800;letter-spacing:.16em;
    background:linear-gradient(180deg,#fff6e6,var(--brass));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .brand .s{margin-top:6px;font-size:9.5px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}

  .vu{
    margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:34px;
    padding:6px 9px;border-radius:8px;background:#0c0a09;
    border:1px solid #322c27;box-shadow:inset 0 2px 8px rgba(0,0,0,.8)
  }
  .vu i{width:4px;border-radius:1px;background:linear-gradient(180deg,var(--green),#2b7d55);height:3px;
    transition:height .07s linear, background .12s linear}

  /* ---------- transport ---------- */
  .transport{
    margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(180deg,#241f1c,#1a1614);
    border:1px solid var(--edge);border-radius:14px;padding:12px;
    box-shadow:0 10px 26px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn{
    appearance:none;border:1px solid var(--edge-hi);cursor:pointer;
    background:linear-gradient(180deg,#3a332d,#241f1b);
    color:var(--text);font-family:var(--font);font-size:11.5px;font-weight:700;
    letter-spacing:.11em;text-transform:uppercase;
    padding:11px 15px;border-radius:9px;min-height:44px;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    box-shadow:0 3px 0 #14110f,0 6px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .06s,box-shadow .06s,background .15s,color .15s,border-color .15s;
  }
  .btn:hover:not(:disabled){background:linear-gradient(180deg,#463d36,#2b2521)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #14110f,inset 0 2px 6px rgba(0,0,0,.6)}
  .btn:disabled{opacity:.36;cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn .dot{width:9px;height:9px;border-radius:50%;background:#4a423b;box-shadow:inset 0 0 3px rgba(0,0,0,.8);flex:none}
  .btn.rec.armed{border-color:#8a3a2c;color:#ffd9cf;background:linear-gradient(180deg,#5a2119,#331310)}
  .btn.rec.armed .dot{background:var(--led);box-shadow:0 0 10px var(--led-glow),0 0 20px rgba(255,90,60,.5);animation:blink 1s steps(1,end) infinite}
  .btn.on{border-color:#2f7d59;color:#d8ffe9;background:linear-gradient(180deg,#1f5b41,#123324)}
  .btn.on .dot{background:var(--green);box-shadow:0 0 10px var(--green)}
  @keyframes blink{50%{opacity:.25}}

  .seg{display:flex;gap:1px;background:#14110f;border:1px solid var(--edge);border-radius:9px;padding:3px}
  .seg .btn{border:none;border-radius:6px;box-shadow:none;background:transparent;padding:9px 12px;min-height:38px;color:var(--muted)}
  .seg .btn.on{background:linear-gradient(180deg,#3d342c,#2a231e);color:var(--brass-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}

  .clock{
    font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--led);
    background:#0a0908;border:1px solid #322c27;border-radius:8px;
    padding:9px 13px;min-width:112px;text-align:center;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.85),0 0 22px rgba(255,90,60,.09);
    text-shadow:0 0 9px rgba(255,90,60,.7);
  }
  .knob-group{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
  .knob{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px}
  .knob label{font-size:8.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .knob input{
    -webkit-appearance:none;appearance:none;width:82px;height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--brass) var(--p,60%), #322c27 var(--p,60%));
    outline:none;cursor:pointer;
  }
  .knob input::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#f6f1e8,#8b8177 55%,#453d36);
    border:1px solid #14110f;box-shadow:0 2px 5px rgba(0,0,0,.7);cursor:pointer
  }
  .knob input::-moz-range-thumb{
    width:17px;height:17px;border-radius:50%;border:1px solid #14110f;
    background:radial-gradient(circle at 34% 28%,#f6f1e8,#8b8177 55%,#453d36);box-shadow:0 2px 5px rgba(0,0,0,.7)
  }
  .knob .v{font-family:var(--mono);font-size:10px;color:var(--muted)}

  /* ---------- timeline ---------- */
  .timeline{
    margin-top:12px;position:relative;height:46px;border-radius:11px;
    background:linear-gradient(180deg,#0c0a09,#151211);
    border:1px solid var(--edge);overflow:hidden;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.8);
  }
  #tlCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tl-empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;letter-spacing:.28em;color:#4e463f;text-transform:uppercase;pointer-events:none
  }

  /* ---------- kit stage ---------- */
  .stage{
    margin-top:16px;border-radius:18px;padding:16px;
    background:
      radial-gradient(680px 300px at 50% 0%, rgba(216,162,74,.07), rgba(0,0,0,0) 70%),
      linear-gradient(180deg,#1c1917,#141110);
    border:1px solid var(--edge);
    box-shadow:0 18px 44px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .stage-label{
    display:flex;align-items:center;gap:10px;margin:0 4px 14px;
    font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase
  }
  .stage-label:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),rgba(0,0,0,0))}

  .kit{display:grid;gap:11px;grid-template-columns:repeat(4,1fr)}
  @media (max-width:760px){.kit{grid-template-columns:repeat(3,1fr);gap:9px}}
  @media (max-width:460px){
    .kit{grid-template-columns:repeat(2,1fr);gap:8px}
    /* the rack screws + VU meter wrap awkwardly and the key hints are
       irrelevant without a keyboard */
    .rack-screws{display:none}
    header{flex-wrap:nowrap;gap:10px}
    .brand{min-width:0}
    .brand .s{font-size:8px;letter-spacing:.2em}
    /* let the meter shrink instead of wrapping onto its own line */
    .vu{height:26px;padding:5px 6px;flex:1 1 0;min-width:0;overflow:hidden}
    .vu i{flex:1 1 0;min-width:2px}
    .foot > div:first-child{display:none}
  }

  .pad{
    position:relative;border:none;cursor:pointer;
    /* Square-ish pads; overall kit size is capped via .kit max-width so that
       all 16 stay reachable without scrolling on a laptop. */
    aspect-ratio:1/.92;min-height:88px;border-radius:15px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    color:var(--text);font-family:var(--font);overflow:hidden;
    background:linear-gradient(180deg,#332c26,#1d1917);
    box-shadow:
      0 6px 0 #100e0d,
      0 12px 26px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 -3px 8px rgba(0,0,0,.5);
    transition:transform .07s cubic-bezier(.2,.8,.3,1),box-shadow .07s,filter .12s;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  /* brushed-metal rim */
  .pad::before{
    content:"";position:absolute;inset:4px;border-radius:11px;pointer-events:none;
    border:1px solid rgba(255,255,255,.055);
    background:
      repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.02) 0deg 3deg, rgba(0,0,0,.02) 3deg 6deg);
  }
  /* glow wash on hit */
  .pad::after{
    content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;
    background:radial-gradient(circle at 50% 42%, var(--c,#d8a24a), rgba(0,0,0,0) 66%);
    opacity:0;transition:opacity .26s ease-out;
  }
  .pad:hover{filter:brightness(1.13)}
  .pad:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .pad.hit{
    transform:translateY(6px) scale(.975);
    box-shadow:0 0 0 #100e0d, inset 0 3px 12px rgba(0,0,0,.6), 0 0 26px -4px var(--c);
  }
  .pad.hit::after{opacity:.5;transition:opacity 0s}
  .pad.ghost{animation:ghostPulse .34s ease-out}
  @keyframes ghostPulse{0%{box-shadow:0 6px 0 #100e0d,0 0 0 0 var(--c)}100%{box-shadow:0 6px 0 #100e0d,0 0 0 14px rgba(0,0,0,0)}}

  .pad .icon{width:52%;max-width:56px;min-width:34px;aspect-ratio:1;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  .pad .icon svg{width:100%;height:100%;display:block}
  .pad .name{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;pointer-events:none;text-align:center;padding:0 4px}
  .pad .key{
    position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;font-weight:700;
    width:21px;height:21px;border-radius:5px;display:grid;place-items:center;
    background:rgba(0,0,0,.5);color:var(--brass-2);border:1px solid rgba(216,162,74,.28);
    pointer-events:none;letter-spacing:0
  }
  .pad .vled{
    position:absolute;top:11px;right:10px;width:7px;height:7px;border-radius:50%;
    background:#171412;box-shadow:inset 0 0 3px rgba(0,0,0,.9);pointer-events:none;transition:background .1s,box-shadow .1s
  }
  .pad.hit .vled{background:var(--c);box-shadow:0 0 9px var(--c),0 0 18px var(--c)}

  /* ---------- footer / help ---------- */
  .foot{
    margin-top:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;
    font-size:10.5px;color:var(--dim);letter-spacing:.06em
  }
  .foot kbd{
    font-family:var(--mono);font-size:10px;background:#221e1b;border:1px solid var(--edge-hi);
    border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--muted);margin:0 1px
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,22px);z-index:50;
    background:linear-gradient(180deg,#302925,#1c1816);border:1px solid var(--edge-hi);
    color:var(--text);padding:11px 18px;border-radius:10px;font-size:12px;letter-spacing:.05em;
    box-shadow:0 12px 34px rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  /* Short/landscape viewports: compress the rack so all four pad rows stay
     playable without scrolling. Phones (tall + narrow) keep the big pads. */
  /* ---- desktop: fit the whole rack in exactly one viewport ----
     Must come after the base .pad rules to override aspect-ratio at equal
     specificity. The page becomes a flex column of fixed viewport height and the
     kit absorbs the leftover space, so four pad rows always fit without scrolling
     at any window size — no hand-tuned chrome constants. */
  @media (min-width:761px){
    body{overflow:hidden}
    /* Width follows leftover height so pads stay near-square rather than
       letterboxed; clamp() bounds it at both ends so pads never go wide-and-flat
       on short windows nor tall-and-narrow on very tall ones. */
    .wrap{height:100vh;max-width:clamp(600px,calc(100vh * 0.86),1180px);
      display:flex;flex-direction:column;padding-top:12px;padding-bottom:12px}
    /* keep transport on one line so it doesn't leave a gap under the buttons */
    .transport{flex-wrap:nowrap}
    .knob-group{flex-wrap:nowrap;gap:9px}
    .knob{min-width:0}
    .knob input{width:clamp(46px,5vw,82px)}
    .clock{min-width:0;padding:9px 10px;font-size:14px}
    .btn{padding:11px 12px}
    header{padding:9px 14px;flex:none}
    .brand .t{font-size:clamp(17px,2.2vh,25px)}
    .transport{margin-top:9px;padding:9px;flex:none}
    .timeline{margin-top:9px;height:clamp(26px,4.4vh,44px);flex:none}
    .stage{margin-top:10px;padding:12px;flex:1;min-height:0;
      display:flex;flex-direction:column}
    .stage-label{margin-bottom:9px;flex:none}
    .foot{margin-top:9px;flex:none}
    .kit{flex:1;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr))}
    .pad{aspect-ratio:auto;min-height:0;gap:clamp(2px,.9vh,7px)}
    .pad .icon{width:auto;height:min(44%,52px);max-width:none;min-width:0}
    .pad .name{font-size:clamp(8px,1.15vh,11px)}
  }
  /* Reclaim vertical space on cramped windows so the pads stay closer to square. */
  @media (min-width:761px) and (max-height:720px){
    .foot{display:none}
    .timeline{margin-top:7px}
    .stage{margin-top:8px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="rack-screws" aria-hidden="true"><div class="screw"></div><div class="screw"></div></div>
    <div class="brand">
      <div class="t">STUDIO&nbsp;ONE</div>
      <div class="s">Virtual Drum Kit &middot; 16 Pad Sampler</div>
    </div>
    <div class="vu" id="vu" aria-hidden="true"></div>
    <div class="rack-screws" aria-hidden="true"><div class="screw"></div><div class="screw"></div></div>
  </header>

  <div class="transport">
    <button class="btn rec" id="btnRec" aria-pressed="false"><span class="dot"></span><span id="recLabel">Record</span></button>
    <button class="btn" id="btnPlay" disabled><span class="dot"></span><span id="playLabel">Play</span></button>
    <button class="btn" id="btnLoop" aria-pressed="false"><span class="dot"></span>Loop</button>
    <button class="btn" id="btnMetro" aria-pressed="false"><span class="dot"></span>Click</button>
    <button class="btn" id="btnClear" disabled>Clear</button>

    <div class="clock" id="clock" role="status" aria-live="off">00:00.0</div>

    <div class="knob-group">
      <div class="knob">
        <label for="tempo">Tempo</label>
        <input type="range" id="tempo" min="50" max="200" value="100" step="1" />
        <span class="v" id="tempoV">100 BPM</span>
      </div>
      <div class="knob">
        <label for="vol">Master</label>
        <input type="range" id="vol" min="0" max="100" value="80" step="1" />
        <span class="v" id="volV">80</span>
      </div>
    </div>
  </div>

  <div class="timeline" id="timeline">
    <canvas id="tlCanvas"></canvas>
    <div class="tl-empty" id="tlEmpty">Timeline &middot; arm record and play the pads</div>
  </div>

  <div class="stage">
    <div class="stage-label">Kit &middot; Acoustic / Electronic Hybrid</div>
    <div class="kit" id="kit"></div>
  </div>

  <div class="foot">
    <div>Keys <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> &hellip; <kbd>V</kbd> &nbsp;&middot;&nbsp; <kbd>Space</kbd> play/stop &nbsp;&middot;&nbsp; <kbd>R</kbd>ec = <kbd>Shift</kbd>+<kbd>R</kbd> &nbsp;&middot;&nbsp; hold <kbd>Shift</kbd> while hitting for accent</div>
    <div>All sounds synthesized live &middot; no samples loaded</div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ============================================================
   Audio engine — everything is synthesized with Web Audio.
   No sample files, so the page is genuinely self-contained.
   ============================================================ */

let ac = null, master = null, bus = null, comp = null, verb = null, verbGain = null, analyser = null;
let noiseBuf = null;

function makeNoiseBuffer(ctx){
  const len = Math.floor(ctx.sampleRate * 2);
  const b = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

// Short algorithmic plate: exponentially decaying noise, stereo-decorrelated.
function makeImpulse(ctx, seconds, decay){
  const len = Math.floor(ctx.sampleRate * seconds);
  const b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++){
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (1 - t * 0.15);
    }
  }
  return b;
}

function initAudio(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  noiseBuf = makeNoiseBuffer(ac);

  master = ac.createGain();
  master.gain.value = 0.8;

  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 26;
  comp.ratio.value = 3.4;
  comp.attack.value = 0.004;
  comp.release.value = 0.18;

  analyser = ac.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.72;

  bus = ac.createGain();          // dry sum from all voices
  bus.gain.value = 1;

  verb = ac.createConvolver();
  verb.buffer = makeImpulse(ac, 1.5, 3.1);
  verbGain = ac.createGain();
  verbGain.gain.value = 0.2;      // room ambience

  bus.connect(comp);
  bus.connect(verb);
  verb.connect(verbGain);
  verbGain.connect(comp);
  comp.connect(master);
  master.connect(analyser);
  master.connect(ac.destination);

  return ac;
}

function noiseSource(t, dur, playbackRate){
  const s = ac.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  if (playbackRate) s.playbackRate.value = playbackRate;
  s.start(t, Math.random() * 1.5);
  s.stop(t + dur + 0.05);
  return s;
}

// Percussive gain envelope: instant-ish attack, exponential tail.
function env(t, peak, attack, decay){
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  return g;
}

function osc(type, freq, t){
  const o = ac.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.start(t);
  return o;
}

function bp(freq, q){ const f = ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; return f; }
function hp(freq){ const f = ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=freq; return f; }
function lp(freq, q){ const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=freq; if(q!=null)f.Q.value=q; return f; }

/* ---------- individual drum voices ---------- */

function kick(t, v){
  const o = osc("sine", 150, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.115);
  const g = env(t, 1.05 * v, 0.004, 0.42);
  // click transient for definition on small speakers
  const cN = noiseSource(t, 0.03), cF = hp(1200), cG = env(t, 0.28 * v, 0.001, 0.026);
  o.connect(g).connect(bus);
  cN.connect(cF).connect(cG).connect(bus);
  o.stop(t + 0.5);
}

function snare(t, v){
  const n = noiseSource(t, 0.26);
  const f = bp(1750, 0.7);
  const g = env(t, 0.72 * v, 0.002, 0.19);
  n.connect(f).connect(g).connect(bus);
  // two detuned bodies = shell ring
  [182, 246].forEach((fr, i) => {
    const o = osc("triangle", fr, t);
    const og = env(t, (i ? 0.24 : 0.34) * v, 0.003, 0.12);
    o.connect(og).connect(bus);
    o.stop(t + 0.3);
  });
}

function clap(t, v){
  // 4 offset noise bursts -> the classic 909 "handclap" smear
  [0, 0.011, 0.022, 0.036].forEach((off, i) => {
    const n = noiseSource(t + off, 0.11);
    const f = bp(1150 + i * 130, 1.5);
    const g = env(t + off, (i === 3 ? 0.62 : 0.42) * v, 0.001, i === 3 ? 0.16 : 0.035);
    n.connect(f).connect(g).connect(bus);
  });
}

function hat(t, v, open){
  const dur = open ? 0.42 : 0.055;
  const n = noiseSource(t, dur, 1.6);
  const f = hp(7600);
  const f2 = bp(11000, 0.85);
  const g = env(t, (open ? 0.34 : 0.42) * v, 0.001, dur);
  n.connect(f).connect(f2).connect(g).connect(bus);
  // metallic partials
  [3800, 5600, 7300].forEach(fr => {
    const o = osc("square", fr, t);
    const og = env(t, 0.055 * v, 0.001, dur * 0.7);
    o.connect(og).connect(bus);
    o.stop(t + dur + 0.05);
  });
}

function tom(t, v, base){
  const o = osc("sine", base, t);
  o.frequency.exponentialRampToValueAtTime(base * 0.55, t + 0.22);
  const g = env(t, 0.78 * v, 0.003, 0.3);
  const n = noiseSource(t, 0.09), nf = bp(base * 3, 1.1), ng = env(t, 0.2 * v, 0.001, 0.08);
  o.connect(g).connect(bus);
  n.connect(nf).connect(ng).connect(bus);
  o.stop(t + 0.45);
}

function cymbal(t, v, dur, tone){
  const n = noiseSource(t, dur, 1.05);
  const f = hp(tone);
  const g = env(t, 0.3 * v, 0.006, dur);
  n.connect(f).connect(g).connect(bus);
  // inharmonic FM-ish shimmer stack
  [1.0, 1.41, 1.87, 2.34, 3.11].forEach((m, i) => {
    const o = osc("square", tone * 0.62 * m, t);
    const og = env(t, (0.05 / (i * 0.55 + 1)) * v, 0.004, dur * (1 - i * 0.1));
    o.connect(og).connect(bus);
    o.stop(t + dur + 0.1);
  });
}

function rimshot(t, v){
  const o = osc("triangle", 420, t);
  o.frequency.exponentialRampToValueAtTime(240, t + 0.04);
  const g = env(t, 0.5 * v, 0.001, 0.05);
  const n = noiseSource(t, 0.05), nf = bp(2900, 2.2), ng = env(t, 0.4 * v, 0.001, 0.04);
  o.connect(g).connect(bus);
  n.connect(nf).connect(ng).connect(bus);
  o.stop(t + 0.12);
}

function cowbell(t, v){
  const g = env(t, 0.3 * v, 0.002, 0.34);
  const f = bp(2640, 3.5);
  [540, 800].forEach(fr => { const o = osc("square", fr, t); o.connect(f); o.stop(t + 0.42); });
  f.connect(g).connect(bus);
}

function shaker(t, v){
  const n = noiseSource(t, 0.1, 1.9);
  const f = bp(6200, 1.1);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.3 * v, t + 0.018);   // soft attack = shaker, not hat
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  n.connect(f).connect(g).connect(bus);
}

function stick(t, v){
  const n = noiseSource(t, 0.03), f = bp(1000, 1.6), g = env(t, 0.5 * v, 0.001, 0.022);
  n.connect(f).connect(g).connect(bus);
  const o = osc("square", 900, t), og = env(t, 0.14 * v, 0.001, 0.02);
  o.connect(og).connect(bus); o.stop(t + 0.06);
}

function zap(t, v){
  const o = osc("sawtooth", 1400, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.17);
  const f = lp(2600, 7);
  const g = env(t, 0.34 * v, 0.002, 0.19);
  o.connect(f).connect(g).connect(bus);
  o.stop(t + 0.4);
}

function subDrop(t, v){
  const o = osc("sine", 90, t);
  o.frequency.exponentialRampToValueAtTime(32, t + 0.5);
  const g = env(t, 0.85 * v, 0.01, 0.62);
  o.connect(g).connect(bus);
  o.stop(t + 0.8);
}

/* ---------- kit definition ---------- */

const ICONS = {

  clap: `<svg viewBox="0 0 64 64"><path d="M22 46c-6-6-9-14-7-22 1-4 5-5 7-2l5 8" fill="#e8b98f" stroke="#8c6244" stroke-width="2"/><path d="M42 46c6-6 9-14 7-22-1-4-5-5-7-2l-5 8" fill="#e8b98f" stroke="#8c6244" stroke-width="2"/><path d="M32 8v8M18 14l4 6M46 14l-4 6" stroke="#f3d9a0" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  perc: `<svg viewBox="0 0 64 64"><rect x="22" y="12" width="20" height="40" rx="9" fill="#5b4a36" stroke="#c9c2b6" stroke-width="2"/><circle cx="29" cy="24" r="2" fill="#e8dfd0"/><circle cx="36" cy="32" r="2" fill="#e8dfd0"/><circle cx="29" cy="40" r="2" fill="#e8dfd0"/></svg>`,

  zap: `<svg viewBox="0 0 64 64"><path d="M36 6L18 36h12l-4 22 20-32H33z" fill="#6ce0f0" stroke="#0f6a78" stroke-width="2"/></svg>`,
  sub: `<svg viewBox="0 0 64 64"><path d="M6 32c6 0 6-16 12-16s6 32 12 32 6-24 12-24 6 8 16 8" fill="none" stroke="#a07bf0" stroke-width="3.2" stroke-linecap="round"/></svg>`,
  rim: `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="32" rx="24" ry="20" fill="none" stroke="#dcd4c6" stroke-width="3"/><path d="M14 18l36 28" stroke="#f0c05a" stroke-width="3" stroke-linecap="round"/></svg>`

const PADS = [
  { key:"q", name:"Kick",       icon:"kick",    color:"#ff7043", play:(t,v)=>kick(t,v) },
  { key:"w", name:"Snare",      icon:"snare",   color:"#ffd166", play:(t,v)=>snare(t,v) },
  { key:"e", name:"Clap",       icon:"clap",    color:"#ff8fa3", play:(t,v)=>clap(t,v) },
  { key:"r", name:"Rim",        icon:"rim",     color:"#f4a261", play:(t,v)=>rimshot(t,v) },
  { key:"a", name:"Hat Closed", icon:"hat",     color:"#7ee8d5", play:(t,v)=>hat(t,v,false) },
  { key:"s", name:"Hat Open",   icon:"hatOpen", color:"#5ad7e8", play:(t,v)=>hat(t,v,true) },
  { key:"d", name:"Crash",      icon:"crash",   color:"#ffe08a", play:(t,v)=>cymbal(t,v,1.5,3600) },
  { key:"f", name:"Ride",       icon:"ride",    color:"#e8c46a", play:(t,v)=>cymbal(t,v,1.1,5200) },
  { key:"z", name:"Tom Hi",     icon:"tom",     color:"#a3d977", play:(t,v)=>tom(t,v,290) },
  { key:"x", name:"Tom Mid",    icon:"tom",     color:"#7fc96b", play:(t,v)=>tom(t,v,200) },
  { key:"c", name:"Tom Low",    icon:"tom",     color:"#5fae63", play:(t,v)=>tom(t,v,140) },
  { key:"v", name:"Cowbell",    icon:"bell",    color:"#f0b429", play:(t,v)=>cowbell(t,v) },
  { key:"t", name:"Shaker",     icon:"perc",    color:"#c3a995", play:(t,v)=>shaker(t,v) },
  { key:"g", name:"Stick",      icon:"stick",   color:"#d9b483", play:(t,v)=>stick(t,v) },
  { key:"b", name:"Zap",        icon:"zap",     color:"#6ce0f0", play:(t,v)=>zap(t,v) },
  { key:"y", name:"Sub Drop",   icon:"sub",     color:"#a07bf0", play:(t,v)=>subDrop(t,v) }
];

const byKey = new Map(PADS.map((p, i) => [p.key, i]));

/* ============================================================
   Sequencer / recorder
   ============================================================ */

const state = {
  recording:false,
  playing:false,
  loop:false,
  metro:false,
  events:[],         // {t (sec from take start), pad, vel}
  recStart:0,        // audio-clock time when recording armed
  playStart:0,       // audio-clock time when playback started
  length:0,          // take length in seconds
  scheduled:[],      // setTimeout ids for visual flashes
  nextIdx:0,
  metroNextBeat:0,
  metroStart:0
};

const el = id => document.getElementById(id);
const kitEl = el("kit"), toastEl = el("toast");

/* ---------- build pads ---------- */
// Several icons define <linearGradient id="...">. Duplicating those ids across
// pads makes every instance resolve to the first one, so namespace them per pad.
// Rewrite the markup string in one pass — editing innerHTML mid-iteration would
// detach the very nodes we're still walking, silently dropping url(#..) refs.
function iconMarkup(name, i){
  let svg = ICONS[name];
  const ids = [...svg.matchAll(/\sid="([^"]+)"/g)].map(m => m[1]);
  for (const id of ids){
    const uid = id + "_" + i;
    svg = svg.split(`id="${id}"`).join(`id="${uid}"`)
             .split(`url(#${id})`).join(`url(#${uid})`);
  }
  return svg;
}

PADS.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "pad";
  b.style.setProperty("--c", p.color);
  b.dataset.idx = i;
  b.setAttribute("aria-label", p.name + " — key " + p.key.toUpperCase());
  b.innerHTML =
    `<span class="key">${p.key.toUpperCase()}</span>` +
    `<span class="vled"></span>` +
    `<span class="icon">${iconMarkup(p.icon, i)}</span>` +
    `<span class="name">${p.name}</span>`;
  kitEl.appendChild(b);
  p.el = b;
});

/* ---------- flashing ---------- */
function flash(idx, ghost){
  const pad = PADS[idx].el;
  if (!pad) return;
  pad.classList.remove("hit","ghost");
  void pad.offsetWidth;
  pad.classList.add(ghost ? "ghost" : "hit");
  clearTimeout(pad._ft);
  pad._ft = setTimeout(() => pad.classList.remove("hit","ghost"), ghost ? 340 : 130);
}

/* ---------- triggering ---------- */
function trigger(idx, vel, when, live){
  initAudio();
  if (ac.state === "suspended") ac.resume();
  const t = when != null ? when : ac.currentTime + 0.002;
  try { PADS[idx].play(t, vel); } catch(e){ /* voice failure shouldn't kill the kit */ }

  if (live){
    flash(idx, false);
    if (state.recording){
      const at = ac.currentTime - state.recStart;
      state.events.push({ t: Math.max(0, at), pad: idx, vel });
      drawTimeline();
      el("btnClear").disabled = false;
    }
  }
}

/* ---------- pointer input ---------- */
const activePointers = new Map();
kitEl.addEventListener("pointerdown", e => {
  const pad = e.target.closest(".pad");
  if (!pad) return;
  e.preventDefault();
  pad.setPointerCapture?.(e.pointerId);
  const idx = +pad.dataset.idx;
  // velocity from vertical position: top of pad = harder hit
  const r = pad.getBoundingClientRect();
  const rel = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  const vel = e.shiftKey ? 1 : 0.55 + (1 - rel) * 0.45;
  activePointers.set(e.pointerId, idx);
  trigger(idx, vel, null, true);
}, { passive:false });
kitEl.addEventListener("pointerup", e => activePointers.delete(e.pointerId));
kitEl.addEventListener("pointercancel", e => activePointers.delete(e.pointerId));
kitEl.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- keyboard ---------- */
const held = new Set();
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key !== "Escape") return;
  const k = e.key.toLowerCase();

  if (e.code === "Space"){ e.preventDefault(); togglePlay(); return; }
  if (k === "r" && e.shiftKey){ e.preventDefault(); toggleRec(); return; }
  if (k === "l" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); toggleLoop(); return; }
  if (k === "m" && !e.metaKey && !e.ctrlKey){ e.preventDefault(); toggleMetro(); return; }

  if (byKey.has(k) && !held.has(k) && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    held.add(k);
    trigger(byKey.get(k), e.shiftKey ? 1 : 0.85, null, true);
  }
}, { passive:false });
addEventListener("keyup", e => held.delete(e.key.toLowerCase()));
addEventListener("blur", () => held.clear());

/* ---------- transport ---------- */
function toggleRec(){
  initAudio();
  if (ac.state === "suspended") ac.resume();

  if (state.recording){
    state.recording = false;
    state.length = Math.max(state.length, ac.currentTime - state.recStart);
    el("btnRec").classList.remove("armed");
    el("btnRec").setAttribute("aria-pressed","false");
    el("recLabel").textContent = "Record";
    el("btnPlay").disabled = state.events.length === 0;
    toast(state.events.length ? `Take captured · ${state.events.length} hits · ${state.length.toFixed(1)}s` : "Empty take");
    drawTimeline();
    return;
  }

  stopPlayback();
  state.recording = true;
  state.events = [];
  state.length = 0;
  state.recStart = ac.currentTime;
  el("btnRec").classList.add("armed");
  el("btnRec").setAttribute("aria-pressed","true");
  el("recLabel").textContent = "Stop Rec";
  el("btnPlay").disabled = true;
  el("btnClear").disabled = true;
  drawTimeline();
  toast("Recording — hit the pads");
}

function togglePlay(){
  if (state.recording){ toggleRec(); return; }
  if (state.playing){ stopPlayback(); return; }
  if (!state.events.length){ toast("Nothing recorded yet"); return; }
  startPlayback();
}

function startPlayback(){
  initAudio();
  if (ac.state === "suspended") ac.resume();
  state.playing = true;
  state.playStart = ac.currentTime + 0.06;
  state.nextIdx = 0;
  el("playLabel").textContent = "Stop";
  el("btnPlay").classList.add("on");
}

function stopPlayback(){
  state.playing = false;
  state.nextIdx = 0;
  state.scheduled.forEach(clearTimeout);
  state.scheduled = [];
  el("playLabel").textContent = "Play";
  el("btnPlay").classList.remove("on");
}

function toggleLoop(){
  state.loop = !state.loop;
  el("btnLoop").classList.toggle("on", state.loop);
  el("btnLoop").setAttribute("aria-pressed", String(state.loop));
  toast("Loop " + (state.loop ? "on" : "off"));
}

function toggleMetro(){
  initAudio();
  if (ac.state === "suspended") ac.resume();
  state.metro = !state.metro;
  el("btnMetro").classList.toggle("on", state.metro);
  el("btnMetro").setAttribute("aria-pressed", String(state.metro));
  if (state.metro){
    state.metroStart = ac.currentTime + 0.08;
    state.metroNextBeat = 0;
  }
}

function clearTake(){
  stopPlayback();
  if (state.recording) toggleRec();
  state.events = [];
  state.length = 0;
  el("btnPlay").disabled = true;
  el("btnClear").disabled = true;
  drawTimeline();
  toast("Take cleared");
}

el("btnRec").onclick = toggleRec;
el("btnPlay").onclick = togglePlay;
el("btnLoop").onclick = toggleLoop;
el("btnMetro").onclick = toggleMetro;
el("btnClear").onclick = clearTake;

/* ---------- metronome click ---------- */
function click(t, accent){
  const o = osc(accent ? "square" : "triangle", accent ? 1600 : 1050, t);
  const g = env(t, accent ? 0.16 : 0.09, 0.001, 0.035);
  o.connect(g).connect(bus);
  o.stop(t + 0.08);
}

/* ---------- scheduler: single rAF loop drives audio + UI ---------- */
const LOOKAHEAD = 0.12;   // seconds of audio scheduled ahead of the clock
let bpm = 100;

function tick(){
  requestAnimationFrame(tick);
  if (!ac) { return; }
  const now = ac.currentTime;

  /* metronome */
  if (state.metro){
    const spb = 60 / bpm;
    while (state.metroStart + state.metroNextBeat * spb < now + LOOKAHEAD){
      const t = state.metroStart + state.metroNextBeat * spb;
      if (t >= now - 0.05) click(t, state.metroNextBeat % 4 === 0);
      state.metroNextBeat++;
    }
  }

  /* playback */
  if (state.playing){
    const takeLen = Math.max(state.length, 0.4);
    while (state.nextIdx < state.events.length){
      const ev = state.events[state.nextIdx];
      const at = state.playStart + ev.t;
      if (at > now + LOOKAHEAD) break;
      trigger(ev.pad, ev.vel, at, false);
      // schedule the visual flash to land with the sound
      const delayMs = Math.max(0, (at - now) * 1000);
      state.scheduled.push(setTimeout(() => flash(ev.pad, false), delayMs));
      state.nextIdx++;
    }
    if (state.nextIdx >= state.events.length && now >= state.playStart + takeLen){
      if (state.loop){
        state.playStart = state.playStart + takeLen;
        state.nextIdx = 0;
      } else {
        stopPlayback();
      }
    }
  }

  /* clock readout */
  let t = 0;
  if (state.recording) t = now - state.recStart;
  else if (state.playing) t = Math.max(0, now - state.playStart);
  else t = state.length;
  el("clock").textContent = fmt(t);

  drawMeter();
  if (state.playing || state.recording) drawTimeline();
}

function fmt(s){
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const d = Math.floor((s * 10) % 10);
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0") + "." + d;
}

/* ---------- VU meter ---------- */
const vuEl = el("vu");
const BARS = 22;
for (let i = 0; i < BARS; i++) vuEl.appendChild(document.createElement("i"));
const vuBars = [...vuEl.children];
let freqData = null;

function drawMeter(){
  if (!analyser) return;
  if (!freqData) freqData = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);
  const per = Math.floor(freqData.length * 0.6 / BARS);
  for (let i = 0; i < BARS; i++){
    let sum = 0;
    for (let j = 0; j < per; j++) sum += freqData[i * per + j];
    const avg = sum / per / 255;
    const h = Math.max(3, Math.pow(avg, 0.75) * 30);
    const b = vuBars[i];
    b.style.height = h.toFixed(1) + "px";
    b.style.background = h > 24
      ? "linear-gradient(180deg,#ff5a3c,#a8321f)"
      : h > 15 ? "linear-gradient(180deg,#ffd166,#a8873a)"
               : "linear-gradient(180deg,#57e39b,#2b7d55)";
  }
}

/* ---------- timeline canvas ---------- */
const cv = el("tlCanvas"), ctx2 = cv.getContext("2d");
function sizeCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.floor(r.width * dpr));
  cv.height = Math.max(1, Math.floor(r.height * dpr));
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawTimeline();
}
addEventListener("resize", sizeCanvas);

function drawTimeline(){
  const r = cv.getBoundingClientRect();
  const W = r.width, H = r.height;
  if (!W || !H) return;
  ctx2.clearRect(0, 0, W, H);

  const recNow = state.recording && ac ? ac.currentTime - state.recStart : 0;
  const span = Math.max(state.length, recNow, 4);
  el("tlEmpty").style.display = (state.events.length || state.recording) ? "none" : "flex";

  // beat grid
  const spb = 60 / bpm;
  ctx2.lineWidth = 1;
  for (let b = 0; b * spb <= span; b++){
    const x = Math.round((b * spb / span) * W) + 0.5;
    ctx2.strokeStyle = b % 4 === 0 ? "rgba(216,162,74,.22)" : "rgba(255,255,255,.055)";
    ctx2.beginPath(); ctx2.moveTo(x, 0); ctx2.lineTo(x, H); ctx2.stroke();
  }

  // hits
  for (const ev of state.events){
    const x = (ev.t / span) * W;
    const p = PADS[ev.pad];
    const lane = ev.pad / (PADS.length - 1);
    const h = 6 + ev.vel * (H - 16);
    const y = 5 + lane * (H - 10 - h) * 0.55;
    ctx2.fillStyle = p.color;
    ctx2.globalAlpha = 0.5 + ev.vel * 0.5;
    ctx2.fillRect(Math.max(0, x - 1.2), y, 2.4, h);
    ctx2.globalAlpha = 1;
  }

  // playhead
  let ph = -1;
  if (state.playing && ac) ph = ((ac.currentTime - state.playStart) % Math.max(state.length, 0.4)) / span;
  else if (state.recording) ph = recNow / span;
  if (ph >= 0 && ph <= 1){
    const x = ph * W;
    ctx2.fillStyle = state.recording ? "rgba(255,90,60,.95)" : "rgba(90,215,232,.95)";
    ctx2.fillRect(x - 0.75, 0, 1.5, H);
    ctx2.fillStyle = state.recording ? "rgba(255,90,60,.14)" : "rgba(90,215,232,.12)";
    ctx2.fillRect(x - 9, 0, 18, H);
  }
}

/* ---------- knobs ---------- */
function bindRange(input, out, fn){
  const upd = () => {
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty("--p", pct + "%");
    fn(+input.value, out);
  };
  input.addEventListener("input", upd);
  upd();
}
bindRange(el("tempo"), el("tempoV"), (v, out) => {
  bpm = v; out.textContent = v + " BPM";
  if (state.metro && ac){ state.metroStart = ac.currentTime + 0.06; state.metroNextBeat = 0; }
  drawTimeline();
});
bindRange(el("vol"), el("volV"), (v, out) => {
  out.textContent = v;
  if (master) master.gain.setTargetAtTime(v / 100, ac.currentTime, 0.02);
});

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove("show"), 1900);
}

/* ---------- demo groove (helps first-run discovery) ---------- */
function loadDemo(){
  initAudio();
  const spb = 60 / bpm;
  const K = 0, S = 1, HC = 4, HO = 5, CR = 6, TL = 10;
  const seq = [];
  const push = (beat, pad, vel) => seq.push({ t: beat * spb, pad, vel });
  for (let bar = 0; bar < 2; bar++){
    const o = bar * 4;
    push(o + 0, K, 1);      push(o + 0, HC, .6);
    push(o + 0.5, HC, .45);
    push(o + 1, S, .9);     push(o + 1, HC, .5);
    push(o + 1.5, HC, .45); push(o + 1.75, K, .8);
    push(o + 2, K, .95);    push(o + 2, HC, .6);
    push(o + 2.5, HO, .5);
    push(o + 3, S, .95);    push(o + 3, HC, .5);
    push(o + 3.5, HC, .45);
    if (bar === 1){ push(o + 3.5, TL, .8); push(o + 3.75, S, .7); }
  }
  push(0, CR, .7);
  seq.sort((a, b) => a.t - b.t);
  state.events = seq;
  state.length = 8 * spb;
  el("btnPlay").disabled = false;
  el("btnClear").disabled = false;
  drawTimeline();
  toast("Demo groove loaded — press Play");
}

/* ---------- boot ---------- */
sizeCanvas();
requestAnimationFrame(tick);

// One-time gesture unlock: browsers require a user action before audio starts.
const unlock = () => {
  initAudio();
  if (ac.state === "suspended") ac.resume();
  removeEventListener("pointerdown", unlock);
  removeEventListener("keydown", unlock);
};
addEventListener("pointerdown", unlock, { passive:true });
addEventListener("keydown", unlock, { passive:true });

// Preload a groove so the app is never a blank slate.
loadDemo();
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.playing) stopPlayback();
});
})();
</script>
</body>
