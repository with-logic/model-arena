<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regex Lab — a regular expression playground</title>
<style>
/* ───────────────────────────── theme ───────────────────────────── */
:root{
  --bg:#0b0f14; --bg-deep:#070a0e;
  --chrome:#151b23; --chrome-2:#1b2330;
  --panel:#0f151c; --panel-2:#131b24;
  --line:#233040; --line-soft:#1a2431;
  --fg:#d7e2ee; --fg-dim:#8fa3b8; --fg-faint:#5f7488;
  --accent:#5ad1c4; --accent-2:#7aa2f7; --pink:#f7768e; --amber:#e0af68;
  --green:#9ece6a; --purple:#bb9af7;
  --sel:#2a3a4d;
  --shadow:0 20px 60px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.03);
  --hl-bg:rgba(90,209,196,.16); --hl-line:rgba(90,209,196,.55);
  --g1:#7aa2f7; --g2:#f7768e; --g3:#9ece6a; --g4:#e0af68; --g5:#bb9af7; --g6:#5ad1c4; --g7:#ff9e64; --g8:#73daca;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="light"]{
  --bg:#eef1f5; --bg-deep:#e3e7ed;
  --chrome:#dfe4ea; --chrome-2:#e9edf2;
  --panel:#ffffff; --panel-2:#f6f8fa;
  --line:#d3dae2; --line-soft:#e4e9ef;
  --fg:#1f2933; --fg-dim:#5a6b7c; --fg-faint:#8a9aa9;
  --accent:#0f8f80; --accent-2:#3b62c4; --pink:#c5304a; --amber:#9a6b12;
  --green:#4a7c26; --purple:#7c4dbd;
  --sel:#cfe0f5;
  --shadow:0 18px 45px -14px rgba(31,41,51,.28), 0 0 0 1px rgba(0,0,0,.05);
  --hl-bg:rgba(15,143,128,.15); --hl-line:rgba(15,143,128,.5);
  --g1:#3b62c4; --g2:#c5304a; --g3:#4a7c26; --g4:#9a6b12; --g5:#7c4dbd; --g6:#0f8f80; --g7:#b35a10; --g8:#137a6d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:
    radial-gradient(1200px 700px at 12% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    radial-gradient(1000px 600px at 92% 8%, color-mix(in srgb, var(--accent-2) 9%, transparent), transparent 60%),
    var(--bg-deep);
  color:var(--fg);
  font:14px/1.55 var(--mono);
  -webkit-font-smoothing:antialiased;
  padding:22px 18px 40px;
  transition:background-color .28s ease, color .28s ease;
}
::selection{background:var(--sel)}

/* ─────────────────────────── window shell ─────────────────────── */
.win{max-width:1220px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--panel);border:1px solid var(--line)}
.titlebar{
  display:flex;align-items:center;gap:12px;padding:0 12px;height:40px;
  background:linear-gradient(var(--chrome-2),var(--chrome));
  border-bottom:1px solid var(--line);user-select:none;
}
.lights{display:flex;gap:8px;flex:none}
.light{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.22)}
.l-r{background:#ff5f57}.l-y{background:#febc2e}.l-g{background:#28c840}
.title{flex:1;text-align:center;color:var(--fg-dim);font-size:12.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{color:var(--fg);font-weight:600}
.title .cursor{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;margin-left:4px;animation:blink 1.15s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tbtools{display:flex;gap:6px;flex:none}
.iconbtn{
  appearance:none;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%, transparent);
  color:var(--fg-dim);border-radius:7px;height:26px;padding:0 9px;font:600 11.5px/1 var(--mono);
  letter-spacing:.05em;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.16s;
}
.iconbtn:hover{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, transparent)}
.iconbtn:active{transform:translateY(1px)}
.iconbtn svg{width:13px;height:13px}

.body{padding:16px}
@media(min-width:960px){
  /* stretch, not start: the results column should fill the row height so the
     tab panel doesn't leave a dead void under short tables */
  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:stretch}
  .grid>div{display:flex;flex-direction:column}
  .grid>div>.block{flex:1;display:flex;flex-direction:column;min-height:0}
  .grid .panes{flex:1;display:flex;flex-direction:column;min-height:0}
  .grid .pane.on{flex:1;max-height:none;min-height:0}
  .stack{height:100%;min-height:230px}
  #colLeft>.block{min-height:0}
  #colLeft .pad.grow{flex:1;display:flex;flex-direction:column;min-height:0;align-items:stretch}
  #colLeft .editor{flex:1;display:flex;flex-direction:column;min-height:0;align-self:stretch}
  #colLeft .editor .stack{flex:1}
  #colLeft .editor .toolbar{flex:none}
}

/* ─────────────────────────── prompt / input ───────────────────── */
.block{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-bottom:14px}
.block>header{
  display:flex;align-items:center;gap:8px;padding:7px 11px;background:color-mix(in srgb,var(--chrome) 55%, transparent);
  border-bottom:1px solid var(--line-soft);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);
}
.block>header .sp{flex:1}
.block>header .badge{
  font-size:10.5px;letter-spacing:.06em;text-transform:none;padding:1px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--fg-dim);background:var(--panel)
}
.block>header .badge.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%, var(--line))}
.block>header .badge.err{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 45%, var(--line))}
.pad{padding:11px}

.patrow{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .18s, box-shadow .18s}
.patrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent)}
.patrow.invalid{border-color:var(--pink)}
.patrow.invalid:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 18%, transparent)}
.slash{display:flex;align-items:center;padding:0 10px;color:var(--fg-faint);font-size:17px;background:color-mix(in srgb,var(--chrome) 40%,transparent);flex:none}
#pattern{
  flex:1;min-width:0;appearance:none;border:0;background:transparent;color:var(--fg);
  font:15px/1.4 var(--mono);padding:10px 4px;outline:none;letter-spacing:.01em;
}
#pattern::placeholder{color:var(--fg-faint)}
.flagbox{display:flex;align-items:center;gap:3px;padding:5px 6px 5px 4px;flex:none;background:color-mix(in srgb,var(--chrome) 40%,transparent)}
.flag{
  width:25px;height:25px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--fg-faint);font:600 13px/1 var(--mono);cursor:pointer;transition:.14s;position:relative;
}
.flag:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,transparent)}
.flag[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}

/* error caret line */
.errbox{margin-top:9px;border-left:2px solid var(--pink);background:color-mix(in srgb,var(--pink) 9%,transparent);border-radius:0 7px 7px 0;padding:8px 10px;font-size:12.5px;color:var(--pink)}
.errbox .caret{font:13px/1.35 var(--mono);white-space:pre;color:var(--fg-dim);margin-top:5px;overflow-x:auto}
.errbox .caret i{color:var(--pink);font-style:normal;font-weight:700}
.errbox .msg{color:var(--fg);opacity:.9}

/* ─────────────────────────── inserts ──────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--fg-dim);border-radius:6px;
  padding:3px 8px;font:12px/1.5 var(--mono);cursor:pointer;transition:.14s;white-space:nowrap;
}
.chip:hover{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);transform:translateY(-1px)}
.chip:active{transform:none}
.chipgrp{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.chipgrp:last-child{margin-bottom:0}
.chipgrp .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);width:60px;flex:none;text-align:right}

/* ─────────────────────────── test text ────────────────────────── */
.editor{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.stack{position:relative;height:230px}
#backdrop,#text{
  position:absolute;inset:0;margin:0;padding:11px 13px;border:0;
  font:13.5px/1.62 var(--mono);white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
  overflow:auto;tab-size:4;
}
#backdrop{color:transparent;pointer-events:none;z-index:1}
#text{
  z-index:2;background:transparent;color:var(--fg);resize:none;outline:none;caret-color:var(--accent);
}
#text::placeholder{color:var(--fg-faint)}
mark{background:var(--hl-bg);color:inherit;border-radius:3px;box-shadow:inset 0 -1.5px 0 var(--hl-line);padding:1px 0}
mark.hot{background:color-mix(in srgb,var(--accent) 34%,transparent);box-shadow:inset 0 0 0 1px var(--hl-line)}
mark .cg{border-radius:2px;padding:1px 0}
mark .cg[data-g="1"]{background:color-mix(in srgb,var(--g1) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g1)}
mark .cg[data-g="2"]{background:color-mix(in srgb,var(--g2) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g2)}
mark .cg[data-g="3"]{background:color-mix(in srgb,var(--g3) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g3)}
mark .cg[data-g="4"]{background:color-mix(in srgb,var(--g4) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g4)}
mark .cg[data-g="5"]{background:color-mix(in srgb,var(--g5) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g5)}
mark .cg[data-g="6"]{background:color-mix(in srgb,var(--g6) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g6)}
mark .cg[data-g="7"]{background:color-mix(in srgb,var(--g7) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g7)}
mark .cg[data-g="8"]{background:color-mix(in srgb,var(--g8) 34%,transparent);box-shadow:inset 0 -1.5px 0 var(--g8)}
.empt{outline:1.5px dashed var(--hl-line);outline-offset:1px;border-radius:2px}

.toolbar{display:flex;align-items:center;gap:8px;padding:7px 9px;border-top:1px solid var(--line-soft);background:color-mix(in srgb,var(--chrome) 35%,transparent);font-size:11.5px;color:var(--fg-faint);flex-wrap:wrap}
.toolbar .sp{flex:1}
.stat{color:var(--fg-dim)}
.stat b{color:var(--accent);font-weight:600}

/* ─────────────────────────── tabs ─────────────────────────────── */
.tabs{display:flex;gap:2px;padding:6px 8px 0;background:color-mix(in srgb,var(--chrome) 45%,transparent);border-bottom:1px solid var(--line-soft)}
.tab{
  appearance:none;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--fg-faint);
  padding:6px 12px;border-radius:7px 7px 0 0;font:12px/1 var(--mono);cursor:pointer;letter-spacing:.03em;
  display:inline-flex;align-items:center;gap:6px;transition:.14s;
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--panel-2);border-color:var(--line-soft);color:var(--accent);margin-bottom:-1px;padding-bottom:7px}
.tab .n{font-size:10.5px;background:color-mix(in srgb,var(--fg) 12%,transparent);border-radius:99px;padding:0 5px;color:var(--fg-dim)}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.panes{padding:0}
.pane{display:none;max-height:430px;overflow:auto}
.pane.on{display:block}

/* ─────────────────────────── match table ──────────────────────── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 10px;color:var(--fg-faint);
  font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);z-index:2;
}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);cursor:pointer}
tbody tr.hot{background:color-mix(in srgb,var(--accent) 12%,transparent)}
td.i{color:var(--fg-faint);text-align:right;width:1%;white-space:nowrap;font-variant-numeric:tabular-nums}
td.mv{color:var(--fg);word-break:break-all}
.tok{background:color-mix(in srgb,var(--fg) 8%,transparent);border-radius:4px;padding:1px 5px;white-space:pre-wrap;word-break:break-all;display:inline-block;max-width:100%}
.groups{display:flex;flex-direction:column;gap:3px}
.grow{display:flex;align-items:baseline;gap:6px;font-size:12px}
.gname{flex:none;font-size:10.5px;padding:0 5px;border-radius:4px;color:#0b0f14;font-weight:700}
html[data-theme="light"] .gname{color:#fff}
.gname[data-g="1"]{background:var(--g1)}.gname[data-g="2"]{background:var(--g2)}
.gname[data-g="3"]{background:var(--g3)}.gname[data-g="4"]{background:var(--g4)}
.gname[data-g="5"]{background:var(--g5)}.gname[data-g="6"]{background:var(--g6)}
.gname[data-g="7"]{background:var(--g7)}.gname[data-g="8"]{background:var(--g8)}
.undef{color:var(--fg-faint);font-style:italic}

/* ─────────────────────────── explain tree ────────────────────── */
.explain{padding:10px 12px}
.ex-src{font-size:12px;color:var(--fg-dim);margin-bottom:10px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.ex-src .pat{word-break:break-all}
.ex-src .meta{display:block;margin-top:3px;color:var(--fg-faint);font-size:11.5px}
.ex-src .k{color:var(--accent)}
ul.tree{list-style:none;margin:0;padding:0}
ul.tree ul{list-style:none;margin:2px 0 2px 0;padding-left:15px;border-left:1px solid var(--line)}
li.node{padding:2.5px 0}
.nrow{display:flex;gap:8px;align-items:baseline}
.nrow:hover .code{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.code{flex:none;font-size:12.5px;background:color-mix(in srgb,var(--fg) 9%,transparent);border-radius:4px;padding:1px 6px;color:var(--accent);white-space:pre;transition:background .14s}
.code.q{color:var(--amber)}.code.g{color:var(--g1)}.code.a{color:var(--purple)}
.code.lit{color:var(--fg)}
.desc{font-size:12.5px;color:var(--fg-dim)}
.desc em{color:var(--fg);font-style:normal}
.alt-sep{font-size:11px;color:var(--amber);letter-spacing:.08em;padding:2px 0}

/* ─────────────────────────── empty / misc ────────────────────── */
.empty{padding:26px 14px;text-align:center;color:var(--fg-faint);font-size:12.5px}
.empty svg{width:26px;height:26px;opacity:.4;display:block;margin:0 auto 8px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--chrome-2);border:1px solid var(--accent);color:var(--fg);padding:9px 16px;border-radius:8px;
  font-size:12.5px;box-shadow:0 12px 34px -8px rgba(0,0,0,.6);transition:.22s cubic-bezier(.2,.8,.2,1);z-index:99;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{font-size:11.5px;color:var(--fg-faint);margin-top:8px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:11px/1.5 var(--mono);color:var(--fg-dim);background:var(--panel)}
.foot{max-width:1220px;margin:14px auto 0;color:var(--fg-faint);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.foot span{white-space:nowrap}
select.mini{
  appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--fg-dim);border-radius:6px;
  padding:3px 22px 3px 7px;font:11.5px/1.4 var(--mono);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg-faint) 50%),linear-gradient(135deg,var(--fg-faint) 50%,transparent 50%);
  background-position:calc(100% - 12px) 51%, calc(100% - 8px) 51%;background-size:4px 4px;background-repeat:no-repeat;
}
select.mini:hover{color:var(--fg);border-color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg-faint);background-clip:content-box}
@media(max-width:600px){
  body{padding:10px 8px 28px}
  .chipgrp .lbl{display:none}
  .title{font-size:11px}
}
</style>
</head>
<body>

<div class="win">
  <div class="titlebar">
    <div class="lights"><i class="light l-r"></i><i class="light l-y"></i><i class="light l-g"></i></div>
    <div class="title">~/regex&#8209;lab — <b>regex</b> --test --explain<span class="cursor"></span></div>
    <div class="tbtools">
      <button class="iconbtn" id="btnShare" title="Copy a permalink with pattern, flags and text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.8 1.8"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.8-1.8"/></svg>
        SHARE
      </button>
      <button class="iconbtn" id="btnClear" title="Clear pattern and text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        CLEAR
      </button>
      <button class="iconbtn" id="btnTheme" title="Toggle light / dark (Ctrl+J)"><span id="themeIcon">☾</span> <span id="themeTxt">DARK</span></button>
    </div>
  </div>

  <div class="body">
    <div class="block">
      <header>
        <span>expression</span><span class="sp"></span>
        <span class="badge" id="statusBadge">idle</span>
      </header>
      <div class="pad">
        <div class="patrow" id="patrow">
          <span class="slash">/</span>
          <input id="pattern" spellcheck="false" autocomplete="off" autocapitalize="off"
                 placeholder="(\w+)@(\w+)\.(com|org)" aria-label="Regular expression pattern">
          <span class="slash">/</span>
          <div class="flagbox" id="flags" role="group" aria-label="Flags"></div>
        </div>
        <div id="errSlot" aria-live="polite"></div>
        <div class="hint">
          <kbd>Ctrl</kbd>+<kbd>Enter</kbd> re-run · <kbd>Ctrl</kbd>+<kbd>J</kbd> theme · click a token below to insert at the caret
        </div>
      </div>
    </div>

    <div class="block">
      <header><span>quick inserts</span><span class="sp"></span>
        <select class="mini" id="samples" title="Load a worked example">
          <option value="">▸ load example…</option>
        </select>
      </header>
      <div class="pad" id="chipHost"></div>
    </div>

    <div class="grid">
      <div id="colLeft">
        <div class="block" style="margin-bottom:0">
          <header><span>test subject</span><span class="sp"></span><span class="badge" id="hlBadge">—</span></header>
          <div class="pad grow" style="padding-bottom:0">
            <div class="editor">
              <div class="stack">
                <div id="backdrop" aria-hidden="true"></div>
                <textarea id="text" spellcheck="false" placeholder="Paste or type the text you want to match against…"></textarea>
              </div>
              <div class="toolbar">
                <span class="stat" id="stats">no matches</span>
                <span class="sp"></span>
                <span id="cursorPos">ln 1, col 1</span>
              </div>
            </div>
          </div>
          <div class="pad" style="padding-top:11px">
            <div class="chips">
              <button class="chip" data-copy="matches">⧉ copy matches</button>
              <button class="chip" data-copy="json">⧉ copy JSON</button>
              <button class="chip" data-copy="regex">⧉ copy /regex/flags</button>
              <button class="chip" id="btnReplace">⇄ replace preview</button>
            </div>
            <div id="replaceHost" style="display:none;margin-top:9px">
              <div class="patrow" style="border-radius:8px">
                <span class="slash" style="font-size:12px;letter-spacing:.06em">→</span>
                <input id="replacement" spellcheck="false" autocomplete="off" placeholder="$1 · $&amp; · $&lt;name&gt;" aria-label="Replacement string">
              </div>
              <div class="editor" style="margin-top:8px">
                <div id="replaceOut" style="padding:10px 12px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;color:var(--fg-dim)"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="block" style="margin-bottom:0">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="tbl" aria-selected="true">matches <span class="n" id="cntTbl">0</span></button>
            <button class="tab" role="tab" data-tab="exp" aria-selected="false">explain <span class="n" id="cntExp">0</span></button>
            <button class="tab" role="tab" data-tab="grp" aria-selected="false">groups <span class="n" id="cntGrp">0</span></button>
          </div>
          <div class="panes">
            <div class="pane on" id="pane-tbl" role="tabpanel"></div>
            <div class="pane" id="pane-exp" role="tabpanel"></div>
            <div class="pane" id="pane-grp" role="tabpanel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="foot">
  <span>JavaScript <code>RegExp</code> semantics</span><span>·</span>
  <span>state lives in the URL hash</span><span>·</span>
  <span id="footFlags">/</span>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   Regex Lab — single file, no deps.
   Three moving parts: (1) a real regex parser used for the explainer,
   (2) a match engine with loop-guards for zero-length/global cases,
   (3) a highlight renderer that paints capture groups inside matches.
   ══════════════════════════════════════════════════════════════════ */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ─────────────────────────────────────────────────────────────────
   1. FLAGS
   ───────────────────────────────────────────────────────────────── */
const FLAGS = [
  ["g", "global — find every match, not just the first"],
  ["i", "ignore case"],
  ["m", "multiline — ^ and $ match at line breaks"],
  ["s", "dotAll — . also matches newlines"],
  ["u", "unicode — \\u{...} escapes and code-point semantics"],
  ["y", "sticky — match only at lastIndex"],
];

const state = {
  pattern: "",
  flags: new Set(["g", "m"]),
  text: "",
  replacement: "",
  showReplace: false,
  tab: "tbl",
};

/* ─────────────────────────────────────────────────────────────────
   2. REGEX PARSER  (for the explanation pane)
   A small recursive-descent parser over the pattern source. It is
   deliberately tolerant: anything it cannot classify becomes a
   literal, so the explainer never throws even mid-typing.
   ───────────────────────────────────────────────────────────────── */
const CLASS_DESC = {
  d: "any digit, 0–9",
  D: "any character that is not a digit",
  w: "any word character (a–z, A–Z, 0–9, _)",
  W: "any character that is not a word character",
  s: "any whitespace (space, tab, newline, …)",
  S: "any character that is not whitespace",
  b: "a word boundary — the edge between a word char and a non-word char",
  B: "a position that is not a word boundary",
};
const ESC_DESC = {
  n: "a newline (LF)", r: "a carriage return (CR)", t: "a tab",
  f: "a form feed", v: "a vertical tab", 0: "a NUL character",
};

function parseRegex(src) {
  let i = 0;
  let groupNo = 0;
  const warnings = [];
  // Structural defects with their source offsets, so the error caret can point
  // at the innermost unclosed construct rather than the outermost one.
  const defects = [];
  const defect = (at, text) => { defects.push({ at, text }); warnings.push(text); };

  const peek = (k = 0) => src[i + k];
  const eof = () => i >= src.length;

  function parseAlternation() {
    const branches = [parseSequence()];
    while (peek() === "|") { i++; branches.push(parseSequence()); }
    if (branches.length === 1) return branches[0];
    return [{ type: "alt", branches, raw: "|" }];
  }

  function parseSequence() {
    const out = [];
    while (!eof() && peek() !== "|" && peek() !== ")") {
      const atom = parseAtom();
      if (!atom) break;
      const q = parseQuantifier();
      if (q) { q.child = atom; out.push(q); } else out.push(atom);
    }
    return out;
  }

  function parseQuantifier() {
    const start = i;
    let min, max, kind = null;
    const c = peek();
    if (c === "*") { min = 0; max = Infinity; i++; kind = "*"; }
    else if (c === "+") { min = 1; max = Infinity; i++; kind = "+"; }
    else if (c === "?") { min = 0; max = 1; i++; kind = "?"; }
    else if (c === "{") {
      const m = /^\{(\d+)(,(\d*))?\}/.exec(src.slice(i));
      if (!m) return null;
      min = +m[1];
      max = m[2] === undefined ? min : (m[3] === "" ? Infinity : +m[3]);
      i += m[0].length; kind = "{}";
    } else return null;

    let mode = "greedy";
    if (peek() === "?") { i++; mode = "lazy"; }
    else if (peek() === "+") { i++; mode = "possessive"; }
    return { type: "quant", min, max, kind, mode, raw: src.slice(start, i) };
  }

  function parseAtom() {
    const start = i;
    const c = peek();

    if (c === "(") return parseGroup();
    if (c === "[") return parseCharClass();
    if (c === "^") { i++; return { type: "anchor", raw: "^", desc: "the start of the string (or of a line, with the m flag)" }; }
    if (c === "$") { i++; return { type: "anchor", raw: "$", desc: "the end of the string (or of a line, with the m flag)" }; }
    if (c === ".") { i++; return { type: "dot", raw: ".", desc: "any character except a line break (any character at all, with the s flag)" }; }
    if (c === "\\") return parseEscape();

    // A run of plain literal characters, stopped before a quantifiable tail.
    let lit = "";
    while (!eof() && !"()[]^$.\\|*+?{".includes(peek())) lit += src[i++];
    if (lit === "") { i++; return { type: "literal", raw: c, value: c }; }
    // A trailing quantifier binds to only the final character.
    if (lit.length > 1 && !eof() && "*+?{".includes(peek())) { i--; lit = lit.slice(0, -1); }
    return { type: "literal", raw: lit, value: lit, start };
  }

  function parseGroup() {
    const start = i;
    i++; // (
    let kind = "capture", name = null, num = null, flagsMod = null;
    if (peek() === "?") {
      const c1 = peek(1);
      if (c1 === ":") { kind = "noncapture"; i += 2; }
      else if (c1 === "=") { kind = "lookahead"; i += 2; }
      else if (c1 === "!") { kind = "neglookahead"; i += 2; }
      else if (c1 === "<" && peek(2) === "=") { kind = "lookbehind"; i += 3; }
      else if (c1 === "<" && peek(2) === "!") { kind = "neglookbehind"; i += 3; }
      else if (c1 === "<") {
        const m = /^\(\?<([^>]*)>/.exec(src.slice(i - 1));
        if (m) { kind = "named"; name = m[1]; i = start + m[0].length; num = ++groupNo; }
        else { kind = "noncapture"; i += 2; }
      } else { // (?flags:  or unknown
        const m = /^\(\?([a-z]*)(-[a-z]+)?:/.exec(src.slice(i - 1));
        if (m) { kind = "modifier"; flagsMod = m[1] + (m[2] || ""); i = start + m[0].length; }
        else { kind = "noncapture"; i += 2; }
      }
    } else { num = ++groupNo; }

    const body = parseAlternation();
    let closed = false;
    if (peek() === ")") { i++; closed = true; }
    else defect(start, "unclosed group starting at position " + start);

    return { type: "group", kind, name, num, flagsMod, body, closed, raw: src.slice(start, i) };
  }

  function parseCharClass() {
    const start = i;
    i++; // [
    let negated = false;
    if (peek() === "^") { negated = true; i++; }
    const items = [];
    let guard = 0;
    while (!eof() && peek() !== "]" && guard++ < 5000) {
      let lo;
      if (peek() === "\\") {
        const e = readClassEscape();
        if (e.set) { items.push(e); continue; }
        lo = e;
      } else lo = { type: "ch", value: src[i], raw: src[i++] };

      if (peek() === "-" && peek(1) !== "]" && i + 1 < src.length) {
        i++; // -
        let hi;
        if (peek() === "\\") {
          const e = readClassEscape();
          if (e.set) { items.push(lo, { type: "ch", value: "-", raw: "-" }, e); continue; }
          hi = e;
        } else hi = { type: "ch", value: src[i], raw: src[i++] };
        items.push({ type: "range", from: lo, to: hi, raw: lo.raw + "-" + hi.raw });
      } else items.push(lo);
    }
    let closed = false;
    if (peek() === "]") { i++; closed = true; }
    else defect(start, "unterminated character class starting at position " + start);
    return { type: "class", negated, items, closed, raw: src.slice(start, i) };
  }

  function readClassEscape() {
    const start = i;
    i++; // backslash
    const c = src[i];
    if (c === undefined) return { type: "ch", value: "\\", raw: "\\" };
    i++;
    if ("dDwWsS".includes(c)) return { set: true, type: "shorthand", cls: c, raw: "\\" + c, desc: CLASS_DESC[c] };
    if (c === "b") return { type: "ch", value: "\b", raw: "\\b", label: "a backspace" };
    if (ESC_DESC[c]) return { type: "ch", value: c, raw: "\\" + c, label: ESC_DESC[c] };
    if (c === "x") { const m = /^[0-9a-fA-F]{2}/.exec(src.slice(i)); if (m) { i += 2; return { type: "ch", raw: "\\x" + m[0], label: "U+00" + m[0].toUpperCase(), value: String.fromCharCode(parseInt(m[0], 16)) }; } }
    if (c === "u") { const m = /^\{([0-9a-fA-F]+)\}|^[0-9a-fA-F]{4}/.exec(src.slice(i)); if (m) { i += m[0].length; return { type: "ch", raw: "\\u" + m[0], label: "U+" + (m[1] || m[0]).toUpperCase(), value: "" }; } }
    return { type: "ch", value: c, raw: src.slice(start, i) };
  }

  function parseEscape() {
    const start = i;
    i++;
    const c = src[i];
    if (c === undefined) { defect(start, "pattern ends with a lone backslash"); return { type: "literal", raw: "\\", value: "\\" }; }
    i++;
    if ("dDwWsS".includes(c)) return { type: "shorthand", cls: c, raw: "\\" + c, desc: CLASS_DESC[c] };
    if (c === "b" || c === "B") return { type: "boundary", raw: "\\" + c, desc: CLASS_DESC[c] };
    if (ESC_DESC[c]) return { type: "escape", raw: "\\" + c, desc: ESC_DESC[c] };
    if (/[1-9]/.test(c)) {
      const m = /^\d+/.exec(src.slice(i - 1));
      i = start + 1 + m[0].length;
      return { type: "backref", num: +m[0], raw: "\\" + m[0] };
    }
    if (c === "k" && src[i] === "<") {
      const m = /^<([^>]*)>/.exec(src.slice(i));
      if (m) { i += m[0].length; return { type: "backref", name: m[1], raw: "\\k" + m[0] }; }
    }
    if (c === "x") { const m = /^[0-9a-fA-F]{2}/.exec(src.slice(i)); if (m) { i += 2; return { type: "escape", raw: "\\x" + m[0], desc: "the character U+00" + m[0].toUpperCase() }; } }
    if (c === "u") {
      const m = /^\{([0-9a-fA-F]+)\}|^[0-9a-fA-F]{4}/.exec(src.slice(i));
      if (m) { i += m[0].length; return { type: "escape", raw: "\\u" + m[0], desc: "the character U+" + (m[1] || m[0]).toUpperCase() + (m[1] ? " (requires the u flag)" : "") }; }
    }
    if ((c === "p" || c === "P") && src[i] === "{") {
      const m = /^\{([^}]*)\}/.exec(src.slice(i));
      if (m) { i += m[0].length; return { type: "uniprop", raw: "\\" + c + m[0], neg: c === "P", prop: m[1] }; }
    }
    return { type: "escaped-literal", raw: "\\" + c, value: c };
  }

  const nodes = parseAlternation();
  if (!eof()) defect(i, "unexpected `" + src[i] + "` at position " + i + " — likely an unmatched `)`");
  return { nodes, groupCount: groupNo, warnings, defects };
}

/* ── prose helpers ───────────────────────────────────────────── */
function quantPhrase(q) {
  const { min, max, mode } = q;
  let core;
  if (min === 0 && max === Infinity) core = "zero or more times";
  else if (min === 1 && max === Infinity) core = "one or more times";
  else if (min === 0 && max === 1) core = "optionally (zero or one time)";
  else if (max === Infinity) core = `at least ${min} time${min === 1 ? "" : "s"}`;
  else if (min === max) core = `exactly ${min} time${min === 1 ? "" : "s"}`;
  else core = `between ${min} and ${max} times`;
  const tail = mode === "lazy" ? ", as few as possible (lazy)"
    : mode === "possessive" ? ", without giving anything back (possessive)"
      : (max === Infinity || max > min) ? ", as many as possible (greedy)" : "";
  return "repeated " + core + tail;
}

function charLabel(it) {
  if (it.label) return it.label;
  const v = it.value;
  if (v === " ") return "a space";
  return "<em>" + esc(it.raw || v) + "</em>";
}

function classPhrase(node) {
  const parts = node.items.map(it => {
    if (it.type === "range") return `${charLabel(it.from)}–${charLabel(it.to)}`;
    if (it.type === "shorthand") return it.desc;
    return charLabel(it);
  });
  if (!parts.length) return node.negated ? "any character (empty negated class)" : "an empty character class — matches nothing";
  const list = parts.length === 1 ? parts[0]
    : parts.slice(0, -1).join(", ") + " or " + parts[parts.length - 1];
  return (node.negated ? "any single character except " : "any single character in the set: ") + list;
}

const GROUP_LABEL = {
  capture: n => `capturing group ${n.num} — the matched text is saved and available as $${n.num}`,
  named: n => `named capturing group <${n.name}> (group ${n.num}) — available as $<${n.name}>`,
  noncapture: () => "a non-capturing group — groups the pattern without saving the text",
  lookahead: () => "positive lookahead — the following must match here, but is not consumed",
  neglookahead: () => "negative lookahead — the following must NOT match here",
  lookbehind: () => "positive lookbehind — the preceding text must match this, but is not consumed",
  neglookbehind: () => "negative lookbehind — the preceding text must NOT match this",
  modifier: n => `a group with modified flags (${n.flagsMod})`,
};

/* ── render the parse tree as an explanation ─────────────────── */
function renderNodes(nodes, depth = 0) {
  if (!nodes.length) return "";
  let html = '<ul class="tree">';
  for (const n of nodes) html += renderNode(n, depth);
  return html + "</ul>";
}

function row(code, cls, desc, kids = "") {
  return `<li class="node"><div class="nrow"><span class="code ${cls}">${esc(code)}</span><span class="desc">${desc}</span></div>${kids}</li>`;
}

function renderNode(n, depth) {
  switch (n.type) {
    case "quant": {
      const inner = renderNode(n.child, depth + 1);
      return `<li class="node"><div class="nrow"><span class="code q">${esc(n.raw)}</span><span class="desc">the preceding item is <em>${quantPhrase(n)}</em></span></div><ul class="tree">${inner}</ul></li>`;
    }
    case "alt": {
      const kids = n.branches.map((b, k) =>
        `<li class="node"><div class="alt-sep">${k === 0 ? "▸ option 1" : "▸ or option " + (k + 1)}</div>${b.length ? renderNodes(b, depth + 1) : '<div class="desc" style="padding-left:2px">an empty alternative — matches nothing at all</div>'}</li>`
      ).join("");
      return `<li class="node"><div class="nrow"><span class="code q">|</span><span class="desc">alternation — match <em>any one</em> of these ${n.branches.length} options (first one that works wins)</span></div><ul class="tree">${kids}</ul></li>`;
    }
    case "group": {
      const label = (GROUP_LABEL[n.kind] || (() => "a group"))(n);
      const kids = n.body.length ? renderNodes(n.body, depth + 1) : '<li class="node"><div class="desc">(empty)</div></li>';
      const warn = n.closed ? "" : ' <em style="color:var(--pink)">— never closed</em>';
      return `<li class="node"><div class="nrow"><span class="code g">${esc(n.raw.length > 26 ? n.raw.slice(0, 24) + "…" : n.raw)}</span><span class="desc">${label}${warn}</span></div><ul class="tree">${kids}</ul></li>`;
    }
    case "class":
      return row(n.raw, "a", classPhrase(n) + (n.closed ? "" : ' <em style="color:var(--pink)">— never closed</em>'));
    case "shorthand": return row(n.raw, "a", n.desc);
    case "boundary": return row(n.raw, "a", n.desc);
    case "anchor": return row(n.raw, "a", "matches at <em>" + n.desc + "</em> — it consumes no characters");
    case "dot": return row(n.raw, "a", n.desc);
    case "escape": return row(n.raw, "lit", n.desc);
    case "escaped-literal": return row(n.raw, "lit", `a literal <em>${esc(n.value)}</em> — the backslash removes any special meaning`);
    case "backref":
      return row(n.raw, "a", n.name
        ? `a back-reference to the group named <em>${esc(n.name)}</em> — matches the same text that group captured`
        : `a back-reference to group <em>${n.num}</em> — matches the same text that group captured`);
    case "uniprop":
      return row(n.raw, "a", `${n.neg ? "any character NOT having" : "any character having"} the Unicode property <em>${esc(n.prop)}</em> (requires the u flag)`);
    case "literal": {
      const pretty = n.value.length === 1 ? `the character <em>${esc(n.value === " " ? "␠ (a space)" : n.value)}</em>`
        : `the literal text <em>${esc(n.value)}</em>`;
      return row(n.raw, "lit", pretty + (n.value.length > 1 ? ", exactly as written" : ""));
    }
    default: return row(n.raw || "?", "lit", "a literal character");
  }
}

function countTreeNodes(nodes) {
  let c = 0;
  const walk = a => a.forEach(n => {
    c++;
    if (n.type === "quant") walk([n.child]);
    if (n.type === "group") walk(n.body);
    if (n.type === "alt") n.branches.forEach(walk);
  });
  walk(nodes);
  return c;
}

/* ─────────────────────────────────────────────────────────────────
   3. MATCH ENGINE
   ───────────────────────────────────────────────────────────────── */
const MAX_MATCHES = 2000;

function runMatch(pattern, flagStr, text) {
  const res = { ok: false, error: null, matches: [], truncated: false, re: null, names: [] };
  if (pattern === "") return { ...res, ok: true, empty: true };
  let re;
  try { re = new RegExp(pattern, flagStr); }
  catch (e) { res.error = describeSyntaxError(e, pattern); return res; }
  res.ok = true; res.re = re;

  // Discover named groups from the source so the table can label columns.
  res.names = [...pattern.matchAll(/\(\?<([A-Za-z_$][\w$]*)>/g)].map(m => m[1]);

  if (!text) return res;
  const global = flagStr.includes("g") || flagStr.includes("y");
  try {
    if (!global) {
      const m = re.exec(text);
      if (m) res.matches.push(pack(m));
    } else {
      re.lastIndex = 0;
      let m, guard = 0;
      while ((m = re.exec(text)) !== null) {
        res.matches.push(pack(m));
        if (m[0] === "") re.lastIndex++;              // zero-length guard
        if (res.matches.length >= MAX_MATCHES) { res.truncated = true; break; }
        if (++guard > 1e6) break;
        if (re.lastIndex > text.length) break;
      }
    }
  } catch (e) { res.error = { message: e.message, index: null }; }
  return res;

  function pack(m) {
    const groups = [];
    for (let g = 1; g < m.length; g++) {
      const val = m[g];
      let at = -1;
      if (val !== undefined && m.indices && m.indices[g]) at = m.indices[g][0];
      groups.push({ n: g, value: val, at });
    }
    return { index: m.index, value: m[0], groups, named: m.groups ? { ...m.groups } : null, input: m.input };
  }
}

/* Turn a native SyntaxError into { message, index } so we can draw a caret. */
function describeSyntaxError(e, pattern) {
  const raw = String(e.message);
  let msg = raw.replace(/^Invalid regular expression:?\s*/i, "").replace(/^\/.*?\/[a-z]*:\s*/, "").trim();
  let index = null;

  // V8/JSC sometimes report a position outright.
  const pos = /(?:at (?:offset|position|index) |^)(\d+)\b/.exec(msg);
  if (pos && +pos[1] <= pattern.length) index = +pos[1];

  // Otherwise ask our own parser. It tracks the offset of every unclosed
  // construct, and the *innermost* one (largest offset) is what the user
  // actually needs to fix: for `(\d{4}[a-z` the useful caret is the `[`
  // at 6, not the `(` at 0 that prefix-probing would report.
  if (index === null) {
    try {
      const d = parseRegex(pattern).defects;
      if (d.length) index = d.reduce((a, b) => (b.at > a.at ? b : a)).at;
    } catch { /* parser is best-effort; fall through to probing */ }
  }
  if (index === null) index = probeFailIndex(pattern);
  if (!msg) msg = "invalid regular expression";
  return { message: msg, index, raw };
}

/* Grow the pattern one char at a time; the first prefix that also fails
   *and* whose failure persists marks the earliest offending position. */
function probeFailIndex(pattern) {
  for (let k = 1; k <= pattern.length; k++) {
    const head = pattern.slice(0, k);
    // A trailing lone backslash is an artefact of slicing, not the real error.
    if (/(^|[^\\])(\\\\)*\\$/.test(head)) continue;
    try { new RegExp(head); }
    catch { return k - 1; }
  }
  return Math.max(0, pattern.length - 1);
}

/* ─────────────────────────────────────────────────────────────────
   4. HIGHLIGHT RENDERER
   Paint every match; inside each match, paint capture groups using
   their reported indices when available, otherwise by locating each
   captured substring left-to-right inside the match.
   ───────────────────────────────────────────────────────────────── */
function buildBackdrop(text, matches, hotIndex) {
  if (!matches.length) return esc(text) + "\n";
  let out = "", cur = 0;
  matches.forEach((m, mi) => {
    if (m.index < cur) return;                        // overlapping safety
    out += esc(text.slice(cur, m.index));
    const cls = "mark" + (mi === hotIndex ? " hot" : "");
    const inner = m.value === ""
      ? '<span class="empt"></span>'
      : paintGroups(m);
    out += `<mark class="${mi === hotIndex ? "hot" : ""}" data-mi="${mi}">${inner}</mark>`;
    cur = m.index + m.value.length;
  });
  out += esc(text.slice(cur));
  return out + "\n";
}

function paintGroups(m) {
  const base = m.index, whole = m.value;
  const spans = [];
  let scan = 0;
  for (const g of m.groups) {
    if (g.value === undefined || g.value === "") continue;
    let s;
    if (g.at >= 0) s = g.at - base;
    else { const f = whole.indexOf(g.value, scan); if (f < 0) continue; s = f; }
    if (s < 0 || s + g.value.length > whole.length) continue;
    spans.push({ s, e: s + g.value.length, n: g.n });
    scan = s;
  }
  if (!spans.length) return esc(whole);

  // Keep only the outermost non-overlapping spans so nesting stays legible.
  spans.sort((a, b) => a.s - b.s || b.e - a.e);
  const keep = [];
  let lastEnd = -1;
  for (const sp of spans) { if (sp.s >= lastEnd) { keep.push(sp); lastEnd = sp.e; } }

  let html = "", cur = 0;
  for (const sp of keep) {
    html += esc(whole.slice(cur, sp.s));
    html += `<span class="cg" data-g="${((sp.n - 1) % 8) + 1}">${esc(whole.slice(sp.s, sp.e))}</span>`;
    cur = sp.e;
  }
  return html + esc(whole.slice(cur));
}

/* ─────────────────────────────────────────────────────────────────
   5. TOKEN PALETTE
   ───────────────────────────────────────────────────────────────── */
const TOKENS = [
  ["classes", [
    ["\\d", "digit"], ["\\w", "word char"], ["\\s", "whitespace"],
    ["\\D", "non-digit"], ["\\W", "non-word"], ["\\S", "non-space"],
    [".", "any char"], ["[A-Z]", "range A–Z"], ["[a-z0-9_]", "custom set"], ["[^…]", "negated set", "[^]", 2],
  ]],
  ["quantify", [

  ["anchors", [

    ["\\b", "word boundary"], ["\\B", "not a boundary"],

  ["groups", [

  ["look", [

const SAMPLES = [
  { name: "Email addresses", p: "([\\w.+-]+)@([\\w-]+)\\.([a-z]{2,8})", f: "gi",

/* ─────────────────────────────────────────────────────────────────
   6. URL HASH (permalink)
   ───────────────────────────────────────────────────────────────── */
const b64 = {
  enc(s) { return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
  dec(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(s + "===".slice((s.length + 3) % 4));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }
};

let hashLock = false;
function writeHash() {
  const parts = [];
  if (state.pattern) parts.push("p=" + encodeURIComponent(state.pattern));
  parts.push("f=" + [...state.flags].join(""));
  if (state.text) parts.push("t=" + b64.enc(state.text));
  if (state.replacement) parts.push("r=" + encodeURIComponent(state.replacement));
  parts.push("th=" + document.documentElement.dataset.theme);
  hashLock = true;
  history.replaceState(null, "", "#" + parts.join("&"));
  setTimeout(() => { hashLock = false; }, 0);
}
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return false;
  const q = new Map(h.split("&").map(kv => { const k = kv.indexOf("="); return k < 0 ? [kv, ""] : [kv.slice(0, k), kv.slice(k + 1)]; }));
  try {
    if (q.has("p")) state.pattern = decodeURIComponent(q.get("p"));
    if (q.has("f")) state.flags = new Set([...q.get("f")].filter(c => FLAGS.some(f => f[0] === c)));
    if (q.has("t")) state.text = b64.dec(q.get("t"));
    if (q.has("r")) { state.replacement = decodeURIComponent(q.get("r")); state.showReplace = !!state.replacement; }
    if (q.get("th") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) { /* a malformed hash should never break the app */ }
  return true;
}

/* ─────────────────────────────────────────────────────────────────
   7. BOOT + UI WIRING
   ───────────────────────────────────────────────────────────────── */
const el = {
  pattern: $("#pattern"), text: $("#text"), backdrop: $("#backdrop"),
  patrow: $("#patrow"), errSlot: $("#errSlot"), flags: $("#flags"),
  status: $("#statusBadge"), hlBadge: $("#hlBadge"), stats: $("#stats"),
  cursorPos: $("#cursorPos"), chipHost: $("#chipHost"), samples: $("#samples"),
  toast: $("#toast"), footFlags: $("#footFlags"),
  paneTbl: $("#pane-tbl"), paneExp: $("#pane-exp"), paneGrp: $("#pane-grp"),
  cntTbl: $("#cntTbl"), cntExp: $("#cntExp"), cntGrp: $("#cntGrp"),
  replaceHost: $("#replaceHost"), replacement: $("#replacement"), replaceOut: $("#replaceOut"),
};

/* flags */
FLAGS.forEach(([f, title]) => {
  const b = document.createElement("button");
  b.className = "flag"; b.textContent = f; b.title = f + " — " + title;
  b.setAttribute("aria-pressed", "false"); b.dataset.flag = f;
  b.addEventListener("click", () => {
    state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f);
    syncFlags(); render(); writeHash();
  });
  el.flags.appendChild(b);
});
function syncFlags() {
  $$(".flag", el.flags).forEach(b => b.setAttribute("aria-pressed", String(state.flags.has(b.dataset.flag))));
  el.footFlags.textContent = "/" + (state.pattern || "…") + "/" + flagStr();
}
const FLAG_ORDER = "gimsuy";
const flagStr = () => [...FLAGS.map(f => f[0])].filter(f => state.flags.has(f)).join("");

/* token chips */
TOKENS.forEach(([label, items]) => {
  const row = document.createElement("div");
  row.className = "chipgrp";
  row.innerHTML = `<span class="lbl">${label}</span>`;
  const wrap = document.createElement("div");
  wrap.className = "chips";
  items.forEach(([shown, tip, insert, caret, selLen]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = shown; b.title = tip;
    b.addEventListener("click", () => insertToken(insert ?? shown, caret, selLen));
    wrap.appendChild(b);
  });
  row.appendChild(wrap);
  el.chipHost.appendChild(row);
});

function insertToken(str, caretBack, selLen) {
  const inp = el.pattern;
  inp.focus();
  const s = inp.selectionStart ?? inp.value.length;
  const e = inp.selectionEnd ?? s;
  const selected = inp.value.slice(s, e);
  let text = str, caret = null, selEnd = null;

  // Wrap the current selection when the token has an obvious hole.
  if (selected && caretBack != null) {
    text = str.slice(0, caretBack) + selected + str.slice(caretBack);
    caret = s + caretBack + selected.length;
  } else if (caretBack != null) {
    caret = s + caretBack;
    if (selLen) { caret = s + caretBack; selEnd = caret + selLen; }
  }
  inp.value = inp.value.slice(0, s) + text + inp.value.slice(e);
  const pos = caret ?? s + text.length;
  inp.setSelectionRange(pos, selEnd ?? pos);
  // Nudge the input's scroll so a caret past the right edge stays visible.
  inp.blur(); inp.focus(); inp.setSelectionRange(pos, selEnd ?? pos);
  state.pattern = inp.value;
  render(); writeHash();
}

/* samples */
SAMPLES.forEach((s, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = s.name;
  el.samples.appendChild(o);
});
el.samples.addEventListener("change", () => {
  const s = SAMPLES[+el.samples.value];
  if (!s) return;
  state.pattern = s.p; state.text = s.t;
  state.flags = new Set([...s.f]);
  el.pattern.value = s.p; el.text.value = s.t;
  el.samples.value = "";
  syncFlags(); render(); writeHash();
  toast("loaded “" + s.name + "”");
});

/* inputs */
el.pattern.addEventListener("input", () => { state.pattern = el.pattern.value; render(); debounceHash(); });
el.text.addEventListener("input", () => { state.text = el.text.value; render(); debounceHash(); });
el.text.addEventListener("scroll", syncScroll);
el.text.addEventListener("keyup", updateCursor);
el.text.addEventListener("click", updateCursor);
el.replacement.addEventListener("input", () => { state.replacement = el.replacement.value; renderReplace(lastResult); debounceHash(); });

let hashTimer;
function debounceHash() { clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 260); }

function syncScroll() { el.backdrop.scrollTop = el.text.scrollTop; el.backdrop.scrollLeft = el.text.scrollLeft; }
function updateCursor() {
  const upto = el.text.value.slice(0, el.text.selectionStart);
  const lines = upto.split("\n");
  el.cursorPos.textContent = `ln ${lines.length}, col ${lines[lines.length - 1].length + 1}`;
}

/* tabs */
$$(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
function setTab(id) {
  state.tab = id;
  $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
  $$(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + id));
}

/* buttons */
$("#btnClear").addEventListener("click", () => {
  state.pattern = ""; state.text = ""; state.replacement = "";
  el.pattern.value = ""; el.text.value = ""; el.replacement.value = "";
  render(); writeHash(); el.pattern.focus(); toast("cleared");
});
$("#btnShare").addEventListener("click", async () => {
  writeHash();
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast("permalink copied to clipboard"); }
  catch { legacyCopy(url); }
});
$("#btnTheme").addEventListener("click", toggleTheme);
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  $("#themeIcon").textContent = next === "dark" ? "☾" : "☀";
  $("#themeTxt").textContent = next.toUpperCase();
  writeHash();
}
$("#btnReplace").addEventListener("click", () => {
  state.showReplace = !state.showReplace;
  el.replaceHost.style.display = state.showReplace ? "block" : "none";
  if (state.showReplace) { el.replacement.focus(); renderReplace(lastResult); }
});

$$("[data-copy]").forEach(b => b.addEventListener("click", () => {
  const kind = b.dataset.copy;
  let out = "";
  if (kind === "regex") out = "/" + state.pattern + "/" + flagStr();
  else if (kind === "matches") out = lastResult.matches.map(m => m.value).join("\n");
  else out = JSON.stringify(lastResult.matches.map(m => ({
    index: m.index, match: m.value,
    groups: m.groups.map(g => g.value),
    named: m.named || undefined,
  })), null, 2);
  if (!out) return toast("nothing to copy yet");
  navigator.clipboard?.writeText(out).then(() => toast(kind + " copied")).catch(() => legacyCopy(out));
}));

function legacyCopy(s) {
  const ta = document.createElement("textarea");
  ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("copied"); } catch { toast("copy failed — select manually"); }
  ta.remove();
}

let toastTimer;
function toast(msg) {
  el.toast.textContent = msg; el.toast.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove("on"), 1900);
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); render(); toast("re-ran"); }
  if ((e.ctrlKey || e.metaKey) && (e.key === "j" || e.key === "J")) { e.preventDefault(); toggleTheme(); }
});
window.addEventListener("hashchange", () => {
  if (hashLock) return;
  readHash(); syncAll();
});

/* ─────────────────────────────────────────────────────────────────
   8. RENDER
   ───────────────────────────────────────────────────────────────── */
let lastResult = { matches: [], ok: true };
let hotIndex = -1;

function render() {
  syncFlags();
  const fs = flagStr();
  const res = runMatch(state.pattern, fs, state.text);
  lastResult = res;

  /* pattern validity */
  el.patrow.classList.toggle("invalid", !!res.error);
  if (res.error) {
    el.status.textContent = "syntax error";
    el.status.className = "badge err";
    el.errSlot.innerHTML = errorHTML(res.error, state.pattern);
  } else {
    el.errSlot.innerHTML = "";
    if (!state.pattern) { el.status.textContent = "idle"; el.status.className = "badge"; }
    else { el.status.textContent = "valid"; el.status.className = "badge ok"; }
  }

  /* highlighting */
  const showMatches = res.ok && !res.error;
  el.backdrop.innerHTML = showMatches ? buildBackdrop(state.text, res.matches, hotIndex) : esc(state.text) + "\n";
  syncScroll();

  /* stats */
  const n = res.matches.length;
  const chars = res.matches.reduce((a, m) => a + m.value.length, 0);
  el.stats.innerHTML = !state.pattern ? "waiting for a pattern"
    : res.error ? '<span style="color:var(--pink)">pattern invalid</span>'
      : n === 0 ? "no matches"
        : `<b>${n}</b> match${n === 1 ? "" : "es"} · <b>${chars}</b> char${chars === 1 ? "" : "s"} covered${res.truncated ? " · capped at " + MAX_MATCHES : ""}`;
  el.hlBadge.textContent = state.text ? state.text.length + " chars, " + (state.text.split("\n").length) + " lines" : "empty";

  el.cntTbl.textContent = n;
  renderTable(res);
  renderExplain();
  renderGroupsPane(res);
  renderReplace(res);
  updateCursor();
}

function errorHTML(err, pattern) {
  const idx = Math.max(0, Math.min(err.index ?? 0, pattern.length));
  const WIN = 46;
  let from = Math.max(0, idx - Math.floor(WIN / 2));
  let to = Math.min(pattern.length, from + WIN);
  from = Math.max(0, Math.min(from, to - WIN));
  const slice = pattern.slice(from, to);
  const lead = (from > 0 ? "…" : "") + slice.slice(0, idx - from);
  const caret = " ".repeat(lead.length) + "^";
  return `<div class="errbox">
    <div><b>SyntaxError</b> · <span class="msg">${esc(err.message)}</span></div>
    <div class="caret">${esc((from > 0 ? "…" : "") + slice + (to < pattern.length ? "…" : ""))}
${caret.replace(/\^$/, '<i>▲</i>')}</div>
    <div style="color:var(--fg-faint);font-size:11.5px;margin-top:3px">position ${idx} of ${pattern.length}</div>
  </div>`;
}

function renderTable(res) {
  if (!state.pattern) return void (el.paneTbl.innerHTML = emptyState("Type a pattern above", "Matches, indices and capture groups appear here as you type."));
  if (res.error) return void (el.paneTbl.innerHTML = emptyState("Pattern is not valid yet", "Fix the syntax error shown above the test text."));
  if (!state.text) return void (el.paneTbl.innerHTML = emptyState("No test text", "Paste something into the test subject pane on the left."));
  if (!res.matches.length) return void (el.paneTbl.innerHTML = emptyState("Zero matches", "The pattern is valid but nothing in the text matched it."));

  const rows = res.matches.map((m, i) => {
    const gs = m.groups;
    const named = m.named || {};
    const nameOf = n => {
      for (const k in named) if (named[k] !== undefined && named[k] === gs[n - 1]?.value) return k;
      return null;
    };
    const gHtml = gs.length
      ? `<div class="groups">${gs.map(g => {
        const nm = res.names.length ? nameOf(g.n) : null;
        const label = nm ? `${g.n}:${nm}` : String(g.n);
        return `<div class="grow"><span class="gname" data-g="${((g.n - 1) % 8) + 1}">${esc(label)}</span>` +
          (g.value === undefined ? '<span class="undef">undefined</span>'
            : g.value === "" ? '<span class="undef">"" (empty)</span>'
              : `<span class="tok">${esc(g.value)}</span>`) + `</div>`;
      }).join("")}</div>`
      : '<span class="undef">—</span>';
    const shown = m.value === "" ? '<span class="undef">"" (zero-length)</span>' : `<span class="tok">${esc(m.value)}</span>`;
    return `<tr data-mi="${i}"><td class="i">${i}</td><td class="i">${m.index}–${m.index + m.value.length}</td><td class="mv">${shown}</td><td>${gHtml}</td></tr>`;
  }).join("");

  el.paneTbl.innerHTML = `<table><thead><tr>
      <th>#</th><th>range</th><th>match</th><th>capture groups</th>
    </tr></thead><tbody>${rows}</tbody></table>` +
    (res.truncated ? `<div class="hint" style="padding:8px 11px">Output capped at ${MAX_MATCHES} matches.</div>` : "");

  $$("tbody tr", el.paneTbl).forEach(tr => {
    tr.addEventListener("mouseenter", () => setHot(+tr.dataset.mi));
    tr.addEventListener("mouseleave", () => setHot(-1));
    tr.addEventListener("click", () => {
      const m = res.matches[+tr.dataset.mi];
      el.text.focus();
      el.text.setSelectionRange(m.index, m.index + Math.max(m.value.length, 0));
      updateCursor();
    });
  });
}

function setHot(i) {
  if (hotIndex === i) return;
  hotIndex = i;
  el.backdrop.innerHTML = buildBackdrop(state.text, lastResult.matches || [], hotIndex);
  syncScroll();
  $$("tbody tr", el.paneTbl).forEach(tr => tr.classList.toggle("hot", +tr.dataset.mi === i));
}

function renderExplain() {
  if (!state.pattern) { el.cntExp.textContent = "0"; el.paneExp.innerHTML = emptyState("Nothing to explain", "The explanation is generated from the pattern you type."); return; }
  let parsed;
  try { parsed = parseRegex(state.pattern); }
  catch (e) { el.paneExp.innerHTML = emptyState("Could not parse", String(e.message)); return; }

  el.cntExp.textContent = countTreeNodes(parsed.nodes);
  const fs = flagStr();
  const flagLines = FLAGS.filter(([f]) => state.flags.has(f))
    .map(([f, d]) => `<div class="grow"><span class="gname" data-g="6">${f}</span><span class="desc">${esc(d)}</span></div>`).join("");

  const warn = parsed.warnings.length
    ? `<div class="errbox" style="margin:0 0 10px">${parsed.warnings.map(w => "⚠ " + esc(w)).join("<br>")}</div>` : "";

  el.paneExp.innerHTML = `<div class="explain">
    <div class="ex-src"><span class="pat"><span class="k">/</span>${esc(state.pattern)}<span class="k">/</span>${esc(fs)}</span>
      <span class="meta">${parsed.groupCount} capturing group${parsed.groupCount === 1 ? "" : "s"} · ${countTreeNodes(parsed.nodes)} tokens</span></div>
    ${warn}
    ${renderNodes(parsed.nodes)}
    ${flagLines ? `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
      <div style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:6px">active flags</div>
      <div class="groups">${flagLines}</div></div>` : ""}
  </div>`;
}

function renderGroupsPane(res) {
  if (!state.pattern || res.error) { el.cntGrp.textContent = "0"; el.paneGrp.innerHTML = emptyState("No groups yet", "Add a capture group like (\\w+) to see a per-group breakdown."); return; }
  const parsed = parseRegex(state.pattern);
  const total = parsed.groupCount;
  el.cntGrp.textContent = total;
  if (!total) { el.paneGrp.innerHTML = emptyState("This pattern has no capture groups", "Wrap part of the pattern in ( ) to capture it."); return; }

  // Collect declared group metadata by walking the tree in source order.
  const decl = [];
  (function walk(nodes) {
    nodes.forEach(n => {
      if (n.type === "group") {
        if (n.num != null) decl[n.num] = { num: n.num, name: n.name, raw: n.raw };
        walk(n.body);
      } else if (n.type === "quant") walk([n.child]);
      else if (n.type === "alt") n.branches.forEach(walk);
    });
  })(parsed.nodes);

  const rows = [];
  for (let g = 1; g <= total; g++) {
    const meta = decl[g] || { num: g };
    const vals = res.matches.map(m => m.groups[g - 1]?.value).filter(v => v !== undefined);
    const uniq = [...new Set(vals)];
    const preview = uniq.slice(0, 12).map(v => `<span class="tok">${esc(v === "" ? '""' : v)}</span>`).join(" ");
    rows.push(`<tr>
      <td class="i"><span class="gname" data-g="${((g - 1) % 8) + 1}">${g}</span></td>
      <td class="mv">${meta.name ? "&lt;" + esc(meta.name) + "&gt;" : '<span class="undef">unnamed</span>'}</td>
      <td class="i">${vals.length}</td>
      <td class="mv">${preview || '<span class="undef">never captured</span>'}${uniq.length > 12 ? ` <span class="undef">+${uniq.length - 12} more</span>` : ""}</td>
    </tr>`);
  }
  el.paneGrp.innerHTML = `<table><thead><tr><th>#</th><th>name</th><th>hits</th><th>distinct values</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
}

function renderReplace(res) {
  if (!state.showReplace) return;
  if (!state.pattern || !res || res.error) { el.replaceOut.innerHTML = '<span class="undef">needs a valid pattern</span>'; return; }
  try {
    const re = new RegExp(state.pattern, flagStr());
    const out = state.text.replace(re, state.replacement);
    el.replaceOut.innerHTML = out === "" ? '<span class="undef">(empty result)</span>' : esc(out);
  } catch (e) { el.replaceOut.innerHTML = `<span style="color:var(--pink)">${esc(e.message)}</span>`; }
}

function emptyState(title, sub) {
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
    <div style="color:var(--fg-dim);margin-bottom:3px">${esc(title)}</div>
    <div>${sub}</div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────────
   9. START
   ───────────────────────────────────────────────────────────────── */
function syncAll() {
  el.pattern.value = state.pattern;
  el.text.value = state.text;
  el.replacement.value = state.replacement;
  el.replaceHost.style.display = state.showReplace ? "block" : "none";
  const th = document.documentElement.dataset.theme;
  $("#themeIcon").textContent = th === "dark" ? "☾" : "☀";
  $("#themeTxt").textContent = th.toUpperCase();
  syncFlags(); render();
}

(function init() {
  const fromHash = readHash();
  if (!fromHash || (!state.pattern && !state.text)) {
    const d = SAMPLES[0];
    state.pattern = d.p; state.text = d.t; state.flags = new Set([...d.f]);
  }
  syncAll();
  writeHash();
  setTab("tbl");
})();
</script>
</body>
