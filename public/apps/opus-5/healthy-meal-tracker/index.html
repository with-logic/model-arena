<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nourish — Healthy Meal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ee;
    --bg-2:#fffdf8;
    --ink:#1f2a24;
    --ink-2:#5b6b62;
    --ink-3:#93a29a;
    --line:#e4e0d5;
    --line-2:#efece3;
    --green:#2f7d5d;
    --green-soft:#e7f1ea;
    --green-deep:#1e5540;
    --amber:#d98324;
    --amber-soft:#fbeedd;
    --coral:#d9534b;
    --coral-soft:#fbe7e5;
    --violet:#6c5ce7;
    --violet-soft:#eeecfd;
    --blue:#2f7fa8;
    --blue-soft:#e4f0f6;
    --shadow-sm:0 1px 2px rgba(31,42,36,.05), 0 1px 3px rgba(31,42,36,.04);
    --shadow:0 2px 4px rgba(31,42,36,.04), 0 8px 24px -8px rgba(31,42,36,.12);
    --shadow-lg:0 24px 60px -20px rgba(31,42,36,.28), 0 4px 12px rgba(31,42,36,.06);
    --r:16px;
    --r-sm:10px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --serif:'Fraunces',Georgia,serif;
  }
  html[data-theme="dark"]{
    --bg:#141816;
    --bg-2:#1c2220;
    --ink:#eef2ef;
    --ink-2:#a3b1aa;
    --ink-3:#6f7d76;
    --line:#2c3532;
    --line-2:#242b28;
    --green:#5cc79a;
    --green-soft:#1d322a;
    --green-deep:#8fe0bd;
    --amber:#eba455;
    --amber-soft:#332618;
    --coral:#f0837c;
    --coral-soft:#331e1d;
    --violet:#a49bff;
    --violet-soft:#22213b;
    --blue:#66b6d8;
    --blue-soft:#152a33;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 2px 4px rgba(0,0,0,.2), 0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
    transition:background .3s ease, color .3s ease;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(47,125,93,.10), transparent 60%),
      radial-gradient(700px 460px at 100% 0%, rgba(217,131,36,.09), transparent 60%);
  }
  html[data-theme="dark"] body::before{
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(92,199,154,.10), transparent 60%),
      radial-gradient(700px 460px at 100% 0%, rgba(235,164,85,.07), transparent 60%);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  ::selection{background:var(--green);color:#fff}

  /* ---------- Layout ---------- */
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 22px 90px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{
    width:42px;height:42px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--green),var(--green-deep));
    display:grid;place-items:center;font-size:21px;
    box-shadow:0 6px 16px -6px rgba(47,125,93,.7), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand h1{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
  .brand p{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}

  .icon-btn{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--bg-2);box-shadow:var(--shadow-sm);
    font-size:16px;transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--green)}
  .icon-btn:active{transform:translateY(0) scale(.97)}

  .datenav{
    display:flex;align-items:center;gap:2px;background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;padding:4px;box-shadow:var(--shadow-sm)
  }
  .datenav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:15px}
  .datenav button:hover{background:var(--line-2);color:var(--ink)}
  .datenav .dlabel{
    min-width:132px;text-align:center;font-weight:650;font-size:13.5px;padding:0 6px;
    display:flex;flex-direction:column;line-height:1.2;cursor:pointer;border-radius:8px
  }
  .datenav .dlabel:hover{background:var(--line-2)}
  .datenav .dlabel span{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .datenav input[type=date]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
  /* grid items default to min-width:auto and refuse to shrink below content — pin to 0 */
  .grid>*{min-width:0}
  .stack{min-width:0}
  @media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

  .card{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden
  }
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
  .card-h h2{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.01em}
  .card-h .sub{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:600}

  /* ---------- Hero ring ---------- */
  .hero{padding:20px 18px 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .ringwrap{position:relative;width:172px;height:172px;flex:0 0 auto}
  .ringwrap svg{transform:rotate(-90deg);overflow:visible}
  .ring-bg{stroke:var(--line-2)}
  .ring-fg{transition:stroke-dashoffset .85s cubic-bezier(.2,.85,.25,1), stroke .4s}
  .ringtext{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ringtext .big{font-family:var(--serif);font-size:37px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .ringtext .lbl{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:5px}
  .ringtext .rem{font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:600}

  .macros{flex:1 1 260px;min-width:230px;display:flex;flex-direction:column;gap:13px}
  .macro .mtop{display:flex;align-items:baseline;gap:7px;font-size:12.5px;margin-bottom:6px}
  .macro .mtop b{font-weight:650;letter-spacing:.01em}
  .macro .mtop .val{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
  .macro .mtop .pct{color:var(--ink-3);font-size:11px;font-weight:600;min-width:34px;text-align:right}
  .bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.85,.25,1);position:relative}
  .bar i::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transform:translateX(-100%);animation:sheen 2.4s ease-in-out infinite
  }
  @keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .chips{display:flex;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;
    padding:5px 10px;border-radius:99px;background:var(--line-2);color:var(--ink-2);
    border:1px solid transparent
  }
  .chip.ok{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 22%,transparent)}
  .chip.warn{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
  .chip.bad{background:var(--coral-soft);color:var(--coral);border-color:color-mix(in srgb,var(--coral) 22%,transparent)}

  /* ---------- Meals ---------- */
  .meals{display:flex;flex-direction:column}
  .mealgroup{border-bottom:1px solid var(--line-2)}
  .mealgroup:last-child{border-bottom:0}
  .mg-head{display:flex;align-items:center;gap:11px;padding:13px 18px;cursor:pointer;user-select:none}
  .mg-head:hover{background:var(--line-2)}
  .mg-ico{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
    background:var(--line-2)
  }
  .mg-title{font-weight:650;font-size:14.5px;letter-spacing:-.005em}
  .mg-meta{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .mg-kcal{margin-left:auto;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .mg-kcal small{font-weight:600;color:var(--ink-3);font-size:10.5px;margin-left:2px}
  .mg-add{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:17px;color:var(--ink-3);
    border:1px dashed var(--line);flex:0 0 auto;transition:all .15s
  }
  .mg-add:hover{color:var(--green);border-color:var(--green);border-style:solid;background:var(--green-soft)}
  .caret{color:var(--ink-3);font-size:11px;transition:transform .2s;flex:0 0 auto;width:12px;text-align:center}
  .mealgroup.collapsed .caret{transform:rotate(-90deg)}
  .mg-body{overflow:hidden;transition:height .28s cubic-bezier(.3,.8,.3,1)}
  .mealgroup.collapsed .mg-body{height:0 !important}

  .entry{
    display:flex;align-items:center;gap:11px;padding:9px 18px 9px 18px;
    border-top:1px solid var(--line-2);position:relative;animation:pop .35s cubic-bezier(.2,.9,.3,1)
  }
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .entry:hover{background:var(--line-2)}
  .entry .eico{font-size:19px;width:26px;text-align:center;flex:0 0 auto}
  .entry .ename{font-weight:600;font-size:13.5px}
  .entry .eing{font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
  .entry .emid{min-width:0;flex:1 1 auto}
  .entry .emac{display:flex;gap:7px;font-size:10.5px;color:var(--ink-3);font-weight:650;flex:0 0 auto}
  .entry .emac b{color:var(--ink-2);font-weight:700}
  .entry .ekcal{font-weight:700;font-size:13.5px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .entry .eacts{display:flex;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .15s}
  .entry:hover .eacts,.entry:focus-within .eacts{opacity:1}
  .entry .eacts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:var(--ink-3)}
  .entry .eacts button:hover{background:var(--bg);color:var(--ink);box-shadow:var(--shadow-sm)}
  .entry .eacts button.del:hover{color:var(--coral)}
  @media(max-width:640px){.entry .emac{display:none}}

  .empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line-2)}
  .empty .e{font-size:26px;display:block;margin-bottom:6px;opacity:.6}

  /* ---------- Right column ---------- */
  .stack{display:flex;flex-direction:column;gap:20px}

  .quick{padding:14px 16px 16px}
  .quick .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .qbtn{
    border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .16s;text-align:center
  }
  .qbtn:hover{border-color:var(--green);background:var(--green-soft);transform:translateY(-2px);box-shadow:var(--shadow)}
  .qbtn .qe{font-size:21px;line-height:1}
  .qbtn .qn{font-size:11px;font-weight:650;line-height:1.2}
  .qbtn .qk{font-size:10px;color:var(--ink-3);font-weight:650}

  .weekbars{padding:16px 18px 18px}
  .wk{display:flex;align-items:flex-end;gap:8px;height:118px}
  .wkd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;cursor:pointer}
  .wkd .col{width:100%;flex:1;display:flex;align-items:flex-end;position:relative}
  .wkd .fill{
    width:100%;border-radius:7px 7px 3px 3px;background:var(--line);min-height:3px;
    transition:height .6s cubic-bezier(.2,.85,.25,1), background .2s;position:relative
  }
  .wkd.has .fill{background:linear-gradient(180deg,var(--green),color-mix(in srgb,var(--green) 62%,var(--bg-2)))}
  .wkd.over .fill{background:linear-gradient(180deg,var(--amber),color-mix(in srgb,var(--amber) 60%,var(--bg-2)))}
  .wkd.under .fill{background:linear-gradient(180deg,color-mix(in srgb,var(--green) 45%,var(--line)),var(--line))}
  .wkd.today .fill{box-shadow:0 0 0 2px var(--bg-2),0 0 0 3.5px var(--green)}
  .wkd:hover .fill{filter:brightness(1.08)}
  .wkd .lb{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
  .wkd.today .lb{color:var(--green)}
  .goalline{position:relative;height:0;border-top:1.5px dashed var(--line);margin:0 0 -1.5px}
  .wkmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:12px;font-weight:600;padding-top:11px;border-top:1px solid var(--line-2)}
  .wkmeta b{color:var(--ink);font-weight:700}

  .insights{padding:6px 0 8px}
  .ins{display:flex;gap:11px;padding:10px 18px;align-items:flex-start}
  .ins .ii{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .ins .it{font-size:12.5px;line-height:1.45;color:var(--ink-2)}
  .ins .it b{color:var(--ink);font-weight:650}

  /* ---------- Modal ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(20,26,23,.42);backdrop-filter:blur(5px);z-index:50;
    display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .modal{
    width:100%;max-width:600px;max-height:calc(100vh - 40px);background:var(--bg-2);border:1px solid var(--line);
    border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(14px) scale(.985);transition:transform .24s cubic-bezier(.2,.9,.3,1)
  }
  .scrim.on .modal{transform:none}
  .m-h{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
  .m-h h3{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.015em}
  .m-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);font-size:17px}
  .m-h .x:hover{background:var(--line-2);color:var(--ink)}
  .m-b{padding:18px;overflow-y:auto;flex:1}
  .m-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px;align-items:center;background:var(--bg-2)}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px}
  .inp{
    width:100%;padding:9.5px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);
    transition:border-color .15s, box-shadow .15s;font-size:14px
  }
  .inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--green) 16%,transparent)}
  .inp::placeholder{color:var(--ink-3)}
  .row{display:flex;gap:11px}
  .row>*{flex:1;min-width:0}

  .segs{display:flex;gap:6px;flex-wrap:wrap}
  .seg{
    flex:1;min-width:74px;padding:9px 6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:11.5px;font-weight:650
  }
  .seg .se{font-size:17px;line-height:1}
  .seg:hover{border-color:var(--green)}
  .seg.on{background:var(--green-soft);border-color:var(--green);color:var(--green);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--green) 14%,transparent)}

  .btn{
    padding:9.5px 16px;border-radius:var(--r-sm);font-weight:650;font-size:13.5px;
    border:1px solid var(--line);background:var(--bg);transition:all .15s
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--green) 70%,transparent)}
  .btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--line-2);color:var(--ink)}

  /* Ingredient rows */
  .ing-list{display:flex;flex-direction:column;gap:7px}
  .ing{
    display:flex;gap:7px;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:6px 7px 6px 9px;animation:pop .25s ease
  }
  .ing .ie{font-size:17px;width:22px;text-align:center;flex:0 0 auto;cursor:pointer;border-radius:5px}
  .ing .ie:hover{background:var(--line-2)}
  .ing input.nm{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:3px 2px;font-size:13.5px;font-weight:600}
  .ing input.nm:focus{outline:none}
  .ing input.num{
    width:62px;flex:0 0 auto;border:1px solid var(--line-2);background:var(--bg-2);border-radius:7px;
    padding:4px 6px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums
  }
  .ing input.num:focus{outline:none;border-color:var(--green)}
  .ing .unit{font-size:10px;color:var(--ink-3);font-weight:700;flex:0 0 auto;width:22px}
  .ing .rm{width:24px;height:24px;border-radius:6px;color:var(--ink-3);font-size:14px;display:grid;place-items:center;flex:0 0 auto}
  .ing .rm:hover{background:var(--coral-soft);color:var(--coral)}
  .ing-head{display:flex;gap:7px;font-size:9.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:0 7px 0 33px;margin-bottom:5px}
  .ing-head .h1{flex:1 1 auto}
  .ing-head .hn{width:62px;text-align:right;flex:0 0 auto}
  .ing-head .hs{width:22px;flex:0 0 auto}
  .ing-head .hr{width:24px;flex:0 0 auto}
  @media(max-width:560px){
    .ing input.num{width:48px}
    .ing-head .hn{width:48px}
  }

  .addbar{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
  .totalpill{
    margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    background:var(--green-soft);color:var(--green);padding:6px 11px;border-radius:99px;
    border:1px solid color-mix(in srgb,var(--green) 22%,transparent);font-variant-numeric:tabular-nums
  }

  /* Suggest dropdown */
  .sugwrap{position:relative}
  .sug{
    position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow-lg);z-index:5;max-height:236px;overflow-y:auto;padding:5px;display:none
  }
  .sug.on{display:block}
  .sug{min-width:270px}
  .sug button{
    width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-align:left;font-size:13px
  }
  .sug .sn{flex:1 1 auto;min-width:0}
  .sug button:hover,.sug button.hl{background:var(--green-soft)}
  .sug .se{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
  .sug .sn{font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug .sk{font-size:11px;color:var(--ink-3);font-weight:650;flex:0 0 auto}
  .sug .sgroup{font-size:9.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:7px 9px 4px}

  /* Toast */
  .toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{

    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:tin .3s cubic-bezier(.2,.9,.3,1);pointer-events:auto
  }
  .toast button{color:var(--green);font-weight:700;font-size:12.5px;text-decoration:underline}
  @keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
  .toast.out{animation:tout .25s ease forwards}
  @keyframes tout{to{opacity:0;transform:translateY(8px) scale(.96)}}

  /* Goals sheet */
  .goalrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .goalrow:last-child{border:0}
  .goalrow .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .goalrow .gn{flex:1;font-size:13.5px;font-weight:600}
  .goalrow input{width:88px;text-align:right}
  .goalrow .gu{font-size:11px;color:var(--ink-3);font-weight:700;width:26px}

  .kbd{

  }
  footer.ft{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:26px;font-weight:500}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .fab{
    position:fixed;bottom:22px;right:22px;z-index:40;height:52px;padding:0 20px;border-radius:99px;

  .fab:active{transform:scale(.97)}
  .fab .p{font-size:20px;line-height:1}

  @media(max-width:560px){
    .wrap{padding:16px 14px 104px}

<div class="wrap">

        </div>

          </div>

    </div>

</div>

<button class="fab" id="fab"><span class="p">+</span> Log a meal</button>

function todayKey(){ return dateKey(new Date()); }
function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseKey(k){ const a=k.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function shiftKey(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p = JSON.parse(raw);
      return {goals:Object.assign({},DEFAULT_GOALS,p.goals||{}), meals:Array.isArray(p.meals)?p.meals:[], theme:p.theme||'light', seeded:!!p.seeded};
    }
  }catch(e){}
  const s = {goals:Object.assign({},DEFAULT_GOALS), meals:[], theme:'light', seeded:true};
  seed(s);
  return s;
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function uid(){ return 'm'+Math.random().toString(36).slice(2,10)+(state.meals.length); }

function makeIng(name, qty){
  const f = FOOD_BY_NAME[String(name).toLowerCase()];
  if(!f) return {name:name, emoji:'🍽️', qty:qty||1, unit:'serv', kcal:0,p:0,c:0,f:0,fib:0, manual:true, base:null};
  return {name:f.name, emoji:f.emoji, qty:qty, unit:f.unit, base:f.id, manual:false,
          kcal:f.kcal, p:f.p, c:f.c, f:f.f, fib:f.fib};
}
/* factor: for per-100g/100ml foods, qty is grams/ml → /100. For 'ea','slice','tbsp','cup' → qty itself. */
function factor(ing){
  const q = Number(ing.qty)||0;
  return (ing.unit===U_100G || ing.unit===U_ML) ? q/100 : q;
}
function ingTotals(ing){
  if(ing.manual){
    const q = Number(ing.qty)||0;
    const m = q===0?0:q; // manual entries store per-serving values
    return {kcal:(Number(ing.kcal)||0)*m, p:(Number(ing.p)||0)*m, c:(Number(ing.c)||0)*m, f:(Number(ing.f)||0)*m, fib:(Number(ing.fib)||0)*m};
  }
  const k = factor(ing);
  return {kcal:(Number(ing.kcal)||0)*k, p:(Number(ing.p)||0)*k, c:(Number(ing.c)||0)*k, f:(Number(ing.f)||0)*k, fib:(Number(ing.fib)||0)*k};
}
function mealTotals(meal){
  const t={kcal:0,p:0,c:0,f:0,fib:0};
  (meal.ings||[]).forEach(function(i){
    const x=ingTotals(i);
    t.kcal+=x.kcal; t.p+=x.p; t.c+=x.c; t.f+=x.f; t.fib+=x.fib;
  });
  return t;
}
function dayMeals(k){
  return state.meals.filter(function(m){return m.date===k;})
    .sort(function(a,b){
      const oa=MEAL_TYPES.findIndex(function(t){return t.id===a.type;});
      const ob=MEAL_TYPES.findIndex(function(t){return t.id===b.type;});
      return oa-ob || (a.ts||0)-(b.ts||0);
    });
}
function dayTotals(k){
  const t={kcal:0,p:0,c:0,f:0,fib:0};
  dayMeals(k).forEach(function(m){
    const x=mealTotals(m);
    t.kcal+=x.kcal;t.p+=x.p;t.c+=x.c;t.f+=x.f;t.fib+=x.fib;
  });
  return t;
}

/* ============================================================ Utilities ============================================================ */
const $=function(s,r){return (r||document).querySelector(s);};
const $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function r0(n){ return Math.round(n); }
function r1(n){ return Math.round(n*10)/10; }
function fmt(n){ return r0(n).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function qtyLabel(ing){
  const q = Number(ing.qty)||0;
  const qs = (Math.abs(q-Math.round(q))<0.001) ? String(Math.round(q)) : String(r1(q));
  if(ing.unit===U_100G) return qs+'g';
  if(ing.unit===U_ML) return qs+'ml';
  if(ing.unit===U_EA) return qs+'×';
  if(ing.unit==='serv') return qs+' serv';
  return qs+' '+ing.unit;
}
function unitShort(u){
  if(u===U_100G) return 'g';
  if(u===U_ML) return 'ml';
  if(u===U_EA) return '×';
  if(u===U_SLICE) return 'sl';
  return u;
}

/* ============================================================ Toasts ============================================================ */
function toast(msg, actionLabel, action){
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = '<span>'+esc(msg)+'</span>';
  if(actionLabel){
    const b=document.createElement('button'); b.textContent=actionLabel;
    b.onclick=function(){ action&&action(); kill(); };
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  let t = setTimeout(kill, actionLabel?5200:2400);
  function kill(){ clearTimeout(t); if(!el.parentNode) return; el.classList.add('out'); setTimeout(function(){ el.remove(); },250); }
}

/* ============================================================ Render: header/date ============================================================ */
function renderDate(){
  const d = parseKey(cursor);
  const isToday = cursor===todayKey();
  const isYest = cursor===shiftKey(todayKey(),-1);
  const isTom  = cursor===shiftKey(todayKey(),1);
  const wd = d.toLocaleDateString(undefined,{weekday:'long'});
  const md = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const top = isToday?'Today':isYest?'Yesterday':isTom?'Tomorrow':wd;
  $('#dateLabel').innerHTML = esc(top)+'<span>'+esc(md)+'</span>';
  $('#datePick').value = cursor;
  $('#nextDay').disabled = false;
}

/* ============================================================ Render: summary ============================================================ */
const RING_C = 2*Math.PI*72;
function renderSummary(){
  const t = dayTotals(cursor);
  const g = state.goals;
  const pct = g.kcal>0 ? t.kcal/g.kcal : 0;

  $('#kcalNow').textContent = fmt(t.kcal);
  $('#kcalGoal').textContent = fmt(g.kcal);
  const rem = g.kcal - t.kcal;
  $('#kcalRem').textContent = rem>=0 ? fmt(rem)+' left' : fmt(-rem)+' over';
  $('#kcalRem').style.color = rem>=0 ? 'var(--ink-2)' : 'var(--coral)';

  const ring=$('#ring');
  ring.setAttribute('stroke-dasharray', RING_C.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (RING_C*(1-clamp(pct,0,1))).toFixed(1));
  ring.setAttribute('stroke', pct>1.05?'var(--coral)': pct>=0.85?'var(--green)': pct>0?'var(--amber)':'var(--line)');

  const n = dayMeals(cursor).length;
  $('#summarySub').textContent = n===0 ? 'Nothing logged yet' : (n+' meal'+(n===1?'':'s')+' · '+r0(pct*100)+'% of goal');

  // macros
  $('#macros').innerHTML = MACRO_META.map(function(m){
    const val=t[m.k], goal=g[m.k]||1;
    const p=clamp(val/goal,0,1)*100;
    const over = val/goal>1.02;
    // striped overlay marks overshoot — protein's base color is already coral,
    // so a flat color swap alone wouldn't distinguish the two states
    const fill = over
      ? 'repeating-linear-gradient(45deg,'+m.color+',' +m.color+' 5px,color-mix(in srgb,'+m.color+' 55%,#fff) 5px,color-mix(in srgb,'+m.color+' 55%,#fff) 10px)'
      : m.color;
    return '<div class="macro">'
      +'<div class="mtop"><span>'+m.emoji+'</span><b>'+m.name+'</b>'
      +'<span class="val">'+r0(val)+' / '+r0(goal)+m.unit+'</span>'
      +'<span class="pct"'+(over?' style="color:var(--coral)"':'')+'>'+r0(val/goal*100)+'%</span></div>'
      +'<div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+fill+'"></i></div>'
      +'</div>';
  }).join('');

  // chips
  const chips=[];
  const pctKcal = t.kcal/g.kcal;
  if(n===0){
    chips.push(['','Log your first meal to see today\'s balance','']);
  }else{
    const pp=t.p/g.p, pf=t.fib/g.fib;
    if(pp>=0.9 && pp<=1.25) chips.push(['ok','💪','Protein on point']);
    else if(pp>1.25) chips.push(['warn','💪','Protein well over target']);
    else if(t.kcal>g.kcal*0.6 && pp<0.6) chips.push(['warn','💪','Protein running low']);
    if(pf>=0.9 && pf<=1.5) chips.push(['ok','🥦','Fiber goal met']);
    else if(pf>1.5) chips.push(['','🥦','Fiber well above goal']);
    else if(pf<0.4 && n>=2) chips.push(['warn','🥦','Add more veg & fiber']);
    if(pctKcal>1.1) chips.push(['bad','🔥','Over calorie budget']);
    else if(pctKcal>=0.9 && pctKcal<=1.1) chips.push(['ok','🎯','In the target zone']);
    else if(pctKcal<0.5) chips.push(['','⏳','Room for '+fmt(g.kcal-t.kcal)+' kcal']);
    const kmac = t.p*4+t.c*4+t.f*9;
    if(kmac>0){
      chips.push(['','⚖️', r0(t.p*4/kmac*100)+'P / '+r0(t.c*4/kmac*100)+'C / '+r0(t.f*9/kmac*100)+'F split']);
    }
  }
  $('#chips').innerHTML = chips.map(function(c){
    return '<span class="chip '+c[0]+'">'+(c[1]?c[1]+' ':'')+esc(c[2]||c[1])+'</span>';
  }).join('');
}

/* ============================================================ Render: meals ============================================================ */
const collapsed = {};
function renderMeals(){
  const meals = dayMeals(cursor);
  const t = dayTotals(cursor);
  $('#mealsSub').textContent = meals.length? fmt(t.kcal)+' kcal total' : '';

  const host=$('#meals');
  if(!meals.length){
    host.innerHTML = '<div class="empty" style="border-top:0;padding:40px 18px">'
      +'<span class="e">🍽️</span><div style="font-size:14px;font-weight:650;color:var(--ink-2);margin-bottom:4px">No meals logged for this day</div>'
      +'<div>Use <b>Quick Add</b> on the right, or hit <b>Log a meal</b> to build one from ingredients.</div></div>';
    return;
  }

  const byType = {};
  meals.forEach(function(m){ (byType[m.type]=byType[m.type]||[]).push(m); });

  host.innerHTML = MEAL_TYPES.filter(function(tp){return byType[tp.id];}).map(function(tp){
    const list = byType[tp.id];
    const sum = list.reduce(function(a,m){ return a+mealTotals(m).kcal; },0);
    const isC = !!collapsed[tp.id];
    return '<div class="mealgroup'+(isC?' collapsed':'')+'" data-type="'+tp.id+'">'
      +'<div class="mg-head" data-toggle="'+tp.id+'">'
        +'<span class="caret">▾</span>'
        +'<div class="mg-ico">'+tp.emoji+'</div>'
        +'<div><div class="mg-title">'+tp.name+'</div><div class="mg-meta">'+list.length+' item'+(list.length===1?'':'s')+'</div></div>'
        +'<div class="mg-kcal">'+fmt(sum)+'<small>kcal</small></div>'
        +'<button class="mg-add" data-add="'+tp.id+'" title="Add to '+tp.name+'">＋</button>'
      +'</div>'
      +'<div class="mg-body">'+list.map(entryHTML).join('')+'</div>'
    +'</div>';
  }).join('');

  // set body heights for animation
  $$('.mg-body',host).forEach(function(b){
    const g=b.parentNode;
    b.style.height = g.classList.contains('collapsed') ? '0px' : b.scrollHeight+'px';
  });
}
function entryHTML(m){
  const t=mealTotals(m);
  const ings=(m.ings||[]);
  const ico = ings.length? ings.reduce(function(a,b){ return ingTotals(b).kcal>ingTotals(a).kcal?b:a; }).emoji : (TYPE_BY_ID[m.type]||{}).emoji||'🍽️';
  const list = ings.map(function(i){ return esc(i.name)+' '+qtyLabel(i); }).join(' · ');
  return '<div class="entry" data-id="'+m.id+'">'
    +'<span class="eico">'+ico+'</span>'
    +'<div class="emid">'
      +'<div class="ename">'+esc(m.name||'Untitled meal')+(m.note?' <span style="font-weight:500;color:var(--ink-3);font-size:11.5px">· '+esc(m.note)+'</span>':'')+'</div>'
      +'<div class="eing">'+(list||'<i>no ingredients</i>')+'</div>'
    +'</div>'
    +'<div class="emac"><span>P<b> '+r0(t.p)+'</b></span><span>C<b> '+r0(t.c)+'</b></span><span>F<b> '+r0(t.f)+'</b></span></div>'
    +'<div class="ekcal">'+fmt(t.kcal)+'</div>'
    +'<div class="eacts">'
      +'<button data-act="edit" title="Edit">✏️</button>'
      +'<button data-act="dupe" title="Duplicate">⧉</button>'
      +'<button class="del" data-act="del" title="Delete">🗑</button>'
    +'</div>'
  +'</div>';
}

/* ============================================================ Render: week + insights ============================================================ */
function renderWeek(){
  const keys=[]; for(let i=6;i>=0;i--) keys.push(shiftKey(todayKey(),-i));
  const vals = keys.map(function(k){ return dayTotals(k).kcal; });
  const goal = state.goals.kcal;
  const max = Math.max(goal*1.15, Math.max.apply(null,vals)||0, 1);
  const logged = vals.filter(function(v){return v>0;});
  const avg = logged.length? logged.reduce(function(a,b){return a+b;},0)/logged.length : 0;
  const hit = keys.filter(function(k,i){ const v=vals[i]; return v>=goal*0.85 && v<=goal*1.1; }).length;

  $('#week').innerHTML = keys.map(function(k,i){
    const v=vals[i];
    const h = clamp(v/max,0,1)*100;
    const cls = [ v>0?'has':'', v>goal*1.1?'over':'', (v>0&&v<goal*0.6)?'under':'', k===todayKey()?'today':'', k===cursor?'sel':'' ].join(' ');
    const d=parseKey(k);
    return '<div class="wkd '+cls+'" data-k="'+k+'" title="'+d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' — '+fmt(v)+' kcal">'
      +'<div class="col"><div class="fill" style="height:'+Math.max(h,v>0?4:1.5)+'%"></div></div>'
      +'<div class="lb">'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'</div></div>';
  }).join('');
  $('#wkAvg').textContent = avg? fmt(avg)+' kcal':'—';
  $('#wkHit').textContent = hit+' / 7';
  $('#wkSub').textContent = logged.length+' logged';
}

function renderInsights(){
  const g=state.goals;
  const keys=[]; for(let i=6;i>=0;i--) keys.push(shiftKey(todayKey(),-i));
  const tots = keys.map(dayTotals);
  const logged = tots.filter(function(t){return t.kcal>0;});
  const out=[];

  if(!logged.length){
    out.push(['🌱','var(--green-soft)','var(--green)','<b>Fresh start.</b> Log a few meals and Nourish will start spotting patterns in your week.']);
  }else{
    const avgP = logged.reduce(function(a,t){return a+t.p;},0)/logged.length;
    const avgFib = logged.reduce(function(a,t){return a+t.fib;},0)/logged.length;
    const avgK = logged.reduce(function(a,t){return a+t.kcal;},0)/logged.length;

    const span = logged.length===1 ? 'on your one logged day' : 'across '+logged.length+' logged days';
    if(avgP >= g.p*0.9) out.push(['💪','var(--green-soft)','var(--green)','<b>Protein is strong</b> — averaging '+r0(avgP)+'g '+span+' against a '+g.p+'g goal. Great for recovery and satiety.']);
    else out.push(['💪','var(--amber-soft)','var(--amber)','<b>Protein gap:</b> averaging '+r0(avgP)+'g '+span+' vs '+g.p+'g. Adding ~'+r0(g.p-avgP)+'g — think Greek yogurt, lentils, or chicken — would close it.']);

    if(avgFib >= g.fib*0.85) out.push(['🥦','var(--green-soft)','var(--green)','<b>Fiber looks great</b> at '+r0(avgFib)+'g per logged day. Your gut is happy.']);
    else out.push(['🥦','var(--blue-soft)','var(--blue)','<b>More plants:</b> '+r0(avgFib)+'g fiber '+span+' vs '+g.fib+'g. A cup of berries plus a serving of beans covers most of the gap.']);

    if(Math.abs(avgK-g.kcal) <= g.kcal*0.08) out.push(['🎯','var(--green-soft)','var(--green)','<b>Steady as she goes</b> — '+fmt(avgK)+' kcal per logged day sits right on your '+fmt(g.kcal)+' target.']);
    else if(avgK>g.kcal) out.push(['🔥','var(--coral-soft)','var(--coral)','<b>Trending high:</b> '+fmt(avgK)+' kcal per logged day, about '+fmt(avgK-g.kcal)+' over target. Mostly comes down to portion sizes at dinner.']);
    else out.push(['⏳','var(--amber-soft)','var(--amber)','<b>Trending light:</b> '+fmt(avgK)+' kcal per logged day, '+fmt(g.kcal-avgK)+' under target. Under-fueling can stall progress too.']);

    // Biggest meal of the week
    const week = state.meals.filter(function(m){ return keys.indexOf(m.date)>=0; });
    if(week.length){
      let big=week[0], bigK=mealTotals(week[0]).kcal;
      week.forEach(function(m){ const k=mealTotals(m).kcal; if(k>bigK){big=m;bigK=k;} });
      out.push(['🏆','var(--violet-soft)','var(--violet)','<b>Biggest meal this week:</b> '+esc(big.name)+' at '+fmt(bigK)+' kcal.']);
      // most used ingredient
      const cnt={};
      week.forEach(function(m){ (m.ings||[]).forEach(function(i){ cnt[i.name]=(cnt[i.name]||0)+1; }); });
      const top = Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0];
      if(top && cnt[top]>1){
        const f=FOOD_BY_NAME[top.toLowerCase()];
        out.push([(f&&f.emoji)||'🍽️','var(--line-2)','var(--ink-2)','<b>Go-to ingredient:</b> '+esc(top)+', used in '+cnt[top]+' meals this week.']);
      }
    }
    const streak = (function(){
      let s=0, k=todayKey();
      if(dayTotals(k).kcal===0) k=shiftKey(k,-1);
      while(dayTotals(k).kcal>0 && s<400){ s++; k=shiftKey(k,-1); }
      return s;
    })();
    if(streak>1) out.push(['🔥','var(--amber-soft)','var(--amber)','<b>'+streak+'-day logging streak.</b> Consistency beats perfection — keep it rolling.']);
  }

  $('#insights').innerHTML = out.map(function(o){
    return '<div class="ins"><div class="ii" style="background:'+o[1]+';color:'+o[2]+'">'+o[0]+'</div><div class="it">'+o[3]+'</div></div>';
  }).join('');
}

function guessType(){

  if(cursor!==todayKey()) return 'lunch';
  if(h<10.5) return 'breakfast';
  if(h<15) return 'lunch';
  if(h<17) return 'snack';
  if(h<21.5) return 'dinner';
  return 'snack';
}
function blankIng(){ return {name:'',emoji:'🍽️',qty:100,unit:U_100G,kcal:0,p:0,c:0,f:0,fib:0,manual:true,base:null}; }

/* --- suggestions --- */
let sugIdx=-1, sugEl=null, sugItems=[];
function hideSug(){ if(sugEl){ sugEl.classList.remove('on'); sugEl.innerHTML=''; } sugEl=null; sugIdx=-1; sugItems=[]; }
function showSug(rowIdx, query){
  const row = $('#ingList .ing[data-i="'+rowIdx+'"]');
  if(!row) return;
  const el = $('.sug', row);
  const q = query.trim().toLowerCase();
  let matches;
  if(!q){
    matches = FOODS.slice().sort(function(a,b){return a.group.localeCompare(b.group)||a.name.localeCompare(b.name);}).slice(0,40);
  }else{
    const starts=[], contains=[];
    FOODS.forEach(function(f){
      const n=f.name.toLowerCase();
      if(n.indexOf(q)===0) starts.push(f);
      else if(n.indexOf(q)>-1 || f.group.toLowerCase().indexOf(q)===0) contains.push(f);
    });
    matches = starts.concat(contains).slice(0,30);
  }
  sugItems = matches;
  if(!matches.length){
    el.innerHTML='<div class="sgroup">No match — values you type are kept as a custom item</div>';
  }else{
    let html='', lastG=null;
    matches.forEach(function(f,i){
      if(!q && f.group!==lastG){ html+='<div class="sgroup">'+esc(f.group)+'</div>'; lastG=f.group; }
      const per = (f.unit===U_100G||f.unit===U_ML) ? f.kcal+' /'+(f.unit===U_100G?'100g':'100ml') : f.kcal+' /'+f.unit;
      html+='<button data-pick="'+i+'"><span class="se">'+f.emoji+'</span><span class="sn">'+esc(f.name)+'</span><span class="sk">'+per+'</span></button>';
    });
    el.innerHTML=html;
  }
  el.classList.add('on');
  sugEl=el; sugIdx=-1;
}
function moveSug(d){
  if(!sugEl) return;
  const btns=$$('button[data-pick]',sugEl);
  if(!btns.length) return;
  sugIdx = (sugIdx+d+btns.length)%btns.length;
  btns.forEach(function(b,i){ b.classList.toggle('hl', i===sugIdx); });
  btns[sugIdx].scrollIntoView({block:'nearest'});
}
function pickFood(rowIdx, food){
  const cur = draft.ings[rowIdx];
  const ni = makeIng(food.name, food.step);
  // keep qty if the user already typed one and units match
  if(cur && !cur.manual && cur.unit===ni.unit && Number(cur.qty)>0) ni.qty = cur.qty;
  draft.ings[rowIdx] = ni;
  hideSug();
  renderIngs(); updateModalTotal();
  const row=$('#ingList .ing[data-i="'+rowIdx+'"]');
  if(row) $('input[data-f="qty"]',row).focus(), $('input[data-f="qty"]',row).select();
}

const ingList=$('#ingList');
ingList.addEventListener('click', function(e){
  const rm=e.target.closest('[data-rm]');
  if(rm){
    const i=+rm.getAttribute('data-rm');
    draft.ings.splice(i,1);
    if(!draft.ings.length) draft.ings.push(blankIng());
    hideSug(); renderIngs(); updateModalTotal(); return;
  }
  const em=e.target.closest('[data-emoji]');
  if(em){
    const i=+em.getAttribute('data-emoji');
    const pool=['🍽️','🥗','🍗','🥦','🍎','🌾','🥑','🥛','🍫','🥜','🐟','🍚','🥚','🫘','🍅','🥕'];
    const cur=pool.indexOf(draft.ings[i].emoji);
    draft.ings[i].emoji = pool[(cur+1)%pool.length];
    em.textContent = draft.ings[i].emoji; return;
  }
  const pick=e.target.closest('[data-pick]');
  if(pick && sugEl){
    const rowIdx = +sugEl.getAttribute('data-sug');
    pickFood(rowIdx, sugItems[+pick.getAttribute('data-pick')]); return;
  }
});
ingList.addEventListener('input', function(e){
  const inp=e.target; if(!inp.matches('input')) return;
  const row=inp.closest('.ing'); const i=+row.getAttribute('data-i');
  const fld=inp.getAttribute('data-f'); const ing=draft.ings[i];
  if(fld==='name'){
    ing.name=inp.value; ing.manual=true; ing.base=null;
    showSug(i, inp.value);
    return;
  }
  const v = parseFloat(inp.value);
  const num = isNaN(v)?0:v;
  if(fld==='qty'){
    ing.qty=num;
  }else{
    // user overrides a total → convert to per-unit so math stays consistent
    const div = ing.manual ? (Number(ing.qty)||1) : (factor(ing)||1);
    ing[fld] = num/div;
    ing.manual = ing.manual; // keep flag
  }
  // refresh dependent totals without losing focus
  const t=ingTotals(ing);
  $$('input.num',row).forEach(function(x){
    const f=x.getAttribute('data-f');
    if(x===inp||f==='qty') return;
    x.value = f==='kcal'? r0(t.kcal) : r1(t[f]);
  });
  if(fld==='qty'){
    $$('input.num',row).forEach(function(x){
      const f=x.getAttribute('data-f'); if(f==='qty') return;
      x.value = f==='kcal'? r0(t.kcal) : r1(t[f]);
    });
  }
  updateModalTotal();
});
ingList.addEventListener('focusin', function(e){
  if(e.target.matches('input.nm')){
    const i=+e.target.closest('.ing').getAttribute('data-i');
    showSug(i, e.target.value);

});
ingList.addEventListener('keydown', function(e){
  const inp=e.target; if(!inp.matches('input')) return;
  const row=inp.closest('.ing'); const i=+row.getAttribute('data-i');
  if(inp.matches('input.nm') && sugEl){
    if(e.key==='ArrowDown'){ e.preventDefault(); moveSug(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); moveSug(-1); return; }
    if(e.key==='Enter'){
      const btns=$$('button[data-pick]',sugEl);
      if(btns.length){ e.preventDefault(); pickFood(i, sugItems[sugIdx>=0?sugIdx:0]); return; }
    }
    if(e.key==='Escape'){ e.stopPropagation(); hideSug(); return; }
  }
  if(e.key==='Enter'){
    e.preventDefault();
    if(i===draft.ings.length-1){ $('#addIng').click(); }
    else{ const nx=$('#ingList .ing[data-i="'+(i+1)+'"] input.nm'); nx&&nx.focus(); }
  }
});

  if(editingId){

}

/* keyboard */
document.addEventListener('keydown', function(e){
  const openModal = $('.scrim.on');
  if(e.key==='Escape'){
    if($('#mealScrim').classList.contains('on')) closeMeal();
    else if($('#goalScrim').classList.contains('on')) closeGoals();
    return;
  }
  if(openModal) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowLeft'){ go(-1); }
  else if(e.key==='ArrowRight'){ go(1); }
  else if(e.key==='n'||e.key==='N'){ e.preventDefault(); openMeal({}); }
  else if(e.key==='t'||e.key==='T'){ cursor=todayKey(); renderAll(); }
  else if(e.key==='g'||e.key==='G'){ e.preventDefault(); openGoals(); }
});

/* boot */
applyTheme();
renderQuick();
renderAll();
window.addEventListener('resize', function(){
  $$('.mg-body').forEach(function(b){
    if(!b.parentNode.classList.contains('collapsed')) b.style.height=b.scrollHeight+'px';
  });
});
})();
</script>
</body>
