<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Math Practice Drills</title>
<style>
  :root{
    --bg:#0e1116;
    --bg-2:#151a22;
    --panel:#171d26;
    --line:#232c39;
    --line-soft:#1d2531;
    --ink:#eef2f7;
    --ink-dim:#9aa7b8;
    --ink-faint:#67748a;
    --accent:#5eead4;
    --accent-2:#7dd3fc;
    --good:#4ade80;
    --bad:#fb7185;
    --warn:#fbbf24;
    --radius:16px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  }
  html[data-theme="light"]{
    --bg:#f4f6fa;
    --bg-2:#ffffff;
    --panel:#ffffff;
    --line:#dfe5ee;
    --line-soft:#e9edf4;
    --ink:#101620;
    --ink-dim:#5b6779;
    --ink-faint:#8d99ab;
    --accent:#0d9488;
    --accent-2:#0284c7;
    --good:#15803d;
    --bad:#be123c;
    --warn:#a16207;
    --shadow:0 18px 40px -24px rgba(16,22,32,.28);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 620px at 50% -18%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

  .wrap{
    max-width:920px;margin:0 auto;
    padding:clamp(14px,2.4vw,28px) clamp(14px,3.5vw,28px) 48px;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;gap:clamp(14px,2.2vw,22px);
  }

  /* ---------- header ---------- */
  header.top{display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
  .brand h1{
    margin:0;font-size:clamp(17px,2.4vw,22px);letter-spacing:-.02em;font-weight:650;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .iconbtn{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:40px;height:40px;display:grid;place-items:center;flex:none;
    transition:border-color .15s, transform .12s, background .15s;
  }
  .iconbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
  .iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- cards ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .pad{padding:clamp(16px,2.6vw,26px)}

  .label{
    font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:650;margin:0 0 10px;
  }

  /* ---------- setup ---------- */
  .setup{display:flex;flex-direction:column;gap:clamp(16px,2.4vw,22px)}
  .grid{display:grid;gap:10px}
  .ops{grid-template-columns:repeat(4,1fr)}
  .diffs{grid-template-columns:repeat(4,1fr)}
  .lens{grid-template-columns:repeat(3,1fr)}
  @media (max-width:560px){
    .ops{grid-template-columns:repeat(2,1fr)}
    .diffs{grid-template-columns:repeat(2,1fr)}
  }

  .chip{
    position:relative;background:var(--bg-2);border:1px solid var(--line);
    border-radius:13px;padding:13px 10px;display:flex;flex-direction:column;
    align-items:center;gap:3px;text-align:center;
    transition:border-color .15s, background .15s, transform .12s, color .15s;
  }
  .chip:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .chip .glyph{font-size:22px;line-height:1.1;font-family:var(--mono);font-weight:600}
  .chip .cap{font-size:12.5px;color:var(--ink-dim);font-weight:550}
  .chip .sub{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
  .chip[aria-pressed="true"], .chip.sel{
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 13%,var(--bg-2));
    color:var(--ink);
  }
  .chip[aria-pressed="true"] .cap, .chip.sel .cap{color:var(--ink)}
  .chip[aria-pressed="true"]::after{
    content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;
    background:var(--accent);
  }

  .rowflex{display:flex;flex-wrap:wrap;gap:10px}
  .seg{
    flex:1 1 92px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    padding:11px 8px;font-family:var(--mono);font-size:15px;font-weight:600;
    transition:border-color .15s,background .15s,transform .12s;
  }
  .seg:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .seg.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--bg-2))}
  .seg small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);font-weight:550;margin-top:2px}
  .seg.sel small{color:var(--ink-dim)}

  .start{
    width:100%;border:0;border-radius:14px;padding:19px;
    background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 78%,#000));
    color:#04211c;font-size:19px;font-weight:750;letter-spacing:-.01em;
    box-shadow:0 12px 30px -14px color-mix(in srgb,var(--accent) 75%,transparent);
    transition:transform .12s, filter .15s;
  }
  html[data-theme="light"] .start{color:#f7fffd}
  .start:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .start:active{transform:translateY(0)}
  .hint{text-align:center;color:var(--ink-faint);font-size:12.5px;margin:10px 0 0}
  kbd{
    font-family:var(--mono);font-size:11px;background:var(--bg-2);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1.5px 5px;color:var(--ink-dim);
  }

  /* ---------- stat strip ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .stat{background:var(--panel);padding:12px 8px;text-align:center}
  .stat b{display:block;font-family:var(--mono);font-size:clamp(19px,3.4vw,25px);font-weight:650;letter-spacing:-.02em}
  .stat span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;font-weight:600}
  .stat b.warn{color:var(--warn)}
  .stat b.bad{color:var(--bad)}
  .stat b.good{color:var(--good)}

  /* ---------- timer bar ---------- */
  .timer{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;
    transform-origin:left;transition:background .3s}
  .timer i.warn{background:var(--warn)}
  .timer i.bad{background:var(--bad)}

  /* ---------- quiz ---------- */
  .quiz{display:flex;flex-direction:column;gap:clamp(14px,2.2vw,20px);flex:1}
  .qcard{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3vw,24px);min-height:min(38vh,300px);
    padding:clamp(46px,7vw,60px) 18px clamp(24px,4vw,34px);position:relative;overflow:hidden;
  }
  .qmeta{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .qmeta em{font-style:normal;color:var(--accent);font-family:var(--mono);letter-spacing:.04em}

  .problem{
    font-family:var(--mono);font-weight:600;letter-spacing:-.035em;
    font-size:clamp(40px,10.5vw,86px);line-height:1;text-align:center;
    display:flex;align-items:center;gap:.35em;flex-wrap:wrap;justify-content:center;
  }
  .problem .blank{
    color:var(--accent-2);min-width:1.1em;display:inline-block;text-align:center;
    border-bottom:4px solid color-mix(in srgb,var(--accent-2) 45%,transparent);
    padding:0 .06em;
  }
  .problem .blank.empty::after{content:"?";color:var(--ink-faint);opacity:.5}

  .answer{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-2);border:2px solid var(--line);border-radius:12px;
    padding:4px 6px 4px 14px;min-width:min(240px,74vw);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .answer:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 15%,transparent)}
  .answer.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg-2))}
  .answer.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg-2));animation:shake .34s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}45%{transform:translateX(7px)}
    70%{transform:translateX(-4px)}88%{transform:translateX(2px)}
  }
  /* The equation's blank already mirrors what you type at full size, so the field
     itself stays deliberately small — it's an affordance, not a second readout. */
  .answer input{
    flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink-dim);
    font-family:var(--mono);font-size:19px;font-weight:600;
    text-align:center;padding:6px 0;letter-spacing:.02em;width:100%;
  }
  .answer input::placeholder{color:var(--ink-faint);opacity:.45}
  .answer input::-webkit-outer-spin-button,.answer input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .go{
    border:0;border-radius:9px;background:var(--accent);color:#04211c;
    width:42px;height:38px;display:grid;place-items:center;flex:none;
    transition:filter .15s,transform .12s;
  }
  html[data-theme="light"] .go{color:#f7fffd}
  .go:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .feedback{
    min-height:26px;font-size:15.5px;font-weight:600;text-align:center;
    display:flex;align-items:center;gap:8px;justify-content:center;
  }
  .feedback.ok{color:var(--good)}
  .feedback.no{color:var(--bad)}
  .feedback .streakpop{
    font-family:var(--mono);font-size:12.5px;background:color-mix(in srgb,var(--accent) 18%,transparent);
    color:var(--accent);border-radius:99px;padding:3px 9px;
  }

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .keypad button{
    background:var(--bg-2);border:1px solid var(--line);border-radius:13px;
    padding:16px 0;font-family:var(--mono);font-size:22px;font-weight:600;
    transition:background .1s,transform .08s,border-color .12s;
  }
  .keypad button:active{transform:scale(.96);background:color-mix(in srgb,var(--accent) 18%,var(--bg-2))}
  .keypad button.util{font-size:16px;color:var(--ink-dim)}
  .keypad button.enter{background:var(--accent);color:#04211c;border-color:transparent}
  html[data-theme="light"] .keypad button.enter{color:#f7fffd}
  @media (min-width:721px){ .keypad{display:none} }

  .quizfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .ghost{
    background:transparent;border:1px solid var(--line);border-radius:11px;
    padding:9px 16px;font-size:13.5px;color:var(--ink-dim);font-weight:600;
    transition:border-color .15s,color .15s;
  }
  .ghost:hover{border-color:var(--bad);color:var(--bad)}
  .ghost.neutral:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- results ---------- */
  .res{display:flex;flex-direction:column;gap:clamp(14px,2.2vw,20px)}
  .scorehead{text-align:center;padding:clamp(22px,4.5vw,40px) 20px}
  .grade{
    font-family:var(--mono);font-size:clamp(56px,15vw,120px);line-height:.92;font-weight:700;
    letter-spacing:-.05em;
  }
  .verdict{font-size:clamp(15px,2.6vw,19px);color:var(--ink-dim);margin-top:10px;font-weight:550}
  .pbnew{
    display:inline-flex;align-items:center;gap:7px;margin-top:14px;
    background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);
    border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:.02em;
  }
  .ring{width:118px;height:118px;margin:0 auto 6px;display:block}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:var(--line-soft)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
  .ring text{font-family:var(--mono);font-size:26px;font-weight:650;fill:var(--ink);text-anchor:middle}

  .review{max-height:min(42vh,340px);overflow:auto;-webkit-overflow-scrolling:touch}
  .review table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14.5px}
  .review th{
    position:sticky;top:0;background:var(--panel);text-align:left;padding:10px 12px;
    font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);border-bottom:1px solid var(--line);font-weight:650;z-index:1;
  }
  .review td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  .review tr:last-child td{border-bottom:0}
  .review .num{color:var(--ink-faint);width:34px}
  .review .yours.wrong{color:var(--bad)}
  .review .corr{color:var(--good)}
  .review td.t{text-align:right;color:var(--ink-faint);font-size:13px}
  .badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good)}
  .badge.no{background:var(--bad)}
  .badge.skip{background:var(--ink-faint)}

  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:460px){.btnrow{grid-template-columns:1fr}}
  .btn{
    border:1px solid var(--line);background:var(--bg-2);border-radius:13px;padding:15px;
    font-size:15px;font-weight:650;transition:transform .12s,border-color .15s,background .15s;
  }
  .btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .btn.primary{background:var(--accent);color:#04211c;border-color:transparent}
  html[data-theme="light"] .btn.primary{color:#f7fffd}

  /* ---------- history ---------- */
  .hist{display:flex;flex-direction:column;gap:12px}
  .histhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .histhead h2{margin:0;font-size:14px;letter-spacing:.04em;font-weight:650}
  .clear{background:none;border:0;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:2px 4px}
  .clear:hover{color:var(--bad)}
  .hlist{display:flex;flex-direction:column;gap:7px;max-height:230px;overflow:auto}
  .hrow{
    display:flex;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--line-soft);
    border-radius:11px;padding:10px 13px;font-size:13.5px;
  }
  .hrow .mode{color:var(--ink-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .sc{font-family:var(--mono);font-weight:650}
  .hrow .when{color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}
  .empty{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:6px 8px;margin:0}
  .pbline{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint)}
  .pbline b{color:var(--accent);font-family:var(--mono)}

  /* ---------- countdown overlay ---------- */
  .cd{
    position:fixed;inset:0;display:grid;place-items:center;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  }
  .cd b{
    font-family:var(--mono);font-size:clamp(90px,26vw,190px);font-weight:700;color:var(--accent);
    letter-spacing:-.05em;animation:pulse .58s cubic-bezier(.2,.9,.25,1);display:block;
  }
  @keyframes pulse{from{transform:scale(.55);opacity:0}60%{opacity:1}to{transform:scale(1);opacity:1}}

  .fadein{animation:fade .32s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .flip{animation:flip .28s cubic-bezier(.2,.85,.25,1) both}
  @keyframes flip{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span><h1>Math Practice Drills</h1></div>
    <button class="iconbtn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound"></button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <!-- ============ SETUP ============ -->
  <main id="setup" class="setup fadein">
    <section class="card pad">
      <p class="label">Operations</p>
      <div class="grid ops" id="ops"></div>
    </section>

    <section class="card pad">
      <p class="label">Difficulty</p>
      <div class="grid diffs" id="diffs"></div>
    </section>

    <section class="card pad">
      <p class="label">Session length</p>
      <div class="rowflex" id="lens"></div>
      <p class="label" style="margin-top:20px">Per-question limit</p>
      <div class="rowflex" id="paces"></div>
    </section>

    <section>
      <button class="start" id="startBtn">Start drill</button>
      <p class="hint">Type your answer and press <kbd>Enter</kbd> · <kbd>-</kbd> for negatives · <kbd>Esc</kbd> to end</p>
    </section>

    <section class="card pad hist">
      <div class="histhead">
        <h2>Recent sessions</h2>
        <button class="clear" id="clearBtn" hidden>Clear</button>
      </div>
      <div class="pbline" id="pbline"></div>
      <div class="hlist" id="hlist"></div>
    </section>
  </main>

  <!-- ============ QUIZ ============ -->
  <main id="quiz" class="quiz" hidden>
    <div class="stats" role="group" aria-label="Live score">
      <div class="stat"><b id="sTime">0:60</b><span>Time</span></div>
      <div class="stat"><b id="sScore">0</b><span>Correct</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Streak</span></div>
      <div class="stat"><b id="sAcc">—</b><span>Accuracy</span></div>
    </div>
    <div class="timer"><i id="bar"></i></div>

    <section class="card qcard" id="qcard">
      <div class="qmeta">
        <span id="qIndex">Question 1</span><span>·</span><em id="qMode">Add</em>
      </div>
      <div class="problem" id="problem" aria-live="off"></div>
      <div class="answer" id="answerBox">
        <input id="input" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="type answer" aria-label="Your answer">
        <button class="go" id="goBtn" aria-label="Submit answer">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <div class="keypad" id="keypad"></div>

    <div class="quizfoot">
      <button class="ghost neutral" id="skipBtn">Skip</button>
      <button class="ghost" id="endBtn">End session</button>
    </div>
  </main>

  <!-- ============ RESULTS ============ -->
  <main id="results" class="res" hidden>
    <section class="card scorehead">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="bg" cx="60" cy="60" r="50"></circle>
        <circle class="fg" id="ringFg" cx="60" cy="60" r="50"
                transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle>
        <text id="ringTxt" x="60" y="70">0%</text>
      </svg>
      <div class="grade" id="grade">0<span style="color:var(--ink-faint)">/0</span></div>
      <div class="verdict" id="verdict"></div>
      <div id="pbWrap"><span class="pbnew" id="pbNew" hidden>★ New personal best</span></div>
    </section>

    <div class="stats">
      <div class="stat"><b id="rAcc">—</b><span>Accuracy</span></div>
      <div class="stat"><b id="rAvg">—</b><span>Avg time</span></div>
      <div class="stat"><b id="rBest">—</b><span>Fastest</span></div>
      <div class="stat"><b id="rStreak">—</b><span>Best streak</span></div>
    </div>

    <section class="card">
      <div class="review" id="review"></div>
    </section>

    <div class="btnrow">
      <button class="btn primary" id="againBtn">Run it again</button>
      <button class="btn" id="backBtn">Change settings</button>
    </div>
  </main>
</div>

<div class="cd" id="cd" hidden><b id="cdNum">3</b></div>
<p class="sr" id="live" aria-live="assertive"></p>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const clamp = (n,a,b) => Math.min(b,Math.max(a,n));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------------- config ---------------- */
const OPS = [
  {id:"add", glyph:"+",  cap:"Add"},
  {id:"sub", glyph:"−",  cap:"Subtract"},
  {id:"mul", glyph:"×",  cap:"Multiply"},
  {id:"div", glyph:"÷",  cap:"Divide"},
];
const DIFFS = [
  {id:1, cap:"Easy",   sub:"1–10"},
  {id:2, cap:"Medium", sub:"2–20"},
  {id:3, cap:"Hard",   sub:"to 99"},
  {id:4, cap:"Expert", sub:"3-term"},
];
const LENS = [
  {kind:"time",  n:60,  cap:"60 sec",  sub:"sprint"},
  {kind:"time",  n:120, cap:"2 min",   sub:"standard"},
  {kind:"time",  n:300, cap:"5 min",   sub:"endurance"},
  {kind:"count", n:20,  cap:"20 Q",    sub:"untimed set"},
];
const PACES = [
  {n:0,  cap:"Off",  sub:"no limit"},
  {n:10, cap:"10 s", sub:"relaxed"},
  {n:5,  cap:"5 s",  sub:"brisk"},
  {n:3,  cap:"3 s",  sub:"blitz"},
];
const GLYPH = {add:"+", sub:"−", mul:"×", div:"÷"};
const NAME  = {add:"Add", sub:"Subtract", mul:"Multiply", div:"Divide"};

const KEY = "mathdrills.v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };

const store = Object.assign({
  ops:["add","sub"], diff:2, lenIdx:0, paceIdx:0,
  theme:null, sound:true, history:[], best:{}
}, load());
if (!Array.isArray(store.ops) || !store.ops.length) store.ops = ["add"];
store.lenIdx  = clamp(store.lenIdx|0, 0, LENS.length-1);
store.paceIdx = clamp(store.paceIdx|0, 0, PACES.length-1);
store.diff    = clamp(store.diff|0, 1, 4);

/* ---------------- theme + sound ---------------- */
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
const SPKON='<svg viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 5v14L7 14.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.4a7.8 7.8 0 0 1 0 11.2"/></svg>';
const SPKOFF='<svg viewBox="0 0 24 24"><path d="M4 9.5h3L11.5 5v14L7 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';

function applyTheme(){
  const dark = store.theme ? store.theme === "dark"
    : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("themeBtn").innerHTML = dark ? SUN : MOON;
  document.querySelector('meta[name=theme-color]').setAttribute("content", dark ? "#0e1116" : "#f4f6fa");
}
function applySound(){ $("soundBtn").innerHTML = store.sound ? SPKON : SPKOFF; }
$("themeBtn").onclick = () => { store.theme = document.documentElement.dataset.theme === "dark" ? "light":"dark"; save(); applyTheme(); };
$("soundBtn").onclick = () => { store.sound = !store.sound; save(); applySound(); if(store.sound) beep(880,.06,.1); };
applyTheme(); applySound();

let ac = null;
function beep(freq, dur=.07, vol=.12, type="sine"){
  if (!store.sound) return;
  try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  } catch {}
}
const sGood = () => { beep(660,.07,.1); setTimeout(()=>beep(990,.09,.09),58); };
const sBad  = () => beep(180,.17,.11,"square");
const sTick = () => beep(1180,.05,.07,"triangle");
const sEnd  = () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,.09),i*105)); };

/* ---------------- problem generator ---------------- */
function ranges(d){
  return {1:[1,10], 2:[2,20], 3:[6,99], 4:[4,60]}[d];
}
function gen(op, d){
  const [lo,hi] = ranges(d);
  if (d === 4) return genExpert(op);
  if (op === "add"){
    const a = rnd(lo,hi), b = rnd(lo,hi);
    return {text:`${a} + ${b}`, ans:a+b, op};
  }
  if (op === "sub"){
    let a = rnd(lo,hi), b = rnd(lo,hi);
    if (b > a) [a,b] = [b,a];                 // keep non-negative
    return {text:`${a} − ${b}`, ans:a-b, op};
  }
  if (op === "mul"){
    const mh = {1:9, 2:12, 3:20}[d];
    const a = rnd(2,mh), b = rnd(2,mh);
    return {text:`${a} × ${b}`, ans:a*b, op};
  }
  // div — always exact
  const dh = {1:9, 2:12, 3:20}[d];
  const b = rnd(2,dh), q = rnd(2,dh);
  return {text:`${b*q} ÷ ${b}`, ans:q, op};
}
function genExpert(op){
  const r = Math.random();
  if (r < .34){                                     // three-term chain
    if (op === "mul" || op === "div"){
      const a = rnd(3,12), b = rnd(3,12), c = rnd(2,9);
      return {text:`${a} × ${b} − ${c}`, ans:a*b-c, op};
    }
    const a = rnd(12,60), b = rnd(8,40);
    // cap the subtrahend at the running total so the answer stays non-negative
    const c = rnd(4, Math.min(25, a+b));
    if (Math.random() < .5) return {text:`${a} + ${b} − ${c}`, ans:a+b-c, op};
    // "a − b + c": order the first pair so the running total never goes negative
    const hi = Math.max(a,b), lo = Math.min(a,b);
    return {text:`${hi} − ${lo} + ${c}`, ans:hi-lo+c, op};
  }
  if (r < .68){                                     // missing operand
    if (op === "mul" || op === "div"){
      const a = rnd(3,15), b = rnd(3,15);
      return {text:`${a} × ⬚ = ${a*b}`, ans:b, op, blank:true};
    }
    const a = rnd(15,80), b = rnd(5,50);
    return {text:`${a} + ⬚ = ${a+b}`, ans:b, op, blank:true};
  }
  // larger single step
  if (op === "mul"){ const a = rnd(11,25), b = rnd(4,19); return {text:`${a} × ${b}`, ans:a*b, op}; }
  if (op === "div"){ const b = rnd(3,15), q = rnd(11,25); return {text:`${b*q} ÷ ${b}`, ans:q, op}; }
  if (op === "sub"){
    let a = rnd(60,199), b = rnd(20,150);
    if (b > a) [a,b] = [b,a];                       // keep the result non-negative
    return {text:`${a} − ${b}`, ans:a-b, op};
  }
  const a = rnd(45,180), b = rnd(45,180); return {text:`${a} + ${b}`, ans:a+b, op};
}
function nextProblem(){
  for (let i=0;i<40;i++){
    const p = gen(pick(store.ops), store.diff);
    if (p.text !== S.lastText) { S.lastText = p.text; return p; }
  }
  return gen(pick(store.ops), store.diff);
}

/* ---------------- setup UI ---------------- */
function buildSetup(){
  $("ops").innerHTML = OPS.map(o =>
    `<button class="chip" data-op="${o.id}" aria-pressed="${store.ops.includes(o.id)}">
       <span class="glyph">${o.glyph}</span><span class="cap">${o.cap}</span></button>`).join("");
  $("diffs").innerHTML = DIFFS.map(d =>
    `<button class="chip ${store.diff===d.id?"sel":""}" data-diff="${d.id}">
       <span class="cap" style="font-size:14px;font-weight:650">${d.cap}</span>
       <span class="sub">${d.sub}</span></button>`).join("");
  $("lens").innerHTML = LENS.map((l,i) =>
    `<button class="seg ${store.lenIdx===i?"sel":""}" data-len="${i}">${l.cap}<small>${l.sub}</small></button>`).join("");
  $("paces").innerHTML = PACES.map((p,i) =>
    `<button class="seg ${store.paceIdx===i?"sel":""}" data-pace="${i}">${p.cap}<small>${p.sub}</small></button>`).join("");
}
$("ops").addEventListener("click", e => {
  const b = e.target.closest("[data-op]"); if (!b) return;
  const id = b.dataset.op, i = store.ops.indexOf(id);
  if (i >= 0){ if (store.ops.length === 1) return; store.ops.splice(i,1); }
  else store.ops.push(id);
  b.setAttribute("aria-pressed", store.ops.includes(id));
  save(); beep(store.ops.includes(id)?720:420,.05,.07);
});
function segHandler(container, attr, key){
  $(container).addEventListener("click", e => {
    const b = e.target.closest(`[data-${attr}]`); if (!b) return;
    store[key] = +b.dataset[attr];
    [...$(container).children].forEach(c => c.classList.toggle("sel", c === b));
    save(); beep(660,.05,.07);
  });
}
segHandler("diffs","diff","diff");
segHandler("lens","len","lenIdx");
segHandler("paces","pace","paceIdx");

/* ---------------- history ---------------- */
const modeLabel = s =>
  `${s.ops.map(o=>NAME[o]).join(" · ")} · ${DIFFS.find(d=>d.id===s.diff).cap} · ${LENS[s.lenIdx].cap}`;
const bestKey = s => `${[...s.ops].sort().join("")}|${s.diff}|${s.lenIdx}`;
function ago(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if (m < 1) return "just now";
  if (m < 60) return m+"m ago";
  const h = Math.floor(m/60); if (h < 24) return h+"h ago";
  const d = Math.floor(h/24); return d < 7 ? d+"d ago" : new Date(ts).toLocaleDateString();
}
function renderHistory(){
  const h = store.history || [];
  $("clearBtn").hidden = !h.length;
  $("hlist").innerHTML = h.length
    ? h.slice(0,8).map(r => `<div class="hrow">
        <span class="sc" style="color:${r.acc>=90?"var(--good)":r.acc>=70?"var(--warn)":"var(--bad)"}">${r.correct}/${r.total}</span>
        <span class="mode">${r.label}</span>
        <span class="when">${ago(r.ts)}</span></div>`).join("")
    : `<p class="empty">No sessions yet — your results will show up here.</p>`;
  // with no sessions at all the empty state already says it; a second "no record" line is noise
  const bk = bestKey(store), b = (store.best||{})[bk];
  const pb = $("pbline");
  pb.hidden = !h.length;
  pb.innerHTML = b
    ? `<span>Best for this setup: <b>${b.correct} correct</b></span><span>·</span><span>Accuracy <b>${b.acc}%</b></span>`
    : `<span>No record yet for this setup — set one.</span>`;
}
$("clearBtn").onclick = () => {
  store.history = []; store.best = {}; save(); renderHistory();
};

/* ---------------- session state ---------------- */
const S = {
  active:false, log:[], correct:0, streak:0, bestStreak:0, i:0,
  cur:null, deadline:0, qStart:0, paceEnd:0, raf:0, lastText:"", locked:false, warned:0,
};

function show(which){
  ["setup","quiz","results"].forEach(id => $(id).hidden = id !== which);
  $(which).classList.remove("fadein"); void $(which).offsetWidth; $(which).classList.add("fadein");
}

/* ---------------- keypad ---------------- */
$("keypad").innerHTML =
  [1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("") +
  `<button class="util" data-k="-">±</button><button data-k="0">0</button>` +
  `<button class="enter" data-k="ent">⏎</button>`;
$("keypad").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  const k = b.dataset.k, inp = $("input");
  if (k === "ent") return submit();
  if (k === "-") inp.value = inp.value.startsWith("-") ? inp.value.slice(1) : "-"+inp.value;
  else inp.value += k;
  beep(950,.03,.05,"triangle");
  paint();
});

/* ---------------- quiz flow ---------------- */
function startCountdown(){
  const el = $("cd"), num = $("cdNum");
  el.hidden = false; let n = 3;
  num.textContent = n; num.style.animation="none"; void num.offsetWidth; num.style.animation="";
  sTick();
  const iv = setInterval(() => {
    n--;
    if (n === 0){
      num.textContent = "GO";
      num.style.animation="none"; void num.offsetWidth; num.style.animation="";
      beep(1046,.14,.11);
      setTimeout(()=>{ el.hidden = true; run(); }, 420);
      clearInterval(iv);
      return;
    }
    num.textContent = n; num.style.animation="none"; void num.offsetWidth; num.style.animation="";
    sTick();
  }, 620);
}
$("startBtn").onclick = () => { beep(760,.07,.1); startCountdown(); };

function run(){
  Object.assign(S,{active:true,log:[],correct:0,streak:0,bestStreak:0,i:0,lastText:"",locked:false,warned:0});
  const L = LENS[store.lenIdx];
  S.startedAt = Date.now();
  S.deadline = L.kind === "time" ? S.startedAt + L.n*1000 : Infinity;
  show("quiz");
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  updateStats();
  serve();
  tick();
  if (!isTouch()) $("input").focus();
}
const isTouch = () => matchMedia("(hover:none)").matches || innerWidth < 721;

function serve(){
  S.cur = nextProblem();
  S.qStart = performance.now();
  const pace = PACES[store.paceIdx].n;
  S.paceEnd = pace ? Date.now() + pace*1000 : Infinity;
  S.locked = false;

  const p = $("problem");
  const SLOT = '<span class="blank empty" id="blankSlot"></span>';
  p.innerHTML = S.cur.blank
    ? escapeHtml(S.cur.text).replace("⬚", SLOT)
    : escapeHtml(S.cur.text) + ' <span style="color:var(--ink-faint)">=</span> ' + SLOT;
  p.classList.remove("flip"); void p.offsetWidth; p.classList.add("flip");

  $("qIndex").textContent = LENS[store.lenIdx].kind === "count"
    ? `Question ${S.i+1} of ${LENS[store.lenIdx].n}` : `Question ${S.i+1}`;
  $("qMode").textContent = NAME[S.cur.op];
  const inp = $("input"); inp.value = ""; inp.disabled = false;
  $("answerBox").className = "answer";
  if (!isTouch()) inp.focus();
  paint();
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function paint(){
  const slot = $("blankSlot"); if (!slot) return;
  const v = $("input").value.trim();
  slot.textContent = v;
  slot.classList.toggle("empty", v === "");
}
$("input").addEventListener("input", () => {
  const inp = $("input");
  inp.value = inp.value.replace(/[^\d-]/g,"").replace(/(?!^)-/g,"").slice(0,7);
  paint();
});
$("input").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submit(); } });
$("goBtn").onclick = submit;
$("skipBtn").onclick = () => { if (S.active && !S.locked) resolve(null, true); };
$("endBtn").onclick = () => { if (S.active) finish("ended"); };

function submit(){
  if (!S.active || S.locked) return;
  const raw = $("input").value.trim();
  if (raw === "" || raw === "-") { nudge(); return; }
  resolve(parseInt(raw,10), false);
}
function nudge(){
  const box = $("answerBox");
  box.classList.remove("no"); void box.offsetWidth; box.classList.add("no");
  setTimeout(()=>box.classList.remove("no"), 360);
  if (!isTouch()) $("input").focus();
}

function resolve(val, skipped){
  S.locked = true;
  const ms = performance.now() - S.qStart;
  const ok = !skipped && val === S.cur.ans;
  S.log.push({text:S.cur.text, ans:S.cur.ans, given:skipped?null:val, ok, skipped, ms});
  S.i++;

  const box = $("answerBox"), fb = $("feedback");
  if (ok){
    S.correct++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    box.classList.add("ok");
    const milestone = S.streak >= 3 && S.streak % 3 === 0;
    fb.className = "feedback ok";
    fb.innerHTML = `${pick(["Correct","Nice","Yes","Got it","Sharp"])}${
      milestone ? ` <span class="streakpop">${S.streak} in a row</span>` : ""}`;
    sGood();
    if (S.log.length) { const s = $("blankSlot"); if (s) s.style.color = "var(--good)"; }
  } else {
    S.streak = 0;
    box.classList.add("no");
    fb.className = "feedback no";
    fb.innerHTML = skipped
      ? `Skipped — answer was <b style="font-family:var(--mono)">${S.cur.ans}</b>`
      : `Answer: <b style="font-family:var(--mono)">${S.cur.ans}</b>`;
    sBad();
    const s = $("blankSlot");
    if (s) { s.textContent = S.cur.ans; s.classList.remove("empty"); s.style.color = "var(--bad)"; }
  }
  $("live").textContent = ok ? "Correct" : `Incorrect, answer ${S.cur.ans}`;
  updateStats();

  const L = LENS[store.lenIdx];
  if (L.kind === "count" && S.i >= L.n){ setTimeout(()=>finish("done"), 620); return; }
  setTimeout(() => {
    if (!S.active) return;
    fb.textContent = ""; fb.className = "feedback";
    serve();
  }, ok ? 400 : 900);
}

function updateStats(){
  $("sScore").textContent = S.correct;
  $("sStreak").textContent = S.streak;
  const attempted = S.log.filter(r => !r.skipped).length;
  const acc = attempted ? Math.round(100*S.correct/attempted) : null;
  const el = $("sAcc");
  el.textContent = acc === null ? "—" : acc+"%";
  el.className = acc === null ? "" : acc >= 90 ? "good" : acc >= 70 ? "" : "bad";
}

// countdowns round up (2.4s left reads 0:03, hits 0:00 only at zero);
// count-ups round down so a fresh session starts at 0:00.
function fmtTime(ms, up){
  const t = Math.max(0, up ? Math.floor(ms/1000) : Math.ceil(ms/1000));
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
}
function tick(){
  if (!S.active) return;
  const L = LENS[store.lenIdx];
  const now = Date.now();

  if (L.kind === "time"){
    const left = S.deadline - now, total = L.n*1000;
    const t = $("sTime"); t.textContent = fmtTime(left);
    const frac = clamp(left/total, 0, 1);
    const bar = $("bar");
    bar.style.transform = `scaleX(${frac})`;
    const cls = left <= 5000 ? "bad" : left <= 10000 ? "warn" : "";
    bar.className = cls; t.className = cls;
    const secs = Math.ceil(left/1000);
    if (secs <= 3 && secs >= 1 && S.warned !== secs){ S.warned = secs; sTick(); }
    if (left <= 0){ finish("time"); return; }
  } else {
    // untimed set: bar tracks progress through the set, clock counts up
    const t = $("sTime");
    t.textContent = fmtTime(now - S.startedAt, true);
    t.className = "";
    const bar = $("bar");
    bar.style.transform = `scaleX(${clamp(S.i / L.n, 0, 1)})`;
    bar.className = "";
  }

  // per-question limit
  if (!S.locked && S.paceEnd !== Infinity){
    const pleft = S.paceEnd - now;
    if (pleft <= 0){ resolve(null, true); }
  }
  S.raf = requestAnimationFrame(tick);
}

/* ---------------- finish ---------------- */
function finish(reason){
  if (!S.active) return;
  S.active = false;
  cancelAnimationFrame(S.raf);
  $("input").disabled = true;

  const total = S.log.length;
  const attempted = S.log.filter(r => !r.skipped).length;
  const acc = attempted ? Math.round(100*S.correct/attempted) : 0;
  const times = S.log.filter(r => r.ok).map(r => r.ms);
  const avg = times.length ? times.reduce((a,b)=>a+b,0)/times.length : 0;
  const fast = times.length ? Math.min(...times) : 0;

  $("grade").innerHTML = `${S.correct}<span style="color:var(--ink-faint)">/${total || 0}</span>`;
  $("rAcc").textContent   = attempted ? acc+"%" : "—";
  $("rAcc").className     = attempted ? (acc>=90?"good":acc>=70?"":"bad") : "";
  $("rAvg").textContent   = times.length ? (avg/1000).toFixed(1)+"s" : "—";
  $("rBest").textContent  = times.length ? (fast/1000).toFixed(1)+"s" : "—";
  $("rStreak").textContent= S.bestStreak;

  const pct = attempted ? acc : 0;
  const C = 2*Math.PI*50;
  const fg = $("ringFg");
  fg.setAttribute("stroke-dasharray", C.toFixed(2));
  fg.setAttribute("stroke-dashoffset", C.toFixed(2));
  fg.style.stroke = pct>=90 ? "var(--good)" : pct>=70 ? "var(--accent)" : "var(--bad)";
  $("ringTxt").textContent = pct+"%";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fg.setAttribute("stroke-dashoffset", (C*(1-pct/100)).toFixed(2));
  }));

  $("verdict").textContent = !total
    ? "No questions answered."
    : reason === "time" ? verdictFor(acc, S.correct)
    : reason === "ended" ? "Session ended early — " + verdictFor(acc, S.correct).toLowerCase()
    : verdictFor(acc, S.correct);

  // review table
  $("review").innerHTML = total ? `<table>
    <thead><tr><th></th><th>Problem</th><th>Your answer</th><th>Correct</th><th style="text-align:right">Time</th></tr></thead>
    <tbody>${S.log.map((r,i)=>`<tr>
      <td class="num"><span class="badge ${r.ok?"":r.skipped?"skip":"no"}"></span></td>
      <td>${escapeHtml(r.text.replace("⬚","__"))}</td>
      <td class="yours ${r.ok?"":"wrong"}">${r.skipped?"—":r.given}</td>
      <td class="corr">${r.ok?"":r.ans}</td>
      <td class="t">${(r.ms/1000).toFixed(1)}s</td>
    </tr>`).join("")}</tbody></table>`
    : `<p class="empty" style="padding:26px">Nothing to review.</p>`;

  // records + history
  let isPB = false;
  if (total){
    const bk = bestKey(store);
    store.best = store.best || {};
    const prev = store.best[bk];
    const beat = S.correct > prev?.correct || (S.correct === prev?.correct && acc > prev.acc);
    if (!prev || beat){
      store.best[bk] = {correct:S.correct, acc, ts:Date.now()};
      // only a genuine improvement over an existing record earns the badge
      isPB = !!prev && beat;
    }
    store.history = [{ts:Date.now(), correct:S.correct, total, acc,
      label:modeLabel(store), ops:[...store.ops], diff:store.diff, lenIdx:store.lenIdx}]
      .concat(store.history||[]).slice(0,40);
    save();
  }
  $("pbNew").hidden = !isPB;
  renderHistory();
  show("results");
  sEnd();
  $("live").textContent = `Session complete. ${S.correct} of ${total} correct, ${acc}% accuracy.`;
}
function verdictFor(acc, n){
  if (!n) return "Every run counts — try an easier setting.";
  if (acc === 100) return n >= 15 ? "Flawless run at speed. Bump the difficulty." : "Perfect accuracy — now go for volume.";
  if (acc >= 90) return "Excellent control. Tighten the per-question limit.";
  if (acc >= 75) return "Solid — accuracy is there, keep building speed.";
  if (acc >= 55) return "Good progress. Slow down slightly for cleaner reps.";
  return "Drop a level and rebuild the fundamentals.";
}

$("againBtn").onclick = () => { beep(760,.07,.1); startCountdown(); };
$("backBtn").onclick  = () => { show("setup"); renderHistory(); beep(520,.05,.08); };

/* ---------------- global keys ---------------- */
addEventListener("keydown", e => {
  if (!$("cd").hidden) return;
  if (S.active){
    if (e.key === "Escape"){ e.preventDefault(); finish("ended"); return; }
    if (e.key === "Tab" && !e.shiftKey) return;
    if (/^[0-9-]$/.test(e.key) && document.activeElement !== $("input")){
      $("input").focus();
    }
    return;
  }
  if (e.key === "Enter" && (!$("setup").hidden || !$("results").hidden)){
    e.preventDefault(); startCountdown();
  }
});
$("qcard").addEventListener("pointerdown", e => {
  if (!isTouch() && S.active && !e.target.closest("button")) $("input").focus();
});

/* ---------------- boot ---------------- */
buildSetup();
renderHistory();
})();
</script>
