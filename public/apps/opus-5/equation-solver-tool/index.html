<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation Solver — Symbolic Working &amp; Derivations</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<style>
  :root{
    --paper:#fbfaf7;
    --ink:#16150f;
    --ink-soft:#4a4740;
    --ink-faint:#8a867b;
    --rule:#ddd8cb;
    --rule-soft:#e9e5da;
    --accent:#7a2e1e;
    --accent-soft:#f0e6e0;
    --mark:#f5efdd;
    --panel:#ffffff;
    --shadow:0 1px 2px rgba(30,25,10,.05),0 8px 28px -18px rgba(30,25,10,.35);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14140f;--ink:#eceadf;--ink-soft:#b3afa0;--ink-faint:#7d7a6d;
      --rule:#33322a;--rule-soft:#26251f;--accent:#d99a7a;--accent-soft:#2b201a;
      --mark:#2a2617;--panel:#1a1a14;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -18px rgba(0,0,0,.8);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--serif);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 28px 96px}

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:2px solid var(--ink);
    margin-top:52px;padding-bottom:14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .masthead h1{
    font-size:33px;line-height:1.1;margin:0;font-weight:600;letter-spacing:-.01em;
  }
  .masthead .sub{
    font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);font-family:var(--mono);margin-top:9px;
  }
  .masthead .folio{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--ink-faint);text-align:right;text-transform:uppercase;padding-bottom:3px;
  }

  /* ---------- input ---------- */
  .console{margin-top:34px}
  label.field-label{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px;
  }
  .inputrow{display:flex;gap:10px;align-items:stretch}
  #eq{
    flex:1;min-width:0;font-family:var(--mono);font-size:18px;
    padding:15px 16px;border:1px solid var(--rule);border-radius:3px;
    background:var(--panel);color:var(--ink);outline:none;
    transition:border-color .16s,box-shadow .16s;
  }
  #eq:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #eq::placeholder{color:var(--ink-faint);font-style:italic}
  button{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
    border:1px solid var(--rule);background:var(--panel);color:var(--ink-soft);
    padding:8px 14px;border-radius:3px;cursor:pointer;
    transition:background .14s,color .14s,border-color .14s;white-space:nowrap;
  }
  button:hover{border-color:var(--ink-soft);color:var(--ink)}
  button:active{transform:translateY(.5px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{
    background:var(--ink);color:var(--paper);border-color:var(--ink);padding:8px 26px;
  }
  button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .toolbar{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    margin-top:12px;padding-bottom:2px;
  }
  .toolbar .spacer{flex:1}
  .hint{
    font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.03em;
  }
  .hint kbd{
    font-family:var(--mono);border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:3px;padding:1px 4px;font-size:10px;color:var(--ink-soft);
  }

  /* ---------- examples ---------- */
  .examples{margin-top:22px;border-top:1px solid var(--rule-soft);padding-top:14px}
  .examples .cap{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:10px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:3px;
    border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
    cursor:pointer;letter-spacing:0;text-transform:none;
  }
  .chip:hover{background:var(--mark);border-color:var(--ink-faint);color:var(--ink)}

  /* ---------- results ---------- */
  #out{margin-top:40px}
  .empty{
    border:1px dashed var(--rule);border-radius:4px;padding:44px 28px;text-align:center;
    color:var(--ink-faint);font-style:italic;
  }
  .error{
    border-left:3px solid var(--accent);background:var(--accent-soft);
    padding:15px 18px;border-radius:0 3px 3px 0;
  }
  .error strong{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:6px;color:var(--accent);font-weight:600;
  }
  .error .detail{font-family:var(--mono);font-size:13.5px;color:var(--ink-soft);line-height:1.5}
  .error .caret{color:var(--accent);white-space:pre;display:block;margin-top:4px}

  section.block{margin-bottom:40px}
  h2.rubric{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:400;margin:0 0 14px;
    padding-bottom:7px;border-bottom:1px solid var(--rule);
  }

  /* problem restatement */
  .statement{
    background:var(--panel);border:1px solid var(--rule-soft);border-radius:4px;
    padding:22px 26px;box-shadow:var(--shadow);text-align:center;
  }
  .statement .kind{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:12px;
  }
  .statement .math{font-size:1.28em}

  /* answer */
  .answer{
    border:1px solid var(--rule);border-left:3px solid var(--accent);
    background:var(--panel);border-radius:0 4px 4px 0;padding:20px 24px;box-shadow:var(--shadow);
  }
  .answer .roots{display:flex;flex-direction:column;gap:11px}
  .answer .root{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:11px;border-bottom:1px dotted var(--rule-soft);min-height:30px;
  }
  .answer .root:last-child{border-bottom:0;padding-bottom:0}
  .answer .root .idx{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
    min-width:24px;letter-spacing:.06em;
  }
  .answer .root .val{font-size:1.16em}
  .answer .root .approx{
    font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-left:auto;
  }
  .answer .note{
    font-size:14px;color:var(--ink-soft);font-style:italic;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--rule-soft);
  }

  /* steps */
  ol.steps{list-style:none;margin:0;padding:0;counter-reset:step}
  ol.steps>li{
    counter-increment:step;position:relative;
    padding:0 0 22px 52px;border-left:1px solid var(--rule);margin-left:11px;
  }
  ol.steps>li:last-child{border-left-color:transparent;padding-bottom:4px}
  ol.steps>li::before{
    content:counter(step);position:absolute;left:-11.5px;top:1px;
    width:23px;height:23px;border-radius:50%;
    background:var(--paper);border:1px solid var(--rule);color:var(--ink-faint);
    font-family:var(--mono);font-size:10.5px;display:flex;align-items:center;justify-content:center;
  }
  ol.steps>li.key::before{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .step-head{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);padding-top:3px;
  }
  .step-why{margin:7px 0 0;color:var(--ink-soft);font-size:15.5px;line-height:1.55}
  .step-math{
    margin-top:11px;padding:13px 18px;background:var(--panel);
    border:1px solid var(--rule-soft);border-radius:3px;overflow-x:auto;
  }
  .step-math.plain{
    font-family:var(--mono);font-size:14px;white-space:pre-wrap;color:var(--ink);
  }

  /* verification table */
  table.verify{width:100%;border-collapse:collapse;font-size:14.5px}
  table.verify th{
    text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:400;
    padding:0 12px 8px 0;border-bottom:1px solid var(--rule);
  }
  table.verify td{
    padding:10px 12px 10px 0;border-bottom:1px solid var(--rule-soft);
    font-family:var(--mono);font-size:13px;color:var(--ink-soft);vertical-align:middle;
  }
  table.verify td.sub{color:var(--ink);font-family:var(--serif);font-size:15px}
  .pass{color:#2f6b3d;font-weight:600}
  .fail{color:var(--accent);font-weight:600}
  @media (prefers-color-scheme: dark){ .pass{color:#7fbf8c} }

  /* plot */
  .plotwrap{
    background:var(--panel);border:1px solid var(--rule-soft);border-radius:4px;
    padding:14px;box-shadow:var(--shadow);
  }
  .plotwrap svg{display:block;width:100%;height:auto}
  .plotcap{
    font-family:var(--mono);font-size:11px;color:var(--ink-faint);
    text-align:center;margin-top:9px;letter-spacing:.04em;
  }

  footer{
    margin-top:64px;padding-top:16px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  footer a{color:inherit}

  .katex{font-size:1.04em}
  .katex-display{margin:0}
  @media print{
    body{background:#fff}
    .console,.examples,.toolbar,footer,.plot-skip{display:none!important}
    section.block{break-inside:avoid}
    .statement,.answer,.plotwrap{box-shadow:none}
  }
  @media (max-width:620px){
    .wrap{padding:0 18px 64px}
    .masthead h1{font-size:26px}
    .masthead .folio{display:none}
    .inputrow{flex-direction:column}
    ol.steps>li{padding-left:40px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Equation Solver</h1>
      <div class="sub">Symbolic Working &amp; Annotated Derivations</div>
    </div>
    <div class="folio" id="folio">Sheet&nbsp;—</div>
  </header>

  <div class="console">
    <label class="field-label" for="eq">Enter an equation or expression</label>
    <div class="inputrow">
      <input id="eq" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             placeholder="e.g.  2x^2 - 5x - 3 = 0" aria-describedby="hint">
      <button class="primary" id="solve">Solve</button>
    </div>
    <div class="toolbar">
      <button id="copy" title="Copy the full derivation as Markdown">Copy Markdown</button>
      <button id="dl-md" title="Download as a Markdown file">Export .md</button>
      <button id="dl-txt" title="Download as plain text">Export .txt</button>
      <button id="print" title="Print or save as PDF">Print / PDF</button>
      <span class="spacer"></span>
      <span class="hint" id="hint"><kbd>Enter</kbd> to solve</span>
    </div>
  </div>

  <div class="examples">
    <div class="cap">Worked examples</div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="out" aria-live="polite"></main>

  <footer>
    <span>Equation Solver — exact arithmetic over ℚ, radical &amp; complex forms preserved</span>
    <span id="engine-note">Typeset with KaTeX</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script>
"use strict";
/* ============================================================================
   Equation Solver
   ---------------------------------------------------------------------------
   A small computer-algebra core built for one purpose: every transformation it
   performs is recorded, so the derivation shown to the reader is the actual
   sequence of operations taken — not a narrative written after the fact.

   Layout:
     1. Rational  — exact arithmetic over Q (BigInt numerator/denominator)
     2. Lexer / Parser  -> AST
     3. Polynomial  — dense Rational coefficient vectors, in one unknown
     4. Expand      — AST -> Polynomial (or "not polynomial")
     5. Solvers     — linear, quadratic, cubic+ by rational roots & factoring
     6. Numeric     — Newton/bisection fallback for non-polynomial equations
     7. Systems     — 2x2 and 3x3 linear systems by elimination
     8. Rendering   — LaTeX generation, KaTeX typesetting, export
   ========================================================================== */

/* ---------------------------------------------------------------- 1. Rational */
const bigAbs = (a) => (a < 0n ? -a : a);
function bigGcd(a, b){ a = bigAbs(a); b = bigAbs(b); while (b) { [a, b] = [b, a % b]; } return a; }

class Rat {
  constructor(n, d = 1n){
    n = BigInt(n); d = BigInt(d);
    if (d === 0n) throw new MathError("Division by zero.");
    if (d < 0n) { n = -n; d = -d; }
    const g = bigGcd(n, d) || 1n;
    this.n = n / g; this.d = d / g;
  }
  static of(x){ return x instanceof Rat ? x : new Rat(x); }
  /** Parse a decimal literal exactly: "1.25" -> 5/4, never a float round-trip. */
  static fromDecimal(s){
    const m = /^(\d*)(?:\.(\d*))?$/.exec(s);
    if (!m) throw new MathError("Malformed number: " + s);
    const int = m[1] || "0", frac = m[2] || "";
    return new Rat(BigInt(int + frac), 10n ** BigInt(frac.length));
  }
  add(o){ o = Rat.of(o); return new Rat(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o){ o = Rat.of(o); return new Rat(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o){ o = Rat.of(o); return new Rat(this.n * o.n, this.d * o.d); }
  div(o){
    o = Rat.of(o);
    if (o.isZero()) throw new MathError("Division by zero.");
    return new Rat(this.n * o.d, this.d * o.n);
  }
  neg(){ return new Rat(-this.n, this.d); }
  pow(k){
    k = BigInt(k);
    if (k < 0n) { if (this.isZero()) throw new MathError("Division by zero."); return new Rat(this.d ** -k, this.n ** -k); }
    return new Rat(this.n ** k, this.d ** k);
  }
  isZero(){ return this.n === 0n; }
  isOne(){ return this.n === 1n && this.d === 1n; }
  isInt(){ return this.d === 1n; }
  isNeg(){ return this.n < 0n; }
  cmp(o){ o = Rat.of(o); const l = this.n * o.d, r = o.n * this.d; return l < r ? -1 : l > r ? 1 : 0; }
  eq(o){ return this.cmp(o) === 0; }
  abs(){ return this.isNeg() ? this.neg() : this; }
  num(){ return Number(this.n) / Number(this.d); }
  toString(){ return this.isInt() ? this.n.toString() : `${this.n}/${this.d}`; }
  tex(){
    if (this.isInt()) return this.n.toString();
    const s = this.isNeg() ? "-" : "";
    return `${s}\\tfrac{${bigAbs(this.n)}}{${this.d}}`;
  }
  /** Parenthesised where a bare fraction would bind wrongly, e.g. inside a product. */
  texAtom(){ return this.isInt() && !this.isNeg() ? this.n.toString() : `\\left(${this.tex()}\\right)`; }
}
const R0 = new Rat(0n), R1 = new Rat(1n), R2 = new Rat(2n);

class MathError extends Error {
  constructor(msg, pos = -1){ super(msg); this.pos = pos; }
}

/* ------------------------------------------------------- 2. Lexer and parser */
const FUNCS = {
  sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  ln: Math.log, log: (x) => Math.log10(x), log2: Math.log2,
  exp: Math.exp
};
const CONSTS = { pi: Math.PI, "π": Math.PI, e: Math.E, tau: Math.PI * 2 };

function tokenize(src){
  const T = [];
  let i = 0;
  const isDigit = (c) => c >= "0" && c <= "9";
  const isAlpha = (c) => /[A-Za-zπθα-ω]/.test(c);
  while (i < src.length) {
    const c = src[i];
    if (c === " " || c === "\t") { i++; continue; }
    if (isDigit(c) || (c === "." && isDigit(src[i + 1]))) {
      let j = i;
      while (j < src.length && (isDigit(src[j]) || src[j] === ".")) j++;
      const raw = src.slice(i, j);
      if ((raw.match(/\./g) || []).length > 1) throw new MathError(`Malformed number "${raw}".`, i);
      T.push({ t: "num", v: raw, p: i }); i = j; continue;
    }
    if (isAlpha(c)) {
      let j = i;
      while (j < src.length && (isAlpha(src[j]) || isDigit(src[j]))) j++;
      let word = src.slice(i, j);
      // Longest-match a known function or constant; otherwise the run is a
      // product of single-letter unknowns ("xy" -> x*y), the usual convention.
      const lower = word.toLowerCase();
      if (FUNCS[lower] && src[j] === "(") { T.push({ t: "fn", v: lower, p: i }); i = j; continue; }
      if (CONSTS[lower] !== undefined && word.length > 1) { T.push({ t: "const", v: lower, p: i }); i = j; continue; }
      for (const ch of word) {
        if (CONSTS[ch] !== undefined && ch !== "e") T.push({ t: "const", v: ch, p: i });
        else T.push({ t: "var", v: ch, p: i });
      }
      i = j; continue;
    }
    if ("+-*/^()=,".includes(c)) { T.push({ t: c, p: i }); i++; continue; }
    if (c === "×" || c === "·") { T.push({ t: "*", p: i }); i++; continue; }
    if (c === "÷") { T.push({ t: "/", p: i }); i++; continue; }
    if (c === "−" || c === "–" || c === "—") { T.push({ t: "-", p: i }); i++; continue; }
    if (c === "[" || c === "{") { T.push({ t: "(", p: i }); i++; continue; }
    if (c === "]" || c === "}") { T.push({ t: ")", p: i }); i++; continue; }
    if (c === "²") { T.push({ t: "^", p: i }); T.push({ t: "num", v: "2", p: i }); i++; continue; }
    if (c === "³") { T.push({ t: "^", p: i }); T.push({ t: "num", v: "3", p: i }); i++; continue; }
    if (c === "√") { T.push({ t: "fn", v: "sqrt", p: i, bare: true }); i++; continue; }
    throw new MathError(`Unexpected character "${c}".`, i);
  }
  T.push({ t: "eof", p: src.length });
  return T;
}

/* Recursive descent.
   equation := expr ('=' expr)*
   expr     := term (('+'|'-') term)*
   term     := unary (('*'|'/'|implicit) unary)*
   unary    := ('-'|'+') unary | power
   power    := atom ('^' unary)?      -- right associative
   atom     := num | var | const | fn '(' expr ')' | '(' expr ')'                */
function parse(src){
  const T = tokenize(src);
  let k = 0;
  const peek = () => T[k];
  const at = (t) => T[k].t === t;
  const eat = (t) => { if (!at(t)) throw new MathError(`Expected "${t}".`, T[k].p); return T[k++]; };

  function atom(){
    const tk = peek();
    if (tk.t === "num") { k++; return { k: "num", v: Rat.fromDecimal(tk.v), p: tk.p }; }
    if (tk.t === "var") { k++; return { k: "var", v: tk.v, p: tk.p }; }
    if (tk.t === "const") { k++; return { k: "const", v: tk.v, p: tk.p }; }
    if (tk.t === "fn") {
      k++;
      if (tk.bare && !at("(")) return { k: "fn", f: tk.v, a: power(), p: tk.p }; // √x
      eat("("); const a = expr(); eat(")");
      return { k: "fn", f: tk.v, a, p: tk.p };
    }
    if (tk.t === "(") { k++; const e = expr(); eat(")"); return e; }
    if (tk.t === "eof") throw new MathError("Unexpected end of input — the expression is incomplete.", tk.p);
    throw new MathError(`Unexpected "${tk.t === "num" || tk.t === "var" ? tk.v : tk.t}".`, tk.p);
  }
  function power(){
    const base = atom();
    if (at("^")) { k++; return { k: "pow", a: base, b: unary(), p: base.p }; }
    return base;
  }
  function unary(){
    if (at("-")) { const p = T[k++].p; return { k: "neg", a: unary(), p }; }
    if (at("+")) { k++; return unary(); }
    return power();
  }
  /** Juxtaposition means multiplication: 2x, 3(x+1), (x+1)(x-1), 2sin(x). */
  const startsAtom = () => ["num", "var", "const", "fn", "("].includes(peek().t);
  function term(){
    let left = unary();
    for (;;) {
      if (at("*")) { k++; left = { k: "mul", a: left, b: unary(), p: left.p }; }
      else if (at("/")) { k++; left = { k: "div", a: left, b: unary(), p: left.p }; }
      else if (startsAtom()) { left = { k: "mul", a: left, b: unary(), p: left.p, implicit: true }; }
      else return left;
    }
  }
  function expr(){
    let left = term();
    while (at("+") || at("-")) {
      const op = T[k++].t;
      const right = term();
      left = { k: op === "+" ? "add" : "sub", a: left, b: right, p: left.p };
    }
    return left;
  }

  const parts = [expr()];
  while (at("=")) { k++; parts.push(expr()); }
  if (!at("eof")) throw new MathError(`Unexpected "${peek().t}" — check for a stray operator or bracket.`, peek().p);
  return parts;
}

/* Free variables, in order of first appearance. */
function varsOf(node, acc = []){
  if (!node) return acc;
  if (node.k === "var" && !acc.includes(node.v)) acc.push(node.v);
  for (const key of ["a", "b"]) if (node[key]) varsOf(node[key], acc);
  return acc;
}

/* `e` is ambiguous: an unknown in "e = mc^2", Euler's number in "e^x = 5".
   Resolve it to the constant only when a genuine other unknown is present —
   then the reading is unambiguous, and it is the one the writer intended. */
function resolveEuler(node){
  const vs = varsOf(node);
  if (!vs.includes("e") || vs.length < 2) return false;
  let changed = false;
  (function walk(n){
    if (!n) return;
    for (const key of ["a", "b"]) {
      const child = n[key];
      if (!child) continue;
      if (child.k === "var" && child.v === "e") { n[key] = { k: "const", v: "e", p: child.p }; changed = true; }
      else walk(child);
    }
  })(node);
  return changed;
}
function hasNode(node, pred){
  if (!node) return false;
  if (pred(node)) return true;
  return hasNode(node.a, pred) || hasNode(node.b, pred);
}

/* ------------------------------------------------------------ 3. Polynomials */
/* Dense coefficient array, index = degree: [c0, c1, c2] === c0 + c1 x + c2 x^2 */
const P = {
  zero: () => [],
  const: (r) => (r.isZero() ? [] : [r]),
  x: () => [R0, R1],
  trim(p){ const q = p.slice(); while (q.length && q[q.length - 1].isZero()) q.pop(); return q; },
  deg(p){ return P.trim(p).length - 1; },
  get(p, i){ return p[i] || R0; },
  add(a, b){
    const out = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) out.push(P.get(a, i).add(P.get(b, i)));
    return P.trim(out);
  },
  sub(a, b){
    const out = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) out.push(P.get(a, i).sub(P.get(b, i)));
    return P.trim(out);
  },
  neg(a){ return a.map((c) => c.neg()); },
  mul(a, b){
    if (!a.length || !b.length) return [];
    const out = Array(a.length + b.length - 1).fill(R0);
    for (let i = 0; i < a.length; i++)
      for (let j = 0; j < b.length; j++) out[i + j] = out[i + j].add(a[i].mul(b[j]));
    return P.trim(out);
  },
  scale(a, r){ return P.trim(a.map((c) => c.mul(r))); },
  pow(a, n){ let out = [R1]; for (let i = 0; i < n; i++) out = P.mul(out, a); return out; },
  evalRat(p, x){ let s = R0; for (let i = p.length - 1; i >= 0; i--) s = s.mul(x).add(p[i]); return s; },
  evalNum(p, x){ let s = 0; for (let i = p.length - 1; i >= 0; i--) s = s * x + p[i].num(); return s; },
  deriv(p){ return P.trim(p.slice(1).map((c, i) => c.mul(new Rat(BigInt(i + 1))))); },
  /** Synthetic division by (x - r). Returns null when r is not a root. */
  divideRoot(p, r){
    const n = p.length - 1, q = Array(n).fill(R0);
    let carry = p[n];
    for (let i = n - 1; i >= 0; i--) { q[i] = carry; carry = p[i].add(carry.mul(r)); }
    return carry.isZero() ? P.trim(q) : null;
  },
  /** Multiply through by the LCM of denominators, then divide by the content. */
  primitive(p){
    if (!p.length) return { poly: p, factor: R1 };
    let lcm = 1n;
    for (const c of p) lcm = (lcm / bigGcd(lcm, c.d)) * c.d;
    const ints = p.map((c) => (c.n * lcm) / c.d);
    let g = 0n;
    for (const v of ints) g = bigGcd(g, v);
    if (g === 0n) g = 1n;
    if (ints[ints.length - 1] < 0n) g = -g;
    return { poly: ints.map((v) => new Rat(v / g)), factor: new Rat(g, lcm) };
  }
};

/* --------------------------------------------------- 4. AST -> Polynomial */
class NotPolynomial extends Error {}

function toPoly(node, v){
  switch (node.k) {
    case "num":   return P.const(node.v);
    case "const": throw new NotPolynomial();
    case "var":
      if (node.v === v) return P.x();
      throw new NotPolynomial();
    case "neg":   return P.neg(toPoly(node.a, v));
    case "add":   return P.add(toPoly(node.a, v), toPoly(node.b, v));
    case "sub":   return P.sub(toPoly(node.a, v), toPoly(node.b, v));
    case "mul":   return P.mul(toPoly(node.a, v), toPoly(node.b, v));
    case "div": {
      const d = toPoly(node.b, v);
      if (P.deg(d) > 0) throw new NotPolynomial();       // rational function
      if (!d.length) throw new MathError("Division by zero.");
      return P.scale(toPoly(node.a, v), R1.div(d[0]));
    }
    case "pow": {
      const e = toPoly(node.b, v);
      if (P.deg(e) > 0) throw new NotPolynomial();       // variable exponent
      const k = e.length ? e[0] : R0;
      if (!k.isInt() || k.isNeg()) throw new NotPolynomial();
      const n = Number(k.n);
      if (n > 24) throw new MathError("Degree above 24 is not supported.");
      return P.pow(toPoly(node.a, v), n);
    }
    case "fn":    throw new NotPolynomial();
  }
  throw new NotPolynomial();
}

/* Numeric evaluation of any AST — used for verification and plotting. */
function evalNode(node, env){
  switch (node.k) {
    case "num":   return node.v.num();
    case "const": return CONSTS[node.v];
    case "var": {
      if (!(node.v in env)) throw new MathError(`Unknown symbol "${node.v}".`);
      return env[node.v];
    }
    case "neg": return -evalNode(node.a, env);
    case "add": return evalNode(node.a, env) + evalNode(node.b, env);
    case "sub": return evalNode(node.a, env) - evalNode(node.b, env);
    case "mul": return evalNode(node.a, env) * evalNode(node.b, env);
    case "div": return evalNode(node.a, env) / evalNode(node.b, env);
    case "pow": return Math.pow(evalNode(node.a, env), evalNode(node.b, env));
    case "fn":  return FUNCS[node.f](evalNode(node.a, env));
  }
  throw new MathError("Cannot evaluate expression.");
}

/* ------------------------------------------------------- LaTeX from the AST */
const PREC = { add: 1, sub: 1, mul: 2, div: 2, neg: 2, pow: 4, num: 9, var: 9, const: 9, fn: 9 };
const CONST_TEX = { pi: "\\pi", "π": "\\pi", e: "e", tau: "\\tau" };

function tex(node, parentPrec = 0){
  let s, prec = PREC[node.k] || 9;
  switch (node.k) {
    case "num":   s = node.v.tex(); break;
    case "var":   s = node.v.length > 1 ? `\\mathrm{${node.v}}` : node.v; break;
    case "const": s = CONST_TEX[node.v] || node.v; break;
    case "neg":   s = "-" + tex(node.a, 3); break;
    case "add":   s = `${tex(node.a, 1)} + ${tex(node.b, 1)}`; break;
    case "sub":   s = `${tex(node.a, 1)} - ${tex(node.b, 2)}`; break;
    case "mul": {
      const a = tex(node.a, 2), b = tex(node.b, 2);
      // Suppress the dot where juxtaposition is unambiguous: 2x, x(x+1).
      const bStartsDigit = /^[\d\\]/.test(b) && !/^\\left|^\\pi|^\\tau|^\\mathrm/.test(b);
      s = node.implicit && !bStartsDigit ? `${a}${b}` : `${a} \\cdot ${b}`;
      break;
    }
    case "div":   s = `\\frac{${tex(node.a, 0)}}{${tex(node.b, 0)}}`; prec = 9; break;
    case "pow":   s = `${tex(node.a, 5)}^{${tex(node.b, 0)}}`; break;
    case "fn": {
      const name = node.f === "sqrt" ? null : node.f;
      s = name ? `\\${["sin","cos","tan","ln","log","exp","sinh","cosh","tanh"].includes(name) ? name : "operatorname{" + name + "}"}${["sin","cos","tan","ln","log","exp","sinh","cosh","tanh"].includes(name) ? "" : ""}\\left(${tex(node.a, 0)}\\right)`
                : `\\sqrt{${tex(node.a, 0)}}`;
      if (name && !["sin","cos","tan","ln","log","exp","sinh","cosh","tanh"].includes(name))
        s = `\\operatorname{${name}}\\left(${tex(node.a, 0)}\\right)`;
      break;
    }
    default: s = "?";
  }
  return prec < parentPrec ? `\\left(${s}\\right)` : s;
}

/* Render a polynomial in descending powers, with tidy signs. */
function polyTex(p, v){
  const q = P.trim(p);
  if (!q.length) return "0";
  const parts = [];
  for (let i = q.length - 1; i >= 0; i--) {
    const c = q[i];
    if (c.isZero()) continue;
    const mag = c.abs();
    const sign = c.isNeg() ? "-" : "+";
    let body;
    const power = i === 0 ? "" : i === 1 ? v : `${v}^{${i}}`;
    if (i === 0) body = mag.tex();
    else if (mag.isOne()) body = power;
    else body = `${mag.isInt() ? mag.tex() : mag.tex()}${power}`;
    parts.push({ sign, body });
  }
  if (!parts.length) return "0";
  let out = (parts[0].sign === "-" ? "-" : "") + parts[0].body;
  for (let i = 1; i < parts.length; i++) out += ` ${parts[i].sign} ${parts[i].body}`;
  return out;
}

/* ------------------------------------------------------ surd simplification */
function isqrt(n){
  if (n < 0n) throw new MathError("Negative radicand.");
  if (n < 2n) return n;
  let x = n, y = (x + 1n) / 2n;
  while (y < x) { x = y; y = (x + n / x) / 2n; }
  return x;
}
/** Pull the largest square factor out of n: 72 -> {out:6, in:2}. */
function simplifySurd(n){
  let out = 1n, rad = n;
  for (let f = 2n; f * f <= rad; f++) {
    while (rad % (f * f) === 0n) { rad /= f * f; out *= f; }
  }
  return { out, in: rad };
}

/* An exact algebraic root: (a + b·√r) / d, or the pair a ± b i√r / d. */
class Root {
  constructor({ a, b = 0n, r = 0n, d = 1n, imag = false }){
    this.a = a; this.b = b; this.r = r; this.d = d; this.imag = imag;
    this.normalize();
  }
  normalize(){
    if (this.d < 0n) { this.a = -this.a; this.b = -this.b; this.d = -this.d; }
    let g = bigGcd(bigGcd(bigAbs(this.a), bigAbs(this.b)), this.d) || 1n;
    if (this.b === 0n) g = bigGcd(bigAbs(this.a), this.d) || 1n;
    if (g > 1n) { this.a /= g; this.b /= g; this.d /= g; }
  }
  isRational(){ return this.b === 0n || this.r === 0n; }
  toRat(){ return new Rat(this.a, this.d); }
  num(){
    if (this.imag) return NaN;
    return (Number(this.a) + Number(this.b) * Math.sqrt(Number(this.r))) / Number(this.d);
  }
  tex(){
    if (this.b === 0n || this.r === 0n) return new Rat(this.a, this.d).tex();
    const radical = `\\sqrt{${this.r}}`;
    const bpart = (this.b === 1n ? "" : this.b === -1n ? "-" : this.b.toString()) + radical;
    const imagMark = this.imag ? "i" : "";
    const surd = this.imag
      ? (this.b === 1n ? "i" : this.b === -1n ? "-i" : `${this.b}i`) + (this.r === 1n ? "" : `\\sqrt{${this.r}}`)
      : bpart;
    let numer;
    if (this.a === 0n) numer = surd;
    else numer = `${this.a} ${surd.startsWith("-") ? "-" : "+"} ${surd.replace(/^-/, "")}`;
    return this.d === 1n ? numer : `\\dfrac{${numer}}{${this.d}}`;
  }
  plain(){
    if (this.b === 0n || this.r === 0n) return new Rat(this.a, this.d).toString();
    const s = `${this.a !== 0n ? this.a + (this.b < 0n ? " - " : " + ") : (this.b < 0n ? "-" : "")}${bigAbs(this.b) === 1n ? "" : bigAbs(this.b)}${this.imag ? "i" : ""}${this.r === 1n ? "" : "√" + this.r}`;
    return this.d === 1n ? s : `(${s})/${this.d}`;
  }
}

/* --------------------------------------------------------------- 5. Solvers */
/* Each solver appends {head, why, tex|plain, key} records to `steps`. */

function fmtNum(x, digits = 8){
  if (!isFinite(x)) return "—";
  if (Number.isInteger(x) && Math.abs(x) < 1e15) return String(x);
  const s = x.toPrecision(digits).replace(/(\.\d*?)0+(?=$|e)/, "$1").replace(/\.$/, "");
  return s;
}

/** Rational Root Theorem candidates p/q for an integer-coefficient polynomial. */
function rationalRootCandidates(intPoly){
  const a0 = intPoly[0].n, an = intPoly[intPoly.length - 1].n;
  const divisors = (n) => {
    n = bigAbs(n); const out = [];
    if (n === 0n) return [1n];
    for (let i = 1n; i * i <= n; i++) if (n % i === 0n) { out.push(i); if (i * i !== n) out.push(n / i); }
    return out.sort((x, y) => (x < y ? -1 : 1));
  };
  const ps = divisors(a0), qs = divisors(an);
  const seen = new Set(), out = [];
  for (const q of qs) for (const p of ps) for (const sgn of [1n, -1n]) {
    const r = new Rat(sgn * p, q), key = r.toString();
    if (!seen.has(key)) { seen.add(key); out.push(r); }
  }
  // Small magnitudes first — the ones a reader would try by hand.
  out.sort((x, y) => x.abs().cmp(y.abs()) || (x.isNeg() ? 1 : -1));
  return out.slice(0, 400);
}

function solveLinear(poly, v, steps){
  const b = P.get(poly, 0), a = P.get(poly, 1);
  steps.push({
    head: "Identify the form",
    why: `The equation is linear in ${v}: it matches \\(a${v} + b = 0\\) with \\(a = ${a.tex()}\\) and \\(b = ${b.tex()}\\).`,
    tex: `${polyTex(poly, v)} = 0`
  });
  if (a.isZero()) {
    if (b.isZero()) return { kind: "identity", steps };
    return { kind: "none", steps };
  }
  steps.push({
    head: "Isolate the variable term",
    why: `Subtract \\(${b.tex()}\\) from both sides, leaving the ${v}-term alone on the left.`,
    tex: `${a.isOne() ? "" : a.texAtom()}${v} = ${b.neg().tex()}`
  });
  const x = b.neg().div(a);
  if (!a.isOne()) {
    steps.push({
      head: "Divide by the coefficient",
      why: `Divide both sides by \\(${a.tex()}\\). Since \\(${a.tex()} \\ne 0\\) this is a reversible step, so no solutions are gained or lost.`,
      tex: `${v} = \\dfrac{${b.neg().tex()}}{${a.tex()}} = ${x.tex()}`,
      key: true
    });
  } else {
    steps[steps.length - 1].key = true;
  }
  return { kind: "roots", roots: [new Root({ a: x.n, d: x.d })], steps };
}

function solveQuadratic(poly, v, steps){
  const { poly: ip, factor } = P.primitive(poly);
  const c = P.get(ip, 0), b = P.get(ip, 1), a = P.get(ip, 2);
  if (!factor.isOne() && !P.trim(poly).every((t) => t.isInt())) {
    steps.push({
      head: "Clear fractions",
      why: `Multiply both sides by \\(${R1.div(factor).tex()}\\) to obtain integer coefficients. Multiplying by a non-zero constant does not change the solution set.`,
      tex: `${polyTex(ip, v)} = 0`
    });
  }
  steps.push({
    head: "Read off the coefficients",
    why: `Comparing with the standard quadratic \\(a${v}^2 + b${v} + c = 0\\).`,
    tex: `a = ${a.tex()}, \\quad b = ${b.tex()}, \\quad c = ${c.tex()}`
  });

  // Prefer an integer factorisation when one exists — it is the more instructive route.
  const A = a.n, B = b.n, C = c.n;
  const discR = b.mul(b).sub(new Rat(4n).mul(a).mul(c));
  const D = discR.n; // integer, since ip has integer coefficients
  // Render "25 + 24" rather than "25 - -24" when 4ac is negative.
  const fourAC = new Rat(4n).mul(a).mul(c);
  const middle = fourAC.isNeg()
    ? `${b.mul(b).tex()} + ${fourAC.abs().tex()}`
    : `${b.mul(b).tex()} - ${fourAC.tex()}`;
  steps.push({
    head: "Compute the discriminant",
    why: `The discriminant \\(\\Delta = b^2 - 4ac\\) decides the nature of the roots: positive gives two real roots, zero a single repeated root, negative a conjugate pair of complex roots.`,
    tex: `\\Delta = \\left(${b.tex()}\\right)^2 - 4\\left(${a.tex()}\\right)\\left(${c.tex()}\\right) = ${middle} = ${discR.tex()}`,
    key: true
  });

  if (D >= 0n) {
    const s = isqrt(D);
    if (s * s === D) {
      // Perfect square: exhibit the factorisation, which is what a reader would do.
      const r1 = new Rat(-B + s, 2n * A), r2 = new Rat(-B - s, 2n * A);
      const roots = [r1, r2].sort((x, y) => x.cmp(y));
      const facTex = roots.map((r) => {
        const num = r.n, den = r.d;
        const lead = den === 1n ? "" : den.toString();
        const sign = num > 0n ? "-" : "+";
        return `\\left(${lead}${v} ${sign} ${bigAbs(num)}\\right)`;
      }).join("");
      const leadProduct = roots.reduce((acc, r) => acc * r.d, 1n);
      const outer = A / leadProduct;
      steps.push({
        head: "Δ is a perfect square — factor",
        why: `Because \\(\\sqrt{\\Delta} = ${s}\\) is a whole number, the quadratic factors over the rationals. Splitting the middle term gives the product below.`,
        tex: `${outer === 1n ? "" : outer.toString()}${facTex} = 0`
      });
      steps.push({
        head: "Apply the zero-product property",
        why: `A product of real numbers is zero only if one of its factors is zero. Setting each factor to zero in turn yields the roots.`,
        tex: roots.map((r) => `${v} = ${r.tex()}`).join(", \\quad "),
        key: true
      });
      const rr = roots.map((r) => new Root({ a: r.n, d: r.d }));
      return { kind: "roots", roots: D === 0n ? [rr[0]] : rr, repeated: D === 0n, steps };
    }
    // Irrational roots: keep the surd exact.
    const { out, in: rad } = simplifySurd(D);
    steps.push({
      head: "Apply the quadratic formula",
      why: `Since \\(\\Delta > 0\\) and is not a perfect square, the roots are irrational conjugates. Substitute into \\(${v} = \\dfrac{-b \\pm \\sqrt{\\Delta}}{2a}\\).`,
      tex: `${v} = \\dfrac{${(-B).toString()} \\pm \\sqrt{${D}}}{${2n * A}}`
    });
    if (out > 1n) {
      steps.push({
        head: "Simplify the surd",
        why: `\\(${D} = ${out * out} \\times ${rad}\\), and \\(\\sqrt{${out * out}} = ${out}\\), so the radical reduces.`,
        tex: `${v} = \\dfrac{${(-B).toString()} \\pm ${out}\\sqrt{${rad}}}{${2n * A}}`
      });
    }
    const rp = new Root({ a: -B, b: out, r: rad, d: 2n * A });
    const rm = new Root({ a: -B, b: -out, r: rad, d: 2n * A });
    const roots = [rp, rm].sort((x, y) => x.num() - y.num());
    steps.push({
      head: "Exact roots",
      why: `Reduced to lowest terms. Decimal values follow for reference only — the surd form above is exact.`,
      tex: roots.map((r) => `${v} = ${r.tex()}`).join(", \\quad "),
      key: true
    });
    return { kind: "roots", roots, steps };
  }

  // Δ < 0 — complex conjugate pair.
  const { out, in: rad } = simplifySurd(-D);
  steps.push({
    head: "Δ is negative — complex roots",
    why: `No real number squares to a negative, so write \\(\\sqrt{${D}} = i\\sqrt{${-D}}\\) and continue over \\(\\mathbb{C}\\). The roots form a conjugate pair.`,
    tex: `${v} = \\dfrac{${(-B).toString()} \\pm i\\sqrt{${-D}}}{${2n * A}}`
  });
  const rp = new Root({ a: -B, b: out, r: rad, d: 2n * A, imag: true });
  const rm = new Root({ a: -B, b: -out, r: rad, d: 2n * A, imag: true });
  steps.push({
    head: "Exact roots",
    why: `The pair \\(p \\pm qi\\) with real part \\(${new Rat(-B, 2n * A).tex()}\\).`,
    tex: `${v} = ${rp.tex()}, \\quad ${v} = ${rm.tex()}`,
    key: true
  });
  return { kind: "roots", roots: [rp, rm], complex: true, steps };
}

/** Degree >= 3: strip x factors, hunt rational roots, deflate, finish exactly. */
function solveHigher(poly, v, steps){
  let work = P.trim(poly);
  const roots = [];
  const factorTex = [];

  // Factor out the largest power of x.
  let zeroMult = 0;
  while (work.length && work[0].isZero()) { work = work.slice(1); zeroMult++; }
  if (zeroMult > 0) {
    steps.push({
      head: "Factor out the common power",
      why: `Every term contains \\(${v}${zeroMult > 1 ? `^{${zeroMult}}` : ""}\\), so it can be taken outside. This immediately gives \\(${v} = 0\\) as a root${zeroMult > 1 ? ` of multiplicity ${zeroMult}` : ""}.`,
      tex: `${zeroMult === 1 ? v : `${v}^{${zeroMult}}`}\\left(${polyTex(work, v)}\\right) = 0`
    });
    roots.push({ root: new Root({ a: 0n, d: 1n }), mult: zeroMult });
    factorTex.push(zeroMult === 1 ? v : `${v}^{${zeroMult}}`);
  }

  const { poly: ip, factor } = P.primitive(work);
  if (!factor.isOne()) {
    steps.push({
      head: "Normalise to integer coefficients",
      why: `Divide through by \\(${factor.tex()}\\) so the Rational Root Theorem can be applied. A non-zero constant factor does not affect the roots.`,
      tex: `${polyTex(ip, v)} = 0`
    });
  }
  work = ip;

  if (P.deg(work) >= 3) {
    const cands = rationalRootCandidates(work);
    steps.push({
      head: "Rational Root Theorem",
      why: `Any rational root \\(p/q\\) in lowest terms must have \\(p \\mid ${P.get(work, 0).n}\\) (the constant term) and \\(q \\mid ${work[work.length - 1].n}\\) (the leading coefficient). That narrows the search to ${cands.length} candidate${cands.length === 1 ? "" : "s"}.`,
      tex: `${v} \\in \\left\\{ ${cands.slice(0, 14).map((c) => c.tex()).join(",\\; ")}${cands.length > 14 ? ",\\; \\ldots" : ""} \\right\\}`
    });
  }

  // Deflate by every rational root found, until degree <= 2.
  let guard = 0;
  while (P.deg(work) > 2 && guard++ < 30) {
    const cands = rationalRootCandidates(work);
    let found = null;
    for (const c of cands) if (P.evalRat(work, c).isZero()) { found = c; break; }
    if (!found) break;
    let mult = 0, next = work;
    while (true) {
      const q = P.divideRoot(next, found);
      if (!q) break;
      next = q; mult++;
      if (P.deg(next) < 1) break;
    }
    steps.push({
      head: `Test ${v} = ${found.toString()}`,
      why: `Substituting gives \\(0\\), so \\(${v} = ${found.tex()}\\) is a root${mult > 1 ? ` of multiplicity ${mult}` : ""}. Divide out the factor \\(\\left(${found.isZero() ? v : `${v} ${found.isNeg() ? "+" : "-"} ${found.abs().tex()}`}\\right)${mult > 1 ? `^{${mult}}` : ""}\\) by synthetic division.`,
      tex: `${polyTex(work, v)} = \\left(${found.isNeg() ? `${v} + ${found.abs().tex()}` : `${v} - ${found.tex()}`}\\right)${mult > 1 ? `^{${mult}}` : ""}\\left(${polyTex(next, v)}\\right)`
    });
    roots.push({ root: new Root({ a: found.n, d: found.d }), mult });
    factorTex.push(`\\left(${found.isNeg() ? `${v} + ${found.abs().tex()}` : `${v} - ${found.tex()}`}\\right)${mult > 1 ? `^{${mult}}` : ""}`);
    work = next;
  }

  const finish = (r) => {
    // Present roots in increasing order (reals first, then complex pairs) —
    // deflation order is an artefact of the search, not meaningful to a reader.
    if (r.mults) {
      r.mults.sort((a, b) => {
        const ai = a.root.imag, bi = b.root.imag;
        if (ai !== bi) return ai ? 1 : -1;
        if (ai && bi) return b.root.b < a.root.b ? -1 : 1;
        return a.root.num() - b.root.num();
      });
      r.roots = r.mults.map((m) => m.root);
    }
    return r;
  };

  const deg = P.deg(work);
  if (deg === 2) {
    steps.push({
      head: "Reduced to a quadratic",
      why: `The remaining factor has degree 2, so it can be finished exactly with the quadratic formula.`,
      tex: `${polyTex(work, v)} = 0`
    });
    const sub = solveQuadratic(work, v, steps);
    if (sub.roots) for (const r of sub.roots) roots.push({ root: r, mult: sub.repeated ? 2 : 1 });
    return finish({ kind: "roots", roots: roots.map((r) => r.root), mults: roots, complex: !!sub.complex, steps });
  }
  if (deg === 1) {
    const sub = solveLinear(work, v, steps);
    if (sub.roots) for (const r of sub.roots) roots.push({ root: r, mult: 1 });
    return finish({ kind: "roots", roots: roots.map((r) => r.root), mults: roots, steps });
  }
  if (deg <= 0) {
    if (roots.length) return finish({ kind: "roots", roots: roots.map((r) => r.root), mults: roots, steps });
    return { kind: "none", steps };
  }

  // Degree >= 3 with no further rational roots — isolate numerically.
  const numeric = numericRootsOfPoly(work);
  const unresolved = deg - numeric.length; // complex roots, by the Fundamental Theorem
  steps.push({
    head: "No further rational roots",
    why: `The remaining factor of degree ${deg} has no rational roots, and degrees above 4 have no general solution in radicals (Abel–Ruffini). The real roots below are isolated by sign changes and refined with Newton's method to near machine precision.${unresolved > 0 ? ` The remaining ${unresolved} root${unresolved === 1 ? " is" : "s are"} complex and not listed.` : ""}`,
    tex: numeric.length
      ? numeric.map((x) => `${v} \\approx ${fmtNum(x, 10)}`).join(", \\quad ")
      : `\\text{no real roots remain}`,
    key: true
  });
  return finish({
    kind: "roots",
    roots: roots.map((r) => r.root),
    mults: roots,
    numericExtra: numeric,
    residualDeg: deg,
    unresolved,
    steps
  });
}

/* Real roots of a polynomial: Cauchy bound, dense sign scan, then Newton. */
function numericRootsOfPoly(p){
  const q = P.trim(p);
  const n = P.deg(q);
  if (n < 1) return [];
  const an = Math.abs(q[n].num());
  let bound = 1;
  for (let i = 0; i < n; i++) bound = Math.max(bound, 1 + Math.abs(q[i].num()) / an);
  bound = Math.min(bound, 1e7);
  const f = (x) => P.evalNum(q, x);
  const fp = (x) => P.evalNum(P.deriv(q), x);
  return findRoots(f, fp, -bound, bound);
}

function findRoots(f, fp, lo, hi, samples = 4000){
  const out = [];
  const push = (x) => {
    if (!isFinite(x)) return;
    // A sign change can mean a root OR a pole (tan x at pi/2, 1/x at 0).
    // Only a genuine root leaves |f| small at the located point.
    const y = f(x);
    if (!isFinite(y)) return;
    const scale = Math.max(1, Math.abs(f(x + 1e-3)), Math.abs(f(x - 1e-3)));
    if (Math.abs(y) > 1e-6 * scale) return;
    if (!out.some((z) => Math.abs(z - x) < 1e-7 * Math.max(1, Math.abs(x)))) out.push(x);
  };
  let prevX = lo, prevY = f(lo);
  if (Math.abs(prevY) < 1e-12) push(prevX);
  for (let i = 1; i <= samples; i++) {
    const x = lo + ((hi - lo) * i) / samples;
    const y = f(x);
    if (!isFinite(y)) { prevX = x; prevY = y; continue; }
    if (isFinite(prevY) && ((prevY < 0 && y > 0) || (prevY > 0 && y < 0))) {
      push(refine(f, fp, prevX, x));
    } else if (Math.abs(y) < 1e-12) push(x);
    prevX = x; prevY = y;
  }
  return out.sort((a, b) => a - b);
}

/** Bisection to a tight bracket, then a few Newton steps for full precision. */
function refine(f, fp, a, b){
  let fa = f(a), fb = f(b);
  for (let i = 0; i < 100 && b - a > 1e-14 * Math.max(1, Math.abs(a)); i++) {
    const m = (a + b) / 2, fm = f(m);
    if (fm === 0) return m;
    if ((fa < 0) === (fm < 0)) { a = m; fa = fm; } else { b = m; fb = fm; }
  }
  let x = (a + b) / 2;
  for (let i = 0; i < 40; i++) {
    const d = fp ? fp(x) : (f(x + 1e-7) - f(x - 1e-7)) / 2e-7;
    if (!isFinite(d) || Math.abs(d) < 1e-14) break;
    const nx = x - f(x) / d;
    if (!isFinite(nx) || nx < a - 1e-9 || nx > b + 1e-9) break;
    if (Math.abs(nx - x) < 1e-16 * Math.max(1, Math.abs(x))) { x = nx; break; }
    x = nx;
  }
  return Math.abs(x) < 1e-12 ? 0 : x;
}

/* ------------------------------------------------- 7. Linear systems (n x n) */
function solveSystem(equations, sources){
  const steps = [];
  const vars = [];
  for (const eq of equations) for (const v of varsOf(eq)) if (!vars.includes(v)) vars.push(v);
  vars.sort();
  const n = vars.length;
  if (equations.length !== n || n < 2 || n > 4)
    throw new MathError(`A ${equations.length}-equation system in ${n} unknown${n === 1 ? "" : "s"} is not supported. Provide as many independent linear equations as unknowns (2–4).`);

  // Build the augmented matrix; every equation must be linear in every unknown.
  const M = [];
  for (const eq of equations) {
    const row = [];
    let residual = eq;
    for (const v of vars) {
      let coeff;
      try {
        coeff = linearCoefficient(eq, v, vars);
      } catch (e) { throw new MathError("Systems must be linear in every unknown."); }
      row.push(coeff);
    }
    row.push(constantTerm(eq, vars).neg());
    M.push(row);
  }

  steps.push({
    head: "Write the augmented matrix",
    why: `Each row records one equation's coefficients on \\(${vars.join(", ")}\\) and its constant term, after moving everything to the left-hand side.`,
    tex: matrixTex(M, vars)
  });

  // Gauss–Jordan with exact rational pivots.
  const A = M.map((r) => r.slice());
  let pivotRow = 0;
  const pivotCols = [];
  for (let col = 0; col < n && pivotRow < n; col++) {
    let sel = -1;
    for (let r = pivotRow; r < n; r++) if (!A[r][col].isZero()) { sel = r; break; }
    if (sel === -1) continue;
    if (sel !== pivotRow) {
      [A[sel], A[pivotRow]] = [A[pivotRow], A[sel]];
      steps.push({
        head: `Swap rows R${pivotRow + 1} ↔ R${sel + 1}`,
        why: `A non-zero entry is needed in the pivot position of column \\(${vars[col]}\\).`,
        tex: matrixTex(A, vars)
      });
    }
    const pv = A[pivotRow][col];
    if (!pv.isOne()) {
      for (let c = 0; c <= n; c++) A[pivotRow][c] = A[pivotRow][c].div(pv);
      steps.push({
        head: `Scale R${pivotRow + 1} by 1/${pv.toString()}`,
        why: `Dividing the row by its pivot \\(${pv.tex()}\\) makes the leading coefficient 1.`,
        tex: matrixTex(A, vars)
      });
    }
    let eliminated = false;
    for (let r = 0; r < n; r++) {
      if (r === pivotRow || A[r][col].isZero()) continue;
      const f = A[r][col];
      for (let c = 0; c <= n; c++) A[r][c] = A[r][c].sub(f.mul(A[pivotRow][c]));
      eliminated = true;
    }
    if (eliminated) {
      steps.push({
        head: `Eliminate ${vars[col]} from the other rows`,
        why: `Subtract a multiple of R${pivotRow + 1} from each remaining row so that column \\(${vars[col]}\\) is zero everywhere except the pivot.`,
        tex: matrixTex(A, vars)
      });
    }
    pivotCols.push(col);
    pivotRow++;
  }

  // Classify.
  for (let r = 0; r < n; r++) {
    const allZero = A[r].slice(0, n).every((c) => c.isZero());
    if (allZero && !A[r][n].isZero()) {
      steps.push({
        head: "Inconsistent",
        why: `Row ${r + 1} reduces to \\(0 = ${A[r][n].tex()}\\), which is false. The equations describe parallel objects that never meet.`,
        tex: `\\varnothing`, key: true
      });
      return { kind: "system-none", vars, steps };
    }
  }
  if (pivotCols.length < n) {
    steps.push({
      head: "Underdetermined",
      why: `Only ${pivotCols.length} independent equation${pivotCols.length === 1 ? "" : "s"} remain for ${n} unknowns, so the solution set is an infinite family with ${n - pivotCols.length} free parameter${n - pivotCols.length === 1 ? "" : "s"}.`,
      tex: `\\text{infinitely many solutions}`, key: true
    });
    return { kind: "system-many", vars, steps };
  }

  const sol = vars.map((v, i) => ({ v, val: A[i][n] }));
  steps.push({
    head: "Read off the solution",
    why: `The matrix is now in reduced row-echelon form; each row states the value of one unknown directly.`,
    tex: sol.map((s) => `${s.v} = ${s.val.tex()}`).join(", \\quad "),
    key: true
  });
  return { kind: "system", vars, solution: sol, steps };
}

function matrixTex(M, vars){
  const cols = "c".repeat(vars.length) + "|c";
  // \dfrac keeps entries full height so the array does not read as a footnote.
  const body = M.map((r) => r.map((c) => (c.isInt() ? c.tex() : `\\frac{${c.isNeg() ? "-" : ""}${bigAbs(c.n)}}{${c.d}}`)).join(" & ")).join(" \\\\[2pt] ");
  const header = vars.map((v) => `\\scriptscriptstyle ${v}`).join(" & ") + " & \\scriptscriptstyle =";
  return `\\left[\\begin{array}{${cols}} ${header} \\\\ \\hline ${body} \\end{array}\\right]`;
}

/** Coefficient of `v` in an expression that is linear in all of `vars`. */
function linearCoefficient(node, v, vars){
  const env0 = {}; for (const u of vars) env0[u] = R0;
  const at = (assign) => evalExact(node, assign);
  const base = at(env0);
  const e1 = { ...env0 }; e1[v] = R1;
  return at(e1).sub(base);
}
function constantTerm(node, vars){
  const env0 = {}; for (const u of vars) env0[u] = R0;
  return evalExact(node, env0);
}
/** Exact rational evaluation — throws on anything non-rational. */
function evalExact(node, env){
  switch (node.k) {
    case "num": return node.v;
    case "var": {
      if (!(node.v in env)) throw new MathError(`Unknown symbol "${node.v}".`);
      return env[node.v];
    }
    case "neg": return evalExact(node.a, env).neg();
    case "add": return evalExact(node.a, env).add(evalExact(node.b, env));
    case "sub": return evalExact(node.a, env).sub(evalExact(node.b, env));
    case "mul": return evalExact(node.a, env).mul(evalExact(node.b, env));
    case "div": return evalExact(node.a, env).div(evalExact(node.b, env));
    case "pow": {
      const e = evalExact(node.b, env);
      if (!e.isInt()) throw new MathError("Non-integer exponent.");
      return evalExact(node.a, env).pow(e.n);
    }
  }
  throw new MathError("Not a rational expression.");
}

/* ------------------------------------------------------- top-level dispatch */
function solve(input){
  const src = input.trim();
  if (!src) throw new MathError("Enter an equation to begin.");

  // A system: several equations separated by ';' or a newline / comma.
  const lines = src.split(/[;\n]+/).map((s) => s.trim()).filter(Boolean);
  if (lines.length > 1) {
    const sides = lines.map((l) => {
      const p = parse(l);
      if (p.length !== 2) throw new MathError(`Each line of a system must contain exactly one "=".`);
      return { node: { k: "sub", a: p[0], b: p[1] }, src: l };
    });
    const res = solveSystem(sides.map((s) => s.node), lines);
    return { ...res, input: src, display: lines, isSystem: true };
  }

  const parts = parse(src);

  /* ---- expression, not an equation: evaluate it ---- */
  if (parts.length === 1) {
    const node = parts[0];
    const vs = varsOf(node);
    if (vs.length === 0) {
      const steps = [];
      let exact = null;
      try { exact = evalExact(node, {}); } catch (_) {}
      const val = evalNode(node, {});
      steps.push({
        head: "Evaluate",
        why: `No unknown appears, so the input is an arithmetic expression. It is evaluated with exact rational arithmetic wherever possible; otherwise in double precision.`,
        tex: `${tex(node)} = ${exact ? exact.tex() : fmtNum(val, 12)}`,
        key: true
      });
      if (exact && !exact.isInt()) {
        steps.push({
          head: "Decimal form",
          why: `The exact value \\(${exact.tex()}\\) as a decimal.`,
          tex: `\\approx ${fmtNum(exact.num(), 12)}`
        });
      }
      return {
        kind: "value", value: exact ? exact.num() : val, exact,
        steps, node, input: src, display: [src], vars: []
      };
    }
    // A bare expression with an unknown is read as "= 0", the usual convention.
    return solveSingle(node, { k: "num", v: R0 }, vs, src, true);
  }

  if (parts.length > 2) throw new MathError("Chained equations (a = b = c) are not supported. Give one equation, or one per line for a system.");
  const [lhs, rhs] = parts;
  resolveEuler({ k: "sub", a: lhs, b: rhs });
  const vs = varsOf({ k: "sub", a: lhs, b: rhs });
  if (vs.length === 0) {
    const l = evalNode(lhs, {}), r = evalNode(rhs, {});
    const same = Math.abs(l - r) < 1e-12 * Math.max(1, Math.abs(l));
    return {
      kind: same ? "identity-num" : "false-num",
      steps: [{
        head: "Compare both sides",
        why: `Neither side contains an unknown, so the statement is simply true or false.`,
        tex: `${fmtNum(l, 12)} ${same ? "=" : "\\ne"} ${fmtNum(r, 12)}`, key: true
      }],
      input: src, display: [src], vars: []
    };
  }
  if (vs.length > 1)
    throw new MathError(`This equation contains ${vs.length} unknowns (${vs.join(", ")}). Give one equation per unknown, on separate lines, to solve as a system.`);

  return solveSingle(lhs, rhs, vs, src, false);
}

function solveSingle(lhs, rhs, vs, src, wasBare){
  const v = vs[0];
  const steps = [];
  const diff = { k: "sub", a: lhs, b: rhs };

  if (!wasBare) {
    steps.push({
      head: "Move everything to one side",
      why: `Subtracting the right-hand side from both sides gives an equivalent equation of the form \\(f(${v}) = 0\\), so the task becomes finding the zeros of \\(f\\).`,
      tex: `\\left(${tex(lhs)}\\right) - \\left(${tex(rhs)}\\right) = 0`
    });
  }

  let poly = null;
  try { poly = P.trim(toPoly(diff, v)); }
  catch (e) { if (!(e instanceof NotPolynomial)) throw e; }

  if (poly) {
    const deg = P.deg(poly);
    if (deg >= 1) {
      steps.push({
        head: "Expand and collect like terms",
        why: `Multiplying out and gathering powers of \\(${v}\\) gives a polynomial of degree ${deg} in standard form.`,
        tex: `${polyTex(poly, v)} = 0`
      });
    }
    let res;
    if (deg <= 0) {
      res = poly.length === 0
        ? { kind: "identity", steps }
        : { kind: "none", steps };
      if (res.kind === "identity") steps.push({
        head: "Identity", key: true,
        why: `Every term cancels. The equation holds for every value of \\(${v}\\).`,
        tex: `0 = 0 \\quad \\text{for all } ${v} \\in \\mathbb{R}`
      });
      else steps.push({
        head: "Contradiction", key: true,
        why: `All \\(${v}\\)-terms cancel and a non-zero constant remains, so no value of \\(${v}\\) can satisfy the equation.`,
        tex: `${poly[0].tex()} = 0 \\quad \\text{is false}`
      });
    }
    else if (deg === 1) res = solveLinear(poly, v, steps);
    else if (deg === 2) res = solveQuadratic(poly, v, steps);
    else res = solveHigher(poly, v, steps);

    return { ...res, steps, poly, degree: deg, variable: v, node: diff, input: src, display: [src], vars: vs };
  }

  /* ---- transcendental / rational: numerical solution ---- */
  const f = (x) => { try { return evalNode(diff, { [v]: x }); } catch (_) { return NaN; } };

  // Widen the window until roots appear, so equations like log(x) = 2 (root at
  // 100) are not missed by a fixed [-60, 60] scan.
  const WINDOWS = [[-60, 60, 12000], [-500, 500, 24000], [-10000, 10000, 60000]];
  let roots = [], win = WINDOWS[0];
  for (const w of WINDOWS) {
    win = w;
    roots = findRoots(f, null, w[0], w[1], w[2]);
    if (roots.length) break;
  }

  // Periodic equations have infinitely many roots; listing every one found in
  // the window is noise. Detect periodicity and present a principal set.
  const periodic = hasNode(diff, (n) => n.k === "fn" && ["sin", "cos", "tan"].includes(n.f));
  let truncated = 0;
  if (periodic && roots.length > 6) {
    const near = roots.slice().sort((a, b) => Math.abs(a) - Math.abs(b)).slice(0, 6).sort((a, b) => a - b);
    truncated = roots.length - near.length;
    roots = near;
  }

  steps.push({
    head: "Not a polynomial — solve numerically",
    why: `The equation involves functions outside the polynomial family, so there is no general closed form. The interval \\([${fmtNum(win[0], 4)}, ${fmtNum(win[1], 4)}]\\) is scanned for sign changes in \\(f(${v})\\); each bracket is then closed by bisection and polished with Newton's method.${periodic ? " The equation is periodic, so it has infinitely many solutions; those nearest the origin are shown." : ""}`,
    tex: roots.length
      ? roots.map((x) => `${v} \\approx ${fmtNum(x, 10)}`).join(", \\quad ")
      : `\\text{no sign change found in } [${fmtNum(win[0], 4)},\\, ${fmtNum(win[1], 4)}]`,
    key: true
  });
  return {
    kind: "numeric", numericRoots: roots, variable: v, node: diff,
    periodic, truncated, window: win,
    steps, input: src, display: [src], vars: vs
  };
}

/* --------------------------------------------------------------- 8. Render */
const $ = (s) => document.querySelector(s);
const out = $("#out");
let katexReady = false;
let lastResult = null;

function renderTex(target, latex, displayMode = true){
  if (katexReady && window.katex) {
    try {
      window.katex.render(latex, target, { displayMode, throwOnError: false, output: "html", strict: false });
      return;
    } catch (_) { /* fall through to plain text */ }
  }
  target.classList.add("plain");
  target.textContent = texToPlain(latex);
}

/* Readable fallback when KaTeX is unavailable (offline, blocked CDN). */

/** Read a balanced {...} group starting at `i` (which must index the "{"). */
function readGroup(s, i){
  if (s[i] !== "{") return null;
  let depth = 0;
  for (let j = i; j < s.length; j++) {
    if (s[j] === "{" && s[j - 1] !== "\\") depth++;
    else if (s[j] === "}" && s[j - 1] !== "\\") {
      depth--;
      if (depth === 0) return { body: s.slice(i + 1, j), end: j + 1 };
    }
  }
  return null;
}
/** Rewrite \cmd{..}{..} forms with a callback, honouring nested braces. */
function expandCmd(s, names, arity, fn){
  const re = new RegExp("\\\\(" + names.join("|") + ")(?![a-zA-Z])", "g");
  let m, out = s, guard = 0;
  while ((m = re.exec(out)) && guard++ < 500) {
    let i = m.index + m[0].length;
    const args = [];
    for (let a = 0; a < arity; a++) {
      while (out[i] === " ") i++;
      const g = readGroup(out, i);
      if (!g) break;
      args.push(g.body); i = g.end;
    }
    if (args.length < arity) { re.lastIndex = m.index + m[0].length; continue; }
    out = out.slice(0, m.index) + fn(...args) + out.slice(i);
    re.lastIndex = 0;
  }
  return out;
}

function texToPlain(s){
  s = s
    .replace(/\\left|\\right/g, "")
    .replace(/\\begin\{array\}\{[^}]*\}/g, "").replace(/\\end\{array\}/g, "")
    .replace(/\\begin\{cases\}|\\end\{cases\}/g, "")
    .replace(/\\hline/g, "").replace(/\\scriptscriptstyle|\\scriptstyle/g, "")
    .replace(/\\\\(\[[0-9.]+pt\])?/g, "\n").replace(/&/g, "  ");
  // Innermost-first so nested \frac/\sqrt resolve correctly.
  s = expandCmd(s, ["dfrac", "tfrac", "cfrac", "frac"], 2, (a, b) => `(${texToPlain(a)})/(${texToPlain(b)})`);
  s = expandCmd(s, ["sqrt"], 1, (a) => `√(${texToPlain(a)})`);
  s = expandCmd(s, ["operatorname", "mathrm", "text", "mathbb"], 1, (a) => a);
  return s
    .replace(/\^\{([^{}]*)\}/g, "^$1").replace(/_\{([^{}]*)\}/g, "_$1")
    .replace(/\\cdot/g, "·").replace(/\\times/g, "×").replace(/\\pm/g, "±")
    .replace(/\\ne/g, "≠").replace(/\\approx/g, "≈").replace(/\\Delta/g, "Δ")
    .replace(/\\pi/g, "π").replace(/\\varnothing/g, "∅").replace(/\\in/g, "∈")
    .replace(/\\mid/g, "|").replace(/\\ldots|\\dots/g, "...")
    .replace(/\\mathbb\s*R/g, "R").replace(/\\mathbb\s*C/g, "C")
    .replace(/\\\{/g, "{").replace(/\\\}/g, "}")   // escaped braces are literal
    .replace(/\\quad|\\;|\\,|\\!/g, "  ")
    .replace(/\\\[[0-9.]+pt\]/g, "\n")
    .replace(/\\[a-zA-Z]+/g, "")
    .replace(/[ \t]{2,}/g, "  ").trim();
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
/** Inline \( ... \) math inside prose. */
function proseInto(target, html){
  target.innerHTML = "";
  const parts = html.split(/(\\\(.*?\\\))/gs);
  for (const part of parts) {
    if (part.startsWith("\\(") && part.endsWith("\\)")) {
      const span = document.createElement("span");
      const body = part.slice(2, -2);
      if (katexReady && window.katex) {
        try { window.katex.render(body, span, { displayMode: false, throwOnError: false, strict: false }); }
        catch (_) { span.textContent = texToPlain(body); }
      } else {
        span.textContent = texToPlain(body);
        span.style.fontFamily = "var(--mono)";
        span.style.fontSize = ".92em";
      }
      target.appendChild(span);
    } else if (part) {
      target.appendChild(document.createTextNode(part));
    }
  }
}

function classify(res){
  if (res.isSystem) return `Linear system · ${res.vars.length} unknowns`;
  if (res.kind === "value") return "Arithmetic expression";
  if (res.kind === "identity-num" || res.kind === "false-num") return "Numeric statement";
  if (res.kind === "numeric") return `Transcendental equation in ${res.variable}`;
  const names = { 1: "Linear", 2: "Quadratic", 3: "Cubic", 4: "Quartic", 5: "Quintic" };
  if (res.degree !== undefined)
    return `${names[res.degree] || `Degree-${res.degree}`} equation in ${res.variable}`;
  return "Equation";
}

function render(res){
  lastResult = res;
  out.innerHTML = "";

  /* -- Problem -- */
  const s1 = el("section", "block");
  s1.appendChild(el("h2", "rubric", "Problem"));
  const card = el("div", "statement");
  card.appendChild(el("div", "kind", classify(res)));
  const m = el("div", "math");
  const stmtTex = res.isSystem
    ? `\\begin{cases} ${res.display.map((l) => texifyRaw(l)).join(" \\\\ ")} \\end{cases}`
    : texifyRaw(res.input);
  renderTex(m, stmtTex, true);
  card.appendChild(m);
  s1.appendChild(card);
  out.appendChild(s1);

  /* -- Result -- */
  const s2 = el("section", "block");
  s2.appendChild(el("h2", "rubric", "Result"));
  s2.appendChild(buildAnswer(res));
  out.appendChild(s2);

  /* -- Derivation -- */
  const s3 = el("section", "block");
  s3.appendChild(el("h2", "rubric", `Derivation — ${res.steps.length} step${res.steps.length === 1 ? "" : "s"}`));
  const ol = el("ol", "steps");
  for (const st of res.steps) {
    const li = el("li", st.key ? "key" : "");
    li.appendChild(el("div", "step-head", st.head));
    if (st.why) { const p = el("p", "step-why"); proseInto(p, st.why); li.appendChild(p); }
    if (st.tex) { const d = el("div", "step-math"); renderTex(d, st.tex, true); li.appendChild(d); }
    ol.appendChild(li);
  }
  s3.appendChild(ol);
  out.appendChild(s3);

  /* -- Verification -- */
  const ver = buildVerification(res);
  if (ver) {
    const s4 = el("section", "block");
    s4.appendChild(el("h2", "rubric", "Verification — back-substitution"));
    s4.appendChild(ver);
    out.appendChild(s4);
  }

  /* -- Graph -- */
  const plot = buildPlot(res);
  if (plot) {
    const s5 = el("section", "block");
    s5.appendChild(el("h2", "rubric", "Graph"));
    s5.appendChild(plot);
    out.appendChild(s5);
  }

  $("#folio").textContent = "Sheet " + new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

/** Re-parse the raw input purely for a faithful LaTeX restatement. */
function texifyRaw(src){
  try {
    const parts = parse(src);
    return parts.map((p) => tex(p)).join(" = ");
  } catch (_) {
    return `\\text{${src.replace(/([\\{}#$%&_])/g, "\\$1")}}`;
  }
}

function buildAnswer(res){
  const box = el("div", "answer");

  if (res.kind === "value") {
    const row = el("div", "root");
    row.appendChild(el("span", "idx", "="));
    const val = el("span", "val");
    renderTex(val, res.exact ? res.exact.tex() : fmtNum(res.value, 12), false);
    row.appendChild(val);
    if (res.exact && !res.exact.isInt()) row.appendChild(el("span", "approx", "≈ " + fmtNum(res.exact.num(), 10)));
    box.appendChild(row);
    return box;
  }
  if (res.kind === "identity" || res.kind === "identity-num") {
    box.appendChild(noteRow("The equation is an identity — it is satisfied by every real value of the unknown."));
    return box;
  }
  if (res.kind === "none" || res.kind === "false-num" || res.kind === "system-none") {
    box.appendChild(noteRow("No solution. The equation is a contradiction — no value satisfies it."));
    return box;
  }
  if (res.kind === "system-many") {
    box.appendChild(noteRow("Infinitely many solutions — the equations are not independent, so the solution set is a line or plane rather than a point."));
    return box;
  }
  if (res.kind === "system") {
    const wrap = el("div", "roots");
    for (const s of res.solution) {
      const row = el("div", "root");
      row.appendChild(el("span", "idx", s.v + " ="));
      const val = el("span", "val");
      renderTex(val, s.val.tex(), false);
      row.appendChild(val);
      if (!s.val.isInt()) row.appendChild(el("span", "approx", "≈ " + fmtNum(s.val.num(), 10)));
      wrap.appendChild(row);
    }
    box.appendChild(wrap);
    return box;
  }
  if (res.kind === "numeric") {
    if (!res.numericRoots.length) {
      box.appendChild(noteRow("No real solution was found by scanning [−60, 60]. The equation may have no real roots, or roots outside that window."));
      return box;
    }
    const wrap = el("div", "roots");
    res.numericRoots.forEach((x, i) => {
      const row = el("div", "root");
      row.appendChild(el("span", "idx", `${res.variable}${sub(i + 1)} =`));
      const val = el("span", "val");
      renderTex(val, fmtNum(x, 10), false);
      row.appendChild(val);
      row.appendChild(el("span", "approx", "numerical"));
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
    box.appendChild(noteRow(
      res.periodic
        ? `The equation is periodic and has infinitely many solutions. The ${res.numericRoots.length} nearest the origin are shown${res.truncated ? `; ${res.truncated} further root${res.truncated === 1 ? "" : "s"} found in the scanned window ${res.truncated === 1 ? "is" : "are"} omitted` : ""}. Values are accurate to about 10 significant figures.`
        : "Approximate to about 10 significant figures. No exact closed form exists for this equation in elementary terms."));
    return box;
  }

  // Polynomial roots.
  const wrap = el("div", "roots");
  const multMap = new Map();
  if (res.mults) for (const m of res.mults) multMap.set(m.root, m.mult);
  const all = res.roots || [];
  all.forEach((r, i) => {
    const row = el("div", "root");
    const mult = multMap.get(r) || (res.repeated ? 2 : 1);
    row.appendChild(el("span", "idx", `${res.variable}${sub(i + 1)} =`));
    const val = el("span", "val");
    renderTex(val, r.tex(), false);
    row.appendChild(val);
    const tail = [];
    if (!r.isRational() && !r.imag) tail.push("≈ " + fmtNum(r.num(), 10));
    if (r.imag) tail.push("complex");
    if (mult > 1) tail.push(`multiplicity ${mult}`);
    if (tail.length) row.appendChild(el("span", "approx", tail.join(" · ")));
    wrap.appendChild(row);
  });
  if (res.numericExtra) {
    res.numericExtra.forEach((x, i) => {
      const row = el("div", "root");
      row.appendChild(el("span", "idx", `${res.variable}${sub(all.length + i + 1)} ≈`));
      const val = el("span", "val");
      renderTex(val, fmtNum(x, 10), false);
      row.appendChild(val);
      row.appendChild(el("span", "approx", "numerical"));
      wrap.appendChild(row);
    });
  }
  box.appendChild(wrap);

  const notes = [];
  if (res.repeated) notes.push("The discriminant is zero, so the two roots coincide — the parabola touches the axis at a single point.");
  if (res.complex) notes.push("The roots are a complex-conjugate pair; the graph does not cross the real axis.");
  if (res.numericExtra && res.numericExtra.length)
    notes.push(`A degree-${res.residualDeg} factor remains with no rational roots, so its real roots are given numerically.`);
  if (res.unresolved > 0)
    notes.push(`By the Fundamental Theorem of Algebra a degree-${res.degree} equation has ${res.degree} roots counted with multiplicity; the ${res.unresolved} not listed above ${res.unresolved === 1 ? "is complex" : "are complex"}.`);
  if (notes.length) box.appendChild(noteRow(notes.join(" ")));
  return box;
}
function noteRow(text){ const n = el("div", "note", text); return n; }
function sub(n){ return String(n).replace(/\d/g, (d) => "₀₁₂₃₄₅₆₇₈₉"[+d]); }

function buildVerification(res){
  const rows = [];
  if (res.kind === "system" && res.solution) {
    const env = {};
    for (const s of res.solution) env[s.v] = s.val.num();
    res.display.forEach((line, i) => {
      try {
        const p = parse(line);
        const l = evalNode(p[0], env), r = evalNode(p[1], env);
        const ok = Math.abs(l - r) < 1e-9 * Math.max(1, Math.abs(l), Math.abs(r));
        rows.push({ label: `Equation ${i + 1}`, lhs: fmtNum(l, 8), rhs: fmtNum(r, 8), ok });
      } catch (_) {}
    });
  } else if ((res.kind === "roots" || res.kind === "numeric") && res.node && res.variable) {
    const list = [];
    if (res.roots) for (const r of res.roots) if (!r.imag) list.push({ show: r.plain ? r.plain() : String(r), x: r.num() });
    if (res.numericExtra) for (const x of res.numericExtra) list.push({ show: fmtNum(x, 8), x });
    if (res.numericRoots) for (const x of res.numericRoots) list.push({ show: fmtNum(x, 8), x });
    for (const item of list) {
      if (!isFinite(item.x)) continue;
      let val;
      try { val = evalNode(res.node, { [res.variable]: item.x }); } catch (_) { continue; }
      const scale = Math.max(1, Math.abs(item.x)) ** Math.max(1, res.degree || 1);
      const ok = Math.abs(val) < 1e-7 * scale;
      rows.push({ label: `${res.variable} = ${item.show}`, lhs: fmtNum(val, 4), rhs: "0", ok, residual: true });
    }
  }
  if (!rows.length) return null;

  const t = el("table", "verify");
  const thead = el("thead");
  const hr = el("tr");
  const isResidual = rows[0].residual;
  for (const h of isResidual ? ["Substitution", "f(x) evaluates to", "Target", "Check"] : ["", "Left side", "Right side", "Check"]) {
    hr.appendChild(el("th", "", h));
  }
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el("tbody");
  for (const r of rows) {
    const tr = el("tr");
    tr.appendChild(el("td", "sub", r.label));
    tr.appendChild(el("td", "", r.lhs));
    tr.appendChild(el("td", "", r.rhs));
    const c = el("td");
    const span = el("span", r.ok ? "pass" : "fail", r.ok ? "✓ verified" : "✗ mismatch");
    c.appendChild(span); tr.appendChild(c);
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  return t;
}

/* Function plot with root markers. */
function buildPlot(res){
  if (!res.node || !res.variable) return null;
  if (res.kind !== "roots" && res.kind !== "numeric") return null;
  const v = res.variable;
  const f = (x) => { try { const y = evalNode(res.node, { [v]: x }); return isFinite(y) ? y : NaN; } catch (_) { return NaN; } };

  const realRoots = [];
  if (res.roots) for (const r of res.roots) if (!r.imag && isFinite(r.num())) realRoots.push(r.num());
  if (res.numericExtra) realRoots.push(...res.numericExtra);
  if (res.numericRoots) realRoots.push(...res.numericRoots);

  // Frame the window on the roots, or on a default window when there are none.
  let lo, hi;
  if (realRoots.length) {
    lo = Math.min(...realRoots); hi = Math.max(...realRoots);
    const pad = Math.max((hi - lo) * 0.7, 2.2);
    lo -= pad; hi += pad;
  } else { lo = -6; hi = 6; }
  if (!isFinite(lo) || !isFinite(hi) || hi - lo > 1e6) return null;

  const W = 860, H = 330, PADL = 46, PADR = 18, PADT = 18, PADB = 30;
  const N = 900;
  const xs = [], ys = [];
  for (let i = 0; i <= N; i++) { const x = lo + ((hi - lo) * i) / N; xs.push(x); ys.push(f(x)); }
  const finite = ys.filter((y) => isFinite(y));
  if (!finite.length) return null;
  // Clip the vertical range to the central mass so a single pole can't flatten the curve.
  const sorted = finite.slice().sort((a, b) => a - b);
  const q = (p) => sorted[Math.min(sorted.length - 1, Math.max(0, Math.floor(p * (sorted.length - 1))))];
  let ymin = q(0.02), ymax = q(0.98);
  if (ymin === ymax) { ymin -= 1; ymax += 1; }
  const yspan = ymax - ymin;
  ymin -= yspan * 0.12; ymax += yspan * 0.12;
  if (ymin > 0) ymin = -yspan * 0.12;
  if (ymax < 0) ymax = yspan * 0.12;

  const sx = (x) => PADL + ((x - lo) / (hi - lo)) * (W - PADL - PADR);
  const sy = (y) => PADT + (1 - (y - ymin) / (ymax - ymin)) * (H - PADT - PADB);

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Graph of the left-hand side against ${v}`);
  const mk = (t, attrs) => { const e = document.createElementNS(NS, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const css = getComputedStyle(document.documentElement);
  const cRule = css.getPropertyValue("--rule-soft").trim() || "#e9e5da";
  const cAxis = css.getPropertyValue("--ink-faint").trim() || "#8a867b";
  const cInk = css.getPropertyValue("--ink").trim() || "#16150f";
  const cAcc = css.getPropertyValue("--accent").trim() || "#7a2e1e";

  // Gridlines on "nice" numbers.
  const niceStep = (span, target) => {
    const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  };
  const stepX = niceStep(hi - lo, 9), stepY = niceStep(ymax - ymin, 6);
  for (let g = Math.ceil(lo / stepX) * stepX; g <= hi; g += stepX) {
    svg.appendChild(mk("line", { x1: sx(g), y1: PADT, x2: sx(g), y2: H - PADB, stroke: cRule, "stroke-width": 1 }));
    const lbl = mk("text", { x: sx(g), y: H - PADB + 15, "text-anchor": "middle", fill: cAxis, "font-size": 10, "font-family": "var(--mono)" });
    lbl.textContent = fmtNum(Math.abs(g) < stepX / 1e6 ? 0 : g, 3);
    svg.appendChild(lbl);
  }
  for (let g = Math.ceil(ymin / stepY) * stepY; g <= ymax; g += stepY) {
    svg.appendChild(mk("line", { x1: PADL, y1: sy(g), x2: W - PADR, y2: sy(g), stroke: cRule, "stroke-width": 1 }));
    const lbl = mk("text", { x: PADL - 7, y: sy(g) + 3.5, "text-anchor": "end", fill: cAxis, "font-size": 10, "font-family": "var(--mono)" });
    lbl.textContent = fmtNum(Math.abs(g) < stepY / 1e6 ? 0 : g, 3);
    svg.appendChild(lbl);
  }
  if (0 >= ymin && 0 <= ymax) svg.appendChild(mk("line", { x1: PADL, y1: sy(0), x2: W - PADR, y2: sy(0), stroke: cAxis, "stroke-width": 1.4 }));
  if (0 >= lo && 0 <= hi) svg.appendChild(mk("line", { x1: sx(0), y1: PADT, x2: sx(0), y2: H - PADB, stroke: cAxis, "stroke-width": 1.4 }));

  // Curve, broken at poles and at excursions outside the clipped window.
  let d = "", pen = false;
  for (let i = 0; i <= N; i++) {
    const y = ys[i];
    if (!isFinite(y) || y < ymin - yspan * 4 || y > ymax + yspan * 4) { pen = false; continue; }
    const px = sx(xs[i]), py = sy(Math.max(ymin - yspan, Math.min(ymax + yspan, y)));
    d += (pen ? "L" : "M") + px.toFixed(2) + " " + py.toFixed(2) + " ";
    pen = true;
  }
  const clip = mk("clipPath", { id: "plotclip" });
  clip.appendChild(mk("rect", { x: PADL, y: PADT, width: W - PADL - PADR, height: H - PADT - PADB }));
  svg.appendChild(clip);
  svg.appendChild(mk("path", { d, fill: "none", stroke: cInk, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "clip-path": "url(#plotclip)" }));

  for (const r of realRoots) {
    if (r < lo || r > hi) continue;
    svg.appendChild(mk("line", { x1: sx(r), y1: sy(0), x2: sx(r), y2: H - PADB, stroke: cAcc, "stroke-width": 1, "stroke-dasharray": "3 3", opacity: .55 }));
    svg.appendChild(mk("circle", { cx: sx(r), cy: sy(0), r: 4.5, fill: cAcc, stroke: css.getPropertyValue("--panel").trim() || "#fff", "stroke-width": 1.6 }));
  }

  const wrap = el("div", "plotwrap");
  wrap.appendChild(svg);
  const cap = el("div", "plotcap",
    realRoots.length
      ? `f(${v}) plotted over [${fmtNum(lo, 3)}, ${fmtNum(hi, 3)}]. Marked points are the real root${realRoots.length === 1 ? "" : "s"} — where the curve meets the axis.`
      : `f(${v}) plotted over [${fmtNum(lo, 3)}, ${fmtNum(hi, 3)}]. The curve does not meet the axis: there are no real roots.`);
  wrap.appendChild(cap);
  return wrap;
}

/* ------------------------------------------------------------------ export */
function buildMarkdown(res){
  if (!res) return "";
  const L = [];
  const stamp = new Date().toLocaleString();
  L.push(`# Equation Solver — Worked Solution`, "");
  L.push(`**Problem:** \`${res.input.replace(/\n/g, " ; ")}\``);
  L.push(`**Classification:** ${classify(res)}`);
  L.push(`**Generated:** ${stamp}`, "");
  L.push(`## Result`, "");
  L.push(...answerLines(res));
  L.push("", `## Step-by-step derivation`, "");
  res.steps.forEach((s, i) => {
    L.push(`**${i + 1}. ${s.head}**`, "");
    if (s.why) L.push(texToPlain(s.why.replace(/\\\(|\\\)/g, "")), "");
    if (s.tex) L.push("```", texToPlain(s.tex), "```", "");
  });
  const ver = verificationLines(res);
  if (ver.length) { L.push(`## Verification`, "", ...ver, ""); }
  L.push("---", `Produced by Equation Solver. Exact arithmetic over the rationals; surd and complex forms preserved.`);
  return L.join("\n");
}
function answerLines(res){
  const L = [];
  if (res.kind === "value") { L.push(`- \`${res.input}\` = **${res.exact ? res.exact.toString() : fmtNum(res.value, 12)}**${res.exact && !res.exact.isInt() ? ` ≈ ${fmtNum(res.exact.num(), 10)}` : ""}`); return L; }
  if (res.kind === "identity" || res.kind === "identity-num") { L.push("- Identity — true for every value of the unknown."); return L; }
  if (res.kind === "none" || res.kind === "false-num" || res.kind === "system-none") { L.push("- No solution."); return L; }
  if (res.kind === "system-many") { L.push("- Infinitely many solutions."); return L; }
