  if (res.kind === "system") { for (const s of res.solution) L.push(`- **${s.v} = ${s.val.toString()}**${s.val.isInt() ? "" : ` ≈ ${fmtNum(s.val.num(), 10)}`}`); return L; }
  if (res.kind === "numeric") {
    if (!res.numericRoots.length) L.push("- No real root found in the scanned window.");
    res.numericRoots.forEach((x, i) => L.push(`- **${res.variable}${i + 1} ≈ ${fmtNum(x, 10)}** (numerical)`));
    return L;
  }
  const multMap = new Map();
  if (res.mults) for (const m of res.mults) multMap.set(m.root, m.mult);
  (res.roots || []).forEach((r, i) => {
    const mult = multMap.get(r) || (res.repeated ? 2 : 1);
    const extras = [];
    if (!r.isRational() && !r.imag) extras.push(`≈ ${fmtNum(r.num(), 10)}`);
    if (mult > 1) extras.push(`multiplicity ${mult}`);
    L.push(`- **${res.variable}${i + 1} = ${r.plain()}**${extras.length ? ` (${extras.join(", ")})` : ""}`);
  });
  if (res.numericExtra) res.numericExtra.forEach((x, i) =>
    L.push(`- **${res.variable}${(res.roots || []).length + i + 1} ≈ ${fmtNum(x, 10)}** (numerical)`));
  return L;
}
function verificationLines(res){
  const table = buildVerification(res);
  if (!table) return [];
  const L = [];
  const heads = [...table.querySelectorAll("thead th")].map((t) => t.textContent || " ");
  L.push(`| ${heads.join(" | ")} |`);
  L.push(`| ${heads.map(() => "---").join(" | ")} |`);
  for (const tr of table.querySelectorAll("tbody tr")) {
    L.push(`| ${[...tr.children].map((td) => td.textContent.trim()).join(" | ")} |`);
  }
  return L;
}
function download(name, text, mime){
  const blob = new Blob([text], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function flash(btn, msg){
  const orig = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1300);
}
function slug(res){
  return (res && res.input ? res.input : "solution")
    .replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40).toLowerCase() || "solution";
}

/* ------------------------------------------------------------------- shell */
function showError(e, src){
  out.innerHTML = "";
  const box = el("div", "error");
  box.appendChild(el("strong", "", "Cannot parse input"));
  const d = el("div", "detail");
  d.textContent = e.message;
  box.appendChild(d);
  if (e.pos >= 0 && src) {
    const caret = el("span", "caret");
    caret.textContent = "\n" + src + "\n" + " ".repeat(Math.max(0, e.pos)) + "^";
    d.appendChild(caret);
  }
  out.appendChild(box);
  lastResult = null;
}

function run(){
  const src = $("#eq").value;
  if (!src.trim()) { showEmpty(); return; }
  try {
    const res = solve(src);
    render(res);
    try { history.replaceState(null, "", "#" + encodeURIComponent(src)); } catch (_) {}
  } catch (e) {
    if (e instanceof MathError) showError(e, src.split("\n")[0]);
    else { showError(new MathError(e.message || "Unexpected error."), src); }
  }
}
function showEmpty(){
  out.innerHTML = "";
  const e = el("div", "empty");
  e.textContent = "Enter an equation above. Linear, quadratic, and higher-degree polynomials are solved exactly; transcendental equations numerically; two- to four-variable linear systems by elimination.";
  out.appendChild(e);
}

const EXAMPLES = [
  "2x^2 - 5x - 3 = 0",
  "3(x - 4) + 7 = 2x + 1",
  "x^2 + 2x + 5 = 0",
  "x^3 - 6x^2 + 11x - 6 = 0",
  "x^4 - 5x^2 + 4 = 0",
  "(x+1)/2 - (2x-3)/5 = 1",
  "2x + 3y = 12; x - y = 1",
  "x + y + z = 6; 2x - y + z = 3; x + 2y - z = 2",
  "cos(x) = x",
  "2^x = 10",
  "x^2 = 7",
  "(3/4 + 5/6) * 2^3"
];

function init(){
  const chips = $("#chips");
  for (const ex of EXAMPLES) {
    const b = el("button", "chip", ex);
    b.type = "button";
    b.addEventListener("click", () => { $("#eq").value = ex; run(); $("#eq").focus(); });
    chips.appendChild(b);
  }
  $("#solve").addEventListener("click", run);
  $("#eq").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });

  $("#copy").addEventListener("click", (e) => {
    if (!lastResult) return flash(e.currentTarget, "Nothing to copy");
    const md = buildMarkdown(lastResult);
    (navigator.clipboard ? navigator.clipboard.writeText(md) : Promise.reject())
      .then(() => flash(e.currentTarget, "Copied ✓"))
      .catch(() => {
        const ta = document.createElement("textarea");
        ta.value = md; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); flash(e.currentTarget, "Copied ✓"); }
        catch (_) { flash(e.currentTarget, "Copy failed"); }
        document.body.removeChild(ta);
      });
  });
  $("#dl-md").addEventListener("click", (e) => {
    if (!lastResult) return flash(e.currentTarget, "Nothing to export");
    download(`${slug(lastResult)}.md`, buildMarkdown(lastResult), "text/markdown");
  });
  $("#dl-txt").addEventListener("click", (e) => {
    if (!lastResult) return flash(e.currentTarget, "Nothing to export");
    const txt = buildMarkdown(lastResult).replace(/^#+ /gm, "").replace(/\*\*/g, "").replace(/```/g, "");
    download(`${slug(lastResult)}.txt`, txt, "text/plain");
  });
  $("#print").addEventListener("click", () => window.print());

  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash) { $("#eq").value = hash; }
  else { $("#eq").value = "2x^2 - 5x - 3 = 0"; }

  const start = () => { katexReady = !!window.katex; if (!katexReady) $("#engine-note").textContent = "Plain-text math mode"; run(); };
  if (window.katex) start();
  else {
    // KaTeX may still be loading, or blocked entirely — either way, render.
    let done = false;
    const go = () => { if (!done) { done = true; start(); } };
    window.addEventListener("load", go);
    setTimeout(go, 1800);
  }
  $("#eq").focus();
  $("#eq").select();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
